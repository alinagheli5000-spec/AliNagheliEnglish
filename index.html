const S = {
  student: null,
  admin: false,
  grade: null,
  lesson: null,
  quiz: null,

  level: 1,
  progress: {},
  achievements: [],
  exams: [],

};

// ============================================================
//  DB OPERATIONS
// ============================================================
async function loadStudentStats() {
  if (!S.student) return;
  try {
    const r = await db.from('student_xp').select('xp,level').eq('student_id', S.student.id).maybeSingle();
    if (r.data) { S.xp = Number(r.data.xp || 0); S.level = Number(r.data.level || calcLevel(S.xp)); }
  } catch (e) {}
  try {
    const r = await db.from('student_progress').select('lesson_id,progress,completed').eq('student_id', S.student.id);
    (r.data || []).forEach(x => S.progress[x.lesson_id] = { progress: Number(x.progress || 0), completed: Boolean(x.completed) });
  } catch (e) {}
  try {
    const r = await db.from('student_achievements').select('achievement_key,title').eq('student_id', S.student.id);
    S.achievements = r.data || [];
  } catch (e) {}
  try {
    const r = await db.from('exam_results').select('*').eq('user_id', S.student.auth_user_id).order('created_at', { ascending: false });
    S.exams = r.data || [];
  } catch (e) {}
}

async function addXP(amount) {
  if (!S.student) return;
  const old = S.xp;
  S.xp += Number(amount || 0);
  S.level = calcLevel(S.xp);
  try {
    await db.from('student_xp').upsert({ student_id: S.student.id, xp: S.xp, level: S.level, updated_at: new Date().toISOString() }, { onConflict: 'student_id' });
  } catch (e) {}
  if (S.level > calcLevel(old)) await unlockAchievement('level_' + S.level, 'رسیدن به Level ' + S.level);
}

async function unlockAchievement(key, title) {
  if (!S.student || S.achievements.some(x => x.achievement_key === key)) return;
  try {
    const r = await db.from('student_achievements').insert({ student_id: S.student.id, achievement_key: key, title });
    if (!r.error) S.achievements.push({ achievement_key: key, title });
  } catch (e) {}
}

async function saveProgress(lessonId, progress, completed) {
  if (!S.student) return;
  S.progress[lessonId] = { progress, completed };
  try {
    await db.from('student_progress').upsert({ student_id: S.student.id, lesson_id: lessonId, progress, completed, completed_at: completed ? new Date().toISOString() : null }, { onConflict: 'student_id,lesson_id' });
  } catch (e) {}
}

// ---- QUIZ ENGINE ----
function makeLessonQuestions() {
  const no = S.lesson + 1;
  const arr = [];
  const ws = WORDS[no] || [];
  ws.forEach((w, i) => {
    const pool = shuffle(ws.filter((_, j) => j !== i).map(x => x[1])).slice(0, 3);
    const opts = shuffle([w[1], ...pool]);
    arr.push({ q: 'معنی "' + w[0] + '" چیست؟', options: opts, answer: opts.indexOf(w[1]) });
  });
  (GRAMMAR[no] || []).forEach(g => {
    const opts = shuffle([g[1], 'She are a student.', 'They is happy.', 'He am a teacher.']);
    arr.push({ q: 'کدام گزینه با مبحث «' + g[0] + '» هماهنگ است؟', options: opts, answer: opts.indexOf(g[1]) });
  });
  return arr.slice(0, 15);
}

function startLessonQuiz() {
  S.quiz = {
    type: 'lesson',
    title: 'پایه ' + S.grade + ' - ' + BOOKS[S.grade].lessons[S.lesson],
    questions: makeLessonQuestions(),
    i: 0,
    correct: 0,
    wrong: 0
  };
  quizRender('lessonQuiz');
}

function quizRender(id) {
  const q = S.quiz.questions[S.quiz.i];
  if (!q) { quizFinish(id); return; }
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = `
    <div class="card">
      <b>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>
      <div class="progress"><i style="width:${(S.quiz.i/S.quiz.questions.length)*100}%"></i></div>
      <div style="font-size:18px;font-weight:bold;line-height:2;margin:15px 0">${esc(q.q)}</div>
      ${q.options.map((x, i) => `<button class="option" onclick="answerQuiz(${i},'${id}')">${esc(x)}</button>`).join('')}
      <div id="fb"></div>
    </div>
  `;
}

function answerQuiz(i, id) {
  const q = S.quiz.questions[S.quiz.i];
  const opts = document.querySelectorAll('.option');
  opts.forEach(x => x.disabled = true);
  if (i === q.answer) {
    S.quiz.correct++;
    opts[i].classList.add('correct');
    document.getElementById('fb').className = 'feedback ok';
    document.getElementById('fb').innerHTML = '✅ 😊 آفرین! پاسخ درست است.';
  } else {
    S.quiz.wrong++;
    opts[i].classList.add('wrong');
    opts[q.answer].classList.add('correct');
    document.getElementById('fb').className = 'feedback bad';
    document.getElementById('fb').innerHTML = '❌ پاسخ اشتباه است.';
  }
  setTimeout(() => { S.quiz.i++; quizRender(id); }, 700);
}

async function quizFinish(id) {
  const total = S.quiz.questions.length;
  const percent = total ? Math.round((S.quiz.correct / total) * 100) : 0;
  if (S.student) {
    try {
      await db.from('exam_results').insert({
        user_id: S.student.auth_user_id,
        student_name: (S.student.first_name || '') + ' ' + (S.student.last_name || ''),
        exam_type: S.quiz.type,
        exam_title: S.quiz.title,
        lesson: S.lesson + 1 || null,
        score: S.quiz.correct,
        total: total,
        percentage: percent
      });
    } catch (e) {}
    await addXP(Math.max(10, percent));
    if (percent >= 80) await unlockAchievement('exam_80', 'امتیاز بالای ۸۰٪');
    if (percent === 100) await unlockAchievement('perfect_exam', 'آزمون کامل');
    if (S.quiz.type === 'lesson') await saveProgress(S.grade + '-' + S.lesson, 100, true);
  }
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = `
    <div class="card">
      <div class="score">${percent}%</div>
      <h2 style="text-align:center">آزمون تمام شد 🎉</h2>
      <p style="text-align:center">${S.quiz.correct} پاسخ درست از ${total}</p>
      <button class="btn full" onclick="profile()">مشاهده پیشرفت</button>
    </div>
  `;
}

function startContest(g) {
  let q = [];
  for (let i = 1; i <= 8; i++) {
    (WORDS[i] || []).forEach((w, j) => {
      if (q.length >= 20) return;
      const pool = shuffle((WORDS[i] || []).filter((_, k) => k !== j).map(x => x[1])).slice(0, 3);
      const options = shuffle([w[1], ...pool]);
      q.push({ q: 'معنی "' + w[0] + '" چیست؟', options, answer: options.indexOf(w[1]) });
    });
  }
  while (q.length < 20) {
    const base = [{ q: 'Which sentence is correct?', a: 'She is a student.' }, { q: 'Which sentence is correct?', a: 'They are happy.' }, { q: 'Which sentence is correct?', a: 'I am a teacher.' }, { q: 'Which sentence is correct?', a: 'He is my friend.' }][q.length % 4];
    const options = shuffle([base.a, 'She are a student.', 'They is happy.', 'I is a teacher.']);
    q.push({ q: base.q, options, answer: options.indexOf(base.a) });
  }
  S.quiz = { type: 'contest', title: 'مسابقه پایه ' + g, questions: q.slice(0, 20), i: 0, correct: 0, wrong: 0 };
  render('مسابقه', `<div id="contestQuiz"></div>`);
  quizRender('contestQuiz');
}

    <div class="card"><h3>📝 سوابق آزمون‌ها</h3>
      ${exams.length ? exams.map(e => `
        <div class="examRow">
          <b>${esc(e.exam_title || e.exam_type || 'آزمون')}</b>
          <div class="muted">${e.created_at ? new Date(e.created_at).toLocaleDateString('fa-IR') : ''}</div>
          <div class="examScore">${e.percentage ?? (e.total ? Math.round((e.score / e.total) * 100) : 0)}٪</div>
          <div class="muted">${e.score ?? '-'} از ${e.total ?? '-'} پاسخ درست</div>
        </div>
      `).join('') : '<p class="muted">هنوز آزمونی ثبت نشده است.</p>'}
    </div>
    <div class="card"><h3>🏆 دستاوردها</h3>
      ${S.achievements.length ? S.achievements.map(a => `<span class="badge">🏆 ${esc(a.title)}</span>`).join('') : '<p class="muted">هنوز دستاوردی کسب نکرده‌ای.</p>'}
    </div>
  `);
}

// ============================================================
//  AUTH
// ============================================================
function login() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login">
      <div class="loginCard">
        <div style="text-align:center">
          <div style="font-size:55px">📚</div>
          <h2>AliNagheli English</h2>
          <p class="muted">سامانه آموزش زبان انگلیسی</p>
        </div>
        <div class="tabs">
          <button id="st" class="tab active" onclick="loginTab('student')">🎓 زبان‌آموز</button>
          <button id="ad" class="tab" onclick="loginTab('admin')">👨‍💼 مدیر</button>
        </div>
        <div id="lf"></div>
      </div>
    </div>
  `;
  loginTab('student');
}

function loginTab(type) {
  document.getElementById('st').classList.toggle('active', type === 'student');
  document.getElementById('ad').classList.toggle('active', type === 'admin');
  document.getElementById('lf').innerHTML = type === 'admin' ? `
    <label>ایمیل مدیر</label>
    <input id="email" type="email" value="alinagheli@gmail.com">
    <label>رمز عبور</label>
    <input id="pass" type="password">
    <button class="btn full" onclick="adminLogin()">ورود مدیر</button>
  ` : `
    <label>شماره تلفن</label>
    <input id="phone" inputmode="tel" placeholder="شماره تلفن">
    <label>رمز عبور</label>
    <input id="pass" type="password">
    <button class="btn full" onclick="studentLogin()">ورود زبان‌آموز</button>
    <button class="btn secondary full" style="margin-top:8px" onclick="registerForm()">ثبت‌نام زبان‌آموز جدید</button>
  `;
}

async function studentLogin() {
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('pass').value;
  if (!phone || !password) { toast('شماره تلفن و رمز عبور را وارد کنید.', 'warning'); return; }
  try {
    const result = await accessFunction({ action: 'find', phone });
    const student = result.student;
    const email = result.email;
    if (!student) throw new Error('زبان‌آموزی با این شماره پیدا نشد.');
    if (student.status === 'rejected') throw new Error('ثبت‌نام شما توسط مدیر رد شده است.');
    if (!['registered', 'approved'].includes(student.status)) throw new Error('ثبت‌نام شما هنوز توسط مدیر تأیید نشده است.');
    if (!email) throw new Error('ایمیل ورود زبان‌آموز پیدا نشد.');
    const auth = await db.auth.signInWithPassword({ email: String(email).trim(), password });
    if (auth.error) throw new Error('رمز عبور صحیح نیست.');
    S.student = student;
    S.admin = false;
    await loadStudentStats();
    toast('خوش آمدید! 👋', 'success');
    home();
  } catch (e) {
    toast(e?.message || 'ورود ناموفق بود.', 'error');
  }
}

async function adminLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pass').value;
  if (email.toLowerCase() !== 'alinagheli@gmail.com') { toast('ایمیل مدیر صحیح نیست.', 'error'); return; }
  if (!password) { toast('رمز عبور را وارد کنید.', 'warning'); return; }
  try {
    const r = await db.auth.signInWithPassword({ email: 'alinagheli@gmail.com', password });
    if (r.error) throw r.error;
    S.admin = true;
    S.student = null;
    toast('ورود مدیر موفق ✅', 'success');
    admin();
  } catch (e) {
    toast('ورود مدیر ناموفق بود: ' + e.message, 'error');
  }
}

function registerForm() {
  document.getElementById('lf').innerHTML = `
    <h3>ثبت‌نام زبان‌آموز جدید</h3>
    <label>نام</label><input id="rf">
    <label>نام خانوادگی</label><input id="rl">
    <label>شماره تلفن</label><input id="rp" inputmode="tel">
    <label>رمز عبور</label><input id="rpass" type="password">
    <label>پایه / سطح</label>
    <select id="rlevel">
      <option value="">انتخاب پایه</option>
      <option value="7">پایه هفتم</option><option value="8">پایه هشتم</option>
      <option value="9">پایه نهم</option><option value="10">پایه دهم</option>
      <option value="11">پایه یازدهم</option><option value="12">پایه دوازدهم</option>
    </select>
    <button class="btn full" onclick="register()">ثبت‌نام</button>
    <button class="btn secondary full" style="margin-top:8px" onclick="login()">بازگشت</button>
  `;
}

async function register() {
  const first = document.getElementById('rf').value.trim();
  const last = document.getElementById('rl').value.trim();
  const phone = document.getElementById('rp').value.trim();
  const password = document.getElementById('rpass').value;
  const level = document.getElementById('rlevel').value;
  if (!first || !last || !phone || !password || !level) { toast('همه موارد را تکمیل کنید.', 'warning'); return; }
  if (password.length < 6) { toast('رمز عبور باید حداقل ۶ کاراکتر باشد.', 'warning'); return; }
  const digits = normalizePhone(phone);
  if (digits.length < 10) { toast('شماره تلفن معتبر نیست.', 'warning'); return; }
  const email = digits + '@alinagheli.com';
  try {
    const r = await db.auth.signUp({
      email, password,
      options: { data: { first_name: first, last_name: last, phone, level } }
    });
    if (r.error) throw r.error;
    if (!r.data.user) throw new Error('حساب کاربری ساخته نشد.');
    await accessFunction({
      action: 'register',
      first_name: first,
      last_name: last,
      phone,
      level,
      auth_user_id: r.data.user.id,
      email
    });
    await db.auth.signOut();
    toast('ثبت‌نام با موفقیت انجام شد.\nپس از تأیید مدیر می‌توانید وارد شوید.', 'success');
    login();
  } catch (e) {
    try { await db.auth.signOut(); } catch (_) {}
    toast('ثبت‌نام انجام نشد: ' + (e?.message || 'خطای نامشخص'), 'error');
  }
}

// ============================================================
//  ADMIN
// ============================================================
async function admin() {
  try {
    const r = await db.from('students').select('*').order('id', { ascending: false });
    if (r.error) throw r.error;
    const req = await db.from('teacher_requests').select('*').order('created_at', { ascending: false });
    renderAdmin(r.data || [], req.data || []);
  } catch (e) {
    document.body.innerHTML = `<div class="container"><div class="card"><h2>خطا در پنل مدیر</h2><p>${esc(e.message)}</p><button class="btn" onclick="admin()">تلاش مجدد</button></div></div>`;
  }
}

function renderAdmin(students, requests) {
  render('پنل مدیریت', `
    <div class="hero"><h2>👨‍💼 پنل مدیریت</h2><p>مدیریت زبان‌آموزان و درخواست‌های کلاس</p></div>
    <div class="grid">
      <div class="item"><div class="icon">👥</div><h3>کل</h3><b>${students.length}</b></div>
      <div class="item"><div class="icon">⏳</div><h3>در انتظار</h3><b>${students.filter(x => x.status === 'waiting').length}</b></div>
      <div class="item"><div class="icon">✅</div><h3>تأیید شده</h3><b>${students.filter(x => ['registered','approved'].includes(x.status)).length}</b></div>
      <div class="item"><div class="icon">📅</div><h3>درخواست کلاس</h3><b>${requests.filter(x => x.status === 'pending').length}</b></div>
    </div>
    <div class="card"><h3>📅 درخواست‌های رزرو کلاس</h3>
      ${requests.length ? requests.map(x => `
        <div class="adminRow">
          <b>${esc(x.student_name || '')}</b>
          <div class="muted">📱 ${esc(x.student_phone || '')}<br>👨‍🏫 استاد: ${esc(x.teacher_name || '')}<br>📅 ${esc(x.requested_date || '')} ⏰ ${esc(x.requested_time || '')}<br>📘 ${esc(x.class_type || '')}<br>📝 ${esc(x.note || '')}</div>
          <div style="margin-top:10px">
            ${x.status === 'pending' ? `
              <button class="btn success" onclick="respondRequest('${x.id}','approved')">✅ تأیید</button>
              <button class="btn danger" onclick="respondRequest('${x.id}','rejected')">❌ رد</button>
            ` : `<b>${x.status === 'approved' ? '✅ تأیید شده' : '❌ رد شده'}</b>`}
          </div>
        </div>
      `).join('') : '<p class="muted">درخواستی وجود ندارد.</p>'}
    </div>
    <div class="card"><h3>👥 ثبت‌نام‌ها</h3>
      ${students.length ? students.map(x => `
        <div class="adminRow">
          <b>${esc(x.first_name)} ${esc(x.last_name)}</b>
          <div class="muted">📱 ${esc(x.phone || '')}<br>🎓 پایه: ${esc(x.level || '-')}<br>✉️ ${esc(x.login_email || '-')}</div>
          <div style="margin-top:10px">
            ${x.status === 'waiting' ? `
              <button class="btn success" onclick="approveStudent('${x.id}')">✅ تأیید</button>
              <button class="btn danger" onclick="rejectStudent('${x.id}')">❌ رد</button>
            ` : x.status === 'registered' || x.status === 'approved' ? `
              <span>✅ تأیید شده</span>
              <button class="btn danger" onclick="rejectStudent('${x.id}')">رد / حذف</button>
            ` : `<span>❌ رد شده</span><button class="btn success" onclick="approveStudent('${x.id}')">تأیید مجدد</button>`}
          </div>
        </div>
      `).join('') : '<p class="muted">ثبت‌نامی وجود ندارد.</p>'}
    </div>
  `);
}

async function respondRequest(id, status) {
  try {
    const r = await db.from('teacher_requests').update({ status }).eq('id', id);
    if (r.error) throw r.error;
    toast('وضعیت درخواست تغییر کرد.', 'success');
    admin();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function approveStudent(id) {
  try {
    const r = await db.from('students').update({ status: 'registered' }).eq('id', id);
    if (r.error) throw r.error;
    toast('زبان‌آموز تأیید شد ✅', 'success');
    admin();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function rejectStudent(id) {
  try {
    const r = await db.from('students').update({ status: 'rejected' }).eq('id', id);
    if (r.error) throw r.error;
    toast('زبان‌آموز رد شد.', 'warning');
    admin();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

// ============================================================
//  LOGOUT
// ============================================================
async function logout() {
  try { await db.auth.signOut(); } catch (e) {}
  S.student = null;
  S.admin = false;
  S.grade = null;
  S.lesson = null;
  S.quiz = null;
  S.xp = 0;
  S.level = 1;
  S.progress = {};
  S.achievements = [];
  S.exams = [];
  toast('خارج شدید.', 'info');
  login();
}

// ============================================================
//  AUTH STATE
// ============================================================
db.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT' && !S.admin && !S.student) login();
});

// ============================================================
//  STARTUP
// ============================================================
async function startup() {
  if (S.darkMode) document.body.classList.add('dark');
  try {
    const r = await db.auth.getSession();
    const session = r.data?.session;
    if (!session) { login(); return; }
    const user = session.user;
    if ((user.email || '').toLowerCase() === 'alinagheli@gmail.com') {
      S.admin = true;
      admin();
      return;
    }
    const st = await db.from('students').select('*').eq('auth_user_id', user.id).maybeSingle();
    if (st.data && ['registered', 'approved'].includes(st.data.status)) {
      S.student = st.data;
      await loadStudentStats();
      home();
      return;
    }
    await db.auth.signOut();
    login();
  } catch (e) {
    try { await db.auth.signOut(); } catch (_) {}
    login();
  }
}

// Override answer for placement
const originalAnswer = answerQuiz;
answerQuiz = function(i, id) {
  if (S.quiz?.type === 'placement') {
    const q = S.quiz.questions[S.quiz.i];
    const opts = document.querySelectorAll('.option');
    opts.forEach(x => x.disabled = true);
    if (i === q.answer) { S.quiz.correct++; opts[i].classList.add('correct'); } else { S.quiz.wrong++; opts[i].classList.add('wrong'); opts[q.answer].classList.add('correct'); }
    setTimeout(async () => {
      S.quiz.i++;
      if (S.quiz.i >= S.quiz.questions.length) await placementFinish();
      else quizRender('placementQuiz');
    }, 650);
    return;
  }
  originalAnswer(i, id);
};

startup();
</script>
