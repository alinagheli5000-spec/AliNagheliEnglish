/* =========================================================
   XP
========================================================= */

function xpForLevel(level){
return (level-1)*100;
}

function calculateLevel(xp){
return Math.max(
1,
Math.floor(Number(xp||0)/100)+1
);
}

async function loadStudentStats(){

if(!S.student)return;

S.xp=0;
S.level=1;
S.progress={};
S.achievements=[];

try{

const xp=await db
.from("student_xp")
.select("xp,level")
.eq("student_id",S.student.id)
.maybeSingle();

if(xp.data){
S.xp=Number(xp.data.xp||0);
S.level=Number(
xp.data.level||
calculateLevel(S.xp)
);
}

}catch(e){}

try{

const p=await db
.from("student_progress")
.select("lesson_id,progress,completed")
.eq("student_id",S.student.id);

if(p.data){
p.data.forEach(x=>{
S.progress[x.lesson_id]={
progress:Number(x.progress||0),
completed:Boolean(x.completed)
};
});
}

}catch(e){}

try{

const a=await db
.from("student_achievements")
.select("achievement_key,title")
.eq("student_id",S.student.id);

if(a.data){
S.achievements=a.data;
}

}catch(e){}
}

async function addXP(amount,reason=""){

if(!S.student)return;

const oldLevel=calculateLevel(S.xp);
const newXP=S.xp+Number(amount||0);
const newLevel=calculateLevel(newXP);

S.xp=newXP;
S.level=newLevel;

try{

await db
.from("student_xp")
.upsert({
student_id:S.student.id,
xp:newXP,
level:newLevel,
updated_at:new Date().toISOString()
},{
onConflict:"student_id"
});

}catch(e){}

if(newLevel>oldLevel){

await unlockAchievement(
"level_"+newLevel,
"رسیدن به Level "+newLevel
);

}
}

async function unlockAchievement(key,title){

if(!S.student)return;

if(
S.achievements.some(
x=>x.achievement_key===key
)
)return;

try{

const r=await db
.from("student_achievements")
.insert({
student_id:S.student.id,
achievement_key:key,
title
});

if(!r.error){

S.achievements.push({
achievement_key:key,
title
});

}

}catch(e){}
}

}catch(e){}
}

async function studentLogin(){

const phoneEl=document.getElementById("phone");
const passEl=document.getElementById("pass");

if(!phoneEl||!passEl)return;

const phone=phoneEl.value.trim();
const password=passEl.value;

if(!phone||!password){

alert(
"شماره تلفن و رمز عبور را وارد کنید."
);

return;
}

try{

const result=await accessFunction({
action:"find",
phone:normalizePhone(phone)
});

const student=result?.student;
const email=result?.email;

if(!student)
throw new Error(
"زبان‌آموزی با این شماره پیدا نشد."
);

if(student.status==="rejected")
throw new Error(
"ثبت‌نام شما توسط مدیر رد شده است."
);

if(
student.status!=="registered" &&
student.status!=="approved"
)
throw new Error(
"ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
);

if(!email)
throw new Error(
"ایمیل ورود زبان‌آموز پیدا نشد."
);

const auth=
await db.auth.signInWithPassword({
email:String(email).trim(),
password
});

if(auth.error)
throw new Error(
"رمز عبور صحیح نیست."
);

S.student=student;
S.admin=false;

await loadStudentStats();

home();

}catch(e){

alert(
e?.message||
"ورود ناموفق بود."
);

}
}

/* =========================================================
   QUIZ DATA
========================================================= */

function createQuestion(
q,
options,
answer
){

const shuffled=shuffle(
options.map((text,index)=>({
text,
isCorrect:index===answer
}))
);

return{
q,
options:shuffled.map(x=>x.text),
answer:shuffled.findIndex(
x=>x.isCorrect
)
};

}

/* =========================================================
   LESSON QUIZ
========================================================= */

function makeLessonQuestions(){

const no=S.lesson+1;
let arr=[];

const a=words[no]||[];

a.forEach((w,i)=>{

if(a.length>=3){

arr.push(
createQuestion(
`معنی "${w[0]}" چیست؟`,
[
w[1],
a[(i+1)%a.length][1],
a[(i+2)%a.length][1]
],
0
)
);

}

});

(grammar[no]||[]).forEach(g=>{

arr.push(
createQuestion(
`کدام گزینه با ${g[0]} هماهنگ است؟`,
[
g[1],
"She are student.",
"They is happy."
],
0
)
);

});

return shuffle(arr).slice(0,15);
}

S.quiz={

quizRender("lessonQuiz");

/* =========================================================
   QUIZ ANSWER
========================================================= */

function answer(i,id){

if(!S.quiz)return;

if(S.quiz.answered)return;

S.quiz.answered=true;

const q=
S.quiz.questions[S.quiz.i];

const opts=
document.querySelectorAll(
"#"+CSS.escape(id)+" .option"
);

opts.forEach(x=>{
x.disabled=true;
});

const feedback=
document.getElementById("fb");

if(i===q.answer){

S.quiz.correct++;

if(opts[i]){
opts[i].classList.add("correct");
}

if(feedback){

feedback.className=
"feedback ok";

feedback.innerHTML=
"✅ 😊 آفرین! پاسخ درست است.";

}

}else{

S.quiz.wrong++;

if(opts[i]){
opts[i].classList.add("wrong");
}

if(opts[q.answer]){
opts[q.answer].classList.add("correct");
}

if(feedback){

feedback.className=
"feedback bad";

feedback.innerHTML=
"❌ 😢 پاسخ اشتباه است.";

}

}

setTimeout(()=>{

if(!S.quiz)return;

S.quiz.i++;
S.quiz.answered=false;

quizRender(id);

},900);

}

function conversationQuiz(book,unit){

const name=
conversationBooks[book];

const q=[
["What is the meaning of conversation?","گفت‌وگو"],
["What is the meaning of question?","سؤال"],
["What is the meaning of answer?","پاسخ"],
["What is the meaning of practice?","تمرین"],
["What is the meaning of language?","زبان"],
["What is the meaning of class?","کلاس"],
["What is the meaning of student?","دانش‌آموز"],
["What is the meaning of teacher?","معلم"],
["What is the meaning of friend?","دوست"],
["What is the meaning of information?","اطلاعات"]
];

let arr=q.map((x,i)=>{

const others=[
x[1],
q[(i+1)%q.length][1],
q[(i+2)%q.length][1]
];

return createQuestion(
x[0],
others,
0
);

});

arr=shuffle(arr);

S.quiz={
type:"conversation",
title:name+" Unit "+(unit+1),
questions:arr,
i:0,
correct:0,
wrong:0,
answered:false
};

render(
"آزمون مکالمه",
`<div id="conversationQuiz"></div>`
);

quizRender("conversationQuiz");

}

function startContest(g){

let q=[];

for(let i=1;i<=8;i++){

(words[i]||[]).forEach((w,j)=>{

if(q.length<20){

const arr=
words[i]||[];

if(arr.length>=3){

q.push(
createQuestion(
`معنی "${w[0]}" چیست؟`,
[
w[1],
arr[(j+1)%arr.length][1],
arr[(j+2)%arr.length][1]
],
0
)
);

}

}

});

}

while(q.length<20){

const n=q.length+1;

q.push(
createQuestion(
`سؤال ${n}: کدام گزینه صحیح است؟`,
[
"English",
"School",
"Teacher"
],
0
)
);

}

q=shuffle(q.slice(0,20));

S.quiz={
type:"contest",
title:"مسابقه پایه "+g,
questions:q,
i:0,
correct:0,
wrong:0,
answered:false
};

render(
"مسابقه",
`<div id="contestQuiz"></div>`
);

quizRender("contestQuiz");

}

async function approve(id){

await db
.from("students")
.update({
status:"registered"
})
.eq("id",id);

if(r.error)throw r.error;

admin();

}catch(e){

alert(
"خطا در تأیید:\n"+
e.message
);

}

}

async function rejectStudent(id){

try{

const r=
await db
.from("students")
.update({
status:"rejected"
})
.eq("id",id);

if(r.error)throw r.error;

admin();

}catch(e){

alert(
"خطا در رد کردن:\n"+
e.message
);

}

}

/* =========================================================
   STARTUP
========================================================= */

async function startup(){

try{

const r=
await db.auth.getSession();

const session=
r.data?.session;

if(!session){

login();
return;

}

const user=
session.user;

if(
(user.email||"").toLowerCase()===
"alinagheli@gmail.com"
){

S.admin=true;

admin();

return;

}

const st=
await db
.from("students")
.select("*")
.eq("auth_user_id",user.id)
.maybeSingle();

if(
st.data &&
(
st.data.status==="registered"||
st.data.status==="approved"
)
){

S.student=st.data;

await loadStudentStats();

home();

return;

}

await db.auth.signOut();

login();

}catch(e){

try{
await db.auth.signOut();
}catch(_){}

login();

}

}

/* =========================================================
   AUTH LISTENER
========================================================= */

db.auth.onAuthStateChange(
(event,session)=>{

if(event==="SIGNED_OUT"){

if(
!S.admin&&
!S.student
){

login();

}

}

}
);

/* =========================================================
   RUN
========================================================= */

startup();
