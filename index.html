.header{

.grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px

/* =========================
XP
========================= */

function xpForLevel(level){return(level-1)*100}
function calculateLevel(xp){return Math.max(1,Math.floor(xp/100)+1)}

async function loadStudentStats(){
if(!S.student)return;
S.xp=0;S.level=1;S.progress={};S.achievements=[];
try{
const xp=await db.from("student_xp").select("xp,level")
.eq("student_id",S.student.id).maybeSingle();
if(xp.data){
S.xp=Number(xp.data.xp||0);
S.level=Number(xp.data.level||calculateLevel(S.xp));
}
}catch(e){}
try{
const p=await db.from("student_progress").select("lesson_id,progress,completed")
.eq("student_id",S.student.id);
if(p.data)p.data.forEach(x=>{
S.progress[x.lesson_id]={progress:Number(x.progress||0),completed:Boolean(x.completed)}
});
}catch(e){}
try{
const a=await db.from("student_achievements").select("achievement_key,title")
.eq("student_id",S.student.id);
if(a.data)S.achievements=a.data;
}catch(e){}
}

async function addXP(amount){
if(!S.student)return;
const old=S.xp,newXP=old+Number(amount||0),newLevel=calculateLevel(newXP);
S.xp=newXP;S.level=newLevel;
try{
await db.from("student_xp").upsert({
student_id:S.student.id,xp:newXP,level:newLevel,
updated_at:new Date().toISOString()
},{onConflict:"student_id"});
}catch(e){}
if(newLevel>calculateLevel(old))
await unlockAchievement("level_"+newLevel,"رسیدن به Level "+newLevel);
}

async function unlockAchievement(key,title){
if(!S.student||S.achievements.some(x=>x.achievement_key===key))return;
try{
const r=await db.from("student_achievements").insert({
student_id:S.student.id,achievement_key:key,title
});
if(!r.error)S.achievements.push({achievement_key:key,title});
}catch(e){}
}

async function saveProgress(lessonId,progress,completed){
if(!S.student)return;
S.progress[lessonId]={progress,completed};
try{
await db.from("student_progress").upsert({
student_id:S.student.id,lesson_id:lessonId,progress,completed,
completed_at:completed?new Date().toISOString():null
},{onConflict:"student_id,lesson_id"});
}catch(e){}
}

function makeLessonQuestions(){
const arr=[];
(words[S.grade]||[]).slice(0,12).forEach((w,i)=>{
const a=words[S.grade];
arr.push({
q:`معنی "${w[0]}" چیست؟`,
options:[w[1],a[(i+1)%a.length][1],a[(i+2)%a.length][1]],
answer:0
});
});
(grammar[S.grade]||[]).slice(0,4).forEach(g=>{
arr.push({
q:`کدام گزینه با مبحث «${g[0]}» هماهنگ است؟`,
options:[g[2],"She are a student.","They is happy."],
answer:0
});
});
return arr.slice(0,15);
}

function startLessonQuiz(){
S.quiz={type:"lesson",title:`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
questions:makeLessonQuestions(),i:0,correct:0,wrong:0};
quizRender("lessonQuiz");
}

function quizRender(id){
const q=S.quiz.questions[S.quiz.i];
if(!q)return quizFinish(id);
const el=document.getElementById(id);if(!el)return;
el.innerHTML=`
<div class="card">
<b>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>
<div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div>
<div style="font-size:18px;font-weight:bold;line-height:2;margin:15px 0">${esc(q.q)}</div>
${q.options.map((x,i)=>`<button class="option" onclick="answer(${i},'${id}')">${esc(x)}</button>`).join("")}
<div id="fb"></div></div>`;
}

function answer(i,id){
const q=S.quiz.questions[S.quiz.i],opts=document.querySelectorAll(".option");
opts.forEach(x=>x.disabled=true);
if(i===q.answer){
S.quiz.correct++;opts[i].classList.add("correct");
document.getElementById("fb").className="feedback ok";
document.getElementById("fb").innerHTML="✅ آفرین! پاسخ درست است.";
}else{
S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");
document.getElementById("fb").className="feedback bad";
document.getElementById("fb").innerHTML="❌ پاسخ اشتباه است.";
}
setTimeout(()=>{S.quiz.i++;quizRender(id)},800);
}

async function quizFinish(id){
const total=S.quiz.questions.length,percent=total?Math.round(S.quiz.correct/total*100):0;
examRecords.push({student:S.student?.phone||"",title:S.quiz.title,score:percent,date:new Date().toISOString()});
saveLocal();
if(S.student){
try{
await db.from("exam_results").insert({
user_id:S.student.auth_user_id,
student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,
exam_type:S.quiz.type||"lesson",exam_title:S.quiz.title,
lesson:S.lesson+1,score:S.quiz.correct,total,percentage:percent
});
}catch(e){}
await addXP(Math.max(10,percent));
if(percent>=80)await unlockAchievement("exam_80","امتیاز بالای ۸۰٪");
if(percent===100)await unlockAchievement("perfect_exam","آزمون کامل");
if(S.quiz.type==="lesson")await saveProgress(`${S.grade}-${S.lesson}`,100,true);
}
const el=document.getElementById(id);if(!el)return;
el.innerHTML=`
<div class="card">
<div class="score">${percent}%</div>
<h2 style="text-align:center">آزمون تمام شد 🎉</h2>
<p style="text-align:center">${S.quiz.correct} پاسخ درست از ${total}</p>
<button class="btn full" onclick="profile()">مشاهده پیشرفت</button>
</div>`;
}
