function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function normalizePhone(x){
 return String(x||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g,"");
}

function saveLocal(){

}

function speak(text){
 if(!window.speechSynthesis){
  alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
  return;
 }
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";
 u.rate=.75;
 speechSynthesis.resume();
 speechSynthesis.speak(u);
}

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

async function accessFunction(payload){
 const r=await fetch(ACCESS_FUNCTION,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "apikey":SUPABASE_KEY
  },
  body:JSON.stringify(payload)
 });
 const data=await r.json().catch(()=>null);
 if(!r.ok||data?.ok===false)throw new Error(data?.error||"خطا در ارتباط با سرور.");
 return data;
}

async function adminFunction(action,payload={}){
 const session=(await db.auth.getSession()).data?.session;
 if(!session)throw new Error("نشست مدیر منقضی شده است.");
 const r=await fetch(ADMIN_FUNCTION,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+session.access_token
  },
  body:JSON.stringify({action,...payload})
 });
 const data=await r.json().catch(()=>null);
 if(!r.ok||!data?.ok)throw new Error(data?.error||"عملیات انجام نشد.");
 return data;
}

["Relative Clauses","who, which, that","The man who lives here is a doctor.","عبارت موصولی درباره یک اسم اطلاعات بیشتری می‌دهد."],
["Word Formation","prefix / suffix","unusual, meaningful, carefully","با افزودن پیشوند یا پسوند می‌توان نقش یا معنای واژه را تغییر داد."]
],

"12-3":[
["Passive Voice","be + past participle","Energy is produced by the sun.","در مجهول تمرکز روی عمل یا نتیجه است، نه انجام‌دهنده عمل."],
["Modal Passive","modal + be + past participle","Energy should be saved.","پس از فعل وجهی در ساخت مجهول از be + V3 استفاده می‌کنیم."],
["Relative Clauses","who, which, that","The planet which we study is Mars.","عبارت موصولی برای اتصال اطلاعات درباره اسم استفاده می‌شود."]
],

"12-4":[
["Second Conditional","If + past simple, would + base verb","If I had more time, I would study nature.","شرط نوع دوم برای موقعیت فرضی یا غیرواقعی در زمان حال یا آینده استفاده می‌شود."],
["Past Perfect","had + past participle","They had left before I arrived.","Past Perfect برای عملی که قبل از عمل دیگری در گذشته اتفاق افتاده است استفاده می‌شود."],
["Question Tags","statement + short question","It is cold, isn’t it?","Question Tag برای گرفتن تأیید یا اطمینان از درستی یک جمله استفاده می‌شود."]
]

async function studentLogin(){
 const phone=normalizePhone(document.getElementById("loginPhone").value);
 const password=document.getElementById("loginPassword").value;

 if(!phone||!password){
  loginMessage("شماره موبایل و رمز عبور را وارد کنید.");
  return;
 }

 try{
  const found=await accessFunction({action:"find",phone});

  if(!found.student){
   loginMessage("زبان‌آموزی با این شماره پیدا نشد.");
   return;
  }

  if(found.student.status!=="registered"){
   loginMessage("حساب شما هنوز توسط مدیر تأیید نشده است.");
   return;
  }

  const email=found.student.login_email||
   `${phone}@alinagheli.com`;

  const r=await db.auth.signInWithPassword({
   email,
   password
  });

  if(r.error)throw r.error;

  S.student=found.student;
  S.admin=false;

  await loadStudentStats();
  home();

 }catch(e){
  loginMessage(e.message||"ورود انجام نشد.");
 }
}

async function adminLogin(){
 const email=document.getElementById("adminEmail").value.trim();
 const password=document.getElementById("adminPassword").value;

 try{
  const r=await db.auth.signInWithPassword({
   email,
   password
  });

  if(r.error)throw r.error;

  const session=r.data.session;
  const check=await fetch(ADMIN_FUNCTION,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+session.access_token
   },
   body:JSON.stringify({action:"list"})
  });

  const data=await check.json().catch(()=>null);

  if(!check.ok||!data?.ok){
   await db.auth.signOut();
   throw new Error("این حساب دسترسی مدیر ندارد.");
  }

  S.admin=true;
  S.student=null;

  renderAdmin(data.students||[],data.requests||[]);

 }catch(e){
  loginMessage(e.message||"ورود مدیر انجام نشد.");
 }
}

/* =========================================================
   PROGRESS / XP
========================================================= */

function calculateLevel(xp){
 return Math.max(1,Math.floor(Number(xp||0)/100)+1);
}

async function loadStudentStats(){
 if(!S.student)return;

 S.xp=0;
 S.level=1;
 S.progress={};
 S.achievements=[];
 S.exams=[];

 try{
  const r=await db.from("student_xp")
   .select("xp,level")
   .eq("student_id",S.student.id)
   .maybeSingle();

  if(r.data){
   S.xp=Number(r.data.xp||0);
   S.level=Number(r.data.level||calculateLevel(S.xp));
  }
 }catch(e){}

 try{
  const r=await db.from("student_progress")
   .select("lesson_id,progress,completed")
   .eq("student_id",S.student.id);

  (r.data||[]).forEach(x=>{
   S.progress[x.lesson_id]={
    progress:Number(x.progress||0),
    completed:Boolean(x.completed)
   };
  });
 }catch(e){}

 try{
  const r=await db.from("student_achievements")
   .select("achievement_key,title")
   .eq("student_id",S.student.id);

  S.achievements=r.data||[];
 }catch(e){}

 try{
  const r=await db.from("exam_results")
   .select("*")
   .eq("user_id",S.student.auth_user_id)
   .order("created_at",{ascending:false});

  S.exams=r.data||[];
 }catch(e){}
}

async function addXP(amount){
 if(!S.student)return;

 S.xp+=Number(amount||0);
 S.level=calculateLevel(S.xp);

 try{
  await db.from("student_xp").upsert({
   student_id:S.student.id,
   xp:S.xp,
   level:S.level,
   updated_at:new Date().toISOString()
  },{onConflict:"student_id"});
 }catch(e){}
}

async function saveProgress(key,progress,completed){
 S.progress[key]={progress,completed};

 if(!S.student)return;

 try{
  await db.from("student_progress").upsert({
   student_id:S.student.id,
   lesson_id:key,
   progress,
   completed
  },{onConflict:"student_id,lesson_id"});
 }catch(e){}
}


/* =========================================================
   LESSON QUIZ
========================================================= */

function makeLessonQuestions(){
 const key=`${S.grade}-${S.lesson+1}`;
 const ws=wordsByGrade[key]||[];
 const gs=grammarByLesson[key]||[];
 const arr=[];

 ws.slice(0,10).forEach((w,i)=>{
  const others=shuffle(
   ws.filter((_,j)=>j!==i).map(x=>x[1])
  ).slice(0,3);

  const opts=shuffle([w[1],...others]);

  arr.push({
   q:`معنی "${w[0]}" چیست؟`,
   options:opts,
   answer:opts.indexOf(w[1])
  });
 });

 gs.forEach(g=>{
  arr.push({
   q:`کدام گزینه مربوط به «${g[0]}» است؟`,
   options:shuffle([
    g[1],
    "She are happy.",
    "They is students.",
    "He am a teacher."
   ]),
   answer:0
  });
 });

 return arr.slice(0,15);
}

function startLessonQuiz(){
 S.quiz={
  type:"lesson",
  title:`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
  questions:makeLessonQuestions(),
  i:0,
  correct:0,
  wrong:0
 };

 quizRender("lessonQuiz");
}

function quizRender(id){
 const q=S.quiz?.questions[S.quiz?.i];

 if(!q){
  quizFinish(id);
  return;
 }

 const el=document.getElementById(id);
 if(!el)return;

 el.innerHTML=`
 <div class="card">
  <b>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>

  <div class="progress">
   <i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i>
  </div>

  <div style="font-size:18px;font-weight:bold;line-height:2;margin:15px 0">
   ${esc(q.q)}
  </div>

  ${q.options.map((x,i)=>`
   <button class="option" onclick="answer(${i},'${id}')">
    ${esc(x)}
   </button>
  `).join("")}

  <div id="fb"></div>
 </div>`;
}

function answer(i,id){
 const q=S.quiz.questions[S.quiz.i];
 const opts=document.querySelectorAll(".option");

 opts.forEach(x=>x.disabled=true);

 if(i===q.answer){
  S.quiz.correct++;
  opts[i].classList.add("correct");
  document.getElementById("fb").className="feedback ok";
  document.getElementById("fb").textContent="✅ آفرین! پاسخ درست است.";
 }else{
  S.quiz.wrong++;
  opts[i].classList.add("wrong");
  opts[q.answer].classList.add("correct");
  document.getElementById("fb").className="feedback bad";
  document.getElementById("fb").textContent="❌ پاسخ اشتباه است.";
 }

 setTimeout(()=>{
  S.quiz.i++;
  quizRender(id);
 },650);
}

async function quizFinish(id){
 const total=S.quiz.questions.length;
 const percent=total?
  Math.round(S.quiz.correct/total*100):0;

 examRecords.unshift({
  student:S.student?.phone||"",
  title:S.quiz.title,
  score:percent,
  date:new Date().toISOString()
 });

 saveLocal();

 if(S.student){
  try{
   await db.from("exam_results").insert({
    user_id:S.student.auth_user_id,
    student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,
    exam_type:S.quiz.type,
    exam_title:S.quiz.title,
    lesson:S.lesson+1,
    score:S.quiz.correct,
    total,
    percentage:percent
   });
  }catch(e){}

  await addXP(Math.max(10,percent));

  if(S.quiz.type==="lesson"){
   await saveProgress(`${S.grade}-${S.lesson}`,100,true);
  }
 }

 const el=document.getElementById(id);
 if(!el)return;

 el.innerHTML=`
 <div class="card">
  <div class="score">${percent}%</div>
  <h2 style="text-align:center">آزمون تمام شد 🎉</h2>

/* =========================================================
   JALALI CALENDAR
========================================================= */

const jMonths=[
 "فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور",
 "مهر","آبان","آذر","دی","بهمن","اسفند"
];

const jWeek=[
 "شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"
];

function gregorianToJalali(gy,gm,gd){
 const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
 let jy=(gy<=1600)?0:979;
 gy-=(gy<=1600)?621:1600;
 let gy2=(gm>2)?gy+1:gy;
 let days=
  365*gy+
  Math.floor((gy2+3)/4)-
  Math.floor((gy2+99)/100)+
  Math.floor((gy2+399)/400)-
 80+gd+g_d_m[gm-1];

 jy+=33*Math.floor(days/12053);
 days%=12053;
 jy+=4*Math.floor(days/1461);
 days%=1461;

 if(days>365){
  jy+=Math.floor((days-1)/365);
  days=(days-1)%365;
 }

 const jm=days<186?
  1+Math.floor(days/31):
  7+Math.floor((days-186)/30);

 const jd=1+(days<186?days%31:(days-186)%30);

 return[jy,jm,jd];
}

function jalaliToGregorian(jy,jm,jd){
 let gy=jy<=979?621:1600;
 jy-=jy<=979?0:979;

 let days=
  365*jy+
  Math.floor(jy/33)*8+
  Math.floor((jy%33+3)/4)+
  78+jd+
  (jm<7?(jm-1)*31:(jm-7)*30+186);

 gy+=400*Math.floor(days/146097);
 days%=146097;

 if(days>36524){
  gy+=100*Math.floor(--days/36524);
  days%=36524;
  if(days>=365)days++;
 }

 gy+=4*Math.floor(days/1461);
 days%=1461;

 if(days>365){
  gy+=Math.floor((days-1)/365);
  days=(days-1)%365;
 }

 const gd=days+1;
 const leap=(gy%4===0&&gy%100!==0)||gy%400===0;

 const monthDays=[
  31,
  leap?29:28,
  31,30,31,30,31,31,30,31,30,31
 ];

 let gm=1;
 let rem=gd;

 while(rem>monthDays[gm-1]){
  rem-=monthDays[gm-1];
  gm++;
 }

 return[gy,gm,rem];
}

function todayJalali(){
 const d=new Date();
 return gregorianToJalali(
  d.getFullYear(),
  d.getMonth()+1,
  d.getDate()
 );
}

function jMonthDays(y,m){
 if(m<=6)return 31;
 if(m<=11)return 30;
 return (
  (y%33===1||y%33===5||y%33===9||y%33===13||
   y%33===17||y%33===22||y%33===26||y%33===30)?30:29
 );
}

function jalaliWeekDay(y,m,d){
 const g=jalaliToGregorian(y,m,d);
 const date=new Date(g[0],g[1]-1,g[2]);
 return (date.getDay()+1)%7;
}

function renderJalaliCalendar(index){
 const el=document.getElementById("jalaliCalendar"+index);
 if(!el)return;

 const today=todayJalali();

 let state={
  y:today[0],
  m:today[1],
  d:null
 };

 function draw(){
  const first=jalaliWeekDay(state.y,state.m,1);
  const total=jMonthDays(state.y,state.m);

  let html=`
  <div class="jcalendar-head">
   <button class="btn secondary small" id="jp${index}">ماه قبل</button>
   <b>${jMonths[state.m-1]} ${state.y}</b>
   <button class="btn secondary small" id="jn${index}">ماه بعد</button>
  </div>

  <div class="jcalendar-grid">
   ${jWeek.map(x=>`<div class="jday head">${x}</div>`).join("")}
  `;

  for(let i=0;i<first;i++){
   html+=`<div class="jday empty"></div>`;
  }

  for(let d=1;d<=total;d++){
   const past=
    state.y<today[0]||
    (state.y===today[0]&&state.m<today[1])||
    (state.y===today[0]&&state.m===today[1]&&d<today[2]);

   const selected=state.d===d;

   html+=`
   <div
    class="jday selectable ${selected?"selected":""}"
    ${past?"style='opacity:.35;pointer-events:none'":""}
    data-day="${d}">
    ${d}
   </div>`;
  }

  html+=`</div>`;

  if(state.d){
   html+=`
   <div class="jselected">
    تاریخ انتخاب‌شده:
    ${state.d} ${jMonths[state.m-1]} ${state.y}
   </div>`;
  }

  el.innerHTML=html;

  document.getElementById("jp"+index).onclick=()=>{
   state.m--;
   if(state.m<1){state.m=12;state.y--}
   state.d=null;
   draw();
  };

  document.getElementById("jn"+index).onclick=()=>{
   state.m++;
   if(state.m>12){state.m=1;state.y++}
   state.d=null;
   draw();
  };

  el.querySelectorAll("[data-day]").forEach(x=>{
   x.onclick=()=>{
    state.d=Number(x.dataset.day);

    const g=jalaliToGregorian(
     state.y,state.m,state.d
    );

    const iso=
     `${g[0]}-${String(g[1]).padStart(2,"0")}-${String(g[2]).padStart(2,"0")}`;

    document.getElementById("td"+index).value=iso;

    draw();
   };
  });
 }

 draw();
}

async function startup(){
 try{
  const r=await db.auth.getSession();
  const session=r.data?.session;

  if(!session){
   login();
   return;
  }

  const user=session.user;

  try{
   const ar=await fetch(ADMIN_FUNCTION,{
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+session.access_token
    },
    body:JSON.stringify({action:"list"})
   });

   const ad=await ar.json().catch(()=>null);

   if(ar.ok&&ad?.ok){
    S.admin=true;
    S.student=null;
    renderAdmin(
     Array.isArray(ad.students)?ad.students:[],
     Array.isArray(ad.requests)?ad.requests:[]
    );
    return;
   }
  }catch(_){}

  const phone=
   normalizePhone(
    user.user_metadata?.phone||
    user.email?.split("@")[0]||
    ""
   );

  if(phone){
   const found=
    await accessFunction({
     action:"find",
     phone
    });

   if(
    found.student&&
    ["registered","approved"].includes(found.student.status)
   ){
    S.student=found.student;
    S.admin=false;

    await loadStudentStats();
    home();
    return;
   }
  }

  await db.auth.signOut();
  login();

 }catch(e){
  try{
   await db.auth.signOut();
  }catch(_){}

  login();
 }
}
