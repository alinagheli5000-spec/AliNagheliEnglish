function esc(x){
return String(x??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);
}

function normalizePhone(x){
return String(x||"").replace(/\D/g,"");

function speak(text){

if(!window.speechSynthesis){
alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
return;
}

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);

u.lang="en-US";
u.rate=.75;
u.pitch=1;

speechSynthesis.resume();
speechSynthesis.speak(u);
}

data?.error ||

}

return data;
}

/* =========================================================
   STUDENT LOGIN
   FIXED:
   phone -> Edge Function -> REAL AUTH EMAIL
========================================================= */

async function studentLogin(){

const phone=
document.getElementById("phone")
.value
.trim();

const password=
document.getElementById("pass")
.value;

if(!phone || !password){

alert("شماره تلفن و رمز عبور را وارد کنید.");
return;

}

const button=
document.querySelector("#lf .btn.full");

if(button){

button.disabled=true;
button.innerText="در حال ورود...";
}

try{

/*
Find student through secure Edge Function.
This avoids RLS blocking anonymous users.
*/

const result=
await accessFunction({
action:"find",
phone
});

const student=result.student;
const email=result.email;

if(!student){

throw new Error(
"زبان‌آموزی با این شماره پیدا نشد."
);
}

if(student.status==="rejected"){

throw new Error(
"ثبت‌نام شما توسط مدیر رد شده است."
);
}

if(
student.status!=="registered" &&
student.status!=="approved"
){

throw new Error(
"ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
);
}

if(!email){

throw new Error(
"ایمیل ورود این زبان‌آموز در حساب Auth ثبت نشده است."
);
}

/*
IMPORTANT:
Use the REAL Auth email returned from Supabase.
Never construct an email from the phone number.
*/

const auth=
await db.auth.signInWithPassword({
email:String(email).trim(),
password
});

if(auth.error){

throw new Error(
"رمز عبور صحیح نیست یا حساب Auth قابل ورود نیست."
);

}

S.student=student;
S.admin=false;

home();

}catch(e){

alert(
e?.message ||
"ورود ناموفق بود."
);

}finally{

if(button){

button.disabled=false;
button.innerText="ورود زبان‌آموز";

}

}

}

if(digits.length<10){

alert("شماره تلفن معتبر نیست.");
return;
}

/*
Stable email identity for students.
*/

const email=
digits+"@alinagheli.com";

try{

/*
Step 1:
Create Auth account.
*/

const r=
await db.auth.signUp({
email,
password,
options:{
data:{
first_name:first,
last_name:last,
phone,
level
}
}
});

if(r.error){

/*
If the account already exists,
do not silently create a broken record.
*/

if(
r.error.message
.toLowerCase()
.includes("already registered")
){

throw new Error(
"این شماره قبلاً ثبت‌نام شده است."
);

}

throw r.error;
}

if(!r.data.user){

throw new Error(
"حساب Auth ساخته نشد."
);
}

/*
Step 2:
Insert student through secure Edge Function.
This bypasses the students-table RLS issue.
*/

await accessFunction({

action:"register",

first_name:first,

last_name:last,

phone,

level,

auth_user_id:r.data.user.id,

email

});

/*
Sign out immediately.
The student must wait for admin approval.
*/

await db.auth.signOut();

alert(
"ثبت‌نام با موفقیت انجام شد.\n\n"+
"پس از تأیید مدیر می‌توانید وارد شوید."
);

login();

}catch(e){

try{
await db.auth.signOut();
}catch(_){}

alert(
"ثبت‌نام انجام نشد:\n\n"+
(e?.message||"خطای نامشخص")
);

}

}

/* =========================================================
   GRAMMAR EXPLANATIONS
========================================================= */

function grammarExplanation(title){

const explanations={

"Simple Present":
"زمان حال ساده برای بیان عادت‌ها، کارهای تکراری، واقعیت‌ها و برنامه‌های معمول استفاده می‌شود. با I، you، we و they معمولاً شکل پایه فعل را به کار می‌بریم، اما با he، she و it معمولاً s یا es به فعل اضافه می‌شود. برای سؤال و منفی نیز از do و does استفاده می‌شود.",

"Present Continuous":
"حال استمراری برای کاری استفاده می‌شود که اکنون در حال انجام است یا یک وضعیت موقتی را نشان می‌دهد. ساختار آن شامل am، is یا are به اضافه فعل دارای ing است. انتخاب فعل be به فاعل جمله بستگی دارد.",

"have / has":
"برای بیان مالکیت یا داشتن چیزی از have و has استفاده می‌کنیم. با I، you، we و they از have و با he، she و it از has استفاده می‌شود.",

"There is / There are":
"There is برای یک اسم مفرد و there are برای اسم جمع استفاده می‌شود. از این ساختار برای بیان وجود شخص یا چیزی در یک مکان استفاده می‌کنیم.",

"Can":
"Can برای بیان توانایی، امکان یا درخواست استفاده می‌شود. بعد از can فعل به شکل پایه می‌آید و can برای تمام فاعل‌ها یکسان باقی می‌ماند.",

"صفات":
"صفت ویژگی یا حالت یک اسم را بیان می‌کند. در انگلیسی صفت معمولاً پیش از اسم قرار می‌گیرد و بعد از فعل‌هایی مانند be نیز می‌تواند بیاید.",

"ضمیرهای فاعلی و فعل to be":
"ضمیر فاعلی جایگزین اسم می‌شود و نشان می‌دهد چه کسی یا چه چیزی موضوع جمله است. فعل be در زمان حال به صورت am، is و are ظاهر می‌شود و شکل آن به فاعل بستگی دارد."

};

return explanations[title]||
"در این بخش ابتدا معنی و کاربرد ساختار را یاد بگیر. سپس جایگاه فاعل، فعل و سایر اجزای جمله را بررسی کن. مثال را با دقت بخوان، آن را با صدای بلند تکرار کن و سپس چند جمله جدید با همان الگو بساز. توجه به شکل فعل، زمان جمله و ترتیب کلمات باعث می‌شود ساختار بهتر در ذهن تثبیت شود.";

}

">

class="option"
onclick="answer(${i},'${id}')">

${esc(x)}

</button>

`).join("")}


<div id="fb"></div>

</div>
`;

}


/* =========================================================
   ANSWER
========================================================= */

function answer(i,id){

const q=
S.quiz.questions[S.quiz.i];

const opts=
document.querySelectorAll(".option");

opts.forEach(x=>{
x.disabled=true;
});


if(i===q.answer){

S.quiz.correct++;

opts[i]
.classList
.add("correct");

document.getElementById("fb")
.className="feedback ok";

document.getElementById("fb")
.innerHTML=
"✅ 😊 آفرین! پاسخ درست است.";

}else{

S.quiz.wrong++;

opts[i]
.classList
.add("wrong");

opts[q.answer]
.classList
.add("correct");

document.getElementById("fb")
.className="feedback bad";

document.getElementById("fb")
.innerHTML=
"❌ 😢 پاسخ اشتباه است.";

}

setTimeout(()=>{

S.quiz.i++;

quizRender(id);

},1000);

}

async function admin(){

await db
.from("students")
.select("*")
.order("id",{ascending:false});

r.data||[]
);

}catch(e){

/* =========================================================
   APPROVE
========================================================= */

async function approve(id){

try{

const r=
await db
.from("students")
.update({
status:"registered"
})
.eq("id",id);


if(r.error){

throw r.error;
}

admin();

}catch(e){

alert(
"خطا در تأیید:\n"+
e.message
);

}

}


/* =========================================================
   REJECT
========================================================= */

async function rejectStudent(id){

try{

const r=
await db
.from("students")
.update({
status:"rejected"
})
.eq("id",id);


if(r.error){

throw r.error;
}

admin();

}catch(e){

alert(
"خطا در رد کردن:\n"+
e.message
);

}

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

try{
await db.auth.signOut();
}catch(e){}

S={
student:null,
admin:false,
grade:null,
lesson:null,
quiz:null
};

login();

}


/* =========================================================
   SESSION STARTUP
========================================================= */

async function startup(){

try{

const r=
await db.auth.getSession();

const session=
r.data?.session;


if(!session){

login();
return;
}


const user=
session.user;


if(
(user.email||"")
.toLowerCase()
===
"alinagheli@gmail.com"
){

S.admin=true;

admin();

return;

}


/*
For a student, use auth_user_id.
This query is attempted after authentication.
*/

const st=
await db
.from("students")
.select("*")
.eq("auth_user_id",user.id)
.maybeSingle();


if(
st.data &&
(
st.data.status==="registered"||
st.data.status==="approved"
)
){

S.student=
st.data;

home();

return;

}


/*
Fallback:
Find student through secure function using
the Auth user's email.
*/

try{

const phoneFromMetadata=
user.user_metadata?.phone;

if(phoneFromMetadata){

const result=
await accessFunction({
action:"find",
phone:phoneFromMetadata
});

if(
result.student &&
(
result.student.status==="registered"||
result.student.status==="approved"
)
){

S.student=
result.student;

home();

return;

}

}

}catch(_){}


/*
No valid student session.
*/

await db.auth.signOut();

login();

}catch(e){

console.error(e);

try{
await db.auth.signOut();
}catch(_){}

login();

}

}


/* =========================================================
   SUPABASE AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
async(event,session)=>{

if(event==="SIGNED_OUT"){

if(
!S.admin &&
!S.student
){

login();

}

}

}
);


/* =========================================================
   START
========================================================= */

startup();

</script>
