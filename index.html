<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
:root{
 --p:#6d28d9;--p2:#8b5cf6;--bg:#f7f5fb;--card:#fff;
 --text:#20182d;--muted:#766e82;--border:#e8e1f0;
 --green:#16a34a;--red:#dc2626;--orange:#f59e0b;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Tahoma,Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.ltr{direction:ltr;text-align:left}
.app{min-height:100vh}
.top{
 position:sticky;top:0;z-index:50;color:#fff;
 background:linear-gradient(135deg,#5b21b6,#7c3aed,#a855f7);
 padding:14px 16px;box-shadow:0 5px 20px #4c1d9530;
}
.topin{
 max-width:1050px;margin:auto;display:flex;
 justify-content:space-between;align-items:center;gap:10px
}
.logo-mini{
 width:42px;height:42px;border-radius:14px;
 display:grid;place-items:center;background:#ffffff25;
 font-weight:bold;font-size:16px
}
.top-title{font-weight:bold;font-size:16px}
.top-sub{font-size:10px;color:#ede9fe;margin-top:3px}
.container{
 max-width:1050px;margin:auto;padding:15px 12px 100px
}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{
 background:var(--card);border:1px solid var(--border);
 border-radius:22px;padding:17px;margin-bottom:14px;
 box-shadow:0 8px 28px #1f123d0a
}
.hero{
 color:white;border-radius:25px;padding:22px;margin-bottom:14px;
 background:linear-gradient(135deg,#312e81,#6d28d9 55%,#a855f7);
 box-shadow:0 15px 35px #6d28d940
}
.hero h2{margin:0 0 7px}
.hero p{margin:0;color:#ede9fe;line-height:1.9;font-size:12px}
.section-title{
 display:flex;justify-content:space-between;align-items:center;
 margin:20px 0 11px
}
.section-title h2,.section-title h3{margin:0}
.muted{color:var(--muted);font-size:12px;line-height:1.9}
.btn{
 border:0;border-radius:13px;padding:11px 15px;
 color:#fff;font-weight:bold;
 background:linear-gradient(135deg,var(--p),var(--p2))
}
.btn.secondary{background:#eee8f8;color:#5b21b6}
.btn.green{background:#dcfce7;color:#166534}
.btn.red{background:#fee2e2;color:#991b1b}
.btn.full{width:100%}
.btn.small{font-size:11px;padding:8px 10px}
input,select,textarea{
 width:100%;border:1px solid var(--border);border-radius:13px;
 padding:12px;background:#fff;outline:none
}
input:focus,select:focus,textarea:focus{
 border-color:var(--p);box-shadow:0 0 0 3px #6d28d91a
}
label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px}
.grid{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px
}
.stat{
 background:#faf8fd;border:1px solid var(--border);
 border-radius:17px;padding:13px
}
.stat b{display:block;font-size:23px;color:var(--p);margin-top:5px}
.stat small{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.notice{
 padding:12px;border-radius:13px;margin-bottom:12px;font-size:12px
}
.notice.ok{background:#dcfce7;color:#166534}
.notice.err{background:#fee2e2;color:#991b1b}

/* LOGIN */
.login-page{
 min-height:100vh;padding:20px;display:flex;align-items:center;
 justify-content:center;
 background:
 radial-gradient(circle at 10% 10%,#a78bfa55,transparent 35%),
 radial-gradient(circle at 90% 90%,#c084fc55,transparent 35%),
 linear-gradient(135deg,#171126,#312e81)
}
.login-card{
 width:min(460px,100%);background:#fffffffa;
 border-radius:30px;padding:28px 22px;
 box-shadow:0 30px 80px #0005
}
.login-logo{
 width:82px;height:82px;border-radius:26px;margin:auto;
 display:grid;place-items:center;color:#fff;font-size:28px;font-weight:bold;
 background:linear-gradient(135deg,#6d28d9,#a855f7);
 box-shadow:0 15px 35px #6d28d955
}
.login-title{text-align:center;font-size:24px;font-weight:bold;margin-top:14px}
.login-sub{text-align:center;color:#777;font-size:12px;margin:7px 0 22px}
.login-tabs{display:flex;gap:8px;margin-bottom:16px}
.login-tab{
 flex:1;border:0;border-radius:14px;padding:12px;
 background:#f1edf7;color:#6b6078;font-weight:bold
}
.login-tab.active{background:#ede9fe;color:#6d28d9}
.login-icon{text-align:center;font-size:45px;margin:8px}

/* DAILY WORD */
.word-of-day{
 background:linear-gradient(135deg,#fff,#f5efff);
 border:1px solid #e5d8fa;border-radius:22px;padding:18px;
 position:relative;overflow:hidden
}
.word-of-day:after{
 content:"Aa";position:absolute;left:-5px;bottom:-25px;
 font-size:100px;color:#6d28d910;font-weight:bold
}
.daily-label{font-size:11px;color:#7c3aed;font-weight:bold}
.daily-word{
 direction:ltr;text-align:center;font-size:32px;font-weight:bold;
 color:#5b21b6;margin:8px 0
}
.daily-meaning{text-align:center;color:#6b7280}
.speak{
 border:0;border-radius:50%;width:42px;height:42px;
 background:#ede9fe;color:#6d28d9
}

/* NAV */
.bottom-nav{
 position:fixed;bottom:0;left:0;right:0;z-index:100;
 background:#fff;border-top:1px solid var(--border);
 box-shadow:0 -8px 30px #1f123d12
}
.navin{max-width:720px;margin:auto;display:flex}
.nav-btn{
 flex:1;border:0;background:#fff;padding:8px 3px 9px;
 color:#81778c;font-size:10px
}
.nav-btn .ico{display:block;font-size:21px;margin-bottom:3px}
.nav-btn.active{color:var(--p);font-weight:bold}
.nav-btn.active .ico{transform:translateY(-2px)}

/* COURSES */
.course-card{
 background:#fff;border:1px solid var(--border);border-radius:22px;
 padding:17px;min-height:150px;cursor:pointer;transition:.2s;
 box-shadow:0 8px 22px #1f123d08
}
.course-card:hover{transform:translateY(-3px)}
.course-number{
 width:52px;height:52px;border-radius:17px;
 display:grid;place-items:center;
 color:#fff;font-size:20px;font-weight:bold;
 background:linear-gradient(135deg,var(--p),var(--p2))
}
.course-card h3{margin:12px 0 5px}
.course-card p{margin:0}
.locked{opacity:.7}
.course-detail-head{
 display:flex;align-items:center;gap:12px
}
.back{
 border:0;border-radius:12px;padding:9px 12px;
 background:#eee8f8;color:#5b21b6
}
.lesson-tabs{display:flex;gap:7px;margin-bottom:13px}
.lesson-tab{
 flex:1;border:0;border-radius:13px;padding:11px 5px;
 background:#eeeef2;color:#555
}
.lesson-tab.active{
 background:linear-gradient(135deg,var(--p),var(--p2));color:#fff
}
.lesson{display:none}
.lesson.active{display:block}
.grammar-box{
 border:1px solid var(--border);border-radius:16px;
 padding:14px;margin-bottom:9px
}
.grammar-box strong{display:block;color:#5b21b6}
.example{
 margin-top:9px;background:#f8f6fc;border-radius:11px;
 padding:10px;direction:ltr;text-align:left;color:#4c1d95;
 font-family:Arial
}
.vocab-grid{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px
}
.word{
 border:1px solid #e4dcf8;background:#faf8ff;
 border-radius:15px;padding:12px;text-align:center
}
.word-en{display:block;direction:ltr;color:#5b21b6;font-weight:bold}
.word-fa{display:block;font-size:10px;color:#777;margin-top:5px}

/* QUIZ */
.quiz-progress{height:9px;background:#eee;border-radius:99px;overflow:hidden}
.quiz-progress div{
 height:100%;background:linear-gradient(90deg,#6d28d9,#c084fc);
 transition:.3s
}
.quiz-question{
 font-size:17px;font-weight:bold;line-height:1.9;margin:15px 0
}
.quiz-option{
 width:100%;text-align:right;border:1px solid var(--border);
 background:#fff;border-radius:14px;padding:13px;margin:7px 0
}
.quiz-option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.quiz-option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback{
 min-height:50px;border-radius:16px;display:flex;
 justify-content:center;align-items:center;
 font-weight:bold;margin:12px 0
}
.feedback.correct{background:#dcfce7;color:#166534}
.feedback.wrong{background:#fee2e2;color:#991b1b}
.feedback-icon{font-size:30px;margin-left:8px}
.quiz-result{text-align:center;padding:25px}
.quiz-result .score{font-size:55px;color:var(--p);font-weight:bold}
.overlay{
 position:fixed;top:18px;left:50%;transform:translateX(-50%);
 z-index:999;width:min(320px,90%);display:none;
 padding:18px;border-radius:22px;text-align:center;
 box-shadow:0 20px 60px #0004;font-weight:bold
}
.overlay.show{display:block}
.overlay.correct{background:#dcfce7;color:#166534}
.overlay.wrong{background:#fee2e2;color:#991b1b}
.overlay-icon{display:block;font-size:52px}

/* PROFILE */
.profile-head{
 display:flex;align-items:center;gap:13px
}
.avatar{
 width:65px;height:65px;border-radius:21px;
 display:grid;place-items:center;color:#fff;font-size:23px;font-weight:bold;
 background:linear-gradient(135deg,var(--p),var(--p2))
}
.history-item{
 display:flex;justify-content:space-between;align-items:center;
 padding:12px 4px;border-bottom:1px solid var(--border);font-size:12px

.score-good{color:#16a34a;font-weight:bold}
.score-mid{color:#d97706;font-weight:bold}
.score-low{color:#dc2626;font-weight:bold}

/* TEACHER */
.teacher-cover{

 color:#fff;border-radius:24px

.teacher-avatar{

 display:grid;place-items:center;font-size:32px;font-weight:bold;
 background:#ffffff20;border:2px solid #ffffff55
}
.teacher-en{
 direction:ltr;text-align:left;
 background:#faf8fd;border:1px solid var(--border);
 border-radius:17px;padding:15px
}
.phone{
 display:block;text-decoration:none;text-align:center;
 background:#dcfce7;color:#166534;
 padding:13px;border-radius:14px;font-weight:bold;margin-top:10px
}

/* ADMIN */
.admin-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:600px){.admin-stat{grid-template-columns:1fr 1fr}}
.student-row{
 border:1px solid var(--border);border-radius:16px;
 padding:13px;margin:8px 0
}
.student-row-head{
 display:flex;justify-content:space-between;gap:8px
}
.badge{
 display:inline-block;border-radius:99px;padding:5px 9px;
 font-size:10px;font-weight:bold
}
.waiting{background:#fff7ed;color:#9a3412}
.registered{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}

</style>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://kapzyedzjecnfxevjisq.supabase.co';

const SUPABASE_KEY =
'sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ';

const db =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);


/* =========================================================
   GLOBAL STATE
========================================================= */

let user=null;
let me=null;
let isAdmin=false;
let currentPage='home';
let currentGrade='7';

let quiz=[];
let quizIndex=0;
let quizScore=0;
let quizAnswered=false;

let placement=[];
let placementIndex=0;
let placementScore=0;
let placementAnswered=false;

let history=[];


/* =========================================================
   HELPERS
========================================================= */

const $=id=>document.getElementById(id);

function esc(x){
 return String(x??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[m]));
}

function emailFor(phone){
 return String(phone||'').replace(/\D/g,'')+'@alinagheli.com';
}

function today(){
 return new Date().toLocaleDateString('fa-IR');
}

function speak(text){
 if('speechSynthesis' in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate=.8;
  speechSynthesis.speak(u);
 }
}

function scoreClass(s){
 if(s>=80)return 'score-good';
 if(s>=50)return 'score-mid';
 return 'score-low';
}

function showMsg(text,type='ok'){
 const old=document.querySelector('.notice');
 if(old)old.remove();

 const x=document.createElement('div');
 x.className='notice '+(type==='err'?'err':'ok');
 x.textContent=text;

 document.querySelector('.container')?.prepend(x);

 setTimeout(()=>x.remove(),4000);
}

function overlay(correct){
 $('overlayIcon').textContent=correct?'✅😊':'❌😔';
 $('overlayText').textContent=
 correct?'آفرین! پاسخ شما درست است.':'پاسخ اشتباه است. دوباره تلاش کن!';
 $('overlay').className='overlay show '+(correct?'correct':'wrong');

 setTimeout(()=>{$('overlay').className='overlay'},1100);
}

function statusBadge(s){
 if(s==='registered')return '<span class="badge registered">ثبت‌نام شده</span>';
 if(s==='rejected')return '<span class="badge rejected">رد شده</span>';
 if(s==='graduate')return '<span class="badge graduate">فارغ‌التحصیل</span>';
 return '<span class="badge waiting">در صف انتظار</span>';
}


/* =========================================================
   LOGIN
========================================================= */

function login(){

 document.body.innerHTML=`
 <div class="login-page">
  <div class="login-card">

   <div class="login-logo">AN</div>

   <div class="login-title">
    AliNagheli English
   </div>

   <div class="login-sub">
    سامانه آموزش زبان انگلیسی
   </div>

   <div class="login-tabs">
    <button class="login-tab active"
     id="studentLoginTab"
     onclick="loginMode('student')">
     🎓 زبان‌آموز
    </button>

    <button class="login-tab"
     id="adminLoginTab"
     onclick="loginMode('admin')">
     👨‍🏫 مدیر
    </button>
   </div>

   <div id="loginForm"></div>

  </div>
 </div>
 `;

 loginMode('student');
}

function loginMode(mode){

 $('studentLoginTab').classList.toggle(
  'active',mode==='student'
 );

 $('adminLoginTab').classList.toggle(
  'active',mode==='admin'
 );

 if(mode==='student'){

  $('loginForm').innerHTML=`

   <div class="login-icon">🎓</div>

   <label>شماره موبایل</label>
   <input id="loginPhone"
    inputmode="tel"
    placeholder="0914xxxxxxxx">

   <label>رمز عبور</label>
   <input id="loginPass"
    type="password"
    placeholder="رمز عبور">

   <button class="btn full"
    style="margin-top:14px"
    onclick="studentLogin()">
    ورود به پنل زبان‌آموز
   </button>

   <button class="btn secondary full"
    style="margin-top:8px"
    onclick="registerStudent()">
    📝 ثبت‌نام زبان‌آموز جدید
   </button>

  `;

 }else{

  $('loginForm').innerHTML=`

   <div class="login-icon">👨‍🏫</div>

   <label>ایمیل مدیر</label>
   <input id="adminEmail"
    type="email"
    placeholder="ایمیل مدیر">

   <label>رمز عبور</label>
   <input id="adminPass"
    type="password"
    placeholder="رمز عبور">

   <button class="btn full"
    style="margin-top:14px"
    onclick="adminLogin()">
    ورود مدیر
   </button>

  `;
 }
}

async function studentLogin(){

 const phone=$('loginPhone').value.trim();
 const pass=$('loginPass').value;

 if(!phone||!pass){
  alert('شماره موبایل و رمز عبور را وارد کنید.');
  return;
 }

 const {data,error}=await db.auth.signInWithPassword({
  email:emailFor(phone),
  password:pass
 });

 if(error){
  alert('ورود ناموفق بود: '+error.message);
  return;
 }

 user=data.user;
 await identify();
}

async function adminLogin(){

 const email=$('adminEmail').value.trim();
 const pass=$('adminPass').value;

 const {data,error}=await db.auth.signInWithPassword({
  email,password:pass
 });

 if(error){
  alert('ورود مدیر ناموفق بود: '+error.message);
  return;
 }

 user=data.user;
 await identify();
}

async function registerStudent(){

 $('loginForm').innerHTML=`

 <div class="login-icon">📝</div>

 <label>نام</label>
 <input id="regFirst" placeholder="نام">

 <label>نام خانوادگی</label>
 <input id="regLast" placeholder="نام خانوادگی">

 <label>شماره موبایل</label>
 <input id="regPhone" inputmode="tel"
  placeholder="0914xxxxxxxx">

 <label>رمز عبور</label>
 <input id="regPass" type="password"
  placeholder="حداقل 6 کاراکتر">

 <button class="btn full"
  style="margin-top:14px"
  onclick="createStudent()">
  ثبت درخواست
 </button>

 <button class="btn secondary full"
  style="margin-top:8px"
  onclick="loginMode('student')">
  بازگشت
 </button>
 `;
}

async function createStudent(){

 const first=$('regFirst').value.trim();
 const last=$('regLast').value.trim();
 const phone=$('regPhone').value.trim();
 const pass=$('regPass').value;

 if(!first||!last||!phone||pass.length<6){
  alert('تمام اطلاعات را صحیح وارد کنید.');
  return;
 }

 const {data,error}=await db.auth.signUp({
  email:emailFor(phone),
  password:pass
 });

 if(error){
  alert(error.message);
  return;
 }

 const uid=data.user?.id;

 const r=await db.from('students').insert({
  first_name:first,
  last_name:last,
  phone:phone,
  level:null,
  status:'waiting',
  auth_user_id:uid,
  password_created:true
 });

 if(r.error){
  alert(r.error.message);
  return;
 }

 alert('درخواست شما ثبت شد. پس از تأیید مدیر می‌توانید وارد شوید.');

 await db.auth.signOut();
 login();
}

async function identify(){

 if(!user){
  login();
  return;
 }

 const admin=await db
  .from('admins')
  .select('id')
  .eq('user_id',user.id)
  .maybeSingle();

 if(admin.data){
  isAdmin=true;
  adminApp();
  return;
 }

 isAdmin=false;

 const result=await db
  .from('students')
  .select('*')
  .eq('auth_user_id',user.id)
  .maybeSingle();

 me=result.data||{
  first_name:'زبان‌آموز',
  last_name:'',
  phone:''
 };

 await loadHistory();

 studentApp();
}

async function logout(){

 await db.auth.signOut();

 user=null;
 me=null;
 isAdmin=false;
 history=[];

 login();
}

========================================================= */

function shuffle(a){
 return [...a].sort(()=>Math.random()-.5);
}

function startGrade7Quiz(){

 const data=lessons['7'].questions;

 quiz=shuffle(data).slice(0,Math.min(20,data.length));
 quizIndex=0;
 quizScore=0;
 quizAnswered=false;

 renderQuiz('درس‌های پایه هفتم');
}

function startFinalGrade7(){

 const source=lessons['7'].questions;

 quiz=[];

 while(quiz.length<50){
  quiz.push(
   ...shuffle(source)
  );
 }

 quiz=quiz.slice(0,50);

 quizIndex=0;
 quizScore=0;
 quizAnswered=false;

 renderQuiz('آزمون جامع پایه هفتم');
}

function renderQuiz(title){

 goPage('detail');

 $('page-detail').innerHTML=`

 <button class="back"
  onclick="openCourse('7')">
  ← بازگشت به دوره هفتم
 </button>

 <div class="card" style="margin-top:12px">

  <h2>${title}</h2>

  <div class="muted">
   سؤال ${quizIndex+1} از ${quiz.length}
  </div>

  <div class="quiz-progress" style="margin-top:10px">
   <div style="width:${(quizIndex/quiz.length)*100}%"></div>
  </div>

 </div>

 <div class="card">

  <div class="quiz-question">
   ${esc(quiz[quizIndex][0])}
  </div>

  <div id="quizOptions">
   ${quiz[quizIndex][1].map((o,i)=>`
    <button class="quiz-option"
     onclick="answerQuiz(${i})">
     ${esc(o)}
    </button>
   `).join('')}
  </div>

  <div id="quizFeedback"></div>

 </div>
 `;
}

async function answerQuiz(selected){

 if(quizAnswered)return;

 quizAnswered=true;

 const q=quiz[quizIndex];
 const correct=q[2];

 document.querySelectorAll('.quiz-option')
 .forEach((b,i)=>{
  b.disabled=true;

  if(i===correct)
   b.classList.add('correct');

  if(i===selected && selected!==correct)
   b.classList.add('wrong');
 });

 const isCorrect=selected===correct;

 if(isCorrect)quizScore++;

 overlay(isCorrect);

 $('quizFeedback').innerHTML=`
  <div class="feedback ${isCorrect?'correct':'wrong'}">
   <span class="feedback-icon">
    ${isCorrect?'✓😊':'✕😔'}
   </span>
   ${isCorrect?'پاسخ صحیح است!':'پاسخ صحیح نیست.'}
  </div>

  <button class="btn full"
   onclick="nextQuiz()">
   ${quizIndex===quiz.length-1?'مشاهده نتیجه':'سؤال بعدی →'}
  </button>
 `;

}

async function nextQuiz(){

 if(quizIndex<quiz.length-1){

  quizIndex++;
  quizAnswered=false;

  renderQuiz(
   quiz.length===50
    ?'آزمون جامع پایه هفتم'
    :'آزمون پایه هفتم'
  );

 }else{

  const score=Math.round(
   quizScore/quiz.length*100
  );

  await saveHistory(
   quiz.length===50
    ?'آزمون جامع پایه هفتم'
    :'آزمون پایه هفتم',
   score
  );

  $('page-detail').innerHTML=`

   <button class="back"
    onclick="openCourse('7')">
    ← بازگشت به دوره
   </button>

   <div class="card quiz-result"
    style="margin-top:12px">

    <div style="font-size:55px">
     ${score>=80?'🏆😊':score>=50?'👏🙂':'💪😔'}
    </div>

    <h2>نتیجه آزمون</h2>

    <div class="score">
     ${score}%
    </div>

    <p>
     ${quizScore} پاسخ صحیح از ${quiz.length}
    </p>

    <button class="btn full"
     onclick="${
      quiz.length===50
       ?'startFinalGrade7()'
       :'startGrade7Quiz()'
     }">
     🔄 شرکت مجدد در آزمون
    </button>

    <button class="btn secondary full"
     style="margin-top:8px"
     onclick="openCourse('7')">

    </button>

   </div>
  `;
 }
}

 goPage('placement-quiz');

 $('page-placement-quiz').innerHTML=`

 <button class="back"
  onclick="goPage('placement')">
  ← بازگشت
 </button>

 <div class="card" style="margin-top:12px">

  <h2>🎯 آزمون تعیین سطح</h2>

  <div class="muted">
   سؤال ${placementIndex+1} از 30
  </div>

  <div class="quiz-progress"
   style="margin-top:10px">

   <div style="
    width:${placementIndex/30*100}%
   "></div>

  </div>

 </div>

 <div class="card">

  <div class="quiz-question">
   ${esc(placement[placementIndex][0])}
  </div>

  <div id="placementOptions">

   ${placement[placementIndex][1].map((o,i)=>`
    <button class="quiz-option"
     onclick="answerPlacement(${i})">
     ${esc(o)}
    </button>
   `).join('')}

  </div>

  <div id="placementFeedback"></div>

 </div>

 `;
}

async function answerPlacement(selected){

 if(placementAnswered)return;

 placementAnswered=true;

 const q=placement[placementIndex];
 const correct=q[2];
 const isCorrect=selected===correct;

 if(isCorrect)placementScore++;

 document.querySelectorAll('#placementOptions .quiz-option')
 .forEach((b,i)=>{
  b.disabled=true;

  if(i===correct)b.classList.add('correct');

  if(i===selected&&selected!==correct)
   b.classList.add('wrong');
 });

 overlay(isCorrect);

 $('placementFeedback').innerHTML=`

 <div class="feedback ${isCorrect?'correct':'wrong'}">

  <span class="feedback-icon">
   ${isCorrect?'✓😊':'✕😔'}
  </span>

  ${isCorrect?'پاسخ درست است!':'پاسخ اشتباه است.'}

 </div>

 <button class="btn full"
  onclick="nextPlacement()">

  ${placementIndex===29
   ?'مشاهده سطح نهایی'
   :'سؤال بعدی →'}

 </button>
 `;
}

async function nextPlacement(){

 if(placementIndex<29){

  placementIndex++;
  placementAnswered=false;

  renderPlacementQuiz();

 }else{

  const score=Math.round(
   placementScore/30*100
  );

  const level=getPlacementLevel(placementScore);

  await saveHistory(
   'آزمون تعیین سطح',
   score
  );

  if(me){

   await db.from('students')
    .update({level})
    .eq('auth_user_id',user.id);

   me.level=level;
  }

  $('page-placement-quiz').innerHTML=`

   <div class="card quiz-result">

    <div style="font-size:65px">
     ${score>=70?'🏆😊':'👏🙂'}
    </div>

    <h2>نتیجه تعیین سطح</h2>

    <div class="score">
     ${score}%
    </div>

    <p>
     ${placementScore} پاسخ صحیح از ۳۰ سؤال
    </p>

    <div class="card">

     <div style="font-size:12px;color:#777">
      سطح پیشنهادی شما
     </div>

     <div style="
      font-size:28px;
      color:#6d28d9;
      font-weight:bold;
      margin-top:8px">
      ${level}
     </div>

    </div>

    <button class="btn full"
     onclick="startPlacement()">
     🔄 شرکت مجدد
    </button>

    <button class="btn secondary full"
     style="margin-top:8px"
     onclick="goPage('profile')">
     مشاهده پروفایل
    </button>

   </div>
  `;
 }
}

function getPlacementLevel(score){

 if(score<=7)return 'A1 — Beginner';
 if(score<=12)return 'A2 — Elementary';
 if(score<=17)return 'B1 — Intermediate';
 if(score<=22)return 'B2 — Upper-Intermediate';
 if(score<=27)return 'C1 — Advanced';
 return 'C2 — Proficient';
}

/* =========================================================
   HISTORY / SUPABASE
========================================================= */

async function loadHistory(){

 history=[];

 if(!user)return;

 /*
  اگر جدول exam_history در Supabase ساخته شده باشد،
  رکوردها مستقیماً ذخیره و خوانده می‌شوند.
 */

 try{

  const r=await db
   .from('exam_history')
   .select('*')
   .eq('user_id',user.id)
   .order('created_at',{ascending:false});

  if(!r.error){
   history=r.data||[];
  }

 }catch(e){
  console.log(e);
 }
}

async function saveHistory(type,score){

 const record={
  user_id:user?.id,
  student_id:me?.id||null,
  exam_type:type,
  score:score,
  created_at:new Date().toISOString()
 };

 try{

  const r=await db
   .from('exam_history')
   .insert(record);

  if(r.error){
   console.log('History table:',r.error.message);
  }

 }catch(e){
  console.log(e);
 }

 history.unshift(record);
}

  .update({status})

  return;
 }

 await loadAdminStudents();
}

async function deleteStudent(id){

 if(!confirm('آیا از حذف این زبان‌آموز مطمئن هستید؟'))
  return;

 const r=await db
  .from('students')
  .delete()
  .eq('id',id);

 if(r.error){
  alert(r.error.message);
  return;
 }

 await loadAdminStudents();
}

async function boot(){

 try{

  const session=
   await db.auth.getSession();

  if(session.data.session){

   user=session.data.session.user;
   await identify();

  }else{

   login();

  }

  db.auth.onAuthStateChange(
   async(event,session)=>{

    if(event==='SIGNED_OUT'){
     user=null;
     me=null;
     history=[];
     login();
    }

   }
  );

 }catch(e){

  console.error(e);
  login();

 }

}

boot();
