/* =========================
SPEECH

function speakWord(word){

if(!("speechSynthesis" in window)){
toast("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند");
return;
}

try{
window.speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(String(word));
u.lang="en-US";
u.rate=.72;
u.pitch=1;
u.volume=1;

const voices=window.speechSynthesis.getVoices();
const voice=voices.find(v=>
/en(-|_)US/i.test(v.lang)
)||voices.find(v=>/^en/i.test(v.lang));

if(voice)u.voice=voice;

window.speechSynthesis.speak(u);

}catch(e){
console.error(e);
toast("پخش تلفظ انجام نشد");
}
}

function attachSpeech(){
document.querySelectorAll(".speakBtn").forEach(btn=>{

});
});

function grammarHTML(title){

return `
<div class="grammar">
<h3>📚 گرامر ${escapeHTML(title)}</h3>

<p>
در این بخش گرامر را قدم‌به‌قدم یاد می‌گیریم.
اول به فاعل جمله توجه کن؛ سپس شکل مناسب فعل را انتخاب کن.
در انگلیسی ترتیب کلمات معمولاً اهمیت زیادی دارد.
</p>

<p>
برای معرفی خودمان یا بیان یک حالت، از فعل <b>to be</b> استفاده می‌کنیم.
در زمان حال:
<b>I → am</b>،
<b>he / she / it → is</b>،
و
<b>you / we / they → are</b>.
</p>

<p>
مثلاً وقتی درباره خودمان صحبت می‌کنیم می‌گوییم:
<b>I am a student.</b>
اما برای یک دختر می‌گوییم:
<b>She is a student.</b>
و برای چند دانش‌آموز می‌گوییم:
<b>They are students.</b>
</p>

<p>
برای منفی کردن جمله، معمولاً <b>not</b> بعد از فعل to be قرار می‌گیرد.
مثلاً:
<b>I am not a teacher.</b>
یعنی «من معلم نیستم».
</p>

<p>
برای سؤال بله/خیر، فعل to be را به ابتدای جمله می‌آوریم.
مثلاً:
<b>Are you a student?</b>
پاسخ می‌تواند باشد:
<b>Yes, I am.</b>
یا:
<b>No, I am not.</b>
</p>

<p>
نکته مهم: همیشه به فاعل نگاه کن.
اگر فاعل <b>I</b> بود، <b>am</b>؛
اگر <b>he/she/it</b> بود، <b>is</b>؛
و اگر <b>you/we/they</b> بود، <b>are</b>.
</p>
</div>

<div class="example">
I am an English teacher.
<br>من یک معلم زبان انگلیسی هستم.
</div>

<div class="example">

<br>او دوست من است.
</div>

</div>

<div class="example">

<br>آیا تو دانش‌آموز هستی؟
</div>
`;

$("studentLoginBtn").addEventListener("click",studentLogin);

async function studentLogin(){

if(!supabaseClient){
toast("اتصال به سامانه برقرار نیست");
return;
}

const phone=normalizePhone($("loginPhone").value);
const password=$("loginPassword").value;

if(!phone||!password){
toast("شماره موبایل و رمز عبور را وارد کنید");
return;
}

const btn=$("studentLoginBtn");
btn.disabled=true;
btn.textContent="در حال ورود...";

try{

let result=await supabaseClient.auth.signInWithPassword({
email:phone+"@alinagheli.local",
password
});

if(result.error){
toast("شماره موبایل یا رمز عبور اشتباه است");
return;
}

currentUser=result.data.user;

const sr=await supabaseClient
.from("students")
.select("*")
.eq("auth_user_id",currentUser.id)
.maybeSingle();

if(sr.error||!sr.data){
await supabaseClient.auth.signOut();
toast("اطلاعات زبان‌آموز پیدا نشد");
return;
}

if(sr.data.status==="waiting"){
await supabaseClient.auth.signOut();
toast("حساب شما هنوز توسط مدیر تأیید نشده است");
return;
}

if(sr.data.status==="rejected"){
await supabaseClient.auth.signOut();
toast("درخواست ثبت‌نام شما رد شده است");
return;
}

currentStudent=sr.data;

$("welcomeText").textContent=
`سلام ${currentStudent.first_name||""} عزیز 🌷`;

showStudent();
navigate("home");

}catch(e){
console.error(e);
toast("خطا هنگام ورود");
}finally{
btn.disabled=false;
btn.textContent="ورود زبان‌آموز";
}
}

async function registerStudent(){

if(!supabaseClient){
toast("اتصال به سامانه برقرار نیست");
return;
}

const first=$("regFirst").value.trim();
const last=$("regLast").value.trim();
const phone=normalizePhone($("regPhone").value);
const level=$("regLevel").value;
const password=$("regPassword").value;

if(!first||!last||!phone||!password){
toast("همه اطلاعات را وارد کنید");
return;
}

if(password.length<6){
toast("رمز عبور باید حداقل ۶ کاراکتر باشد");
return;
}

try{

const result=await supabaseClient.auth.signUp({
email:phone+"@alinagheli.local",
password,
options:{
data:{
first_name:first,
last_name:last,
phone,
level
}
}
});

if(result.error){
toast(result.error.message);
return;
}

if(!result.data.user){
toast("حساب ساخته نشد");
return;
}

const insert=await supabaseClient
.from("students")
.insert({
first_name:first,
last_name:last,
phone,
level,
status:"waiting",
auth_user_id:result.data.user.id,
password_created:true
});

if(insert.error){
console.error(insert.error);
toast("حساب ساخته شد اما ثبت اطلاعات ناموفق بود");
return;
}

await supabaseClient.auth.signOut();

toast("درخواست ثبت‌نام با موفقیت ارسال شد");
closeModal();

}catch(e){
console.error(e);
toast("خطا هنگام ثبت‌نام");
}
}

/* =========================
TEST ENGINE
========================= */

function renderLessonTest(qs,title){

currentTest={
questions:qs,
title,
score:0,
answered:0,
finished:false
};

const box=$("lessonTest");

box.innerHTML=qs.map((q,i)=>`
<div class="q" data-question="${i}" data-done="0">
<b>${i+1}. ${escapeHTML(q.q)}</b>
${q.a.map((o,j)=>`
<button type="button" class="opt testOption"
data-question="${i}" data-option="${j}">
${escapeHTML(o)}
</button>
`).join("")}
</div>
`).join("");

document.querySelectorAll(".testOption").forEach(btn=>{
btn.addEventListener("click",()=>{
answerLesson(
btn,
Number(btn.dataset.question),
Number(btn.dataset.option)
);
});
});
}

function answerLesson(btn,qi,oi){

const box=btn.closest(".q");

if(!box||box.dataset.done==="1")return;

box.dataset.done="1";

const q=currentTest.questions[qi];
const opts=box.querySelectorAll(".opt");

opts.forEach(x=>x.disabled=true);

if(oi===q.c){
currentTest.score++;
btn.classList.add("ok");
btn.innerHTML="✓ "+btn.innerHTML;
showFeedback(true);
}else{
btn.classList.add("bad");
btn.innerHTML="✕ "+btn.innerHTML;
if(opts[q.c])opts[q.c].classList.add("ok");
showFeedback(false);
}

currentTest.answered++;

if(currentTest.answered===currentTest.questions.length){
finishLessonTest();
}
}

function showFeedback(correct){

const f=document.createElement("div");
f.className="feedback";
f.innerHTML=correct
?"🎉<b>آفرین! پاسخ درست است ✓</b>"
:"😢<b>پاسخ اشتباه است ✕</b>";

document.body.appendChild(f);

setTimeout(()=>f.remove(),1000);
}

async function finishLessonTest(){

if(currentTest.finished)return;

currentTest.finished=true;

const percent=Math.round(
currentTest.score/currentTest.questions.length*100
);

$("lessonTest").insertAdjacentHTML("beforeend",`
<div class="result">
<h2>🎉 آزمون تمام شد</h2>
<div class="percent">${percent}%</div>
<p>${currentTest.score} پاسخ صحیح از ${currentTest.questions.length}</p>
<h3>${percent>=80?"🌟 عالی بود!":percent>=60?"😊 خوب بود!":"💪 بیشتر تمرین کن!"}</h3>
</div>
`);

await saveRecord("آزمون",currentTest.title,percent);
}

try{

const result=await supabaseClient
.from("students")
.select("*")
.order("id",{ascending:false});

if(result.error){
console.error(result.error);
box.innerHTML='<div class="empty">خطا در دریافت اطلاعات.</div>';
return;
}

if(!result.data||!result.data.length){
box.innerHTML='<div class="empty">درخواستی وجود ندارد.</div>';
return;
}

box.innerHTML=`
<div class="scroll">
<table>
<thead>
<tr>
<th>نام</th>
<th>موبایل</th>
<th>پایه</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>
</thead>
<tbody>
${result.data.map(s=>`
<tr>
<td>${escapeHTML(s.first_name)} ${escapeHTML(s.last_name)}</td>
<td>
<a class="phone" href="tel:${escapeHTML(s.phone)}">${escapeHTML(s.phone)}</a>
</td>
<td>${escapeHTML(s.level)}</td>
<td>${escapeHTML(s.status)}</td>
<td>
${s.status==="waiting"?`
<button type="button" class="btn ok approveBtn" data-id="${escapeHTML(s.id)}">تأیید</button>
<button type="button" class="btn bad rejectBtn" data-id="${escapeHTML(s.id)}">رد</button>
`:"—"}
</td>
</tr>
`).join("")}
</tbody>
</table>
</div>
`;

document.querySelectorAll(".approveBtn").forEach(b=>{
b.addEventListener("click",()=>approveStudent(b.dataset.id));
});

document.querySelectorAll(".rejectBtn").forEach(b=>{
b.addEventListener("click",()=>rejectStudent(b.dataset.id));
});

}catch(e){
console.error(e);
box.innerHTML='<div class="empty">خطا در دریافت اطلاعات.</div>';
}
}

async function approveStudent(id){

try{

const r=await supabaseClient
.from("students")
.update({status:"registered"})
.eq("id",id);

if(r.error){
console.error(r.error);
toast("خطا در تأیید زبان‌آموز");
return;
}

toast("زبان‌آموز تأیید شد");
await loadAdminStudents();

}catch(e){
console.error(e);
toast("خطا در تأیید");
}
}

async function rejectStudent(id){

try{

const r=await supabaseClient
.from("students")
.update({status:"rejected"})
.eq("id",id);

if(r.error){
console.error(r.error);
toast("خطا در رد درخواست");
return;
}

toast("درخواست رد شد");
await loadAdminStudents();

}catch(e){
console.error(e);
toast("خطا در رد درخواست");
}
}


/* =========================
LOGOUT
========================= */

async function logout(){

try{
if(supabaseClient)await supabaseClient.auth.signOut();
}catch(e){
console.warn(e);
}

currentUser=null;
currentStudent=null;

showLogin();
}


/* =========================
SESSION
========================= */

async function restoreSession(){

if(!supabaseClient)return;

try{

const result=await supabaseClient.auth.getSession();
const session=result.data?.session;

if(!session)return;

currentUser=session.user;

if(currentUser.email===ADMIN_EMAIL){
showAdmin();
await renderAdmin();
return;
}

const sr=await supabaseClient
.from("students")
.select("*")
.eq("auth_user_id",currentUser.id)
.maybeSingle();

if(sr.data&&sr.data.status==="registered"){

currentStudent=sr.data;

$("welcomeText").textContent=
`سلام ${currentStudent.first_name||""} عزیز 🌷`;

showStudent();
navigate("home");

}else{

await supabaseClient.auth.signOut();
showLogin();

}

}catch(e){

console.error(e);
showLogin();

}
}


/* =========================
INITIALIZE
========================= */

(function init(){

showLogin();

if(supabaseClient){
restoreSession();
}

})();
</script>
