<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta
    name="theme-color"
    content="#6d28d9">

  <title>AliNagheli English</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root{
      --primary:#6d28d9;
      --primary2:#8b5cf6;
      --bg:#f7f5fb;
      --card:#ffffff;
      --text:#211b2d;
      --muted:#766e82;
      --border:#e7e1ef;

      --success:#15803d;
      --successBg:#dcfce7;

      --danger:#b91c1c;
      --dangerBg:#fee2e2;

      --warningBg:#fff7ed;

      --graduate:#5b21b6;
      --graduateBg:#ede9fe;

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        Tahoma,

    button,
    input,
    select,
    textarea{

          var(--primary2)

    .brand{

    }

    .wrap{
      max-width:1100px;
      margin:auto;

      padding:

    }

    .card{

      border:

      border-radius:18px;

      padding:18px;

      box-shadow:
        0 8px 24px #2b18380b;

    }

    .login{
      max-width:460px;

    }

    .logo{

      height:76px;

      border-radius:24px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary2)
        );

      color:white;

      display:grid;
      place-items:center;

      font-size:27px;
      font-weight:900;

      margin:
        0 auto 14px;

    h1,
    h2,
    h3{

    }

    .muted{
      color:var(--muted);

    }

    .tabs{
      display:flex;

    }

    .tab{

      border-radius:12px;

      color:#5b4b70;
    }

    .tab.active{
      background:var(--primary);
      color:white;
    }

    label{
      display:block;

      font-size:13px;
      font-weight:700;

      margin:
        10px 0 6px;
    }

    input,
    select,
    textarea{
      width:100%;

      padding:12px;

      border:
        1px solid var(--border);

      border-radius:12px;

      background:white;

      outline:none;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:var(--primary);
    }

    .btn{
      background:var(--primary);
      color:white;

      padding:
        12px 16px;

      border-radius:12px;

      font-weight:700;
    }

    .btn.secondary{
      background:#eee8f7;
      color:#4c3568;
    }

    .btn.ok{
      background:var(--successBg);
      color:#166534;
    }

    .btn.danger{
      background:var(--dangerBg);
      color:#991b1b;
    }

    .btn.warning{
      background:var(--warningBg);
      color:#9a3412;
    }

    .btn.small{
      padding:
        8px 11px;

      font-size:12px;
    }

    .btn.full{
      width:100%;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .row>*{
      flex:1;
      min-width:140px;
    }

    .grid{
      display:grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px,1fr)
        );

      gap:12px;
    }

    .stat{
      padding:16px;

      border-radius:16px;

      background:#faf8fd;

      border:
        1px solid var(--border);
    }

    .stat b{
      font-size:25px;

      display:block;

      margin-top:5px;
    }

    .badge{
      display:inline-block;

      padding:
        5px 9px;

      border-radius:999px;

      font-size:11px;
      font-weight:700;
    }

    .waiting{
      background:var(--warningBg);
      color:var(--warning);
    }

    .registered{
      background:var(--successBg);
      color:#166534;
    }

    .graduate{
      background:var(--graduateBg);
      color:var(--graduate);
    }

    .student{
      border:
        1px solid var(--border);

      border-radius:15px;

      padding:14px;

      margin:
        10px 0;

      background:#fff;
    }

    .studenthead{
      display:flex;

      justify-content:space-between;

      gap:8px;

      align-items:flex-start;
    }

    .actions{
      display:flex;

      gap:7px;

      flex-wrap:wrap;

      margin-top:12px;
    }

    .nav{
      position:fixed;

      bottom:0;
      left:0;
      right:0;

      background:white;

      border-top:
        1px solid var(--border);

      z-index:20;
    }

    .navin{
      max-width:700px;

      margin:auto;

      display:flex;
    }

    .nav button{
      flex:1;

      background:white;

      padding:
        11px 4px;

      color:#6b6175;

      font-size:11px;
    }

    .nav button.active{
      color:var(--primary);
      font-weight:800;
    }

    .notice{
      padding:
        11px 13px;

      border-radius:12px;

      margin:
        10px 0;

      font-size:13px;
    }

    .notice.err{
      background:var(--dangerBg);
      color:#991b1b;
    }

    .notice.ok{
      background:var(--successBg);
      color:#166534;
    }

    .notice.info{

      color:#5b21b6;
    }

    .modal{
      position:fixed;

      inset:0;

      background:#160b255c;

      display:grid;

      place-items:center;

      padding:15px;

    }

    .modalbox{
      width:min(600px,100%);

      max-height:90vh;

      background:white;

      border-radius:20px;

      padding:18px;

      color:var(--muted);
    }

    .filterbar{
      display:flex;

      gap:7px;

      overflow-x:auto;

      margin:
        12px 0;
    }

    .filter{
      white-space:nowrap;

      background:#f0ebf8;

      color:#5b4b70;

      padding:
        9px 13px;

      border-radius:999px;

      font-size:12px;
    }

    .filter.active{
      background:var(--primary);
      color:white;
    }

    .adminTitle{
      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:10px;

      flex-wrap:wrap;
    }

    .dangerText{
      color:var(--danger);

      font-size:12px;

      margin-top:7px;
    }

    .infoLine{
      font-size:12px;

      color:var(--muted);

    }

    .divider{

    }

    @media(max-width:500px){

      }

      }

          12px 10px 90px;
      }

        padding:14px;
      }

      }

      }

    }

  </style>

</head>


<body>

<div id="app"></div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";


const { createClient } = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
===================================================== */

const state = {

  user:null,

  profile:null,

  isAdmin:false,

  students:[],

  courses:[],

  loginMode:"student",

  adminFilter:"all",

  search:""

};


/* =====================================================
   HELPERS
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[m];

      }
    );

}


function notice(
  text,
  type="info"
){

  const old =
    document.getElementById("notice");

  if(old){
    old.remove();
  }


  const box =
    document.createElement("div");

  box.id="notice";

  box.className =
    "notice " + type;

  box.textContent=text;


  const wrap =
    document.querySelector(".wrap");

  if(wrap){

    wrap.prepend(box);

  }


  setTimeout(
    function(){

      if(box){
        box.remove();
      }

    },
    5000
  );

}


function studentEmail(phone){

  return String(phone || "")
    .replace(/\D/g,"")
    + "@alinagheli.com";

}


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  const result =
    await db.auth.getSession();


  const session =
    result.data.session;


  if(session){

    state.user =
      session.user;

    await loadIdentity();

  }else{

    renderLogin();

  }


  db.auth.onAuthStateChange(
    async function(
      event,
      session
    ){

      if(session){

        state.user =
          session.user;

        await loadIdentity();

      }else{

        state.user=null;

        state.profile=null;

        state.isAdmin=false;

        renderLogin();

      }

    }
  );

}


/* =====================================================
   IDENTITY
===================================================== */

async function loadIdentity(){

  state.isAdmin=false;

  state.profile=null;


  if(!state.user){

    renderLogin();

    return;

  }


  const adminResult =
    await db
      .from("admins")
      .select("id,user_id")
      .eq(
        "user_id",
        state.user.id
      )
      .maybeSingle();


  if(adminResult.data){

    state.isAdmin=true;

    await loadAdminData();

    renderApp();

    return;

  }


  const studentResult =
    await db
      .from("students")
      .select("*")
      .eq(
        "auth_user_id",
        state.user.id
      )
      .maybeSingle();


  state.profile =
    studentResult.data || null;


  renderApp();

}


/* =====================================================
   COURSES
===================================================== */

async function loadCourses(){

  const result =
    await db
      .from("courses")
      .select("*")
      .order("id");


  if(!result.error){

    state.courses =
      result.data || [];

  }

}


/* =====================================================
   ADMIN DATA
===================================================== */

async function loadAdminData(){

  await loadCourses();


  const result =
    await db
      .from("students")
      .select("*")
      .order(
        "id",
        {
          ascending:false
        }
      );


  if(!result.error){

    state.students =
      result.data || [];

  }else{

    state.students=[];

    console.error(
      result.error
    );

  }

}


/* =====================================================
   HEADER
===================================================== */

function header(){

  return `

  <div class="top">

    <div class="toprow">

      <div>

        <div class="brand">
          AliNagheli English
        </div>

        <div class="sub">
          ${
            state.isAdmin
              ? "پنل مدیریت"
              : "پنل زبان‌آموز"
          }
        </div>

      </div>


      <button
        class="btn secondary small"
        onclick="logout()">

        خروج

      </button>

    </div>

  </div>

  `;

}


/* =====================================================
   LOGIN
===================================================== */

function renderLogin(){

  document.body.innerHTML=`

  <div class="wrap">

    <div class="card login">

      <div class="logo">
        AN
      </div>


      <h1 style="text-align:center">
        AliNagheli English
      </h1>


      <p
        class="muted"
        style="text-align:center">

        سامانه آموزش زبان انگلیسی

      </p>


      <div class="tabs">

        <button
          class="tab ${
            state.loginMode==="student"
              ? "active"
              : ""
          }"
          onclick="setLoginMode('student')">

          دانش‌آموز

        </button>


        <button
          class="tab ${
            state.loginMode==="admin"
              ? "active"
              : ""
          }"
          onclick="setLoginMode('admin')">

          مدیر

        </button>

      </div>


      <div id="loginForm"></div>

    </div>

  </div>

  `;


  renderLoginForm();

}


/* =====================================================
   LOGIN MODE
===================================================== */

function setLoginMode(mode){

  state.loginMode=mode;

  renderLogin();

}


/* =====================================================
   LOGIN FORM
===================================================== */

function renderLoginForm(){

  const box =
    document.getElementById(
      "loginForm"
    );


  if(state.loginMode==="admin"){

    box.innerHTML=`

      <label>
        ایمیل مدیر
      </label>

      <input
        id="email"
        type="email"
        placeholder="ایمیل مدیر"
        autocomplete="username">


      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور"
        autocomplete="current-password">


      <button
        class="btn full"
        style="margin-top:14px"
        onclick="loginAdmin()">

        ورود به پنل مدیریت

      </button>

    `;

  }else{

    box.innerHTML=`

      <label>
        شماره تلفن
      </label>

      <input
        id="phone"
        inputmode="tel"
        placeholder="0914...">


      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور">


      <button
        class="btn full"
        style="margin-top:14px"
        onclick="loginStudent()">

        ورود دانش‌آموز

      </button>


      <button
        class="btn secondary full"
        style="margin-top:8px"
        onclick="showRegister()">

        ثبت‌نام دانش‌آموز جدید

      </button>

    `;

  }

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function loginAdmin(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    notice(
      "ایمیل و رمز عبور را وارد کنید.",
      "err"
    );

    return;

  }


  const result =
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(result.error){

    console.error(
      result.error
    );

    notice(
      "ایمیل یا رمز عبور مدیر صحیح نیست.",
      "err"
    );

    return;

  }


  state.user =
    result.data.user;

  await loadIdentity();

}


/* =====================================================
   STUDENT LOGIN
===================================================== */

async function loginStudent(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if(!phone || !password){

    notice(
      "شماره تلفن و رمز عبور را وارد کنید.",
      "err"
    );

    return;

  }


  const result =
    await db.auth.signInWithPassword({

      email:
        studentEmail(phone),

      password:password

    });


  if(result.error){

    console.error(
      result.error
    );

    notice(
      "شماره تلفن یا رمز عبور نادرست است.",
      "err"
    );

    return;

  }


  state.user =
    result.data.user;

  await loadIdentity();

}


/* =====================================================
   REGISTER
===================================================== */

function showRegister(){

  document
    .getElementById("loginForm")
    .innerHTML=`

    <h3>
      ثبت‌نام دانش‌آموز جدید
    </h3>


    <div class="row">

      <div>

        <label>
          نام
        </label>

        <input id="r_first">

      </div>


      <div>

        <label>
          نام خانوادگی
        </label>

        <input id="r_last">

      </div>

    </div>


    <label>
      شماره تلفن
    </label>

    <input
      id="r_phone"
      inputmode="tel"
      placeholder="0914...">


    <label>
      رمز عبور
    </label>

    <input
      id="r_pass"
      type="password">


    <label>
      پایه / سطح
    </label>

    <input
      id="r_level"
      placeholder="مثلاً پایه نهم">


    <label>
      دوره
    </label>

    <select id="r_course">

      <option value="">
        انتخاب دوره
      </option>

    </select>


    <label>
      هدف
    </label>

    <textarea
      id="r_goal"
      rows="3"
      placeholder="هدف شما از یادگیری زبان">
    </textarea>


    <button
      class="btn full"
      style="margin-top:12px"
      onclick="registerStudent()">

      ثبت‌نام

    </button>


    <button
      class="btn secondary full"
      style="margin-top:8px"
      onclick="renderLogin()">

      بازگشت

    </button>

  `;


  loadCourses()
    .then(
      function(){

        const select =
          document.getElementById(
            "r_course"
          );


        if(!select)return;


        select.innerHTML =
          `<option value="">
            انتخاب دوره
          </option>`
          +

          state.courses
            .map(
              function(course){

                return `
                  <option value="${esc(course.title)}">
                    ${esc(course.title)}
                  </option>
                `;

              }
            )
            .join("");

      }
    );

}


/* =====================================================
   REGISTER STUDENT
===================================================== */

async function registerStudent(){

  const first =
    document
      .getElementById("r_first")
      .value
      .trim();


  const last =
    document
      .getElementById("r_last")
      .value
      .trim();


  const phone =
    document
      .getElementById("r_phone")
      .value
      .trim();


  const pass =
    document
      .getElementById("r_pass")
      .value;


  if(
    !first ||
    !last ||
    !phone ||
    !pass
  ){

    notice(
      "نام، نام خانوادگی، شماره تلفن و رمز عبور الزامی است.",
      "err"
    );

    return;

  }


  if(pass.length < 6){

    notice(
      "رمز عبور باید حداقل ۶ کاراکتر باشد.",
      "err"
    );

    return;

  }


  const email =
    studentEmail(phone);


  const auth =
    await db.auth.signUp({

      email:email,

      password:pass,

      options:{

        data:{

          first_name:first,

          last_name:last,

          phone:phone

        }

      }

    });


  if(auth.error){

    notice(
      auth.error.message,
      "err"
    );

    return;

  }


  if(!auth.data.user){

    notice(
      "حساب کاربری ساخته نشد.",
      "err"
    );

    return;

  }


  const payload={

    first_name:first,

    last_name:last,

    phone:phone,

    level:
      document
        .getElementById("r_level")
        .value
        .trim(),

    status:"waiting",

    auth_user_id:
      auth.data.user.id,

    password_created:true

  };


  const insert =
    await db
      .from("students")
      .insert(payload);


  if(insert.error){

    notice(
      "حساب ساخته شد اما ذخیره اطلاعات دانش‌آموز خطا داد: "
      +
      insert.error.message,
      "err"
    );

    return;

  }


  notice(
    "ثبت‌نام با موفقیت انجام شد و درخواست شما برای مدیر ارسال شد.",
    "ok"
  );


  setTimeout(
    function(){

      renderLogin();

    },
    1200
  );

}


/* =====================================================
   APP
===================================================== */

function renderApp(){

  document.body.innerHTML =
    header()
    +

    `<main class="wrap">
      <div id="content"></div>
    </main>`

    +

    (
      state.isAdmin
        ? adminNav()
        : studentNav()
    );


  if(state.isAdmin){

    renderAdmin();

  }else{

    renderStudent();

  }

}


/* =====================================================
   STUDENT NAV
===================================================== */

function studentNav(){

  return `

  <nav class="nav">

    <div class="navin">

      <button
        onclick="renderStudent()">

        🏠<br>
        خانه

      </button>


      <button
        onclick="loadMyProfile()">

        👤<br>
        پروفایل

      </button>

    </div>

  </nav>

  `;

}


/* =====================================================
   ADMIN NAV
===================================================== */

function adminNav(){

  return `

  <nav class="nav">

    <div class="navin">

      <button
        onclick="renderAdmin()">

        📊<br>
        داشبورد

      </button>


      <button
        onclick="renderAdminStudents()">

        👩‍🎓<br>
        دانش‌آموزان

      </button>


      <button
        onclick="renderAdminCourses()">

        📚<br>
        دوره‌ها

      </button>


      <button
        onclick="logout()">

        🚪<br>
        خروج

      </button>

    </div>

  </nav>

/* =====================================================

===================================================== */

function renderAdminStudents(
  filter="all"
){

  state.adminFilter =
    filter || state.adminFilter;


  document
    .getElementById("content")
    .innerHTML=`

    <div class="card">

      <div class="adminTitle">

        <div>

          <h2>
            مدیریت دانش‌آموزان
          </h2>

          <p class="muted">
            بررسی، تأیید، رد و تغییر وضعیت ثبت‌نام‌ها
          </p>

        </div>


        <button
          class="btn secondary small"
          onclick="refreshStudents()">

          🔄 بروزرسانی

        </button>

      </div>


      <input
        id="q"
        value="${esc(state.search)}"
        placeholder="جستجو بر اساس نام، شماره یا پایه..."
        oninput="state.search=this.value; filterStudents()">


      <div class="filterbar">

              ? "active"
              : ""
          }"

        </button>


        <button
          class="filter ${
            state.adminFilter==="waiting"
              ? "active"
              : ""
          }"
          onclick="renderAdminStudents('waiting')">

          (${
            state.students.filter(
              s=>s.status==="waiting"
            ).length
          })

        </button>


        <button
          class="filter ${
            state.adminFilter==="registered"
              ? "active"
              : ""
          }"
          onclick="renderAdminStudents('registered')">

          ✅ ثبت‌نام شده
          (${
            state.students.filter(
              s=>s.status==="registered"
            ).length
          })

        </button>


        <button
          class="filter ${
            state.adminFilter==="graduate"
              ? "active"
              : ""
          }"
          onclick="renderAdminStudents('graduate')">

          🎓 فارغ‌التحصیل
          (${
            state.students.filter(
              s=>s.status==="graduate"
            ).length
          })

        </button>

      <div id="studentList"></div>

/* =====================================================
   FILTER
===================================================== */

function filterStudents(){

  const q =
    (
      document
        .getElementById("q")
        ?.value
      ||
      state.search
      ||
      ""
    )
    .trim()
    .toLowerCase();


  state.search=q;


  let students =
    [...state.students];


  if(
    state.adminFilter !==
    "all"
  ){

    students =
      students.filter(
        s=>
          s.status ===
          state.adminFilter
      );

  }


  if(q){

    students =
      students.filter(
        function(s){

          const text =
            `
            ${s.first_name}
            ${s.last_name}
            ${s.phone}
            ${s.level}
            `
            .toLowerCase();


          return text.includes(q);

        }
      );

  }


  const list =
    document.getElementById(
      "studentList"
    );


  if(!list)return;


  list.innerHTML =
    students
      .map(studentCard)
      .join("")

    ||

    '<div class="empty">موردی پیدا نشد.</div>';

}


/* =====================================================
   STUDENT CARD
===================================================== */

function studentCard(s){

  const isWaiting =
    s.status==="waiting";


  const isRegistered =
    s.status==="registered";


  const isGraduate =
    s.status==="graduate";


  return `

    <div class="student">

      <div class="studenthead">

        <div>

          <b>
            ${esc(s.first_name)}
            ${esc(s.last_name)}
          </b>


          <div class="infoLine">

            📱
            ${esc(s.phone)}

          </div>


          <div class="infoLine">

            📚
            ${esc(s.level || "بدون سطح")}

          </div>

        </div>


        <div>

          ${statusBadge(s.status)}

        </div>

      </div>


      <div class="divider"></div>


      <div class="actions">

        ${
          isWaiting

          ?

          `

          <button
            class="btn ok small"
            onclick="confirmRegistration(${s.id})">

            ✅ تأیید ثبت‌نام

          </button>


          <button
            class="btn danger small"
            onclick="rejectStudent(${s.id})">

            ❌ رد / حذف

          </button>

          `

          :

          ""
        }


        ${
          isRegistered

          ?

          `

          <button
            class="btn secondary small"
            onclick="setStatus(${s.id},'graduate')">

            🎓 فارغ‌التحصیل

          </button>


          <button
            class="btn secondary small"
            onclick="setStatus(${s.id},'waiting')">

            ↩ بازگشت به صف

          </button>

          `

          :

          ""
        }


        ${
          isGraduate

          ?

          `

          <button
            class="btn secondary small"
            onclick="setStatus(${s.id},'registered')">

            ↩ فعال‌سازی مجدد

          </button>

          `

          :

          ""
        }

      </div>


      ${
        isWaiting

        ?

        `
        <div class="dangerText">
          در صورت رد کردن، درخواست این دانش‌آموز از لیست ثبت‌نام حذف می‌شود.
        </div>
        `

        :

        ""
      }

    </div>

  `;

}


/* =====================================================
   CONFIRM REGISTRATION
===================================================== */

async function confirmRegistration(
  id
){

  const student =
    state.students.find(
      s=>s.id===id
    );


  if(!student)return;


  const name =
    `${student.first_name} ${student.last_name}`;


  const confirmed =
    confirm(
      `آیا ثبت‌نام «${name}» را تأیید می‌کنید؟`
    );


  if(!confirmed)return;


  await setStatus(
    id,
    "registered",
    true
  );

}


/* =====================================================
   REJECT / DELETE
===================================================== */

async function rejectStudent(
  id
){

  const student =
    state.students.find(
      s=>s.id===id
    );


  if(!student)return;


  const name =
    `${student.first_name} ${student.last_name}`;


  const confirmed =
    confirm(
      `⚠️ درخواست «${name}» رد شود؟\n\nاین درخواست از جدول دانش‌آموزان حذف خواهد شد.`
    );


  if(!confirmed)return;


  const result =
    await db
      .from("students")
      .delete()
      .eq(
        "id",
        id
      );


  if(result.error){

    console.error(
      result.error
    );


    notice(
      "حذف انجام نشد: "
      +
      result.error.message,
      "err"
    );

    return;

  }


  state.students =
    state.students.filter(
      s=>s.id!==id
    );


  renderAdminStudents();


  notice(
    "درخواست ثبت‌نام رد و از لیست حذف شد.",
    "ok"
  );

}


/* =====================================================
   CHANGE STATUS
===================================================== */

async function setStatus(
  id,
  status,
  silent=false
){

  const result =
    await db
      .from("students")
      .update({
        status:status
      })
      .eq(
        "id",
        id
      );


  if(result.error){

    console.error(
      result.error
    );


    notice(
      result.error.message,
      "err"
    );

    return false;

  }


  const student =
    state.students.find(
      s=>s.id===id
    );


  if(student){

    student.status =
      status;

  }


  if(
    state.adminFilter !==
    "all"
  ){

    renderAdminStudents();

  }else{

    renderAdmin();

  }


  if(!silent){

    notice(
      "وضعیت با موفقیت تغییر کرد.",
      "ok"
    );

  }


  return true;

}
