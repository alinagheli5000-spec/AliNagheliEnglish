<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%23a855f7"/><stop offset="1" stop-color="%236d28d9"/></linearGradient></defs><rect x="15" y="25" width="70" height="55" rx="6" fill="url(%23g)"/><text x="50" y="62" font-size="28" font-weight="800" text-anchor="middle" fill="white" font-family="Arial">Ali</text></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Lalezar&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-grad-1:#f5f3ff;--bg-grad-2:#ede9fe;--text:#171717;--text-muted:#6b7280;--card-bg:#fff;--card-border:rgba(221,214,254,.5);--card-shadow:0 4px 24px rgba(109,40,217,.06);--primary:#6d28d9;--primary-dark:#4c1d95;--primary-light:#a855f7;--accent-pink:#ec4899;--neon-purple:#a855f7;--neon-pink:#ec4899;--neon-blue:#3b82f6;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--input-bg:#faf9ff;--input-border:#ede9fe}
[data-theme="dark"]{--bg-grad-1:#0f172a;--bg-grad-2:#1e1b4b;--text:#f1f5f9;--text-muted:#94a3b8;--card-bg:#1e293b;--card-border:rgba(109,40,217,.4);--card-shadow:0 4px 24px rgba(0,0,0,.3);--input-bg:#0f172a;--input-border:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 100%);background-attachment:fixed;color:var(--text);padding-bottom:96px;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;transition:all .2s ease}
button:active{transform:scale(.97)}

/* ============ Splash ============ */
.splash{position:fixed;inset:0;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10000;animation:splashOut .6s ease 1.6s forwards}
.splash .logo3d{width:240px;height:240px;animation:logoFloat 2.4s ease-in-out infinite,logoIn .9s cubic-bezier(.2,.8,.2,1)}
.splash .brand{margin-top:20px;font-size:24px;font-weight:800;color:#fff;letter-spacing:1px;text-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeInUp .6s ease .3s both}
.splash .sub{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:5px;margin-top:6px;animation:fadeInUp .6s ease .5s both}
@keyframes logoIn{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ============ Logo 3D ============ */
.logo3d{display:inline-block;position:relative;filter:drop-shadow(0 20px 45px rgba(168,85,247,.55))}
.logo3d svg{display:block;width:100%;height:100%}
.logo3d-sm{width:64px;height:64px}
.logo3d-md{width:120px;height:120px}
.logo3d-lg{width:190px;height:190px}
.logo3d-xl{width:240px;height:240px}

/* ============ Header ============ */
.header{background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 50%,#a855f7 100%);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 8px 32px rgba(109,40,217,.25);border-bottom:1px solid rgba(255,255,255,.1)}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brandBox{display:flex;align-items:center;gap:12px}
.brandTextBox{display:flex;flex-direction:column}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.2);line-height:1.2}
.logoSub{font-size:9px;opacity:.85;letter-spacing:2px;margin-top:2px}
.headerBtns{display:flex;gap:10px;align-items:center}
.iconBtn{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));color:white;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1;transition:all .3s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.iconBtn:hover{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.2));transform:translateY(-2px) scale(1.05);box-shadow:0 8px 24px rgba(168,85,247,.5),0 0 20px rgba(168,85,247,.4),inset 0 1px 0 rgba(255,255,255,.5);border-color:rgba(255,255,255,.6)}
.iconBtn:active{transform:scale(.95)}
.iconBtn svg{width:22px;height:22px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.iconBtn.logoutBtn{background:linear-gradient(135deg,rgba(239,68,68,.35),rgba(220,38,38,.15));border-color:rgba(252,165,165,.5)}
.iconBtn.logoutBtn:hover{background:linear-gradient(135deg,rgba(239,68,68,.5),rgba(220,38,38,.3));box-shadow:0 8px 24px rgba(239,68,68,.5),0 0 20px rgba(239,68,68,.4)}

/* ============ آیکون 3D خورشید و ماه ============ */
.iconBtn.themeBtn{perspective:600px;transform-style:preserve-3d}
.iconBtn.themeBtn svg{transform:rotateY(0deg);transition:transform .6s cubic-bezier(.2,.8,.2,1);animation:icon3dSpin 3s ease-in-out infinite}
@keyframes icon3dSpin{0%,100%{transform:rotateY(-12deg) rotateX(6deg)}50%{transform:rotateY(12deg) rotateX(-6deg)}}
.iconBtn.themeBtn.sunny{background:linear-gradient(135deg,rgba(251,191,36,.55),rgba(245,158,11,.25));border-color:rgba(252,211,77,.85);color:#fef3c7;box-shadow:0 0 0 1px rgba(252,211,77,.4),0 0 22px rgba(251,191,36,.65),inset 0 1px 0 rgba(255,255,255,.5)}
.iconBtn.themeBtn.sunny svg{filter:drop-shadow(0 0 8px #fbbf24) drop-shadow(0 0 16px #f59e0b);animation:icon3dSpin 3s ease-in-out infinite,sunGlow 2s ease-in-out infinite}
@keyframes sunGlow{0%,100%{filter:drop-shadow(0 0 8px #fbbf24) drop-shadow(0 0 16px #f59e0b)}50%{filter:drop-shadow(0 0 14px #fbbf24) drop-shadow(0 0 26px #f59e0b)}}
.iconBtn.themeBtn.moonly{background:linear-gradient(135deg,rgba(96,165,250,.4),rgba(59,130,246,.15));border-color:rgba(147,197,253,.65);color:#dbeafe;box-shadow:0 0 0 1px rgba(147,197,253,.35),0 0 22px rgba(96,165,250,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.iconBtn.themeBtn.moonly svg{filter:drop-shadow(0 0 8px #93c5fd) drop-shadow(0 0 16px #3b82f6);animation:icon3dSpin 3s ease-in-out infinite,moonGlow 2.5s ease-in-out infinite}
@keyframes moonGlow{0%,100%{filter:drop-shadow(0 0 8px #93c5fd) drop-shadow(0 0 16px #3b82f6)}50%{filter:drop-shadow(0 0 14px #bfdbfe) drop-shadow(0 0 26px #60a5fa)}}

/* ============ Welcome Hero 3D ============ */
.welcomeHero{position:relative;border-radius:32px;padding:44px 28px;margin-bottom:18px;background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 40%,#6d28d9 70%,#a855f7 100%);box-shadow:0 30px 80px -20px rgba(109,40,217,.6),0 0 0 1px rgba(168,85,247,.3),inset 0 1px 0 rgba(255,255,255,.15);overflow:hidden;perspective:1000px;transform-style:preserve-3d}
.welcomeHero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 25%,rgba(255,255,255,.18),transparent 55%),radial-gradient(circle at 85% 75%,rgba(236,72,153,.25),transparent 60%),radial-gradient(circle at 50% 100%,rgba(59,130,246,.15),transparent 55%);pointer-events:none}
.welcomeHero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);pointer-events:none}
.welcomeGlow{position:absolute;top:-40%;right:-15%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.55),transparent 70%);filter:blur(30px);animation:wGlow 6s ease-in-out infinite}
@keyframes wGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:.95}}
.welcomeRing{position:absolute;left:-120px;top:-120px;width:340px;height:340px;border-radius:50%;border:1.5px dashed rgba(196,181,253,.35);animation:wSpin 26s linear infinite}
.welcomeRing2{left:auto;top:auto;right:-140px;bottom:-140px;width:420px;height:420px;border:1.5px dashed rgba(251,191,36,.28);animation-direction:reverse;animation-duration:34s}
@keyframes wSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.welcomeParticles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.welcomeParticles span{position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fbbf24,#f59e0b);box-shadow:0 0 12px #fbbf24,0 0 22px rgba(251,191,36,.6);animation:wFloat 8s ease-in-out infinite}
.welcomeParticles span:nth-child(1){left:8%;top:20%;animation-delay:0s}
.welcomeParticles span:nth-child(2){left:24%;top:70%;animation-delay:1s;background:radial-gradient(circle,#ec4899,#db2777);box-shadow:0 0 12px #ec4899}
.welcomeParticles span:nth-child(3){left:48%;top:14%;animation-delay:2s}
.welcomeParticles span:nth-child(4){left:72%;top:60%;animation-delay:1.4s;background:radial-gradient(circle,#a855f7,#7c3aed);box-shadow:0 0 12px #a855f7}
.welcomeParticles span:nth-child(5){left:88%;top:30%;animation-delay:2.6s}
.welcomeParticles span:nth-child(6){left:56%;top:82%;animation-delay:.6s;background:radial-gradient(circle,#3b82f6,#2563eb);box-shadow:0 0 12px #3b82f6}
@keyframes wFloat{0%,100%{transform:translateY(0) scale(1);opacity:.6}50%{transform:translateY(-22px) scale(1.6);opacity:1}}
.welcome3d{position:relative;z-index:3;text-align:center;transform-style:preserve-3d;animation:wEntrance .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes wEntrance{from{opacity:0;transform:translateY(30px) rotateX(-12deg)}to{opacity:1;transform:translateY(0) rotateX(0)}}
.welcomeBadge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:99px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;letter-spacing:3px;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4)}
.badgeSpark{display:inline-block;animation:sparkle 2.4s ease-in-out infinite}
.badgeSpark:last-child{animation-delay:1.2s}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.4) rotate(180deg)}}
.welcomeTitle{margin:18px 0 10px;display:flex;flex-direction:column;gap:8px;font-weight:900;line-height:1.35;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.4);transform:translateZ(40px)}

/* ⭐ اسم علی ناقلی سه‌بعدی با گرادیان طلایی-مسی جدید */
.welcomeTitle .titleName{
  font-size:clamp(32px,6.5vw,56px);
  font-family:'Lalezar','Vazirmatn',sans-serif;
  background:linear-gradient(180deg,#fff8dc 0%,#fcd34d 25%,#f59e0b 50%,#ea580c 75%,#7c2d12 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:2px;
  transform:translateZ(60px) rotateX(8deg);
  position:relative;
  padding:6px 0;
  filter:drop-shadow(0 2px 0 #7c2d12) drop-shadow(0 4px 0 #92400e) drop-shadow(0 6px 0 #78350f) drop-shadow(0 10px 20px rgba(251,191,36,.75)) drop-shadow(0 0 30px rgba(245,158,11,.55));
  animation:namePulse3D 3.4s ease-in-out infinite;
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}
.welcomeTitle .titleName::before{
  content:"علی ناقلی";
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.3) 50%,transparent 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  transform:translateY(-2px);
  pointer-events:none;
  opacity:.6;
}
@keyframes namePulse3D{
  0%,100%{filter:drop-shadow(0 2px 0 #7c2d12) drop-shadow(0 4px 0 #92400e) drop-shadow(0 6px 0 #78350f) drop-shadow(0 10px 20px rgba(251,191,36,.75)) drop-shadow(0 0 30px rgba(245,158,11,.55));transform:translateZ(60px) rotateX(8deg) scale(1)}
  50%{filter:drop-shadow(0 3px 0 #7c2d12) drop-shadow(0 6px 0 #92400e) drop-shadow(0 9px 0 #78350f) drop-shadow(0 14px 32px rgba(251,191,36,1)) drop-shadow(0 0 50px rgba(236,72,153,.75));transform:translateZ(75px) rotateX(8deg) scale(1.04)}
}
.welcomeTitle .titleLine{font-size:clamp(18px,3.4vw,26px);color:rgba(255,255,255,.95);font-weight:700;letter-spacing:.5px}
.welcomeUser{display:inline-flex;align-items:center;gap:8px;margin:12px 0 16px;padding:10px 18px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:14px;font-weight:600;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.welcomeUser .userIcon{font-size:20px;animation:waveHand 2.6s ease-in-out infinite;transform-origin:70% 70%;display:inline-block}
@keyframes waveHand{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(18deg)}20%,40%{transform:rotate(-12deg)}}
.welcomeTip{margin-top:16px;font-size:13px;color:rgba(255,255,255,.85);font-weight:600;letter-spacing:.3px}

/* ⭐ بخش XP با جغد دانا */
.owlXpTrack{position:relative;margin:22px auto 0;max-width:560px;padding:16px 20px 20px;border-radius:24px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 26px rgba(0,0,0,.25)}
.owlXpHeader{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;font-size:13px;margin-bottom:14px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.owlXpHeader .xpLabel{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(251,191,36,.35),rgba(245,158,11,.15));padding:5px 12px;border-radius:99px;border:1px solid rgba(251,191,36,.5)}
.owlXpHeader .lvlLabel{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(168,85,247,.35),rgba(109,40,217,.15));padding:5px 12px;border-radius:99px;border:1px solid rgba(168,85,247,.5)}
.owlTrackWrap{position:relative;height:70px;margin-top:6px}
.owlTrack{position:absolute;left:8px;right:70px;top:50%;height:14px;transform:translateY(-50%);background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.15));border-radius:99px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.1);overflow:visible}
.owlTrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#ec4899,#a855f7);background-size:200% 100%;transition:width .8s cubic-bezier(.2,.8,.2,1);animation:shimmer 2s linear infinite;box-shadow:0 0 18px rgba(251,191,36,.75),0 0 32px rgba(236,72,153,.55);position:relative}
.owlTrack i::after{content:"";position:absolute;right:-2px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#fff,#fbbf24 60%,#f59e0b);box-shadow:0 0 20px #fbbf24,0 0 40px rgba(251,191,36,.85);animation:tipPulse 1.4s ease-in-out infinite}
@keyframes tipPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.35)}}
.owlChar{position:absolute;right:0;top:50%;transform:translateY(-50%);width:68px;height:68px;display:flex;align-items:flex-end;justify-content:center;transition:all .6s cubic-bezier(.2,.8,.2,1);animation:owlBounce 2.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes owlBounce{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(calc(-50% - 6px)) scale(1.04)}}
.owlChar.stage-1{animation:owlBounce 2.2s ease-in-out infinite,owlJoy 1s ease-in-out infinite}
.owlChar.stage-2{animation:owlBounce 2s ease-in-out infinite,owlJoy 0.9s ease-in-out infinite}
.owlChar.stage-3{animation:owlBounce 1.8s ease-in-out infinite,owlJoy 0.8s ease-in-out infinite}
.owlChar.stage-4{animation:owlBounce 1.6s ease-in-out infinite,owlJoy 0.7s ease-in-out infinite}
.owlChar.stage-5{animation:owlBounce 1.4s ease-in-out infinite,owlJoy 0.6s ease-in-out infinite}
@keyframes owlJoy{0%,100%{filter:drop-shadow(0 0 10px rgba(251,191,36,.7))}50%{filter:drop-shadow(0 0 22px rgba(251,191,36,1)) drop-shadow(0 0 40px rgba(236,72,153,.6))}}
.owlChar svg{width:100%;height:100%;overflow:visible}
.owlNote{text-align:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,.85);font-weight:600}
.owlNote b{color:#fbbf24;font-weight:800}

/* ============ بخش مشاوره ============ */
.consultBox{margin-top:14px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1.5px dashed rgba(255,255,255,.3);border-radius:20px;padding:16px;backdrop-filter:blur(8px)}
.consultTitle{color:#fff;font-weight:800;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.consultTitle .icon{font-size:20px;animation:ring 2s ease-in-out infinite;display:inline-block}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.consultRow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px;margin-bottom:8px;transition:all .25s ease;border:1px solid rgba(255,255,255,.1);text-decoration:none;color:#fff}
.consultRow:hover{background:rgba(0,0,0,.35);transform:translateX(-4px);border-color:rgba(255,255,255,.3);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.consultRow:last-child{margin-bottom:0}
.consultInfo{display:flex;align-items:center;gap:10px}
.consultAvatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#a855f7,#7c3aed);box-shadow:0 4px 12px rgba(168,85,247,.5);flex-shrink:0}
.consultName{font-weight:800;font-size:13px;color:#fff}
.consultPhone{font-size:11px;color:rgba(255,255,255,.75);direction:ltr;font-weight:600;letter-spacing:.5px;margin-top:2px}
.consultCallBtn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(34,197,94,.5);transition:all .2s;text-decoration:none}
.consultCallBtn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(34,197,94,.75)}
.consultCallBtn:active{transform:scale(.94)}

/* ============ دیکشنری کوچک ============ */
.dictMini{margin-top:14px;background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(37,99,235,.08));border:1.5px solid rgba(96,165,250,.4);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .25s ease;backdrop-filter:blur(6px)}
.dictMini:hover{background:linear-gradient(135deg,rgba(59,130,246,.3),rgba(37,99,235,.15));transform:translateY(-2px);box-shadow:0 10px 26px rgba(59,130,246,.4);border-color:rgba(147,197,253,.7)}
.dictMiniIcon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(59,130,246,.55);flex-shrink:0;color:#fff}
.dictMiniIcon svg{width:24px;height:24px;filter:drop-shadow(0 0 6px currentColor)}
.dictMiniContent{flex:1;color:#fff}
.dictMiniTitle{font-weight:800;font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px}
.dictMiniSub{font-size:11px;opacity:.85;margin-top:3px;font-weight:600}
.dictMiniArrow{font-size:20px;color:#fff;opacity:.7;transition:transform .2s}
.dictMini:hover .dictMiniArrow{transform:translateX(-4px);opacity:1}

/* ============ بقیه استایل‌ها ============ */
.container{max-width:1100px;margin:auto;padding:18px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card-bg);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:var(--card-shadow);border:1px solid var(--card-border)}

/* ⭐ بازی‌ها - کوچک‌تر */
.gameMenuGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gameCard{background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border:1.5px solid var(--card-border);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.gameCard:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(168,85,247,.25);border-color:var(--primary-light)}
.gameCard .recordBadge{position:absolute;top:6px;left:6px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;padding:2px 6px;border-radius:99px;font-size:9px;font-weight:800;box-shadow:0 3px 8px rgba(251,191,36,.5)}
.gameCard .gameEmoji{font-size:32px;margin-bottom:4px;display:block}
.gameCard h3{margin:4px 0 2px;font-size:12px;font-weight:800}
.gameCard p{font-size:9px;color:var(--text-muted);margin:2px 0 0;line-height:1.5}
.gameCard.adult{border-color:rgba(236,72,153,.5);background:linear-gradient(135deg,rgba(236,72,153,.1),rgba(168,85,247,.08))}
.gameCard.adult:hover{border-color:#ec4899;box-shadow:0 12px 26px rgba(236,72,153,.35)}

.gameArea{background:var(--card-bg);border-radius:24px;padding:24px;text-align:center;position:relative;overflow:hidden;margin-top:16px}
.gameWord{font-size:42px;font-weight:800;direction:ltr;background:linear-gradient(135deg,var(--primary),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:20px 0;letter-spacing:6px}
.gameEmojiBig{font-size:120px;line-height:1;margin:20px 0;filter:drop-shadow(0 10px 30px rgba(168,85,247,.4))}
.gameOptions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.gameOptions .option{margin:0;text-align:center;font-size:16px;font-weight:700}
.gameTimer{height:8px;background:var(--bg-grad-2);border-radius:99px;overflow:hidden;margin:16px 0}
.gameTimer i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);transition:width 1s linear}
.gameScoreBig{font-size:56px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}
.levelCard{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px dashed #f59e0b;border-radius:24px;padding:28px;text-align:center}
.levelCard .lvl{font-size:64px;font-weight:800;background:linear-gradient(135deg,#f59e0b,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
[data-theme="dark"] .levelCard{background:linear-gradient(135deg,#78350f,#451a03)}

/* ⭐ دیکشنری صفحه */
.dictSearchBox{background:var(--card-bg);border:2px solid var(--card-border);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:var(--card-shadow)}
.dictSearchInput{width:100%;border:2px solid var(--input-border);border-radius:16px;padding:14px 16px;font-size:15px;background:var(--input-bg);color:var(--text);outline:none;font-weight:600}
.dictSearchInput:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.dictFilters{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.dictFilters::-webkit-scrollbar{display:none}
.dictFilter{padding:8px 14px;border:0;border-radius:12px;background:var(--input-bg);white-space:nowrap;font-weight:700;color:var(--text-muted);font-size:12px;transition:all .2s;cursor:pointer}
.dictFilter.active{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;box-shadow:0 4px 12px rgba(109,40,217,.35)}
.dictGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dictCard{background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border:1px solid var(--card-border);border-radius:14px;padding:12px;transition:all .2s;cursor:pointer;position:relative}
.dictCard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(109,40,217,.15);border-color:var(--primary-light)}
.dictCard .dictEn{direction:ltr;color:var(--primary);font-weight:800;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.dictCard .dictFa{font-size:12px;color:var(--text-muted);font-weight:600}
.dictCard .dictGrade{position:absolute;top:8px;left:8px;background:rgba(168,85,247,.15);color:var(--primary);padding:2px 8px;border-radius:99px;font-size:9px;font-weight:800}
.dictEmpty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.dictEmpty .icon{font-size:52px;display:block;margin-bottom:12px;opacity:.5}
.dictStats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dictStat{background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:1px solid var(--card-border);border-radius:14px;padding:10px 14px;font-size:12px;font-weight:700;color:var(--primary-dark);display:flex;align-items:center;gap:6px}
[data-theme="dark"] .dictStat{color:#c4b5fd}

.qaMsg{border-radius:16px;padding:14px;margin:10px 0;max-width:85%;line-height:1.9;font-size:14px}
.qaMsg.student{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e3a8a;margin-right:auto;margin-left:0;border-bottom-right-radius:4px}
.qaMsg.teacher{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534;margin-left:auto;margin-right:0;border-bottom-left-radius:4px}
[data-theme="dark"] .qaMsg.student{background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#dbeafe}
[data-theme="dark"] .qaMsg.teacher{background:linear-gradient(135deg,#166534,#14532d);color:#dcfce7}
.qaMsg .meta{font-size:10px;opacity:.75;margin-bottom:6px;font-weight:700}
.qaThread{background:var(--bg-grad-1);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin-bottom:12px}
.qaStatus{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
.qaStatus.open{background:#fef3c7;color:#92400e}
.qaStatus.answered{background:#dcfce7;color:#166534}
[data-theme="dark"] .qaStatus.open{background:#78350f;color:#fde68a}
[data-theme="dark"] .qaStatus.answered{background:#14532d;color:#bbf7d0}
.hwCard{background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;padding:16px;margin-bottom:12px}
.hwCard h4{margin:0 0 8px;font-size:15px}
.hwCard .hwMeta{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.hwStatus{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
.hwStatus.pending{background:#fef3c7;color:#92400e}
.hwStatus.submitted{background:#dbeafe;color:#1e40af}
.hwStatus.graded{background:#dcfce7;color:#166534}
[data-theme="dark"] .hwStatus.pending{background:#78350f;color:#fde68a}
[data-theme="dark"] .hwStatus.submitted{background:#1e3a8a;color:#bfdbfe}
[data-theme="dark"] .hwStatus.graded{background:#14532d;color:#bbf7d0}
.referBox{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px dashed #f59e0b;border-radius:20px;padding:20px;text-align:center}
.referCode{font-family:monospace;font-size:22px;font-weight:800;letter-spacing:3px;color:#92400e;background:#fff;padding:12px;border-radius:12px;margin:10px 0;direction:ltr;text-align:center}
.demoBanner{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:12px 18px;border-radius:14px;margin-bottom:16px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.examDate{display:inline-block;background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#5b21b6;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;margin-right:8px;letter-spacing:.5px}
[data-theme="dark"] .examDate{background:linear-gradient(135deg,#4c1d95,#312e81);color:#c4b5fd}
.pcal{background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin:8px 0}
.pcalHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.pcalNav{background:var(--bg-grad-2);border:0;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:800;color:var(--primary)}
.pcalGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pcalDayName{font-size:10px;color:var(--text-muted);text-align:center;font-weight:700;padding:6px 0}
.pcalDay{aspect-ratio:1;border-radius:10px;background:var(--bg-grad-1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:all .2s}
.pcalDay:hover{background:var(--bg-grad-2);border-color:var(--primary-light)}
.pcalDay.selected{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 12px rgba(109,40,217,.4)}
.pcalDay.empty{background:transparent;cursor:default;pointer-events:none}
.pcalDay.today{border:2px solid var(--accent-pink)}
.leaderRow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:8px;background:var(--bg-grad-1);border:1px solid var(--card-border)}
.leaderRow.me{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#f59e0b}
.leaderRank{font-size:20px;font-weight:800;min-width:36px;text-align:center}
.leaderName{flex:1;font-weight:700}
.leaderXP{font-weight:800;color:var(--primary)}

@media(min-width:900px){body{padding-bottom:24px}.bottom{top:auto;bottom:20px;left:50%;right:auto;transform:translateX(-50%);width:min(700px,calc(100% - 40px));height:74px;border-radius:22px;border:1px solid var(--card-border);box-shadow:0 12px 40px rgba(109,40,217,.2)}.floatWhats{bottom:110px}}
@media(max-width:600px){.container{padding:12px}.card{padding:18px;border-radius:20px}.hero{padding:24px;border-radius:24px}.hero h1{font-size:26px}.hero h2{font-size:17px}.lessonGrid{grid-template-columns:1fr}.wordGrid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.score{font-size:52px}.loginCard{padding:24px}.landingHero{padding:50px 16px 70px}.logo3d-xl{width:180px;height:180px}.splash .logo3d{width:180px;height:180px}.gameWord{font-size:32px}.gameOptions{grid-template-columns:1fr}.gameEmojiBig{font-size:90px}.dailyTipBox .tipTitle{font-size:24px}.welcomeHero{padding:32px 18px;border-radius:26px}.welcomeTitle .titleName{font-size:clamp(28px,8vw,42px)}.owlTrackWrap{height:60px}.owlChar{width:56px;height:56px}.gameMenuGrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.gameCard .gameEmoji{font-size:28px}}
</style>

function getOwlSVG(stage){
  // stage 1 تا 5 — هرچی بالاتر، بزرگ‌تر، چاق‌تر، خوشگل‌تر
  const stages = {
    1: { bodyColor:"#a78bfa", bellyColor:"#ddd6fe", eyeSize:3.5, hasCrown:false, hasGlasses:false, hasBook:false, featherCount:2, size:0.85, chubby:1.0 },
    2: { bodyColor:"#8b5cf6", bellyColor:"#c4b5fd", eyeSize:3.8, hasCrown:false, hasGlasses:false, hasBook:true, featherCount:3, size:0.95, chubby:1.08 },
    3: { bodyColor:"#7c3aed", bellyColor:"#c4b5fd", eyeSize:4.0, hasCrown:false, hasGlasses:true, hasBook:true, featherCount:4, size:1.0, chubby:1.15 },
    4: { bodyColor:"#6d28d9", bellyColor:"#fbbf24", eyeSize:4.2, hasCrown:false, hasGlasses:true, hasBook:true, featherCount:5, size:1.05, chubby:1.25 },
    5: { bodyColor:"#5b21b6", bellyColor:"#f59e0b", eyeSize:4.5, hasCrown:true, hasGlasses:true, hasBook:true, featherCount:6, size:1.12, chubby:1.4 }
  };
  const s = stages[stage] || stages[1];
  const scale = s.size;
  const cw = 60 * s.chubby;

  // feathers / crown / book
  let extras = "";
  if(s.hasCrown){
    extras += `<path d="M 30 8 L 34 2 L 38 8 L 42 4 L 42 12 L 18 12 L 18 4 L 22 8 L 26 2 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="22" cy="6" r="1" fill="#ef4444"/><circle cx="30" cy="4" r="1" fill="#22c55e"/><circle cx="38" cy="6" r="1" fill="#3b82f6"/>`;
  }
  if(s.hasGlasses){
    extras += `<circle cx="24" cy="42" r="7" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="42" cy="42" r="7" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <line x1="31" y1="42" x2="35" y2="42" stroke="#fbbf24" stroke-width="1.2"/>`;
  }
  if(s.hasBook){
    extras += `<g transform="translate(52,58) rotate(-15)"><rect x="0" y="0" width="14" height="10" rx="1" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.6"/><line x1="1" y1="3" x2="13" y2="3" stroke="#fef3c7" stroke-width="0.6"/><line x1="1" y1="6" x2="13" y2="6" stroke="#fef3c7" stroke-width="0.6"/></g>`;
  }

  // feathers on body
  let feathers = "";
  for(let i=0;i<s.featherCount;i++){
    const y = 62 + i*2.5;
    feathers += `<path d="M ${30-s.featherCount*1.5+i*3} ${y} q 3 2 6 0" stroke="rgba(255,255,255,.4)" stroke-width="0.8" fill="none"/>`;
  }

  return `<svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg" style="width:${cw}px;height:80px">
    <defs>
      <radialGradient id="owlBodyG_${stage}" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="#c4b5fd"/>
        <stop offset="0.5" stop-color="${s.bodyColor}"/>
        <stop offset="1" stop-color="#4c1d95"/>
      </radialGradient>
      <radialGradient id="owlBellyG_${stage}" cx="50%" cy="40%" r="70%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="${s.bellyColor}"/>
      </radialGradient>
      <radialGradient id="owlEyeG_${stage}" cx="35%" cy="30%" r="70%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#e0e7ff"/>
      </radialGradient>
      <radialGradient id="owlPupilG_${stage}" cx="40%" cy="35%" r="60%">
        <stop offset="0" stop-color="#1e293b"/>
        <stop offset="1" stop-color="#000000"/>
      </radialGradient>
    </defs>
    <!-- Wing left -->
    <path d="M 8 ${38*scale} Q 2 ${48*scale} 8 ${58*scale} Q 12 ${52*scale} 14 ${44*scale} Z" fill="${s.bodyColor}" stroke="#4c1d95" stroke-width="0.5"/>
    <!-- Wing right -->
    <path d="M 52 ${38*scale} Q 58 ${48*scale} 52 ${58*scale} Q 48 ${52*scale} 46 ${44*scale} Z" fill="${s.bodyColor}" stroke="#4c1d95" stroke-width="0.5"/>
    <!-- Body -->
    <ellipse cx="30" cy="${52*scale}" rx="${20*s.chubby}" ry="${22*scale}" fill="url(#owlBodyG_${stage})" stroke="#4c1d95" stroke-width="0.7"/>
    <!-- Belly -->
    <ellipse cx="30" cy="${56*scale}" rx="${13*s.chubby}" ry="${15*scale}" fill="url(#owlBellyG_${stage})" opacity="0.95"/>
    ${feathers}
    <!-- Feet -->
    <path d="M 24 ${72*scale} l -3 4 M 24 ${72*scale} l 0 4 M 24 ${72*scale} l 3 4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 36 ${72*scale} l -3 4 M 36 ${72*scale} l 0 4 M 36 ${72*scale} l 3 4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Head (ear tufts) -->
    <path d="M 16 ${24*scale} Q 14 ${14*scale} 20 ${16*scale} Q 22 ${22*scale} 24 ${26*scale} Z" fill="${s.bodyColor}" stroke="#4c1d95" stroke-width="0.5"/>
    <path d="M 44 ${24*scale} Q 46 ${14*scale} 40 ${16*scale} Q 38 ${22*scale} 36 ${26*scale} Z" fill="${s.bodyColor}" stroke="#4c1d95" stroke-width="0.5"/>
    <!-- Head -->
    <ellipse cx="30" cy="${32*scale}" rx="${18*s.chubby}" ry="${17*scale}" fill="url(#owlBodyG_${stage})" stroke="#4c1d95" stroke-width="0.7"/>
    <!-- Face plate -->
    <ellipse cx="30" cy="${34*scale}" rx="${14*s.chubby}" ry="${11*scale}" fill="url(#owlEyeG_${stage})" opacity="0.55"/>
    <!-- Eyes -->
    <circle cx="${24*s.chubby/1.15+6}" cy="${32*scale}" r="${s.eyeSize}" fill="url(#owlEyeG_${stage})" stroke="#4c1d95" stroke-width="0.6"/>
    <circle cx="${48-6*s.chubby/1.15}" cy="${32*scale}" r="${s.eyeSize}" fill="url(#owlEyeG_${stage})" stroke="#4c1d95" stroke-width="0.6"/>
    <!-- Pupils -->
    <circle cx="${25*s.chubby/1.15+6}" cy="${32*scale}" r="${s.eyeSize*0.55}" fill="url(#owlPupilG_${stage})"/>
    <circle cx="${47-6*s.chubby/1.15}" cy="${32*scale}" r="${s.eyeSize*0.55}" fill="url(#owlPupilG_${stage})"/>
    <!-- Eye highlights -->
    <circle cx="${23.5*s.chubby/1.15+6}" cy="${30.5*scale}" r="${s.eyeSize*0.25}" fill="#ffffff" opacity="0.95"/>
    <circle cx="${45.5-6*s.chubby/1.15}" cy="${30.5*scale}" r="${s.eyeSize*0.25}" fill="#ffffff" opacity="0.95"/>
    <!-- Beak -->
    <path d="M 30 ${36*scale} L 27 ${41*scale} L 33 ${41*scale} Z" fill="#f59e0b" stroke="#b45309" stroke-width="0.5" stroke-linejoin="round"/>
    ${extras}
    <!-- Sparkles around high stages -->
    ${stage>=4?`<circle cx="6" cy="20" r="1.5" fill="#fbbf24"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="18" r="1.5" fill="#ec4899"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>`:""}
    ${stage>=5?`<circle cx="4" cy="48" r="1.5" fill="#22c55e"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="56" cy="50" r="1.5" fill="#3b82f6"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <path d="M 2 34 l 2 -2 M 58 34 l -2 -2" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>`:""}
  </svg>`;
}

 ["کاربرد ۶ حال کامل","برای بیان عمل یا حالتی که از گذشته تا حالا چندین بار تکرار شده است.","My mother has cooked spaghetti three times this week.",""],
 ["کاربرد ۷ حال کامل","عمل و یا دستاوردی که در طول زندگی توسط ما یا دیگران صورت گرفته و زمان دقیق آن مشخص نیست.","I have eaten Japanese food many times. / I ate Japanese food three months ago.","اگر زمان دقیق مشخص باشد، گذشته ساده"],
 ["for و since","for: به مدت / since: از","for (two hours, three weeks) / since (nine o'clock, Monday, 2007)","I have been in this office for eight years. / I have been in this office since 2012."],
 ["already","قبلاً، پیش از این","A: I have already done it.","کار زودتر از زمان مورد انتظار انجام شده است."],
 ["just","چند لحظه قبل، تازه","B: Yes, I have just got up.","چند لحظه قبل انجام شده."],
 ["yet","هنوز - در آخر جملات منفی و سوالی","Have they arrived yet? / We haven't finished our homework yet.","منتظر انجام کاری هستیم."],
 ["so far / up to now","تاکنون - در آخر جملات ماضی نقلی","We have completed 17 lessons so far.",""],
 ["ever و never","ever: تا حالا / never: هرگز","Have you ever been to China? / No, I have never been to China.",""],
 ["recently و lately","قبل از فعل اصلی و بعد از have/has یا در آخر جمله","She hasn't written to me recently. / I have been very busy lately.",""],
 ["عبارت‌های زمانی حال کامل","1) if clause 2) قید تکرار 3) تعداد دفعات","He has put his comb in his pocket. / I have visited the zoo several times.",""],
 ["حال کامل در جملات وصفی","بعد از صفات عالی، اعداد ترتیبی، the only، the first","This is the first time she has been to Shiraz.","جمله اصلی زمان حال است."],
 ["تغییرات فعل در حال کامل","1) افعال ختم به e: فقط d 2) افعال ختم به y 3) افعال تک‌سیلابی: حرف بی‌صدا دوبار","close → closed / enjoy → enjoyed / ban → banned / prefer → preferred",""],
 ["Phrasal Verbs (افعال چند بخشی)","ترکیب فعل با حرف اضافه یا قید که معنی جدیدی می‌سازد.","go through (تحمل کردن) / look after (مراقب بودن) / turn on (روشن کردن)",""],
 ["افعال دو کلمه‌ای جداشدنی","1) متعدی باشند 2) حرف اضافه یکی از: on, off, in, out, up, down, back, over","put on / turn on / turn off / call up",""],
 ["افعال دو کلمه‌ای جدانشدنی","1) لازم باشند 2) یا حرف اضافه غیر از حروف بالا","get up (بیدار شدن) / come back (برگشتن) / look for (جستجو کردن)","فعل و حرف اضافه جدا نمی‌شوند."],
 ["افعال دوکلمه‌ای مهم","call up, call off, call on, call back, call in, bring about, bring up, catch up with, check in, check into, check out, cheer up, come across, ask out","—","—"],
 ["افعال دوکلمه‌ای جداشدنی رایج","clean up, cross out, do over, drop off, figure out, fill out, find out, get back from, get in, get into, get off, get out of, get over, give up, go over, grow up, hang up, keep out of, look into, look over, look up, make up, pass away, pick out, pick up, point out, put off, put on, put out, put up with, run into, run out, show up, take after, take off, take out, take up, tear down, tear up, throw out, throw away, try on, turn down, turn off, turn on, turn out, turn up, give back, add up, wake up","—","—"],
 ["صفات + حروف اضافه","هیچ قانون مشخصی وجود ندارد و باید حفظ شوند.","afraid of / kind of / proud of / rude of / smart of / sick of, tired of / silly of / stupid of",""],
 ["صفت + of","برای بیان حالات روحی یا فیزیکی مثل ترس، خستگی، عصبانیت","Sam is afraid of dogs. / How kind of you to come early.",""],
 ["صفت + to","توصیف رفتار، حالت یا ارتباط بین اشیاء و اشخاص","accustomed to / addicted to / committed to / friendly to, good to, kind to, nice to / married to / mean to, rude to / opposed to / similar to",""],
 ["صفت + about","بیان یک شرایط یا حالت خاص","angry about / anxious about, nervous about, worried about / excited about / happy about / sad about / sorry about, upset about",""],
 ["صفت + for","بیان اهداف یا دلایل مختلف","famous for / known for / responsible for","Texas is famous for rodeos. / Australia is known for its large kangaroo population."],
 ["صفت + with","بیان دلیل بروز یک احساس یا ارتباط","angry with, furious with / annoyed with, fed up with / bored with / content with / fine with / OK with / disappointed with / pleased with",""],
 ["صفت + at/by","amazed, astonished, shocked, surprised","The man was amazed at/by the number of people. / I'm shocked at/by his behavior.",""],
 ["صفت + at","good at, terrible at","James is good at playing the guitar.",""],
 ["صفت + in","interested in, involved in","Bernard is interested in joining the school band.",""],
 ["صفت + from","different from, protected from, tired from","Turquoise is different from blue. / We were protected from the storm.",""],
 ["صفات با چند حرف اضافه","sorry about/for / disappointed with/in","She's very sorry about the mistake. / Mark is disappointed with the decision.",""],
 ["happy for vs happy about","happy for + people / happy about + thing/event","I'm so happy for them. / I'm so happy about the wedding.",""],
 ["angry with vs angry about","angry with + person / angry about + gerund","Dad is angry with Elizabeth. / Dad is angry about Elizabeth's sneaking out.",""],
 ["Gerund (اسم مصدر)","فعل + ing که نقش اسم را دارد.","Studying is hard. / I enjoy reading. / Reading helps you learn English.",""],
 ["Gerund به عنوان فاعل","Eating too much food makes people fat. / Not doing her homework caused her to fail the test.","—",""],
 ["Gerund بعد از افعال خاص","enjoy, avoid, dislike, postpone, mind, suggest, finish, consider, deny, admit, keep, practice, risk, quit, imagine","He avoids talking to his friend. / She dislikes watching horror movies.",""],
 ["Gerund به عنوان مکمل فاعل","بعد از فعل to be","My favorite hobby is reading. / Her problem is not coming to class on time.",""],
 ["Gerund بعد از حرف اضافه","after, before, without, from, to, of, with, for, against, at, about, by, in, on, through, out, over, up, down, among, between, towards, into","I will call you after arriving in London. / She is good at learning languages.",""],
 ["ترکیبات با Gerund","It's no good / It's no use / can't stand / can't help / to be busy / couldn't help / don't mind / feel like / how about / spend one's time / there's no / there's no point / what about / worth","It is no good going outside in this rainy day. / How about walking home instead of taking the car?",""],
 ["نکات مهم Gerund","1) ing در حال استمراری جزء اسم مصدر نیست 2) بعد از صفت ملکی یا s' می‌آید 3) منفی: not + gerund","I'm playing football. (حال استمراری) / I appreciate her speaking. / When I'm on Vacation, I enjoy not having to get up early.",""],
 ["go + gerund","برای ورزش‌های تفریحی","go fishing, go skiing, go skating, go shopping, go swimming, go running, go jogging, go sailing",""],
 ["Gerund به عنوان فاعل مفرد/جمع","یک gerund → فعل مفرد / دو gerund → فعل جمع","Walking makes me happy. / Cycling and jogging are my favorite sports.",""],
 ["No + gerund","برای هشدار و جلوگیری","No parking, No smoking, No swimming, No fishing",""]

 ["Reference (رفرنس یا مرجع)","کلمات جهت جلوگیری از تکرار نام انسان‌ها، مکان‌ها، ایده‌ها","—",""],
 ["متضادها (Antonyms)","پرکاربردترین کلمات متضاد","absent x present / accept x decline / alive x dead / always x never / ancient x modern / beautiful x ugly / big x little / brave x cowardly / careful x careless / cheap x expensive / dark x light / day x night / early x late / east x west / easy x hard / empty x full / fast x slow / happy x sad / hot x cold / long x short / new x old / open x closed / polite x rude / rich x poor / safe x unsafe / strong x weak / sunny x cloudy",""],
 ["First Conditional (شرطی نوع اول)","If + حال ساده, will/won't + مصدر بدون to","از جملات شرطی نوع اول برای بیان یک شرط ممکن و یک نتیجه محتمل در آینده استفاده می‌شود.",""],
 ["ساختار شرطی نوع اول","If + حال ساده, will/won't + مصدر بدون to","If I work hard, I will pass my exams. / If we leave now, we'll catch the 10.30 train.",""],
 ["نکته کاربردی شرطی نوع اول","می‌توان از افعال کمکی مثل may, can, should, must نیز استفاده کرد","If you pull the cat's tail, it may scratch you.",""],
 ["سوالی کردن شرطی نوع اول","جواب شرط را سوالی می‌کنیم","Will you eat less rice if you want to lose weight?",""],
 ["Present Participle و Past Participle","present Participle (ing): صفات فاعلی، نشانه اثرگذاری / Past Participle (ed): صفات مفعولی، نشانه اثرپذیری","—",""],
 ["صفت فاعلی","ing + افعال","My friend is boring. / This song is interesting. / Sara was confused by the confusing street signs.",""],
 ["صفت مفعولی","ed + افعال","My friend is bored. / We are interested in this kind of songs. / They were frightened by the frightening noises.",""],
 ["لیست صفات فاعلی و مفعولی","Alarming/Alarmed, Amusing/Amused, Annoying/Annoyed, Astonishing/Astonished, Boring/Bored, Confusing/Confused, Convincing/Convinced, Depressing/Depressed, Disappointing/Disappointed, Disgusting/Disgusted, Embarrassing/Embarrassed, Encouraging/Encouraged, Exhausting/Exhausted, Fascinating/Fascinated, Frightening/Frightened, Inspiring/Inspired, Interesting/Interested, Satisfying/Satisfied, Shocking/Shocked, Surprising/Surprised, Worrying/Worried","—",""],
 ["To + infinitive (مصدر با to)","در زبان انگلیسی به دو روش ساخته می‌شود: با پسوند ing و با حرف اضافه to","I decided not to go to London. / He asked me not to be late. / I'd rather not eat meat.",""],
 ["کاربرد ۱ - برای بیان دلیل و هدف","He bought some flowers to give to his wife. / We set off early in order to avoid the traffic.","—",""],
 ["کاربرد ۲ - بعد از افعال خاص","hope, hate, forget, expect, decide, choose, plan, mean, love, like, learn, intend, agree, would love, would like, want, remember, prefer, begin, need, tell, try, refuse, promise, seem, offer, wish, force, permit","They decided to start a business together. / Remember to turn the lights out.",""],
 ["کاربرد ۲ب - با مفعول مستقیم","She reminded me to turn the lights out. / He encouraged his friends to vote for him.","—",""],
 ["کاربرد ۳ - بعد از برخی صفات","Disappointed, Glad, Sad, Happy, Anxious, Pleased, Surprised, Proud, Unhappy","It is good of you to talk to me. / I am happy to be here.",""],
 ["کاربرد ۳ب - صفات خاص","Able to, Unable to, Due to, Likely to, Keen to, Eager to, Prepared to, Ready to, Unlikely, Unwilling to, Willing to","It's kind of you to help. / Unfortunately I was unable to work for over a week.",""],
 ["کاربرد ۳ج - نظر دادن","Possible, Easy, Difficult, Hard, Impossible, Right, Wrong, Nice, Clever, Silly, Foolish","It's easy to play the piano.",""],
 ["کاربرد ۴ - به عنوان وابسته‌های پسر","I have no desire to be rich. / They gave him an opportunity to escape.","—",""],
 ["کاربرد ۵ - به عنوان فاعل جمله","To understand statistics, that is our aim.","کاربرد رسمی و نوشتاری.",""],
 ["کاربرد ۶ - هدف استفاده از چیزی","The children need a garden to play in. / I don't have anything to wear.","—",""],
 ["کاربرد ۷ - همراه با قیود","too/enough + (صفت/قید/اسم) + مصدر با to","There's too much sugar to put in this bowl. / This soup is too hot to eat.",""],
 ["کاربرد ۷ - با ضمایر نامعین","something, someone, anyone + مصدر با to","When I am travelling I always take something to read. / I was all alone. I had no one to talk to.",""],
 ["To be or not to be","مکالمه انگلیسی - جمله معروف شکسپیر","To be or not to be, that is the question. / To know her is to love her.",""]

grammar[29]=[
 ["انواع سوال در انگلیسی","1) Yes/No questions 2) Wh-questions","برای ساختن جمله پرسشی بله و خیری با فعل to be، جای فاعل و فعل را عوض می‌کنیم.","مثال: Is Jack an English teacher? Yes, he is."],
 ["کلمات پرسشی Wh","What / Where / When / Who / How / Which / Why / How many / How much","فرم سوالی با کلمه پرسشی به سوال بله و خیری شبیه است.","Why does your friend visit you? / How many books did you buy?"],
 ["جملات با فعل کمکی","در جملاتی که فعل کمکی دارند، کلمه پرسشی قبل از فعل کمکی می‌آید.","Where can I buy a suitcase? / Who has painted this wall?","در جملات بدون فعل کمکی از do و does استفاده می‌شود."],
 ["Collocations (همایندها)","کلماتی که معمولاً با هم استفاده می‌شوند.","natural English: the fast train, fast food, a quick shower, a quick meal","unnatural English: train the quick, food quick, shower a fast"],
 ["اهمیت یادگیری Collocations","با آموختن همایندها می‌توانید به شکلی صحیح و طبیعی از زبان انگلیسی استفاده کنید.","مغز ما معنی و کاربرد ترکیب‌ها را راحت‌تر از کلمات تک و مجزا به خاطر می‌سپارد.",""],
 ["چگونه Collocations بیاموزیم؟","1) به ترکیبات مختلف دقت کنید 2) آنها را به عنوان یک واحد زبانی یاد بگیرید 3) همایندهای کلمه جدید را کنار آن بنویسید 4) زیاد مطالعه کنید 5) چندبار بررسی کنید 6) در دسته‌بندی‌های موضوعی بیاموزید","مثال برای remember: remember rightly, remember distinctly, remember vaguely, remember vividly",""],
 ["Do Collocations","do one's housework / do one's homework / do research / do an experiment / do one's best / do somebody a favor / do exercise / do one's hair / do harm / do damage / do the ironing / do the shopping / do the washing / do the dishes","کارهای خونه رو انجام دادن، انجام دادن تکالیف منزل، تحقیق کردن، آزمایش کردن",""],
 ["Make Collocations","make progress / make a decision / make money / make a list / make a promise / make friends / make dinner / make breakfast / make a mistake / make a phone call","پیشرفت کردن، تصمیم گرفتن، پول در آوردن، لیست تهیه کردن، قول دادن",""],
 ["Take Collocations","take an exam / take a look / take a break / take a chance / take a risk / take a taxi / take a vacation / take notes / take an interest in / take a photo","امتحان دادن، نگاه انداختن، استراحت کوتاه کردن، ریسک کردن، تاکسی گرفتن، مرخصی گرفتن",""],
 ["Passive Voice (جملات مجهول)","در جملات مجهول، عملی که انجام شده اهمیت دارد و اینکه چه کسی یا چه چیزی باعث انجام کار شده مهم نیست.","I keep the butter in the fridge. (معلوم) → The butter is kept in the fridge. (مجهول)","جملات مجهول را passive و جملات معلوم را active می‌نامند."],
 ["دلایل مجهول کردن جملات","الف) فاعل جمله کلمه مهمی نظیر people, someone, they باشد. ب) عمل انجام‌شده مهم‌تر از فاعل باشد. ج) فاعل آشکار باشد.","Someone stole my car last night. → My car was stolen last night. / The teacher has corrected the exam papers. → The exam papers have been corrected by the teacher.",""],
 ["مراحل مجهول کردن جمله معلوم","1) شناسایی فاعل، فعل و مفعول 2) حذف فاعل 3) مفعول به اول جمله 4) زمان جمله مشخص شود 5) فعل be در شکل صرف‌شده مناسب 6) شکل سوم فعل اصلی","—",""],
 ["مجهول در زمان‌های مختلف","حال ساده: am/is/are + pp / حال استمراری: am/is/are + being + pp / حال کامل: have/has + been + pp / گذشته ساده: was/were + pp / گذشته استمراری: was/were + being + pp / گذشته کامل: had + been + pp","The house is being cleaned at the moment. / The house has been cleaned since you left. / The house was cleaned yesterday. / The house was being cleaned last week. / The house had been cleaned before they arrived.","زمان‌های حال کامل استمراری و گذشته کامل استمراری شکل مجهول ندارند."],
 ["مجهول در زمان‌های دیگر","شرطی گذشته: would have + been + pp / آینده ساده: will be + pp / آینده استمراری: will be + being + pp / آینده کامل: will have + been + pp","The house would have been cleaned if it had been dirty. / The house will be cleaned next week. / The house will be being cleaned tomorrow. / The house will have been cleaned.",""],
 ["مجهول افعال Modal و مصدر","مصدر بدون to: be + pp / مصدر با to: to be + pp / مصدر ing: being + pp","The house must be cleaned before we arrive. / The students want to be taught. / The students enjoy being taught.",""],
 ["جملات با دو مفعول","در جمله‌هایی که دو مفعول دارند، هر یک از مفعول‌ها می‌تواند به عنوان فاعل جمله مجهول انتخاب شود.","has given first aid to him. → has been given first aid (by someone). / has been given to him (by someone).",""],
 ["تبدیل ضمایر","ضمیر مفعولی که در جایگاه فاعل قرار داده می‌شود باید به ضمیر فاعلی تبدیل شود.","me → I / you → you / her → she / him → he / it → it / us → we / them → they","He hit me with his car. → I was hit (by his car)."],
 ["Tag Questions (سوالات ضمیمه)","سوالات کوتاهی که در پایان یک جمله آمده","He is a student, isn't he? / He is not a student, is he? / Mina was playing well, wasn't she?",""],
 ["ساختار Tag Questions","1) سوال ضمیمه از نظر مثبت یا منفی بودن، عکس جمله اصلی است 2) ضمیر فاعلی + فعل کمکی منفی 3) ضمیر فاعلی + فعل کمکی مثبت","He is a student, isn't he? / Reza will go to Isfahan, won't he? / They were watching TV, weren't they?",""],
 ["فعل کمکی در Tag Questions","چنانچه جمله اصلی فعل کمکی داشته باشد از همان فعل کمکی استفاده می‌شود ولی چنانچه جمله فاقد فعل کمکی باشد از do یا مشتقات آن استفاده می‌شود.","I listen to the teacher, don't I? / Ali swims in the river, doesn't he? / His father opened his store at 8, didn't he?",""],
 ["نکات Tag Questions - ضمیر","در سوال ضمیمه همیشه بعد از فعل کمکی از ضمیر فاعلی استفاده می‌شود.","Mina was playing well, wasn't she? / My brothers aren't at school, are they?",""],
 ["نکات Tag Questions - مخفف","در سوالات ضمیمه چنانچه بخواهیم فعل کمکی را بشکل منفی بکار بریم، آن را می‌بایست بشکیل مخفف بکار برد.","Reza will go to Isfahan, won't he? / They were watching TV, weren't they?",""],
 ["نکات Tag Questions - I am","چنانچه در جمله‌ی مثبت از I am استفاده شده باشد در سوال ضمیمه از aren't I استفاده می‌شود.","I am a good student, aren't I?",""],
 ["نکات Tag Questions - قید منفی","اگر در جمله اصلی قید منفی نظیر no, never, hardly, scarcely, seldom, rarely کار رفته باشد، سوال کوتاه بشکل مثبت خواهد بود.","He never eats breakfast, does he? / There is nothing in the kettle, is there?",""],
 ["نکات Tag Questions - فاعل نامشخص","اگر فاعل جمله نا مشخص باشد: nobody, everybody, everyone, somebody, someone، در سوال کوتاه فعل و ضمیر فاعلی جمع خواهد بود.","Somebody borrowed my book yesterday, didn't they? / Nobody knows the answer, do they?",""],
 ["نکات Tag Questions - جملات امری","در جملات امری مثبت و منفی سوال کوتاه با will you ساخته می‌شود.","Open the door, will you? / Don't turn on the radio, will you?",""],
 ["نکات Tag Questions - Let's","جملاتی که با let's شروع می‌شوند، سوال کوتاه با shall we ساخته می‌شود.","Let's play in the yard, shall we?",""],
 ["نکات Tag Questions - Let us","جملاتی که با let us شروع می‌شوند، سوال کوتاه با will you ساخته می‌شود.","Let us go for a swim, will you?",""],
 ["نکات Tag Questions - few و little","کلمات few و little جمله را منفی می‌کنند. لذا باید از tag مثبت استفاده کرد.","Few people have known how to earn money, have they?",""],
 ["نکات Tag Questions - ضمیر در tag","هیچ‌گاه در tag از اسم استفاده نمی‌کنیم و همواره از ضمیر استفاده می‌کنیم یا از کلماتی نظیر there یا one.","No one can answer this question, can he? / There is a cat in that room, isn't there? / This is your car, isn't it? / Those are your friends, aren't they?",""],
 ["نکات Tag Questions - only","اگر در جمله خبری قید only باشد.","You have only one brother, do you? / don't you?",""],
 ["Simple Sentence و Compound Sentence","Simple sentence: Jack opened the door. / Compound sentence: Jack opened his bag, something else distracted his attention.","حروف ربط همپایه‌ساز: for, and, nor, but, or, yet, so (FANBOYS)","Compound sentence: Jack opened his bag, stopped for a second, pulled out a pen, and started writing."],
 ["حروف ربط - And","زمانی استفاده می‌شود که می‌خواهیم توضیحاتی جدید را به عبارت قبلی اضافه کنیم.","I go to the park every Sunday to watch the ducks on the lake and the men playing soccer. / I like tea and coffee.",""],
 ["حروف ربط - But","زمانی استفاده می‌شود که می‌خواهیم تضاد جمله جدید با جمله پایه را نشان دهیم.","He reads magazines, but he doesn't like to read books.",""],
 ["حروف ربط - Or","برای جایگزین کردن یا انتخاب کردن از بین گزینه‌های موجود استفاده می‌شود.","Do you like tea or coffee? / Shall we go out to the cinema or stay at home?",""],
 ["حروف ربط - So","برای نشان دادن نتیجه یا پیامد کاری یا بیان کردن علت و معلول استفاده می‌شود.","We were bored with the movie, so we left cinema. / There are no more chairs available, so you will have to stand.",""],
 ["حروف ربط - For","برای نشان دادن دلیل یا هدف به کار برده می‌شود.","I go to the park every Sunday, for I love to watch the ducks on the lake. / Comfort her, for he is sad.",""],
 ["حروف ربط - Nor","زمانی به کار می‌بریم که می‌خواهیم یک ایده منفی را جایگزین عبارت منفی‌ای که از قبل در جمله وجود داشته، کنیم.","I don't go for the fresh air nor really for the ducks. / It was not my fault, nor was his. It just an accident.",""],
 ["حروف ربط - Yet","برای نشان دادن تضاد بین دو جمله همانند but به کار برده می‌شود.","I always take a book to read, yet I never seem to turn a single page. / He is so young, yet so experienced.",""],
 ["حروف ربط - Because","از این کلمه هنگامی استفاده می‌شود که می‌خواهیم دلیل چیزی یا کاری را توضیح دهیم.","She goes to the tennis club because she likes to play tennis. / She did not come to school, because she was ill.",""],
 ["حروف ربط - Even","به کار برده می‌شود که بر خلاف محدودیت‌ها، موانع، مشکلات یا اتفاقات غیر منتظره، کاری را انجام دهیم.","I am going to the party, even if it rains. / She likes swimming, even in winter.",""]
];
grammar[30]=[
 ["استراتژی حمله به کلمه","استراتژی حمله به کلمه کمک می‌کند تا خواننده رمز گشایی، تلفظ و درک معنی کلمات ناآشنا را به درستی انجام دهد.","این استراتژی به خوانندگان کمک می‌کند تا با قطعه قطعه کردن کلمات ناآشنا به هرکدام از آنها از زاویه ای متفاوت حمله کنند.","رعایت اصول زیر در به کارگیری این استراتژی مفید است."],
 ["۱) استفاده از تصاویر","یکی از مهم‌ترین استراتژی‌های درک لغات است.","سعی کنید چند حرف را در کنار هم بخوانید.",""],
 ["۲) اتصال کلمه جدید با دانش لغوی گذشته","سعی کنید کلمه جدید را با یک کلمه که می دانید متصل کنید.","—",""],
 ["۳) خواندن بیش از یک بار جمله","فکر کنید که چه کلمه ای ممکن است در جمله معنادار باشد.","—",""],
 ["۴) گذر از کلمه ناآشنا","از کلمه ناآشنا بگذرید و به دنبال سرنخ ها برویید.","—",""],
 ["۵) استفاده از دانش پیشین","در مورد آنچه که در مورد موضوع کتاب، پاراگراف یا جمله می دانید فکر کنید.","—",""],
 ["Relative Pronouns (ضمایر موصولی)","who: فاعلی برای انسان / whom: مفعولی برای انسان / which: برای غیر انسان / what: بدون مرجع / whose: ملکی / that: برای همه / of which: ملکی برای غیر انسان","ضمایر موصولی ضمایری هستند که دارای wh می باشند و در بین دو جمله یا وسط جمله به کار می روند.","ضمایر موصولی در زبان فارسی بصورت «که» معنی می شوند."],
 ["نکات ضمایر موصولی","1) نوع ضمیر موصولی به اسمی که به آن اشاره دارد بستگی دارد. 2) به جمله هایی که با ضمایر موصولی شروع شود جمله واره موصولی می گویند. 3) ضمیر موصولی مانند دیگر ضمایر اسم یا ضمیر قبل از خود را شرح می دهند.","—",""],
 ["ضمیر موصولی who","از who برای اشاره به انسان و گاهی اوقات برای اشاره به حیوانات خانگی استفاده می کنیم.","I think there'd be a lot of children who'd love to have a climbing wall in school. / The woman who I saw yesterday was Sheila.",""],
 ["کاربرد who بعنوان فاعل و مفعول","ما می توانیم از who بعنوان فاعل یا مفعول یک جمله واره موصولی استفاده کنیم.","در مثال اول bloke که فاعل جمله واره موصولی است. در مثال دوم who به woman که مفعول فعل (saw) است.",""],
 ["حرف اضافه + who","از ضمیر موصولی who می توانیم بعنوان یک متمم حرف اضافه استفاده کنیم.","It was Cath who Ian gave the keys to. It wasn't me.","در این ساختار حرف اضافه در انتهای جمله واره موصولی واقع می‌شود."],
 ["کاربرد who همراه با گروه های جمعی افراد","ما اغلب who را برای اسامی جمعی مانند انسان استفاده می کنیم.","Nicola phoned the fire brigade, who then alerted the police and social workers.","از who برای اشیاء استفاده نمی کنیم."],
 ["ضمیر موصولی whom","از whom در انگلیسی رسمی یا نوشتاری استفاده می کنیم.","The man whom you met yesterday is coming to dinner.","whom به the man اشاره دارد که مفعول برای فعل met است."],
 ["حرف اضافه + whom","رایج‌ترین کاربرد whom، استفاده از آن با حرف اضافه است.","Drama in schools is particularly good for pupils for whom English is a second language.","حرف اضافه باید قبل از whom واقع شود."],
 ["ضمیر موصولی whose","از ضمیر موصولی whose برای اشاره به مالکیت افراد یا حیوانات استفاده می‌کنیم.","He's marrying a girl whose family don't seem to like him. / Kate, whose sister I used to share a house with, has gone to work in Australia.",""],
 ["ضمیر موصولی which","از which در جمله واره های موصولی تعریف کننده یا غیر تعریف کننده استفاده می کنیم. جمله واره های موصولی وقتی که اشاره به کل یک جمله دارند، همیشه از which استفاده می کنیم.","You need to tick the box which says yes. / He won't have much time to prepare for the meeting, which is this afternoon.","نمی‌توان از what برای جمله واره موصولی تعریف کننده استفاده کرد."],
 ["کاربرد which بعنوان فاعل و مفعول","از which می‌توان به عنوان فاعل و مفعول برای جمله واره موصولی استفاده کرد.","The new sports complex, which will be built on the site of the old power station, will provide facilities. / It was the same picture which I saw at the National Gallery.",""],
 ["حرف اضافه + which","از which می‌توان بعنوان متمم حرف اضافه کرد.","Early in the Autumn Term there is a reception at which you can meet current staff and students.",""],
 ["کاربرد which بعنوان اشاره کننده به کل یک جمله","جمله واره های موضوعی که اشاره به کل جمله دارند همیشه با which معرفی می شوند.","There's going to be a new head teacher in September, which is good. It's time for a change.",""],
 ["ضمیر موصولی that","از that به جای who، whom و which استفاده می کنیم. That فقط برای معرفی جمله واره های تعریف کننده استفاده می‌شود.","We met somebody last night that did the speech therapy course two years after you. / The 8.30 is the train that you need to get.",""],
 ["کاربرد that","ضمیر موصولی that می تواند بعنوان فاعل و مفعول یک جمله واره موصولی استفاده شود.","Don't take money that doesn't belong to you. / It's the same cooker that my mother has.",""],
 ["حرف اضافه + that","ضمیر موصولی that می تواند به متمم حرف اضافه اشاره کند.","We've got some tennis balls that you can play with.",""],
 ["نکته مهم حرف اضافه + that","بر خلاف whom, which, whose، بالفاصله قبل از that از حرف اضافه استفاده نمی‌گردد.","نادرست: We've got some tennis balls with that you can play.",""],
 ["عبارات in that و with that","in that به معنای because / with that به معنای then میباشند.","I was fortunate in that I had good friends. / She turned off the light and with that she flounced out of the room.",""],
 ["کاربرد that بعد از کلمات خاص","بعد از کلمات زیر و صفات عالی و اعداد ترتیبی، that استفاده می‌شود: anybody, anything, all, anyone, anywhere, somebody, something, nothing, nowhere, nobody, only","Anything that he saved was lost. / Everywhere that I go I remember his gentle face. / It was the third accident that I saw yesterday. / He was the tallest man that I had ever seen. / It was the only thing that was worth seeing.",""],
 ["حذف ضمیر موصولی","در سبک غیررسمی انگلیسی، معمولاً ضمیر موصولی حذف می‌شود. حذف فقط در جمله واره های موصولی تعریف کننده و زمانی که ضمیر موصولی به مفعول جمله واره اشاره دارد.","German is a language which I've found hard to learn. → German is a language I've found hard to learn. / She's the singer who I heard on the radio. → She's the singer I heard on the radio.",""],
 ["ضمایر موصولی where, when, why","در انگلیسی غیررسمی برای معرفی جمله واره موصولی به جای on which, at which, for which غالباً از where, when, why استفاده می‌شود.","I know a restaurant where the food is excellent. / There isn't a day when I don't feel rushed off my feet. / Do you know the reason why the shop is closed today?",""],
 ["حذفیات جمله واره های موصولی","در بیشتر موارد می توان جمله واره های توصیفی را کوتاه کرده و از عبارت توصیفی استفاده کرد.","جمله واره های توصیفی ممکن است یکی از روش های زیر به عبارت توصیفی تبدیل شوند:",""],
 ["روش ۱ حذف","چنان چه فعل جمله واره توصیفی به زمان حال استمراری یا گذشته استمراری باشد، می توان ضمیر موصولی و فعل کمکی بعد از آن را باهم از جمله حذف کرد.","Do you know the woman who is sitting in the car? → Do you know the woman sitting in the car?",""],
 ["روش ۲ حذف","چنان چه فعل جمله واره ی توصیفی به زمان حال ساده یا گذشته ساده باشد، می توان ضمیر موصولی را حذف کرد و فعل جمله را به شکل ing دار بیان کرد.","All over the world there are people who pollute the environment. → All over the world there are people polluting the environment.",""],
 ["روش ۳ حذف","چنان چه جمله واره ی توصیفی ساختار مجهول داشته باشد، می توان ضمیر موصولی و فعل کمکی بعد از آن را حذف کرد و قسمت سوم فعل را باقی گذارد.","The boy who was injured in the accident was taken to the hospital. → The boy injured in the accident was taken to the hospital.",""],
 ["Second Conditional (شرطی نوع دو)","If + Past Simple, Would + Simple verb","به موقعیتی بعد یا فرضی و نتایج احتمالی‌اش اشاره دارد. این جملات بر پایه موقعیت واقعی نیستند.",""],
 ["ساختار شرطی نوع دو","If + گذشته ساده, would (wouldn't) + مصدر بدون to","If I had more money, I would ('d) buy a new car. / If you lived in England, you would soon learn English.","با اینکه جمله دارای فرم گذشته است ولی مفهوم آن در زمان حال می‌باشد."],
 ["مثال‌های شرطی نوع دو","If we went by bus, it would be cheaper. / If I found her address, I would send her an invitation. / If he inherited a billion dollars, he would travel to the moon.","—",""],
 ["نکته اول شرطی نوع دو","در شرطی نوع دوم این است که شما نباید در عبارت شرط was را به کار بگیرید، لذا پس از I, He, She, It از were استفاده می‌شود.","If I were you, I would save my money. / If I were you, I wouldn't be rude to the boss.",""],
 ["نکته دوم شرطی نوع دو","استفاده از دیگر افعال مودال: می‌توانید از افعال could و might نیز به جای فعل would استفاده کنید.","If Jack studied more, he might pass the exam. / If I won a million pounds, I could stop working.",""],
 ["نکته مهم و کنکوری شرطی نوع دو","در صورتی که در جمله ی شرط از فعل were استفاده شود، می توان If را حذف کرده و were را به ابتدای جمله انتقال داد.","Were I rich, I would buy a house by the sea. (= if I were rich)",""],
 ["مثال‌های بیشتر","If he needed any money, I'd lend it to him. / If I were a rich man, I'd buy an expensive car.","اگر به پول احتیاج داشت به او قرض می‌دادم. / اگر ثروتمند بودم یک ماشین گران‌قیمت می‌خریدم.",""],
 ["Paragraph (پاراگراف)","هر متن یا مقاله از حداقل یک یا چند پاراگراف تشکیل می‌شود. پاراگراف واحد تشکیل دهنده یک متن است.","ما به هرکدام از این بخش‌ها و بسته‌های نوشته، پاراگراف می‌گوییم. خواندن نوشته‌ای که پاراگراف‌بندی نشده خسته کننده است.","هر پاراگراف در واقع ایده کمی متفاوت از پاراگراف قبلی خود را بیان می‌کند."],
 ["ایده اصلی پاراگراف","ایده اصلی معمولاً در جمله موضوعی (topic sentence) بیان می‌شود و بقیه جملات پاراگراف به شرح، بسط و تقویت جمله موضوعی می‌پردازند.","—",""],
 ["ظاهر یک پاراگراف","اول هر پاراگراف باید کمی از حاشیه اصلی فاصله داشته باشد (Indentation).","به این ترتیب خواننده متوجه می‌شود ایده جدیدی مطرح شده.","هنگام ترجمه یک متن، مترجم موظف است دقیقاً چیدمان پاراگراف‌بندی نویسنده را حفظ کند."],
 ["طول یک پاراگراف","یک پاراگراف ممکن است بسیار طولانی و یا بسیار کوتاه باشد. اما اکثر پاراگراف‌ها معمولاً از سه جمله تشکیل می‌شوند و حدود ۱۰۰ تا ۲۰۰ کلمه دارند.","—",""],
 ["سه بخش مهم برای نوشتن پاراگراف عالی","1) جمله موضوع (Topic sentence) 2) جملات پشتیبان (Supporting Sentences) 3) جمله پایانی (Concluding sentence)","ساختاری که کتاب‌های آیلتس برای یک پاراگراف بدنه پیشنهاد می‌کنند به این صورت است.",""],
 ["جمله موضوع (Topic sentence)","به مهم‌ترین ایده پاراگراف که در قالب یک جمله بیان می‌شود جمله موضوع می‌گویند. جمله موضوع در واقع هسته اصلی پاراگراف است.","این جمله ممکن است در اول پاراگراف، در وسط پاراگراف یا در آخر پاراگراف بیان شود.",""],
 ["چگونه یک متن را براساس پاراگراف‌ها بنویسیم؟","فرض کنید می خواهید در مورد موضوع فوتبال مطلبی بنویسید. Topic یا موضوع کلی متن شما می شود «فوتبال».","تاریخ فوتبال / مقایسه آن با دیگر ورزش ها / قوانین آن / بزرگترین فوتبالیستهای جهان","هرکدام از این جنبه های مختلف یک عنوان فرعی و یک یا چند پاراگراف را به خود اختصاص می دهند."],
 ["مراحل نوشتن پاراگراف","ابتدا اصل مطلب را در اولین جمله پاراگراف تان بنویسید سپس شروع به شرح دادن آن کنید.","قبل از شروع مقاله و یا متن خود یک طرح کلی از آن داشته باشید و تصمیم بگیرید درباره کدام جنبه های موضوع قرار است صحبت کنید.","حتی قبل از شروع شرح پاراگراف ها بهتر است چیدمان موضوع را نیز مشخص کنید."],
 ["تعیین چیدمان موضوع","و تصمیم بگیرید به هر کدام چقدر قرار است شاخ و برگ دهید. یعنی کلمات و جملات کلیدی هر پاراگراف یا عنوان فرعی را از قبل مشخص کنید.","۱) فوتبال اولین بار در کجا و چه زمانی بازی شد. ۲) این ورزش چگونه به کشورهای دیگر راه یافت. ۳) به مرور زمان چه تغییراتی در نحوه بازی آن رخ داد.",""],
 ["جملات پشتیبان (Supporting sentences)","علاوه بر جمله موضوعی یک پاراگراف از جملات دیگری هم تشکیل می شود. این جملات به بسط و شرح جمله موضوعی می پردازند. به این جملات supporting sentence می گویند.","این جملات نتایج، واقعیت‌ها، مثال ها، دلایل یا آمار یا هر چیز دیگری که نشان دهد ایده شما درست است به توضیح و بحث درباره جمله تاپیک می پردازند.","یک پاراگراف همیشه یک topic sentence دارد اما تعداد supporting sentence ها معمولاً بیشتر از دو جمله است."],
 ["جمله نتیجه‌گیری (Concluding Sentence)","یک جمله نتیجه در پاراگراف می تواند برای پایان دادن به پاراگراف راه‌بستگی استفاده شود. این جمله به خواننده نکات مهم را یادآوری می کند.","جملات نتیجه گیری اختیاری هستند و در بیشتر مواقع پاراگراف ها فاقد جملات نتیجه گیری هستند.",""],
 ["مثال برای موارد فوق","Studying abroad (topic) has two main benefits (controlling idea).","ترجمه فارسی: تحصیل در خارج دو فایده دارد.",""],
 ["جملات پشتیبان برای Studying Abroad","اولین ایده جمله پشتیبان People get a better job when they return home (دلیل Better qualifications and experience mean better pay and promotion / نتیجه Now has a high standard of living). دومین ایده جمله پشتیبان Students gain independence (مثال Students have to cope with the challenges of living alone and meeting new people from different cultures / نتیجه Students will become more confident in their life and relationships)","—",""]
];
grammar[31]=[
 ["خلاصه نویسی","در مورد خلاصه نویسی زبان، مطلب خاصی برای گفتن ندارم، فقط حتماً مراحل زیر را پیش از پیش از خلاصه نویسی رعایت کنید.","—",""],
 ["۱) یادداشت برداری","برای یادداشت برداری ابتدا باید بدانید که کل کتاب درباره چه موضوعی صحبت می کند و قرار است به شما چه مطالبی را آموزش دهد.","—",""],
 ["۲) یادداشت برداری از مطالب","برای یادداشت برداری باید مطالب را درک کنیم و سپس از استنباط خودمان شروع به نوشتن مطالب کلیدی نماییم.","—",""],
 ["۳) یادداشت نکات پراکنده","می‌توانید یک قسمت از خلاصه‌نویسی زبان انگلیسی را به نکته‌های پراکنده اختصاص دهید.","—",""],
 ["۴) زمان خلاصه نویسی","وقتی خلاصه نوشتید، سعی کنید حداقل هفته‌ای ۲ روز و روزی ۴۵ دقیقه خلاصه‌نویسی زبان و بخصوص لغت‌ها را مرور کنید.","—",""],
 ["۵) معانی مختلف لغت","برای اینکه دایره لغتتان وسیع‌تر شود و لغات بیشتری را بیاموزید بهتر است بعد از نوشته خلاصه برای هر لغت سعی کنید حتماً معانی مختلف آن را بیاورید.","—",""],
 ["۶) نمودارهای مختلف","از نمودارهای مختلف در نوشته‌های خود استفاده کنید. از نمودارهای خطی، زنجیری و پله‌ای بیشتر برای یادداشت‌هایی استفاده کنید که یا رابطه علت و معلولی دارند یا تقدم و تأخر آنها مهم است.","—",""],
 ["۷) اصل اساسی","اصل اساسی در هر گونه یادداشت برداری حذف توضیحات اضافی و اهمیت سنجی مطالب است. برای این منظور باید اصل و فرع مطالب را از هم تشخیص دهید.","—",""],
 ["۸) تمرین خلاصه نویسی","یکی از راه‌های موفقیت، یادداشت خلاصه برداری کردن از روی هاست برای این کار تمرین خلاصه نویسی کنید.","—",""],
 ["۹) هدفمند بودن","بخاطر داشته باشید که هر گونه یادداشت برداری باید هدفمند باشد. یعنی پاسخگوی نیازی یا جوابگوی سوالی باشد.","—",""],
 ["۱۰) قابل حمل بودن","یادداشت‌هایتان را به گونه ای ترتیب دهید که قابل حمل باشد و به سهولت بتواند مورد استفاده قرار گیرد. بنابراین استفاده از سررسید و سالنامه‌ها را توصیه نمی‌کنیم.","—",""],
 ["۱۱) اوراق جداگانه","بهترین وضعیت برای یادداشت برداری آن است که آنها را روی اوراقی جداگانه و بهم پیوسته بنویسیم.","—",""],
 ["۱۲) منبع یادگیری","به طور کلی خلاصه نویسی مهم‌ترین منبع یادگیری می باشد زیرا می‌توانید همیشه خلاصه درس خود را به همراه داشته باشید.","—",""],
 ["۱۳) ساختار درختی","یادگیری زبان انگلیسی دغدغه بسیاری از ماست پس سعی کنید کلمات مهم را بزرگتر یا با خودکار رنگی بنویسید و بین موضوعات اصلی و فرعی را به کمک ساختار درختی نمایش دهید.","—",""],
 ["۱۴) مفهومی شدن","سوالات و تست‌ها به سمت مفهومی شدن حرکت می‌کنند پس همه مطالب خوانده شود.","—",""],
 ["۱۵) مرور","تکرار در فواصل زمانی مشخص باعث ذخیره در حافظه موقت و انتقال آن به حافظه دائمی می‌شود.","—",""],
 ["ضرب المثل‌های کتاب‌های زبان انگلیسی","The early bird catches the first worm. / Better be alone than in bad company / Fall from a frying pan into the fire / Actions speak louder than words / A word is enough to the wise","—",""],
 ["ضرب المثل‌های بیشتر","Don't teach your grandmother to suck eggs / Art is long, life is short / Clothes do not make the man / God never sends mouths but He sends meat / Stretch your leg according to your coverlet / Knowledge is the power / A golden key opens every door / There is something in the wind / A fox without tail wants others too without / God helps those who help themselves / Friends may meet, but mountains never greet / The end makes all equal / A blind man's wife needs no paint / An idle brain is the devil's workshop / The best fish swim near the bottom / Habit is second nature / Too many cooks, spoil the broth / Absence makes the heart grow fonder / There is a time to speak and a time to be silent / Never judge a book with its cover / Any port in a storm / Union is strength / Travel broadens the mind / An ass is but an ass, though laden with gold / Charity begins at home / Practice makes perfect / Birds of a feather flock together / Easy come easy go / Two heads are better than one / Don't count your chickens before they hatch / Out of sight out of mind / Cut your coat according to your cloth / A burnt child dreads the fire / Kill two birds with a stone / Don't look a gift horse in the mouth / Money doesn't grow on trees / There is no place like home / A friend in need is a friend indeed / No gain, no pain","—",""],
 ["مجهول کردن افعال Modal","زمانی که بخواهیم جمله دارای افعال مدال را مجهول کنیم فقط کافی است: 1) شناسایی فاعل، فعل و مفعول جمله معلوم 2) حذف فاعل و آوردن مفعول به اول جمله 3) اضافه نمودن be به افعال مدال موجود در جمله 4) فعل اصلی جمله را به P.P تبدیل می‌کنیم.","—",""],
 ["Past Perfect Tense (ماضی بعید)","زمان گذشته کامل یا ماضی بعید یکی از زمان‌های ۱۲ گانه اصلی در زبان انگلیسی است.","—",""],
 ["ساختار ماضی بعید","فعل این زمان با استفاده از فعل کمکی had و قسمت سوم فعل past participle ساخته می‌شود.","—",""],
 ["کلمات ربطی ماضی بعید","کلمات ربطی که بیشتر در این زمان استفاده می‌شوند عبارتند از: When / Before / Because / As soon as / After","—",""],

 ["نکته ۲ ماضی بعید","اگر چندین عمل در گذشته با فاصله کم یا یکی پس از دیگری اتفاق افتاده باشد از گذشته ساده استفاده می‌کنیم نه ماضی بعید.","I arrived home at 1:30, ate my lunch, took a nap, and did my homework.",""],
 ["کاربرد ب ماضی بعید","برای بیان عمل یا حالتی که در گذشته شروع شده و تا انجام دادن عمل دیگر در گذشته ادامه داشته است.","My teacher had lived in Paris before he studied art there. / By the time his uncle got a very good job, he had taken many risks.",""],

 ["نکته ۳ ماضی بعید","اما اگر ماضی بعید به انجام دادن عملی در گذشته در زمانی مشخص اشاره نکند، نمی‌توان از آن استفاده کرد.","نادرست: He never drove a car before he got his driving license. درست: He had never driven a car before he got his driving license.",""],

function getWordKey(grade,lessonNumber){ if(grade===7) return lessonNumber-1; if(grade===8) return 8+lessonNumber; if(grade===9) return 15+lessonNumber; if(grade===10) return 21+lessonNumber; if(grade===11) return 25+lessonNumber; if(grade===12) return 28+lessonNumber; return null; }
function getWords(grade,lessonNumber){ const k=getWordKey(grade,lessonNumber); if(k===null)return []; return (words&&words[k])?words[k]:[]; }
function getGrammar(grade,lessonNumber){ const k=getWordKey(grade,lessonNumber); if(k===null)return []; return (grammar&&grammar[k])?grammar[k]:[]; }
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function normalizePhone(x){return String(x||"").replace(/\D/g,"")}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function speakLetter(letter,word,fullExamples){ if(!window.speechSynthesis){toast("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.","error");return} speechSynthesis.cancel(); const u1=new SpeechSynthesisUtterance(letter); u1.lang="en-US";u1.rate=.65; u1.onend=function(){ const u2=new SpeechSynthesisUtterance(word); u2.lang="en-US";u2.rate=.7; u2.onend=function(){ const u3=new SpeechSynthesisUtterance(fullExamples); u3.lang="en-US";u3.rate=.75; speechSynthesis.speak(u3); }; speechSynthesis.speak(u2); }; speechSynthesis.resume(); speechSynthesis.speak(u1); }

const JALALI_MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const JALALI_WEEK=["ش","ی","د","س","چ","پ","ج"];
function gregorianToJalali(gy,gm,gd){ const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334]; let jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600; let gy2=(gm>2)?(gy+1):gy; let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g_d_m[gm-1]; jy+=33*Math.floor(days/12053); days%=12053; jy+=4*Math.floor(days/1461); days%=1461; if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365} let jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30); let jd=1+((days<186)?(days%31):((days-186)%30)); return [jy,jm,jd]; }
function jalaliToGregorian(jy,jm,jd){ jy+=1595; let days=-355668+(365*jy)+Math.floor((jy+3)/4)-Math.floor((jy+99)/100)+Math.floor((jy+399)/400)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186); let gy=400*Math.floor(days/146097); days%=146097; if(days>36524){ gy+=100*Math.floor(--days/36524); days%=36524; if(days>=365){days++;gy+=Math.floor(days/365);days%=365} } gy+=4*Math.floor(days/1461); days%=1461; if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365} let gd=days+1; const sal_a=[0,31,(gy%4===0&&gy%100!==0)||(gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31]; let gm=0; for(gm=0;gm<13;gm++){ const v=sal_a[gm]; if(gd<=v)break; gd-=v; } return [gy,gm,gd]; }
function getJalaliMonthDays(jy,jm){ if(jm<=6)return 31; if(jm<=11)return 30; const leap=((((jy+2346)%2820)*682)%2816)<682; return leap?30:29; }
function getTodayJalali(){ const now=new Date(); return gregorianToJalali(now.getFullYear(),now.getMonth()+1,now.getDate()); }
function JALI_wk(){ const d=(new Date().getDay()+1)%7; return JALALI_WEEK[d]; }

async function loadUnlocks(){
  S.unlocks={};
  for(let g=7; g<=12; g++){ S.unlocks[`${g}-0`]=true; }
  if(!S.student) return;
  try{ const r=await db.from("lesson_unlocks").select("grade,lesson_index").eq("student_id", S.student.id); (r.data||[]).forEach(x=>{ S.unlocks[`${x.grade}-${x.lesson_index}`]=true; }); }catch(e){}
  try{ const local=JSON.parse(localStorage.getItem("AN_UNLOCKS_"+S.student.id)||"{}"); Object.keys(local).forEach(k=>{ if(local[k]) S.unlocks[k]=true; }); }catch(e){}
}
async function unlockLesson(grade,lessonIndex,paymentRef,pkg){
  const key=`${grade}-${lessonIndex}`;
  S.unlocks[key]=true;
  try{ if(S.student){ const local=JSON.parse(localStorage.getItem("AN_UNLOCKS_"+S.student.id)||"{}"); local[key]=true; localStorage.setItem("AN_UNLOCKS_"+S.student.id,JSON.stringify(local)); } }catch(e){}
  if(S.student){ try{ await db.from("lesson_unlocks").upsert({student_id:S.student.id,grade:Number(grade),lesson_index:Number(lessonIndex),payment_ref:paymentRef||null,package:pkg||"single",unlocked_at:new Date().toISOString()},{onConflict:"student_id,grade,lesson_index"}); }catch(e){} }
  return true;
}

function startGame(gameId){
 S.currentGame={id:gameId,score:0,time:60,started:false,timer:null};
 const titles={animals:"حدس حیوان",memory:"حافظه کلمات",incomplete:"کلمه ناقص",numbers:"عدد به انگلیسی",colors:"تشخیص رنگ",idioms:"اصطلاحات",proverbs:"ضرب‌المثل‌ها",adultVocab:"واژگان پیشرفته"};
