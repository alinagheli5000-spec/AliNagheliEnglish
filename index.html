  --primary3:#a78bfa;
  --bg:#f7f5ff;
  --card:#fff;
  --text:#211b2d;
  --muted:#756d82;
  --border:#ebe5f5;

}
html{scroll-behavior:smooth}
body{

  font-family:Tahoma,Arial,sans-serif;
  background:

button,input,select,textarea{font:inherit}

.hidden{display:none!important}
.container{width:min(1100px,calc(100% - 28px));margin:auto}

.header{

.logo-icon{

.stat strong{display:block;font-size:23px;margin-top:7px}

.grid{

.card{

function esc(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.classList.remove("show"),2500);
}

function openModal(html){
  document.getElementById("modalContent").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeModal();
});

function updateNav(page){
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });
}

  S.page=page;

  updateNav(page);

  else if(page==="courses")renderCourses();
  else if(page==="profile")renderProfile();
  else renderHome();

  window.scrollTo({top:0,behavior:"smooth"});
}

function completeLesson(grade,id){
  const key=`${grade}_${id}`;
  if(!S.progress[key]){
    S.progress[key]=true;
    S.xp=(S.xp||0)+10;
    S.level=Math.max(1,Math.floor((S.xp||0)/100)+1);
    saveState();
    toast("درس با موفقیت تکمیل شد! 🎉");
  }else{
    toast("این درس قبلاً تکمیل شده است.");
  }
  openGrade(grade);
}

function getPlacementLevel(score){
  if(score<=7)return "A1";
  if(score<=13)return "A2";
  if(score<=19)return "B1";
  if(score<=24)return "B2";
  if(score<=28)return "C1";
  return "C2";
}

function getPlacementDescription(level){
  const map={
    A1:"مقدماتی — توانایی درک و استفاده از عبارات بسیار ساده",
    A2:"پیش‌مقدماتی — توانایی برقراری ارتباط در موقعیت‌های روزمره",
    B1:"متوسط — توانایی درک و تولید متون و مکالمات عمومی",
    B2:"فوق‌متوسط — توانایی ارتباط نسبتاً روان و درک متون پیچیده‌تر",
    C1:"پیشرفته — توانایی استفاده مؤثر و دقیق از زبان",
    C2:"تسلط بسیار پیشرفته — توانایی استفاده تقریباً کامل از زبان"
  };
  return map[level]||"";
}

function openPlacement(){
  S.quiz={
    type:"placement",
    answers:{},
    index:0
  };
  renderPlacementQuestion();
}

function renderPlacementQuestion(){
  const quiz=S.quiz;
  if(!quiz)return;

  const index=quiz.index;
  const q=placementQuestions[index];
  const selected=quiz.answers[index];

  openModal(`
    <div class="modal-head">
      <div>
        <h2>🎯 آزمون تعیین سطح</h2>
        <p style="margin:5px 0;color:var(--muted);font-size:12px">
          سؤال ${index+1} از ${placementQuestions.length}
        </p>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="progress" style="margin-bottom:18px">
      <div class="progress-bar" style="width:${((index+1)/placementQuestions.length)*100}%"></div>
    </div>

    <div class="quiz-question">
      <h3>${index+1}. ${esc(q.q)}</h3>
      <div class="answers">
        ${q.options.map((op,i)=>`
          <button
            class="answer ${selected===i?"selected":""}"
            onclick="selectPlacementAnswer(${i})">
            ${String.fromCharCode(65+i)}) ${esc(op)}
          </button>
        `).join("")}
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;gap:10px">
      <button class="btn btn-light"
        ${index===0?"disabled":""}
        onclick="placementPrev()">
        ← قبلی
      </button>

      <button class="btn btn-primary"
        onclick="placementNext()">
        ${index===placementQuestions.length-1?"پایان آزمون ✓":"بعدی →"}
      </button>
    </div>
  `);
}

function selectPlacementAnswer(answer){
  if(!S.quiz)return;
  S.quiz.answers[S.quiz.index]=answer;
  renderPlacementQuestion();
}

function placementPrev(){
  if(S.quiz.index>0){
    S.quiz.index--;
    renderPlacementQuestion();
  }
}

function placementNext(){
  const quiz=S.quiz;
  if(!quiz)return;

  if(typeof quiz.answers[quiz.index]!=="number"){
    toast("لطفاً یک گزینه را انتخاب کنید.");
    return;
  }

  if(quiz.index<placementQuestions.length-1){
    quiz.index++;
    renderPlacementQuestion();
  }else{
    finishPlacement();
  }
}

function finishPlacement(){
  let score=0;

  placementQuestions.forEach((q,i)=>{
    if(S.quiz.answers[i]===q.answer)score++;
  });

  const level=getPlacementLevel(score);

  S.placement={
    score,
    total:placementQuestions.length,
    level,
    date:new Date().toISOString()
  };

  S.xp=(S.xp||0)+score;
  S.level=Math.max(1,Math.floor((S.xp||0)/100)+1);

  saveState();
  renderPlacementResult();
}

      </section>

      <section class="section">
        <div class="section-title">
          <div>
            <h2>🎯 تعیین سطح</h2>
            <p>آخرین نتیجه آزمون شما</p>
          </div>
        </div>

        ${
          placement
          ? `
            <div class="card resultBox">
              <div class="score" style="font-size:40px">
                ${placement.score}/${placement.total}
              </div>
              <div style="margin:7px">
                <span class="level-result">سطح ${esc(placement.level)}</span>
              </div>
              <p>${esc(getPlacementDescription(placement.level))}</p>
              <button class="btn btn-primary" onclick="openPlacement()">
                انجام مجدد آزمون
              </button>
            </div>
          `
          : `
            <div class="card" style="text-align:center">
              <div style="font-size:45px">🎯</div>
              <h3>هنوز تعیین سطح نکرده‌اید</h3>
              <p>با آزمون تعیین سطح، سطح زبان انگلیسی خود را مشخص کنید.</p>
              <button class="btn btn-primary" onclick="openPlacement()">
                شروع آزمون
              </button>
            </div>
          `
        }
      </section>

      <section class="section">
        <div class="grid grid-2">

          <div class="card">
            <div style="font-size:25px">⭐</div>
            <h3>XP</h3>
            <p style="font-size:28px;font-weight:900;color:var(--primary);margin:0">
              ${S.xp||0}
            </p>
          </div>

          <div class="card">
            <div style="font-size:25px">🏆</div>
            <h3>سطح کاربری</h3>
            <p style="font-size:28px;font-weight:900;color:var(--primary);margin:0">
              ${S.level||1}
            </p>
          </div>

        </div>
      </section>

      <section class="section">
        <div class="card">
          ${
            student
            ? `<button class="btn btn-danger" onclick="logout()">خروج از حساب</button>`
            : `<button class="btn btn-primary" onclick="showLogin()">ورود به حساب</button>`
          }
        </div>
      </section>

    </div>
  `;
}

/* =========================
   LOGIN / REGISTER
========================= */

function showLogin(){
  openModal(`
    <div class="modal-head">
      <h2>🔐 ورود زبان‌آموز</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <form onsubmit="loginStudent(event)">
      <div class="form-group">
        <label>شماره موبایل</label>
        <input id="loginPhone" class="input" type="tel"
          inputmode="numeric" autocomplete="username"
          placeholder="09xxxxxxxxx" required>
      </div>

      <div class="form-group">
        <label>رمز عبور</label>
        <input id="loginPassword" class="input" type="password"
          autocomplete="current-password"
          placeholder="رمز عبور" required>
      </div>

      <button class="btn btn-primary" style="width:100%">
        ورود
      </button>
    </form>

    <div style="text-align:center;margin-top:15px">
      <button class="btn btn-light btn-sm" onclick="showRegister()">
        ثبت‌نام زبان‌آموز جدید
      </button>
    </div>
  `);
}

function showRegister(){
  openModal(`
    <div class="modal-head">
      <h2>📝 ثبت‌نام</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <form onsubmit="registerStudent(event)">
      <div class="grid grid-2">
        <div class="form-group">
          <label>نام</label>
          <input id="regFirstName" class="input" required>
        </div>

        <div class="form-group">
          <label>نام خانوادگی</label>
          <input id="regLastName" class="input" required>
        </div>
      </div>

      <div class="form-group">
        <label>شماره موبایل</label>
        <input id="regPhone" class="input" type="tel"
          inputmode="numeric" placeholder="09xxxxxxxxx" required>
      </div>

      <div class="form-group">
        <label>پایه</label>
        <select id="regGrade" class="input" required>
          <option value="">انتخاب پایه</option>
          ${Object.entries(books).map(([g,b])=>
            `<option value="${g}">${g} - ${esc(b.book)}</option>`
          ).join("")}
        </select>
      </div>

      <div class="form-group">
        <label>رمز عبور</label>
        <input id="regPassword" class="input" type="password"
          minlength="6" required>
      </div>

      <button class="btn btn-primary" style="width:100%">
        ارسال درخواست ثبت‌نام
      </button>
    </form>
  `);
}

async function loginStudent(event){
  event.preventDefault();

  const phone=document.getElementById("loginPhone").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!phone||!password){
    toast("اطلاعات ورود را کامل کنید.");
    return;
  }

  /*
    تلاش برای ورود از طریق Edge Function.
    در صورت در دسترس نبودن بک‌اند، حالت محلی برای
    جلوگیری از خراب شدن رابط کاربری استفاده نمی‌شود.
  */
  try{
    const response=await fetch(ACCESS_FUNCTION,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"login",
        phone,
        password
      })
    });

    const data=await response.json().catch(()=>null);

    if(!response.ok){
      throw new Error(data?.error||"ورود ناموفق بود.");
    }

    S.student=data.student||data.user||data;
    saveState();
    closeModal();
    toast("ورود با موفقیت انجام شد. خوش آمدید 👋");
    renderHome();

  }catch(error){
    console.error(error);
    toast(error.message||"ورود انجام نشد.");
  }
}

async function registerStudent(event){
  event.preventDefault();

  const payload={
    action:"register",
    first_name:document.getElementById("regFirstName").value.trim(),
    last_name:document.getElementById("regLastName").value.trim(),
    phone:document.getElementById("regPhone").value.trim(),
    grade:document.getElementById("regGrade").value,
    password:document.getElementById("regPassword").value
  };

  try{
    const response=await fetch(ACCESS_FUNCTION,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data=await response.json().catch(()=>null);

    if(!response.ok){
      throw new Error(data?.error||"ثبت‌نام ناموفق بود.");
    }

    closeModal();
    toast("درخواست ثبت‌نام با موفقیت ارسال شد. ✅");

  }catch(error){
    console.error(error);
    toast(error.message||"ثبت‌نام انجام نشد.");
  }
}

function logout(){
  S.student=null;
  saveState();
  toast("از حساب خارج شدید.");
  navigate("home");
}

/* =========================
   STARTUP
========================= */

loadState();

if(!S.page)S.page="home";

renderHome();

/* جلوگیری از خروج ناخواسته هنگام کلیک‌های نامعتبر */
window.addEventListener("error",e=>{
  console.error("Application error:",e.error||e.message);
});
</script>

</body>
</html>
