function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));

function normalizePhone(x){

  .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))

/* STATS */

async function loadStudentStats(){
 if(!S.student)return;

 try{
  const p=await db
   .from("student_progress")
   .select("*")
   .eq("student_id",S.student.id);

  if(!p.error){
   S.progress={};
   (p.data||[]).forEach(x=>{
    S.progress[x.lesson_id]={
     progress:x.progress,
     completed:x.completed
    }
   })
  }
 }catch(e){}

 try{
  const a=await db
   .from("student_achievements")
   .select("*")
   .eq("student_id",S.student.id);

  if(!a.error)S.achievements=a.data||[];
 }catch(e){}

 try{
  const ex=await db
   .from("exam_results")
   .select("*")
   .eq("student_id",S.student.id)
   .order("created_at",{ascending:false});

  if(!ex.error)S.exams=ex.data||[];
 }catch(e){}

 const completed=Object.values(S.progress)
  .filter(x=>x.completed).length;

 S.xp=completed*100;
 S.level=Math.max(1,Math.floor(S.xp/500)+1);
}

async function unlockAchievement(key,title){
 if(!S.student||
    S.achievements.some(x=>x.achievement_key===key))return;

 try{
  const r=await db.from("student_achievements").insert({
   student_id:S.student.id,
   achievement_key:key,
   title
  });

  if(!r.error)
   S.achievements.push({
    achievement_key:key,
    title
   });
 }catch(e){}
}

async function saveProgress(lessonId,progress,completed){
 if(!S.student)return;

 S.progress[lessonId]={
  progress,
  completed
 };

 try{
  await db.from("student_progress").upsert({
   student_id:S.student.id,
   lesson_id:lessonId,
   progress,
   completed,
   completed_at:completed?
    new Date().toISOString():null
  },{
   onConflict:"student_id,lesson_id"
  });
 }catch(e){}
}

/* FIXED STUDENT LOGIN */

async function studentLogin(){
 const phone=normalizePhone(
  document.getElementById("phone")?.value||""
 );

 const password=
  document.getElementById("pass")?.value||"";

 if(!/^09\d{9}$/.test(phone)||!password){
  alert("شماره موبایل و رمز عبور را صحیح وارد کنید.");
  return;
 }

 try{

  /*
   * روش اصلی ورود:
   * Edge Function خودش شماره موبایل را به
   * حساب Auth متصل می‌کند.
   *
   * بنابراین کاربر نیازی به دانستن ایمیل داخلی
   * حساب Supabase ندارد.
   */

  let result=null;

  try{
   result=await accessFunction({
    action:"login",
    phone,
    password
   });
  }catch(_){
   result=null;
  }

  /*
   * اگر Edge Function نشست معتبر برگرداند،
   * مستقیماً نشست Supabase را فعال می‌کنیم.
   */

  if(
   result?.session?.access_token &&
   result?.session?.refresh_token
  ){

   const sr=await db.auth.setSession({
    access_token:result.session.access_token,
    refresh_token:result.session.refresh_token
   });

   if(sr.error)throw sr.error;

   const u=result.user||{};

   if(
    u.status &&
    !["registered","approved"].includes(u.status)
   ){
    await db.auth.signOut();

    if(u.status==="rejected")
     throw new Error(
      "ثبت‌نام شما توسط مدیر رد شده است."
     );

    throw new Error(
     "ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
    );
   }

   let student=null;

   const studentId=u.student_id||u.id;

   if(studentId){
    const st=await db
     .from("students")
     .select("*")
     .eq("id",studentId)
     .maybeSingle();

    if(!st.error)student=st.data;
   }

   if(!student&&u.id){
    const st=await db
     .from("students")
     .select("*")
     .eq("auth_user_id",u.id)
     .maybeSingle();

    if(!st.error)student=st.data;
   }

   if(!student){
    throw new Error(
     "پروفایل زبان‌آموز پیدا نشد."
    );
   }

   if(
    !["registered","approved"].includes(
     student.status
    )
   ){

    await db.auth.signOut();

    if(student.status==="rejected")
     throw new Error(
      "ثبت‌نام شما توسط مدیر رد شده است."
     );

    throw new Error(
     "ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
    );
   }

   S.student=student;
   S.admin=false;

   await loadStudentStats();
   home();
   return;
  }

  /*
   * سازگاری با حساب‌های قدیمی:
   * اگر Edge Function جدید نشست نداد،
   * از روش قبلی استفاده می‌کنیم.
   */

  const found=await accessFunction({
   action:"find",
   phone
  });

  const student=found?.student;

  const email=String(
   found?.email ||
   student?.login_email ||
   `${phone}@alinagheli.com`
  ).trim().toLowerCase();

  if(!student)
   throw new Error(
    "زبان‌آموزی با این شماره پیدا نشد."
   );

  if(student.status==="rejected")
   throw new Error(
    "ثبت‌نام شما توسط مدیر رد شده است."
   );

  if(
   !["registered","approved"].includes(
    student.status
   )
  )
   throw new Error(
    "ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
   );

  const auth=await db.auth.signInWithPassword({
   email,
   password
  });

  if(
   auth.error ||
   !auth.data?.session
  )
   throw new Error(
    "شماره موبایل یا رمز عبور اشتباه است."
   );

  S.student=student;
  S.admin=false;

  await loadStudentStats();
  home();

 }catch(e){

  try{
   await db.auth.signOut()
  }catch(_){}

  alert(
   e?.message ||
   "ورود ناموفق بود."
  );
 }
}

/* ADMIN LOGIN */

async function adminLogin(){

 const email=
  document.getElementById("email")?.value
   .trim()
   .toLowerCase();

 const password=
  document.getElementById("pass")?.value||"";

 if(!email||!password){
  alert(
   "ایمیل و رمز عبور مدیر را وارد کنید."
  );
  return;
 }

 try{

  const r=await fetch(
   ADMIN_FUNCTION,
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY
    },
    body:JSON.stringify({
     action:"login",
     email,
     password
    })
   }
  );

  let data=null;

  try{
   data=await r.json()
  }catch(_){}

  if(
   !r.ok||
   !data?.ok||
   !data.session
  )
   throw new Error(
    data?.error||
    "ایمیل یا رمز عبور مدیر صحیح نیست."
   );

  await db.auth.setSession({
   access_token:data.session.access_token,
   refresh_token:data.session.refresh_token
  });

  S.admin=true;
  S.student=null;

  await admin();

 }catch(e){
  alert(
   e?.message||
   "ورود مدیر ناموفق بود."
  );
 }
}

async function register(){

  !first||
  !last||
  !phone||
  !password||

 if(password.length<6){
  alert("رمز عبور باید حداقل ۶ کاراکتر باشد.");

 const digits=normalizePhone(phone);

 if(!/^09\d{9}$/.test(digits)){

 const email=
  digits+"@alinagheli.com";

   email,
   password,

    data:{
     first_name:first,

  });

  if(r.error)throw r.error;

  if(!r.data.user)

  await accessFunction({
   action:"register",

   last_name:last,
   phone:digits,
   level,
   auth_user_id:r.data.user.id,
   email

    <li>سطح سؤال‌ها از آسان به سخت افزایش می‌یابد</li>
    <li>هر سؤال فقط یک پاسخ صحیح دارد</li>
    <li>در پایان رتبه شما بین شرکت‌کنندگان نمایش داده می‌شود</li>

function startExam(){

 S.quiz={
  index:0,
  score:0,
  answers:[]
 };

 examPage();
}

function examPage(){

 const q=examQuestions[S.quiz.index];

 if(!q){
  finishExam();
  return;
 }

 const n=S.quiz.index+1;

 render(
  "مسابقه رکوردی",
  `

  <div class="card">

   <div style="
    display:flex;
    justify-content:space-between;
    align-items:center
   ">

    <b>
     سؤال ${n} از 100
    </b>

    <b style="color:#6d28d9">
     امتیاز: ${S.quiz.score}
    </b>

   </div>

   <div class="levelBar"
        style="margin-top:12px">

    <i style="
     width:${n}%
    "></i>

   </div>

  </div>

  <div class="card">

   <h2 style="line-height:1.8">
    ${esc(q.q)}
   </h2>

   ${
    q.o.map(
     (option,i)=>`

     <button
      class="btn secondary full"
      style="
       text-align:right;
       padding:15px;
       margin-top:8px
      "
      onclick="answerExam(${i})">

      ${String.fromCharCode(65+i)})
      ${esc(option)}

     </button>

     `
    ).join("")
   }

  </div>

  `
 );
}

function answerExam(index){

 const q=examQuestions[S.quiz.index];

 S.quiz.answers.push(index);

 if(index===q.a)
  S.quiz.score++;

 S.quiz.index++;

 examPage();
}

/* FINISH EXAM + GLOBAL RANK */

async function finishExam(){

 const score=S.quiz.score;

 examRecords.push({
  score,
  total:100,
  date:new Date().toISOString()
 });

 examRecords.sort(
  (a,b)=>b.score-a.score
 );

 if(examRecords.length>20)
  examRecords=examRecords.slice(0,20);

 saveLocal();

 let rank=1;
 let totalParticipants=1;

 /*
  * ثبت نتیجه در دیتابیس برای محاسبه رتبه
  * بین تمام زبان‌آموزان.
  */

 try{

  if(S.student){

   const r=await db
    .from("exam_scores")
    .insert({
     student_id:S.student.id,
     score,
     total_questions:100
    });

   /*
    * حتی اگر جدول در نسخه قبلی وجود نداشته باشد،
    * نتیجه محلی همچنان نمایش داده می‌شود.
    */

   if(!r.error){

    const all=await db
     .from("exam_scores")
     .select("score,student_id");

    if(!all.error){

     const best={};

     (all.data||[]).forEach(x=>{

      if(
       !best[x.student_id]||
       Number(x.score)>
       Number(best[x.student_id])
      ){
       best[x.student_id]=Number(x.score);
      }

     });

     const scores=
      Object.values(best)
       .sort((a,b)=>b-a);

     totalParticipants=
      scores.length||1;

     rank=
      scores.filter(
       x=>x>score
      ).length+1;
    }
   }
  }

 }catch(e){

  /*
   * fallback به رکوردهای ذخیره‌شده روی دستگاه
   */

  const scores=
   examRecords
    .map(x=>Number(x.score)||0)
    .sort((a,b)=>b-a);

  rank=
   scores.filter(x=>x>score).length+1;

  totalParticipants=
   Math.max(
    scores.length,
    1
   );
 }

 const percentage=
  Math.round(score/100*100);

 if(score>=90)
  await unlockAchievement(
   "exam_master",
   "استاد مسابقه"
  );
 else if(score>=70)
  await unlockAchievement(
   "exam_expert",
   "شرکت‌کننده حرفه‌ای"
  );

 let rankText="";

 if(rank===1){

  rankText=`
   <div style="
    font-size:22px;
    font-weight:bold;
    color:#b45309;
    text-align:center;
    margin-top:15px
   ">
    🥇 شما از بین همه شرکت‌کنندگان
    دارای رتبه اول هستید!
   </div>
  `;

 }else if(rank===2){

  rankText=`
   <div style="
    font-size:22px;
    font-weight:bold;
    color:#6b7280;
    text-align:center;
    margin-top:15px
   ">
    🥈 شما از بین همه شرکت‌کنندگان
    دارای رتبه دوم هستید!
   </div>
  `;

 }else if(rank===3){

  rankText=`
   <div style="
    font-size:22px;
    font-weight:bold;
    color:#92400e;
    text-align:center;
    margin-top:15px
   ">
    🥉 شما از بین همه شرکت‌کنندگان
    دارای رتبه سوم هستید!
   </div>
  `;

 }else{

  rankText=`
   <div style="
    font-size:20px;
    font-weight:bold;
    color:#6d28d9;
    text-align:center;
    margin-top:15px
   ">
    🏆 شما از بین
    ${totalParticipants}
    شرکت‌کننده،
    دارای رتبه
    ${rank}
    هستید!
   </div>
  `;
 }

 render(
  "نتیجه مسابقه",
  `

  <div class="hero"
       style="text-align:center">

   <h2>
    🎉 مسابقه به پایان رسید
   </h2>

   <p>
    نتیجه نهایی شما
   </p>

  </div>

  <div class="card">

   <div class="resultBox"
        style="text-align:center">

    <div style="
     font-size:55px;
     font-weight:bold;
     color:#6d28d9
    ">
     ${score}/100
    </div>

    <h2>
     ${percentage}٪
    </h2>

    ${rankText}

   </div>

  </div>

  <div class="card">

   <h3>📊 عملکرد شما</h3>

   <p>
    پاسخ صحیح:
    <b>${score}</b>
   </p>

   <p>
    پاسخ نادرست:
    <b>${100-score}</b>
   </p>

   <p>
    درصد:
    <b>${percentage}٪</b>
   </p>

  </div>

  <button
   class="btn full"
   onclick="startExam()">
   🔄 شرکت مجدد
  </button>

  <button
   class="btn secondary full"
   onclick="home()">
   🏠 بازگشت به خانه
  </button>

  `
 );
}

  const req=

async function respondRequest(
 id,
 status
){

  const r=
   await db
    .from("teacher_requests")
    .update({status})
    .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){

  alert(
   "خطا:\n"+
   e.message
  );
 }
}

async function approve(id){

 try{

  const r=
   await db
    .from("students")
    .update({
     status:"registered"
    })
    .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){

  alert(
   "خطا در تأیید:\n"+
   e.message
  );
 }
}

async function rejectStudent(id){

 try{

  const r=
   await db
    .from("students")
    .update({
     status:"rejected"
    })
    .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){

  alert(
   "خطا:\n"+
   e.message
  );
 }
}

/* STARTUP */

async function startup(){

 try{

  const r=
   await db.auth.getSession();

  const session=
   r.data?.session;

  if(!session){
   login();
   return;
  }

  const user=session.user;

  /*
   * ابتدا مدیر را بررسی می‌کنیم.
   */

  try{

   const ar=
    await fetch(
     ADMIN_FUNCTION,
     {
      method:"POST",
      headers:{
       "Content-Type":"application/json",
       "apikey":SUPABASE_KEY,
       "Authorization":
        "Bearer "+
        session.access_token
      },
      body:JSON.stringify({
       action:"list"
      })
     }
    );

   const ad=
    await ar.json().catch(
     ()=>null
    );

   if(
    ar.ok &&
    ad?.ok
   ){

    S.admin=true;
    S.student=null;

    renderAdmin(
     Array.isArray(ad.students)?
      ad.students:[],
     Array.isArray(ad.requests)?
      ad.requests:[]
    );

    return;
   }

  }catch(_){}

  /*
   * سپس زبان‌آموز را از auth_user_id
   * پیدا می‌کنیم.
   */

  const st=
   await db
    .from("students")
    .select("*")
    .eq(
     "auth_user_id",
     user.id
    )
    .maybeSingle();

  if(
   st.data &&
   ["registered","approved"]
    .includes(st.data.status)
  ){

   S.student=st.data;

   await loadStudentStats();

   home();

   return;
  }

  /*
   * سازگاری با نسخه‌هایی که auth_user_id
   * درست ثبت نشده است.
   */

  const phone=
   normalizePhone(
    user.user_metadata?.phone||
    ""
   );

  if(phone){

   try{

    const found=
     await accessFunction({
      action:"find",
      phone
     });

    if(
     found?.student &&
     ["registered","approved"]
      .includes(
       found.student.status
      )
    ){

     S.student=
      found.student;

     await loadStudentStats();

     home();

     return;
    }

   }catch(_){}
  }

  await db.auth.signOut();

  login();

 }catch(e){

  try{
   await db.auth.signOut()
  }catch(_){}

  login();
 }
}

db.auth.onAuthStateChange(
 event=>{

  if(
   event==="SIGNED_OUT" &&
   !S.admin &&
   !S.student
  ){
   login();
  }

 }
);

startup();
