<style>
*{box-sizing:border-box}
:root{
 --primary:#6d28d9;
 --primary2:#8b5cf6;
 --light:#f7f5ff;
 --dark:#21153b;
 --text:#27213a;
 --muted:#777080;
 --white:#fff;
 --green:#16a34a;
 --red:#dc2626;
 --yellow:#f59e0b;
 --shadow:0 8px 30px rgba(65,38,115,.10);
}
html,body{margin:0;padding:0;background:#f4f1fa;color:var(--text);font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f8f7fb;position:relative;box-shadow:0 0 30px #00000008}
.screen{min-height:100vh;padding-bottom:88px}
.top{
 background:linear-gradient(135deg,#5b21b6,#7c3aed,#a78bfa);
 color:white;padding:22px 18px 26px;border-radius:0 0 30px 30px;
 box-shadow:0 10px 30px #6d28d933
}
.top h1{margin:0 0 7px;font-size:24px}
.top p{margin:0;opacity:.9;font-size:13px}
.container{padding:18px}
.card{
 background:#fff;border-radius:20px;padding:17px;margin-bottom:14px;
 box-shadow:var(--shadow)
}
.title{font-size:18px;font-weight:bold;margin:5px 0 14px}
.subtitle{font-size:12px;color:var(--muted);line-height:1.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
 border:0;border-radius:14px;padding:13px 15px;font-size:14px;
 background:var(--primary);color:white;font-weight:bold
}
.btn.secondary{background:#ede9fe;color:#5b21b6}
.btn.green{background:#dcfce7;color:#166534}
.btn.red{background:#fee2e2;color:#991b1b}
.btn.full{width:100%}
input{
 width:100%;padding:14px;border:1px solid #ddd6fe;border-radius:13px;
 outline:none;background:#fff;margin-bottom:10px;font-size:14px
}
input:focus{border-color:var(--primary)}
label{font-size:12px;font-weight:bold;display:block;margin:10px 3px 6px}
.nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(520px,100%);height:76px;background:#fff;
 display:flex;justify-content:space-around;align-items:center;
 border-top:1px solid #eee;z-index:50;box-shadow:0 -8px 25px #0000000c
}
.nav button{
 border:0;background:none;color:#8b8496;font-size:10px;
 display:flex;flex-direction:column;align-items:center;gap:4px
}
.nav button.active{color:var(--primary);font-weight:bold}
.nav .ico{font-size:23px}
.welcome{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:25px;background:linear-gradient(145deg,#4c1d95,#7c3aed,#c4b5fd)
}
.login-card{
 width:100%;max-width:430px;background:#fff;border-radius:32px;
 padding:28px;box-shadow:0 25px 70px #26104455
}
.logo{
 width:82px;height:82px;border-radius:25px;margin:0 auto 16px;
 background:linear-gradient(135deg,#6d28d9,#a78bfa);
 color:#fff;display:flex;align-items:center;justify-content:center;
 font-size:34px;font-weight:bold;box-shadow:0 12px 30px #6d28d955
}
.login-card h1{text-align:center;margin:5px 0 8px}
.login-card>p{text-align:center;color:var(--muted);font-size:12px;margin-bottom:25px}
.login-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.login-choice button{
 border:0;border-radius:20px;padding:22px 8px;background:#f5f3ff;color:#5b21b6;
 font-weight:bold;font-size:14px
}
.login-choice span{display:block;font-size:30px;margin-bottom:9px}
.back{border:0;background:none;color:#6d28d9;margin-bottom:10px;font-weight:bold}
.message{padding:11px;border-radius:12px;margin:8px 0;font-size:12px;line-height:1.8}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fff;border-radius:17px;padding:14px 7px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;color:var(--primary)}
.stat small{font-size:10px;color:var(--muted)}
.word-card{
 background:linear-gradient(135deg,#ede9fe,#fff);
 border:1px solid #ddd6fe
}
.word{font-size:28px;font-weight:bold;color:#5b21b6;margin:6px 0}
.meaning{color:#6b6474}
.speak{
 border:0;background:#6d28d9;color:#fff;border-radius:50%;
 width:44px;height:44px;font-size:19px
}
.course{
 background:#fff;border-radius:19px;padding:16px;box-shadow:var(--shadow);
 margin-bottom:12px;display:flex;align-items:center;gap:13px
}
.course .number{
 min-width:50px;height:50px;border-radius:16px;background:#ede9fe;
 color:#6d28d9;display:flex;align-items:center;justify-content:center;font-weight:bold
}
.course h3{margin:0 0 5px;font-size:15px}
.course p{margin:0;color:var(--muted);font-size:11px}
.lesson-head{
 background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:white;
 padding:22px;border-radius:24px;margin-bottom:14px
}
.lesson-head h2{margin:0 0 7px}
.lesson-card{
 background:#fff;border-radius:18px;padding:17px;margin-bottom:12px;
 box-shadow:var(--shadow)
}
.lesson-card h3{margin-top:0;color:#5b21b6}
.example{
 background:#f7f5ff;border-right:4px solid #8b5cf6;
 padding:12px;margin:10px 0;border-radius:10px;line-height:2
}
.vocab{
 display:flex;align-items:center;justify-content:space-between;
 border-bottom:1px solid #eee;padding:12px 0
}
.vocab:last-child{border:0}
.vocab b{color:#4c1d95;font-size:15px}
.vocab span{font-size:12px;color:var(--muted)}
.vocab button{width:38px;height:38px;border:0;border-radius:50%;background:#ede9fe}
.option{
 border:1px solid #ddd6fe;background:#fff;width:100%;
 padding:13px;border-radius:13px;text-align:right;margin:6px 0
}
.option.correct{background:#dcfce7;border-color:#22c55e}
.option.wrong{background:#fee2e2;border-color:#ef4444}
.result{
 text-align:center;padding:20px;border-radius:20px;background:#fff;
 box-shadow:var(--shadow);margin-bottom:15px
}
.result .emoji{font-size:55px}
.score{font-size:30px;font-weight:bold;color:var(--primary)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;text-align:center;border-bottom:1px solid #eee}
th{background:#f5f3ff;color:#5b21b6}
.teacher{text-align:center}
.teacher-avatar{
 width:100px;height:100px;border-radius:50%;margin:auto;
 background:linear-gradient(135deg,#6d28d9,#a78bfa);

.phone{

.empty{text-align:center;padding:30px;color:var(--muted)}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#ede9fe;color:#6d28d9;font-size:10px}
</style>
</head>

function escapeHTML(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function speak(text){
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=.82;
  u.pitch=1;
  speechSynthesis.speak(u);
 }catch(e){}
}

function normalizePhone(phone){
 phone=(phone||"").replace(/\s|-/g,"");
 if(phone.startsWith("+98")) phone="0"+phone.slice(3);
 if(phone.startsWith("0098")) phone="0"+phone.slice(4);
 return phone;
}

async function studentLogin(){
 const phone=normalizePhone(document.getElementById("loginPhone").value);
 const password=document.getElementById("loginPassword").value;

 if(!/^09\d{9}$/.test(phone)){
  showMessage("شماره موبایل باید به شکل 091xxxxxxxx باشد.");
  return;
 }

 if(!password){
  showMessage("رمز عبور را وارد کنید.");
  return;
 }

 showMessage("در حال ورود...","success");

 try{
  /*
   مهم:
   Supabase در صورتی که Phone Authentication فعال باشد،
   اجازه ورود مستقیم با phone + password را می‌دهد.
   بنابراین دیگر شماره به ایمیل ساختگی تبدیل نمی‌شود.
  */
  const {data,error}=await supabaseClient.auth.signInWithPassword({
   phone:phone,
   password:password
  });

  if(error){
   showMessage("ورود ناموفق بود: "+error.message);
   return;
  }

  currentUser=data.user;

  let student=null;

  const r1=await supabaseClient
   .from("students")
   .select("*")
   .eq("auth_user_id",currentUser.id)
   .maybeSingle();

  if(!r1.error && r1.data) student=r1.data;

  if(!student){
   const r2=await supabaseClient
    .from("students")
    .select("*")
    .eq("phone",phone)
    .maybeSingle();

   if(!r2.error && r2.data) student=r2.data;
  }

  /*
   اگر حساب Auth درست باشد ولی رکورد students وجود نداشته باشد،
   ورود را بی‌دلیل با خطای «شماره پیدا نشد» متوقف نمی‌کنیم.
  */
  currentStudent=student||{
   first_name:"",
   last_name:"",
   phone:phone,
   level:"مقدماتی",
   status:"registered"
  };

  currentPage="home";
  renderHome();

 }catch(err){
  showMessage("خطای ارتباط با سامانه: "+err.message);
 }
}

 const {data,error}=await supabaseClient.auth.signInWithPassword({

 });

}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-.5);
}

function startGrade7Quiz(){
 quizQuestions=shuffle(grade7Questions).slice(0,50);
 quizType="grade7";
 quizIndex=0;
 quizScore=0;
 quizAnswers=[];
 renderQuiz();
}

function startLessonQuiz(n){
 quizQuestions=shuffle(lessonQuiz[n]||grade7Questions.slice(0,5));
 quizType="lesson"+n;
 quizIndex=0;
 quizScore=0;
 quizAnswers=[];
 renderQuiz();
}

function renderQuiz(){
 if(quizIndex>=quizQuestions.length){
  finishQuiz();
  return;
 }

 const q=quizQuestions[quizIndex];
 const correct=q[1];
 const options=shuffle(q.slice(1));

 root(`

  <div class="top">

    <h2 style="line-height:1.8">${escapeHTML(q[0])}</h2>

    ${options.map(o=>`
     <button class="option" onclick="answerQuiz(this,${JSON.stringify(o)},${JSON.stringify(correct)})">

/* =========================================================
   SAVE / LOAD SCORES
========================================================= */

async function saveScore(testName,percent){
 if(!currentUser)return;

 /*
  اگر جدول test_results در دیتابیس ساخته نشده باشد،
  نتیجه در localStorage هم ذخیره می‌شود تا آزمون و رکورد
  کاربر از بین نرود.
 */
 const localKey="alinagheli_scores_"+currentUser.id;
 const old=JSON.parse(localStorage.getItem(localKey)||"[]");

 old.push({
  test_name:testName,
  score:percent,
  created_at:new Date().toISOString()
 });

 localStorage.setItem(localKey,JSON.stringify(old));

 try{
  await supabaseClient.from("test_results").insert({
   user_id:currentUser.id,
   student_id:currentStudent?.id||null,
   test_name:testName,
   score:percent
  });
 }catch(e){}
}

async function getScores(){
 let scores=[];

 if(currentUser){
  const localKey="alinagheli_scores_"+currentUser.id;
  scores=JSON.parse(localStorage.getItem(localKey)||"[]");
 }

 try{
  if(currentUser){
   const {data,error}=await supabaseClient
    .from("test_results")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

   if(!error&&data&&data.length){
    scores=data.map(x=>({
     test_name:x.test_name,
     score:x.score,
     created_at:x.created_at
    }));
   }
  }
 }catch(e){}

 return scores;
}

async function loadScores(elementId){
 const el=document.getElementById(elementId);
 if(!el)return;

 const scores=await getScores();

 if(!scores.length){
  el.innerHTML="<div class='empty'>هنوز آزمونی ثبت نشده است.</div>";
  return;
 }

 el.innerHTML=`
 <table>
  <thead>
   <tr><th>آزمون</th><th>نمره</th><th>تاریخ</th></tr>
  </thead>
  <tbody>
   ${scores.map((s,i)=>`
    <tr>
     <td>${escapeHTML(s.test_name||"آزمون")}</td>
     <td><b>${s.score}%</b></td>
     <td>${new Date(s.created_at).toLocaleDateString("fa-IR")}</td>
    </tr>
   `).join("")}
  </tbody>
 </table>`;
}

async function checkSession(){
 const {data}=await supabaseClient.auth.getSession();

 if(data?.session){
  currentUser=data.session.user;

  /*
   تشخیص ورود مدیر بر اساس وجود email.
   زبان‌آموزان با Phone Auth وارد می‌شوند.
  */
  if(currentUser.email){
   renderAdmin();
   return;
  }

  const {data:student}=await supabaseClient
   .from("students")
   .select("*")
   .eq("auth_user_id",currentUser.id)
   .maybeSingle();

  currentStudent=student||{
   phone:currentUser.phone||"",
   status:"registered"
  };

  currentPage="home";
  renderHome();
 }else{
  loginScreen();
 }
}
