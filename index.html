<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--p:#6d28d9;--p2:#8b5cf6;--bg:#f7f5ff;--card:#fff;--txt:#191329;--mut:#716b82;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b}
body{margin:0;background:linear-gradient(135deg,#f8f6ff,#eee9ff);font-family:Tahoma,Arial,sans-serif;color:var(--txt)}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh}
header{background:linear-gradient(135deg,#4c1d95,#7c3aed,#a78bfa);color:white;padding:18px;border-radius:0 0 28px 28px;box-shadow:0 8px 30px #5b21b622}
.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.sub{font-size:12px;opacity:.85;margin-top:5px}
main{padding:16px 13px 100px}.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 25px #4c1d9512}
.hero{background:linear-gradient(135deg,#fff,#f1ebff)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.course{border:0;border-radius:20px;padding:18px 10px;min-height:135px;color:white;background:linear-gradient(145deg,#6d28d9,#9333ea);box-shadow:0 8px 20px #6d28d933}
.course i{font-style:normal;font-size:40px;display:block}.course b{font-size:17px}.course small{display:block;margin-top:6px;opacity:.85}
.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--p);color:#fff;font-weight:bold}.btn.full{width:100%;margin-top:8px}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gray{background:#eeeef2;color:#222}.btn.light{background:#ede9fe;color:#5b21b6}
input,select{width:100%;padding:12px;border:1px solid #ddd6fe;border-radius:12px;outline:none;background:white}
label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.field{margin-bottom:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1100px,100%);z-index:50;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -7px 25px #00000018;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;color:#777;font-size:11px}.nav button.active{color:var(--p);font-weight:bold}.nav span{font-size:21px;display:block}
.lesson{width:100%;border:1px solid #e5def5;background:white;border-radius:16px;padding:14px;text-align:right;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.num{width:38px;height:38px;border-radius:12px;background:#ede9fe;color:#5b21b6;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;margin-left:9px}
.vocab{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.speaker{border:0;background:#ede9fe;color:#5b21b6;border-radius:11px;width:40px;height:40px;font-size:19px}
.en{direction:ltr;text-align:left;font-weight:bold}.fa{font-size:12px;color:var(--mut)}
.grammar{background:#faf8ff;border-right:4px solid var(--p);border-radius:14px;padding:15px;line-height:2.15;margin:10px 0}.example{direction:ltr;text-align:left;background:#fff;border:1px solid #e7e1f3;padding:11px;border-radius:12px;margin:8px 0}
.q{border:1px solid #e5def5;border-radius:17px;padding:14px;margin-bottom:12px;background:#fff}.opt{display:block;width:100%;border:1px solid #ddd6fe;background:#fff;border-radius:11px;padding:11px;text-align:right;margin-top:7px}.opt.ok{background:#dcfce7;border-color:#22c55e;color:#166534}.opt.bad{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;background:white;border-radius:22px;padding:15px 25px;box-shadow:0 10px 35px #0003;text-align:center;font-size:34px;animation:pop .25s}.feedback b{display:block;font-size:14px}@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.result{text-align:center;background:linear-gradient(135deg,#f0eaff,#fff);border-radius:22px;padding:25px}.percent{font-size:50px;font-weight:900;color:var(--p)}
.teacher{text-align:center;background:linear-gradient(135deg,#fff,#f0eaff);border-radius:22px;padding:22px;margin-bottom:14px}.avatar{font-size:55px}.phone{display:inline-block;color:#5b21b6;font-weight:bold;text-decoration:none;direction:ltr;margin-top:8px}
.rank{display:flex;justify-content:space-between;padding:13px;border-bottom:1px solid #eee}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ede9fe;color:#5b21b6;font-size:11px}
.modal{position:fixed;inset:0;background:#170b2eaa;z-index:100;display:flex;align-items:center;justify-content:center;padding:15px}.modalbox{background:#fff;border-radius:24px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.close{float:left;border:0;border-radius:10px;width:35px;height:35px}
table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:12px}th{background:#f5f3ff}.scroll{overflow:auto}
.hidden{display:none!important}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="toast" class="hidden"></div>

<section id="login" class="app">
<header><div class="logo">AliNagheli English</div><div class="sub">سامانه آموزش زبان انگلیسی</div></header>
<main>
<div class="card hero">
<h2>🎓 به AliNagheli English خوش آمدید</h2>

<div class="card">
<h3>🔐 ورود زبان‌آموز</h3>
<div class="field"><label>شماره موبایل</label><input id="li" placeholder="0914..."></div>
<div class="field"><label>رمز عبور</label><input id="lp" type="password"></div>

<main id="adminContent"></main>
</section>

<div id="modal" class="modal hidden"><div id="modalbox" class="modalbox"></div></div>

<script>
const URL="https://kapzyedzjecnfxevjisq.supabase.co";
const KEY="sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";
const ADMIN="alinagheli@gmail.com";
const sb=window.supabase.createClient(URL,KEY);
let user=null,student=null,currentCourse=null,currentLesson=null;

const school={
7:{n:"هفتم",b:"Prospect 1",i:"🎒",count:8},
8:{n:"هشتم",b:"Prospect 2",i:"📘",count:8},
9:{n:"نهم",b:"Prospect 3",i:"📗",count:8},
10:{n:"دهم",b:"Vision 1",i:"📕",count:4},
11:{n:"یازدهم",b:"Vision 2",i:"📙",count:4},
12:{n:"دوازدهم",b:"Vision 3",i:"📚",count:4}
};

const conv=[
["Touchstone 1","🗣️",12],["Touchstone 2","💬",12],
["Touchstone 3","🎧",12],["Touchstone 4","🎤",12],
["Viewpoint 1","🌎",12],["Viewpoint 2","🌍",12]
];

const baseVocab=[
["hello","سلام"],["student","دانش‌آموز"],["teacher","معلم"],
["school","مدرسه"],["book","کتاب"],["class","کلاس"],
["friend","دوست"],["family","خانواده"],["city","شهر"],["country","کشور"],
["English","انگلیسی"],["learn","یاد گرفتن"],["speak","صحبت کردن"],["listen","گوش دادن"],["practice","تمرین"]
];

const lessonQuestions=[
["Which word means «دانش‌آموز»?",["student","teacher","school","book"],0],
["Choose the correct sentence.",["I am a student.","I is a student.","I are a student.","I be a student."],0],
["Which word means «معلم»?",["teacher","student","friend","class"],0],
["Choose the correct form: She ___ my friend.",["is","am","are","be"],0],
["Which word means «مدرسه»?",["school","country","city","book"],0],
["Choose the correct sentence.",["They are students.","They is students.","They am students.","They be students."],0],
["Which word means «کتاب»?",["book","class","teacher","school"],0],
["Choose the correct form: I ___ from Iran.",["am","is","are","be"],0],
["Choose the correct form: We ___ students.",["are","is","am","be"],0],
["Which word means «دوست»?",["friend","family","teacher","country"],0],
["Choose the correct sentence.",["He is a student.","He are a student.","He am a student.","He be a student."],0],
["Which word means «خانواده»?",["family","class","school","city"],0],
["Choose the correct sentence.",["It is a book.","It are a book.","It am a book.","It be a book."],0],
["Which word means «کشور»?",["country","city","class","friend"],0],
["Choose the correct sentence.",["She is from Iran.","She are from Iran.","She am from Iran.","She be from Iran."],0]
];

function toast(x){
let t=document.getElementById("toast");t.textContent=x;
t.style.cssText="position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:9999;background:#191329;color:white;padding:12px 20px;border-radius:14px";
t.classList.remove("hidden");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add("hidden"),2800);
}
function modal(x){document.getElementById("modalbox").innerHTML=x;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function registerModal(){
modal(`<button class="close" onclick="closeModal()">×</button><h2>📝 ثبت‌نام</h2>
<div class="field"><label>نام</label><input id="rf"></div>
<div class="field"><label>نام خانوادگی</label><input id="rl"></div>
<div class="field"><label>شماره موبایل</label><input id="rp" placeholder="0914..."></div>
<div class="field"><label>پایه</label><select id="rv">${Object.entries(school).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("")}</select></div>
<div class="field"><label>رمز عبور</label><input id="rpass" type="password"></div>
<button class="btn ok full" onclick="register()">ثبت درخواست</button>`);
}
async function register(){
let f=rf.value.trim(),l=rl.value.trim(),p=rp.value.trim(),v=rv.value,pass=rpass.value;
if(!f||!l||!p||!pass)return toast("همه اطلاعات را وارد کنید");
let email=p+"@alinagheli.local";
let {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{first_name:f,last_name:l,phone:p,level:v}}});
if(error)return toast(error.message);
if(data.user){
let r=await sb.from("students").insert({first_name:f,last_name:l,phone:p,level:v,status:"waiting",auth_user_id:data.user.id,password_created:true});
if(r.error)return toast(r.error.message);
toast("درخواست ثبت‌نام ارسال شد");closeModal();
}
}
function adminModal(){
modal(`<button class="close" onclick="closeModal()">×</button><h2>👨‍💼 ورود مدیر</h2>
<div class="field"><label>ایمیل</label><input value="${ADMIN}" readonly></div>
<div class="field"><label>رمز عبور</label><input id="ap" type="password"></div>
<button class="btn full" onclick="adminLogin()">ورود مدیر</button>`);
}
async function adminLogin(){
let {data,error}=await sb.auth.signInWithPassword({email:ADMIN,password:ap.value});
if(error)return toast("رمز عبور مدیر صحیح نیست");
user=data.user;closeModal();login.classList.add("hidden");student.classList.add("hidden");admin.classList.remove("hidden");renderAdmin();
}
async function studentLogin(){
let p=li.value.trim(),pass=lp.value;
if(!p||!pass)return toast("اطلاعات ورود را وارد کنید");
let {data,error}=await sb.auth.signInWithPassword({email:p+"@alinagheli.local",password:pass});
if(error)return toast("شماره موبایل یا رمز عبور اشتباه است");
user=data.user;
let r=await sb.from("students").select("*").eq("auth_user_id",user.id).maybeSingle();
if(r.error||!r.data)return toast("اطلاعات زبان‌آموز پیدا نشد");
if(r.data.status==="waiting"){await sb.auth.signOut();return toast("حساب شما هنوز تأیید نشده است")}
if(r.data.status==="rejected"){await sb.auth.signOut();return toast("درخواست شما رد شده است")}
student=r.data;login.classList.add("hidden");admin.classList.add("hidden");studentSection();
}
function studentSection(){
document.getElementById("student").classList.remove("hidden");
welcome.textContent=`سلام ${student.first_name} عزیز 🌷`;go("home");
}
function go(page){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
let id={home:"n-home",courses:"n-courses",competition:"n-comp",records:"n-records",teacher:"n-teacher"}[page];
if(id)document.getElementById(id).classList.add("active");
if(page==="home")home();if(page==="courses")courses();if(page==="competition")competition();if(page==="records")records();if(page==="teacher")teacher();
scrollTo(0,0);
}
function home(){
content.innerHTML=`<div class="card hero"><h2>👋 سلام ${esc(student.first_name)}</h2><p>به سامانه آموزشی خوش آمدی.</p><div class="grid">
<button class="course" onclick="go('courses')"><i>📚</i><b>دوره‌ها</b><small>مدرسه و مکالمه</small></button>
<button class="course" onclick="go('competition')"><i>🏆</i><b>مسابقه</b><small>۲۰ سؤال</small></button>
<button class="course" onclick="go('records')"><i>📊</i><b>رکوردها</b><small>نتایج من</small></button></div></div>`;
}
function courses(){
content.innerHTML=`<div class="card"><h2>🏫 مدرسه</h2><div class="grid">${Object.entries(school).map(([k,v])=>`<button class="course" onclick="openSchool(${k})"><i>${v.i}</i><b>پایه ${v.n}</b><small>${v.b} • ${v.count} درس</small></button>`).join("")}</div></div>
<div class="card"><h2>🗣️ مکالمه</h2><div class="grid">${conv.map(x=>`<button class="course" onclick="openConv('${x[0]}',${x[2]})"><i>${x[1]}</i><b>${x[0]}</b><small>${x[2]} Unit</small></button>`).join("")}</div></div>
<div class="card"><h2>👨‍🏫 مدرسان</h2><p>🚧 در حال تکمیل ...</p></div>`;
}
function openSchool(level){
let c=school[level];currentCourse={type:"school",level};
content.innerHTML=`<div class="card"><button class="btn light" onclick="courses()">← بازگشت</button><h2>${c.i} پایه ${c.n}</h2><span class="badge">${c.b}</span></div><div class="card"><div>${Array.from({length:c.count},(_,i)=>`<button class="lesson" onclick="lesson(${level},${i+1},'school')"><span><span class="num">${i+1}</span><b>درس ${i+1}</b><small>لغات • گرامر • آزمون</small></span><b>›</b></button>`).join("")}</div></div>`;
}
function openConv(name,count){
currentCourse={type:"conv",name,count};
content.innerHTML=`<div class="card"><button class="btn light" onclick="courses()">← بازگشت</button><h2>🗣️ ${name}</h2><p>واژگان، گرامر، کاربرد مکالمه و آزمون هر Unit.</p></div><div class="card">${Array.from({length:count},(_,i)=>`<button class="lesson" onclick="convLesson('${name}',${i+1})"><span><span class="num">${i+1}</span><b>Unit ${i+1}</b><small>Vocabulary • Grammar • Test</small></span><b>›</b></button>`).join("")}</div>`;
}
function vocabHTML(){
return baseVocab.map(v=>`<div class="vocab"><button class="speaker" onclick="speak('${v[0]}')">🔊</button><div><div class="en">${v[0]}</div><div class="fa">${v[1]}</div></div></div>`).join("");
}
function grammarHTML(title){
return `<div class="grammar"><b>📚 ${title} — توضیح ساده گرامر</b>
<p>در زبان انگلیسی جای کلمات در جمله اهمیت زیادی دارد. ابتدا فاعل را مشخص کن، سپس فعل مناسب را انتخاب کن و بعد اطلاعات تکمیلی جمله را قرار بده.</p>
<p><b>فاعل + فعل + ادامه جمله</b> یکی از الگوهای مهم جمله‌سازی است. برای I معمولاً از am، برای he/she/it از is و برای you/we/they از are استفاده می‌کنیم.</p>
<p>برای سؤال ساختن نیز باید به نوع جمله توجه کنیم. هنگام یادگیری، جمله را با صدای بلند بخوان و سپس یک جمله مشابه درباره خودت بساز.</p></div>
<div class="example">I am a student.<br>من دانش‌آموز هستم.</div>
<div class="example">She is my friend.<br>او دوست من است.</div>
<div class="example">We are in the classroom.<br>ما در کلاس هستیم.</div>
<div class="example">They are students.<br>آن‌ها دانش‌آموز هستند.</div>`;
}
function lesson(level,num){
currentLesson={type:"school",level,num};
content.innerHTML=`<div class="card"><button class="btn light" onclick="openSchool(${level})">← درس‌ها</button><h2>${school[level].i} پایه ${school[level].n} — درس ${num}</h2></div>
<div class="card"><h3>📖 لغات</h3>${vocabHTML()}</div>
<div class="card"><h3>📚 گرامر</h3>${grammarHTML("درس "+num)}</div>
<div class="card"><h3>📝 آزمون درس ${num}</h3><div id="test"></div></div>`;
renderTest(lessonQuestions,"lesson",`${school[level].n} - درس ${num}`);
}
function convLesson(name,num){
currentLesson={type:"conv",name,num};
content.innerHTML=`<div class="card"><button class="btn light" onclick="openConv('${name}',${currentCourse.count})">← Unitها</button><h2>🗣️ ${name} — Unit ${num}</h2></div>
<div class="card"><h3>📖 Vocabulary</h3>${vocabHTML()}</div>
<div class="card"><h3>📚 Grammar & Conversation</h3>${grammarHTML("Unit "+num)}</div>
<div class="card"><h3>📝 آزمون Unit ${num}</h3><div id="test"></div></div>`;
renderTest(lessonQuestions,"lesson",`${name} - Unit ${num}`);
}
function feedback(ok){
let d=document.createElement("div");d.className="feedback";d.innerHTML=ok?`🎉<b>آفرین! پاسخ درست است ✓</b>`:`😢<b>پاسخ اشتباه است ✕</b>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1100);
}
function renderTest(qs,type,title){
let score=0,done=0;
test.innerHTML=qs.map((q,i)=>`<div class="q" data-done="0"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" onclick="answer(this,${j},${q[2]},${i},'${type}')">${o}</button>`).join("")}</div>`).join("");
window.testState={score,done,total:qs.length,title,type};
}
function answer(btn,j,c,i,type){
let q=btn.parentElement;if(q.dataset.done==="1")return;q.dataset.done="1";
let opts=q.querySelectorAll(".opt");opts.forEach(x=>x.disabled=true);
let ok=j===c;if(ok){btn.classList.add("ok");btn.innerHTML="✓ "+btn.innerHTML;testState.score++}else{btn.classList.add("bad");btn.innerHTML="✕ "+btn.innerHTML;opts[c].classList.add("ok")}
testState.done++;feedback(ok);
if(testState.done===testState.total)finishTest();
}
async function finishTest(){
let pct=Math.round(testState.score/testState.total*100);
let box=document.createElement("div");box.className="result";box.innerHTML=`<h2>🎉 آزمون تمام شد</h2><div class="percent">${pct}%</div><p>${testState.score} پاسخ صحیح از ${testState.total}</p><h3>${pct>=80?"🌟 عالی بود!":pct>=60?"😊 خوب بود!":"💪 دوباره تمرین کن!"}</h3>`;document.getElementById("test").appendChild(box);
await saveRecord("آزمون",testState.title,pct);
}
async function saveRecord(type,title,score){
try{await sb.from("records").insert({user_id:user.id,type,title,score})}catch(e){console.warn(e)}
}
function competition(){
let groups=[["7","هفتمی‌ها","🎒"],["8","هشتمی‌ها","📘"],["9","نهمی‌ها","📗"],["10","دهمی‌ها","📕"],["11","یازدهمی‌ها","📙"],["12","دوازدهمی‌ها","📚"],["c","مکالمه","🗣️"]];
content.innerHTML=`<div class="card"><h2>🏆 مسابقات</h2><p>۲۰ سؤال، امتیاز مثبت و نمره منفی.</p>${groups.map(g=>`<button class="lesson" onclick="startComp('${g[0]}','${g[1]}')"><span><span class="num">${g[2]}</span><b>مسابقه ${g[1]}</b></span><b>›</b></button>`).join("")}</div>`;
}
function startComp(group,name){
let qs=[...lessonQuestions,...lessonQuestions.slice(0,5)];
content.innerHTML=`<div class="card"><button class="btn light" onclick="competition()">← مسابقات</button><h2>🏆 مسابقه ${name}</h2><p>۲۰ سؤال از آسان به سخت</p><div id="ct"></div></div>`;
let score=0,done=0;
ct.innerHTML=qs.map((q,i)=>`<div class="q" data-done="0"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" onclick="compAns(this,${j},${q[2]})">${o}</button>`).join("")}</div>`).join("");
window.comp={score,done,total:20,name};
}
function compAns(btn,j,c){
let q=btn.parentElement;if(q.dataset.done==="1")return;q.dataset.done="1";
let opts=q.querySelectorAll(".opt");opts.forEach(x=>x.disabled=true);let ok=j===c;
if(ok){comp.score++;btn.classList.add("ok");btn.innerHTML="✓ "+btn.innerHTML}else{comp.score-=.25;btn.classList.add("bad");btn.innerHTML="✕ "+btn.innerHTML;opts[c].classList.add("ok")}
comp.done++;feedback(ok);
if(comp.done===20){let pct=Math.max(0,Math.round(comp.score/20*100));let d=document.createElement("div");d.className="result";d.innerHTML=`<h2>🏆 نتیجه مسابقه</h2><div class="percent">${pct}%</div><p>امتیاز: ${comp.score.toFixed(2)}</p><div class="rank">🥇 نفر اول <span>در حال ثبت نتایج</span></div><div class="rank">🥈 نفر دوم <span>در حال ثبت نتایج</span></div><div class="rank">🥉 نفر سوم <span>در حال ثبت نتایج</span></div>`;ct.appendChild(d);saveRecord("مسابقه",comp.name,pct)}
}
async function records(){
content.innerHTML=`<div class="card"><h2>📊 رکوردهای من</h2><div id="rec">در حال دریافت...</div></div>`;
let r=await sb.from("records").select("*").eq("user_id",user.id).order("created_at",{ascending:false});
if(r.error||!r.data.length)return rec.innerHTML="<p>هنوز رکوردی ثبت نشده است.</p>";
rec.innerHTML=r.data.map(x=>`<div class="rank"><span><b>${esc(x.title)}</b><small>${esc(x.type)}</small></span><b>${x.score}%</b></div>`).join("");
}

async function renderAdmin(){
adminContent.innerHTML=`<div class="card"><h2>👨‍💼 درخواست‌های ثبت‌نام</h2><div id="alist">در حال دریافت...</div></div>`;
let r=await sb.from("students").select("*").order("id",{ascending:false});
if(r.error)return alist.innerHTML="<p>خطا در دریافت اطلاعات.</p>";
if(!r.data.length)return alist.innerHTML="<p>درخواستی وجود ندارد.</p>";
alist.innerHTML=`<div class="scroll"><table><tr><th>نام</th><th>موبایل</th><th>پایه</th><th>وضعیت</th><th>عملیات</th></tr>${r.data.map(s=>`<tr><td>${esc(s.first_name)} ${esc(s.last_name)}</td><td><a class="phone" href="tel:${esc(s.phone)}">${esc(s.phone)}</a></td><td>${esc(s.level)}</td><td>${s.status}</td><td>${s.status==="waiting"?`<button class="btn ok" onclick="approve('${s.id}')">تأیید</button> <button class="btn bad" onclick="reject('${s.id}')">رد</button>`:"—"}</td></tr>`).join("")}</table></div>`;
}
async function approve(id){let r=await sb.from("students").update({status:"registered"}).eq("id",id);if(r.error)return toast("خطا");toast("تأیید شد");renderAdmin()}
async function reject(id){let r=await sb.from("students").update({status:"rejected"}).eq("id",id);if(r.error)return toast("خطا");toast("رد شد");renderAdmin()}
function speak(word){
if(!("speechSynthesis"in window))return toast("مرورگر از تلفظ صوتی پشتیبانی نمی‌کند");
speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.78;u.volume=1;speechSynthesis.speak(u);
}
async function logout(){try{await sb.auth.signOut()}catch(e){}user=null;student=null;document.getElementById("student").classList.add("hidden");document.getElementById("admin").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
(async()=>{let r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;if(user.email===ADMIN){login.classList.add("hidden");admin.classList.remove("hidden");renderAdmin()}else{let s=await sb.from("students").select("*").eq("auth_user_id",user.id).maybeSingle();if(s.data&&s.data.status==="registered"){student=s.data;login.classList.add("hidden");studentSection()}else await sb.auth.signOut()}}})();
</script>
