<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d28d9">

<title>AliNagheli English</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --p:#6d28d9;
  --p2:#8b5cf6;
  --bg:#f7f5fb;
  --card:#fff;
  --text:#211b2d;
  --muted:#777080;
  --border:#e8e1f0;
  --green:#16a34a;
  --orange:#ea580c;
  --blue:#2563eb;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.top{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:white;
  padding:18px 16px 25px;
  border-radius:0 0 25px 25px;
}

.topin{
  max-width:900px;
  margin:auto;
}

.toprow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.logout{
  background:#ffffff25;
  color:white;
  padding:8px 12px;
  border-radius:10px;
}

.hello{
  margin-top:25px;
}

.hello h1{
  margin:0;
  font-size:25px;
}

.hello p{
  opacity:.85;
  margin-bottom:0;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:15px 12px 100px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 6px 22px #32134c0a;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.sectionTitle h2{
  margin:0;
  font-size:18px;
}

.sectionTitle span{
  font-size:12px;
  color:var(--p);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:-18px;
  position:relative;
}

.stat{
  background:white;
  border-radius:16px;
  padding:13px 8px;
  text-align:center;
  border:1px solid var(--border);
  box-shadow:0 5px 18px #32134c12;
}

.statIcon{
  font-size:22px;
}

.stat b{
  display:block;
  font-size:18px;
  margin-top:5px;
}

.stat small{
  color:var(--muted);
  font-size:10px;
}

.lesson{
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);
  color:white;
  border-radius:18px;
  padding:18px;
}

.lessonTag{
  display:inline-block;
  background:#ffffff25;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
}

.lesson h2{
  margin:12px 0 6px;
}

.lesson p{
  opacity:.9;
  font-size:13px;
}

.progress{
  height:9px;
  background:#ffffff35;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0 10px;
}

.progress div{
  height:100%;
  background:white;
  border-radius:20px;
}

.start{
  background:white;
  color:var(--p);
  width:100%;
  padding:12px;
  border-radius:12px;
  font-weight:900;
}

.modules{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.module{
  background:#faf8fd;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  text-align:center;
}

.module .icon{
  font-size:30px;
}

.module b{
  display:block;
  margin-top:7px;
}

.module small{
  color:var(--muted);
  font-size:11px;
}

.words{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:4px;
}

.word{
  min-width:145px;
  background:#faf8fd;
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
}

.word b{
  direction:ltr;
  display:block;
  font-size:18px;
}

.word span{
  color:var(--muted);
  font-size:12px;
}

.xpbar{
  background:#eee8f7;
  height:12px;
  border-radius:20px;
  overflow:hidden;
}

.xpbar div{
  background:linear-gradient(90deg,#6d28d9,#a78bfa);
  height:100%;
  width:64%;
}

.achievement{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--border);
}

.achievement:last-child{
  border-bottom:0;
}

.achievementIcon{
  width:45px;
  height:45px;
  border-radius:13px;
  background:#ede9fe;
  display:grid;
  place-items:center;
  font-size:23px;
}

.achievement small{
  color:var(--muted);
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.lessonPage h1{
  font-size:22px;
}

.question{
  background:#faf8fd;
  padding:18px;
  border-radius:16px;
  margin:12px 0;
}

.option{
  width:100%;
  background:white;
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
  margin-top:8px;
  text-align:right;
}

.option.correct{
  background:#dcfce7;
  border-color:#16a34a;
}

.option.wrong{
  background:#fee2e2;
  border-color:#dc2626;
}

.bigWord{
  direction:ltr;
  text-align:center;
  font-size:36px;
  font-weight:900;
  color:var(--p);
  padding:25px 0 8px;
}

.center{
  text-align:center;
}

.primary{
  background:var(--p);
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-weight:800;
}

.secondary{
  background:#eee8f7;
  color:#4c3568;
  padding:12px 18px;
  border-radius:12px;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  background:white;
  border-top:1px solid var(--border);
  z-index:20;
}

.navin{
  max-width:700px;
  margin:auto;
  display:flex;
  height:100%;
}

.nav button{
  flex:1;
  background:white;
  color:#777080;
  font-size:10px;
}

.nav button span{
  display:block;
  font-size:22px;
  margin-bottom:3px;

.nav button.active{

  font-weight:900;
}

.login{

  margin:70px auto;

.logo{
  width:80px;
  height:80px;
  border-radius:25px;
  background:linear-gradient(135deg,var(--p),var(--p2));

  display:grid;
  place-items:center;

  font-size:28px;

input{

  margin:6px 0 12px;
  outline:none;

.btn{

  padding:13px;
  border-radius:12px;
  background:var(--p);
  color:white;
  font-weight:800;

.err{
  background:#fee2e2;
  color:#991b1b;
  padding:10px;
  border-radius:12px;
  font-size:12px;
  margin-bottom:10px;

@media(max-width:500px){
  .stats{

</style>

===================================================== */

/* =====================================================
   HELPERS
===================================================== */

function esc(v){
  return String(v??"")
  .replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}


function studentEmail(phone){
  return String(phone||"")
    .replace(/\D/g,"")
    +"@alinagheli.com";
}


/* =====================================================
   LOGIN
===================================================== */

function loginPage(error=""){

  document.body.innerHTML=`

  <div class="wrap">

    <div class="card login">

      <div class="logo">
        AN
      </div>

      <h1 class="center">
        AliNagheli English
      </h1>

      <p class="center" style="color:#777080">
        نرم‌افزار یادگیری زبان انگلیسی
      </p>

      ${
        error
        ? `<div class="err">${esc(error)}</div>`
        :""
      }

      <label>
        شماره تلفن
      </label>

      <input
        id="phone"
        inputmode="tel"
        placeholder="0914...">

      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور">

      <button
        class="btn"
        onclick="login()">

        ورود به برنامه 🚀

      </button>

    </div>

  </div>

  `;
}


async function login(){

  const phone=
    document.getElementById("phone").value.trim();

  const password=
    document.getElementById("password").value;

  if(!phone||!password){
    loginPage("شماره تلفن و رمز عبور را وارد کنید.");
    return;
  }

  const result=
    await db.auth.signInWithPassword({
      email:studentEmail(phone),
      password
    });

  if(result.error){
    loginPage("شماره تلفن یا رمز عبور اشتباه است.");
    return;
  }

  currentUser=result.data.user;

  await loadStudent();

}


/* =====================================================
   LOAD STUDENT
===================================================== */

async function loadStudent(){

  const result=
    await db
      .from("students")
      .select("*")
      .eq("auth_user_id",currentUser.id)
      .maybeSingle();

  if(result.error||!result.data){

    loginPage(
      "اطلاعات زبان‌آموز پیدا نشد."
    );

    return;
  }

  student=result.data;

  renderApp();
}


/* =====================================================
   APP
===================================================== */

function renderApp(){

  document.body.innerHTML=`

    <div id="homePage" class="page active"></div>

    <div id="lessonsPage" class="page"></div>

    <div id="practicePage" class="page"></div>

    <div id="profilePage" class="page"></div>

    <nav class="nav">

      <div class="navin">

        <button
          id="navHome"
          class="active"
          onclick="showPage('home')">

          <span>🏠</span>
          خانه

        </button>

        <button
          id="navLessons"
          onclick="showPage('lessons')">

          <span>📚</span>
          درس‌ها

        </button>

        <button
          id="navPractice"
          onclick="showPage('practice')">

          <span>🎮</span>
          تمرین

        </button>

        <button
          id="navProfile"
          onclick="showPage('profile')">

          <span>👤</span>
          پروفایل

        </button>

      </div>

    </nav>

  `;

  renderHome();
  renderLessons();
  renderPractice();
  renderProfile();

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(page+"Page")
    .classList.add("active");

  document
    .querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  const nav=
    document.getElementById(
      "nav"+
      page.charAt(0).toUpperCase()+
      page.slice(1)
    );

  if(nav)nav.classList.add("active");

}

function startQuiz(id){

  document.getElementById("practicePage").innerHTML=`

    <div class="top">

      <div class="topin">

        <div class="brand">
          🧠 تمرین درس
        </div>

      </div>

    </div>


    <div class="wrap">

      <div class="card">

        <div class="sectionTitle">

          <h2>
            سؤال 1 از 5
          </h2>

          <span>
            +20 XP
          </span>

        </div>

        <div class="question">

          <p>
            گزینه صحیح را انتخاب کن:
          </p>

          <h2 dir="ltr" class="center">
            There ___ a book on the table.
          </h2>

        </div>


        <button
          class="option"
          onclick="answer(this,false)">

          A) are

        </button>


        <button
          class="option"
          onclick="answer(this,true)">

          B) is

        </button>


        <button
          class="option"
          onclick="answer(this,false)">

          C) am

        </button>


        <button
          class="option"
          onclick="answer(this,false)">

          D) be

        </button>


        <div
          id="answerMessage"
          style="margin-top:15px">
        </div>

      </div>

    </div>

  `;

  showPage("practice");

}


function answer(button,correct){

  document
    .querySelectorAll(".option")
    .forEach(x=>x.disabled=true);

  if(correct){

    button.classList.add("correct");

    document.getElementById(
      "answerMessage"
    ).innerHTML=`

      <div
        style="
          background:#dcfce7;
          color:#166534;
          padding:13px;
          border-radius:12px;
        ">

        🎉 عالی بود! پاسخ درست است.

        <br><br>

        +20 XP

      </div>

    `;

  }else{

    button.classList.add("wrong");

    document.getElementById(
      "answerMessage"
    ).innerHTML=`

      <div
        style="
          background:#fee2e2;
          color:#991b1b;
          padding:13px;
          border-radius:12px;
        ">

        ❌ پاسخ درست نیست.
        دوباره درس را مرور کن.

      </div>

    `;

  }

}

let wordIndex=0;

function nextWord(){

  wordIndex=
    (wordIndex+1)%words.length;

  const word=
    words[wordIndex];

  const box=
    document.querySelector(".bigWord");

  if(box){

    box.textContent=
      word[0];

  }

  const p=
    box?.parentElement
      ?.querySelector(
        "p.center"
      );

  if(p){

    p.textContent=
      word[1];

  }

}

async function logout(){

  await db.auth.signOut();

  currentUser=null;
  student=null;

  loginPage();

}


/* =====================================================
   START
===================================================== */

(async function(){

  const result=
    await db.auth.getSession();

  if(result.data.session){

    currentUser=
      result.data.session.user;

    await loadStudent();

  }else{

    loginPage();

  }

})();
