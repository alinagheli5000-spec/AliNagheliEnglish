<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f3ff;color:#1f2937}
button,input{font-family:inherit}
.hidden{display:none!important}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:430px;background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 15px 50px #4c1d9530}
.logo{width:85px;height:85px;border-radius:25px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;margin:0 auto 18px}
h1{text-align:center;margin:8px 0;font-size:25px;color:#4c1d95}
.subtitle{text-align:center;color:#6b7280;margin-bottom:25px;font-size:14px}
.tabs{display:flex;background:#f3f0ff;padding:5px;border-radius:15px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;padding:12px;border-radius:11px;cursor:pointer;color:#6b7280;font-weight:bold}
.tabs button.active{background:#6d28d9;color:#fff}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;margin-bottom:7px;font-weight:bold}
.field input{width:100%;border:1px solid #ddd6fe;border-radius:13px;padding:13px;font-size:15px;outline:none;direction:ltr;text-align:left}
.login-btn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.login-btn:disabled{opacity:.6}
.message{margin-top:15px;padding:11px;border-radius:12px;font-size:13px;text-align:center;display:none}
.message.error{display:block;background:#fee2e2;color:#991b1b}
.message.success{display:block;background:#dcfce7;color:#166534}
#dashboard{min-height:100vh;width:100%;background:#f8f7ff}
.topbar{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 2px 15px #0000000b;position:sticky;top:0;z-index:10}
.brand{font-size:20px;font-weight:bold;color:#5b21b6}
.logout{border:0;background:#ede9fe;color:#5b21b6;padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:bold}
.content{max-width:1100px;margin:auto;padding:25px 18px}
.welcome{background:linear-gradient(135deg,#6d28d9,#4f46e5);color:#fff;border-radius:22px;padding:25px;margin-bottom:20px}
.welcome h2{margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border-radius:18px;padding:18px}
.stat strong{display:block;font-size:25px;color:#6d28d9;margin-bottom:5px}
.stat span{font-size:12px;color:#6b7280}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:18px}
.card h3{margin-top:0;color:#4c1d95}
.student{border:1px solid #ede9fe;border-radius:15px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.student-name{font-weight:bold}
.badge{padding:6px 10px;border-radius:20px;font-size:11px;background:#ede9fe;color:#5b21b6}
.empty{text-align:center;color:#9ca3af;padding:25px}
@media(max-width:600px){.stats{grid-template-columns:1fr}.topbar{padding:0 12px}.content{padding:18px 12px}}
</style>
</head>

<body>

<div id="app">
<div id="loginPage" class="login-box">

<div class="logo">AN</div>
<h1>AliNagheli English</h1>
<div class="subtitle">سامانه آموزش زبان انگلیسی</div>

<div class="tabs">
<button id="studentTab" class="active" onclick="setLoginType('student')">زبان‌آموز</button>
<button id="adminTab" onclick="setLoginType('admin')">مدیر</button>
</div>

<form id="loginForm">

<div class="field">
<label id="usernameLabel">شماره موبایل</label>
<input id="username" type="text" inputmode="tel" autocomplete="username" placeholder="09123456789" required>
</div>

<div class="field">
<label>رمز عبور</label>
<input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور" required>
</div>

<button id="loginBtn" class="login-btn" type="submit">ورود</button>
</form>

<div id="message" class="message"></div>
</div>
</div>

<div id="dashboard" class="hidden">

<div class="topbar">
<div class="brand">AliNagheli English</div>
<button class="logout" onclick="logout()">خروج</button>
</div>

<div class="content">

<div class="welcome">
<h2 id="welcomeTitle">خوش آمدید 🌟</h2>
<div id="welcomeText">به سامانه AliNagheli English خوش آمدید.</div>
</div>

<div id="adminPanel" class="hidden">

<div class="stats">
<div class="stat"><strong id="waitingCount">0</strong><span>در صف انتظار</span></div>
<div class="stat"><strong id="registeredCount">0</strong><span>ثبت‌نام شده</span></div>
<div class="stat"><strong id="graduateCount">0</strong><span>فارغ‌التحصیل</span></div>
</div>

<div class="card">
<h3>زبان‌آموزان</h3>
<div id="studentsList"></div>
</div>

</div>

<div id="studentPanel" class="hidden">

<div class="card">
<h3>اطلاعات زبان‌آموز</h3>
<div id="studentInfo"></div>
</div>

</div>

</div>
</div>

<script>

const SUPABASE_URL="https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_ANON_KEY="sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const STUDENT_FUNCTION=SUPABASE_URL+"/functions/v1/student-access";

let loginType="student";
let currentUser=null;

const loginPage=document.getElementById("loginPage");
const dashboard=document.getElementById("dashboard");
const loginForm=document.getElementById("loginForm");
const username=document.getElementById("username");
const password=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const message=document.getElementById("message");
const studentTab=document.getElementById("studentTab");
const adminTab=document.getElementById("adminTab");
const adminPanel=document.getElementById("adminPanel");
const studentPanel=document.getElementById("studentPanel");
const welcomeTitle=document.getElementById("welcomeTitle");
const welcomeText=document.getElementById("welcomeText");

function setLoginType(type){

loginType=type;

studentTab.classList.toggle("active",type==="student");
adminTab.classList.toggle("active",type==="admin");

document.getElementById("usernameLabel").textContent=
type==="student"?"شماره موبایل":"نام کاربری مدیر";

username.placeholder=
type==="student"?"09123456789":"admin";

clearMessage();
}

function showMessage(text,type="error"){
message.textContent=text;
message.className="message "+type;
}

function clearMessage(){
message.textContent="";
message.className="message";
}

async function requestFunction(body){

const r=await fetch(STUDENT_FUNCTION,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_ANON_KEY
},
body:JSON.stringify(body)
});

const text=await r.text();

let data={};

try{
data=text?JSON.parse(text):{};
}catch{
data={};
}

if(!r.ok){
throw new Error(data.error||data.message||"خطا در ارتباط با سرور");
}

return data;
}

async function authLogin(email,pass){

const r=await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"apikey":SUPABASE_ANON_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:pass
})
}
);

const text=await r.text();

let data={};

try{
data=text?JSON.parse(text):{};
}catch{
data={};
}

if(!r.ok){
throw new Error(
data.error_description||
data.msg||
data.message||
"Invalid login credentials"
);
}

return data;
}

loginForm.addEventListener("submit",async e=>{

e.preventDefault();

clearMessage();

const value=username.value.trim();
const pass=password.value;

if(!value||!pass){
showMessage("اطلاعات ورود را کامل وارد کنید.");
return;
}

loginBtn.disabled=true;
loginBtn.textContent="در حال ورود...";

try{

if(loginType==="student"){
await studentLogin(value,pass);
}else{
await adminLogin(value,pass);
}

}catch(error){

console.error(error);

showMessage(
error.message==="student_not_found"
?"این شماره موبایل در سامانه ثبت نشده است."
:error.message==="student_waiting"
?"ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
:error.message==="student_no_auth"
?"حساب کاربری شما هنوز فعال نشده است."
:"ورود ناموفق بود. شماره موبایل و رمز عبور را بررسی کنید."
);

}finally{

loginBtn.disabled=false;
loginBtn.textContent="ورود";

}

});

async function studentLogin(phone,pass){

const normalizedPhone=phone.replace(/\D/g,"");

if(normalizedPhone.length<10){
throw new Error("شماره موبایل نامعتبر است");
}

/*
مهم:
دیگر ایمیل ساختگی را مستقیماً به Supabase Auth نمی‌فرستیم.

Edge Function دانش‌آموز را بر اساس شماره موبایل پیدا می‌کند
و login_email واقعی ذخیره‌شده برای همان دانش‌آموز را برمی‌گرداند.
*/

const found=await requestFunction({
action:"find",
phone:normalizedPhone
});

if(!found.ok||!found.student){
throw new Error("student_not_found");
}

const student=found.student;

if(!found.email){
throw new Error("student_no_auth");
}

if(student.status==="waiting"){
throw new Error("student_waiting");
}

const auth=await authLogin(found.email,pass);

currentUser={
type:"student",
data:student,
token:auth.access_token,
refresh_token:auth.refresh_token
};

localStorage.setItem(
"ali_current_user",
JSON.stringify({
type:"student",
data:student,
token:auth.access_token,
refresh_token:auth.refresh_token
})
);

openStudentDashboard(student);
}

async function adminLogin(user,pass){

let email=user.trim().toLowerCase();

if(!email.includes("@")){
email=email+"@alinagheli.app";
}

const auth=await authLogin(email,pass);

currentUser={
type:"admin",
token:auth.access_token,
refresh_token:auth.refresh_token,
data:auth.user||{}
};

localStorage.setItem(
"ali_current_user",
JSON.stringify({
type:"admin",
data:auth.user||{},
token:auth.access_token,
refresh_token:auth.refresh_token
})
);

openAdminDashboard();
}

async function openAdminDashboard(){

loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");

adminPanel.classList.remove("hidden");
studentPanel.classList.add("hidden");

welcomeTitle.textContent="سلام مدیر عزیز 👋";
welcomeText.textContent="مدیریت زبان‌آموزان AliNagheli English";

await loadStudents();
}

function openStudentDashboard(student){

loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");

studentPanel.classList.remove("hidden");
adminPanel.classList.add("hidden");

welcomeTitle.textContent=
"سلام "+(student.first_name||"")+" 👋";

welcomeText.textContent=
"به پنل زبان‌آموزی خودت خوش آمدی.";

renderStudent(student);
}

async function loadStudents(){

const list=document.getElementById("studentsList");

list.innerHTML=
'<div class="empty">در حال دریافت اطلاعات...</div>';

try{

const r=await fetch(
SUPABASE_URL+
"/rest/v1/students?select=*&order=id.desc",
{
headers:{
"apikey":SUPABASE_ANON_KEY,
"Authorization":"Bearer "+currentUser.token
}
}
);

if(!r.ok){
throw new Error("خطا");
}

const students=await r.json();

const waiting=students.filter(
s=>s.status==="waiting"
).length;

const registered=students.filter(
s=>s.status==="registered"
).length;

const graduate=students.filter(
s=>s.status==="graduate"||
s.status==="graduated"
).length;

document.getElementById("waitingCount").textContent=waiting;
document.getElementById("registeredCount").textContent=registered;
document.getElementById("graduateCount").textContent=graduate;

if(!students.length){

list.innerHTML=
'<div class="empty">هنوز زبان‌آموزی ثبت نشده است.</div>';

return;
}

list.innerHTML=students.map(student=>{

const name=
(student.first_name||"")+" "+
(student.last_name||"");

return `
<div class="student">
<div>
<div class="student-name">
${escapeHtml(name.trim()||"بدون نام")}
</div>
<div style="font-size:12px;color:#6b7280;margin-top:5px;direction:ltr">
${escapeHtml(student.phone||"")}
</div>
</div>
<div class="badge">
${statusText(student.status)}
</div>
</div>
`;

}).join("");

}catch(error){

console.error(error);

list.innerHTML=
'<div class="empty">دریافت اطلاعات با خطا مواجه شد.</div>';

}

}

function renderStudent(student){

const info=document.getElementById("studentInfo");

const fields=[
[
"نام و نام خانوادگی",
(student.first_name||"")+" "+(student.last_name||"")
],
["شماره موبایل",student.phone||"-"],
["سطح",student.level||"-"],
["وضعیت",statusText(student.status)],
["کتاب",student.book||"-"]
];

info.innerHTML=fields.map(item=>`
<div style="
display:flex;
justify-content:space-between;
padding:13px 0;
border-bottom:1px solid #f3f4f6;
gap:15px;
">
<strong>${escapeHtml(item[0])}</strong>
<span>${escapeHtml(String(item[1]))}</span>
</div>
`).join("");

}

function statusText(status){

switch(status){

case "waiting":
return "در صف انتظار";

case "registered":
return "ثبت‌نام شده";

case "graduate":
case "graduated":
return "فارغ‌التحصیل";

default:
return status||"نامشخص";

}

}

function logout(){

currentUser=null;

localStorage.removeItem("ali_current_user");

dashboard.classList.add("hidden");
loginPage.classList.remove("hidden");

username.value="";
password.value="";

setLoginType("student");

clearMessage();
}

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

async function checkSavedLogin(){

try{

const saved=localStorage.getItem("ali_current_user");

if(!saved)return;

const user=JSON.parse(saved);

if(!user||!user.type){
localStorage.removeItem("ali_current_user");
return;
}

if(user.type==="student"){

/*
اطلاعات ذخیره‌شده را دوباره از Edge Function می‌گیریم
تا اطلاعات قدیمی باعث ورود اشتباه نشود.
*/

const phone=user.data?.phone;

if(!phone){
localStorage.removeItem("ali_current_user");
return;
}

const result=await requestFunction({
action:"find",
phone:String(phone).replace(/\D/g,"")
});

if(!result.ok||!result.student){
localStorage.removeItem("ali_current_user");
return;
}

currentUser={
type:"student",
data:result.student,
token:user.token,
refresh_token:user.refresh_token
};

openStudentDashboard(result.student);

}else if(user.type==="admin"){

currentUser=user;

openAdminDashboard();

}

}catch(error){

console.error(error);

localStorage.removeItem("ali_current_user");

}

}

setLoginType("student");
checkSavedLogin();

</script>
</body>
</html>
