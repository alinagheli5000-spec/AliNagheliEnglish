function esc(x){
 return String(x??"")
 .replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function normalizePhone(x){

function speak(text){
 if(!window.speechSynthesis){
  alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
  return;
 }

 speechSynthesis.cancel();

 const u=
 new SpeechSynthesisUtterance(text);

 u.lang="en-US";
 u.rate=.75;

 speechSynthesis.resume();
 speechSynthesis.speak(u);
}

function shuffle(arr){
 const a=[...arr];

 for(let i=a.length-1;i>0;i--){
  const j=
  Math.floor(
   Math.random()*(i+1)
  );

  [a[i],a[j]]=
  [a[j],a[i]];
 }

 return a;
}

async function accessFunction(payload){

 const r=
 await fetch(
  ACCESS_FUNCTION,
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY

 );

   STATS
========================================================= */

function calculateLevel(xp){
 return Math.max(
  1,
  Math.floor(
   Number(xp||0)/100
  )+1
 );
}

function xpForLevel(level){
 return (Number(level)-1)*100;
}

async function loadStudentStats(){

 if(!S.student)return;

 S.xp=0;
 S.level=1;
 S.progress={};
 S.achievements=[];
 S.exams=[];

 try{
  const r=
  await db
  .from("student_xp")
  .select("xp,level")
  .eq("student_id",S.student.id)
  .maybeSingle();

  if(r.data){
   S.xp=Number(r.data.xp||0);
   S.level=
   Number(
    r.data.level||
    calculateLevel(S.xp)
   );
  }
 }catch(e){}

 try{
  const r=
  await db
  .from("student_progress")
  .select("lesson_id,progress,completed")
  .eq("student_id",S.student.id);

  (r.data||[]).forEach(x=>{
   S.progress[x.lesson_id]={
    progress:Number(x.progress||0),
    completed:Boolean(x.completed)
   };
  });
 }catch(e){}

 try{
  const r=
  await db
  .from("student_achievements")
  .select("achievement_key,title")
  .eq("student_id",S.student.id);

  S.achievements=r.data||[];
 }catch(e){}

 try{
  const r=
  await db
  .from("exam_results")
  .select("*")
  .eq(
   "user_id",
   S.student.auth_user_id
  )
  .order(
   "created_at",
   {ascending:false}
  );

  S.exams=r.data||[];
 }catch(e){}
}

async function addXP(amount){

 if(!S.student)return;

 const oldLevel=
 calculateLevel(S.xp);

 S.xp+=Number(amount||0);

 S.level=
 calculateLevel(S.xp);

 try{
  await db
  .from("student_xp")
  .upsert(
   {
    student_id:S.student.id,
    xp:S.xp,
    level:S.level
   },
   {
    onConflict:"student_id"
   }
  );
 }catch(e){}

 if(
  oldLevel!==S.level
 ){
  alert(
   "🎉 تبریک! شما به Level "+
   S.level+
   " رسیدید."
  );
 }
}

async function unlockAchievement(
 key,
 title
){

 if(!S.student)return;

 if(
  S.achievements.some(
   a=>a.achievement_key===key
  )
 )return;

 try{
  const r=
  await db
  .from("student_achievements")
  .insert({
   student_id:S.student.id,
   achievement_key:key,
   title
  });

  if(!r.error){
   S.achievements.push({
    achievement_key:key,
    title
   });
  }
 }catch(e){}
}

async function saveProgress(
 lessonId,
 progress,
 completed
){

 if(!S.student)return;

 S.progress[lessonId]={
  progress,
  completed
 };

 try{
  await db
  .from("student_progress")
  .upsert(
   {
    student_id:S.student.id,
    lesson_id:lessonId,
    progress,
    completed,
    completed_at:
     completed
     ?new Date().toISOString()
     :null
   },
   {
    onConflict:
     "student_id,lesson_id"
   }
  );
 }catch(e){}
}

async function studentLogin(){

 const phone=
 document.getElementById("phone")
 .value.trim();

 const password=
 document.getElementById("pass")
 .value;

 if(!phone||!password){
  alert(
   "شماره تلفن و رمز عبور را وارد کنید."
  );
  return;
 }

 try{

  const result=
  await accessFunction({
   action:"find",
   phone
  });

  const student=result.student;
  const email=result.email;

  if(!student){
   throw new Error(
    "زبان‌آموزی با این شماره پیدا نشد."
   );
  }

  if(student.status==="rejected"){
   throw new Error(
    "ثبت‌نام شما توسط مدیر رد شده است."
   );
  }

  if(
   !["registered","approved"]
   .includes(student.status)
  ){
   throw new Error(
    "ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
   );
  }

  if(!email){
   throw new Error(
    "ایمیل ورود زبان‌آموز پیدا نشد."
   );
  }

  const auth=
  await db.auth.signInWithPassword({
   email:String(email).trim(),
   password
  });

  if(auth.error){
   throw new Error(
    "رمز عبور صحیح نیست."
   );
  }

  S.student=student;
  S.admin=false;

  await loadStudentStats();

  home();

 }catch(e){

  alert(
   e?.message||
   "ورود ناموفق بود."
  );
 }
}

async function register(){

 const first=
 document.getElementById("rf")
 .value.trim();

 const last=
 document.getElementById("rl")
 .value.trim();

 const phone=
 document.getElementById("rp")
 .value.trim();

 const password=
 document.getElementById("rpass")
 .value;

 const level=
 document.getElementById("rlevel")
 .value;

 if(
  !first||
  !last||
  !phone||
  !password||
  !level
 ){
  alert(
   "همه موارد را تکمیل کنید."
  );
  return;
 }

 if(password.length<6){
  alert(
   "رمز عبور باید حداقل ۶ کاراکتر باشد."
  );
  return;
 }

 const digits=
 normalizePhone(phone);

 if(digits.length<10){
  alert(
   "شماره تلفن معتبر نیست."
  );
  return;
 }

 const email=
 digits+"@alinagheli.com";

 try{

  const r=
  await db.auth.signUp({
   email,
   password,
   options:{
    data:{
     first_name:first,
     last_name:last,
     phone,
     level
    }
   }
  });

  if(r.error)
   throw r.error;

  if(!r.data.user)
   throw new Error(
    "حساب کاربری ساخته نشد."
   );

  await accessFunction({
   action:"register",
   first_name:first,
   last_name:last,
   phone,
   level,
   auth_user_id:r.data.user.id,
   email
  });

  await db.auth.signOut();

  alert(
   "ثبت‌نام با موفقیت انجام شد.\n"+
   "پس از تأیید مدیر می‌توانید وارد شوید."
  );

  login();

 }catch(e){

  try{
   await db.auth.signOut();
  }catch(_){}

  alert(
   "ثبت‌نام انجام نشد:\n"+
   (e?.message||"خطای نامشخص")
  );
 }
}

function makeLessonQuestions(){

 const result=[];

 const ws=
 getLessonWords();

 ws.forEach((w,i)=>{

  const wrong=
  shuffle(
   ws
   .filter((_,j)=>j!==i)
   .map(x=>x[1])
  ).slice(0,3);

  const options=
  shuffle([
   w[1],
   ...wrong
  ]);

  result.push({
   q:`معنی "${w[0]}" چیست؟`,
   options,
   answer:
    options.indexOf(w[1])
  });
 });

 const gs=
 getLessonGrammar();

 gs.forEach(g=>{

  const correct=g[1];

  const options=
  shuffle([
   correct,
   "She are a student.",
   "They is happy.",
   "He am a teacher."
  ]);

  result.push({
   q:
   `کدام گزینه نمونه صحیح مبحث «${g[0]}» است؟`,
   options,
   answer:
    options.indexOf(correct)
  });
 });

 return result.slice(0,20);
}

function startLessonQuiz(){

 const qs=
 makeLessonQuestions();

 S.quiz={
  type:"lesson",
  title:
   `پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
  questions:qs,
  i:0,
  correct:0,
  wrong:0,
  finished:false
 };

 quizRender("lessonQuiz");
}

function quizRender(id){

 if(!S.quiz)return;

 const q=
 S.quiz.questions[S.quiz.i];

 if(!q){

  if(S.quiz.type==="placement"){
   placementFinish();
  }else{
   quizFinish(id);
  }

  return;
 }

 const el=
 document.getElementById(id);

 if(!el)return;

 el.innerHTML=`

  <div class="card">

   <div class="questionNumber">
    سؤال ${S.quiz.i+1}
    از
    ${S.quiz.questions.length}
   </div>

   <div class="progress">
    <i
     style="
      width:${
       S.quiz.i/
       S.quiz.questions.length*
       100
      }%">
    </i>
   </div>

   <h3 style="
    line-height:2">
    ${esc(q.q)}
   </h3>

   ${
    q.options.map((x,i)=>`

     <button
      class="option"
      onclick="answer(${i},'${id}')">
      ${esc(x)}
     </button>

    `).join("")
   }

   <div id="fb"></div>

  </div>`;
}

function answer(i,id){

 if(!S.quiz||S.quiz.finished)
  return;

 if(
  S.quiz.type==="placement"
 ){
  placementAnswer(i);
  return;
 }

 const q=
 S.quiz.questions[S.quiz.i];

 const opts=
 document.querySelectorAll(".option");

 opts.forEach(x=>{
  x.disabled=true;
 });

 if(i===q.answer){

  S.quiz.correct++;

  if(opts[i])
   opts[i].classList.add("correct");

  const fb=
  document.getElementById("fb");

  fb.className="feedback ok";

  fb.innerHTML=
  "✅ آفرین! پاسخ درست است.";

 }else{

  S.quiz.wrong++;

  if(opts[i])
   opts[i].classList.add("wrong");

  if(opts[q.answer])
   opts[q.answer]
   .classList.add("correct");

  const fb=
  document.getElementById("fb");

  fb.className="feedback bad";

  fb.innerHTML=
  "❌ پاسخ اشتباه است.";
 }

 setTimeout(()=>{

  if(!S.quiz)return;

  S.quiz.i++;

  quizRender(id);

 },650);
}

async function quizFinish(id){

 if(
  !S.quiz||
  S.quiz.finished
 )
  return;

 S.quiz.finished=true;

 const total=
 S.quiz.questions.length;

 const percent=
 total
 ?
 Math.round(
  S.quiz.correct/
  total*
  100
 )
 :0;

 const earned=
 Math.max(
  5,
  Math.round(percent/10)
 );

 examRecords.unshift({
  student:
   S.student?.phone||
   "guest",
  title:S.quiz.title,
  score:percent,
  date:new Date().toISOString()
 });

 examRecords=
 examRecords.slice(0,100);

 saveLocal();

 if(S.student){

  try{

   await db
   .from("exam_results")
   .insert({
    user_id:
     S.student.auth_user_id,
    student_name:
     `${S.student.first_name||""} ${S.student.last_name||""}`,
    exam_type:"lesson",
    exam_title:S.quiz.title,
    score:S.quiz.correct,
    total,
    percentage:percent
   });

  }catch(e){}
 }

 await addXP(earned);

 if(percent>=80){

  await unlockAchievement(
   "quiz_master",
   "استاد آزمون‌ها"
  );
 }

 const el=
 document.getElementById(id);

 if(!el)return;

 el.innerHTML=`

  <div class="resultBox">

   <div class="score">
    ${percent}%
   </div>

   <h2 style="text-align:center">
    🎉 نتیجه آزمون
   </h2>

   <p style="text-align:center">
    ${S.quiz.correct}
    پاسخ درست از
    ${total}
   </p>

   <p style="text-align:center">
    ⭐ +${earned} XP
   </p>

   <button
    class="btn full"
    onclick="openLesson(S.lesson)">
    بازگشت به درس
   </button>

  </div>`;
}

function placementTest(){

 const questions=
 placementQuestions.map(x=>{

  const options=
  shuffle(x[1]);

  return {
   q:x[0],
   options,
   answer:
    options.indexOf(
     x[1][x[2]]
    )
  };
 });

 S.quiz={
  type:"placement",
  title:"آزمون تعیین سطح",
  questions,
  i:0,
  correct:0,
  wrong:0,
  finished:false
 };

 render(
  "تعیین سطح",
  `<div id="placementQuiz"></div>`
 );

 quizRender("placementQuiz");
}

function placementAnswer(i){

 if(
  !S.quiz||
  S.quiz.finished
 )
  return;

 const q=
 S.quiz.questions[S.quiz.i];

 const opts=
 document.querySelectorAll(".option");

 opts.forEach(x=>{
  x.disabled=true;
 });

 if(i===q.answer){

  S.quiz.correct++;

  if(opts[i])
   opts[i].classList.add("correct");

 }else{

  S.quiz.wrong++;

  if(opts[i])
   opts[i].classList.add("wrong");

  if(opts[q.answer])
   opts[q.answer]
   .classList.add("correct");
 }

 setTimeout(()=>{

  S.quiz.i++;

  if(
   S.quiz.i>=
   S.quiz.questions.length
  ){
   placementFinish();
  }else{
   quizRender("placementQuiz");
  }

 },600);
}

async function placementFinish(){

 if(
  !S.quiz||
  S.quiz.finished
 )
  return;

 S.quiz.finished=true;

 const score=
 S.quiz.correct;

 const total=
 S.quiz.questions.length;

 let level;

 if(score<=7)
  level="A1";
 else if(score<=13)
  level="A2";
 else if(score<=19)
  level="B1";
 else if(score<=25)
  level="B2";
 else if(score<=31)
  level="C1";
 else
  level="C2";

 const percentage=
 Math.round(
  score/
  total*
  100
 );

 if(S.student){

  try{

   await db
   .from("exam_results")
   .insert({
    user_id:

     `${S.student.first_name||""} ${S.student.last_name||""}`,
    exam_type:"placement",
    exam_title:
     "آزمون تعیین سطح",
    score,
    total,
    percentage
   });

  }catch(e){}
 }

 await addXP(

   )
  )
 );

  if(r.error)
   throw r.error;

  admin();

 }catch(e){

  alert(
   "خطا در تأیید:\n"+
   e.message
  );
 }
}

async function rejectStudent(id){

 try{

  const r=
  await db
  .from("students")
  .update({
   status:"rejected"
  })
  .eq("id",id);

  if(r.error)
   throw r.error;

  admin();

 }catch(e){

  alert(
   "خطا:\n"+
   e.message
  );
 }
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

 try{
  await db.auth.signOut();
 }catch(e){}

 S={
  student:null,
  admin:false,
  grade:null,
  lesson:null,
  quiz:null,
  xp:0,
  level:1,
  progress:{},
  achievements:[],
  exams:[]
 };

 login();
}


/* =========================================================
   STARTUP / SESSION
========================================================= */

async function startup(){

 try{

  const r=
  await db.auth.getSession();

  const session=
  r.data?.session;

  if(!session){

   login();
   return;
  }

  const user=
  session.user;

  if(
   (user.email||"")
   .toLowerCase()
   ===
   "alinagheli@gmail.com"
  ){

   S.admin=true;
   admin();

   return;
  }

  const st=
  await db
  .from("students")
  .select("*")
  .eq(
   "auth_user_id",
   user.id
  )
  .maybeSingle();

  if(
   st.data&&
   [
    "registered",
    "approved"
   ].includes(
    st.data.status
   )
  ){

   S.student=
   st.data;

   await loadStudentStats();

   home();

   return;
  }

  await db.auth.signOut();

  login();

 }catch(e){

  try{
   await db.auth.signOut();
  }catch(_){}

  login();
 }
}


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
 (event)=>{

  if(
   event==="SIGNED_OUT"&&
   !S.admin&&
   !S.student
  ){
   login();
  }
 }
);


/* =========================================================
   BOOT
========================================================= */

startup();

</script>
