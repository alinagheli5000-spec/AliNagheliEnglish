*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:#f5f3ff;color:#171717;padding-bottom:82px}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.header{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:15px;position:sticky;top:0;z-index:100;box-shadow:0 3px 15px #0002}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:15px}
.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 5px 25px #0000000d}
.hero{background:linear-gradient(135deg,#312e81,#7c3aed,#a855f7);color:#fff;border-radius:25px;padding:28px;margin-bottom:15px;box-shadow:0 15px 35px #6d28d944}
.hero3d{position:relative;overflow:hidden}
.hero3d:before,.hero3d:after{content:"";position:absolute;border-radius:50%;background:#ffffff18}
.hero3d:before{width:180px;height:180px;left:-50px;top:-70px}
.hero3d:after{width:250px;height:250px;right:-100px;bottom:-150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.item{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;transition:.2s}
.item:hover{transform:translateY(-3px);box-shadow:0 10px 25px #6d28d933}
.icon{font-size:40px}
.btn{background:#6d28d9;color:#fff;border:0;border-radius:13px;padding:12px 16px;font-weight:bold}
.btn.full{width:100%}
.secondary{background:#ede9fe;color:#5b21b6}
.success{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#991b1b}
.warning{background:#fef3c7;color:#92400e}
.login{min-height:100vh;background:linear-gradient(135deg,#2e1065,#7c3aed,#a855f7);display:flex;justify-content:center;align-items:center;padding:20px}
.loginCard{background:#fff;width:min(430px,100%);padding:25px;border-radius:28px;box-shadow:0 20px 60px #0004}
label{display:block;margin:10px 0 5px;font-weight:bold;font-size:13px}
input,select,textarea{width:100%;border:1px solid #ddd6fe;border-radius:12px;padding:12px;background:#fff;outline:none}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#7c3aed}
.tabs{display:flex;gap:8px;margin:18px 0}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:#f3f4f6}
.tab.active{background:#ede9fe;color:#6d28d9;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #ddd;z-index:200;box-shadow:0 -3px 15px #0000000d}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex}
.nav{flex:1;border:0;background:#fff;padding:7px 2px;color:#777;font-size:11px}
.nav b{display:block;font-size:21px;margin-bottom:3px}
.nav.active{color:#6d28d9;font-weight:bold}
.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.lesson{background:#faf9ff;border:1px solid #ddd6fe;border-radius:18px;padding:17px;cursor:pointer}
.lesson:hover{background:#f3efff}
.lessonNo{font-size:30px;color:#6d28d9;font-weight:bold}
.tabs2{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
.tab2{padding:11px 15px;border:0;border-radius:12px;background:#eee;white-space:nowrap}
.tab2.active{background:#6d28d9;color:#fff}
.sec{display:none}.sec.active{display:block}
.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.word{border:1px solid #ddd6fe;background:#faf9ff;border-radius:15px;padding:13px;text-align:center;cursor:pointer}
.en{direction:ltr;color:#5b21b6;font-weight:bold}
.fa{font-size:11px;color:#777;margin-top:5px}
.grammar{border:1px solid #e9e5ff;background:#faf9ff;padding:17px;border-radius:17px;margin-bottom:12px;line-height:2}
.example{direction:ltr;text-align:left;background:#fff;border-radius:10px;padding:11px;font-family:Arial,sans-serif;border:1px solid #eee}
.option{display:block;width:100%;text-align:right;background:#fff;border:1px solid #ddd6fe;border-radius:13px;padding:13px;margin:7px 0}
.option.correct{background:#dcfce7;border-color:#22c55e}
.option.wrong{background:#fee2e2;border-color:#ef4444}
.feedback{text-align:center;border-radius:15px;padding:13px;margin-top:10px;font-weight:bold}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
.progress{height:9px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7);transition:.3s}
.score{font-size:55px;color:#6d28d9;font-weight:bold;text-align:center}
.adminRow{border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:9px 0}
.muted{font-size:12px;color:#777;line-height:1.9}
.teacher{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.teacherBox{background:linear-gradient(135deg,#faf5ff,#fff);border:1px solid #e9d5ff;border-radius:22px;padding:20px;line-height:2}
.teacherAvatar{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;background:#ede9fe;margin:auto}
.profileStat{background:#faf9ff;border:1px solid #e9d5ff;border-radius:18px;padding:15px;text-align:center}
.profileStat b{display:block;font-size:27px;color:#6d28d9;margin-top:5px}
.levelBar{height:12px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}
.levelBar i{display:block;height:100%;background:#7c3aed}
.badge{display:inline-block;padding:8px 12px;margin:4px;border-radius:20px;background:#ede9fe;color:#5b21b6;font-size:12px}
.notice{padding:13px;border-radius:13px;background:#fff7ed;color:#9a3412;font-size:13px;line-height:1.8;margin-bottom:12px}
.call{display:block;text-decoration:none;text-align:center;margin:12px 0}
.request{background:#f8f5ff;border:1px solid #ddd6fe;border-radius:18px;padding:15px;margin-top:15px}
.examRow{border:1px solid #e5e7eb;border-radius:15px;padding:14px;margin:8px 0}
.examScore{font-size:25px;font-weight:bold;color:#6d28d9}
.resultBox{background:#faf9ff;border:1px solid #ddd6fe;border-radius:18px;padding:18px}
@media(max-width:600px){.container{padding:10px}.card{padding:16px;border-radius:18px}.hero{padding:20px}}
</style>

async function doRegister(){
 const first=document.getElementById("regFirst")?.value.trim();
 const last=document.getElementById("regLast")?.value.trim();
 const phone=normalizePhone(document.getElementById("regPhone")?.value);
 const level=document.getElementById("regLevel")?.value;
 const pass=document.getElementById("regPassword")?.value||"";
 const pass2=document.getElementById("regPassword2")?.value||"";

 if(!first||!last||!phone||!level||!pass){
  msg("لطفاً همه اطلاعات را کامل کنید.");return;
 }
 if(phone.length<10){
  msg("شماره موبایل معتبر نیست.");return;
 }
 if(pass.length<6){
  msg("رمز عبور باید حداقل ۶ کاراکتر باشد.");return;
 }
 if(pass!==pass2){
  msg("تکرار رمز عبور با رمز اصلی یکسان نیست.");return;
 }

 try{
  const data=await accessFunction({
   action:"register",
   first_name:first,
   last_name:last,
   phone,
   level,
   password:pass
  });

  msg(data?.message||"ثبت‌نام با موفقیت انجام شد. پس از تأیید مدیر می‌توانید وارد شوید.","success");
  setTimeout(showLogin,1000);
 }catch(e){
  msg(e.message||"خطا در ثبت‌نام.");
 }
}

async function doLogin(){
 const phone=normalizePhone(document.getElementById("loginPhone")?.value);
 const password=document.getElementById("loginPassword")?.value||"";

 if(!phone||!password){
  msg("شماره موبایل و رمز عبور را وارد کنید.");return;
 }

 try{
  const data=await accessFunction({
   action:"login",
   phone,
   password
  });

  if(!data?.access_token||!data?.refresh_token){
   throw new Error("اطلاعات ورود از سرور دریافت نشد.");
  }

  const r=await db.auth.setSession({
   access_token:data.access_token,
   refresh_token:data.refresh_token
  });

  if(r.error)throw r.error;

  S.student=data.student||null;
  if(!S.student){
   const session=(await db.auth.getSession()).data?.session;
   if(session?.user?.id){
    const st=await db.from("students").select("*").eq("auth_user_id",session.user.id).maybeSingle();
    if(st.data)S.student=st.data;
   }
  }

  if(!S.student){
   throw new Error("اطلاعات زبان‌آموز پیدا نشد.");
  }

  await loadStudentStats();
  home();
 }catch(e){
  msg(e.message||"ورود ناموفق بود.");
 }
}

/* STUDENT DATA */

async function loadStudentStats(){
 if(!S.student?.auth_user_id)return;

 try{
  const p=await db.from("lesson_progress")
   .select("*")
   .eq("user_id",S.student.auth_user_id);

  if(!p.error){
   S.progress={};
   (p.data||[]).forEach(x=>{
    const key=`${x.grade}-${x.lesson}`;
    S.progress[key]=x;
   });
  }
 }catch(e){}

 try{
  const a=await db.from("achievements")
   .select("*")
   .eq("user_id",S.student.auth_user_id);

  if(!a.error)S.achievements=a.data||[];
 }catch(e){}

 try{
  const ex=await db.from("exam_results")
   .select("*")
   .eq("user_id",S.student.auth_user_id)
   .order("created_at",{ascending:false});

  if(!ex.error)S.exams=ex.data||[];
 }catch(e){}

 let completed=Object.values(S.progress).filter(x=>x.completed).length;
 S.xp=completed*100;

 if(S.xp<500)S.level=1;
 else if(S.xp<1000)S.level=2;
 else if(S.xp<2000)S.level=3;
 else if(S.xp<3500)S.level=4;
 else if(S.xp<5000)S.level=5;
 else S.level=6;
}

async function saveProgress(grade,lesson,completed=false){
 if(!S.student?.auth_user_id)return;

 const payload={
  user_id:S.student.auth_user_id,
  grade:String(grade),
  lesson:Number(lesson),
  completed,
  updated_at:new Date().toISOString()
 };

 try{
  const r=await db.from("lesson_progress")
   .upsert(payload,{onConflict:"user_id,grade,lesson"});
  if(r.error)throw r.error;
 }catch(e){
  console.error(e);
 }

 const key=`${grade}-${lesson}`;
 S.progress[key]={...payload};
 await loadStudentStats();
}

/* QUIZ */

function startLessonQuiz(lesson){
 const data=lessonData[lesson]||lessonData[1];

 S.quiz={
  type:"lesson",
  lesson,
  questions:shuffle(data.quiz).map(q=>{
   const options=shuffle(q.o);
   return {q:q.q,options,answer:options.indexOf(q.o[q.a])};
  }),
  i:0,
  correct:0,
  wrong:0
 };

 quizRender("lessonQuiz");
}

function quizRender(id){
 const el=document.getElementById(id);
 if(!el||!S.quiz)return;

 const q=S.quiz.questions[S.quiz.i];

 if(!q){
  el.innerHTML=`
   <div class="feedback ok">
    پایان آزمون 🎉<br>
    امتیاز: ${S.quiz.correct} از ${S.quiz.questions.length}
   </div>`;
  return;
 }

 el.innerHTML=`
 <div class="progress">
  <i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i>
 </div>
 <p><b>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b></p>
 <h3 dir="ltr" style="text-align:left">${esc(q.q)}</h3>
 ${q.options.map((o,i)=>`
  <button class="option" onclick="answer(${i},'${id}')">
   ${esc(o)}
  </button>`).join("")}
 `;
}

function answer(i,id){
 const q=S.quiz?.questions?.[S.quiz.i];
 if(!q)return;

 const opts=document.querySelectorAll("#"+id+" .option");
 opts.forEach(x=>x.disabled=true);

 if(i===q.answer){
  S.quiz.correct++;
  opts[i]?.classList.add("correct");
 }else{
  S.quiz.wrong++;
  opts[i]?.classList.add("wrong");
  opts[q.answer]?.classList.add("correct");
 }

 setTimeout(()=>{
  S.quiz.i++;
  quizRender(id);
 },650);
}

  S.quiz.wrong++;

  opts[q.answer]?.classList.add("correct");
 }

 setTimeout(()=>{
  S.quiz.i++;
  recordRender();
 },300);
}

/* PLACEMENT TEST */

const placementQuestions=[
 {q:"Look! She ___.",o:["is running","runs","run","ran"],a:0},
 {q:"I ___ to school yesterday.",o:["went","go","goes","going"],a:0},
 {q:"We ___ dinner when he arrived.",o:["were having","have","had","are having"],a:0},
 {q:"She has ___ her homework.",o:["finished","finish","finishing","finishes"],a:0},
 {q:"This is the ___ book I have ever read.",o:["best","better","good","well"],a:0},

 {q:"The letters ___ every morning.",o:["are delivered","delivers","delivered by","is deliver"],a:0},
 {q:"I have lived here ___ 2018.",o:["since","for","at","from"],a:0},

 {q:"By next year, I ___ this course.",o:["will have completed","complete","completed","am completing"],a:0},
 {q:"If they had studied harder, they ___ the exam.",o:["would have passed","will pass","would pass","passed"],a:0},
 {q:"The problem ___ yesterday.",o:["was discussed","discussed by","is discuss","has discuss"],a:0},
 {q:"He should ___ more carefully.",o:["listen","listens","listening","listened"],a:0},
 {q:"Never ___ such a beautiful place.",o:["have I seen","I have seen","did I saw","I saw"],a:0},
 {q:"If we had protected the forest, the air ___ cleaner now.",o:["would be","will be","would have been","is"],a:0},
 {q:"The technology, ___ was developed recently, saves energy.",o:["which","where","who","what"],a:0}
];

function placementTest(){
 S.quiz={
  type:"placement",
  title:"آزمون تعیین سطح ۳۰ سؤالی",
  questions:placementQuestions.map(x=>{
   const options=shuffle(x.o);
   return {
    q:x.q,
    options,
    answer:options.indexOf(x.o[x.a])
   };
  }),
  i:0,
  correct:0,
  wrong:0
 };

 render("تعیین سطح",`<div id="placementQuiz"></div>`);
 quizRender("placementQuiz");
}

async function placementFinish(){
 const score=S.quiz.correct;
 let level;

 if(score<=7)level="A1";
 else if(score<=13)level="A2";
 else if(score<=19)level="B1";
 else if(score<=24)level="B2";
 else if(score<=28)level="C1";
 else level="C2";

 const el=document.getElementById("placementQuiz");

 if(S.student){
  try{
   await db.from("exam_results").insert({
    user_id:S.student.auth_user_id,
    student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,
    exam_type:"placement",
    exam_title:"آزمون تعیین سطح ۳۰ سؤالی",
    score,
    total:30,
    percentage:Math.round(score/30*100)
   });
  }catch(e){}
 }

 el.innerHTML=`
 <div class="card resultBox">
  <div class="score">${score}/30</div>
  <h2 style="text-align:center">سطح پیشنهادی شما: ${level} 🎯</h2>
  <p style="text-align:center">این نتیجه بر اساس عملکرد شما در آزمون تعیین سطح به دست آمده است.</p>
  <button class="btn full" onclick="home()">بازگشت به خانه</button>
 </div>`;
}

async function placementAnswer(i){
 const q=S.quiz.questions[S.quiz.i];
 const opts=document.querySelectorAll(".option");

 opts.forEach(x=>x.disabled=true);

 if(i===q.answer){
  S.quiz.correct++;
  opts[i].classList.add("correct");
 }else{
  S.quiz.wrong++;
  opts[i].classList.add("wrong");
  opts[q.answer].classList.add("correct");
 }

 setTimeout(async()=>{
  S.quiz.i++;

  if(S.quiz.i>=S.quiz.questions.length)
   await placementFinish();
  else
   quizRender("placementQuiz");
 },650);
}

/* PATCH QUIZ ANSWER FOR PLACEMENT */

const originalAnswer=answer;

answer=function(i,id){
 if(S.quiz?.type==="placement"){
  placementAnswer(i);
  return;
 }
 originalAnswer(i,id);
};

/* ADMIN */

  const r=await db.from("students").select("*").order("id",{ascending:false});

  if(r.error)throw r.error;

  const req=await db.from("teacher_requests")
   .select("*")
   .order("created_at",{ascending:false});

  renderAdmin(r.data||[],req.data||[]);
 }catch(e){
  document.body.innerHTML=`
   <div class="container">
    <div class="card">
     <h2>خطا در پنل مدیر</h2>
     <p>${esc(e.message)}</p>
     <button class="btn" onclick="admin()">تلاش مجدد</button>

   </div>`;
 }
}

async function respondRequest(id,status){
 try{
  const r=await db.from("teacher_requests")
   .update({status})
   .eq("id",id);

  if(r.error)throw r.error;

  admin();
 }catch(e){
  alert("خطا:\n"+e.message);
 }
}

async function approve(id){
 try{
  const r=await db.from("students")
   .update({status:"registered"})
   .eq("id",id);

  if(r.error)throw r.error;

  admin();
 }catch(e){
  alert("خطا در تأیید:\n"+e.message);
 }
}

async function rejectStudent(id){
 try{
  const r=await db.from("students")
   .update({status:"rejected"})
   .eq("id",id);

  if(r.error)throw r.error;

  admin();
 }catch(e){
  alert("خطا:\n"+e.message);
 }
}

/* LOGOUT */

async function logout(){
 try{
  await db.auth.signOut();
 }catch(e){}

 S={
  student:null,
  admin:false,
  grade:null,
  lesson:null,
  quiz:null,
  xp:0,
  level:1,
  progress:{},
  achievements:[],
  exams:[]
 };

 login();
}

/* START */

async function startup(){
 try{
  const r=await db.auth.getSession();
  const session=r.data?.session;

  if(!session){
   login();
   return;
  }

  const user=session.user;

  if((user.email||"").toLowerCase()==="alinagheli@gmail.com"){
   S.admin=true;
   admin();
   return;
  }

  const st=await db.from("students")
   .select("*")
   .eq("auth_user_id",user.id)
   .maybeSingle();

  if(st.data&&["registered","approved"].includes(st.data.status)){
   S.student=st.data;
   await loadStudentStats();
   home();
   return;
  }

  await db.auth.signOut();
  login();

 }catch(e){
  try{
   await db.auth.signOut();
  }catch(_){}

  login();
 }
}

db.auth.onAuthStateChange((event)=>{
 if(event==="SIGNED_OUT"&&!S.admin&&!S.student)
  login();
});

startup();
</script>
