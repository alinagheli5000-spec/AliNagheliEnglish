function speak(word){

}

async function registerStudent(){

 const first=document.getElementById("rFirst").value.trim();
 const last=document.getElementById("rLast").value.trim();
 const phone=document.getElementById("rPhone").value.trim();
 const password=document.getElementById("rPass").value;
 const level=document.getElementById("rLevel").value.trim();

 if(!first||!last||!phone||!password){
  alert("همه موارد را تکمیل کنید.");
  return;
 }

 if(password.length<6){
  alert("رمز عبور باید حداقل ۶ کاراکتر باشد.");
  return;
 }

 const email=phoneEmail(phone);

 const result=await sb.auth.signUp({
  email,
  password,
  options:{
   data:{
    first_name:first,
    last_name:last,
    phone,
    level
   }
  }
 });

 if(result.error){
  alert(result.error.message);
  return;
 }

 const user=result.data.user;

 if(!user){
  alert("ثبت‌نام انجام نشد.");
  return;
 }

 const insert=await sb
  .from("students")
  .insert({
   first_name:first,
   last_name:last,
   phone,
   level,
   status:"waiting",
   auth_user_id:user.id,
   password_created:true,
   login_email:email
  });

 if(insert.error){
  alert("حساب ساخته شد ولی ذخیره اطلاعات زبان‌آموز با خطا مواجه شد: "+insert.error.message);
  return;
 }

 await sb.auth.signOut();

 alert("ثبت‌نام انجام شد. پس از تأیید مدیر می‌توانید وارد شوید.");
 showLogin();
}

/*
=========================================================
LOGIN FIX
شماره تلفن ابتدا در جدول students جست‌وجو می‌شود.
سپس login_email واقعی همان رکورد برای Auth استفاده می‌شود.
بنابراین حساب‌های قدیمی که ایمیلشان با شماره تلفن یکسان
نیستند نیز درست کار می‌کنند.
=========================================================
*/

async function studentLogin(){

 const phone=document.getElementById("loginPhone").value.trim();
 const password=document.getElementById("loginPassword").value;

 if(!phone||!password){
  alert("شماره تلفن و رمز عبور را وارد کنید.");
  return;
 }

 const normalized=phone.replace(/\s/g,"");

 let query=await sb
  .from("students")
  .select("*")
  .eq("phone",normalized)
  .maybeSingle();

 /*
  اگر شماره با صفر ابتدای آن در DB ذخیره نشده باشد،
  یک جست‌وجوی جایگزین نیز انجام می‌دهیم.
 */
 if(!query.data&&!query.error){
  const digits=normalized.replace(/\D/g,"");

  query=await sb
   .from("students")
   .select("*")
   .or(`phone.eq.${normalized},phone.eq.${digits}`)
   .maybeSingle();
 }

 if(query.error){
  alert("خطا در دریافت حساب: "+query.error.message);
  return;
 }

 const student=query.data;

 if(!student){
  alert("این شماره تلفن در سامانه پیدا نشد.");
  return;
 }

 if(student.status==="rejected"){
  alert("ثبت‌نام شما توسط مدیر رد شده است.");
  return;
 }

 if(student.status!=="registered" && student.status!=="approved"){
  alert("حساب شما هنوز توسط مدیر تأیید نشده است.");
  return;
 }

 /*
  مهم‌ترین قسمت:
  ایمیل را از login_email خود رکورد می‌گیریم.
  دیگر ایمیل را از شماره تلفن حدس نمی‌زنیم.
 */

  if(!session){
   showLogin();
   return;
  }

  const user=session.user;

  if(email==="alinagheli@gmail.com"){
   state.isAdmin=true;
   await loadStudents();
   renderAdmin();
   return;
  }

  const studentResult=await sb
   .from("students")
   .select("*")
   .eq("auth_user_id",user.id)
   .maybeSingle();

  if(studentResult.data){

   if(
    studentResult.data.status==="registered"||
    studentResult.data.status==="approved"
   ){
    state.student=studentResult.data;
    renderStudentHome();
    return;
   }

  await sb.auth.signOut();
  showLogin();

 }catch(error){

  console.error(error);
  showLogin();
 }
}

function buildQuestions(lessonIndex){

 const key="Lesson "+(lessonIndex+1);
 const words=vocabulary[key]||[];

 let qs=[];

 words.forEach((w,i)=>{

  qs.push({
   q:`معنی "${w[0]}" چیست؟`,
   options:[
    w[1],
    words[(i+1)%words.length][1],
    words[(i+2)%words.length][1]
   ],
   answer:0
  });

 });

 const content=sampleContent[key]||[];

 content.forEach(x=>{

  qs.push({
   q:`کدام گزینه با ساختار "${x[0]}" هماهنگ است؟`,
   options:[
    x[1],
    "She are student.",
    "They is happy."
   ],
   answer:0
  });

 });

 return qs.slice(0,15);
}

function startLessonQuiz(){

 state.quiz={
  questions:buildQuestions(state.lesson),
  index:0,
  correct:0,
  wrong:0,
  type:"lesson",
  title:`پایه ${state.grade} - ${schoolBooks[state.grade].lessons[state.lesson]}`
 };

 renderQuiz("lessonQuiz");
}

function renderQuiz(target){

 const q=state.quiz.questions[state.quiz.index];

 if(!q){
  finishQuiz(target);
  return;
 }

 const targetEl=document.getElementById(target);

 if(!targetEl)return;

 targetEl.innerHTML=`
 <div class="quiz">

  <b>
   سؤال ${state.quiz.index+1}
   از ${state.quiz.questions.length}
  </b>

  <div class="progress">
   <i style="
    width:${state.quiz.index/state.quiz.questions.length*100}%
   "></i>
  </div>

  <div class="question">
   ${esc(q.q)}
  </div>

  ${q.options.map((o,i)=>`

   <button
    class="option"
    onclick="answer(${i},'${target}')">

    ${esc(o)}

   </button>

  `).join("")}

  <div id="feedback"></div>

 </div>`;
}

function answer(index,target){

 const q=state.quiz.questions[state.quiz.index];

 const options=document.querySelectorAll(".option");

 options.forEach(x=>x.disabled=true);

 const correct=index===q.answer;

 if(correct){

  state.quiz.correct++;

  options[index].classList.add("correct");

  showFeedback(true);

 }else{

  state.quiz.wrong++;

  options[index].classList.add("wrong");

  options[q.answer].classList.add("correct");

  showFeedback(false);
 }

 setTimeout(()=>{

  state.quiz.index++;

  renderQuiz(target);

 },1100);
}

function showFeedback(ok){

 const f=document.getElementById("feedback");

 if(!f)return;

 f.className="feedback "+(ok?"ok":"bad");

 f.innerHTML=ok
  ?"✅ 😊 آفرین! پاسخ درست است."
  :"❌ 😢 پاسخ اشتباه است.";
}

function finishQuiz(target){

function contestQuestions(group){

 let source=[];

 const grade=group<6?group+7:null;

 if(grade){

  for(let i=0;i<8;i++){
   source=source.concat(buildQuestions(i));
  }

 }else{

  source=buildQuestions(0)
   .concat(buildQuestions(1))
   .concat(buildQuestions(2));
 }

 source=source.slice(0,20);

 while(source.length<20){

  source.push({
   q:`سؤال تمرینی شماره ${source.length+1}: کدام گزینه صحیح است؟`,
   options:[
    "English",
    "School",
    "Teacher"
   ],
   answer:0
  });

 }

 return source;
}

function startContest(group){

 state.quiz={
  questions:contestQuestions(group),
  index:0,
  correct:0,
  wrong:0,
  type:"contest",
  group,
  title:contestNames[group]
 };

 renderContest();
}

function renderContest(){

 const q=state.quiz.questions[state.quiz.index];

 if(!q){
  finishContest();
  return;
 }

 document.body.innerHTML=`
 ${header("🏆 "+state.quiz.title)}

 <main class="container">

  <div class="card">

   <div class="quiz">

    <b>
     سؤال ${state.quiz.index+1} از 20

    </div>

    <div class="progress">
     <i style="
      width:${state.quiz.index/20*100}%
     "></i>
    </div>

    <div class="question">
     ${esc(q.q)}
    </div>

    ${q.options.map((o,i)=>`

     <button
      class="option"
      onclick="contestAnswer(${i})">

      ${esc(o)}

     </button>

    `).join("")}

    <div id="feedback"></div>

   </div>

  </div>

 </main>`;
}

function contestAnswer(index){

 const q=state.quiz.questions[state.quiz.index];

 const opts=document.querySelectorAll(".option");

 opts.forEach(x=>x.disabled=true);

 const ok=index===q.answer;

 if(ok){

  state.quiz.correct++;

  opts[index].classList.add("correct");

  showFeedback(true);

 }else{

  state.quiz.wrong++;

  opts[index].classList.add("wrong");

  opts[q.answer].classList.add("correct");

  showFeedback(false);
 }

 setTimeout(()=>{

  state.quiz.index++;

  renderContest();

 },1100);
}

function finishContest(){

 let raw=
  state.quiz.correct-
  (state.quiz.wrong*.25);

 raw=Math.max(0,raw);

 const percent=Math.round(raw/20*100);

 contestRecords.push({
  student:
   (state.student?.first_name||"")+
   " "+
   (state.student?.last_name||""),
  phone:state.student?.phone||"",
  group:state.quiz.group,
  title:state.quiz.title,
  score:percent,
  date:new Date().toISOString()
 });

 saveRecords();

 document.body.innerHTML=`
 ${header("نتیجه مسابقه")}

 <main class="container">

  <div class="card result">

   <div class="result-score">
    ${percent}%
   </div>

   <h2>${esc(state.quiz.title)}</h2>

   <p>
    پاسخ صحیح:
    ${state.quiz.correct}
   </p>

   <p>
    پاسخ غلط:
    ${state.quiz.wrong}
   </p>

   <p>
    نمره منفی پاسخ‌های غلط محاسبه شد.
   </p>

   <button class="btn full"
    onclick="go('contest')">
    بازگشت به مسابقات
   </button>

  </div>

 </main>`;
}

function rankings(){

 const grouped={};

 contestRecords.forEach(r=>{

  if(!grouped[r.group])
   grouped[r.group]=[];

  grouped[r.group].push(r);
 });

 let html="";

 Object.keys(grouped).forEach(g=>{

  const rows=grouped[g]
   .sort((a,b)=>b.score-a.score)
   .slice(0,3);

  html+=`
  <div class="card">

   <h4>
    ${contestNames[g]}
   </h4>

   <div class="rank">

    ${rows.map((r,i)=>`

     <div class="${i===0?"first":""}">

      <div>
       ${["🥇","🥈","🥉"][i]}
      </div>

      <b>
       ${esc(r.student||"دانش‌آموز")}
      </b>

      <div>
       ${r.score}%
      </div>

     </div>

    `).join("")}

   </div>

  </div>`;
 });

 return html||
 `<div class="muted">
   هنوز رکوردی ثبت نشده است.
  </div>`;
}

========================= */

async function loadStudents(){

 const result=await sb
  .from("students")
  .select("*")
  .order("id",{ascending:false});

 if(result.error){
  alert("خطا در دریافت زبان‌آموزان: "+result.error.message);
  return;
 }

 localStudents=result.data||[];
}

function renderAdmin(){

 document.body.innerHTML=`
 ${header("👨‍💼 پنل مدیریت")}

 <main class="container">

  <div class="hero">

   <h2>پنل مدیریت</h2>

   <p>
    مدیریت ثبت‌نام زبان‌آموزان
   </p>

  </div>

  <div class="grid">

   <div class="course">
    <div class="course-icon">👩‍🎓</div>
    <h3>کل</h3>
    <b>${localStudents.length}</b>
   </div>

   <div class="course">
    <div class="course-icon">⏳</div>
    <h3>در انتظار</h3>
    <b>
     ${localStudents.filter(x=>x.status==="waiting").length}
    </b>
   </div>

   <div class="course">
    <div class="course-icon">✅</div>
    <h3>تأیید شده</h3>
    <b>
     ${
      localStudents.filter(
       x=>x.status==="registered"||
          x.status==="approved"
      ).length
     }
    </b>
   </div>

  </div>

  <div class="card">

   <h3>
    ثبت‌نام‌های زبان‌آموزان
   </h3>

   ${
    localStudents.map(x=>`

     <div class="admin-row">

      <div>
       <b>
        ${esc(x.first_name)}
        ${esc(x.last_name)}
       </b>
      </div>

      <div class="muted">
       📱 ${esc(x.phone||"")}
       · سطح ${esc(x.level||"-")}
      </div>

      <div style="margin-top:8px">

       ${
        x.status==="waiting"
        ?
        `<span class="badge waiting">
          در انتظار
         </span>`
        :
        x.status==="registered"||
        x.status==="approved"
        ?
        `<span class="badge registered">
          تأیید شده
         </span>`
        :
        `<span class="badge rejected">
          رد شده
         </span>`
       }

      </div>

      ${
       x.status==="waiting"
       ?
       `
       <div style="
        margin-top:10px;
        display:flex;
        gap:7px;
        flex-wrap:wrap">

        <button
         class="btn success"
         onclick='approve(${JSON.stringify(x.id)})'>
         ✅ تأیید
        </button>

        <button
         class="btn danger"
         onclick='reject(${JSON.stringify(x.id)})'>
         ❌ رد
        </button>

       </div>`
       :""
      }

     </div>

    `).join("")
    ||
    `<div class="muted">
      ثبت‌نامی وجود ندارد.
     </div>`
   }

  </div>

  <button
   class="btn secondary full"
   onclick="logout()">
   خروج مدیر
  </button>

 </main>`;
}

async function approve(id){

 const result=await sb
  .from("students")
  .update({
   status:"registered"
  })
  .eq("id",id);

 if(result.error){
  alert(result.error.message);
  return;
 }

 await loadStudents();
 renderAdmin();
}

async function reject(id){

 const result=await sb
  .from("students")
  .update({
   status:"rejected"
  })
  .eq("id",id);

 if(result.error){
  alert(result.error.message);
  return;
 }

 await loadStudents();
 renderAdmin();
}
