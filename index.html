body{font-family:Tahoma,sans-serif;background:#f5f3ff;padding-bottom:80px}
.header{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:15px;position:sticky;top:0;z-index:100}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:15px}
.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 5px 25px #0000000d}
.hero{background:linear-gradient(135deg,#312e81,#7c3aed,#a855f7);color:#fff;border-radius:25px;padding:28px;margin-bottom:15px}
.btn{background:#6d28d9;color:#fff;border:0;border-radius:13px;padding:12px 16px;font-weight:bold;cursor:pointer}
.btn.full{width:100%}
.btn.secondary{background:#ede9fe;color:#5b21b6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.item{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;text-align:center;cursor:pointer;transition:.2s}
.item:hover{transform:translateY(-3px);box-shadow:0 10px 25px #6d28d933}
.icon{font-size:40px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#fff;border-top:1px solid #ddd;z-index:200}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex}
.nav{flex:1;border:0;background:#fff;padding:5px;color:#777;font-size:10px;cursor:pointer}
.nav b{display:block;font-size:20px}
.nav.active{color:#6d28d9;font-weight:bold}
.login{min-height:100vh;background:linear-gradient(135deg,#2e1065,#7c3aed,#a855f7);display:flex;justify-content:center;align-items:center;padding:20px}
.loginCard{background:#fff;width:min(430px,100%);padding:25px;border-radius:28px;box-shadow:0 20px 60px #0004}
input,select{width:100%;border:1px solid #ddd6fe;border-radius:12px;padding:12px;margin:5px 0}
label{display:block;font-weight:bold;font-size:13px;margin-top:10px}
.tabs{display:flex;gap:8px;margin:15px 0}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:#f3f4f6;cursor:pointer}
.tab.active{background:#ede9fe;color:#6d28d9;font-weight:bold}
.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.lesson{background:#faf9ff;border:1px solid #ddd6fe;border-radius:18px;padding:17px;cursor:pointer}
.lessonNo{font-size:28px;color:#6d28d9;font-weight:bold}
.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.word{border:1px solid #ddd6fe;background:#faf9ff;border-radius:15px;padding:13px;text-align:center;cursor:pointer}
.en{color:#5b21b6;font-weight:bold}
.fa{font-size:11px;color:#777;margin-top:5px}
.muted{font-size:12px;color:#777}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7)}
.tabs2{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
.tab2{padding:10px 15px;border:0;border-radius:12px;background:#eee;white-space:nowrap;cursor:pointer}
.tab2.active{background:#6d28d9;color:#fff}
.sec{display:none}.sec.active{display:block}
.grammar{border:1px solid #e9e5ff;background:#faf9ff;padding:17px;border-radius:17px;margin-bottom:12px}
.example{direction:ltr;background:#fff;border-radius:10px;padding:11px;border:1px solid #eee}
.option{display:block;width:100%;text-align:right;background:#fff;border:1px solid #ddd6fe;border-radius:13px;padding:13px;margin:7px 0;cursor:pointer}
.option.correct{background:#dcfce7;border-color:#22c55e}
.option.wrong{background:#fee2e2;border-color:#ef4444}
.feedback{padding:13px;border-radius:13px;margin-top:10px;font-weight:bold;text-align:center}
.ok{background:#dcfce7;color:#166534}
.bad{background:#fee2e2;color:#991b1b}
.score{font-size:50px;color:#6d28d9;font-weight:bold;text-align:center}
.profileStat{background:#faf9ff;border:1px solid #e9d5ff;border-radius:18px;padding:15px;text-align:center}
.profileStat b{display:block;font-size:27px;color:#6d28d9;margin-top:5px}
.levelBar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}
.levelBar i{display:block;height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7)}
.toast{position:fixed;top:80px;right:20px;background:#333;color:#fff;padding:12px 20px;border-radius:12px;z-index:9999;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}

2:[["Simple Present","I study English.","من انگلیسی می‌خوانم."]],

GRAMMAR[10]=[["Present Perfect","They have arrived.","آنها رسیده‌اند."]];
GRAMMAR[11]=[["Present Perfect","People have changed.","مردم تغییر کرده‌اند."]];
GRAMMAR[12]=[["Third Conditional","If they had tried...","اگر تلاش کرده بودند..."]];

// ===== STATE =====
let S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],exams:[]};

// ===== RENDER FUNCTIONS =====
function render(title,content){
 document.getElementById('app').innerHTML=`
 <header class="header"><div class="headerIn">
 <div class="logo">📚 ${title} <span style="font-size:12px;opacity:.7">AliNagheli</span></div>
 <button onclick="logout()" style="background:#ffffff33;color:#fff;border:0;border-radius:10px;padding:8px 12px">🚪 خروج</button>
 </div></header>
 <main class="container">${content}</main>
 <div class="bottom"><div class="bottomIn">
 <button class="nav" onclick="home()"><b>🏠</b>خانه</button>
 <button class="nav" onclick="courses()"><b>📚</b>دروس</button>
 <button class="nav" onclick="profile()"><b>👤</b>پروفایل</button>
 </div></div>`;
}

function home(){
 const xp=S.xp||0,lv=S.level||1;
 render('خانه',`
 <div class="hero"><h1>🚀 AliNagheli English</h1><p>سلام ${S.student?.first_name||'زبان‌آموز'} 👋</p><p>⭐ ${xp} XP | 🏅 Level ${lv}</p></div>
 <div class="grid">
 <div class="item" onclick="courses()"><div class="icon">📚</div><h3>دروس مدرسه</h3><button class="btn full">ورود</button></div>
 <div class="item" onclick="profile()"><div class="icon">📊</div><h3>پیشرفت</h3><button class="btn full">مشاهده</button></div>
 </div>`);
}

function courses(){
 render('دروس',`<div class="card"><h2>📚 کتاب‌ها</h2><div class="grid">
 ${Object.keys(BOOKS).map(g=>`<div class="item" onclick="grade(${g})"><div class="icon">📖</div><h3>پایه ${g}</h3><p class="muted">${BOOKS[g].title}</p><button class="btn full">مشاهده</button></div>`).join('')}
 </div></div>`);
}

function grade(g){
 S.grade=g;
 render('پایه '+g,`<div class="card"><button class="btn secondary" onclick="courses()">← بازگشت</button><h2>${BOOKS[g].title}</h2>
 <div class="lessonGrid">${BOOKS[g].lessons.map((x,i)=>`
 <div class="lesson" onclick="openLesson(${i})"><div class="lessonNo">${i+1}</div><h3>${x}</h3></div>`).join('')}
 </div></div>`);
}

function openLesson(i){
 S.lesson=i;const no=i+1,w=WORDS[no]||[],g=GRAMMAR[no]||[];
 render('درس '+no,`<div class="card"><button class="btn secondary" onclick="grade(${S.grade})">← بازگشت</button><h2>${BOOKS[S.grade].lessons[i]}</h2>
 <div class="tabs2"><button class="tab2 active" onclick="lessonTab(0)">📘 گرامر</button><button class="tab2" onclick="lessonTab(1)">🔊 لغات</button></div>
 <div id="s0" class="sec active">${g.map(g=>`<div class="grammar"><h3>${g[0]}</h3><div class="example">${g[1]}</div><p>${g[2]}</p></div>`).join('')}</div>
 <div id="s1" class="sec"><div class="wordGrid">${w.map(w=>`<div class="word" onclick='speak("${w[0]}")'><div class="en">🔊 ${w[0]}</div><div class="fa">${w[1]}</div></div>`).join('')}</div></div>
 </div>`);
}

function lessonTab(n){document.querySelectorAll('.sec').forEach((x,i)=>x.classList.toggle('active',i===n));document.querySelectorAll('.tab2').forEach((x,i)=>x.classList.toggle('active',i===n));}

function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u);}

function profile(){render('پروفایل',`<div class="card"><h2>👤 ${S.student?.first_name||''} ${S.student?.last_name||''}</h2><p>📱 ${S.student?.phone||''}</p><div class="profileStat"><b>${S.xp}</b>⭐ XP</div><div class="profileStat"><b>${S.level}</b>🏅 Level</div></div>`);}

// ===== AUTH =====
function login(){
 document.getElementById('app').innerHTML=`
 <div class="login"><div class="loginCard"><div style="text-align:center"><div style="font-size:55px">📚</div><h2>AliNagheli English</h2></div>
 <div class="tabs"><button class="tab active" onclick="loginTab('student')">🎓 زبان‌آموز</button><button class="tab" onclick="loginTab('admin')">👨‍💼 مدیر</button></div>
 <div id="lf"></div></div></div>`;
 loginTab('student');
}

function loginTab(t){
 document.getElementById('lf').innerHTML=t==='admin'?
 `<label>ایمیل</label><input id="email" value="alinagheli@gmail.com"><label>رمز</label><input id="pass" type="password"><button class="btn full" onclick="adminLogin()">ورود</button>`:
 `<label>شماره</label><input id="phone"><label>رمز</label><input id="pass" type="password"><button class="btn full" onclick="studentLogin()">ورود</button>
 <button class="btn secondary full" onclick="registerForm()">ثبت‌نام</button>`;
}

async function studentLogin(){
 const p=document.getElementById('phone').value.trim(),pass=document.getElementById('pass').value;
 if(!p||!pass){toast('شماره و رمز را وارد کنید');return;}
 try{
  const r=await fetch('https://kapzyedzjecnfxevjisq.supabase.co/functions/v1/student-access',{
   method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ'},
   body:JSON.stringify({action:'find',phone:p})
  });
  const d=await r.json();
  if(!d.student)throw new Error('پیدا نشد');
  S.student=d.student;S.xp=0;S.level=1;home();
 }catch(e){toast('خطا: '+e.message);}
}

async function adminLogin(){
 const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;
 if(email!=='alinagheli@gmail.com'){toast('ایمیل اشتباه');return;}
 try{
  const r=await db.auth.signInWithPassword({email:'alinagheli@gmail.com',password:pass});
  if(r.error)throw r.error;
  S.admin=true;S.student=null;home();
 }catch(e){toast('خطا: '+e.message);}
}

function registerForm(){
 document.getElementById('lf').innerHTML=`
 <h3>ثبت‌نام</h3><label>نام</label><input id="rf"><label>نام خانوادگی</label><input id="rl">
 <label>شماره</label><input id="rp"><label>رمز</label><input id="rpass" type="password">
 <label>پایه</label><select id="rlevel"><option value="7">هفتم</option><option value="8">هشتم</option><option value="9">نهم</option><option value="10">دهم</option><option value="11">یازدهم</option><option value="12">دوازدهم</option></select>
 <button class="btn full" onclick="register()">ثبت‌نام</button><button class="btn secondary full" onclick="login()">بازگشت</button>`;
}

async function register(){
 const f=document.getElementById('rf').value.trim(),l=document.getElementById('rl').value.trim(),p=document.getElementById('rp').value.trim(),pass=document.getElementById('rpass').value,level=document.getElementById('rlevel').value;
 if(!f||!l||!p||!pass||!level){toast('همه موارد را پر کنید');return;}
 try{
  const email=p.replace(/\D/g,'')+'@alinagheli.com';
  const r=await db.auth.signUp({email,password:pass,options:{data:{first_name:f,last_name:l,phone:p,level}}});
  if(r.error)throw r.error;
  await fetch('https://kapzyedzjecnfxevjisq.supabase.co/functions/v1/student-access',{
   method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ'},
   body:JSON.stringify({action:'register',first_name:f,last_name:l,phone:p,level,auth_user_id:r.data.user.id,email})
  });
  toast('ثبت‌نام شد! منتظر تأیید باشید');
  login();
 }catch(e){toast('خطا: '+e.message);}
}

function logout(){S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],exams:[]};login();}

// ===== START =====
async function startup(){
 try{
  const s=await db.auth.getSession();
  if(s.data?.session){
   const u=s.data.session.user;
   if(u.email==='alinagheli@gmail.com'){S.admin=true;home();return;}
   const st=await db.from('students').select('*').eq('auth_user_id',u.id).maybeSingle();
   if(st.data){S.student=st.data;home();return;}
  }
  login();
 }catch(e){login();}
}
startup();
</script>
