<style>
:root{--bg-grad-1:#f5f3ff;--bg-grad-2:#ede9fe;--text:#171717;--text-muted:#6b7280;--card-bg:#fff;--card-border:rgba(221,214,254,.5);--card-shadow:0 4px 24px rgba(109,40,217,.06);--primary:#6d28d9;--primary-dark:#4c1d95;--primary-light:#a855f7;--accent-pink:#ec4899;--neon-purple:#a855f7;--neon-pink:#ec4899;--neon-blue:#3b82f6;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--input-bg:#faf9ff;--input-border:#ede9fe}
[data-theme="dark"]{--bg-grad-1:#0f172a;--bg-grad-2:#1e1b4b;--text:#f1f5f9;--text-muted:#94a3b8;--card-bg:#1e293b;--card-border:rgba(109,40,217,.4);--card-shadow:0 4px 24px rgba(0,0,0,.3);--input-bg:#0f172a;--input-border:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 100%);background-attachment:fixed;color:var(--text);padding-bottom:96px;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;transition:all .2s ease}
button:active{transform:scale(.97)}

.splash{position:fixed;inset:0;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10000;animation:splashOut .6s ease 1.6s forwards}
.splash .logo3d{width:240px;height:240px;animation:logoFloat 2.4s ease-in-out infinite,logoIn .9s cubic-bezier(.2,.8,.2,1)}
.splash .brand{margin-top:20px;font-size:24px;font-weight:800;color:#fff;letter-spacing:1px;text-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeInUp .6s ease .3s both}
.splash .sub{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:5px;margin-top:6px;animation:fadeInUp .6s ease .5s both}
@keyframes logoIn{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo3d{display:inline-block;position:relative;filter:drop-shadow(0 20px 45px rgba(168,85,247,.55))}
.logo3d svg{display:block;width:100%;height:100%}
.logo3d-sm{width:64px;height:64px}
.logo3d-md{width:120px;height:120px}
.logo3d-lg{width:190px;height:190px}
.logo3d-xl{width:240px;height:240px}
.header{background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 50%,#a855f7 100%);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 8px 32px rgba(109,40,217,.25);border-bottom:1px solid rgba(255,255,255,.1)}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brandBox{display:flex;align-items:center;gap:12px}
.brandTextBox{display:flex;flex-direction:column}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.2);line-height:1.2}
.logoSub{font-size:9px;opacity:.85;letter-spacing:2px;margin-top:2px}
.headerBtns{display:flex;gap:10px;align-items:center}
.iconBtn{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));color:white;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1;transition:all .3s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.iconBtn:hover{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.2));transform:translateY(-2px) scale(1.05);box-shadow:0 8px 24px rgba(168,85,247,.5),0 0 20px rgba(168,85,247,.4),inset 0 1px 0 rgba(255,255,255,.5);border-color:rgba(255,255,255,.6)}
.iconBtn:active{transform:scale(.95)}
.iconBtn svg{width:22px;height:22px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.iconBtn.logoutBtn{background:linear-gradient(135deg,rgba(239,68,68,.35),rgba(220,38,38,.15));border-color:rgba(252,165,165,.5)}
.iconBtn.logoutBtn:hover{background:linear-gradient(135deg,rgba(239,68,68,.5),rgba(220,38,38,.3));box-shadow:0 8px 24px rgba(239,68,68,.5),0 0 20px rgba(239,68,68,.4)}
.iconBtn.themeBtn{perspective:600px;transform-style:preserve-3d}
.iconBtn.themeBtn svg{transform:rotateY(0deg);transition:transform .6s cubic-bezier(.2,.8,.2,1);animation:icon3dSpin 3s ease-in-out infinite}
@keyframes icon3dSpin{0%,100%{transform:rotateY(-12deg) rotateX(6deg)}50%{transform:rotateY(12deg) rotateX(-6deg)}}
.iconBtn.themeBtn.sunny{background:linear-gradient(135deg,rgba(251,191,36,.55),rgba(245,158,11,.25));border-color:rgba(252,211,77,.85);color:#fef3c7;box-shadow:0 0 0 1px rgba(252,211,77,.4),0 0 22px rgba(251,191,36,.65),inset 0 1px 0 rgba(255,255,255,.5)}
.iconBtn.themeBtn.sunny svg{filter:drop-shadow(0 0 8px #fbbf24) drop-shadow(0 0 16px #f59e0b);animation:icon3dSpin 3s ease-in-out infinite,sunGlow 2s ease-in-out infinite}
@keyframes sunGlow{0%,100%{filter:drop-shadow(0 0 8px #fbbf24) drop-shadow(0 0 16px #f59e0b)}50%{filter:drop-shadow(0 0 14px #fbbf24) drop-shadow(0 0 26px #f59e0b)}}
.iconBtn.themeBtn.moonly{background:linear-gradient(135deg,rgba(96,165,250,.4),rgba(59,130,246,.15));border-color:rgba(147,197,253,.65);color:#dbeafe;box-shadow:0 0 0 1px rgba(147,197,253,.35),0 0 22px rgba(96,165,250,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.iconBtn.themeBtn.moonly svg{filter:drop-shadow(0 0 8px #93c5fd) drop-shadow(0 0 16px #3b82f6);animation:icon3dSpin 3s ease-in-out infinite,moonGlow 2.5s ease-in-out infinite}
@keyframes moonGlow{0%,100%{filter:drop-shadow(0 0 8px #93c5fd) drop-shadow(0 0 16px #3b82f6)}50%{filter:drop-shadow(0 0 14px #bfdbfe) drop-shadow(0 0 26px #60a5fa)}}

.welcomeHero{position:relative;border-radius:32px;padding:44px 28px;margin-bottom:18px;background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 40%,#6d28d9 70%,#a855f7 100%);box-shadow:0 30px 80px -20px rgba(109,40,217,.6),0 0 0 1px rgba(168,85,247,.3),inset 0 1px 0 rgba(255,255,255,.15);overflow:hidden;perspective:1000px;transform-style:preserve-3d}
.welcomeHero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 25%,rgba(255,255,255,.18),transparent 55%),radial-gradient(circle at 85% 75%,rgba(236,72,153,.25),transparent 60%),radial-gradient(circle at 50% 100%,rgba(59,130,246,.15),transparent 55%);pointer-events:none}
.welcomeHero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);pointer-events:none}
.welcomeGlow{position:absolute;top:-40%;right:-15%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.55),transparent 70%);filter:blur(30px);animation:wGlow 6s ease-in-out infinite}
@keyframes wGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:.95}}
.welcomeRing{position:absolute;left:-120px;top:-120px;width:340px;height:340px;border-radius:50%;border:1.5px dashed rgba(196,181,253,.35);animation:wSpin 26s linear infinite}
.welcomeRing2{left:auto;top:auto;right:-140px;bottom:-140px;width:420px;height:420px;border:1.5px dashed rgba(251,191,36,.28);animation-direction:reverse;animation-duration:34s}
@keyframes wSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.welcomeParticles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.welcomeParticles span{position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fbbf24,#f59e0b);box-shadow:0 0 12px #fbbf24,0 0 22px rgba(251,191,36,.6);animation:wFloat 8s ease-in-out infinite}
.welcomeParticles span:nth-child(1){left:8%;top:20%;animation-delay:0s}
.welcomeParticles span:nth-child(2){left:24%;top:70%;animation-delay:1s;background:radial-gradient(circle,#ec4899,#db2777);box-shadow:0 0 12px #ec4899}
.welcomeParticles span:nth-child(3){left:48%;top:14%;animation-delay:2s}
.welcomeParticles span:nth-child(4){left:72%;top:60%;animation-delay:1.4s;background:radial-gradient(circle,#a855f7,#7c3aed);box-shadow:0 0 12px #a855f7}
.welcomeParticles span:nth-child(5){left:88%;top:30%;animation-delay:2.6s}
.welcomeParticles span:nth-child(6){left:56%;top:82%;animation-delay:.6s;background:radial-gradient(circle,#3b82f6,#2563eb);box-shadow:0 0 12px #3b82f6}
@keyframes wFloat{0%,100%{transform:translateY(0) scale(1);opacity:.6}50%{transform:translateY(-22px) scale(1.6);opacity:1}}
.welcome3d{position:relative;z-index:3;text-align:center;transform-style:preserve-3d;animation:wEntrance .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes wEntrance{from{opacity:0;transform:translateY(30px) rotateX(-12deg)}to{opacity:1;transform:translateY(0) rotateX(0)}}
.welcomeBadge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:99px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;letter-spacing:3px;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4)}
.badgeSpark{display:inline-block;animation:sparkle 2.4s ease-in-out infinite}
.badgeSpark:last-child{animation-delay:1.2s}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.4) rotate(180deg)}}
.welcomeTitle{margin:18px 0 10px;display:flex;flex-direction:column;gap:8px;font-weight:900;line-height:1.35;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.4);transform:translateZ(40px)}
.welcomeTitle .titleName{font-size:clamp(30px,6vw,50px);font-family:'Lalezar','Vazirmatn',sans-serif;color:#ffffff;font-weight:900;letter-spacing:2px;transform:translateZ(40px);position:relative;padding:4px 0;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.welcomeTitle .titleLine{font-size:clamp(18px,3.4vw,26px);color:rgba(255,255,255,.95);font-weight:700;letter-spacing:.5px}
.welcomeUser{display:inline-flex;align-items:center;gap:8px;margin:12px 0 16px;padding:10px 18px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:14px;font-weight:600;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.welcomeUser .userIcon{font-size:20px;animation:waveHand 2.6s ease-in-out infinite;transform-origin:70% 70%;display:inline-block}
@keyframes waveHand{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(18deg)}20%,40%{transform:rotate(-12deg)}}
.welcomeTip{margin-top:16px;font-size:13px;color:rgba(255,255,255,.85);font-weight:600;letter-spacing:.3px}

.owlXpTrack{position:relative;margin:22px auto 0;max-width:560px;padding:16px 20px 20px;border-radius:24px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 26px rgba(0,0,0,.25)}
.owlXpHeader{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;font-size:13px;margin-bottom:14px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.owlXpHeader .xpLabel{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(251,191,36,.35),rgba(245,158,11,.15));padding:5px 12px;border-radius:99px;border:1px solid rgba(251,191,36,.5)}
.owlXpHeader .lvlLabel{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(168,85,247,.35),rgba(109,40,217,.15));padding:5px 12px;border-radius:99px;border:1px solid rgba(168,85,247,.5)}
.owlTrackWrap{position:relative;height:70px;margin-top:6px}
.owlTrack{position:absolute;left:8px;right:70px;top:50%;height:14px;transform:translateY(-50%);background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.15));border-radius:99px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.1);overflow:visible}
.owlTrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#ec4899,#a855f7);background-size:200% 100%;transition:width .8s cubic-bezier(.2,.8,.2,1);animation:shimmer 2s linear infinite;box-shadow:0 0 18px rgba(251,191,36,.75),0 0 32px rgba(236,72,153,.55);position:relative}
.owlTrack i::after{content:"";position:absolute;right:-2px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#fff,#fbbf24 60%,#f59e0b);box-shadow:0 0 20px #fbbf24,0 0 40px rgba(251,191,36,.85);animation:tipPulse 1.4s ease-in-out infinite}
@keyframes tipPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.35)}}
.owlChar{position:absolute;right:0;top:50%;transform:translateY(-50%);width:68px;height:68px;display:flex;align-items:flex-end;justify-content:center;transition:all .6s cubic-bezier(.2,.8,.2,1);animation:owlBounce 2.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes owlBounce{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(calc(-50% - 6px)) scale(1.04)}}
.owlChar.stage-1{animation:owlBounce 2.2s ease-in-out infinite,owlJoy 1s ease-in-out infinite}
.owlChar.stage-2{animation:owlBounce 2s ease-in-out infinite,owlJoy 0.9s ease-in-out infinite}
.owlChar.stage-3{animation:owlBounce 1.8s ease-in-out infinite,owlJoy 0.8s ease-in-out infinite}
.owlChar.stage-4{animation:owlBounce 1.6s ease-in-out infinite,owlJoy 0.7s ease-in-out infinite}
.owlChar.stage-5{animation:owlBounce 1.4s ease-in-out infinite,owlJoy 0.6s ease-in-out infinite}
@keyframes owlJoy{0%,100%{filter:drop-shadow(0 0 10px rgba(251,191,36,.7))}50%{filter:drop-shadow(0 0 22px rgba(251,191,36,1)) drop-shadow(0 0 40px rgba(236,72,153,.6))}}
.owlChar svg{width:100%;height:100%;overflow:visible}
.owlNote{text-align:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,.85);font-weight:600}
.owlNote b{color:#fbbf24;font-weight:800}

.consultBox{margin-top:14px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1.5px dashed rgba(255,255,255,.3);border-radius:20px;padding:16px;backdrop-filter:blur(8px)}
.consultTitle{color:#fff;font-weight:800;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.consultTitle .icon{font-size:20px;animation:ring 2s ease-in-out infinite;display:inline-block}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.consultRow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px;margin-bottom:8px;transition:all .25s ease;border:1px solid rgba(255,255,255,.1);text-decoration:none;color:#fff}
.consultRow:hover{background:rgba(0,0,0,.35);transform:translateX(-4px);border-color:rgba(255,255,255,.3);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.consultRow:last-child{margin-bottom:0}
.consultInfo{display:flex;align-items:center;gap:10px}
.consultAvatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#a855f7,#7c3aed);box-shadow:0 4px 12px rgba(168,85,247,.5);flex-shrink:0}
.consultName{font-weight:800;font-size:13px;color:#fff}
.consultPhone{font-size:11px;color:rgba(255,255,255,.75);direction:ltr;font-weight:600;letter-spacing:.5px;margin-top:2px}
.consultCallBtn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(34,197,94,.5);transition:all .2s;text-decoration:none}
.consultCallBtn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(34,197,94,.75)}
.consultCallBtn:active{transform:scale(.94)}

.dictMini{margin-top:14px;background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(37,99,235,.08));border:1.5px solid rgba(96,165,250,.4);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .25s ease;backdrop-filter:blur(6px)}
.dictMini:hover{background:linear-gradient(135deg,rgba(59,130,246,.3),rgba(37,99,235,.15));transform:translateY(-2px);box-shadow:0 10px 26px rgba(59,130,246,.4);border-color:rgba(147,197,253,.7)}
.dictMiniIcon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(59,130,246,.55);flex-shrink:0;color:#fff}
.dictMiniIcon svg{width:24px;height:24px;filter:drop-shadow(0 0 6px currentColor)}
.dictMiniContent{flex:1;color:#fff}
.dictMiniTitle{font-weight:800;font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px}
.dictMiniSub{font-size:11px;opacity:.85;margin-top:3px;font-weight:600}
.dictMiniArrow{font-size:20px;color:#fff;opacity:.7;transition:transform .2s}
.dictMini:hover .dictMiniArrow{transform:translateX(-4px);opacity:1}

.convSection{margin-top:16px}
.convHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.convHeader h3{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.convGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.convCard{border-radius:18px;padding:16px 12px;color:#fff;cursor:pointer;transition:all .3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.15)}
.convCard:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 16px 36px rgba(0,0,0,.3);border-color:rgba(255,255,255,.35)}
.convCard:active{transform:scale(.97)}
.convCard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.3),transparent 55%);opacity:.5;pointer-events:none}
.convCard .convIcon{font-size:32px;margin-bottom:6px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.convCard .convTitle{font-size:14px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 6px rgba(0,0,0,.35);direction:ltr}
.convCard .convSub{font-size:10px;opacity:.9;margin-top:4px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.convCard.touchstone1{background:linear-gradient(135deg,#ef4444,#dc2626)}
.convCard.touchstone2{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.convCard.touchstone3{background:linear-gradient(135deg,#22c55e,#15803d)}
.convCard.touchstone4{background:linear-gradient(135deg,#a855f7,#6d28d9)}
.convCard.viewpoint1{background:linear-gradient(135deg,#a16207,#78350f)}
.convCard.viewpoint2{background:linear-gradient(135deg,#78350f,#451a03)}
.convCard.ielts{background:linear-gradient(135deg,#ec4899,#be185d)}
.convCard.toefl{background:linear-gradient(135deg,#0ea5e9,#0369a1)}

.container{max-width:1100px;margin:auto;padding:18px;animation:fadeIn .4s ease}

function getOwlSVG(stage){
  const stages = {
    1: { bodyColor:"#a78bfa", bellyColor:"#ddd6fe", eyeSize:3.5, hasCrown:false, hasGlasses:false, hasBook:false, featherCount:2, size:0.85, chubby:1.0 },
    2: { bodyColor:"#8b5cf6", bellyColor:"#c4b5fd", eyeSize:3.8, hasCrown:false, hasGlasses:false, hasBook:true, featherCount:3, size:0.95, chubby:1.08 },
    3: { bodyColor:"#7c3aed", bellyColor:"#c4b5fd", eyeSize:4.0, hasCrown:false, hasGlasses:true, hasBook:true, featherCount:4, size:1.0, chubby:1.15 },
    4: { bodyColor:"#6d28d9", bellyColor:"#fbbf24", eyeSize:4.2, hasCrown:false, hasGlasses:true, hasBook:true, featherCount:5, size:1.05, chubby:1.25 },
    5: { bodyColor:"#5b21b6", bellyColor:"#f59e0b", eyeSize:4.5, hasCrown:true, hasGlasses:true, hasBook:true, featherCount:6, size:1.12, chubby:1.4 }
  };
  const s = stages[stage] || stages[1];
  const scale = s.size;
  const cw = 60 * s.chubby;
  let extras = "";
  if(s.hasCrown){ extras += `<path d="M 30 8 L 34 2 L 38 8 L 42 4 L 42 12 L 18 12 L 18 4 L 22 8 L 26 2 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.8" stroke-linejoin="round"/><circle cx="22" cy="6" r="1" fill="#ef4444"/><circle cx="30" cy="4" r="1" fill="#22c55e"/><circle cx="38" cy="6" r="1" fill="#3b82f6"/>`; }
  if(s.hasGlasses){ extras += `<circle cx="24" cy="42" r="7" fill="none" stroke="#fbbf24" stroke-width="1.2"/><circle cx="42" cy="42" r="7" fill="none" stroke="#fbbf24" stroke-width="1.2"/><line x1="31" y1="42" x2="35" y2="42" stroke="#fbbf24" stroke-width="1.2"/>`; }
  if(s.hasBook){ extras += `<g transform="translate(52,58) rotate(-15)"><rect x="0" y="0" width="14" height="10" rx="1" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.6"/><line x1="1" y1="3" x2="13" y2="3" stroke="#fef3c7" stroke-width="0.6"/><line x1="1" y1="6" x2="13" y2="6" stroke="#fef3c7" stroke-width="0.6"/></g>`; }
  let feathers = "";
  for(let i=0;i<s.featherCount;i++){ const y = 62 + i*2.5; feathers += `<path d="M ${30-s.featherCount*1.5+i*3} ${y} q 3 2 6 0" stroke="rgba(255,255,255,.4)" stroke-width="0.8" fill="none"/>`; }
  return `<svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg" style="width:${cw}px;height:80px">
    <defs>
      <radialGradient id="owlBodyG_${stage}" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#c4b5fd"/><stop offset="0.5" stop-color="${s.bodyColor}"/><stop offset="1" stop-color="#4c1d95"/></radialGradient>
      <radialGradient id="owlBellyG_${stage}" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="${s.bellyColor}"/></radialGradient>
      <radialGradient id="owlEyeG_${stage}" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e7ff"/></radialGradient>
      <radialGradient id="owlPupilG_${stage}" cx="40%" cy="35%" r="60%"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#000000"/></radialGradient>
    </defs>
    <path d="M 8 ${38*scale} Q 2 ${48*scale} 8 ${58*scale} Q 12 ${52*scale} 14 ${44*scale} Z" fill="${s.bodyColor}" stroke="#4c1d95" stroke-width="0.5"/>
    <path d="M 52 ${38*scale} Q 58 ${48*scale} 52 ${58*scale} Q 48 ${52*scale} 46 ${44*scale} Z" fill="${s.bodyColor}" stroke="#4c1d95" stroke-width="0.5"/>
    <ellipse cx="30" cy="${52*scale}" rx="${20*s.chubby}" ry="${22*scale}" fill="url(#owlBodyG_${stage})" stroke="#4c1d95" stroke-width="0.7"/>
    <ellipse cx="30" cy="${56*scale}" rx="${13*s.chubby}" ry="${15*scale}" fill="url(#owlBellyG_${stage})" opacity="0.95"/>
    ${feathers}
    <path d="M 24 ${72*scale} l -3 4 M 24 ${72*scale} l 0 4 M 24 ${72*scale} l 3 4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 36 ${72*scale} l -3 4 M 36 ${72*scale} l 0 4 M 36 ${72*scale} l 3 4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 16 ${24*scale} Q 14 ${14*scale} 20 ${16*scale} Q 22 ${22*scale} 24 ${26*scale} Z" fill="${s.bodyColor}" stroke="#4c1d95" stroke-width="0.5"/>
    <path d="M 44 ${24*scale} Q 46 ${14*scale} 40 ${16*scale} Q 38 ${22*scale} 36 ${26*scale} Z" fill="${s.bodyColor}" stroke="#4c1d95" stroke-width="0.5"/>
    <ellipse cx="30" cy="${32*scale}" rx="${18*s.chubby}" ry="${17*scale}" fill="url(#owlBodyG_${stage})" stroke="#4c1d95" stroke-width="0.7"/>
    <ellipse cx="30" cy="${34*scale}" rx="${14*s.chubby}" ry="${11*scale}" fill="url(#owlEyeG_${stage})" opacity="0.55"/>
    <circle cx="${24*s.chubby/1.15+6}" cy="${32*scale}" r="${s.eyeSize}" fill="url(#owlEyeG_${stage})" stroke="#4c1d95" stroke-width="0.6"/>
    <circle cx="${48-6*s.chubby/1.15}" cy="${32*scale}" r="${s.eyeSize}" fill="url(#owlEyeG_${stage})" stroke="#4c1d95" stroke-width="0.6"/>
    <circle cx="${25*s.chubby/1.15+6}" cy="${32*scale}" r="${s.eyeSize*0.55}" fill="url(#owlPupilG_${stage})"/>
    <circle cx="${47-6*s.chubby/1.15}" cy="${32*scale}" r="${s.eyeSize*0.55}" fill="url(#owlPupilG_${stage})"/>
    <circle cx="${23.5*s.chubby/1.15+6}" cy="${30.5*scale}" r="${s.eyeSize*0.25}" fill="#ffffff" opacity="0.95"/>
    <circle cx="${45.5-6*s.chubby/1.15}" cy="${30.5*scale}" r="${s.eyeSize*0.25}" fill="#ffffff" opacity="0.95"/>
    <path d="M 30 ${36*scale} L 27 ${41*scale} L 33 ${41*scale} Z" fill="#f59e0b" stroke="#b45309" stroke-width="0.5" stroke-linejoin="round"/>
    ${extras}
    ${stage>=4?`<circle cx="6" cy="20" r="1.5" fill="#fbbf24"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="54" cy="18" r="1.5" fill="#ec4899"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>`:""}
    ${stage>=5?`<circle cx="4" cy="48" r="1.5" fill="#22c55e"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle><circle cx="56" cy="50" r="1.5" fill="#3b82f6"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle><path d="M 2 34 l 2 -2 M 58 34 l -2 -2" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>`:""}
  </svg>`;
}
