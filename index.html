<style>
*{box-sizing:border-box}
:root{
  --primary:#6d28d9;
  --primary2:#8b5cf6;
  --bg:#f6f5ff;
  --card:#fff;
  --text:#17122b;
  --muted:#716b84;
  --green:#16a34a;
  --red:#dc2626;
  --gold:#f59e0b;
  --shadow:0 10px 30px rgba(58,31,116,.12)
}
body{
  margin:0;
  background:linear-gradient(135deg,#f8f5ff,#eee8ff);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh
}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:1100px;margin:auto;min-height:100vh}
header{
  background:linear-gradient(135deg,#4c1d95,#7c3aed,#a78bfa);
  color:#fff;padding:18px 18px 24px;
  border-radius:0 0 30px 30px;
  box-shadow:var(--shadow)
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:25px;font-weight:900}
.header-sub{font-size:12px;opacity:.85;margin-top:4px}
.icon-btn{
  border:0;background:rgba(255,255,255,.18);color:#fff;
  width:42px;height:42px;border-radius:14px;font-size:20px
}
main{padding:18px 14px 95px}
.card{
  background:var(--card);border-radius:22px;padding:18px;
  box-shadow:var(--shadow);margin-bottom:15px
}
.hero{
  background:linear-gradient(135deg,#fff,#f3edff);
  border:1px solid #e8ddff
}
h1,h2,h3{margin-top:0}
.muted{color:var(--muted);font-size:13px;line-height:1.9}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px
}
.course-card{
  border:0;border-radius:22px;padding:18px 12px;
  min-height:145px;color:#fff;
  background:linear-gradient(145deg,#6d28d9,#9333ea);
  box-shadow:0 10px 22px rgba(109,40,217,.2);
  transition:.2s
}
.course-card:hover{transform:translateY(-3px)}
.course-icon{font-size:42px;margin-bottom:8px}
.course-title{font-size:18px;font-weight:900}
.course-sub{font-size:11px;opacity:.85;margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 3px 12px}
.section-title h2{font-size:19px;margin:0}
.badge{
  display:inline-flex;padding:5px 9px;border-radius:99px;
  background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:bold
}
.btn{
  border:0;border-radius:14px;padding:11px 15px;font-weight:bold;
  background:var(--primary);color:#fff
}
.btn.secondary{background:#ede9fe;color:#5b21b6}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.gray{background:#eeeef2;color:#333}
.btn.full{width:100%}
input,select{
  width:100%;padding:13px;border:1px solid #ddd6fe;
  border-radius:13px;background:#fff;outline:none
}
input:focus,select:focus{border-color:var(--primary)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;margin-bottom:6px;font-weight:bold}
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(1100px,100%);background:#fff;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 25px rgba(0,0,0,.12);z-index:100
}
.nav button{
  border:0;background:none;color:#777;padding:6px 2px;font-size:11px
}
.nav button.active{color:var(--primary);font-weight:900}
.nav-icon{display:block;font-size:22px;margin-bottom:3px}
.lesson-list{display:grid;gap:10px}
.lesson-btn{
  border:1px solid #e5def8;background:#fff;border-radius:18px;
  padding:15px;text-align:right;display:flex;align-items:center;
  justify-content:space-between
}
.lesson-num{
  width:38px;height:38px;border-radius:12px;background:#ede9fe;
  color:#5b21b6;display:flex;align-items:center;justify-content:center;font-weight:900
}
.lesson-left{display:flex;align-items:center;gap:11px}
.vocab-row{
  display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;
  padding:11px 0
}
.speaker{
  width:39px;height:39px;border:0;border-radius:12px;
  background:#ede9fe;color:#5b21b6;font-size:18px
}
.vocab-en{font-weight:900;direction:ltr;text-align:left}
.vocab-fa{font-size:12px;color:var(--muted)}
.grammar-box{
  background:#faf8ff;border-right:4px solid var(--primary);
  padding:15px;border-radius:14px;line-height:2;margin:10px 0
}
.example{
  background:#fff;border:1px solid #e7e0f5;
  border-radius:13px;padding:10px;margin:7px 0;direction:ltr;text-align:left
}
.question{
  background:#fff;border-radius:18px;padding:16px;
  border:1px solid #e7e1f4;margin-bottom:12px
}
.question-title{font-weight:900;line-height:1.8}
.option{
  width:100%;text-align:right;border:1px solid #ddd6fe;
  background:#fff;padding:12px;border-radius:12px;margin-top:8px
}
.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.result{
  text-align:center;padding:25px;border-radius:22px;
  background:linear-gradient(135deg,#ede9fe,#fff)
}
.score{font-size:48px;font-weight:900;color:var(--primary)}
.rank{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px;background:#fafafa;border-radius:13px;margin:7px 0
}
.rank:nth-child(2){background:#fff7ed}
.rank:nth-child(3){background:#f5f5f5}
.teacher{
  text-align:center;padding:22px;border-radius:22px;
  background:linear-gradient(135deg,#faf7ff,#eee7ff);
  border:1px solid #e5d9ff;margin-bottom:15px
}
.teacher-avatar{
  width:85px;height:85px;border-radius:50%;margin:auto;
  display:flex;align-items:center;justify-content:center;
  font-size:35px;background:linear-gradient(135deg,#6d28d9,#c084fc);color:#fff
}
.phone{
  display:inline-block;color:#5b21b6;font-weight:900;
  text-decoration:none;direction:ltr;margin-top:8px
}
.admin-table{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;font-size:12px}
th{background:#f5f3ff}
.status{
  padding:5px 8px;border-radius:99px;font-size:10px;font-weight:bold
}
.status.waiting{background:#fef3c7;color:#92400e}
.status.registered{background:#dcfce7;color:#166534}
.status.rejected{background:#fee2e2;color:#991b1b}
.toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:999;background:#181229;color:#fff;padding:12px 18px;
  border-radius:13px;box-shadow:var(--shadow);font-size:13px
}
.modal{
  position:fixed;inset:0;background:rgba(20,10,40,.55);
  z-index:500;display:flex;align-items:center;justify-content:center;padding:15px
}
.modal-box{
  width:min(650px,100%);max-height:90vh;overflow:auto;
  background:#fff;border-radius:25px;padding:20px
}
.close{
  float:left;border:0;background:#eee;width:38px;height:38px;border-radius:12px
}
.loading{text-align:center;padding:30px;color:var(--muted)}
.small{font-size:11px}
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .course-card{min-height:125px}
}
</style>
</head>

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.remove("hidden");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.add("hidden"),3000);
}

function normalizePhone(v){
  let x=(v||"").trim().replace(/\s+/g,"");
  if(x.startsWith("+98")) x="0"+x.slice(3);
  if(x.startsWith("98")) x="0"+x.slice(2);
  return x;
}

function studentEmail(phone){
  return normalizePhone(phone)+"@alinagheli.com";
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function speak(text){
  if(!("speechSynthesis" in window)){
    toast("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=.78;
  u.pitch=1;
  speechSynthesis.speak(u);
}

function openModal(html){
  document.getElementById("modalContent").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

async function login(){
  const identifier=document.getElementById("loginIdentifier").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!identifier||!password){
    toast("شماره/ایمیل و رمز عبور را وارد کنید.");
    return;
  }

  const email=identifier.includes("@")?identifier:studentEmail(identifier);

  if(email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
    return adminLogin(email,password);
  }

  const {data,error}=await sb.auth.signInWithPassword({
    email,password
  });

  if(error){
    toast("ورود ناموفق: "+error.message);
    return;
  }

  currentUser=data.user;
  await loadStudent();
}

async function adminLogin(email,password){
  const {data,error}=await sb.auth.signInWithPassword({email,password});

  if(error){
    toast("ورود مدیر ناموفق است: "+error.message);
    return;
  }

  currentUser=data.user;
  if((currentUser.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
    toast("این حساب دسترسی مدیر ندارد.");
    await sb.auth.signOut();
    return;
  }

  showAdmin();
}

async function logout(){
  await sb.auth.signOut();
  currentUser=null;
  currentStudent=null;
  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("adminPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
}

async function loadStudent(){
  if(!currentUser)return;

  const {data,error}=await sb
    .from("students")
    .select("*")
    .eq("auth_user_id",currentUser.id)
    .maybeSingle();

  if(error){
    toast("خطا در دریافت اطلاعات زبان‌آموز.");
    return;
  }

  if(!data){
    toast("پروفایل زبان‌آموز پیدا نشد.");
    return;
  }

  currentStudent=data;

  if(data.status==="waiting"){
    showWaiting();
    return;
  }

  if(data.status==="rejected"){
    showRejected();
    return;
  }

  showApp();
}

async function registerStudent(){
  const first=document.getElementById("regFirst").value.trim();
  const last=document.getElementById("regLast").value.trim();
  const phone=normalizePhone(document.getElementById("regPhone").value);
  const level=document.getElementById("regLevel").value;
  const password=document.getElementById("regPassword").value;

  if(!first||!last||!phone||password.length<6){
    toast("همه اطلاعات را کامل کنید.");
    return;
  }

  const email=studentEmail(phone);

  const {data:existing}=await sb
    .from("students")
    .select("id")
    .eq("phone",phone)
    .maybeSingle();

  if(existing){
    toast("این شماره قبلاً ثبت شده است.");
    return;
  }

  const {data,error}=await sb.auth.signUp({
    email,password,
    options:{
      data:{
        first_name:first,
        last_name:last,
        phone,
        level
      }
    }
  });

  if(error){
    toast("ثبت‌نام ناموفق: "+error.message);
    return;
  }

  if(!data.user){
    toast("ثبت‌نام انجام نشد.");
    return;
  }

  const {error:insertError}=await sb.from("students").insert({
    first_name:first,
    last_name:last,
    phone,
    level,
    status:"waiting",
    auth_user_id:data.user.id,
    password_created:true
  });

  if(insertError){
    toast("پروفایل ساخته نشد: "+insertError.message);
    return;
  }

  closeModal();
  toast("ثبت‌نام انجام شد؛ در انتظار تأیید مدیر باشید.");
}

    "he / she / it + be":`
      <div class="grammar-box">

    "have / has":`

      <br><br>

    "There is / There are":`
      <div class="grammar-box">

      <div class="grammar-box">

      بعد از like و love می‌توانیم اسم یا شکل -ing بیاوریم.
      بعد از enjoy معمولاً فعل به شکل -ing می‌آید.
      </div>
      <div class="example">I like music.</div>
      <div class="example">I like playing football.</div>
      <div class="example">She enjoys reading books.</div>`,

    "Simple Present":`
      <div class="grammar-box">
      زمان حال ساده برای عادت‌ها، کارهای تکراری و واقعیت‌ها استفاده می‌شود.
      <br><br>
      I / You / We / They + verb<br>

      </div>
      <div class="example">I go to school every day.</div>
      <div class="example">She goes to school every day.</div>

    "should / shouldn't":`
      <div class="grammar-box">

    "Present Continuous":`
      <div class="grammar-box">
      زمان حال استمراری برای کاری است که اکنون در حال انجام است.

      <br><br>

      <br><br>

  };

  return explanations[grammar]||
  `<div class="grammar-box"><b>${escapeHtml(grammar)}</b><br>

}

      a:0
    },
    {
      q:`گرامر اصلی این درس چیست؟`,

      a:0
    },
    {
      q:`کدام گزینه یکی از واژه‌های این درس است؟`,
      options:[vocab[4][0],"elephant","computer","airplane"],
      a:0
    },
    {
      q:`معنی "${vocab[4][0]}" چیست؟`,
      options:[vocab[4][1],"پزشک","رودخانه","موسیقی"],
      a:0
    },
    {
      q:`کدام گزینه از واژگان همین درس است؟`,
      options:[vocab[5][0],"purple","window","football"],
      a:0
    },
    {
      q:`معنی "${vocab[5][0]}" چیست؟`,
      options:[vocab[5][1],"کشور","اتاق","جشن"],
      a:0
    },
    {
      q:`کدام واژه در محتوای درس وجود دارد؟`,
      options:[vocab[6][0],"airport","summer","computer"],
      a:0
    },
    {

      options:[vocab[6][1],"دانشگاه","ورزش","خانواده"],
      a:0
    },
    {
      q:`کدام واژه دیگر از این درس است؟`,

function shuffleQuestionOptions(q){
  const correct=q.options[q.a];
  const arr=[...q.options].sort(()=>Math.random()-.5);
  return {...q,options:arr,a:arr.indexOf(correct)};
}

function startLessonExam(type,id,index){
  const c=getCourse(type,id);
  const lesson=c.lessons[index];
  currentExam={
    type:"lesson",
    courseId:id,
    courseType:type,
    lessonIndex:index,
    title:`آزمون ${lesson[0]} - ${lesson[1]}`,
    questions:makeLessonQuestions(lesson).map(shuffleQuestionOptions),
    points:1
  };
  examAnswers=new Array(currentExam.questions.length).fill(null);
  renderExam();
}

function renderExam(){
  const ex=currentExam;
  document.getElementById("content").innerHTML=`
  <div class="card hero">
    <button class="btn secondary" onclick="openCourse('${ex.courseType}','${ex.courseId}')">← بازگشت</button>
    <h2 style="margin-top:12px">📝 ${escapeHtml(ex.title)}</h2>
    <p class="muted">۱۵ سؤال • هر پاسخ درست ۱ امتیاز</p>
  </div>

  <div id="examBox">
  ${ex.questions.map((q,i)=>`
    <div class="question" id="question-${i}">
      <div class="question-title">${i+1}. ${escapeHtml(q.q)}</div>
      ${q.options.map((o,j)=>`
        <button class="option" id="opt-${i}-${j}"
          onclick="answerExam(${i},${j})">
          ${String.fromCharCode(65+j)}) ${escapeHtml(o)}
        </button>
      `).join("")}
      <div id="feedback-${i}" class="small" style="margin-top:8px"></div>
    </div>
  `).join("")}
  </div>

  <button class="btn green full" onclick="finishExam()">ثبت و مشاهده نتیجه</button>`;
}

function answerExam(i,j){
  const q=currentExam.questions[i];

  if(examAnswers[i]!==null)return;

  examAnswers[i]=j;

  q.options.forEach((_,k)=>{
    const b=document.getElementById(`opt-${i}-${k}`);
    if(k===q.a)b.classList.add("correct");
    if(k===j && j!==q.a)b.classList.add("wrong");
    b.disabled=true;
  });

  const fb=document.getElementById(`feedback-${i}`);
  if(j===q.a){
    fb.innerHTML="✅ پاسخ درست";
    fb.style.color="#15803d";
  }else{
    fb.innerHTML="❌ پاسخ نادرست";
    fb.style.color="#b91c1c";
  }
}

async function finishExam(){
  let correct=0;
  currentExam.questions.forEach((q,i)=>{
    if(examAnswers[i]===q.a)correct++;
  });

  const percent=Math.round(correct/currentExam.questions.length*100);

  document.getElementById("content").innerHTML=`
  <div class="result">
    <div style="font-size:60px">${percent>=70?"🎉":"📚"}</div>
    <h2>نتیجه آزمون</h2>
    <div class="score">${percent}%</div>
    <p>تعداد پاسخ درست: ${correct} از ${currentExam.questions.length}</p>
    <button class="btn" onclick="navigate('records')">مشاهده رکوردها</button>
    <button class="btn secondary" onclick="navigate('courses')">بازگشت به دوره‌ها</button>
  </div>`;

  await saveResult("exam",currentExam.title,percent,correct,currentExam.questions.length);
}

async function saveResult(kind,title,percent,correct,total){
  const payload={
    student_id:currentStudent?.id||null,
    auth_user_id:currentUser?.id||null,
    type:kind,
    title,
    score:percent,
    correct,
    total,
    created_at:new Date().toISOString()
  };

  /*
    تلاش اول برای جدول رایج exam_results.
    اگر پروژه جدول نتیجه متفاوتی داشته باشد، رکورد در localStorage
    نیز نگهداری می‌شود تا نتیجه دانش‌آموز از بین نرود.
  */

  const localKey="alinagheli_records_"+(currentUser?.id||"guest");
  const local=JSON.parse(localStorage.getItem(localKey)||"[]");
  local.unshift(payload);
  localStorage.setItem(localKey,JSON.stringify(local.slice(0,100)));

  try{
    await sb.from("exam_results").insert(payload);
  }catch(e){}

  try{
    await sb.from("exam_attempts").insert(payload);
  }catch(e){}
}

async function getRecords(){
  const localKey="alinagheli_records_"+(currentUser?.id||"guest");
  let records=JSON.parse(localStorage.getItem(localKey)||"[]");

  try{
    const {data}=await sb
      .from("exam_results")
      .select("*")
      .or(`auth_user_id.eq.${currentUser.id},student_id.eq.${currentStudent.id}`)
      .order("created_at",{ascending:false})
      .limit(100);

    if(data?.length){
      const map=new Map();
      [...data,...records].forEach(r=>{
        const key=r.id||`${r.title}-${r.created_at}`;
        map.set(key,r);
      });
      records=[...map.values()].sort((a,b)=>
        new Date(b.created_at)-new Date(a.created_at)
      );
    }
  }catch(e){}

  return records;
}

async function renderRecords(){
  document.getElementById("content").innerHTML=
  `<div class="loading">در حال دریافت رکوردها...</div>`;

  const records=await getRecords();

  document.getElementById("content").innerHTML=`
  <div class="section-title">
    <h2>📊 رکوردهای من</h2>
  </div>

  <div class="card hero">
    <h3>${escapeHtml(currentStudent.first_name)} ${escapeHtml(currentStudent.last_name)}</h3>
    <p class="muted">نتایج آزمون‌ها و مسابقات شما در این بخش ثبت می‌شود.</p>
  </div>

  ${records.length?records.map((r,i)=>`
  <div class="rank">
    <div>
      <b>${escapeHtml(r.title||"آزمون")}</b>
      <div class="small muted">
      ${r.type==="competition"?"🏆 مسابقه":"📝 آزمون"} •
      ${r.created_at?new Date(r.created_at).toLocaleDateString("fa-IR"):""}
      </div>

  </div>`}`;
}

function buildCompetitionQuestions(compId){
  let base=[];

  if(compId==="conversation"){
    const all=Object.values(CONVERSATION).flatMap(c=>c.lessons);
    all.forEach(l=>base.push(...makeLessonQuestions(l)));
  }else{
    const c=SCHOOL[compId];
    c.lessons.forEach(l=>base.push(...makeLessonQuestions(l)));
  }

  base=base.sort(()=>Math.random()-.5).slice(0,20);

  while(base.length<20){
    base.push(...base.slice(0,Math.min(20-base.length,base.length)));
  }

  return base.slice(0,20).map((q,i)=>{
    const x=shuffleQuestionOptions(q);
    return {
      ...x,
      q:`${i+1}. ${x.q}`
    };
  });
}

function startCompetition(id){
  const comp=COMPETITIONS.find(x=>x.id===id);

  currentCompetition={
    id,
    title:comp.title,
    questions:buildCompetitionQuestions(id)
  };

  examAnswers=new Array(20).fill(null);

  renderCompetitionExam();
}

function answerCompetition(i,j){
  if(examAnswers[i]!==null)return;

  examAnswers[i]=j;
  const q=currentCompetition.questions[i];

  q.options.forEach((_,k)=>{

  if(j===q.a){
    fb.textContent="✅ درست";
    fb.style.color="#15803d";
  }else{
    fb.textContent="❌ غلط — ۲ امتیاز منفی";
    fb.style.color="#b91c1c";
  }
}

async function finishCompetition(){
  let correct=0,wrong=0,unanswered=0;

  currentCompetition.questions.forEach((q,i)=>{
    if(examAnswers[i]===null)unanswered++;
    else if(examAnswers[i]===q.a)correct++;
    else wrong++;
  });

  const score=correct*5-wrong*2;
  const max=100;
  const percent=Math.max(0,Math.round(score/max*100));

  await saveResult(
    "competition",
    currentCompetition.title,
    percent,
    correct,
    20
  );

  const rankings=await getCompetitionRanking(currentCompetition.id);

  document.getElementById("content").innerHTML=`
  <div class="result">
    <div style="font-size:60px">🏆</div>
    <h2>نتیجه ${currentCompetition.title}</h2>
    <div class="score">${percent}%</div>
    <p>
      درست: ${correct} |
      غلط: ${wrong} |
      بدون پاسخ: ${unanswered}
    </p>
    <p class="muted">امتیاز: ${score} از 100</p>
  </div>

  <div class="card">
    <h3>🥇 رتبه‌بندی</h3>
    ${rankings.map((r,i)=>`
      <div class="rank">
        <div>
          <b>${i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1)}
          ${escapeHtml(r.name)}</b>
        </div>
        <strong>${r.score}%</strong>
      </div>
    `).join("")}
  </div>

  <button class="btn full" onclick="renderCompetition()">بازگشت به مسابقات</button>`;
}

async function getCompetitionRanking(id){
  const key="alinagheli_comp_"+id;
  const local=JSON.parse(localStorage.getItem(key)||"[]");

  local.push({
    name:`${currentStudent.first_name} ${currentStudent.last_name}`,
    score:Math.max(0,Number(
      JSON.parse(localStorage.getItem("alinagheli_records_"+currentUser.id)||"[]")
      .find(r=>r.type==="competition"&&r.title===currentCompetition.title)?.score||0
    )
  });

  const unique={};
  local.forEach(x=>{
    const k=x.name;
    if(!unique[k]||x.score>unique[k].score)unique[k]=x;
  });

  const arr=Object.values(unique)
    .sort((a,b)=>b.score-a.score)
    .slice(0,20);

  localStorage.setItem(key,JSON.stringify(arr));
  return arr;
}

/* =========================================================
   ADMIN
========================================================= */

function showAdmin(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("adminPage").classList.remove("hidden");

  renderAdmin();
}

async function renderAdmin(){
  document.getElementById("adminContent").innerHTML=
  `<div class="loading">در حال دریافت زبان‌آموزان...</div>`;

  let students=[];

  const {data,error}=await sb
    .from("students")
    .select("*")
    .order("created_at",{ascending:false});

  if(!error)students=data||[];

  const waiting=students.filter(s=>s.status==="waiting").length;
  const registered=students.filter(s=>s.status==="registered").length;
  const rejected=students.filter(s=>s.status==="rejected").length;

  document.getElementById("adminContent").innerHTML=`
  <div class="grid">
    <div class="card">
      <div style="font-size:30px">⏳</div>
      <h2>${waiting}</h2>
      <span class="muted">در انتظار تأیید</span>
    </div>
    <div class="card">
      <div style="font-size:30px">✅</div>
      <h2>${registered}</h2>
      <span class="muted">ثبت‌نام شده</span>
    </div>
    <div class="card">
      <div style="font-size:30px">❌</div>
      <h2>${rejected}</h2>
      <span class="muted">رد شده</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <h2>👥 مدیریت زبان‌آموزان</h2>
      <button class="btn secondary" onclick="renderAdmin()">🔄</button>
    </div>

    <div class="admin-table">
    <table>
      <thead>
        <tr>
          <th>نام</th>
          <th>موبایل</th>
          <th>پایه</th>
          <th>وضعیت</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody>
      ${students.length?students.map(s=>`
        <tr>
          <td>${escapeHtml((s.first_name||"")+" "+(s.last_name||""))}</td>
          <td dir="ltr">${escapeHtml(s.phone||"")}</td>
          <td>${escapeHtml(s.level||"")}</td>
          <td>
            <span class="status ${s.status}">
              ${s.status==="waiting"?"در انتظار":
                s.status==="registered"?"تأیید شده":"رد شده"}
            </span>
          </td>
          <td>
          ${s.status==="waiting"?`
            <button class="btn green" onclick="approveStudent('${s.id}')">✓ تأیید</button>
            <button class="btn red" onclick="rejectStudent('${s.id}')">✕ رد</button>
          `:
          s.status==="registered"?
          `<button class="btn red" onclick="rejectStudent('${s.id}')">رد</button>`:
          `<button class="btn green" onclick="approveStudent('${s.id}')">تأیید</button>`
          }
          </td>
        </tr>
      `).join(""):
      `<tr><td colspan="5" style="text-align:center">زبان‌آموزی وجود ندارد.</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>

  <div class="card">
    <h3>📚 محتوای آموزشی</h3>
    <p class="muted">
      Prospect 1، Prospect 2، Prospect 3، Vision 1، Vision 2 و Vision 3
      به تفکیک درس در سامانه فعال هستند.
    </p>
  </div>`;
}

async function approveStudent(id){
  if(!confirm("این زبان‌آموز تأیید شود؟"))return;

  const {error}=await sb
    .from("students")
    .update({status:"registered"})
    .eq("id",id);

  if(error){
    toast("خطا در تأیید: "+error.message);
    return;
  }

  toast("زبان‌آموز تأیید شد.");
  renderAdmin();
}

async function rejectStudent(id){
  if(!confirm("درخواست این زبان‌آموز رد شود؟"))return;

  const {error}=await sb
    .from("students")
    .update({status:"rejected"})
    .eq("id",id);

  if(error){
    toast("خطا در رد درخواست: "+error.message);
    return;
  }

  toast("درخواست رد شد.");
  renderAdmin();
}

  openModal(`

  <h2>👨‍💼 ورود مدیر</h2>

  <button class="btn full" onclick="loginAdminModal()">ورود به پنل مدیریت</button>
  `);

async function loginAdminModal(){
  const password=document.getElementById("adminPassword").value;
  if(!password){
    toast("رمز عبور را وارد کنید.");
    return;
  }

  const {data,error}=await sb.auth.signInWithPassword({
    email:ADMIN_EMAIL,
    password
  });

  if(error){
    toast("ورود مدیر ناموفق: "+error.message);
    return;
  }

  currentUser=data.user;
  closeModal();
  showAdmin();
}

/* =========================================================
   SESSION RESTORE
========================================================= */

async function restoreSession(){
  const {data}=await sb.auth.getSession();

  if(!data.session)return;

  currentUser=data.session.user;

  if((currentUser.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){
    showAdmin();
  }else{
    await loadStudent();
  }
}

sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==="SIGNED_OUT"){
    currentUser=null;
    currentStudent=null;
  }
});

/* =========================================================
   START
========================================================= */

restoreSession();
