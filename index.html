<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<style>
html,body{margin:0;padding:0;background:#f5f3ff;font-family:Tahoma,Arial,sans-serif}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#6d28d9;font-weight:bold;padding:20px}
</style>
</head>
<body>
<div id="boot">در حال آماده‌سازی AliNagheli English…</div>

<script>
(async()=>{
const ORIGINAL="https://raw.githubusercontent.com/alinagheli5000-spec/AliNagheliEnglish/9804b6ce02f322a1cc5f3401d9bafea9b9feb360/index.html";

try{

let src=await (await fetch(ORIGINAL,{cache:"no-store"})).text();

const replaceBlock=(startMarker,endMarker,replacement)=>{
 const s=src.indexOf(startMarker);
 if(s<0)return false;

 const e=src.indexOf(endMarker,s);
 if(e<0)return false;

 src=src.slice(0,s)+replacement+src.slice(e);
 return true;
};


/* =========================================================
   PLACEMENT TEST RESULT
========================================================= */

const placementStart=src.indexOf("async function placementFinish(){");
const placementEnd=src.indexOf(
 "async function placementAnswer",
 placementStart
);

if(placementStart>=0&&placementEnd>placementStart){

src=src.slice(0,placementStart)+`async function placementFinish(){

 const score=Number(S.quiz.correct||0);
 const total=Number(S.quiz.questions?.length||30);
 const wrong=Math.max(0,total-score);
 const percent=total?Math.round(score/total*100):0;

 let level;

 if(score<=7)level="A1";
 else if(score<=13)level="A2";
 else if(score<=19)level="B1";
 else if(score<=24)level="B2";
 else if(score<=28)level="C1";
 else level="C2";

 const levelText={
  A1:"مقدماتی — شروع مسیر یادگیری",
  A2:"مقدماتی رو به متوسط — توانایی‌های پایه",
  B1:"متوسط — توانایی ارتباط در موقعیت‌های روزمره",
  B2:"متوسط رو به بالا — توانایی ارتباط نسبتاً روان",
  C1:"پیشرفته — تسلط بالا بر زبان انگلیسی",
  C2:"تسلط بسیار پیشرفته — نزدیک به سطح بومی"
 }[level]||"";

 const el=document.getElementById("placementQuiz");

 if(S.student){

  try{

   await db.from("exam_results").insert({

    user_id:S.student.auth_user_id,

    student_name:\`\${S.student.first_name||""} \${S.student.last_name||""}\`,

    exam_type:"placement",

    exam_title:"آزمون تعیین سطح ۳۰ سؤالی",

    score,

    total,

    percentage:percent

   });

  }catch(e){}

 }

 if(!el)return;

 el.innerHTML=\`

 <div class="card resultBox placementResultCard">

  <div style="
   text-align:center;
   font-size:16px;
   color:#6d28d9;
   font-weight:bold
  ">
   🎉 نتیجه آزمون تعیین سطح
  </div>

  <div class="score">
   \${score}/\${total}
  </div>

  <div class="grid" style="margin:15px 0">

   <div class="item" style="text-align:center">

    <div class="icon" style="font-size:28px">
     ✅
    </div>

    <b>پاسخ درست</b>

    <h2 style="color:#166534;margin:6px 0">
     \${score}
    </h2>

   </div>


   <div class="item" style="text-align:center">

    <div class="icon" style="font-size:28px">
     ❌
    </div>

    <b>پاسخ غلط</b>

    <h2 style="color:#991b1b;margin:6px 0">
     \${wrong}
    </h2>

   </div>


   <div class="item" style="text-align:center">

    <div class="icon" style="font-size:28px">
     📊
    </div>

    <b>درصد</b>

    <h2 style="color:#6d28d9;margin:6px 0">
     \${percent}%
    </h2>

   </div>

  </div>


  <div style="
   text-align:center;
   background:#ede9fe;
   border-radius:20px;
   padding:18px;
   margin-top:12px
  ">

   <div style="
    font-size:13px;
    color:#5b21b6
   ">
    سطح پیشنهادی شما
   </div>

   <div style="
    font-size:42px;
    font-weight:900;
    color:#6d28d9;
    margin:4px 0
   ">
    \${level}
   </div>

   <b>
    \${levelText}
   </b>

  </div>


  <p style="
   text-align:center;
   line-height:2;
   margin:16px 0 8px
  ">
   این سطح بر اساس تعداد پاسخ‌های درست شما در آزمون تعیین سطح محاسبه شده است.
  </p>


  <button
   class="btn full"
   onclick="home()"
  >
   بازگشت به خانه
  </button>

 </div>

 \`;

}

`+src.slice(placementEnd);

}


/* =========================================================
   COURSES
========================================================= */

replaceBlock(
"function courses(){",
"function grade(g){",

`function courses(){

 render("دروس مدرسه",\`

 <div class="card">

  <h2>
   📚 کتاب‌های مدرسه
  </h2>

  <div class="grid">

   \${Object.keys(books).map(g=>\`

    <div
     class="item"
     onclick="grade(\${g})"
    >

     <div class="icon">
      📖
     </div>

     <h3>
      پایه \${g}
     </h3>

     <p class="muted">
      \${esc(books[g].title)}
     </p>

     <button class="btn full">
      مشاهده درس‌ها
     </button>

    </div>

   \`).join("")}

  </div>

 </div>


 <div class="card conversationUpdateCard">

  <div style="text-align:center">

   <div class="icon">
    🗣️
   </div>

   <h2>
    مکالمه
   </h2>

   <p class="muted">
    بخش آموزش مکالمه به‌زودی با محتوای کامل در دسترس خواهد بود.
   </p>

   <div
    class="notice"
    style="margin-top:12px"
   >
    🚧 در حال بروز رسانی
   </div>

  </div>

 </div>

 \`);

}

`

);


/* =========================================================
   HOME
========================================================= */

replaceBlock(
"function home(){",
"/* TEACHERS */",

`function home(){

 const xp=S.xp||0;

 const level=
 S.level||
 calculateLevel(xp);

 const base=
 xpForLevel(level);

 const next=
 xpForLevel(level+1);

 const percent=
 Math.min(
 100,
 Math.round(
  ((xp-base)/(next-base))*100
 )
 );


 render("خانه",\`

 <div class="hero hero3d homeHeroPlus">

  <div style="
   position:relative;
   z-index:2
  ">

   <div style="
    font-size:13px;
    opacity:.85;
    letter-spacing:1px
   ">
    WELCOME TO
   </div>


   <h1 style="
    font-size:34px;
    margin:8px 0
   ">
    AliNagheli English 🚀
   </h1>


   <h2>
    سلام
    \${esc(
     S.student?.first_name||
     "زبان‌آموز"
    )}
    👋
   </h2>


   <p style="
    font-size:15px;
    line-height:2
   ">
    یادگیری انگلیسی را حرفه‌ای،
    مرحله‌به‌مرحله و جذاب ادامه بده.
   </p>


   <div class="levelBar">

    <i
     style="width:\${percent}%"
    ></i>

   </div>


   <div style="
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    font-weight:bold
   ">

    <span>
     ⭐ \${xp} XP
    </span>

    <span>
     🏅 Level \${level}
    </span>

   </div>

  </div>

 </div>


 <div class="card homeWelcomeCard">

  <h2 style="margin-top:0">
   ✨ مسیر یادگیری تو
  </h2>

  <p class="muted">
   یکی از بخش‌های زیر را انتخاب کن
   و یادگیری را شروع کن.
  </p>

 </div>


 <div class="grid">


  <div class="item homeActionCard">

   <div class="icon">
    📚
   </div>

   <h3>
    دروس مدرسه
   </h3>

   <p class="muted">
    Prospect و Vision
   </p>

   <button
    class="btn full"
    onclick="courses()"
   >
    ورود به دروس
   </button>

  </div>


  <div class="item homeActionCard">

   <div class="icon">
    🎯
   </div>

   <h3>
    تعیین سطح
   </h3>

   <p class="muted">
    ۳۰ سؤال از آسان تا خیلی سخت
   </p>

   <button
    class="btn full"
    onclick="placementTest()"
   >
    شروع تعیین سطح
   </button>

  </div>


  <div class="item homeActionCard">

   <div class="icon">
    🗣️
   </div>

   <h3>
    مکالمه
   </h3>

   <p class="muted">
    Touchstone و Viewpoint
   </p>

   <button
    class="btn full"
    onclick="conversation()"
   >
    ورود به مکالمه
   </button>

  </div>


  <div class="item homeActionCard">

   <div class="icon">
    🏆
   </div>

   <h3>
    مسابقه
   </h3>

   <p class="muted">
    رقابت و کسب XP
   </p>

   <button
    class="btn full"
    onclick="contest()"
   >
    ورود به مسابقه
   </button>

  </div>


  <div class="item homeActionCard">

   <div class="icon">
    👨‍🏫
   </div>

   <h3>
    اساتید
   </h3>

   <p class="muted">
    رزرو کلاس با استاد
   </p>

   <button
    class="btn full"
    onclick="teachers()"
   >
    مشاهده اساتید
   </button>

  </div>


  <div class="item homeActionCard">

   <div class="icon">
    📊
   </div>

   <h3>
    پیشرفت من
   </h3>

   <p class="muted">
    درصد پیشرفت و سوابق آزمون
   </p>

   <button
    class="btn full"
    onclick="profile()"
   >
    مشاهده پیشرفت
   </button>

  </div>


 </div>

 \`);

}


/* TEACHERS */

`

);


/* =========================================================
   RESTORE ELAHE BAGHBANI IF NECESSARY
========================================================= */

if(!src.includes('name:"الهه باغبانی"')){

 const teacherMarker=
 "function teachers(){";

 const t=
 src.indexOf(teacherMarker);

 if(t>=0){

  src=
  src.slice(0,t)+`

const teachersData=[

 {
  name:"علی ناقلی",
  degree:"کارشناس ارشد آموزش زبان انگلیسی",
  phone:"09141892768",
  icon:"👨‍🏫",
  text:"با بیش از ۲۰ سال سابقه تدریس مکالمه زبان انگلیسی و مدرس دوره‌های TOEFL, IELTS, FCE, KET, PET, PTE, MCHE, MSRT و برگزارکننده دوره‌های حرفه‌ای TTC"
 },

 {
  name:"الهه باغبانی",
  degree:"کارشناس ارشد آموزش زبان انگلیسی",
  phone:"09914312534",
  icon:"👩‍🏫",
  text:"با بیش از ۱۰ سال سابقه تدریس مکالمه زبان انگلیسی و دوره‌های بین‌المللی TOEFL, IELTS, KET, PET, PTE, MSRT"
 }

];

`+
src.slice(t);

 }

}


/* =========================================================
   VISUAL IMPROVEMENTS
========================================================= */

src=
src.replace(
"</style>",

`.conversationUpdateCard{
 border:2px dashed #c4b5fd;
 background:linear-gradient(
  135deg,
  #fff,
  #faf5ff
 );
}

.homeWelcomeCard{
 background:linear-gradient(
  135deg,
  #fff,
  #faf5ff
 );
 border:1px solid #e9d5ff;
}

.homeActionCard{
 transition:
  transform .2s,
  box-shadow .2s;
}

.homeActionCard:hover{
 transform:translateY(-5px);
 box-shadow:
  0 14px 30px #6d28d933;
}

.homeHeroPlus{
 box-shadow:
  0 18px 40px #6d28d955;
}

.placementResultCard{
 overflow:hidden;
}

</style>`
);


/* =========================================================
   LOAD FINAL APPLICATION
========================================================= */

document.open();

document.write(src);

document.close();

}catch(e){

 document.getElementById("boot").innerHTML=
 `
 خطا در بارگذاری برنامه.
 <br>
 <small>
 لطفاً اتصال اینترنت را بررسی کنید.
 </small>
 `;

}

})();
</script>

</body>
</html>
```0
