<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>

:root{
    --primary:#4f46e5;
    --primary2:#7c3aed;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#6b7280;
    --border:#e5e7eb;
    --green:#16a34a;
    --red:#dc2626;
    --orange:#f59e0b;
    --blue:#2563eb;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.wrap{
    max-width:1100px;
    margin:auto;
    padding:18px 12px 100px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 8px 28px rgba(15,23,42,.06);
}

.top{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(17,24,39,.96);
    color:#fff;
    padding:14px 15px;
    backdrop-filter:blur(12px);
}

.topin{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.top-title{
    font-size:18px;
    font-weight:bold;
}

.top-sub{
    font-size:10px;
    color:#cbd5e1;
    margin-top:4px;
}

.btn{
    border:0;
    border-radius:13px;
    padding:12px 15px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    font-weight:bold;
}

.btn.secondary{
    background:#eef2ff;
    color:#4338ca;
}

.btn.ok{
    background:#dcfce7;
    color:#166534;
}

.btn.danger{
    background:#fee2e2;
    color:#991b1b;
}

.btn.small{
    padding:8px 10px;
    font-size:11px;
}

.full{
    width:100%;
}

label{
    display:block;
    margin:9px 0 5px;
    font-size:13px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    border:1px solid var(--border);
    background:#fff;
    border-radius:13px;
    padding:12px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px #4f46e51c;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.row>*{
    flex:1;
    min-width:150px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:11px;
}

.stat{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:17px;
    padding:14px;
}

.stat b{
    display:block;
    font-size:23px;
    margin-top:5px;
    color:var(--primary);
}

.muted{
    color:var(--muted);
    font-size:12px;
    line-height:1.8;
}

.notice{
    padding:12px;
    border-radius:13px;
    margin-bottom:12px;
}

.err{
    background:#fee2e2;
    color:#991b1b;
}

.okmsg{
    background:#dcfce7;
    color:#166534;
}

.login{
    max-width:450px;
    margin:35px auto;
}

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
    radial-gradient(circle at 10% 10%,#818cf8 0,#6366f1 25%,transparent 45%),
    radial-gradient(circle at 90% 90%,#c084fc 0,#8b5cf6 25%,transparent 45%),
    linear-gradient(135deg,#111827,#312e81);
}

.login-card{
    width:min(450px,100%);
    background:rgba(255,255,255,.97);

    padding:28px 22px;

}

.logo{
    width:78px;

    border-radius:24px;
    margin:auto;
    display:grid;
    place-items:center;
    color:#fff;
    font-size:27px;
    font-weight:bold;
    background:linear-gradient(135deg,#4f46e5,#9333ea);
    box-shadow:0 15px 35px #4f46e555;
}

.login-title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:14px;
}

.login-sub{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    margin:8px 0 22px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.tab{
    flex:1;
    border:0;
    border-radius:14px;
    padding:12px;
    background:#f1f5f9;
    color:#64748b;
    font-weight:bold;
}

.tab.active{
    background:#eef2ff;
    color:#4338ca;
}

.hero{
    border-radius:25px;
    padding:22px;
    color:#fff;
    margin-bottom:15px;
    background:
    linear-gradient(135deg,#111827,#312e81 55%,#7c3aed);
    box-shadow:0 15px 35px #312e8140;
}

.hero h2{
    margin:0 0 7px;
}

.hero p{
    margin:0;
    color:#ddd6fe;
    font-size:12px;
    line-height:1.9;
}

.course-card{
    position:relative;
    overflow:hidden;
    min-height:155px;
    border-radius:22px;
    padding:18px;
    background:#fff;
    border:1px solid var(--border);
    box-shadow:0 8px 22px rgba(15,23,42,.06);
    cursor:pointer;
    transition:.2s;
}

.course-card:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(15,23,42,.1);
}

.course-number{
    font-size:31px;
    font-weight:bold;
    color:var(--primary);
}

.course-card h3{
    margin:7px 0;
}

.badge{
    display:inline-block;
    border-radius:999px;
    padding:5px 9px;
    font-size:10px;
    font-weight:bold;
}

.waiting{
    background:#fff7ed;
    color:#9a3412;
}

.registered{
    background:#dcfce7;
    color:#166534;
}

.rejected{
    background:#fee2e2;
    color:#991b1b;
}

.graduate{
    background:#ede9fe;
    color:#5b21b6;
}

.student{
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    margin:9px 0;
}

.head{
    display:flex;
    justify-content:space-between;

}

.actions{
    display:flex;
    flex-wrap:wrap;

}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:60;
    background:rgba(255,255,255,.97);

}

.navin{
    max-width:700px;
    margin:auto;
    display:flex;
}

.navin button{
    flex:1;
    border:0;
    background:white;
    padding:10px 5px;
    color:#64748b;
    font-size:11px;
}

.navin button.active{
    color:var(--primary);
    font-weight:bold;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0 12px;
}

.lesson-tabs{
    display:flex;
    gap:7px;
    margin-bottom:14px;
}

.lesson-tab{
    flex:1;
    border:0;
    border-radius:13px;
    padding:12px 5px;
    background:#e5e7eb;
    color:#374151;
}

.lesson-tab.active{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
}

.lesson{
    display:none;
}

.lesson.active{
    display:block;
}

.grammar-box{
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:15px;
    margin-bottom:10px;
    background:#fff;
}

.example{
    direction:ltr;
    text-align:left;
    margin-top:9px;
    background:#f8fafc;
    padding:11px;
    border-radius:11px;
    font-family:Arial,sans-serif;
    color:#312e81;
}

.vocab-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:9px;
}

.word{
    border:1px solid #e0e7ff;
    background:#f8faff;
    border-radius:15px;
    padding:12px 8px;
    text-align:center;
    cursor:pointer;
    transition:.18s;
}

.word:hover{
    background:#eef2ff;
    transform:translateY(-1px);
}

.word-en{
    display:block;
    direction:ltr;
    font-weight:bold;
    color:#4338ca;
}

.word-fa{
    display:block;
    margin-top:5px;
    color:#64748b;
    font-size:11px;
}

.word-hint{
    display:block;
    margin-top:6px;
    font-size:9px;
    color:#94a3b8;
}

.quiz-card{
    border-radius:22px;
    padding:18px;
    background:white;
    border:1px solid var(--border);
}

.quiz-progress{
    height:9px;
    background:#e5e7eb;
    border-radius:99px;
    overflow:hidden;
    margin:10px 0 18px;
}

.quiz-progress div{
    height:100%;
    background:linear-gradient(90deg,#4f46e5,#a855f7);
    transition:.3s;
}

.quiz-question{
    font-size:18px;
    font-weight:bold;
    line-height:1.9;
    margin-bottom:16px;
}

.quiz-option{
    width:100%;
    text-align:right;
    border:1px solid #e5e7eb;
    background:#fff;
    padding:13px;
    border-radius:14px;
    margin:8px 0;
    transition:.15s;
}

.quiz-option:hover{
    background:#f8fafc;
}

.quiz-option.correct{
    background:#dcfce7;
    border-color:#22c55e;
    color:#166534;
}

.quiz-option.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    color:#991b1b;
}

.quiz-option.disabled{
    pointer-events:none;
}

.feedback{
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    margin:12px 0;
    font-weight:bold;
    font-size:15px;
}

.feedback.correct{
    background:#dcfce7;
    color:#166534;
}

.feedback.wrong{
    background:#fee2e2;
    color:#991b1b;
}

.feedback-icon{
    font-size:32px;
    margin-left:8px;
}

@keyframes happy{
    0%{transform:scale(.4) rotate(-10deg);opacity:0}
    60%{transform:scale(1.2) rotate(5deg);opacity:1}
    100%{transform:scale(1)}
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}
}

.happy{
    animation:happy .45s ease;
}

.shake{
    animation:shake .35s ease;
}

.quiz-overlay{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    width:min(310px,90%);
    display:none;
    padding:18px;
    text-align:center;
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    font-weight:bold;
}

.quiz-overlay.show{
    display:block;
}

.quiz-overlay.correct{
    background:#dcfce7;
    color:#166534;
}

.quiz-overlay.wrong{
    background:#fee2e2;
    color:#991b1b;
}

.overlay-icon{
    display:block;
    font-size:55px;
    margin-bottom:5px;
}

.history-table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

.history-table th,
.history-table td{
    padding:11px 7px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
}

.history-table th{
    background:#f8fafc;
}

.score-good{
    color:#16a34a;
    font-weight:bold;
}

.score-mid{
    color:#d97706;
    font-weight:bold;
}

.score-low{
    color:#dc2626;
    font-weight:bold;
}

.rank-table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

.rank-table th,
.rank-table td{
    padding:11px 7px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
}

.rank-1{
    font-size:18px;
}

.rank-2{
    font-size:17px;
}

.rank-3{
    font-size:16px;
}

.result-big{
    text-align:center;
    padding:25px 10px;
}

.result-big strong{
    display:block;
    font-size:48px;
    color:var(--primary);
}

.empty{
    text-align:center;
    padding:25px 10px;
    color:#94a3b8;
    line-height:2;
}

@media(max-width:500px){

    .wrap{
        padding:12px 9px 95px;
    }

    .login{
        margin:15px auto;
    }

    .course-card{
        min-height:140px;
    }

    .quiz-question{
        font-size:16px;
    }

    .history-table,
    .rank-table{
        font-size:10px;
    }

}

</style>

</head>

<div id="app"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const URL =
'https://kapzyedzjecnfxevjisq.supabase.co';

const KEY =
'sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ';

const db =
supabase.createClient(URL,KEY);


/* =========================================================
   GLOBAL STATE
========================================================= */

let user = null;
let isAdmin = false;
let me = null;
let students = [];
let courses = [];

let currentCourse = null;

let currentQuiz = [];
let currentQuizIndex = 0;
let currentQuizScore = 0;
let currentQuizAnswered = false;
let currentQuizType = '';

let examHistory = [];

let exam100Questions = [];
let exam100Index = 0;
let exam100Score = 0;
let exam100Answered = false;


/* =========================================================
   HELPERS
========================================================= */

const esc = x =>
String(x ?? '')
.replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
}[m]));


function emailFor(phone){

    return String(phone || '')
    .replace(/\D/g,'')
    + '@alinagheli.com';

}


function msg(text,type='okmsg'){

    const old =
    document.querySelector('.notice');

    if(old) old.remove();

    const x =
    document.createElement('div');

    x.className =
    'notice '+type;

    x.textContent =
    text;

    document.querySelector('.wrap')
    ?.prepend(x);

    setTimeout(()=>{
        x.remove();
    },5000);

}


function statusBadge(status){

    if(status === 'registered'){
        return '<span class="badge registered">ثبت‌نام شده</span>';
    }

    if(status === 'rejected'){
        return '<span class="badge rejected">رد شده</span>';
    }

    if(status === 'graduate'){
        return '<span class="badge graduate">فارغ‌التحصیل</span>';
    }

    return '<span class="badge waiting">در صف انتظار</span>';

}


function scoreClass(score){

    if(score >= 80)
        return 'score-good';

    if(score >= 50)
        return 'score-mid';

    return 'score-low';

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

    document.body.innerHTML = `

    <div class="login-page">

        <div class="login-card">

            <div class="logo">AN</div>

            <div class="login-title">
                AliNagheli English
            </div>

            <div class="login-sub">
                سامانه آموزش زبان انگلیسی
            </div>

            <div class="tabs">

                <button
                    class="tab active"
                    id="ts"
                    onclick="loginForm(0)">
                    🎓 دانش‌آموز
                </button>

                <button
                    class="tab"
                    id="ta"
                    onclick="loginForm(1)">
                    👨‍🏫 مدیر
                </button>

            </div>

            <div id="lf"></div>

        </div>

    </div>

    `;

    loginForm(0);

}


function loginForm(mode){

    const ts =
    document.getElementById('ts');

    const ta =
    document.getElementById('ta');

    if(!ts || !ta)return;

    ts.classList.toggle(
        'active',
        mode===0
    );

    ta.classList.toggle(
        'active',
        mode===1
    );

    const lf =
    document.getElementById('lf');

    if(mode===1){

        lf.innerHTML = `

        <label>ایمیل مدیر</label>

        <input
            id="email"
            type="email"
            placeholder="ایمیل مدیر">

        <label>رمز عبور</label>

        <input
            id="pass"
            type="password"
            placeholder="رمز عبور">

        <button
            class="btn full"
            style="margin-top:12px"
            onclick="adminLogin()">

            ورود مدیر

        </button>

        `;

    }else{

        lf.innerHTML = `

        <label>شماره تلفن</label>

        <input
            id="phone"
            inputmode="tel"
            placeholder="مثلاً 0914xxxxxxx">

        <label>رمز عبور</label>

        <input
            id="pass"
            type="password"
            placeholder="رمز عبور">

        <button
            class="btn full"
            style="margin-top:12px"
            onclick="studentLogin()">

            ورود دانش‌آموز

        </button>

        <button
            class="btn secondary full"
            style="margin-top:8px"
            onclick="registerForm()">

            ثبت‌نام دانش‌آموز جدید

        </button>

        `;

    }

}


/* =========================================================
   ADMIN LOGIN
========================================================= */

async function adminLogin(){

    const email =
    document.getElementById('email')?.value.trim();

    const password =
    document.getElementById('pass')?.value;

    if(!email || !password){

        alert('ایمیل و رمز عبور را وارد کنید.');

        return;

    }

    const r =
    await db.auth.signInWithPassword({
        email,
        password
    });

    if(r.error){

        alert(
            r.error.message ||
            'ایمیل یا رمز عبور نادرست است.'
        );

        return;

    }

    user =
    r.data.user;

    await identify();

}


/* =========================================================
   STUDENT LOGIN
========================================================= */

async function studentLogin(){

    const phone =
    document.getElementById('phone')?.value.trim();

    const password =
    document.getElementById('pass')?.value;

    if(!phone || !password){

        alert(
            'شماره تلفن و رمز عبور را وارد کنید.'
        );

        return;

    }

    const r =
    await db.auth.signInWithPassword({

        email:emailFor(phone),

        password:password

    });

    if(r.error){

        alert(
            'شماره تلفن یا رمز عبور نادرست است.'
        );

        return;

    }

    user =
    r.data.user;

    await identify();

}


/* =========================================================
   REGISTER
========================================================= */

async function registerForm(){

    const lf =
    document.getElementById('lf');

    if(!lf)return;

    lf.innerHTML = `

    <h3>
        ثبت‌نام دانش‌آموز
    </h3>

    <div class="row">

        <div>
            <label>نام</label>
            <input id="rf">
        </div>

        <div>
            <label>نام خانوادگی</label>
            <input id="rl">
        </div>

    </div>

    <div class="row">

        <div>
            <label>شماره تلفن</label>
            <input id="rp" inputmode="tel">
        </div>

        <div>
            <label>رمز عبور</label>
            <input id="rw" type="password">
        </div>

    </div>

    <label>پایه / سطح</label>

    <input
        id="rv"
        placeholder="مثلاً هفتم یا A1">

    <button
        class="btn full"
        style="margin-top:10px"
        onclick="register()">

        ثبت‌نام

    </button>

    <button
        class="btn secondary full"
        style="margin-top:8px"
        onclick="login()">

        بازگشت

    </button>

    `;

}


async function register(){

    const f =
    document.getElementById('rf').value.trim();

    const l =
    document.getElementById('rl').value.trim();

    const p =
    document.getElementById('rp').value.trim();

    const pw =
    document.getElementById('rw').value;

    const level =
    document.getElementById('rv').value.trim();

    if(!f || !l || !p || !pw){

        alert(
            'موارد الزامی را کامل کنید.'
        );

        return;

    }

    if(pw.length < 6){

        alert(
            'رمز عبور باید حداقل ۶ کاراکتر باشد.'
        );

        return;

    }

    const r =
    await db.auth.signUp({

        email:emailFor(p),

        password:pw

    });

    if(r.error){

        alert(r.error.message);

        return;

    }

    if(!r.data.user){

        alert('حساب ساخته نشد.');

        return;

    }

    const ins =
    await db
    .from('students')
    .insert({

        first_name:f,
        last_name:l,
        phone:p,
        level:level || null,
        status:'waiting',
        auth_user_id:r.data.user.id,
        password_created:true

    });

    if(ins.error){

        alert(
            'حساب ساخته شد ولی اطلاعات دانش‌آموز ثبت نشد:\n'+
            ins.error.message
        );

        return;

    }

    alert(
        'ثبت‌نام با موفقیت انجام شد و در صف انتظار قرار گرفت. ✅'
    );

    await db.auth.signOut();

    login();

}


/* =========================================================
   IDENTIFY
========================================================= */

async function identify(){

    if(!user){

        login();

        return;

    }

    const adminResult =
    await db
    .from('admins')
    .select('id')
    .eq('user_id',user.id)
    .maybeSingle();

    isAdmin =
    !!adminResult.data;

    if(isAdmin){

        await adminData();

        appAdmin();

        return;

    }

    const studentResult =
    await db
    .from('students')
    .select('*')
    .eq('auth_user_id',user.id)
    .maybeSingle();

    if(studentResult.error){

        alert(
            'خطا در دریافت اطلاعات دانش‌آموز:\n'+
            studentResult.error.message
        );

        await db.auth.signOut();

        return;

    }

    me =
    studentResult.data;

    if(!me){

        alert(
            'پروفایل دانش‌آموز پیدا نشد.'
        );

        await db.auth.signOut();

        return;

    }

    appStudent();

}

    const a =
    await db

    a.data || [];

    const c =
    await db

    .select('*')
    .order('id');

    courses =
    c.data || [];

}

function speechSafe(text){

    return String(text)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");

}


function showLessonTab(name,button){

    document.querySelectorAll('.lesson')
    .forEach(x=>x.classList.remove('active'));

    document.querySelectorAll('.lesson-tab')
    .forEach(x=>x.classList.remove('active'));

    document.getElementById(
        name+'Tab'
    )?.classList.add('active');

    button.classList.add('active');

}


/* =========================================================
   SPEECH
========================================================= */

function speakWord(word){

    if(!('speechSynthesis' in window)){

        alert(
            'مرورگر دستگاه شما قابلیت پخش تلفظ را ندارد.'
        );

        return;

    }

    try{

        window.speechSynthesis.cancel();

        const u =
        new SpeechSynthesisUtterance(word);

        u.lang = 'en-US';

        u.rate = .82;

        u.pitch = 1;

        window.speechSynthesis.speak(u);

    }catch(e){

        console.error(e);

    }

}

========================================================= */

function startLessonExam(id){

    const data =
    lessons[id];

    if(!data)return;

    currentQuiz =
    data.questions.map(q=>({
        q:q[0],
        options:q[1],
        answer:q[2]
    }));

    currentQuiz =
    shuffleArray(
        currentQuiz
    );

    currentQuizIndex = 0;
    currentQuizScore = 0;
    currentQuizAnswered = false;
    currentQuizType =
    'lesson_'+id;

    renderLessonQuiz();

}


function renderLessonQuiz(){

    const box =
    document.getElementById(
        'studentContent'
    );

    if(!box)return;

    if(currentQuizIndex >= currentQuiz.length){

        finishLessonQuiz();

        return;

    }

    const item =
    currentQuiz[currentQuizIndex];

    const percent =
    Math.round(
        (currentQuizIndex /
        currentQuiz.length)*100
    );

    box.innerHTML = `

    <div class="card">

        <button
            class="btn secondary small"
            onclick="openCourse('${currentCourse}')">

            ← خروج از آزمون

        </button>

    </div>

    <div class="quiz-card">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px">

            <strong>
                آزمون درس ${currentCourse}
            </strong>

            <span class="muted">
                سؤال ${currentQuizIndex+1}
                از
                ${currentQuiz.length}
            </span>

        </div>

        <div class="quiz-progress">

            <div
                style="width:${percent}%">
            </div>

        </div>

        <div class="quiz-question">
            ${esc(item.q)}
        </div>

        <div id="quizOptions">

            ${item.options.map((o,i)=>`

                <button
                    class="quiz-option"
                    onclick="answerLessonQuestion(${i})">

                    ${esc(o)}

                </button>

            `).join('')}

        </div>

        <div id="questionFeedback"></div>

        <button
            id="nextQuizBtn"
            class="btn full hidden"
            onclick="nextLessonQuestion()">

            سؤال بعدی →

        </button>

    </div>

    `;

}


function answerLessonQuestion(index){

    if(currentQuizAnswered)return;

    currentQuizAnswered = true;

    const item =
    currentQuiz[currentQuizIndex];

    const buttons =
    document.querySelectorAll(
        '.quiz-option'
    );

    buttons.forEach(
        b=>b.classList.add('disabled')
    );

    if(index === item.answer){

        currentQuizScore++;

        buttons[index]
        .classList.add('correct');

        showQuizOverlay(
            true,
            'آفرین! پاسخ درست است 🎉'
        );

        document.getElementById(
            'questionFeedback'
        ).innerHTML = `

        <div class="feedback correct happy">

            <span class="feedback-icon">
                ✓
            </span>

            پاسخ کاملاً درست بود! 🌟

        </div>

        `;

    }else{

        buttons[index]
        .classList.add('wrong');

        if(buttons[item.answer])
            buttons[item.answer]
            .classList.add('correct');

        showQuizOverlay(
            false,
            'پاسخ درست نبود'
        );

        document.getElementById(
            'questionFeedback'
        ).innerHTML = `

        <div class="feedback wrong shake">

            <span class="feedback-icon">
                ✕
            </span>

            پاسخ نادرست بود.
            پاسخ صحیح مشخص شده است.

        </div>

        `;

    }

    document.getElementById(
        'nextQuizBtn'
    )?.classList.remove('hidden');

}


function nextLessonQuestion(){

    currentQuizIndex++;

    currentQuizAnswered = false;

    renderLessonQuiz();

}


async function finishLessonQuiz(){

    const total =
    currentQuiz.length;

    const score =
    Math.round(
        (currentQuizScore/total)*100
    );

    await saveExamAttempt(
        currentCourse,
        'lesson',
        score,
        currentQuizScore,
        total
    );

    const box =
    document.getElementById(
        'studentContent'
    );

    if(!box)return;

    box.innerHTML = `

    <div class="card result-big">

        <h2>
            🎉 آزمون تمام شد
        </h2>

        <strong>
            ${score}%
        </strong>

        <p class="muted">
            ${currentQuizScore}
            پاسخ صحیح از
            ${total}
            سؤال
        </p>

        <button
            class="btn full"
            onclick="startLessonExam('${currentCourse}')">

        </button>

        <button
            class="btn secondary full"

        </button>

}

/* =========================================================
   FINAL 100 QUESTIONS
========================================================= */

function buildFinalExam(){

    let pool = [];

    Object.keys(lessons).forEach(id=>{

        const lesson =
        lessons[id];

        lesson.questions.forEach(q=>{

            pool.push({

                lesson:id,

                q:q[0],

                options:q[1],

                answer:q[2],

                type:'grammar'

            });

        });

        lesson.vocab.forEach(v=>{

            pool.push({

                lesson:id,

                q:
                `معنی کلمه "${v[0]}" چیست؟`,

                options:
                makeVocabOptions(
                    v,
                    lesson.vocab
                ),

                answer:0,

                type:'vocab'

            });

        });

    });

    /*
      برای آزمون 100 سؤال، ابتدا سؤالات را مخلوط
      می‌کنیم و سپس 100 مورد انتخاب می‌کنیم.
    */

    pool =
    shuffleArray(pool);

    let result = [];

    const used = new Set();

    for(const q of pool){

        const key =
        q.lesson+'|'+q.q;

        if(used.has(key))
            continue;

        used.add(key);

        result.push(q);

        if(result.length >= 100)
            break;

    }

    /*
      در صورت کم بودن pool، از سؤال‌های موجود
      دوباره استفاده نمی‌کنیم؛ pool فعلی بیش از
      100 سؤال دارد.
    */

    return result;

}


function makeVocabOptions(item,vocab){

    const correct =
    item[1];

    const alternatives =
    shuffleArray(
        vocab
        .filter(v=>v[0]!==item[0])
        .map(v=>v[1])
    )
    .slice(0,2);

    return [
        correct,
        ...alternatives
    ];

}


/*
  چون پاسخ صحیح makeVocabOptions همیشه
  گزینه اول است، پس بعد از shuffle گزینه‌ها
  را دوباره با حفظ answer=0 مخلوط نمی‌کنیم.
*/


function startFinalExam(){

    exam100Questions =
    buildFinalExam();

    exam100Index = 0;

    exam100Score = 0;

    exam100Answered = false;

    renderFinalExam();

}


function renderFinalExam(){

    const box =
    document.getElementById(
        'studentContent'
    );

    if(!box)return;

    if(exam100Index >= exam100Questions.length){

        finishFinalExam();

        return;

    }

    const item =
    exam100Questions[exam100Index];

    const percent =
    Math.round(
        (exam100Index /
        exam100Questions.length)*100
    );

    box.innerHTML = `

    <div class="card">

        <button
            class="btn secondary small"
            onclick="coursesPage()">

function answerFinalQuestion(index){

    if(exam100Answered)return;

    exam100Answered = true;

    const item =
    exam100Questions[exam100Index];

    const buttons =
    document.querySelectorAll(
        '#finalOptions .quiz-option'
    );

    buttons.forEach(
        b=>b.classList.add('disabled')
    );

    if(index === item.answer){

        exam100Score++;

        buttons[index]
        .classList.add('correct');

        showQuizOverlay(
            true,
            'آفرین! پاسخ درست است 🎉'
        );

        document.getElementById(
            'finalFeedback'
        ).innerHTML = `

        <div class="feedback correct happy">

            <span class="feedback-icon">
                ✓
            </span>

            عالی بود! پاسخ درست است 🌟

        </div>

        `;

    }else{

        buttons[index]
        .classList.add('wrong');

        if(buttons[item.answer])
            buttons[item.answer]
            .classList.add('correct');

        showQuizOverlay(
            false,
            'پاسخ نادرست بود'
        );

        document.getElementById(
            'finalFeedback'
        ).innerHTML = `

        <div class="feedback wrong shake">

            <span class="feedback-icon">
                ✕
            </span>

            پاسخ اشتباه بود.

        </div>

        `;

    }

    document.getElementById(
        'finalNext'
    )?.classList.remove('hidden');

}


function nextFinalQuestion(){

    exam100Index++;

    exam100Answered = false;

    renderFinalExam();

}

async function finalLeaderboard(){

    const box =
    document.getElementById(
        'studentContent'
    );

    if(!box)return;

    box.innerHTML = `

    <div class="section-title">

        <h2>
            🏆 رکورد آزمون جامع
        </h2>

    </div>

    <div class="card">

        <div class="empty">
            در حال دریافت رکوردها...
        </div>

    </div>

    `;

    const r =
    await db
    .from('exam_attempts')
    .select(`
        id,
        student_id,
        score,
        correct_answers,
        total_questions,
        created_at,
        students(
            first_name,
            last_name
        )
    `)
    .eq('exam_type','final')
    .order('score',{
        ascending:false
    })
    .order('created_at',{
        ascending:true
    });

    if(r.error){

        box.innerHTML = `

        <div class="card">

            <div class="empty">

                خطا در دریافت رکوردها:<br>

                ${esc(r.error.message)}

            </div>

        </div>

        `;

        return;

    }

    const rows =
    r.data || [];

    /*
      فقط بهترین رکورد هر دانش‌آموز
    */

    const bestMap =
    new Map();

    rows.forEach(x=>{

        const old =
        bestMap.get(
            x.student_id
        );

        if(
            !old ||
            x.score > old.score
        ){

            bestMap.set(
                x.student_id,
                x
            );

        }

    });

    const best =
    Array.from(
        bestMap.values()
    )
    .sort(
        (a,b)=>b.score-a.score
    );

    const myRank =
    best.findIndex(
        x=>x.student_id===me.id
    ) + 1;

    box.innerHTML = `

    <div class="card">

        <div class="result-big">

            <p>
                بهترین رکورد شما
            </p>

            <strong>
                ${
                    best.find(
                        x=>x.student_id===me.id
                    )?.score || 0
                }%
            </strong>

            ${
                myRank
                ?
                `<p class="muted">
                    رتبه شما در میان
                    ${best.length}
                    نفر:
                    <strong style="font-size:18px">
                        ${myRank}
                    </strong>
                </p>`
                :
                ''
            }

        </div>

    </div>

    <div class="card">

        <h3>
            جدول رکوردها
        </h3>

        ${
            best.length
            ?
            `

            <div style="overflow-x:auto">

                <table class="rank-table">

                    <thead>

                        <tr>

                            <th>
                                رتبه
                            </th>

                            <th>
                                دانش‌آموز
                            </th>

                            <th>
                                رکورد
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        ${best.map((x,i)=>`

                            <tr>

                                <td class="${
                                    i===0
                                    ? 'rank-1'
                                    : i===1
                                    ? 'rank-2'
                                    : i===2
                                    ? 'rank-3'
                                    : ''
                                }">

                                    ${
                                        i===0
                                        ? '🥇'
                                        : i===1
                                        ? '🥈'
                                        : i===2
                                        ? '🥉'
                                        : i+1
                                    }

                                </td>

                                <td>

                                    ${
                                        esc(
                                            (x.students?.first_name||'')
                                            +' '+
                                            (x.students?.last_name||'')
                                        )
                                    }

                                    ${
                                        x.student_id===me.id
                                        ? ' ⭐'
                                        : ''
                                    }

                                </td>

                                <td
                                    class="${scoreClass(x.score)}">

                                    ${x.score}%

                                </td>

                            </tr>

                        `).join('')}

                    </tbody>

                </table>

            </div>

            `
            :
            `<div class="empty">
                هنوز رکوردی ثبت نشده است.
            </div>`
        }

    </div>

    <button
        class="btn secondary full"
        onclick="coursesPage()">

        ← بازگشت

    </button>

    `;

}

async function loadHomeExamStats(){

    if(!me?.id)return;

    const r =
    await db
    .from('exam_attempts')

    .eq('student_id',me.id);

    if(r.error)return;

    const rows =
    r.data || [];

    const homeCount =
    document.getElementById(
        'homeExamCount'
    );

    const homeBest =
    document.getElementById(
        'homeBestScore'
    );

    if(homeCount)
        homeCount.textContent =
        rows.length;

    if(homeBest){

        const finalRows =
        rows.filter(
            x=>x.exam_type==='final'
        );

        const best =
        finalRows.length
        ?
        Math.max(
            ...finalRows.map(x=>x.score)
        )
        :
        0;

        homeBest.textContent =
        best+'%';

    }

}

/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array){

    const a =
    [...array];

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j =
        Math.floor(
            Math.random()*(i+1)
        );

        [
            a[i],
            a[j]
        ] =
        [
            a[j],
            a[i]
        ];

    }

    return a;

}
