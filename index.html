<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f3ff;
color:#17121f;
padding-bottom:90px
}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{max-width:1100px;margin:auto;padding:16px}

.header{
background:linear-gradient(135deg,#6d28d9,#9333ea);
color:#fff;padding:22px;
border-radius:0 0 28px 28px
}
.header h1{margin:0;font-size:28px}
.header p{margin-bottom:0}

.card{
background:#fff;
border-radius:22px;
padding:20px;
margin:14px 0;
box-shadow:0 8px 30px #0001
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px
}

.btn{
border:0;
border-radius:15px;
padding:13px 18px;
background:#6d28d9;
color:white;
font-weight:bold;
margin:4px
}
.secondary{background:#ede9fe;color:#5b21b6}
.danger{background:#dc2626}
.success{background:#16a34a}

.course{
border:0;
padding:20px;
min-height:145px;
border-radius:24px;
background:linear-gradient(145deg,#fff,#f3e8ff);
box-shadow:0 8px 25px #0001;
font-weight:bold;
font-size:17px;
color:#4c1d95;
transition:.2s
}
.course:hover{transform:translateY(-3px)}
.course .icon{
font-size:42px;
display:block;
margin-bottom:10px
}

.lesson{
padding:18px;
border-radius:20px;
background:#faf5ff;
border:1px solid #e9d5ff;
margin:12px 0
}
.lesson h3{margin-top:0;color:#5b21b6}

.word{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:12px;
background:white;
border-radius:14px;
margin:7px 0;
box-shadow:0 3px 12px #0001
}
.word strong{
direction:ltr;
display:inline-block
}

.pronounce{
border:0;
background:#ede9fe;
color:#6d28d9;
border-radius:12px;
padding:9px 13px;
font-size:20px;
min-width:48px
}
.pronounce:active{transform:scale(.92)}

.option{
display:block;
width:100%;
text-align:right;
padding:13px;
margin:8px 0;
border:2px solid #e5e7eb;
border-radius:14px;
background:white;
font-size:15px
}
.option.correct{
background:#dcfce7;
border-color:#16a34a;
color:#166534
}
.option.wrong{
background:#fee2e2;
border-color:#dc2626;
color:#991b1b
}
.option:disabled{cursor:default}

.result{
padding:18px;
border-radius:18px;
background:#f3e8ff;
text-align:center;
font-size:21px;
font-weight:bold
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
gap:5px;
padding:8px;
box-shadow:0 -5px 20px #0002;
z-index:999
}
.nav button{
flex:1;
border:0;
background:white;
padding:10px 4px;
border-radius:12px;
font-size:12px
}
.nav button.active{
background:#ede9fe;
color:#6d28d9;
font-weight:bold
}

input,select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:13px;
margin:6px 0;
background:#fff
}

.teacher{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px
}

.teacherBox{
background:linear-gradient(145deg,#fff,#faf5ff);
border:1px solid #e9d5ff;
border-radius:22px;
padding:20px
}

.phone{
display:inline-block;
direction:ltr;
color:#6d28d9;
font-weight:bold;
text-decoration:none;
margin-top:10px
}

.rank{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px;
margin:7px 0;
background:#faf5ff;
border-radius:13px
}

.badge{
display:inline-block;
padding:6px 10px;
border-radius:20px;
background:#ede9fe;
color:#5b21b6;
margin:3px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}
.stat{
padding:15px;
border-radius:17px;
background:#faf5ff;
text-align:center
}
.stat b{
display:block;
font-size:23px;
color:#6d28d9
}

#competition{
position:fixed;
inset:0;
background:#f5f3ff;
z-index:2000;
overflow:auto
}

#toast{
position:fixed;
bottom:100px;
left:50%;
transform:translateX(-50%);
background:#17121f;
color:#fff;
padding:12px 18px;
border-radius:14px;
z-index:5000;
display:none
}

.adminMenu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px
}

.adminBox{
padding:15px;
background:#faf5ff;
border-radius:17px;
border:1px solid #e9d5ff
}

.tableWrap{overflow:auto}
table{
width:100%;
border-collapse:collapse;
margin-top:15px
}
th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:right;
white-space:nowrap
}
th{background:#faf5ff}

@media(max-width:600px){
.header h1{font-size:23px}
.container{padding:11px}
.card{padding:15px}
.stats{grid-template-columns:1fr}
.nav button{font-size:10px}
}
</style>
</head>

<header class="header">
<div class="container">
<h1>🎓 AliNagheli English</h1>
<p>آموزش زبان انگلیسی از مدرسه تا مکالمه</p>
</div>
</header>

<main class="container">

<!-- LOGIN -->
<section id="login">
<div class="card">

<input id="loginPhone"

<input id="loginPassword"
       type="password"

<button class="btn secondary" onclick="showAdminLogin()">👑 ورود مدیر</button>

<p id="loginMsg"></p>
</div>
</section>

<!-- STUDENT -->
<section id="studentApp" class="hidden">

<div class="card">

<button class="btn danger" onclick="logout()">🚪 خروج</button>
</div>

<div id="homePage">

<div class="card">
<h2>📚 دوره‌ها</h2>

<div class="grid">

<button class="course" onclick="showSchool()">
<span class="icon">🏫</span>
مدرسه
</button>

<button class="course" onclick="showConversation()">
<span class="icon">🗣️</span>
مکالمه
</button>

<button class="course" onclick="showTeachers()">
<span class="icon">👨‍🏫</span>
مدرسان
</button>

</div>
</div>

<div class="card">
<h2>🏆 مسابقه</h2>
<p>مسابقه پایه یا دوره موردنظر را انتخاب کن:</p>

<div class="grid">

<button class="course" onclick="startCompetition('هفتم')">📘 هفتمی‌ها</button>
<button class="course" onclick="startCompetition('هشتم')">📗 هشتمی‌ها</button>
<button class="course" onclick="startCompetition('نهم')">📕 نهمی‌ها</button>
<button class="course" onclick="startCompetition('دهم')">📙 دهمی‌ها</button>
<button class="course" onclick="startCompetition('یازدهم')">📔 یازدهمی‌ها</button>
<button class="course" onclick="startCompetition('دوازدهم')">📓 دوازدهمی‌ها</button>
<button class="course" onclick="startCompetition('مکالمه')">🗣️ مکالمه</button>

</div>
</div>

<div class="card">
<h2>🏅 رکوردهای من</h2>
<div id="records">هنوز رکوردی ثبت نشده است.</div>
</div>

</div>

<div id="content"></div>

</section>

<!-- ADMIN LOGIN -->
<section id="adminLogin" class="hidden">

<div class="card">

<h2>👑 ورود مدیر</h2>

<input id="adminUser"
       autocomplete="username"
       placeholder="نام کاربری">

<input id="adminPass"
       type="password"
       autocomplete="current-password"
       placeholder="رمز عبور">

<button class="btn" onclick="adminLogin()">ورود به پنل مدیریت</button>

<button class="btn secondary" onclick="backLogin()">بازگشت</button>

<p id="adminMsg"></p>

</div>

</section>

<!-- ADMIN PANEL -->
<section id="adminPanel" class="hidden">

<div class="card">

<h2>👑 پنل مدیریت AliNagheli English</h2>

<div class="adminMenu">

<button class="course" onclick="adminDashboard()">
<span class="icon">📊</span>
داشبورد
</button>

<button class="course" onclick="adminStudents()">
<span class="icon">👨‍🎓</span>
زبان‌آموزان
</button>

<button class="course" onclick="adminRecords()">
<span class="icon">🏆</span>
رکوردها
</button>

</div>

<button class="btn danger" onclick="adminLogout()">🚪 خروج مدیر</button>

</div>

<div id="adminContent"></div>

</section>

</main>

<!-- COMPETITION -->
<div id="competition" class="hidden">

<div class="container">

<div class="card">

<h2 id="competitionTitle"></h2>

<div id="competitionProgress"></div>

<div id="competitionQuestion"></div>

<div id="competitionOptions"></div>

<div id="competitionResult"></div>

<button class="btn secondary"
        onclick="closeCompetition()">
بازگشت
</button>

</div>

</div>

</div>

<!-- NAV -->
<nav class="nav">

<button id="navHome" onclick="goHome()">🏠<br>خانه</button>

<button id="navSchool" onclick="showSchool()">🏫<br>مدرسه</button>

<button id="navConversation" onclick="showConversation()">🗣️<br>مکالمه</button>

<button id="navCompetition" onclick="openCompetitionMenu()">🏆<br>مسابقه</button>

</nav>

/* =========================================================

========================================================= */

function escapeHTML(value){
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function shuffle(arr){
return [...arr].sort(()=>Math.random()-.5);
}

function toast(message){
const el=document.getElementById("toast");
el.textContent=message;
el.style.display="block";
clearTimeout(window.__toastTimer);
window.__toastTimer=setTimeout(()=>{
el.style.display="none";
},2500);
}

function hideAll(){
[
"login",
"adminLogin",
"adminPanel",
"studentApp"
].forEach(id=>{
const el=document.getElementById(id);
if(el)el.classList.add("hidden");
});
}

function show(id){
hideAll();
const el=document.getElementById(id);
if(el)el.classList.remove("hidden");
}

function clearNav(){
document.querySelectorAll(".nav button")
.forEach(b=>b.classList.remove("active"));
}

function setNav(id){
clearNav();
document.getElementById(id)?.classList.add("active");
}

/* =========================================================
   SPEECH
========================================================= */

function speak(text){

if(!("speechSynthesis" in window)){
toast("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
return;
}

try{

window.speechSynthesis.cancel();

const utterance=new SpeechSynthesisUtterance(String(text));

utterance.lang="en-US";
utterance.rate=.72;
utterance.pitch=1;
utterance.volume=1;

const voices=window.speechSynthesis.getVoices();

const voice=voices.find(v=>
/^en(-|_)/i.test(v.lang)
);

if(voice)utterance.voice=voice;

window.speechSynthesis.speak(utterance);

}catch(error){

console.error(error);

toast("پخش تلفظ امکان‌پذیر نشد.");

}

}

if("speechSynthesis" in window){

window.speechSynthesis.onvoiceschanged=()=>{
window.speechSynthesis.getVoices();
};

}

function startCompetition(type){

const bank=competitionBank[type];

if(!bank||!bank.length){

toast("سؤال برای این مسابقه موجود نیست.");

return;

}

currentCompetition={

type:type,

questions:shuffle(bank).slice(0,20),

index:0,

correct:0,

wrong:0,

answered:false

};

document
.getElementById("competition")
.classList.remove("hidden");

document
.getElementById("competitionTitle")
.textContent=
"🏆 مسابقه "+type;

renderCompetitionQuestion();

}

function renderCompetitionQuestion(){

const c=currentCompetition;

if(!c){
return;
}

if(c.index>=c.questions.length){

finishCompetition();

return;

}

const q=c.questions[c.index];

const correct=q[1];

const options=shuffle(q.slice(1));

document.getElementById("competitionProgress").innerHTML=`

<span class="badge">
سؤال ${c.index+1} از ${c.questions.length}
</span>

<span class="badge">
✅ درست: ${c.correct}
</span>

<span class="badge">
❌ غلط: ${c.wrong}
</span>

`;

document.getElementById("competitionQuestion").innerHTML=`

<h3>
سؤال ${c.index+1}
</h3>

<p style="
font-size:20px;
direction:ltr;
text-align:left">

${escapeHTML(q[0])}

</p>

`;

document.getElementById("competitionOptions").innerHTML=

options.map(option=>`

<button
class="option"
onclick='answerCompetition(
this,
${JSON.stringify(option)},
${JSON.stringify(correct)}
)'>

${escapeHTML(option)}

</button>

`).join("");

document.getElementById("competitionResult").innerHTML="";

}

function answerCompetition(btn,answer,correct){

const c=currentCompetition;

if(!c||c.answered){
return;
}

c.answered=true;

const buttons=
document.querySelectorAll(
"#competitionOptions .option"
);

buttons.forEach(button=>{

button.disabled=true;

if(button.textContent.trim()===String(correct)){

button.classList.add("correct");

}

});

if(answer===correct){

c.correct++;

btn.classList.add("correct");

}else{

c.wrong++;

btn.classList.add("wrong");

}

setTimeout(()=>{

c.index++;

c.answered=false;

renderCompetitionQuestion();

},900);

}

function finishCompetition(){

const c=currentCompetition;

const score=Math.max(
0,
Math.round(
((c.correct-(c.wrong*.25))/c.questions.length)*100
)
);

saveRecord(c.type,score);

document.getElementById("competitionProgress").innerHTML="";

document.getElementById("competitionQuestion").innerHTML="";

document.getElementById("competitionOptions").innerHTML="";

document.getElementById("competitionResult").innerHTML=`

<div class="result">

🎉 مسابقه تمام شد!

<br><br>

تعداد پاسخ صحیح:
${c.correct}

<br>

تعداد پاسخ غلط:
${c.wrong}

<br><br>

نمره نهایی:

<strong>
${score}٪
</strong>

</div>

<div class="card">

<h3>🏆 رتبه‌های برتر</h3>

<div id="competitionRanks">

در حال محاسبه رتبه‌ها...

</div>

</div>

`;

renderCompetitionRanks(c.type);

}

/* =========================================================
   LESSON TEST
========================================================= */

function startLessonTest(grade,index){

const lesson=schoolData[grade][index];

let questions=[];

/* لغات */

lesson.words.forEach(w=>{

const distractors=shuffle(
lesson.words
.filter(x=>x[0]!==w[0])
.map(x=>x[1])
).slice(0,3);

questions.push([

`"${w[0]}" means ...`,

w[1],

...distractors

]);

});

/* مثال‌ها */

lesson.examples.forEach(example=>{

const other=lesson.examples
.filter(x=>x!==example);

let distractors=shuffle(other);

while(distractors.length<3){

distractors.push(
lesson.examples[
distractors.length %
lesson.examples.length
]
);

}

questions.push([

"Which sentence is related to this lesson?",

example,

...distractors.slice(0,3)

]);

});

/* حداقل ۱۵ سؤال */

while(questions.length<15){

const w=
lesson.words[
questions.length %
lesson.words.length
];

questions.push([

`Choose the meaning of "${w[0]}".`,

w[1],

"مدرسه",

"کتاب",

"دوست"

]);

}

currentCompetition={

type:`${grade} - ${lesson.title}`,

questions:shuffle(questions).slice(0,15),

index:0,

correct:0,

wrong:0,

answered:false

};

document
.getElementById("competition")
.classList.remove("hidden");

document
.getElementById("competitionTitle")
.textContent=
"📝 آزمون "+lesson.title;

renderLessonQuestion();

}

function renderLessonQuestion(){

const c=currentCompetition;

if(c.index>=c.questions.length){

finishLessonTest();

return;

}

const q=c.questions[c.index];

const correct=q[1];

const options=shuffle(q.slice(1));

document.getElementById("competitionProgress").innerHTML=`

<span class="badge">
سؤال ${c.index+1} از ${c.questions.length}
</span>

<span class="badge">
✅ درست: ${c.correct}
</span>

<span class="badge">
❌ غلط: ${c.wrong}
</span>

`;

document.getElementById("competitionQuestion").innerHTML=`

<h3>
سؤال ${c.index+1}
</h3>

<p style="
font-size:19px;
direction:ltr;
text-align:left">

${escapeHTML(q[0])}

</p>

`;

document.getElementById("competitionOptions").innerHTML=

options.map(option=>`

<button
class="option"
onclick='answerLesson(
this,
${JSON.stringify(option)},
${JSON.stringify(correct)}
)'>

${escapeHTML(option)}

</button>

`).join("");

document.getElementById("competitionResult").innerHTML="";

}

function answerLesson(btn,answer,correct){

const c=currentCompetition;

if(!c||c.answered){
return;
}

c.answered=true;

document
.querySelectorAll("#competitionOptions .option")
.forEach(button=>{

button.disabled=true;

if(button.textContent.trim()===String(correct)){

button.classList.add("correct");

}

});

if(answer===correct){

c.correct++;

btn.classList.add("correct");

}else{

c.wrong++;

btn.classList.add("wrong");

}

setTimeout(()=>{

c.index++;

c.answered=false;

renderLessonQuestion();

},900);

}

function finishLessonTest(){

const c=currentCompetition;

const percentage=
Math.round(
(c.correct/c.questions.length)*100
);

saveRecord(c.type,percentage);

document.getElementById("competitionProgress").innerHTML="";

document.getElementById("competitionQuestion").innerHTML="";

document.getElementById("competitionOptions").innerHTML="";

document.getElementById("competitionResult").innerHTML=`

<div class="result">

🎉 آزمون تمام شد!

<br><br>

تعداد پاسخ صحیح:
${c.correct}

<br>

تعداد پاسخ غلط:
${c.wrong}

<br><br>

نمره:
<strong>
${percentage}٪
</strong>

</div>

`;

}

/* =========================================================
   RECORDS
========================================================= */

function getRecords(){

try{

const records=
JSON.parse(
localStorage.getItem("ali_records")||"[]"
);

return Array.isArray(records)?records:[];

}catch(e){

return[];

}

}

function saveRecord(type,score){

let records=getRecords();

records.unshift({

type:type,

score:score,

name:currentStudent?.name||"زبان‌آموز",

phone:currentStudent?.phone||"",

date:new Date().toLocaleDateString("fa-IR"),

timestamp:Date.now()

});

records.sort((a,b)=>b.timestamp-a.timestamp);

localStorage.setItem(
"ali_records",
JSON.stringify(records.slice(0,100))
);

loadRecords();

}

function loadRecords(){

const el=document.getElementById("records");

if(!el)return;

const records=getRecords();

if(!records.length){

el.innerHTML=
"هنوز رکوردی ثبت نشده است.";

return;

}

el.innerHTML=records
.slice(0,20)
.map((r,i)=>`

<div class="rank">

<span>

${i+1}.
${escapeHTML(r.type)}

</span>

<strong>

${r.score}٪

</strong>

<small>

${escapeHTML(r.date)}

</small>

</div>

`)
.join("");

}

/* =========================================================
   ADMIN
========================================================= */

function adminDashboard(){

if(!adminAuthenticated){
return;
}

const records=getRecords();

const students=
new Set(
records
.map(r=>r.phone)
.filter(Boolean)
);

const avg=records.length
?
Math.round(
records.reduce(
(sum,r)=>sum+Number(r.score||0),0
)/records.length
)
:0;

document.getElementById("adminContent").innerHTML=`

<div class="card">

<h2>📊 داشبورد مدیر</h2>

<div class="stats">

<div class="stat">
<b>${students.size}</b>
زبان‌آموز
</div>

<div class="stat">
<b>${records.length}</b>
رکورد
</div>

<div class="stat">
<b>${avg}٪</b>
میانگین نمرات
</div>

</div>

</div>

`;

}

function adminStudents(){

if(!adminAuthenticated){
return;
}

const records=getRecords();

const map={};

records.forEach(r=>{

if(!r.phone)return;

if(!map[r.phone]){

map[r.phone]={
phone:r.phone,
count:0,
best:0
};

}

map[r.phone].count++;

map[r.phone].best=
Math.max(
map[r.phone].best,
Number(r.score||0)
);

});

const students=Object.values(map);

let html=`

<div class="card">

<h2>👨‍🎓 زبان‌آموزان</h2>

<div class="tableWrap">

<table>

<thead>

<tr>

<th>شماره</th>
<th>تعداد آزمون</th>
<th>بهترین نمره</th>

</tr>

</thead>

<tbody>

`;

students.forEach(s=>{

html+=`

<tr>

<td dir="ltr">
${escapeHTML(s.phone)}
</td>

<td>
${s.count}
</td>

<td>
${s.best}٪
</td>

</tr>

`;

});

if(!students.length){

html+=`

<tr>
<td colspan="3">
هنوز رکوردی ثبت نشده است.
</td>
</tr>

`;

}

html+=`

</tbody>

</table>

</div>

</div>

`;

document.getElementById("adminContent").innerHTML=html;

}
