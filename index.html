<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Lalezar&family=Amiri:wght@700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root{--bg-grad-1:#f5f3ff;--bg-grad-2:#ede9fe;--text:#171717;--text-muted:#6b7280;--card-bg:#fff;--card-border:rgba(221,214,254,.5);--card-shadow:0 4px 24px rgba(109,40,217,.06);--primary:#6d28d9;--primary-dark:#4c1d95;--primary-light:#a855f7;--accent-pink:#ec4899;--neon-purple:#a855f7;--neon-pink:#ec4899;--neon-blue:#3b82f6;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--input-bg:#faf9ff;--input-border:#ede9fe}
[data-theme="dark"]{--bg-grad-1:#0f172a;--bg-grad-2:#1e1b4b;--text:#f1f5f9;--text-muted:#94a3b8;--card-bg:#1e293b;--card-border:rgba(109,40,217,.4);--card-shadow:0 4px 24px rgba(0,0,0,.3);--input-bg:#0f172a;--input-border:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 100%);background-attachment:fixed;color:var(--text);padding-bottom:96px;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;transition:all .2s ease}
button:active{transform:scale(.97)}
.splash{position:fixed;inset:0;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10000;animation:splashOut .6s ease 1.6s forwards}
.splash .logo3d{width:260px;height:280px;animation:logoFloat 2.4s ease-in-out infinite,logoIn .9s cubic-bezier(.2,.8,.2,1)}
.splash .brand{margin-top:20px;font-size:24px;font-weight:800;color:#fff;letter-spacing:1px;text-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeInUp .6s ease .3s both}
.splash .sub{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:5px;margin-top:6px;animation:fadeInUp .6s ease .5s both}
@keyframes logoIn{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo3d{display:inline-block;position:relative;filter:drop-shadow(0 20px 45px rgba(168,85,247,.55))}
.logo3d svg{display:block;width:100%;height:100%}
.logo3d-sm{width:70px;height:76px}
.logo3d-md{width:130px;height:140px}
.logo3d-lg{width:200px;height:216px}
.logo3d-xl{width:260px;height:280px}
.header{background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 50%,#a855f7 100%);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 8px 32px rgba(109,40,217,.25);border-bottom:1px solid rgba(255,255,255,.1)}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brandBox{display:flex;align-items:center;gap:12px}
.brandTextBox{display:flex;flex-direction:column}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.2);line-height:1.1}
.logoNagheli{font-size:11px;opacity:.95;letter-spacing:1px;margin-top:0;font-weight:600}
.headerBtns{display:flex;gap:10px;align-items:center}
.iconBtn{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));color:white;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1;transition:all .3s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.iconBtn:hover{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.2));transform:translateY(-2px) scale(1.05);box-shadow:0 8px 24px rgba(168,85,247,.5);border-color:rgba(255,255,255,.6)}
.iconBtn svg{width:22px;height:22px;display:block}
.iconBtn.logoutBtn{background:linear-gradient(135deg,rgba(239,68,68,.35),rgba(220,38,38,.15));border-color:rgba(252,165,165,.5)}
.iconBtn.themeBtn{perspective:600px}
.iconBtn.themeBtn svg{animation:icon3dSpin 3s ease-in-out infinite}
@keyframes icon3dSpin{0%,100%{transform:rotateY(-12deg) rotateX(6deg)}50%{transform:rotateY(12deg) rotateX(-6deg)}}
.iconBtn.themeBtn.sunny{background:linear-gradient(135deg,rgba(251,191,36,.55),rgba(245,158,11,.25));border-color:rgba(252,211,77,.85);color:#fef3c7}
.iconBtn.themeBtn.moonly{background:linear-gradient(135deg,rgba(96,165,250,.4),rgba(59,130,246,.15));border-color:rgba(147,197,253,.65);color:#dbeafe}
.welcomeHero{position:relative;border-radius:32px;padding:44px 28px;margin-bottom:18px;background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 40%,#6d28d9 70%,#a855f7 100%);box-shadow:0 30px 80px -20px rgba(109,40,217,.6);overflow:hidden}
.welcomeHero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 25%,rgba(255,255,255,.18),transparent 55%),radial-gradient(circle at 85% 75%,rgba(236,72,153,.25),transparent 60%);pointer-events:none}
.welcomeGlow{position:absolute;top:-40%;right:-15%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.55),transparent 70%);filter:blur(30px);animation:wGlow 6s ease-in-out infinite}
@keyframes wGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:.95}}
.welcomeRing{position:absolute;left:-120px;top:-120px;width:340px;height:340px;border-radius:50%;border:1.5px dashed rgba(196,181,253,.35);animation:wSpin 26s linear infinite}
.welcomeRing2{left:auto;top:auto;right:-140px;bottom:-140px;width:420px;height:420px;border:1.5px dashed rgba(251,191,36,.28);animation-direction:reverse}
@keyframes wSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.welcomeParticles{position:absolute;inset:0;pointer-events:none}
.welcomeParticles span{position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fbbf24,#f59e0b);box-shadow:0 0 12px #fbbf24;animation:wFloat 8s ease-in-out infinite}
.welcomeParticles span:nth-child(1){left:8%;top:20%}
.welcomeParticles span:nth-child(2){left:24%;top:70%;animation-delay:1s;background:radial-gradient(circle,#ec4899,#db2777)}
.welcomeParticles span:nth-child(3){left:48%;top:14%;animation-delay:2s}
.welcomeParticles span:nth-child(4){left:72%;top:60%;animation-delay:1.4s;background:radial-gradient(circle,#a855f7,#7c3aed)}
.welcomeParticles span:nth-child(5){left:88%;top:30%;animation-delay:2.6s}
.welcomeParticles span:nth-child(6){left:56%;top:82%;animation-delay:.6s;background:radial-gradient(circle,#3b82f6,#2563eb)}
@keyframes wFloat{0%,100%{transform:translateY(0) scale(1);opacity:.6}50%{transform:translateY(-22px) scale(1.6);opacity:1}}
.welcome3d{position:relative;z-index:3;text-align:center}
.welcomeBadge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;letter-spacing:3px}
.badgeSpark{display:inline-block;animation:sparkle 2.4s ease-in-out infinite}
@keyframes sparkle{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.welcomeTitle{margin:18px 0 10px;display:flex;flex-direction:column;gap:8px;font-weight:900;color:#fff}
.welcomeTitle .titleName{font-size:clamp(30px,6vw,50px);font-family:'Lalezar','Vazirmatn',sans-serif;letter-spacing:2px}
.welcomeTitle .titleLine{font-size:clamp(18px,3.4vw,26px);color:rgba(255,255,255,.95);font-weight:700}
.welcomeUser{display:inline-flex;align-items:center;gap:8px;margin:12px 0 16px;padding:10px 18px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:14px;font-weight:600}
.welcomeUser .userIcon{font-size:20px;animation:waveHand 2.6s ease-in-out infinite;display:inline-block}
@keyframes waveHand{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(18deg)}20%,40%{transform:rotate(-12deg)}}
.owlXpTrack{position:relative;margin:22px auto 0;max-width:560px;padding:16px 20px 20px;border-radius:24px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18)}
.owlXpHeader{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;font-size:13px;margin-bottom:14px}
.owlXpHeader .xpLabel{background:linear-gradient(135deg,rgba(251,191,36,.35),rgba(245,158,11,.15));padding:5px 12px;border-radius:99px;border:1px solid rgba(251,191,36,.5)}
.owlXpHeader .lvlLabel{background:linear-gradient(135deg,rgba(168,85,247,.35),rgba(109,40,217,.15));padding:5px 12px;border-radius:99px;border:1px solid rgba(168,85,247,.5)}
.owlTrackWrap{position:relative;height:70px;margin-top:6px}
.owlTrack{position:absolute;left:8px;right:70px;top:50%;height:14px;transform:translateY(-50%);background:rgba(0,0,0,.3);border-radius:99px;overflow:visible}
.owlTrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#ec4899,#a855f7);transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 18px rgba(251,191,36,.75);position:relative}
.owlTrack i::after{content:"";position:absolute;right:-2px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#fff,#fbbf24 60%,#f59e0b);box-shadow:0 0 20px #fbbf24;animation:tipPulse 1.4s ease-in-out infinite}
@keyframes tipPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.35)}}
.owlChar{position:absolute;right:0;top:50%;transform:translateY(-50%);width:68px;height:68px;display:flex;align-items:flex-end;justify-content:center;animation:owlBounce 2.2s ease-in-out infinite}
@keyframes owlBounce{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(calc(-50% - 6px)) scale(1.04)}}
.owlChar svg{width:100%;height:100%}
.owlNote{text-align:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,.85);font-weight:600}
.owlNote b{color:#fbbf24;font-weight:800}
.consultBox{margin-top:14px;background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.3);border-radius:20px;padding:16px}
.consultTitle{color:#fff;font-weight:800;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.consultTitle .icon{font-size:20px;animation:ring 2s ease-in-out infinite;display:inline-block}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.consultRow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px;margin-bottom:8px;text-decoration:none;color:#fff}
.consultInfo{display:flex;align-items:center;gap:10px}
.consultAvatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#a855f7,#7c3aed);flex-shrink:0}
.consultName{font-weight:800;font-size:13px;color:#fff}
.consultPhone{font-size:11px;color:rgba(255,255,255,.75);direction:ltr;font-weight:600}
.consultCallBtn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;text-decoration:none}
.dictMini{margin-top:14px;background:rgba(59,130,246,.18);border:1.5px solid rgba(96,165,250,.4);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.dictMiniIcon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.dictMiniIcon svg{width:24px;height:24px}
.dictMiniContent{flex:1;color:#fff}
.dictMiniTitle{font-weight:800;font-size:14px}
.dictMiniSub{font-size:11px;opacity:.85;margin-top:3px;font-weight:600}
.dictMiniArrow{font-size:20px;color:#fff;opacity:.7}
.container{max-width:1100px;margin:auto;padding:18px}
.card{background:var(--card-bg);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:var(--card-shadow);border:1px solid var(--card-border)}
.hero{background:linear-gradient(135deg,#312e81 0%,#6d28d9 50%,#a855f7 100%);color:#fff;border-radius:28px;padding:32px;margin-bottom:18px}
.hero h1{margin:8px 0;font-size:34px}
.hero h2{margin:6px 0;font-weight:600}
.hero p{opacity:.9;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.item{background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:20px;cursor:pointer;transition:all .3s}
.item:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(109,40,217,.18)}
.item h3{margin:10px 0 6px;font-size:16px}
.item .muted{margin:6px 0 12px}
.btn{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(109,40,217,.35);transition:all .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(109,40,217,.45)}
.btn.full{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
.secondary{background:linear-gradient(135deg,var(--bg-grad-2),#ddd6fe);color:#5b21b6}
[data-theme="dark"] .secondary{background:linear-gradient(135deg,#312e81,#4c1d95);color:#e9d5ff}
.success{background:linear-gradient(135deg,#22c55e,#16a34a)}
.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
.warning{background:linear-gradient(135deg,#f59e0b,#d97706)}
.info{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.neonIcon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(109,40,217,.08));transition:all .3s}
.neonIcon svg{width:30px;height:30px;filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor)}
.neonIcon.purple{color:#a855f7}
.neonIcon.pink{color:#ec4899}
.neonIcon.blue{color:#3b82f6}
.neonIcon.green{color:#22c55e}
.neonIcon.orange{color:#f59e0b}
.neonIcon.red{color:#ef4444}
.neonIcon.cyan{color:#06b6d4}
.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(400px,90vw)}
.toast{background:var(--card-bg);color:var(--text);padding:14px 18px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);border:1px solid var(--card-border);font-size:14px;font-weight:600;animation:toastIn .4s;pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast.success{border-right:4px solid var(--success)}
.toast.error{border-right:4px solid var(--danger)}
.toast.info{border-right:4px solid var(--info)}
.toast.warning{border-right:4px solid var(--warning)}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}
.skel{background:linear-gradient(90deg,var(--card-border) 25%,var(--input-bg) 50%,var(--card-border) 75%);background-size:200% 100%;animation:skel 1.5s infinite;border-radius:8px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.login{min-height:100vh;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;justify-content:center;align-items:center;padding:20px}
.loginCard{background:rgba(255,255,255,.98);width:min(440px,100%);padding:32px;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.4);color:#171717}
.loginLogoWrap{display:flex;justify-content:center;margin-bottom:8px}
.loginBrand{text-align:center;font-size:26px;font-weight:800;background:linear-gradient(135deg,#6d28d9,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:6px 0 4px}
.loginTag{text-align:center;font-size:11px;color:#6b7280;letter-spacing:3px;font-weight:600;margin-bottom:12px}
label{display:block;margin:12px 0 6px;font-weight:700;font-size:13px;color:var(--primary-dark)}
[data-theme="dark"] label{color:#c4b5fd}
input,select,textarea{width:100%;border:2px solid var(--input-border);border-radius:14px;padding:13px;background:var(--input-bg);color:var(--text);outline:none;font-size:14px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#7c3aed;background:var(--card-bg);box-shadow:0 0 0 4px rgba(124,58,237,.1)}
.tabs{display:flex;gap:8px;margin:20px 0;background:var(--input-bg);padding:5px;border-radius:16px}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:transparent;font-weight:700;color:var(--text-muted)}
.tab.active{background:var(--card-bg);color:var(--primary);box-shadow:0 2px 10px rgba(109,40,217,.15)}
.bottom{position:fixed;bottom:0;left:0;right:0;height:88px;background:var(--card-bg);border-top:1px solid var(--card-border);z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex;padding:6px 4px;overflow-x:auto}
.nav{flex:1;min-width:66px;border:0;background:transparent;padding:8px 2px;color:var(--text-muted);font-size:10px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:all .3s}
.nav svg{width:24px;height:24px;transition:all .3s}
.nav:hover{transform:translateY(-3px)}
.nav.active{font-weight:700;background:var(--bg-grad-2)}
.nav:nth-child(1) svg{color:#a855f7;filter:drop-shadow(0 0 6px #a855f7)}
.nav:nth-child(1).active svg{filter:drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 20px #a855f7)}
.nav:nth-child(2) svg{color:#ec4899;filter:drop-shadow(0 0 6px #ec4899)}
.nav:nth-child(2).active svg{filter:drop-shadow(0 0 10px #ec4899) drop-shadow(0 0 20px #ec4899)}
.nav:nth-child(3) svg{color:#3b82f6;filter:drop-shadow(0 0 6px #3b82f6)}
.nav:nth-child(3).active svg{filter:drop-shadow(0 0 10px #3b82f6) drop-shadow(0 0 20px #3b82f6)}
.nav:nth-child(4) svg{color:#22c55e;filter:drop-shadow(0 0 6px #22c55e)}
.nav:nth-child(4).active svg{filter:drop-shadow(0 0 10px #22c55e) drop-shadow(0 0 20px #22c55e)}
.nav:nth-child(5) svg{color:#f59e0b;filter:drop-shadow(0 0 6px #f59e0b)}
.nav:nth-child(5).active svg{filter:drop-shadow(0 0 10px #f59e0b) drop-shadow(0 0 20px #f59e0b)}
.nav:nth-child(6) svg{color:#06b6d4;filter:drop-shadow(0 0 6px #06b6d4)}
.nav:nth-child(6).active svg{filter:drop-shadow(0 0 10px #06b6d4) drop-shadow(0 0 20px #06b6d4)}
.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lesson{background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border:1px solid var(--card-border);border-radius:20px;padding:20px;position:relative}
.lesson.locked{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fecaca}
[data-theme="dark"] .lesson.locked{background:linear-gradient(135deg,#1e1b1b,#2a1a1a);border-color:#7f1d1d}

.tsDialog .dlgLine{direction:ltr;text-align:left;padding:8px 12px;border-radius:10px;margin:6px 0;font-size:13px;line-height:1.7}
.tsDialog .dlgA{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e3a8a}
.tsDialog .dlgB{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534}
[data-theme="dark"] .tsDialog .dlgA{background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#dbeafe}
[data-theme="dark"] .tsDialog .dlgB{background:linear-gradient(135deg,#166534,#14532d);color:#dcfce7}
.tsDialog .dlgA .spk,.tsDialog .dlgB .spk{font-weight:800;margin-right:6px}
.tsDialog .dlgFa{direction:rtl;text-align:right;font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:600}
.tsSummary{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px dashed #f59e0b;border-radius:18px;padding:18px;margin-top:10px}
[data-theme="dark"] .tsSummary{background:linear-gradient(135deg,#78350f,#451a03)}
.tsSummary h4{margin:0 0 12px;color:#92400e;font-size:15px}
[data-theme="dark"] .tsSummary h4{color:#fde68a}
.tsSummary ul{margin:0;padding-right:20px;line-height:2;font-size:13px;color:#78350f;font-weight:600}
[data-theme="dark"] .tsSummary ul{color:#fef3c7}
.tsQuizBox{background:linear-gradient(135deg,#eef2ff,#e0e7ff);border:2px solid #a5b4fc;border-radius:18px;padding:18px;margin-top:10px}
[data-theme="dark"] .tsQuizBox{background:linear-gradient(135deg,#1e1b4b,#312e81);border-color:#6366f1}
.tsQuizBox h4{margin:0 0 12px;color:#3730a3;font-size:15px}
[data-theme="dark"] .tsQuizBox h4{color:#c7d2fe}
.tsQuizQ{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
[data-theme="dark"] .tsQuizQ{background:#0f172a}
.tsQuizQ .qText{font-weight:700;font-size:14px;margin-bottom:10px;color:var(--text);line-height:1.7}
.tsQuizOpt{display:block;width:100%;text-align:right;background:var(--card-bg);border:2px solid var(--input-border);border-radius:12px;padding:11px 14px;margin:6px 0;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
.tsQuizOpt.correct{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#22c55e;color:#166534}
.tsQuizOpt.wrong{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#ef4444;color:#991b1b}
.talkBanner{background:linear-gradient(135deg,#6d28d9 0%,#a855f7 50%,#ec4899 100%);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:16px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(168,85,247,.45);border:2px solid rgba(255,255,255,.15)}
.talkBanner .tbIn{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
.talkBanner .tbIcon{font-size:48px;flex-shrink:0}
.talkBanner .tbContent{flex:1;text-align:right}
.talkBanner .tbTitle{font-size:19px;font-weight:900;margin-bottom:4px}
.talkBanner .tbSub{font-size:12px;opacity:.95;font-weight:600;line-height:1.7}
.talkBanner .tbArrow{font-size:26px;opacity:.85;flex-shrink:0}
/* Locked book card */
.bookCard.locked{position:relative;overflow:hidden}
.bookCard.locked::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);border-radius:16px}
.bookCard.locked .bcBtn{position:relative;z-index:2}
.tsLesson.locked{opacity:.7;background:linear-gradient(135deg,#fef2f2,#fee2e2)}
[data-theme="dark"] .tsLesson.locked{background:linear-gradient(135deg,#1e1b1b,#2a1a1a)}
.tsLesson.locked::before{content:"🔒";position:absolute;top:10px;left:10px;font-size:20px;filter:drop-shadow(0 0 6px #ef4444)}
/* Payment Modal */
.payModal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:5000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.payCard{background:var(--card-bg);border-radius:28px;padding:26px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);border:2px solid var(--card-border);animation:slideUp .4s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.payCard .payTitle{font-size:20px;font-weight:900;margin:0 0 8px;text-align:center;background:linear-gradient(135deg,var(--primary),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.payCard .payAmount{font-size:36px;font-weight:900;text-align:center;color:var(--primary);margin:12px 0;letter-spacing:1px}
.payCard .payAmount small{font-size:14px;color:var(--text-muted);font-weight:600}
.payCard .cardNumber{background:linear-gradient(135deg,#1e1b4b,#4c1d95);color:#fff;border-radius:16px;padding:18px;text-align:center;font-family:monospace;font-size:20px;font-weight:800;letter-spacing:3px;direction:ltr;margin:14px 0;box-shadow:0 8px 24px rgba(109,40,217,.35);position:relative;overflow:hidden}
.payCard .cardNumber::before{content:"💳";position:absolute;top:8px;left:12px;font-size:20px;opacity:.6}
.payCard .ownerName{text-align:center;font-size:13px;color:var(--text-muted);font-weight:700;margin-bottom:16px}
.payCard .copyBtn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:800;width:100%;margin-bottom:10px;font-size:13px}
.payCard .closeBtn{background:var(--bg-grad-2);color:var(--text);border:0;border-radius:12px;padding:12px;font-weight:800;width:100%;margin-top:10px;font-size:14px}
</style>
