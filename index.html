    <div class="card">
      <h3 style="margin-top:0">📝 تکالیف</h3>
      ${homeworks.length?homeworks.map(h=>{const t=getTeacher(h.teacher_id);return `<div class="adminRow">
        <b>${esc(h.student_name||"")} → ${esc(t.name)}</b>
        <div class="muted">📌 ${esc(h.title||"")}<br>📄 ${esc(h.description||"")}${h.link?`<br>🔗 <a href="${esc(h.link)}" target="_blank">${esc(h.link)}</a>`:""}</div>
        ${h.grade!=null?`<div style="margin-top:10px;background:linear-gradient(135deg,#dcfce7,#bbf7d0);padding:10px;border-radius:12px"><b>نمره: ${h.grade}/20</b>${h.teacher_feedback?`<br>${esc(h.teacher_feedback)}`:""}</div>`:`<label>نمره (۰-۲۰):</label><input id="hg${h.id}" type="number" min="0" max="20" step="0.25"><label>بازخورد:</label><textarea id="hf${h.id}"></textarea><button class="btn success" style="margin-top:8px" onclick="gradeHomework('${h.id}')">✅ ثبت</button>`}
      </div>`}).join(""):`<p class="muted">تکلیفی نیست.</p>`}
    </div>
    <div class="card">
      <h3 style="margin-top:0">📅 رزروها</h3>
      ${requests.length?requests.map(x=>`<div class="adminRow">
        <b>${esc(x.student_name||"")}</b>
        <div class="muted">📱 ${esc(x.student_phone||"")}<br>👨‍🏫 ${esc(x.teacher_name||"")}<br>📅 ${esc(x.requested_date||"")} ⏰ ${esc(x.requested_time||"")}<br>📘 ${esc(x.class_type||"")}</div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          ${x.status==="pending"?`<button class="btn success" onclick="respondRequest('${x.id}','approved')">✅ تأیید</button><button class="btn danger" onclick="respondRequest('${x.id}','rejected')">❌ رد</button>`:`<b>${x.status==="approved"?"✅ تأیید":"❌ رد"}</b>`}
        </div>
      </div>`).join(""):`<p class="muted">درخواستی نیست.</p>`}
    </div>
    <div class="card">
      <h3 style="margin-top:0">👥 ثبت‌نام‌ها</h3>
      ${students.length?students.map(x=>`<div class="adminRow">
        <b>${esc(x.first_name)} ${esc(x.last_name)}</b>
        <div class="muted">📱 ${esc(x.phone||"")}<br>🎓 پایه: ${esc(x.level||"-")}</div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          ${x.status==="waiting"?`<button class="btn success" onclick="approve('${x.id}')">✅ تأیید</button><button class="btn danger" onclick="rejectStudent('${x.id}')">❌ رد</button>`:x.status==="registered"||x.status==="approved"?`<span style="color:var(--success);font-weight:700">✅ تأیید</span><button class="btn danger" onclick="rejectStudent('${x.id}')">رد</button>`:`<span style="color:var(--danger);font-weight:700">❌ رد</span><button class="btn success" onclick="approve('${x.id}')">تأیید</button>`}
        </div>
      </div>`).join(""):`<p class="muted">ثبت‌نامی نیست.</p>`}
    </div>
    <div class="card">
      <h3 style="margin-top:0">🔓 قفل دروس</h3>
      <select id="adminStudentSelect" onchange="adminLoadUnlocks(this.value)"><option value="">-- انتخاب --</option>${students.map(s=>`<option value="${s.id}">${esc(s.first_name||"")} ${esc(s.last_name||"")} — ${esc(s.phone||"")}</option>`).join("")}</select>
      <div id="adminUnlockArea" style="margin-top:14px"></div>
    </div>
    <button class="btn secondary full" onclick="logout()">خروج</button>
  </main>
  <div class="toast-wrap" id="toastWrap"></div>`;
}
async function replyQuestion(id){
  const t=document.getElementById("qr"+id).value.trim();
  if(!t){toast("پاسخ رو بنویس","error");return}
  try{await db.from("student_questions").update({teacher_reply:t,replied_at:new Date().toISOString(),student_read:false}).eq("id",id);toast("ارسال شد","success");admin()}catch(e){toast("خطا","error")}
}
async function gradeHomework(id){
  const g=parseFloat(document.getElementById("hg"+id).value);
  const fb=document.getElementById("hf"+id).value.trim();
  if(isNaN(g)||g<0||g>20){toast("نمره ۰-۲۰","error");return}
  try{await db.from("student_homeworks").update({grade:g,teacher_feedback:fb||null,graded_at:new Date().toISOString()}).eq("id",id);toast("ثبت شد","success");admin()}catch(e){toast("خطا","error")}
}
async function adminLoadUnlocks(sid){
  const area=document.getElementById("adminUnlockArea");if(!area)return;
  if(!sid){area.innerHTML="";return}
  let u={};
  try{const r=await db.from("lesson_unlocks").select("grade,lesson_index").eq("student_id",sid);(r.data||[]).forEach(x=>{u[`${x.grade}-${x.lesson_index}`]=true})}catch(e){}
  let html="";
  for(let g=7;g<=12;g++){
    html+=`<h4 style="margin:14px 0 6px;color:var(--primary)">پایه ${g}</h4><div style="display:flex;flex-wrap:wrap;gap:6px">`;
    books[g].lessons.forEach((les,i)=>{
      const isUn=i===0||u[`${g}-${i}`];
      html+=`<button class="btn ${isUn?'success':'secondary'}" style="font-size:11px;padding:8px 10px" onclick="adminToggleUnlock('${sid}',${g},${i},${!isUn})">${i+1}. ${isUn?'🔓':'🔒'}</button>`;
    });
    html+=`</div>`;
  }
  area.innerHTML=html;
}
async function adminToggleUnlock(sid,g,i,unlock){
  if(i===0){toast("درس ۱ همیشه باز","warning");return}
  try{
    if(unlock)await db.from("lesson_unlocks").upsert({student_id:sid,grade:Number(g),lesson_index:Number(i),payment_ref:"admin",unlocked_at:new Date().toISOString()},{onConflict:"student_id,grade,lesson_index"});
    else await db.from("lesson_unlocks").delete().eq("student_id",sid).eq("grade",g).eq("lesson_index",i);
  }catch(e){}
  adminLoadUnlocks(sid);
}
async function respondRequest(id,s){try{await db.from("teacher_requests").update({status:s}).eq("id",id);toast("انجام شد","success");admin()}catch(e){}}
async function approve(id){try{await db.from("students").update({status:"registered"}).eq("id",id);toast("تأیید ✅","success");admin()}catch(e){}}
async function rejectStudent(id){try{await db.from("students").update({status:"rejected"}).eq("id",id);toast("رد شد","success");admin()}catch(e){}}

/* ==================== Logout ==================== */
async function logout(){
  try{await db.auth.signOut()}catch(e){}
  S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],exams:[],unlocks:{},streak:0,lastVisit:null,qas:[],homeworks:[],gameRecords:{},currentGame:null,_srsSession:null,srs:{},studyLog:{},currentPage:"landing",hwFormType:"file",tsUnit:null,tsBook:1};
  landing();
}

/* ==================== Startup ==================== */
async function startup(){
  try{
    const params=new URLSearchParams(location.search);
    const ref=params.get("ref");
    if(ref)try{sessionStorage.setItem("AN_REFERRAL",ref)}catch(e){}
    const r=await db.auth.getSession();
    const session=r.data?.session;
    if(!session){setTimeout(()=>{hideSplash();landing()},1500);return}
    const user=session.user;
    if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){
      S.admin=true;
      setTimeout(()=>{hideSplash();admin()},1500);
      return;
    }
    const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle();
    if(st.data&&["registered","approved"].includes(st.data.status)){
      S.student=st.data;
      await loadStudentStats();
      await loadUnlocks();
      loadStreak();
      loadGameRecords();
      await loadSRS();
      await loadQAs();
      await loadHomeworks();
      await loadStudyLog();
      setTimeout(()=>{hideSplash();home()},1500);
      return;
    }
    await db.auth.signOut();
    setTimeout(()=>{hideSplash();landing()},1500);
  }catch(e){
    try{await db.auth.signOut()}catch(_){}
    setTimeout(()=>{hideSplash();landing()},1500);
  }
}
db.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT"&&!S.admin&&!S.student)landing();
});

/* ==================== Service Worker ==================== */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    const sw=`self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));`;
    try{
      const blob=new Blob([sw],{type:"application/javascript"});
      const url=URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(()=>{});
    }catch(e){}
  });
}

/* ==================== Start ==================== */
startup();

window.addEventListener("error",e=>{console.error("[AN]",e.error||e.message)});
window.addEventListener("unhandledrejection",e=>{console.error("[AN]",e.reason)});
</script>
