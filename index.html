<style>

}

body{

    font-family:Tahoma,Arial,sans-serif;
    background:#f6f3ff;

}

header{

.brand{

}

    margin:14px 0;

}

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

}

h1,h2,h3{

}

input,

}

button{

}

}

button.bad{

}

button.warning{

}

.hidden{

}

.msg{

}

.success{

}

.error{
    background:#fee2e2;

}

.info{

    color:#5b21b6;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:999px;
    font-size:12px;
    background:#eee9f8;
}

.waiting{
    background:#fef3c7;

}

.registered{
    background:#dcfce7;
    color:#166534;
}

.rejected{

    color:#991b1b;
}

.progress{
    height:10px;
    background:#eee8f8;
    border-radius:50px;
    overflow:hidden;
}

.progress>div{
    height:100%;
    background:linear-gradient(90deg,#6d28d9,#8b5cf6);
}

.lesson{
    display:flex;
    align-items:center;
    gap:10px;
}

.num{
    min-width:38px;
    height:38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#eee9f8;
    color:#5b21b6;
    font-weight:bold;
}

.muted{
    color:#756d81;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#756d81;
}

.content{
    white-space:pre-wrap;
    line-height:2;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.stat{
    text-align:center;
}

.stat b{
    font-size:30px;
    color:#6d28d9;
}

.welcome{
    background:linear-gradient(135deg,#6d28d9,#8b5cf6);
    color:white;
    border-radius:18px;
    padding:22px;
}

nav{
    position:sticky;
    bottom:0;
    z-index:10;
    background:#fff;
    border-top:1px solid #e5def0;
    padding:8px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

@media(max-width:600px){

    .wrap{
        padding:12px;
    }

    .card{
        padding:15px;
    }

    .brand{
        font-size:21px;
    }

    button{
        padding:10px 13px;
    }
}
</style>

id="nav"

>

📚 دوره‌های من

</button>

</button>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentStudent = null;

let currentAdmin = false;


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
document.getElementById(id);


function escapeHTML(value){

    return String(value ?? "")
    .replace(/[&<>"']/g,function(char){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char];

    });

}


function normalizePhone(value){

    let p =
    value
    .trim()
    .replace(/[^\d+]/g,"");

    if(p.startsWith("+98")){

        p =
        "0" +
        p.substring(3);

    }

    return p;

}


function authEmail(phone){

    return (
        normalizePhone(phone)
        +
        "@alinagheli.com"
    );

}


function showMessage(
    text,
    type="info"
){

    $("authMsg").innerHTML =

    text

    ?

    `<div class="msg ${type}">
        ${escapeHTML(text)}
     </div>`

    :

    "";

}


function showView(id){

    [
        "auth",
        "student",
        "admin",
        "course",
        "lesson"
    ]

    .forEach(function(view){

        $(view)
        .classList
        .add("hidden");

    });


    $(id)
    .classList
    .remove("hidden");

}


function showNavigation(show){

    $("nav")
    .classList
    .toggle(
        "hidden",
        !show
    );

}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const first =
    $("regFirst")
    .value
    .trim();

    const last =
    $("regLast")
    .value
    .trim();

    const phone =
    normalizePhone(
        $("regPhone").value
    );

    const level =
    $("regLevel").value;

    const password =
    $("regPass").value;


    if(
        !first ||
        !last ||
        !phone ||
        password.length < 6
    ){

        showMessage(
            "لطفاً همه اطلاعات را کامل کنید. رمز عبور حداقل ۶ کاراکتر باشد.",
            "error"
        );

        return;

    }


    const {

        data,
        error

    } = await db.auth.signUp({

        email:
        authEmail(phone),

        password:
        password

    });


    if(error){

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    const userId =
    data.user?.id;


    if(!userId){

        showMessage(
            "حساب کاربری ایجاد نشد.",
            "error"
        );

        return;

    }


    const {

        error:
        studentError

    } = await db
    .from("students")
    .insert({

        first_name:
        first,

        last_name:
        last,

        phone:
        phone,

        level:
        level,

        status:
        "waiting",

        auth_user_id:
        userId,

        password_created:
        true

    });


    if(studentError){

        showMessage(
            "حساب ساخته شد اما ثبت اطلاعات دانش‌آموز با خطا مواجه شد: "
            +
            studentError.message,
            "error"
        );

        return;

    }


    showMessage(
        "ثبت‌نام با موفقیت انجام شد. درخواست شما در انتظار تأیید مدیر است.",
        "success"
    );

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const phone =
    normalizePhone(
        $("loginPhone").value
    );

    const password =
    $("loginPass").value;


    if(
        !phone ||
        !password
    ){

        showMessage(
            "شماره موبایل و رمز عبور را وارد کنید.",
            "error"
        );

        return;

    }


    const {

        error

    } = await db.auth.signInWithPassword({

        email:
        authEmail(phone),

        password:
        password

    });


    if(error){

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    await initializeApp();

}


/* =====================================================
   INITIALIZE
===================================================== */

async function initializeApp(){

    const {

        data

    } =
    await db.auth.getSession();


    currentUser =
    data.session?.user || null;


    if(!currentUser){

        showView("auth");

        showNavigation(false);

        return;

    }


    /* CHECK ADMIN */

    const {

        data:
        adminData

    } = await db
    .from("admins")
    .select("id")
    .eq(
        "user_id",
        currentUser.id
    )
    .maybeSingle();


    currentAdmin =
    !!adminData;


    if(currentAdmin){

        showView("admin");

        showNavigation(false);

        await loadAdmin();

        return;

    }


    /* STUDENT */

    const {

        data:
        studentData,

        error

    } = await db
    .from("students")
    .select("*")
    .eq(
        "auth_user_id",
        currentUser.id
    )
    .maybeSingle();


    if(
        error ||
        !studentData
    ){

        await logout();

        return;

    }


    currentStudent =
    studentData;


    /* WAITING */

    if(
        currentStudent.status ===
        "waiting"
    ){

        showView("student");

        showNavigation(false);

        $("studentStatus").innerHTML = `

        <div class="card">

        <h2>
        ⏳ در انتظار تأیید
        </h2>

        <p>
        سلام
        ${escapeHTML(
            currentStudent.first_name
        )}
        👋
        </p>

        <p>
        ثبت‌نام شما با موفقیت ثبت شده است.
        </p>

        <p>
        درخواست شما در انتظار تأیید مدیر است.
        </p>

        </div>

        `;

        return;

    }


    /* REJECTED */

    if(
        currentStudent.status ===
        "rejected"
    ){

        showView("student");

        showNavigation(false);

        $("studentStatus").innerHTML = `

        <div class="card">

        <h2>
        ❌ ثبت‌نام رد شده
        </h2>

        <p>
        متأسفانه ثبت‌نام شما تأیید نشده است.
        </p>

        <p>
        برای پیگیری با مدیریت تماس بگیرید.
        </p>

        </div>

        `;

        return;

    }


    /* REGISTERED */

    await studentHome();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await db.auth.signOut();

    currentUser = null;

    currentStudent = null;

    currentAdmin = false;

    showView("auth");

    showNavigation(false);

}


/* =====================================================
   STUDENT HOME
===================================================== */

async function studentHome(){

    showView("student");

    showNavigation(true);

    $("studentStatus")
    .innerHTML = "";


    $("studentHome").innerHTML = `

    <div class="welcome">

        <h2>
        سلام
        ${escapeHTML(
            currentStudent.first_name
        )}
        👋
        </h2>

        <p>
        به AliNagheli English خوش آمدید.
        </p>

        <p>
        سطح زبان:
        <b>
        ${escapeHTML(
            currentStudent.level || "-"
        )}
        </b>
        </p>

    </div>

    <div id="myCourseArea"></div>

    `;


    await myCourses();

}


/* =====================================================
   MY COURSES
===================================================== */

async function myCourses(){

    showView("student");

    showNavigation(true);


    const {

        data:
        links,

        error

    } = await db
    .from("student_courses")
    .select("course_id")
    .eq(
        "student_id",
        currentStudent.id
    );


    if(error){

        $("myCourseArea").innerHTML = `

        <div class="card msg error">

        ${escapeHTML(
            error.message
        )}

        </div>

        `;

        return;

    }


    const courseIds =
    (links || [])
    .map(
        x => x.course_id
    );


    if(
        courseIds.length === 0
    ){

        $("myCourseArea").innerHTML = `

        <div class="card empty">

        <h3>
        📚 هنوز دوره‌ای انتخاب نکرده‌اید
        </h3>

        <button
        onclick="availableCourses()"
        >
        انتخاب دوره
        </button>

        </div>

        `;

        return;

    }


    const {

        data:
        courses

    } = await db
    .from("courses")
    .select("*")
    .in(
        "id",
        courseIds
    )
    .eq(
        "active",
        true
    );


    let html = `

    <div class="card">

    <h2>
    📚 دوره‌های من
    </h2>

    </div>

    <div class="grid">

    `;


    for(
        const course
        of courses || []
    ){

        const progress =
        await calculateProgress(
            course.id
        );


        html += `

        <div class="card">

        <h3>
        ${escapeHTML(
            course.icon || "📚"
        )}

        ${escapeHTML(
            course.title
        )}

        </h3>

        <p class="muted">

        ${escapeHTML(
            course.description || ""
        )}

        </p>

        <div class="progress">

        <div
        style="width:${progress}%"
        ></div>

        </div>

        <p class="muted">

        ${progress}%
        تکمیل شده

        </p>

        <button
        onclick="openCourse(${course.id})"
        >

        ورود به دوره

        </button>

        </div>

        `;

    }


    html +=
    "</div>";


    $("myCourseArea").innerHTML =
    html;

}


/* =====================================================
   AVAILABLE COURSES
===================================================== */

async function availableCourses(){

    showView("student");

    showNavigation(true);


    const {

        data:
        allCourses

    } = await db
    .from("courses")
    .select("*")
    .eq(
        "active",
        true
    )
    .order(
        "id",
        {
            ascending:true
        }
    );


    const {

        data:
        links

    } = await db
    .from("student_courses")
    .select("course_id")
    .eq(
        "student_id",
        currentStudent.id
    );


    const selected =
    new Set(
        (links || [])
        .map(
            x => x.course_id
        )
    );


    let html = `

    <div class="card">

    <h2>
    ➕ انتخاب دوره
    </h2>

    <p class="muted">

    دوره موردنظر خود را انتخاب کنید.

    </p>

    </div>

    <div class="grid">

    `;


    for(
        const course
        of allCourses || []
    ){

        html += `

        <div class="card">

        <h3>

        ${escapeHTML(
            course.icon || "📚"
        )}

        ${escapeHTML(
            course.title
        )}

        </h3>

        <p>

        ${escapeHTML(
            course.description || ""
        )}

        </p>

        ${
            selected.has(course.id)

            ?

            `<span class="badge registered">
            ✓ انتخاب شده
            </span>`

            :

            `<button
            onclick="enrollCourse(${course.id})"
            >
            انتخاب دوره
            </button>`
        }

        </div>

        `;

    }


    html +=
    "</div>";


    $("studentHome").innerHTML =
    html;

}


/* =====================================================
   ENROLL COURSE
===================================================== */

async function enrollCourse(
    courseId
){

    const {

        error

    } = await db
    .from("student_courses")
    .insert({

        student_id:
        currentStudent.id,

        course_id:
        courseId

    });


    if(error){

        alert(
            error.message
        );

        return;

    }


    await availableCourses();

}


/* =====================================================
   CALCULATE PROGRESS
===================================================== */

async function calculateProgress(
    courseId
){

    const {

        data:
        lessons

    } = await db
    .from("course_lessons")
    .select("id")
    .eq(
        "course_id",
        courseId
    )
    .eq(
        "active",
        true
    );


    if(
        !lessons ||
        lessons.length === 0
    ){

        return 0;

    }


    const lessonIds =
    lessons.map(
        x => x.id
    );


    const {

        data:
        progress

    } = await db
    .from("student_progress")
    .select(
        "lesson_id,completed"
    )
    .eq(
        "student_id",
        currentStudent.id
    )
    .in(
        "lesson_id",
        lessonIds
    );


    const completed =
    new Set(

        (progress || [])
        .filter(
            x => x.completed
        )
        .map(
            x => x.lesson_id
        )

    );


    return Math.round(
        (
            completed.size /
            lessons.length
        ) * 100
    );

}


/* =====================================================
   OPEN COURSE
===================================================== */

async function openCourse(
    courseId
){

    const {

        data:
        course

    } = await db
    .from("courses")
    .select("*")
    .eq(
        "id",
        courseId
    )
    .single();


    const {

        data:
        lessons,

        error

    } = await db
    .from("course_lessons")
    .select("*")
    .eq(
        "course_id",
        courseId
    )
    .eq(
        "active",
        true
    )
    .order(
        "lesson_number",
        {
            ascending:true
        }
    );


    if(error){

        alert(
            error.message
        );

        return;

    }


    const lessonIds =
    (lessons || [])
    .map(
        x => x.id
    );


    let progress = [];


    if(
        lessonIds.length
    ){

        const result =
        await db
        .from("student_progress")
        .select(
            "lesson_id,completed"
        )
        .eq(
            "student_id",
            currentStudent.id
        )
        .in(
            "lesson_id",
            lessonIds
        );

        progress =
        result.data || [];

    }


    const completed =
    new Set(

        progress
        .filter(
            x => x.completed
        )
        .map(
            x => x.lesson_id
        )

    );


    const percent =
    lessons?.length

    ?

    Math.round(
        (
            completed.size /
            lessons.length
        ) * 100
    )

    :

    0;


    showView("course");

    showNavigation(true);


    let html = `

    <div class="card">

    <button
    class="secondary"
    onclick="studentHome()"
    >
    ← برگشت
    </button>

    <h2>

    ${escapeHTML(
        course.icon || "📚"
    )}

    ${escapeHTML(
        course.title
    )}

    </h2>

    <p>

    ${escapeHTML(
        course.description || ""
    )}

    </p>

    <div class="progress">

    <div
    style="width:${percent}%"
    ></div>

    </div>

    <p>
    ${percent}%
    پیشرفت
    </p>

    </div>

    `;


    if(
        !lessons ||
        lessons.length === 0
    ){

        html += `

        <div class="card empty">

        هنوز درسی برای این دوره ثبت نشده است.

        </div>

        `;

    }


    for(
        const lesson
        of lessons || []
    ){

        const done =
        completed.has(
            lesson.id
        );


        html += `

        <div class="card lesson">

        <div class="num">

        ${escapeHTML(
            lesson.lesson_number
        )}

        </div>

        <div
        style="flex:1"
        >

        <b>

        ${escapeHTML(
            lesson.title
        )}

        </b>

        <div class="muted">

        ${escapeHTML(
            lesson.description || ""
        )}

        </div>

        </div>

        ${
            done

            ?

            `<span class="badge registered">
            ✓ تکمیل
            </span>`

            :

            ""
        }

        <button
        onclick="openLesson(
            ${lesson.id},
            ${courseId}
        )"
        >

        ${
            done
            ? "مرور"
            : "شروع"
        }

        </button>

        </div>

        `;

    }


    $("course").innerHTML =
    html;

}


/* =====================================================
   OPEN LESSON
===================================================== */

async function openLesson(
    lessonId,
    courseId
){

    const {

        data:
        lesson,

        error

    } = await db
    .from("course_lessons")
    .select("*")
    .eq(
        "id",
        lessonId
    )
    .single();


    if(error){

        alert(
            error.message
        );

        return;

    }


    const {

        data:
        progress

    } = await db
    .from("student_progress")
    .select("*")
    .eq(
        "student_id",
        currentStudent.id
    )
    .eq(
        "lesson_id",
        lessonId
    )
    .maybeSingle();


    showView("lesson");

    showNavigation(true);


    $("lesson").innerHTML = `

    <div class="card">

    <button
    class="secondary"
    onclick="openCourse(${courseId})"
    >
    ← برگشت به درس‌ها
    </button>

    <h2>

    ${escapeHTML(
        lesson.lesson_number
    )}.

    ${escapeHTML(
        lesson.title
    )}

    </h2>

    <p class="muted">

    ${escapeHTML(
        lesson.description || ""
    )}

    </p>

    <hr>

    <div class="content">

    ${escapeHTML(
        lesson.content ||
        "محتوایی برای این درس ثبت نشده است."
    )}

    </div>

    ${
        lesson.video_url

        ?

        `<p>

        <a
        href="${escapeHTML(
            lesson.video_url
        )}"
        target="_blank"
        >

        🎥 مشاهده ویدئو

        </a>

        </p>`

        :

        ""
    }

    <hr>

    <button
    class="ok"
    onclick="completeLesson(
        ${lessonId},
        ${courseId}
    )"
    >

    ${
        progress?.completed

        ?

        "✓ درس تکمیل شده"

        :

        "✅ درس را کامل کردم"
    }

    </button>

    </div>

    `;

}


/* =====================================================
   COMPLETE LESSON
===================================================== */

async function completeLesson(
    lessonId,
    courseId
){

    const {

        error

    } = await db
    .from("student_progress")
    .upsert({

        student_id:
        currentStudent.id,

        lesson_id:
        lessonId,

        completed:
        true,

        progress:
        100,

        completed_at:
        new Date().toISOString()

    },{
        onConflict:
        "student_id,lesson_id"
    });


    if(error){

        alert(
            error.message
        );

        return;

    }


    await openCourse(
        courseId
    );

}


/* =====================================================
   ADMIN
===================================================== */

async function loadAdmin(){

    showView("admin");

    showNavigation(false);


    const {

        data:
        students,

        error

    } = await db
    .from("students")
    .select("*")
    .order(
        "id",
        {
            ascending:false
        }
    );


    if(error){

        $("adminHome").innerHTML = `

        <div class="card msg error">

        ${escapeHTML(
            error.message
        )}

        </div>

        `;

        return;

    }


    const waiting =
    (students || [])
    .filter(
        x => x.status === "waiting"
    );


    const registered =
    (students || [])
    .filter(
        x => x.status === "registered"
    );


    const rejected =
    (students || [])
    .filter(
        x => x.status === "rejected"
    );


    let html = `

    <div class="grid">

    <div class="card stat">

    <h3>
    🟡 در انتظار
    </h3>

    <b>
    ${waiting.length}
    </b>

    </div>


    <div class="card stat">

    <h3>
    👨‍🎓 ثبت‌نام شده
    </h3>

    <b>
    ${registered.length}
    </b>

    </div>


    <div class="card stat">

    <h3>
    ❌ رد شده
    </h3>

    <b>
    ${rejected.length}
    </b>

    </div>

    </div>


    <div class="card">

    <h2>
    🟡 ثبت‌نام‌های در انتظار
    </h2>

    `;


    if(
        waiting.length === 0
    ){

        html += `

        <div class="empty">

        ثبت‌نامی در انتظار تأیید نیست.

        </div>

        `;

    }


    for(
        const student
        of waiting
    ){

        html +=
        adminStudentCard(
            student,
            true
        );

    }


    html += `

    </div>


    <div class="card">

    <h2>
    👨‍🎓 دانش‌آموزان
    </h2>

    `;


    for(
        const student
        of [
            ...registered,
            ...rejected
        ]
    ){

        html +=
        adminStudentCard(
            student,
            false
        );

    }


    if(
        registered.length === 0 &&
        rejected.length === 0
    ){

        html += `

        <div class="empty">

        هنوز دانش‌آموزی وجود ندارد.

        </div>

        `;

    }


    html +=
    "</div>";


    $("adminHome").innerHTML =
    html;

}


/* =====================================================
   ADMIN STUDENT CARD
===================================================== */

function adminStudentCard(
    student,
    actions
){

    return `

    <div class="card">

    <div class="row">

    <div>

    <b>

    ${escapeHTML(
        student.first_name
    )}

    ${escapeHTML(
        student.last_name
    )}

    </b>

    <div class="muted">

    📱
    ${escapeHTML(
        student.phone
    )}

    <br>

    📊 سطح:
    ${escapeHTML(
        student.level || "-"
    )}

    </div>

    </div>


    <span
    class="badge ${escapeHTML(
        student.status
    )}"
    >

    ${escapeHTML(
        student.status
    )}

    </span>

    </div>


    ${
        actions

        ?

        `

        <button
        class="ok"
        onclick="changeStudentStatus(
            ${student.id},
            'registered'
        )"
        >

        ✅ تأیید

        </button>


        <button
        class="bad"
        onclick="changeStudentStatus(
            ${student.id},
            'rejected'
        )"
        >

        ❌ رد

        </button>

        `

        :

        ""

    }

    </div>

    `;

}


/* =====================================================
   CHANGE STUDENT STATUS
===================================================== */

async function changeStudentStatus(
    studentId,
    newStatus
){

    const {

        error

    } = await db
    .from("students")
    .update({

        status:
        newStatus

    })
    .eq(
        "id",
        studentId
    );


    if(error){

        alert(
            error.message
        );

        return;

    }


    await loadAdmin();

}

    await studentHome();

}

}
