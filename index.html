<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%23a855f7"/><stop offset="1" stop-color="%236d28d9"/></linearGradient></defs><rect x="15" y="25" width="70" height="55" rx="6" fill="url(%23g)"/><text x="50" y="62" font-size="28" font-weight="800" text-anchor="middle" fill="white" font-family="Arial">Ali</text></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Lalezar&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-grad-1:#f5f3ff;--bg-grad-2:#ede9fe;--text:#171717;--text-muted:#6b7280;--card-bg:#fff;--card-border:rgba(221,214,254,.5);--card-shadow:0 4px 24px rgba(109,40,217,.06);--primary:#6d28d9;--primary-dark:#4c1d95;--primary-light:#a855f7;--accent-pink:#ec4899;--neon-purple:#a855f7;--neon-pink:#ec4899;--neon-blue:#3b82f6;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--input-bg:#faf9ff;--input-border:#ede9fe}
[data-theme="dark"]{--bg-grad-1:#0f172a;--bg-grad-2:#1e1b4b;--text:#f1f5f9;--text-muted:#94a3b8;--card-bg:#1e293b;--card-border:rgba(109,40,217,.4);--card-shadow:0 4px 24px rgba(0,0,0,.3);--input-bg:#0f172a;--input-border:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 100%);background-attachment:fixed;color:var(--text);padding-bottom:96px;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;transition:all .2s ease}
button:active{transform:scale(.97)}

/* ============ Splash ============ */
.splash{position:fixed;inset:0;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10000;animation:splashOut .6s ease 1.6s forwards}
.splash .logo3d{width:240px;height:240px;animation:logoFloat 2.4s ease-in-out infinite,logoIn .9s cubic-bezier(.2,.8,.2,1)}
.splash .brand{margin-top:20px;font-size:24px;font-weight:800;color:#fff;letter-spacing:1px;text-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeInUp .6s ease .3s both}
.splash .sub{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:5px;margin-top:6px;animation:fadeInUp .6s ease .5s both}
@keyframes logoIn{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ============ Logo 3D ============ */
.logo3d{display:inline-block;position:relative;filter:drop-shadow(0 20px 45px rgba(168,85,247,.55))}
.logo3d svg{display:block;width:100%;height:100%}
.logo3d-sm{width:64px;height:64px}
.logo3d-md{width:120px;height:120px}
.logo3d-lg{width:190px;height:190px}
.logo3d-xl{width:240px;height:240px}

/* ============ Header Buttons ============ */
.header{background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 50%,#a855f7 100%);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 8px 32px rgba(109,40,217,.25);border-bottom:1px solid rgba(255,255,255,.1)}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brandBox{display:flex;align-items:center;gap:12px}
.brandTextBox{display:flex;flex-direction:column}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.2);line-height:1.2}
.logoSub{font-size:9px;opacity:.85;letter-spacing:2px;margin-top:2px}
.headerBtns{display:flex;gap:10px;align-items:center}
.iconBtn{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));color:white;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1;transition:all .3s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.iconBtn:hover{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.2));transform:translateY(-2px) scale(1.05);box-shadow:0 8px 24px rgba(168,85,247,.5),0 0 20px rgba(168,85,247,.4),inset 0 1px 0 rgba(255,255,255,.5);border-color:rgba(255,255,255,.6)}
.iconBtn:active{transform:scale(.95)}
.iconBtn:before{content:"";position:absolute;top:-50%;left:-100%;width:60%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:rotate(25deg);transition:left .6s}
.iconBtn:hover:before{left:200%}
.iconBtn svg{width:20px;height:20px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.iconBtn.logoutBtn{background:linear-gradient(135deg,rgba(239,68,68,.35),rgba(220,38,38,.15));border-color:rgba(252,165,165,.5)}
.iconBtn.logoutBtn:hover{background:linear-gradient(135deg,rgba(239,68,68,.5),rgba(220,38,38,.3));box-shadow:0 8px 24px rgba(239,68,68,.5),0 0 20px rgba(239,68,68,.4)}

.container{max-width:1100px;margin:auto;padding:18px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card-bg);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:var(--card-shadow);border:1px solid var(--card-border)}
.hero{background:linear-gradient(135deg,#312e81 0%,#6d28d9 50%,#a855f7 100%);color:#fff;border-radius:28px;padding:32px;margin-bottom:18px;box-shadow:0 20px 50px rgba(109,40,217,.35);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 60%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.1),transparent 50%);pointer-events:none}
.hero3d:before{width:200px;height:200px;left:-60px;top:-80px;border-radius:50%;background:rgba(255,255,255,.08);position:absolute;content:""}
.hero3d:after{width:280px;height:280px;right:-120px;bottom:-160px;border-radius:50%;background:rgba(255,255,255,.06);position:absolute;content:""}
.hero h1{margin:8px 0;font-size:34px;text-shadow:0 4px 16px rgba(0,0,0,.25);letter-spacing:.5px}
.hero h2{margin:6px 0;font-weight:600}
.hero p{opacity:.9;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.item{background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:20px;transition:all .3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;cursor:pointer}
.item:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--bg-grad-2),transparent);opacity:0;transition:opacity .3s;pointer-events:none}
.item:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(109,40,217,.18);border-color:var(--primary-light)}
.item:hover:before{opacity:.5}
.item>*{position:relative;z-index:1}
.item h3{margin:10px 0 6px;font-size:16px}
.item .muted{margin:6px 0 12px}
.btn{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(109,40,217,.35);transition:all .2s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(109,40,217,.45)}
.btn.full{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.secondary{background:linear-gradient(135deg,var(--bg-grad-2),#ddd6fe);color:#5b21b6;box-shadow:0 4px 14px rgba(167,139,250,.25)}
[data-theme="dark"] .secondary{background:linear-gradient(135deg,#312e81,#4c1d95);color:#e9d5ff}
.success{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 14px rgba(34,197,94,.3)}
.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(239,68,68,.3)}
.warning{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 14px rgba(245,158,11,.3)}
.info{background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 4px 14px rgba(59,130,246,.3)}

/* ============ Neon Icons ============ */
.neonIcon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(109,40,217,.08));position:relative;transition:all .3s ease}
.neonIcon svg{width:30px;height:30px;filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor);transition:all .3s ease}
.neonIcon.purple{color:#a855f7}
.neonIcon.pink{color:#ec4899}
.neonIcon.blue{color:#3b82f6}
.neonIcon.green{color:#22c55e}
.neonIcon.orange{color:#f59e0b}
.neonIcon.red{color:#ef4444}
.neonIcon.cyan{color:#06b6d4}
.neonIcon:hover{transform:translateY(-3px) scale(1.05)}
.neonIcon:hover svg{filter:drop-shadow(0 0 10px currentColor) drop-shadow(0 0 20px currentColor)}
.neonIcon-sm{width:40px;height:40px;border-radius:12px}
.neonIcon-sm svg{width:22px;height:22px}

/* ============ Toast ============ */
.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(400px,90vw)}
.toast{background:var(--card-bg);color:var(--text);padding:14px 18px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);border:1px solid var(--card-border);font-size:14px;font-weight:600;animation:toastIn .4s cubic-bezier(.2,.8,.2,1);pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast.success{border-right:4px solid var(--success)}
.toast.error{border-right:4px solid var(--danger)}
.toast.info{border-right:4px solid var(--info)}
.toast.warning{border-right:4px solid var(--warning)}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}
.skel{background:linear-gradient(90deg,var(--card-border) 25%,var(--input-bg) 50%,var(--card-border) 75%);background-size:200% 100%;animation:skel 1.5s infinite;border-radius:8px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ============ Login ============ */
.login{min-height:100vh;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}
.login:before,.login:after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%)}
.login:before{width:500px;height:500px;top:-200px;left:-200px}
.login:after{width:600px;height:600px;bottom:-300px;right:-300px}
.loginCard{background:rgba(255,255,255,.98);width:min(440px,100%);padding:32px;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.4);position:relative;z-index:1;color:#171717}
.loginLogoWrap{display:flex;justify-content:center;margin-bottom:8px}
.loginBrand{text-align:center;font-size:26px;font-weight:800;background:linear-gradient(135deg,#6d28d9,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:6px 0 4px}
.loginTag{text-align:center;font-size:11px;color:#6b7280;letter-spacing:3px;font-weight:600;margin-bottom:12px}
label{display:block;margin:12px 0 6px;font-weight:700;font-size:13px;color:var(--primary-dark)}
[data-theme="dark"] label{color:#c4b5fd}
input,select,textarea{width:100%;border:2px solid var(--input-border);border-radius:14px;padding:13px;background:var(--input-bg);color:var(--text);outline:none;font-size:14px;transition:all .2s ease}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#7c3aed;background:var(--card-bg);box-shadow:0 0 0 4px rgba(124,58,237,.1)}
.tabs{display:flex;gap:8px;margin:20px 0;background:var(--input-bg);padding:5px;border-radius:16px}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:transparent;font-weight:700;color:var(--text-muted);transition:all .25s ease}
.tab.active{background:var(--card-bg);color:var(--primary);box-shadow:0 2px 10px rgba(109,40,217,.15)}

/* ============ Bottom Nav ============ */
.bottom{position:fixed;bottom:0;left:0;right:0;height:88px;background:var(--card-bg);border-top:1px solid var(--card-border);z-index:200;box-shadow:0 -8px 30px rgba(109,40,217,.08);padding-bottom:env(safe-area-inset-bottom);opacity:.98}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex;padding:6px 4px;overflow-x:auto}
.nav{flex:1;min-width:66px;border:0;background:transparent;padding:8px 2px;color:var(--text-muted);font-size:10px;border-radius:16px;transition:all .2s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav svg{width:24px;height:24px;filter:grayscale(1) opacity(.6);transition:all .3s}
.nav.active svg{filter:drop-shadow(0 0 6px var(--neon-purple)) drop-shadow(0 0 12px var(--neon-purple));color:var(--neon-purple)}
.nav:hover{background:var(--bg-grad-2);color:var(--primary)}
.nav.active{color:var(--primary);font-weight:700;background:var(--bg-grad-2)}

/* ============ Lesson Cards ============ */
.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lesson{background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border:1px solid var(--card-border);border-radius:20px;padding:20px;transition:all .25s;position:relative;overflow:hidden}
.lesson:hover{background:linear-gradient(135deg,var(--bg-grad-1),var(--bg-grad-2));transform:translateY(-3px);box-shadow:0 12px 30px rgba(109,40,217,.15);border-color:#c4b5fd}
.lesson.locked{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fecaca;opacity:.95}
[data-theme="dark"] .lesson.locked{background:linear-gradient(135deg,#1e1b1b,#2a1a1a);border-color:#7f1d1d}
.lesson.locked:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(239,68,68,.15);border-color:#ef4444}
.lesson.locked .lessonNo{background:linear-gradient(135deg,#ef4444,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lockBadge{position:absolute;top:14px;left:14px;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 12px rgba(239,68,68,.4);animation:lockPulse 2.4s ease-in-out infinite}
.lockBadge svg{width:18px;height:18px;color:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
@keyframes lockPulse{0%,100%{box-shadow:0 4px 12px rgba(239,68,68,.4)}50%{box-shadow:0 4px 20px rgba(239,68,68,.75)}}
.lessonNo{font-size:34px;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;font-weight:800}
.tabs2{display:flex;gap:8px;overflow:auto;margin-bottom:18px;padding-bottom:4px}
.tabs2::-webkit-scrollbar{display:none}
.tab2{padding:12px 18px;border:0;border-radius:14px;background:var(--input-bg);white-space:nowrap;font-weight:700;color:var(--text-muted);font-size:13px;transition:all .2s ease}
.tab2.active{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(109,40,217,.35)}
.sec{display:none}
.sec.active{display:block}
.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.word{border:1px solid var(--card-border);background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border-radius:18px;padding:16px;text-align:center;cursor:pointer;transition:all .25s ease}
.word:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 24px rgba(109,40,217,.15);border-color:var(--primary-light)}
.en{direction:ltr;color:var(--primary);font-weight:700;font-size:15px}
.fa{font-size:12px;color:var(--text-muted);margin-top:6px}
.grammar{border:1px solid var(--card-border);background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));padding:20px;border-radius:20px;margin-bottom:14px;line-height:2;box-shadow:var(--card-shadow)}
.grammar h3{margin:0 0 10px;color:var(--primary);font-size:16px;display:flex;align-items:center;gap:8px}
.grammar h3:before{content:"📘";font-size:18px}
.example{direction:ltr;text-align:left;background:linear-gradient(135deg,var(--bg-grad-2),var(--bg-grad-1));border-radius:12px;padding:14px;font-family:'Courier New',Arial,sans-serif;border-right:4px solid #7c3aed;font-size:14px;color:var(--primary-dark);font-weight:700;margin:10px 0}
[data-theme="dark"] .example{color:#c4b5fd}
.option{display:block;width:100%;text-align:right;background:var(--card-bg);border:2px solid var(--input-border);border-radius:16px;padding:16px;margin:9px 0;font-size:15px;font-weight:600;color:var(--text);transition:all .2s ease}
.option:hover:not(:disabled){border-color:var(--primary-light);background:var(--bg-grad-1);transform:translateX(-4px)}
.option.correct{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#22c55e;color:#166534}
.option.wrong{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#ef4444;color:#991b1b}
.feedback{text-align:center;border-radius:16px;padding:16px;margin-top:12px;font-weight:700;font-size:15px}
.ok{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534}
.bad{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b}
.progress{height:10px;background:var(--bg-grad-2);border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light),#ec4899);background-size:200% 100%;transition:width .4s ease;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
.score{font-size:64px;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;text-align:center;line-height:1;margin:10px 0}
.adminRow{border:1px solid var(--card-border);border-radius:18px;padding:16px;margin:10px 0;background:var(--bg-grad-1)}
.muted{font-size:12px;color:var(--text-muted);line-height:1.9}
.teacher{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.teacherBox{background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:1px solid var(--card-border);border-radius:26px;padding:24px;line-height:2}
.teacherAvatar{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,var(--bg-grad-2),#ddd6fe);margin:auto;box-shadow:0 10px 30px rgba(109,40,217,.2);border:4px solid var(--card-bg)}
.profileStat{background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:1px solid var(--card-border);border-radius:20px;padding:18px;text-align:center}
.profileStat b{display:block;font-size:30px;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:6px}
.levelBar{height:14px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin:12px 0}
.levelBar i{display:block;height:100%;background:linear-gradient(90deg,#fff,#fbbf24,#f59e0b);background-size:200% 100%;transition:width .4s ease;animation:shimmer 2s linear infinite;box-shadow:0 0 12px rgba(251,191,36,.6)}
.badge{display:inline-block;padding:9px 14px;margin:5px;border-radius:22px;background:linear-gradient(135deg,var(--bg-grad-2),#ddd6fe);color:var(--primary-dark);font-size:12px;font-weight:700}
[data-theme="dark"] .badge{color:#e9d5ff}
.call{display:block;text-decoration:none;text-align:center;margin:14px 0;background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#fff!important;box-shadow:0 6px 20px rgba(34,197,94,.35)!important}
.request{background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:1px solid var(--card-border);border-radius:22px;padding:18px;margin-top:18px}
.examRow{border:1px solid var(--card-border);border-radius:18px;padding:16px;margin:10px 0;background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg))}

/* ============================================================
   🐧 پنگوئن بامزه AliNagheli English 🐧
   ============================================================ */
.penguinWrap{
  position:fixed;
  bottom:100px;
  right:20px;
  z-index:9998;
  width:110px;
  height:140px;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(0 12px 24px rgba(109,40,217,.4));
  animation:penguinIdle 3s ease-in-out infinite;
}
.penguinWrap:hover{transform:scale(1.08) rotate(-2deg)}
.penguinWrap:active{transform:scale(.95)}
.penguinWrap.hidden{display:none}
.penguinWrap.dragging{animation:none;cursor:grabbing;transition:none}

.penguinBubble{
  position:absolute;
  bottom:100%;
  right:0;
  margin-bottom:10px;
  background:#fff;
  color:#171717;
  padding:12px 16px;
  border-radius:18px;
  border-bottom-right-radius:4px;
  font-size:12px;
  font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.2);
  border:2px solid #ddd6fe;
  max-width:180px;
  min-width:120px;
  line-height:1.6;
  opacity:0;
  visibility:hidden;
  transform:translateY(10px) scale(.8);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  z-index:10;
  direction:rtl;
  text-align:right;
}
.penguinBubble:after{
  content:"";
  position:absolute;
  bottom:-10px;
  right:24px;
  width:0;
  height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:10px solid #fff;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.08));
}
.penguinBubble.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
}
.penguinBubble:before{
  content:"🐧";
  position:absolute;
  top:-14px;
  right:-8px;
  font-size:20px;
  animation:penguinBubbleWiggle .8s ease-in-out infinite;
}
@keyframes penguinBubbleWiggle{
  0%,100%{transform:rotate(-10deg)}
  50%{transform:rotate(10deg)}
}

.penguinBody{
  width:100%;
  height:100%;
  animation:penguinWiggle 2.4s ease-in-out infinite;
  transform-origin:bottom center;
}
@keyframes penguinIdle{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@keyframes penguinWiggle{
  0%,100%{transform:rotate(-3deg)}
  50%{transform:rotate(3deg)}
}

.penguinWrap.jumping{
  animation:penguinJump .7s cubic-bezier(.34,1.56,.64,1);
}
@keyframes penguinJump{
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-40px) scale(1.15) rotate(-8deg)}
  50%{transform:translateY(-50px) scale(1.1) rotate(0deg)}
  70%{transform:translateY(-30px) scale(1.12) rotate(8deg)}
  100%{transform:translateY(0) scale(1) rotate(0deg)}
}

.penguinHeart{
  position:absolute;
  font-size:20px;
  pointer-events:none;
  animation:heartFloat 1.5s ease-out forwards;
  z-index:5;
}
@keyframes heartFloat{
  0%{opacity:0;transform:translateY(0) scale(0)}
  20%{opacity:1;transform:translateY(-10px) scale(1.3)}
  100%{opacity:0;transform:translateY(-80px) scale(.5)}
}

.penguinRestore{
  position:fixed;
  bottom:100px;
  right:20px;
  z-index:9998;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#6d28d9,#a855f7);
  color:#fff;
  border:3px solid #fff;
  box-shadow:0 10px 30px rgba(109,40,217,.5);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  animation:penguinIdle 3s ease-in-out infinite;
}
.penguinRestore.show{display:flex}
.penguinRestore:hover{transform:scale(1.1)}

.penguinClose{
  position:absolute;
  top:-8px;
  left:-8px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:#fff;
  border:2px solid #fff;
  font-size:14px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(239,68,68,.5);
  opacity:0;
  transition:opacity .2s;
  z-index:20;
  line-height:1;
}
.penguinWrap:hover .penguinClose{opacity:1}

@media(max-width:600px){
  .penguinWrap{width:88px;height:112px;bottom:100px;right:12px}
  .penguinBubble{max-width:150px;font-size:11px;padding:10px 12px}
  .penguinRestore{width:48px;height:48px;bottom:100px;right:12px;font-size:24px}
}

@media(min-width:900px){
  .penguinWrap{bottom:110px}
  .penguinRestore{bottom:110px}
}

.convAvatar.e{background:linear-gradient(135deg,#f59e0b,#d97706)}
.convBubble{
  background:var(--card-bg);
  border:1.5px solid var(--card-border);
  border-radius:18px;
  padding:12px 16px;
  max-width:75%;
  cursor:pointer;
  transition:all .25s ease;
  position:relative;
}
.convBubble:hover{
  border-color:var(--primary-light);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(109,40,217,.15);
}
.convBubble.playing{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(168,85,247,.3);
  background:linear-gradient(135deg,#f3e8ff,#ede9fe);
}
[data-theme="dark"] .convBubble.playing{
  background:linear-gradient(135deg,#4c1d95,#5b21b6);
}
.convSpeaker{
  font-size:10px;
  font-weight:800;
  color:var(--primary);
  letter-spacing:.5px;
  margin-bottom:4px;
}
.convEn{
  direction:ltr;
  text-align:left;
  font-size:14px;
  font-weight:700;
  color:var(--text);
  line-height:1.5;
  font-family:'Courier New',monospace;
}
.convFa{
  font-size:12px;
  color:var(--text-muted);
  margin-top:6px;
  line-height:1.7;
  padding-top:6px;
  border-top:1px dashed var(--card-border);
}
.convFa.hidden{
  display:none;
}
.convPlayAll{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:16px 0;
  padding:12px;
  background:var(--bg-grad-1);
  border-radius:16px;
}
.convPlayAll button{
  flex:1;
  min-width:110px;
  padding:10px 14px;
  font-size:12px;
  border-radius:12px;
}

.voiceSettings{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin:12px 0;
  padding:14px;
  background:var(--bg-grad-1);
  border-radius:16px;
  border:1px solid var(--card-border);
}
.voiceSettings label{
  font-size:11px;
  margin:0 0 4px 0;
}
.voiceSettings select{
  padding:8px 10px;
  font-size:12px;
  border-radius:10px;
}

.convQuizBox{
  background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));
  border:2px solid var(--card-border);
  border-radius:24px;
  padding:22px;
  margin-top:16px;
}
.convQuizBox h3{
  margin-top:0;
  color:var(--primary);
}

.convFilters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0;
}
.convFilters input,
.convFilters select{
  padding:10px 14px;
  font-size:13px;
  border-radius:12px;
  border:1.5px solid var(--input-border);
  background:var(--input-bg);
  color:var(--text);
}
.convFilters input{flex:1;min-width:180px}
.convFilters select{min-width:140px}

@media(max-width:600px){
  .convBubble{max-width:82%}
  .convPlayAll button{min-width:0;font-size:11px;padding:9px 8px}
}

@media(min-width:900px){body{padding-bottom:24px}.bottom{top:auto;bottom:20px;left:50%;right:auto;transform:translateX(-50%);width:min(700px,calc(100% - 40px));height:74px;border-radius:22px;border:1px solid var(--card-border);box-shadow:0 12px 40px rgba(109,40,217,.2)}.floatWhats{bottom:110px}}
@media(max-width:600px){.container{padding:12px}.card{padding:18px;border-radius:20px}.hero{padding:24px;border-radius:24px}.hero h1{font-size:26px}.hero h2{font-size:17px}.lessonGrid{grid-template-columns:1fr}.wordGrid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.score{font-size:52px}.loginCard{padding:24px}.landingHero{padding:50px 16px 70px}.logo3d-xl{width:180px;height:180px}.splash .logo3d{width:180px;height:180px}.gameWord{font-size:32px}.gameOptions{grid-template-columns:1fr}.gameEmojiBig{font-size:90px}.dailyTipBox .tipTitle{font-size:24px}}

  moved: false,
  lastMessageIndex: -1,

    ],
    login: [

    ]
  },

  getMessage(category, name) {
    const arr = this.messages[category] || this.messages.idle;
    let idx;
    do {
      idx = Math.floor(Math.random() * arr.length);
    } while (idx === this.lastMessageIndex && arr.length > 1);
    this.lastMessageIndex = idx;
    return arr[idx].replace(/{name}/g, name || "دوست من");
  },

  say(text, duration) {
    if (!this.bubble || this.hidden) return;
    this.bubble.textContent = text;
    this.bubble.classList.add("show");

    clearTimeout(this.bubbleTimer);
    this.bubbleTimer = setTimeout(() => {
      if (this.bubble) this.bubble.classList.remove("show");
    }, duration || 4000);

    if (window.speechSynthesis) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/[🐧🎉💪🔥⭐🚀🏆🎯✨🌟🌱💫📚😍🎊😄🥳📖🌈💡💜🎮🍀💬🎧]/g, ""));
        u.lang = "fa-IR";
        u.rate = 0.95;
        u.pitch = 1.3;
        u.volume = 0.9;
        const voices = speechSynthesis.getVoices();
        const faVoice = voices.find(v => v.lang && v.lang.startsWith("fa"));
        if (faVoice) u.voice = faVoice;
        speechSynthesis.speak(u);
      } catch (e) {}
    }
  },

  jump() {
    if (!this.el) return;
    this.el.classList.remove("jumping");
    void this.el.offsetWidth;
    this.el.classList.add("jumping");
    setTimeout(() => this.el && this.el.classList.remove("jumping"), 700);

    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        if (!this.el) return;
        const heart = document.createElement("div");
        heart.className = "penguinHeart";
        heart.textContent = ["💜", "💖", "⭐", "✨", "🌟"][Math.floor(Math.random() * 5)];
        heart.style.right = (20 + Math.random() * 40) + "px";
        heart.style.bottom = (40 + Math.random() * 30) + "px";
        this.el.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
      }, i * 150);
    }
  },

  handleClick() {
    if (this.moved) {
      this.moved = false;
      return;
    }
    this.jump();
    const name = (window.S && S.student && S.student.first_name) ? S.student.first_name : "دوست من";
    const categories = ["idle", "encourage", "welcome", "correct"];
    const cat = categories[Math.floor(Math.random() * categories.length)];
    const msg = this.getMessage(cat, name);
    setTimeout(() => this.say(msg, 5000), 200);
  },

  hide(e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    if (!this.el) return;
    this.hidden = true;
    this.el.classList.add("hidden");
    const restore = document.getElementById("penguinRestore");
    if (restore) restore.classList.add("show");
    try { localStorage.setItem("AN_PENGUIN_HIDDEN", "1"); } catch (err) {}
  },

  show() {
    this.hidden = false;
    if (this.el) this.el.classList.remove("hidden");
    const restore = document.getElementById("penguinRestore");
    if (restore) restore.classList.remove("show");
    try { localStorage.setItem("AN_PENGUIN_HIDDEN", "0"); } catch (err) {}
    const name = (window.S && S.student && S.student.first_name) ? S.student.first_name : "دوست من";
    setTimeout(() => this.say(this.getMessage("welcome", name), 4500), 300);
  },

  setupDrag() {
    if (!this.el) return;
    const el = this.el;

    const onDown = (e) => {
      if (e.target.classList.contains("penguinClose")) return;
      this.isDragging = true;
      this.moved = false;
      const point = e.touches ? e.touches[0] : e;
      this.dragStartX = point.clientX;
      this.dragStartY = point.clientY;
      const rect = el.getBoundingClientRect();
      this.initialRight = window.innerWidth - rect.right;
      this.initialBottom = window.innerHeight - rect.bottom;
      el.classList.add("dragging");
      clearTimeout(this.hideTimer);
      if (this.bubble) this.bubble.classList.remove("show");
    };

    const onMove = (e) => {
      if (!this.isDragging) return;
      const point = e.touches ? e.touches[0] : e;
      const dx = point.clientX - this.dragStartX;
      const dy = point.clientY - this.dragStartY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) this.moved = true;
      let newRight = this.initialRight - dx;
      let newBottom = this.initialBottom - dy;
      const w = el.offsetWidth;
      const h = el.offsetHeight;
      newRight = Math.max(0, Math.min(window.innerWidth - w, newRight));
      newBottom = Math.max(0, Math.min(window.innerHeight - h, newBottom));
      el.style.right = newRight + "px";
      el.style.bottom = newBottom + "px";
      el.style.left = "auto";
      el.style.top = "auto";
      try {
        localStorage.setItem("AN_PENGUIN_POS", JSON.stringify({ right: newRight, bottom: newBottom }));
      } catch (err) {}
      if (e.cancelable) e.preventDefault();
    };

    const onUp = () => {
      if (!this.isDragging) return;
      this.isDragging = false;
      el.classList.remove("dragging");
      if (!this.moved) {
        this.handleClick();
      }
      setTimeout(() => { this.moved = false; }, 100);
    };

    el.addEventListener("mousedown", onDown);
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onDown, { passive: true });
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("touchend", onUp);
  },

  init() {
    this.el = document.getElementById("penguinWrap");
    this.bubble = document.getElementById("penguinBubble");
    if (!this.el) return;

    try {
      const pos = JSON.parse(localStorage.getItem("AN_PENGUIN_POS") || "null");
      if (pos && typeof pos.right === "number" && typeof pos.bottom === "number") {
        const w = this.el.offsetWidth || 110;
        const h = this.el.offsetHeight || 140;
        const r = Math.max(0, Math.min(window.innerWidth - w, pos.right));
        const b = Math.max(0, Math.min(window.innerHeight - h, pos.bottom));
        this.el.style.right = r + "px";
        this.el.style.bottom = b + "px";
        this.el.style.left = "auto";
        this.el.style.top = "auto";
      }
    } catch (e) {}

    try {
      if (localStorage.getItem("AN_PENGUIN_HIDDEN") === "1") {
        this.hidden = true;
        this.el.classList.add("hidden");
        const restore = document.getElementById("penguinRestore");
        if (restore) restore.classList.add("show");
      }
    } catch (e) {}

    this.setupDrag();

    setTimeout(() => {
      if (this.hidden) return;
      const name = (window.S && S.student && S.student.first_name) ? S.student.first_name : "دوست من";
      this.say(this.getMessage("greeting", name), 5000);
    }, 2500);

    this.startIdleTimer();

    if (window.speechSynthesis) {
      speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
    }
  },

  startIdleTimer() {
    clearInterval(this.hideTimer);
    this.hideTimer = setInterval(() => {
      if (this.hidden) return;
      if (document.hidden) return;
      const active = document.activeElement;
      if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT")) return;
      const name = (window.S && S.student && S.student.first_name) ? S.student.first_name : "دوست من";
      const categories = ["idle", "encourage"];
      const cat = categories[Math.floor(Math.random() * categories.length)];
      this.say(this.getMessage(cat, name), 4500);
    }, 45000);
  }
};

function hidePenguin(e) { Penguin.hide(e); }
function showPenguin() { Penguin.show(); }

       {speaker:"Alicia",en:"Yes, I am. By the way, I'm Alicia.",fa:"بله. راستی، من آلیشا هستم."},
       {speaker:"Adam",en:"I'm Adam. Nice to meet you. Well, have a nice day.",fa:"من آدام هستم. از آشنایی خوشحالم. خب، روز خوبی داشته باشی."},
       {speaker:"Alicia",en:"Thanks. You too.",fa:"ممنون. تو هم همینطور."}
     ]},
    {id:"t1-u2-c1",unit:"Unit 2: In class",lesson:"Lesson A",title:"Who's absent today?",level:"A1",book:"Touchstone 1",
     lines:[
       {speaker:"Miss Nelson",en:"Where's Hiroki? Is he here today?",fa:"هیروکی کجاست؟ امروز اینجاست؟"},
       {speaker:"Alison",en:"No, he's not. Maybe he's at work.",fa:"نه، نیست. شاید سر کاره."},
       {speaker:"Miss Nelson",en:"OK. How about Ellen?",fa:"باشه. الن چطور؟"},
       {speaker:"Alison",en:"I don't know. I think she's sick.",fa:"نمی‌دونم. فکر کنم مریضه."},
       {speaker:"Miss Nelson",en:"Oh. OK. Are Carmen and Suzanna here?",fa:"اوه. باشه. کارمن و سوزان اینجان؟"},
       {speaker:"Alison",en:"No, they're in the cafeteria.",fa:"نه، اونها در کافه‌تریا هستن."},
       {speaker:"Miss Nelson",en:"They're late again. OK. And Nick?",fa:"دوباره دیر کردن. باشه. نیک چطور؟"},
       {speaker:"Alison",en:"He's over there. I think he's asleep!",fa:"اون اونجاست. فکر کنم خوابیده!"}
     ]},
    {id:"t1-u2-c2",unit:"Unit 2: In class",lesson:"Lesson B",title:"What's in your bag?",level:"A1",book:"Touchstone 1",
     lines:[
       {speaker:"Alan",en:"What's this? Laura, is this your cell phone?",fa:"این چیه؟ لورا، این تلفن همراهته؟"},
       {speaker:"Laura",en:"Yes, it is. Thanks. Oh, and these are my headphones.",fa:"بله، هست. ممنون. اوه، و اینا هدفون‌هامه."},
       {speaker:"Alan",en:"They're cool. OK. See you tomorrow. Wait. Is this your bag?",fa:"باحال‌ن. باشه. فردا می‌بینمت. صبر کن. این کیفت هست؟"},
       {speaker:"Laura",en:"Yeah.",fa:"آره."},
       {speaker:"Alan",en:"And are these your keys?",fa:"و اینا کلیدهای تو هستن؟"},
       {speaker:"Laura",en:"Yeah, they are. Wait - my sunglasses?",fa:"آره، هستن. صبر کن - عینک آفتابیم؟"},
       {speaker:"Alan",en:"They're on your head!",fa:"روی سرته!"}
     ]},
    {id:"t1-u2-c3",unit:"Unit 2: In class",lesson:"Lesson C",title:"Asking for help",level:"A1",book:"Touchstone 1",
     lines:[
       {speaker:"Ming-wei",en:"Excuse me, what's the word for this in English?",fa:"ببخشید، این به انگلیسی چی می‌شه؟"},
       {speaker:"Sonia",en:"Highlighter.",fa:"ماژیک فسفری."},
       {speaker:"Ming-wei",en:"Thanks.",fa:"ممنون."},
       {speaker:"Sonia",en:"Sure.",fa:"خواهش می‌کنم."},
       {speaker:"Ming-wei",en:"Uh...how do you spell it?",fa:"اِ... چطور هجی می‌شه؟"},
       {speaker:"Sonia",en:"I don't know. Sorry.",fa:"نمی‌دونم. ببخشید."},
       {speaker:"Ming-wei",en:"That's OK. Thanks anyway. ...Can I borrow a pen, please?",fa:"اشکالی نداره. به هر حال ممنون. ...می‌تونم یه خودکار قرض بگیرم؟"},
       {speaker:"Sonia",en:"Sure. Here you go.",fa:"حتماً. بفرما."},
       {speaker:"Ming-wei",en:"Thank you.",fa:"ممنون."},
       {speaker:"Sonia",en:"You're welcome.",fa:"خواهش می‌کنم."}
     ]},
    {id:"t1-u3-c1",unit:"Unit 3: Favorite people",lesson:"Lesson A",title:"Watching TV",level:"A1",book:"Touchstone 1",
     lines:[
       {speaker:"Zach",en:"Who's that?",fa:"اون کیه؟"},
       {speaker:"Haley",en:"It's Johnny Depp. He's my favorite actor. He's so good-looking! His new movie's great.",fa:"جانی دپه. بازیگر مورد علاقه‌مه. خیلی خوش‌قیافه‌ست! فیلم جدیدش عالیه."},
       {speaker:"Zach",en:"Hmm ... what else is on?",fa:"هوم... چیز دیگه‌ای هم هست؟"},
       {speaker:"Haley",en:"There's a concert. Oh, it's Adele! I love her new album. Her voice is amazing.",fa:"یه کنسرت هست. اوه، آدل هست! آلبوم جدیدش رو دوست دارم. صداش فوق‌العاده‌ست."},
       {speaker:"Zach",en:"Adele?",fa:"آدل؟"},
       {speaker:"Haley",en:"Yeah. She's a famous singer.",fa:"آره. خواننده‌ی معروفیه."},
       {speaker:"Zach",en:"Oh. Um, how about some sports?",fa:"اوه. اِ، یه ورزشی چی؟"}
     ]},
    {id:"t1-u4-c2",unit:"Unit 4: Everyday life",lesson:"Lesson C",title:"At the gym",level:"A1",book:"Touchstone 1",
     lines:[
       {speaker:"Celia",en:"Hi. I see you here all the time. Do you work out every day?",fa:"سلام. می‌بینم همیشه اینجایی. هر روز ورزش می‌کنی؟"},
       {speaker:"Andy",en:"Well, I come here before class.",fa:"خب، قبل از کلاس میام اینجا."},
       {speaker:"Celia",en:"Oh, are you a student?",fa:"اوه، دانشجویی؟"},
       {speaker:"Andy",en:"Yeah. Well, I'm a part-time law student. And I work at a TV station, too.",fa:"آره. خب، من دانشجوی پاره‌وقت حقوق هستم. و در یه ایستگاه تلویزیونی هم کار می‌کنم."},
       {speaker:"Celia",en:"A TV station? Really?",fa:"ایستگاه تلویزیونی؟ واقعاً؟"},
       {speaker:"Andy",en:"Yeah. I'm an intern. So, do you come here every day?",fa:"آره. من کارآموزم. تو هر روز میای اینجا؟"},
       {speaker:"Celia",en:"Uh-huh. I run here from home every morning.",fa:"اِ-هوم. من هر صبح از خونه تا اینجا می‌دوم."},
       {speaker:"Andy",en:"Oh, so do you live around here?",fa:"اوه، پس این اطراف زندگی می‌کنی؟"},
       {speaker:"Celia",en:"No. I live about 10 miles away.",fa:"نه. حدود ۱۰ مایل اون‌طرف‌تر زندگی می‌کنم."},
       {speaker:"Andy",en:"So you run 10 miles a day? Wow!",fa:"پس روزی ۱۰ مایل می‌دوی؟ وای!"}
     ]},
    {id:"t1-u5-c2",unit:"Unit 5: Free time",lesson:"Lesson B",title:"Watching TV",level:"A2",book:"Touchstone 1",
     lines:[
       {speaker:"Eric",en:"This soup is delicious. What's in it? ... Mandy? Mandy!",fa:"این سوپ خوشمزه‌ست. توش چیه؟ ... مندی؟ مندی!"},
       {speaker:"Mandy",en:"I'm sorry, what?",fa:"ببخشید، چی؟"},
       {speaker:"Eric",en:"You know, sometimes I think you watch too much TV.",fa:"می‌دونی، بعضی وقتا فکر می‌کنم زیادی تلویزیون تماشا می‌کنی."},
       {speaker:"Mandy",en:"Oh, I hardly ever watch TV.",fa:"اوه، من به‌ندرت تلویزیون تماشا می‌کنم."},
       {speaker:"Eric",en:"Are you serious?",fa:"جدی میگی؟"},
       {speaker:"Mandy",en:"Well, sometimes I watch the morning shows. And I usually watch the late movie.",fa:"خب، گاهی برنامه‌های صبح رو می‌بینم. و معمولاً فیلم آخر شب رو می‌بینم."},
       {speaker:"Eric",en:"And you always have dinner in front of the TV! I mean, you never talk to me.",fa:"و همیشه جلوی تلویزیون شام می‌خوری! یعنی، هیچ‌وقت با من حرف نمی‌زنی."},
       {speaker:"Mandy",en:"Yes, I do! I talk to you during the commercials.",fa:"چرا، حرف می‌زنم! موقع تبلیغ‌ها با تو حرف می‌زنم."}
     ]},
    {id:"t1-u5-c3",unit:"Unit 5: Free time",lesson:"Lesson C",title:"After class",level:"A2",book:"Touchstone 1",
     lines:[
       {speaker:"Stan",en:"So what do you do after class? Do you go straight home?",fa:"خب بعد از کلاس چیکار می‌کنی؟ مستقیم می‌ری خونه؟"},
       {speaker:"Gabby",en:"Well, usually. Sometimes I meet a friend for dinner.",fa:"خب، معمولاً. گاهی با یه دوست برای شام قرار می‌ذارم."},
       {speaker:"Stan",en:"Oh, where do you go? I mean, do you go somewhere nice?",fa:"اوه، کجا می‌ری؟ یعنی یه جای خوب می‌ری؟"},
       {speaker:"Gabby",en:"Do you know Fabio's? It's OK. I mean, the food's good, and it's cheap, but the service is terrible. Do you know it?",fa:"فابیو رو می‌شناسی؟ بد نیست. یعنی غذا خوبه و ارزون، ولی سرویسش افتضاحه. می‌شناسیش؟"},
       {speaker:"Stan",en:"Well, actually, I work there. I'm a server.",fa:"خب، راستش، من اونجا کار می‌کنم. من پیشخدمتم."}
     ]},
    {id:"t1-u6-c1",unit:"Unit 6: Neighborhoods",lesson:"Lesson A",title:"Talking about Parkview",level:"A2",book:"Touchstone 1",
     lines:[
       {speaker:"Amy",en:"Well, Parkview is convenient. There's a big supermarket and some nice stores, but there's no mall. We need a mall!",fa:"خب، پارک‌ویو راحته. یه سوپرمارکت بزرگ و چند مغازه‌ی خوب داره، ولی مال نداره. ما به یه مال نیاز داریم!"},
       {speaker:"Paul",en:"Um, it's nice. There are two nice outdoor cafés and a couple of movie theaters. There's a new swimming pool in the park - we have a beautiful little park. Yeah, it's good.",fa:"اِ، خوبه. دو تا کافه‌ی روباز خوب و چند سینما داره. یه استخر جدید در پارک هست - یه پارک کوچیک قشنگ داریم. آره، خوبه."},
       {speaker:"Stacy",en:"Parkview is boring! There's no place to go. I mean, there's no mall, no fast-food places - just a lot of expensive restaurants. Oh, and a small park.",fa:"پارک‌ویو خسته‌کننده‌ست! جایی برای رفتن نیست. یعنی، نه مال، نه فست‌فود - فقط یه عالمه رستوران گرون. اوه، و یه پارک کوچیک."}
     ]},
    {id:"t1-u6-c2",unit:"Unit 6: Neighborhoods",lesson:"Lesson B",title:"Making plans",level:"A2",book:"Touchstone 1",
     lines:[
       {speaker:"Kyle",en:"Hey Erin, there's a free concert at the park tonight.",fa:"هی ارین، امشب یه کنسرت رایگان در پارک هست."},
       {speaker:"Erin",en:"Really? That sounds like fun. What time does it start?",fa:"واقعاً؟ به نظر سرگرم‌کننده میاد. چه ساعتی شروع می‌شه؟"},
       {speaker:"Kyle",en:"It starts at 7:30.",fa:"ساعت ۷:۳۰ شروع می‌شه."},
       {speaker:"Erin",en:"Well, let's go. What time is it now?",fa:"خب، بیا بریم. الان ساعت چنده؟"},
       {speaker:"Kyle",en:"Um, it's 5:30. What time do you finish?",fa:"اِ، ساعت ۵:۳۰ هست. تو چه ساعتی تموم می‌کنی؟"},
       {speaker:"Erin",en:"About 6:00. So, let's meet there about 7:00.",fa:"حدود ۶:۰۰. پس بیا حدود ۷:۰۰ اونجا قرار بذاریم."},
       {speaker:"Kyle",en:"Well, they don't usually have a lot of seats, so ...",fa:"خب، معمولاً صندلی زیاد ندارن، پس..."},
       {speaker:"Erin",en:"Oh, well, in that case, let's get there early - say, around 6:45?",fa:"اوه، خب، در این صورت، بیا زودتر بریم - مثلاً حدود ۶:۴۵؟"}
     ]},
    {id:"t1-u6-c3",unit:"Unit 6: Neighborhoods",lesson:"Lesson C",title:"Me too and Me neither",level:"A2",book:"Touchstone 1",
     lines:[
       {speaker:"Omar",en:"What time is it?",fa:"ساعت چنده؟"},
       {speaker:"Carly",en:"11:30. Are you hungry? I'm starving.",fa:"۱۱:۳۰. گرسنه‌ای؟ من دارم از گرسنگی می‌میرم."},
       {speaker:"Omar",en:"Me too. I don't usually have breakfast in the mornings.",fa:"من هم همینطور. معمولاً صبح‌ها صبحانه نمی‌خورم."},
       {speaker:"Carly",en:"No, me neither. Do you know any good places to eat around here?",fa:"نه، من هم همینطور. جای خوبی برای غذا خوردن این اطراف می‌شناسی؟"},
       {speaker:"Omar",en:"Well, there's a new cafe over there. It looks kind of nice.",fa:"خب، یه کافه‌ی جدید اون‌طرفه. به نظر نسبتاً خوب میاد."},
       {speaker:"Carly",en:"Right. But I bet it's expensive. Let's try somewhere else.",fa:"درسته. ولی شرط می‌بندم گرونه. بیا یه جای دیگه رو امتحان کنیم."},
       {speaker:"Omar",en:"I know. But don't worry - it's on me today.",fa:"می‌دونم. ولی نگران نباش - امروز مهمون من."},
       {speaker:"Carly",en:"Oh. Well, in that case, let's go there!",fa:"اوه. خب، در این صورت، بیا بریم اونجا!"}
     ]},
    {id:"t1-u7-c1",unit:"Unit 7: Out and about",lesson:"Lesson A",title:"Weather and activities",level:"A2",book:"Touchstone 1",
     lines:[
       {speaker:"Bill",en:"Hi, it's Bill. Listen, Marcos and I are at the beach in Santa Cruz. Come and join us! Don't worry - we're not swimming. It's too cold and cloudy. See you.",fa:"سلام، بیل هستم. گوش کن، من و مارکوس در ساحل سانتا کروز هستیم. بیا و به ما بپیوند! نگران نباش - ما شنا نمی‌کنیم. هوا خیلی سرد و ابریه. می‌بینمت."}
     ]},
    {id:"t1-u7-c2",unit:"Unit 7: Out and about",lesson:"Lesson A",title:"Ski resort",level:"A2",book:"Touchstone 1",
     lines:[
       {speaker:"Yoko",en:"Hi, Anita. This is Yoko. I'm calling from a ski resort in Lake Tahoe. Lisa and I are skiing today. It's so beautiful here, and there's lots of snow. It's snowing right now. I'm sorry you're working. What's the weather like in San Francisco? Give me a call. Bye.",fa:"سلام، آنیتا. من یوکو هستم. از پیست اسکی در دریاچه تاهو تماس می‌گیرم. من و لیزا امروز اسکی می‌کنیم. اینجا خیلی قشنگه و برف زیادی هست. همین الان داره برف میاد. متأسفم که تو داری کار می‌کنی. هوای سانفرانسیسکو چطوره؟ بهم زنگ بزن. خداحافظ."}
     ]}
  ],

  // ===== TOUCHSTONE 2 =====
  2: [
    {id:"t2-u1-c1",unit:"Unit 1: Making friends",lesson:"Lesson C",title:"Starting a conversation",level:"A2",book:"Touchstone 2",
     lines:[
       {speaker:"Eve",en:"Ooh, it's cold tonight.",fa:"اوه، امشب سرده."},
       {speaker:"Chris",en:"Yeah, it is. But actually, I kind of like cold weather.",fa:"آره، همینطوره. ولی راستش، من هوای سرد رو نسبتاً دوست دارم."},
       {speaker:"Eve",en:"You do? Really? ... Boy, there are a lot of people out here tonight.",fa:"واقعاً؟ ... پسر، امشب آدمای زیادی اینجا بیرونن."},
       {speaker:"Chris",en:"Yeah, it gets pretty crowded on weekends.",fa:"آره، آخر هفته‌ها خیلی شلوغ می‌شه."},
       {speaker:"Eve",en:"Do you come here a lot?",fa:"زیاد میای اینجا؟"},
       {speaker:"Chris",en:"Yeah, I do, actually.",fa:"آره، راستش زیاد میام."},
       {speaker:"Eve",en:"So are you a big hip-hop fan?",fa:"پس طرفدار پروپاقرص هیپ‌هاپی؟"},
       {speaker:"Chris",en:"Yeah, I am. Are you?",fa:"آره، هستم. تو چطور؟"},
       {speaker:"Eve",en:"Actually, no, but my brother's in the band tonight.",fa:"راستش نه، ولی برادرم امشب توی گروه موسیقیه."},
       {speaker:"Chris",en:"Oh, really? Cool. ... By the way, my name's Chris.",fa:"اوه، واقعاً؟ باحال. ... راستی، اسم من کریسه."},
       {speaker:"Eve",en:"Nice to meet you. I'm Eve.",fa:"از آشنایی خوشحالم. من ایو هستم."}
     ]},
    {id:"t2-u2-c1",unit:"Unit 2: Interests",lesson:"Lesson A",title:"Talking about hobbies",level:"A2",book:"Touchstone 2",
     lines:[
       {speaker:"Brad",en:"Well, I enjoy writing. I like to do a bit of creative writing every day - in the evenings mostly.",fa:"خب، من از نوشتن لذت می‌برم. دوست دارم هر روز یه کم نوشته‌ی خلاقانه بنویسم - بیشتر شب‌ها."},
       {speaker:"CN",en:"What else do you enjoy doing in your free time?",fa:"در وقت آزادت از چه کار دیگه‌ای لذت می‌بری؟"},
       {speaker:"Brad",en:"Let's see, what else? Well, I design cards. I'm good at drawing, and I'm really into computer graphics.",fa:"بذار ببینم، چیز دیگه‌ای؟ خب، من کارت طراحی می‌کنم. توی نقاشی خوبم، و خیلی هم به گرافیک کامپیوتری علاقه دارم."},
       {speaker:"CN",en:"Can you play a musical instrument?",fa:"می‌تونی ساز بزنی؟"},
       {speaker:"Brad",en:"Yeah, I play the saxophone, and I can play the piano a little, but not very well.",fa:"آره، ساکسیفون می‌زنم، و یه کم هم پیانو می‌تونم بزنم، ولی خیلی خوب نه."},
       {speaker:"CN",en:"Are you good at sports?",fa:"توی ورزش خوبی؟"},
       {speaker:"Brad",en:"Not really. I prefer to watch sports on TV. I like to play pool. I guess I jog occasionally. But I hate going to the gym and working out.",fa:"نه زیاد. ترجیح می‌دم ورزش رو از تلویزیون تماشا کنم. بیلیارد بازی کردن رو دوست دارم. فکر کنم گاهی هم می‌دوم. ولی از رفتن به باشگاه و ورزش کردن متنفرم."}
     ]},
    {id:"t2-u2-c2",unit:"Unit 2: Interests",lesson:"Lesson B",title:"Talking about music",level:"A2",book:"Touchstone 2",
     lines:[
       {speaker:"Alex",en:"Listen. What do you think of this song?",fa:"گوش کن. این آهنگ رو چطور می‌بینی؟"},
       {speaker:"Carla",en:"It's good - I like it. Who is it?",fa:"خوبه - دوستش دارم. مال کیه؟"},
       {speaker:"Alex",en:"A new band ... some local guys. Do you like them?",fa:"یه گروه جدید... چند تا بچه‌ی محلی. دوستشون داری؟"},
       {speaker:"Carla",en:"They're local? Really? They're pretty good. Who's the lead singer? I like her. She sounds like Mariah Carey.",fa:"محلی‌ن؟ واقعاً؟ خیلی خوبن. خواننده‌ی اصلیش کیه؟ من دوستش دارم. صداش شبیه ماریا کریه."},
       {speaker:"Alex",en:"Yeah, everybody says that. It's my friend Lori.",fa:"آره، همه همین رو می‌گن. دوست من لوریه."},
       {speaker:"Carla",en:"Who's the guy singing with her? I'm not sure about him.",fa:"اون پسری که با اون می‌خونه کیه؟ مطمئن نیستم در موردش."},
       {speaker:"Alex",en:"Uh ... actually, that's me. I'm in the band, too.",fa:"اِ... راستش، اون منم. من هم توی گروه هستم."}
     ]},
    {id:"t2-u3-c1",unit:"Unit 3: Health",lesson:"Lesson A",title:"Staying healthy",level:"A2",book:"Touchstone 2",
     lines:[
       {speaker:"Brian",en:"Well, I generally don't eat a lot of junk food, and I don't eat red meat at all. And right now I'm doing karate. It's getting me in shape quick.",fa:"خب، من معمولاً فست‌فود زیاد نمی‌خورم، و گوشت قرمز اصلاً نمی‌خورم. و همین الآن دارم کاراته تمرین می‌کنم. داره سریع منو خوش‌اندام می‌کنه."},
       {speaker:"Lisa",en:"Not really. I kind of eat everything I want. I don't do anything to stay in shape. I'm just lucky, I guess.",fa:"نه زیاد. تقریباً هر چیزی که بخوام می‌خورم. برای خوش‌اندام موندن کاری نمی‌کنم. فکر کنم فقط شانس آوردم."},
       {speaker:"Mei-ling",en:"Well, I walk everywhere I go because I don't have a car, so I think I get enough exercise.",fa:"خب، من هر جایی که می‌رم پیاده می‌رم چون ماشین ندارم، پس فکر می‌کنم به اندازه‌ی کافی ورزش می‌کنم."},
       {speaker:"Michael",en:"Um ... to be honest, I'm not doing anything right now. I'm studying for exams this month, so I'm eating a lot of snacks, and I'm not getting any exercise at all.",fa:"اِ... راستش رو بخوای، من الآن هیچ کاری نمی‌کنم. این ماه دارم برای امتحان‌ها درس می‌خونم، پس دارم زیاد خوراکی می‌خورم، و اصلاً ورزش نمی‌کنم."},
       {speaker:"The Parks",en:"Yeah, we exercise six days a week. We go swimming every other day, and in between we go to the gym. And once in a while, we go hiking.",fa:"آره، ما هفته‌ای شش روز ورزش می‌کنیم. یک روز درمیون شنا می‌ریم، و بینشون باشگاه می‌ریم. و گاهی هم کوهنوردی می‌ریم."}
     ]},
    {id:"t2-u3-c2",unit:"Unit 3: Health",lesson:"Lesson B",title:"At the doctor",level:"A2",book:"Touchstone 2",
     lines:[
       {speaker:"Nora",en:"Hi, Ken. How are you feeling?",fa:"سلام، کن. حالت چطوره؟"},
       {speaker:"Ken",en:"Awful. I still have this terrible cold.",fa:"افتضاح. هنوز این سرماخوردگی وحشتناک رو دارم."},
       {speaker:"Nora",en:"That's too bad. Are you taking anything for it?",fa:"خیلی بده. چیزی برای درمانش مصرف می‌کنی؟"},
       {speaker:"Ken",en:"Just some cold medicine.",fa:"فقط یه کم داروی سرماخوردگی."},
       {speaker:"Nora",en:"Hmm. I never take that stuff when I have a cold. But if I get a really bad cold, I drink hot vinegar with honey. I can make you some.",fa:"هوم. من هیچ‌وقت وقتی سرما می‌خورم اون داروها رو مصرف نمی‌کنم. ولی اگر سرماخوردگی خیلی بدی بگیرم، سرکه‌ی گرم با عسل می‌خورم. می‌تونم برات درست کنم."},
       {speaker:"Ken",en:"Oh, no thanks! I don't feel that bad!",fa:"اوه، نه ممنون! اونقدرها هم حالم بد نیست!"}
     ]},
    {id:"t2-u4-c1",unit:"Unit 4: Celebrations",lesson:"Lesson A",title:"Talking about birthdays",level:"A2",book:"Touchstone 2",
     lines:[
       {speaker:"Alicia",en:"It's Mom's birthday on the first. Remember? She's going to be 50!",fa:"تولد مامان اول ماهه. یادت هست؟ ۵۰ سالش می‌شه!"},
       {speaker:"Dave",en:"Oh, that's right. What are you going to get her?",fa:"اوه، درسته. چی می‌خوای براش بگیری؟"},
       {speaker:"Alicia",en:"I'm going to buy her something special, like a necklace. Then it's Mom and Dad's anniversary on the tenth.",fa:"می‌خوام یه چیز خاص براش بخرم، مثل یه گردنبند. بعدش سالگرد مامان و بابا دهم ماهه."},
       {speaker:"Dave",en:"Right. We usually give them something.",fa:"درسته. ما معمولاً یه چیزی بهشون می‌دیم."},
       {speaker:"Alicia",en:"We? You mean, I do! Let's, um, send them some flowers.",fa:"ما؟ یعنی من می‌دم! بیا، اِ، چند تا گل براشون بفرستیم."},
       {speaker:"Dave",en:"OK. Then it's my birthday on the twenty-third.",fa:"باشه. بعدش تولد من بیست و سوم ماهه."},
       {speaker:"Alicia",en:"Yeah, I know. I'm going to get you the same thing you got me - nothing!",fa:"آره، می‌دونم. من هم می‌خوام همون چیزی رو بهت بدم که تو به من دادی - هیچی!"}
     ]},
    {id:"t2-u5-c1",unit:"Unit 5: Growing up",lesson:"Lesson A",title:"Childhood memories",level:"A2",book:"Touchstone 2",
     lines:[
       {speaker:"Ramon",en:"That's a great baseball shirt, Ling. Are you from Seattle?",fa:"اون پیراهن بیسبال عالیه، لینگ. اهل سیاتلی؟"},
       {speaker:"Ling",en:"Um, kind of. I lived there, but I wasn't born there.",fa:"اِ، تقریباً. اونجا زندگی کردم، ولی اونجا به دنیا نیومدم."},
       {speaker:"Ramon",en:"Oh, yeah? Where were you born?",fa:"اوه، آره؟ کجا به دنیا اومدی؟"},
       {speaker:"Ling",en:"In Sao Paulo, actually.",fa:"راستش در سائوپائولو."},
       {speaker:"Ramon",en:"Sao Paulo? Brazil?",fa:"سائوپائولو؟ برزیل؟"},
       {speaker:"Ling",en:"Yeah. My parents were born in Hong Kong, but they moved to Sao Paulo just before I was born.",fa:"آره. پدر و مادرم در هنگ‌کنگ به دنیا اومدن، ولی درست قبل از تولد من به سائوپائولو نقل مکان کردن."},
       {speaker:"Ramon",en:"Wow. How long did you live there?",fa:"وای. چند وقت اونجا زندگی کردی؟"},
       {speaker:"Ling",en:"Until I was six. Then we moved to the U.S.",fa:"تا شش سالگی. بعدش اومدیم آمریکا."},
       {speaker:"Ramon",en:"To Seattle?",fa:"سیاتل؟"},
       {speaker:"Ling",en:"Yeah. We lived there for ten years, and we came here to San Francisco about three years ago.",fa:"آره. ده سال اونجا زندگی کردیم، و حدود سه سال پیش اومدیم اینجا سانفرانسیسکو."},
       {speaker:"Ramon",en:"Huh. So did you grow up bilingual?",fa:"هوم. پس دوزبانه بزرگ شدی؟"},
       {speaker:"Ling",en:"Well, we always spoke Chinese at home. I couldn't speak English until I went to school. And actually, I can still speak a little Portuguese.",fa:"خب، ما همیشه در خانه چینی حرف می‌زدیم. تا وقتی به مدرسه رفتم نمی‌تونستم انگلیسی حرف بزنم. و راستش، هنوز هم یه کم پرتغالی می‌تونم حرف بزنم."}
     ]},
    {id:"t2-u6-c1",unit:"Unit 6: Around town",lesson:"Lesson A",title:"Asking for directions",level:"A2",book:"Touchstone 2",
     lines:[
       {speaker:"Driver",en:"Excuse me, could you give me directions to the Rock 'n' Roll Museum?",fa:"ببخشید، می‌تونید مسیر موزه‌ی راک اند رول رو به من بگید؟"},
       {speaker:"Matt",en:"Sure. Go straight ahead for two blocks. You're going to see a ferry terminal. Make a right and go down the street about a block. It's on the left.",fa:"حتماً. دو بلوک مستقیم برید جلو. یه پایانه‌ی کشتی می‌بینید. به راست بپیچید و حدود یه بلوک پایین خیابون برید. سمت چپه."},
       {speaker:"Driver",en:"Are you lost? Can I help you?",fa:"گم شدی؟ می‌تونم کمکت کنم؟"},
       {speaker:"Matt",en:"Yes, thanks. Can you tell me how to get to Panther Stadium?",fa:"بله، ممنون. می‌تونی بهم بگی چطور به ورزشگاه پنتر برم؟"},
       {speaker:"Driver",en:"Sure. Go to the end of this block, and turn right. Walk up two blocks. You can't miss it.",fa:"حتماً. برو ته این بلوک، و به راست بپیچ. دو بلوک بالا برو. نمی‌تونی از دستش بدی."}
     ]},
    {id:"t2-u7-c1",unit:"Unit 7: Going away",lesson:"Lesson B",title:"Packing for a trip",level:"A2-B1",book:"Touchstone 2",
     lines:[
       {speaker:"Mom",en:"Jenny, maybe you should take some insect repellent. Oh, and take a flashlight, and don't forget to pack some spare batteries. Why don't you take my jacket? It's a good idea to have something warm. Now, you need to take a hat. You could borrow your dad's. But don't lose it. Oh, and Jenny, do you want to pack some other shoes?",fa:"جنی، شاید باید یه کم دافع حشرات ببری. اوه، و یه چراغ‌قوه ببر، و یادت نره چند تا باتری یدکی بذاری. چرا ژاکت منو نمی‌بری؟ فکر خوبیه که یه چیز گرم داشته باشی. حالا، باید یه کلاه ببری. می‌تونی کلاه بابات رو قرض بگیری. ولی گمش نکن. اوه، و جنی، می‌خوای کفش دیگه‌ای هم ببری؟"},
       {speaker:"Jenny",en:"I'm sorry, Mom. Did you say something? I can't hear you with my headphones on.",fa:"ببخشید، مامان. چیزی گفتی؟ با هدفون‌هام نمی‌شنوم."}
     ]},
    {id:"t2-u8-c1",unit:"Unit 8: At home",lesson:"Lesson C",title:"Polite requests",level:"A2-B1",book:"Touchstone 2",
     lines:[
       {speaker:"Adam",en:"Hi Lucy! Come on in.",fa:"سلام لوسی! بیا تو."},
       {speaker:"Lucy",en:"Thanks. I brought you some flowers. Are the others here yet?",fa:"ممنون. برات گل آوردم. بقیه اومدن؟"},
       {speaker:"Adam",en:"No, not yet. So just make yourself at home. Thanks for these. Can I take your coat?",fa:"نه، هنوز نه. پس راحت باش. ممنون بابت اینا. می‌تونم کتت رو بگیرم؟"},
       {speaker:"Lucy",en:"Sure. Thanks. This is a great apartment. Do you mind if I look around?",fa:"حتماً. ممنون. آپارتمان عالیه. اشکالی نداره یه نگاهی بندازم؟"},
       {speaker:"Adam",en:"No, go ahead.",fa:"نه، راحت باش."},
       {speaker:"Lucy",en:"Oh, I love this antique table. It's beautiful.",fa:"اوه، این میز عتیقه رو دوست دارم. قشنگه."},
       {speaker:"Adam",en:"Yeah, it's great, but it's not really mine. It's my mother's.",fa:"آره، عالیه، ولی راستش مال من نیست. مال مادرمه."},
       {speaker:"Lucy",en:"Well, she has great taste.",fa:"خب، سلیقه‌ی خوبی داره."},
       {speaker:"Adam",en:"Yeah. Listen, I hate to ask this, but I'm running a bit late. Would you mind helping me in the kitchen?",fa:"آره. گوش کن، بدم میاد اینو بپرسم، ولی یه کم دیرم شده. اشکالی نداره توی آشپزخانه کمکم کنی؟"},
       {speaker:"Lucy",en:"No, not at all. What can I do?",fa:"نه، اصلاً. چیکار می‌تونم بکنم؟"},
       {speaker:"Adam",en:"Well, ... could you chop the onions?",fa:"خب، ... می‌تونی پیازها رو خرد کنی؟"},
       {speaker:"Lucy",en:"No problem. I'm happy to help.",fa:"مشکلی نیست. خوشحالم که کمک می‌کنم."}
     ]},
    {id:"t2-u9-c1",unit:"Unit 9: Things happen",lesson:"Lesson A",title:"Talking about accidents",level:"B1",book:"Touchstone 2",
     lines:[
       {speaker:"Nikki",en:"So, how was your ski trip? Did you have a good time?",fa:"خب، سفر اسکیت چطور بود؟ خوش گذشت؟"},
       {speaker:"George",en:"Yeah, I guess. I sort of had an accident.",fa:"آره، فکر کنم. یه جورایی تصادف کردم."},
       {speaker:"Nikki",en:"Oh, really? What happened? Did you hurt yourself?",fa:"اوه، واقعاً؟ چی شد؟ به خودت آسیب زدی؟"},
       {speaker:"George",en:"Yeah, I broke my leg.",fa:"آره، پام شکست."},
       {speaker:"Nikki",en:"Oh, no! How did it happen? I mean, what were you doing?",fa:"اوه، نه! چطور اتفاق افتاد؟ یعنی داشتی چیکار می‌کردی؟"},
       {speaker:"George",en:"Well, actually, I was talking on my cell phone.",fa:"خب، راستش، داشتم با موبایلم حرف می‌زدم."},
       {speaker:"Nikki",en:"While you were skiing? That's kind of dangerous.",fa:"در حالی که داشتی اسکی می‌کردی؟ این یه کم خطرناکه."},
       {speaker:"George",en:"Yeah, I know. But I was by myself, so I was lucky I had my cell to call for help.",fa:"آره، می‌دونم. ولی تنها بودم، پس شانس آوردم که موبایلم رو داشتم تا کمک بخوام."}
     ]},
    {id:"t2-u10-c1",unit:"Unit 10: Communication",lesson:"Lesson A",title:"Phone conversation",level:"B1",book:"Touchstone 2",
     lines:[
       {speaker:"Nathan",en:"Finally! It's hard to get ahold of you.",fa:"بالاخره! سخت می‌شه بهت دست پیدا کرد."},
       {speaker:"Angela",en:"You're not that easy to reach, either.",fa:"تو هم اونقدرها راحت در دسترس نیستی."},
       {speaker:"Nathan",en:"You spend a lot more time on the phone than I do.",fa:"تو خیلی بیشتر از من وقت تلف صرف می‌کنی."},
       {speaker:"Angela",en:"That's because I get more calls.",fa:"اون به خاطر اینه که من تماس‌های بیشتری می‌گیرم."},
       {speaker:"Nathan",en:"You just talk more! Anyway, I was calling before 'cause my boss had free tickets to the Sting concert tonight.",fa:"تو فقط بیشتر حرف می‌زنی! به هر حال، قبلاً تماس گرفتم چون رئیسم بلیط رایگان برای کنسرت استینگ امشب داشت."},
       {speaker:"Angela",en:"Oh, great! What time?",fa:"اوه، عالی! چه ساعتی؟"},
       {speaker:"Nathan",en:"Well, it's too late now. He gave them to someone else.",fa:"خب، الآن دیگه دیره. اون‌ها رو به یه نفر دیگه داد."},
       {speaker:"Angela",en:"Oh, no! Why didn't you send me a text message?",fa:"اوه، نه! چرا برام پیامک نفرستادی؟"}
     ]}
  ],

    {id:"t3-u1-c1",unit:"Unit 1: The way we are",lesson:"Lesson A",title:"Personality and behavior",level:"B1",book:"Touchstone 3",

       {speaker:"Max",en:"Well, at least he's pleasant.",fa:"خب، حداقل خوش‌برخورده."},

       {speaker:"Max",en:"Yeah. He was pretty bad. He was always talking about people behind their backs.",fa:"آره. اون خیلی بد بود. همیشه پشت سر مردم حرف می‌زد."},
       {speaker:"Ellie",en:"I mean, at least Jim's not like that. But like, he's always wasting time.",fa:"یعنی، حداقل جیم اینطوری نیست. ولی خب، همیشه داره وقت تلف می‌کنه."},
       {speaker:"Max",en:"You mean like we're doing right now?",fa:"منظورت مثل کاریه که الآن داریم می‌کنیم؟"}
     ]},
    {id:"t3-u2-c1",unit:"Unit 2: Experiences",lesson:"Lesson A",title:"Life experiences",level:"B1",book:"Touchstone 3",
     lines:[
       {speaker:"Lea",en:"Have you done anything fun lately?",fa:"اخیراً کار سرگرم‌کننده‌ای کردی؟"},
       {speaker:"Jason",en:"Yeah, we went to a new club called Fizz last week. Have you been there?",fa:"آره، هفته‌ی پیش رفتیم یه کلاب جدید به اسم Fizz. اونجا بودی؟"},
       {speaker:"Lea",en:"No, but I've heard good things about it. How was it?",fa:"نه، ولی تعریفش رو شنیدم. چطور بود؟"},
       {speaker:"Jason",en:"Yeah, it's neat. The DJ was really good. Do you like techno music?",fa:"آره، باحاله. دی‌جی واقعاً خوب بود. موسیقی تکنو دوست داری؟"},
       {speaker:"Lea",en:"Yeah, it's OK, um, not my favorite. I prefer hip-hop.",fa:"آره، بد نیست، اِ، مورد علاقه‌م نیست. هیپ‌هاپ رو ترجیح می‌دم."},
       {speaker:"Jason",en:"Do you? Have you seen that new movie about hip-hop artists?",fa:"واقعاً؟ اون فیلم جدید درباره هنرمندان هیپ‌هاپ رو دیدی؟"},
       {speaker:"Lea",en:"No. Is it good?",fa:"نه. خوبه؟"},
       {speaker:"Jason",en:"Yeah. I've seen it a couple of times.",fa:"آره. چند بار دیدمش."},
       {speaker:"Lea",en:"Have you? Well, I'm kind of in the mood for a movie. Do you want to see it again?",fa:"واقعاً؟ خب، یه جورایی حوصله‌ی فیلم دارم. می‌خوای دوباره ببینیش؟"},
       {speaker:"Jason",en:"Well, I enjoyed it, but ... I've never seen a movie three times!",fa:"خب، لذت بردم، ولی... من هیچ‌وقت یه فیلم رو سه بار ندیدم!"}
     ]},
    {id:"t3-u3-c1",unit:"Unit 3: Wonders of the world",lesson:"Lesson A",title:"Describing places",level:"B1",book:"Touchstone 3",
     lines:[
       {speaker:"Kim",en:"This is the most incredible place!",fa:"این باورنکردنی‌ترین جاست!"},
       {speaker:"Diego",en:"Yeah, it really is. It feels good to be out of the city.",fa:"آره، واقعاً همینطوره. خوبه که از شهر بیرون اومدیم."},
       {speaker:"Kim",en:"It sure does. You know, these trees are just awesome.",fa:"واقعاً همینطوره. می‌دونی، این درختا فوق‌العاده‌ن."},
       {speaker:"Diego",en:"They really are. Have you ever been to Sequoia National Park?",fa:"واقعاً همینطورن. تا حالا پارک ملی سکویا رفتی؟"},
       {speaker:"Kim",en:"No. Have you?",fa:"نه. تو رفتی؟"},

       {speaker:"Diego",en:"Yeah. I had the best time. I mean, it's just the greatest place to hike.",fa:"آره. بهترین وقت رو داشتم. یعنی، بهترین جای دنیا برای پیاده‌رویه."},
       {speaker:"Kim",en:"We should go hiking there sometime.",fa:"باید یه وقت بریم اونجا پیاده‌روی."},
       {speaker:"Diego",en:"You're right. We really should.",fa:"درست میگی. واقعاً باید بریم."}
     ]}

/* ==================== توابع مکالمات ==================== */

let currentConv = null;
let voiceRate = 0.85;
let convAutoPlay = false;

function conversations(){
  render("مکالمات - Conversations",`
    <div class="card">
      <button class="btn secondary" onclick="home()">← بازگشت</button>
      <h2 style="margin-top:14px">💬 مکالمات انگلیسی</h2>
      <p class="muted">مکالمات کاربردی از کتاب‌های Touchstone و Viewpoint — با تلفظ صوتی، ترجمه و آزمون</p>

      <div class="convFilters">
        <input id="convSearch" placeholder="🔍 جستجو در مکالمات..." oninput="filterConversations()">
        <select id="convBook" onchange="filterConversations()">
          <option value="">همه‌ی کتاب‌ها</option>
          <option value="1">Touchstone 1</option>
          <option value="2">Touchstone 2</option>
          <option value="3">Touchstone 3</option>
          <option value="4">Touchstone 4</option>
          <option value="5">Viewpoint 1</option>
          <option value="6">Viewpoint 2</option>
        </select>
        <select id="convLevel" onchange="filterConversations()">
          <option value="">همه‌ی سطوح</option>
          <option value="A1">A1 - مبتدی</option>
          <option value="A2">A2 - پیش‌متوسط</option>
          <option value="B1">B1 - متوسط</option>
          <option value="B2">B2 - متوسط بالا</option>
          <option value="C1">C1 - پیشرفته</option>
        </select>
      </div>

      <div class="convMenuGrid" id="convGrid"></div>
    </div>
  `);
  filterConversations();
}

function filterConversations(){
  const search = (document.getElementById("convSearch")?.value || "").toLowerCase();
  const bookFilter = document.getElementById("convBook")?.value || "";
  const levelFilter = document.getElementById("convLevel")?.value || "";
  const grid = document.getElementById("convGrid");
  if(!grid) return;

  let allConvs = [];
  Object.keys(conversationsData).forEach(bookKey => {
    if(bookFilter && bookFilter !== bookKey) return;
    conversationsData[bookKey].forEach(conv => {
      allConvs.push({...conv, bookKey});
    });
  });

  if(levelFilter){
    allConvs = allConvs.filter(c => c.level && c.level.startsWith(levelFilter));
  }

  if(search){
    allConvs = allConvs.filter(c => 
      c.title.toLowerCase().includes(search) ||
      c.unit.toLowerCase().includes(search) ||
      c.book.toLowerCase().includes(search) ||
      c.lines.some(l => l.en.toLowerCase().includes(search) || l.fa.includes(search))
    );
  }

  if(!allConvs.length){
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px"><p class="muted">مکالمه‌ای پیدا نشد 😕</p></div>`;
    return;
  }

  grid.innerHTML = allConvs.map(c => `
    <div class="convCard" onclick="openConversation('${c.bookKey}','${c.id}')">
      <div class="convBook">${esc(c.book)}</div>
      <h3>${esc(c.title)}</h3>
      <div class="convUnit">${esc(c.unit)} · ${esc(c.lesson)}</div>
      <div class="convMeta">
        <span class="convLines">💬 ${c.lines.length} خط</span>
        <span>🎯 ${esc(c.level)}</span>
      </div>
    </div>
  `).join("");
}

function findConversation(bookKey, convId){
  const arr = conversationsData[bookKey] || [];
  return arr.find(c => c.id === convId);
}

function openConversation(bookKey, convId){
  const conv = findConversation(bookKey, convId);
  if(!conv) { toast("مکالمه پیدا نشد", "error"); return; }
  currentConv = conv;
  renderConversation();
  if(window.Penguin) {
    const name = (S.student && S.student.first_name) ? S.student.first_name : "دوست من";
    setTimeout(() => Penguin.say(Penguin.getMessage("conversation", name), 4000), 500);
  }
}

function renderConversation(){
  const conv = currentConv;
  if(!conv) return;
  const avatarColors = ["a","b","c","d","e"];
  const speakers = [...new Set(conv.lines.map(l => l.speaker))];
  const speakerColors = {};
  speakers.forEach((s, i) => { speakerColors[s] = avatarColors[i % avatarColors.length]; });

  const linesHtml = conv.lines.map((line, idx) => {
    const color = speakerColors[line.speaker];
    const side = idx % 2 === 0 ? "left" : "right";
    const initial = line.speaker.charAt(0).toUpperCase();
    return `
      <div class="convLine ${side}">
        <div class="convAvatar ${color}">${esc(initial)}</div>
        <div class="convBubble" id="bubble-${idx}" onclick="speakLine(${idx})">
          <div class="convSpeaker">${esc(line.speaker)} 🔊</div>
          <div class="convEn">${esc(line.en)}</div>
          <div class="convFa" id="fa-${idx}">${esc(line.fa)}</div>
        </div>
      </div>
    `;
  }).join("");

  render("💬 " + conv.title, `
    <div class="card">
      <button class="btn secondary" onclick="conversations()">← بازگشت به لیست</button>
      <h2 style="margin-top:14px">${esc(conv.title)}</h2>
      <p class="muted">${esc(conv.book)} · ${esc(conv.unit)} · ${esc(conv.lesson)} · سطح: ${esc(conv.level)}</p>
    </div>

    <div class="convBox">
      ${linesHtml}
    </div>

    <div class="convPlayAll">
      <button class="btn" onclick="playAllConversation()">▶️ پخش کل مکالمه</button>
      <button class="btn secondary" onclick="stopSpeaking()">⏹️ توقف</button>
      <button class="btn info" onclick="toggleAllTranslations()" id="toggleTransBtn">👁️ مخفی کردن ترجمه</button>
    </div>

    <div class="voiceSettings">
      <div>
        <label>🎚️ سرعت تلفظ</label>
        <select id="voiceRateSelect" onchange="changeVoiceRate(this.value)">
          <option value="0.6">کند (0.6x)</option>
          <option value="0.75">نسبتاً کند (0.75x)</option>
          <option value="0.85" selected>معمولی (0.85x)</option>
          <option value="1">سریع (1.0x)</option>
        </select>
      </div>
      <div>
        <label>🔊 صدای تلفظ</label>
        <select id="voiceSelect" onchange="changeVoice(this.value)">
          <option value="">پیش‌فرض</option>
        </select>
      </div>
    </div>

    <div class="convQuizBox">
      <h3>📝 آزمون مکالمه</h3>
      <p class="muted">جای خالی را با کلمه‌ی صحیح پر کن</p>
      <div id="convQuizArea"></div>
    </div>
  `);

  // پر کردن لیست صداها
  setTimeout(populateVoices, 200);

  // ساخت آزمون
  buildConversationQuiz(conv);
}

function populateVoices(){
  if(!window.speechSynthesis) return;
  const voices = speechSynthesis.getVoices();
  const enVoices = voices.filter(v => v.lang && v.lang.startsWith("en"));
  const sel = document.getElementById("voiceSelect");
  if(!sel) return;
  sel.innerHTML = `<option value="">پیش‌فرض</option>` + 
    enVoices.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join("");
}

function changeVoice(name){
  window._selectedVoice = name;
}
function changeVoiceRate(rate){
  voiceRate = parseFloat(rate);
}

function getVoice(){
  if(!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices();
  if(window._selectedVoice){
    const v = voices.find(v => v.name === window._selectedVoice);
    if(v) return v;
  }
  return voices.find(v => v.lang && v.lang.startsWith("en") && v.lang.includes("US")) ||
         voices.find(v => v.lang && v.lang.startsWith("en")) || null;
}

function speakLine(idx){
  if(!currentConv) return;
  const line = currentConv.lines[idx];
  if(!line) return;
  
  if(!window.speechSynthesis){
    toast("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند","error");
    return;
  }
  speechSynthesis.cancel();
  
  // حذف هایلایت قبلی
  document.querySelectorAll(".convBubble").forEach(b => b.classList.remove("playing"));
  const bubble = document.getElementById("bubble-" + idx);
  if(bubble) bubble.classList.add("playing");

  const u = new SpeechSynthesisUtterance(line.en);
  u.lang = "en-US";
  u.rate = voiceRate;
  const v = getVoice();
  if(v) u.voice = v;
  u.onend = () => {
    if(bubble) bubble.classList.remove("playing");
    if(convAutoPlay && idx + 1 < currentConv.lines.length){
      setTimeout(() => speakLine(idx + 1), 400);
    } else {
      convAutoPlay = false;
    }
  };
  speechSynthesis.resume();
  speechSynthesis.speak(u);
}

function playAllConversation(){
  if(!currentConv) return;
  convAutoPlay = true;
  speakLine(0);
  toast("پخش مکالمه شروع شد 🎧","info",2000);
}

function stopSpeaking(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  convAutoPlay = false;
  document.querySelectorAll(".convBubble").forEach(b => b.classList.remove("playing"));
}

function toggleAllTranslations(){
  const btn = document.getElementById("toggleTransBtn");
  const allFa = document.querySelectorAll(".convFa");
  const isHidden = allFa[0] && allFa[0].classList.contains("hidden");
  allFa.forEach(el => el.classList.toggle("hidden"));
  if(btn) btn.textContent = isHidden ? "👁️ مخفی کردن ترجمه" : "👁️ نمایش ترجمه";
}

/* ==================== آزمون مکالمه ==================== */
let convQuizData = null;
let convQuizIdx = 0;
let convQuizCorrect = 0;

function buildConversationQuiz(conv){
  const questions = [];
  conv.lines.forEach((line, idx) => {
    // ساخت جای خالی: یک کلمه‌ی مهم را حذف می‌کنیم
    const words = line.en.split(" ");
    if(words.length < 4) return;
    // کلمه‌ی طولانی‌تر از 4 حرف را انتخاب کن
    const candidates = words.map((w,i) => ({w, i})).filter(x => x.w.replace(/[^a-zA-Z]/g,"").length >= 4);
    if(!candidates.length) return;
    const target = candidates[Math.floor(Math.random() * candidates.length)];
    const cleanWord = target.w.replace(/[^a-zA-Z']/g, "");
    if(cleanWord.length < 4) return;
    
    const blanked = words.map((w,i) => i === target.i ? "______" : w).join(" ");
    
    // ساخت گزینه‌های غلط از کلمات دیگر مکالمه
    const allWords = [];
    conv.lines.forEach(l => l.en.split(" ").forEach(w => {
      const cw = w.replace(/[^a-zA-Z']/g, "");
      if(cw.length >= 4 && cw.toLowerCase() !== cleanWord.toLowerCase()) allWords.push(cw);
    }));
    const wrongs = shuffle([...new Set(allWords)]).slice(0, 3);
    if(wrongs.length < 3) return;
    
    const options = shuffle([cleanWord, ...wrongs]);
    questions.push({
      q: blanked,
      options,
      answer: options.indexOf(cleanWord),
      speaker: line.speaker,
      fa: line.fa
    });
  });

  const selected = shuffle(questions).slice(0, 5);
  if(!selected.length){
    const el = document.getElementById("convQuizArea");
    if(el) el.innerHTML = `<p class="muted">آزمونی برای این مکالمه در دسترس نیست.</p>`;
    return;
  }
  convQuizData = selected;
  convQuizIdx = 0;
  convQuizCorrect = 0;
  renderConvQuiz();
}

function renderConvQuiz(){
  const el = document.getElementById("convQuizArea");
  if(!el || !convQuizData) return;
  if(convQuizIdx >= convQuizData.length){
    return showConvQuizResult();
  }
  const q = convQuizData[convQuizIdx];
  el.innerHTML = `
    <div style="margin-bottom:12px">
      <b style="color:var(--primary)">سؤال ${convQuizIdx + 1} از ${convQuizData.length}</b>
      <div class="progress"><i style="width:${(convQuizIdx / convQuizData.length) * 100}%"></i></div>
      <div style="background:var(--bg-grad-1);border-radius:14px;padding:14px;margin:12px 0;direction:ltr;text-align:left;font-family:'Courier New',monospace;font-size:14px;font-weight:700">
        <div style="font-size:10px;color:var(--primary);margin-bottom:6px">${esc(q.speaker)} says:</div>
        ${esc(q.q)}
      </div>
      ${q.options.map((opt, i) => `<button class="option" onclick="answerConvQuiz(${i})">${esc(opt)}</button>`).join("")}
      <div id="convFb"></div>
    </div>
  `;
}

function answerConvQuiz(i){
  const q = convQuizData[convQuizIdx];
  const opts = document.querySelectorAll("#convQuizArea .option");
  opts.forEach(o => o.disabled = true);
  const fb = document.getElementById("convFb");
  if(i === q.answer){
    convQuizCorrect++;
    opts[i].classList.add("correct");
    if(fb){ fb.className = "feedback ok"; fb.innerHTML = "✅ آفرین! درست بود. " + esc(q.fa); }
    if(window.Penguin && S.student){
      const name = S.student.first_name || "دوست من";
      Penguin.jump();
      Penguin.say(Penguin.getMessage("correct", name), 3000);
    }
  } else {
    opts[i].classList.add("wrong");
    opts[q.answer].classList.add("correct");
    if(fb){ fb.className = "feedback bad"; fb.innerHTML = "❌ اشتباه بود. " + esc(q.fa); }
    if(window.Penguin && S.student){
      const name = S.student.first_name || "دوست من";
      Penguin.say(Penguin.getMessage("wrong", name), 3000);
    }
  }
  setTimeout(() => {
    convQuizIdx++;
    renderConvQuiz();
  }, 1500);
}

function showConvQuizResult(){
  const el = document.getElementById("convQuizArea");
  if(!el) return;
  const total = convQuizData.length;
  const percent = Math.round((convQuizCorrect / total) * 100);
  el.innerHTML = `
    <div class="resultBox">
      <div class="score">${percent}%</div>
      <h3 style="text-align:center;margin:10px 0">آزمون مکالمه تمام شد 🎉</h3>
      <p style="text-align:center;color:var(--text-muted)">${convQuizCorrect} پاسخ درست از ${total}</p>
      <button class="btn full" onclick="openConversation('${currentConv?.id?.split('-')[0] === 't1' ? 1 : (currentConv?.id?.split('-')[0] === 't2' ? 2 : (currentConv?.id?.split('-')[0] === 't3' ? 3 : (currentConv?.id?.split('-')[0] === 't4' ? 4 : (currentConv?.id?.split('-')[0] === 'vp1' ? 5 : 6))))}','${currentConv?.id}')">🔁 آزمون مجدد</button>
      <button class="btn secondary full" style="margin-top:8px" onclick="conversations()">مکالمه‌های دیگر</button>
    </div>
  `;
  if(window.Penguin && S.student && percent >= 80){
    const name = S.student.first_name || "دوست من";
    setTimeout(() => {
      Penguin.jump();
      Penguin.say(`آفرین ${name}! مکالمه رو عالی زدی 🏆🎉`, 5000);
    }, 300);
  }
}

const JALALI_MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];

function gregorianToJalali(gy,gm,gd){
 const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
 let jy=(gy<=1600)?0:979;
 gy-=(gy<=1600)?621:1600;
 let gy2=(gm>2)?(gy+1):gy;
 let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g_d_m[gm-1];
 jy+=33*Math.floor(days/12053);
 days%=12053;
 jy+=4*Math.floor(days/1461);
 days%=1461;
 if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
 let jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
 let jd=1+((days<186)?(days%31):((days-186)%30));
 return [jy,jm,jd];
}
function jalaliToGregorian(jy,jm,jd){
 jy+=1595;
 let days=-355668+(365*jy)+Math.floor((jy+3)/4)-Math.floor((jy+99)/100)+Math.floor((jy+399)/400)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
 let gy=400*Math.floor(days/146097);
 days%=146097;
 if(days>36524){
  gy+=100*Math.floor(--days/36524);
  days%=36524;
  if(days>=365){days++;gy+=Math.floor(days/365);days%=365}
 }
 gy+=4*Math.floor(days/1461);
 days%=1461;
 if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
 let gd=days+1;
 const sal_a=[0,31,(gy%4===0&&gy%100!==0)||(gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];
 let gm=0;
 for(gm=0;gm<13;gm++){
  const v=sal_a[gm];
  if(gd<=v)break;
  gd-=v;
 }
 return [gy,gm,gd];
}
function getJalaliMonthDays(jy,jm){
 if(jm<=6)return 31;
 if(jm<=11)return 30;
 const leap=((((jy+2346)%2820)*682)%2816)<682;
 return leap?30:29;
}
function getTodayJalali(){
 const now=new Date();
 return gregorianToJalali(now.getFullYear(),now.getMonth()+1,now.getDate());
}

  const user=session.user;
  if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){S.admin=true;setTimeout(()=>{hideSplash();admin()},1500);return}
  const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle();
  if(st.data&&["registered","approved"].includes(st.data.status)){
   S.student=st.data;
   await loadStudentStats();
   await loadUnlocks();
   loadStreak();loadGameRecords();
   await loadQAs();
   await loadHomeworks();
   setTimeout(()=>{hideSplash();home()},1500);
   return;
  }
  await db.auth.signOut();
  setTimeout(()=>{hideSplash();landing()},1500);
 }catch(e){
  try{await db.auth.signOut()}catch(_){}
  setTimeout(()=>{const sp=document.getElementById("splash");if(sp)sp.style.display="none";landing()},1500);
 }
}
db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT"&&!S.admin&&!S.student)landing()});

/* Service Worker */
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  const swCode=`self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});self.addEventListener("fetch",e=>{});`;
  try{
   const blob=new Blob([swCode],{type:"application/javascript"});
   const url=URL.createObjectURL(blob);
   navigator.serviceWorker.register(url).catch(()=>{});
  }catch(e){}
 });
}

startup();
</script>
