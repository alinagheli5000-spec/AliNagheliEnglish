<script>
const SUPABASE_URL="https://kapzyedzjecnfxevjisq.supabase.co";
const SUPABASE_KEY="sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const STUDENT_ACCESS=SUPABASE_URL+"/functions/v1/student-access";
const STUDENT_REGISTER=SUPABASE_URL+"/functions/v1/student-register";
const ADMIN_ACCESS=SUPABASE_URL+"/functions/v1/admin-access";

let currentStudent=null;
let currentAdminSession=null;

function normalizePhone(v){
 let p=String(v||"")
 .replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776))
 .replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632))
 .replace(/\D/g,"");

 if(p.startsWith("0098")) p="0"+p.slice(4);
 else if(p.startsWith("98")) p="0"+p.slice(2);
 else if(p.startsWith("9")&&p.length===10) p="0"+p;

 return p;
}

function showAuth(type){
 document.getElementById("studentLogin").classList.toggle("hidden",type!=="student");
 document.getElementById("adminLogin").classList.toggle("hidden",type!=="admin");
 document.getElementById("registerBox").classList.toggle("hidden",type!=="register");
}

function message(id,text,error=false){
 const el=document.getElementById(id);
 el.textContent=text;
 el.classList.remove("hidden");
 el.style.background=error?"#fee2e2":"#f3f0ff";
 el.style.color=error?"#991b1b":"#4c1d95";
}

async function callFunction(url,body,token=null){
 const headers={
   "Content-Type":"application/json",
   "apikey":SUPABASE_KEY
 };

 if(token) headers.Authorization="Bearer "+token;

 const response=await fetch(url,{
   method:"POST",
   headers,
   body:JSON.stringify(body)
 });

 let data={};
 try{data=await response.json()}catch(e){}

 return {response,data};
}

/* =========================
   STUDENT LOGIN
========================= */

async function studentLogin(){
 const phone=normalizePhone(document.getElementById("loginPhone").value);
 const password=document.getElementById("loginPassword").value;

 if(!/^09\d{9}$/.test(phone)){
   message("studentMsg","شماره موبایل معتبر نیست.",true);
   return;
 }

 if(!password){
   message("studentMsg","رمز عبور را وارد کنید.",true);
   return;
 }

 message("studentMsg","در حال ورود...");

 try{
   const result=await callFunction(STUDENT_ACCESS,{
     action:"login",
     phone,
     password
   });

   const data=result.data;

   if(!result.response.ok || !data.ok){
     message("studentMsg",data.error||"ورود انجام نشد.",true);
     return;
   }

   currentStudent=data.student;

   if(data.session){
     await supabaseClient.auth.setSession({
       access_token:data.session.access_token,
       refresh_token:data.session.refresh_token
     });
   }

   localStorage.setItem("ali_student",JSON.stringify(currentStudent));

   openStudent();
 }catch(error){
   message("studentMsg","خطا در اتصال به سامانه.",true);
   console.error(error);
 }
}

/* =========================
   STUDENT REGISTER
========================= */

async function registerStudent(){

 const first_name=document.getElementById("regFirst").value.trim();
 const last_name=document.getElementById("regLast").value.trim();
 const phone=normalizePhone(document.getElementById("regPhone").value);
 const level=document.getElementById("regLevel").value;
 const password=document.getElementById("regPassword").value;
 const password2=document.getElementById("regPassword2").value;

 if(!first_name||!last_name){
   message("registerMsg","نام و نام خانوادگی را وارد کنید.",true);
   return;
 }

 if(!/^09\d{9}$/.test(phone)){
   message("registerMsg","شماره موبایل معتبر نیست.",true);
   return;
 }

 if(!level){
   message("registerMsg","پایه تحصیلی را انتخاب کنید.",true);
   return;
 }

 if(password.length<8){
   message("registerMsg","رمز عبور باید حداقل ۸ کاراکتر باشد.",true);
   return;
 }

 if(password!==password2){
   message("registerMsg","تکرار رمز عبور صحیح نیست.",true);
   return;
 }

 message("registerMsg","در حال ثبت‌نام...");

 try{

   const result=await callFunction(STUDENT_REGISTER,{
     first_name,
     last_name,
     phone,
     level,
     password
   });

   const data=result.data;

   if(!result.response.ok || !data.ok){
     message("registerMsg",data.error||"ثبت‌نام انجام نشد.",true);
     return;
   }

   message(
     "registerMsg",
     "ثبت‌نام با موفقیت انجام شد. پس از تأیید مدیر می‌توانید وارد شوید."
   );

   document.getElementById("regFirst").value="";
   document.getElementById("regLast").value="";
   document.getElementById("regPhone").value="";
   document.getElementById("regPassword").value="";
   document.getElementById("regPassword2").value="";

 }catch(error){
   console.error(error);
   message("registerMsg","خطا در اتصال به سامانه.",true);
 }
}

/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin(){

 const email=document.getElementById("adminEmail").value.trim().toLowerCase();
 const password=document.getElementById("adminPassword").value;

 if(!email||!password){
   message("adminMsg","ایمیل و رمز عبور را وارد کنید.",true);
   return;
 }

 message("adminMsg","در حال ورود مدیر...");

 try{

   const result=await callFunction(ADMIN_ACCESS,{
     action:"login",
     email,
     password
   });

   const data=result.data;

   if(!result.response.ok || !data.ok){
     message("adminMsg",data.error||"ورود مدیر انجام نشد.",true);
     return;
   }

   currentAdminSession=data.session;

   if(data.session){
     await supabaseClient.auth.setSession({
       access_token:data.session.access_token,
       refresh_token:data.session.refresh_token
     });
   }

   openAdmin();

 }catch(error){
   console.error(error);
   message("adminMsg","خطا در اتصال به سامانه.",true);
 }
}

/* =========================
   ADMIN PANEL
========================= */

async function openAdmin(){

 document.getElementById("authPage").classList.add("hidden");
 document.getElementById("studentApp").classList.add("hidden");
 document.getElementById("adminApp").classList.remove("hidden");

 await loadAdmin();
}

async function loadAdmin(){

 const content=document.getElementById("adminContent");
 content.innerHTML="<div class='card center'>در حال دریافت اطلاعات...</div>";

 try{

   const token=currentAdminSession?.access_token;

   const result=await callFunction(
     ADMIN_ACCESS,
     {action:"list"},
     token
   );

   const data=result.data;

   if(!result.response.ok || !data.ok){
     content.innerHTML=
       "<div class='card' style='color:#991b1b'>"+
       (data.error||"دسترسی مدیر تأیید نشد.")+
       "</div>";
     return;
   }

   const students=data.students||[];
   const requests=data.requests||[];

   let html=`
   <div class="card">
   <h2>📊 مدیریت زبان‌آموزان</h2>
   <p>تعداد کل: <b>${students.length}</b></p>
   </div>

   <div class="card">
   <h3>⏳ ثبت‌نام‌های در انتظار تأیید</h3>
   `;

   const waiting=students.filter(s=>s.status==="waiting");

   if(!waiting.length){
     html+="<p class='muted'>ثبت‌نام در انتظاری وجود ندارد.</p>";
   }else{

     html+=`<table>
     <tr>
     <th>نام</th>
     <th>موبایل</th>
     <th>پایه</th>
     <th>عملیات</th>
     </tr>`;

     waiting.forEach(s=>{
       html+=`
       <tr>
       <td>${escapeHtml(s.first_name||"")} ${escapeHtml(s.last_name||"")}</td>
       <td>${escapeHtml(s.phone||"")}</td>
       <td>${escapeHtml(s.level||"")}</td>
       <td>
       <button class="success" onclick="changeStudentStatus(${Number(s.id)} ,'approve')">تأیید</button>
       <button class="danger" onclick="changeStudentStatus(${Number(s.id)},'reject')">رد</button>
       </td>
       </tr>`;
     });

     html+="</table>";
   }

   html+="</div>";

   html+=`
   <div class="card">
   <h3>👥 همه زبان‌آموزان</h3>
   <table>
   <tr>
   <th>نام</th>
   <th>موبایل</th>
   <th>پایه</th>
   <th>وضعیت</th>
   </tr>`;

   students.forEach(s=>{
     const status=
       s.status==="registered"?"✅ فعال":
       s.status==="waiting"?"⏳ در انتظار":
       s.status==="rejected"?"❌ رد شده":
       s.status||"";

     html+=`
     <tr>
     <td>${escapeHtml(s.first_name||"")} ${escapeHtml(s.last_name||"")}</td>
     <td>${escapeHtml(s.phone||"")}</td>
     <td>${escapeHtml(s.level||"")}</td>
     <td>${status}</td>
     </tr>`;
   });

   html+="</table></div>";

   content.innerHTML=html;

 }catch(error){
   console.error(error);
   content.innerHTML=
     "<div class='card' style='color:#991b1b'>خطا در دریافت اطلاعات مدیر.</div>";
 }
}

async function changeStudentStatus(id,action){

 if(!currentAdminSession?.access_token){
   alert("نشست مدیر معتبر نیست.");
   return;
 }

 try{

   const result=await callFunction(
     ADMIN_ACCESS,
     {
       action,
       id:Number(id)
     },
     currentAdminSession.access_token
   );

   const data=result.data;

   if(!result.response.ok||!data.ok){
     alert(data.error||"عملیات انجام نشد.");
     return;
   }

   await loadAdmin();

 }catch(error){
   console.error(error);
   alert("خطا در انجام عملیات.");
 }
}

/* =========================
   PLACEMENT TEST
========================= */

const placementQuestions=[
 ["I ___ a student.","am","is","are","A"],
 ["She ___ my sister.","is","are","am","A"],
 ["They ___ happy.","are","is","am","A"],
 ["He ___ English every day.","studies","study","studying","A"],
 ["We ___ football yesterday.","played","play","playing","A"],
 ["I have lived here ___ 2020.","since","for","from","B"],
 ["If I ___ time, I will help you.","have","had","having","B"],
 ["She has ___ finished her work.","already","yet","ever","B"],
 ["He was tired because he ___ all day.","had worked","works","is working","B"],
 ["This book is ___ than that one.","more interesting","most interesting","interesting","B"],
 ["By next year, I ___ my degree.","will have completed","complete","completed","C"],
 ["Had I known, I ___ you.","would have told","tell","will tell","C"]
];

function placement(){

 let html=`
 <div class="card">
 <button class="btn2" onclick="openStudent()">← بازگشت</button>
 <h2>📝 آزمون تعیین سطح</h2>
 <p>بهترین گزینه را انتخاب کنید.</p>
 </div>`;

 placementQuestions.forEach((q,i)=>{
   html+=`
   <div class="card">
   <b>${i+1}. ${q[0]}</b><br><br>
   <label><input type="radio" name="q${i}" value="0"> ${q[1]}</label><br>
   <label><input type="radio" name="q${i}" value="1"> ${q[2]}</label><br>
   <label><input type="radio" name="q${i}" value="2"> ${q[3]}</label>
   </div>`;
 });

 html+=`
 <div class="card">
 <button class="btn" style="width:100%" onclick="finishPlacement()">مشاهده نتیجه</button>
 </div>`;

 document.getElementById("studentContent").innerHTML=html;
}

function finishPlacement(){

 let score=0;

 placementQuestions.forEach((q,i)=>{
   const answer=document.querySelector(`input[name="q${i}"]:checked`);
   if(answer&&Number(answer.value)===0)score++;
 });

 const percent=Math.round(score/placementQuestions.length*100);

 let level=
   percent<30?"A1":
   percent<50?"A2":
   percent<70?"B1":
   percent<85?"B2":
   percent<95?"C1":"C2";

 document.getElementById("studentContent").innerHTML=`
 <div class="card center">
 <div style="font-size:60px">🎉</div>
 <h2>نتیجه آزمون</h2>
 <h1>${level}</h1>
 <p>سطح تقریبی شما بر اساس CEFR</p>
 <p>امتیاز: ${score} از ${placementQuestions.length}</p>
 <p>${percent}%</p>
 <button class="btn" onclick="lessons()">ادامه آموزش</button>
 </div>`;
}

async function logout(){

 try{
   await supabaseClient.auth.signOut();
 }catch(e){}

 currentStudent=null;
 currentAdminSession=null;

 localStorage.removeItem("ali_student");

 document.getElementById("studentApp").classList.add("hidden");
 document.getElementById("adminApp").classList.add("hidden");
 document.getElementById("authPage").classList.remove("hidden");

 showAuth("student");
}

/* =========================
   SPEECH
========================= */

function speak(text){

 if(!window.speechSynthesis){
   alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
   return;
 }

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="en-US";
 utterance.rate=.75;

 speechSynthesis.resume();
 speechSynthesis.speak(utterance);
}

/* =========================
   SECURITY / HELPERS
========================= */

function escapeHtml(value){
 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

/* =========================
   STARTUP
========================= */

async function startup(){

 const saved=localStorage.getItem("ali_student");

 if(saved){
   try{
     const student=JSON.parse(saved);

     if(student&&student.phone){
       const phone=normalizePhone(student.phone);

       const result=await callFunction(STUDENT_ACCESS,{
         action:"find",
         phone
       });

       if(result.data?.ok&&result.data.student){

         if(result.data.student.status==="registered"){
           currentStudent=result.data.student;
           openStudent();
           return;
         }

       }

       localStorage.removeItem("ali_student");
     }
   }catch(e){
     localStorage.removeItem("ali_student");
   }
 }

 showAuth("student");
}

startup();
</script>
