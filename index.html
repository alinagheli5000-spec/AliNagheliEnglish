function esc(x){
return String(x??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

function save(){

function speak(text){
if(!window.speechSynthesis){
alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
return;
}
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(text);
u.lang="en-US";
u.rate=.75;
speechSynthesis.resume();
speechSynthesis.speak(u);
}

function normalizePhone(x){
return String(x||"").replace(/\D/g,"");
}

function emailVariants(phone){
const raw=String(phone||"").trim();
const d=normalizePhone(raw);
const a=[];
function add(x){if(x&&!a.includes(x))a.push(x)}
add(raw);
add(d);
if(d.startsWith("0"))add(d.slice(1));
else if(d.startsWith("98"))add("0"+d.slice(2));
return a;
}

/* =========================================================
   IMPORTANT STUDENT LOGIN
   First find the student in DB.
   Then use the REAL login_email stored for that student.
========================================================= */

async function studentLogin(){

const phone=document.getElementById("phone").value.trim();
const password=document.getElementById("pass").value;

if(!phone||!password){
alert("شماره تلفن و رمز عبور را وارد کنید.");
return;
}

let student=null;

const variants=emailVariants(phone);

/* Exact phone search */
for(const p of variants){

const r=await db
.from("students")
.select("*")
.eq("phone",p)
.maybeSingle();

if(r.data){
student=r.data;
break;
}
}

/* If exact search failed, compare normalized numbers */
if(!student){

const r=await db
.from("students")
.select("*");

if(!r.error){

student=(r.data||[]).find(x=>
normalizePhone(x.phone)===normalizePhone(phone)
);
}
}

if(!student){
alert("زبان‌آموزی با این شماره پیدا نشد.");
return;
}

if(student.status==="rejected"){
alert("ثبت‌نام شما توسط مدیر رد شده است.");
return;
}

if(student.status!=="registered"&&student.status!=="approved"){
alert("ثبت‌نام شما هنوز توسط مدیر تأیید نشده است.");
return;
}

/*
Do NOT construct the email from phone.
Use the actual email stored in students.
*/
let email=String(student.login_email||"").trim();

if(!email){

/*
Fallback for old records.
*/
const digits=normalizePhone(student.phone);

const candidates=[
student.phone+"@alinagheli.com",
digits+"@alinagheli.com",
(digits.startsWith("0")?digits.slice(1):digits)+"@alinagheli.com"
];

email=candidates[0];
}

/* Try actual DB login email first */
let auth=await db.auth.signInWithPassword({
email,
password
});

if(auth.error){

/*
Compatibility fallback:
some old records have their auth email different from
login_email. We try the known historical forms.
*/
const candidates=[];

function add(x){
if(x&&!candidates.includes(x))candidates.push(x);
}

add(student.login_email);
add(student.phone+"@alinagheli.com");

const d=normalizePhone(student.phone);

add(d+"@alinagheli.com");

if(d.startsWith("0"))
add(d.slice(1)+"@alinagheli.com");

for(const e of candidates){

if(!e)continue;

auth=await db.auth.signInWithPassword({
email:e,
password
});

if(!auth.error){
email=e;
break;
}
}

if(auth.error){
alert("ورود ناموفق بود.\n\nایمیل Auth این زبان‌آموز: "+(student.login_email||"ثبت نشده")+
"\n\nپیغام Supabase: "+auth.error.message);
return;
}
}

S.student=student;
S.admin=false;

home();
}

function registerForm(){

document.getElementById("lf").innerHTML=`
<h3>ثبت‌نام جدید</h3>

<label>نام</label>

<input id="rl">

onclick="login()">بازگشت</button>`;

async function register(){

const first=document.getElementById("rf").value.trim();
const last=document.getElementById("rl").value.trim();
const phone=document.getElementById("rp").value.trim();
const password=document.getElementById("rpass").value;
const level=document.getElementById("rlevel").value.trim();

if(!first||!last||!phone||!password){
alert("همه موارد را تکمیل کنید.");
return;
}

if(password.length<6){
alert("رمز عبور حداقل ۶ کاراکتر باشد.");
return;
}

const email=normalizePhone(phone)+"@alinagheli.com";

const r=await db.auth.signUp({
email,
password,
options:{
data:{
first_name:first,
last_name:last,
phone,
level
}
}
});

if(r.error){
alert("خطای ثبت‌نام: "+r.error.message);
return;
}

if(!r.data.user){
alert("ثبت‌نام انجام نشد.");
return;
}

const ins=await db.from("students").insert({
first_name:first,
last_name:last,
phone,
level,
status:"waiting",
auth_user_id:r.data.user.id,
password_created:true,
login_email:email
});

if(ins.error){
alert("حساب ساخته شد اما اطلاعات دانش‌آموز ذخیره نشد:\n"+ins.error.message);
return;
}

await db.auth.signOut();

alert("ثبت‌نام انجام شد. پس از تأیید مدیر می‌توانید وارد شوید.");
login();
}

function grammarExplanation(title){

const explanations={
"Simple Present":
"زمان حال ساده برای بیان عادت‌ها، کارهای تکراری، واقعیت‌ها و برنامه‌های معمول استفاده می‌شود. در جمله مثبت با I, you, we و they شکل پایه فعل را به کار می‌بریم؛ اما با he, she و it معمولاً s یا es به فعل اضافه می‌شود. برای سؤال و منفی معمولاً از do و does استفاده می‌کنیم.",
"Present Continuous":
"حال استمراری برای کاری استفاده می‌شود که در زمان صحبت در حال انجام است یا وضعیت موقتی دارد. ساختار اصلی آن شامل فعل be یعنی am, is یا are به اضافه فعل دارای ing است. انتخاب am, is و are به فاعل جمله بستگی دارد.",
"have / has":
"برای بیان مالکیت یا داشتن چیزی از have و has استفاده می‌کنیم. با I, you, we و they از have و با he, she و it از has استفاده می‌شود.",
"There is / There are":
"There is برای یک اسم مفرد و there are برای اسم جمع استفاده می‌شود. این ساختار زمانی به کار می‌رود که بخواهیم وجود شخص یا چیزی را در یک مکان بیان کنیم.",
"Can":
"Can برای بیان توانایی، امکان یا درخواست استفاده می‌شود. بعد از can فعل بدون to و به شکل پایه می‌آید و برای همه فاعل‌ها شکل can ثابت می‌ماند.",
"صفات":
"صفت کلمه‌ای است که ویژگی یا حالت یک اسم را بیان می‌کند. در انگلیسی معمولاً صفت پیش از اسم می‌آید، اما بعد از فعل‌هایی مانند be نیز می‌تواند قرار بگیرد.",
"ضمیرهای فاعلی و فعل to be":
"ضمیر فاعلی جایگزین اسم می‌شود و نشان می‌دهد چه کسی یا چه چیزی انجام‌دهنده یا موضوع جمله است. فعل be در زمان حال به شکل am، is و are ظاهر می‌شود و انتخاب آن به فاعل بستگی دارد."
};

return explanations[title]||
"در این بخش ابتدا معنی و کاربرد ساختار را یاد بگیر، سپس به شکل جمله توجه کن. جایگاه فاعل، فعل و سایر اجزای جمله را بررسی کن و مثال را با صدای بلند تکرار کن. بعد چند جمله جدید با همان الگو بساز تا ساختار در ذهن تثبیت شود.";
}

function lessonTab(n){

document.querySelectorAll(".sec").forEach((x,i)=>{
x.classList.toggle("active",i===n);
});

document.querySelectorAll(".tab2").forEach((x,i)=>{
x.classList.toggle("active",i===n);
});

if(n===2)startLessonQuiz();
}

function makeLessonQuestions(){

const no=S.lesson+1;
let arr=[];

(words[no]||[]).forEach((w,i)=>{
const a=words[no];
arr.push({
q:`معنی "${w[0]}" چیست؟`,
options:[w[1],a[(i+1)%a.length][1],a[(i+2)%a.length][1]],
answer:0
});
});

(grammar[no]||[]).forEach(g=>{
arr.push({
q:`کدام گزینه با ${g[0]} هماهنگ است؟`,
options:[g[1],"She are student.","They is happy."],
answer:0
});
});

return arr.slice(0,15);
}

function startLessonQuiz(){

S.quiz={
type:"lesson",
title:`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
questions:makeLessonQuestions(),
i:0,
correct:0,
wrong:0
};

quizRender("lessonQuiz");
}

function quizRender(id){

const q=S.quiz.questions[S.quiz.i];

if(!q){
quizFinish(id);
return;
}

const el=document.getElementById(id);
if(!el)return;

el.innerHTML=`
<div class="card">

<b>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>

<div class="progress">
<i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i>
</div>

<div style="font-size:18px;font-weight:bold;line-height:2;margin:15px 0">
${esc(q.q)}
</div>

${q.options.map((x,i)=>`
<button class="option" onclick="answer(${i},'${id}')">
${esc(x)}
</button>`).join("")}

<div id="fb"></div>

</div>`;
}

function answer(i,id){

const q=S.quiz.questions[S.quiz.i];
const opts=document.querySelectorAll(".option");

opts.forEach(x=>x.disabled=true);

if(i===q.answer){

S.quiz.correct++;
opts[i].classList.add("correct");

document.getElementById("fb").className="feedback ok";
document.getElementById("fb").innerHTML="✅ 😊 آفرین! پاسخ درست است.";

}else{

S.quiz.wrong++;
opts[i].classList.add("wrong");
opts[q.answer].classList.add("correct");

document.getElementById("fb").className="feedback bad";
document.getElementById("fb").innerHTML="❌ 😢 پاسخ اشتباه است.";
}

setTimeout(()=>{
S.quiz.i++;
quizRender(id);
},1000);
}

function quizFinish(id){

const total=S.quiz.questions.length;
const percent=total?Math.round(S.quiz.correct/total*100):0;

examRecords.push({
student:S.student?.phone||"",
title:S.quiz.title,
score:percent,
date:new Date().toISOString()
});

save();

const el=document.getElementById(id);
if(!el)return;

el.innerHTML=`
<div class="card">
<div class="score">${percent}%</div>
<h2 style="text-align:center">آزمون تمام شد 🎉</h2>
<p style="text-align:center">
${S.quiz.correct} پاسخ درست از ${total}
</p>
</div>`;
}

async function approve(id){

const r=await db
.from("students")
.update({status:"registered"})
.eq("id",id);

if(r.error){
alert(r.error.message);
return;
}

admin();
}

async function rejectStudent(id){

const r=await db
.from("students")
.update({status:"rejected"})
.eq("id",id);

if(r.error){
alert(r.error.message);
return;
}

admin();
}

========================================================= */

async function logout(){

await db.auth.signOut();

S={
student:null,
admin:false,
grade:null,
lesson:null,
quiz:null
};

login();
}

async function startup(){

const r=await db.auth.getSession();
const session=r.data?.session;

if(!session){
login();
return;
}

const user=session.user;

if((user.email||"").toLowerCase()==="alinagheli@gmail.com"){

S.admin=true;
admin();
return;
}

const st=await db
.from("students")
.select("*")
.eq("auth_user_id",user.id)
.maybeSingle();

if(
st.data &&
(st.data.status==="registered"||st.data.status==="approved")
){

S.student=st.data;
home();
return;
}

await db.auth.signOut();
login();
}

startup();
</script>
