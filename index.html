<head>

<style>
*{box-sizing:border-box}
:root{
  --p:#6d28d9;--p2:#8b5cf6;--bg:#f7f5ff;--card:#fff;

}
body{

}
button,input{font-family:inherit}
.app{max-width:650px;margin:auto;min-height:100vh;padding-bottom:82px}
.hidden{display:none!important}
.top{
  padding:24px 18px 12px;

  box-shadow:0 8px 25px #6d28d933
}
.brand{
  text-align:center;font-size:28px;font-weight:900;

  text-shadow:2px 3px 0 #3b0764,4px 6px 12px #21004488
}
.subtitle{text-align:center;margin-top:6px;opacity:.9}
.content{padding:18px}
.card{
  background:var(--card);border-radius:22px;padding:18px;
  margin-bottom:16px;box-shadow:0 5px 20px #4c1d9512;
  border:1px solid #eee8ff
}
h1,h2,h3{margin-top:0}
.btn{
  width:100%;border:0;border-radius:15px;padding:14px;
  font-size:15px;font-weight:bold;cursor:pointer;margin-top:9px
}
.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.secondary{background:#f0eaff;color:#5b21b6}

.disabled{opacity:.45;cursor:not-allowed}
input{

}
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px

.login-box{

}
.login-logo{text-align:center;font-size:32px;font-weight:900;color:#6d28d9;
text-shadow:2px 3px 0 #ddd0ff;margin-bottom:7px}
.login-sub{text-align:center;color:var(--muted);margin-bottom:24px}
.login-option{
  border:0;width:100%;padding:17px;margin:7px 0;border-radius:18px;
  color:white;font-weight:bold;font-size:16px;cursor:pointer;

  background:linear-gradient(135deg,#ede9fe,#faf5ff);
  border-radius:22px;padding:20px;margin-bottom:16px
}
.word{
  font-size:30px;font-weight:900;color:#6d28d9;
  text-align:center;cursor:pointer
}
.translation{text-align:center;color:var(--muted);margin-top:6px}
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(650px,100%);height:76px;background:#fff;
  display:flex;justify-content:space-around;align-items:center;
  box-shadow:0 -8px 25px #4c1d9515;z-index:50
}
.nav button{
  border:0;background:none;color:#82778f;font-size:11px;

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.course{

.word-card{

.exam-q{

}

table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #eee;text-align:center}
.status{
  display:inline-block;padding:5px 9px;border-radius:20px;
  background:#fef3c7;color:#92400e;font-size:12px
}
.approved{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#991b1b}

<body>

    <button onclick="go('teacher')" id="n-teacher"><b>👨‍🏫</b>معرفی استاد</button>
  </nav>
</div>

<script>
/* =========================
   SUPABASE
========================= */
const SUPABASE_URL="https://kapzyedzjecnfxevjisq.supabase.co";

/* کلید معتبر پروژه از خود Supabase */
const SUPABASE_KEY="sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

let currentUser=null;
let currentRole=null;
let currentLesson=null;
let examAnswers=[];
let examIndex=0;
let examScore=0;

/* =========================
   SUPABASE REQUEST
========================= */
async function sb(path,options={}){
  const headers={
    "apikey":SUPABASE_KEY,
    "Content-Type":"application/json",
    ...(options.headers||{})
  };

  if(localStorage.getItem("sb_token"))
    headers["Authorization"]="Bearer "+localStorage.getItem("sb_token");

  const res=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    ...options,headers
  });

  const text=await res.text();
  let data=null;
  try{data=text?JSON.parse(text):null}catch(e){data=text}

  if(!res.ok) throw new Error(data?.message||data?.error_description||data?.error||"خطا در اتصال به سامانه");
  return data;
}

/* =========================
   AUTH
========================= */
function showLogin(type){
  const f=document.getElementById("loginForm");
  f.classList.remove("hidden");

  if(type==="manager"){
    f.innerHTML=`
      <hr>
      <h3>👨‍💼 ورود مدیر</h3>
      <input id="loginEmail" placeholder="ایمیل مدیر">
      <input id="loginPass" type="password" placeholder="رمز عبور">
      <button class="btn primary" onclick="managerLogin()">ورود به پنل مدیریت</button>
      <button class="btn secondary" onclick="hideForm()">بازگشت</button>
      <div id="loginMsg"></div>`;
  }else{
    f.innerHTML=`
      <hr>
      <h3>🎓 ورود زبان‌آموز</h3>
      <input id="studentPhone" placeholder="شماره موبایل">
      <input id="studentPass" type="password" placeholder="رمز عبور">
      <button class="btn primary" onclick="studentLogin()">ورود به سامانه</button>
      <button class="btn secondary" onclick="hideForm()">بازگشت</button>
      <div id="loginMsg"></div>`;
  }
}

function hideForm(){
  document.getElementById("loginForm").classList.add("hidden");
}

async function managerLogin(){
  const email=document.getElementById("loginEmail").value.trim();
  const pass=document.getElementById("loginPass").value;

  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({email,password:pass})
    });

    const d=await r.json();
    if(!r.ok) throw new Error(d.error_description||d.msg||"ایمیل یا رمز عبور نادرست است");

    localStorage.setItem("sb_token",d.access_token);
    currentUser=d.user;
    currentRole="manager";
    openApp();
    renderManager();
  }catch(e){
    document.getElementById("loginMsg").innerHTML=
      `<p style="color:#dc2626">${e.message}</p>`;
  }
}

async function studentLogin(){
  const phone=document.getElementById("studentPhone").value.trim();
  const pass=document.getElementById("studentPass").value;

  try{
    const rows=await sb(
      "students?select=*&phone=eq."+encodeURIComponent(phone)+"&limit=1"
    );

    if(!rows.length)
      throw new Error("این شماره در سامانه پیدا نشد.");

    const s=rows[0];

    if(s.status!=="registered")
      throw new Error("ثبت‌نام شما هنوز توسط مدیر تأیید نشده است.");

    if(!s.auth_user_id)
      throw new Error("حساب کاربری شما هنوز فعال نشده است.");

    const email=s.auth_email || (phone+"@alinagheli.com");

    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({email,password:pass})
    });

    const d=await r.json();

    if(!r.ok)
      throw new Error(d.error_description||d.msg||"شماره موبایل یا رمز عبور نادرست است.");

    localStorage.setItem("sb_token",d.access_token);
    currentUser=d.user;
    currentRole="student";
    currentUser.student=s;
    openApp();
    go("home");
  }catch(e){
    document.getElementById("loginMsg").innerHTML=
      `<p style="color:#dc2626">${e.message}</p>`;
  }
}

/* =========================
   REGISTER
========================= */
function showRegister(){
  const f=document.getElementById("loginForm");
  f.classList.remove("hidden");
  f.innerHTML=`
    <hr>
    <h3>📝 ثبت‌نام زبان‌آموز جدید</h3>
    <input id="regFirst" placeholder="نام">
    <input id="regLast" placeholder="نام خانوادگی">
    <input id="regPhone" placeholder="شماره موبایل">
    <input id="regLevel" placeholder="سطح فعلی (مثلاً A1)">
    <input id="regPass" type="password" placeholder="رمز عبور پیشنهادی">
    <button class="btn primary" onclick="registerStudent()">ارسال درخواست ثبت‌نام</button>
    <button class="btn secondary" onclick="hideForm()">بازگشت</button>
    <div id="registerMsg"></div>`;
}

async function registerStudent(){
  const first_name=document.getElementById("regFirst").value.trim();
  const last_name=document.getElementById("regLast").value.trim();
  const phone=document.getElementById("regPhone").value.trim();
  const level=document.getElementById("regLevel").value.trim()||"A1";
  const password=document.getElementById("regPass").value;

  if(!first_name||!last_name||!phone||!password){
    document.getElementById("registerMsg").innerHTML=
      `<p style="color:red">لطفاً همه اطلاعات را وارد کنید.</p>`;
    return;
  }

  try{
    const existing=await sb(
      "students?select=id&phone=eq."+encodeURIComponent(phone)+"&limit=1"
    );

    if(existing.length)
      throw new Error("این شماره قبلاً ثبت‌نام کرده است.");

    const auth=await fetch(SUPABASE_URL+"/auth/v1/signup",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email:phone+"@alinagheli.com",
        password
      })
    });

    const authData=await auth.json();

    if(!auth.ok)
      throw new Error(authData.msg||authData.error_description||"ساخت حساب کاربری انجام نشد.");

    const authId=authData.user?.id||null;

    await sb("students",{
      method:"POST",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify({
        first_name,
        last_name,
        phone,
        level,
        status:"waiting",
        auth_user_id:authId,
        password_created:true
      })
    });

    document.getElementById("registerMsg").innerHTML=
      `<p style="color:#15803d;font-weight:bold">
      ✅ درخواست شما ثبت شد.<br>
      پس از تأیید مدیر می‌توانید وارد سامانه شوید.
      </p>`;

  }catch(e){
    document.getElementById("registerMsg").innerHTML=
      `<p style="color:#dc2626">${e.message}</p>`;
  }
}

/* =========================
   APP
========================= */
function openApp(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
}

function logout(){
  localStorage.removeItem("sb_token");
  currentUser=null;
  currentRole=null;
  location.reload();
}

function go(page){
  if(currentRole==="manager"){
    if(page==="home") renderManager();
    return;
  }

  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  const n=document.getElementById("n-"+page);
  if(n)n.classList.add("active");

  const titles={
    home:"خانه",courses:"دوره‌ها",level:"تعیین سطح",
    profile:"پروفایل",teacher:"معرفی استاد"
  };
  document.getElementById("pageTitle").textContent=titles[page]||"";

  if(page==="home")renderHome();
  if(page==="courses")renderCourses();
  if(page==="level")renderLevel();
  if(page==="profile")renderProfile();
  if(page==="teacher")renderTeacher();
}

/* =========================
   HOME
========================= */
function renderHome(){
  const s=currentUser.student;
  document.getElementById("main").innerHTML=`
    <div class="hero">
      <h2>سلام ${esc(s.first_name)} 👋</h2>
      <p>به AliNagheliEnglish خوش آمدی.</p>
      <div class="word" onclick="speak('Welcome')">Welcome 🔊</div>
      <div class="translation">خوش آمدید</div>
    </div>

    <div class="card">
      <h3>📖 لغت روزانه</h3>
      <div class="word" onclick="speak('Achievement')">Achievement 🔊</div>
      <div class="translation">دستاورد</div>
      <p style="text-align:center">برای شنیدن تلفظ روی لغت بزن.</p>
    </div>

    <div class="card">
      <h3>🏆 رکورد آزمون‌ها</h3>
      <div id="homeScores">در حال دریافت...</div>
    </div>

    <div class="card">
      <h3>📚 ادامه یادگیری</h3>
      <button class="btn primary" onclick="openCourse(7)">ورود به دوره پایه هفتم</button>
    </div>

    <button class="btn secondary" onclick="logout()">خروج از حساب</button>`;

  loadScores("homeScores");
}

/* =========================
   COURSES
========================= */
function renderCourses(){
  document.getElementById("main").innerHTML=`
    <div class="card">
      <h2>📚 دوره‌های آموزشی</h2>
      <p>هر پایه به‌صورت مستقل طراحی شده است.</p>
    </div>

    <div class="grid">
      ${[7,8,9,10,11,12].map(x=>`
        <div class="course" onclick="openCourse(${x})">
          <strong>پایه ${x}</strong>
          <span>${x===7?"۸ درس + مقدمه":"به‌زودی"}</span>
        </div>`).join("")}
    </div>`;
}

function openCourse(grade){
  if(grade!==7){
    document.getElementById("main").innerHTML=`
      <button class="back" onclick="go('courses')">← بازگشت</button>
      <div class="card">
        <h2>پایه ${grade}</h2>
        <p>محتوای این پایه در مرحله بعدی اضافه خواهد شد.</p>
      </div>`;
    return;
  }

  document.getElementById("pageTitle").textContent="پایه هفتم";

  const lessons=[
    ["مقدمه","حروف بزرگ و کوچک + لغات کلاس"],
    ["درس ۱","سلام و احوال‌پرسی + معرفی خود"],
    ["درس ۲","Who + Nice to meet you"],
    ["درس ۳","سن، ماه‌ها، روزها و تولد"],
    ["درس ۴","سن افراد + شغل‌ها"],
    ["درس ۵","افراد، لباس‌ها و رنگ‌ها"],
    ["درس ۶","مکان‌ها + کارهای در حال انجام"],
    ["درس ۷","شماره تلفن، آدرس و زمان"],
    ["درس ۸","غذا، میوه، نوشیدنی + I'd like"]
  ];

  document.getElementById("main").innerHTML=`
    <button class="back" onclick="go('courses')">← بازگشت به دوره‌ها</button>
    <div class="card">
      <h2>📘 انگلیسی پایه هفتم</h2>
      <p>مقدمه و ۸ درس آموزشی</p>
    </div>
    ${lessons.map((l,i)=>`
      <div class="lesson" onclick="openLesson(${i})">
        <h3>${l[0]}</h3><small>${l[1]}</small>
      </div>`).join("")}

    <div class="card">
      <h3>🏆 آزمون جامع پایه هفتم</h3>
      <p>۵۰ سؤال ترکیبی گرامر و لغت</p>
      <button class="btn primary" onclick="startGrade7Exam()">شروع آزمون جامع</button>
    </div>`;
}

/* =========================
   LESSONS
========================= */
function openLesson(n){
  currentLesson=n;

  if(n===0){intro();return}

  const data={
    1:{
      title:"درس ۱",
      grammar:`سلام و احوال‌پرسی در زبان انگلیسی، معرفی خود، پرسیدن نام و نام خانوادگی و Spell کردن.`,
      examples:[
        "Hello! How are you? — I'm fine, thank you.",
        "What's your name? — My name is Ali.",
        "What's your last name? — My last name is Nagheli.",
        "How do you spell Ali? — A-L-I."
      ]
    },
    2:{
      title:"درس ۲",
      grammar:`کلمه <b>Who</b> برای پرسیدن «چه کسی» استفاده می‌شود.<br><br>
      Who is that boy? یعنی آن پسر کیست؟<br>
      Who is that girl? یعنی آن دختر کیست؟<br><br>
      <b>Nice to meet you</b> یعنی از آشنایی با شما خوشحالم.`,
      examples:[
        "Who is that boy? — He is my brother.",
        "Who is that girl? — She is my friend.",
        "Nice to meet you. — Nice to meet you, too."
      ]
    },
    3:{
      title:"درس ۳",
      grammar:`پرسیدن و گفتن سن، ماه‌های سال، روزهای هفته، اعداد 1 تا 31 و پرسیدن تاریخ تولد.`,
      examples:[
        "How old are you? — I'm thirteen.",
        "When is your birthday? — It's on May 12th.",
        "Happy Birthday! 🎂",
        "What day is it? — It's Monday.",
        "My birthday is in July."
      ]
    },
    4:{
      title:"درس ۴",
      grammar:`پرسیدن سن افراد و پرسیدن شغل آن‌ها.`,
      examples:[
        "How old is your father? — He is forty years old.",
        "How old is your mother? — She is thirty-five.",
        "What is your father's job? — He is an engineer.",
        "What is your mother's job? — She is a teacher."
      ]
    },
    5:{
      title:"درس ۵",
      grammar:`پرسیدن اینکه یک مرد یا زن کیست و توصیف لباس و رنگ لباس افراد.`,
      examples:[
        "Who is that man? — He is my father.",
        "Who is that woman? — She is my teacher.",
        "He's wearing a black suit.",
        "She's wearing a blue dress."
      ]
    },
    6:{
      title:"درس ۶",
      grammar:`پرسیدن محل افراد با Where و پرسیدن کاری که انجام می‌دهند با What ... doing.`,
      examples:[
        "Where is your mom? — She is in the kitchen.",
        "What is she doing? — She is cooking.",
        "Where is Ali? — He is in the living room.",
        "What is he doing? — He is reading."
      ]
    },
    7:{
      title:"درس ۷",
      grammar:`نحوه پرسیدن شماره تلفن، آدرس و زمان.`,
      examples:[

function startGrade7Exam(){
  examAnswers=[];
  examIndex=0;
  examScore=0;

  /* تکرار سؤال‌ها برای آزمون ۵۰ سوالی */
  const q=[];
  for(let i=0;i<50;i++) q.push(exam[i%exam.length]);
  examAnswers=q;
  showExamQuestion();
}

function showExamQuestion(){
 const q=examAnswers[examIndex];

 document.getElementById("main").innerHTML=`
 <button class="back" onclick="openCourse(7)">← خروج از آزمون</button>
 <div class="card">
   <div style="text-align:center;color:#6d28d9;font-weight:bold">
   سؤال ${examIndex+1} از ${examAnswers.length}
   </div>
 </div>

 <div class="exam-q">
   <h3>${q[0]}</h3>
   ${q.slice(1).map((x,i)=>
   `<button class="option" onclick="answerExam(this,${i},${JSON.stringify(x)},${JSON.stringify(q[1])})">${x}</button>`
   ).join("")}
   <div id="feedback" class="feedback"></div>
 </div>`;
}

function answerExam(btn,index,answer,correct){
 const buttons=document.querySelectorAll(".option");
 buttons.forEach(x=>x.disabled=true);

 const ok=answer===correct;

 if(ok){
   btn.classList.add("correct");
   examScore++;
   document.getElementById("feedback").innerHTML="✅ 😊";
 }else{
   btn.classList.add("wrong");
   buttons.forEach(x=>{
     if(x.textContent.trim()===correct)x.classList.add("correct");
   });
   document.getElementById("feedback").innerHTML="❌ 😔";
 }

 setTimeout(()=>{
   examIndex++;
   if(examIndex<examAnswers.length)showExamQuestion();
   else finishExam();
 },700);
}

async function finishExam(){
 const percent=Math.round(examScore/examAnswers.length*100);

 document.getElementById("main").innerHTML=`
 <div class="card" style="text-align:center">
   <div style="font-size:65px">${percent>=60?"🎉":"😔"}</div>
   <h2>آزمون به پایان رسید</h2>
   <h1 style="color:#6d28d9">${percent}%</h1>
   <p>تعداد پاسخ صحیح: ${examScore} از 50</p>
   <button class="btn primary" onclick="saveScore(${percent})">ثبت نتیجه</button>
   <button class="btn secondary" onclick="startGrade7Exam()">شرکت دوباره در آزمون</button>
 </div>`;
}

async function saveScore(percent){
 try{
   await sb("exam_results",{

       student_id:currentUser.student.id,
       score:percent,

     })
   });
 }catch(e){
   /* اگر جدول نتیجه هنوز ساخته نشده باشد، نتیجه محلی هم نگهداری می‌شود */

}

async function approveStudent(id){
 try{
   await sb("students?id=eq."+id,{
     method:"PATCH",
     headers:{"Prefer":"return=minimal"},
     body:JSON.stringify({status:"registered"})
   });
   renderManager();
 }catch(e){
   alert("خطا در تأیید: "+e.message);
 }
}

async function deleteStudent(id){
 if(!confirm("این ثبت‌نام حذف شود؟"))return;

 try{
   await sb("students?id=eq."+id,{
     method:"DELETE"
   });
   renderManager();
 }catch(e){
   alert("خطا در حذف: "+e.message);
 }
}

/* =========================
   SPEECH
========================= */
function speak(text){
 if(!("speechSynthesis" in window)){
   alert("مرورگر شما از پخش تلفظ پشتیبانی نمی‌کند.");
   return;
 }
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";
 u.rate=.82;
 speechSynthesis.speak(u);
}

/* =========================
   SECURITY / HELPERS
========================= */
function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;");
}

/* =========================
   SESSION RESTORE
========================= */
window.addEventListener("load",async()=>{
 const token=localStorage.getItem("sb_token");
 if(!token)return;

 try{
   const r=await fetch(SUPABASE_URL+"/auth/v1/user",{
     headers:{
       "apikey":SUPABASE_KEY,
       "Authorization":"Bearer "+token
     }
   });

   if(!r.ok)throw new Error();

   currentUser=await r.json();

   const rows=await sb(
     "students?select=*&auth_user_id=eq."+currentUser.id+"&limit=1"
   );

   if(rows.length){
     currentRole="student";
     currentUser.student=rows[0];
     openApp();
     go("home");
   }else{
     currentRole="manager";
     openApp();
     renderManager();
   }
 }catch(e){
   localStorage.removeItem("sb_token");
 }
});
</script>
