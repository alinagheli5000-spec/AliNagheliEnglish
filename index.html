function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function normalizePhone(v){
 v=String(v||"").trim()
 .replace(/[۰-۹]/g,x=>"۰۱۲۳۴۵۶۷۸۹".indexOf(x))
 .replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x));
 if(v.startsWith("+98"))v="0"+v.slice(3);
 if(v.startsWith("0098"))v="0"+v.slice(4);
 return v;
}

function shuffle(a){
 return [...a].sort(()=>Math.random()-.5);
}

function speak(text){
 if(!("speechSynthesis" in window)){
  alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
  return;
 }
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang="en-US";
  u.rate=.75;
  u.pitch=1;
  speechSynthesis.resume();
  speechSynthesis.speak(u);
 }catch(e){
  alert("تلفظ صوتی در این دستگاه در دسترس نیست.");
 }
}

function xpForLevel(level){
 return Math.max(0,(Number(level)-1)*500);
}

function calculateLevel(xp){
 return Math.max(1,Math.floor(Number(xp||0)/500)+1);
}

async function accessFunction(body){
 const r=await fetch(ACCESS_FUNCTION,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "apikey":SUPABASE_KEY
  },
  body:JSON.stringify(body)
 });
 const data=await r.json().catch(()=>null);
 if(!r.ok)throw new Error(data?.error||"خطا در ارتباط با سامانه.");
 return data;
}

async function adminFunction(body){
 const session=(await db.auth.getSession()).data?.session;
 const r=await fetch(ADMIN_FUNCTION,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "apikey":SUPABASE_KEY,
   ...(session?.access_token?{"Authorization":"Bearer "+session.access_token}:{})
  },
  body:JSON.stringify(body)
 });
 const data=await r.json().catch(()=>null);
 if(!r.ok)throw new Error(data?.error||"خطا در عملیات مدیر.");
 return data;
}

async function studentLogin(){
 const phone=normalizePhone(document.getElementById("phone").value);
 const password=document.getElementById("pass").value;

 if(!/^09\d{9}$/.test(phone)||!password){
  alert("شماره موبایل و رمز عبور را صحیح وارد کنید.");
  return;
 }

 try{
  const result=await accessFunction({
   action:"login",
   phone,
   password
  });

  if(!result?.session||!result?.user){
   throw new Error("ورود زبان‌آموز انجام نشد.");
  }

  const student=result.student;

  if(!student){
   throw new Error("اطلاعات زبان‌آموز پیدا نشد.");
  }

  if(student.status==="waiting"){
   throw new Error("حساب شما هنوز توسط مدیر تأیید نشده است.");
  }

  if(student.status==="rejected"){
   throw new Error("ثبت‌نام شما توسط مدیر رد شده است.");
  }

  S.student=student;

  if(result.session){
   await db.auth.setSession({
    access_token:result.session.access_token,
    refresh_token:result.session.refresh_token
   });
  }

  await loadStudentStats();
  home();

 }catch(e){
  alert(e?.message||"ورود انجام نشد.");
 }
}

async function adminLogin(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("pass").value;

 if(!email||!password){
  alert("ایمیل و رمز عبور را وارد کنید.");
  return;
 }

 try{
  const r=await db.auth.signInWithPassword({email,password});

  if(r.error)throw r.error;

  if(email.toLowerCase()!=="alinagheli@gmail.com"){
   await db.auth.signOut();
   throw new Error("این حساب دسترسی مدیر ندارد.");
  }

  S.admin=true;
  S.student=null;
  await admin();

 }catch(e){
  alert(e?.message||"ورود مدیر انجام نشد.");
 }
}

async function register(){

 const last=document.getElementById("rl").value.trim();
 const phone=normalizePhone(document.getElementById("rp").value);
 const password=document.getElementById("rpass").value;
 const level=document.getElementById("rlevel").value;

  alert("همه موارد را صحیح تکمیل کنید.");
  return;
 }

 if(password.length<8){
  alert("رمز عبور باید حداقل ۸ کاراکتر باشد.");
  return;
 }

 try{
  const r=await fetch(REGISTER_FUNCTION,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY
   },
   body:JSON.stringify({
    first_name:first,
    last_name:last,
    phone,
    level,
    password
   })
  });

  const data=await r.json().catch(()=>null);

  if(!r.ok||!data?.ok){
   throw new Error(data?.error||"ثبت‌نام انجام نشد.");
  }

  alert("ثبت‌نام با موفقیت انجام شد.\nحساب شما در انتظار تأیید مدیر است.");

 }catch(e){

async function requestTeacher(i){
 if(!S.student){
  alert("ابتدا وارد حساب زبان‌آموز شوید.");
  return;
 }

 const date=document.getElementById("td"+i).value;
 const time=document.getElementById("tt"+i).value;
 const type=document.getElementById("ttype"+i).value;
 const note=document.getElementById("tn"+i).value.trim();

 if(!date||!time){
  alert("تاریخ و ساعت را انتخاب کنید.");
  return;
 }

 try{
  const r=await db.from("teacher_requests").insert({
   student_id:S.student.id,
   student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,
   student_phone:S.student.phone,
   teacher_name:teachersData[i].name,
   requested_date:date,
   requested_time:time,
   class_type:type,
   note,
   status:"pending"
  });

  if(r.error)throw r.error;

  alert("درخواست شما با موفقیت برای استاد ارسال شد. ✅");

 }catch(e){
  alert("ارسال درخواست انجام نشد:\n"+e.message);
 }
}

/* QUIZ */

function startLessonQuiz(){
 const gradeNo=S.grade;
 const lessonNo=S.lesson+1;
 const words=(wordsByGrade[gradeNo]?.[lessonNo]||[]).slice(0,6);

 const questions=words.map((w,i)=>{
  const pool=shuffle(
   words.filter((_,j)=>j!==i).map(x=>x[1])
  ).slice(0,3);

  const options=shuffle([w[1],...pool]);

  return {
   q:`معنی "${w[0]}" چیست؟`,
   options,
   answer:options.indexOf(w[1])
  };
 });

 S.quiz={
  type:"lesson",
  title:`پایه ${gradeNo} درس ${lessonNo}`,
  questions,
  i:0,
  correct:0,
  wrong:0
 };

 quizRender("lessonQuiz");
}

function quizRender(id){
 const el=document.getElementById(id);

 if(!el||!S.quiz)return;

 const q=S.quiz.questions[S.quiz.i];

 if(!q){
  quizFinish(id);
  return;
 }

 el.innerHTML=`
 <div class="card">

  <div class="muted">
   سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}
  </div>

  <h3>${esc(q.q)}</h3>

  <div class="grid">
   ${q.options.map((x,i)=>`
    <button class="btn secondary"
     onclick="quizAnswer(${i},'${id}')">
     ${esc(x)}

async function loadStudentStats(){
 if(!S.student)return;

 try{
  const r=await db.from("student_progress")
   .select("*")
   .eq("student_id",S.student.id);

  if(!r.error){
   S.progress={};
   (r.data||[]).forEach(x=>{
    S.progress[x.lesson_id]={
     progress:x.progress||0,
     completed:!!x.completed
    };
   });
  }
 }catch(e){}

 try{
  const r=await db.from("student_xp")
   .select("*")
   .eq("student_id",S.student.id)
   .maybeSingle();

  if(!r.error&&r.data){
   S.xp=Number(r.data.xp||0);
   S.level=Number(r.data.level||calculateLevel(S.xp));
  }
 }catch(e){}

 try{
  const r=await db.from("student_achievements")
   .select("achievement_key,title")
   .eq("student_id",S.student.id);

  S.achievements=r.data||[];
 }catch(e){}

 try{
  const r=await db.from("exam_results")
   .select("*")
   .eq("user_id",S.student.auth_user_id)
   .order("created_at",{ascending:false});

  S.exams=r.data||[];
 }catch(e){}
}

async function addXP(amount){
 if(!S.student)return;

 const old=S.xp;

 S.xp+=Number(amount||0);
 S.level=calculateLevel(S.xp);

 try{
  await db.from("student_xp").upsert({
   student_id:S.student.id,
   xp:S.xp,
   level:S.level,
   updated_at:new Date().toISOString()
  },{
   onConflict:"student_id"
  });
 }catch(e){}

 if(S.level>calculateLevel(old)){
  await unlockAchievement(
   "level_"+S.level,
   "رسیدن به Level "+S.level
  );
 }
}

async function unlockAchievement(key,title){
 if(!S.student||
    S.achievements.some(x=>x.achievement_key===key))return;

 try{
  const r=await db.from("student_achievements").insert({
   student_id:S.student.id,
   achievement_key:key,
   title
  });

  if(!r.error){
   S.achievements.push({
    achievement_key:key,
    title
   });
  }
 }catch(e){}
}

async function saveProgress(lessonId,progress,completed){
 if(!S.student)return;

 S.progress[lessonId]={
  progress,
  completed
 };

 try{
  await db.from("student_progress").upsert({
   student_id:S.student.id,
   lesson_id:lessonId,
   progress,
   completed,
   completed_at:completed?
    new Date().toISOString():null
  },{
   onConflict:"student_id,lesson_id"
  });
 }catch(e){}
}

   return;
  }

  await db.auth.signOut();
  login();

 }catch(e){

  try{
   await db.auth.signOut();

 }

 if(
