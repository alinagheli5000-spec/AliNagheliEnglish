/* XP */

function calculateLevel(xp){
return Math.max(1,Math.floor(Number(xp||0)/100)+1)
}

async function loadStudentStats(){
if(!S.student)return;

S.xp=0;S.level=1;S.progress={};S.achievements=[];

try{
const r=await db.from("student_xp")
.select("xp,level").eq("student_id",S.student.id).maybeSingle();
if(r.data){
S.xp=Number(r.data.xp||0);
S.level=Number(r.data.level||calculateLevel(S.xp));
}else{
await db.from("student_xp").insert({
student_id:S.student.id,xp:0,level:1
});
}
}catch(e){}

try{
const r=await db.from("student_progress")
.select("lesson_id,progress,completed")
.eq("student_id",S.student.id);
(r.data||[]).forEach(x=>{
S.progress[x.lesson_id]={
progress:Number(x.progress||0),
completed:Boolean(x.completed)
};
});
}catch(e){}

try{
const r=await db.from("student_achievements")
.select("achievement_key,title")
.eq("student_id",S.student.id);
S.achievements=r.data||[];
}catch(e){}

try{
const r=await db.from("student_streak")
.select("streak,last_date")
.eq("student_id",S.student.id)
.maybeSingle();
if(r.data)S.streak=Number(r.data.streak||0);
}catch(e){}
}

async function addXP(amount){
if(!S.student)return;

const old=S.xp;
S.xp+=Number(amount||0);
S.level=calculateLevel(S.xp);

try{
await db.from("student_xp").upsert({
student_id:S.student.id,
xp:S.xp,
level:S.level,
updated_at:new Date().toISOString()
},{onConflict:"student_id"});
}catch(e){}

if(S.level>calculateLevel(old)){
await unlockAchievement("level_"+S.level,"رسیدن به Level "+S.level);
}
}

async function unlockAchievement(key,title){
if(!S.student)return;
if(S.achievements.some(x=>x.achievement_key===key))return;

try{
const r=await db.from("student_achievements").insert({
student_id:S.student.id,achievement_key:key,title
});
if(!r.error)S.achievements.push({achievement_key:key,title});
}catch(e){}
}

async function updateStreak(){
if(!S.student)return;

const today=new Date().toISOString().slice(0,10);

try{
const r=await db.from("student_streak")
.select("*").eq("student_id",S.student.id).maybeSingle();

if(!r.data){
S.streak=1;
await db.from("student_streak").insert({
student_id:S.student.id,streak:1,last_date:today
});
return;
}

if(r.data.last_date===today){
S.streak=Number(r.data.streak||1);
return;
}

const previous=new Date(r.data.last_date);
const current=new Date(today);
const diff=Math.round((current-previous)/86400000);

S.streak=diff===1?Number(r.data.streak||0)+1:1;

await db.from("student_streak").update({
streak:S.streak,last_date:today
}).eq("student_id",S.student.id);

if(S.streak>=3)
await unlockAchievement("streak_3","۳ روز فعالیت متوالی");

if(S.streak>=7)
await unlockAchievement("streak_7","۷ روز فعالیت متوالی");

}catch(e){}
}

}catch(e){}
}

const phone=document.getElementById("rp").value.trim();

const level=document.getElementById("rlevel").value;

}

alert("رمز عبور باید حداقل ۶ کاراکتر باشد.");return;
}

const digits=normalizePhone(phone);
if(digits.length<10){
alert("شماره تلفن معتبر نیست.");return;
}

const email=digits+"@alinagheli.com";

try{
const r=await db.auth.signUp({
email,password,
options:{data:{
first_name:first,last_name:last,phone,level
}}
});

if(r.error)throw r.error;

await accessFunction({
action:"register",
first_name:first,
last_name:last,
phone,level,
auth_user_id:r.data.user.id,
email
});

await db.auth.signOut();

}catch(e){
try{await db.auth.signOut()}catch(_){}

}
}

/* QUIZ */

function makeLessonQuestions(){
const no=S.lesson+1;
let arr=[];
const a=words[no]||[];

a.forEach((w,i)=>{
let distract=shuffle(a.filter((_,j)=>j!==i)).slice(0,3).map(x=>x[1]);
let options=shuffle([w[1],...distract.slice(0,2)]);
arr.push({
q:`معنی "${w[0]}" چیست؟`,
options,
answer:options.indexOf(w[1])
});
});

(grammar[no]||[]).forEach(g=>{
const options=shuffle([
g[1],
"She are student.",
"They is happy.",
"I am students."
]);
arr.push({
q:`کدام گزینه با ${g[0]} هماهنگ است؟`,
options,
answer:options.indexOf(g[1])
});
});

return shuffle(arr).slice(0,15);
}

function startLessonQuiz(){
S.quiz={
type:"lesson",
title:`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
questions:makeLessonQuestions(),
i:0,correct:0,wrong:0,time:0
};
quizRender("lessonQuiz");
}

function quizRender(id){
const q=S.quiz.questions[S.quiz.i];

if(!q){quizFinish(id);return}

const el=document.getElementById(id);
if(!el)return;

el.innerHTML=`
<div class="card">
<b>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>
<div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div>
<div style="font-size:18px;font-weight:bold;line-height:2;margin:15px 0">${esc(q.q)}</div>
${q.options.map((x,i)=>`
<button class="option" onclick="answer(${i},'${id}')">${esc(x)}</button>
`).join("")}
<div id="fb"></div>
</div>`;
}

function answer(i,id){
const q=S.quiz.questions[S.quiz.i];
const opts=document.querySelectorAll(".option");
opts.forEach(x=>x.disabled=true);

if(i===q.answer){
S.quiz.correct++;
opts[i].classList.add("correct");
document.getElementById("fb").className="feedback ok";
document.getElementById("fb").innerHTML="✅ 😊 آفرین! پاسخ درست است.";
}else{
S.quiz.wrong++;
opts[i].classList.add("wrong");
opts[q.answer].classList.add("correct");
document.getElementById("fb").className="feedback bad";
document.getElementById("fb").innerHTML="❌ پاسخ اشتباه است.";
}

setTimeout(()=>{
S.quiz.i++;
quizRender(id);
},750);
}

async function quizFinish(id){
const total=S.quiz.questions.length;
const percent=total?Math.round(S.quiz.correct/total*100):0;

examRecords.push({
student:S.student?.phone||"",
title:S.quiz.title,score:percent,
date:new Date().toISOString()
});
saveLocal();

if(S.student){
try{
await db.from("exam_results").insert({
user_id:S.student.auth_user_id,
student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,
exam_type:S.quiz.type||"lesson",
exam_title:S.quiz.title,
lesson:S.lesson+1,
score:S.quiz.correct,
total,percentage:percent
});
}catch(e){}

await addXP(Math.max(10,percent));

if(percent>=80)await unlockAchievement("exam_80","امتیاز بالای ۸۰٪");
if(percent===100)await unlockAchievement("perfect_exam","آزمون کامل");

if(S.quiz.type==="lesson"){
await saveProgress(`${S.grade}-${S.lesson}`,100,true);
}
}

const el=document.getElementById(id);
if(!el)return;

el.innerHTML=`
<div class="card">
<div class="score">${percent}%</div>
<h2 style="text-align:center">آزمون تمام شد 🎉</h2>
<p style="text-align:center">${S.quiz.correct} پاسخ درست از ${total}</p>
<p style="text-align:center;font-weight:bold">نمره: ${percent}%</p>
<button class="btn full" onclick="profile()">مشاهده کارنامه</button>
</div>`;
}

function conversationQuiz(name,unit){
const q=[
["What is the meaning of conversation?","گفت‌وگو"],
["What is the meaning of question?","سؤال"],
["What is the meaning of answer?","پاسخ"],
["What is the meaning of practice?","تمرین"],
["What is the meaning of language?","زبان"],
["What is the meaning of class?","کلاس"],
["What is the meaning of student?","دانش‌آموز"],
["What is the meaning of teacher?","معلم"],
["What is the meaning of friend?","دوست"],
["What is the meaning of information?","اطلاعات"]
];

let arr=q.map((x,i)=>{
const pool=shuffle(q.filter((_,j)=>j!==i)).slice(0,2).map(x=>x[1]);
const options=shuffle([x[1],...pool]);
return{q:x[0],options,answer:options.indexOf(x[1])};
});

questions:shuffle(arr),i:0,correct:0,wrong:0
};

document.body.innerHTML=`
${header("پنل مدیریت")}
<main class="container">

<div class="hero">
<h2>👨‍💼 پنل مدیریت</h2>
<p>مدیریت زبان‌آموزان AliNagheli English</p>
</div>

<div class="grid">
<div class="item"><div class="icon">👥</div><h3>کل</h3><div class="statNumber">${students.length}</div></div>
<div class="item"><div class="icon">⏳</div><h3>در انتظار</h3><div class="statNumber">${students.filter(x=>x.status==="waiting").length}</div></div>
<div class="item"><div class="icon">✅</div><h3>تأیید شده</h3><div class="statNumber">${students.filter(x=>["registered","approved"].includes(x.status)).length}</div></div>
<div class="item"><div class="icon">❌</div><h3>رد شده</h3><div class="statNumber">${students.filter(x=>x.status==="rejected").length}</div></div>
</div>

<div class="card">
<h3>📋 ثبت‌نام‌ها</h3>

${students.length?students.map(x=>`
<div class="adminRow">
<b>${esc(x.first_name)} ${esc(x.last_name)}</b>
<div class="muted">
📱 ${esc(x.phone||"")}<br>
🎓 پایه: ${esc(x.level||"-")}<br>
✉️ ${esc(x.login_email||"-")}<br>
وضعیت: ${esc(x.status||"-")}
</div>

<div style="margin-top:10px">
${
x.status==="waiting"?`
<button class="btn success" onclick='approve(${JSON.stringify(x.id)})'>✅ تأیید</button>
<button class="btn danger" onclick='rejectStudent(${JSON.stringify(x.id)})'>❌ رد</button>
`:
["registered","approved"].includes(x.status)?`
<span>✅ تأیید شده</span>
<button class="btn danger" onclick='rejectStudent(${JSON.stringify(x.id)})'>رد / حذف</button>
`:
`
<span>❌ رد شده</span>
<button class="btn success" onclick='approve(${JSON.stringify(x.id)})'>تأیید مجدد</button>
`
}
</div>
</div>`).join(""):`<p class="muted">ثبت‌نامی وجود ندارد.</p>`}
</div>

<div class="card">
<h3>⚙️ مدیریت</h3>
<p class="muted">مدیر می‌تواند ثبت‌نام‌ها را تأیید یا رد کند.</p>
<button class="btn secondary full" onclick="admin()">🔄 بروزرسانی</button>
</div>

<button class="btn secondary full" onclick="logout()">خروج</button>
</main>`;
}

async function approve(id){
try{
const r=await db.from("students").update({status:"registered"}).eq("id",id);
if(r.error)throw r.error;
admin();
}catch(e){alert("خطا در تأیید:\n"+e.message)}
}

async function rejectStudent(id){
try{
const r=await db.from("students").update({status:"rejected"}).eq("id",id);
if(r.error)throw r.error;
admin();
}catch(e){alert("خطا در رد کردن:\n"+e.message)}
}

/* LOGOUT / START */

async function logout(){
try{await db.auth.signOut()}catch(e){}

S={
student:null,admin:false,grade:null,lesson:null,quiz:null,
xp:0,level:1,progress:{},achievements:[],streak:0
};

login();
}

async function startup(){
try{
const r=await db.auth.getSession();
const session=r.data?.session;

if(!session){login();return}

const user=session.user;

if((user.email||"").toLowerCase()==="alinagheli@gmail.com"){
S.admin=true;admin();return;
}

const st=await db.from("students")
.select("*").eq("auth_user_id",user.id).maybeSingle();

if(st.data&&["registered","approved"].includes(st.data.status)){
S.student=st.data;
await loadStudentStats();
await updateStreak();
home();
return;
}

await db.auth.signOut();
login();

}catch(e){
try{await db.auth.signOut()}catch(_){}
login();
}
}

db.auth.onAuthStateChange((event)=>{
if(event==="SIGNED_OUT"&&!S.admin&&!S.student)login();
});

startup();
</script></body>
</html>
