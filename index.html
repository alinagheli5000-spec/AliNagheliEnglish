/* =========================================================

function esc(value){

    return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function normalizePhone(phone){

    let p =
    String(phone ?? '')
    .trim()
    .replace(/[^\d+]/g,'');

    if(p.startsWith('+98')){
        p =
        '0'+
        p.slice(3);
    }

    if(p.startsWith('0098')){
        p =
        '0'+
        p.slice(4);
    }

    if(p.startsWith('98') && p.length===12){
        p =
        '0'+
        p.slice(2);
    }

    return p;

}


function validIranPhone(phone){

    return /^09\d{9}$/.test(
        normalizePhone(phone)
    );

}

}

        m.textContent =
        'شماره موبایل معتبر نیست.';

        return;

    }

    m.textContent =
    'در حال ورود...';

    try{

        let emails = [

            `${phone}@alinagheli.local`,

            `${phone}@alinagheli.com`,

            `${phone}@alinagheli.ir`

        ];

        let result = null;

        for(
            const email of emails
        ){

            const r =
            await db.auth.signInWithPassword({

                email,

                password

            });

            if(!r.error){

                result = r;

                break;

            }

        }

        if(!result){

            const lookup =
            await db
            .from('students')
            .select(
                'id,first_name,last_name,phone,level,status,auth_user_id'
            )
            .eq(
                'phone',
                phone
            )
            .maybeSingle();

            if(lookup.error){

                throw lookup.error;

            }

            if(
                lookup.data &&
                lookup.data.auth_user_id
            ){

                const r =
                await db.auth.signInWithPassword({

                    email:
                    `${lookup.data.auth_user_id}@alinagheli.local`,

                    password

                });

                if(!r.error){

                    result = r;

                }

            }

        }

        if(!result){

            throw new Error(
                'شماره موبایل یا رمز عبور صحیح نیست.'
            );

        }

        user =
        result.data.user;

        await identify();

    }catch(err){

        console.error(err);

        m.textContent =
        err.message ||
        'ورود ناموفق بود.';

    }

}

/* =========================================================
   IDENTIFY USER
========================================================= */

async function identify(){

    if(!user){

        login();

        return;

    }

    try{

        const admin =
        await db
        .from('admins')
        .select('*')
        .eq(
            'auth_user_id',
            user.id
        )
        .maybeSingle();

        if(
            !admin.error &&
            admin.data
        ){

            isAdmin = true;

            await adminData();

            appAdmin();

            return;

        }

        const student =
        await db
        .from('students')
        .select('*')
        .eq(
            'auth_user_id',
            user.id
        )
        .maybeSingle();

        if(
            !student.error &&
            student.data
        ){

            isAdmin = false;

            me =
            student.data;

            appStudent();

            return;

        }

        const byEmail =
        await db
        .from('students')
        .select('*')
        .eq(
            'email',
            user.email
        )
        .maybeSingle();

        if(
            !byEmail.error &&
            byEmail.data
        ){

            isAdmin = false;

            me =
            byEmail.data;

            appStudent();

            return;

        }

        throw new Error(
            'حساب کاربری پیدا نشد.'
        );

    }catch(err){

        console.error(err);

        await db.auth.signOut();

        user = null;

        me = null;

        isAdmin = false;

        login();

    }

}

function lessonHTML(n){

            grammar:'I am / You are / He is / She is',

        },

        2:{
            title:'ضمیرهای شخصی',
            grammar:'I, you, he, she, it, we, they',
            example:'They are my friends.'
        },

        3:{
            title:'افعال ساده',
            grammar:'I play / You play / He plays',
            example:'She plays football.'
        },

        4:{
            title:'حال ساده',
            grammar:'Present Simple',
            example:'I go to school every day.'
        },

        5:{
            title:'صفات',
            grammar:'Adjectives',
            example:'This is a beautiful book.'
        },

        6:{
            title:'There is / There are',
            grammar:'There is + singular / There are + plural',
            example:'There are two books.'
        },

            title:'سؤال‌سازی',

            example:'Where do you live?'
        },

        8:{

            grammar:'Review',

    return `

            </div>

                You are my friend.
            </div>

            <div class="example">
                She is a teacher.

function speakWord(text){

    if(
        !('speechSynthesis' in window)
    ){

        alert(
            'مرورگر شما از پخش صوت پشتیبانی نمی‌کند.'
        );

        return;

    }

    speechSynthesis.cancel();

    const u =
    new SpeechSynthesisUtterance(
        text
    );

    u.lang =
    'en-US';

    u.rate =
    .82;

    speechSynthesis.speak(u);

}

function quizPage(){

function renderQuiz(){

    const box =
    document.getElementById(
        'studentContent'
    );

    if(!box)return;

    if(
        quizIndex >=
        currentQuiz.length
    ){

        quizResult();

        return;

    }

    const q =
    currentQuiz[quizIndex];

    const percent =
    Math.round(
        (
            quizIndex /
            currentQuiz.length
        )*100
    );

    box.innerHTML = `

    <div class="quiz-card">

        <h2>
            🧠 آزمون
        </h2>

        <div class="muted">
            سؤال ${quizIndex+1}
            از
            ${currentQuiz.length}
        </div>

        <div class="quiz-progress">

            <div
            style="width:${percent}%">

            </div>

        </div>

        <div class="quiz-question">

            ${esc(q.q)}

        </div>

        <div>

            ${q.options.map(
                (o,i)=>`

                <button
                class="quiz-option"
                onclick="answerQuiz(${i})">

                    ${esc(o)}

                </button>

            `
            ).join('')}

        </div>

        <div
        id="quizFeedback"
        class="feedback hidden">

        </div>

        <button
        id="nextQuiz"
        class="btn full hidden"
        onclick="nextQuizQuestion()">

            سؤال بعدی →

        </button>

    </div>

    `;

}


function answerQuiz(index){

    if(quizAnswered)return;

    quizAnswered = true;

    const q =
    currentQuiz[quizIndex];

    const buttons =
    document.querySelectorAll(
        '.quiz-option'
    );

    buttons.forEach(
        b=>b.classList.add(
            'disabled'
        )
    );

    if(index===q.answer){

        quizScore++;

        buttons[index]
        ?.classList.add(
            'correct'
        );

        showQuizOverlay(
            true,
            'آفرین! پاسخ درست بود 🎉'
        );

        const f =
        document.getElementById(
            'quizFeedback'
        );

        f.className =
        'feedback correct';

        f.innerHTML =
        '✓ آفرین! پاسخ درست بود.';

    }else{

        buttons[index]
        ?.classList.add(
            'wrong'
        );

        buttons[q.answer]
        ?.classList.add(
            'correct'
        );

        showQuizOverlay(
            false,
            'این پاسخ درست نبود.'
        );

        const f =
        document.getElementById(
            'quizFeedback'
        );

        f.className =
        'feedback wrong';

        f.innerHTML =
        '✕ پاسخ درست را بررسی کن.';

    }

    document
    .getElementById(
        'nextQuiz'
    )
    ?.classList.remove(
        'hidden'
    );

}


function nextQuizQuestion(){

    quizIndex++;

    quizAnswered = false;

    renderQuiz();

}


function quizResult(){

    const box =
    document.getElementById(
        'studentContent'
    );

    const total =
    currentQuiz.length;

    const percent =
    Math.round(
        quizScore /
        total *
        100
    );

    box.innerHTML = `

    <div class="card">

        <div
        style="text-align:center">

            <div
            style="font-size:60px">

                ${
                    percent>=80
                    ? '🏆'
                    : percent>=50
                    ? '👏'
                    : '📚'
                }

            <h2>
                نتیجه آزمون

            <div
            style="font-size:35px;font-weight:bold;color:var(--primary)">

                ${quizScore}
                /
                ${total}

            </div>

            <p class="muted">

                درصد:

            <button
            class="btn full"

                </div>

            </div>

            ${statusBadge(s.status)}

        </div>

        <div class="actions">

            ${
                s.status!=='registered'
                ?
                `
                <button
                class="btn ok small"
                onclick="setStatus(${s.id},'registered')">

                    ✅ تأیید

                </button>
                `
                :
                ''
            }

            ${
                s.status!=='rejected'
                ?
                `
                <button
                class="btn danger small"
                onclick="setStatus(${s.id},'rejected')">

                    ❌ رد

                </button>
                `
                :
                ''
            }

            ${
                s.status==='registered'
                ?
                `
                <button
                class="btn secondary small"
                onclick="setStatus(${s.id},'graduate')">

                    🎓 فارغ‌التحصیل

                </button>
                `
                :
                ''
            }

            <button
            class="btn secondary small"
            onclick="setStatus(${s.id},'waiting')">

                ↩ صف انتظار

            </button>

        </div>

    </div>

    `;

}

function filterStudents(){

    const q =
    (
        document
        .getElementById(
            'search'
        )
        ?.value ||
        ''
    )
    .toLowerCase();

    const list =
    document.getElementById(
        'list'
    );

    if(!list)return;

    list.innerHTML =
    students
    .filter(s=>

        `
        ${s.first_name||''}
        ${s.last_name||''}
        ${s.phone||''}
        ${s.level||''}
        `
        .toLowerCase()
        .includes(q)

    )
    .map(card)
    .join('')
    ||
    '<div class="empty">موردی پیدا نشد.</div>';

}


async function setStatus(id,s){

    const r =
    await db
    .from('students')
    .update({

        status:s

    })
    .eq(
        'id',
        id
    );

    if(r.error){

        alert(
            r.error.message
        );

        return;

    }

    await adminData();

    dashboard();

    msg(
        'وضعیت با موفقیت تغییر کرد.'
    );

}

/* =========================================================
   OVERLAY
========================================================= */

let overlayTimer = null;


function showQuizOverlay(
    correct,
    text
){

    const overlay =
    document.getElementById(
        'quizOverlay'
    );

    const icon =
    document.getElementById(
        'overlayIcon'
    );

    const txt =
    document.getElementById(
        'overlayText'
    );

    if(!overlay)return;

    clearTimeout(
        overlayTimer
    );

    overlay.className =
    'quiz-overlay show '+
    (
        correct
        ? 'correct'
        : 'wrong'
    );

    icon.textContent =
    correct
    ? '✓'
    : '✕';

    txt.textContent =
    text;

    overlayTimer =
    setTimeout(()=>{

        overlay.className =
        'quiz-overlay';

    },1200);

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array){

    const a =
    [...array];

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j =
        Math.floor(
            Math.random()*
            (i+1)
        );

        [
            a[i],
            a[j]
        ] =
        [
            a[j],
            a[i]
        ];

    }

    return a;

}

========================================================= */

async function logout(){

    await db.auth.signOut();

    user=null;

    me=null;

    isAdmin=false;

    login();

}


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
    async(
        event,
        session
    )=>{

        if(event==='SIGNED_OUT'){

            user=null;

            me=null;

            isAdmin=false;

        }

    }
);


/* =========================================================
   BOOT
========================================================= */

async function boot(){

    try{

        const r =
        await db.auth.getSession();

        const session =
        r.data?.session;

        if(session){

            user =
            session.user;

            await identify();

        }else{

            login();

        }

    }catch(e){

        console.error(e);

        login();

    }

}


boot();
