<script>

'use strict';

const SUPABASE_URL="https://kapzyedzjecnfxevjisq.supabase.co";
const SUPABASE_KEY="sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ACCESS_FUNCTION=SUPABASE_URL+"/functions/v1/student-access";
const REGISTER_FUNCTION=SUPABASE_URL+"/functions/v1/student-register";
const ADMIN_FUNCTION=SUPABASE_URL+"/functions/v1/admin-access";

let S={
student:null,
admin:false,
grade:null,
lesson:null,
quiz:null,
xp:0,
level:1,
progress:{},
achievements:[],
exams:[]
};

let examRecords=JSON.parse(
localStorage.getItem("AN_EXAMS")||"[]"
);

function esc(x){
return String(x??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);
}

function normalizePhone(x){
return String(x||"")
.replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
.replace(/\D/g,"");
}

function showMessage(text,type="error"){
const e=document.getElementById("loginMessage");
e.textContent=text;
e.className="message show "+type;
}

function clearMessage(){
const e=document.getElementById("loginMessage");
e.textContent="";
e.className="message";
}

function selectRole(type){

document.getElementById("studentRoleBtn")
.classList.toggle("active",type==="student");

document.getElementById("adminRoleBtn")
.classList.toggle("active",type==="admin");

document.getElementById("studentLogin")
.classList.toggle("hidden",type!=="student");

document.getElementById("adminLogin")
.classList.toggle("hidden",type!=="admin");

document.getElementById("studentRegister")
.classList.add("hidden");

clearMessage();
}

function showStudentRegister(){
document.getElementById("studentLogin").classList.add("hidden");
document.getElementById("adminLogin").classList.add("hidden");
document.getElementById("studentRegister").classList.remove("hidden");
clearMessage();
}

function showStudentLogin(){
document.getElementById("studentRegister").classList.add("hidden");
document.getElementById("studentLogin").classList.remove("hidden");
document.getElementById("adminLogin").classList.add("hidden");
clearMessage();
}

async function accessFunction(payload){

const r=await fetch(ACCESS_FUNCTION,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},
body:JSON.stringify(payload)
});

let data=null;

try{
data=await r.json();
}catch(e){}

if(!r.ok || data?.ok===false){
throw new Error(
data?.error ||
"خطا در ارتباط با سرور."
);
}

return data;
}


/* =========================
   LOGIN
========================= */

async function studentLogin(){

const phone=normalizePhone(
document.getElementById("studentPhone").value
);

const password=
document.getElementById("studentPassword").value;

if(!/^09\d{9}$/.test(phone)){
showMessage("شماره تلفن را صحیح وارد کنید.");
return;
}

if(!password){
showMessage("رمز عبور را وارد کنید.");
return;
}

try{

const r=await accessFunction({
action:"login",
phone,
password
});

if(!r?.session || !r?.user){
throw new Error("ورود زبان‌آموز انجام نشد.");
}

const sr=await db.auth.setSession({
access_token:r.session.access_token,
refresh_token:r.session.refresh_token
});

if(sr.error)throw sr.error;

S.student={
id:r.user.student_id,
first_name:r.user.first_name,
last_name:r.user.last_name,
phone:r.user.phone,
level:r.user.level,
status:r.user.status,
auth_user_id:r.user.id
};

S.admin=false;

await loadStudentStats();

renderStudentApp();

}catch(e){

try{
await db.auth.signOut();
}catch(_){}

showMessage(
e?.message ||
"ورود ناموفق بود."
);

}

}


async function adminLogin(){

const email=
document.getElementById("adminEmail").value.trim();

const password=
document.getElementById("adminPassword").value;

if(!email||!password){
showMessage("ایمیل و رمز عبور مدیر را وارد کنید.");
return;
}

try{

const r=await fetch(ADMIN_FUNCTION,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},
body:JSON.stringify({
action:"login",
email,
password
})
});

const data=await r.json().catch(()=>null);

if(!r.ok||!data?.ok){
throw new Error(
data?.error ||
"ورود مدیر ناموفق بود."
);
}

const sr=await db.auth.setSession({
access_token:data.session.access_token,
refresh_token:data.session.refresh_token
});

if(sr.error)throw sr.error;

S.admin=true;
S.student=null;

await renderAdmin();

}catch(e){

try{
await db.auth.signOut();
}catch(_){}

showMessage(
e?.message ||
"ورود مدیر ناموفق بود."
);

}

}


/* =========================
   REGISTER
========================= */

async function registerStudent(){

const firstName=
document.getElementById("regFirstName").value.trim();

const lastName=
document.getElementById("regLastName").value.trim();

const phone=
normalizePhone(
document.getElementById("regPhone").value
);

const password=
document.getElementById("regPassword").value;

const level=
document.getElementById("regLevel").value;

if(!firstName||!lastName||!phone||!password||!level){
showMessage("لطفاً همه اطلاعات را تکمیل کنید.");
return;
}

if(!/^09\d{9}$/.test(phone)){
showMessage("شماره تلفن صحیح نیست.");
return;
}

if(password.length<8){
showMessage("رمز عبور باید حداقل ۸ کاراکتر باشد.");
return;
}

try{

const r=await fetch(REGISTER_FUNCTION,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},
body:JSON.stringify({
action:"register",
first_name:firstName,
last_name:lastName,
phone,
password,
level
})
});

const data=await r.json().catch(()=>null);

if(!r.ok||data?.ok===false){
throw new Error(
data?.error ||
"ثبت‌نام انجام نشد."
);
}

showMessage(
"ثبت‌نام با موفقیت انجام شد. حساب شما در انتظار تأیید مدیر است.",
"success"
);

setTimeout(
showStudentLogin,
1500
);

}catch(e){

showMessage(
e?.message ||
"خطا در ثبت‌نام."
);

}

}

async function loadStudentStats(){

if(!S.student)return;

try{

const p=await db
.from("student_progress")
.select("*")
.eq("student_id",S.student.id);

if(!p.error){

S.progress={};

(p.data||[]).forEach(x=>{
S.progress[x.lesson_id]={
progress:x.progress||0,
completed:x.completed||false
};
});

}

}catch(e){}

try{

const a=await db
.from("student_achievements")
.select("*")
.eq("student_id",S.student.id);

if(!a.error){
S.achievements=a.data||[];
}

}catch(e){}

try{

const ex=await db
.from("exam_results")
.select("*")
.eq("student_id",S.student.id)
.order("created_at",{ascending:false});

if(!ex.error){
S.exams=ex.data||[];
}

}catch(e){}

let completed=Object.values(S.progress)
.filter(x=>x.completed).length;

S.xp=completed*100;

S.level=Math.max(
1,
Math.floor(S.xp/500)+1
);

}

function lessonQuestions(grade,index){

const questions=[

{
q:"Choose the correct answer:",
a:"I ___ a student.",
o:["am","is","are"],
c:0
},

{
q:"Choose the correct answer:",
a:"She ___ English.",
o:["study","studies","studying"],
c:1
},

{
q:"Choose the correct answer:",
a:"They ___ friends.",
o:["is","am","are"],
c:2
}

];

return questions.map((q,i)=>`

<div class="question">

<b>${i+1}. ${q.q}</b>

<p class="en" style="direction:ltr">
${q.a}
</p>

${q.o.map((o,j)=>`

<button class="option"
onclick="answerQuestion(this,${j===q.c})">

${esc(o)}

</button>

`).join("")}

</div>

`).join("");

}

function answerQuestion(el,correct){

if(el.parentElement.dataset.done)return;

el.parentElement.dataset.done="1";

if(correct){
el.classList.add("correct");
S.xp+=10;
}else{
el.classList.add("wrong");
}

}

},{
onConflict:"student_id,lesson_id"
});

}

}catch(e){}

alert("🎉 درس با موفقیت تکمیل شد.");

home();

}

/* =========================

========================= */

function placementTest(){

const questions=[

{
q:"She ___ a teacher.",
o:["am","is","are"],
c:1
},

{
q:"They ___ football every Friday.",
o:["play","plays","playing"],
c:0
},

{
q:"I ___ English now.",
o:["study","am studying","studied"],
c:1
},

{
q:"He has ___ apple.",
o:["a","an","the"],
c:1
},

{
q:"This book is ___ than that one.",
o:["good","better","best"],
c:1
},

{
q:"If I have time, I ___ you.",
o:["will call","called","calling"],
c:0
},

{
q:"The opposite of 'easy' is:",
o:["simple","difficult","small"],
c:1
},

{
q:"'Beautiful' means:",
o:["زیبا","سریع","قوی"],
c:0
},

{
q:"She has lived here ___ 2020.",
o:["for","since","at"],
c:1
},

{
q:"The passive form of 'They built the house' is:",
o:["The house was built.","The house built.","The house is build."],
c:0
}

];

let html=`

<div class="hero">

<h2>🎯 آزمون تعیین سطح</h2>

<p>
به ۱۰ سوال پاسخ بده تا سطح تقریبی CEFR تو مشخص شود.
</p>

</div>

<div id="placementBox">

`;

questions.forEach((q,i)=>{

html+=`

<div class="question">

<b>${i+1}. ${q.q}</b>

${q.o.map((o,j)=>`

<button class="option"
onclick="placementAnswer(${i},${j},${j===q.c},this)">
${esc(o)}
</button>

`).join("")}

</div>

`;

});

html+=`

<button class="btn full" onclick="finishPlacement()">
مشاهده نتیجه
</button>

</div>

<div id="placementResult"></div>
`;

document.getElementById("coursesPage").innerHTML=html;

window.placementScores={};

openPage("coursesPage");

}


function placementAnswer(i,j,correct,el){

if(window.placementScores[i]!==undefined)return;

window.placementScores[i]=correct?1:0;

el.classList.add(
correct?"correct":"wrong"
);

}


function finishPlacement(){

const answers=window.placementScores||{};

let score=Object.values(answers)
.reduce((a,b)=>a+b,0);

const percent=Math.round(score/10*100);

let level="A1";

if(percent>=90)level="B2/C1";
else if(percent>=75)level="B1";
else if(percent>=50)level="A2";

document.getElementById("placementResult").innerHTML=`

<div class="card resultBox">

<div class="score">
${percent}٪
</div>

<h2 style="text-align:center">
سطح CEFR شما: ${level}
</h2>

<p style="text-align:center">
${score} پاسخ صحیح از ۱۰ سوال
</p>

<div class="notice">
این نتیجه یک ارزیابی تقریبی است و برای تعیین سطح رسمی باید آزمون کامل‌تری انجام شود.
</div>

<button class="btn full" onclick="home()">
بازگشت به خانه
</button>

</div>

`;

}

async function adminAction(action,payload){

const session=
(await db.auth.getSession()).data?.session;

if(!session){
throw new Error("نشست مدیر منقضی شده است.");

const r=await fetch(ADMIN_FUNCTION,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+session.access_token
},
body:JSON.stringify({
action,
...payload
})
});

const data=await r.json().catch(()=>null);

if(!r.ok||!data?.ok){
throw new Error(
data?.error||
"عملیات انجام نشد."
);
}

return data;
}

async function startup(){

try{

const r=
await db.auth.getSession();

const session=
r.data?.session;

if(!session){
return;
}

const user=session.user;

try{

const ar=await fetch(
ADMIN_FUNCTION,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+session.access_token
},
body:JSON.stringify({
action:"list"
})
}
);

const ad=
await ar.json().catch(()=>null);

if(ar.ok&&ad?.ok){

S.admin=true;
S.student=null;

await renderAdmin();

return;

}

}catch(_){}

const st=
await db
.from("students")
.select("*")
.eq("auth_user_id",user.id)
.maybeSingle();

if(
st.data &&
["registered","approved"].includes(st.data.status)
){

S.student=st.data;
S.admin=false;

await loadStudentStats();

renderStudentApp();

return;

}

await db.auth.signOut();

}catch(e){

try{
await db.auth.signOut();
}catch(_){}

}

}

db.auth.onAuthStateChange(
(event)=>{
if(
event==="SIGNED_OUT" &&
!S.admin &&
!S.student
){
}
}
);

startup();

</script>
