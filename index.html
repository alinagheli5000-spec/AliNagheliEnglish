evel:"C2"},{q:"معنی «unprecedented» چیست؟",o:["بی‌سابقه","تکراری","معمولی","قدیمی"],a:0,level:"C2"}];
function startPlacementTest(kind){ const source = kind==="grammar"? grammarPlacementQ : vocabPlacementQ; const title = kind==="grammar"? "تعیین سطح گرامر" : "تعیین سطح واژگان"; S.quiz={ type:"placement-"+kind,title,kind, questions: source.map(x=>{ const options=shuffle(x.o.slice()); return {q:x.q,options,answer:options.indexOf(x.o[x.a]),level:x.level}; }), i:0, correct:0, wrong:0, levelScores:{A1:0,A2:0,B1:0,B2:0,C1:0,C2:0} }; render(title,`<div id="placementQuiz"></div>`); placementQuizRender("placementQuiz"); }
function placementGrammar(){startPlacementTest("grammar")}
function placementVocab(){startPlacementTest("vocab")}
function placementQuizRender(id){ const q=S.quiz.questions[S.quiz.i]; if(!q){placementFinish();return} const el=document.getElementById(id);if(!el)return; el.innerHTML=`<div class="card"><b style="color:var(--primary)">سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b><div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div><div style="font-size:18px;font-weight:700;line-height:2;margin:18px 0;color:var(--primary-dark)">${esc(q.q)}</div>${q.options.map((x,i)=>`<button class="option" onclick="placementAnswerFinal(${i})">${esc(x)}</button>`).join("")}<div id="fb"></div></div>`; }
async function placementAnswerFinal(i){ const q=S.quiz.questions[S.quiz.i]; const opts=document.querySelectorAll(".option"); opts.forEach(x=>x.disabled=true); const isCorrect=(i===q.answer); if(isCorrect){S.quiz.correct++;S.quiz.levelScores[q.level]=(S.quiz.levelScores[q.level]||0)+1;opts[i].classList.add("correct");} else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");} setTimeout(async()=>{ S.quiz.i++; if(S.quiz.i>=S.quiz.questions.length) await placementFinish(); else placementQuizRender("placementQuiz"); },700); }
async function placementFinish(){ const scores=S.quiz.levelScores; const total=S.quiz.correct; let level="A1"; const order=["A1","A2","B1","B2","C1","C2"]; for(const lv of order){ if((scores[lv]||0)>=3) level=lv; } if(total<=3) level="A1"; const descriptions={A1:"مبتدی",A2:"پیش‌متوسط",B1:"متوسط",B2:"متوسط بالا",C1:"پیشرفته",C2:"فوق‌پیشرفته 🏆"}; const kind=S.quiz.kind; const title=kind==="grammar"?"گرامر":"واژگان"; if(S.student){ try{await db.from("exam_results").insert({user_id:S.student.auth_user_id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,exam_type:"placement-"+kind,exam_title:"تعیین سطح "+title,score:total,total:S.quiz.questions.length,percentage:Math.round(total/S.quiz.questions.length*100)});}catch(e){} } const el=document.getElementById("placementQuiz"); if(el) el.innerHTML=`<div class="card levelCard"><div style="font-size:13px;font-weight:800;opacity:.9">سطح ${title} شما</div><div class="lvl">${level}</div><p style="font-weight:700;margin:10px 0">${descriptions[level]}</p><p class="muted">✅ ${total} پاسخ درست از ${S.quiz.questions.length}</p></div><button class="btn full" onclick="home()">بازگشت</button>`; }
function quizRender(id){ const q=S.quiz.questions[S.quiz.i]; if(!q){quizFinish(id);return} const el=document.getElementById(id);if(!el)return; el.innerHTML=`<div class="card"><b style="color:var(--primary)">سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b><div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div><div style="font-size:18px;font-weight:700;line-height:2;margin:18px 0;color:var(--primary-dark)">${esc(q.q)}</div>${q.options.map((x,i)=>`<button class="option" onclick="answer(${i},'${id}')">${esc(x)}</button>`).join("")}<div id="fb"></div></div>`; }
function answer(i,id){ const q=S.quiz.questions[S.quiz.i]; const opts=document.querySelectorAll(".option"); opts.forEach(x=>x.disabled=true); if(i===q.answer){S.quiz.correct++;opts[i].classList.add("correct");} else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");} setTimeout(()=>{S.quiz.i++;quizRender(id)},700); }
async function quizFinish(id){ const total=S.quiz.questions.length; const percent=total?Math.round(S.quiz.correct/total*100):0; if(S.student){ try{await db.from("exam_results").insert({user_id:S.student.auth_user_id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,exam_type:S.quiz.type,exam_title:S.quiz.title,lesson:S.lesson?S.lesson+1:0,score:S.quiz.correct,total,percentage:percent})}catch(e){} await addXP(Math.max(10,percent)); if(S.quiz.type==="lesson")await saveProgress(`${S.grade}-${S.lesson}`,100,true); } const el=document.getElementById(id);if(!el)return; el.innerHTML=`<div class="card resultBox"><div class="score">${percent}%</div><h2 style="text-align:center">آزمون تمام شد 🎉</h2><p style="text-align:center">${S.quiz.correct} پاسخ درست از ${total}</p><button class="btn full" onclick="profile()">مشاهده پیشرفت</button><button class="btn secondary full" style="margin-top:8px" onclick="home()">بازگشت</button></div>`; }
function sounds(){ render("حروف و صداها",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2 style="margin-top:14px">🔊 الفبای انگلیسی</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${soundsData.map((s,i)=>`<div class="soundCard" onclick='playSoundCard(${i})'><div class="speaker">🔊</div><div class="soundLetter">${esc(s.letter)}</div><div class="soundName">${esc(s.name)}</div><div class="soundEx">${esc(s.sound)}</div></div>`).join("")}</div></div>`); }
function playSoundCard(i){ const s=soundsData[i]; if(!s) return; speakLetter(s.letter.split(" ")[0],s.word,s.ex.replace(/-/g,", ")); }
function courses(){ render("دروس",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2 style="margin-top:14px">📚 کتاب‌های مدرسه</h2><div class="grid">${Object.keys(books).map(g=>`<div class="item" onclick="grade(${g})"><div class="neonIcon purple">${ICONS.books}</div><h3>پایه ${g}</h3><p class="muted">${esc(books[g].title)}</p><button class="btn full">مشاهده</button></div>`).join("")}</div></div>`); }
function grade(g){ S.grade=Number(g); const list=books[g].lessons.map((x,i)=>{ const unlocked=isUnlocked(g,i); const p=S.progress[`${g}-${i}`]||{progress:0,completed:false}; if(!unlocked){ return `<div class="lesson locked"><div class="lockBadge">${ICONS.lock}</div><div class="lessonNo">${i+1}</div><h3>${esc(x)}</h3><button class="btn warning full" onclick="showPayment(${g},${i})">🔓 باز کردن</button></div>`; } return `<div class="lesson"><div class="lessonNo">${i+1}</div><h3>${esc(x)}</h3><div class="progress"><i style="width:${p.progress||0}%"></i></div><div class="btnRow"><button class="btn" onclick="openLesson(${i})">📖 درس</button><button class="btn secondary" onclick="openLessonWords(${i})">🔊 لغات</button></div></div>`; }).join(""); render("پایه "+g,`<div class="card"><button class="btn secondary" onclick="courses()">← بازگشت</button><h2>پایه ${g} — ${esc(books[g].title)}</h2><div class="lessonGrid">${list}</div></div>`); }
function wordsHtml(grade,lessonNumber){ const list=getWords(grade,lessonNumber); if(!list.length)return '<p class="muted">واژگانی ثبت نشده.</p>'; let h=""; list.forEach(function(w){ h+='<div class="word" onclick=\'speak('+JSON.stringify(w[0])+')\'><div class="en">🔊 '+esc(w[0])+'</div><div class="fa">'+esc(w[1])+'</div></div>'; }); return h; }
function grammarHtml(grade,lessonNumber){ const list=getGrammar(grade,lessonNumber); if(!list.length)return '<p class="muted">گرامری ثبت نشده.</p>'; let h=""; list.forEach(function(g){ h+='<div class="grammar"><h3>'+esc(g[0])+'</h3><p>'+esc(g[3]||'')+'</p><div class="example">'+esc(g[1])+'</div><p><b>ترجمه:</b> '+esc(g[2])+'</p></div>'; }); return h; }
function openLesson(i){ if(!isUnlocked(S.grade,i)){ toast("🔒 قفل است.","error"); return; } const gradeNum=S.grade; const no=i+1; const book=books[gradeNum]; const key=gradeNum+"-"+i; S.lesson=i; render("درس "+no,`<div class="card"><button class="btn secondary" onclick="grade(${gradeNum})">← بازگشت</button><h2 style="margin-top:14px">${esc(book.lessons[i])}</h2><div class="tabs2"><button class="tab2 active" onclick="lessonTab(0)">📘 گرامر</button><button class="tab2" onclick="lessonTab(1)">🔊 لغات</button><button class="tab2" onclick="lessonTab(2)">📝 آزمون</button></div><div id="s0" class="sec active">${grammarHtml(gradeNum,no)}<button class="btn full" onclick="completeLesson('${key}')">✅ تکمیل</button></div><div id="s1" class="sec"><div class="wordGrid">${wordsHtml(gradeNum,no)}</div></div><div id="s2" class="sec"><div id="lessonQuiz"></div></div></div>`); }
function openLessonWords(i){ if(!isUnlocked(S.grade,i)){ toast("🔒","error"); return; } const gradeNum=S.grade; const no=i+1; render("لغات",`<div class="card"><button class="btn secondary" onclick="grade(${gradeNum})">← بازگشت</button><h2>${esc(books[gradeNum].lessons[i])} — لغات</h2><div class="wordGrid">${wordsHtml(gradeNum,no)}</div></div>`); }
async function completeLesson(key){ await saveProgress(key,100,true); await addXP(20); toast("تکمیل شد! ⭐ +20 XP","success"); openLesson(S.lesson); }
function lessonTab(n){ document.querySelectorAll(".sec").forEach((x,i)=>x.classList.toggle("active",i===n)); document.querySelectorAll(".tab2").forEach((x,i)=>x.classList.toggle("active",i===n)); if(n===2)startLessonQuiz(); }
function makeLessonQuestions(){ const gradeNum=S.grade; const no=S.lesson+1; const wl=getWords(gradeNum,no); const gl=getGrammar(gradeNum,no); const arr=[]; wl.forEach(function(w,i){ const pool=shuffle(wl.filter(function(_,j){return j!==i}).map(function(x){return x[1]})).slice(0,3); if(pool.length<3)return; const opts=shuffle([w[1]].concat(pool)); arr.push({q:'معنی «'+w[0]+'» چیست؟',options:opts,answer:opts.indexOf(w[1])}); }); return shuffle(arr).slice(0,10); }
function startLessonQuiz(){ S.quiz={type:"lesson",title:`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,questions:makeLessonQuestions(),i:0,correct:0,wrong:0}; quizRender("lessonQuiz"); }

const finalExamBank={10:[{q:"معنی «leopard» چیست؟",o:["پلنگ","فیل","ببر","خرس"],a:0,date:"خرداد ۱۳۹۹"},{q:"معنی «endangered» چیست؟",o:["در معرض خطر","نجات دادن","شکار کردن","محافظت کردن"],a:0,date:"خرداد ۱۴۰۰"},{q:"«go hunting» یعنی چه؟",o:["به شکار رفتن","به خرید رفتن","به سفر رفتن","به ماهیگیری رفتن"],a:0,date:"دی ۱۳۹۹"},{q:"معنی «wildlife» چیست؟",o:["حیات وحش","زندگی وحشی","حیوان خانگی","محیط زیست"],a:0,date:"خرداد ۱۴۰۱"}],11:[{q:"«Skimming» یعنی چه؟",o:["مرور اجمالی","نگاه انداختن","ترجمه کردن","حفظ کردن"],a:0,date:"خرداد ۱۳۹۹"},{q:"«Scanning» یعنی چه؟",o:["نگاه انداختن","مرور اجمالی","نوشتن","خواندن"],a:0,date:"دی ۱۳۹۹"},{q:"کدام گزینه غیرقابل شمارش است؟",o:["water","book","car","apple"],a:0,date:"خرداد ۱۴۰۰"},{q:"«Present Perfect» چه زمانی است؟",o:["حال کامل","حال ساده","گذشته ساده","آینده"],a:0,date:"خرداد ۱۴۰۱"}],12:[{q:"«Collocation» یعنی چه؟",o:["همایند","هم‌معنی","متضاد","مترادف"],a:0,date:"خرداد ۱۳۹۹"},{q:"«Passive Voice» یعنی چه؟",o:["جملات مجهول","جملات معلوم","جملات شرطی","جملات سوالی"],a:0,date:"دی ۱۳۹۹"},{q:"«Tag Questions» یعنی چه؟",o:["سوالات ضمیمه","سوالات اصلی","سوالات فرعی","سوالات کوتاه"],a:0,date:"خرداد ۱۴۰۰"},{q:"ساختار شرطی نوع دوم کدام است؟",o:["If + گذشته ساده, would + مصدر","If + حال ساده, will + مصدر","If + گذشته کامل, would have + p.p","If + حال ساده, would + مصدر"],a:0,date:"خرداد ۱۴۰۱"}]};
function finalExams(){ render("آزمون نهایی",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2 style="margin-top:14px">📄 آزمون نهایی</h2><div class="grid">${[10,11,12].map(g=>`<div class="item" onclick="startFinalExam(${g})"><div class="neonIcon red">${ICONS.exam}</div><h3>پایه ${g}</h3><p class="muted">${finalExamBank[g].length} سؤال</p><button class="btn full">شروع</button></div>`).join("")}</div></div>`); }
function startFinalExam(g){ const qs=finalExamBank[g].map(x=>{ const options=shuffle(x.o.slice()); return {q:x.q,options,answer:options.indexOf(x.o[x.a]),date:x.date||""}; }); S.quiz={type:"final",title:"آزمون نهایی پایه "+g,grade:g,questions:qs,i:0,correct:0,wrong:0}; render("آزمون",`<div id="finalQuiz"></div>`); finalQuizRender("finalQuiz"); }
function finalQuizRender(id){ const q=S.quiz.questions[S.quiz.i]; if(!q){quizFinish(id);return} const el=document.getElementById(id);if(!el)return; const dateTag=q.date?`<span class="examDate">(${esc(q.date)})</span>`:""; el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><b>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>${dateTag}</div><div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div><div style="font-size:18px;font-weight:700;margin:18px 0">${esc(q.q)}</div>${q.options.map((x,i)=>`<button class="option" onclick="finalAnswer(${i},'${id}')">${esc(x)}</button>`).join("")}</div>`; }
function finalAnswer(i,id){ const q=S.quiz.questions[S.quiz.i]; const opts=document.querySelectorAll(".option"); opts.forEach(x=>x.disabled=true); if(i===q.answer){S.quiz.correct++;opts[i].classList.add("correct");} else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");} setTimeout(()=>{S.quiz.i++;finalQuizRender(id)},700); }/* ==================== Q&A و تکالیف و اساتید ==================== */
async function loadQAs(){ if(!S.student)return; try{ const r=await db.from("student_questions").select("*").eq("student_id",S.student.id).order("created_at",{ascending:false}); S.qas=r.data||[]; }catch(e){S.qas=[]} }
async function loadHomeworks(){ if(!S.student)return; try{ const r=await db.from("student_homeworks").select("*").eq("student_id",S.student.id).order("created_at",{ascending:false}); S.homeworks=r.data||[]; }catch(e){S.homeworks=[]} }
function qaPage(){ if(!S.student){toast("ابتدا وارد شوید","error");return} const list=S.qas; render("پرسش از استاد",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2>💬 پرسش از استاد</h2><button class="btn full" onclick="askQuestion()">✏️ پرسش جدید</button></div>${list.length?list.map(q=>{ const teacher=getTeacher(q.teacher_id); return `<div class="qaThread" onclick="openThread('${q.id}')" style="cursor:pointer"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>${esc(q.subject||"")}</b><span class="qaStatus ${q.teacher_reply?"answered":"open"}">${q.teacher_reply?"✅":"⏳"}</span></div><div class="muted">👨‍🏫 ${esc(teacher.name)}</div></div>`; }).join(""):`<div class="card"><p class="muted" style="text-align:center">هنوز سؤالی نپرسیدی.</p></div>`}`); }
function askQuestion(){ render("پرسش جدید",`<div class="card"><button class="btn secondary" onclick="qaPage()">← بازگشت</button><h2>✏️ پرسش جدید</h2><label>استاد</label><select id="qTeacher">${teachersData.map(t=>`<option value="${t.id}">${t.icon} ${esc(t.name)}</option>`).join("")}</select><label>موضوع</label><input id="qSubject"><label>سؤال</label><textarea id="qBody"></textarea><button class="btn full" onclick="submitQuestion()">📨 ارسال</button></div>`); }
async function submitQuestion(){ const teacher_id=document.getElementById("qTeacher").value; const subject=document.getElementById("qSubject").value.trim(); const question=document.getElementById("qBody").value.trim(); if(!subject||!question){toast("پر کن","error");return} try{ const r=await db.from("student_questions").insert({student_id:S.student.id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,student_phone:S.student.phone,teacher_id,subject,question,student_read:true}); if(r.error)throw r.error; toast("ارسال شد ✅","success"); await loadQAs(); qaPage(); }catch(e){toast("خطا: "+e.message,"error")} }
async function openThread(id){ const q=S.qas.find(x=>x.id===id); if(!q)return; const teacher=getTeacher(q.teacher_id); render("گفت‌وگو",`<div class="card"><button class="btn secondary" onclick="qaPage()">← بازگشت</button><h2>${esc(q.subject)}</h2><div style="margin:20px 0"><div class="qaMsg student"><div class="meta">👤 شما</div>${esc(q.question)}</div>${q.teacher_reply?`<div class="qaMsg teacher"><div class="meta">👨‍🏫 ${esc(teacher.name)}</div>${esc(q.teacher_reply)}</div>`:`<p class="muted" style="text-align:center">⏳ در انتظار...</p>`}</div></div>`); if(q.teacher_reply&&!q.student_read){ try{await db.from("student_questions").update({student_read:true}).eq("id",id);}catch(e){} } }
function homeworkPage(){ if(!S.student){toast("ابتدا وارد شوید","error");return} const list=S.homeworks; render("تکالیف",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2>📝 تکالیف</h2><button class="btn full" onclick="newHomework()">✏️ ارسال جدید</button></div>${list.length?list.map(h=>{ return `<div class="hwCard"><b>${esc(h.title||"")}</b><div class="muted">${esc(h.description||"")}</div>${h.grade!=null?`<div style="margin-top:8px"><b>نمره: ${h.grade}/20</b></div>`:""}</div>`; }).join(""):`<div class="card"><p class="muted" style="text-align:center">هنوز تکلیفی نداری.</p></div>`}`); }
function newHomework(){ render("تکلیف جدید",`<div class="card"><button class="btn secondary" onclick="homeworkPage()">← بازگشت</button><h2>✏️ تکلیف جدید</h2><label>استاد</label><select id="hTeacher">${teachersData.map(t=>`<option value="${t.id}">${t.icon} ${esc(t.name)}</option>`).join("")}</select><label>عنوان</label><input id="hTitle"><label>توضیحات</label><textarea id="hDesc"></textarea><label>لینک (اختیاری)</label><input id="hLink"><button class="btn full" onclick="submitHomework()">📤 ارسال</button></div>`); }
async function submitHomework(){ const teacher_id=document.getElementById("hTeacher").value; const title=document.getElementById("hTitle").value.trim(); const description=document.getElementById("hDesc").value.trim(); const link=document.getElementById("hLink").value.trim(); if(!title){toast("عنوان","error");return} try{ const r=await db.from("student_homeworks").insert({student_id:S.student.id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,student_phone:S.student.phone,teacher_id,title,description,link:link||null,submitted:true}); if(r.error)throw r.error; toast("ارسال شد ✅","success"); await loadHomeworks(); homeworkPage(); }catch(e){toast("خطا: "+e.message,"error")} }
function teachers(){ render("اساتید",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2>👨‍🏫 اساتید</h2></div><div class="teacher">${teachersData.map(t=>`<div class="teacherBox"><div class="teacherAvatar">${t.icon}</div><h2 style="text-align:center">${esc(t.name)}</h2><p style="text-align:center;color:var(--primary)">${esc(t.degree)}</p><p>${esc(t.text)}</p><a class="btn call" href="tel:${t.phone}">📞 ${t.phone}</a><a class="btn success full" href="https://wa.me/98${t.phone.substring(1)}" target="_blank">💬 واتساپ</a></div>`).join("")}</div>`); }
async function leaderboard(){ render("لیدربورد",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2>🏆 لیدربورد</h2><div class="skel" style="height:60px"></div></div>`); try{ const r=await db.from("student_xp").select("xp,level,student_id,students(first_name,last_name)").order("xp",{ascending:false}).limit(20); const rows=r.data||[]; render("لیدربورد",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2>🏆 لیدربورد</h2>${rows.map((row,i)=>{ const name=row.students?`${row.students.first_name||""} ${row.students.last_name||""}`:"زبان‌آموز"; const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`; return `<div class="leaderRow"><div class="leaderRank">${medal}</div><div class="leaderName">${esc(name)}</div><div class="leaderXP">⭐ ${row.xp}</div></div>`; }).join("")}</div>`); }catch(e){} }
function referralPage(){ const code=S.student?("AN"+String(S.student.id||"").padStart(4,"0")):"AN0000"; const link=location.origin+location.pathname+"?ref="+code; render("دعوت",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2>🎁 دعوت دوستان</h2><div class="referBox"><div class="referCode">${esc(code)}</div><button class="btn" onclick="copyRef('${code}')">📋 کپی</button></div></div>`); }
function copyRef(text){ try{navigator.clipboard.writeText(text);toast("کپی شد!","success")}catch(e){toast(text,"info",5000)} }
async function profile(){ await loadStudentStats(); const completed=Object.values(S.progress).filter(x=>x.completed).length; const referralCode="AN"+String(S.student?.id||"").padStart(4,"0"); render("پروفایل",`<div class="card"><div style="text-align:center"><div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--bg-grad-2),#ddd6fe);display:flex;align-items:center;justify-content:center;font-size:44px;margin:auto">👤</div><h2>${esc(S.student?.first_name||"")} ${esc(S.student?.last_name||"")}</h2><p class="muted">📱 ${esc(S.student?.phone||"")}</p></div></div><div class="grid"><div class="profileStat">⭐ XP<b>${S.xp}</b></div><div class="profileStat">🏅 Level<b>${S.level}</b></div><div class="profileStat">🦉 جغد<b>سطح ${getOwlStage(S.level)}</b></div><div class="profileStat">📚 تکمیل<b>${completed}</b></div></div><div class="card"><h3>🎁 کد معرف</h3><div class="referCode">${esc(referralCode)}</div></div><button class="btn secondary full" onclick="logout()">خروج</button>`); }

/* ==================== Admin ==================== */
async function admin(){ try{ const r=await db.from("students").select("*").order("id",{ascending:false}); const req=await db.from("teacher_requests").select("*").order("created_at",{ascending:false}); const qs=await db.from("student_questions").select("*").order("created_at",{ascending:false}); const hw=await db.from("student_homeworks").select("*").order("created_at",{ascending:false}); renderAdmin(r.data||[],req.data||[],qs.data||[],hw.data||[]); }catch(e){ document.body.innerHTML=`<div class="container"><div class="card"><h2>خطا</h2><p>${esc(e.message)}</p></div></div>`; } }
function renderAdmin(students,requests,questions,homeworks){ document.body.innerHTML=`${header("پنل مدیریت")}<main class="container"><div class="hero"><h2 style="margin-top:0">👨‍💼 پنل مدیریت</h2></div><div class="grid"><div class="item"><h3>زبان‌آموزان</h3><b style="font-size:26px;color:var(--primary)">${students.length}</b></div><div class="item"><h3>سؤالات</h3><b style="font-size:26px;color:var(--info)">${questions.length}</b></div></div><div class="card"><h3>💬 سؤالات</h3>${questions.length?questions.map(q=>`<div class="adminRow"><b>${esc(q.student_name||"")}</b><div class="muted">📌 ${esc(q.subject||"")}<br>❓ ${esc(q.question||"")}</div>${q.teacher_reply?`<div style="margin-top:10px;background:var(--bg-grad-1);padding:10px;border-radius:12px"><b>✅ پاسخ:</b> ${esc(q.teacher_reply)}</div>`:`<label>پاسخ:</label><textarea id="qr${q.id}"></textarea><button class="btn success" onclick="replyQuestion('${q.id}')">📨 ارسال</button>`}</div>`).join(""):`<p class="muted">سؤالی نیست.</p>`}</div><div class="card"><h3>👥 ثبت‌نام‌ها</h3>${students.map(x=>`<div class="adminRow"><b>${esc(x.first_name)} ${esc(x.last_name)}</b><div class="muted">📱 ${esc(x.phone||"")} · پایه ${esc(x.level||"-")}</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${x.status==="waiting"?`<button class="btn success" onclick="approve('${x.id}')">✅ تأیید</button><button class="btn danger" onclick="rejectStudent('${x.id}')">❌ رد</button>`:`<span>${x.status==="rejected"?"❌":"✅"}</span>`}</div></div>`).join("")}</div><button class="btn secondary full" onclick="logout()">خروج</button></main><div class="toast-wrap" id="toastWrap"></div>`; }
async function replyQuestion(id){ const txt=document.getElementById("qr"+id).value.trim(); if(!txt){toast("پاسخ","error");return} try{ await db.from("student_questions").update({teacher_reply:txt,replied_at:new Date().toISOString(),student_read:false}).eq("id",id); toast("ارسال شد ✅","success"); admin(); }catch(e){toast("خطا","error")} }
async function approve(id){try{await db.from("students").update({status:"registered"}).eq("id",id);toast("تأیید شد ✅","success");admin()}catch(e){}}
async function rejectStudent(id){try{await db.from("students").update({status:"rejected"}).eq("id",id);toast("رد شد","success");admin()}catch(e){}}

/* ==================== Logout + Startup ==================== */
async function logout(){ try{await db.auth.signOut()}catch(e){} S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],exams:[],unlocks:{},streak:0,lastVisit:null,qas:[],homeworks:[],gameRecords:{},currentGame:null,touchstoneLesson:null,touchstone2Lesson:null,touchstone3Lesson:null,viewpoint1Lesson:null}; landing(); }
async function startup(){ try{ const r=await db.auth.getSession(); const session=r.data?.session; const sp=document.getElementById("splash"); const hideSplash=()=>{if(sp)sp.style.display="none"}; if(!session){setTimeout(()=>{hideSplash();landing()},1500);return} const user=session.user; if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){S.admin=true;setTimeout(()=>{hideSplash();admin()},1500);return} const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle(); if(st.data&&["registered","approved"].includes(st.data.status)){ S.student=st.data; await loadStudentStats(); await loadUnlocks(); loadStreak();loadGameRecords(); await loadQAs(); await loadHomeworks(); setTimeout(()=>{hideSplash();home()},1500); return; } await db.auth.signOut(); setTimeout(()=>{hideSplash();landing()},1500); }catch(e){ try{await db.auth.signOut()}catch(_){} setTimeout(()=>{const sp=document.getElementById("splash");if(sp)sp.style.display="none";landing()},1500); } }
db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT"&&!S.admin&&!S.student)landing()});
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ const swCode=`self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});self.addEventListener("fetch",e=>{});`; try{ const blob=new Blob([swCode],{type:"application/javascript"}); const url=URL.createObjectURL(blob); navigator.serviceWorker.register(url).catch(()=>{}); }catch(e){} }); }
startup();
</script>
</body>
