:root{
--p:#6d28d9;--p2:#9333ea;--bg:#f7f4ff;--card:#fff;--text:#18121f;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;padding-bottom:80px}
button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.header{background:linear-gradient(135deg,var(--p),var(--p2));color:white;padding:25px 16px;border-radius:0 0 28px 28px}
.container{max-width:1100px;margin:auto;padding:14px}
.card{background:white;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 25px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.course{border:1px solid #e9d5ff;background:linear-gradient(145deg,#fff,#f3e8ff);color:#4c1d95;border-radius:22px;padding:18px 10px;min-height:135px;font-size:16px;font-weight:bold}
.icon{display:block;font-size:42px;margin-bottom:8px}
.btn{border:0;background:var(--p);color:white;padding:12px 18px;border-radius:14px;font-weight:bold;margin:4px}
.btn.secondary{background:#ede9fe;color:#5b21b6}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;margin:6px 0}

.example{direction:ltr;text-align:left;background:white;border-radius:11px;padding:10px;margin:7px 0;box-shadow:0 2px 8px #00000008}
.word{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fafafa;border-radius:14px;padding:10px;margin:7px 0}
.wordText{direction:ltr;text-align:left;flex:1}
.wordText small{display:block;direction:rtl;text-align:right;color:#666;margin-top:4px}
.speak{border:0;background:#ede9fe;color:var(--p);border-radius:13px;width:48px;height:48px;font-size:21px}
.option{width:100%;padding:13px;margin:6px 0;background:white;border:2px solid #e5e7eb;border-radius:13px;text-align:right}
.option.correct{border-color:var(--green);background:#dcfce7;color:#166534}
.option.wrong{border-color:var(--red);background:#fee2e2;color:#991b1b}
.progress{height:10px;background:#eee;border-radius:10px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:linear-gradient(90deg,var(--p),var(--p2))}
.result{text-align:center;background:#f3e8ff;border-radius:18px;padding:20px;font-size:21px;line-height:2}
.teacherGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.teacher{background:linear-gradient(145deg,#fff,#faf5ff);border:1px solid #e9d5ff;border-radius:22px;padding:20px}
.phone{display:block;color:var(--p);font-weight:bold;text-decoration:none;direction:ltr;text-align:right;margin-top:12px}
.nav{position:fixed;z-index:1000;bottom:0;left:0;right:0;background:white;display:flex;padding:7px;box-shadow:0 -5px 22px #0002}
.nav button{flex:1;border:0;background:white;border-radius:12px;padding:8px 2px;font-size:11px}
.nav button.active{background:#ede9fe;color:var(--p);font-weight:bold}
.rank{display:flex;justify-content:space-between;align-items:center;background:#faf5ff;padding:13px;border-radius:14px;margin:7px 0}
.badge{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:20px;padding:5px 10px;margin:3px;font-size:12px}
#overlay{position:fixed;z-index:3000;inset:0;background:var(--bg);overflow:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}
th{background:#faf5ff}
.table{overflow:auto}
.stat{background:#faf5ff;border-radius:18px;padding:18px;text-align:center}
.stat b{display:block;font-size:27px;color:var(--p)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>

function speak(text){

if(!("speechSynthesis" in window)){
alert("مرورگر دستگاه شما از پخش صوتی پشتیبانی نمی‌کند.");
return;
}

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);
u.lang="en-US";
u.rate=.65;
u.pitch=1;
u.volume=1;

const voices=speechSynthesis.getVoices();
const v=voices.find(x=>x.lang.toLowerCase()==="en-us")||voices.find(x=>x.lang.toLowerCase().startsWith("en"));
if(v)u.voice=v;

speechSynthesis.speak(u);
}

function makeLessonQuiz(g,i){

const l=SCHOOL[g][i];
let words=l[2].map(splitWord);
let qs=[];

words.forEach(([en,fa])=>{
let others=words.filter(x=>x[0]!==en);

qs.push({
q:`معنی "${en}" چیست؟`,
a:fa,
o:shuffle([fa,...others.slice(0,3).map(x=>x[1])])
});

qs.push({
q:`"${fa}" به انگلیسی چیست؟`,
a:en,
o:shuffle([en,...others.slice(0,3).map(x=>x[0])])
});
});

l.slice(4).forEach(x=>{
qs.push({
q:"کدام جمله مربوط به این درس است؟",
a:x,
o:shuffle([x,...l.slice(4).filter(y=>y!==x)])
})
});

while(qs.length<15){
qs.push(qs[qs.length%Math.max(1,qs.length)])
}

return shuffle(qs).slice(0,15);
}

function lessonQuiz(g,i){

const qs=makeLessonQuiz(g,i);

quiz={
type:`${g} - ${SCHOOL[g][i][0]}`,
questions:qs,
i:0,
correct:0,
wrong:0,
negative:false
};

openQuiz();
}

function shuffle(a){
return [...a].sort(()=>Math.random()-.5)
}

function openQuiz(){
document.getElementById("overlay").classList.remove("hidden");
renderQuiz();
}

function renderQuiz(){

const q=quiz.questions[quiz.i];
const n=quiz.i+1;
const total=quiz.questions.length;

document.getElementById("quizHead").innerHTML=`
<h2>📝 ${quiz.type}</h2>
<span class="badge">سؤال ${n} از ${total}</span>
<span class="badge">✅ ${quiz.correct}</span>
<span class="badge">❌ ${quiz.wrong}</span>
<div class="progress"><div style="width:${(n-1)/total*100}%"></div></div>
`;

document.getElementById("quizBody").innerHTML=`
<div class="lesson">
<h3>${q.q}</h3>
${q.o.map(o=>`<button class="option" onclick="answer(this,${JSON.stringify(o)},${JSON.stringify(q.a)})">${o}</button>`).join("")}
</div>
`;
}

function answer(btn,a,c){

if(btn.disabled)return;

document.querySelectorAll(".option").forEach(x=>x.disabled=true);

if(a===c){
btn.classList.add("correct");
quiz.correct++;
}else{
btn.classList.add("wrong");
quiz.wrong++;
document.querySelectorAll(".option").forEach(x=>{
if(x.textContent.trim()===c)x.classList.add("correct")
})
}

setTimeout(()=>{
quiz.i++;
if(quiz.i>=quiz.questions.length)finishQuiz();
else renderQuiz();
},650);
}

async function finishQuiz(){

let score=quiz.negative
?Math.max(0,Math.round(((quiz.correct-quiz.wrong*.25)/quiz.questions.length)*100))
:Math.round(quiz.correct/quiz.questions.length*100);

await saveResult(quiz.type,score,quiz.correct,quiz.questions.length);

document.getElementById("quizHead").innerHTML="<h2>🎉 نتیجه آزمون</h2>";

document.getElementById("quizBody").innerHTML=`
<div class="result">
صحیح: ${quiz.correct}<br>
غلط: ${quiz.wrong}<br><br>
نمره نهایی:<br>
<strong>${score}٪</strong>
</div>
`;
}

async function saveResult(type,score,correct,total){

let records=JSON.parse(localStorage.getItem("ali_records")||"[]");

records.unshift({
type,score,correct,total,
date:new Date().toLocaleDateString("fa-IR")
});

localStorage.setItem("ali_records",JSON.stringify(records.slice(0,200)));

if(student){

const {data:s}=await supabaseClient
.from("students")
.select("id")
.eq("auth_user_id",student.id)
.maybeSingle();

if(s){
await supabaseClient.from("exam_attempts").insert({
student_id:s.id,
exam_type:type,
score,
correct_answers:correct,
total_questions:total
});
}

}

}
