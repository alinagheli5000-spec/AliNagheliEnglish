/* XP */

function calculateLevel(xp){
 return Math.max(1,Math.floor(Number(xp||0)/100)+1);
}

function xpForLevel(level){
 return (level-1)*100;
}

async function loadStudentStats(){
 if(!S.student)return;

 S.xp=0;
 S.level=1;
 S.progress={};
 S.achievements=[];
 S.exams=[];

 try{
  const r=await db.from("student_xp")
   .select("xp,level")
   .eq("student_id",S.student.id)
   .maybeSingle();

  if(r.data){
   S.xp=Number(r.data.xp||0);
   S.level=Number(r.data.level||calculateLevel(S.xp));
  }
 }catch(e){}

 try{
  const r=await db.from("student_progress")
   .select("lesson_id,progress,completed")
   .eq("student_id",S.student.id);

  (r.data||[]).forEach(x=>{
   S.progress[x.lesson_id]={
    progress:Number(x.progress||0),
    completed:Boolean(x.completed)
   };
  });
 }catch(e){}

 try{
  const r=await db.from("student_achievements")
   .select("achievement_key,title")
   .eq("student_id",S.student.id);

  S.achievements=r.data||[];
 }catch(e){}

 try{
  const r=await db.from("exam_results")
   .select("*")
   .eq("user_id",S.student.auth_user_id)
   .order("created_at",{ascending:false});

  S.exams=r.data||[];
 }catch(e){}
}

async function addXP(amount){
 if(!S.student)return;

 const old=S.xp;
 S.xp+=Number(amount||0);
 S.level=calculateLevel(S.xp);

 /*
  * XP remains synchronized with the existing backend.
  * The value is never trusted for authentication/authorization.
  */
 try{
  await db.from("student_xp").upsert({
   student_id:S.student.id,
   xp:S.xp,
   level:S.level,
   updated_at:new Date().toISOString()
  },{onConflict:"student_id"});
 }catch(e){}

 if(S.level>calculateLevel(old)){
  await unlockAchievement(
   "level_"+S.level,
   "رسیدن به Level "+S.level
  );
 }
}

async function unlockAchievement(key,title){
 if(!S.student)return;
 if(S.achievements.some(x=>x.achievement_key===key))return;

 try{
  const r=await db.from("student_achievements").insert({
   student_id:S.student.id,
   achievement_key:key,
   title
  });

  if(!r.error){
   S.achievements.push({
    achievement_key:key,
    title
   });
  }
 }catch(e){}
}

async function saveProgress(lessonId,progress,completed){
 if(!S.student)return;

 const safeProgress=Math.max(
  0,
  Math.min(100,Number(progress||0))
 );

 S.progress[lessonId]={
  progress:safeProgress,
  completed:Boolean(completed)
 };

 try{
  await db.from("student_progress").upsert({
   student_id:S.student.id,
   lesson_id:lessonId,
   progress:safeProgress,
   completed:Boolean(completed),
   completed_at:completed?new Date().toISOString():null
  },{onConflict:"student_id,lesson_id"});
 }catch(e){}
}

/* QUIZ ENGINE */

function shuffle(arr){
 const a=[...arr];

 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

 return a;
}

function makeQuestion(q,correct,others){
 const pool=shuffle(
  Array.isArray(others)?others:[]
 ).filter(x=>x!==correct).slice(0,3);

 const options=shuffle([
  correct,
  ...pool
 ]);

 return {
  q,
  options,
  answer:options.indexOf(correct)
 };
}

function startLessonQuiz(){
 const data=grammar[S.lesson+1]||[];

 let q=[];

 data.forEach((g,i)=>{
  const correct=g[1];

  const candidates=data
   .filter((_,j)=>j!==i)
   .map(x=>x[1]);

  q.push(
   makeQuestion(
    `کدام گزینه مربوط به «${g[0]}» است؟`,
    correct,
    candidates
   )
  );
 });

 if(q.length<5){
  const extra=[
   ["What is your name?","My name is Ali."],
   ["How old are you?","I am twelve years old."],
   ["Where do you live?","I live in Iran."],
   ["What is your favorite subject?","English."],
   ["How are you?","I am fine."]
  ];

  extra.forEach(x=>{
   if(q.length<5){
    q.push(
     makeQuestion(
      x[0],
      x[1],
      extra.map(y=>y[1])
     )
    );
   }
  });
 }

 S.quiz={
  type:"lesson",
  title:
   `پایه ${S.grade} - درس ${S.lesson+1}`,
  questions:q.slice(0,10),
  i:0,
  correct:0,
  wrong:0
 };

 quizRender("lessonQuiz");
}

function quizRender(id){
 const el=document.getElementById(id);

 if(!el||!S.quiz)return;

 if(S.quiz.i>=S.quiz.questions.length){
  quizFinish(id);
  return;
 }

 const q=S.quiz.questions[S.quiz.i];

 el.innerHTML=`
 <div class="card">

  <div class="muted">
   سؤال ${S.quiz.i+1}
   از ${S.quiz.questions.length}
  </div>

  <div class="progress">
   <i style="
    width:${
     Math.round(
      S.quiz.i/
      S.quiz.questions.length*100
     )
    }%">
   </i>
  </div>

  <h3>
   ${esc(q.q)}
  </h3>

  ${q.options.map((o,i)=>`
   <button
    class="option"
    onclick="answer(${i},'${id}')">
    ${esc(o)}
   </button>
  `).join("")}

  <div id="fb"></div>

 </div>`;
}

function answer(i,id){
 if(!S.quiz)return;

 const q=S.quiz.questions[S.quiz.i];

 const opts=document.querySelectorAll(
  ".option"
 );

 opts.forEach(x=>x.disabled=true);

 if(i===q.answer){
  S.quiz.correct++;

  opts[i].classList.add("correct");

  document.getElementById("fb").className=
   "feedback ok";

  document.getElementById("fb").innerHTML=
   "✅ 😊 آفرین! پاسخ درست است.";

 }else{
  S.quiz.wrong++;

  opts[i].classList.add("wrong");

  if(opts[q.answer]){
   opts[q.answer].classList.add("correct");
  }

  document.getElementById("fb").className=
   "feedback bad";

  document.getElementById("fb").innerHTML=
   "❌ پاسخ اشتباه است.";
 }

 setTimeout(()=>{
  S.quiz.i++;
  quizRender(id);
 },700);
}

 const total=S.quiz.questions.length;

 const percent=total
  ?Math.round(
    S.quiz.correct/total*100
   )
  :0;

 examRecords.unshift({
  student:S.student?.phone||"",
  title:S.quiz.title,
  score:percent,
  date:new Date().toISOString()
 });

 saveLocal();

 if(S.student){

  try{
   await db.from("exam_results").insert({
    user_id:S.student.auth_user_id,
    student_name:
     `${S.student.first_name||""} ${S.student.last_name||""}`.trim(),
    exam_type:S.quiz.type,
    exam_title:S.quiz.title,
    lesson:S.lesson!=null?S.lesson+1:null,
    score:S.quiz.correct,
    total,

   });

  await addXP(Math.max(10,percent));

  if(percent>=80){
   await unlockAchievement(
    "exam_80",
    "امتیاز بالای ۸۰٪"
   );
  }

  if(percent===100){
   await unlockAchievement(
    "perfect_exam",
    "آزمون کامل"
   );
  }

  if(S.quiz.type==="lesson"){
   await saveProgress(
    `${S.grade}-${S.lesson}`,

    true
   );
  }

function conversationQuiz(name,unit){

  ["What is the meaning of teacher?","معلم"],
  ["What is the meaning of friend?","دوست"],
  ["What is the meaning of information?","اطلاعات"]
 ];

  const pool=shuffle(
   q.filter((_,j)=>j!==i)

  ).slice(0,3);

   x[1],

 });

  wrong:0
 };

function startContest(g){
 let q=[];

 for(let i=1;i<=8;i++){

  (words[i]||[]).forEach((w,j)=>{

   if(q.length>=20)return;

   const pool=shuffle(
    (words[i]||[])
     .filter((_,k)=>k!==j)
     .map(x=>x[1])
   ).slice(0,3);

   const options=shuffle([
    w[1],
    ...pool
   ]);

   q.push({
    q:`معنی "${w[0]}" چیست؟`,
    options,
    answer:options.indexOf(w[1])
   });
  });
 }

 while(q.length<20){

  const base=[
   {
    q:"Which sentence is correct?",
    a:"She is a student."
   },
   {
    q:"Which sentence is correct?",
    a:"They are happy."
   },
   {
    q:"Which sentence is correct?",
    a:"I am a teacher."
   },
   {
    q:"Which sentence is correct?",
    a:"He is my friend."
   }
  ][q.length%4];

  const options=shuffle([
   base.a,
   "She are a student.",
   "They is happy.",
   "I is a teacher."
  ]);

  q.push({
   q:base.q,
   options,
   answer:options.indexOf(base.a)
  });
 }

 S.quiz={
  type:"contest",
  title:"مسابقه پایه "+g,
  questions:q.slice(0,20),
  i:0,
  correct:0,
  wrong:0
 };

 render(

  `<div id="contestQuiz"></div>`
 );

 quizRender("contestQuiz");
}

 <button
  class="btn danger full"
  onclick="logout()">
  🚪 خروج از حساب
 </button>
 `);
}

/* ADMIN */

async function admin(){
 if(!S.admin){
  login();
  return;
 }

 try{
  const r=await db.from("students")
   .select("*")
   .order("id",{ascending:false});

  if(r.error)throw r.error;

  const req=await db.from("teacher_requests")
   .select("*")
   .order("created_at",{ascending:false});

  if(req.error)throw req.error;

  renderAdmin(
   r.data||[],
   req.data||[]
  );

 }catch(e){

  document.body.innerHTML=`
  <div class="container">

   <div class="card">

    <h2>
     خطا در پنل مدیر
    </h2>

    <p>
     ${esc(e.message)}
    </p>

    <button
     class="btn"
     onclick="admin()">
     تلاش مجدد
    </button>

   </div>

  </div>`;
 }
}

  </div>

    students.length
    ?
    students.map(x=>`
     <div class="adminRow">

      <b>
       ${esc(x.first_name)}
       ${esc(x.last_name)}

      <div class="muted">

       <br>

async function respondRequest(id,status){
 if(!S.admin)return;

 try{
  const r=await db.from("teacher_requests")
   .update({status})
   .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){
  alert(
   "خطا:\n"+
   (e?.message||"خطای نامشخص")
  );
 }
}

async function approve(id){
 if(!S.admin)return;

 try{
  const r=await db.from("students")
   .update({
    status:"registered"
   })
   .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){
  alert(
   "خطا در تأیید:\n"+
   (e?.message||"خطای نامشخص")
  );
 }
}

async function rejectStudent(id){
 if(!S.admin)return;

 try{
  const r=await db.from("students")
   .update({
    status:"rejected"
   })
   .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){
  alert(
   "خطا:\n"+
   (e?.message||"خطای نامشخص")
  );
 }
}

/* LOGOUT */

async function logout(){
 try{
  await db.auth.signOut();
 }catch(e){}

 S={
  student:null,
  admin:false,
  grade:null,
  lesson:null,
  quiz:null,
  xp:0,
  level:1,
  progress:{},
  achievements:[],
  exams:[]
 };

 login();
}

/* SESSION START */

async function startup(){

 try{

  const r=await db.auth.getSession();
  const session=r.data?.session;

  if(!session){
   login();
   return;
  }

  const user=session.user;

  /*
   * Admin is verified through the admins table,
   * not only through the email address.
   */
  const adminCheck=await db.from("admins")
   .select("id,user_id,auth_user_id,is_admin")
   .or(
    `user_id.eq.${user.id},auth_user_id.eq.${user.id}`
   )
   .maybeSingle();

  if(
   !adminCheck.error&&
   adminCheck.data&&
   adminCheck.data.is_admin===true
  ){
   S.admin=true;
   S.student=null;
   admin();
   return;
  }

  const st=await db.from("students")
   .select("*")
   .eq("auth_user_id",user.id)
   .maybeSingle();

  if(
   st.data&&
   ["registered","approved"]
    .includes(st.data.status)
  ){

   S.student=st.data;
   S.admin=false;

   await loadStudentStats();

   home();
   return;
  }

  await db.auth.signOut();
  login();

 }catch(e){

  try{
   await db.auth.signOut();
  }catch(_){}

  login();
 }
}

db.auth.onAuthStateChange(event=>{

 if(event==="SIGNED_OUT"){
  if(!S.admin&&!S.student){
   /*
    * Avoid duplicate rendering while logout()
    * already sends the user to login().
    */
   const app=document.getElementById("app");
   if(app)login();
  }
 }

});

startup();
</script>
