.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#ffffff08;right:-100px;bottom:-160px}
.hero h1{font-size:28px;margin:8px 0;position:relative;z-index:2}
.hero p{position:relative;z-index:2;opacity:.9}
