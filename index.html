<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--p:#6d28d9;--bg:#f7f5fb;--c:#fff;--t:#211b2d;--m:#766e82;--b:#e7e1ef}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:var(--t)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.top{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;padding:16px;position:sticky;top:0;z-index:5}
.topin,.wrap{max-width:1100px;margin:auto}
.topin{display:flex;justify-content:space-between;align-items:center}
.wrap{padding:16px 12px 80px}
.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 7px 20px #00000008}
.login{max-width:450px;margin:35px auto}
.logo{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:bold;margin:auto}
.tabs{display:flex;gap:7px;margin:15px 0}
.tab,.btn{border:0;border-radius:11px;padding:11px 14px}
.tab{flex:1;background:#eee8f7;color:#543b70}
.tab.active,.btn{background:#6d28d9;color:#fff}
.btn.secondary{background:#eee8f7;color:#543b70}
.btn.ok{background:#dcfce7;color:#166534}
.btn.small{padding:7px 10px;font-size:12px}
label{display:block;font-size:13px;font-weight:bold;margin:9px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--b);border-radius:11px;padding:11px;background:#fff}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:#faf8fd;border:1px solid var(--b);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;margin-top:5px}
.student{border:1px solid var(--b);border-radius:14px;padding:13px;margin:9px 0}
.head{display:flex;justify-content:space-between;gap:8px}
.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:bold}
.waiting{background:#fff7ed;color:#9a3412}
.registered{background:#dcfce7;color:#166534}
.graduate{background:#ede9fe;color:#5b21b6}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.muted{color:var(--m);font-size:12px}
.notice{padding:10px;border-radius:10px;margin-bottom:10px}
.err{background:#fee2e2;color:#991b1b}
.okmsg{background:#dcfce7;color:#166534}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);z-index:6}
.navin{max-width:700px;margin:auto;display:flex}
.nav button{flex:1;border:0;background:#fff;padding:10px;color:#6b6175;font-size:11px}
.nav button.active{color:#6d28d9;font-weight:bold}
.empty{text-align:center;padding:25px;color:var(--m)}
h1,h2,h3{margin-top:0}
@media(max-width:500px){
.wrap{padding:10px 9px 78px}
.login{margin:20px auto}
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const URL='https://kapzyedzjecnfxevjisq.supabase.co';
const KEY='sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ';

const db=supabase.createClient(URL,KEY);

let user=null;
let isAdmin=false;
let me=null;
let students=[];
let courses=[];

const esc=x=>String(x??'').replace(
    /[&<>"']/g,
    m=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
    }[m])
);

const emailFor=p=>
    String(p||'').replace(/\D/g,'')+'@alinagheli.com';

function msg(t,c='okmsg'){
    document.querySelector('.notice')?.remove();

    let x=document.createElement('div');
    x.className='notice '+c;
    x.textContent=t;

    document.querySelector('.wrap')?.prepend(x);

    setTimeout(()=>x.remove(),4500);
}

async function boot(){

    let {data:{session}}=await db.auth.getSession();

    if(session){
        user=session.user;
        await identify();
    }else{
        login();
    }

    db.auth.onAuthStateChange(async(_,s)=>{

        if(s){
            user=s.user;
            await identify();
        }else{
            user=null;
            isAdmin=false;
            me=null;
            login();
        }

    });
}

async function identify(){

    isAdmin=!!(
        await db
        .from('admins')
        .select('id')
        .eq('user_id',user.id)
        .maybeSingle()
    ).data;

    if(isAdmin){

        await adminData();
        appAdmin();

    }else{

        me=(
            await db
            .from('students')
            .select('*')
            .eq('auth_user_id',user.id)
            .maybeSingle()
        ).data;

        appStudent();
    }
}

async function adminData(){

    let a=await db
        .from('students')
        .select('*')
        .order('id',{ascending:false});

    students=a.data||[];

    let c=await db
        .from('courses')
        .select('*')
        .order('id');

    courses=c.data||[];
}

function login(){

    document.body.innerHTML=`
    <div class="wrap">
        <div class="card login">

            <div class="logo">AN</div>

            <h1 style="text-align:center">
                AliNagheli English
            </h1>

            <p class="muted" style="text-align:center">
                سامانه آموزش زبان انگلیسی
            </p>

            <div class="tabs">

                <button
                    class="tab active"
                    id="ts"
                    onclick="loginForm(0)">
                    دانش‌آموز
                </button>

                <button
                    class="tab"
                    id="ta"
                    onclick="loginForm(1)">
                    مدیر
                </button>

            </div>

            <div id="lf"></div>

        </div>
    </div>`;

    loginForm(0);
}

function loginForm(m){

    document
    .querySelectorAll('.tab')
    .forEach(x=>x.classList.remove('active'));

    (
        m
        ? document.getElementById('ta')
        : document.getElementById('ts')
    ).classList.add('active');

    document.getElementById('lf').innerHTML=m

    ? `
        <label>ایمیل مدیر</label>
        <input id="email" type="email">

        <label>رمز عبور</label>
        <input id="pass" type="password">

        <button
            class="btn"
            style="width:100%;margin-top:12px"
            onclick="adminLogin()">
            ورود مدیر
        </button>
    `

    : `
        <label>شماره تلفن</label>
        <input id="phone" inputmode="tel">

        <label>رمز عبور</label>
        <input id="pass" type="password">

        <button
            class="btn"
            style="width:100%;margin-top:12px"
            onclick="studentLogin()">
            ورود دانش‌آموز
        </button>

        <button
            class="btn secondary"
            style="width:100%;margin-top:8px"
            onclick="registerForm()">
            ثبت‌نام دانش‌آموز جدید
        </button>
    `;
}

async function adminLogin(){

    let e=email.value.trim();
    let p=pass.value;

    if(!e||!p)
        return alert('ایمیل و رمز را وارد کنید');

    let r=await db.auth.signInWithPassword({
        email:e,
        password:p
    });

    if(r.error)
        return alert('ایمیل یا رمز عبور نادرست است');

    user=r.data.user;

    await identify();
}

async function studentLogin(){

    let p=phone.value.trim();
    let pw=pass.value;

    if(!p||!pw)
        return alert('شماره و رمز را وارد کنید');

    let r=await db.auth.signInWithPassword({
        email:emailFor(p),
        password:pw
    });

    if(r.error)
        return alert('شماره تلفن یا رمز عبور نادرست است');

    user=r.data.user;

    await identify();
}

async function registerForm(){

    await adminData();

    lf.innerHTML=`

    <h3>ثبت‌نام دانش‌آموز</h3>

    <div class="row">

        <div>
            <label>نام</label>
            <input id="rf">
        </div>

        <div>
            <label>نام خانوادگی</label>
            <input id="rl">
        </div>

    </div>

    <div class="row">

        <div>
            <label>شماره تلفن</label>
            <input id="rp">
        </div>

        <div>
            <label>رمز عبور</label>
            <input id="rw" type="password">
        </div>

    </div>

    <div class="row">

        <div>
            <label>پایه / سطح</label>
            <input id="rv">
        </div>

        <div>

            <label>دوره</label>

            <select id="rc">

                <option value="">
                    انتخاب دوره
                </option>

                ${
                    courses
                    .map(c=>`
                        <option>
                            ${esc(c.title)}
                        </option>
                    `)
                    .join('')
                }

            </select>

        </div>

    </div>

    <label>هدف</label>
    <textarea id="rg"></textarea>

    <button
        class="btn"
        style="width:100%;margin-top:10px"
        onclick="register()">
        ثبت‌نام
    </button>

    <button
        class="btn secondary"
        style="width:100%;margin-top:8px"
        onclick="login()">
        بازگشت
    </button>
    `;
}

async function register(){

    let f=rf.value.trim();
    let l=rl.value.trim();
    let p=rp.value.trim();
    let pw=rw.value;

    if(!f||!l||!p||!pw)
        return alert('موارد الزامی را کامل کنید');

    let r=await db.auth.signUp({
        email:emailFor(p),
        password:pw
    });

    if(r.error)
        return alert(r.error.message);

    if(!r.data.user)
        return alert('حساب ساخته نشد');

    let ins=await db
        .from('students')
        .insert({
            first_name:f,
            last_name:l,
            phone:p,
            level:rv.value.trim(),
            status:'waiting',
            auth_user_id:r.data.user.id,
            password_created:true
        });

    if(ins.error)
        return alert(ins.error.message);

    alert(
        'ثبت‌نام با موفقیت انجام شد و در صف انتظار قرار گرفت.'
    );

    login();
}

function head(title,sub){

    return `
    <div class="top">

        <div class="topin">

            <div>

                <b>${title}</b>

                <div
                    class="muted"
                    style="color:#eee">
                    ${sub||''}
                </div>

            </div>

            <button
                class="btn secondary small"
                onclick="logout()">
                خروج
            </button>

        </div>

    </div>
    `;
}

function nav(){

    return `
    <nav class="nav">

        <div class="navin">

            <button onclick="appAdmin()">
                📊<br>
                داشبورد
            </button>

            <button onclick="studentsPage()">
                👩‍🎓<br>
                دانش‌آموزان
            </button>

            <button onclick="coursesPage()">
                📚<br>
                دوره‌ها
            </button>

        </div>

    </nav>
    `;
}

function appAdmin(){

    document.body.innerHTML=
        head(
            'AliNagheli English',
            'پنل مدیریت'
        )
        +
        `
        <main class="wrap">
            <div id="content"></div>
        </main>
        `
        +
        nav();

    dashboard();
}

function status(s){

    let c=
        s==='registered'
        ? 'registered'
        : s==='graduate'
        ? 'graduate'
        : 'waiting';

    let t=
        s==='registered'
        ? 'ثبت‌نام شده'
        : s==='graduate'
        ? 'فارغ‌التحصیل'
        : 'در صف انتظار';

    return `
        <span class="badge ${c}">
            ${t}
        </span>
    `;
}

function dashboard(){

    let w=students.filter(
        s=>s.status==='waiting'
    ).length;

    let r=students.filter(
        s=>s.status==='registered'
    ).length;

    let g=students.filter(
        s=>s.status==='graduate'
    ).length;

    content.innerHTML=`

    <div class="card">

        <h2>
            داشبورد مدیریت 👋
        </h2>

        <div class="grid">

            <div class="stat">
                کل
                <b>${students.length}</b>
            </div>

            <div class="stat">
                در صف انتظار
                <b>${w}</b>
            </div>

            <div class="stat">
                ثبت‌نام شده
                <b>${r}</b>
            </div>

            <div class="stat">
                فارغ‌التحصیل
                <b>${g}</b>
            </div>

        </div>

    </div>

    <div class="card">

        <h3>
            ثبت‌نام‌های در انتظار
        </h3>

        ${
            students
            .filter(s=>s.status==='waiting')
            .slice(0,10)
            .map(card)
            .join('')
            ||
            '<div class="empty">موردی نیست.</div>'
        }

    </div>
    `;
}

function card(s){

    return `

    <div class="student">

        <div class="head">

            <div>

                <b>
                    ${esc(s.first_name)}
                    ${esc(s.last_name)}
                </b>

                <div class="muted">
                    ${esc(s.phone)}
                    ·
                    ${esc(s.level||'-')}
                </div>

            </div>

            ${status(s.status)}

        </div>

        <div
            class="muted"
            style="margin-top:7px">

            دوره:
            ${esc(s.course||s.book||'-')}

        </div>

        <div class="actions">

            ${
                s.status==='waiting'
                ?
                `
                <button
                    class="btn ok small"
                    onclick="setStatus(${s.id},'registered')">
                    تأیید ثبت‌نام
                </button>
                `
                :
                ''
            }

            ${
                s.status==='registered'
                ?
                `
                <button
                    class="btn secondary small"
                    onclick="setStatus(${s.id},'graduate')">
                    فارغ‌التحصیل
                </button>
                `
                :
                ''
            }

            <button
                class="btn secondary small"
                onclick="setStatus(${s.id},'waiting')">
                صف انتظار
            </button>

        </div>

    </div>
    `;
}

async function studentsPage(){

    await adminData();

    content.innerHTML=`

    <div class="card">

        <h2>
            مدیریت دانش‌آموزان
        </h2>

        <input
            id="search"
            placeholder="جستجوی نام یا شماره"
            oninput="filter()">

        <div id="list"></div>

    </div>
    `;

    filter();
}

function filter(){

    let q=(search.value||'').toLowerCase();

    list.innerHTML=

        students

        .filter(s=>
            `${s.first_name} ${s.last_name} ${s.phone} ${s.level}`
            .toLowerCase()
            .includes(q)
        )

        .map(card)
        .join('')

        ||

        '<div class="empty">موردی پیدا نشد.</div>';
}

async function setStatus(id,s){

    let r=await db
        .from('students')
        .update({
            status:s
        })
        .eq('id',id);

    if(r.error)
        return alert(r.error.message);

    await adminData();

    dashboard();

    msg(
        'وضعیت با موفقیت تغییر کرد.'
    );
}

function coursesPage(){

    content.innerHTML=`

    <div class="card">

        <h2>
            دوره‌ها 📚
        </h2>

        ${
            courses

            .map(c=>`

                <div class="student">

                    <b>
                        ${esc(c.title)}
                    </b>

                    <div class="muted">

                        ${esc(c.category||'')}
                        ·
                        ${
                            c.active===false
                            ? 'غیرفعال'
                            : 'فعال'
                        }

                    </div>

                </div>

            `)

            .join('')
        }

    </div>
    `;
}

function appStudent(){

    document.body.innerHTML=

        head(
            'AliNagheli English',
            'حساب دانش‌آموز'
        )

        +

        `
        <main class="wrap">

            <div class="card">

                <h2>
                    سلام
                    ${esc(me?.first_name||'دانش‌آموز')}
                    👋
                </h2>

                <p>
                    وضعیت ثبت‌نام:
                    ${status(me?.status)}
                </p>

                <div class="grid">

                    <div class="stat">

                        نام

                        <b>
                            ${esc(
                                (me?.first_name||'-')
                                +
                                ' '
                                +
                                (me?.last_name||'')
                            )}
                        </b>

                    </div>

                    <div class="stat">

                        پایه

                        <b>
                            ${esc(me?.level||'-')}
                        </b>

                    </div>

                    <div class="stat">

                        شماره

                        <b>
                            ${esc(me?.phone||'-')}
                        </b>

                    </div>

                </div>

            </div>

            <div class="card">

                <h3>
                    وضعیت ثبت‌نام
                </h3>

                <p class="muted">

                    در صورت «در صف انتظار»،
                    مدیر پس از بررسی ثبت‌نام
                    شما را تأیید می‌کند.

                </p>

            </div>

        </main>
        `;
}

async function logout(){

    await db.auth.signOut();

}

boot();

</script>
</body>
</html>
