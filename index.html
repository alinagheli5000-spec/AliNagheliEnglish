const SUPABASE_URL="https://kapzyedzjecnfxevjisq.supabase.co";

const $=id=>document.getElementById(id);

function normalizePhone(v){
 v=String(v||"").replace(/\D/g,"");
 if(v.startsWith("98"))v="0"+v.slice(2);
 if(v.startsWith("9"))v="0"+v;
 return v;
}

function validPhone(v){return /^09\d{9}$/.test(v)}

function message(text,ok=false){
 $("message").innerHTML=text?`<div class="msg ${ok?"ok":"err"}">${text}</div>`:"";
}

function show(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 const el=$(page);
 if(el)el.classList.add("active");
 window.scrollTo(0,0);
}

function openApp(){
 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");
}

function openAuth(){
 $("app").classList.add("hidden");
 $("auth").classList.remove("hidden");
}

async function studentLogin(){
 const phone=normalizePhone($("phone").value);
 const password=$("password").value;

 if(!validPhone(phone)||!password){
  message("شماره تلفن یا رمز عبور صحیح نیست.");
  return;
 }

 try{
  const response=await fetch(
   SUPABASE_URL+"/functions/v1/student-access",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+SUPABASE_KEY
    },
    body:JSON.stringify({action:"find",phone})
   }
  );

  const result=await response.json();

  if(!response.ok)
   throw new Error(result.error||result.message||"خطا در بررسی زبان‌آموز.");

  const student=result.student;

  if(!student)
   throw new Error("زبان‌آموزی با این شماره پیدا نشد.");

  if(student.status!=="registered"&&student.status!=="approved")
   throw new Error("ثبت‌نام شما هنوز توسط مدیر تأیید نشده است.");

  /*
   * مهم:
   * بعضی حساب‌های قدیمی ایمیل کوتاه‌شده دارند،
   * بنابراین اول login_email خود رکورد را امتحان می‌کنیم،
   * سپس email برگشتی Edge Function،
   * سپس شماره کامل.
   */
  const emails=[];

  if(student.login_email)emails.push(student.login_email);
  if(result.email)emails.push(result.email);
  emails.push(phone+"@alinagheli.com");

  let authData=null;
  let lastError=null;

  for(const email of [...new Set(emails)]){
   const attempt=await db.auth.signInWithPassword({
    email:email,
    password:password
   });

   if(!attempt.error){
    authData=attempt.data;
    break;
   }

   lastError=attempt.error;
  }

  if(!authData)
   throw lastError||new Error("ورود ناموفق بود.");

  currentUser=authData.user;

  const q=await db
   .from("students")
   .select("*")
   .eq("auth_user_id",currentUser.id)
   .maybeSingle();

  if(q.error)throw q.error;

  if(!q.data){
   await db.auth.signOut();
   throw new Error("حساب زبان‌آموز با پروفایل آموزشی متصل نیست.");
  }

  currentStudent=q.data;
  isAdmin=false;

  openApp();
  show("home");
  loadStudent();
 }catch(e){
  message(e.message||"ورود ناموفق بود.");
 }
}

async function adminLogin(){
 const email=$("adminEmail").value.trim().toLowerCase();
 const password=$("adminPassword").value;

 if(!email||!password){
  message("ایمیل و رمز عبور مدیر را وارد کنید.");
  return;
 }

 try{
  const auth=await db.auth.signInWithPassword({
   email,
   password
  });

  if(auth.error)throw auth.error;

  currentUser=auth.data.user;

  let q=await db
   .from("admins")
   .select("id,user_id,auth_user_id,is_admin")
   .eq("user_id",currentUser.id)
   .maybeSingle();

  if(q.error)throw q.error;

  if(!q.data){
   q=await db
    .from("admins")
    .select("id,user_id,auth_user_id,is_admin")
    .eq("auth_user_id",currentUser.id)
    .maybeSingle();

   if(q.error)throw q.error;
  }

  if(!q.data||q.data.is_admin!==true){
   await db.auth.signOut();
   throw new Error("این حساب دسترسی مدیر ندارد.");
  }

  isAdmin=true;
  currentStudent=null;

  openApp();
  show("admin");
  await loadStudents();

 }catch(e){
  message(e.message||"ورود مدیر ناموفق بود.");
 }
}

async function registerStudent(){
 const first=$("rf").value.trim();
 const last=$("rl").value.trim();
 const phone=normalizePhone($("rp").value);
 const password=$("rpass").value;
 const level=$("rlevel").value;

 if(!first||!last||!validPhone(phone)||password.length<6){
  message("اطلاعات ثبت‌نام را کامل و صحیح وارد کنید.");
  return;
 }

 try{
  const response=await fetch(
   SUPABASE_URL+"/functions/v1/student-register",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+SUPABASE_KEY
    },
    body:JSON.stringify({
     first_name:first,
     last_name:last,
     phone,
     password,
     level
    })
   }
  );

  const result=await response.json();

  if(!response.ok)
   throw new Error(result.error||result.message||"ثبت‌نام ناموفق بود.");

  $("registerBox").classList.add("hidden");
  $("studentBox").classList.remove("hidden");

  message("ثبت‌نام با موفقیت انجام شد. پس از تأیید مدیر می‌توانید وارد شوید.",true);

 }catch(e){
  message(e.message||"ثبت‌نام ناموفق بود.");
 }
}

function loadStudent(){
 $("welcome").textContent="سلام "+(currentStudent.first_name||"زبان‌آموز")+" 👋";

 $("profileData").innerHTML=`
 <p><b>نام:</b> ${currentStudent.first_name||""} ${currentStudent.last_name||""}</p>
 <p><b>شماره:</b> ${currentStudent.phone||""}</p>
 <p><b>پایه:</b> ${currentStudent.level||"-"}</p>
 `;
 renderGrades();
}

function openLesson(g,l){
 $("lessonTitle").textContent=`پایه ${g} — درس ${l}`;

 const words=VOCAB[g]||[];

 $("wordList").innerHTML=words.length
 ?words.map(w=>`
 <button class="word" data-speak="${w[0].replace(/"/g,"&quot;")}" type="button">
 🔊<div class="en">${w[0]}</div>
 <div>${w[1]}</div>
 </button>`).join("")
 :"<div class='card'>لغات این درس آماده مطالعه است.</div>";

 show("lesson");
}

function startQuiz(){
 let i=0,score=0;

 const draw=()=>{
  if(i>=100){
   $("quiz").innerHTML=`<div class="msg ok">🎉 مسابقه تمام شد.<br>امتیاز: ${score} از 100</div>`;
   $("startQuiz").classList.remove("hidden");
   return;
  }

  <div class="card">
  <b>سؤال ${i+1} از ۱۰۰</b>
  <p>Choose the correct answer.</p>
  <button class="btn secondary answer" data-a="A" type="button">A</button>
  <button class="btn secondary answer" data-a="B" type="button">B</button>
  <button class="btn secondary answer" data-a="C" type="button">C</button>
  <button class="btn secondary answer" data-a="D" type="button">D</button>
  </div>`;
 };

 $("startQuiz").classList.add("hidden");
 $("quiz").onclick=e=>{
  const b=e.target.closest(".answer");
  if(!b)return;
  if(b.dataset.a==="A")score++;
  i++;
  draw();
 };
 draw();
}

function startLevel(){
 $("startLevel").classList.add("hidden");

 $("levelQuiz").innerHTML=`
 <div class="card">
 <b>She ___ English every day.</b>
 <button class="btn secondary levelAnswer" data-x="A" type="button">study</button>
 <button class="btn secondary levelAnswer" data-x="B" type="button">studies</button>
 <button class="btn secondary levelAnswer" data-x="C" type="button">studying</button>
 </div>`;

 $("levelQuiz").onclick=e=>{
  const b=e.target.closest(".levelAnswer");
  if(!b)return;

  $("levelQuiz").innerHTML=`
  <div class="msg ok">
  نتیجه اولیه: ${b.dataset.x==="B"?"A2":"A1"}
  </div>`;

  $("startLevel").classList.remove("hidden");
 };
}

async function loadStudents(){
 const q=await db
  .from("students")
  .select("*")
  .order("id",{ascending:false});

 if(q.error){
  $("students").innerHTML=`<div class="msg err">${q.error.message}</div>`;
  return;
 }

 $("students").innerHTML=q.data.map(s=>`
 <div class="card">
 <b>${s.first_name||""} ${s.last_name||""}</b>
 <br>📱 ${s.phone||""}
 <br>📚 پایه: ${s.level||"-"}
 <br>وضعیت: ${s.status||"-"}
 </div>
 `).join("");
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 currentStudent=null;
 isAdmin=false;
 openAuth();
 show("home");
 message("");
}

$("studentTab").onclick=()=>{
 $("studentTab").classList.add("active");
 $("adminTab").classList.remove("active");
 $("studentBox").classList.remove("hidden");
 $("adminBox").classList.add("hidden");
 $("registerBox").classList.add("hidden");
 message("");
};

$("adminTab").onclick=()=>{
 $("adminTab").classList.add("active");
 $("studentTab").classList.remove("active");
 $("studentBox").classList.add("hidden");
 $("adminBox").classList.remove("hidden");
 $("registerBox").classList.add("hidden");
 message("");
};

$("showRegister").onclick=()=>{
 $("studentBox").classList.add("hidden");
 $("registerBox").classList.remove("hidden");
 message("");
};

$("back").onclick=()=>{
 $("registerBox").classList.add("hidden");
 $("studentBox").classList.remove("hidden");
 message("");
};

$("studentLogin").onclick=studentLogin;
$("adminLogin").onclick=adminLogin;
$("register").onclick=registerStudent;
$("logout").onclick=logout;
$("refreshStudents").onclick=loadStudents;
$("startQuiz").onclick=startQuiz;
$("startLevel").onclick=startLevel;
$("lessonBack").onclick=()=>show("lessons");

document.addEventListener("click",e=>{

 const page=e.target.closest("[data-page]");
 if(page){
  show(page.dataset.page);
  return;
 }

 const grade=e.target.closest("[data-grade]:not([data-lesson])");
 if(grade){
  openGrade(grade.dataset.grade);
  return;
 }

 const lesson=e.target.closest("[data-lesson]");
 if(lesson){
  openLesson(lesson.dataset.grade,lesson.dataset.lesson);
  return;
 }

 const speak=e.target.closest("[data-speak]");
 if(speak&&window.speechSynthesis){
  const u=new SpeechSynthesisUtterance(speak.dataset.speak);
  u.lang="en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
 }
});

$("phone").onkeydown=e=>{if(e.key==="Enter")studentLogin()};
$("password").onkeydown=e=>{if(e.key==="Enter")studentLogin()};
$("adminPassword").onkeydown=e=>{if(e.key==="Enter")adminLogin()};

(async()=>{
 const session=await db.auth.getSession();

 if(!session.data.session)return;

 currentUser=session.data.session.user;

 let a=await db
  .from("admins")
  .select("id,user_id,auth_user_id,is_admin")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(!a.data){
  a=await db
   .from("admins")
   .select("id,user_id,auth_user_id,is_admin")
   .eq("auth_user_id",currentUser.id)
   .maybeSingle();
 }

 if(a.data?.is_admin===true){
  isAdmin=true;
  openApp();
  show("admin");
  loadStudents();
  return;
 }

 const s=await db
  .from("students")
  .select("*")
  .eq("auth_user_id",currentUser.id)
  .maybeSingle();

 if(s.data){
  currentStudent=s.data;
  openApp();
  show("home");
  loadStudent();
 }else{
  await db.auth.signOut();
 }
})();
</script>
