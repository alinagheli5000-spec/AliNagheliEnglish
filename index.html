<!doctype html>

<html lang="fa" dir="rtl">
<head>

<style>
:root{
--primary:#4f46e5;--primary2:#7c3aed;--bg:#f5f7fb;--card:#fff;
--text:#172033;--muted:#6b7280;--border:#e5e7eb;
--green:#16a34a;--red:#dc2626;--orange:#f59e0b;--blue:#2563eb
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:auto;padding:18px 12px 100px}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:18px;margin-bottom:15px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
.top{position:sticky;top:0;z-index:50;background:rgba(17,24,39,.96);color:#fff;padding:14px 15px;backdrop-filter:blur(12px)}
.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-title{font-size:18px;font-weight:bold}
.top-sub{font-size:10px;color:#cbd5e1;margin-top:4px}
.btn{border:0;border-radius:13px;padding:12px 15px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-weight:bold}
.btn.secondary{background:#eef2ff;color:#4338ca}
.btn.ok{background:#dcfce7;color:#166534}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.small{padding:8px 10px;font-size:11px}
.full{width:100%}
label{display:block;margin:9px 0 5px;font-size:13px;font-weight:bold}
input,select,textarea{width:100%;border:1px solid var(--border);background:#fff;border-radius:13px;padding:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #4f46e51c}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px}
.stat{background:#f8fafc;border:1px solid var(--border);border-radius:17px;padding:14px}
.stat b{display:block;font-size:23px;margin-top:5px;color:var(--primary)}
.muted{color:var(--muted);font-size:12px;line-height:1.8}
.notice{padding:12px;border-radius:13px;margin-bottom:12px}
.err{background:#fee2e2;color:#991b1b}
.okmsg{background:#dcfce7;color:#166534}
.login{max-width:450px;margin:35px auto}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 10% 10%,#818cf8 0,#6366f1 25%,transparent 45%),radial-gradient(circle at 90% 90%,#c084fc 0,#8b5cf6 25%,transparent 45%),linear-gradient(135deg,#111827,#312e81)}
.login-card{width:min(450px,100%);background:rgba(255,255,255,.97);border-radius:30px;padding:28px 22px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.logo{width:78px;height:78px;border-radius:24px;margin:auto;display:grid;place-items:center;color:#fff;font-size:27px;font-weight:bold;background:linear-gradient(135deg,#4f46e5,#9333ea);box-shadow:0 15px 35px #4f46e555}
.login-title{text-align:center;font-size:24px;font-weight:bold;margin-top:14px}
.login-sub{text-align:center;color:#6b7280;font-size:12px;margin:8px 0 22px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{flex:1;border:0;border-radius:14px;padding:12px;background:#f1f5f9;color:#64748b;font-weight:bold}
.tab.active{background:#eef2ff;color:#4338ca}
.hero{border-radius:25px;padding:22px;color:#fff;margin-bottom:15px;background:linear-gradient(135deg,#111827,#312e81 55%,#7c3aed);box-shadow:0 15px 35px #312e8140}
.hero h2{margin:0 0 7px}.hero p{margin:0;color:#ddd6fe;font-size:12px;line-height:1.9}
.course-card{position:relative;overflow:hidden;min-height:155px;border-radius:22px;padding:18px;background:#fff;border:1px solid var(--border);box-shadow:0 8px 22px rgba(15,23,42,.06);cursor:pointer;transition:.2s}
.course-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(15,23,42,.1)}
.course-number{font-size:31px;font-weight:bold;color:var(--primary)}
.course-card h3{margin:7px 0}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:bold}
.waiting{background:#fff7ed;color:#9a3412}.registered{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.graduate{background:#ede9fe;color:#5b21b6}
.student{border:1px solid var(--border);border-radius:16px;padding:14px;margin:9px 0}
.head{display:flex;justify-content:space-between;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid var(--border);box-shadow:0 -7px 25px rgba(15,23,42,.08)}
.navin{max-width:700px;margin:auto;display:flex}
.navin button{
flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:3px;border:0;background:white;padding:10px 5px;color:#64748b;font-size:11px
}
.navin button.active{color:var(--primary);font-weight:bold}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.lesson-tabs{display:flex;gap:7px;margin-bottom:14px}
.lesson-tab{flex:1;border:0;border-radius:13px;padding:12px 5px;background:#e5e7eb;color:#374151}
.lesson-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white}
.lesson{display:none}.lesson.active{display:block}
.grammar-box{border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:10px;background:#fff}
.example{direction:ltr;text-align:left;margin-top:9px;background:#f8fafc;padding:11px;border-radius:11px;font-family:Arial,sans-serif;color:#312e81}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.word{border:1px solid #e0e7ff;background:#f8faff;border-radius:15px;padding:12px 8px;text-align:center;cursor:pointer;transition:.18s}
.word:hover{background:#eef2ff;transform:translateY(-1px)}
.word-en{display:block;direction:ltr;font-weight:bold;color:#4338ca}.word-fa{display:block;margin-top:5px;color:#64748b;font-size:11px}.word-hint{display:block;margin-top:6px;font-size:9px;color:#94a3b8}
.quiz-card{border-radius:22px;padding:18px;background:white;border:1px solid var(--border)}
.quiz-progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.quiz-progress div{height:100%;background:linear-gradient(90deg,#4f46e5,#a855f7);transition:.3s}
.quiz-question{font-size:18px;font-weight:bold;line-height:1.9;margin-bottom:16px}
.quiz-option{width:100%;text-align:right;border:1px solid #e5e7eb;background:#fff;padding:13px;border-radius:14px;margin:8px 0;transition:.15s}
.quiz-option:hover{background:#f8fafc}.quiz-option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}.quiz-option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}.quiz-option.disabled{pointer-events:none}
.feedback{min-height:50px;display:flex;align-items:center;justify-content:center;border-radius:16px;margin:12px 0;font-weight:bold;font-size:15px}
.feedback.correct{background:#dcfce7;color:#166534}.feedback.wrong{background:#fee2e2;color:#991b1b}
.feedback-icon{font-size:32px;margin-left:8px}
@keyframes happy{0%{transform:scale(.4) rotate(-10deg);opacity:0}60%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.happy{animation:happy .45s ease}.shake{animation:shake .35s ease}
.quiz-overlay{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;width:min(310px,90%);display:none;padding:18px;text-align:center;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);font-weight:bold}
.quiz-overlay.show{display:block}.quiz-overlay.correct{background:#dcfce7;color:#166534}.quiz-overlay.wrong{background:#fee2e2;color:#991b1b}
.overlay-icon{display:block;font-size:55px;margin-bottom:5px}
.history-table,.rank-table{width:100%;border-collapse:collapse;font-size:12px}
.history-table th,.history-table td,.rank-table th,.rank-table td{padding:11px 7px;border-bottom:1px solid #e5e7eb;text-align:center}
.history-table th,.rank-table th{background:#f8fafc}
.score-good{color:#16a34a;font-weight:bold}.score-mid{color:#d97706;font-weight:bold}.score-low{color:#dc2626;font-weight:bold}
.rank-1{font-size:18px}.rank-2{font-size:17px}.rank-3{font-size:16px}
.result-big{text-align:center;padding:25px 10px}.result-big strong{display:block;font-size:48px;color:var(--primary)}
.empty{text-align:center;padding:25px 10px;color:#94a3b8;line-height:2}
@media(max-width:500px){.wrap{padding:12px 9px 95px}.login{margin:15px auto}.course-card{min-height:140px}.quiz-question{font-size:16px}.history-table,.rank-table{font-size:10px}}
</style>
</head>

<script>
const URL='https://kapzyedzjecnfxevjisq.supabase.co';
const KEY='sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ';
const db=supabase.createClient(URL,KEY);let user=null,isAdmin=false,me=null,students=[],courses=[];
let currentCourse=null,currentQuiz=[],currentQuizIndex=0,currentQuizScore=0,currentQuizAnswered=false,currentQuizType='';
let examHistory=[],exam100Questions=[],exam100Index=0,exam100Score=0,exam100Answered=false;

const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'''}[m]));
function emailFor(phone){return String(phone||'').replace(/\D/g,'')+'@alinagheli.com'}
function msg(text,type='okmsg'){const old=document.querySelector('.notice');if(old)old.remove();const x=document.createElement('div');x.className='notice '+type;x.textContent=text;document.querySelector('.wrap')?.prepend(x);setTimeout(()=>x.remove(),5000)}
function statusBadge(status){if(status==='registered')return '<span class="badge registered">ثبت‌نام شده</span>';if(status==='rejected')return '<span class="badge rejected">رد شده</span>';if(status==='graduate')return '<span class="badge graduate">فارغ‌التحصیل</span>';return '<span class="badge waiting">در صف انتظار</span>'}
function scoreClass(score){return score>=80?'score-good':score>=50?'score-mid':'score-low'}

function login(){
document.body.innerHTML="<div class="login-page"><div class="login-card"><div class="logo">AN</div><div class="login-title">AliNagheli English</div><div class="login-sub">سامانه آموزش زبان انگلیسی</div><div class="tabs"><button class="tab active" id="ts" onclick="loginForm(0)">🎓 دانش‌آموز</button><button class="tab" id="ta" onclick="loginForm(1)">👨‍🏫 مدیر</button></div><div id="lf"></div></div></div>";
loginForm(0)
}
function loginForm(mode){
const ts=document.getElementById('ts'),ta=document.getElementById('ta');if(!ts||!ta)return;
ts.classList.toggle('active',mode===0);ta.classList.toggle('active',mode===1);
const lf=document.getElementById('lf');
if(mode===1){
lf.innerHTML="<label>ایمیل مدیر</label><input id="email" type="email" placeholder="ایمیل مدیر"><label>رمز عبور</label><input id="pass" type="password" placeholder="رمز عبور"><button class="btn full" style="margin-top:12px" onclick="adminLogin()">ورود مدیر</button>"
}else{
lf.innerHTML="<label>شماره تلفن</label><input id="phone" inputmode="tel" placeholder="مثلاً 0914xxxxxxx"><label>رمز عبور</label><input id="pass" type="password" placeholder="رمز عبور"><button class="btn full" style="margin-top:12px" onclick="studentLogin()">ورود دانش‌آموز</button><button class="btn secondary full" style="margin-top:8px" onclick="registerForm()">ثبت‌نام دانش‌آموز جدید</button>"
}}
async function adminLogin(){
const email=document.getElementById('email')?.value.trim(),password=document.getElementById('pass')?.value;
if(!email||!password)return alert('ایمیل و رمز عبور را وارد کنید.');
const r=await db.auth.signInWithPassword({email,password});
if(r.error)return alert(r.error.message||'ایمیل یا رمز عبور نادرست است.');
user=r.data.user;await identify()
}
async function studentLogin(){
const phone=document.getElementById('phone')?.value.trim(),password=document.getElementById('pass')?.value;
if(!phone||!password)return alert('شماره تلفن و رمز عبور را وارد کنید.');

const lookup=await db.from('students').select('login_email,status').eq('phone',phone).maybeSingle();
if(lookup.error){alert('خطا در پیدا کردن حساب: '+lookup.error.message);return}
if(!lookup.data||!lookup.data.login_email){alert('حساب این شماره پیدا نشد.');return}
if(lookup.data.status==='rejected'){alert('این ثبت‌نام توسط مدیر رد شده است.');return}

const r=await db.auth.signInWithPassword({email:lookup.data.login_email,password});
if(r.error)return alert('شماره تلفن یا رمز عبور نادرست است.');
user=r.data.user;await identify()
}
async function registerForm(){
const lf=document.getElementById('lf');if(!lf)return;
lf.innerHTML="<h3>ثبت‌نام دانش‌آموز</h3><div class="row"><div><label>نام</label><input id="rf"></div><div><label>نام خانوادگی</label><input id="rl"></div></div><div class="row"><div><label>شماره تلفن</label><input id="rp" inputmode="tel"></div><div><label>رمز عبور</label><input id="rw" type="password"></div></div><label>پایه / سطح</label><input id="rv" placeholder="مثلاً هفتم یا A1"><button class="btn full" style="margin-top:10px" onclick="register()">ثبت‌نام</button><button class="btn secondary full" style="margin-top:8px" onclick="login()">بازگشت</button>"
}
async function register(){
const f=document.getElementById('rf').value.trim(),l=document.getElementById('rl').value.trim(),p=document.getElementById('rp').value.trim(),pw=document.getElementById('rw').value,level=document.getElementById('rv').value.trim();
if(!f||!l||!p||!pw)return alert('موارد الزامی را کامل کنید.');
if(pw.length<6)return alert('رمز عبور باید حداقل ۶ کاراکتر باشد.');
const r=await db.auth.signUp({email:emailFor(p),password:pw});
if(r.error)return alert(r.error.message);
if(!r.data.user)return alert('حساب ساخته نشد.');
const ins=await db.from('students').insert({first_name:f,last_name:l,phone:p,level:level||null,status:'waiting',auth_user_id:r.data.user.id,password_created:true,login_email:emailFor(p)});

alert('ثبت‌نام با موفقیت انجام شد و در صف انتظار قرار گرفت. ✅');
await db.auth.signOut();login()
}
async function identify(){
if(!user){login();return}
const adminResult=await db.from('admins').select('id').eq('user_id',user.id).maybeSingle();
isAdmin=!!adminResult.data;
if(isAdmin){await adminData();appAdmin();return}
const studentResult=await db.from('students').select('').eq('auth_user_id',user.id).maybeSingle();
if(studentResult.error){alert('خطا در دریافت اطلاعات دانش‌آموز:\n'+studentResult.error.message);await db.auth.signOut();return}
me=studentResult.data;
if(!me){alert('پروفایل دانش‌آموز پیدا نشد.');await db.auth.signOut();return}
appStudent()
}
async function adminData(){
const a=await db.from('students').select('').order('id',{ascending:false});students=a.data||[];
const c=await db.from('courses').select('*').order('id');courses=c.data||[]
}

function speak(text){
if(!('speechSynthesis' in window)){alert('مرورگر دستگاه شما از پخش صوتی پشتیبانی نمی‌کند.');return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.pitch=1;u.volume=1;speechSynthesis.speak(u)
}

function lessonTab(i){

function startLessonQuiz(){
const id=document.querySelector('#studentContent h2')?.textContent.match(/درس ([۰-۹0-9]+)/)?.[1]||'1';const n=id.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));const d=lessons[n]||lessons['1'];currentQuiz=d.questions;currentQuizIndex=0;currentQuizScore=0;currentQuizAnswered=false;currentQuizType='lesson';renderQuiz()
}
function renderQuiz(){
const q=currentQuiz[currentQuizIndex];if(!q)return finishQuiz();
document.getElementById('lessonQuiz').innerHTML=`<div class="quiz-card"><div><b>سؤال ${currentQuizIndex+1} از ${currentQuiz.length}</b></div><div class="quiz-progress"><div style="width:${currentQuizIndex/currentQuiz.length*100}%"></div></div><div class="quiz-question">${esc(q[0])}</div>${q[1].map((o,i)=>`<button class="quiz-option" onclick="answerQuiz(${i})">${esc(o)}</button>`).join('')}<div id="feedback"></div></div>`
}
function answerQuiz(i){
if(currentQuizAnswered)return;currentQuizAnswered=true;const q=currentQuiz[currentQuizIndex],ok=i===q[2];if(ok)currentQuizScore++;
document.querySelectorAll('.quiz-option')[i]?.classList.add(ok?'correct':'wrong');if(!ok)document.querySelectorAll('.quiz-option')[q[2]]?.classList.add('correct');
const f=document.getElementById('feedback');f.className='feedback '+(ok?'correct':'wrong');f.innerHTML=`<span class="feedback-icon">${ok?'😊':'😢'}</span>${ok?'آفرین! پاسخ درست است ✅':'پاسخ اشتباه است ❌'}`;
showOverlay(ok);setTimeout(()=>{currentQuizIndex++;currentQuizAnswered=false;renderQuiz()},900)
}
function showOverlay(ok){
const x=document.getElementById('quizOverlay');x.className='quiz-overlay show '+(ok?'correct':'wrong');document.getElementById('overlayIcon').textContent=ok?'✅😊':'❌😢';document.getElementById('overlayText').textContent=ok?'آفرین! درست جواب دادی':'اشتباه بود! دوباره تلاش کن';setTimeout(()=>x.className='quiz-overlay',800)
}
async function finishQuiz(){
const pct=Math.round(currentQuizScore/currentQuiz.length*100);document.getElementById('lessonQuiz').innerHTML=`<div class="result-big"><strong>${pct}%</strong><h3>نتیجه آزمون</h3><p>${currentQuizScore} پاسخ درست از ${currentQuiz.length}</p><button class="btn" onclick="saveExam(${pct})">ثبت نمره در رکوردها</button></div>`
}
