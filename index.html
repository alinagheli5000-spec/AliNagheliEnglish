<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>

<style>
:root{
--p:#6d28d9;
--p2:#9333ea;
--p3:#4c1d95;
--bg:#f7f4ff;
--card:#fff;
--text:#18121f;
--muted:#6b7280;
--green:#16a34a;
--red:#dc2626;
--gold:#f59e0b;
--blue:#2563eb;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Tahoma,Arial,sans-serif;
padding-bottom:85px;
}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{max-width:1100px;margin:auto;padding:14px}
.header{
background:linear-gradient(135deg,#4c1d95,#6d28d9,#9333ea);
color:white;
padding:28px 16px;
border-radius:0 0 30px 30px;
box-shadow:0 8px 30px #4c1d9540;
}
.header h1{margin:0 0 8px;font-size:28px}
.header p{margin:0;opacity:.9}
.card{
background:var(--card);
border-radius:22px;
padding:20px;
margin:14px 0;
box-shadow:0 8px 28px #0000000d;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:13px;
}
.course{
border:1px solid #e9d5ff;
background:linear-gradient(145deg,#fff,#f3e8ff);
color:var(--p3);
border-radius:22px;
padding:18px 10px;
min-height:140px;
font-size:16px;
font-weight:bold;
transition:.2s;
}
.course:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px #6d28d925;
}
.icon{
display:block;
font-size:43px;
margin-bottom:9px;
}
.btn{
border:0;
background:var(--p);
color:white;
padding:12px 18px;
border-radius:14px;
font-weight:bold;
margin:4px;
}
.btn:hover{opacity:.9}
.btn.secondary{background:#ede9fe;color:#5b21b6}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
input,select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:13px;
margin:6px 0;
background:white;
}
label{
font-size:13px;
font-weight:bold;
color:#4b5563;
display:block;
margin-top:8px;
}
.msg{
padding:12px;
border-radius:12px;
margin-top:10px;
line-height:1.8;
}
.msg.error{background:#fee2e2;color:#991b1b}
.msg.success{background:#dcfce7;color:#166534}
.msg.info{background:#dbeafe;color:#1e40af}
.lesson{
background:white;
border:1px solid #e9d5ff;
border-radius:20px;
padding:18px;
margin:12px 0;
}
.lessonTitle{
background:linear-gradient(135deg,#f5f3ff,#ede9fe);
border-radius:17px;
padding:16px;
margin-bottom:15px;
}
.grammar{
background:#faf5ff;
border-right:5px solid var(--p);
border-radius:15px;
padding:17px;
line-height:2.1;
}
.example{
direction:ltr;
text-align:left;
background:white;
border-radius:11px;
padding:11px;
margin:8px 0;
box-shadow:0 2px 8px #00000008;
}
.word{
display:flex;
align-items:center;
gap:10px;
justify-content:space-between;
background:#fafafa;
border-radius:14px;
padding:10px;
margin:7px 0;
}
.wordText{
direction:ltr;
text-align:left;
flex:1;
font-size:17px;
}
.wordText small{
display:block;
direction:rtl;
text-align:right;
color:#666;
margin-top:4px;
font-size:13px;
}
.speak{
border:0;
background:#ede9fe;
color:var(--p);
border-radius:13px;
width:50px;
height:50px;
font-size:22px;
}
.speak:active{transform:scale(.94)}
.option{
width:100%;
padding:14px;
margin:6px 0;
background:white;
border:2px solid #e5e7eb;
border-radius:13px;
text-align:right;
font-size:15px;
}
.option.correct{
border-color:var(--green);
background:#dcfce7;
color:#166534;
}
.option.wrong{
border-color:var(--red);
background:#fee2e2;
color:#991b1b;
}
.option:disabled{cursor:default}
.progress{
height:10px;
background:#eee;
border-radius:10px;
overflow:hidden;
margin:12px 0;
}
.progress div{
height:100%;
background:linear-gradient(90deg,var(--p),var(--p2));
transition:.3s;
}
.result{
text-align:center;
background:#f3e8ff;
border-radius:18px;
padding:22px;
font-size:21px;
line-height:2;
}
.teacherGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
}
.teacher{
background:linear-gradient(145deg,#fff,#faf5ff);
border:1px solid #e9d5ff;
border-radius:22px;
padding:20px;
}
.phone{
display:block;
color:var(--p);
font-weight:bold;
text-decoration:none;
direction:ltr;
text-align:right;
margin-top:12px;
font-size:17px;
}
.nav{
position:fixed;
z-index:1000;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
padding:7px;
box-shadow:0 -5px 22px #0002;
}
.nav button{
flex:1;
border:0;
background:white;
border-radius:12px;
padding:8px 2px;
font-size:11px;
}
.nav button.active{
background:#ede9fe;
color:var(--p);
font-weight:bold;
}
.rank{
display:flex;
justify-content:space-between;
align-items:center;
background:#faf5ff;
padding:13px;
border-radius:14px;
margin:7px 0;
}
.rank.top1{background:#fef3c7}
.rank.top2{background:#f3f4f6}
.rank.top3{background:#ffedd5}
.badge{
display:inline-block;
background:#ede9fe;
color:#5b21b6;
border-radius:20px;
padding:5px 10px;
margin:3px;
font-size:12px;
}
#overlay{
position:fixed;
z-index:3000;
inset:0;
background:var(--bg);
overflow:auto;
}
table{
width:100%;
border-collapse:collapse;
}
td,th{
padding:10px;
border-bottom:1px solid #eee;
text-align:right;
white-space:nowrap;
}
th{background:#faf5ff}
.table{overflow:auto}
.stat{
background:#faf5ff;
border-radius:18px;
padding:18px;
text-align:center;
}
.stat b{
display:block;
font-size:27px;
color:var(--p);
margin-bottom:5px;
}
.back{
margin-bottom:10px;
}
.small{font-size:12px;color:var(--muted)}
.center{text-align:center}
.divider{
height:1px;
background:#eee;
margin:20px 0;
}
@media(max-width:600px){
.grid{grid-template-columns:repeat(2,1fr)}
.course{min-height:125px;padding:14px 6px;font-size:14px}
.icon{font-size:37px}
.header h1{font-size:23px}
.card{padding:15px}
}
</style>
</head>

<div id="registerMsg"></div>

</section>

</div>

</div>

<div id="content"></div>

function shuffle(arr){
return [...arr].sort(()=>Math.random()-.5);
}


function splitWord(x){
const p=x.split("|");
return [p[0],p[1]];
}


function normalizePhone(phone){

return String(phone||"")
.replace(/\s+/g,"")
.replace(/[^\d+]/g,"")
.replace(/^0098/,"+98")
.replace(/^98/,"+98");

}


function studentEmail(phone){

const p=normalizePhone(phone)
.replace("+","");

return `${p}@alinagheli.com`;

}


function escapeHTML(str){

return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* =========================================================
   SPEECH
========================================================= */

function speak(text){

if(!("speechSynthesis" in window)){

alert(
"مرورگر دستگاه شما از پخش صوتی پشتیبانی نمی‌کند."
);

return;

}

speechSynthesis.cancel();


const utterance=
new SpeechSynthesisUtterance(text);

utterance.lang="en-US";
utterance.rate=.72;
utterance.pitch=1;
utterance.volume=1;


const voices=
speechSynthesis.getVoices();


const voice=
voices.find(v=>
v.lang&&
v.lang.toLowerCase()==="en-us"
)
||
voices.find(v=>
v.lang&&
v.lang.toLowerCase().startsWith("en")
);


if(voice){
utterance.voice=voice;
}


speechSynthesis.speak(utterance);

}


/* =========================================================
   LESSON QUIZ
========================================================= */

function makeLessonQuiz(g,index){

const l=SCHOOL[g][index];

const words=
l[2].map(splitWord);

let qs=[];


/* vocabulary questions */

words.forEach(([en,fa])=>{

const others=
shuffle(
words.filter(x=>x[0]!==en)
).slice(0,3);


qs.push({
q:`معنی "${en}" چیست؟`,
a:fa,
o:shuffle([
fa,
...others.map(x=>x[1])
])
});


qs.push({
q:`"${fa}" به انگلیسی چیست؟`,
a:en,
o:shuffle([
en,
...others.map(x=>x[0])
])
});

});


/* example questions */

l[4].forEach(example=>{

qs.push({
q:"کدام جمله مربوط به این درس است؟",
a:example,
o:shuffle([
example,
...l[4].filter(x=>x!==example)
])
});

});


/* guaranteed minimum 15 */

while(qs.length<15){

const base=qs[qs.length%qs.length];

qs.push({
q:base.q,
a:base.a,
o:shuffle(base.o)
});

}


return shuffle(qs).slice(0,15);

}


function lessonQuiz(g,index){

const questions=
makeLessonQuiz(g,index);


quiz={
type:`${g} - ${SCHOOL[g][index][0]}`,
questions,
i:0,
correct:0,
wrong:0,
negative:false
};


openQuiz();

}


/* =========================================================
   QUIZ
========================================================= */

function openQuiz(){

document.getElementById("overlay")
.classList.remove("hidden");

renderQuiz();

}


function renderQuiz(){

const q=quiz.questions[quiz.i];

const number=quiz.i+1;

const total=quiz.questions.length;


document.getElementById("quizHead").innerHTML=`

<h2>📝 ${escapeHTML(quiz.type)}</h2>

<span class="badge">
سؤال ${number} از ${total}
</span>

<span class="badge">
✅ ${quiz.correct}
</span>

<span class="badge">
❌ ${quiz.wrong}
</span>

<div class="progress">
<div style="width:${((number-1)/total)*100}%"></div>
</div>
`;


document.getElementById("quizBody").innerHTML=`

<div class="lesson">

<h3>${escapeHTML(q.q)}</h3>

${q.o.map(option=>`

<button
class="option"
onclick="answer(this,${JSON.stringify(option)},${JSON.stringify(q.a)})">

${escapeHTML(option)}

</button>

`).join("")}

</div>
`;

}


function answer(button,answerValue,correctValue){

if(button.disabled)return;


document
.querySelectorAll(".option")
.forEach(x=>x.disabled=true);


if(answerValue===correctValue){

button.classList.add("correct");

quiz.correct++;

}else{

button.classList.add("wrong");

quiz.wrong++;


document
.querySelectorAll(".option")
.forEach(x=>{

if(
x.textContent.trim()===
String(correctValue).trim()
){
x.classList.add("correct");
}

});

}


setTimeout(()=>{

quiz.i++;

if(quiz.i>=quiz.questions.length){

finishQuiz();

}else{

renderQuiz();

}

},700);

}


/* =========================================================
   FINISH QUIZ
========================================================= */

async function finishQuiz(){

let score;


if(quiz.negative){

const raw=
(
quiz.correct-
quiz.wrong*.25
)/quiz.questions.length;

score=
Math.max(
0,
Math.round(raw*100)
);

}else{

score=
Math.round(
quiz.correct/
quiz.questions.length*
100
);

}


await saveResult(
quiz.type,
score,
quiz.correct,
quiz.questions.length
);


document.getElementById("quizHead").innerHTML=
"<h2>🎉 نتیجه آزمون</h2>";


document.getElementById("quizBody").innerHTML=`

<div class="result">

صحیح: ${quiz.correct}<br>

غلط: ${quiz.wrong}<br>

تعداد سوال: ${quiz.questions.length}

<hr>

نمره نهایی:

<br>

<strong>${score}٪</strong>

<br><br>

${
score>=90
?"🏆 عالی بود!"
:
score>=70
?"👏 خیلی خوب بود!"
:
score>=50
?"👍 خوبه، بیشتر تمرین کن."
:
"📚 دوباره درس را مرور کن."
}

</div>
`;

}

function competitionMenu(){

if(!student)return;

document.getElementById("home")
.classList.add("hidden");

nav("nCompetition");


const types=[

/* =========================================================
   START COMPETITION
========================================================= */

function competition(type){

const source=
COMPETITION_DATA[type];


if(!source||source.length<20){

alert("سوالات این مسابقه هنوز کامل نشده است.");

return;

}


const questions=
shuffle(source)
.slice(0,20);


quiz={

type:`مسابقه ${type}`,

questions:
questions.map(q=>({

q:q[0],
a:q[1],
o:shuffle(q.slice(1))

})),

i:0,
correct:0,
wrong:0,
negative:true

};


openQuiz();

}


/* =========================================================
   RECORDS
========================================================= */

async function records(){

if(!student)return;

document.getElementById("home")
.classList.add("hidden");

nav("nCompetition");


let local=
JSON.parse(
localStorage.getItem("ali_records")||"[]"
);


/* رکوردهای Supabase */

let remote=[];

const {data:s}=await supabaseClient
.from("students")
.select("id")
.eq("auth_user_id",student.id)
.maybeSingle();


if(s){

const {data}=await supabaseClient
.from("exam_attempts")
.select("*")
.eq("student_id",s.id)
.order("created_at",{ascending:false})
.limit(50);

remote=data||[];

}


let h=`

<div class="card">

<h2>📊 رکوردهای من</h2>

<button class="btn secondary" onclick="home()">

if(!local.length&&!remote.length){

h+=`
<p>
هنوز رکوردی ثبت نشده است.
اولین آزمونت را انجام بده! 🚀
</p>
`;

}else{

if(remote.length){

h+=`<h3>☁️ رکوردهای ذخیره‌شده</h3>`;

remote.forEach((r,index)=>{

h+=`

<div class="rank">

<span>

${index+1}. ${escapeHTML(r.exam_type)}

<br>

<small>
${r.correct_answers||0}/${r.total_questions||0}
</small>

</span>

<strong>
${r.score||0}٪
</strong>

</div>

`;

});

}


if(local.length){

h+=`<h3>📱 رکوردهای اخیر</h3>`;

local.slice(0,30).forEach((r,index)=>{

h+=`

<div class="rank">

<span>

${index+1}. ${escapeHTML(r.type)}

<br>

<small>${r.date}</small>

</span>

<strong>${r.score}٪</strong>

</div>

`;

});

}

}


h+=`
</div>
`;


document.getElementById("content").innerHTML=h;

}


/* =========================================================
   ADMIN LOGIN
========================================================= */

async function adminLogin(){

const email=
"alinagheli@gmail.com";

const password=
document.getElementById("adminPassword").value;

const msg=
document.getElementById("adminMsg");


if(!password){

msg.innerHTML=
`<div class="msg error">
رمز عبور مدیر را وارد کنید.
</div>`;

return;

}


msg.innerHTML=
`<div class="msg info">
در حال بررسی حساب مدیر...
</div>`;


const {data,error}=
await supabaseClient.auth.signInWithPassword({
email,
password
});


if(error){

msg.innerHTML=
`<div class="msg error">
❌ ایمیل یا رمز عبور مدیر صحیح نیست.
</div>`;

return;

}


const user=data.user;


/* بررسی جدول admins */

const {data:adminRow,error:adminError}=
await supabaseClient
.from("admins")
.select("id,user_id,auth_user_id")
.or(
`user_id.eq.${user.id},auth_user_id.eq.${user.id}`
)
.maybeSingle();


if(adminError||!adminRow){

await supabaseClient.auth.signOut();

msg.innerHTML=
`<div class="msg error">
این حساب مجوز مدیر ندارد.
</div>`;

return;

}


sessionStorage.setItem(
"ali_admin",
"1"
);


page("adminApp");

await adminDashboard();

}

/* =========================================================
   INITIAL SESSION
========================================================= */

(async function init(){

try{

const {
data:{session}
}=
await supabaseClient.auth.getSession();


if(!session){

page("login");

return;

}


const user=session.user;


/* اول مدیر */

const {data:adminRow}=
await supabaseClient
.from("admins")
.select("id")
.or(
`user_id.eq.${user.id},auth_user_id.eq.${user.id}`
)
.maybeSingle();


if(adminRow){

page("adminApp");

await adminDashboard();

return;

}


/* سپس زبان‌آموز */

const {data:profile}=
await supabaseClient
.from("students")
.select("*")
.eq("auth_user_id",user.id)
.maybeSingle();


if(profile&&profile.status==="registered"){

student=user;

const fullName=
`${profile.first_name||""} ${profile.last_name||""}`.trim();

document.getElementById("studentName")
.textContent=fullName||"زبان‌آموز";

localStorage.setItem(
"ali_student_id",
String(profile.id)
);

page("studentApp");

home();

}else{

await supabaseClient.auth.signOut();

page("login");

}

}catch(error){

console.error(error);

page("login");

}

})();
