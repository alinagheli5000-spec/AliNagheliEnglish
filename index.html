/* =========================
XP / PROGRESS
========================= */

function xpForLevel(level){
return (level-1)*100;
}

function calculateLevel(xp){
return Math.max(1,Math.floor(xp/100)+1);
}

async function loadStudentStats(){

if(!S.student)return;

S.xp=0;
S.level=1;
S.progress={};
S.achievements=[];

try{

const xp=
await db
.from("student_xp")
.select("xp,level")
.eq("student_id",S.student.id)
.maybeSingle();

if(xp.data){
S.xp=Number(xp.data.xp||0);
S.level=Number(xp.data.level||calculateLevel(S.xp));
}else{

await db
.from("student_xp")
.insert({
student_id:S.student.id,
xp:0,
level:1
});

}

}catch(e){}

try{

const p=
await db
.from("student_progress")
.select("lesson_id,progress,completed")
.eq("student_id",S.student.id);

if(p.data){
p.data.forEach(x=>{
S.progress[x.lesson_id]={
progress:Number(x.progress||0),
completed:Boolean(x.completed)
};
});
}

}catch(e){}

try{

const a=
await db
.from("student_achievements")
.select("achievement_key,title")
.eq("student_id",S.student.id);

if(a.data){
S.achievements=a.data;
}

}catch(e){}

}

async function addXP(amount,reason=""){

if(!S.student)return;

const oldXP=S.xp;
const newXP=oldXP+Number(amount||0);
const newLevel=calculateLevel(newXP);

S.xp=newXP;
S.level=newLevel;

try{

await db
.from("student_xp")
.upsert({
student_id:S.student.id,
xp:newXP,
level:newLevel,
updated_at:new Date().toISOString()
},{
onConflict:"student_id"
});

}catch(e){}

if(newLevel>calculateLevel(oldXP)){
await unlockAchievement(
"level_"+newLevel,
"رسیدن به Level "+newLevel
);
}

}

async function unlockAchievement(key,title){

if(!S.student)return;

if(
S.achievements.some(
x=>x.achievement_key===key
)
)return;

try{

const r=
await db
.from("student_achievements")
.insert({
student_id:S.student.id,
achievement_key:key,
title
});

if(!r.error){

S.achievements.push({
achievement_key:key,
title
});

}

}catch(e){}

}

async function saveProgress(lessonId,progress,completed){

if(!S.student)return;

S.progress[lessonId]={
progress,
completed
};

try{

await db
.from("student_progress")
.upsert({
student_id:S.student.id,
lesson_id:lessonId,
progress,
completed,
completed_at:
completed?new Date().toISOString():null
},{
onConflict:"student_id,lesson_id"
});

}catch(e){}

}

async function studentLogin(){

const phone=document.getElementById("phone").value.trim();
const password=document.getElementById("pass").value;

if(!phone||!password){
alert("شماره تلفن و رمز عبور را وارد کنید.");
return;
}

try{

const result=
await accessFunction({
action:"find",
phone
});

const student=result.student;
const email=result.email;

if(!student)
throw new Error("زبان‌آموزی با این شماره پیدا نشد.");

if(student.status==="rejected")
throw new Error("ثبت‌نام شما توسط مدیر رد شده است.");

if(
student.status!=="registered" &&
student.status!=="approved"
)
throw new Error("ثبت‌نام شما هنوز توسط مدیر تأیید نشده است.");

if(!email)
throw new Error("ایمیل ورود زبان‌آموز پیدا نشد.");

const auth=
await db.auth.signInWithPassword({
email:String(email).trim(),
password
});

if(auth.error)
throw new Error("رمز عبور صحیح نیست.");

S.student=student;
S.admin=false;

await loadStudentStats();

home();

}catch(e){

alert(e?.message||"ورود ناموفق بود.");

}

}

async function register(){

const first=document.getElementById("rf").value.trim();
const last=document.getElementById("rl").value.trim();
const phone=document.getElementById("rp").value.trim();
const password=document.getElementById("rpass").value;
const level=document.getElementById("rlevel").value;

if(!first||!last||!phone||!password||!level){
alert("همه موارد را تکمیل کنید.");
return;
}

if(password.length<6){
alert("رمز عبور باید حداقل ۶ کاراکتر باشد.");
return;
}

const digits=normalizePhone(phone);

if(digits.length<10){
alert("شماره تلفن معتبر نیست.");
return;
}

const email=digits+"@alinagheli.com";

try{

const r=
await db.auth.signUp({
email,
password,
options:{
data:{
first_name:first,
last_name:last,
phone,
level
}
}
});

if(r.error)throw r.error;

if(!r.data.user)
throw new Error("حساب کاربری ساخته نشد.");

await accessFunction({
action:"register",
first_name:first,
last_name:last,
phone,
level,
auth_user_id:r.data.user.id,
email
});

await db.auth.signOut();

alert(
"ثبت‌نام با موفقیت انجام شد.\nپس از تأیید مدیر می‌توانید وارد شوید."
);

login();

}catch(e){

try{await db.auth.signOut()}catch(_){}

alert("ثبت‌نام انجام نشد:\n"+(e?.message||"خطای نامشخص"));

}

}

/* =========================
QUIZ
========================= */

function makeLessonQuestions(){

const no=S.lesson+1;
let arr=[];

(words[no]||[]).forEach((w,i)=>{

const a=words[no];

arr.push({
q:`معنی "${w[0]}" چیست؟`,
options:[
w[1],
a[(i+1)%a.length][1],
a[(i+2)%a.length][1]
],
answer:0
});

});

(grammar[no]||[]).forEach(g=>{

arr.push({
q:`کدام گزینه با ${g[0]} هماهنگ است؟`,
options:[
g[1],
"She are student.",
"They is happy."
],
answer:0
});

});

return arr.slice(0,15);
}

function startLessonQuiz(){

S.quiz={
type:"lesson",
title:
`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
questions:makeLessonQuestions(),
i:0,
correct:0,
wrong:0
};

quizRender("lessonQuiz");
}

function quizRender(id){

const q=S.quiz.questions[S.quiz.i];

if(!q){
quizFinish(id);
return;
}

const el=document.getElementById(id);
if(!el)return;

el.innerHTML=`
<div class="card">

<b>
سؤال ${S.quiz.i+1}
از ${S.quiz.questions.length}
</b>

<div class="progress">
<i style="
width:${S.quiz.i/S.quiz.questions.length*100}%
"></i>
</div>

<div style="
font-size:18px;font-weight:bold;
line-height:2;margin:15px 0">
${esc(q.q)}
</div>

${q.options.map((x,i)=>`
<button class="option"
onclick="answer(${i},'${id}')">
${esc(x)}
</button>
`).join("")}

<div id="fb"></div>

</div>
`;
}

function answer(i,id){

const q=S.quiz.questions[S.quiz.i];

const opts=document.querySelectorAll(".option");

opts.forEach(x=>x.disabled=true);

if(i===q.answer){

S.quiz.correct++;

opts[i].classList.add("correct");

document.getElementById("fb").className="feedback ok";
document.getElementById("fb").innerHTML=
"✅ 😊 آفرین! پاسخ درست است.";

}else{

S.quiz.wrong++;

opts[i].classList.add("wrong");
opts[q.answer].classList.add("correct");

document.getElementById("fb").className="feedback bad";
document.getElementById("fb").innerHTML=
"❌ 😢 پاسخ اشتباه است.";

}

setTimeout(()=>{
S.quiz.i++;
quizRender(id);
},900);

}

async function quizFinish(id){

const total=S.quiz.questions.length;

const percent=total
?Math.round(S.quiz.correct/total*100)
:0;

examRecords.push({
student:S.student?.phone||"",
title:S.quiz.title,
score:percent,
date:new Date().toISOString()
});

saveLocal();

if(S.student){

try{

await db
.from("exam_results")
.insert({
user_id:S.student.auth_user_id,
student_name:
`${S.student.first_name||""} ${S.student.last_name||""}`,
exam_type:S.quiz.type||"lesson",
exam_title:S.quiz.title,
lesson:S.lesson+1,
score:S.quiz.correct,
total,
percentage:percent
});

}catch(e){}

await addXP(
Math.max(10,percent),
"exam"
);

if(percent>=80){
await unlockAchievement(
"exam_80",
"امتیاز بالای ۸۰٪"
);
}

if(percent===100){
await unlockAchievement(
"perfect_exam",
"آزمون کامل"
);
}

if(S.quiz.type==="lesson"){

const key=`${S.grade}-${S.lesson}`;

await saveProgress(
key,
100,
true
);

}

}

const el=document.getElementById(id);
if(!el)return;

el.innerHTML=`
<div class="card">

<div class="score">
${percent}%
</div>

<h2 style="text-align:center">
آزمون تمام شد 🎉
</h2>

<p style="text-align:center">
${S.quiz.correct}
پاسخ درست از ${total}
</p>

<p style="text-align:center;font-weight:bold">
نمره شما: ${percent}%
</p>

<button
class="btn full"
onclick="profile()">
مشاهده پیشرفت
</button>

</div>
`;
}

:
`
<span>❌ رد شده</span>

<button class="btn success"
onclick='approve(${JSON.stringify(x.id)})'>
تأیید مجدد
</button>
`
}

</div>

</div>

`).join("")
:
`<p class="muted">ثبت‌نامی وجود ندارد.</p>`
}

</div>

<button class="btn secondary full"
onclick="logout()">
خروج
</button>

</main>
`;
}

async function approve(id){

try{

const r=
await db
.from("students")
.update({status:"registered"})
.eq("id",id);

if(r.error)throw r.error;

admin();

}catch(e){

alert("خطا در تأیید:\n"+e.message);

}

}

async function rejectStudent(id){

try{

const r=
await db
.from("students")
.update({status:"rejected"})
.eq("id",id);

if(r.error)throw r.error;

admin();

}catch(e){

alert("خطا در رد کردن:\n"+e.message);

}

}

/* =========================
LOGOUT / START
========================= */

async function logout(){

try{
await db.auth.signOut();
}catch(e){}

S={
student:null,
admin:false,
grade:null,
lesson:null,
quiz:null,
xp:0,
level:1,
progress:{},
achievements:[]
};

login();

}

async function startup(){

try{

const r=await db.auth.getSession();
const session=r.data?.session;

if(!session){
login();
return;
}

const user=session.user;

if(
(user.email||"").toLowerCase()==="alinagheli@gmail.com"
){

S.admin=true;
admin();
return;

}

const st=
await db
.from("students")
.select("*")
.eq("auth_user_id",user.id)
.maybeSingle();

if(
st.data &&
(
st.data.status==="registered"||
st.data.status==="approved"
)
){

S.student=st.data;

await loadStudentStats();

home();

return;

}

await db.auth.signOut();
login();

}catch(e){

try{await db.auth.signOut()}catch(_){}

login();

}

}

db.auth.onAuthStateChange((event,session)=>{

if(
event==="SIGNED_OUT" &&
!S.admin &&
!S.student
){

login();

}

});

startup();

</script>
