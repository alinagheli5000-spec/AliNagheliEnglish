<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box}
:root{
 --p:#6d28d9;--p2:#8b5cf6;--p3:#ede9fe;--dark:#24143f;
 --bg:#f7f5fc;--card:#fff;--text:#20152f;--muted:#777;
 --green:#16a34a;--red:#dc2626;--gold:#f59e0b;
}
body{
 margin:0;background:linear-gradient(145deg,#f8f5ff,#eee9fb);
 font-family:Tahoma,Arial,sans-serif;color:var(--text);
 min-height:100vh;
}
button,input{font-family:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.hidden{display:none!important}

/* LOGIN */
.login-screen{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:22px;
 background:
 radial-gradient(circle at 10% 10%,#c4b5fd 0,transparent 30%),
 radial-gradient(circle at 90% 90%,#ddd6fe 0,transparent 32%),
 linear-gradient(135deg,#faf8ff,#eee8ff);
}
.login-box{
 width:min(440px,100%);padding:30px 22px;border-radius:30px;
 background:rgba(255,255,255,.88);backdrop-filter:blur(18px);
 box-shadow:0 25px 70px rgba(73,37,130,.18);text-align:center;
}
.logo{
 font-size:31px;font-weight:900;letter-spacing:1px;color:#6d28d9;
 text-shadow:2px 2px 0 #ddd6fe,4px 4px 8px rgba(0,0,0,.18);
 direction:ltr;margin-bottom:8px;
}
.logo-sub{color:#777;margin-bottom:26px}
.login-buttons{display:grid;gap:14px}
.login-btn{
 border:0;border-radius:20px;padding:17px;font-size:17px;font-weight:bold;
 color:white;box-shadow:0 8px 18px rgba(0,0,0,.12);
 transition:.2s;
}
.login-btn:hover{transform:translateY(-2px)}
.student-btn{background:linear-gradient(135deg,#7c3aed,#5b21b6)}
.admin-btn{background:linear-gradient(135deg,#111827,#374151)}
.vip-btn{background:#d1d5db;color:#777;cursor:not-allowed}
.login-form{margin-top:20px;text-align:right}
.input{
 width:100%;padding:14px 15px;border:2px solid #e5e7eb;border-radius:15px;
 outline:none;margin-bottom:12px;font-size:15px;background:#fff;
}
.input:focus{border-color:var(--p)}
.form-title{font-size:19px;font-weight:bold;margin-bottom:15px}
.submit{
 width:100%;border:0;padding:14px;border-radius:15px;background:var(--p);
 color:white;font-size:16px;font-weight:bold;
}
.back{
 border:0;background:none;color:var(--p);margin-top:13px;
}
.error{color:var(--red);font-size:13px;margin:10px 0}
.success{color:var(--green);font-size:13px;margin:10px 0}

/* APP */
.app-shell{min-height:100vh;padding-bottom:82px}
.topbar{
 position:sticky;top:0;z-index:20;padding:15px 17px;
 background:rgba(255,255,255,.9);backdrop-filter:blur(15px);
 border-bottom:1px solid #eee;display:flex;justify-content:space-between;
 align-items:center;
}
.top-logo{font-weight:900;color:var(--p);direction:ltr}
.logout{border:0;background:#f3e8ff;color:var(--p);padding:8px 12px;border-radius:12px}
.content{max-width:720px;margin:auto;padding:18px}
.page-title{font-size:25px;font-weight:900;margin:5px 0 18px}
.card{
 background:var(--card);border-radius:23px;padding:18px;margin-bottom:15px;
 box-shadow:0 7px 25px rgba(50,30,90,.08);
}
.hero{
 background:linear-gradient(135deg,#6d28d9,#8b5cf6);
 color:white;border-radius:27px;padding:23px;margin-bottom:16px;
 box-shadow:0 15px 35px rgba(109,40,217,.23);
}
.hero h2{margin:0 0 8px;font-size:23px}
.hero p{margin:0;opacity:.9}
.word-card{
 display:flex;justify-content:space-between;align-items:center;
 background:linear-gradient(135deg,#fff7ed,#fff);
 border:1px solid #fed7aa;
}
.word-en{font-size:24px;font-weight:900;direction:ltr}
.word-fa{color:#777;margin-top:5px}
.sound{
 width:46px;height:46px;border:0;border-radius:50%;
 background:#f59e0b;color:white;font-size:20px;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
 background:#fafafa;border-radius:17px;padding:15px;text-align:center;
 border:1px solid #eee;
}
.stat strong{display:block;font-size:22px;color:var(--p)}
.stat small{color:#777}
.section-title{font-size:18px;font-weight:900;margin:22px 0 12px}
.activity{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.activity:last-child{border:0}
.icon-circle{
 width:42px;height:42px;border-radius:14px;background:var(--p3);
 display:flex;align-items:center;justify-content:center;font-size:20px;
 flex-shrink:0;
}

/* NAV */
.bottom-nav{
 position:fixed;bottom:0;left:0;right:0;height:74px;z-index:50;
 background:rgba(255,255,255,.95);backdrop-filter:blur(15px);
 border-top:1px solid #e5e7eb;display:flex;justify-content:center;
}
.nav-inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr)}
.nav-btn{
 border:0;background:none;color:#888;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:4px;font-size:11px;
}
.nav-btn span:first-child{font-size:22px}
.nav-btn.active{color:var(--p);font-weight:bold}

/* COURSES */
.course-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.course{
 border:0;background:white;border-radius:22px;padding:20px 10px;
 text-align:center;box-shadow:0 7px 22px rgba(40,20,80,.08);
}
.course .grade{font-size:30px;font-weight:900;color:var(--p)}
.course small{color:#777}
.course.locked{opacity:.55}
.lesson-list{display:grid;gap:12px}
.lesson{
 border:0;background:white;border-radius:20px;padding:17px;
 text-align:right;box-shadow:0 6px 18px rgba(50,30,90,.07);
 display:flex;align-items:center;gap:13px;
}
.lesson-num{
 width:45px;height:45px;border-radius:15px;background:var(--p3);
 color:var(--p);font-weight:900;display:flex;align-items:center;
 justify-content:center;flex-shrink:0;
}
.lesson-info strong{display:block;font-size:16px}
.lesson-info small{color:#888}

/* MATERIAL */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.tab{
 border:0;padding:13px;border-radius:15px;background:#eee7ff;color:var(--p);
 font-weight:bold;
}
.tab.active{background:var(--p);color:white}
.material h3{color:var(--p);margin-top:5px}
.example{
 direction:ltr;text-align:left;background:#f8f5ff;padding:12px;
 border-radius:14px;margin:9px 0;border-left:4px solid var(--p);
}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.vocab{
 background:#fff;border:1px solid #eee;border-radius:15px;padding:12px;
 display:flex;justify-content:space-between;align-items:center;gap:7px;
}
.vocab .en{font-weight:bold;direction:ltr}
.vocab .fa{font-size:12px;color:#777;text-align:right}

/* QUIZ */
.quiz-card{text-align:center}
.progress{height:8px;background:#eee;border-radius:20px;overflow:hidden;margin:12px 0 20px}
.progress>div{height:100%;background:var(--p);transition:.3s}
.question{font-size:19px;font-weight:bold;direction:ltr;text-align:center;margin:20px 0}
.options{display:grid;gap:10px}
.option{
 border:2px solid #e5e7eb;background:white;border-radius:15px;padding:14px;
 font-size:15px;direction:ltr;text-align:center;
}
.option.correct{border-color:var(--green);background:#dcfce7;color:#166534}
.option.wrong{border-color:var(--red);background:#fee2e2;color:#991b1b}
.feedback{font-size:35px;min-height:43px}
.next{
 border:0;background:var(--p);color:white;padding:13px 25px;
 border-radius:14px;margin-top:15px;font-weight:bold;
}
.result{text-align:center}
.result-score{font-size:55px;font-weight:900;color:var(--p)}
.retry{border:0;background:var(--p);color:#fff;border-radius:15px;padding:13px 25px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:white;border-radius:15px;overflow:hidden}
th,td{padding:12px;text-align:center;border-bottom:1px solid #eee}
th{background:#f3e8ff;color:var(--p)}

/* PROFILE */
.profile-head{text-align:center}
.avatar{
 width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#a78bfa);
 color:white;display:flex;align-items:center;justify-content:center;
 font-size:36px;font-weight:bold;margin:auto auto 12px;
}
.info-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee}
.info-row:last-child{border:0}

/* TEACHER */
.teacher{text-align:center}
.teacher-avatar{
 width:110px;height:110px;border-radius:50%;margin:auto;
 background:linear-gradient(135deg,#6d28d9,#4c1d95);
 color:#fff;display:flex;align-items:center;justify-content:center;
 font-size:42px;font-weight:900;

.phone{
 display:inline-block;margin-top:10px;background:#dcfce7;color:#15803d;
 padding:12px 18px;border-radius:15px;text-decoration:none;font-weight:bold;
 direction:ltr;

.lang-box{background:#faf8ff;padding:15px;border-radius:17px;margin-top:13px}
.badges{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.badge{background:#ede9fe;color:#5b21b6;padding:8px 11px;border-radius:12px;font-size:12px}

/* TOAST */
.toast{
 position:fixed;left:50%;bottom:92px;transform:translateX(-50%);
 background:#1f2937;color:white;padding:12px 17px;border-radius:13px;
 z-index:100;font-size:13px;max-width:90%;text-align:center;
}
@media(max-width:420px){
 .content{padding:14px}
 .course-grid{gap:9px}
 .word-en{font-size:21px}
}
</style>

function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}
function toast(msg){
 const x=document.createElement("div");
 x.className="toast";x.textContent=msg;document.body.appendChild(x);
 setTimeout(()=>x.remove(),2600);
}
function speak(word){
 try{
   const u=new SpeechSynthesisUtterance(word);
   u.lang="en-US";u.rate=.82;
   speechSynthesis.cancel();speechSynthesis.speak(u);
 }catch(e){toast("تلفظ در این دستگاه در دسترس نیست.");}
}
function saveHistory(item){
 const key="ali_activity_"+(currentUser?.id||"guest");
 const arr=JSON.parse(localStorage.getItem(key)||"[]");
 arr.unshift({...item,date:new Date().toLocaleString("fa-IR")});
 localStorage.setItem(key,JSON.stringify(arr.slice(0,100)));
}
function getHistory(){
 const key="ali_activity_"+(currentUser?.id||"guest");
 return JSON.parse(localStorage.getItem(key)||"[]");
}
function getScores(){
 const key="ali_scores_"+(currentUser?.id||"guest");
 return JSON.parse(localStorage.getItem(key)||"[]");
}
function saveScore(type,score,total){
 const key="ali_scores_"+(currentUser?.id||"guest");
 const arr=JSON.parse(localStorage.getItem(key)||"[]");
 arr.push({
  type,score,total,percent:Math.round(score/total*100),
  date:new Date().toLocaleString("fa-IR")
 });
 localStorage.setItem(key,JSON.stringify(arr));
}
function shuffle(a){
 return [...a].sort(()=>Math.random()-.5);
}

function normalizePhone(v){
 return String(v||"").trim().replace(/\s+/g,"").replace(/-/g,"");
}

async function studentLogin(){
 const phone=normalizePhone(document.getElementById("loginPhone").value);
 const password=document.getElementById("loginPass").value;
 const err=document.getElementById("loginError");

 if(!phone||!password){
  err.innerHTML='<div class="error">شماره تلفن و رمز عبور را وارد کنید.</div>';
  return;
 }

 err.innerHTML='<div>⏳ در حال ورود...</div>';

 try{
   /*
    * مهم:
    * قبل از ورود هیچ Query به students انجام نمی‌شود.
    * شماره به ایمیل Auth تبدیل می‌شود.
    */
   const email=phone+"@alinagheli.com";

   const {data,error}=await sb.auth.signInWithPassword({
     email,password
   });

   if(error){
     console.error(error);
     err.innerHTML=
       '<div class="error">شماره تلفن یا رمز عبور صحیح نیست.</div>';
     return;
   }

   if(!data?.user){
     err.innerHTML='<div class="error">ورود انجام نشد.</div>';
     return;
   }

   const {data:student,error:studentError}=await sb
     .from("students")
     .select("*")
     .eq("auth_user_id",data.user.id)
     .maybeSingle();

   if(studentError){
     console.error(studentError);
     await sb.auth.signOut({scope:"local"});
     err.innerHTML=
       '<div class="error">ورود انجام شد اما اطلاعات زبان‌آموز قابل دریافت نیست.</div>';
     return;
   }

   if(!student){
     await sb.auth.signOut({scope:"local"});
     err.innerHTML=
       '<div class="error">حساب شما به پرونده زبان‌آموز متصل نیست.</div>';
     return;
   }

   if(student.status && student.status!=="registered"){
     await sb.auth.signOut({scope:"local"});
     err.innerHTML='<div class="error">حساب شما هنوز تأیید نشده است.</div>';
     return;
   }

   currentUser={
     ...student,
     auth_user_id:data.user.id
   };

   localStorage.setItem("ali_current_user",JSON.stringify(currentUser));
   saveHistory({type:"ورود",title:"ورود به سامانه",detail:"ورود موفق"});
   startApp();

 }catch(e){
   console.error(e);
   err.innerHTML=
    '<div class="error">ارتباط با سامانه برقرار نشد. اینترنت و تنظیمات Supabase را بررسی کنید.</div>';
 }
}

function startLessonQuiz(lesson){
 quizMode="درس "+lesson;
 quizItems=buildLessonQuiz(lesson);
 quizIndex=0;quizScore=0;quizAnswered=false;
 currentPage="quiz";renderApp();
}

function buildLessonQuiz(lesson){
 let base=[];
 if(lesson==="1"||lesson==="2")base=quizQuestions.slice(0,7);
 if(lesson==="3")base=quizQuestions.slice(2,5);
 if(lesson==="4")base=quizQuestions.slice(3,5);
 if(lesson==="5")base=quizQuestions.slice(1,5);
 if(lesson==="6")base=quizQuestions.slice(5,8);
 if(lesson==="7")base=quizQuestions.slice(7,10);
 if(lesson==="8")base=quizQuestions.slice(9,14);
 return shuffle(base).slice(0,10);
}

function startComprehensiveQuiz(){
 quizMode="آزمون جامع هفتم";
 const pool=[...quizQuestions,...levelQuestions];
 quizItems=shuffle(pool).slice(0,50);
 while(quizItems.length<50){
  quizItems.push(...shuffle(pool).slice(0,50-quizItems.length));
 }
 quizIndex=0;quizScore=0;quizAnswered=false;
 currentPage="quiz";renderApp();
}

function startPlacementQuiz(){
 quizMode="تعیین سطح";
 quizItems=levelQuestions.map(q=>q);
 quizIndex=0;quizScore=0;quizAnswered=false;
 currentPage="quiz";renderApp();
}

function renderQuiz(c){
 if(quizIndex>=quizItems.length){
  finishQuiz();return;
 }

 const q=quizItems[quizIndex];
 const question=q[0];
 const correct=q[1];
 const options=shuffle(q.slice(1,5));

 c.innerHTML=`
 <div class="page-title">📝 ${esc(quizMode)}</div>
 <div class="card quiz-card">
  <div style="color:#777">
   سؤال ${quizIndex+1} از ${quizItems.length}
  </div>
  <div class="progress">
   <div style="width:${(quizIndex/quizItems.length)*100}%"></div>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="question">${esc(question)}</div>

  <div class="options">
   ${options.map(o=>`
    <button class="option"
      onclick="answerQuiz(this,${JSON.stringify(o)},${JSON.stringify(correct)})">
      ${esc(o)}
    </button>`).join("")}
  </div>

  <button id="nextBtn" class="next hidden" onclick="nextQuestion()">
   ${quizIndex===quizItems.length-1?"مشاهده نتیجه":"سؤال بعدی →"}
  </button>
 </div>`;
}

function answerQuiz(btn,selected,correct){
 if(quizAnswered)return;
 quizAnswered=true;

 const buttons=document.querySelectorAll(".option");
 buttons.forEach(b=>b.disabled=true);

 const feedback=document.getElementById("feedback");

 if(selected===correct){
  quizScore++;
  btn.classList.add("correct");
  feedback.textContent="✅ 😍";
 }else{
  btn.classList.add("wrong");
  feedback.textContent="❌ 😢";
  buttons.forEach(b=>{
   if(b.textContent.trim()===correct)b.classList.add("correct");
  });
 }

 document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQuestion(){
 quizIndex++;
 quizAnswered=false;
 renderApp();
}

function finishQuiz(){
 const percent=Math.round(quizScore/quizItems.length*100);

 saveScore(quizMode,quizScore,quizItems.length);
 saveHistory({
  type:"آزمون",
  title:quizMode,
  detail:`نمره ${percent}%`
 });

 if(quizMode==="تعیین سطح"){
  localStorage.setItem(
   "ali_level_"+(currentUser?.id||"guest"),
   JSON.stringify({percent,date:new Date().toLocaleString("fa-IR")})
  );
 }

 currentPage="result";
 renderApp();
}

function renderResult(c){
 const scores=getScores();
 const last=scores[scores.length-1];
 let levelText="";

 if(quizMode==="تعیین سطح"){
  const p=last?.percent||0;
  if(p<30)levelText="مبتدی — Beginner";
  else if(p<50)levelText="Elementary — ابتدایی";
  else if(p<70)levelText="Pre-Intermediate — پیش متوسط";
  else if(p<85)levelText="Intermediate — متوسط";
  else if(p<95)levelText="Upper-Intermediate — بالاتر از متوسط";
  else levelText="Advanced — پیشرفته";
 }

 c.innerHTML=`
 <div class="card result">
  <div style="font-size:45px">🎉</div>
  <h2>${esc(quizMode)} تمام شد!</h2>
  <div class="result-score">${last?.percent||0}%</div>
  <p>نمره شما: ${last?.score||0} از ${last?.total||0}</p>
  ${quizMode==="تعیین سطح"?`
   <div class="card" style="background:#f5f3ff">
    <div style="font-size:13px;color:#777">سطح پیشنهادی شما</div>
    <strong style="font-size:22px;color:var(--p)">${levelText}</strong>
   </div>`:""}
  <p style="color:#777">می‌توانی هر چند بار که بخواهی دوباره در آزمون شرکت کنی.</p>
  <button class="retry" onclick="${
   quizMode==="تعیین سطح"?"startPlacementQuiz()":
   quizMode==="آزمون جامع هفتم"?"startComprehensiveQuiz()":
   `startLessonQuiz('${currentLesson}')`
  }">🔄 شرکت مجدد</button>
  <br>
  <button class="back" onclick="go('home')">بازگشت به خانه</button>
 </div>`;
}

async function logout(){
 try{
  await sb.auth.signOut({scope:"local"});
 }catch(e){}
 currentUser=null;
 localStorage.removeItem("ali_current_user");
 renderLogin();
}

async function restoreSession(){
 try{
  const {data:{session}}=await sb.auth.getSession();

  if(!session){
   renderLogin();
   return;
  }

  const user=session.user;

  const {data:student}=await sb
   .from("students")
   .select("*")
   .eq("auth_user_id",user.id)
   .maybeSingle();

  if(student){
   currentUser={...student,auth_user_id:user.id};
   startApp();
   return;
  }

  const {data:admin}=await sb
   .from("admins")
   .select("*")
   .eq("user_id",user.id)
   .maybeSingle();

  if(admin){
   currentUser={
    id:user.id,
    first_name:"مدیر",
    last_name:"",
    role:"admin"
   };
   currentPage="admin";
   renderApp();
   return;
  }

  await sb.auth.signOut({scope:"local"});
  renderLogin();

 }catch(e){
  console.error(e);
  renderLogin();
 }
}

sb.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){
  currentUser=null;
  renderLogin();
 }
});

/* =========================================================
   BOOT
   ========================================================= */

restoreSession();
