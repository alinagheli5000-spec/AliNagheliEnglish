<body>

<div id="app"></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const { createClient } = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
===================================================== */

const state = {

  user:null,

  profile:null,

  isAdmin:false,

  students:[],

  courses:[],

  loginMode:"student",

  adminFilter:"all",

  search:"",

  studentPage:"home"

};


/* =====================================================
   HELPERS
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


function notice(
  text,
  type="info"
){

  const old =
    document.getElementById("notice");

  if(old){
    old.remove();
  }

  const box =
    document.createElement("div");

  box.id="notice";

  box.className =
    "notice " + type;

  box.textContent=text;

  const wrap =
    document.querySelector(".wrap");

  if(wrap){

    wrap.prepend(box);

  }

  setTimeout(
    function(){

      if(box){
        box.remove();
      }

    },
    5000
  );

}


function studentEmail(phone){

  return String(phone || "")
    .replace(/\D/g,"")
    + "@alinagheli.com";

}


function statusBadge(status){

  let cls="waiting";

  let text="در صف انتظار";

  if(status==="registered"){

    cls="registered";

    text="ثبت‌نام شده";

  }

  if(status==="graduate"){

    cls="graduate";

    text="فارغ‌التحصیل";

  }

  return `
    <span class="badge ${cls}">
      ${text}
    </span>
  `;

}


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  const result =
    await db.auth.getSession();

  const session =
    result.data.session;

  if(session){

    state.user =
      session.user;

    await loadIdentity();

  }else{

    renderLogin();

  }

  db.auth.onAuthStateChange(
    async function(
      event,
      session
    ){

      if(session){

        state.user =
          session.user;

        await loadIdentity();

      }else{

        state.user=null;

        state.profile=null;

        state.isAdmin=false;

        renderLogin();

      }

    }
  );

}


/* =====================================================
   IDENTITY
===================================================== */

async function loadIdentity(){

  state.isAdmin=false;

  state.profile=null;

  if(!state.user){

    renderLogin();

    return;

  }


  /* ADMIN */

  const adminResult =
    await db
      .from("admins")
      .select("id,user_id")
      .eq(
        "user_id",
        state.user.id
      )
      .maybeSingle();


  if(adminResult.data){

    state.isAdmin=true;

    await loadAdminData();

    renderApp();

    return;

  }


  /* STUDENT */

  const studentResult =
    await db
      .from("students")
      .select("*")
      .eq(
        "auth_user_id",
        state.user.id
      )
      .maybeSingle();


  if(studentResult.error){

    console.error(
      studentResult.error
    );

  }


  state.profile =
    studentResult.data || null;


  /*
    IMPORTANT:
    WAITING STUDENT MUST NOT ENTER
  */

  if(
    state.profile &&
    state.profile.status !== "registered" &&
    state.profile.status !== "graduate"
  ){

    await db.auth.signOut();

    state.user=null;

    state.profile=null;

    renderLogin();

    setTimeout(
      function(){

        notice(
          "ثبت‌نام شما هنوز توسط مدیر تأیید نشده است. ⏳",
          "info"
        );

      },
      100
    );

    return;

  }


  renderApp();

}


/* =====================================================
   COURSES
===================================================== */

async function loadCourses(){

  const result =
    await db
      .from("courses")
      .select("*")
      .order("id");

  if(!result.error){

    state.courses =
      result.data || [];

  }else{

    state.courses=[];

    console.error(
      result.error
    );

  }

}


/* =====================================================
   ADMIN DATA
===================================================== */

async function loadAdminData(){

  await loadCourses();

  const result =
    await db
      .from("students")
      .select("*")
      .order(
        "id",
        {
          ascending:false
        }
      );


  if(!result.error){

    state.students =
      result.data || [];

  }else{

    state.students=[];

    console.error(
      result.error
    );

  }

}


/* =====================================================
   HEADER
===================================================== */

function header(){

  return `

    <div class="top">

      <div class="toprow">

        <div>

          <div class="brand">
            AliNagheli English
          </div>

          <div class="sub">

            ${
              state.isAdmin
                ? "پنل مدیریت"
                : "سامانه آموزش زبان انگلیسی"
            }

          </div>

        </div>


        <button
          class="btn secondary small"
          onclick="logout()">

          خروج

        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   LOGIN
===================================================== */

function renderLogin(){

  document.body.innerHTML=`

    <div class="wrap">

      <div class="card login">

        <div class="logo">
          AN
        </div>

        <h1 style="text-align:center">
          AliNagheli English
        </h1>

        <p
          class="muted"
          style="text-align:center">

          سامانه آموزش زبان انگلیسی

        </p>


        <div class="tabs">

          <button
            class="tab ${
              state.loginMode==="student"
                ? "active"
                : ""
            }"
            onclick="setLoginMode('student')">

            👩‍🎓 زبان‌آموز

          </button>


          <button
            class="tab ${
              state.loginMode==="admin"
                ? "active"
                : ""
            }"
            onclick="setLoginMode('admin')">

            👨‍💼 مدیریت

          </button>

        </div>


        <div id="loginForm"></div>

      </div>

    </div>

  `;

  renderLoginForm();

}


/* =====================================================
   LOGIN MODE
===================================================== */

function setLoginMode(mode){

  state.loginMode=mode;

  renderLogin();

}


/* =====================================================
   LOGIN FORM
===================================================== */

function renderLoginForm(){

  const box =
    document.getElementById(
      "loginForm"
    );


  if(state.loginMode==="admin"){

    box.innerHTML=`

      <label>
        ایمیل مدیر
      </label>

      <input
        id="email"
        type="email"
        placeholder="ایمیل مدیر"
        autocomplete="username">


      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور"
        autocomplete="current-password">


      <button
        class="btn full"
        style="margin-top:14px"
        onclick="loginAdmin()">

        ورود به پنل مدیریت

      </button>

    `;

  }else{

    box.innerHTML=`

      <label>
        شماره تلفن
      </label>

      <input
        id="phone"
        inputmode="tel"
        placeholder="0914...">


      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور">


      <button
        class="btn full"
        style="margin-top:14px"
        onclick="loginStudent()">

        ورود زبان‌آموز

      </button>


      <button
        class="btn secondary full"
        style="margin-top:8px"
        onclick="showRegister()">

        📝 ثبت‌نام زبان‌آموز جدید

      </button>

    `;

  }

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function loginAdmin(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    notice(
      "ایمیل و رمز عبور را وارد کنید.",
      "err"
    );

    return;

  }


  const result =
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(result.error){

    console.error(
      result.error
    );

    notice(
      "ایمیل یا رمز عبور مدیر صحیح نیست.",
      "err"
    );

    return;

  }


  state.user =
    result.data.user;

  await loadIdentity();

}


/* =====================================================
   STUDENT LOGIN
===================================================== */

async function loginStudent(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(!phone || !password){

    notice(
      "شماره تلفن و رمز عبور را وارد کنید.",
      "err"
    );

    return;

  }


  const result =
    await db.auth.signInWithPassword({

      email:
        studentEmail(phone),

      password:password

    });


  if(result.error){

    console.error(
      result.error
    );

    notice(
      "شماره تلفن یا رمز عبور نادرست است.",
      "err"
    );

    return;

  }


  state.user =
    result.data.user;

  await loadIdentity();

}


/* =====================================================
   REGISTER PAGE
===================================================== */

function showRegister(){

  document
    .getElementById("loginForm")
    .innerHTML=`

      <h3>
        ثبت‌نام زبان‌آموز
      </h3>

      <p class="muted">
        پس از ثبت‌نام، درخواست شما برای بررسی مدیر ارسال می‌شود.
      </p>


      <div class="row">

        <div>

          <label>
            نام
          </label>

          <input id="r_first">

        </div>


        <div>

          <label>
            نام خانوادگی
          </label>

          <input id="r_last">

        </div>

      </div>


      <label>
        شماره تلفن
      </label>

      <input
        id="r_phone"
        inputmode="tel"
        placeholder="0914...">


      <label>
        رمز عبور
      </label>

      <input
        id="r_pass"
        type="password"
        placeholder="حداقل ۶ کاراکتر">


      <label>
        پایه / سطح
      </label>

      <input
        id="r_level"
        placeholder="مثلاً پایه نهم / A2 / B1">


      <label>
        هدف از یادگیری زبان
      </label>

      <textarea
        id="r_goal"
        rows="3"
        placeholder="مثلاً مکالمه، مدرسه، IELTS و ..."></textarea>


      <button
        class="btn full"
        style="margin-top:12px"

/* =====================================================
   REGISTER
===================================================== */

async function registerStudent(){

  const first =
    document
      .getElementById("r_first")
      .value
      .trim();

  const last =
    document
      .getElementById("r_last")
      .value
      .trim();

  const phone =
    document
      .getElementById("r_phone")
      .value
      .trim();

  const pass =
    document
      .getElementById("r_pass")
      .value;

  const level =
    document
      .getElementById("r_level")
      .value
      .trim();


  if(
    !first ||
    !last ||
    !phone ||
    !pass
  ){

    notice(
      "نام، نام خانوادگی، شماره تلفن و رمز عبور الزامی است.",
      "err"
    );

    return;

  }


  if(pass.length < 6){

    notice(
      "رمز عبور باید حداقل ۶ کاراکتر باشد.",
      "err"
    );

    return;

  }


  const email =
    studentEmail(phone);


  /*
    Check existing profile first
  */

  const existing =
    await db
      .from("students")
      .select("id,status,auth_user_id")
      .eq(
        "phone",
        phone
      )
      .maybeSingle();


  if(existing.data){

    notice(
      "این شماره تلفن قبلاً ثبت شده است. وضعیت حساب شما: "
      +
      (
        existing.data.status === "waiting"
          ? "در انتظار تأیید"
          : existing.data.status === "registered"
            ? "ثبت‌نام شده"
            : "فارغ‌التحصیل"
      ),
      "err"
    );

    return;

  }


  /*
    Create Auth account
  */

  const auth =
    await db.auth.signUp({

      email:email,

      password:pass,

      options:{

        data:{

          first_name:first,

          last_name:last,

          phone:phone

        }

      }

    });


  if(auth.error){

    console.error(
      auth.error
    );

    if(
      auth.error.message
        .toLowerCase()
        .includes("already registered")
    ){

      notice(
        "این شماره تلفن قبلاً دارای حساب کاربری است.",
        "err"
      );

    }else{

      notice(
        auth.error.message,
        "err"
      );

    }

    return;

  }


  if(!auth.data.user){

    notice(
      "حساب کاربری ساخته نشد.",
      "err"
    );

    return;

  }


  /*
    Insert student profile
  */

  const payload={

    first_name:first,

    last_name:last,

    phone:phone,

    level:level,

    status:"waiting",

    auth_user_id:
      auth.data.user.id,

    password_created:true

  };


  const insert =
    await db
      .from("students")
      .insert(payload);


  if(insert.error){

    console.error(
      insert.error
    );

    notice(
      "حساب کاربری ساخته شد اما اطلاعات زبان‌آموز ذخیره نشد: "
      +
      insert.error.message,
      "err"
    );

    return;

  }


  /*
    Important:
    if Supabase automatically logged the user in,
    immediately sign out because admin approval is required.
  */

  await db.auth.signOut();


  state.user=null;

  state.profile=null;


  renderLogin();


  setTimeout(
    function(){

      notice(
        "ثبت‌نام با موفقیت انجام شد. درخواست شما در انتظار تأیید مدیر است. ⏳",
        "ok"
      );

    },
    100
  );

}

/* =====================================================
   LEVEL TEST DEMO
===================================================== */

function startLevelTest(){

  const questions=[

    {
      q:"Choose the correct sentence:",
      options:[
        "She go to school every day.",
        "She goes to school every day.",
        "She going to school every day."
      ],
      answer:1
    },

    {
      q:"What is the past form of 'go'?",
      options:[
        "goed",
        "gone",
        "went"
      ],
      answer:2
    },

    {
      q:"I have lived here ___ 2020.",
      options:[
        "since",
        "for",
        "from"
      ],
      answer:0
    }

  ];


  let index=0;

  let score=0;


  function showQuestion(){

    const q=
      questions[index];


    document
      .getElementById("quizBox")
      .innerHTML=`

        <div class="muted">
          سؤال ${index+1} از ${questions.length}
        </div>

        <h3 style="margin-top:12px">
          ${q.q}
        </h3>

        ${
          q.options
            .map(
              function(option,i){

                return `

                  <button
                    class="quizOption"
                    onclick="answerLevel(${i})">

                    ${esc(option)}

                  </button>

                `;

              }
            )
            .join("")
        }

      `;


    window.answerLevel =
      function(selected){

        if(selected===q.answer){

          score++;

        }

        index++;

        if(index >= questions.length){

          finish();

        }else{

          showQuestion();

        }

      };

  }


  function finish(){

    let level="A1";

    if(score===2){
      level="A2";
    }

    if(score===3){
      level="B1";
    }


    document
      .getElementById("quizBox")
      .innerHTML=`

        <div class="hero">

          <h2>
            نتیجه تعیین سطح 🎉
          </h2>

          <p>
            امتیاز شما:
            ${score}
            از
            ${questions.length}
          </p>

          <div style="font-size:35px;font-weight:900">
            ${level}
          </div>

        </div>

        <button
          class="btn full"
          onclick="renderLevelTest()">

          انجام دوباره آزمون

        </button>

      `;

  }


  showQuestion();

}

    document.getElementById("q");


  const q =
    (
      input
        ?.value
      ||
      state.search
      ||
      ""
    )
    .trim()
    .toLowerCase();


  state.search=q;


  let students =
    [...state.students];


  if(
    state.adminFilter !== "all"
  ){

    students =
      students.filter(
        s =>
          s.status ===
          state.adminFilter
      );

  }


  if(q){

    students =
      students.filter(
        function(s){

          const text =
            `
              ${s.first_name}
              ${s.last_name}
              ${s.phone}
              ${s.level}
            `
            .toLowerCase();


          return text.includes(q);

        }
      );

  }


  const list =
    document.getElementById(
      "studentList"
    );


  if(!list)return;


  list.innerHTML =
    students
      .map(studentCard)
      .join("")

    ||

    '<div class="empty">موردی پیدا نشد.</div>';

}


/* =====================================================
   STUDENT CARD
===================================================== */

function studentCard(s){

  const isWaiting =
    s.status==="waiting";


  const isRegistered =
    s.status==="registered";


  const isGraduate =
    s.status==="graduate";


  return `

    <div class="student">

      <div class="studenthead">

        <div>

          <b>
            ${esc(s.first_name)}
            ${esc(s.last_name)}
          </b>


          <div class="infoLine">
            📱
            ${esc(s.phone || "-")}
          </div>


          <div class="infoLine">
            📚
            ${esc(s.level || "بدون سطح")}
          </div>

        </div>


        <div>

          ${statusBadge(s.status)}

        </div>

      </div>


      <div class="divider"></div>


      <div class="actions">

        ${
          isWaiting
            ?

            `

              <button
                class="btn ok small"
                onclick="confirmRegistration(${s.id})">

                ✅ تأیید ثبت‌نام

              </button>


              <button
                class="btn danger small"
                onclick="rejectStudent(${s.id})">

                ❌ رد و حذف

              </button>

            `

            : ""

        }


        ${
          isRegistered
            ?

            `

              <button
                class="btn secondary small"
                onclick="setStatus(${s.id},'graduate')">

                🎓 فارغ‌التحصیل

              </button>


              <button
                class="btn secondary small"
                onclick="setStatus(${s.id},'waiting')">

                ↩ بازگشت به صف

              </button>


              <button
                class="btn danger small"
                onclick="deleteStudent(${s.id})">

                🗑️ حذف

              </button>

            `

            : ""

        }


        ${
          isGraduate
            ?

            `

              <button
                class="btn secondary small"
                onclick="setStatus(${s.id},'registered')">

                ↩ فعال‌سازی مجدد

              </button>


              <button
                class="btn danger small"
                onclick="deleteStudent(${s.id})">

                🗑️ حذف

              </button>

            `

            : ""

        }

      </div>

    </div>

  `;

}


/* =====================================================
   CONFIRM
===================================================== */

async function confirmRegistration(id){

  const student =
    state.students.find(
      s=>s.id===id
    );


  if(!student)return;


  const name =
    `${student.first_name} ${student.last_name}`;


  const confirmed =
    confirm(
      `آیا ثبت‌نام «${name}» را تأیید می‌کنید؟`
    );


  if(!confirmed)return;


  await setStatus(
    id,
    "registered"
  );

}


/* =====================================================
   REJECT
===================================================== */

async function rejectStudent(id){

  const student =
    state.students.find(
      s=>s.id===id
    );


  if(!student)return;


  const name =
    `${student.first_name} ${student.last_name}`;


  const confirmed =
    confirm(
      `⚠️ درخواست «${name}» رد و از لیست حذف شود؟`
    );


  if(!confirmed)return;


  await deleteStudent(id);

}


/* =====================================================
   DELETE STUDENT
===================================================== */

async function deleteStudent(id){

  const student =
    state.students.find(
      s=>s.id===id
    );


  if(!student)return;


  const name =
    `${student.first_name} ${student.last_name}`;


  const confirmed =
    confirm(
      `⚠️ آیا «${name}» برای همیشه از لیست زبان‌آموزان حذف شود؟`
    );


  if(!confirmed)return;


  const result =
    await db
      .from("students")
      .delete()
      .eq(
        "id",
        id
      );


  if(result.error){

    console.error(
      result.error
    );

    notice(
      "حذف انجام نشد: " +
      result.error.message,
      "err"
    );

    return;

  }


  /*
    Remove immediately from local state
  */

  state.students =
    state.students.filter(
      s=>s.id!==id
    );


  renderAdminStudents(
    state.adminFilter
  );


  notice(
    "زبان‌آموز با موفقیت از جدول students حذف شد.",
    "ok"
  );

}


/* =====================================================
   CHANGE STATUS
===================================================== */

async function setStatus(
  id,
  status
){

  const result =
    await db
      .from("students")
      .update({
        status:status
      })
      .eq(
        "id",
        id
      );


  if(result.error){

    console.error(
      result.error
    );

    notice(
      result.error.message,
      "err"
    );

    return false;

  }


  const student =
    state.students.find(
      s=>s.id===id
    );


  if(student){

    student.status =
      status;

  }


  if(
    state.adminFilter !==
    "all"
  ){

    renderAdminStudents();

  }else{

    renderAdmin();

  }


  notice(
    status==="registered"
      ? "ثبت‌نام زبان‌آموز تأیید شد. ✅"
      : "وضعیت زبان‌آموز تغییر کرد.",
    "ok"
  );


  return true;

}


/* =====================================================
   REFRESH STUDENTS
===================================================== */

async function refreshStudents(){

  await loadAdminData();

  renderAdminStudents();

  notice(
    "لیست زبان‌آموزان بروزرسانی شد.",
    "ok"
  );

}


/* =====================================================
   ADMIN COURSES
===================================================== */

function renderAdminCourses(){

  document
    .getElementById("content")
    .innerHTML=`

      <div class="card">

        <div class="adminTitle">

          <div>

            <h2>
              دوره‌ها 📚
            </h2>

            <p class="muted">
              دوره‌های موجود در سامانه
            </p>

          </div>


          <button
            class="btn secondary small"
            onclick="loadCourses().then(renderAdminCourses)">

            🔄 بروزرسانی

          </button>

        </div>


        ${
          state.courses.length

            ?

            state.courses
              .map(
                function(course){

                  return `

                    <div class="course">

                      <div class="courseHeader">

                        <div>

                          <h3>
                            ${esc(course.title)}
                          </h3>

                          <div class="muted">
                            ${esc(course.category || "دوره آموزشی")}
                          </div>

                        </div>

                        <span class="badge ${
                          course.active===false
                            ? "waiting"
                            : "registered"
                        }">

                          ${
                            course.active===false
                              ? "غیرفعال"
                              : "فعال"
                          }

                        </span>

                      </div>

                    </div>

                  `;

                }
              )
              .join("")

            :

            '<div class="empty">هنوز دوره‌ای ثبت نشده است.</div>'
        }

      </div>

    `;

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await db.auth.signOut();

  state.user=null;

  state.profile=null;

  state.isAdmin=false;

  state.students=[];

  state.courses=[];

  state.studentPage="home";

  renderLogin();

}


/* =====================================================
   START
===================================================== */

boot();

</script>
