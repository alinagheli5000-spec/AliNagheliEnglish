<html lang="fa" dir="rtl">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#6d28d9;
  --purple2:#8b5cf6;
  --purple3:#a78bfa;
  --dark:#24113f;
  --bg:#f7f5ff;
  --card:#fff;
  --text:#27223a;
  --muted:#77718a;
  --green:#16a34a;
  --red:#dc2626;
  --gold:#f59e0b;
  --shadow:0 12px 35px rgba(67,35,120,.12);
}
body{
  font-family:Tahoma,"Segoe UI",sans-serif;
  background:linear-gradient(145deg,#f8f5ff,#eee7ff);
  color:var(--text);
  min-height:100vh;
}
button,input,select{font-family:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh}
.screen{min-height:100vh}
.container{width:min(1100px,94%);margin:auto}
.top-space{padding-top:25px}
.logo{
  font-size:32px;
  font-weight:1000;
  letter-spacing:.5px;
  text-align:center;
  color:#fff;
  text-shadow:0 4px 0 #4c1d95,0 8px 18px rgba(76,29,149,.35);
}
.logo small{display:block;font-size:12px;letter-spacing:3px;margin-top:5px;text-shadow:none;opacity:.8}
.hero{
  background:linear-gradient(135deg,#5b21b6,#7c3aed,#9333ea);
  min-height:330px;
  border-radius:0 0 45px 45px;
  padding:30px 20px 45px;
  box-shadow:0 15px 45px rgba(91,33,182,.25);
}
.hero-title{
  text-align:center;color:white;margin-top:38px;
  font-size:25px;font-weight:900;line-height:1.7;
}
.hero-sub{text-align:center;color:#eee;margin-top:10px;font-size:14px}
.login-grid{
  max-width:900px;margin:35px auto 0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
}
.login-card{
  background:rgba(255,255,255,.97);
  border-radius:25px;padding:25px 18px;
  text-align:center;box-shadow:var(--shadow);
  transition:.2s;position:relative;overflow:hidden;
}
.login-card:hover{transform:translateY(-4px)}
.login-icon{
  width:65px;height:65px;margin:0 auto 15px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;background:#f0eaff;
}
.login-card h3{font-size:17px;margin-bottom:8px}
.login-card p{font-size:12px;color:var(--muted);min-height:35px}
.btn{
  width:100%;padding:13px 16px;border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:white;font-weight:bold;margin-top:15px;
  box-shadow:0 7px 18px rgba(109,40,217,.22);
}
.btn.secondary{background:#f0ebff;color:var(--purple);box-shadow:none}
.btn.green{background:linear-gradient(135deg,#16a34a,#22c55e)}
.btn.red{background:linear-gradient(135deg,#dc2626,#ef4444)}
.btn.gray{background:#eeeef2;color:#555;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.register-link{
  display:block;text-align:center;color:#fff;font-weight:bold;
  margin:24px auto 0;text-decoration:underline;cursor:pointer;
}
.modal{
  position:fixed;inset:0;background:rgba(25,12,48,.6);
  z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:18px;backdrop-filter:blur(5px);
}
.modal-box{
  background:#fff;width:min(520px,100%);max-height:92vh;overflow:auto;
  border-radius:28px;padding:25px;box-shadow:0 25px 70px rgba(0,0,0,.25);
}
.modal-title{font-size:21px;font-weight:900;margin-bottom:18px}
.close{
  float:left;background:#f2eff8;width:35px;height:35px;border-radius:50%;
  font-size:20px;color:#555;
}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.field input,.field select{
  width:100%;padding:13px;border:1px solid #ddd5ef;border-radius:13px;
  outline:none;background:#faf9fd;font-size:14px;
}
.field input:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 3px #ede9fe}
.message{
  padding:12px;border-radius:12px;margin:12px 0;font-size:13px;line-height:1.8;
}
.message.error{background:#fee2e2;color:#991b1b}
.message.success{background:#dcfce7;color:#166534}
.message.info{background:#ede9fe;color:#5b21b6}
.pending{
  text-align:center;padding:30px 15px;background:#fffbeb;
  border-radius:18px;color:#92400e;line-height:2;
}
.dashboard-header{
  background:linear-gradient(135deg,#5b21b6,#7c3aed);
  padding:25px 0 35px;color:#fff;border-radius:0 0 35px 35px;
}
.user-head{

}
.avatar{

}
.user-name{font-size:19px;font-weight:bold}
.user-level{font-size:12px;opacity:.8;margin-top:4px}
.logout{background:#fff2;color:#fff;padding:9px 13px;border-radius:12px}
.content{padding:20px 0 100px}
.section-title{font-size:19px;font-weight:900;margin:22px 0 13px}

}
.daily-word:before{content:"✦";position:absolute;left:20px;top:8px;font-size:50px;color:#ddd0ff}
.daily-label{font-size:12px;color:var(--purple);font-weight:bold}
.word-en{font-size:29px;font-weight:1000;color:var(--purple);margin:7px 0}
.word-fa{color:var(--muted)}
.sound{

}
.stats{

.stat{

}
.stat b{display:block;font-size:22px;color:var(--purple)}
.stat span{font-size:11px;color:var(--muted)}
.cards{

.card{

}
.card h3{font-size:16px;margin-bottom:7px}
.card p{font-size:12px;color:var(--muted);line-height:1.8}
.course-card{

}

.course-card h3{font-size:18px;color:var(--purple)}
.course-card p{font-size:12px;color:var(--muted);margin:8px 0}
.lesson-list{display:grid;gap:13px}
.lesson-card{
  background:white;border-radius:20px;padding:18px;

}
.lesson-number{

}
.lesson-card h3{font-size:15px}
.lesson-card p{font-size:11px;color:var(--muted);margin-top:4px}
.lesson-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.small-btn{padding:8px 11px;border-radius:10px;background:#f0ebff;color:var(--purple);font-size:11px;font-weight:bold}
.nav{
  position:fixed;z-index:900;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid #e8e2f3;padding:8px 4px calc(8px + env(safe-area-inset-bottom));

}
.nav button{
  background:none;color:#81798f;font-size:10px;font-weight:bold;

.nav button span{font-size:22px}
.nav button.active{color:var(--purple)}
.page-head{

.back{background:#fff2;color:#fff;border-radius:11px;padding:8px 12px}
.page-head-row{display:flex;align-items:center;gap:12px}
.page-head h2{font-size:18px}
.grammar{

.example{

}
.vocab-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}
.vocab{
  background:white;border-radius:16px;padding:13px;
  box-shadow:0 5px 18px rgba(60,35,100,.08);
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
.vocab-en{font-weight:900;color:var(--purple);direction:ltr}
.vocab-fa{font-size:11px;color:var(--muted)}
.vocab button{

.exam{

}
.exam-progress{height:8px;background:#eee9f7;border-radius:10px;overflow:hidden;margin:12px 0 20px}
.exam-progress div{height:100%;background:linear-gradient(90deg,var(--purple),#a855f7);transition:.3s}
.question{font-size:17px;font-weight:bold;line-height:1.9;margin-bottom:17px}
.options{display:grid;gap:10px}
.option{
  padding:14px;border:2px solid #e7e1f0;border-radius:14px;
  background:#fff;text-align:right;transition:.2s
}
.option:hover{border-color:#b9a4ed}
.option.selected{border-color:var(--purple);background:#f5f1ff}
.option.correct{border-color:#22c55e;background:#dcfce7}
.option.wrong{border-color:#ef4444;background:#fee2e2}
.feedback{
  margin:15px 0;padding:16px;border-radius:18px;text-align:center;
  font-weight:bold;font-size:18px
}
.feedback.correct{background:#dcfce7;color:#166534}
.feedback.wrong{background:#fee2e2;color:#991b1b}
.emoji{font-size:40px;display:block;margin-bottom:5px}
.result{

}
.result-score{font-size:50px;font-weight:1000;color:var(--purple);margin:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden}
th,td{padding:12px;text-align:center;border-bottom:1px solid #eee;font-size:12px}
th{background:#f0ebff;color:var(--purple)}
.profile-box{

}
.profile-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}
.profile-row span:first-child{color:var(--muted)}
.admin-tabs{display:flex;gap:8px;margin:15px 0;overflow:auto}
.admin-tab{white-space:nowrap;padding:10px 15px;background:#eeeaf5;border-radius:12px;color:#655d72}
.admin-tab.active{background:var(--purple);color:#fff}
.student-admin{

.student-admin-top{display:flex;justify-content:space-between;gap:10px}
.badge{padding:5px 9px;border-radius:9px;font-size:10px;font-weight:bold}
.badge.waiting{background:#fef3c7;color:#92400e}
.badge.registered{background:#dcfce7;color:#166534}
.badge.rejected{background:#fee2e2;color:#991b1b}
.admin-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.loading{
  position:fixed;inset:0;background:rgba(255,255,255,.8);
  z-index:2000;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;backdrop-filter:blur(4px)
}
.spinner{
  width:45px;height:45px;border:5px solid #e9ddff;
  border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;z-index:3000;bottom:90px;left:50%;transform:translateX(-50%);
  padding:13px 20px;background:#24113f;color:#fff;border-radius:15px;
  box-shadow:var(--shadow);font-size:13px;max-width:90%;text-align:center
}
@media(max-width:700px){
  .login-grid{grid-template-columns:1fr}
  .login-card{padding:18px}
  .login-card p{min-height:auto}
  .cards{grid-template-columns:1fr}
}
@media(min-width:701px){
  .courses-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
}
</style>
</head>

<script>
/* =========================================================
   SUPABASE
========================================================= */
const SUPABASE_URL = "https://kapzyedzjecnfxevjisq.supabase.co";
const SUPABASE_KEY = "sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHe4";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

/* =========================================================
   GLOBAL STATE
========================================================= */
let currentUser = null;
let currentStudent = null;
let isAdmin = false;
let currentPage = "home";
let examState = null;

/* =========================================================
   HELPERS
========================================================= */
function $(id){return document.getElementById(id)}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showLoading(text="لطفاً صبر کنید..."){
  $("loadingText").textContent=text;
  $("loading").classList.remove("hidden");
}

function hideLoading(){
  $("loading").classList.add("hidden");
}

function toast(message){
  const t=$("toast");
  t.textContent=message;
  t.classList.remove("hidden");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.add("hidden"),3500);
}

function normalizePhone(phone){
  let p=String(phone||"").trim().replace(/\s+/g,"").replace(/-/g,"");
  if(p.startsWith("+98"))p="0"+p.slice(3);
  if(p.startsWith("0098"))p="0"+p.slice(4);
  if(/^[۰-۹]+$/.test(p)){
    p=p.replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
  }
  return p;
}

function authEmail(phone){
  return normalizePhone(phone)+"@alinagheli.com";
}

function nowDate(){
  return new Date().toLocaleDateString("fa-IR");
}

function speak(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";
    u.rate=.78;
    u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){
    toast("امکان پخش تلفظ در این مرورگر وجود ندارد.");
  }
}

function setPage(page){
  currentPage=page;
  render();
}

function goBack(){
  if(currentPage.startsWith("lesson-")){
    setPage("grade7");
  }else if(currentPage==="grade7"){
    setPage("courses");
  }else if(currentPage==="exam"){
    setPage("home");
  }else if(currentPage==="placement"){
    setPage("home");
  }else{
    setPage("home");
  }
}

async function login(event,type){
  event.preventDefault();

  const password=$("loginPassword").value;
  let email;

  if(type==="admin"){
    email=$("loginEmail").value.trim();
  }else{
    const phone=normalizePhone($("loginPhone").value);
    if(!phone){
      $("loginMessage").innerHTML=`<div class="message error">شماره تلفن را وارد کنید.</div>`;
      return;
    }
    email=authEmail(phone);
  }

  showLoading("در حال ورود...");
  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if(error)throw error;

    currentUser=data.user;

    if(type==="admin"){
      const {data:admin,error:adminError}=await supabaseClient
        .from("admins")
        .select("*")
        .or(`user_id.eq.${currentUser.id},auth_user_id.eq.${currentUser.id}`)
        .maybeSingle();

      if(adminError)throw adminError;

      if(!admin){
        await supabaseClient.auth.signOut();
        currentUser=null;
        throw new Error("این حساب دسترسی مدیر ندارد.");
      }

      isAdmin=true;
      closeModal();
      await loadAdmin();
      return;
    }

    const {data:student,error:studentError}=await supabaseClient
      .from("students")
      .select("*")
      .eq("auth_user_id",currentUser.id)
      .maybeSingle();

    if(studentError)throw studentError;

    if(!student){
      await supabaseClient.auth.signOut();
      currentUser=null;
      throw new Error("اطلاعات زبان‌آموز پیدا نشد. با مدیر سامانه تماس بگیرید.");
    }

    if(student.status!=="registered"){
      await supabaseClient.auth.signOut();
      currentUser=null;
      throw new Error("حساب شما هنوز توسط مدیر تأیید نشده است.");
    }

    currentStudent=student;
    isAdmin=false;
    closeModal();
    currentPage="home";
    render();

  }catch(error){
    const msg=translateAuthError(error);
    const box=type==="admin"?$("loginMessage"):$("loginMessage");
    if(box)box.innerHTML=`<div class="message error">${escapeHTML(msg)}</div>`;
  }finally{
    hideLoading();
  }
}

async function registerStudent(event){
  event.preventDefault();

  const firstName=$("regFirst").value.trim();
  const lastName=$("regLast").value.trim();
  const phone=normalizePhone($("regPhone").value);
  const level=$("regLevel").value;
  const password=$("regPassword").value;
  const password2=$("regPassword2").value;

  if(password!==password2){
    $("registerMessage").innerHTML=
      `<div class="message error">رمز عبور و تکرار آن یکسان نیست.</div>`;
    return;
  }

  if(password.length<6){
    $("registerMessage").innerHTML=
      `<div class="message error">رمز عبور باید حداقل ۶ کاراکتر باشد.</div>`;
    return;
  }

  if(!/^09\d{9}$/.test(phone)){
    $("registerMessage").innerHTML=
      `<div class="message error">شماره تلفن معتبر وارد کنید.</div>`;
    return;
  }

  showLoading("در حال ثبت درخواست...");
  try{
    const {data:existing,error:existingError}=await supabaseClient
      .from("students")
      .select("id,status,auth_user_id")
      .eq("phone",phone)
      .maybeSingle();

    if(existingError)throw existingError;

    if(existing){
      if(existing.status==="waiting"){
        throw new Error("درخواست ثبت‌نام شما قبلاً ثبت شده و منتظر تأیید مدیر است.");
      }
      throw new Error("این شماره تلفن قبلاً در سامانه ثبت شده است.");
    }

    const email=authEmail(phone);

    const {data:signData,error:signError}=await supabaseClient.auth.signUp({
      email,
      password,
      options:{
        data:{
          first_name:firstName,
          last_name:lastName,
          phone
        }
      }
    });

    if(signError)throw signError;

    if(!signData.user){
      throw new Error("حساب کاربری ایجاد نشد.");
    }

    const {error:insertError}=await supabaseClient
      .from("students")
      .insert({
        first_name:firstName,
        last_name:lastName,
        phone,
        level,
        status:"waiting",
        auth_user_id:signData.user.id,
        password_created:true
      });

    if(insertError){
      await supabaseClient.auth.signOut();
      throw insertError;
    }

    await supabaseClient.auth.signOut();

    closeModal();
    $("app").insertAdjacentHTML("beforeend",`
      <div class="modal" id="successModal">
        <div class="modal-box" style="text-align:center">
          <div style="font-size:55px">🎉</div>
          <div class="modal-title">درخواست ثبت شد</div>
          <div class="pending">
            درخواست ثبت‌نام شما با موفقیت ثبت شد.<br>
            پس از تأیید مدیر می‌توانید با شماره تلفن
            <b>${escapeHTML(phone)}</b>
            و رمز عبوری که انتخاب کردید وارد شوید.
          </div>
          <button class="btn" onclick="closeModal()">متوجه شدم</button>
        </div>
      </div>
    `);

  }catch(error){
    let msg=error.message||"خطا در ثبت‌نام";
    if(String(msg).includes("duplicate")||String(msg).includes("unique")){
      msg="این شماره تلفن قبلاً ثبت شده است.";
    }
    $("registerMessage").innerHTML=
      `<div class="message error">${escapeHTML(msg)}</div>`;
  }finally{
    hideLoading();
  }
}

function translateAuthError(error){
  const m=String(error?.message||error);
  if(m.toLowerCase().includes("invalid login credentials"))
    return "شماره تلفن/ایمیل یا رمز عبور اشتباه است.";
  if(m.toLowerCase().includes("email not confirmed"))
    return "حساب هنوز تأیید نشده است.";
  if(m.toLowerCase().includes("invalid api key"))
    return "کلید اتصال سامانه معتبر نیست.";
  if(m.toLowerCase().includes("user already registered"))
    return "این شماره تلفن قبلاً حساب کاربری دارد.";
  if(m.toLowerCase().includes("fetch"))
    return "خطا در اتصال به سامانه. اتصال اینترنت و تنظیمات Supabase را بررسی کنید.";
  return m;
}

let adminStudentsCache=[];

function renderAdminStudents(data){
  adminStudentsCache=data;

  const total=data.length;
  const waiting=data.filter(x=>x.status==="waiting").length;
  const registered=data.filter(x=>x.status==="registered").length;

  if($("adminTotal"))$("adminTotal").textContent=total;
  if($("adminWaiting"))$("adminWaiting").textContent=waiting;
  if($("adminRegistered"))$("adminRegistered").textContent=registered;

  adminFilter(adminCurrentFilter);
}

function adminFilter(filter,button){
  adminCurrentFilter=filter;

  document.querySelectorAll(".admin-tab").forEach(x=>x.classList.remove("active"));
  if(button)button.classList.add("active");

  const data=adminStudentsCache.filter(x=>
    filter==="all" || x.status===filter

  const box=$("adminStudents");
  if(!box)return;

  if(!data.length){
    box.innerHTML=`

        <div style="font-size:40px">📭</div>

async function approveStudent(id){
  if(!confirm("ثبت‌نام این زبان‌آموز تأیید شود؟"))return;

  showLoading("در حال تأیید...");
  try{
    const {error}=await supabaseClient
      .from("students")
      .update({status:"registered"})
      .eq("id",id);

    if(error)throw error;

    toast("ثبت‌نام با موفقیت تأیید شد.");
    await refreshAdminStudents();
  }catch(e){
    toast("خطا در تأیید: "+e.message);
  }finally{
    hideLoading();
  }
}

async function setStudentWaiting(id){
  if(!confirm("دسترسی این زبان‌آموز موقتاً غیرفعال شود؟"))return;

  showLoading("در حال تغییر وضعیت...");
  try{
    const {error}=await supabaseClient
      .from("students")
      .update({status:"waiting"})
      .eq("id",id);

    if(error)throw error;

    await refreshAdminStudents();
    toast("وضعیت زبان‌آموز تغییر کرد.");
  }catch(e){
    toast("خطا: "+e.message);
  }finally{
    hideLoading();
  }
}

async function deleteStudent(id){
  if(!confirm("این زبان‌آموز حذف شود؟ این عملیات قابل بازگشت نیست."))return;

  showLoading("در حال حذف...");
  try{
    const {error}=await supabaseClient
      .from("students")
      .delete()
      .eq("id",id);

    if(error)throw error;

    await refreshAdminStudents();
    toast("زبان‌آموز حذف شد.");
  }catch(e){
    toast("خطا در حذف: "+e.message);
  }finally{
    hideLoading();
  }
}

    .from("exam_attempts")

    .order("created_at",{ascending:false});

    scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length)+"%":"—";

function renderLesson(page){
  const intro=page==="lesson-intro";

  if(intro){
    renderIntro();
    return;
  }

  const id=Number(page.replace("lesson-",""));
  const lesson=grade7Lessons.find(x=>x.id===id);

  if(!lesson){
    setPage("grade7");
    return;
  }

  const content=`
    <div class="page-head">
      <div class="container">
        <div class="page-head-row">
          <button class="back" onclick="setPage('grade7')">→</button>

function vocabHTML(v){
  return`
    <div class="vocab">
      <div>
        <div class="vocab-en">${escapeHTML(v[0])}</div>
        <div class="vocab-fa">${escapeHTML(v[1])}</div>
      </div>
      <button onclick="speak('${String(v[0]).replaceAll("'","\\'")}')" title="تلفظ">
        🔊
      </button>
    </div>
  `;
}

          }else if(op===examState.selected){
            cls+=" selected";
          }

          return`
            <button class="${cls}" ${examState.answered?"disabled":""}

            }

function answerExam(encoded){
  if(!examState||examState.answered)return;

  const selected=decodeURIComponent(encoded);
  const correct=examState.questions[examState.index][5];

  examState.selected=selected;
  examState.answered=true;

  if(selected===correct)examState.score++;

  renderExam();
}

function nextExamQuestion(){
  if(examState.index===examState.questions.length-1){
    finishExam();
    return;
  }

  examState.index++;
  examState.answered=false;
  examState.selected=null;
  renderExam();
}

async function finishExam(){
  const total=examState.questions.length;
  const percent=Math.round((examState.score/total)*100);

  showLoading("در حال ثبت نتیجه آزمون...");

  try{
    const payload={
      student_id:currentStudent.id,
      score:percent
    };

    let saved=false;

    const {error}=await supabaseClient
      .from("exam_attempts")
      .insert(payload);

    if(!error)saved=true;

    const content=`
      <div class="result">
        <div style="font-size:60px">
          ${percent>=80?"🏆":percent>=50?"😊":"💪"}
        </div>

        <h2>نتیجه آزمون</h2>

        <div class="result-score">${percent}%</div>

        <p style="line-height:2;color:#777">
          پاسخ صحیح: ${examState.score} از ${total}<br>
          ${
            saved
            ?"نتیجه با موفقیت در کارنامه شما ثبت شد."
            :"نتیجه نمایش داده شد؛ برای ثبت دائمی، ساختار جدول exam_attempts را بررسی کنید."
          }
        </p>

        <button class="btn" onclick="examState=null;setPage('exam')">
          آزمون مجدد
        </button>

        <button class="btn secondary" onclick="examState=null;setPage('home')">
          بازگشت به خانه
        </button>
      </div>
    `;

    examState=null;
    $("app").innerHTML=studentShell(content,"home");

  }catch(e){
    toast("نتیجه محاسبه شد ولی ثبت آن با مشکل مواجه شد.");
  }finally{
    hideLoading();
  }
}

function answerPlacement(encoded){
  if(!placementState||placementState.answered)return;

  const selected=decodeURIComponent(encoded);
  const correct=placementQuestions[placementState.index][5];

  placementState.selected=selected;
  placementState.answered=true;

  if(selected===correct)placementState.score++;

  renderPlacement();
}

function nextPlacement(){
  if(placementState.index===29){
    finishPlacement();
    return;
  }

  placementState.index++;
  placementState.answered=false;
  placementState.selected=null;
  renderPlacement();
}

function finishPlacement(){
  const score=placementState.score;
  let level="";
  let description="";

  if(score<=7){
    level="A1";
    description="سطح ابتدایی";
  }else if(score<=12){
    level="A2";
    description="سطح مقدماتی";
  }else if(score<=18){
    level="B1";
    description="سطح متوسط";
  }else if(score<=23){
    level="B2";
    description="سطح متوسط رو به بالا";
  }else if(score<=27){
    level="C1";
    description="سطح پیشرفته";
  }else{
    level="C2";
    description="سطح بسیار پیشرفته";
  }

  const percentage=Math.round(score/30*100);

  $("app").innerHTML=studentShell(`
    <div class="result">
      <div style="font-size:60px">🎯</div>
      <h2>نتیجه تعیین سطح</h2>

      <div class="result-score">${percentage}%</div>

      <h2 style="color:var(--purple)">${level}</h2>
      <p style="margin-top:10px;color:#777">${description}</p>

}

async function initialize(){
  showLoading("در حال اتصال به سامانه...");

  try{
    const {data,error}=await supabaseClient.auth.getSession();

    if(error)throw error;

    const session=data.session;

    if(!session){
      landing();
      return;
    }

    currentUser=session.user;

    const {data:admin}=await supabaseClient
      .from("admins")
      .select("*")
      .or(`user_id.eq.${currentUser.id},auth_user_id.eq.${currentUser.id}`)
      .maybeSingle();

    if(admin){
      isAdmin=true;
      currentPage="admin";
      renderAdmin();
      await refreshAdminStudents();
      return;
    }

    const {data:student}=await supabaseClient
      .from("students")
      .select("*")
      .eq("auth_user_id",currentUser.id)
      .maybeSingle();

    if(student && student.status==="registered"){
      currentStudent=student;
      isAdmin=false;
      currentPage="home";
      render();
      return;
    }

    await supabaseClient.auth.signOut();
    currentUser=null;
    currentStudent=null;
    landing();

  }catch(error){
    console.error(error);
    landing();

    setTimeout(()=>{
      toast("اتصال به سامانه برقرار نشد. تنظیمات Supabase را بررسی کنید.");
    },300);
  }finally{
    hideLoading();
  }
}

supabaseClient.auth.onAuthStateChange(async(event,session)=>{
  if(event==="SIGNED_OUT"){
    currentUser=null;
    currentStudent=null;
    isAdmin=false;
  }
});

/* =========================================================
   START
========================================================= */
initialize();
</script>
