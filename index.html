function placementQuizRender(id){ 
  const q=S.quiz.questions[S.quiz.i]; 
  if(!q){placementFinish();return} 
  const el=document.getElementById(id);if(!el)return; 
  el.innerHTML=`<div class="card"><b style="color:var(--primary)">سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b><div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div><div style="font-size:18px;font-weight:700;line-height:2;margin:18px 0;color:var(--primary-dark)">${esc(q.q)}</div>${q.options.map((x,i)=>`<button class="option" onclick="placementAnswerFinal(${i})">${esc(x)}</button>`).join("")}<div id="fb"></div></div>`; 
}
async function placementAnswerFinal(i){ 
  const q=S.quiz.questions[S.quiz.i]; 
  const opts=document.querySelectorAll(".option"); 
  opts.forEach(x=>x.disabled=true); 
  const isCorrect=(i===q.answer); 
  if(isCorrect){S.quiz.correct++;S.quiz.levelScores[q.level]=(S.quiz.levelScores[q.level]||0)+1;opts[i].classList.add("correct");} 
  else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");} 
  setTimeout(async()=>{ 
    S.quiz.i++; 
    if(S.quiz.i>=S.quiz.questions.length) await placementFinish(); 
    else placementQuizRender("placementQuiz"); 
  },700); 
}
async function placementFinish(){ 
  const scores=S.quiz.levelScores; 
  const total=S.quiz.correct; 
  let level="A1"; 
  const order=["A1","A2","B1","B2","C1","C2"]; 
  for(const lv of order){ if((scores[lv]||0)>=3) level=lv; } 
  if(total<=3) level="A1"; 
  const descriptions={A1:"مبتدی",A2:"پیش‌متوسط",B1:"متوسط",B2:"متوسط بالا",C1:"پیشرفته",C2:"فوق‌پیشرفته 🏆"}; 
  const kind=S.quiz.kind; 
  const title=kind==="grammar"?"گرامر":"واژگان"; 
  if(S.student){ 
    try{await db.from("exam_results").insert({user_id:S.student.auth_user_id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,exam_type:"placement-"+kind,exam_title:"تعیین سطح "+title,score:total,total:S.quiz.questions.length,percentage:Math.round(total/S.quiz.questions.length*100)});}
    catch(e){} 
  } 
  const el=document.getElementById("placementQuiz"); 
  if(el) el.innerHTML=`<div class="card levelCard"><div style="font-size:13px;font-weight:800;opacity:.9">سطح ${title} شما</div><div class="lvl">${level}</div><p style="font-weight:700;margin:10px 0">${descriptions[level]}</p><p class="muted">✅ ${total} پاسخ درست از ${S.quiz.questions.length}</p></div><button class="btn full" onclick="home()">بازگشت</button>`; 
}

  el.innerHTML=`<div class="card"><b style="color:var(--primary)">سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b><div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div><div style="font-size:18px;font-weight:700;line-height:2;margin:18px 0;color:var(--primary-dark)">${esc(q.q)}</div>${q.options.map((x,i)=>`<button class="option" onclick="answer(${i},'${id}')">${esc(x)}</button>`).join("")}<div id="fb"></div></div>`;

function answer(i,id){ 
  const q=S.quiz.questions[S.quiz.i]; 
  const opts=document.querySelectorAll(".option"); 
  opts.forEach(x=>x.disabled=true); 
  if(i===q.answer){S.quiz.correct++;opts[i].classList.add("correct");} 
  else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");} 
  setTimeout(()=>{S.quiz.i++;quizRender(id)},700); 
}
async function quizFinish(id){

  if(S.student){

  el.innerHTML=`<div class="card resultBox"><div class="score">${percent}%</div><h2 style="text-align:center">آزمون تمام شد 🎉</h2><p style="text-align:center">${S.quiz.correct} پاسخ درست از ${total}</p><button class="btn full" onclick="profile()">مشاهده پیشرفت</button><button class="btn secondary full" style="margin-top:8px" onclick="home()">بازگشت</button></div>`;

function makeLessonQuestions(){ 
  const gradeNum=S.grade; 
  const no=S.lesson+1; 
  const wl=getWords(gradeNum,no); 
  const gl=getGrammar(gradeNum,no); 
  const arr=[]; 
  wl.forEach(function(w,i){ 
    const pool=shuffle(wl.filter(function(_,j){return j!==i}).map(function(x){return x[1]})).slice(0,3); 
    if(pool.length<3)return; 
    const opts=shuffle([w[1]].concat(pool)); 
    arr.push({q:'معنی «'+w[0]+'» چیست؟',options:opts,answer:opts.indexOf(w[1])}); 
  }); 
  return shuffle(arr).slice(0,10); 
}

function getAllDictionaryWords(){
  const allWords = [];
  const gradeLessonMap = { 7:[1,2,3,4,5,6,7,8], 8:[1,2,3,4,5,6,7], 9:[1,2,3,4,5,6], 10:[1,2,3,4], 11:[1,2,3], 12:[1,2,3] };
  for(const g of Object.keys(gradeLessonMap)){
    const gradeNum = Number(g);
    for(const ln of gradeLessonMap[g]){
      const key = getWordKey(gradeNum, ln);
      const wl = (key!==null && words[key]) ? words[key] : [];
      wl.forEach(w => { if(w && w[0] && w[1]){ allWords.push({en:String(w[0]), fa:String(w[1]), grade:gradeNum, lesson:ln}); } });
    }
  }
  return allWords;
}

function dictFilter(g){
  dictCurrentFilter = (g==="all")?"all":Number(g);
  document.querySelectorAll(".dictFilter").forEach(b=>{
    const txt = b.textContent;
    if(dictCurrentFilter==="all") b.classList.toggle("active", txt.includes("همه"));
    else b.classList.toggle("active", txt.includes("پایه "+dictCurrentFilter));
  });
  dictRender();

function dictRender(){
  const el = document.getElementById("dictResults"); if(!el) return;
  if(!dictCache) dictCache = getAllDictionaryWords();
  let items = dictCache.slice();
  if(dictCurrentFilter !== "all") items = items.filter(w=>w.grade===dictCurrentFilter);
  if(dictCurrentQuery){ const q = dictCurrentQuery; items = items.filter(w=> w.en.toLowerCase().includes(q) || w.fa.includes(q) ); }
  if(!items.length){ el.innerHTML = `<div class="card dictEmpty"><span class="icon">🔍</span><b>لغتی با این جستجو پیدا نشد</b><p class="muted">سعی کن عبارت دیگری جستجو کنی</p></div>`; return; }

function openUnlockPanel(studentId, studentName){
  const panel = document.getElementById("unlockPanel");

  if(!panel || !content) return;
  panel.style.display = "block";
  let html = `<p class="muted">مدیریت دسترسی دروس برای <b>${esc(studentName)}</b></p>`;
  for(let g=7; g<=12; g++){
    html += `<h4 style="margin-top:16px;color:var(--primary)">پایه ${g} — ${esc(books[g].title)}</h4>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">`;
    books[g].lessons.forEach((lesson, i)=>{
      html += `<button class="btn ${i===0?'success':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="toggleUnlock(${studentId},${g},${i})">${i===0?'✅':'🔓'} درس ${i+1}</button>`;

  }
  content.innerHTML = html;
  panel.scrollIntoView({behavior:"smooth"});

async function toggleUnlock(studentId, grade, lessonIndex){
  try{
    const key = `${grade}-${lessonIndex}`;
    const existing = await db.from("lesson_unlocks").select("*").eq("student_id",studentId).eq("grade",grade).eq("lesson_index",lessonIndex).maybeSingle();
    if(existing.data){
      await db.from("lesson_unlocks").delete().eq("id", existing.data.id);
      toast("🔒 قفل بسته شد","info");
    } else {
      await db.from("lesson_unlocks").insert({student_id:studentId,grade,lesson_index:lessonIndex,package:"admin",unlocked_at:new Date().toISOString()});
      toast("🔓 قفل باز شد","success");
    }
    admin();
  }catch(e){toast("خطا: "+e.message,"error")}
}

async function replyQuestion(id){ 
  const txt=document.getElementById("qr"+id).value.trim(); 
  if(!txt){toast("پاسخ را وارد کنید","error");return} 
  try{ 
    await db.from("student_questions").update({teacher_reply:txt,replied_at:new Date().toISOString(),student_read:false}).eq("id",id); 
    toast("پاسخ ارسال شد ✅","success"); 
    admin(); 
  }catch(e){toast("خطا: "+e.message,"error")} 
}

function editReply(id, currentReply){
  const textarea = document.getElementById("qr"+id);
  if(textarea){ textarea.value = currentReply; return; }
  const adminRows = document.querySelectorAll(".adminRow");
  adminRows.forEach(row=>{
    if(row.innerHTML.includes("✅ پاسخ") && row.innerHTML.includes(currentReply.substring(0,20))){
      const editArea = document.createElement("textarea");
      editArea.id = "qr"+id;
      editArea.value = currentReply;
      editArea.style.minHeight = "80px";
      const btn = document.createElement("button");
      btn.className = "btn success";
      btn.style.marginTop = "8px";
      btn.textContent = "📨 به‌روزرسانی";
      btn.onclick = ()=>updateReply(id);
      row.appendChild(editArea);
      row.appendChild(btn);
    }
  });
}

async function updateReply(id){
  const txt = document.getElementById("qr"+id).value.trim();
  if(!txt){toast("پاسخ را وارد کنید","error");return}
  try{
    await db.from("student_questions").update({teacher_reply:txt,replied_at:new Date().toISOString(),student_read:false}).eq("id",id);
    toast("پاسخ به‌روزرسانی شد ✅","success");
    admin();
  }catch(e){toast("خطا: "+e.message,"error")}
}

async function gradeHomework(id){
  const grade = document.getElementById("hg"+id).value;
  if(grade==="" || grade===null || isNaN(grade)){toast("نمره معتبر وارد کنید","error");return}
  const g = Number(grade);
  if(g<0 || g>20){toast("نمره باید بین ۰ تا ۲۰ باشد","error");return}
  try{
    await db.from("student_homeworks").update({grade:g,graded_at:new Date().toISOString()}).eq("id",id);
    toast("نمره ثبت شد ✅","success");
    admin();
  }catch(e){toast("خطا: "+e.message,"error")}
}

async function rejectStudent(id){try{await db.from("students").update({status:"rejected"}).eq("id",id);toast("رد شد","success");admin()}catch(e){}}

/* ==================== Logout ==================== */
async function logout(){ 
  try{await db.auth.signOut()}catch(e){} 
  S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],exams:[],unlocks:{},streak:0,lastVisit:null,qas:[],homeworks:[],gameRecords:{},currentGame:null}; 
  landing(); 
}

/* ==================== Startup ==================== */
async function startup(){ 
  try{ 
    const r=await db.auth.getSession(); 
    const session=r.data?.session; 
    const sp=document.getElementById("splash"); 
    const hideSplash=()=>{if(sp)sp.style.display="none"}; 
    if(!session){setTimeout(()=>{hideSplash();landing()},1500);return} 
    const user=session.user; 
    if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){S.admin=true;setTimeout(()=>{hideSplash();admin()},1500);return} 
    const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle(); 
    if(st.data&&["registered","approved"].includes(st.data.status)){ 
      S.student=st.data; 
      await loadStudentStats(); 
      await loadUnlocks(); 
      loadStreak();loadGameRecords(); 
      await loadQAs(); 
      await loadHomeworks(); 
      setTimeout(()=>{hideSplash();home()},1500); 
      return; 
    } 
    await db.auth.signOut(); 
    setTimeout(()=>{hideSplash();landing()},1500); 
  }catch(e){ 
    try{await db.auth.signOut()}catch(_){} 
    setTimeout(()=>{ 
      const sp=document.getElementById("splash");
      if(sp)sp.style.display="none";
      landing();
    },1500); 
  } 
}

db.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT"&&!S.admin&&!S.student)landing();
});

/* ==================== Service Worker ==================== */
if("serviceWorker" in navigator){ 
  window.addEventListener("load",()=>{ 
    const swCode=`self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});self.addEventListener("fetch",e=>{});`; 
    try{ 
      const blob=new Blob([swCode],{type:"application/javascript"}); 
      const url=URL.createObjectURL(blob); 
      navigator.serviceWorker.register(url).catch(()=>{}); 
    }catch(e){} 
  }); 
}

/* ==================== شروع ==================== */
startup();
