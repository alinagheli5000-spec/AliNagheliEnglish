function gameStart(){
 if(S.currentGame.timer) clearInterval(S.currentGame.timer);
 S.currentGame.score=0;S.currentGame.time=60;S.currentGame.started=true;
 const el=document.getElementById("gameArea"); if(!el) return;
 el.innerHTML=`<div id="gameContent"></div>`;
 gameNext();
 S.currentGame.timer=setInterval(()=>{
  S.currentGame.time--;
  const tEl=document.getElementById("gameTime"); const barEl=document.getElementById("gameTimerBar");
  if(tEl) tEl.textContent=S.currentGame.time; if(barEl) barEl.style.width=((S.currentGame.time/60)*100)+"%";

 },1000);
}

async function gameEnd(){
 if(!S.currentGame||!S.currentGame.started) return;
 S.currentGame.started=false;
 if(S.currentGame.timer){clearInterval(S.currentGame.timer);S.currentGame.timer=null;}
 const isNewRecord=saveGameRecord(S.currentGame.id,S.currentGame.score);

}

function getAllDictionaryWords(){
 const allWords = [];
 for(let g=7; g<=12; g++){
  const lessonCount = books[g].lessons.length;
  for(let li=0; li<lessonCount; li++){
   const wl = getWords(g, li+1);
   wl.forEach(w => {
    allWords.push({en:w[0], fa:w[1], grade:g, lesson:li+1});
   });
  }
 }
 return allWords;
}
let dictCache = null;
let dictCurrentFilter = "all";
let dictCurrentQuery = "";

function dictionaryPage(){
 if(!dictCache) dictCache = getAllDictionaryWords();
 const total = dictCache.length;
 const gradeCount = {};
 dictCache.forEach(w=>{gradeCount[w.grade]=(gradeCount[w.grade]||0)+1});
 render("دیکشنری لغات",`
  <div class="card">
    <button class="btn secondary" onclick="home()">← بازگشت</button>
    <h2 style="margin-top:14px;display:flex;align-items:center;gap:10px">
      <span style="font-size:28px">📖</span>
      <span>دیکشنری کامل لغات</span>
    </h2>
    <p class="muted">لغات تمام دروس پایه ۷ تا ۱۲ — با جستجو، فیلتر پایه و تلفظ صوتی</p>
    <div class="dictStats">
      <div class="dictStat">📚 <b>${total}</b> کلمه</div>
      <div class="dictStat">🎓 ۶ پایه</div>
      <div class="dictStat">🔊 تلفظ صوتی</div>
    </div>
  </div>
  <div class="dictSearchBox">
    <input class="dictSearchInput" id="dictQuery" placeholder="🔍 جستجو در لغات... (فارسی یا انگلیسی)" oninput="dictSearch(this.value)">
    <div class="dictFilters">
      <button class="dictFilter ${dictCurrentFilter==='all'?'active':''}" onclick="dictFilter('all')">همه (${total})</button>
      ${[7,8,9,10,11,12].map(g=>`<button class="dictFilter ${dictCurrentFilter==g?'active':''}" onclick="dictFilter(${g})">پایه ${g} (${gradeCount[g]||0})</button>`).join("")}
    </div>
  </div>
  <div id="dictResults"></div>
 `);
 dictRender();
}
function dictSearch(q){ dictCurrentQuery = String(q||"").trim().toLowerCase(); dictRender(); }
function dictFilter(g){ dictCurrentFilter = g; dictionaryPage(); }
function dictRender(){
 const el = document.getElementById("dictResults"); if(!el) return;
 let items = dictCache.slice();
 if(dictCurrentFilter !== "all") items = items.filter(w=>w.grade===dictCurrentFilter);
 if(dictCurrentQuery){ items = items.filter(w=> w.en.toLowerCase().includes(dictCurrentQuery) || w.fa.includes(dictCurrentQuery) ); }
 if(!items.length){ el.innerHTML = `<div class="card dictEmpty"><span class="icon">🔍</span><b>لغتی با این جستجو پیدا نشد</b><p class="muted">سعی کن عبارت دیگری جستجو کنی</p></div>`; return; }
 el.innerHTML = `<div class="card"><b style="color:var(--primary)">${items.length} کلمه پیدا شد</b><div class="dictGrid" style="margin-top:14px">${items.slice(0,300).map(w=>`<div class="dictCard" onclick='speak(${JSON.stringify(w.en)})'><div class="dictGrade">پایه ${w.grade} · درس ${w.lesson}</div><div class="dictEn">🔊 ${esc(w.en)}</div><div class="dictFa">${esc(w.fa)}</div></div>`).join("")}</div></div>`;

function makeLessonQuestions(){
 const gradeNum=S.grade; const no=S.lesson+1; const wl=getWords(gradeNum,no); const gl=getGrammar(gradeNum,no); const arr=[];
 wl.forEach(function(w,i){ const pool=shuffle(wl.filter(function(_,j){return j!==i}).map(function(x){return x[1]})).slice(0,3); if(pool.length<3)return; const opts=shuffle([w[1]].concat(pool)); arr.push({q:'معنی «'+w[0]+'» چیست؟',options:opts,answer:opts.indexOf(w[1])}); });
 gl.forEach(function(g){ const wrongs=["She are a student.","They is happy.","He am a teacher.","I is a doctor.","We is here."]; const opts=shuffle([g[1],...shuffle(wrongs).slice(0,3)]); arr.push({q:'کدام جمله با مبحث «'+g[0]+'» درست است؟',options:opts,answer:opts.indexOf(g[1])}); });
 let allWords=[]; for(let ln=1;ln<=(books[gradeNum]?books[gradeNum].lessons.length:0);ln++){getWords(gradeNum,ln).forEach(function(w){allWords.push(w)});}
 while(arr.length<12&&allWords.length>3){ const w=allWords[Math.floor(Math.random()*allWords.length)]; const pool=shuffle(allWords.filter(x=>x[1]!==w[1]).map(x=>x[1])).slice(0,3); if(pool.length<3)break; const opts=shuffle([w[1],...pool]); arr.push({q:'معنی «'+w[0]+'» چیست؟',options:opts,answer:opts.indexOf(w[1])}); }
 return shuffle(arr).slice(0,15);
}

function finalExams(){ render("آزمون نهایی",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2 style="margin-top:14px">📄 آزمون نهایی</h2><p class="muted">سوالات ترکیبی از لغات و گرامر کل کتاب — از سوالات سال‌های گذشته</p><div class="grid">${[10,11,12].map(g=>`<div class="item" onclick="startFinalExam(${g})"><div class="neonIcon red">${ICONS.exam}</div><h3>آزمون نهایی پایه ${g}</h3><p class="muted">${finalExamBank[g].length} سؤال با تاریخ</p><button class="btn full">شروع آزمون</button></div>`).join("")}</div></div>`); }
function startFinalExam(g){ const qs=finalExamBank[g].map(x=>{ const options=shuffle(x.o.slice()); return {q:x.q,options,answer:options.indexOf(x.o[x.a]),date:x.date||""}; }); S.quiz={type:"final",title:"آزمون نهایی پایه "+g,grade:g,questions:qs,i:0,correct:0,wrong:0}; render("آزمون نهایی پایه "+g,`<div id="finalQuiz"></div>`); finalQuizRender("finalQuiz"); }
function finalQuizRender(id){ const q=S.quiz.questions[S.quiz.i]; if(!q){quizFinish(id);return} const el=document.getElementById(id);if(!el)return; const dateTag=q.date?`<span class="examDate">(${esc(q.date)})</span>`:""; el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(--primary)">سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>${dateTag}</div><div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div><div style="font-size:18px;font-weight:700;line-height:2;margin:18px 0;color:var(--primary-dark)">${esc(q.q)}</div>${q.options.map((x,i)=>`<button class="option" onclick="finalAnswer(${i},'${id}')">${esc(x)}</button>`).join("")}<div id="fb"></div></div>`; }
function finalAnswer(i,id){ const q=S.quiz.questions[S.quiz.i]; const opts=document.querySelectorAll(".option"); opts.forEach(x=>x.disabled=true); if(i===q.answer){S.quiz.correct++;opts[i].classList.add("correct");const fb=document.getElementById("fb");if(fb){fb.className="feedback ok";fb.innerHTML="✅ 😊 آفرین! پاسخ درست است."}} else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");const fb=document.getElementById("fb");if(fb){fb.className="feedback bad";fb.innerHTML="❌ پاسخ اشتباه است."}} setTimeout(()=>{S.quiz.i++;finalQuizRender(id)},700); }

async function loadQAs(){ if(!S.student)return; try{ const r=await db.from("student_questions").select("*").eq("student_id",S.student.id).order("created_at",{ascending:false}); S.qas=r.data||[]; }catch(e){S.qas=[]} }
async function loadHomeworks(){ if(!S.student)return; try{ const r=await db.from("student_homeworks").select("*").eq("student_id",S.student.id).order("created_at",{ascending:false}); S.homeworks=r.data||[]; }catch(e){S.homeworks=[]} }

async function submitQuestion(){ const teacher_id=document.getElementById("qTeacher").value; const subject=document.getElementById("qSubject").value.trim(); const question=document.getElementById("qBody").value.trim(); if(!subject||!question){toast("موضوع و متن سؤال رو پر کن","error");return} try{ const r=await db.from("student_questions").insert({student_id:S.student.id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,student_phone:S.student.phone,teacher_id,subject,question,student_read:true}); if(r.error)throw r.error; toast("سؤالت برای استاد ارسال شد ✅","success"); await loadQAs(); qaPage(); }catch(e){toast("ارسال انجام نشد: "+e.message,"error")} }
async function openThread(id){
 const q=S.qas.find(x=>x.id===id); if(!q)return;
 const teacher=getTeacher(q.teacher_id);
 render("گفت‌وگو با استاد",`<div class="card"><button class="btn secondary" onclick="qaPage()">← بازگشت</button><h2 style="margin-top:14px">${esc(q.subject)}</h2><p class="muted">👨‍🏫 ${esc(teacher.name)} · ${q.created_at?new Date(q.created_at).toLocaleDateString("fa-IR"):""}</p><div style="margin:20px 0"><div class="qaMsg student"><div class="meta">👤 شما</div><div class="body">${esc(q.question)}</div></div>${q.teacher_reply?`<div class="qaMsg teacher"><div class="meta">👨‍🏫 ${esc(teacher.name)}</div><div class="body">${esc(q.teacher_reply)}</div></div>`:`<p class="muted" style="text-align:center">⏳ در انتظار پاسخ استاد...</p>`}</div>${!q.teacher_reply?`<label>پاسخ تکمیلی (اختیاری)</label><textarea id="qFollow" placeholder="اگر توضیح بیشتری داری بنویس..."></textarea><button class="btn full" onclick="followUp('${id}')">📨 ارسال</button>`:""}</div>`);
 if(q.teacher_reply&&!q.student_read){ try{await db.from("student_questions").update({student_read:true}).eq("id",id);}catch(e){} }
}
async function followUp(id){ const txt=document.getElementById("qFollow").value.trim(); if(!txt){toast("متن رو بنویس","error");return} try{ const q=S.qas.find(x=>x.id===id); const newQ=(q.question||"")+"\n\n[ادامه] "+txt; await db.from("student_questions").update({question:newQ,teacher_reply:null}).eq("id",id); toast("ارسال شد ✅","success"); await loadQAs(); qaPage(); }catch(e){toast("خطا: "+e.message,"error")} }

function initPersianCalendar(teacherIndex){ const today=getTodayJalali(); window["_pcal_"+teacherIndex]={jy:today[0],jm:today[1],selected:null}; renderPersianCalendar(teacherIndex); renderPersianTimes(teacherIndex); }
function renderPersianCalendar(teacherIndex){
 const st=window["_pcal_"+teacherIndex]; const el=document.getElementById("pcal-"+teacherIndex); if(!el) return;
 const daysInMonth=getJalaliMonthDays(st.jy,st.jm);
 const [gy,gm,gd]=jalaliToGregorian(st.jy,st.jm,1); const gDate=new Date(gy,gm-1,gd); const firstWeekDay=(gDate.getDay()+1)%7;
 let grid=""; for(let i=0;i<firstWeekDay;i++) grid+=`<div class="pcalDay empty"></div>`;
 for(let d=1;d<=daysInMonth;d++){
  const isSelected=st.selected && st.selected.jy===st.jy && st.selected.jm===st.jm && st.selected.jd===d;
  const todayJ=getTodayJalali(); const isToday=todayJ[0]===st.jy && todayJ[1]===st.jm && todayJ[2]===d;
  grid+=`<div class="pcalDay ${isSelected?'selected':''} ${isToday?'today':''}" onclick="selectPersianDay(${teacherIndex},${d})">${d}</div>`;
 }
 el.innerHTML=`<div class="pcal"><div class="pcalHeader"><button class="pcalNav" onclick="pcalPrev(${teacherIndex})">‹</button><span>${JALALI_MONTHS[st.jm-1]} ${st.jy}</span><button class="pcalNav" onclick="pcalNext(${teacherIndex})">›</button></div><div class="pcalGrid">${JALALI_WEEK.map(d=>`<div class="pcalDayName">${d}</div>`).join("")}${grid}</div></div>`;
}
function renderPersianTimes(teacherIndex){
 const st=window["_pcal_"+teacherIndex]; const el=document.getElementById("ptime-"+teacherIndex); if(!el) return;
 if(!st.selected){el.innerHTML=`<p class="muted" style="text-align:center">ابتدا یک روز را انتخاب کنید</p>`;return}
 const times=["۰۹:۰۰","۱۰:۰۰","۱۱:۰۰","۱۴:۰۰","۱۵:۰۰","۱۶:۰۰","۱۷:۰۰","۱۸:۰۰","۱۹:۰۰","۲۰:۰۰"];
 el.innerHTML=`<label>ساعت مورد نظر</label><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-top:8px">${times.map(t=>`<button class="btn secondary" style="padding:10px;font-size:13px" onclick="selectPersianTime(${teacherIndex},'${t}')">${t}</button>`).join("")}</div><p class="muted" style="margin-top:10px">تاریخ انتخاب‌شده: <b>${st.selected.jd} ${JALALI_MONTHS[st.selected.jm-1]} ${st.selected.jy}</b>${st.time?` — ساعت <b>${st.time}</b>`:""}</p>`;
}
function selectPersianDay(teacherIndex,d){ const st=window["_pcal_"+teacherIndex]; st.selected={jy:st.jy,jm:st.jm,jd:d}; st.time=null; renderPersianCalendar(teacherIndex); renderPersianTimes(teacherIndex); }
function selectPersianTime(teacherIndex,t){ const st=window["_pcal_"+teacherIndex]; st.time=t; renderPersianTimes(teacherIndex); }
function pcalPrev(teacherIndex){ const st=window["_pcal_"+teacherIndex]; st.jm--; if(st.jm<1){st.jm=12;st.jy--;} st.selected=null;st.time=null; renderPersianCalendar(teacherIndex); renderPersianTimes(teacherIndex); }
function pcalNext(teacherIndex){ const st=window["_pcal_"+teacherIndex]; st.jm++; if(st.jm>12){st.jm=1;st.jy++;} st.selected=null;st.time=null; renderPersianCalendar(teacherIndex); renderPersianTimes(teacherIndex); }
function askFromTeacher(teacherId){ if(!S.student){toast("ابتدا وارد شوید","error");return} render("پرسش از استاد",`<div class="card"><button class="btn secondary" onclick="teachers()">← بازگشت</button><h2 style="margin-top:14px">💬 پرسش از ${esc(getTeacher(teacherId).name)}</h2><label>موضوع</label><input id="qSubject" placeholder="مثال: سؤال در مورد گرامر"><label>سؤال</label><textarea id="qBody" placeholder="سؤالت رو بنویس..."></textarea><button class="btn full" style="margin-top:14px" onclick="submitQuestionTo('${teacherId}')">📨 ارسال</button></div>`); }
async function submitQuestionTo(teacher_id){ const subject=document.getElementById("qSubject").value.trim(); const question=document.getElementById("qBody").value.trim(); if(!subject||!question){toast("همه موارد رو پر کن","error");return} try{ const r=await db.from("student_questions").insert({student_id:S.student.id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,student_phone:S.student.phone,teacher_id,subject,question,student_read:true}); if(r.error)throw r.error; toast("سؤالت ارسال شد ✅","success"); await loadQAs(); qaPage(); }catch(e){toast("خطا: "+e.message,"error")} }
async function requestTeacher(i){
 if(!S.student){toast("ابتدا وارد شوید","error");return}
 const st=window["_pcal_"+i];
 if(!st || !st.selected || !st.time){toast("لطفاً تاریخ و ساعت را انتخاب کنید","error");return}
 const persianDateFull=`${st.selected.jd} ${JALALI_MONTHS[st.selected.jm-1]} ${st.selected.jy}`;
 const type=document.getElementById("ttype"+i).value; const note=document.getElementById("tn"+i).value.trim();
 try{ const r=await db.from("teacher_requests").insert({student_id:S.student.id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,student_phone:S.student.phone,teacher_name:teachersData[i].name,requested_date:persianDateFull,requested_time:st.time,class_type:type,note,status:"pending"}); if(r.error)throw r.error; toast("درخواست رزرو ارسال شد ✅ — "+persianDateFull+" ساعت "+st.time,"success",5000); }catch(e){toast("ارسال انجام نشد: "+e.message,"error")}
}

 await loadStudentStats();

/* ==================== Admin ==================== */
async function admin(){
 try{
  const r=await db.from("students").select("*").order("id",{ascending:false});
  const req=await db.from("teacher_requests").select("*").order("created_at",{ascending:false});
  const qs=await db.from("student_questions").select("*").order("created_at",{ascending:false});
  const hw=await db.from("student_homeworks").select("*").order("created_at",{ascending:false});
  renderAdmin(r.data||[],req.data||[],qs.data||[],hw.data||[]);
 }catch(e){ document.body.innerHTML=`<div class="container"><div class="card"><h2>خطا در پنل مدیر</h2><p>${esc(e.message)}</p><button class="btn" onclick="admin()">تلاش مجدد</button></div></div><div class="toast-wrap" id="toastWrap"></div>`; }
}
function renderAdmin(students,requests,questions,homeworks){
 const pendingQ=questions.filter(q=>!q.teacher_reply);
 const pendingHw=homeworks.filter(h=>h.grade==null);
 document.body.innerHTML=`${header("پنل مدیریت")}<main class="container">
  <div class="hero"><h2 style="margin-top:0">👨‍💼 پنل مدیریت</h2><p>مدیریت کامل سامانه</p></div>
  <div class="grid">
    <div class="item"><div class="neonIcon purple">${ICONS.user}</div><h3>زبان‌آموزان</h3><b style="font-size:26px;color:var(--primary)">${students.length}</b></div>
    <div class="item"><div class="neonIcon orange">${ICONS.star}</div><h3>در انتظار</h3><b style="font-size:26px;color:var(--warning)">${students.filter(x=>x.status==="waiting").length}</b></div>
    <div class="item"><div class="neonIcon blue">${ICONS.teacher}</div><h3>سؤالات باز</h3><b style="font-size:26px;color:var(--info)">${pendingQ.length}</b></div>
    <div class="item"><div class="neonIcon red">${ICONS.homework}</div><h3>تکالیف نمره‌نداده</h3><b style="font-size:26px;color:var(--danger)">${pendingHw.length}</b></div>
  </div>
  <div class="card"><h3 style="margin-top:0">💬 سؤالات دانش‌آموزان</h3>${questions.length?questions.map(q=>{const t=getTeacher(q.teacher_id);return `<div class="adminRow"><b>${esc(q.student_name||"")} → ${esc(t.name)}</b><div class="muted">📱 ${esc(q.student_phone||"")}<br>📌 ${esc(q.subject||"")}<br>❓ ${esc(q.question||"")}</div>${q.teacher_reply?`<div style="margin-top:10px;background:var(--bg-grad-1);padding:10px;border-radius:12px"><b>✅ پاسخ استاد:</b><br>${esc(q.teacher_reply)}</div>`:`<label>پاسخ شما:</label><textarea id="qr${q.id}" placeholder="پاسخ خود را بنویسید..."></textarea><button class="btn success" style="margin-top:8px" onclick="replyQuestion('${q.id}')">📨 ارسال پاسخ</button>`}</div>`}).join(""):`<p class="muted">سؤالی وجود ندارد.</p>`}</div>
  <div class="card"><h3 style="margin-top:0">📝 تکالیف دانش‌آموزان</h3>${homeworks.length?homeworks.map(h=>{const t=getTeacher(h.teacher_id);return `<div class="adminRow"><b>${esc(h.student_name||"")} → ${esc(t.name)}</b><div class="muted">📌 ${esc(h.title||"")}<br>📄 ${esc(h.description||"")}${h.link?`<br>🔗 <a href="${esc(h.link)}" target="_blank">${esc(h.link)}</a>`:""}</div>${h.grade!=null?`<div style="margin-top:10px;background:var(--bg-grad-1);padding:10px;border-radius:12px"><b>نمره: ${h.grade}/20</b>${h.teacher_feedback?`<br>${esc(h.teacher_feedback)}`:""}</div>`:`<label>نمره (۰ تا ۲۰):</label><input id="hg${h.id}" type="number" min="0" max="20" step="0.25" placeholder="18.5"><label>بازخورد:</label><textarea id="hf${h.id}" placeholder="نظر خود را بنویسید..."></textarea><button class="btn success" style="margin-top:8px" onclick="gradeHomework('${h.id}')">✅ ثبت نمره</button>`}</div>`}).join(""):`<p class="muted">تکلیفی وجود ندارد.</p>`}</div>
  <div class="card"><h3 style="margin-top:0">📅 درخواست‌های رزرو کلاس</h3>${requests.length?requests.map(x=>`<div class="adminRow"><b>${esc(x.student_name||"")}</b><div class="muted">📱 ${esc(x.student_phone||"")}<br>👨‍🏫 ${esc(x.teacher_name||"")}<br>📅 ${esc(x.requested_date||"")} ⏰ ${esc(x.requested_time||"")}<br>📘 ${esc(x.class_type||"")}</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${x.status==="pending"?`<button class="btn success" onclick="respondRequest('${x.id}','approved')">✅ تأیید</button><button class="btn danger" onclick="respondRequest('${x.id}','rejected')">❌ رد</button>`:`<b>${x.status==="approved"?"✅ تأیید شده":"❌ رد شده"}</b>`}</div></div>`).join(""):`<p class="muted">درخواستی وجود ندارد.</p>`}</div>
  <div class="card"><h3 style="margin-top:0">👥 ثبت‌نام‌ها</h3>${students.length?students.map(x=>`<div class="adminRow"><b>${esc(x.first_name)} ${esc(x.last_name)}</b><div class="muted">📱 ${esc(x.phone||"")}<br>🎓 پایه: ${esc(x.level||"-")}</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${x.status==="waiting"?`<button class="btn success" onclick="approve('${x.id}')">✅ تأیید</button><button class="btn danger" onclick="rejectStudent('${x.id}')">❌ رد</button>`:x.status==="registered"||x.status==="approved"?`<span style="color:var(--success);font-weight:700">✅ تأیید شده</span><button class="btn danger" onclick="rejectStudent('${x.id}')">رد / حذف</button>`:`<span style="color:var(--danger);font-weight:700">❌ رد شده</span><button class="btn success" onclick="approve('${x.id}')">تأیید مجدد</button>`}</div></div>`).join(""):`<p class="muted">ثبت‌نامی وجود ندارد.</p>`}</div>
  <div class="card"><h3 style="margin-top:0">🔓 مدیریت قفل دروس</h3><label>انتخاب زبان‌آموز</label><select id="adminStudentSelect" onchange="adminLoadUnlocks(this.value)"><option value="">-- انتخاب کنید --</option>${students.map(s=>`<option value="${s.id}">${esc(s.first_name||"")} ${esc(s.last_name||"")} — ${esc(s.phone||"")}</option>`).join("")}</select><div id="adminUnlockArea" style="margin-top:14px"></div></div>
  <button class="btn secondary full" onclick="logout()">خروج</button>
 </main><div class="toast-wrap" id="toastWrap"></div><a class="floatWhats" href="https://wa.me/989141892768" target="_blank">💬</a>`;
}
async function replyQuestion(id){ const txt=document.getElementById("qr"+id).value.trim(); if(!txt){toast("پاسخ رو بنویس","error");return} try{ await db.from("student_questions").update({teacher_reply:txt,replied_at:new Date().toISOString(),student_read:false}).eq("id",id); toast("پاسخ ارسال شد ✅","success"); admin(); }catch(e){toast("خطا: "+e.message,"error")} }
async function gradeHomework(id){ const grade=parseFloat(document.getElementById("hg"+id).value); const fb=document.getElementById("hf"+id).value.trim(); if(isNaN(grade)||grade<0||grade>20){toast("نمره بین ۰ تا ۲۰","error");return} try{ await db.from("student_homeworks").update({grade,teacher_feedback:fb||null,graded_at:new Date().toISOString()}).eq("id",id); toast("نمره ثبت شد ✅","success"); admin(); }catch(e){toast("خطا: "+e.message,"error")} }
async function adminLoadUnlocks(studentId){
 const area=document.getElementById("adminUnlockArea"); if(!area)return;
 if(!studentId){area.innerHTML="";return}
 let unlocked={};
 try{ const r=await db.from("lesson_unlocks").select("grade,lesson_index").eq("student_id",studentId); (r.data||[]).forEach(x=>{unlocked[`${x.grade}-${x.lesson_index}`]=true}); }catch(e){}
 let html="";
 for(let g=7;g<=12;g++){
  html+=`<h4 style="margin:14px 0 6px;color:var(--primary)">پایه ${g}</h4><div style="display:flex;flex-wrap:wrap;gap:6px">`;
  books[g].lessons.forEach((les,i)=>{ const isUn=i===0||unlocked[`${g}-${i}`]; html+=`<button class="btn ${isUn?'success':'secondary'}" style="font-size:11px;padding:8px 10px" onclick="adminToggleUnlock('${studentId}',${g},${i},${!isUn})" title="${esc(les)}">${i+1}. ${isUn?'🔓':'🔒'}</button>`; });
  html+=`</div>`;
 }
 area.innerHTML=html;
}
async function adminToggleUnlock(studentId,grade,lessonIndex,unlock){
 if(lessonIndex===0){toast("درس ۱ همیشه باز است.","warning");return}
 try{ if(unlock){ await db.from("lesson_unlocks").upsert({student_id:studentId,grade:Number(grade),lesson_index:Number(lessonIndex),payment_ref:"admin",unlocked_at:new Date().toISOString()},{onConflict:"student_id,grade,lesson_index"}); } else{ await db.from("lesson_unlocks").delete().eq("student_id",studentId).eq("grade",grade).eq("lesson_index",lessonIndex); } }catch(e){toast("خطا: "+e.message,"error")}
 adminLoadUnlocks(studentId);
}
async function respondRequest(id,status){try{await db.from("teacher_requests").update({status}).eq("id",id);toast("انجام شد","success");admin()}catch(e){toast("خطا: "+e.message,"error")}}
async function approve(id){try{await db.from("students").update({status:"registered"}).eq("id",id);toast("تأیید شد ✅","success");admin()}catch(e){toast("خطا: "+e.message,"error")}}
async function rejectStudent(id){try{await db.from("students").update({status:"rejected"}).eq("id",id);toast("رد شد","success");admin()}catch(e){toast("خطا: "+e.message,"error")}}

/* ==================== Logout ==================== */
async function logout(){
 try{await db.auth.signOut()}catch(e){}
 S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],exams:[],unlocks:{},streak:0,lastVisit:null,qas:[],homeworks:[],gameRecords:{},currentGame:null};
 landing();
}

/* ==================== Startup ==================== */
async function startup(){
 try{
  const r=await db.auth.getSession();
  const session=r.data?.session;
  const sp=document.getElementById("splash");
  const hideSplash=()=>{if(sp)sp.style.display="none"};
  if(!session){setTimeout(()=>{hideSplash();landing()},1500);return}
  const user=session.user;
  if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){S.admin=true;setTimeout(()=>{hideSplash();admin()},1500);return}
  const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle();
  if(st.data&&["registered","approved"].includes(st.data.status)){
   S.student=st.data;
   await loadStudentStats(); await loadUnlocks(); loadStreak();loadGameRecords(); await loadQAs(); await loadHomeworks();
   setTimeout(()=>{hideSplash();home()},1500);
   return;
  }
  await db.auth.signOut();
  setTimeout(()=>{hideSplash();landing()},1500);
 }catch(e){
  try{await db.auth.signOut()}catch(_){}
  setTimeout(()=>{const sp=document.getElementById("splash");if(sp)sp.style.display="none";landing()},1500);
 }
}
db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT"&&!S.admin&&!S.student)landing()});

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  const swCode=`self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});self.addEventListener("fetch",e=>{});`;
  try{ const blob=new Blob([swCode],{type:"application/javascript"}); const url=URL.createObjectURL(blob); navigator.serviceWorker.register(url).catch(()=>{}); }catch(e){}
 });
}

/* ==================== شروع ==================== */
startup();
</script>
