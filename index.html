grammar[9]=[["Verb to be (am/is/are)","I am ... / We are ... / You are ... / He is ... / She is ... / They are ...","من هستم / ما هستیم / تو هستی / او است / او است / آنها هستند","فعل to be برای بیان هویت، ملیت و وضعیت."],["From + کشور","I am from Iran. / She is from France. / They are from China.","من اهل ایران هستم. / او اهل فرانسه است. / آنها اهل چین هستند.","برای بیان ملیت اصلی از from استفاده می‌کنیم."],["منفی کردن","am not / isn't / aren't","نیستم / نیست / نیستند","Is not = isn't / Are not = aren't"],["سوالی کردن","Are they from Spain? / Is he from Iran?","آیا آنها اهل اسپانیا هستند؟ / آیا او اهل ایران است؟","am/is/are را به اول جمله می‌بریم."],["پاسخ کوتاه","Yes, they are. / No, they aren't. / Yes, I am. / No, I'm not.","بله هستند / نه نیستند / بله هستم / نه نیستم","با Yes/No + فاعل + فعل to be"],["Where (کجا)","Where are you from? / Where is she from?","اهل کجا هستی؟ / او اهل کجاست؟","برای پرسیدن محل/کشور."],["نکته ملیت","You are from Brazil. / You are Brazilian.","تو اهل برزیل هستی. / تو برزیلی هستی.","برای بیان ملیت نیازی به from نیست."]];
grammar[10]=[["Present Simple (حال ساده)","Ali takes a shower every day.","علی هر روز دوش می‌گیرد.","برای عادت‌ها، کارهای روزمره و حقایق."],["حقایق طبیعی","Babies cry. / Birds fly.","بچه‌ها گریه می‌کنند. / پرنده‌ها پرواز می‌کنند.","برای بیان حقایق کلی."],["سوالی کردن","Do you ...? / Does she ...?","آیا تو ...؟ / آیا او ...؟","Do برای I/you/we/they و Does برای he/she/it"],["منفی کردن","don't / doesn't","نمی‌کنم / نمی‌کند","He doesn't work for I.R.I.B."],["What do you do...?","What do you do in the mornings?","صبح‌ها چه کار می‌کنی؟","برای پرسیدن فعالیت‌های روزانه."],["When / What days do you...?","When do you go shopping?","چه موقع خرید می‌روی؟","برای پرسیدن زمان انجام کار."],["حرف اضافه زمان","on برای روز / in برای صبح، ظهر، عصر","on Fridays / in the morning","قبل از ایام هفته on، قبل از قسمت‌های روز in"]];
grammar[11]=[["Possessive Adjectives","my / your / his / her / its / our / their","مال من / مال تو / مال او / مال آن / مال ما / مال آنها","صفت ملکی قبل از اسم می‌آید."],["مطابقت ضمیر و صفت ملکی","I → my / you → your / he → his / she → her / it → its / we → our / they → their","—","مثال: I have a bag. My bag is yellow."],["Be good at + ing","I am good at drawing. / He is good at taking photos.","من در نقاشی خوب هستم. / او در عکاسی خوب است.","ساختار: am/is/are + good at + فعل ing"],["Can (توانستن)","I can draw. / He can take photos.","من می‌توانم نقاشی بکشم. / او می‌تواند عکس بگیرد.","ساختار: فاعل + can + فعل ساده"]];
grammar[12]=[["سوال در مورد سلامتی","What's wrong? / What's the matter? / What's the problem?","چه شده است؟ / چه مشکلی پیش آمده؟ / مشکل چیست؟","همه یک معنی دارند."],["Are/Is + اسم/ضمیر + ok/all right?","Are you OK? / Is he all right?","خوبی؟ / حالش خوب است؟","برای احوالپرسی سلامتی."],["پاسخ و توصیه","You should ... / Why don't you ...? / Go to ...","باید ... / چرا ... نمی‌کنی؟ / برو به ...","برای توصیه به مریض."],["تلفظ ch = /k/","school / backache / mechanic / zucchini / stomachache","—","در این کلمات ch صدای /k/ می‌دهد."],["تلفظ ea = /e/","headache / bread / health / sweater / weather","—","در این کلمات ea صدای /e/ کوتاه می‌دهد."]];
grammar[13]=[["Where is + شهر?","Where is Mashhad? It's in the north-east of Iran.","مشهد کجاست؟ در شمال شرق ایران است.","برای پرسیدن موقعیت جغرافیایی."],["What's + شهر + like?","What's Tabriz like? It's big and old.","تبریز چگونه است؟ بزرگ و قدیمی است.","برای پرسیدن شکل ظاهری شهر."],["Is there a/an ...?","Is there a stadium? Yes, there is. / No, there isn't.","آیا ورزشگاه هست؟ بله / نه","برای مفرد."],["Are there any ...?","Are there any museums? Yes, there are. / No, there aren't.","آیا موزه‌ای هست؟ بله / نه","برای جمع."],["What is + شهر + famous for?","What is Isfahan famous for? It's famous for its old mosques.","اصفهان برای چه معروف است؟","برای پرسیدن شهرت یک مکان."],["تلفظ th","north / south / three / thanks / bathroom","—","th دو صدا دارد: /θ/ و /ð/"]];
grammar[14]=[["What's the weather like in ...?","What's the weather like in Rasht?","هوا در رشت چگونه است؟","برای پرسیدن آب و هوا."],["Is it + آب و هوا?","Is it snowy in winter? Yes, it is. / No, it isn't.","آیا در زمستان برفی است؟ بله / نه","سوال بله/خیر در مورد آب و هوا."],["توصیف روستا","What's Amir Abad like?","امیرآباد چگونه است؟","برای توصیف مکان."],["What's the people's job?","What's the people's job?","شغل مردم چیست؟","پرسیدن شغل مردم."],["How about / What about","What's the weather like in spring? How about winter?","هوا در بهار چگونه است؟ زمستان چطور؟","برای جلوگیری از تکرار سوال."],["تلفظ th = /ð/","mother / father / brother / with / this / they","—","th در این کلمات صدای /ð/ می‌دهد."]];
grammar[15]=[["Free time (وقت آزاد)","What do you do in your free time?","در وقت آزادت چه کار می‌کنی؟","برای پرسیدن فعالیت در وقت آزاد."],["What do you like to do in your free time?","What do you like to do in your free time?","دوست داری در وقت آزادت چه کار کنی؟","برای پرسیدن علاقه."]];
grammar[16]=[["Verb to be (am/is/are)","I am / You are / He is / She is / It is / We are / They are","من هستم / تو هستی / او هست","فعل to be در زمان حال ساده."],["منفی کردن to be","I am not / He is not / She is not / It is not / We are not","نیستم / نیست / نیستیم","بعد از فعل not می‌آید."],["سوالی کردن to be","Am I? / Is he? / Is she? / Are we?","آیا من؟ / آیا او؟ / آیا ما؟","جای فاعل و فعل را عوض می‌کنیم."],["There is / There are","There is a book on the table. / There are two apples on the table.","یک کتاب روی میز هست. / دو سیب روی میز هست.","There is برای مفرد، There are برای جمع."],["a / an","a book / an apple / an orange / an umbrella","یک کتاب / یک سیب / یک پرتقال / یک چتر","an برای حروف صدادار."],["منفی There is/are","There isn't a book. / There aren't many tourists.","کتابی نیست. / گردشگران زیادی نیستند.","بعد از is/are کلمه not می‌آید."],["سوالی There is/are","Is there an apple on the table? / Are there any museums?","آیا سیبی روی میز هست؟ / آیا موزه‌ای هست؟","جای is/are با there عوض می‌شود."],["Contractions (اختصاری)","I'm / He's / She's / It's / We're / They're / isn't / aren't","مخفف‌ها","در مکالمه بیشتر استفاده می‌شود."]];
grammar[17]=[["Present Continuous (حال استمراری)","I am eating dinner. / He is eating dinner. / They are eating dinner.","من دارم شام می‌خورم. / او دارد شام می‌خورد.","برای کاری که همین الآن در حال انجام است."],["ساختار","فاعل + am/is/are + فعل + ing","—","am برای I، is برای he/she/it، are برای we/you/they"],["نکته ing","write → writing / type → typing / drive → driving","—","اگر فعل به e ختم شود، e حذف و ing اضافه می‌شود."],["نکته ing ۲","hit → hitting / sit → sitting / swim → swimming","—","اگر فعل یک‌بخشی و کوتاه باشد، حرف آخر دوبار تکرار می‌شود."],["سوالی","Am I running? / Are you writing? / Is he sleeping?","آیا دارم می‌دوم؟ / آیا داری می‌نویسی؟","جای فاعل و فعل to be عوض می‌شود."],["منفی","I'm not cooking. / You aren't studying. / He isn't coming.","من آشپزی نمی‌کنم. / تو درس نمی‌خوانی.","not بعد از am/is/are می‌آید."],["مالکیت با 's","Dog's collar / sister's backpack","قلاده سگ / کوله پشتی خواهر","برای اشخاص، حیوانات، کشورها."],["جمع با s'","sisters' backpacks / cars' engines","کوله پشتی‌های خواهران / موتورهای ماشین‌ها","اگر اسم جمع باشد فقط آپاستروف."],["مالکیت با of","What is the name of that street?","اسم آن خیابان چیست؟","of برای مالکیت اشیاء."]];
grammar[18]=[["Present Simple (حال ساده)","I speak / He speaks / They play","من صحبت می‌کنم / او صحبت می‌کند / آنها بازی می‌کنند","برای عادت‌ها، حقایق علمی، کارهای روزمره."],["ساختار","فاعل + فعل ساده (برای سوم شخص s می‌گیرد)","—","سوم شخص مفرد: he/she/it → فعل + s"],["منفی","I do not speak. / He does not speak.","من صحبت نمی‌کنم. / او صحبت نمی‌کند.","don't و doesn't"],["سوالی","Do I speak? / Does he speak?","آیا صحبت می‌کنم؟ / آیا صحبت می‌کند؟","Do/Does به اول جمله می‌آید."],["استثناهای سوم شخص","watch → watches / wash → washes / go → goes / do → does","—","افعالی که به ch, sh, z, ss, x, o ختم می‌شوند es می‌گیرند."],["y در سوم شخص","worry → worries / play → plays","—","اگر قبل از y حرف صدادار باشد y تغییر نمی‌کند."],["قیدهای تکرار","never / rarely / sometimes / often / usually / always","هرگز / به‌ندرت / گاهی / غالباً / معمولاً / همیشه","0% ......... 50% ......... 100%"]];
grammar[19]=[["Wh questions","What / Who / Where / When / Why / How / Which / Whose","چه / چه کسی / کجا / کی / چرا / چطور / کدام / مال چه کسی","برای پرسیدن اطلاعات."],["دسته اول","How many / How much / Whose / Which","چند تا / چه مقدار / مال چه کسی / کدام","بعد از این کلمات، اسم و سپس جمله سوالی."],["دسته دوم","What / What color / What time / What day / How / When / Where / Who / How old","چه / چه رنگی / چه ساعتی","بعد از این کلمات، جمله سوالی."],["قیدهای تکرار","always / usually / often / sometimes / rarely / never","همیشه / معمولاً / غالباً / گاهی / به‌ندرت / هرگز","—"],["قانون ۱","قید قبل از فعل اصلی: I always watch TV in the morning.","—","Adverb + Main verb"],["قانون ۲","قید بعد از فعل to be: He is always ill.","—","To Be + Adverb"],["قانون ۳","قید بین فعل کمکی و فعل اصلی: He can never learn English.","—","Auxiliary + Adverb + Main verb"],["قانون ۴","قید بعد از فاعل در جملات سوالی","—","در سوالات از Frequency adverb بعد از فاعل."]];
grammar[20]=[["Simple Past (گذشته ساده)","I played / He spoke / They went","من بازی کردم / او صحبت کرد / آنها رفتند","برای وقایعی که در گذشته تمام شده‌اند."],["ساختار","فاعل + فعل گذشته + ...","—","افعال باقاعده: ed / افعال بی‌قاعده: شکل دوم."],["منفی","I did not play. / He did not speak.","من بازی نکردم. / او صحبت نکرد.","did not / didn't + فعل ساده."],["سوالی","Did I play? / Did he speak?","آیا بازی کردم؟ / آیا صحبت کرد؟","Did به اول جمله می‌آید."],["کاربرد ۱","She met Sarah three weeks ago.","او سه هفته پیش سارا را دید.","عملی که در گذشته در زمان مشخصی تمام شده."],["کاربرد ۲","I got up early, washed my face, ate breakfast, and went to school.","صبح زود بیدار شدم، صورتم را شستم، صبحانه خوردم و به مدرسه رفتم.","کارهایی که یکی پس از دیگری اتفاق افتاده‌اند."],["کاربرد ۳","Mina lived in Japan for seven years.","مینا به مدت هفت سال در ژاپن زندگی کرد.","عملی که در گذشته طول مدتی ادامه داشته."],["کاربرد ۴","My father always listened to classical music.","پدرم همیشه به موسیقی سنتی گوش می‌داد.","عادت‌های گذشته."],["Be در گذشته","I was / You were / He was / She was / It was / We were / They were","بودم / بودی / بود / بودیم / بودند","Be فعل بی‌قاعده است."]];
grammar[21]=[["ضمایر مفعولی","me / you / him / her / it / us / you / them","به من / به تو / به او / به آن / به ما / به شما / به آنها","جایگزین اسم مفعول در جمله می‌شوند."],["مطابقت ضمیر فاعلی و مفعولی","I → me / you → you / he → him / she → her / it → it / we → us / they → them","—","ضمیر مفعولی بعد از فعل یا حرف اضافه می‌آید."],["بعد از فعل","Give me a ring tomorrow. / I'm older than you.","فردا به من زنگ بزن. / من از تو بزرگترم.","—"],["بعد از حرف اضافه","Our teacher was angry with us.","معلممان از دست ما عصبانی بود.","—"],["نکته مؤدبانه","you and I / my father and I / you and your wife","—","you قبل از اسامی و ضمایر دیگر."]];
grammar[22]=[["Simple Future (آینده ساده با will)","It will rain this afternoon. / They will finish the job next week.","امروز بعدازظهر باران خواهد بارید. / آنان کارشان را هفته آینده تمام خواهند کرد.","فاعل + will + فعل ساده."],["منفی کردن will","I will not destroy nature. / I won't be here tomorrow.","من طبیعت را تخریب نخواهم کرد. / من فردا اینجا نخواهم بود.","will not = won't"],["سوالی کردن will","Will you go to the mountain? / Will Reza have an exam on Monday?","آیا شما به کوه خواهید رفت؟ / آیا رضا روز دوشنبه آزمون خواهد داشت؟","will را به اول جمله می‌بریم."],["کلمات پرسشی با will","Who / When / Where / What + will + فاعل + فعل؟","چه کسی / چه زمانی / کجا / چه چیزی","مثال: Who will visit Shiraz next summer?"],["Be going to (آینده با قصد)","They are going to buy a house soon.","آنها قصد دارند به زودی یک خانه بخرند.","فاعل + am/is/are + going to + فعل ساده."],["تفاوت will و be going to","Will: تصمیم در لحظه صحبت / Be going to: تصمیم قبل از لحظه صحبت","—","The sun will rise tomorrow."]];
grammar[23]=[["Adjective (صفت)","Sara is a beautiful girl. / The car is nice.","سارا دختر زیبایی است. / ماشین خوب است.","صفت کلمه‌ای است که اسم را توصیف می‌کند."],["صفت ساده یا مطلق","Sara is a beautiful girl.","سارا دختر زیبایی است.","بدون مقایسه."],["صفت برابری (as ... as)","His grandfather is as old as my grandmother.","پدربزرگ او به اندازه‌ی مادربزرگ من پیر است.","as + صفت ساده + as"],["صفت تفضیلی (برتر) - er","Sharks are more dangerous than whales.","کوسه‌ها از نهنگ‌ها خطرناک‌ترند.","صفت + er + than (کوتاه) یا more + صفت + than (بلند)"],["استثناهای تفضیلی","صفات دو بخشی، صفات ختم شده به er، le، ow، y","happy → happier / narrow → narrower / simple → simpler",""],["صفت عالی (برترین) - est","This is the most difficult problem of the book.","این سخت‌ترین مسئله‌ی کتاب است.","the + صفت + est یا the most + صفت + in/of"],["صفات بی‌قاعده","good → better → the best / bad → worse → the worst / far → farther → the farthest","خوب → بهتر → بهترین","این صفات از قوانین پیروی نمی‌کنند."],["نکات نوشتاری","صفت یک‌بخشی که مصوت + صامت دارند: حرف آخر دوبار تکرار می‌شود.","big → bigger → the biggest / hot → hotter → the hottest",""],["صفت‌های دو بخشی با more/most","tired → more tired than → the most tired","خسته → خسته‌تر → خسته‌ترین",""],["older/elder - oldest/eldest","Our older/elder sister is a teacher.","خواهر بزرگ‌تر ما معلم است.","elder/eldest فقط برای اعضای خانواده."],["مکان صفت - قبل از اسم","Jack is a tall man. / Jennifer bought an expensive car.","جک مرد بلندی است. / جنیفر یک ماشین گران خرید.","صفت قبل از اسم."],["مکان صفت - بعد از افعال ربطی","Marry is beautiful. / Stephan appears tired.","مری زیباست. / استفان خسته به نظر می‌رسد.","افعال ربطی: be, stay, smell, feel, taste, seem, become"],["the + صفت","the young / the old / the dead / the English","جوان‌ها / پیرها / مرده‌ها / انگلیسی‌ها","the + صفت = گروهی از مردم."],["ترتیب صفات قبل از اسم","Quality → Size → Shape → Age → Color → Nationality → Material → اسم","A big red ball","کیفیت، اندازه، شکل، سن، رنگ، ملیت، جنس"],["صفت فاعلی (-ing)","interesting = جالب / amusing = سرگرم‌کننده","این صفت با افزودن ing به فعل ساخته می‌شود.","در فارسی با پسوندهای «کننده، آور، انگیز»."],["صفت مفعولی (-ed)","interested = علاقه‌مند / amused = سرگرم","این صفت همان قسمت سوم فعل است.","مثال: I am interested in physics."]];
grammar[24]=[["Past Continuous (گذشته استمراری)","I was studying English at this time yesterday.","دیروز همین موقع داشتم انگلیسی می‌خواندم.","فاعل + was/were + فعل + ing"],["قیدهای گذشته استمراری","when / while / yesterday / yesterday at this time","کی / در حالی که / دیروز",""],["منفی گذشته استمراری","He was not watching a film yesterday in the evening.","او دیروز عصر فیلم تماشا نمی‌کرد.","was/were + not + فعل + ing"],["سوالی گذشته استمراری","Was he watching a film yesterday in the evening?","آیا او دیروز عصر فیلم تماشا می‌کرد؟","Was/Were + فاعل + فعل + ing؟"],["when و while","While + گذشته استمراری / when + گذشته ساده","While we were watching TV, Andy was surfing the internet.","when برای گذشته ساده، while برای گذشته استمراری"],["as به جای while","As we were listening to the radio, our brother came in.","وقتی داشتیم رادیو گوش می‌دادیم، برادرمان آمد داخل.","as می‌تواند جای while استفاده شود."],["افعال کنشی و حالتی","Action verbs: می‌توانند در زمان‌های استمراری صرف شوند / State verbs: نمی‌توانند","The man speaks two languages. / The man is speaking Spanish right now.","افعال حالتی: حسی، ربطی، احساسات، مالکیت، to be"],["افعال حالتی مهم","see, hear, smell, sound, seem, become, love, hate, like, doubt, have, belong, own, want, be, believe, consider","—","این افعال در زمان‌های استمراری صرف نمی‌شوند."],["Reflexive Pronouns (ضمایر انعکاسی)","myself, yourself, himself, herself, itself, ourselves, yourselves, themselves","خودم، خودت، خودش، خودمان، خودتان، خودشان","وقتی فاعل و مفعول یکی هستند."],["کاربرد ضمایر انعکاسی","He often looks at himself in the mirror. / You can be proud of yourself.","او اغلب خودش را در آینه نگاه می‌کند. / تو باید به خودت افتخار کنی.","بعد از فعل اصلی یا حرف اضافه."],["Emphatic Pronouns (ضمایر تاکیدی)","Mary herself bought that car. / I like the apartment itself.","خودِ مری آن ماشین را خرید. / من خودِ آپارتمان را دوست دارم.","برای تاکید روی یک اسم."],["تاکید فاعل - تاکید مفعول","(الف) بعد از فاعل یا در آخر جمله (ب) بالفاصله بعد از مفعول","Mary herself bought that car. / I like the apartment itself.",""],["نکات مهم ضمایر انعکاسی","1) Let's + ourselves 2) بعد از حروف اضافه، ضمایر مفعولی 3) by + myself = به تنهایی","Let's fix the car ourselves. / He answered all the emails by himself.",""]];
grammar[25]=[["Modal Verbs (افعال کمکی ناقص)","Can, could, may, might, must, ought, shall, should, will, would","توانستن، می‌توانستن، ممکن بودن، باید، خواستن","افعال کمکی برای بیان توانایی، احتمال، اجازه، اجبار، توصیه."],["ویژگی‌های افعال مدال","1) ing, ed, s نمی‌گیرند 2) بعد از آن‌ها فعل ساده می‌آید 3) شکل ثابت دارند 4) تنها بکار نمی‌روند","You must stop when the traffic lights turn red.",""],["Must (باید)","You must stop when the traffic lights turn red. / He must be very tired.","هنگامی که چراغ قرمز می‌شود باید توقف کنید. / او باید خیلی خسته باشد.","اجبار، نتیجه‌گیری منطقی. گذشته: had to"],["Can (توانستن)","I can swim. / Smoking can cause cancer.","من می‌توانم شنا کنم. / استعمال دخانیات می‌تواند باعث سرطان شود.","توانایی، اجازه، احتمال. منفی: cannot / can't"],["Could (گذشته can)","When my son was a child, he could ride a bicycle.","زمانی که پسرم بچه بود، می‌توانست دوچرخه سواری کند.","گذشته can برای توانایی در گذشته."],["May (ممکن بودن)","May I use your phone please? / It may rain tomorrow.","آیا اجازه دارم از تلفن شما استفاده کنم؟ / ممکن است فردا باران ببارد.","اجازه، احتمال."],["Might (ممکن بودن)","Might I suggest an idea? / I might go on holiday to Australia next year.","می‌توانم یک ایده پیشنهاد دهم؟ / ممکن است سال آینده به استرالیا بروم.","گذشته may."],["Should (باید - توصیه)","I should see a doctor. / You should review your lessons.","باید دکتر بروم. / باید درس‌هایت را مرور کنی.","پیشنهاد، نصیحت."],["شکل فعل بعد از مدال","1) ساده بدون to 2) استمراری: can be answering 3) کامل: can have answered 4) مجهول: can be answered","—","فعل اصلی بعد از مدال در این اشکال می‌آید."],["Prepositions (حروف اضافه)","on / in / at","روی / در / در","قبل از اسم‌ها یا بعضی فعل‌ها قرار می‌گیرند."],["حرف اضافه on","1) تماس با سطح 2) تاریخ و روز: on Monday 3) اعضای بدن 4) وسایل: on TV 5) سواحل","—","کاربردهای متعدد on"],["حرف اضافه in","1) درون چیزی 2) زیر سطح 3) شهر و کشور 4) ماه و فصل","—","کاربردهای متعدد in"],["حرف اضافه at","1) موقعیت 2) زمان مشخص: at 9 p.m. 3) درجه 4) قبل از دهکده 5) مکان کار","—","کاربردهای متعدد at"],["تفاوت in و on با زمان","in + ماه: in March / on + روز و تاریخ: on 5th March","—","in برای ماه، on برای روز"],["تفاوت in و at با مکان","I'm in the office. (اتاق) / I'm at the office. (اداره کلی)","—","at برای کلی، in برای قسمت مشخص"],["تفاوت arrive in و arrive at","in + کشور و شهر بزرگ / at + فرودگاه و مکان کوچک","arrive in the Netherlands / arrive at the airport","arrive home بدون حرف اضافه"],["in time و on time","in time: درست سر وقت / on time: کمی زودتر از برنامه","They hoped the firemen would arrive in time.",""],["Adverb of Manner (قید حالت)","He drives slowly. / We cleaned the car carefully.","او به آرامی رانندگی می‌کند.","قید حالت چگونگی انجام کار را نشان می‌دهد."],["ساخت قید حالت","صفت + ly: quick → quickly / kind → kindly / careful → carefully","—","اکثر قیدهای حالت با افزودن ly به صفت ساخته می‌شوند."],["نکات ساخت قید حالت","1) صفت ختم به y → ily: angry → angrily 2) صفت ختم به e → e حذف + y: terrible → terribly","—",""],["قید و صفت یکسان","hard, near, fast, low, high, early, late, far","Jack is a fast runner. / Jack runs fast.","این کلمات هم صفت و هم قید هستند."],["جایگاه قید حالت","1) بعد از فعل اصلی یا بعد از مفعول 2) قبل از قید مکان و زمان 3) گاهی در ابتدای جمله","She talked loudly. / Slowly, the students left the classroom.",""],["قیدهای همیشه بعد از فعل","well, badly, hard, fast","He swam well. / The rain fell hard.",""],["صفت و قید یکسان","good (صفت) / well (قید) / fast (صفت و قید) / hard (صفت و قید)","—","این کلمات هم صفت و هم قید هستند."],["Irregular Verbs (افعال بی‌قاعده)","افعالی که شکل گذشته و سوم آن‌ها ed نمی‌گیرد.","go → went → gone / see → saw → seen / write → wrote → written","باید حفظ شوند."],["نوع اول افعال بی‌قاعده","سه شکل یکسان: cut → cut → cut / put → put → put","—",""],["نوع دوم افعال بی‌قاعده","دو قسمت یکسان: sit → sat → sat / run → ran → run","—",""],["نوع سوم افعال بی‌قاعده","سه شکل متفاوت: drink → drank → drunk / sing → sang → sung","—",""]];
grammar[26]=[["Skimming و Scanning","Skimming: مرور اجمالی / Scanning: نگاه انداختن","اسکیمینگ: ایده اصلی / اسکنینگ: اطلاعات خاص","اسکیمینگ بهترین عملکرد را در متون غیرداستانی دارد."],["اسکیمینگ - چه چیزی را بخوانیم؟","1) چند پاراگراف ابتدایی 2) جمله اول هر پاراگراف 3) سطور پایینی 4) چند پاراگراف آخر","—","جمله اول هر پاراگراف ایده محوری را مطرح می‌کند."],["اسکنینگ - چگونه انجام دهیم؟","1) متن را کامل بخوانید 2) دنبال کلمات متداول مثل them, they, this 3) به جملات نزدیک توجه کنید","—","کلیدواژه‌ها را در ذهن داشته باشید."],["Countable nouns (اسم قابل شمارش)","the boy → the boys / an answer → some answers","می‌توانند شماره شوند.","مثال: I have a good job."],["Uncountable nouns (اسم غیر قابل شمارش)","paper, wood, coal, silk, wool, cotton, gold, iron, silver, steel, fish, fruit, sugar, meat, cheese, bread, water, oil, milk, tea, air, steam, oxygen, money, music, noise, land, hair, ice, snow","تنها بصورت مفرد بکار می‌روند.","با much و little می‌آیند."],["اسم‌های انتزاعی","Experience, Sunshine, Notice, Happiness, luck, Interest, Fear","اسم‌هایی که ایده و نظر هستند.","غالباً غیر قابل شمارش."],["تبدیل غیرقابل شمارش به قابل شمارش","a piece of / a bit of / a little bit of / pieces of / bits of","I bought a piece of furniture at the market.",""],["news","There is no important news in the newspapers. / Mathematics is difficult.","news و Mathematics ظاهراً جمع هستند ولی مفرد غیر قابل شمارش‌اند.",""],["جمع بستن اسامی","1) s: cat→cats 2) es برای s, x, ch, sh: bus→buses 3) y→ies: baby→babies","cat, cats / bus, buses / box, boxes / baby, babies",""],["جمع بیقاعده - تغییر حروف صدادار","man→men / woman→women / mouse→mice / foot→feet / tooth→teeth / goose→geese","مردها / زنها / موشها / پاها / دندانها / غازها",""],["f → ves","calf→calves / half→halves / knife→knives / leaf→leaves / life→lives / loaf→loaves / shelf→shelves / thief→thieves / wife→wives / wolf→wolves","گوساله‌ها / چاقوها / برگ‌ها / همسرها / گرگ‌ها",""],["بدون تغییر","deer / sheep / fish / Chinese / Swiss","آهوها / گوسفندها / ماهی‌ها",""],["اعداد و مقیاس‌ها","Two hundred / Three dozen","بعد از عدد تغییری نمی‌کنند.",""],["ریشه خارجی","cactus→cacti / analysis→analyses / thesis→theses / phenomenon→phenomena","—",""],["حالت ملکی","my daughter's room / my daughters' room / men's clothes","X's Y = the Y of X","بهتر است برای انسان، گروه‌های انسانی از X's استفاده شود."],["کلمات فارسی قابل شمارش، انگلیسی غیرقابل شمارش","Food, meat, juice, chicken, fish, bread, money, advice","در فارسی قابل شمارش‌اند اما در انگلیسی غیرقابل شمارش.",""],["some / any / no","جمله مثبت: some / جمله منفی و سوالی: any / جمله منفی: no","There are five apples on the table. / Is there any apple on the table? / Yes, there are some apples on it.",""],["How many / How much","How many + اسم جمع قابل شمارش / How much + اسم غیرقابل شمارش","How many cars do you have? / How much water is there here?",""],["a few / few - a little / little","a few + اسم جمع قابل شمارش (تعداد کمی) / few + اسم جمع قابل شمارش (تقریبا هیچ)","There are few students in the yard. / There are a few students in the yard. / I have little time. / I have a little time.","a little + اسم غیرقابل شمارش"]];
grammar[27]=[["اسکیمینگ (تعریف)","Skimming = مرور سریع متن برای یافتن ایده اصلی","اسکیمینگ یکی از ابزارهایی است که کمک می‌کند تا در زمانی کمتر، مقدار بیشتری بخوانیم.","بهترین عملکرد در مورد متون غیرداستانی."],["اسکیمینگ - چگونه؟","1) ساختار و قانونی برای نخواندن 2) خواندن چند پاراگراف ابتدایی 3) جمله اول هر پاراگراف 4) سطور پایینی 5) پاراگراف‌های آخر","—",""],["Prefixes (پیشوندها)","حروف اضافه شده به ابتدای ریشه کلمات","dis / ex / mis / pre / re / un / anti / fore / inter / sub",""],["پیشوند Dis","disagree, disallow, disappear, dislike","با افعال ترکیب می‌شود و منفی می‌کند.",""],["پیشوند Ex","ex-husband, ex-employer, ex-friend, ex-president","با اسامی ترکیب می‌شود.",""],["پیشوند Mis","mishear, misprint, miscalculate, misinform, misunderstand","به صورت بد یا اشتباه انجام شده.",""],["پیشوند Pre","pre-game exercise, pre-dinner, pre-job, pre-match","قبل از چیزی دیگر.",""],["پیشوند Re","reappear, rebuild, rename, remarry","دوباره.",""],["پیشوند Un","unable, uncomfortable, unfair, unacceptable","متضاد / منفی.",""],["پیشوند Anti","anti-social, anti-clerical, anti-clockwise, anti-missile, anti-war","ضد / مخالف.",""],["پیشوند Fore","forearm, foreshore, foreground, foreleg, forename","جلو / قسمت جلویی.",""],["پیشوند Inter","International, interlinear, inter-continental, intertwine","بین / مابین.",""],["پیشوند Sub","Subnormal, sublet, subdivide, subcontract, subsection","زیر.",""],["پیشوند Post","Post-war, post-election, post-classical","پس از / بعد.",""],["پیشوند Bi, di","Biplane, bicycle, biped, bilateral, bifocal / dichotomy, diode, dioxide","دو.",""],["پیشوند Poly, multi","Polyglot, polygon, polygamy / multiform, multi-lateral, multiracial","چندین / بسیار.",""],["پیشوند Hemi, semi, demi","Semicircle, semivowel, semiconscious / demigod / hemisphere","نیم / نصف.",""],["پیشوند Tri","Tripod, tricycle, tripartite, trinominal","سه.",""],["پیشوند Uni, mono","Univalve, unilateral, unidirectional / monogamy, monolith, monologue","یک / تک.",""],["Suffixes (پسوندها)","حروف اضافه شده به انتهای ریشه کلمات","-ed, -er, -or, -ion, -ize, -ly, -ous, -age, -ery, -ry, -hood, -ship, -ess, -ee, -al, -ation, -ment, -ity, -ness, -ish, -less, -like, -y, -able, -ive",""],["پسوند -ed","worked","به افعال اضافه می‌شود و زمان گذشته یا قسمت سوم را می‌سازد.",""],["پسوند -er, -or","teacher, baker, leader, player, supervisor","اسامی مشاغل - همچنین برای صفات تفضیلی",""],["پسوند -ful","beautiful, harmful, useful, powerful","از اسم صفت می‌سازد.",""],["پسوند -ion, -tion, -sion","action, connection, education, protection","از افعال اسم می‌سازد.",""],["پسوند -ize","apologize, emphasize, memorize, summarize","از اسم فعل می‌سازد.",""],["پسوند -ly","exactly, badly, finally, normally","از صفت قید می‌سازد.",""],["پسوند -ous","famous, ambitious, curious, previous","صفت می‌سازد.",""],["پسوند -age","Baggage, frontage, mileage","اندازه‌گیری و جمع.",""],["پسوند -ery, -ry","Drudgery, slavery, delivery, nursery, refinery, bakery, nunnery","شرایط، رفتار، مکان.",""],["پسوند -hood","Boyhood, brotherhood, widowhood","حالت یا شرایط.",""],["پسوند -ship","Friendship, membership, dictatorship, professorship","—",""],["پسوند -ism","Idealism, impressionism, fanaticism, absenteeism, racism","—",""],["پسوند -ing","Tubing, paneling, matting, carpeting","—",""],["پسوند -eer","Pamphleteer, profiteer, racketeer, mountaineer, engineer","—",""],["پسوند -ess","Waitress, actress, lioness, manageress, stewardess, hostess","نشان‌دهنده جنس مؤنث.",""],["پسوند -ee","Appointee, payee, interviewee, employee, nominee","نشان‌دهنده فاعل آن فعل.",""],["پسوند -al","Refusal, revival, dismissal, upheaval","نشان‌دهنده عمل و نتیجه.",""],["پسوند -ation","Exploration, starvation, ratification, foundation, organization","فرایند، وضعیت، تولید.",""],["پسوند -ment","Arrangement, amazement, puzzlement, embodiment, equipment","نشان‌دهنده نتیجه.",""],["پسوند -ity","Elasticity, rapidity, sanity, falsity, diversity, respectability","اغلب اسم غیرقابل شمارش.",""],["پسوند -ness","Meanness, happiness, usefulness, kindness, selfishness, unexpectedness","اغلب اسم غیرقابل شمارش.",""],["پسوند -ish","Childish, monkish, foolish, snobbish, Swedish, Turkish","حدی، تا قدری / نژاد، مردم، زبان.",""],["پسوند -less","Careless, restless, colorless, harmless, homeless","بدون.",""],["پسوند -like","Childlike, statesmanlike, monkeylike","مانند، شبیه.",""],["پسوند -y","Sandy, meaty, creamy, hairy, wealthy, comfy","تا حدی شبیه.",""],["پسوند -able","Debatable, washable, drinkable, manageable, changeable, perishable","با افعال متعدی می‌آید و به صفت تبدیل می‌کند.",""],["پسوند -ive","Attractive, effective, possessive, explosive, productive, expansive, decorative","—",""],["Present Perfect (حال کامل یا ماضی نقلی)","S + have/has + past participle (pp)","برای بیان عمل یا حالتی که در گذشته شروع شده و اثر آن تا زمان حال ادامه دارد.",""],["ساختار حال کامل","فاعل + have/has + قسمت سوم فعل + بقیه جمله","I have finished. / He has finished.","افعال باقاعده: ed / افعال بی‌قاعده: شکل سوم"],["کاربرد ۱ حال کامل","عمل یا حالتی که در گذشته شروع شده و تا زمان حال ادامه دارد.","They have lived in this apartment for twelve years.",""],["کاربرد ۲ حال کامل","عمل یا حالتی که در گذشته شروع شده و تمام شده ولی اثر آن تا زمان حال باقی مانده.","She has bought a new computer for three months. (She still has it.)",""],["کاربرد ۳ حال کامل","عمل یا حالتی که در گذشته شروع شده و به صورت تجربه و دانش نزد ما باقی است.","Have you ever been to China? / I have never eaten Sushi in my life.","با ever و never"],["کاربرد ۴ حال کامل","برای کاری که برای اولین بار یا چندمین بار انجام داده‌ایم.","It is the first time (that) she has been on a diet. / This is the fourth time that we have complained.",""],["کاربرد ۵ حال کامل","برای بیان کردن صفات عالی.","This is the most popular song that I have ever heard.",""],["کاربرد ۶ حال کامل","برای بیان عمل یا حالتی که از گذشته تا حالا چندین بار تکرار شده است.","My mother has cooked spaghetti three times this week.",""],["کاربرد ۷ حال کامل","عمل و یا دستاوردی که در طول زندگی توسط ما یا دیگران صورت گرفته و زمان دقیق آن مشخص نیست.","I have eaten Japanese food many times. / I ate Japanese food three months ago.","اگر زمان دقیق مشخص باشد، گذشته ساده"],["for و since","for: به مدت / since: از","for (two hours, three weeks) / since (nine o'clock, Monday, 2007)","I have been in this office for eight years. / I have been in this office since 2012."],["already","قبلاً، پیش از این","A: I have already done it.","کار زودتر از زمان مورد انتظار انجام شده است."],["just","چند لحظه قبل، تازه","B: Yes, I have just got up.","چند لحظه قبل انجام شده."],["yet","هنوز - در آخر جملات منفی و سوالی","Have they arrived yet? / We haven't finished our homework yet.","منتظر انجام کاری هستیم."],["so far / up to now","تاکنون - در آخر جملات ماضی نقلی","We have completed 17 lessons so far.",""],["ever و never","ever: تا حالا / never: هرگز","Have you ever been to China? / No, I have never been to China.",""],["recently و lately","قبل از فعل اصلی و بعد از have/has یا در آخر جمله","She hasn't written to me recently. / I have been very busy lately.",""],["عبارت‌های زمانی حال کامل","1) if clause 2) قید تکرار 3) تعداد دفعات","He has put his comb in his pocket. / I have visited the zoo several times.",""],["حال کامل در جملات وصفی","بعد از صفات عالی، اعداد ترتیبی، the only، the first","This is the first time she has been to Shiraz.","جمله اصلی زمان حال است."],["تغییرات فعل در حال کامل","1) افعال ختم به e: فقط d 2) افعال ختم به y 3) افعال تک‌سیلابی: حرف بی‌صدا دوبار","close → closed / enjoy → enjoyed / ban → banned / prefer → preferred",""],["Phrasal Verbs (افعال چند بخشی)","ترکیب فعل با حرف اضافه یا قید که معنی جدیدی می‌سازد.","go through (تحمل کردن) / look after (مراقب بودن) / turn on (روشن کردن)",""],["افعال دو کلمه‌ای جداشدنی","1) متعدی باشند 2) حرف اضافه یکی از: on, off, in, out, up, down, back, over","put on / turn on / turn off / call up",""],["افعال دو کلمه‌ای جدانشدنی","1) لازم باشند 2) یا حرف اضافه غیر از حروف بالا","get up (بیدار شدن) / come back (برگشتن) / look for (جستجو کردن)","فعل و حرف اضافه جدا نمی‌شوند."],["افعال دوکلمه‌ای مهم","call up, call off, call on, call back, call in, bring about, bring up, catch up with, check in, check into, check out, cheer up, come across, ask out","—","—"],["افعال دوکلمه‌ای جداشدنی رایج","clean up, cross out, do over, drop off, figure out, fill out, find out, get back from, get in, get into, get off, get out of, get over, give up, go over, grow up, hang up, keep out of, look into, look over, look up, make up, pass away, pick out, pick up, point out, put off, put on, put out, put up with, run into, run out, show up, take after, take off, take out, take up, tear down, tear up, throw out, throw away, try on, turn down, turn off, turn on, turn out, turn up, give back, add up, wake up","—","—"],["صفات + حروف اضافه","هیچ قانون مشخصی وجود ندارد و باید حفظ شوند.","afraid of / kind of / proud of / rude of / smart of / sick of, tired of / silly of / stupid of",""],["صفت + of","برای بیان حالات روحی یا فیزیکی مثل ترس، خستگی، عصبانیت","Sam is afraid of dogs. / How kind of you to come early.",""],["صفت + to","توصیف رفتار، حالت یا ارتباط بین اشیاء و اشخاص","accustomed to / addicted to / committed to / friendly to, good to, kind to, nice to / married to / mean to, rude to / opposed to / similar to",""],["صفت + about","بیان یک شرایط یا حالت خاص","angry about / anxious about, nervous about, worried about / excited about / happy about / sad about / sorry about, upset about",""],["صفت + for","بیان اهداف یا دلایل مختلف","famous for / known for / responsible for","Texas is famous for rodeos. / Australia is known for its large kangaroo population."],["صفت + with","بیان دلیل بروز یک احساس یا ارتباط","angry with, furious with / annoyed with, fed up with / bored with / content with / fine with / OK with / disappointed with / pleased with",""],["صفت + at/by","amazed, astonished, shocked, surprised","The man was amazed at/by the number of people. / I'm shocked at/by his behavior.",""],["صفت + at","good at, terrible at","James is good at playing the guitar.",""],["صفت + in","interested in, involved in","Bernard is interested in joining the school band.",""],["صفت + from","different from, protected from, tired from","Turquoise is different from blue. / We were protected from the storm.",""],["صفات با چند حرف اضافه","sorry about/for / disappointed with/in","She's very sorry about the mistake. / Mark is disappointed with the decision.",""],["happy for vs happy about","happy for + people / happy about + thing/event","I'm so happy for them. / I'm so happy about the wedding.",""],["angry with vs angry about","angry with + person / angry about + gerund","Dad is angry with Elizabeth. / Dad is angry about Elizabeth's sneaking out.",""],["Gerund (اسم مصدر)","فعل + ing که نقش اسم را دارد.","Studying is hard. / I enjoy reading. / Reading helps you learn English.",""],["Gerund به عنوان فاعل","Eating too much food makes people fat. / Not doing her homework caused her to fail the test.","—",""],["Gerund بعد از افعال خاص","enjoy, avoid, dislike, postpone, mind, suggest, finish, consider, deny, admit, keep, practice, risk, quit, imagine","He avoids talking to his friend. / She dislikes watching horror movies.",""],["Gerund به عنوان مکمل فاعل","بعد از فعل to be","My favorite hobby is reading. / Her problem is not coming to class on time.",""],["Gerund بعد از حرف اضافه","after, before, without, from, to, of, with, for, against, at, about, by, in, on, through, out, over, up, down, among, between, towards, into","I will call you after arriving in London. / She is good at learning languages.",""],["ترکیبات با Gerund","It's no good / It's no use / can't stand / can't help / to be busy / couldn't help / don't mind / feel like / how about / spend one's time / there's no / there's no point / what about / worth","It is no good going outside in this rainy day. / How about walking home instead of taking the car?",""],["نکات مهم Gerund","1) ing در حال استمراری جزء اسم مصدر نیست 2) بعد از صفت ملکی یا s' می‌آید 3) منفی: not + gerund","I'm playing football. (حال استمراری) / I appreciate her speaking. / When I'm on Vacation, I enjoy not having to get up early.",""],["go + gerund","برای ورزش‌های تفریحی","go fishing, go skiing, go skating, go shopping, go swimming, go running, go jogging, go sailing",""],["Gerund به عنوان فاعل مفرد/جمع","یک gerund → فعل مفرد / دو gerund → فعل جمع","Walking makes me happy. / Cycling and jogging are my favorite sports.",""],["No + gerund","برای هشدار و جلوگیری","No parking, No smoking, No swimming, No fishing",""]];
grammar[28]=[["Reference (رفرنس یا مرجع)","کلمات جهت جلوگیری از تکرار نام انسان‌ها، مکان‌ها، ایده‌ها","—",""],["متضادها (Antonyms)","پرکاربردترین کلمات متضاد","absent x present / accept x decline / alive x dead / always x never / ancient x modern / beautiful x ugly / big x little / brave x cowardly / careful x careless / cheap x expensive / dark x light / day x night / early x late / east x west / easy x hard / empty x full / fast x slow / happy x sad / hot x cold / long x short / new x old / open x closed / polite x rude / rich x poor / safe x unsafe / strong x weak / sunny x cloudy",""],["First Conditional (شرطی نوع اول)","If + حال ساده, will/won't + مصدر بدون to","از جملات شرطی نوع اول برای بیان یک شرط ممکن و یک نتیجه محتمل در آینده استفاده می‌شود.",""],["ساختار شرطی نوع اول","If + حال ساده, will/won't + مصدر بدون to","If I work hard, I will pass my exams. / If we leave now, we'll catch the 10.30 train.",""],["نکته کاربردی شرطی نوع اول","می‌توان از افعال کمکی مثل may, can, should, must نیز استفاده کرد","If you pull the cat's tail, it may scratch you.",""],["سوالی کردن شرطی نوع اول","جواب شرط را سوالی می‌کنیم","Will you eat less rice if you want to lose weight?",""],["Present Participle و Past Participle","present Participle (ing): صفات فاعلی / Past Participle (ed): صفات مفعولی","—",""],["صفت فاعلی","ing + افعال","My friend is boring. / This song is interesting. / Sara was confused by the confusing street signs.",""],["صفت مفعولی","ed + افعال","My friend is bored. / We are interested in this kind of songs. / They were frightened by the frightening noises.",""],["لیست صفات فاعلی و مفعولی","Alarming/Alarmed, Amusing/Amused, Annoying/Annoyed, Astonishing/Astonished, Boring/Bored, Confusing/Confused, Convincing/Convinced, Depressing/Depressed, Disappointing/Disappointed, Disgusting/Disgusted, Embarrassing/Embarrassed, Encouraging/Encouraged, Exhausting/Exhausted, Fascinating/Fascinated, Frightening/Frightened, Inspiring/Inspired, Interesting/Interested, Satisfying/Satisfied, Shocking/Shocked, Surprising/Surprised, Worrying/Worried","—",""],["To + infinitive (مصدر با to)","در زبان انگلیسی به دو روش ساخته می‌شود: با پسوند ing و با حرف اضافه to","I decided not to go to London. / He asked me not to be late. / I'd rather not eat meat.",""],["کاربرد ۱ - برای بیان دلیل و هدف","He bought some flowers to give to his wife. / We set off early in order to avoid the traffic.","—",""],["کاربرد ۲ - بعد از افعال خاص","hope, hate, forget, expect, decide, choose, plan, mean, love, like, learn, intend, agree, would love, would like, want, remember, prefer, begin, need, tell, try, refuse, promise, seem, offer, wish, force, permit","They decided to start a business together. / Remember to turn the lights out.",""],["کاربرد ۲ب - با مفعول مستقیم","She reminded me to turn the lights out. / He encouraged his friends to vote for him.","—",""],["کاربرد ۳ - بعد از برخی صفات","Disappointed, Glad, Sad, Happy, Anxious, Pleased, Surprised, Proud, Unhappy","It is good of you to talk to me. / I am happy to be here.",""],["کاربرد ۳ب - صفات خاص","Able to, Unable to, Due to, Likely to, Keen to, Eager to, Prepared to, Ready to, Unlikely, Unwilling to, Willing to","It's kind of you to help. / Unfortunately I was unable to work for over a week.",""],["کاربرد ۳ج - نظر دادن","Possible, Easy, Difficult, Hard, Impossible, Right, Wrong, Nice, Clever, Silly, Foolish","It's easy to play the piano.",""],["کاربرد ۴ - به عنوان وابسته‌های پسر","I have no desire to be rich. / They gave him an opportunity to escape.","—",""],["کاربرد ۵ - به عنوان فاعل جمله","To understand statistics, that is our aim.","کاربرد رسمی و نوشتاری.",""],["کاربرد ۶ - هدف استفاده از چیزی","The children need a garden to play in. / I don't have anything to wear.","—",""],["کاربرد ۷ - همراه با قیود","too/enough + (صفت/قید/اسم) + مصدر با to","There's too much sugar to put in this bowl. / This soup is too hot to eat.",""],["کاربرد ۷ - با ضمایر نامعین","something, someone, anyone + مصدر با to","When I am travelling I always take something to read. / I was all alone. I had no one to talk to.",""],["To be or not to be","مکالمه انگلیسی - جمله معروف شکسپیر","To be or not to be, that is the question. / To know her is to love her.",""]];
grammar[29]=[["انواع سوال در انگلیسی","1) Yes/No questions 2) Wh-questions","برای ساختن جمله پرسشی بله و خیری با فعل to be، جای فاعل و فعل را عوض می‌کنیم.","مثال: Is Jack an English teacher? Yes, he is."],["کلمات پرسشی Wh","What / Where / When / Who / How / Which / Why / How many / How much","فرم سوالی با کلمه پرسشی به سوال بله و خیری شبیه است.","Why does your friend visit you? / How many books did you buy?"],["جملات با فعل کمکی","در جملاتی که فعل کمکی دارند، کلمه پرسشی قبل از فعل کمکی می‌آید.","Where can I buy a suitcase? / Who has painted this wall?","در جملات بدون فعل کمکی از do و does استفاده می‌شود."],["Collocations (همایندها)","کلماتی که معمولاً با هم استفاده می‌شوند.","natural English: the fast train, fast food, a quick shower, a quick meal","unnatural English: train the quick, food quick, shower a fast"],["اهمیت یادگیری Collocations","با آموختن همایندها می‌توانید به شکلی صحیح و طبیعی از زبان انگلیسی استفاده کنید.","مغز ما معنی و کاربرد ترکیب‌ها را راحت‌تر از کلمات تک و مجزا به خاطر می‌سپارد.",""],["چگونه Collocations بیاموزیم؟","1) به ترکیبات مختلف دقت کنید 2) آنها را به عنوان یک واحد زبانی یاد بگیرید 3) همایندهای کلمه جدید را کنار آن بنویسید 4) زیاد مطالعه کنید 5) چندبار بررسی کنید 6) در دسته‌بندی‌های موضوعی بیاموزید","مثال برای remember: remember rightly, remember distinctly, remember vaguely, remember vividly",""],["Do Collocations","do one's housework / do one's homework / do research / do an experiment / do one's best / do somebody a favor / do exercise / do one's hair / do harm / do damage / do the ironing / do the shopping / do the washing / do the dishes","کارهای خونه رو انجام دادن، انجام دادن تکالیف منزل، تحقیق کردن، آزمایش کردن",""],["Make Collocations","make progress / make a decision / make money / make a list / make a promise / make friends / make dinner / make breakfast / make a mistake / make a phone call","پیشرفت کردن، تصمیم گرفتن، پول در آوردن، لیست تهیه کردن، قول دادن",""],["Take Collocations","take an exam / take a look / take a break / take a chance / take a risk / take a taxi / take a vacation / take notes / take an interest in / take a photo","امتحان دادن، نگاه انداختن، استراحت کوتاه کردن، ریسک کردن، تاکسی گرفتن، مرخصی گرفتن",""],["Passive Voice (جملات مجهول)","در جملات مجهول، عملی که انجام شده اهمیت دارد و اینکه چه کسی یا چه چیزی باعث انجام کار شده مهم نیست.","I keep the butter in the fridge. (معلوم) → The butter is kept in the fridge. (مجهول)","جملات مجهول را passive و جملات معلوم را active می‌نامند."],["دلایل مجهول کردن جملات","الف) فاعل جمله کلمه مهمی نظیر people, someone, they باشد. ب) عمل انجام‌شده مهم‌تر از فاعل باشد. ج) فاعل آشکار باشد.","Someone stole my car last night. → My car was stolen last night. / The teacher has corrected the exam papers. → The exam papers have been corrected by the teacher.",""],["مراحل مجهول کردن جمله معلوم","1) شناسایی فاعل، فعل و مفعول 2) حذف فاعل 3) مفعول به اول جمله 4) زمان جمله مشخص شود 5) فعل be در شکل صرف‌شده مناسب 6) شکل سوم فعل اصلی","—",""],["مجهول در زمان‌های مختلف","حال ساده: am/is/are + pp / حال استمراری: am/is/are + being + pp / حال کامل: have/has + been + pp / گذشته ساده: was/were + pp / گذشته استمراری: was/were + being + pp / گذشته کامل: had + been + pp","The house is being cleaned at the moment. / The house has been cleaned since you left. / The house was cleaned yesterday. / The house was being cleaned last week. / The house had been cleaned before they arrived.","زمان‌های حال کامل استمراری و گذشته کامل استمراری شکل مجهول ندارند."],["مجهول در زمان‌های دیگر","شرطی گذشته: would have + been + pp / آینده ساده: will be + pp / آینده استمراری: will be + being + pp / آینده کامل: will have + been + pp","The house would have been cleaned if it had been dirty. / The house will be cleaned next week. / The house will be being cleaned tomorrow. / The house will have been cleaned.",""],["مجهول افعال Modal و مصدر","مصدر بدون to: be + pp / مصدر با to: to be + pp / مصدر ing: being + pp","The house must be cleaned before we arrive. / The students want to be taught. / The students enjoy being taught.",""],["جملات با دو مفعول","در جمله‌هایی که دو مفعول دارند، هر یک از مفعول‌ها می‌تواند به عنوان فاعل جمله مجهول انتخاب شود.","has given first aid to him. → has been given first aid (by someone). / has been given to him (by someone).",""],["تبدیل ضمایر","ضمیر مفعولی که در جایگاه فاعل قرار داده می‌شود باید به ضمیر فاعلی تبدیل شود.","me → I / you → you / her → she / him → he / it → it / us → we / them → they","He hit me with his car. → I was hit (by his car)."],["Tag Questions (سوالات ضمیمه)","سوالات کوتاهی که در پایان یک جمله آمده","He is a student, isn't he? / He is not a student, is he? / Mina was playing well, wasn't she?",""],["ساختار Tag Questions","1) سوال ضمیمه از نظر مثبت یا منفی بودن، عکس جمله اصلی است 2) ضمیر فاعلی + فعل کمکی منفی 3) ضمیر فاعلی + فعل کمکی مثبت","He is a student, isn't he? / Reza will go to Isfahan, won't he? / They were watching TV, weren't they?",""],["فعل کمکی در Tag Questions","چنانچه جمله اصلی فعل کمکی داشته باشد از همان فعل کمکی استفاده می‌شود ولی چنانچه جمله فاقد فعل کمکی باشد از do یا مشتقات آن استفاده می‌شود.","I listen to the teacher, don't I? / Ali swims in the river, doesn't he? / His father opened his store at 8, didn't he?",""],["نکات Tag Questions - ضمیر","در سوال ضمیمه همیشه بعد از فعل کمکی از ضمیر فاعلی استفاده می‌شود.","Mina was playing well, wasn't she? / My brothers aren't at school, are they?",""],["نکات Tag Questions - مخفف","در سوالات ضمیمه چنانچه بخواهیم فعل کمکی را بشکل منفی بکار بریم، آن را می‌بایست بشکیل مخفف بکار برد.","Reza will go to Isfahan, won't he? / They were watching TV, weren't they?",""],["نکات Tag Questions - I am","چنانچه در جمله‌ی مثبت از I am استفاده شده باشد در سوال ضمیمه از aren't I استفاده می‌شود.","I am a good student, aren't I?",""],["نکات Tag Questions - قید منفی","اگر در جمله اصلی قید منفی نظیر no, never, hardly, scarcely, seldom, rarely کار رفته باشد، سوال کوتاه بشکل مثبت خواهد بود.","He never eats breakfast, does he? / There is nothing in the kettle, is there?",""],["نکات Tag Questions - فاعل نامشخص","اگر فاعل جمله نا مشخص باشد: nobody, everybody, everyone, somebody, someone، در سوال کوتاه فعل و ضمیر فاعلی جمع خواهد بود.","Somebody borrowed my book yesterday, didn't they? / Nobody knows the answer, do they?",""],["نکات Tag Questions - جملات امری","در جملات امری مثبت و منفی سوال کوتاه با will you ساخته می‌شود.","Open the door, will you? / Don't turn on the radio, will you?",""],["نکات Tag Questions - Let's","جملاتی که با let's شروع می‌شوند، سوال کوتاه با shall we ساخته می‌شود.","Let's play in the yard, shall we?",""],["نکات Tag Questions - Let us","جملاتی که با let us شروع می‌شوند، سوال کوتاه با will you ساخته می‌شود.","Let us go for a swim, will you?",""],["نکات Tag Questions - few و little","کلمات few و little جمله را منفی می‌کنند. لذا باید از tag مثبت استفاده کرد.","Few people have known how to earn money, have they?",""],["نکات Tag Questions - ضمیر در tag","هیچ‌گاه در tag از اسم استفاده نمی‌کنیم و همواره از ضمیر استفاده می‌کنیم یا از کلماتی نظیر there یا one.","No one can answer this question, can he? / There is a cat in that room, isn't there? / This is your car, isn't it? / Those are your friends, aren't they?",""],["نکات Tag Questions - only","اگر در جمله خبری قید only باشد.","You have only one brother, do you? / don't you?",""],["Simple Sentence و Compound Sentence","Simple sentence: Jack opened the door. / Compound sentence: Jack opened his bag, something else distracted his attention.","حروف ربط همپایه‌ساز: for, and, nor, but, or, yet, so (FANBOYS)","Compound sentence: Jack opened his bag, stopped for a second, pulled out a pen, and started writing."],["حروف ربط - And","زمانی استفاده می‌شود که می‌خواهیم توضیحاتی جدید را به عبارت قبلی اضافه کنیم.","I go to the park every Sunday to watch the ducks on the lake and the men playing soccer. / I like tea and coffee.",""],["حروف ربط - But","زمانی استفاده می‌شود که می‌خواهیم تضاد جمله جدید با جمله پایه را نشان دهیم.","He reads magazines, but he doesn't like to read books.",""],["حروف ربط - Or","برای جایگزین کردن یا انتخاب کردن از بین گزینه‌های موجود استفاده می‌شود.","Do you like tea or coffee? / Shall we go out to the cinema or stay at home?",""],["حروف ربط - So","برای نشان دادن نتیجه یا پیامد کاری یا بیان کردن علت و معلول استفاده می‌شود.","We were bored with the movie, so we left cinema. / There are no more chairs available, so you will have to stand.",""],["حروف ربط - For","برای نشان دادن دلیل یا هدف به کار برده می‌شود.","I go to the park every Sunday, for I love to watch the ducks on the lake. / Comfort her, for he is sad.",""],["حروف ربط - Nor","زمانی به کار می‌بریم که می‌خواهیم یک ایده منفی را جایگزین عبارت منفی‌ای که از قبل در جمله وجود داشته، کنیم.","I don't go for the fresh air nor really for the ducks. / It was not my fault, nor was his. It just an accident.",""],["حروف ربط - Yet","برای نشان دادن تضاد بین دو جمله همانند but به کار برده می‌شود.","I always take a book to read, yet I never seem to turn a single page. / He is so young, yet so experienced.",""],["حروف ربط - Because","از این کلمه هنگامی استفاده می‌شود که می‌خواهیم دلیل چیزی یا کاری را توضیح دهیم.","She goes to the tennis club because she likes to play tennis. / She did not come to school, because she was ill.",""],["حروف ربط - Even","به کار برده می‌شود که بر خلاف محدودیت‌ها، موانع، مشکلات یا اتفاقات غیر منتظره، کاری را انجام دهیم.","I am going to the party, even if it rains. / She likes swimming, even in winter.",""]];
grammar[30]=[["استراتژی حمله به کلمه","استراتژی حمله به کلمه کمک می‌کند تا خواننده رمز گشایی، تلفظ و درک معنی کلمات ناآشنا را به درستی انجام دهد.","این استراتژی به خوانندگان کمک می‌کند تا با قطعه قطعه کردن کلمات ناآشنا به هرکدام از آنها از زاویه ای متفاوت حمله کنند.","رعایت اصول زیر در به کارگیری این استراتژی مفید است."],["۱) استفاده از تصاویر","یکی از مهم‌ترین استراتژی‌های درک لغات است.","سعی کنید چند حرف را در کنار هم بخوانید.",""],["۲) اتصال کلمه جدید با دانش لغوی گذشته","سعی کنید کلمه جدید را با یک کلمه که می دانید متصل کنید.","—",""],["۳) خواندن بیش از یک بار جمله","فکر کنید که چه کلمه ای ممکن است در جمله معنادار باشد.","—",""],["۴) گذر از کلمه ناآشنا","از کلمه ناآشنا بگذرید و به دنبال سرنخ ها برویید.","—",""],["۵) استفاده از دانش پیشین","در مورد آنچه که در مورد موضوع کتاب، پاراگراف یا جمله می دانید فکر کنید.","—",""],["Relative Pronouns (ضمایر موصولی)","who: فاعلی برای انسان / whom: مفعولی برای انسان / which: برای غیر انسان / what: بدون مرجع / whose: ملکی / that: برای همه / of which: ملکی برای غیر انسان","ضمایر موصولی ضمایری هستند که دارای wh می باشند و در بین دو جمله یا وسط جمله به کار می روند.","ضمایر موصولی در زبان فارسی بصورت «که» معنی می شوند."],["نکات ضمایر موصولی","1) نوع ضمیر موصولی به اسمی که به آن اشاره دارد بستگی دارد. 2) به جمله هایی که با ضمایر موصولی شروع شود جمله واره موصولی می گویند. 3) ضمیر موصولی مانند دیگر ضمایر اسم یا ضمیر قبل از خود را شرح می دهند.","—",""],["ضمیر موصولی who","از who برای اشاره به انسان و گاهی اوقات برای اشاره به حیوانات خانگی استفاده می کنیم.","I think there'd be a lot of children who'd love to have a climbing wall in school. / The woman who I saw yesterday was Sheila.",""],["کاربرد who بعنوان فاعل و مفعول","ما می توانیم از who بعنوان فاعل یا مفعول یک جمله واره موصولی استفاده کنیم.","در مثال اول bloke که فاعل جمله واره موصولی است. در مثال دوم who به woman که مفعول فعل (saw) است.",""],["حرف اضافه + who","از ضمیر موصولی who می توانیم بعنوان یک متمم حرف اضافه استفاده کنیم.","It was Cath who Ian gave the keys to. It wasn't me.","در این ساختار حرف اضافه در انتهای جمله واره موصولی واقع می‌شود."],["کاربرد who همراه با گروه های جمعی افراد","ما اغلب who را برای اسامی جمعی مانند انسان استفاده می کنیم.","Nicola phoned the fire brigade, who then alerted the police and social workers.","از who برای اشیاء استفاده نمی کنیم."],["ضمیر موصولی whom","از whom در انگلیسی رسمی یا نوشتاری استفاده می کنیم.","The man whom you met yesterday is coming to dinner.","whom به the man اشاره دارد که مفعول برای فعل met است."],["حرف اضافه + whom","رایج‌ترین کاربرد whom، استفاده از آن با حرف اضافه است.","Drama in schools is particularly good for pupils for whom English is a second language.","حرف اضافه باید قبل از whom واقع شود."],["ضمیر موصولی whose","از ضمیر موصولی whose برای اشاره به مالکیت افراد یا حیوانات استفاده می‌کنیم.","He's marrying a girl whose family don't seem to like him. / Kate, whose sister I used to share a house with, has gone to work in Australia.",""],["ضمیر موصولی which","از which در جمله واره های موصولی تعریف کننده یا غیر تعریف کننده استفاده می کنیم. جمله واره های موصولی وقتی که اشاره به کل یک جمله دارند، همیشه از which استفاده می کنیم.","You need to tick the box which says yes. / He won't have much time to prepare for the meeting, which is this afternoon.","نمی‌توان از what برای جمله واره موصولی تعریف کننده استفاده کرد."],["کاربرد which بعنوان فاعل و مفعول","از which می‌توان به عنوان فاعل و مفعول برای جمله واره موصولی استفاده کرد.","The new sports complex, which will be built on the site of the old power station, will provide facilities. / It was the same picture which I saw at the National Gallery.",""],["حرف اضافه + which","از which می‌توان بعنوان متمم حرف اضافه کرد.","Early in the Autumn Term there is a reception at which you can meet current staff and students.",""],["کاربرد which بعنوان اشاره کننده به کل یک جمله","جمله واره های موضوعی که اشاره به کل جمله دارند همیشه با which معرفی می شوند.","There's going to be a new head teacher in September, which is good. It's time for a change.",""],["ضمیر موصولی that","از that به جای who، whom و which استفاده می کنیم. That فقط برای معرفی جمله واره های تعریف کننده استفاده می‌شود.","We met somebody last night that did the speech therapy course two years after you. / The 8.30 is the train that you need to get.",""],["کاربرد that","ضمیر موصولی that می تواند بعنوان فاعل و مفعول یک جمله واره موصولی استفاده شود.","Don't take money that doesn't belong to you. / It's the same cooker that my mother has.",""],["حرف اضافه + that","ضمیر موصولی that می تواند به متمم حرف اضافه اشاره کند.","We've got some tennis balls that you can play with.",""],["نکته مهم حرف اضافه + that","بر خلاف whom, which, whose، بالفاصله قبل از that از حرف اضافه استفاده نمی‌گردد.","نادرست: We've got some tennis balls with that you can play.",""],["عبارات in that و with that","in that به معنای because / with that به معنای then میباشند.","I was fortunate in that I had good friends. / She turned off the light and with that she flounced out of the room.",""],["کاربرد that بعد از کلمات خاص","بعد از کلمات زیر و صفات عالی و اعداد ترتیبی، that استفاده می‌شود: anybody, anything, all, anyone, anywhere, somebody, something, nothing, nowhere, nobody, only","Anything that he saved was lost. / Everywhere that I go I remember his gentle face. / It was the third accident that I saw yesterday. / He was the tallest man that I had ever seen. / It was the only thing that was worth seeing.",""],["حذف ضمیر موصولی","در سبک غیررسمی انگلیسی، معمولاً ضمیر موصولی حذف می‌شود. حذف فقط در جمله واره های موصولی تعریف کننده و زمانی که ضمیر موصولی به مفعول جمله واره اشاره دارد.","German is a language which I've found hard to learn. → German is a language I've found hard to learn. / She's the singer who I heard on the radio. → She's the singer I heard on the radio.",""],["ضمایر موصولی where, when, why","در انگلیسی غیررسمی برای معرفی جمله واره موصولی به جای on which, at which, for which غالباً از where, when, why استفاده می‌شود.","I know a restaurant where the food is excellent. / There isn't a day when I don't feel rushed off my feet. / Do you know the reason why the shop is closed today?",""],["حذفیات جمله واره های موصولی","در بیشتر موارد می توان جمله واره های توصیفی را کوتاه کرده و از عبارت توصیفی استفاده کرد.","جمله واره های توصیفی ممکن است یکی از روش های زیر به عبارت توصیفی تبدیل شوند:",""],["روش ۱ حذف","چنان چه فعل جمله واره توصیفی به زمان حال استمراری یا گذشته استمراری باشد، می توان ضمیر موصولی و فعل کمکی بعد از آن را باهم از جمله حذف کرد.","Do you know the woman who is sitting in the car? → Do you know the woman sitting in the car?",""],["روش ۲ حذف","چنان چه فعل جمله واره ی توصیفی به زمان حال ساده یا گذشته ساده باشد، می توان ضمیر موصولی را حذف کرد و فعل جمله را به شکل ing دار بیان کرد.","All over the world there are people who pollute the environment. → All over the world there are people polluting the environment.",""],["روش ۳ حذف","چنان چه جمله واره ی توصیفی ساختار مجهول داشته باشد، می توان ضمیر موصولی و فعل کمکی بعد از آن را حذف کرد و قسمت سوم فعل را باقی گذارد.","The boy who was injured in the accident was taken to the hospital. → The boy injured in the accident was taken to the hospital.",""],["Second Conditional (شرطی نوع دو)","If + Past Simple, Would + Simple verb","به موقعیتی بعد یا فرضی و نتایج احتمالی‌اش اشاره دارد. این جملات بر پایه موقعیت واقعی نیستند.",""],["ساختار شرطی نوع دو","If + گذشته ساده, would (wouldn't) + مصدر بدون to","If I had more money, I would ('d) buy a new car. / If you lived in England, you would soon learn English.","با اینکه جمله دارای فرم گذشته است ولی مفهوم آن در زمان حال می‌باشد."],["مثال‌های شرطی نوع دو","If we went by bus, it would be cheaper. / If I found her address, I would send her an invitation. / If he inherited a billion dollars, he would travel to the moon.","—",""],["نکته اول شرطی نوع دو","در شرطی نوع دوم این است که شما نباید در عبارت شرط was را به کار بگیرید، لذا پس از I, He, She, It از were استفاده می‌شود.","If I were you, I would save my money. / If I were you, I wouldn't be rude to the boss.",""],["نکته دوم شرطی نوع دو","استفاده از دیگر افعال مودال: می‌توانید از افعال could و might نیز به جای فعل would استفاده کنید.","If Jack studied more, he might pass the exam. / If I won a million pounds, I could stop working.",""],["نکته مهم و کنکوری شرطی نوع دو","در صورتی که در جمله ی شرط از فعل were استفاده شود، می توان If را حذف کرده و were را به ابتدای جمله انتقال داد.","Were I rich, I would buy a house by the sea. (= if I were rich)",""],["مثال‌های بیشتر","If he needed any money, I'd lend it to him. / If I were a rich man, I'd buy an expensive car.","اگر به پول احتیاج داشت به او قرض می‌دادم. / اگر ثروتمند بودم یک ماشین گران‌قیمت می‌خریدم.",""],["Paragraph (پاراگراف)","هر متن یا مقاله از حداقل یک یا چند پاراگراف تشکیل می‌شود. پاراگراف واحد تشکیل دهنده یک متن است.","ما به هرکدام از این بخش‌ها و بسته‌های نوشته، پاراگراف می‌گوییم. خواندن نوشته‌ای که پاراگراف‌بندی نشده خسته کننده است.","هر پاراگراف در واقع ایده کمی متفاوت از پاراگراف قبلی خود را بیان می‌کند."],["ایده اصلی پاراگراف","ایده اصلی معمولاً در جمله موضوعی (topic sentence) بیان می‌شود و بقیه جملات پاراگراف به شرح، بسط و تقویت جمله موضوعی می‌پردازند.","—",""],["ظاهر یک پاراگراف","اول هر پاراگراف باید کمی از حاشیه اصلی فاصله داشته باشد (Indentation).","به این ترتیب خواننده متوجه می‌شود ایده جدیدی مطرح شده.","هنگام ترجمه یک متن، مترجم موظف است دقیقاً چیدمان پاراگراف‌بندی نویسنده را حفظ کند."],["طول یک پاراگراف","یک پاراگراف ممکن است بسیار طولانی و یا بسیار کوتاه باشد. اما اکثر پاراگراف‌ها معمولاً از سه جمله تشکیل می‌شوند و حدود ۱۰۰ تا ۲۰۰ کلمه دارند.","—",""],["سه بخش مهم برای نوشتن پاراگراف عالی","1) جمله موضوع (Topic sentence) 2) جملات پشتیبان (Supporting Sentences) 3) جمله پایانی (Concluding sentence)","ساختاری که کتاب‌های آیلتس برای یک پاراگراف بدنه پیشنهاد می‌کنند به این صورت است.",""],["جمله موضوع (Topic sentence)","به مهم‌ترین ایده پاراگراف که در قالب یک جمله بیان می‌شود جمله موضوع می‌گویند. جمله موضوع در واقع هسته اصلی پاراگراف است.","این جمله ممکن است در اول پاراگراف، در وسط پاراگراف یا در آخر پاراگراف بیان شود.",""],["چگونه یک متن را براساس پاراگراف‌ها بنویسیم؟","فرض کنید می خواهید در مورد موضوع فوتبال مطلبی بنویسید. Topic یا موضوع کلی متن شما می شود «فوتبال».","تاریخ فوتبال / مقایسه آن با دیگر ورزش ها / قوانین آن / بزرگترین فوتبالیستهای جهان","هرکدام از این جنبه های مختلف یک عنوان فرعی و یک یا چند پاراگراف را به خود اختصاص می دهند."],["مراحل نوشتن پاراگراف","ابتدا اصل مطلب را در اولین جمله پاراگراف تان بنویسید سپس شروع به شرح دادن آن کنید.","قبل از شروع مقاله و یا متن خود یک طرح کلی از آن داشته باشید و تصمیم بگیرید درباره کدام جنبه های موضوع قرار است صحبت کنید.","حتی قبل از شروع شرح پاراگراف ها بهتر است چیدمان موضوع را نیز مشخص کنید."],["تعیین چیدمان موضوع","و تصمیم بگیرید به هر کدام چقدر قرار است شاخ و برگ دهید. یعنی کلمات و جملات کلیدی هر پاراگراف یا عنوان فرعی را از قبل مشخص کنید.","۱) فوتبال اولین بار در کجا و چه زمانی بازی شد. ۲) این ورزش چگونه به کشورهای دیگر راه یافت. ۳) به مرور زمان چه تغییراتی در نحوه بازی آن رخ داد.",""],["جملات پشتیبان (Supporting sentences)","علاوه بر جمله موضوعی یک پاراگراف از جملات دیگری هم تشکیل می شود. این جملات به بسط و شرح جمله موضوعی می پردازند. به این جملات supporting sentence می گویند.","این جملات نتایج، واقعیت‌ها، مثال ها، دلایل یا آمار یا هر چیز دیگری که نشان دهد ایده شما درست است به توضیح و بحث درباره جمله تاپیک می پردازند.","یک پاراگراف همیشه یک topic sentence دارد اما تعداد supporting sentence ها معمولاً بیشتر از دو جمله است."],["جمله نتیجه‌گیری (Concluding Sentence)","یک جمله نتیجه در پاراگراف می تواند برای پایان دادن به پاراگراف راه‌بستگی استفاده شود. این جمله به خواننده نکات مهم را یادآوری می کند.","جملات نتیجه گیری اختیاری هستند و در بیشتر مواقع پاراگراف ها فاقد جملات نتیجه گیری هستند.",""],["مثال برای موارد فوق","Studying abroad (topic) has two main benefits (controlling idea).","ترجمه فارسی: تحصیل در خارج دو فایده دارد.",""],["جملات پشتیبان برای Studying Abroad","اولین ایده جمله پشتیبان People get a better job when they return home (دلیل Better qualifications and experience mean better pay and promotion / نتیجه Now has a high standard of living). دومین ایده جمله پشتیبان Students gain independence (مثال Students have to cope with the challenges of living alone and meeting new people from different cultures / نتیجه Students will become more confident in their life and relationships)","—",""]];
grammar[31]=[["خلاصه نویسی","در مورد خلاصه نویسی زبان، مطلب خاصی برای گفتن ندارم، فقط حتماً مراحل زیر را پیش از پیش از خلاصه نویسی رعایت کنید.","—",""],["۱) یادداشت برداری","برای یادداشت برداری ابتدا باید بدانید که کل کتاب درباره چه موضوعی صحبت می کند و قرار است به شما چه مطالبی را آموزش دهد.","—",""],["۲) یادداشت برداری از مطالب","برای یادداشت برداری باید مطالب را درک کنیم و سپس از استنباط خودمان شروع به نوشتن مطالب کلیدی نماییم.","—",""],["۳) یادداشت نکات پراکنده","می‌توانید یک قسمت از خلاصه‌نویسی زبان انگلیسی را به نکته‌های پراکنده اختصاص دهید.","—",""],["۴) زمان خلاصه نویسی","وقتی خلاصه نوشتید، سعی کنید حداقل هفته‌ای ۲ روز و روزی ۴۵ دقیقه خلاصه‌نویسی زبان و بخصوص لغت‌ها را مرور کنید.","—",""],["۵) معانی مختلف لغت","برای اینکه دایره لغتتان وسیع‌تر شود و لغات بیشتری را بیاموزید بهتر است بعد از نوشته خلاصه برای هر لغت سعی کنید حتماً معانی مختلف آن را بیاورید.","—",""],["۶) نمودارهای مختلف","از نمودارهای مختلف در نوشته‌های خود استفاده کنید. از نمودارهای خطی، زنجیری و پله‌ای بیشتر برای یادداشت‌هایی استفاده کنید که یا رابطه علت و معلولی دارند یا تقدم و تأخر آنها مهم است.","—",""],["۷) اصل اساسی","اصل اساسی در هر گونه یادداشت برداری حذف توضیحات اضافی و اهمیت سنجی مطالب است. برای این منظور باید اصل و فرع مطالب را از هم تشخیص دهید.","—",""],["۸) تمرین خلاصه نویسی","یکی از راه‌های موفقیت، یادداشت خلاصه برداری کردن از روی هاست برای این کار تمرین خلاصه نویسی کنید.","—",""],["۹) هدفمند بودن","بخاطر داشته باشید که هر گونه یادداشت برداری باید هدفمند باشد. یعنی پاسخگوی نیازی یا جوابگوی سوالی باشد.","—",""],["۱۰) قابل حمل بودن","یادداشت‌هایتان را به گونه ای ترتیب دهید که قابل حمل باشد و به سهولت بتواند مورد استفاده قرار گیرد.","—",""],["۱۱) اوراق جداگانه","بهترین وضعیت برای یادداشت برداری آن است که آنها را روی اوراقی جداگانه و بهم پیوسته بنویسیم.","—",""],["۱۲) منبع یادگیری","به طور کلی خلاصه نویسی مهم‌ترین منبع یادگیری می باشد زیرا می‌توانید همیشه خلاصه درس خود را به همراه داشته باشید.","—",""],["۱۳) ساختار درختی","یادگیری زبان انگلیسی دغدغه بسیاری از ماست پس سعی کنید کلمات مهم را بزرگتر یا با خودکار رنگی بنویسید و بین موضوعات اصلی و فرعی را به کمک ساختار درختی نمایش دهید.","—",""],["۱۴) مفهومی شدن","سوالات و تست‌ها به سمت مفهومی شدن حرکت می‌کنند پس همه مطالب خوانده شود.","—",""],["۱۵) مرور","تکرار در فواصل زمانی مشخص باعث ذخیره در حافظه موقت و انتقال آن به حافظه دائمی می‌شود.","—",""],["ضرب المثل‌های کتاب‌های زبان انگلیسی","The early bird catches the first worm. / Better be alone than in bad company / Fall from a frying pan into the fire / Actions speak louder than words / A word is enough to the wise","—",""],["ضرب المثل‌های بیشتر","Don't teach your grandmother to suck eggs / Art is long, life is short / Clothes do not make the man / God never sends mouths but He sends meat / Stretch your leg according to your coverlet / Knowledge is the power / A golden key opens every door / There is something in the wind / A fox without tail wants others too without / God helps those who help themselves / Friends may meet, but mountains never greet / The end makes all equal / A blind man's wife needs no paint / An idle brain is the devil's workshop / The best fish swim near the bottom / Habit is second nature / Too many cooks, spoil the broth / Absence makes the heart grow fonder / There is a time to speak and a time to be silent / Never judge a book with its cover / Any port in a storm / Union is strength / Travel broadens the mind / An ass is but an ass, though laden with gold / Charity begins at home / Practice makes perfect / Birds of a feather flock together / Easy come easy go / Two heads are better than one / Don't count your chickens before they hatch / Out of sight out of mind / Cut your coat according to your cloth / A burnt child dreads the fire / Kill two birds with a stone / Don't look a gift horse in the mouth / Money doesn't grow on trees / There is no place like home / A friend in need is a friend indeed / No gain, no pain","—",""],["مجهول کردن افعال Modal","زمانی که بخواهیم جمله دارای افعال مدال را مجهول کنیم فقط کافی است: 1) شناسایی فاعل، فعل و مفعول جمله معلوم 2) حذف فاعل و آوردن مفعول به اول جمله 3) اضافه نمودن be به افعال مدال موجود در جمله 4) فعل اصلی جمله را به P.P تبدیل می‌کنیم.","—",""],["Past Perfect Tense (ماضی بعید)","زمان گذشته کامل یا ماضی بعید یکی از زمان‌های ۱۲ گانه اصلی در زبان انگلیسی است.","—",""],["ساختار ماضی بعید","فعل این زمان با استفاده از فعل کمکی had و قسمت سوم فعل past participle ساخته می‌شود.","—",""],["کلمات ربطی ماضی بعید","کلمات ربطی که بیشتر در این زمان استفاده می‌شوند عبارتند از: When / Before / Because / As soon as / After","—",""],["جدول زمان گذشته کامل","جملات مثبت: They had practiced together before they gave the concert. / جملات منفی: They hadn't practiced together before they gave the concert. / جملات سوالی: Had they practiced together before they gave the concert?","—",""],["کاربردهای ماضی بعید - الف","برای بیان عمل یا کاری که در گذشته قبل از عمل دیگری اتفاق افتاده باشد از گذشته کامل (ماضی بعید) استفاده می‌شود که نیازمند دو عمل است.","When my little baby brother got up, I had eaten my breakfast. / My mother had gone shopping before she started cooking dinner.",""],["نکته ۱ ماضی بعید","اگر دو عمل در گذشته پشت سر هم یا با فاصله کوتاهی انجام شده باشند هر دو عمل به شکل گذشته ساده بیان می‌شوند و اگر عملی در گذشته قبل از عمل دیگر با فاصله انجام شده باشد از گذشته بعید استفاده می‌شود.","When I arrived at the airport, the plane had landed. / When I arrived at the airport, the plane landed.",""],["نکته ۲ ماضی بعید","اگر چندین عمل در گذشته با فاصله کم یا یکی پس از دیگری اتفاق افتاده باشد از گذشته ساده استفاده می‌کنیم نه ماضی بعید.","I arrived home at 1:30, ate my lunch, took a nap, and did my homework.",""],["کاربرد ب ماضی بعید","برای بیان عمل یا حالتی که در گذشته شروع شده و تا انجام دادن عمل دیگر در گذشته ادامه داشته است.","My teacher had lived in Paris before he studied art there. / By the time his uncle got a very good job, he had taken many risks.",""],["کاربرد ج ماضی بعید","برای بیان عمل یا حالتی که در زمان مشخص در گذشته اتفاق افتاده است علاوه بر گذشته ساده از ماضی بعید نیز می‌توان استفاده کرد.","I sent an email on October 7th before she asked me on October 10th. / I had sent an email on October 7th before she asked me on October 10th.",""],["نکته ۳ ماضی بعید","اما اگر ماضی بعید به انجام دادن عملی در گذشته در زمانی مشخص اشاره نکند، نمی‌توان از آن استفاده کرد.","نادرست: He never drove a car before he got his driving license. درست: He had never driven a car before he got his driving license.",""],["صرف فعل در زمان ماضی بعید","جملات مثبت خبری: I had gone to the cinema before 8. / جملات منفی: I had not / hadn't gone to the cinema before 8. / جملات سوالی: Had I gone to the cinema before 8?","—",""],["مثال‌های بیشتر ماضی بعید","After she'd gone home, she turned on the TV. / Her father hadn't had a day off for weeks. / The teacher didn't check our homework until everyone had arrived. / I'd been a professional chess player before my friend gave me a chess set.","—",""],["Contractions ماضی بعید","منفی: I hadn't, You hadn't, He hadn't, She hadn't, It hadn't, We hadn't, They hadn't / مثبت: I'd, You'd, He'd, She'd, It'd, We'd, They'd","—",""]];

    {title:"First impressions — Socializing 101",lines:[
      {who:"Article",text:"Whether you are an extrovert or an introvert, one thing is certain: Almost everyone experiences some degree of stress when it comes to being sociable in new situations. The next time you're out and about, try one of these tips to help you become better at socializing."},
      {who:"Article",text:"Smile! One of the easiest and most effective ways to be more sociable is to smile. When you strike up a conversation, a warm smile will make you seem more approachable and friendly."},
      {who:"Article",text:"When you cross your arms in front of you while standing or you cross your legs while sitting, you are literally keeping people at a distance. Try to keep an open, relaxed position."},
      {who:"Article",text:"Having a conversation is a two-way street. Ask engaging questions, and then really listen to what your conversation partner says."}

    {title:"A late night",lines:[

      {who:"Phil",text:"No... I just stayed home. That's all."},

function gregorianToJalali(gy,gm,gd){ 
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334]; 
  let jy=(gy<=1600)?0:979; 
  gy-=(gy<=1600)?621:1600; 
  let gy2=(gm>2)?(gy+1):gy; 
  let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g_d_m[gm-1]; 
  jy+=33*Math.floor(days/12053); 
  days%=12053; 
  jy+=4*Math.floor(days/1461); 
  days%=1461; 
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365} 
  let jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30); 
  let jd=1+((days<186)?(days%31):((days-186)%30)); 
  return [jy,jm,jd]; 
}
function getTodayJalali(){ const now=new Date(); return gregorianToJalali(now.getFullYear(),now.getMonth()+1,now.getDate()); }

async function studentLogin(){ 
  const phone=document.getElementById("phone").value.trim(); 
  const password=document.getElementById("pass").value; 
  if(!phone||!password){toast("شماره تلفن و رمز عبور را وارد کنید.","error");return} 
  try{ 
    const result=await accessFunction({action:"find",phone}); 
    const student=result.student,email=result.email; 
    if(!student)throw new Error("زبان‌آموزی با این شماره پیدا نشد."); 
    if(student.status==="rejected")throw new Error("ثبت‌نام شما توسط مدیر رد شده است."); 
    if(!email)throw new Error("ایمیل ورود زبان‌آموز پیدا نشد."); 
    const auth=await db.auth.signInWithPassword({email:String(email).trim(),password}); 
    if(auth.error)throw new Error("رمز عبور صحیح نیست."); 
    S.student=student;S.admin=false; 
    await loadStudentStats(); 
    await loadUnlocks(); 
    loadStreak();loadGameRecords(); 
    await loadQAs(); 
    await loadHomeworks(); 
    toast("خوش آمدی "+student.first_name+" 👋","success"); 
    home(); 
  }catch(e){toast(e?.message||"ورود ناموفق بود.","error")} 
}
async function adminLogin(){ 
  const email=document.getElementById("email").value.trim(); 
  const password=document.getElementById("pass").value; 
  if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){toast("ایمیل مدیر صحیح نیست.","error");return} 
  if(!password){toast("رمز عبور را وارد کنید.","error");return} 
  try{ 
    const r=await db.auth.signInWithPassword({email:ADMIN_EMAIL,password}); 
    if(r.error)throw r.error; 
    S.admin=true;S.student=null; 
    toast("به پنل مدیریت خوش آمدید 👨‍💼","success"); 
    admin(); 
  }catch(e){toast("ورود مدیر ناموفق بود: "+e.message,"error")} 
}
function registerForm(){ 
  document.getElementById("lf").innerHTML=`<h3>ثبت‌نام زبان‌آموز جدید</h3><label>نام</label><input id="rf"><label>نام خانوادگی</label><input id="rl"><label>شماره تلفن</label><input id="rp" inputmode="tel"><label>رمز عبور</label><input id="rpass" type="password"><label>پایه / سطح</label><select id="rlevel"><option value="">انتخاب پایه</option><option value="7">پایه هفتم</option><option value="8">پایه هشتم</option><option value="9">پایه نهم</option><option value="10">پایه دهم</option><option value="11">پایه یازدهم</option><option value="12">پایه دوازدهم</option></select><label>کد معرف (اختیاری)</label><input id="rref" placeholder="مثال: AN1234"><button class="btn full" onclick="register()">ثبت‌نام</button><button class="btn secondary full" style="margin-top:10px" onclick="login()">بازگشت</button>`; 
}
async function register(){ 
  const first=document.getElementById("rf").value.trim(); 
  const last=document.getElementById("rl").value.trim(); 
  const phone=document.getElementById("rp").value.trim(); 
  const password=document.getElementById("rpass").value; 
  const level=document.getElementById("rlevel").value; 
  const refCode=document.getElementById("rref").value.trim(); 
  if(!first||!last||!phone||!password||!level){toast("همه موارد را تکمیل کنید.","error");return} 
  if(password.length<6){toast("رمز عبور باید حداقل ۶ کاراکتر باشد.","error");return} 
  const digits=normalizePhone(phone); 
  if(digits.length<10){toast("شماره تلفن معتبر نیست.","error");return} 
  const email=digits+"@alinagheli.com"; 
  try{ 
    const r=await db.auth.signUp({email,password,options:{data:{first_name:first,last_name:last,phone,level,referred_by:refCode||null}}}); 
    if(r.error)throw r.error; 
    if(!r.data.user)throw new Error("حساب کاربری ساخته نشد."); 
    await accessFunction({action:"register",first_name:first,last_name:last,phone,level,auth_user_id:r.data.user.id,email,referred_by:refCode||null}); 
    if(refCode){ 
      try{ 
        const cur=Number(localStorage.getItem("AN_REF_COUNT_"+refCode)||0); 
        localStorage.setItem("AN_REF_COUNT_"+refCode,String(cur+1)); 
      }catch(e){} 
    } 
    /* ✅ ورود خودکار بعد از ثبت‌نام - بدون نیاز به تأیید مدیر */
    toast("ثبت‌نام انجام شد! در حال ورود به برنامه...","success",4000); 
    setTimeout(async ()=>{
      try{
        await db.auth.signOut();
      }catch(_){}
      studentLogin();
    }, 1200);
    /* اطلاعات ورود را موقتاً در فیلدها قرار می‌دهیم */
    setTimeout(()=>{
      const phoneEl = document.getElementById("phone");
      const passEl = document.getElementById("pass");
      if(phoneEl) phoneEl.value = phone;
      if(passEl) passEl.value = password;
    }, 600);
  }catch(e){try{await db.auth.signOut()}catch(_){}toast("ثبت‌نام انجام نشد: "+(e?.message||"خطای نامشخص"),"error",5000)} 
}

    `).join("");
  }
  if(currentTSTab==="vocab"){

        ${d.lines.map((l,idx)=>`
          <div class="dlgLine ${idx%2===0?"dlgA":"dlgB"}">
            <span class="spk">${esc(l.who)}:</span>${esc(l.text)}
          </div>
        `).join("")}
        ${d.fa?`<div class="dlgFa">📝 ${esc(d.fa)}</div>`:""}
      </div>
    `).join("");
  }
  if(currentTSTab==="summary"){
    if(!ls.summary||!ls.summary.length) return '<p class="muted">خلاصه‌ای برای این درس ثبت نشده.</p>';

      <h4>📝 خلاصه درس ${currentTSLesson+1}: ${esc(ls.title)}</h4>
      <ul>${ls.summary.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
    </div>`;
  }
  if(currentTSTab==="quiz"){
    if(!ls.quiz||!ls.quiz.length) return '<p class="muted">آزمونی برای این درس ثبت نشده.</p>';
    const shuffledQuiz = shuffleQuestionOptions(ls.quiz);
    return `<div class="tsQuizBox" id="tsQuizContainer">

          </div>
        `).join("")}
      </div>
      <div id="tsQuizResult" style="margin-top:14px;text-align:center;font-weight:800;font-size:16px;color:var(--primary)"></div>
      <button class="btn full" style="margin-top:12px" onclick="resetTSQuiz()">🔄 شروع مجدد آزمون</button>
    </div>`;
  }
  return "";
}

function answerTSQuiz(qi, oi, correct, btn){
  if(tsQuizAnswered[qi]) return;
  tsQuizAnswered[qi] = true;
  const parent = btn.parentElement;
  const buttons = parent.querySelectorAll(".tsQuizOpt");
  buttons.forEach(b=>b.disabled=true);
  if(oi===correct){ 
    btn.classList.add("correct"); 
    btn.textContent = "✅ " + btn.textContent;
  } else { 
    btn.classList.add("wrong"); 
    btn.textContent = "❌ " + btn.textContent;
    buttons[correct].classList.add("correct");
    buttons[correct].textContent = "✅ " + buttons[correct].textContent;
  }
  const ls = tsData[currentTSBook][currentTSLesson];
  const total = ls.quiz.length;
  const answered = Object.keys(tsQuizAnswered).length;
  if(answered >= total){
    const rEl = document.getElementById("tsQuizResult");
    if(rEl){
      let totalCorrect = 0;
      ls.quiz.forEach((q,idx)=>{ 
        if(tsQuizAnswered[idx]){ 
          const p = document.querySelector(`.tsQuizQ[data-q="${idx}"]`); 
          if(p && p.querySelector(".tsQuizOpt.correct") && !p.querySelector(".tsQuizOpt.wrong")) totalCorrect++; 
        } 
      });
      const percent = Math.round((totalCorrect/total)*100);
      rEl.textContent = `🎉 نتیجه: ${totalCorrect} از ${total} (${percent}%)`;
      if(S.student && percent>=50){ addXP(Math.max(5, Math.round(percent/5))); }
    }
  }
}

  tsQuizAnswered = {};

function setTSTab(tab,ev){
  currentTSTab = tab;
  const ls = tsData[currentTSBook][currentTSLesson];
