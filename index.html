*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f3ff;
color:#171717;
padding-bottom:82px;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.header{
background:linear-gradient(135deg,#4c1d95,#7c3aed,#a855f7);
color:#fff;padding:15px;position:sticky;top:0;z-index:100;
box-shadow:0 3px 15px #0002
}
.headerIn{
max-width:1100px;margin:auto;display:flex;
justify-content:space-between;align-items:center;gap:10px
}
.logo{font-size:20px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:15px}
.card{
background:#fff;border-radius:22px;padding:20px;margin-bottom:15px;
box-shadow:0 5px 25px #0000000d
}
.hero{
background:linear-gradient(135deg,#312e81,#7c3aed,#a855f7);
color:#fff;border-radius:25px;padding:28px;margin-bottom:15px;
box-shadow:0 15px 35px #6d28d944
}
.grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px
}
.item{
background:#fff;border:1px solid #e5e7eb;border-radius:20px;
padding:18px;transition:.2s
}
.item:hover{transform:translateY(-3px);box-shadow:0 10px 25px #6d28d933}
.icon{font-size:40px}
.btn{
background:#6d28d9;color:#fff;border:0;border-radius:13px;
padding:12px 16px;font-weight:bold
}
.btn.full{width:100%}
.secondary{background:#ede9fe;color:#5b21b6}
.success{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#991b1b}
.warning{background:#fef3c7;color:#92400e}
.login{
min-height:100vh;background:linear-gradient(135deg,#2e1065,#7c3aed,#a855f7);
display:flex;justify-content:center;align-items:center;padding:20px
}
.loginCard{
background:#fff;width:min(430px,100%);padding:25px;border-radius:28px;
box-shadow:0 20px 60px #0004
}
label{display:block;margin:9px 0 5px;font-size:13px;font-weight:bold}
input,select,textarea{
width:100%;border:1px solid #ddd6fe;background:#faf9ff;
border-radius:13px;padding:12px;outline:none
}
textarea{min-height:110px;resize:vertical}
.tabs{display:flex;gap:8px;margin:15px 0}
.tab{
flex:1;border:0;border-radius:12px;padding:12px;
background:#eee8f7;color:#543b70
}
.tab.active{background:#6d28d9;color:#fff}
.msg{
display:none;padding:12px;border-radius:13px;margin:10px 0;
font-size:13px;line-height:1.9
}
.msg.show{display:block}
.msg.err{background:#fee2e2;color:#991b1b}
.msg.ok{background:#dcfce7;color:#166534}
.muted{font-size:12px;color:#777;line-height:1.9}
.bottom{
position:fixed;bottom:0;left:0;right:0;background:#fff;
border-top:1px solid #e5e7eb;z-index:200;box-shadow:0 -5px 20px #0000000d
}
.bottomIn{
max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)
}
.nav{
border:0;background:#fff;padding:9px 3px;font-size:11px;color:#666;
display:flex;flex-direction:column;align-items:center;gap:3px
}
.nav b{font-size:21px}
.nav.active{color:#6d28d9;font-weight:bold}
.badge{
display:inline-block;padding:7px 11px;margin:3px;border-radius:20px;
font-size:11px;font-weight:bold
}
.badge.waiting{background:#fff7ed;color:#9a3412}
.badge.registered{background:#dcfce7;color:#166534}
.badge.rejected{background:#fee2e2;color:#991b1b}
.badge.graduate{background:#dbeafe;color:#1e40af}
.teacher{
display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px
}
.teacherBox{
background:linear-gradient(135deg,#faf5ff,#fff);
border:1px solid #e9d5ff;border-radius:22px;padding:20px;line-height:2
}
.teacherAvatar{
width:90px;height:90px;border-radius:50%;display:flex;
align-items:center;justify-content:center;font-size:48px;
background:#ede9fe;margin:auto
}
.lessonGrid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px
}
.lesson{
background:#fff;border:1px solid #e5e7eb;border-radius:18px;
padding:17px;cursor:pointer;transition:.2s
}
.lesson:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0000000d}
.lessonNo{
width:40px;height:40px;border-radius:50%;background:#ede9fe;color:#6d28d9;
display:grid;place-items:center;font-weight:bold;margin-bottom:8px
}
.wordGrid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px
}
.word{
border:1px solid #e9d5ff;background:#faf5ff;border-radius:15px;
padding:13px;cursor:pointer;text-align:center
}
.word .en{font-weight:bold;color:#6d28d9;direction:ltr}
.word .fa{font-size:12px;color:#777;margin-top:5px}
.grammar{
background:#faf9ff;border:1px solid #e9d5ff;border-radius:16px;
padding:14px;margin:10px 0
}
.example{
background:#ede9fe;border-radius:12px;padding:10px;
direction:ltr;text-align:left;font-weight:bold
}
.quizCard{
background:#fff;border-radius:22px;padding:20px;
box-shadow:0 8px 30px #0000000d
}
.quizOption{
display:block;width:100%;border:1px solid #ddd6fe;background:#fff;
border-radius:14px;padding:14px;margin:9px 0;text-align:right
}
.quizOption.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.quizOption.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.quizOption.disabled{pointer-events:none}
.progress{
height:9px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0
}
.progress i{
display:block;height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7)
}
.score{
font-size:55px;color:#6d28d9;font-weight:bold;text-align:center
}
.examRow{
border:1px solid #e5e7eb;border-radius:15px;padding:14px;margin:8px 0
}
.examScore{font-size:25px;font-weight:bold;color:#6d28d9}
.profileStat{
background:#faf9ff;border:1px solid #e9d5ff;border-radius:18px;
padding:15px;text-align:center
}
.profileStat b{display:block;font-size:27px;color:#6d28d9;margin-top:5px}
.adminRow{
border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:9px 0
}
.notice{
padding:13px;border-radius:13px;background:#fff7ed;color:#9a3412;
font-size:13px;line-height:1.8;margin-bottom:12px
}
.call{
display:block;text-decoration:none;text-align:center;margin:12px 0
}
.page{display:none}
.page.active{display:block}
.small{font-size:12px}
.center{text-align:center}
.adminHeader{
background:linear-gradient(135deg,#111827,#4c1d95);
color:#fff;border-radius:24px;padding:25px;margin-bottom:15px
}
.statusDot{
width:10px;height:10px;border-radius:50%;display:inline-block;
background:#22c55e;margin-left:5px
}
.statBig{font-size:30px;font-weight:bold;color:#6d28d9}
.search{

@media(max-width:600px){
.container{padding:10px}
.card{padding:16px;border-radius:18px}
.hero{padding:20px}
.nav{font-size:9px}
.nav b{font-size:18px}
}
</style>

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ACCESS_FUNCTION=SUPABASE_URL+"/functions/v1/student-access";

let S={
 student:null,
 admin:false,
 grade:null,
 lesson:null,
 xp:0,
 level:1,
 progress:{},
 achievements:[],
 exams:[]
};

let currentExam=[];
let examIndex=0;
let examCorrect=0;
let examAnswered=false;

let examRecords=[];
try{
 examRecords=JSON.parse(localStorage.getItem("AN_EXAMS")||"[]");
}catch(e){examRecords=[]}

function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function normalizePhone(x){
 let p=String(x||"").trim().replace(/\s+/g,"");
 if(p.startsWith("+98"))p="0"+p.slice(3);
 if(p.startsWith("98")&&p.length===12)p="0"+p.slice(2);
 return p.replace(/\D/g,"");
}

function emailFor(phone){
 return normalizePhone(phone)+"@alinagheli.com";
}

function saveLocal(){
 try{
  localStorage.setItem("AN_EXAMS",JSON.stringify(examRecords));
 }catch(e){}
}

function speak(text){
 if(!window.speechSynthesis){
  alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
  return;
 }
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";
 u.rate=.75;
 speechSynthesis.resume();
 speechSynthesis.speak(u);
}

function statusBadge(status){
 const s=String(status||"").toLowerCase();
 let cls="waiting";
 let txt="در انتظار بررسی";
 if(s==="registered"||s==="approved"){
  cls="registered";txt="تأیید شده";
 }
 if(s==="rejected"){
  cls="rejected";txt="رد شده";
 }
 if(s==="graduate"){
  cls="graduate";txt="فارغ‌التحصیل";
 }
 return `<span class="badge ${cls}">${txt}</span>`;
}

function msg(text,type="err"){
 const el=document.getElementById("loginMsg");
 if(!el)return;
 el.className="msg show "+type;
 el.textContent=text;
}

function accessFunction(payload){
 return fetch(ACCESS_FUNCTION,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "apikey":SUPABASE_KEY
  },
  body:JSON.stringify(payload)
 }).then(async r=>{
  let data=null;
  try{data=await r.json()}catch(e){}
  if(!r.ok||data?.ok===false){
   throw new Error(data?.error||"خطا در ارتباط با سرور.");
  }
  return data;
 });
}

async function loginStudent(){
 const phone=normalizePhone(document.getElementById("studentPhone")?.value);
 const password=document.getElementById("studentPassword")?.value||"";

 if(!/^09\d{9}$/.test(phone)){
  msg("شماره موبایل معتبر نیست.");
  return;
 }

 if(!password){
  msg("رمز عبور را وارد کنید.");
  return;
 }

 try{
  const info=await accessFunction({
   action:"find",
   phone
  });

  const student=info?.student||info?.data||info;

  if(!student||!student.id){
   throw new Error("زبان‌آموزی با این شماره پیدا نشد.");
  }

  const email=student.email||emailFor(phone);

  const {data,error}=await db.auth.signInWithPassword({
   email,
   password
  });

  if(error)throw error;

  if(!data?.user)throw new Error("ورود انجام نشد.");

  const {data:profile,error:profileError}=await db
   .from("students")
   .select("*")
   .eq("auth_user_id",data.user.id)
   .maybeSingle();

  if(profileError)throw profileError;

  if(!profile){
   await db.auth.signOut();
   throw new Error("پروفایل زبان‌آموز پیدا نشد.");
  }

  S.student=profile;
  S.admin=false;

  await loadStudentData();
  renderStudent();
 }catch(e){
 console.error(e);
 msg(e?.message||"ورود زبان‌آموز ناموفق بود.");
 }
}

async function loginAdmin(){
 const email=(document.getElementById("adminEmail")?.value||"")
  .trim().toLowerCase();

 const password=document.getElementById("adminPassword")?.value||"";

 if(!email||!password){
  msg("ایمیل و رمز عبور مدیر را وارد کنید.");
  return;
 }

 try{
  const {data,error}=await db.auth.signInWithPassword({
   email,
   password
  });

  if(error)throw error;

  const user=data?.user;

  if(!user){
   throw new Error("حساب مدیر پیدا نشد.");
  }

  /*
   مهم:
   جدول admins در پروژه شما email ندارد.
   احراز هویت از auth.users انجام می‌شود
   و سپس user_id / auth_user_id بررسی می‌شود.
  */

  const {data:admin,error:adminError}=await db
   .from("admins")
   .select("id,user_id,auth_user_id,created_at")
   .or(`user_id.eq.${user.id},auth_user_id.eq.${user.id}`)
   .maybeSingle();

  if(adminError)throw adminError;

  if(!admin){
   await db.auth.signOut();
   throw new Error("این حساب دسترسی مدیر ندارد.");
  }

  S.student=null;
  S.admin=true;

  await loadAdminData();
  renderAdmin();

 }catch(e){
 console.error("ADMIN LOGIN ERROR:",e);

 try{
  await db.auth.signOut();
 }catch(_){}

 msg(
  e?.message==="Invalid login credentials"
   ? "ایمیل یا رمز عبور مدیر صحیح نیست."
   : (e?.message||"ورود مدیر ناموفق بود.")
 );
 }
}

async function loadStudentData(){

 if(!S.student)return;

 try{
  const {data}=await db
   .from("student_xp")
   .select("*")
   .eq("student_id",S.student.id)
   .maybeSingle();

  if(data){
   S.xp=Number(data.xp||0);
   S.level=Number(data.level||1);
  }
 }catch(e){}

 try{
  const {data}=await db
   .from("student_progress")
   .select("*")
   .eq("student_id",S.student.id);

  if(data){
   S.progress={};
   data.forEach(x=>{
    S.progress[x.lesson_id||x.lesson||x.id]=x;
   });
  }
 }catch(e){}

 try{
  const {data}=await db
   .from("student_achievements")
   .select("*")
   .eq("student_id",S.student.id);

  S.achievements=data||[];
 }catch(e){}

 try{
  const {data}=await db
   .from("exam_results")
   .select("*")
   .eq("user_id",(await db.auth.getUser()).data.user?.id)
   .order("created_at",{ascending:false});

  S.exams=data||[];
 }catch(e){}
}

/* =========================
   EXAM
========================= */

function runExam(n){
 const qs=[...(questionBank[n]||[])];

 currentExam=qs;
 examIndex=0;
 examCorrect=0;
 examAnswered=false;

 openPage("gradePage");

 document.getElementById("gradeExam").classList.remove("hidden");
 document.getElementById("gradeLessons").classList.add("hidden");
 document.getElementById("gradeVocab").classList.add("hidden");
 document.getElementById("gradeGrammar").classList.add("hidden");

 renderExamQuestion(n);
}

function renderExamQuestion(n){
 const area=document.getElementById("gradeExam");

 if(examIndex>=currentExam.length){
  finishExam(n);
  return;
 }

 const q=currentExam[examIndex];

 area.innerHTML=`
 <div class="quizCard">
  <div class="muted">
   سؤال ${examIndex+1} از ${currentExam.length}
  </div>

  <div class="progress">
   <i style="width:${(examIndex/currentExam.length)*100}%"></i>
  </div>

  <h3 dir="ltr" style="text-align:left">
   ${esc(q[0])}
  </h3>

  ${q[1].map((o,j)=>`
   <button class="quizOption"
    onclick="answerExam(${n},${j})">
    ${esc(o)}
   </button>
  `).join("")}
 </div>
 `;
}

function answerExam(n,j){
 if(examAnswered)return;

 examAnswered=true;

 const q=currentExam[examIndex];
 const buttons=document.querySelectorAll("#gradeExam .quizOption");

 buttons.forEach((b,i)=>{
  b.classList.add("disabled");
  if(i===q[2])b.classList.add("correct");
 });

 if(j!==q[2]){
  buttons[j]?.classList.add("wrong");
 }else{
  examCorrect++;
 }

 setTimeout(()=>{
  examIndex++;
  examAnswered=false;
  renderExamQuestion(n);
 },650);
}

async function finishExam(n){
 const total=currentExam.length;
 const score=Math.round((examCorrect/total)*100);

 examRecords.unshift({
  id:Date.now(),
  studentId:S.student?.id||null,
  grade:n,
  type:"grade",
  correct:examCorrect,
  total,
  score,
  createdAt:new Date().toISOString()
 });

 saveLocal();

 await addXP(Math.max(5,examCorrect*5));

 document.getElementById("gradeExam").innerHTML=`
 <div class="resultBox">
  <div class="score">${score}</div>
  <h2 class="center">نتیجه آزمون</h2>
  <p class="center">
   ${examCorrect} پاسخ صحیح از ${total}
  </p>
  <button class="btn full" onclick="openGrade(${n})">
   بازگشت به دوره
  </button>
  <button class="btn secondary full" style="margin-top:8px"
   onclick="renderRecords()">
   مشاهده رکوردها
  </button>
 </div>
 `;

 saveExamToSupabase(n,examCorrect,total,score);
}


/* =========================
   100 QUESTION COMPETITION
========================= */

function makeCompetitionQuestions(){
 const all=[];

 Object.keys(questionBank).forEach(g=>{
  questionBank[g].forEach(q=>{
   all.push({...q,grade:Number(g)});
  });
 });

 const result=[];

 for(let i=0;i<100;i++){
  const q=all[i%all.length];

  result.push([
   q[0],
   [...q[1]],
   q[2]
  ]);
 }

 return result;
}

function startCompetition(){
 currentExam=makeCompetitionQuestions();
 examIndex=0;
 examCorrect=0;
 examAnswered=false;

 openPage("competitionPage");
 renderCompetition();
}

function renderCompetition(){
 const area=document.getElementById("competitionArea");

 if(examIndex>=currentExam.length){
  finishCompetition();
  return;
 }

 const q=currentExam[examIndex];

 area.innerHTML=`
 <div class="quizCard">
  <div class="muted">سؤال ${examIndex+1} از 100</div>

  <div class="progress">
   <i style="width:${examIndex}%"></i>
  </div>

  <h3 dir="ltr" style="text-align:left">${esc(q[0])}</h3>

  ${q[1].map((o,j)=>`
   <button class="quizOption"
    onclick="answerCompetition(${j})">
    ${esc(o)}
   </button>
  `).join("")}
 </div>
 `;
}

function answerCompetition(j){
 if(examAnswered)return;

 examAnswered=true;

 const q=currentExam[examIndex];
 const buttons=document.querySelectorAll("#competitionArea .quizOption");

 buttons.forEach((b,i)=>{
  b.classList.add("disabled");
  if(i===q[2])b.classList.add("correct");
 });

 if(j===q[2])examCorrect++;
 else buttons[j]?.classList.add("wrong");

 setTimeout(()=>{
  examIndex++;
  examAnswered=false;
  renderCompetition();
 },350);
}

async function finishCompetition(){

 const score=examCorrect;

 examRecords.unshift({
  id:Date.now(),
  studentId:S.student?.id||null,
  grade:"7-12",
  type:"competition",
  correct:examCorrect,
  total:100,
  score,

 });

 document.getElementById("competitionArea").innerHTML=`
 <div class="resultBox">

  <h2 class="center">🏆 مسابقه تمام شد!</h2>

function renderLevelQuestion(){

 if(examIndex>=currentExam.length){

 <div class="quizCard">

function answerLevel(j){

 const q=currentExam[examIndex];

 buttons.forEach((b,i)=>{
  b.classList.add("disabled");
  if(i===q[2])b.classList.add("correct");

 if(j===q[2])examCorrect++;
 else buttons[j]?.classList.add("wrong");

function finishLevelTest(){

/* =========================
   XP
========================= */

async function addXP(amount){

 S.xp=Number(S.xp||0)+Number(amount||0);
 S.level=Math.max(1,Math.floor(S.xp/100)+1);

 if(!S.student?.id)return;

 try{
  await db.from("student_xp").upsert({
   student_id:S.student.id,
   xp:S.xp,
   level:S.level
  },{
   onConflict:"student_id"
  });
 }catch(e){
  console.warn("XP save failed",e);
 }
}

async function sendTeacherRequest(){

  alert("ابتدا وارد شوید.");
  return;
 }

 const requestedDate=document.getElementById("reqDate")?.value||null;
 const requestedTime=document.getElementById("reqTime")?.value||"";
 const classType=document.getElementById("reqType")?.value||"خصوصی";
 const note=document.getElementById("reqNote")?.value||"";

 if(!requestedDate){
  alert("تاریخ را انتخاب کنید.");
  return;
 }

 try{

  const {error}=await db.from("teacher_requests").insert({
   student_id:S.student.id,
   teacher_name:"Ali Nagheli",
   requested_date:requestedDate,
   requested_time:requestedTime,
   class_type:classType,
   note
  });

  if(error)throw error;

  alert("درخواست شما با موفقیت ارسال شد.");

  document.getElementById("reqNote").value="";

  loadMyRequests();

 }catch(e){
 console.error(e);
 alert(e?.message||"ارسال درخواست ناموفق بود.");
 }
}

async function loadMyRequests(){

 if(!S.student?.id)return;

 try{

  const {data,error}=await db
   .from("teacher_requests")
   .select("*")
   .eq("student_id",S.student.id)
   .order("created_at",{ascending:false});

  if(error)throw error;

  document.getElementById("myRequests").innerHTML=`
   <div class="card">
    <h3>📋 درخواست‌های من</h3>

    ${(data||[]).map(r=>`

 }catch(e){
 console.warn(e);
 }
}

    </button>

async function approveStudent(id){

 try{

  const {error}=await db
   .from("students")
   .update({status:"registered"})
   .eq("id",id);

  if(error)throw error;

  await loadAdminData();
  renderAdmin();

 }catch(e){
 alert(e?.message||"تأیید ناموفق بود.");
 }
}

async function rejectStudent(id){

 if(!confirm("این درخواست رد و زبان‌آموز حذف شود؟"))return;

 try{

  const {error}=await db
   .from("students")
   .delete()
   .eq("id",id);

  if(error)throw error;

  await loadAdminData();
  renderAdmin();

 }catch(e){
 alert(e?.message||"عملیات ناموفق بود.");
 }
}

async function updateRequest(id,status){

 try{

  const response=
   status==="approved"
    ?"درخواست شما تأیید شد."
    :"درخواست شما رد شد.";

  const {error}=await db
   .from("teacher_requests")
   .update({
    status,
    response
   })
   .eq("id",id);

  if(error)throw error;

  await loadAdminData();
  renderAdmin();

 }catch(e){
 alert(e?.message||"عملیات ناموفق بود.");
 }
}

   LOGOUT
========================= */

async function logout(){

 try{
  await db.auth.signOut();
 }catch(e){}

 S={
  student:null,
  admin:false,
  grade:null,
  lesson:null,
  xp:0,
  level:1,
  progress:{},
  achievements:[],
  exams:[]
 };

 renderLogin();

/* =========================
   SESSION RESTORE
========================= */

async function restoreSession(){

 try{

  const {data:{session}}=await db.auth.getSession();

  if(!session){
   renderLogin();
   return;
  }

  const user=session.user;

  const {data:admin}=await db
   .from("admins")
   .select("id,user_id,auth_user_id,created_at")
   .or(`user_id.eq.${user.id},auth_user_id.eq.${user.id}`)
   .maybeSingle();

  if(admin){
   S.admin=true;
   await loadAdminData();
   renderAdmin();
   return;
  }

  const {data:student}=await db
   .from("students")
   .select("*")
   .eq("auth_user_id",user.id)
   .maybeSingle();

  if(student){
   S.student=student;
   S.admin=false;
   await loadStudentData();
   renderStudent();
   return;
  }

  await db.auth.signOut();
  renderLogin();

 }catch(e){
 console.error("restore:",e);
 renderLogin();
 }
}


/* =========================
   START
========================= */

db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){
  if(!S.admin&&!S.student)renderLogin();
 }
});

restoreSession();
