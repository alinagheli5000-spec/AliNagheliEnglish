/* =========================================================
   توابع پایه

function $(id){return document.getElementById(id)}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function phone(v){
return String(v||"").replace(/\D/g,"").replace(/^98/,"0");
}

function toast(t){
const x=$("toast");
x.textContent=t;
x.classList.remove("hidden");
clearTimeout(window.__toast);
window.__toast=setTimeout(()=>x.classList.add("hidden"),3000);
}

function modal(html){
$("modalBox").innerHTML=html;
$("modal").classList.remove("hidden");

/* =========================================================
   تلفظ
========================================================= */

function speak(word){

if(!window.speechSynthesis){
toast("مرورگر از تلفظ صوتی پشتیبانی نمی‌کند");
return;
}

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(word);
u.lang="en-US";
u.rate=.72;
u.pitch=1;

const voices=speechSynthesis.getVoices();
const v=voices.find(x=>/^en-US$/i.test(x.lang))||
voices.find(x=>/^en/i.test(x.lang));

if(v)u.voice=v;

speechSynthesis.speak(u);
}

function speechButtons(){
document.querySelectorAll(".speak").forEach(b=>{
b.onclick=()=>speak(b.dataset.word);
});
}

function grammar(lesson){

const data={
"to be / Subject Pronouns":`
<p><b>ضمیرهای فاعلی</b> نشان می‌دهند چه کسی کار یا حالت را دارد.</p>
<p>I با <b>am</b>، مفرد سوم شخص با <b>is</b> و you/we/they با <b>are</b> می‌آیند.</p>
<div class="example">I am Iranian.<br>من ایرانی هستم.</div>
<div class="example">She is my classmate.<br>او همکلاسی من است.</div>
<div class="example">They are students.<br>آن‌ها دانش‌آموز هستند.</div>`,

"Possessive Adjectives / this / that":`
<p>برای نشان دادن مالکیت از my, your, his, her, our و their استفاده می‌کنیم.</p>
<div class="example">This is my book.</div>
<div class="example">That is her bag.</div>
<p>برای چیز نزدیک معمولاً <b>this</b> و برای چیز دور <b>that</b> به کار می‌رود.</p>`,

"How old / Numbers / Dates":`
<p>برای پرسیدن سن از <b>How old are you?</b> استفاده می‌کنیم.</p>
<div class="example">How old are you?<br>I am thirteen years old.</div>
<p>برای تاریخ تولد می‌توانیم بگوییم:</p>
<div class="example">My birthday is in March.</div>`,

"Have / Has":`
<p>برای بیان داشتن، در زمان حال از <b>have</b> و <b>has</b> استفاده می‌کنیم.</p>
<p>I/you/we/they → have<br>he/she/it → has</p>
<div class="example">I have two brothers.</div>
<div class="example">She has a sister.</div>`,

"Adjectives / Have got":`
<p>صفت برای توصیف افراد و اشیا استفاده می‌شود.</p>
<div class="example">He is tall.</div>
<div class="example">She has got long hair.</div>
<p>در جمله‌های توصیفی، صفت معمولاً بعد از فعل be می‌آید.</p>`,

"There is / There are / Present Continuous":`
<p><b>There is</b> برای یک چیز و <b>There are</b> برای چند چیز استفاده می‌شود.</p>
<div class="example">There is a kitchen in the house.</div>
<div class="example">There are two bedrooms.</div>
<p>برای کاری که همین الان در حال انجام است از Present Continuous استفاده می‌کنیم.</p>
<div class="example">She is cooking.</div>`,

"Prepositions of Place / Telling Time":`
<p>حروف اضافه مکان مانند <b>in, on, under, next to, between</b> محل اشیا را نشان می‌دهند.</p>
<div class="example">The book is on the table.</div>
<p>برای ساعت از ساختارهای مختلف مانند <b>o'clock</b> استفاده می‌کنیم.</p>
<div class="example">It is seven o'clock.</div>`,

"Like / Would like / Suggestions":`
<p>برای بیان علاقه می‌توانیم از <b>like</b> استفاده کنیم.</p>
<div class="example">I like rice.</div>
<p>برای درخواست مؤدبانه از <b>would like</b> استفاده می‌شود.</p>
<div class="example">I would like some juice.</div>
<p>برای پیشنهاد دادن می‌توانیم بگوییم:</p>
<div class="example">Why don't we eat?</div>`,

"Simple Present / time expressions":`
<p>Simple Present برای عادت‌ها و کارهای تکراری استفاده می‌شود.</p>
<div class="example">I go to school every day.</div>
<div class="example">She studies English on Mondays.</div>
<p>عبارت‌هایی مثل every day, usually و sometimes با این زمان بسیار رایج‌اند.</p>`,

"can / can't":`
<p>از <b>can</b> برای توانایی و از <b>can't</b> برای ناتوانی استفاده می‌کنیم.</p>
<div class="example">I can swim.</div>
<div class="example">She can't ride a bicycle.</div>
<p>بعد از can فعل به شکل ساده می‌آید.</p>`,

"have got / should / shouldn't":`
<p>برای بیان مشکل سلامتی می‌توانیم از <b>have got</b> استفاده کنیم.</p>
<div class="example">I've got a headache.</div>
<p>برای توصیه از <b>should</b> و برای توصیه منفی از <b>shouldn't</b> استفاده می‌کنیم.</p>
<div class="example">You should see a doctor.</div>`,

"There is / There are":`
<p>برای معرفی مکان‌ها و چیزهای موجود در شهر از There is و There are استفاده می‌کنیم.</p>
<div class="example">There is a museum in the city.</div>
<div class="example">There are many parks.</div>`,

"Gerunds after like / enjoy":`
<p>بعد از افعالی مانند <b>like</b> و <b>enjoy</b> می‌توانیم از فعل ing استفاده کنیم.</p>
<div class="example">I enjoy reading.</div>
<div class="example">She likes playing chess.</div>`,

"Present Simple / be + adjective":`
<p>برای توصیف شخصیت از فعل be همراه صفت استفاده می‌کنیم.</p>
<div class="example">Ali is helpful.</div>
<div class="example">Sara is hardworking.</div>
<p>برای عادت‌ها و رفتارهای تکراری از Simple Present استفاده می‌کنیم.</p>`,

"Present Continuous for future / travel expressions":`
<p>Present Continuous می‌تواند برای برنامه قطعی آینده نیز استفاده شود.</p>
<div class="example">We are traveling tomorrow.</div>
<p>عبارت‌هایی مانند go on a trip, buy a ticket و stay at a hotel برای صحبت درباره سفر کاربرد دارند.</p>`,

"Simple Present / adverbs of frequency":`
<p>برای کارهای همیشگی و مراسم تکرارشونده از Simple Present استفاده می‌کنیم.</p>
<div class="example">People celebrate this festival every year.</div>
<p>قیدهایی مثل usually, always و sometimes میزان تکرار را نشان می‌دهند.</p>`,

"Can / Could / requests":`
<p>برای درخواست می‌توانیم از <b>Can</b> و شکل مؤدبانه‌تر <b>Could</b> استفاده کنیم.</p>
<div class="example">Can you help me?</div>
<div class="example">Could you help me, please?</div>`,

"Past Simple / question forms":`
<p>Past Simple برای کارهایی است که در گذشته اتفاق افتاده‌اند.</p>
<div class="example">I watched the news yesterday.</div>
<p>برای سؤال از did استفاده می‌کنیم و فعل اصلی به شکل ساده برمی‌گردد.</p>
<div class="example">Did you watch TV?</div>`,

"should / must / have to":`
<p>should برای توصیه و must/have to برای ضرورت استفاده می‌شوند.</p>
<div class="example">You should exercise.</div>
<div class="example">You must wear a helmet.</div>`,

"Future with will / be going to":`
<p>در Vision 1 برای صحبت درباره آینده، دو ساختار مهم <b>will</b> و <b>be going to</b> مطرح می‌شوند.</p>
<div class="example">We will protect nature.</div>
<div class="example">We are going to plant trees.</div>
<p>will برای تصمیم یا پیش‌بینی و be going to برای برنامه یا قصد استفاده می‌شود.</p>`,

"Adjectives / comparative / superlative":`
<p>صفت‌ها برای توصیف اسم‌ها استفاده می‌شوند.</p>
<div class="example">This is a beautiful place.</div>
<p>برای مقایسه دو چیز از comparative استفاده می‌کنیم:</p>
<div class="example">This river is longer than that one.</div>
<p>برای نشان دادن بالاترین درجه در یک گروه از superlative استفاده می‌کنیم.</p>
<div class="example">This is the largest lake.</div>`,

"Past Progressive / Reflexive Pronouns":`
<p>Past Progressive برای کاری است که در زمان مشخصی در گذشته در حال انجام بوده است.</p>
<div class="example">I was studying at eight.</div>
<p>ضمیرهای reflexive مانند myself, yourself و himself به فاعل برمی‌گردند.</p>`,

"Modals / Prepositions / Adverbs":`
<p>افعال modal مانند can, should و must برای توانایی، توصیه و ضرورت استفاده می‌شوند.</p>
<div class="example">You must have a passport.</div>
<div class="example">You should visit this place.</div>`,

"Present Perfect":`
<p>Present Perfect با have/has و قسمت سوم فعل ساخته می‌شود.</p>
<div class="example">I have visited Tehran.</div>
<div class="example">She has learned English.</div>
<p>این زمان معمولاً برای تجربه یا کاری که ارتباطی با زمان حال دارد استفاده می‌شود.</p>`,

"Present Perfect / health expressions":`
<p>برای صحبت درباره تجربه‌ها یا تغییرات مرتبط با سلامت می‌توان از Present Perfect استفاده کرد.</p>
<div class="example">I have started exercising.</div>
<div class="example">She has changed her diet.</div>`,

"Passive Voice / artistic expressions":`
<p>در Passive تمرکز روی کاری است که انجام شده، نه لزوماً انجام‌دهنده.</p>
<div class="example">The painting was created by a famous artist.</div>
<p>ساختار کلی در زمان‌های مختلف تغییر می‌کند، اما فعل be و past participle نقش اصلی دارند.</p>`,

"Passive Voice / Tag Questions":`
<p>Passive Voice برای تمرکز روی نتیجه یا چیزی که روی آن کاری انجام شده استفاده می‌شود.</p>
<div class="example">The parents are respected.</div>
<p>Tag question یک سؤال کوتاه در پایان جمله است.</p>
<div class="example">She is kind, isn't she?</div>`,

"Relative Clauses / Conditional Type II":`
<p>Relative clauses برای توضیح بیشتر درباره یک اسم استفاده می‌شوند.</p>
<div class="example">The book that I bought is useful.</div>
<p>Conditional Type II برای موقعیت فرضی یا غیرواقعی استفاده می‌شود.</p>
<div class="example">If I had more time, I would read more.</div>`,

"Passive with Modals / Past Perfect":`
<p>Modal + passive با modal و be + past participle ساخته می‌شود.</p>
<div class="example">Solar energy can be used.</div>
<p>Past Perfect برای کاری است که قبل از کار دیگری در گذشته اتفاق افتاده است.</p>
<div class="example">The sun had set before we arrived.</div>`
};

return `<div class="grammar"><h3>📚 گرامر</h3>${data[lesson]||`
<p>در این بخش ساختارهای اصلی درس را مرحله‌به‌مرحله یاد می‌گیریم.</p>
<div class="example">Practice makes progress.</div>`}</div>`;
}

async function studentLogin(){

const p=phone($("loginPhone").value);
const pass=$("loginPassword").value;

if(!p||!pass){
toast("شماره موبایل و رمز عبور را وارد کنید");
return;
}

const r=await supabaseClient.auth.signInWithPassword({
email:p+"@alinagheli.local",
password:pass
});

if(r.error){
toast("اطلاعات ورود صحیح نیست");
return;
}

currentUser=r.data.user;

const s=await supabaseClient
.from("students")
.select("*")
.eq("auth_user_id",currentUser.id)
.maybeSingle();

if(s.error||!s.data){
await supabaseClient.auth.signOut();
toast("اطلاعات زبان‌آموز پیدا نشد");
return;
}

if(s.data.status!=="registered"){
await supabaseClient.auth.signOut();
toast(
s.data.status==="waiting"
?"ثبت‌نام شما هنوز توسط مدیر تأیید نشده است"
:"درخواست ثبت‌نام شما رد شده است"
);
return;
}

currentStudent=s.data;
$("welcomeText").textContent=
`سلام ${currentStudent.first_name||""} عزیز 🌷`;

studentPage();
navigate("home");
}

/* =========================================================
   آزمون
========================================================= */

function startTest(questions,title,target){

currentTest={
questions,
title,
target,
score:0,
answered:0,
finished:false
};

const box=$(target);

box.innerHTML=questions.map((q,i)=>`
<div class="q" data-done="0">
<b>${i+1}. ${esc(q.q)}</b>
${q.a.map((a,j)=>`
<button class="opt answer"
data-q="${i}" data-o="${j}">
${esc(a)}
</button>
`).join("")}
</div>
`).join("");

box.querySelectorAll(".answer").forEach(btn=>{
btn.onclick=()=>answer(btn);
});
}

function answer(btn){

const box=btn.closest(".q");

if(box.dataset.done==="1")return;

box.dataset.done="1";

const qi=Number(btn.dataset.q);
const oi=Number(btn.dataset.o);
const q=currentTest.questions[qi];
const opts=box.querySelectorAll(".opt");

opts.forEach(x=>x.disabled=true);

if(oi===q.c){
currentTest.score++;
btn.classList.add("ok");
btn.innerHTML="✓ "+btn.innerHTML;
feedback(true);
}else{
btn.classList.add("bad");
btn.innerHTML="✕ "+btn.innerHTML;
opts[q.c].classList.add("ok");
feedback(false);
}

currentTest.answered++;

if(currentTest.answered===currentTest.questions.length){
finishTest();
}
}

function feedback(correct){

const x=document.createElement("div");
x.className="feedback";
x.innerHTML=correct
?"🎉<b>آفرین! پاسخ درست است ✓</b>"
:"😢<b>پاسخ اشتباه است ✕</b>";

document.body.appendChild(x);
setTimeout(()=>x.remove(),1000);
}

async function finishTest(){

if(currentTest.finished)return;

currentTest.finished=true;

const percent=Math.round(
currentTest.score/currentTest.questions.length*100
);

$(currentTest.target).insertAdjacentHTML("beforeend",`
<div class="result">
<h2>🎉 آزمون تمام شد</h2>
<div class="percent">${percent}%</div>
<p>${currentTest.score} پاسخ صحیح از ${currentTest.questions.length}</p>
</div>
`);

await saveRecord("آزمون",currentTest.title,percent);
}

function competition(){

const groups=[
["7","هفتمی‌ها","🎒"],
["8","هشتمی‌ها","📘"],
["9","نهمی‌ها","📗"],
["10","دهمی‌ها","📕"],
["11","یازدهمی‌ها","📙"],
["12","دوازدهمی‌ها","📚"],
["conversation","مکالمه","🗣️"]
];

$("studentContent").innerHTML=`
<div class="card">
<h2>🏆 مسابقات</h2>
<p>۲۰ سؤال • از آسان به سخت • پاسخ غلط نمره منفی دارد.</p>

${groups.map(g=>`
<button class="lesson comp" data-group="${g[0]}" data-name="${g[1]}">
<span>
<span class="num">${g[2]}</span>
<b>مسابقه ${g[1]}</b>
<small>۲۰ سؤال تستی</small>
</span>
<b>›</b>
</button>
`).join("")}
</div>
`;

document.querySelectorAll(".comp").forEach(x=>{
x.onclick=()=>startCompetition(x.dataset.group,x.dataset.name);
});
}

function startCompetition(group,name){

let all=[];

if(group==="conversation"){
all=lessonQuestions({
title:"My Week",
topic:"Conversation",
grammar:"Simple Present / time expressions"
});
}else{
const b=schoolBooks[group];
b.lessons.forEach(l=>{
all.push(...lessonQuestions(l).slice(0,4));
});
}

all=all.slice(0,20);

$("studentContent").innerHTML=`
<div class="card">
<button class="btn light" id="back">← مسابقات</button>
<h2>🏆 مسابقه ${esc(name)}</h2>
<p>هر پاسخ صحیح +۱ و هر پاسخ غلط −۰٫۲۵</p>
<div id="competitionTest"></div>
</div>
`;

$("back").onclick=competition;

currentCompetition={
questions:all,
name,
score:0,
answered:0,
finished:false
};

const box=$("competitionTest");

box.innerHTML=all.map((q,i)=>`
<div class="q" data-done="0">
<b>${i+1}. ${esc(q.q)}</b>
${q.a.map((a,j)=>`
<button class="opt canswer" data-q="${i}" data-o="${j}">
${esc(a)}
</button>
`).join("")}
</div>
`).join("");

box.querySelectorAll(".canswer").forEach(btn=>{
btn.onclick=()=>competitionAnswer(btn);
});
}

function competitionAnswer(btn){

const box=btn.closest(".q");

if(box.dataset.done==="1")return;

box.dataset.done="1";

const qi=Number(btn.dataset.q);
const oi=Number(btn.dataset.o);
const q=currentCompetition.questions[qi];
const opts=box.querySelectorAll(".opt");

opts.forEach(x=>x.disabled=true);

if(oi===q.c){
currentCompetition.score+=1;
btn.classList.add("ok");
btn.innerHTML="✓ "+btn.innerHTML;
feedback(true);
}else{
currentCompetition.score-=.25;
btn.classList.add("bad");
btn.innerHTML="✕ "+btn.innerHTML;
opts[q.c].classList.add("ok");
feedback(false);
}

currentCompetition.answered++;

if(currentCompetition.answered===currentCompetition.questions.length){
finishCompetition();
}
}

async function finishCompetition(){

if(currentCompetition.finished)return;

currentCompetition.finished=true;

const percent=Math.max(
0,
Math.round(currentCompetition.score/20*100)
);

$("competitionTest").insertAdjacentHTML("beforeend",`
<div class="result">
<h2>🏆 نتیجه نهایی</h2>
<div class="percent">${percent}%</div>
<p>امتیاز: ${currentCompetition.score.toFixed(2)} از ۲۰</p>
<div class="rank">🥇 نفر اول <b>رتبه‌بندی</b></div>
<div class="rank">🥈 نفر دوم <b>رتبه‌بندی</b></div>
<div class="rank">🥉 نفر سوم <b>رتبه‌بندی</b></div>
</div>
`);

await saveRecord(
"مسابقه",
`مسابقه ${currentCompetition.name}`,
percent
);
}

========================================================= */

async function restore(){

const r=await supabaseClient.auth.getSession();
const session=r.data?.session;

if(!session){
loginPage();
return;
}

currentUser=session.user;

if(currentUser.email===ADMIN_EMAIL){
adminPage();
renderAdmin();
return;
}

const s=await supabaseClient
.from("students")
.select("*")
.eq("auth_user_id",currentUser.id)
.maybeSingle();

if(s.data?.status==="registered"){

currentStudent=s.data;

$("welcomeText").textContent=
`سلام ${currentStudent.first_name||""} عزیز 🌷`;

studentPage();
navigate("home");

}else{
await supabaseClient.auth.signOut();
loginPage();
}
}


/* =========================================================
   شروع
========================================================= */

loginPage();
restore();
