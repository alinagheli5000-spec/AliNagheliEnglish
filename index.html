<!-- Supabase: fallback-safe loading -->
<script>
(function(){
  var sources=[
    "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ];
  function load(i){
    if(i>=sources.length)return;
    var s=document.createElement("script");
    s.src=sources[i];
    s.onload=function(){window.dispatchEvent(new Event("supabase-loaded"));};
    s.onerror=function(){load(i+1);};
    document.head.appendChild(s);
  }
  load(0);
})();
</script>

<style>
*{box-sizing:border-box}
:root{
--primary:#6d28d9;
--primary2:#8b5cf6;
--bg:#f6f5ff;
--card:#fff;
--text:#17122b;
--muted:#716b84;
--green:#16a34a;
--red:#dc2626;
--gold:#f59e0b;
--shadow:0 10px 30px rgba(58,31,116,.12)
}
body{
margin:0;
background:linear-gradient(135deg,#f8f5ff,#eee8ff);
color:var(--text);
font-family:Tahoma,Arial,sans-serif;
min-height:100vh
}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:1100px;margin:auto;min-height:100vh}
header{
background:linear-gradient(135deg,#4c1d95,#7c3aed,#a78bfa);
color:#fff;padding:18px 18px 24px;
border-radius:0 0 30px 30px;
box-shadow:var(--shadow)
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:25px;font-weight:900}
.header-sub{font-size:12px;opacity:.85;margin-top:4px}
.icon-btn{
border:0;background:rgba(255,255,255,.18);color:#fff;
width:42px;height:42px;border-radius:14px;font-size:20px
}
main{padding:18px 14px 95px}
.card{
background:var(--card);border-radius:22px;padding:18px;
box-shadow:var(--shadow);margin-bottom:15px
}
.hero{background:linear-gradient(135deg,#fff,#f3edff);border:1px solid #e8ddff}
h1,h2,h3{margin-top:0}
.muted{color:var(--muted);font-size:13px;line-height:1.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.course-card{
border:0;border-radius:22px;padding:18px 12px;
min-height:145px;color:#fff;
background:linear-gradient(145deg,#6d28d9,#9333ea);
box-shadow:0 10px 22px rgba(109,40,217,.2);

}
.course-card:hover{transform:translateY(-3px)}
.course-icon{font-size:42px;margin-bottom:8px}
.course-title{font-size:18px;font-weight:900}
.course-sub{font-size:11px;opacity:.85;margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 3px 12px}
.section-title h2{font-size:19px;margin:0}
.badge{
display:inline-flex;padding:5px 9px;border-radius:99px;
background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:bold
}
.btn{
border:0;border-radius:14px;padding:11px 15px;font-weight:bold;
background:var(--primary);color:#fff
}
.btn.secondary{background:#ede9fe;color:#5b21b6}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.gray{background:#eeeef2;color:#333}
.btn.full{width:100%}
input,select{
width:100%;padding:13px;border:1px solid #ddd6fe;
border-radius:13px;background:#fff;outline:none
}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;margin-bottom:6px;font-weight:bold}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.nav{
position:fixed;bottom:0;left:50%;transform:translateX(-50%);
width:min(1100px,100%);background:#fff;
display:grid;grid-template-columns:repeat(5,1fr);
padding:8px 6px calc(8px + env(safe-area-inset-bottom));
box-shadow:0 -8px 25px rgba(0,0,0,.12);z-index:100
}
.nav button{
border:0;background:none;color:#777;padding:6px 2px;font-size:11px
}
.nav button.active{color:var(--primary);font-weight:900}
.nav-icon{display:block;font-size:22px;margin-bottom:3px}
.lesson-list{display:grid;gap:10px}
.lesson-btn{
border:1px solid #e5def8;background:#fff;border-radius:18px;
padding:15px;text-align:right;display:flex;align-items:center;
justify-content:space-between;width:100%
}
.lesson-left{display:flex;align-items:center;gap:11px}
.lesson-num{
width:38px;height:38px;border-radius:12px;background:#ede9fe;
color:#5b21b6;display:flex;align-items:center;justify-content:center;font-weight:900
}
.vocab-row{
display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;
padding:11px 0
}
.speaker{
width:39px;height:39px;border:0;border-radius:12px;
background:#ede9fe;color:#5b21b6;font-size:18px
}
.vocab-en{font-weight:900;direction:ltr;text-align:left}
.vocab-fa{font-size:12px;color:var(--muted)}
.grammar-box{
background:#faf8ff;border-right:4px solid var(--primary);
padding:15px;border-radius:14px;line-height:2;margin:10px 0
}
.example{
background:#fff;border:1px solid #e7e0f5;
border-radius:13px;padding:10px;margin:7px 0;
direction:ltr;text-align:left
}
.question{
background:#fff;border-radius:18px;padding:16px;
border:1px solid #e1daf0;margin-bottom:12px
}
.option{
width:100%;text-align:right;border:1px solid #ddd6fe;
background:#fff;padding:12px;border-radius:12px;margin-top:8px
}
.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.result{
text-align:center;padding:25px;border-radius:22px;
background:linear-gradient(135deg,#ede9fe,#fff)
}
.score{font-size:48px;font-weight:900;color:var(--primary)}
.teacher{
text-align:center;padding:22px;border-radius:22px;
background:linear-gradient(135deg,#faf7ff,#eee7ff);
border:1px solid #e5d9ff;margin-bottom:15px
}
.teacher-avatar{
width:85px;height:85px;border-radius:50%;margin:auto;
display:flex;align-items:center;justify-content:center;
font-size:35px;background:linear-gradient(135deg,#6d28d9,#c084fc);color:#fff
}
.phone{
display:inline-block;color:#5b21b6;font-weight:900;
text-decoration:none;direction:ltr;margin-top:8px
}
.status{padding:5px 8px;border-radius:99px;font-size:10px;font-weight:bold}
.status.waiting{background:#fef3c7;color:#92400e}
.status.registered{background:#dcfce7;color:#166534}
.status.rejected{background:#fee2e2;color:#991b1b}
.admin-table{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;font-size:12px}
th{background:#f5f3ff}
.toast{
position:fixed;top:18px;left:50%;transform:translateX(-50%);
z-index:999;background:#181229;color:#fff;padding:12px 18px;
border-radius:13px;box-shadow:var(--shadow);font-size:13px
}
.modal{
position:fixed;inset:0;background:rgba(20,10,40,.55);
z-index:500;display:flex;align-items:center;justify-content:center;padding:15px
}
.modal-box{
width:min(650px,100%);max-height:90vh;overflow:auto;
background:#fff;border-radius:25px;padding:20px
}
.close{
float:left;border:0;background:#eee;width:38px;height:38px;border-radius:12px
}
@media(max-width:600px){
.form-grid{grid-template-columns:1fr}
.course-card{min-height:125px}
}
</style>
</head>

<body>

<header>
<div class="header-row">

<header>
<div class="header-row">
<div>

</div>

<script>
"use strict";

/* =====================================================
   CONFIG
===================================================== */

const SUPABASE_URL =
"https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const ADMIN_EMAIL =
"alinagheli@gmail.com";

let sb=null;
let currentUser=null;
let currentStudent=null;
let currentPage="home";


/* =====================================================
   SAFE SUPABASE INITIALIZATION
===================================================== */

function initSupabase(){

if(!window.supabase){
showToast("در حال اتصال به سامانه...");
return false;
}

try{
sb=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);
return true;
}catch(e){
console.error(e);
showToast("خطا در اتصال به سامانه");
return false;
}
}

window.addEventListener(
"supabase-loaded",
initSupabase
);

setTimeout(initSupabase,1500);


/* =====================================================
   HELPERS
===================================================== */

function $(id){
return document.getElementById(id);
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function showToast(message){
const t=$("toast");
if(!t)return;
t.textContent=message;
t.classList.remove("hidden");
clearTimeout(window.toastTimer);
window.toastTimer=setTimeout(
()=>t.classList.add("hidden"),
3000
);
}

function openModal(html){
$("modalContent").innerHTML=html;
$("modal").classList.remove("hidden");
}

function closeModal(){
$("modal").classList.add("hidden");
}

function waitForSupabase(){
return new Promise(resolve=>{
if(sb)return resolve(true);
let tries=0;
const timer=setInterval(()=>{
if(sb){
clearInterval(timer);
resolve(true);
}
if(++tries>40){
clearInterval(timer);
resolve(false);
}
},100);
});
}


/* =====================================================
   REGISTER
===================================================== */

function showRegister(){

openModal(`
<button class="close" onclick="closeModal()">×</button>
<h2>📝 ثبت‌نام زبان‌آموز جدید</h2>

<div class="form-grid">

<div class="form-group">
<label>نام</label>
<input id="regFirst" placeholder="نام">
</div>

<div class="form-group">
<label>نام خانوادگی</label>
<input id="regLast" placeholder="نام خانوادگی">
</div>

<div class="form-group">
<label>شماره موبایل</label>
<input id="regPhone" placeholder="0914...">
</div>

<div class="form-group">
<label>پایه</label>
<select id="regLevel">
<option value="7">هفتم</option>
<option value="8">هشتم</option>
<option value="9">نهم</option>
<option value="10">دهم</option>
<option value="11">یازدهم</option>
<option value="12">دوازدهم</option>
</select>
</div>

<div class="form-group">
<label>رمز عبور</label>
<input id="regPassword" type="password">
</div>

</div>

<button class="btn green full" onclick="registerStudent()">
ثبت درخواست ثبت‌نام
</button>
`);
}

async function registerStudent(){

if(!await waitForSupabase()){
showToast("اتصال به سامانه برقرار نیست");
return;
}

const first=$("regFirst").value.trim();
const last=$("regLast").value.trim();
const phone=$("regPhone").value.trim();
const level=$("regLevel").value;
const password=$("regPassword").value;

if(!first||!last||!phone||!password){
showToast("همه اطلاعات را وارد کنید");
return;
}

const email=phone+"@alinagheli.local";

const {data,error}=await sb.auth.signUp({
email,
password,
options:{
data:{
first_name:first,
last_name:last,
phone,
level
}
}
});

if(error){
showToast(error.message);
return;
}

if(data.user){

const {error:dbError}=await sb
.from("students")
.insert({
first_name:first,
last_name:last,
phone,
level,
status:"waiting",
auth_user_id:data.user.id,
password_created:true
});

if(dbError){
console.error(dbError);
showToast("حساب ساخته شد اما ثبت اطلاعات کامل نشد");
}else{
showToast("درخواست شما با موفقیت ثبت شد");
closeModal();
}
}
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

if(!await waitForSupabase()){
showToast("اتصال به سامانه برقرار نیست");
return;
}

const identifier=$("loginIdentifier").value.trim();
const password=$("loginPassword").value;

if(!identifier||!password){
showToast("اطلاعات ورود را وارد کنید");
return;
}

let email=identifier;

if(/^\d{10,12}$/.test(identifier)){
email=identifier+"@alinagheli.local";
}

const {data,error}=await sb.auth.signInWithPassword({
email,
password
});

if(error){
showToast("شماره موبایل/ایمیل یا رمز عبور صحیح نیست");
return;
}

currentUser=data.user;

const {data:student,error:studentError}=await sb
.from("students")
.select("*")
.eq("auth_user_id",currentUser.id)
.maybeSingle();

if(studentError){
showToast("خطا در دریافت اطلاعات زبان‌آموز");
return;
}

if(!student){
showToast("اطلاعات زبان‌آموز پیدا نشد");
await sb.auth.signOut();
return;
}

if(student.status==="waiting"){
showToast("حساب شما هنوز توسط مدیر تأیید نشده است");
await sb.auth.signOut();
return;
}

if(student.status==="rejected"){
showToast("درخواست ثبت‌نام شما رد شده است");
await sb.auth.signOut();
return;
}

currentStudent=student;

showApp();
navigate("home");
}


/* =====================================================
   ADMIN
===================================================== */

function showAdminLogin(){

openModal(`
<button class="close" onclick="closeModal()">×</button>
<h2>👨‍💼 ورود مدیر</h2>

<div class="form-group">
<label>ایمیل مدیر</label>
<input id="adminEmail"
value="${ADMIN_EMAIL}"
readonly>
</div>

<div class="form-group">
<label>رمز عبور</label>
<input id="adminPassword" type="password">
</div>

<button class="btn full" onclick="adminLogin()">
ورود به پنل مدیریت
</button>
`);
}

async function adminLogin(){

if(!await waitForSupabase()){
showToast("اتصال به سامانه برقرار نیست");
return;
}

const password=$("adminPassword").value;

if(!password){
showToast("رمز عبور را وارد کنید");
return;
}

const {data,error}=await sb.auth.signInWithPassword({
email:ADMIN_EMAIL,
password
});

if(error){
showToast("رمز عبور مدیر صحیح نیست");
return;
}

if(data.user.email!==ADMIN_EMAIL){
await sb.auth.signOut();
showToast("دسترسی مدیر مجاز نیست");
return;
}

currentUser=data.user;

closeModal();

$("loginPage").classList.add("hidden");
$("appPage").classList.add("hidden");
$("adminPage").classList.remove("hidden");

renderAdmin();
}

async function renderAdmin(){

const root=$("adminContent");

root.innerHTML=`
<div class="card">
<h2>👨‍💼 پنل مدیریت</h2>
<p class="muted">مدیریت درخواست‌های ثبت‌نام زبان‌آموزان</p>
<div id="adminStudents">
<div class="loading">در حال دریافت اطلاعات...</div>
</div>
</div>
`;

await loadAdminStudents();
}

async function loadAdminStudents(){

const root=$("adminStudents");

const {data,error}=await sb
.from("students")
.select("*")
.order("id",{ascending:false});

if(error){
root.innerHTML=`
<div class="card">
<p>خطا در دریافت زبان‌آموزان.</p>
<button class="btn" onclick="loadAdminStudents()">تلاش مجدد</button>
</div>`;
return;
}

if(!data||!data.length){
root.innerHTML=`
<div class="card">
<h3>📭 زبان‌آموزی وجود ندارد</h3>
<p class="muted">درخواست‌های ثبت‌نام جدید اینجا نمایش داده می‌شوند.</p>
</div>`;
return;
}

root.innerHTML=`
<div class="admin-table">
<table>
<thead>
<tr>
<th>نام</th>
<th>موبایل</th>
<th>پایه</th>
<th>وضعیت</th>
<th>عملیات</th>
</tr>
</thead>

<tbody>

${data.map(s=>`

<tr>

<td>
${esc(s.first_name)} ${esc(s.last_name)}
</td>

<td>
<a class="phone"
href="tel:${esc(s.phone)}">
${esc(s.phone)}
</a>
</td>

<td>${esc(s.level)}</td>

<td>
<span class="status ${esc(s.status)}">
${s.status==="waiting"?"در انتظار":s.status==="registered"?"تأیید شده":"رد شده"}
</span>
</td>

<td>

${
s.status==="waiting"
?`
<button class="btn green"
onclick="approveStudent('${esc(s.id)}')">
تأیید
</button>

<button class="btn red"
onclick="rejectStudent('${esc(s.id)}')">
رد
</button>
`
:"—"
}

</td>

</tr>

`).join("")}

</tbody>
</table>
</div>
`;
}

async function approveStudent(id){

const {error}=await sb
.from("students")
.update({status:"registered"})
.eq("id",id);

if(error){
showToast("خطا در تأیید");
return;
}

showToast("زبان‌آموز تأیید شد");
loadAdminStudents();
}

async function rejectStudent(id){

const {error}=await sb
.from("students")
.update({status:"rejected"})
.eq("id",id);

if(error){
showToast("خطا در رد درخواست");
return;
}

showToast("درخواست رد شد");
loadAdminStudents();
}


/* =====================================================
   APP
===================================================== */

function showApp(){

$("loginPage").classList.add("hidden");
$("adminPage").classList.add("hidden");
$("appPage").classList.remove("hidden");

$("welcomeText").textContent=
currentStudent
?`سلام ${currentStudent.first_name} عزیز 🌷`
:"خوش آمدید";
}

function navigate(page){

currentPage=page;

document
.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

const nav=$("nav-"+page);
if(nav)nav.classList.add("active");

const content=$("content");

if(page==="home")renderHome();
else if(page==="courses")renderCourses();

function speakWord(word){

if(!("speechSynthesis" in window)){
showToast("مرورگر دستگاه شما از تلفظ صوتی پشتیبانی نمی‌کند");
return;
}

try{

window.speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(word);

u.lang="en-US";
u.rate=.78;
u.pitch=1;
u.volume=1;

window.speechSynthesis.speak(u);

}catch(e){
showToast("پخش تلفظ انجام نشد");
}
}

function answerLesson(btn,selected,correct){

}

["What is the meaning of family?",["خانواده","مدرسه","معلم","شهر"],0],
["Choose the correct sentence.",["It is a book.","It are a book.","It am a book.","It be a book."],0],
["Which word means دانش‌آموز?",["student","teacher","friend","school"],0],
["Which word means معلم?",["teacher","student","book","class"],0],
["Which sentence is correct?",["I am from Iran.","I is from Iran.","I are from Iran.","I be from Iran."],0],
["Which sentence is correct?",["They are in class.","They is in class.","They am in class.","They be in class."],0],
["Choose the correct sentence.",["She is my friend.","She are my friend.","She am my friend.","She be my friend."],0]
];

let score=0;

});

}
