*{

html{

body{

/* =====================================================

const SUPABASE_URL =

const SUPABASE_KEY =
"sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   STATE
===================================================== */

const state = {

  user:null,

  profile:null,

  isAdmin:false,

  students:[],

  courses:[],

  loginMode:"student",

  adminFilter:"all",

  search:"",

  currentPage:"home",

  levelTest:{
    current:0,
    score:0,
    finished:false
  }

};


/* =====================================================
   LEVEL TEST QUESTIONS
===================================================== */

const levelQuestions = [

  },

  {

  },

  {

  },

  {

  },

  {

  },

  {

    answer:1
  }

];


/* =====================================================
   HELPERS
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[m];

      }
    );

}


function notice(
  text,
  type="info"
){

  const old =
    document.getElementById("notice");

  if(old)
    old.remove();

  const box =
    document.createElement("div");

  box.id="notice";

  box.className =
    "notice " + type;

  box.textContent=text;

  const wrap =
    document.querySelector(".wrap");

  if(wrap)
    wrap.prepend(box);

  setTimeout(
    function(){

      if(box)
        box.remove();

    },
    5000
  );

}


function studentEmail(phone){

  return String(phone || "")
    .replace(/\D/g,"")
    + "@alinagheli.com";

}


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  const result =
    await db.auth.getSession();

  const session =
    result.data.session;

  if(session){

    state.user =
      session.user;

    await loadIdentity();

  }else{

    renderLogin();

  }


  db.auth.onAuthStateChange(
    async function(
      event,
      session
    ){

      if(session){

        state.user =
          session.user;

        await loadIdentity();

      }else{

        state.user=null;
        state.profile=null;
        state.isAdmin=false;

        renderLogin();

      }

    }
  );

}


/* =====================================================
   IDENTITY
===================================================== */

async function loadIdentity(){

  if(!state.user){

    renderLogin();

    return;

  }

  const adminResult =
    await db
      .from("admins")
      .select("id,user_id")
      .eq(
        "user_id",
        state.user.id
      )
      .maybeSingle();


  if(adminResult.data){

    state.isAdmin=true;

    await loadAdminData();

    renderApp();

    return;

  }


  const studentResult =
    await db
      .from("students")
      .select("*")
      .eq(
        "auth_user_id",
        state.user.id
      )
      .maybeSingle();


  state.profile =
    studentResult.data || null;


  /*
    مهم:
    زبان‌آموز فقط در صورت registered
    اجازه ورود به محیط اصلی را دارد.
  */

  if(
    state.profile &&
    state.profile.status !== "registered"
  ){

    renderWaitingPage();

    return;

  }


  renderApp();

}


/* =====================================================
   COURSES
===================================================== */

async function loadCourses(){

  const result =
    await db
      .from("courses")
      .select("*")
      .order("id");


  if(!result.error){

    state.courses =
      result.data || [];

  }

}


/* =====================================================
   ADMIN DATA
===================================================== */

async function loadAdminData(){

  await loadCourses();

  const result =
    await db
      .from("students")
      .select("*")
      .order(
        "id",
        {
          ascending:false
        }
      );


  if(!result.error){

    state.students =
      result.data || [];

  }else{

    state.students=[];

    console.error(
      result.error
    );

  }

}

/* =====================================================

function renderLogin(){

/* =====================================================
   ADMIN LOGIN
===================================================== */

async function loginAdmin(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    alert(
      "ایمیل و رمز عبور را وارد کنید."
    );

    return;

  }


  const result =
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(result.error){

    alert(
      "ایمیل یا رمز عبور مدیر صحیح نیست."
    );

    return;

  }


  state.user =
    result.data.user;

  await loadIdentity();

}

/* =====================================================

/* =====================================================
   LEVEL TEST
===================================================== */

function renderLevelTest(){

  state.currentPage="level";

  state.levelTest={
    current:0,
    score:0,
    finished:false
  };


  renderLevelQuestion();

}


function renderLevelQuestion(){

  const box =
    document.getElementById(
      "content"
    );


  const q =
    levelQuestions[
      state.levelTest.current
    ];


  if(!q){

    finishLevelTest();

    return;

  }


  box.innerHTML=`

    <div class="card">

      <h2>
        📝 تعیین سطح زبان
      </h2>


      <p class="muted">

        سؤال
        ${state.levelTest.current+1}
        از
        ${levelQuestions.length}

      </p>


      <div class="divider"></div>


      <h3>
        ${esc(q.q)}
      </h3>


      ${
        q.options
          .map(
            function(option,index){

              return `

              <button
                class="quizOption"
                onclick="answerLevel(${index})">

                ${esc(option)}

              </button>

              `;

            }
          )
          .join("")
      }

    </div>

  `;

}


function answerLevel(index){

  const q =
    levelQuestions[
      state.levelTest.current
    ];


  if(index===q.answer){

    state.levelTest.score++;

  }


  state.levelTest.current++;

  renderLevelQuestion();

}


async function finishLevelTest(){

  state.levelTest.finished=true;


  const score =
    state.levelTest.score;


  let level="A1";


  if(score>=2)
    level="A2";

  if(score>=4)
    level="B1";

  if(score>=6)
    level="B2";

  if(score>=8)
    level="C1";


  document
    .getElementById("content")
    .innerHTML=`

      <div class="card">

        <h2 style="text-align:center">

          نتیجه تعیین سطح 🎉

        </h2>


        <div class="resultLevel">

          ${level}

        </div>


        <p style="text-align:center">

          امتیاز شما:

          <b>
            ${score}
          </b>

          از

          <b>
            ${levelQuestions.length}
          </b>

        </p>


        <p
          class="muted"
          style="text-align:center;line-height:2">

          این نتیجه یک ارزیابی اولیه است
          و می‌تواند برای انتخاب دوره مناسب
          استفاده شود.

        </p>


        <button
          class="btn full"
          onclick="studentPage('courses')">

          مشاهده دوره‌های مناسب

        </button>

      </div>

    `;


  /*
    ذخیره سطح در پروفایل در صورت وجود ستون level
  */

  if(state.profile){

    const result =
      await db
        .from("students")
        .update({
          level:level
        })
        .eq(
          "id",
          state.profile.id
        );


    if(!result.error){

      state.profile.level=level;

    }

  }

}

                      <b>

                        )}

                      </b>


                      <div class="muted">

                        رتبه ${index+1}

                      </div>

                    </div>

                  </div>


                  <b>

                    ${Number(s.xp||0)}

          </div>

/* =====================================================
   CONFIRM
===================================================== */

async function confirmRegistration(id){

  const student =
    state.students.find(
      s=>s.id===id
    );


  if(!student)
    return;


  const ok =
    confirm(
      `ثبت‌نام «${student.first_name} ${student.last_name}» تأیید شود؟`
    );


  if(!ok)
    return;


  await setStatus(
    id,
    "registered"
  );

}


/* =====================================================
   REJECT
===================================================== */

async function rejectStudent(id){

  const student =
    state.students.find(
      s=>s.id===id
    );


  if(!student)
    return;


  const ok =
    confirm(
      "آیا درخواست این زبان‌آموز رد شود؟"
    );


  if(!ok)
    return;


  const result =
    await db
      .from("students")
      .delete()
      .eq(
        "id",
        id
      );


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  state.students =
    state.students.filter(
      s=>s.id!==id
    );


  renderAdmin();

}

async function setStatus(

){

  const result =

      .from("students")
      .update({

      })
      .eq(

  if(result.error){

  }


  await loadAdminData();

  renderAdmin();


  notice(
    "وضعیت با موفقیت تغییر کرد.",
    "ok"
  );

}

    list =
      list.filter(
        s=>
          s.status===
          state.adminFilter

  if(q){

    list =
      list.filter(
        s=>

          `${s.first_name}
           ${s.last_name}
           ${s.phone}
           ${s.level}`
          .toLowerCase()
          .includes(q)

      );

  }


  const box =
    document.getElementById(
      "studentList"
    );


  if(box){

    box.innerHTML =
      list
        .map(studentCard)
        .join("")

      ||

      `<div class="empty">
        موردی پیدا نشد.
      </div>`;

  }

}


/* =====================================================
   ADMIN COURSES
===================================================== */

function renderAdminCourses(){

  document
    .getElementById("content")
    .innerHTML=`

      <div class="card">

        <h2>
          📚 دوره‌ها
        </h2>


        ${
          state.courses.length

          ?

          state.courses
            .map(
              function(c){

                return `

                <div class="course">

                  <h3>
                    ${esc(c.title)}
                  </h3>


                  <p class="muted">

                    ${esc(
                      c.description ||
                      "دوره آموزش زبان انگلیسی"
                    )}

                  </p>

                </div>

                `;

              }
            )
            .join("")

          :

          `<div class="empty">
            هنوز دوره‌ای ثبت نشده است.
          </div>`

        }

      </div>

  `;

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await db.auth.signOut();

  state.user=null;
  state.profile=null;
  state.isAdmin=false;

  renderLogin();

}


/* =====================================================
   START
===================================================== */

boot();

</script>
