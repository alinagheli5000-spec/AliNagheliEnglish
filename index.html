function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function normalizePhone(v){
 v=String(v||"").trim().replace(/[۰-۹]/g,x=>"۰۱۲۳۴۵۶۷۸۹".indexOf(x)).replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x));
 if(v.startsWith("+98"))v="0"+v.slice(3);if(v.startsWith("0098"))v="0"+v.slice(4);return v;
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(text){
 if(!("speechSynthesis"in window)){alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(String(text));
 u.lang="en-US";u.rate=.75;u.pitch=1;
 speechSynthesis.resume();speechSynthesis.speak(u);
}

/* FIXED STUDENT AUTHENTICATION */
async function studentLogin(){
 const phone=normalizePhone(document.getElementById("phone").value);
 const password=document.getElementById("pass").value.trim();

 if(!/^09\d{9}$/.test(phone)||!password){
  alert("شماره موبایل و رمز عبور را صحیح وارد کنید.");return;
 }

 try{
  /*
   IMPORTANT:
   student-access authenticates the student itself.
   We do NOT require an already-existing Supabase browser session
   before calling it.
  */
  const r=await fetch(ACCESS_FUNCTION,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   },
   body:JSON.stringify({
    action:"login",
    phone:phone,
    password:password
   })
  });

  const data=await r.json().catch(()=>({}));

  if(!r.ok){
   throw new Error(data.error||data.message||"شماره تلفن یا رمز عبور صحیح نیست.");
  }

  /*
   Accept all common response shapes returned by the Edge Function.
  */
  const student=data.student||data.user||data.data?.student||null;
  const accessToken=data.access_token||data.session?.access_token||data.data?.session?.access_token||null;
  const refreshToken=data.refresh_token||data.session?.refresh_token||data.data?.session?.refresh_token||null;

  if(!student && !accessToken){
   throw new Error(data.error||"اطلاعات ورود زبان‌آموز دریافت نشد.");
  }

  if(data.status==="waiting"||student?.status==="waiting"||student?.status==="pending"){
   alert("ثبت‌نام شما هنوز توسط مدیر تأیید نشده است.");return;
  }

  if(data.status==="rejected"||student?.status==="rejected"){
   alert("ثبت‌نام شما توسط مدیر رد شده است.");return;
  }

  /*
   If the Edge Function returns Supabase tokens, establish the
   browser session. If it does not, continue with the returned student.
  */
  if(accessToken&&refreshToken){
   const sessionResult=await db.auth.setSession({
    access_token:accessToken,
    refresh_token:refreshToken
   });

   if(sessionResult.error){
    console.warn("Session setup:",sessionResult.error);
   }
  }

  if(!student){
   const session=(await db.auth.getSession()).data?.session;
   if(session?.user?.id){
    const q=await db.from("students")
     .select("*")
     .eq("auth_user_id",session.user.id)
     .maybeSingle();

    if(q.error)throw q.error;
    if(q.data)S.student=q.data;
   }
  }else{
   S.student=student;
  }

  if(!S.student){
   throw new Error("حساب زبان‌آموز پیدا نشد.");
  }

  if(["waiting","pending"].includes(S.student.status)){
   await db.auth.signOut().catch(()=>{});
   alert("حساب شما هنوز توسط مدیر تأیید نشده است.");return;
  }

  if(S.student.status==="rejected"){
   await db.auth.signOut().catch(()=>{});
   alert("ثبت‌نام شما توسط مدیر رد شده است.");return;
  }

  await loadStudentStats();
  home();

 }catch(e){
  console.error(e);
  alert(e?.message||"ورود انجام نشد.");
 }
}

function lessonTab(n){

function completeLesson(key){S.progress[key]={progress:100,completed:true};addXP(25);alert("درس تکمیل شد. 🎉\n۲۵ XP دریافت کردی.");grade(S.grade)}
function startLessonQuiz(){
 const arr=(words[S.lesson+1]||[]).map(w=>({q:`معنی "${w[0]}" چیست؟`,a:w[1]}));
 S.quiz={type:"lesson",questions:shuffle(arr).slice(0,6),i:0,correct:0};quizRender("lessonQuiz");
}
function quizRender(id){
 const el=document.getElementById(id);if(!el||!S.quiz)return;
 const q=S.quiz.questions[S.quiz.i];if(!q){quizFinish(id);return}

 el.innerHTML=`<p>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</p><h3>${esc(q.q)}</h3><div class="grid">${options.map(x=>`<button class="btn secondary" onclick="quizAnswer(${JSON.stringify(x)},${JSON.stringify(q.a)},'${id}')">${esc(x)}</button>`).join("")}</div>`;
}
function quizAnswer(choice,answer,id){if(choice===answer){S.quiz.correct++;addXP(5)}S.quiz.i++;quizRender(id)}

async function loadStudentStats(){
