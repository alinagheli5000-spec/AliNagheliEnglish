function xpForLevel(level){
 return Math.max(0,(level-1)*100)
}

function calculateLevel(xp){
 return Math.floor((xp||0)/100)+1
}

async function loadStudentStats(){
 if(!S.student)return;
 try{
  const p=await db.from("student_progress")
   .select("*")
   .eq("student_id",S.student.id);

  if(!p.error){
   S.progress={};
   (p.data||[]).forEach(x=>{
    S.progress[x.lesson_id]={
     progress:x.progress,
     completed:x.completed
    };
   });
  }

  const a=await db.from("student_achievements")
   .select("*")
   .eq("student_id",S.student.id);

  if(!a.error)S.achievements=a.data||[];

  const e=await db.from("student_exams")
   .select("*")
   .eq("student_id",S.student.id)
   .order("created_at",{ascending:false});

  if(!e.error)S.exams=e.data||[];

  const total=Object.values(S.progress).reduce((n,x)=>{
   return n+(x.completed?20:Number(x.progress||0))
  },0);

  S.xp=total;
  S.level=calculateLevel(S.xp);
 }catch(e){
  S.xp=0;
  S.level=1;
 }
}

async function addXP(amount){
 if(!S.student)return;
 S.xp=(S.xp||0)+amount;
 S.level=calculateLevel(S.xp);

 try{
  await db.from("students")
   .update({xp:S.xp})
   .eq("id",S.student.id);
 }catch(e){}
}

async function unlockAchievement(key,title){
 if(!S.student)return;

 if(S.achievements.some(a=>a.achievement_key===key))return;

 try{
  const r=await db.from("student_achievements").insert({
   student_id:S.student.id,
   achievement_key:key,
   title
  });

  if(!r.error)
   S.achievements.push({achievement_key:key,title});
 }catch(e){}
}

async function saveProgress(lessonId,progress,completed){
 if(!S.student)return;

 S.progress[lessonId]={progress,completed};

 try{
  await db.from("student_progress").upsert({
   student_id:S.student.id,
   lesson_id:lessonId,
   progress,
   completed,
   completed_at:completed?new Date().toISOString():null
  },{onConflict:"student_id,lesson_id"});
 }catch(e){}
}

/* QUIZ ENGINE */

function shuffle(arr){
 const a=[...arr];

 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

 return a;
}

function makeLessonQuestions(){
 const no=S.lesson+1;
 const arr=[];

 const ws=words[no]||[];

 ws.forEach((w,i)=>{
  const pool=shuffle(
   ws.filter((_,j)=>j!==i).map(x=>x[1])
  ).slice(0,3);

  const opts=shuffle([w[1],...pool]);

  arr.push({
   q:`معنی "${w[0]}" چیست؟`,
   options:opts,
   answer:opts.indexOf(w[1])
  });
 });

 (grammar[no]||[]).forEach(g=>{
  const opts=shuffle([
   g[1],
   "She are a student.",
   "They is happy.",
   "He am a teacher."
  ]);

  arr.push({
   q:`کدام گزینه با مبحث «${g[0]}» هماهنگ است؟`,
   options:opts,
   answer:opts.indexOf(g[1])
  });
 });

 return arr.slice(0,15);
}

function startLessonQuiz(){
 S.quiz={
  type:"lesson",
  title:`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
  questions:makeLessonQuestions(),
  i:0,
  correct:0,
  wrong:0
 };

 quizRender("lessonQuiz");
}

function quizRender(id){
 const q=S.quiz.questions[S.quiz.i];

 if(!q){
  quizFinish(id);
  return
 }

 const el=document.getElementById(id);

 if(!el)return;

 el.innerHTML=`
 <div class="card">

  <b>
   سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}
  </b>

  <div class="progress">
   <i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i>
  </div>

  <div style="font-size:18px;font-weight:bold;line-height:2;margin:15px 0">
   ${esc(q.q)}
  </div>

  ${q.options.map((x,i)=>`
   <button class="option" onclick="answer(${i},'${id}')">
    ${esc(x)}
   </button>
  `).join("")}

  <div id="fb"></div>

 </div>`;
}

function answer(i,id){
 const q=S.quiz.questions[S.quiz.i];

 const opts=document.querySelectorAll(".option");

 opts.forEach(x=>x.disabled=true);

 if(i===q.answer){

  S.quiz.correct++;

  opts[i].classList.add("correct");

  document.getElementById("fb").className="feedback ok";

  document.getElementById("fb").innerHTML=
   "✅ 😊 آفرین! پاسخ درست است.";

 }else{

  S.quiz.wrong++;

  opts[i].classList.add("wrong");

  opts[q.answer].classList.add("correct");

  document.getElementById("fb").className="feedback bad";

  document.getElementById("fb").innerHTML=
   "❌ پاسخ اشتباه است.";
 }

 setTimeout(()=>{
  S.quiz.i++;
  quizRender(id);
 },700);
}

async function placementFinish(){

 else if(score<=19)level="B1";

 if(S.student){
  try{
   await db.from("exam_results").insert({
    user_id:S.student.auth_user_id,

async function placementAnswer(i){
 const q=S.quiz.questions[S.quiz.i];

 const opts=document.querySelectorAll(".option");

 opts.forEach(x=>x.disabled=true);

 if(i===q.answer){
  S.quiz.correct++;
  opts[i].classList.add("correct");
 }else{
  S.quiz.wrong++;
  opts[i].classList.add("wrong");
  opts[q.answer].classList.add("correct");
 }

 setTimeout(async()=>{
  S.quiz.i++;

  if(S.quiz.i>=S.quiz.questions.length)
   await placementFinish();
  else
   quizRender("placementQuiz");

 },650);
}

  return;

 originalAnswer(i,id);
};

    ?students.map(x=>`
     <div class="adminRow">

      <b>
       ${esc(x.first_name)}
       ${esc(x.last_name)}
      </b>

      <div class="muted">

       📱 ${esc(x.phone||"")}<br>

       🎓 پایه:
       ${esc(x.level||"-")}<br>

       ✉️ ${esc(x.login_email||"-")}

      </div>

      <div style="margin-top:10px">

       ${x.status==="waiting"
        ?`
         <button class="btn success"
          onclick="approve('${x.id}')">
          ✅ تأیید
         </button>

         <button class="btn danger"
          onclick="rejectStudent('${x.id}')">
          ❌ رد
         </button>
        `
        :
        x.status==="registered"||
        x.status==="approved"
        ?`
         <span>✅ تأیید شده</span>

         <button class="btn danger"
          onclick="rejectStudent('${x.id}')">
          رد / حذف
         </button>
        `
        :
        `
         <span>❌ رد شده</span>

         <button class="btn success"
          onclick="approve('${x.id}')">
          تأیید مجدد
         </button>
        `}

      </div>

     </div>
    `).join("")
    :`<p class="muted">
       ثبت‌نامی وجود ندارد.
      </p>`}

  </div>

  <button class="btn secondary full"
   onclick="logout()">
   خروج
  </button>

 </main>`;
}

async function respondRequest(id,status){
 try{

  const r=await db.from("teacher_requests")
   .update({status})
   .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){
  alert("خطا:\n"+e.message)
 }
}

async function approve(id){
 try{

  const r=await db.from("students")
   .update({status:"registered"})
   .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){
  alert("خطا در تأیید:\n"+e.message)
 }
}

async function rejectStudent(id){
 try{

  const r=await db.from("students")
   .update({status:"rejected"})
   .eq("id",id);

  if(r.error)throw r.error;

  admin();

 }catch(e){
  alert("خطا:\n"+e.message)
 }
}

/* LOGOUT */

async function logout(){

 try{
  await db.auth.signOut()
 }catch(e){}

 S={
  student:null,
  admin:false,
  grade:null,
  lesson:null,
  quiz:null,
  xp:0,
  level:1,
  progress:{},
  achievements:[],
  exams:[]
 };

 login();
}

/* START */

async function startup(){

 try{

  const r=await db.auth.getSession();

  const session=r.data?.session;

  if(!session){
   login();
   return;
  }

  const user=session.user;

  if(
   (user.email||"").toLowerCase()==="alinagheli@gmail.com"
  ){
   S.admin=true;
   admin();
   return;
  }

  const st=await db.from("students")
   .select("*")
   .eq("auth_user_id",user.id)
   .maybeSingle();

  if(
   st.data &&
   ["registered","approved"].includes(st.data.status)
  ){

   S.student=st.data;

   await loadStudentStats();

   home();

   return;
  }

  await db.auth.signOut();

  login();

 }catch(e){

  try{
   await db.auth.signOut()
  }catch(_){}

  login();
 }
}

db.auth.onAuthStateChange((event)=>{

 if(
  event==="SIGNED_OUT" &&
  !S.admin &&
  !S.student
 ){
  login();
 }

});

startup();
</script>
