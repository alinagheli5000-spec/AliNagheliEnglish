<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f3ff;
color:#17121f;
padding-bottom:85px
}
button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{max-width:1100px;margin:auto;padding:16px}
.header{
background:linear-gradient(135deg,#6d28d9,#9333ea);
color:#fff;padding:22px;border-radius:0 0 28px 28px
}
.header h1{margin:0;font-size:28px}
.card{
background:#fff;border-radius:22px;padding:20px;margin:14px 0;
box-shadow:0 8px 30px #0001
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:14px
}
.btn{
border:0;border-radius:15px;padding:13px 18px;
background:#6d28d9;color:white;font-weight:bold;margin:4px
}
.secondary{background:#ede9fe;color:#5b21b6}
.danger{background:#dc2626}
.course{
border:0;padding:20px;min-height:140px;border-radius:24px;
background:linear-gradient(145deg,#fff,#f3e8ff);
box-shadow:0 8px 25px #0001;
font-weight:bold;font-size:17px;color:#4c1d95
}
.course .icon{font-size:40px;display:block;margin-bottom:10px}
.lesson{
padding:18px;border-radius:20px;background:#faf5ff;
border:1px solid #e9d5ff;margin:12px 0
}
.lesson h3{margin-top:0;color:#5b21b6}
.word{
display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:12px;background:white;border-radius:14px;
margin:7px 0;box-shadow:0 3px 12px #0001
}
.word strong{direction:ltr}
.pronounce{
border:0;background:#ede9fe;color:#6d28d9;
border-radius:12px;padding:9px 13px;font-size:19px
}
.option{
display:block;width:100%;text-align:right;padding:13px;
margin:8px 0;border:2px solid #e5e7eb;
border-radius:14px;background:white
}
.option.correct{background:#dcfce7;border-color:#16a34a}
.option.wrong{background:#fee2e2;border-color:#dc2626}
.result{
padding:18px;border-radius:18px;background:#f3e8ff;
text-align:center;font-size:21px;font-weight:bold
}
.nav{
position:fixed;bottom:0;left:0;right:0;background:white;
display:flex;gap:5px;padding:8px;box-shadow:0 -5px 20px #0002;
z-index:999
}
.nav button{
flex:1;border:0;background:white;padding:10px 4px;
border-radius:12px;font-size:12px
}
.nav button.active{background:#ede9fe;color:#6d28d9;font-weight:bold}
input{
width:100%;padding:13px;border:1px solid #ddd;
border-radius:13px;margin:6px 0
}
.teacher{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px
}
.teacherBox{
background:linear-gradient(145deg,#fff,#faf5ff);
border:1px solid #e9d5ff;border-radius:22px;padding:20px
}
.phone{
display:inline-block;direction:ltr;color:#6d28d9;
font-weight:bold;text-decoration:none;margin-top:10px
}
.rank{
display:flex;justify-content:space-between;align-items:center;
padding:12px;margin:7px 0;background:#faf5ff;border-radius:13px
}
#competition{
position:fixed;inset:0;background:#f5f3ff;
z-index:2000;overflow:auto
}
.badge{
display:inline-block;padding:6px 10px;border-radius:20px;
background:#ede9fe;color:#5b21b6;margin:3px
}
</style>
</head>

<body>

<div id="homePage">

<div class="card">
<h2>📚 دوره‌ها</h2>

</div>

<div class="card">

<div class="grid">
<button class="course" onclick="startCompetition('هفتم')">📘 هفتمی‌ها</button>
<button class="course" onclick="startCompetition('هشتم')">📗 هشتمی‌ها</button>
<button class="course" onclick="startCompetition('نهم')">📕 نهمی‌ها</button>
<button class="course" onclick="startCompetition('دهم')">📙 دهمی‌ها</button>
<button class="course" onclick="startCompetition('یازدهم')">📔 یازدهمی‌ها</button>
<button class="course" onclick="startCompetition('دوازدهم')">📓 دوازدهمی‌ها</button>
<button class="course" onclick="startCompetition('مکالمه')">🗣️ مکالمه</button>
</div>
</div>

<div class="card">
<h2>🏅 رکوردهای من</h2>
<div id="records">هنوز رکوردی ثبت نشده است.</div>
</div>

</div>

<div id="content"></div>

</section>

<section id="adminLogin" class="hidden">
<div class="card">
<h2>👑 ورود مدیر</h2>
<input id="adminUser" placeholder="نام کاربری">
<input id="adminPass" type="password" placeholder="رمز عبور">
<button class="btn" onclick="adminLogin()">ورود</button>
<button class="btn secondary" onclick="backLogin()">بازگشت</button>
<p id="adminMsg"></p>
</div>
</section>

<section id="adminPanel" class="hidden">
<div class="card">
<h2>👑 پنل مدیریت</h2>
<p>پنل مدیریت AliNagheli English</p>
<button class="btn danger" onclick="logout()">خروج</button>
</div>
</section>

</main>

<div id="competition" class="hidden">
<div class="container">
<div class="card">
<h2 id="competitionTitle"></h2>
<div id="competitionProgress"></div>
<div id="competitionQuestion"></div>
<div id="competitionOptions"></div>
<div id="competitionResult"></div>
<button class="btn secondary" onclick="closeCompetition()">بازگشت</button>
</div>
</div>
</div>

<nav class="nav">
<button onclick="goHome()">🏠<br>خانه</button>
<button onclick="showSchool()">🏫<br>مدرسه</button>
<button onclick="showConversation()">🗣️<br>مکالمه</button>

<script>

/* =========================
   تلفظ
========================= */

function speak(text){
try{
if(!window.speechSynthesis){
alert("مرورگر شما از پخش صوتی پشتیبانی نمی‌کند.");
return;
}
window.speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(String(text));
u.lang="en-US";
u.rate=.75;
u.pitch=1;
u.volume=1;

const voices=window.speechSynthesis.getVoices();
const englishVoice=voices.find(v=>/^en(-|_)/i.test(v.lang));
if(englishVoice)u.voice=englishVoice;

window.speechSynthesis.speak(u);
}catch(e){
alert("پخش تلفظ در این دستگاه در دسترس نیست.");
}
}

if("speechSynthesis" in window){
speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}

/* =========================
   ناوبری
========================= */

function hideAll(){
["login","adminLogin","adminPanel","studentApp"].forEach(id=>{
const el=document.getElementById(id);
if(el)el.classList.add("hidden");
});
}

function show(id){
hideAll();
document.getElementById(id)?.classList.remove("hidden");
}

function goHome(){
show("studentApp");
document.getElementById("content").innerHTML="";
document.getElementById("homePage").classList.remove("hidden");
}

function showAdminLogin(){
show("adminLogin");
}

function backLogin(){
show("login");
}

/* =========================
   ورود
========================= */

function login(){
const phone=document.getElementById("loginPhone").value.trim();
const pass=document.getElementById("loginPassword").value;
const msg=document.getElementById("loginMsg");

if(!phone||!pass){
msg.textContent="لطفاً شماره تلفن و رمز عبور را وارد کنید.";
return;
}

const student={
phone,
name:"زبان‌آموز"
};

localStorage.setItem("ali_current_student",JSON.stringify(student));
currentStudent=student;

document.getElementById("studentName").textContent=
"سلام "+student.name+" 🌷 خوش آمدی";

show("studentApp");
loadRecords();
}

function adminLogin(){
const u=document.getElementById("adminUser").value.trim();
const p=document.getElementById("adminPass").value;

if((u==="admin"||u==="ali")&&p==="1234"){
show("adminPanel");
}else{
document.getElementById("adminMsg").textContent=
"نام کاربری یا رمز عبور نادرست است.";
}
}

function logout(){
currentStudent=null;
localStorage.removeItem("ali_current_student");
show("login");
}

/* =========================
   مدرسه
========================= */

function showSchool(){
document.getElementById("homePage").classList.add("hidden");

let html=`
<div class="card">
<h2>🏫 دوره مدرسه</h2>
<button class="btn secondary" onclick="goHome()">🏠 بازگشت</button>
<div class="grid">
`;

const icons=["7️⃣","8️⃣","9️⃣","🔟","1️⃣1️⃣","1️⃣2️⃣"];

Object.keys(schoolData).forEach((grade,i)=>{
html+=`
<button class="course" onclick="showGrade('${grade}')">
<span class="icon">${icons[i]}</span>
پایه ${grade}
</button>`;
});

html+=`</div></div>`;

document.getElementById("content").innerHTML=html;
}

function showGrade(grade){
document.getElementById("homePage").classList.add("hidden");

const lessons=schoolData[grade];

let html=`
<div class="card">
<h2>📚 زبان انگلیسی پایه ${grade}</h2>
<button class="btn secondary" onclick="showSchool()">بازگشت</button>
`;

lessons.forEach((lesson,index)=>{
html+=`
<div class="lesson">
<h3>${lesson.title}</h3>

<h4>📖 لغات</h4>

${lesson.words.map(w=>`
<div class="word">
<div>
<strong>${escapeHTML(w[0])}</strong><br>
<span>${escapeHTML(w[1])}</span>
</div>
<button class="pronounce"
onclick="speak(${JSON.stringify(w[0])})"
aria-label="پخش تلفظ ${escapeHTML(w[0])}">
🔊
</button>
</div>
`).join("")}

<h4>🧠 گرامر</h4>
<p>${lesson.grammar}</p>

<ul>
${lesson.examples.map(e=>`
<li style="direction:ltr;text-align:left;margin:9px">
${escapeHTML(e)}
</li>`).join("")}
</ul>

<button class="btn" onclick="startLessonTest('${grade}',${index})">
📝 آزمون ${lesson.title}
</button>

</div>`;
});

html+=`</div>`;

document.getElementById("content").innerHTML=html;
}

function startLessonTest(grade,index){
const lesson=schoolData[grade][index];
let questions=[];

lesson.words.forEach(w=>{
const distractors=shuffle(
lesson.words
.filter(x=>x[0]!==w[0])
.map(x=>x[1])
).slice(0,3);

questions.push([
`"${w[0]}" means ...`,
w[1],
...distractors
]);
});

lesson.examples.forEach(ex=>{
const distractors=shuffle(
lesson.examples.filter(x=>x!==ex)
);

while(distractors.length<3){
distractors.push(
lesson.examples[distractors.length%lesson.examples.length]
);
}

questions.push([
"Which sentence is related to this lesson?",
ex,
...distractors.slice(0,3)
]);
});

while(questions.length<15){
const w=lesson.words[questions.length%lesson.words.length];

questions.push([
`Choose the meaning of "${w[0]}".`,
w[1],
"مدرسه",
"کتاب",
"دوست"
]);
}

currentCompetition={
type:`${grade} - ${lesson.title}`,
questions:shuffle(questions).slice(0,15),
index:0,
correct:0,
wrong:0,
answered:false
};

document.getElementById("competition").classList.remove("hidden");
document.getElementById("competitionTitle").textContent=
"📝 آزمون "+lesson.title;

renderLessonQuestion();
}

function renderLessonQuestion(){
const c=currentCompetition;

if(c.index>=c.questions.length){
finishLessonTest();
return;
}

const q=c.questions[c.index];
const correct=q[1];
const options=shuffle(q.slice(1));

document.getElementById("competitionProgress").innerHTML=
`<span class="badge">سؤال ${c.index+1} از 15</span>
<span class="badge">درست: ${c.correct}</span>
<span class="badge">غلط: ${c.wrong}</span>`;

document.getElementById("competitionResult").innerHTML="";

document.getElementById("competitionQuestion").innerHTML=`
<h3>سؤال ${c.index+1}</h3>
<p style="font-size:19px;direction:ltr;text-align:left">
${escapeHTML(q[0])}
</p>`;

document.getElementById("competitionOptions").innerHTML=
options.map(o=>`
<button class="option"
onclick="answerLesson(this,${JSON.stringify(o)},${JSON.stringify(correct)})">
${escapeHTML(o)}
</button>`).join("");
}

function answerLesson(btn,answer,correct){
const c=currentCompetition;

if(c.answered)return;
c.answered=true;

document.querySelectorAll("#competitionOptions .option")
.forEach(b=>{
if(b.textContent.trim()===String(correct)){
b.classList.add("correct");
}
});

if(answer===correct){
c.correct++;
btn.classList.add("correct");
}else{
c.wrong++;
btn.classList.add("wrong");
}

setTimeout(()=>{
c.index++;
c.answered=false;
renderLessonQuestion();
},800);
}

function finishLessonTest(){
const c=currentCompetition;
const percentage=Math.round((c.correct/c.questions.length)*100);

saveRecord(c.type,percentage);

document.getElementById("competitionProgress").innerHTML="";

document.getElementById("competitionQuestion").innerHTML="";

document.getElementById("competitionOptions").innerHTML="";

document.getElementById("competitionResult").innerHTML=`
<div class="result">
🎉 آزمون تمام شد!
<br><br>
تعداد پاسخ صحیح: ${c.correct}
<br>
تعداد پاسخ غلط: ${c.wrong}
<br><br>
نمره: ${percentage}٪
</div>`;
}

/* =========================
   رکوردها
========================= */

function saveRecord(type,score){
const key="ali_records";
let records=[];

try{
records=JSON.parse(localStorage.getItem(key)||"[]");
if(!Array.isArray(records))records=[];
}catch(e){
records=[];
}

records.unshift({
type,
score,
date:new Date().toLocaleDateString("fa-IR")
});

localStorage.setItem(key,JSON.stringify(records.slice(0,50)));
loadRecords();
}

function loadRecords(){
const el=document.getElementById("records");
if(!el)return;

let records=[];

try{
records=JSON.parse(localStorage.getItem("ali_records")||"[]");
}catch(e){
records=[];
}

if(!records.length){
el.innerHTML="هنوز رکوردی ثبت نشده است.";
return;
}

el.innerHTML=records.map((r,i)=>`
<div class="rank">
<span>${i+1}. ${escapeHTML(r.type)}</span>
<strong>${r.score}٪</strong>
<small>${escapeHTML(r.date)}</small>
</div>
`).join("");
}

/* =========================
   امنیت نمایش متن
========================= */

function escapeHTML(value){
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}
