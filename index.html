<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AliNagheli English</title>
<style>
html,body{margin:0;padding:0;background:#f5f3ff;font-family:Tahoma,Arial,sans-serif}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#6d28d9;font-weight:bold}

<body>
<div id="boot">در حال آماده‌سازی AliNagheli English…</div>

<script>
(async function(){

const ORIGINAL =
"https://raw.githubusercontent.com/alinagheli5000-spec/AliNagheliEnglish/9804b6ce02f322a1cc5f3401d9bafea9b9feb360/index.html";

try{

const response = await fetch(ORIGINAL,{cache:"no-store"});

if(!response.ok) throw new Error("LOAD_ERROR");

let source = await response.text();

/* =========================================================
   PATCH SCRIPT
========================================================= */

const patch = `
<script>
(function(){

"use strict";

/* =========================================================
   LEVEL CALCULATOR
========================================================= */

window.AN_getLevel = function(score,total){

    score = Number(score)||0;
    total = Number(total)||30;

    const percent = total ? (score/total)*100 : 0;

    if(percent < 27) return {
        level:"A1",
        title:"مبتدی",
        description:"شما در سطح مقدماتی زبان انگلیسی قرار دارید."
    };

    if(percent < 47) return {
        level:"A2",
        title:"مقدماتی",
        description:"شما توانایی استفاده از عبارات و جملات ساده را دارید."
    };

    if(percent < 67) return {
        level:"B1",
        title:"متوسط",
        description:"شما در برقراری ارتباط در موقعیت‌های معمول توانایی خوبی دارید."
    };

    if(percent < 83) return {
        level:"B2",
        title:"متوسط رو به بالا",
        description:"شما درک خوبی از زبان انگلیسی دارید و می‌توانید نسبتاً روان ارتباط برقرار کنید."
    };

    if(percent < 94) return {
        level:"C1",
        title:"پیشرفته",
        description:"توانایی زبانی شما در سطح پیشرفته قرار دارد."
    };

    return {
        level:"C2",
        title:"تسلط کامل",
        description:"سطح زبان شما نزدیک به تسلط کامل و حرفه‌ای است."
    };
};


/* =========================================================
   PLACEMENT TEST
========================================================= */

function installPlacementPatch(){

    if(typeof window.placementFinish !== "function"){
        setTimeout(installPlacementPatch,500);
        return;
    }

    if(window.__AN_PLACEMENT_PATCHED) return;

    const originalPlacementFinish = window.placementFinish;

    window.placementFinish = async function(){

        let result;

        try{
            result = originalPlacementFinish.apply(this,arguments);
        }catch(e){
            console.error(e);
        }

        try{
            if(result && typeof result.then==="function"){
                await result;
            }
        }catch(e){
            console.error(e);
        }

        setTimeout(function(){

            try{

                let score = 0;
                let total = 30;

                if(window.S && S.quiz){

                    if(typeof S.quiz.score==="number"){
                        score=S.quiz.score;
                    }

                    if(typeof S.quiz.correct==="number"){
                        score=S.quiz.correct;
                    }

                    if(Array.isArray(S.quiz.questions)){
                        total=S.quiz.questions.length || 30;
                    }

                }

                const existingScore =
                    document.querySelector(".score");

                if(existingScore){

                    const numbers =
                        existingScore.textContent.match(/\\d+/g);

                    if(numbers && numbers.length){
                        score=Number(numbers[0]);
                    }

                }

                const levelData =
                    window.AN_getLevel(score,total);

                let old =
                    document.getElementById("AN-placement-level");

                if(old) old.remove();

                const box=document.createElement("div");

                box.id="AN-placement-level";

                box.innerHTML=\`
                <div class="AN-level-box">

                    <div class="AN-level-small">
                        نتیجه تعیین سطح شما
                    </div>

                    <div class="AN-level-score">
                        \${score} / \${total}
                    </div>

                    <div class="AN-level-percent">
                        \${Math.round((score/total)*100)}٪
                    </div>

                    <div class="AN-level-title">
                        سطح شما:
                        <strong>\${levelData.level}</strong>
                    </div>

                    <div class="AN-level-name">
                        \${levelData.title}
                    </div>

                    <div class="AN-level-description">
                        \${levelData.description}
                    </div>

                    <div class="AN-level-bar">
                        <i style="width:\${Math.min(100,Math.round((score/total)*100))}%"></i>
                    </div>

                    <div class="AN-level-scale">
                        <span>A1</span>
                        <span>A2</span>
                        <span>B1</span>
                        <span>B2</span>
                        <span>C1</span>
                        <span>C2</span>
                    </div>

                </div>
                \`;

                const target =
                    document.querySelector("#placementQuiz") ||
                    document.querySelector(".score")?.parentElement ||
                    document.querySelector(".card");

                if(target){

                    target.insertAdjacentElement(
                        "afterend",
                        box
                    );

                }else{

                    document.getElementById("app")
                        ?.appendChild(box);

                }

            }catch(e){
                console.error("Placement level error:",e);
            }

        },300);
    };

    window.__AN_PLACEMENT_PATCHED=true;
}

installPlacementPatch();


/* =========================================================
   TEACHER
========================================================= */

function installTeacherPatch(){

    if(typeof window.teachers !== "function"){
        setTimeout(installTeacherPatch,500);
        return;
    }

    if(window.__AN_TEACHER_PATCHED) return;

    const originalTeachers=window.teachers;

    window.teachers=function(){

        originalTeachers.apply(this,arguments);

        setTimeout(function(){

            try{

                if(
                    document.getElementById("AN-teacher-elaha")
                ) return;

                const app=document.getElementById("app");

                if(!app) return;

                const cards=
                    app.querySelectorAll(".teacherBox");

                if(!cards.length) return;

                const teacher=document.createElement("div");

                teacher.id="AN-teacher-elaha";

                teacher.className="teacherBox AN-extra-teacher";

                teacher.innerHTML=\`

                    <div class="teacherAvatar">👩🏻‍🏫</div>

                    <h3 style="text-align:center">
                        الهه باغبانی
                    </h3>

                    <div style="text-align:center;color:#6d28d9;font-weight:bold">
                        کارشناس ارشد آموزش زبان انگلیسی
                    </div>

                    <p>
                        با بیش از ۱۰ سال سابقه تدریس
                        مکالمه زبان انگلیسی و دوره‌های
                        بین‌المللی
                        TOEFL, IELTS, KET, PET, PTE, MSRT
                    </p>

                    <a
                        class="btn full"
                        href="tel:09914312534"
                    >
                        📞 تماس با استاد
                    </a>

                \`;

                const container=
                    app.querySelector(".teacher");

                if(container){

                    container.appendChild(teacher);

                }else{

                    const card=
                        app.querySelector(".card");

                    if(card) card.appendChild(teacher);

                }

            }catch(e){
                console.error(e);
            }

        },150);

    };

    window.__AN_TEACHER_PATCHED=true;
}

installTeacherPatch();


/* =========================================================
   COURSES - CONVERSATION
========================================================= */

function installCoursesPatch(){

    if(typeof window.courses !== "function"){
        setTimeout(installCoursesPatch,500);
        return;
    }

    if(window.__AN_COURSES_PATCHED) return;

    const originalCourses=window.courses;

    window.courses=function(){

        originalCourses.apply(this,arguments);

        setTimeout(function(){

            try{

                if(
                    document.getElementById("AN-conversation-card")
                ) return;

                const app=document.getElementById("app");

                if(!app) return;

                const card=document.createElement("div");

                card.id="AN-conversation-card";

                card.className="card";

                card.innerHTML=\`

                    <div class="AN-conversation-card">

                        <div class="AN-conversation-icon">
                            🗣️
                        </div>

                        <div>
                            <h2>مکالمه</h2>

                            <p>
                                تمرین‌ها و آموزش‌های مکالمه
                                زبان انگلیسی
                            </p>

                            <div class="AN-update">
                                🚧 در حال بروزرسانی
                            </div>

                        </div>

                    </div>

                \`;

                app.appendChild(card);

            }catch(e){
                console.error(e);
            }

        },150);

    };

    window.__AN_COURSES_PATCHED=true;
}

installCoursesPatch();


/* =========================================================
   HOME ENHANCEMENT
========================================================= */

function installHomePatch(){

    if(typeof window.home !== "function"){
        setTimeout(installHomePatch,500);
        return;
    }

    if(window.__AN_HOME_PATCHED) return;

    const originalHome=window.home;

    window.home=function(){

        originalHome.apply(this,arguments);

        setTimeout(function(){

            try{

                const app=document.getElementById("app");

                if(!app) return;

                let hero=app.querySelector(".hero");

                if(hero){

                    hero.classList.add("AN-main-hero");

                    if(!hero.querySelector(".AN-hero-subtitle")){

                        const subtitle=
                            document.createElement("div");

                        subtitle.className="AN-hero-subtitle";

                        subtitle.innerHTML=
                        "🚀 مسیر یادگیری زبان انگلیسی تو از اینجا شروع می‌شود";

                        hero.appendChild(subtitle);

                    }

                }

                if(
                    !document.getElementById("AN-home-welcome")
                ){

                    const welcome=document.createElement("div");

                    welcome.id="AN-home-welcome";

                    welcome.className="card AN-home-welcome";

                    welcome.innerHTML=\`

                        <div class="AN-welcome-icon">
                            🎯
                        </div>

                        <div>

                            <h2>
                                مسیر یادگیری تو
                            </h2>

                            <p>
                                درس بخوان، تمرین کن،
                                سطح خودت را بسنج و
                                قدم‌به‌قدم پیشرفت کن.
                            </p>

                        </div>

                    \`;

                    const firstCard=
                        app.querySelector(".card");

                    if(firstCard){
                        firstCard.insertAdjacentElement(
                            "afterend",
                            welcome
                        );
                    }

                }

            }catch(e){
                console.error(e);
            }

        },100);

    };

    window.__AN_HOME_PATCHED=true;
}

installHomePatch();


/* =========================================================
   STYLES
========================================================= */

const style=document.createElement("style");

style.textContent=\`

}

}

    animation:ANFade .35s ease;
}

    display:flex;
    align-items:center;

}

    width:70px;
    height:70px;
    min-width:70px;

    font-size:38px;
    background:#ede9fe;
}

.AN-conversation-card h2{
    margin:0 0 5px;
    color:#5b21b6;
}

    margin:0 0 8px;
    color:#777;
    font-size:13px;
}

.AN-update{
    display:inline-block;

    font-weight:bold;
}

@keyframes ANFade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){

    .AN-home-welcome{
        align-items:flex-start;
    }

document.head.appendChild(style);

})();
<\/script>
`;

/* Insert patch safely into original working app */
if(source.includes("</body>")){
    source=source.replace("</body>",patch+"</body>");
}else{
    source+=patch;
}

/* Remove old boot page from wrapper */
document.open();
document.write(source);
document.close();

}catch(error){

document.body.innerHTML=\`
<div style="
min-height:100vh;

">
<div style="

">
<h2 style="color:#6d28d9">

</h2>
<p>

</p>
<button
onclick="location.reload()"
style="

"
>

</button>
</div>
</div>
\`;

}

})();
</script>
</body>
