<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AliNagheliEnglish</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --p:#6d28d9;--p2:#8b5cf6;--p3:#ede9fe;--bg:#f7f5ff;
 --text:#211936;--muted:#756c89;--white:#fff;--green:#16a34a;
 --red:#dc2626;--shadow:0 12px 35px rgba(55,25,100,.12)
}
body{
 margin:0;background:linear-gradient(180deg,#f8f5ff,#fff);
 color:var(--text);font-family:Tahoma,Arial,sans-serif;
 min-height:100vh
}
button,input,select{font-family:inherit}
button{cursor:pointer;border:0}
#app{max-width:520px;margin:auto;min-height:100vh;background:#fff;position:relative}
.hidden{display:none!important}
.screen{min-height:100vh;padding:20px 18px 100px}
.logo{
 text-align:center;font-size:31px;font-weight:900;color:#fff;
 margin:4px auto 25px;padding:17px 10px;border-radius:22px;
 background:linear-gradient(135deg,#4c1d95,#7c3aed,#a78bfa);
 text-shadow:2px 3px 0 #3b0764,0 7px 15px rgba(0,0,0,.25);
 box-shadow:var(--shadow);letter-spacing:.5px
}
.subtitle{text-align:center;color:var(--muted);margin:-12px 0 25px}
.card{
 background:#fff;border-radius:22px;padding:20px;margin:14px 0;
 box-shadow:var(--shadow);border:1px solid #eee8ff
}
.login-card{
 padding:24px;border-radius:28px;
 background:linear-gradient(145deg,#fff,#f5f0ff);
 box-shadow:0 18px 45px rgba(76,29,149,.16)
}
.btn{
 width:100%;padding:15px;border-radius:16px;margin:7px 0;
 font-size:15px;font-weight:bold;transition:.2s
}
.btn:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:white}
.dark{background:#24133d;color:#fff}
.light{background:var(--p3);color:var(--p)}
.vip{background:#e5e7eb;color:#999;cursor:not-allowed}
.danger{background:#fee2e2;color:#b91c1c}
.success{background:#dcfce7;color:#15803d}
input,select{
 width:100%;padding:14px;border:1px solid #ddd3f5;
 border-radius:14px;margin:6px 0 12px;outline:none;background:#fff
}
input:focus,select:focus{border-color:var(--p)}
label{font-size:13px;font-weight:bold}
h1,h2,h3{margin-top:8px}
.section-title{font-size:20px;font-weight:900;margin:20px 0 10px}
.home-hero{
 background:linear-gradient(135deg,#4c1d95,#7c3aed);
 color:#fff;border-radius:26px;padding:22px;
 box-shadow:var(--shadow)
}
.word-card{
 background:linear-gradient(135deg,#f5f3ff,#fff);
 border:1px solid #e9ddff
}
.word-en{font-size:27px;font-weight:900;color:var(--p);direction:ltr;text-align:center}
.word-fa{text-align:center;color:var(--muted);margin:7px}
.speaker{font-size:27px;background:#ede9fe;border-radius:50%;width:52px;height:52px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{
 background:#f7f3ff;border-radius:17px;padding:14px 5px;text-align:center
}
.stat b{display:block;font-size:20px;color:var(--p)}
.nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(520px,100%);background:#fff;border-top:1px solid #eee;
 display:grid;grid-template-columns:repeat(5,1fr);
 padding:8px 5px max(8px,env(safe-area-inset-bottom));
 z-index:20;box-shadow:0 -8px 25px rgba(0,0,0,.07)
}
.nav button{background:none;color:#80768f;font-size:11px;padding:5px}
.nav button.active{color:var(--p);font-weight:bold}
.nav .ico{font-size:23px;display:block;margin-bottom:2px}
.back{
 background:#f1ecff;color:var(--p);border-radius:12px;
 padding:9px 13px;margin-bottom:10px
}
.lesson-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lesson{
 min-height:105px;border-radius:20px;padding:17px;
 background:linear-gradient(145deg,#faf8ff,#eee7ff);
 border:1px solid #e4d9ff;box-shadow:0 8px 20px rgba(76,29,149,.08)
}
.lesson strong{font-size:17px;color:var(--p)}
.lesson small{display:block;margin-top:8px;color:var(--muted)}
.word-row{
 display:flex;align-items:center;justify-content:space-between;
 padding:13px 5px;border-bottom:1px solid #eee
}
.word-row:last-child{border:0}
.word-click{font-weight:bold;color:var(--p);direction:ltr}
.exam-option{
 width:100%;text-align:right;background:#f7f5fb;
 padding:14px;border-radius:13px;margin:7px 0;border:1px solid #eee
}
.exam-option.correct{background:#dcfce7;border-color:#86efac}
.exam-option.wrong{background:#fee2e2;border-color:#fca5a5}
.feedback{text-align:center;font-size:35px;margin:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:center;border-bottom:1px solid #eee;font-size:13px}
th{background:#f1ecff;color:var(--p)}
.pending{
 border-right:5px solid #f59e0b;background:#fffbeb
}
.empty{text-align:center;color:#888;padding:25px}
.toast{
 position:fixed;top:18px;left:50%;transform:translateX(-50%);
 background:#24133d;color:#fff;padding:13px 18px;border-radius:14px;
 z-index:100;display:none;max-width:90%
}
.admin-item{display:flex;justify-content:space-between;align-items:center;gap:8px}
.admin-actions{display:flex;gap:5px}
.admin-actions button{padding:8px;border-radius:10px}
.profile-head{text-align:center}
.avatar{
 width:80px;height:80px;border-radius:50%;margin:auto;
 display:grid;place-items:center;background:linear-gradient(135deg,#6d28d9,#a78bfa);
 color:white;font-size:30px;font-weight:bold
}
.teacher{text-align:center;line-height:2}
.teacher b{color:var(--p)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

<script>
/* =========================
   SUPABASE
========================= */
const SUPABASE_URL="https://kapzyedzjecnfxevjisq.supabase.co";
const SUPABASE_KEY="sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const supabaseClient=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   autoRefreshToken:true,
   persistSession:true,
   detectSessionInUrl:false
  }
 }
);

/* =========================
   STATE
========================= */
let currentUser=null;
let currentStudent=null;
let currentPage="login";
let examAnswers=[];
let examIndex=0;
let examScore=0;
let examType="";

const app=document.getElementById("app");

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;t.style.display="block";
 setTimeout(()=>t.style.display="none",2800)
}

function speak(text){
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=.82;
  speechSynthesis.speak(u)
 }
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]))
}

function render(html){
 app.innerHTML=html
}

function go(page){
 currentPage=page;
 if(page==="home") renderHome();
 else if(page==="courses") renderCourses();
 else if(page==="level") renderLevel();
 else if(page==="profile") renderProfile();
 else if(page==="teacher") renderTeacher();
 else if(page==="admin") renderAdmin();
 else if(page==="login") renderLogin();
 else if(page==="register") renderRegister();
 else if(page==="studentLogin") renderStudentLogin();
 else if(page==="adminLogin") renderAdminLogin();
 else if(page==="grade7") renderGrade7();
 else if(page==="lesson") renderLesson();
 else if(page==="words") renderWords();
 else if(page==="grammar") renderGrammar();
 else if(page==="exam") renderExam();
 else if(page==="examResult") renderExamResult();
}

function nav(active){
 return `
 <div class="nav">
  <button onclick="go('home')" class="${active==='home'?'active':''}">
   <span class="ico">🏠</span>خانه
  </button>
  <button onclick="go('courses')" class="${active==='courses'?'active':''}">
   <span class="ico">📚</span>دوره‌ها
  </button>
  <button onclick="go('level')" class="${active==='level'?'active':''}">

  </button>
  <button onclick="go('profile')" class="${active==='profile'?'active':''}">
   <span class="ico">👤</span>پروفایل
  </button>
  <button onclick="go('teacher')" class="${active==='teacher'?'active':''}">
   <span class="ico">👨‍🏫</span>استاد
  </button>
 </div>`
}

async function adminLogin(){
 const email=document.getElementById("adminEmail").value.trim();
 const password=document.getElementById("adminPass").value;
 if(!email||!password)return toast("ایمیل و رمز عبور را وارد کنید");

 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error)return toast("ورود مدیر ناموفق: "+error.message);

 currentUser=data.user;
 go("admin")
}

function renderStudentLogin(){
 render(`
 <div class="screen">
  <button class="back" onclick="go('login')">→ بازگشت</button>
  <div class="logo">ورود زبان‌آموز</div>

  <div class="card">
   <h2>🎓 ورود به حساب</h2>
   <label>شماره تلفن</label>
   <input id="studentPhone" inputmode="tel" placeholder="مثلاً 09141892768">

   <label>رمز عبور</label>
   <input id="studentPass" type="password" placeholder="رمز عبور">

   <button class="btn primary" onclick="studentLogin()">
    ورود به سامانه
   </button>

   <button class="btn light" onclick="go('register')">
    ثبت‌نام زبان‌آموز جدید
   </button>
  </div>
 </div>`)
}

function normalizePhone(p){
 return String(p||"").replace(/[^\d]/g,"").replace(/^98/,"0")
}

async function studentLogin(){
 const phone=normalizePhone(document.getElementById("studentPhone").value);
 const password=document.getElementById("studentPass").value;

 if(!phone||!password)return toast("شماره تلفن و رمز عبور را وارد کنید");

 const {data:student,error:sErr}=await supabaseClient
  .from("students")
  .select("*")
  .eq("phone",phone)
  .maybeSingle();

 if(sErr)return toast("خطا در اتصال به سامانه: "+sErr.message);
 if(!student)return toast("این شماره در سامانه پیدا نشد.");
 if(student.status!=="registered")
  return toast("حساب شما هنوز توسط مدیر تأیید نشده است.");
 if(!student.auth_user_id)
  return toast("برای این زبان‌آموز حساب ورود ایجاد نشده است.");

 const {data,error}=await supabaseClient.auth.signInWithPassword({
  email:phone+"@alinagheli.com",
  password
 });

 if(error)return toast("ورود ناموفق: شماره یا رمز عبور صحیح نیست.");

 currentUser=data.user;
 currentStudent=student;
 go("home")
}

  <div class="card">

   <input id="rPhone" inputmode="tel" placeholder="0914...">

   <label>سطح فعلی</label>
   <select id="rLevel">
    <option>A1</option><option>A2</option><option>B1</option>
    <option>B2</option><option>C1</option><option>مبتدی</option>
   </select>

   <label>رمز عبور دلخواه</label>
   <input id="rPass" type="password" placeholder="حداقل 6 کاراکتر">

   <button class="btn primary" onclick="registerStudent()">

   </button>
  </div>
 </div>`)

async function registerStudent(){
 const first=document.getElementById("rFirst").value.trim();
 const last=document.getElementById("rLast").value.trim();
 const phone=normalizePhone(document.getElementById("rPhone").value);
 const level=document.getElementById("rLevel").value;
 const pass=document.getElementById("rPass").value;

 if(!first||!last||!phone||!pass)
  return toast("همه اطلاعات را وارد کنید");

 if(pass.length<6)return toast("رمز عبور حداقل 6 کاراکتر باشد");

 const {data:exists,error:e1}=await supabaseClient
  .from("students").select("id,status").eq("phone",phone).maybeSingle();

 if(e1)return toast("خطا در بررسی شماره: "+e1.message);
 if(exists)return toast("این شماره قبلاً ثبت شده است.");

 /*
   ثبت اولیه بدون ساخت Auth از سمت مرورگر.
   مدیر پس از مشاهده درخواست باید حساب Auth را برای کاربر بسازد.
 */
 const {error}=await supabaseClient.from("students").insert({
  first_name:first,
  last_name:last,
  phone:phone,
  level:level,
  status:"waiting",
  password_created:false
 });

 if(error)return toast("ثبت‌نام انجام نشد: "+error.message);

 toast("درخواست شما ثبت شد و منتظر تأیید مدیر است.");
 setTimeout(()=>go("login"),1300);
}

async function loadExamHistory(){
 const box=document.getElementById("examHistory");
 if(!box||!currentUser)return;

 const {data,error}=await supabaseClient
  .from("exam_results")
  .select("*")
  .eq("user_id",currentUser.id)
  .order("created_at",{ascending:true});

 if(error){
  box.innerHTML=`<div class="empty">هنوز رکوردی ثبت نشده است.</div>`;
  return
 }

 document.getElementById("statExam").textContent=data.length;
 const best=data.length?Math.max(...data.map(x=>Number(x.score||0))):0;
 document.getElementById("statBest").textContent=best+"%";

 if(!data.length){
  box.innerHTML=`<div class="empty">هنوز در آزمونی شرکت نکرده‌اید.</div>`;
  return
 }

 box.innerHTML=`
 <table>
 <tr><th>آزمون</th><th>نمره</th><th>تاریخ</th></tr>
 ${data.map((x,i)=>`
 <tr>
  <td>آزمون ${i+1}</td>
  <td><b>${x.score}%</b></td>
  <td>${new Date(x.created_at).toLocaleDateString("fa-IR")}</td>
 </tr>`).join("")}
 </table>`
}

/* =========================
   ADMIN
========================= */
async function renderAdmin(){
 render(`
 <div class="screen">
  <div class="logo">🔐 پنل مدیریت</div>
  <div class="card">
   <h2>مدیریت زبان‌آموزان</h2>
   <p class="small">درخواست‌های ثبت‌نام در این قسمت نمایش داده می‌شوند.</p>
   <div id="adminStudents"><div class="empty">در حال دریافت...</div></div>
  </div>

  <button class="btn danger" onclick="logout()">خروج مدیر</button>
 </div>`);
 loadAdminStudents()
}

async function loadAdminStudents(){
 const box=document.getElementById("adminStudents");
 const {data,error}=await supabaseClient
  .from("students").select("*").order("id",{ascending:false});

 if(error){
  box.innerHTML=`<div class="empty">خطا: ${esc(error.message)}</div>`;
  return
 }

 if(!data.length){
  box.innerHTML=`<div class="empty">هنوز زبان‌آموزی ثبت نشده است.</div>`;
  return
 }

 box.innerHTML=data.map(s=>`
 <div class="card ${s.status==="waiting"?"pending":""}">
  <div class="admin-item">
   <div>
    <b>${esc(s.first_name)} ${esc(s.last_name||"")}</b>
    <div class="small">📱 ${esc(s.phone||"")}</div>
    <div class="small">سطح: ${esc(s.level||"—")}</div>
    <div class="small">وضعیت: ${esc(s.status||"—")}</div>
   </div>

   <div class="admin-actions">
    ${s.status==="waiting"?`
    <button class="success" onclick="approveStudent(${s.id})">✓ تأیید</button>
    <button class="danger" onclick="rejectStudent(${s.id})">× رد</button>
    `:`
    <button class="danger" onclick="deleteStudent(${s.id})">🗑</button>
    `}
   </div>
  </div>
 </div>`).join("")
}

async function approveStudent(id){
 /*
  چون ساخت کاربر Auth با password از سمت browser و با publishable key
  مجاز نیست، این مرحله وضعیت ثبت‌نام را تأیید می‌کند.
  اگر auth_user_id قبلاً ساخته شده باشد، ورود فوراً امکان‌پذیر است.
 */
 const {error}=await supabaseClient.from("students")
  .update({status:"registered"}).eq("id",id);

 if(error)return toast("تأیید انجام نشد: "+error.message);

 toast("زبان‌آموز تأیید شد.");
 loadAdminStudents()
}

async function rejectStudent(id){
 const {error}=await supabaseClient.from("students")
  .update({status:"rejected"}).eq("id",id);

 if(error)return toast("رد درخواست انجام نشد: "+error.message);
 loadAdminStudents()
}

async function deleteStudent(id){
 if(!confirm("این زبان‌آموز حذف شود؟"))return;
 const {error}=await supabaseClient.from("students").delete().eq("id",id);
 if(error)return toast("حذف انجام نشد: "+error.message);
 loadAdminStudents()
}

/* =========================
   LOGOUT / SESSION
========================= */
async function logout(){
 await supabaseClient.auth.signOut();
 currentUser=null;
 currentStudent=null;
 go("login")
}

async function restoreSession(){
 const {data}=await supabaseClient.auth.getSession();
 if(!data.session){
  go("login");return
 }

 currentUser=data.session.user;

 const {data:student}=await supabaseClient
  .from("students").select("*")
  .eq("auth_user_id",currentUser.id)
  .maybeSingle();

 if(student){
  currentStudent=student;
  go("home")
 }else{
  go("admin")
 }
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){
  currentUser=null;
  currentStudent=null;
 }
});

/* =========================
   DATABASE SETUP NOTICE
========================= */
go("login");
</script>
