function toast(message){

toastBox.textContent =
message;

toastBox.classList.remove("hidden");

clearTimeout(window.toastTimer);

window.toastTimer =
setTimeout(
()=>{
toastBox.classList.add("hidden");
},

);

}


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

async function registerStudent(){

if(!supabaseClient){

toast("اتصال به Supabase برقرار نیست");

return;

}

const first =
document.getElementById("regFirst").value.trim();

const last =
document.getElementById("regLast").value.trim();

const phone =
document.getElementById("regPhone").value.trim();

const level =
document.getElementById("regLevel").value;

const password =
document.getElementById("regPassword").value;

if(!first||!last||!phone||!password){

toast("همه اطلاعات را وارد کنید");

return;

}

const email =
phone+"@alinagheli.local";

const result =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
data:{
first_name:first,
last_name:last,
phone:phone,
level:level
}
}

});

if(result.error){

toast(result.error.message);

return;

}

if(!result.data.user){

toast("ثبت‌نام انجام نشد");

return;

}

const insertResult =
await supabaseClient
.from("students")
.insert({

first_name:first,
last_name:last,
phone:phone,
level:level,
status:"waiting",
auth_user_id:result.data.user.id,
password_created:true

});

if(insertResult.error){

toast(
"حساب ساخته شد اما ثبت اطلاعات زبان‌آموز انجام نشد"
);

return;

}

toast("درخواست ثبت‌نام ارسال شد");

closeModal();

}

async function studentLogin(){

if(!supabaseClient){

toast("Supabase بارگذاری نشده است");

return;

}

const phone =
document.getElementById("loginPhone")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

if(!phone||!password){

toast("شماره موبایل و رمز عبور را وارد کنید");

return;

}

const result =
await supabaseClient.auth.signInWithPassword({

email:phone+"@alinagheli.local",

password:password

});

if(result.error){

toast("شماره موبایل یا رمز عبور اشتباه است");

return;

}

currentUser =
result.data.user;

const studentResult =
await supabaseClient
.from("students")
.select("*")
.eq("auth_user_id",currentUser.id)
.maybeSingle();

if(studentResult.error ||
!studentResult.data){

toast("اطلاعات زبان‌آموز پیدا نشد");

await supabaseClient.auth.signOut();

return;

}

if(studentResult.data.status==="waiting"){

toast("حساب شما هنوز توسط مدیر تأیید نشده است");

await supabaseClient.auth.signOut();

return;

}

if(studentResult.data.status==="rejected"){

toast("درخواست ثبت‌نام شما رد شده است");

await supabaseClient.auth.signOut();

return;

}

currentStudent =
studentResult.data;

document.getElementById("welcomeText")
.textContent =
`سلام ${currentStudent.first_name} عزیز 🌷`;

showStudent();

navigate("home");

}

function navigate(page){

document
.querySelectorAll(".nav button")
.forEach(button=>
button.classList.remove("active")
);

const ids={
home:"navHome",
courses:"navCourses",
competition:"navCompetition",
records:"navRecords",
teacher:"navTeacher"
};

if(ids[page])
document
.getElementById(ids[page])
.classList.add("active");

if(page==="home")renderHome();

if(page==="courses")renderCourses();

if(page==="competition")renderCompetition();

if(page==="records")renderRecords();

if(page==="teacher")renderTeacher();

}

/* ==============================

============================== */

function renderLessonTest(qs,title){

const container =
document.getElementById("lessonTest");

currentTest={
questions:qs,
title:title,
score:0,
answered:0,
finished:false
};

container.innerHTML =
qs.map(
(q,i)=>`

<div
class="q"
data-question="${i}"
data-done="0">

<b>
${i+1}. ${escapeHTML(q.q)}
</b>

${q.a.map(
(option,j)=>`

<button
class="opt testOption"
data-question="${i}"
data-option="${j}">

${escapeHTML(option)}

</button>

`
).join("")}

</div>

`
).join("");

document
.querySelectorAll(".testOption")
.forEach(btn=>{

btn.addEventListener(
"click",
()=>answerLesson(
btn,
Number(btn.dataset.question),
Number(btn.dataset.option)
)
});

}


function answerLesson(btn,qIndex,optionIndex){

const questionBox =
btn.closest(".q");

if(questionBox.dataset.done==="1")
return;

questionBox.dataset.done="1";

const q=
currentTest.questions[qIndex];

const options =
questionBox.querySelectorAll(".opt");

options.forEach(
x=>x.disabled=true
);

const correct =
optionIndex===q.c;

if(correct){

currentTest.score++;

btn.classList.add("ok");

btn.innerHTML=
"✓ "+btn.innerHTML;

showFeedback(
true
);

}else{

btn.classList.add("bad");

btn.innerHTML=
"✕ "+btn.innerHTML;

options[q.c]
.classList.add("ok");

showFeedback(
false
);

}

currentTest.answered++;

if(
currentTest.answered===
currentTest.questions.length
){

finishLessonTest();

}

}


async function finishLessonTest(){

if(currentTest.finished)
return;

currentTest.finished=true;

const percentage =
Math.round(
currentTest.score/
currentTest.questions.length*
100
);

const result=
document.createElement("div");

result.className="result";

result.innerHTML=`

<h2>🎉 آزمون تمام شد</h2>

<div class="percent">
${percentage}%
</div>

<p>
${currentTest.score}
پاسخ صحیح از
${currentTest.questions.length}
</p>

<h3>
${
percentage>=80
?"🌟 عالی بود!"
:
percentage>=60
?"😊 خوب بود!"
:
"💪 بیشتر تمرین کن!"
}
</h3>

`;

document
.getElementById("lessonTest")
.appendChild(result);

await saveRecord(
"آزمون",
currentTest.title,
percentage
);

}


function showFeedback(correct){

const feedback =
document.createElement("div");

feedback.className="feedback";

feedback.innerHTML =
correct
?
"🎉<b>آفرین! پاسخ درست است ✓</b>"
:
"😢<b>پاسخ اشتباه است ✕</b>";

document.body.appendChild(
feedback
);

setTimeout(
()=>{
feedback.remove();
},
1100
);

}

document
.querySelectorAll(".approveBtn")
.forEach(btn=>{

btn.addEventListener(
"click",
()=>approveStudent(btn.dataset.id)
);

});

.querySelectorAll(".rejectBtn")
.forEach(btn=>{

"click",

async function approveStudent(id){

const result=
await supabaseClient
.from("students")
.update({
status:"registered"
})
.eq("id",id);

if(result.error){

toast("خطا در تأیید زبان‌آموز");

return;

}

toast("زبان‌آموز تأیید شد");

await loadAdminStudents();

}


async function rejectStudent(id){

const result=
await supabaseClient
.from("students")
.update({
status:"rejected"
})
.eq("id",id);

if(result.error){

toast("خطا در رد درخواست");

return;

}

toast("درخواست رد شد");

await loadAdminStudents();

}


/* ==============================
LOGOUT
============================== */

document
.getElementById("logoutStudentBtn")
.addEventListener(
"click",
logout
);

document
.getElementById("logoutAdminBtn")
.addEventListener(
"click",
logout
);


async function logout(){

try{

if(supabaseClient)
await supabaseClient.auth.signOut();

}catch(error){

console.warn(error);

}

currentUser=null;
currentStudent=null;

showLogin();

}


/* ==============================
SESSION RESTORE
============================== */

async function restoreSession(){

if(!supabaseClient)
return;

try{

const result=
await supabaseClient.auth.getSession();

const session=
result.data.session;

if(!session)
return;

currentUser=
session.user;

if(
currentUser.email===
ADMIN_EMAIL
){

showAdmin();

renderAdmin();

return;

}

const studentResult=
await supabaseClient
.from("students")
.select("*")
.eq("auth_user_id",currentUser.id)
.maybeSingle();

if(
studentResult.data &&
studentResult.data.status==="registered"
){

currentStudent=
studentResult.data;

document
.getElementById("welcomeText")
.textContent=
`سلام ${currentStudent.first_name} عزیز 🌷`;

showStudent();

navigate("home");

}else{

await supabaseClient.auth.signOut();

}

}catch(error){

console.warn(error);

}

}


/* ==============================
START
============================== */

document.addEventListener(
"DOMContentLoaded",
function(){

restoreSession();

}
);

</script>
