<script>
'use strict';

const SUPABASE_URL="https://kapzyedzjecnfxevjisq.supabase.co";
const SUPABASE_KEY="sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const db=supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const ACCESS_FUNCTION=
SUPABASE_URL+"/functions/v1/student-access";

let currentUser=null;
let currentStudent=null;
let currentRole=null;
let currentGrade=null;
let currentLesson=null;
let quizState=null;

function $(id){
 return document.getElementById(id);
}

function esc(x){
 return String(x??"").replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m])
 );
}

function normalizePhone(x){
 let p=String(x||"").trim().replace(/\s+/g,"");

 if(p.startsWith("+98"))
  p="0"+p.slice(3);

 if(p.startsWith("98") && p.length===12)
  p="0"+p.slice(2);

 return p.replace(/\D/g,"");
}

function emailFor(phone){
 return normalizePhone(phone)+"@alinagheli.com";
}

function shuffle(a){
 const x=[...a];

 for(let i=x.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [x[i],x[j]]=[x[j],x[i]];
 }

 return x;
}

function showMsg(text,type="err"){
 const e=$("loginMsg");
 e.textContent=text;
 e.className="msg show "+type;
}

function switchLogin(type){

 $("studentTab").classList.toggle("active",type==="student");
 $("adminTab").classList.toggle("active",type==="admin");

 $("studentLogin").classList.toggle("hidden",type!=="student");
 $("adminLogin").classList.toggle("hidden",type!=="admin");
 $("registerBox").classList.add("hidden");

 $("loginMsg").className="msg";
}

function showRegister(){
 $("studentLogin").classList.add("hidden");
 $("adminLogin").classList.add("hidden");
 $("registerBox").classList.remove("hidden");
 $("loginMsg").className="msg";
}

function showStudentLogin(){
 $("registerBox").classList.add("hidden");
 $("studentLogin").classList.remove("hidden");
 $("adminLogin").classList.add("hidden");
}

async function accessFunction(payload){

 const r=await fetch(
  ACCESS_FUNCTION,
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY
   },
   body:JSON.stringify(payload)
  }
 );

 let data=null;

 try{
  data=await r.json();
 }catch(e){}

 if(!r.ok || data?.ok===false){
  throw new Error(
   data?.error ||
   "خطا در ارتباط با سرور."
  );
 }

 return data;
}


/* =========================================================
   LOGIN STUDENT
========================================================= */

async function studentLogin(){

 const phone=normalizePhone($("studentPhone").value);
 const password=$("studentPassword").value;

 if(!/^09\d{9}$/.test(phone)){
  showMsg("شماره تلفن معتبر نیست.");
  return;
 }

 if(!password){
  showMsg("رمز عبور را وارد کنید.");
  return;
 }

 try{

  const result=await accessFunction({
   action:"find",
   phone
  });

  const student=result.student;
  const email=result.email || emailFor(phone);

  if(!student){
   throw new Error(
    "زبان‌آموزی با این شماره پیدا نشد."
   );
  }

  if(student.status==="rejected"){
   throw new Error(
    "ثبت‌نام شما توسط مدیر رد شده است."
   );
  }

  if(!["registered","approved"].includes(
   String(student.status||"").toLowerCase()
  )){
   throw new Error(
    "ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
   );
  }

  /*
   * ورود واقعی با Supabase Auth
   */
  const auth=await db.auth.signInWithPassword({
   email:String(email).trim(),
   password
  });

  if(auth.error){
   throw new Error(
    "شماره تلفن یا رمز عبور نادرست است."
   );
  }

  currentUser=auth.data.user;
  currentStudent=student;
  currentRole="student";

  await startStudentApp();

 }catch(e){

  try{
   await db.auth.signOut();
  }catch(_){}

  showMsg(
   e?.message ||
   "ورود زبان‌آموز ناموفق بود."
  );
 }
}


/* =========================================================
   LOGIN ADMIN
========================================================= */

async function adminLogin(){

 const email=$("adminEmail").value.trim().toLowerCase();
 const password=$("adminPassword").value;

 if(!email || !password){
  showMsg("ایمیل و رمز عبور مدیر را وارد کنید.");
  return;
 }

 try{

  const auth=await db.auth.signInWithPassword({
   email,
   password
  });

  if(auth.error){
   throw auth.error;
  }

  const uid=auth.data.user.id;

  /*
   * نکته مهم:
   * دیگر id را با UUID مقایسه نمی‌کنیم.
   * جدول admins ممکن است user_id یا auth_user_id داشته باشد.
   */

  let adminRow=null;

  const a1=await db
   .from("admins")
   .select("*")
   .eq("user_id",uid)
   .maybeSingle();

  if(a1.error && !String(a1.error.message).includes("column")){
   throw a1.error;
  }

  adminRow=a1.data || null;

  if(!adminRow){

   const a2=await db
    .from("admins")
    .select("*")
    .eq("auth_user_id",uid)
    .maybeSingle();

   if(!a2.error){
    adminRow=a2.data || null;
   }
  }

  if(!adminRow || adminRow.is_admin!==true){
   await db.auth.signOut();
   throw new Error(
    "این حساب دسترسی مدیر ندارد."
   );
  }

  currentUser=auth.data.user;
  currentStudent=null;
  currentRole="admin";

  showApp();
  renderAdmin();
  openPage("adminPage");

 }catch(e){

  showMsg(
   e?.message ||
   "ورود مدیر ناموفق بود."
  );
 }
}


/* =========================================================
   REGISTER
========================================================= */

async function registerStudent(){

 const first=$("regFirst").value.trim();
 const last=$("regLast").value.trim();
 const phone=normalizePhone($("regPhone").value);
 const password=$("regPassword").value;
 const level=$("regLevel").value;

 if(!first || !last || !phone || !password || !level){
  showMsg("همه موارد را تکمیل کنید.");
  return;
 }

 if(!/^09\d{9}$/.test(phone)){
  showMsg("شماره تلفن معتبر نیست.");
  return;
 }

 if(password.length<6){
  showMsg("رمز عبور باید حداقل ۶ کاراکتر باشد.");
  return;
 }

 const email=emailFor(phone);

 try{

  /*
   * Auth account
   */
  const auth=await db.auth.signUp({
   email,
   password,
   options:{
    data:{
     first_name:first,
     last_name:last,
     phone,
     level
    }
   }
  });

  if(auth.error){
   throw auth.error;
  }

  if(!auth.data.user){
   throw new Error("حساب کاربری ایجاد نشد.");
  }

  /*
   * ثبت اطلاعات در Edge Function
   * تا RLS مانع ثبت اولیه نشود.
   */
  await accessFunction({
   action:"register",
   first_name:first,
   last_name:last,
   phone,
   level,
   auth_user_id:auth.data.user.id,
   email
  });

  await db.auth.signOut();

  showMsg(
   "ثبت‌نام با موفقیت انجام شد. پس از تأیید مدیر می‌توانید وارد شوید.",
   "ok"
  );

  setTimeout(
   showStudentLogin,
   1800
  );

 }catch(e){

  try{
   await db.auth.signOut();
  }catch(_){}

  showMsg(
   e?.message ||
   "ثبت‌نام انجام نشد."
  );
}

function renderCourses(){

 $("coursesPage").innerHTML=`

 <div class="card">

  <h2>📚 دوره‌های زبان انگلیسی</h2>

  <p class="muted">
   لغات این بخش بر اساس فایل «لغات هفتم تا دوازدهم»
   که برای پروژه ارسال شده، مرتب شده‌اند.
  </p>

 </div>

 <div class="grid">

 ${Object.keys(BOOKS).map(g=>`

  <div class="item" onclick="openGrade(${g})">

   <div style="font-size:38px">📘</div>

   <h3>پایه ${g}</h3>

   <p dir="ltr">
    ${esc(BOOKS[g].title)}
   </p>

   <p class="muted">
    ${BOOKS[g].lessons.length} درس
   </p>

  </div>

 `).join("")}

 </div>

 `;

}

function openGrade(grade){

 currentGrade=Number(grade);

 const book=BOOKS[currentGrade];

 $("coursesPage").innerHTML=`

 <button class="btn secondary" onclick="renderCourses()">
 ← بازگشت
 </button>

 <div class="card" style="margin-top:12px">

  <h2>📘 پایه ${currentGrade}</h2>

  <p class="muted" dir="ltr">
   ${esc(book.title)}
  </p>

 </div>

 <div class="lessonGrid">

 ${book.lessons.map((name,i)=>`

  <div class="lessonCard"
       onclick="openLesson(${currentGrade},${i+1})">

   <div class="lessonNo">
    ${i+1}
   </div>

   <h3>
    درس ${i+1}
   </h3>

   <p dir="ltr">
    ${esc(name)}
   </p>

   <p class="muted">
    ${PDF_VOCAB[currentGrade]?.[i+1]?.length||0}
    واژه
   </p>

  </div>

 `).join("")}

 </div>

 `;

 openPage("coursesPage");

}


/* =========================================================
   LESSON
========================================================= */

function openLesson(grade,lesson){

 currentGrade=grade;
 currentLesson=lesson;

 const name=BOOKS[grade].lessons[lesson-1];

 const words=
 PDF_VOCAB[grade]?.[lesson] || [];

 const grammar=
 GRAMMAR[grade]?.[lesson-1] || [];

 $("lessonPage").innerHTML=`

 <button class="btn secondary"
         onclick="openGrade(${grade})">
 ← بازگشت
 </button>

 <div class="card" style="margin-top:12px">

  <h2>
   📖 پایه ${grade} — درس ${lesson}
  </h2>

  <p dir="ltr">
   ${esc(name)}
  </p>

 </div>

 <div class="tabs">

  <button id="lessonGrammarTab"
          class="tab active"
          onclick="lessonTab('grammar')">
   📘 گرامر
  </button>

  <button id="lessonVocabTab"
          class="tab"
          onclick="lessonTab('vocab')">
   🔊 لغات
  </button>

  <button id="lessonQuizTab"
          class="tab"
          onclick="lessonTab('quiz')">
   📝 آزمون
  </button>

========================================================= */

function makeQuestions(grade,lesson){

 const words=
 PDF_VOCAB[grade]?.[lesson] || [];

 const questions=[];

 words.forEach((w,i)=>{

  const wrong=shuffle(
   words
   .filter((_,j)=>j!==i)
   .map(x=>x[1])
  ).slice(0,3);

  if(wrong.length>=3){

   const options=shuffle([
    w[1],
    ...wrong
   ]);

   questions.push({
    q:`معنی «${w[0]}» چیست؟`,
    options,
    answer:options.indexOf(w[1])
   });

  }

 });

 const g=
 GRAMMAR[grade]?.[lesson-1] || [];

 g.forEach((x,i)=>{

  const other=
   g
   .filter((_,j)=>j!==i)
   .map(v=>v[2])
   .slice(0,3);

  if(other.length){

   const options=shuffle([
    x[2],
    ...other
   ]);

   questions.push({
    q:`کدام جمله مربوط به «${x[0]}» است؟`,
    options,
    answer:options.indexOf(x[2])
   });

  }

 });

 return shuffle(questions).slice(
  0,
  Math.min(15,questions.length)
 );
}

function startLessonQuiz(){

 const questions=
 makeQuestions(
  currentGrade,
  currentLesson
 );

 quizState={
  questions,
  index:0,
  correct:0
 };

 renderQuiz("lessonQuizBox");
}

function renderQuiz(id){

 const box=$(id);

 if(!box)return;

 if(quizState.index>=quizState.questions.length){

  finishQuiz(id);
  return;
 }

 const q=quizState.questions[
  quizState.index
 ];

 box.innerHTML=`

 <div class="card">

  <p class="muted">
   سؤال ${quizState.index+1}
   از ${quizState.questions.length}
  </p>

  <h3>
   ${esc(q.q)}
  </h3>

  ${q.options.map((o,i)=>`

   <button class="option"
           onclick="answerQuiz(${i},'${id}')">
    ${esc(o)}
   </button>

  `).join("")}

 </div>

 `;

}

function answerQuiz(index,id){

 const q=
 quizState.questions[
  quizState.index
 ];

 const buttons=
 document.querySelectorAll(".option");

 buttons.forEach(x=>x.disabled=true);

 if(index===q.answer){

  quizState.correct++;

  buttons[index].classList.add("correct");

 }else{

  buttons[index].classList.add("wrong");

  if(buttons[q.answer])
   buttons[q.answer].classList.add("correct");

 }

 setTimeout(()=>{

  quizState.index++;

  renderQuiz(id);

 },650);

}

async function finishQuiz(id){

 const total=quizState.questions.length;

 const percent=
 total
 ?
 Math.round(
  quizState.correct/total*100
 )
 :
 0;

 $(""+id).innerHTML=`

 <div class="card">

  <div class="score">
   ${percent}%
  </div>

  <h2 style="text-align:center">
   آزمون تمام شد 🎉
  </h2>

   ${total}
  </p>

  <button class="btn full"
          onclick="startLessonQuiz()">
   🔄 دوباره آزمون بده
  </button>

 </div>

 `;

 await saveExam(
  "lesson",
  `پایه ${currentGrade} - درس ${currentLesson}`,
  quizState.correct,
  total,
  percent
 );
}

async function loadStudentStats(){

 if(!currentUser)return;

 const local=
  JSON.parse(
   localStorage.getItem("AN_EXAMS")||"[]"
  );

 let best=0;

 local.forEach(x=>{
  best=Math.max(
   best,
   Number(x.percentage)||0
  );
 });

 if($("bestValue"))
  $("bestValue").textContent=best+"%";

 const xp=
  local.reduce(
   (sum,x)=>sum+(Number(x.percentage)||0),
   0
  );

 if($("xpValue"))
  $("xpValue").textContent=xp;

}

   LOGOUT
========================================================= */

async function logout(){

 try{
  await db.auth.signOut();
 }catch(e){}

 currentUser=null;
 currentStudent=null;
 currentRole=null;
 currentGrade=null;
 currentLesson=null;
 quizState=null;

 $("app").classList.add("hidden");
 $("loginScreen").classList.remove("hidden");

 $("studentPhone").value="";
 $("studentPassword").value="";
 $("adminPassword").value="";

 switchLogin("student");

}


/* =========================================================
   AUTH SESSION CHECK
========================================================= */

async function restoreSession(){

 try{

  const session=
   await db.auth.getSession();

  const user=
   session?.data?.session?.user;

  if(!user)return;

  /*
   * مدیر
   */
  let admin=null;

  const a=
   await db
   .from("admins")
   .select("*")
   .eq("user_id",user.id)
   .maybeSingle();

  if(!a.error)
   admin=a.data;

  if(!admin){

   const b=
    await db
    .from("admins")
    .select("*")
    .eq("auth_user_id",user.id)
    .maybeSingle();

   if(!b.error)
    admin=b.data;
  }

  if(admin?.is_admin===true){

   currentUser=user;
   currentRole="admin";

   showApp();
   renderAdmin();
   openPage("adminPage");

   return;
  }

  /*
   * زبان‌آموز
   */
  const s=
   await db
   .from("students")
   .select("*")
   .eq("auth_user_id",user.id)
   .maybeSingle();

  if(!s.error && s.data){

   if(
    ["registered","approved"]
    .includes(
     String(s.data.status||"").toLowerCase()
    )
   ){

    currentUser=user;
    currentStudent=s.data;
    currentRole="student";

    await startStudentApp();

   }else{

    await db.auth.signOut();

   }

  }

 }catch(e){

  console.warn(e);

 }

}

function speak(text){

 if(!("speechSynthesis" in window)){

  alert(
   "مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند."
  );

  return;
 }

 speechSynthesis.cancel();

 const u=
  new SpeechSynthesisUtterance(text);

 u.lang="en-US";
 u.rate=.75;
 u.pitch=1;

 speechSynthesis.speak(u);
}

renderCourses();
renderCompetition();
renderRecords();

restoreSession();
