<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d28d9">
  <title>AliNagheli English</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --primary:#6d28d9;
      --primary2:#8b5cf6;
      --bg:#f7f5fb;
      --card:#fff;
      --text:#211b2d;
      --muted:#766e82;
      --border:#e7e1ef;
      --success:#15803d;
      --danger:#b91c1c;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Tahoma,Arial,sans-serif;
    }

    button,input,select,textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
      border:0;
    }

    .top{
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      color:white;
      padding:18px 16px;
      position:sticky;
      top:0;
      z-index:10;
      box-shadow:0 4px 18px #4c1d9530;
    }

    .toprow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      max-width:1100px;
      margin:auto;
    }

    .brand{
      font-size:22px;
      font-weight:800;
    }

    .sub{
      font-size:12px;
      opacity:.85;
      margin-top:4px;
    }

    .wrap{
      max-width:1100px;
      margin:auto;
      padding:18px 14px 90px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:0 8px 24px #2b18380b;
      margin-bottom:14px;
    }

    .login{
      max-width:460px;
      margin:50px auto;
    }

    .logo{
      width:76px;
      height:76px;
      border-radius:24px;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      color:#fff;
      display:grid;
      place-items:center;
      font-size:27px;
      font-weight:900;
      margin:0 auto 14px;
    }

    h1,h2,h3{
      margin:0 0 12px;
    }

    .muted{
      color:var(--muted);
      font-size:13px;
    }

    .tabs{
      display:flex;
      gap:8px;
      margin-bottom:14px;
    }

    .tab{
      flex:1;
      padding:11px;
      border-radius:12px;
      background:#f0ebf8;
      color:#5b4b70;
    }

    .tab.active{
      background:var(--primary);
      color:#fff;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:10px 0 6px;
    }

    input,select,textarea{
      width:100%;
      padding:12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      outline:none;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:var(--primary);
    }

    .btn{
      background:var(--primary);
      color:#fff;
      padding:12px 16px;
      border-radius:12px;
      font-weight:700;
    }

    .btn.secondary{
      background:#eee8f7;
      color:#4c3568;
    }

    .btn.ok{
      background:#dcfce7;
      color:#166534;
    }

    .btn.small{
      padding:8px 10px;
      font-size:12px;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .row>*{
      flex:1;
      min-width:140px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
    }

    .stat{
      padding:16px;
      border-radius:16px;
      background:#faf8fd;
      border:1px solid var(--border);
    }

    .stat b{
      font-size:25px;
      display:block;
      margin-top:5px;
    }

    .badge{
      display:inline-block;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
    }

    .waiting{
      background:#fff7ed;
      color:#9a3412;
    }

    .registered{
      background:#dcfce7;
      color:#166534;
    }

    .graduate{
      background:#ede9fe;
      color:#5b21b6;
    }

    .student{
      border:1px solid var(--border);
      border-radius:15px;
      padding:14px;
      margin:10px 0;
    }

    .studenthead{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
    }

    .actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:#fff;
      border-top:1px solid var(--border);
      z-index:20;
    }

    .navin{
      max-width:700px;
      margin:auto;
      display:flex;
    }

    .nav button{
      flex:1;
      background:#fff;
      padding:11px 4px;
      color:#6b6175;
      font-size:11px;
    }

    .nav button.active{
      color:var(--primary);
      font-weight:800;
    }

    .notice{
      padding:11px 13px;
      border-radius:12px;
      margin:10px 0;
      font-size:13px;
    }

    .notice.err{
      background:#fee2e2;
      color:#991b1b;
    }

    .notice.ok{
      background:#dcfce7;
      color:#166534;
    }

    .modal{
      position:fixed;
      inset:0;
      background:#160b255c;
      display:grid;
      place-items:center;
      padding:15px;
      z-index:30;
    }

    .modalbox{
      width:min(600px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:20px;
      padding:18px;
    }

    .empty{
      text-align:center;
      padding:30px;
      color:var(--muted);
    }

    @media(max-width:500px){
      .login{
        margin:25px auto;
      }

      .top{
        padding:14px;
      }

      .wrap{
        padding:12px 10px 85px;
      }

      .card{
        padding:14px;
      }
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   STATE
========================= */

const state = {
  user:null,
  profile:null,
  isAdmin:false,
  students:[],
  courses:[],
  loginMode:"student"
};


/* =========================
   HELPERS
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    });

}


function notice(text,type="info"){

  const old=document.getElementById("notice");

  if(old) old.remove();

  const box=document.createElement("div");

  box.id="notice";
  box.className="notice "+type;
  box.textContent=text;

  const wrap=document.querySelector(".wrap");

  if(wrap) wrap.prepend(box);

  setTimeout(function(){

    if(box) box.remove();

  },5000);

}


function studentEmail(phone){

  return String(phone || "")
    .replace(/\D/g,"")
    + "@alinagheli.com";

}


/* =========================
   BOOT
========================= */

async function boot(){

  const result=await db.auth.getSession();

  const session=result.data.session;

  if(session){

    state.user=session.user;

    await loadIdentity();

  }else{

    renderLogin();

  }


  db.auth.onAuthStateChange(
    async function(event,session){

      if(session){

        state.user=session.user;

        await loadIdentity();

      }else{

        state.user=null;
        state.profile=null;
        state.isAdmin=false;

        renderLogin();

      }

    }
  );

}


/* =========================
   IDENTITY
========================= */

async function loadIdentity(){

  state.isAdmin=false;
  state.profile=null;


  if(!state.user){

    renderLogin();

    return;

  }


  /*
    Check admin
  */

  const adminResult =
    await db
      .from("admins")
      .select("id,user_id")
      .eq("user_id",state.user.id)
      .maybeSingle();


  if(adminResult.data){

    state.isAdmin=true;

    await loadAdminData();

    renderApp();

    return;

  }


  /*
    Check student
  */

  const studentResult =
    await db
      .from("students")
      .select("*")
      .eq("auth_user_id",state.user.id)
      .maybeSingle();


  state.profile=studentResult.data || null;

  renderApp();

}


/* =========================
   COURSES
========================= */

async function loadCourses(){

  const result =
    await db
      .from("courses")
      .select("*")
      .order("id");


  if(!result.error){

    state.courses=result.data || [];

  }

}


/* =========================
   ADMIN DATA
========================= */

async function loadAdminData(){

  await loadCourses();


  const result =
    await db
      .from("students")
      .select("*")
      .order("id",{ascending:false});


  if(!result.error){

    state.students=result.data || [];

  }else{

    state.students=[];

  }

}


/* =========================
   HEADER
========================= */

function header(){

  return `

  <div class="top">

    <div class="toprow">

      <div>

        <div class="brand">
          AliNagheli English
        </div>

        <div class="sub">
          ${state.isAdmin ? "پنل مدیریت" : "پنل زبان‌آموز"}
        </div>

      </div>

      <button
        class="btn secondary small"
        onclick="logout()">

        خروج

      </button>

    </div>

  </div>

  `;

}


/* =========================
   LOGIN
========================= */

function renderLogin(){

  document.body.innerHTML=`

  <div class="wrap">

    <div class="card login">

      <div class="logo">
        AN
      </div>

      <h1 style="text-align:center">
        AliNagheli English
      </h1>

      <p
        class="muted"
        style="text-align:center">

        سامانه آموزش زبان انگلیسی

      </p>


      <div class="tabs">

        <button
          class="tab ${state.loginMode==="student"?"active":""}"
          onclick="setLoginMode('student')">

          دانش‌آموز

        </button>


        <button
          class="tab ${state.loginMode==="admin"?"active":""}"
          onclick="setLoginMode('admin')">

          مدیر

        </button>

      </div>


      <div id="loginForm"></div>

    </div>

  </div>

  `;


  renderLoginForm();

}


function setLoginMode(mode){

  state.loginMode=mode;

  renderLogin();

}


function renderLoginForm(){

  const box=document.getElementById("loginForm");


  if(state.loginMode==="admin"){

    box.innerHTML=`

      <label>
        ایمیل مدیر
      </label>

      <input
        id="email"
        type="email"
        placeholder="ایمیل مدیر"
        autocomplete="username">


      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور"
        autocomplete="current-password">


      <button
        class="btn"
        style="width:100%;margin-top:14px"
        onclick="loginAdmin()">

        ورود به پنل مدیریت

      </button>

    `;

  }else{

    box.innerHTML=`

      <label>
        شماره تلفن
      </label>

      <input
        id="phone"
        inputmode="tel"
        placeholder="0914...">


      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور">


      <button
        class="btn"
        style="width:100%;margin-top:14px"
        onclick="loginStudent()">

        ورود دانش‌آموز

      </button>


      <button
        class="btn secondary"
        style="width:100%;margin-top:8px"
        onclick="showRegister()">

        ثبت‌نام دانش‌آموز جدید

      </button>

    `;

  }

}


/* =========================
   ADMIN LOGIN
========================= */

async function loginAdmin(){

  const email=
    document.getElementById("email").value.trim();

  const password=
    document.getElementById("password").value;


  if(!email || !password){

    notice(
      "ایمیل و رمز عبور را وارد کنید.",
      "err"
    );

    return;

  }


  const result=
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(result.error){

    console.error(result.error);

    notice(
      "ایمیل یا رمز عبور مدیر صحیح نیست.",
      "err"
    );

    return;

  }


  state.user=result.data.user;

  await loadIdentity();

}


/* =========================
   STUDENT LOGIN
========================= */

async function loginStudent(){

  const phone=
    document.getElementById("phone").value.trim();

  const password=
    document.getElementById("password").value;


  if(!phone || !password){

    notice(
      "شماره تلفن و رمز عبور را وارد کنید.",
      "err"
    );

    return;

  }


  const result=
    await db.auth.signInWithPassword({

      email:studentEmail(phone),

      password:password

    });


  if(result.error){

    console.error(result.error);

    notice(
      "شماره تلفن یا رمز عبور نادرست است.",
      "err"
    );

    return;

  }


  state.user=result.data.user;

  await loadIdentity();

}


/* =========================
   REGISTER
========================= */

function showRegister(){

  document.getElementById("loginForm").innerHTML=`

    <h3>
      ثبت‌نام دانش‌آموز جدید
    </h3>


    <div class="row">

      <div>

        <label>
          نام
        </label>

        <input id="r_first">

      </div>


      <div>

        <label>
          نام خانوادگی
        </label>

        <input id="r_last">

      </div>

    </div>


    <label>
      شماره تلفن
    </label>

    <input
      id="r_phone"
      inputmode="tel"
      placeholder="0914...">


    <label>
      رمز عبور
    </label>

    <input
      id="r_pass"
      type="password">


    <label>
      پایه / سطح
    </label>

    <input
      id="r_level"
      placeholder="مثلاً پایه نهم">


    <label>
      دوره
    </label>

    <select id="r_course">

      <option value="">
        انتخاب دوره
      </option>

    </select>


    <label>
      هدف
    </label>

    <textarea
      id="r_goal"
      rows="3"
      placeholder="هدف شما از یادگیری زبان">
    </textarea>


    <button
      class="btn"
      style="width:100%;margin-top:12px"
      onclick="registerStudent()">

      ثبت‌نام

    </button>


    <button
      class="btn secondary"
      style="width:100%;margin-top:8px"
      onclick="renderLogin()">

      بازگشت

    </button>

  `;


  loadCourses().then(function(){

    const select=
      document.getElementById("r_course");

    if(!select)return;


    select.innerHTML=
      `<option value="">انتخاب دوره</option>`
      +
      state.courses.map(function(course){

        return `
          <option value="${esc(course.title)}">
            ${esc(course.title)}
          </option>
        `;

      }).join("");

  });

}


async function registerStudent(){

  const first=
    document.getElementById("r_first").value.trim();

  const last=
    document.getElementById("r_last").value.trim();

  const phone=
    document.getElementById("r_phone").value.trim();

  const pass=
    document.getElementById("r_pass").value;


  if(!first || !last || !phone || !pass){

    notice(
      "نام، نام خانوادگی، شماره تلفن و رمز عبور الزامی است.",
      "err"
    );

    return;

  }


  const email=studentEmail(phone);


  const auth=
    await db.auth.signUp({

      email:email,

      password:pass,

      options:{
        data:{
          first_name:first,
          last_name:last,
          phone:phone
        }
      }

    });


  if(auth.error){

    notice(
      auth.error.message,
      "err"
    );

    return;

  }


  if(!auth.data.user){

    notice(
      "حساب کاربری ساخته نشد.",
      "err"
    );

    return;

  }


  const payload={

    first_name:first,

    last_name:last,

    phone:phone,

    level:
      document.getElementById("r_level").value.trim(),

    status:"waiting",

    auth_user_id:auth.data.user.id,

    password_created:true

  };


  const insert=
    await db
      .from("students")
      .insert(payload);


  if(insert.error){

    notice(
      "حساب ساخته شد اما ذخیره اطلاعات دانش‌آموز خطا داد: "
      + insert.error.message,
      "err"
    );

    return;

  }


  notice(
    "ثبت‌نام با موفقیت انجام شد و در صف انتظار قرار گرفت.",
    "ok"
  );


  setTimeout(function(){

    renderLogin();

  },1000);

}


/* =========================
   APP
========================= */

function renderApp(){

  document.body.innerHTML=
    header()
    +
    `<main class="wrap">
      <div id="content"></div>
    </main>`
    +
    (state.isAdmin ? adminNav() : studentNav());


  if(state.isAdmin){

    renderAdmin();

  }else{

    renderStudent();

  }

}


function studentNav(){

  return `

  <nav class="nav">

    <div class="navin">

      <button onclick="renderStudent()">
        🏠<br>
        خانه
      </button>

      <button onclick="loadMyProfile()">
        👤<br>
        پروفایل
      </button>

    </div>

  </nav>

  `;

}


function adminNav(){

  return `

  <nav class="nav">

    <div class="navin">

      <button onclick="renderAdmin()">
        📊<br>
        داشبورد
      </button>


      <button onclick="renderAdminStudents()">
        👩‍🎓<br>
        دانش‌آموزان
      </button>


      <button onclick="renderAdminCourses()">
        📚<br>
        دوره‌ها
      </button>


      <button onclick="logout()">
        🚪<br>
        خروج
      </button>

    </div>

  </nav>

  `;

}


/* =========================
   STUDENT PANEL
========================= */

function renderStudent(){

  const s=state.profile;


  if(!s){

    document.getElementById("content").innerHTML=`

      <div class="card">

        <h2>
          حساب شما پیدا نشد
        </h2>

        <p class="muted">

          حساب Auth وجود دارد اما پروفایل
          دانش‌آموز در جدول students پیدا نشد.

        </p>

      </div>

    `;

    return;

  }


  document.getElementById("content").innerHTML=`

    <div class="card">

      <h2>
        سلام ${esc(s.first_name)} 👋
      </h2>

      <p class="muted">
        وضعیت ثبت‌نام شما
      </p>


      <div class="grid">

        <div class="stat">

          وضعیت

          <b>
            ${statusBadge(s.status)}
          </b>

        </div>


        <div class="stat">

          پایه / سطح

          <b>
            ${esc(s.level || "-")}
          </b>

        </div>


        <div class="stat">

          شماره تلفن

          <b>
            ${esc(s.phone)}
          </b>

        </div>

      </div>

    </div>


    <div class="card">

      <h3>
        وضعیت ثبت‌نام
      </h3>

      <p>

        ${
          s.status==="waiting"

          ?

          "ثبت‌نام شما در صف بررسی مدیریت قرار دارد."

          :

          s.status==="registered"

          ?

          "ثبت‌نام شما تأیید شده است. خوش آمدید! 🎉"

          :

          "وضعیت شما: فارغ‌التحصیل"

        }

      </p>

    </div>

  `;

}


async function loadMyProfile(){

  await loadIdentity();

}


/* =========================
   STATUS
========================= */

function statusBadge(status){

  let cls="waiting";

  let text="در صف انتظار";


  if(status==="registered"){

    cls="registered";

    text="ثبت‌نام شده";

  }


  if(status==="graduate"){

    cls="graduate";

    text="فارغ‌التحصیل";

  }


  return `

    <span class="badge ${cls}">
      ${text}
    </span>

  `;

}


/* =========================
   ADMIN DASHBOARD
========================= */

function renderAdmin(){

  const students=state.students;


  const waiting=
    students.filter(
      s=>s.status==="waiting"
    ).length;


  const registered=
    students.filter(
      s=>s.status==="registered"
    ).length;


  const graduate=
    students.filter(
      s=>s.status==="graduate"
    ).length;


  document.getElementById("content").innerHTML=`

    <div class="card">

      <h2>
        داشبورد مدیریت 👨‍💼
      </h2>


      <div class="grid">

        <div class="stat">
          کل دانش‌آموزان
          <b>${students.length}</b>
        </div>


        <div class="stat">
          در صف انتظار
          <b>${waiting}</b>
        </div>


        <div class="stat">
          ثبت‌نام شده
          <b>${registered}</b>
        </div>


        <div class="stat">
          فارغ‌التحصیل
          <b>${graduate}</b>
        </div>

      </div>

    </div>


    <div class="card">

      <h3>
        ثبت‌نام‌های جدید ⏳
      </h3>


      ${
        students
        .filter(s=>s.status==="waiting")
        .slice(0,10)
        .map(studentCard)
        .join("")
        ||
        '<div class="empty">ثبت‌نام در انتظاری وجود ندارد.</div>'
      }

    </div>

  `;

}


/* =========================
   STUDENT MANAGEMENT
========================= */

function renderAdminStudents(){

  document.getElementById("content").innerHTML=`

    <div class="card">

      <h2>
        مدیریت دانش‌آموزان
      </h2>


      <input
        class="search"
        id="q"
        placeholder="جستجو بر اساس نام، شماره یا پایه..."
        oninput="filterStudents()">


      <div id="studentList"></div>

    </div>

  `;


  filterStudents();

}


function filterStudents(){

  const q=
    (document.getElementById("q")?.value || "")
    .trim()
    .toLowerCase();


  const students=
    state.students.filter(function(s){

      return (

        `${s.first_name} ${s.last_name} ${s.phone} ${s.level}`
        .toLowerCase()
        .includes(q)

      );

    });


  document.getElementById("studentList").innerHTML=

    students.map(studentCard).join("")
    ||
    '<div class="empty">موردی پیدا نشد.</div>';

}


function studentCard(s){

  return `

    <div class="student">

      <div class="studenthead">

        <div>

          <b>
            ${esc(s.first_name)}
            ${esc(s.last_name)}
          </b>

          <div class="muted">

            ${esc(s.phone)}
            ·
            ${esc(s.level || "بدون سطح")}

          </div>

        </div>


        ${statusBadge(s.status)}

      </div>


      <div class="actions">

        ${
          s.status==="waiting"

          ?

          `
          <button
            class="btn small ok"
            onclick="setStatus(${s.id},'registered')">

            ✅ تأیید ثبت‌نام

          </button>
          `

          :

          ""
        }


        ${
          s.status==="registered"

          ?

          `
          <button
            class="btn small secondary"
            onclick="setStatus(${s.id},'graduate')">

            🎓 فارغ‌التحصیل

          </button>
          `

          :

          ""
        }


        ${
          s.status!=="waiting"

          ?

          `
          <button
            class="btn small secondary"
            onclick="setStatus(${s.id},'waiting')">

            ↩ بازگشت به صف

          </button>
          `

          :

          ""
        }


        <button
          class="btn small secondary"
          onclick="editStudent(${s.id})">

          ✏️ ویرایش

        </button>

      </div>

    </div>

  `;

}


/* =========================
   CHANGE STATUS
========================= */

async function setStatus(id,status){

  const result=
    await db
      .from("students")
      .update({
        status:status
      })
      .eq("id",id);


  if(result.error){

    notice(
      result.error.message,
      "err"
    );

    return;

  }


  const student=
    state.students.find(
      s=>s.id===id
    );


  if(student){

    student.status=status;

  }


  renderAdmin();


  notice(
    "وضعیت با موفقیت تغییر کرد.",
    "ok"
  );

}


/* =========================
   EDIT STUDENT
========================= */

function editStudent(id){

  const s=
    state.students.find(
      x=>x.id===id
    );


  if(!s)return;


  document.body.insertAdjacentHTML(

    "beforeend",

    `

    <div
      class="modal"
      id="modal">

      <div class="modalbox">

        <h3>
          ویرایش دانش‌آموز
        </h3>


        <div class="row">

          <div>

            <label>
              نام
            </label>

            <input
              id="e_first"
              value="${esc(s.first_name)}">

          </div>


          <div>

            <label>
              نام خانوادگی
            </label>

            <input
              id="e_last"
              value="${esc(s.last_name)}">

          </div>

        </div>


        <label>
          شماره تلفن
        </label>

        <input
          id="e_phone"
          value="${esc(s.phone)}">


        <label>
          پایه / سطح
        </label>

        <input
          id="e_level"
          value="${esc(s.level)}">


        <div class="actions">

          <button
            class="btn"
            onclick="saveStudent(${id})">

            ذخیره

          </button>


          <button
            class="btn secondary"
            onclick="closeModal()">

            انصراف

          </button>

        </div>

      </div>

    </div>

    `

  );

}


async function saveStudent(id){

  const data={

    first_name:
      document.getElementById("e_first").value.trim(),

    last_name:
      document.getElementById("e_last").value.trim(),

    phone:
      document.getElementById("e_phone").value.trim(),

    level:
      document.getElementById("e_level").value.trim()

  };


  const result=
    await db
      .from("students")
      .update(data)
      .eq("id",id);


  if(result.error){

    notice(
      result.error.message,
      "err"
    );

    return;

  }


  closeModal();

  await loadAdminData();

  renderAdminStudents();


  notice(
    "اطلاعات ذخیره شد.",
    "ok"
  );

}


/* =========================
   COURSES
========================= */

function renderAdminCourses(){

  document.getElementById("content").innerHTML=`

    <div class="card">

      <h2>
        دوره‌ها 📚
      </h2>


      ${
        state.courses.length

        ?

        state.courses.map(function(course){

          return `

          <div class="student">

            <b>
              ${esc(course.title)}
            </b>

            <div class="muted">

              ${esc(course.category || "")}

              ·

              ${
                course.active===false
                ?
                "غیرفعال"
                :
                "فعال"
              }

            </div>

          </div>

          `;

        }).join("")

        :

        '<div class="empty">دوره‌ای پیدا نشد.</div>'

      }

    </div>

  `;

}


/* =========================
   MODAL
========================= */

function closeModal(){

  const modal=
    document.getElementById("modal");

  if(modal){

    modal.remove();

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  state.user=null;
  state.profile=null;
  state.isAdmin=false;

  renderLogin();

}


/* =========================
   START
========================= */

boot();

</script>

</body>
</html>
