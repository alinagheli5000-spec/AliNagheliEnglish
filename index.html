function esc(x){

return String(x??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}

function normalizePhone(x){

return String(x||"").replace(/\D/g,"");

function saveLocal(){

"AN_EXAMS",

function speak(text){

if(!window.speechSynthesis){

alert(
"مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند."
);

return;

}

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="en-US";
u.rate=.75;

speechSynthesis.resume();
speechSynthesis.speak(u);

}

async function accessFunction(payload){

const r=
await fetch(
ACCESS_FUNCTION,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY

data?.error||

}

return data;

/* =========================================================
   XP / PROGRESS
========================================================= */

function calculateLevel(xp){

return Math.max(
1,
Math.floor(Number(xp||0)/100)+1
);

}

function xpForLevel(level){

return (Number(level)-1)*100;

}

async function loadStudentStats(){

if(!S.student)return;

S.xp=0;
S.level=1;
S.progress={};
S.achievements=[];

try{

const xp=
await db
.from("student_xp")
.select("xp,level")
.eq("student_id",S.student.id)
.maybeSingle();

if(xp.data){

S.xp=Number(xp.data.xp||0);

S.level=
Number(
xp.data.level||
calculateLevel(S.xp)
);

}

}catch(e){}

try{

const p=
await db
.from("student_progress")
.select(
"lesson_id,progress,completed"
)
.eq("student_id",S.student.id);

if(p.data){

p.data.forEach(x=>{

S.progress[x.lesson_id]={
progress:Number(x.progress||0),
completed:Boolean(x.completed)
};

});

}

}catch(e){}

try{

const a=
await db
.from("student_achievements")
.select(
"achievement_key,title"
)
.eq("student_id",S.student.id);

if(a.data){

S.achievements=a.data;

}

}catch(e){}

}

async function addXP(amount){

if(!S.student)return;

const oldLevel=
calculateLevel(S.xp);

S.xp+=Number(amount||0);

S.level=
calculateLevel(S.xp);

try{

await db
.from("student_xp")
.upsert(
{
student_id:S.student.id,
xp:S.xp,
level:S.level,
updated_at:new Date().toISOString()
},
{
onConflict:"student_id"
}
);

}catch(e){}

if(S.level>oldLevel){

await unlockAchievement(
"level_"+S.level,
"رسیدن به Level "+S.level
);

}

}

async function unlockAchievement(key,title){

if(!S.student)return;

if(
S.achievements.some(
x=>x.achievement_key===key
)
)return;

try{

const r=
await db
.from("student_achievements")
.insert(
{
student_id:S.student.id,
achievement_key:key,
title
}
);

if(!r.error){

S.achievements.push({
achievement_key:key,
title
});

}

}catch(e){}

}

async function saveProgress(
lessonId,
progress,
completed
){

if(!S.student)return;

S.progress[lessonId]={
progress,
completed
};

try{

await db
.from("student_progress")
.upsert(
{
student_id:S.student.id,
lesson_id:lessonId,
progress,
completed,
completed_at:
completed?
new Date().toISOString():
null
},
{
onConflict:"student_id,lesson_id"
}
);

}catch(e){}

}

async function studentLogin(){

const phone=
document.getElementById("phone")?.
value.trim();

const password=
document.getElementById("pass")?.
value;

if(!phone||!password){

alert(
"شماره تلفن و رمز عبور را وارد کنید."
);

return;

}

try{

const result=
await accessFunction(
{
action:"find",
phone
}
);

const student=result.student;
const email=result.email;

if(!student){

throw new Error(
"زبان‌آموزی با این شماره پیدا نشد."
);

}

if(student.status==="rejected"){

throw new Error(
"ثبت‌نام شما توسط مدیر رد شده است."
);

}

if(
student.status!=="registered" &&
student.status!=="approved"
){

throw new Error(
"ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
);

}

if(!email){

throw new Error(
"ایمیل ورود زبان‌آموز پیدا نشد."
);

}

const auth=
await db.auth.signInWithPassword(
{
email:String(email).trim(),
password
}
);

if(auth.error){

throw new Error(
"رمز عبور صحیح نیست."
);

}

S.student=student;
S.admin=false;

await loadStudentStats();

home();

}catch(e){

alert(
e?.message||
"ورود ناموفق بود."
);

}

}

async function register(){

const first=
document.getElementById("rf")?.
value.trim();

const last=
document.getElementById("rl")?.
value.trim();

const phone=
document.getElementById("rp")?.
value.trim();

const password=
document.getElementById("rpass")?.
value;

const level=
document.getElementById("rlevel")?.
value;

if(
!first||
!last||
!phone||
!password||
!level
){

alert(
"همه موارد را تکمیل کنید."
);

return;

}

if(password.length<6){

alert(
"رمز عبور باید حداقل ۶ کاراکتر باشد."
);

return;

}

const digits=
normalizePhone(phone);

if(digits.length<10){

alert(
"شماره تلفن معتبر نیست."
);

return;

}

const email=
digits+"@alinagheli.com";

try{

/*
   ایجاد حساب احراز هویت
*/

const r=
await db.auth.signUp(
{
email,
password,
options:{
data:{
first_name:first,
last_name:last,
phone:digits,
level
}
}
}
);

if(r.error){

/*
   اگر کاربر قبلاً وجود داشته باشد،
   پیام واضح نمایش داده می‌شود.
*/

if(
r.error.message
.toLowerCase()
.includes("already")
){

throw new Error(
"این شماره تلفن قبلاً ثبت‌نام کرده است."
);

}

throw r.error;

}

if(!r.data.user){

throw new Error(
"حساب کاربری ساخته نشد."
);

}

/*
   ثبت اطلاعات دانش‌آموز
   در Edge Function
*/

await accessFunction(
{
action:"register",
first_name:first,
last_name:last,
phone:digits,
level,
auth_user_id:r.data.user.id,
email
}
);

await db.auth.signOut();

alert(
"ثبت‌نام با موفقیت انجام شد.\n\n"+
"پس از تأیید مدیر می‌توانید وارد شوید."
);

login();

}catch(e){

try{
await db.auth.signOut();
}catch(_){}

alert(
"ثبت‌نام انجام نشد:\n"+
(e?.message||"خطای نامشخص")
);

}

}

/* =========================================================

========================================================= */

function makeLessonQuestions(){

const gradeNo=
String(S.grade);

const lessonNo=
String(S.lesson+1);

const content=
schoolContent[gradeNo]?.[lessonNo];

if(!content)return[];

const vocab=
content.vocabulary||[];

let arr=[];


/* Vocabulary questions */

vocab.forEach((w,i)=>{

const alternatives=
vocab
.filter((_,index)=>index!==i)
.slice(0,2)
.map(x=>x[1]);

if(alternatives.length>=2){

arr.push({

q:
`معنی واژه "${w[0]}" چیست؟`,

options:[
w[1],
alternatives[0],
alternatives[1]
],

answer:0

});

}

});


/* Theme */

const themes=
Object.values(
schoolContent[gradeNo]||{}
)
.map(x=>x.theme)
.filter(Boolean);

const otherThemes=
themes
.filter(x=>x!==content.theme);

if(otherThemes.length>=2){

arr.push({

q:
`موضوع اصلی ${books[S.grade].lessons[S.lesson]} چیست؟`,

options:[
content.theme,
otherThemes[0],
otherThemes[1]
],

answer:0

});

}


/* Function */

arr.push({

q:
"هدف اصلی این درس چیست؟",

options:[
content.function,
"Talking about unrelated topics",
"Reading numbers only"
],

answer:0

});


return arr.slice(0,15);

}

function startLessonQuiz(){

const questions=
makeLessonQuestions();

S.quiz={

type:"lesson",

title:
`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,

questions,

i:0,

correct:0,

wrong:0

};

quizRender("lessonQuiz");

}


/* =========================================================
   QUIZ
========================================================= */

function shuffleQuestionOptions(q){

const correct=
q.options[q.answer];

const shuffled=
[...q.options]
.sort(
()=>Math.random()-.5
);

q.options=shuffled;

q.answer=
shuffled.indexOf(correct);

}

function quizRender(id){

const q=
S.quiz.questions[S.quiz.i];

if(!q){

quizFinish(id);

return;

}

shuffleQuestionOptions(q);

const el=
document.getElementById(id);

if(!el)return;

el.innerHTML=`

<div class="card">

<b>

سؤال
${S.quiz.i+1}
از
${S.quiz.questions.length}

</b>

<div class="progress">

<i
style="
width:${
S.quiz.i/
S.quiz.questions.length*
100
}%">

</i>

</div>

<div
style="
font-size:18px;
font-weight:bold;
line-height:2;
margin:15px 0">

${esc(q.q)}

</div>

${q.options.map((x,i)=>`

<button
class="option"
onclick="answer(${i},'${id}')">

${esc(x)}

</button>

`).join("")}

<div id="fb"></div>

</div>

`;

}

function answer(i,id){

const q=
S.quiz.questions[S.quiz.i];

const opts=
document.querySelectorAll(".option");

opts.forEach(x=>{
x.disabled=true;
});

if(i===q.answer){

S.quiz.correct++;

opts[i].classList.add(
"correct"
);

document.getElementById("fb")
.className=
"feedback ok";

document.getElementById("fb")
.innerHTML=
"✅ 😊 آفرین! پاسخ درست است.";

}else{

S.quiz.wrong++;

opts[i].classList.add(
"wrong"
);

opts[q.answer]
.classList.add(
"correct"
);

document.getElementById("fb")
.className=
"feedback bad";

document.getElementById("fb")
.innerHTML=
"❌ 😢 پاسخ اشتباه است.";

}

setTimeout(()=>{

S.quiz.i++;

quizRender(id);

},900);

}

function startContest(g){

const all=[];

for(
let gradeNo=7;
gradeNo<=12;
gradeNo++
){

const lessons=
schoolContent[
String(gradeNo)
]||{};

Object.keys(lessons)
.forEach(lessonNo=>{

const vocab=
lessons[lessonNo]
.vocabulary||[];

vocab.forEach(w=>{

all.push({
q:
`معنی واژه "${w[0]}" چیست؟`,
answer:w[1]
});

});

});

}

if(all.length<3){

alert(
"محتوای مسابقه کافی نیست."
);

return;

}

const shuffled=
[...all]
.sort(()=>Math.random()-.5);

const selected=
shuffled.slice(
0,
Math.min(20,shuffled.length)
);

const questions=
selected.map((item,index)=>{

const distractors=
all
.filter(x=>x.answer!==item.answer)
.sort(()=>Math.random()-.5)
.slice(0,3)
.map(x=>x.answer);

return{

q:item.q,

options:[
item.answer,
...distractors
],

answer:0

};

});

S.quiz={

type:"contest",

title:
"مسابقه پایه "+g,

questions,

i:0,

correct:0,

wrong:0

};

render(
"مسابقه",

);

quizRender(
"contestQuiz"
);

}

<div class="icon">
✅
</div>

<h3>
تأیید شده
</h3>

<div class="statNumber">

${
students.filter(
x=>
x.status==="registered"||
x.status==="approved"
).length
}

</div>

</div>


<div class="item">

<div class="icon">
❌
</div>

<h3>
رد شده
</h3>

<div class="statNumber">

${
students.filter(
x=>x.status==="rejected"
).length
}

</div>

</div>

</div>


<div class="card">

<h3>
📋 ثبت‌نام‌ها
</h3>

${
students.length
?
students.map(x=>`

<div class="adminRow">

<b>

${esc(x.first_name)}
${esc(x.last_name)}

</b>

<div class="muted">

📱
${esc(x.phone||"")}

<br>

🎓 پایه:
${esc(x.level||"-")}

<br>

✉️
${esc(
x.login_email||
x.email||
"-"
)}

</div>


<div
style="margin-top:10px">

${
x.status==="waiting"
?
`

<button
class="btn success"
onclick='approve(${JSON.stringify(x.id)})'>

✅ تأیید

</button>

<button
class="btn danger"
onclick='rejectStudent(${JSON.stringify(x.id)})'>

❌ رد

</button>

`
:
(
x.status==="registered"||
x.status==="approved"
)
?
`

<span>
✅ تأیید شده
</span>

<button
class="btn danger"
onclick='rejectStudent(${JSON.stringify(x.id)})'>

رد / حذف

</button>

`
:
`

<span>
❌ رد شده
</span>

<button
class="btn success"
onclick='approve(${JSON.stringify(x.id)})'>

تأیید مجدد

</button>

`
}

</div>

</div>

`).join("")
:
`

<div class="empty">

📭

<p>
ثبت‌نامی وجود ندارد.
</p>

</div>

`
}

</div>


<button
class="btn secondary full"
onclick="logout()">

خروج

</button>

</main>

`;

}

async function approve(id){

try{

const r=
await db
.from("students")
.update(
{
status:"registered"
}
)
.eq("id",id);

if(r.error){

throw r.error;

}

alert(
"زبان‌آموز با موفقیت تأیید شد."
);

admin();

}catch(e){

alert(
"خطا در تأیید:\n"+
e.message
);

}

}

async function rejectStudent(id){

if(
!confirm(
"آیا از رد کردن این زبان‌آموز مطمئن هستید؟"
)
){

return;

}

try{

const r=
await db
.from("students")
.update(
{
status:"rejected"
}
)
.eq("id",id);

if(r.error){

throw r.error;

}

alert(
"وضعیت زبان‌آموز به رد شده تغییر کرد."
);

admin();

}catch(e){

alert(
"خطا در رد کردن:\n"+
e.message
);

}

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

try{

await db.auth.signOut();

}catch(e){}

S={
student:null,
admin:false,
grade:null,
lesson:null,
quiz:null,
xp:0,
level:1,
progress:{},
achievements:[]
};

login();

}


/* =========================================================
   AUTH STATE
========================================================= */

let booting=true;

db.auth.onAuthStateChange(
(event,session)=>{

if(booting)return;

if(event==="SIGNED_OUT"){

if(
!S.admin&&
!S.student
){

login();

}

}

}
);


/* =========================================================
   STARTUP
========================================================= */

async function startup(){

try{

const r=
await db.auth.getSession();

const session=
r.data?.session;

if(!session){

booting=false;

login();

return;

}

const user=
session.user;

if(
(user.email||"")
.toLowerCase()===
"alinagheli@gmail.com"
){

S.admin=true;

booting=false;

await admin();

return;

}


const st=
await db
.from("students")
.select("*")
.eq(
"auth_user_id",
user.id
)
.maybeSingle();

if(
st.data&&
(
st.data.status==="registered"||
st.data.status==="approved"
)
){

S.student=
st.data;

S.admin=false;

await loadStudentStats();

booting=false;

home();

return;

}

await db.auth.signOut();

booting=false;

login();

}catch(e){

try{

await db.auth.signOut();

}catch(_){}

booting=false;

login();

}

}


/* =========================================================
   START
========================================================= */

startup();

</script>
