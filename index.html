<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f5f3ff;
color:#1f2937;
}
button,input,select{font-family:inherit}
.hidden{display:none!important}

#app{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:430px;
background:#fff;
border-radius:28px;
padding:30px 24px;
box-shadow:0 15px 50px #4c1d9530;
}

.logo{
width:85px;
height:85px;
border-radius:25px;
background:linear-gradient(135deg,#7c3aed,#4f46e5);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
margin:0 auto 18px;
box-shadow:0 10px 25px #6d28d950;
}

h1{
text-align:center;
margin:8px 0;
font-size:25px;
color:#4c1d95;
}

.subtitle{
text-align:center;
color:#6b7280;
margin-bottom:25px;
font-size:14px;
}

.tabs{
display:flex;
background:#f3f0ff;
padding:5px;
border-radius:15px;
margin-bottom:20px;
}

.tabs button{
flex:1;
border:0;
background:transparent;
padding:12px;
border-radius:11px;
cursor:pointer;
color:#6b7280;
font-weight:bold;
}

.tabs button.active{
background:#6d28d9;
color:#fff;
}

.field{
margin-bottom:15px;
}

.field label{
display:block;
font-size:13px;
margin-bottom:7px;
font-weight:bold;
}

.field input{
width:100%;
border:1px solid #ddd6fe;
border-radius:13px;
padding:13px;
font-size:15px;
outline:none;
direction:ltr;
text-align:left;
}

.field input:focus{
border-color:#7c3aed;
box-shadow:0 0 0 3px #7c3aed18;
}

.login-btn{
width:100%;
border:0;
border-radius:14px;
padding:14px;
background:linear-gradient(135deg,#7c3aed,#5b21b6);
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:5px;
}

.login-btn:disabled{
opacity:.6;
}

.message{
margin-top:15px;
padding:11px;
border-radius:12px;
font-size:13px;
text-align:center;
display:none;
}

.message.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.message.success{
display:block;
background:#dcfce7;
color:#166534;
}

#dashboard{
min-height:100vh;
width:100%;
background:#f8f7ff;
}

.topbar{
height:70px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
box-shadow:0 2px 15px #0000000b;
position:sticky;
top:0;
z-index:10;
}

.brand{
font-size:20px;
font-weight:bold;
color:#5b21b6;
}

.logout{
border:0;
background:#ede9fe;
color:#5b21b6;
padding:9px 15px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.content{
max-width:1100px;
margin:auto;
padding:25px 18px;
}

.welcome{
background:linear-gradient(135deg,#6d28d9,#4f46e5);
color:white;
border-radius:22px;
padding:25px;
margin-bottom:20px;
}

.welcome h2{
margin:0 0 8px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:20px;
}

.stat{
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:0 5px 20px #00000008;
}

.stat strong{
display:block;
font-size:25px;
color:#6d28d9;
margin-bottom:5px;
}

.stat span{
font-size:12px;
color:#6b7280;
}

.card{
background:#fff;
border-radius:20px;
padding:20px;
box-shadow:0 5px 20px #00000008;
margin-bottom:18px;
}

.card h3{
margin-top:0;
color:#4c1d95;
}

.student{
border:1px solid #ede9fe;
border-radius:15px;
padding:15px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.student-name{
font-weight:bold;
}

.badge{
padding:6px 10px;
border-radius:20px;
font-size:11px;
background:#ede9fe;
color:#5b21b6;
}

.empty{
text-align:center;
color:#9ca3af;
padding:25px;
}

@media(max-width:600px){
.stats{
grid-template-columns:1fr;
}
.topbar{
padding:0 12px;
}
.content{
padding:18px 12px;
}
}
</style>
</head>

<body>

<div id="app">

<div id="loginPage" class="login-box">

<div class="logo">AN</div>

<h1>AliNagheli English</h1>
<div class="subtitle">سامانه آموزش زبان انگلیسی</div>

<div class="tabs">
<button id="studentTab" class="active" onclick="setLoginType('student')">زبان‌آموز</button>
<button id="adminTab" onclick="setLoginType('admin')">مدیر</button>
</div>

<form id="loginForm">

<div class="field">
<label id="usernameLabel">شماره موبایل</label>
<input
id="username"
type="text"
inputmode="tel"
autocomplete="username"
placeholder="09123456789"
required>
</div>

<div class="field">
<label>رمز عبور</label>
<input
id="password"
type="password"
autocomplete="current-password"
placeholder="رمز عبور"
required>
</div>

<button id="loginBtn" class="login-btn" type="submit">
ورود
</button>

</form>

<div id="message" class="message"></div>

</div>

</div>


<div id="dashboard" class="hidden">

<div class="topbar">
<div class="brand">AliNagheli English</div>
<button class="logout" onclick="logout()">خروج</button>
</div>

<div class="content">

<div class="welcome">
<h2 id="welcomeTitle">خوش آمدید 🌟</h2>
<div id="welcomeText">به سامانه AliNagheli English خوش آمدید.</div>
</div>

<div id="adminPanel" class="hidden">

<div class="stats">

<div class="stat">
<strong id="waitingCount">0</strong>
<span>در صف انتظار</span>
</div>

<div class="stat">
<strong id="registeredCount">0</strong>
<span>ثبت‌نام شده</span>
</div>

<div class="stat">
<strong id="graduateCount">0</strong>
<span>فارغ‌التحصیل</span>
</div>

</div>

<div class="card">
<h3>زبان‌آموزان</h3>
<div id="studentsList"></div>
</div>

</div>


<div id="studentPanel" class="hidden">

<div class="card">
<h3>اطلاعات زبان‌آموز</h3>
<div id="studentInfo"></div>
</div>

</div>

</div>
</div>


<script>
/* ================================
   SUPABASE CONFIG
================================ */

const SUPABASE_URL =
"https://YOUR_PROJECT_ID.supabase.co";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";


/* ================================
   STATE
================================ */

let loginType = "student";
let currentUser = null;


/* ================================
   ELEMENTS
================================ */

const loginPage = document.getElementById("loginPage");
const dashboard = document.getElementById("dashboard");

const loginForm = document.getElementById("loginForm");
const username = document.getElementById("username");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");

const message = document.getElementById("message");

const studentTab = document.getElementById("studentTab");
const adminTab = document.getElementById("adminTab");

const adminPanel = document.getElementById("adminPanel");
const studentPanel = document.getElementById("studentPanel");

const welcomeTitle = document.getElementById("welcomeTitle");
const welcomeText = document.getElementById("welcomeText");


/* ================================
   LOGIN TYPE
================================ */

function setLoginType(type){

loginType = type;

studentTab.classList.toggle(
"active",
type === "student"
);

adminTab.classList.toggle(
"active",
type === "admin"
);

document.getElementById("usernameLabel").textContent =
type === "student"
? "شماره موبایل"
: "نام کاربری مدیر";

username.placeholder =
type === "student"
? "09123456789"
: "admin";

clearMessage();

}


/* ================================
   MESSAGE
================================ */

function showMessage(text,type="error"){

message.textContent = text;
message.className = "message " + type;

}

function clearMessage(){

message.textContent = "";
message.className = "message";

}


/* ================================
   SUPABASE REQUEST
================================ */

async function supabaseRequest(
path,
options={}
){

const response = await fetch(
SUPABASE_URL + path,
{
...options,
headers:{
"apikey":SUPABASE_ANON_KEY,
"Authorization":
"Bearer " + SUPABASE_ANON_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation",
...(options.headers || {})
}
}
);

const text = await response.text();

let data = null;

try{
data = text ? JSON.parse(text) : null;
}catch{
data = text;
}

if(!response.ok){

let errorText = "خطا در ارتباط با سرور";

if(data){

if(data.message)
errorText = data.message;

else if(data.error_description)
errorText = data.error_description;

else if(data.hint)
errorText = data.hint;

}

throw new Error(errorText);

}

return data;

}


/* ================================
   LOGIN
================================ */

loginForm.addEventListener(
"submit",
async function(e){

e.preventDefault();

clearMessage();

const userValue =
username.value.trim();

const passValue =
password.value;

if(!userValue || !passValue){

showMessage(
"شماره موبایل/نام کاربری و رمز عبور را وارد کنید."
);

return;

}

loginBtn.disabled = true;
loginBtn.textContent = "در حال ورود...";


try{

if(loginType === "student"){

await studentLogin(
userValue,
passValue
);

}else{

await adminLogin(
userValue,
passValue
);

}

}catch(error){

console.error(error);

showMessage(
"ورود ناموفق بود. اطلاعات ورود را بررسی کنید."
);

}finally{

loginBtn.disabled = false;
loginBtn.textContent = "ورود";

}

}
);


/* ================================
   STUDENT LOGIN
================================ */

async function studentLogin(
phone,
pass
){

/*
  زبان‌آموز:
  ابتدا auth را با ایمیل داخلی معتبر امتحان می‌کنیم.
  سپس اطلاعات دانش‌آموز را از جدول students می‌گیریم.
*/

const normalizedPhone =
phone.replace(/\D/g,"");

const email =
normalizedPhone + "@alinagheli.app";


/*
  Supabase Auth
*/

const authResponse =
await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"apikey":SUPABASE_ANON_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:pass
})
}
);

const authText =
await authResponse.text();

let authData;

try{
authData =
JSON.parse(authText);
}catch{
authData = {};
}

if(!authResponse.ok){

throw new Error(
authData.error_description ||
authData.msg ||
"Invalid login credentials"
);

}


/*
  پیدا کردن دانش‌آموز
*/

const students =
await supabaseRequest(
"/rest/v1/students?phone=eq." +
encodeURIComponent(normalizedPhone) +
"&select=*"
);

if(!students || !students.length){

throw new Error(
"Student not found"
);

}

currentUser = {
type:"student",
data:students[0],
token:authData.access_token
};

localStorage.setItem(
"ali_current_user",
JSON.stringify({
type:"student",
data:students[0]
})
);

openStudentDashboard(
students[0]
);

}


/* ================================
   ADMIN LOGIN
================================ */

async function adminLogin(
user,
pass
){

/*
  مدیر با Auth وارد می‌شود.
  ایمیل مدیر:
  admin@alinagheli.app

  اگر نام کاربری admin وارد شود،
  ایمیل داخلی ساخته می‌شود.
*/

let email = user.trim();

if(!email.includes("@")){

email =
email.toLowerCase() +
"@alinagheli.app";

}

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"apikey":SUPABASE_ANON_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:pass
})
}
);

const text =
await response.text();

let data;

try{
data = JSON.parse(text);
}catch{
data = {};
}

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
"Invalid login credentials"
);

}

currentUser = {
type:"admin",
token:data.access_token,
data:data.user || {}
};

localStorage.setItem(
"ali_current_user",
JSON.stringify({
type:"admin",
data:data.user || {}
})
);

openAdminDashboard();

}


/* ================================
   ADMIN DASHBOARD
================================ */

async function openAdminDashboard(){

loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");

adminPanel.classList.remove("hidden");
studentPanel.classList.add("hidden");

welcomeTitle.textContent =
"سلام مدیر عزیز 👋";

welcomeText.textContent =
"مدیریت زبان‌آموزان AliNagheli English";

await loadStudents();

}


/* ================================
   STUDENT DASHBOARD
================================ */

function openStudentDashboard(
student
){

loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");

studentPanel.classList.remove("hidden");
adminPanel.classList.add("hidden");

welcomeTitle.textContent =
"سلام " +
(student.first_name || "") +
" 👋";

welcomeText.textContent =
"به پنل زبان‌آموزی خودت خوش آمدی.";

renderStudent(
student
);

}


/* ================================
   LOAD STUDENTS
================================ */

async function loadStudents(){

const list =
document.getElementById(
"studentsList"
);

list.innerHTML =
'<div class="empty">در حال دریافت اطلاعات...</div>';

try{

const students =
await supabaseRequest(
"/rest/v1/students?select=*&order=id.desc"
);

const waiting =
students.filter(
s => s.status === "waiting"
).length;

const registered =
students.filter(
s => s.status === "registered"
).length;

const graduate =
students.filter(
s => s.status === "graduate" ||
s.status === "graduated"
).length;

document.getElementById(
"waitingCount"
).textContent =
waiting;

document.getElementById(
"registeredCount"
).textContent =
registered;

document.getElementById(
"graduateCount"
).textContent =
graduate;


if(!students.length){

list.innerHTML =
'<div class="empty">هنوز زبان‌آموزی ثبت نشده است.</div>';

return;

}

list.innerHTML =
students.map(
student => {

const name =
(
student.first_name || ""
) +
" " +
(
student.last_name || ""
);

const status =
student.status || "waiting";

return `
<div class="student">

<div>
<div class="student-name">
${escapeHtml(name.trim() || "بدون نام")}
</div>

<div style="font-size:12px;color:#6b7280;margin-top:5px;direction:ltr">
${escapeHtml(student.phone || "")}
</div>
</div>

<div class="badge">
${statusText(status)}
</div>

</div>
`;

}
).join("");

}catch(error){

console.error(error);

list.innerHTML =
'<div class="empty">دریافت اطلاعات با خطا مواجه شد.</div>';

}

}


/* ================================
   STUDENT INFO
================================ */

function renderStudent(student){

const info =
document.getElementById(
"studentInfo"
);

const fields = [

[
"نام و نام خانوادگی",
(
student.first_name || ""
) +
" " +
(
student.last_name || ""
)
],

[
"شماره موبایل",
student.phone || "-"
],

[
"سطح",
student.level || "-"
],

[
"وضعیت",
statusText(student.status)
],

[
"کتاب",
student.book || "-"
]

];

info.innerHTML =
fields.map(
item => `
<div style="
display:flex;
justify-content:space-between;
padding:13px 0;
border-bottom:1px solid #f3f4f6;
gap:15px;
">
<strong>${escapeHtml(item[0])}</strong>
<span>${escapeHtml(String(item[1]))}</span>
</div>
`
).join("");

}


/* ================================
   STATUS
================================ */

function statusText(status){

switch(status){

case "waiting":
return "در صف انتظار";

case "registered":
return "ثبت‌نام شده";

case "graduate":
case "graduated":
return "فارغ‌التحصیل";

default:
return status || "نامشخص";

}

}


/* ================================
   LOGOUT
================================ */

function logout(){

currentUser = null;

localStorage.removeItem(
"ali_current_user"
);

dashboard.classList.add("hidden");
loginPage.classList.remove("hidden");

username.value = "";
password.value = "";

setLoginType("student");

clearMessage();

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
   AUTO LOGIN
================================ */

function checkSavedLogin(){

try{

const saved =
localStorage.getItem(
"ali_current_user"
);

if(!saved) return;

const user =
JSON.parse(saved);

if(user.type === "student"){

openStudentDashboard(
user.data
);

}else if(user.type === "admin"){

openAdminDashboard();

}

}catch(error){

localStorage.removeItem(
"ali_current_user"
);

}

}


/* ================================
   START
================================ */

setLoginType("student");

checkSavedLogin();

</script>

</body>
</html>
