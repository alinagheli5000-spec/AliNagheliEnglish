<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f6f3ff;color:#1f2937}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
--p:#6d28d9;
--p2:#7c3aed;
--p3:#4c1d95;
--bg:#f6f3ff;
--card:#fff;
--muted:#6b7280;
--border:#e9ddff;
--green:#16a34a;
--red:#dc2626;
--orange:#ea580c;
}

.screen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.login-card{
width:100%;
max-width:430px;
background:#fff;
border-radius:28px;
padding:28px 22px;
box-shadow:0 20px 60px #4c1d9530;
}

.logo{
width:82px;height:82px;border-radius:24px;
background:linear-gradient(135deg,var(--p2),#4338ca);
color:#fff;display:flex;align-items:center;justify-content:center;
font-size:28px;font-weight:bold;margin:auto auto 15px;
box-shadow:0 12px 30px #6d28d950;
}

h1{text-align:center;color:var(--p3);font-size:24px;margin:7px 0}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}

.tabs{
display:flex;background:#f3efff;padding:5px;border-radius:15px;margin-bottom:20px;
}
.tabs button{
flex:1;border:0;background:transparent;padding:12px;border-radius:11px;
font-weight:bold;color:var(--muted);
}
.tabs button.active{background:var(--p);color:#fff}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.field input,.field select{
width:100%;padding:13px;border:1px solid var(--border);
border-radius:13px;outline:none;background:#fff;font-size:14px;
}
.field input:focus,.field select:focus{
border-color:var(--p2);box-shadow:0 0 0 3px #7c3aed18
}
.ltr{direction:ltr;text-align:left}

.primary{
width:100%;border:0;border-radius:14px;padding:14px;
background:linear-gradient(135deg,var(--p2),#5b21b6);
color:#fff;font-weight:bold;font-size:15px;
}
.primary:disabled{opacity:.55}

.message{
display:none;margin-top:13px;padding:11px;border-radius:12px;
font-size:12px;text-align:center
}
.message.show{display:block}
.message.error{background:#fee2e2;color:#991b1b}
.message.success{background:#dcfce7;color:#166534}

#dashboard{min-height:100vh;background:var(--bg)}

.topbar{
height:68px;background:#fff;display:flex;align-items:center;
justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20;
box-shadow:0 2px 16px #0000000b
}
.brand{font-size:18px;font-weight:bold;color:var(--p3)}
.top-actions{display:flex;gap:8px}
.icon-btn,.logout{
border:0;background:#ede9fe;color:var(--p3);
padding:9px 12px;border-radius:10px;font-weight:bold
}

.content{width:100%;max-width:1100px;margin:auto;padding:18px}

.welcome{
background:linear-gradient(135deg,var(--p),#4338ca);
color:#fff;border-radius:22px;padding:23px;margin-bottom:16px;
box-shadow:0 12px 30px #4c1d9530
}
.welcome h2{margin:0 0 7px;font-size:21px}
.welcome p{margin:0;font-size:13px;opacity:.9}

.stats{
display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px
}
.stat{
background:#fff;border-radius:17px;padding:16px;
box-shadow:0 5px 20px #00000008
}
.stat strong{display:block;color:var(--p);font-size:24px;margin-bottom:4px}
.stat span{font-size:11px;color:var(--muted)}

.card{
background:#fff;border-radius:20px;padding:18px;
box-shadow:0 5px 20px #00000008;margin-bottom:15px
}
.card h3{margin:0 0 14px;color:var(--p3);font-size:17px}

.grid{
display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}

.menu-card{
border:1px solid var(--border);border-radius:17px;
padding:17px;background:#fff;transition:.2s
}
.menu-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0000000b}
.menu-icon{font-size:28px;margin-bottom:8px}
.menu-card strong{display:block;color:var(--p3);margin-bottom:5px}
.menu-card span{font-size:11px;color:var(--muted)}

.student{
border:1px solid #eee8ff;border-radius:15px;padding:14px;
margin-bottom:9px;background:#fff
}
.student-row{
display:flex;justify-content:space-between;align-items:center;gap:10px
}
.student-name{font-weight:bold;font-size:14px}
.student-phone{font-size:11px;color:var(--muted);direction:ltr;text-align:right;margin-top:4px}
.badge{padding:5px 9px;border-radius:20px;font-size:10px;font-weight:bold}
.badge.waiting{background:#fff7ed;color:#c2410c}
.badge.registered{background:#dcfce7;color:#166534}
.badge.graduate{background:#ede9fe;color:#5b21b6}

.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.small-btn{
border:0;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:bold
}
.approve{background:#dcfce7;color:#166534}
.reject{background:#fee2e2;color:#991b1b}
.neutral{background:#ede9fe;color:#5b21b6}

.lesson{
border:1px solid var(--border);border-radius:17px;
padding:16px;margin-bottom:10px;background:#fff
}
.lesson-number{
display:inline-block;background:#ede9fe;color:var(--p3);
padding:5px 9px;border-radius:9px;font-size:10px;font-weight:bold;margin-bottom:7px
}
.lesson h4{margin:3px 0 8px;color:var(--p3)}
.lesson p{font-size:12px;color:#4b5563;line-height:1.9;margin:0}

.vocab{
display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.word{
background:#faf9ff;border:1px solid var(--border);
border-radius:12px;padding:11px
}
.word b{display:block;color:var(--p3);direction:ltr;text-align:left}
.word span{font-size:11px;color:var(--muted)}

.back{
border:0;background:#ede9fe;color:var(--p3);
padding:9px 13px;border-radius:10px;font-weight:bold;margin-bottom:13px
}

.progress{
height:9px;background:#eee9ff;border-radius:20px;overflow:hidden;margin:10px 0
}
.progress div{height:100%;background:linear-gradient(90deg,var(--p2),#4f46e5);width:0}

.search{
width:100%;padding:12px;border:1px solid var(--border);
border-radius:12px;outline:none;margin-bottom:12px
}

.bottom{
position:fixed;bottom:0;left:0;right:0;height:67px;background:#fff;
display:flex;justify-content:space-around;align-items:center;
box-shadow:0 -4px 20px #0000000b;z-index:30
}
.bottom button{
border:0;background:transparent;color:#9ca3af;font-size:10px;
display:flex;flex-direction:column;align-items:center;gap:4px
}
.bottom button.active{color:var(--p)}
.bottom i{font-style:normal;font-size:21px}

.page{padding-bottom:85px}

.quiz-option{
width:100%;text-align:right;border:1px solid var(--border);
background:#fff;border-radius:14px;padding:14px;margin-bottom:9px;
font-size:13px
}
.quiz-option:hover{border-color:var(--p2);background:#faf8ff}
.quiz-option.correct{background:#dcfce7;border-color:#86efac}
.quiz-option.wrong{background:#fee2e2;border-color:#fca5a5}

.timer{
text-align:center;color:var(--p3);font-size:24px;font-weight:bold;margin:10px
}

.notice{
padding:12px;border-radius:12px;background:#f5f3ff;
color:#5b21b6;font-size:12px;line-height:1.8
}

@media(max-width:600px){
.stats{grid-template-columns:1fr 1fr 1fr}
.grid{grid-template-columns:1fr}
.content{padding:14px}
}
</style>
</head>

<body>

<div id="loginPage" class="screen">
<div class="login-card">

<div class="logo">AN</div>
<h1>AliNagheli English</h1>
<div class="subtitle">سامانه آموزش زبان انگلیسی</div>

<div class="tabs">
<button id="studentTab" class="active" onclick="setLoginType('student')">زبان‌آموز</button>
<button id="adminTab" onclick="setLoginType('admin')">مدیر</button>
</div>

<form id="loginForm">

<div class="field">
<label id="usernameLabel">شماره موبایل</label>
<input id="username" class="ltr" type="text" inputmode="tel"
autocomplete="username" placeholder="09123456789" required>
</div>

<div class="field">
<label>رمز عبور</label>
<input id="password" class="ltr" type="password"
autocomplete="current-password" placeholder="رمز عبور" required>
</div>

<button id="loginBtn" class="primary">ورود</button>
</form>

<div id="message" class="message"></div>

</div>
</div>

<div id="dashboard" class="hidden">

<header class="topbar">
<div class="brand">AliNagheli English</div>
<div class="top-actions">
<button class="icon-btn" onclick="goHome()">⌂</button>
<button class="logout" onclick="logout()">خروج</button>
</div>
</header>

<main class="content page">

<section class="welcome">
<h2 id="welcomeTitle">خوش آمدید 🌟</h2>
<p id="welcomeText"></p>
</section>

<div id="mainContent"></div>

</main>

<nav class="bottom">
<button id="navHome" class="active" onclick="goHome()"><i>⌂</i>خانه</button>
<button onclick="showLessons()"><i>📚</i>درس‌ها</button>
<button onclick="showVocabulary()"><i>🔤</i>لغات</button>
<button onclick="showGames()"><i>🎮</i>بازی</button>
</nav>

</div>

<script>
/* =========================
   LOCAL DATA
========================= */

const ADMIN={
username:"admin",
password:"123456"
};

const students=[
{
id:1,
first_name:"آرتین",
last_name:"ناگلی",
phone:"09140000000",
password:"123456",
level:"A1",
status:"registered",
book:"English 7",
progress:35
},
{
id:2,
first_name:"زبان‌آموز",
last_name:"نمونه",
phone:"09141111111",
password:"123456",
level:"A1",
status:"waiting",
book:"English 7",
progress:0
}
];

const lessons=[
{
n:1,
title:"My Name",
grammar:"معرفی خود و استفاده از am / is / are",
text:"در این درس یاد می‌گیریم خودمان را معرفی کنیم و درباره نام و هویت افراد صحبت کنیم.",
words:[
["name","نام"],
["student","دانش‌آموز"],
["teacher","معلم"],
["friend","دوست"]
]
},
{
n:2,
title:"My Family",
grammar:"صفات ملکی و اعضای خانواده",
text:"در این درس درباره اعضای خانواده و رابطه آن‌ها با یکدیگر صحبت می‌کنیم.",
words:[
["family","خانواده"],
["mother","مادر"],
["father","پدر"],
["sister","خواهر"],
["brother","برادر"]
]
},
{
n:3,
title:"My School",
grammar:"There is / There are",
text:"یاد می‌گیریم درباره مدرسه، کلاس و امکانات آن صحبت کنیم.",
words:[
["school","مدرسه"],
["classroom","کلاس"],
["book","کتاب"],
["desk","میز"],
["board","تخته"]
]
},
{
n:4,
title:"Daily Activities",
grammar:"Present Simple",
text:"در این درس درباره فعالیت‌های روزانه و برنامه معمول خود صحبت می‌کنیم.",
words:[
["wake up","بیدار شدن"],
["study","درس خواندن"],
["eat","غذا خوردن"],
["sleep","خوابیدن"]
]
},
{
n:5,
title:"Food and Drinks",
grammar:"اسم‌های قابل شمارش و غیرقابل شمارش",
text:"درباره غذاها و نوشیدنی‌های مختلف صحبت می‌کنیم.",
words:[
["water","آب"],
["milk","شیر"],
["bread","نان"],
["rice","برنج"],
["apple","سیب"]
]
},
{
n:6,
title:"Hobbies",
grammar:"Like / Love / Enjoy",
text:"یاد می‌گیریم درباره علایق و سرگرمی‌های خود صحبت کنیم.",
words:[
["music","موسیقی"],
["football","فوتبال"],
["reading","مطالعه"],
["swimming","شنا"]
]
},
{
n:7,
title:"The Weather",
grammar:"It is / It is not",
text:"در این درس درباره وضعیت آب‌وهوا صحبت می‌کنیم.",
words:[
["sunny","آفتابی"],
["rainy","بارانی"],
["cold","سرد"],
["hot","گرم"],
["windy","بادی"]
]
},
{
n:8,
title:"My Future",
grammar:"Future with will",
text:"درباره آینده، برنامه‌ها و آرزوهای خود صحبت می‌کنیم.",
words:[
["future","آینده"],
["dream","رویا"],
["job","شغل"],
["doctor","پزشک"],
["teacher","معلم"]
]
}
];

const quizQuestions=[
{
q:"What is your name?",
a:["My name is Ali.","I am twelve.","I am from Iran.","I am a teacher."],
c:0
},
{
q:"Which word means «کتاب»?",
a:["School","Book","Teacher","Friend"],
c:1
},
{
q:"Choose the correct sentence.",
a:["She are a student.","She am a student.","She is a student.","She be a student."],
c:2
},
{
q:"What does “mother” mean?",
a:["پدر","مادر","خواهر","برادر"],
c:1
},
{
q:"Choose the correct form: I ___ a student.",
a:["is","are","am","be"],
c:2
}
];

/* =========================
   STATE
========================= */

let loginType="student";
let currentUser=null;
let currentPage="home";
let currentQuiz=0;
let score=0;

/* =========================
   ELEMENTS
========================= */

const loginPage=document.getElementById("loginPage");
const dashboard=document.getElementById("dashboard");
const loginForm=document.getElementById("loginForm");
const username=document.getElementById("username");
const password=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const message=document.getElementById("message");
const studentTab=document.getElementById("studentTab");
const adminTab=document.getElementById("adminTab");
const usernameLabel=document.getElementById("usernameLabel");
const mainContent=document.getElementById("mainContent");
const welcomeTitle=document.getElementById("welcomeTitle");
const welcomeText=document.getElementById("welcomeText");

/* =========================
   STORAGE
========================= */

function loadStudents(){
try{
const saved=localStorage.getItem("alinagheli_students");
if(saved){
const data=JSON.parse(saved);
if(Array.isArray(data)){
students.splice(0,students.length,...data);
}
}
}catch(e){}
}

function saveStudents(){
localStorage.setItem("alinagheli_students",JSON.stringify(students));
}

/* =========================
   LOGIN
========================= */

function setLoginType(type){
loginType=type;

studentTab.classList.toggle("active",type==="student");
adminTab.classList.toggle("active",type==="admin");

usernameLabel.textContent=
type==="student"?"شماره موبایل":"نام کاربری مدیر";

username.placeholder=
type==="student"?"09123456789":"admin";

username.value="";
password.value="";
clearMessage();
}

function showMessage(text,type="error"){
message.textContent=text;
message.className="message show "+type;
}

function clearMessage(){
message.textContent="";
message.className="message";
}

loginForm.addEventListener("submit",function(e){
e.preventDefault();

clearMessage();

const u=username.value.trim();
const p=password.value;

if(!u||!p){
showMessage("اطلاعات ورود را کامل وارد کنید.");
return;
}

loginBtn.disabled=true;
loginBtn.textContent="در حال ورود...";

setTimeout(()=>{
try{
if(loginType==="admin"){
adminLogin(u,p);
}else{
studentLogin(u,p);
}
}catch(e){
showMessage("ورود ناموفق بود.");
}finally{
loginBtn.disabled=false;
loginBtn.textContent="ورود";
}
},250);
});

function adminLogin(u,p){

const validUser=
u.toLowerCase()==="admin" ||
u.toLowerCase()==="admin@alinagheli.app";

if(!validUser || p!==ADMIN.password){
showMessage("نام کاربری یا رمز عبور مدیر صحیح نیست.");
return;
}

currentUser={
type:"admin",
username:"admin"
};

localStorage.setItem(
"ali_session",
JSON.stringify(currentUser)
);

openDashboard();
}

function normalizePhone(phone){
return phone.replace(/\D/g,"");
}

function studentLogin(phone,p){

const normalized=normalizePhone(phone);

const student=students.find(s=>
normalizePhone(String(s.phone||""))===normalized &&
String(s.password||"")===p
);

if(!student){
showMessage("شماره موبایل یا رمز عبور صحیح نیست.");
return;
}

currentUser={
type:"student",
studentId:student.id
};

localStorage.setItem(
"ali_session",
JSON.stringify(currentUser)
);

openDashboard();
}

/* =========================
   DASHBOARD
========================= */

function openDashboard(){

loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");

loadStudents();

if(currentUser.type==="admin"){
welcomeTitle.textContent="سلام مدیر عزیز 👋";
welcomeText.textContent="مدیریت سامانه AliNagheli English";
}else{
const s=getCurrentStudent();
welcomeTitle.textContent=
"سلام "+(s?.first_name||"زبان‌آموز")+" 👋";
welcomeText.textContent=
"به پنل آموزشی خودت خوش آمدی.";
}

goHome();
}

function getCurrentStudent(){
if(!currentUser||currentUser.type!=="student")return null;
return students.find(s=>s.id===currentUser.studentId)||null;
}

function goHome(){

currentPage="home";

document.querySelectorAll(".bottom button")
.forEach((b,i)=>b.classList.toggle("active",i===0));

if(currentUser.type==="admin"){
renderAdminHome();
}else{
renderStudentHome();
}
}

function renderAdminHome(){

const waiting=students.filter(s=>s.status==="waiting").length;
const registered=students.filter(s=>s.status==="registered").length;
const graduate=students.filter(s=>
s.status==="graduate"||s.status==="graduated"
).length;

mainContent.innerHTML=`

<div class="stats">

<div class="stat">
<strong>${waiting}</strong>
<span>در صف انتظار</span>
</div>

<div class="stat">
<strong>${registered}</strong>
<span>ثبت‌نام شده</span>
</div>

<div class="stat">
<strong>${graduate}</strong>
<span>فارغ‌التحصیل</span>
</div>

</div>

<div class="grid">

<div class="menu-card" onclick="showAdminStudents()">
<div class="menu-icon">👥</div>
<strong>مدیریت زبان‌آموزان</strong>
<span>مشاهده، تأیید و مدیریت ثبت‌نام‌ها</span>
</div>

<div class="menu-card" onclick="showLessons()">
<div class="menu-icon">📚</div>
<strong>محتوای آموزشی</strong>
<span>درس‌ها و محتوای آموزشی</span>
</div>

<div class="menu-card" onclick="showGames()">
<div class="menu-icon">🎮</div>
<strong>بازی و مسابقه</strong>
<span>مسابقه رکوردی و سرگرمی آموزشی</span>
</div>

<div class="menu-card" onclick="showVocabulary()">
<div class="menu-icon">🔤</div>
<strong>واژگان</strong>
<span>لغات مهم انگلیسی با معنی فارسی</span>
</div>

</div>

<div class="card" style="margin-top:15px">
<h3>آخرین زبان‌آموزان</h3>
<div id="recentStudents"></div>
</div>
`;

renderRecentStudents();
}

function renderRecentStudents(){

const box=document.getElementById("recentStudents");

const recent=students.slice(-5).reverse();

if(!recent.length){
box.innerHTML='<div class="notice">هنوز زبان‌آموزی ثبت نشده است.</div>';
return;
}

box.innerHTML=recent.map(studentCard).join("");
}

function renderStudentHome(){

const s=getCurrentStudent();

if(!s){
logout();
return;
}

const progress=Math.max(0,Math.min(100,Number(s.progress)||0));

mainContent.innerHTML=`

<div class="card">
<h3>📊 پیشرفت یادگیری</h3>

<div style="display:flex;justify-content:space-between;font-size:12px">
<span>پیشرفت دوره</span>
<strong>${progress}%</strong>
</div>

<div class="progress">
<div style="width:${progress}%"></div>
</div>

<div class="notice">
سطح: ${escapeHtml(s.level||"A1")}<br>
کتاب: ${escapeHtml(s.book||"English 7")}
</div>
</div>

<div class="grid">

<div class="menu-card" onclick="showLessons()">
<div class="menu-icon">📚</div>
<strong>درس‌های من</strong>
<span>مشاهده ۸ درس آموزشی</span>
</div>

<div class="menu-card" onclick="showVocabulary()">
<div class="menu-icon">🔤</div>
<strong>واژگان</strong>
<span>لغات و معنی فارسی</span>
</div>

<div class="menu-card" onclick="showGames()">
<div class="menu-icon">🎮</div>
<strong>بازی و مسابقه</strong>
<span>امتیاز و رکورد خودت را بساز</span>
</div>

<div class="menu-card" onclick="showProfile()">
<div class="menu-icon">👤</div>
<strong>پروفایل من</strong>
<span>مشاهده اطلاعات حساب</span>
</div>

</div>
`;
}

/* =========================
   ADMIN STUDENTS
========================= */

function showAdminStudents(){

mainContent.innerHTML=`

<button class="back" onclick="goHome()">← بازگشت</button>

<div class="card">
<h3>👥 مدیریت زبان‌آموزان</h3>
<input class="search" id="studentSearch"
placeholder="جستجوی نام یا شماره موبایل..."
oninput="filterStudents()">

<div id="studentsContainer"></div>
</div>
`;

renderStudentsList(students);
}

function filterStudents(){

const q=document.getElementById("studentSearch")
.value.trim().toLowerCase();

const result=students.filter(s=>{
const name=
((s.first_name||"")+" "+(s.last_name||""))
.toLowerCase();

return name.includes(q) ||
String(s.phone||"").includes(q);
});

renderStudentsList(result);
}

function renderStudentsList(list){

const box=document.getElementById("studentsContainer");

if(!list.length){
box.innerHTML='<div class="empty">موردی پیدا نشد.</div>';
return;
}

box.innerHTML=list.map(studentCard).join("");
}

function studentCard(s){

const name=
((s.first_name||"")+" "+(s.last_name||"")).trim()||"بدون نام";

let actions="";

if(s.status==="waiting"){
actions=`
<div class="actions">
<button class="small-btn approve" onclick="approveStudent(${s.id})">✓ تأیید ثبت‌نام</button>
<button class="small-btn reject" onclick="deleteStudent(${s.id})">✕ رد / حذف</button>
</div>
`;
}else{
actions=`
<div class="actions">
<button class="small-btn neutral" onclick="toggleGraduate(${s.id})">
${s.status==="graduate"||s.status==="graduated"?"بازگردانی":"فارغ‌التحصیل"}
</button>
<button class="small-btn reject" onclick="deleteStudent(${s.id})">حذف</button>
</div>
`;
}

return `
<div class="student">
<div class="student-row">
<div>
<div class="student-name">${escapeHtml(name)}</div>
<div class="student-phone">${escapeHtml(s.phone||"")}</div>
</div>
<div class="badge ${badgeClass(s.status)}">${statusText(s.status)}</div>
</div>
${actions}
</div>
`;
}

function approveStudent(id){

const s=students.find(x=>x.id===id);
if(!s)return;

s.status="registered";
saveStudents();
showAdminStudents();
}

function deleteStudent(id){

if(!confirm("این زبان‌آموز حذف شود؟"))return;

const index=students.findIndex(x=>x.id===id);

if(index>=0){
students.splice(index,1);
saveStudents();
showAdminStudents();
}
}

function toggleGraduate(id){

const s=students.find(x=>x.id===id);
if(!s)return;

if(s.status==="graduate"||s.status==="graduated"){
s.status="registered";
}else{
s.status="graduate";
}

saveStudents();
showAdminStudents();
}

function startQuiz(){

currentQuiz=0;
score=0;

}

function renderQuiz(){

if(currentQuiz>=quizQuestions.length){
finishQuiz();
return;
}

const item=quizQuestions[currentQuiz];

mainContent.innerHTML=`

<button class="back" onclick="showGames()">← بازی‌ها</button>

<div class="card">

<div style="display:flex;justify-content:space-between;font-size:11px;color:#6b7280">

<span>امتیاز: ${score}</span>
</div>

<h3 style="margin-top:18px">${escapeHtml(item.q)}</h3>

${item.a.map((a,i)=>`
<button class="quiz-option" onclick="answerQuiz(${i})">
${escapeHtml(a)}
</button>
`).join("")}

</div>
`;
}

function answerQuiz(i){

const item=quizQuestions[currentQuiz];
const buttons=document.querySelectorAll(".quiz-option");

buttons.forEach(b=>b.disabled=true);

if(i===item.c){
score++;
buttons[i].classList.add("correct");
}else{
buttons[i].classList.add("wrong");
buttons[item.c].classList.add("correct");
}

setTimeout(()=>{
currentQuiz++;
renderQuiz();
},650);
}

function finishQuiz(){

if(currentUser.type==="student"){
const s=getCurrentStudent();

if(s){
const old=Number(s.progress)||0;
s.progress=Math.min(100,old+5);
saveStudents();
}
}

mainContent.innerHTML=`

`;
}

/* =========================
   LOGOUT / SESSION
========================= */

function logout(){

currentUser=null;
localStorage.removeItem("ali_session");

dashboard.classList.add("hidden");
loginPage.classList.remove("hidden");

username.value="";
password.value="";

setLoginType("student");
}

function checkSession(){

loadStudents();

try{

const saved=localStorage.getItem("ali_session");

if(!saved)return;

const session=JSON.parse(saved);

if(session.type==="admin"){
currentUser=session;
openDashboard();
return;
}

if(session.type==="student"){

const s=students.find(x=>x.id===session.studentId);

if(s){
currentUser=session;
openDashboard();
}else{
localStorage.removeItem("ali_session");
}
}

}catch(e){
localStorage.removeItem("ali_session");
}
}

/* =========================
   HELPERS
========================= */

function statusText(s){

switch(s){
case"waiting":return"در صف انتظار";
case"registered":return"ثبت‌نام شده";
case"graduate":
case"graduated":return"فارغ‌التحصیل";
default:return"نامشخص";
}
}

function badgeClass(s){

if(s==="waiting")return"waiting";
if(s==="graduate"||s==="graduated")return"graduate";
return"registered";
}

function escapeHtml(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

/* =========================
   START
========================= */

setLoginType("student");
checkSession();
