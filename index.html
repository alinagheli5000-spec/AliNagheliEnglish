*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f5f3ff;
color:#17121f;

button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{max-width:1100px;margin:auto;padding:16px}
.card{
background:#fff;
border-radius:22px;
padding:20px;
margin:14px 0;
box-shadow:0 8px 30px #00000012;
}
.header{
background:linear-gradient(135deg,#6d28d9,#9333ea);
color:white;
padding:22px;
border-radius:0 0 28px 28px;
box-shadow:0 8px 30px #6d28d933;
}
.header h1{margin:0;font-size:28px}
.header p{margin:8px 0 0;opacity:.9}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
}
.btn{
border:0;
border-radius:15px;
padding:13px 18px;
background:#6d28d9;
color:#fff;
font-weight:bold;
}
.btn.secondary{background:#ede9fe;color:#5b21b6}
.btn.danger{background:#dc2626}
.btn.success{background:#16a34a}
.btn.warning{background:#f59e0b}
.course{
border:0;
padding:20px;
min-height:145px;
border-radius:24px;
background:linear-gradient(145deg,#fff,#f3e8ff);
box-shadow:0 8px 25px #00000010;
font-weight:bold;
font-size:17px;
color:#4c1d95;
}
.course .icon{font-size:42px;display:block;margin-bottom:10px}
.lesson{
padding:18px;
border-radius:20px;
background:#faf5ff;
border:1px solid #e9d5ff;
margin:12px 0;
}
.lesson h3{margin-top:0;color:#5b21b6}
.word{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:12px;
background:#fff;
border-radius:14px;
margin:7px 0;
box-shadow:0 3px 12px #00000009;
}
.word strong{direction:ltr}
.pronounce{
border:0;
background:#ede9fe;
color:#6d28d9;
border-radius:12px;
padding:8px 12px;
font-size:18px;
}
.option{
display:block;
width:100%;
text-align:right;
padding:13px;
margin:8px 0;
border:2px solid #e5e7eb;
border-radius:14px;
background:white;
}
.option.correct{
background:#dcfce7;
border-color:#16a34a;
}
.option.wrong{
background:#fee2e2;
border-color:#dc2626;
}
.result{
padding:16px;
border-radius:18px;
background:#f3e8ff;
text-align:center;
font-size:20px;
font-weight:bold;
}
.nav{
position:sticky;
bottom:0;
background:#fff;
display:flex;
gap:5px;
padding:8px;
box-shadow:0 -5px 20px #0002;
z-index:20;
}
.nav button{
flex:1;
border:0;
background:white;
padding:10px 5px;

function speak(text){
if(!("speechSynthesis" in window)){
alert("مرورگر شما از پخش صوتی پشتیبانی نمی‌کند.");
return;
}
window.speechSynthesis.cancel();
const utterance=new SpeechSynthesisUtterance(text);
utterance.lang="en-US";
utterance.rate=.8;
utterance.pitch=1;
window.speechSynthesis.speak(utterance);
}

</ul>

<button class="btn" onclick="startLessonTest('${grade}',${index})">

</button>
</div>`;
});

html+=`</div>`;
document.getElementById("content").innerHTML=html;
}

function shuffle(a){
return [...a].sort(()=>Math.random()-.5);
}

function startCompetition(type){
const questions=shuffle(competitionBank[type]).slice(0,20);
currentCompetition={
type,
questions,
index:0,
score:0,
answered:false
};

document.getElementById("competition").classList.remove("hidden");
document.getElementById("competitionTitle").textContent=`🏆 مسابقه ${type}`;
renderCompetitionQuestion();
}

function renderCompetitionQuestion(){
const c=currentCompetition;
if(c.index>=c.questions.length){
finishCompetition();
return;
}

const q=c.questions[c.index];
const correct=q[1];
const options=shuffle(q.slice(1));

document.getElementById("competitionResult").innerHTML="";
document.getElementById("competitionQuestion").innerHTML=`
<h3>سؤال ${c.index+1} از ${c.questions.length}</h3>
<p style="font-size:20px;direction:ltr;text-align:left">${q[0]}</p>`;

document.getElementById("competitionOptions").innerHTML=options.map(o=>`
<button class="option" onclick="answerCompetition(this,'${escapeAttr(o)}','${escapeAttr(correct)}')">
${o}
</button>`).join("");
}

function escapeAttr(x){
return String(x).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function answerCompetition(btn,answer,correct){
if(currentCompetition.answered)return;
currentCompetition.answered=true;

const buttons=document.querySelectorAll("#competitionOptions .option");

buttons.forEach(b=>{
if(b.textContent.trim()===correct)b.classList.add("correct");
});

if(answer===correct){
btn.classList.add("correct");
currentCompetition.score++;
}else{
btn.classList.add("wrong");
currentCompetition.score--;
}

setTimeout(()=>{
currentCompetition.index++;
currentCompetition.answered=false;
renderCompetitionQuestion();
},700);
}

function finishCompetition(){
const c=currentCompetition;
const raw=(c.score/c.questions.length)*100;
const percentage=Math.max(0,Math.round(raw));

saveRecord(c.type,percentage);

document.getElementById("competitionQuestion").innerHTML="";
document.getElementById("competitionOptions").innerHTML="";
document.getElementById("competitionResult").innerHTML=`
<div class="result">
🎉 مسابقه تمام شد!<br>
${percentage}٪
<br>
امتیاز خام: ${c.score}
</div>

<div class="card">
<h3>🏆 رتبه‌بندی</h3>
<div class="rank"><span>🥇 نفر اول</span><strong>100٪</strong></div>
<div class="rank"><span>🥈 نفر دوم</span><strong>95٪</strong></div>
<div class="rank"><span>🥉 نفر سوم</span><strong>90٪</strong></div>
<p style="font-size:13px">رتبه‌بندی واقعی دانش‌آموزان پس از اتصال داده‌های کاربران در سامانه ثبت می‌شود.</p>
</div>`;
}

function closeCompetition(){
document.getElementById("competition").classList.add("hidden");
currentCompetition=null;
loadRecords();
}

function startLessonTest(grade,index){
const lesson=schoolData[grade][index];
const questions=[];

lesson.words.forEach(w=>{
questions.push([
`"${w[0]}" means ...`,
w[1],
...shuffle(lesson.words.filter(x=>x[0]!==w[0]).map(x=>x[1])).slice(0,3)
]);
});

lesson.examples.forEach(ex=>{
questions.push([
`Which sentence is an example from this lesson?`,
ex,
...shuffle(lesson.examples.filter(x=>x!==ex)).slice(0,3)
]);
});

while(questions.length<15){
const w=lesson.words[questions.length%lesson.words.length];
questions.push([`Choose the meaning of "${w[0]}".`,w[1],"مدرسه","کتاب","دوست"]);
}

currentCompetition={
type:`${grade} - ${lesson.title}`,
questions:shuffle(questions).slice(0,15),
index:0,
score:0,
answered:false
};

document.getElementById("competition").classList.remove("hidden");
document.getElementById("competitionTitle").textContent=`📝 آزمون ${lesson.title}`;
renderCompetitionQuestion();
}

function saveRecord(type,score){
const key="ali_records";
const records=JSON.parse(localStorage.getItem(key)||"[]");

records.unshift({
type,
score,
date:new Date().toLocaleDateString("fa-IR")
});

localStorage.setItem(key,JSON.stringify(records.slice(0,30)));
loadRecords();
}

function loadRecords(){
const el=document.getElementById("records");
if(!el)return;

const records=JSON.parse(localStorage.getItem("ali_records")||"[]");

if(!records.length){
el.innerHTML="هنوز رکوردی ثبت نشده است.";
return;
}

el.innerHTML=records.map((r,i)=>`
<div class="rank">
<span>${i+1}. ${r.type}</span>
<strong>${r.score}٪</strong>
<small>${r.date}</small>
</div>`).join("");
}

const saved=localStorage.getItem("ali_current_student");
if(saved){
try{
currentStudent=JSON.parse(saved);
show("studentApp");
loadRecords();
}catch(e){}
}
