<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AliNagheli Test</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#6d28d9;
    font-family:Tahoma,Arial,sans-serif;
}

.box{
    background:white;
    padding:30px;
    border-radius:25px;
    width:85%;
    max-width:400px;
    text-align:center;
}

button{
    width:100%;
    padding:18px;
    margin-top:15px;
    border:0;
    border-radius:15px;
    background:#6d28d9;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#f3f4f6;
}
</style>
</head>

<body>

<div class="box">

<h2>تست AliNagheli</h2>

<p>اگر JavaScript اجرا شود، دکمه زیر باید کار کند.</p>

<button id="testButton">
تست دکمه
</button>

<div id="result">
هنوز دکمه زده نشده
</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

    const button = document.getElementById("testButton");

    const result = document.getElementById("result");

    button.addEventListener("click", function(){

        result.textContent = "✅ JavaScript کاملاً کار می‌کند";

        result.style.background = "#dcfce7";

        result.style.color = "#166534";

    });

});

</script>

</body>
</html>
