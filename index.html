<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%23a855f7"/><stop offset="1" stop-color="%236d28d9"/></linearGradient></defs><rect x="15" y="25" width="70" height="55" rx="6" fill="url(%23g)"/><text x="50" y="62" font-size="28" font-weight="800" text-anchor="middle" fill="white" font-family="Arial">Ali</text></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Lalezar&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-grad-1:#f5f3ff;--bg-grad-2:#ede9fe;--text:#171717;--text-muted:#6b7280;--card-bg:#fff;--card-border:rgba(221,214,254,.5);--card-shadow:0 4px 24px rgba(109,40,217,.06);--primary:#6d28d9;--primary-dark:#4c1d95;--primary-light:#a855f7;--accent-pink:#ec4899;--neon-purple:#a855f7;--neon-pink:#ec4899;--neon-blue:#3b82f6;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--input-bg:#faf9ff;--input-border:#ede9fe}
[data-theme="dark"]{--bg-grad-1:#0f172a;--bg-grad-2:#1e1b4b;--text:#f1f5f9;--text-muted:#94a3b8;--card-bg:#1e293b;--card-border:rgba(109,40,217,.4);--card-shadow:0 4px 24px rgba(0,0,0,.3);--input-bg:#0f172a;--input-border:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,var(--bg-grad-1) 0%,var(--bg-grad-2) 100%);background-attachment:fixed;color:var(--text);padding-bottom:96px;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;transition:all .2s ease}
button:active{transform:scale(.97)}

.splash{position:fixed;inset:0;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10000;animation:splashOut .6s ease 1.6s forwards}
.splash .logo3d{width:240px;height:240px;animation:logoFloat 2.4s ease-in-out infinite,logoIn .9s cubic-bezier(.2,.8,.2,1)}
.splash .brand{margin-top:20px;font-size:24px;font-weight:800;color:#fff;letter-spacing:1px;text-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeInUp .6s ease .3s both}
.splash .sub{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:5px;margin-top:6px;animation:fadeInUp .6s ease .5s both}
@keyframes logoIn{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.logo3d{display:inline-block;position:relative;filter:drop-shadow(0 20px 45px rgba(168,85,247,.55))}
.logo3d svg{display:block;width:100%;height:100%}
.logo3d-sm{width:64px;height:64px}
.logo3d-md{width:120px;height:120px}
.logo3d-lg{width:190px;height:190px}
.logo3d-xl{width:240px;height:240px}

.header{background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 50%,#a855f7 100%);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 8px 32px rgba(109,40,217,.25);border-bottom:1px solid rgba(255,255,255,.1)}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brandBox{display:flex;align-items:center;gap:12px}
.brandTextBox{display:flex;flex-direction:column}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.2);line-height:1.2}
.logoSub{font-size:9px;opacity:.85;letter-spacing:2px;margin-top:2px}
.headerBtns{display:flex;gap:10px;align-items:center}
.iconBtn{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));color:white;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1;transition:all .3s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.iconBtn:hover{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.2));transform:translateY(-2px) scale(1.05);border-color:rgba(255,255,255,.6)}
.iconBtn:active{transform:scale(.95)}
.iconBtn svg{width:20px;height:20px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.iconBtn.logoutBtn{background:linear-gradient(135deg,rgba(239,68,68,.35),rgba(220,38,38,.15));border-color:rgba(252,165,165,.5)}
.iconBtn.logoutBtn:hover{background:linear-gradient(135deg,rgba(239,68,68,.5),rgba(220,38,38,.3))}

.container{max-width:1100px;margin:auto;padding:18px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card-bg);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:var(--card-shadow);border:1px solid var(--card-border)}
.hero{background:linear-gradient(135deg,#312e81 0%,#6d28d9 50%,#a855f7 100%);color:#fff;border-radius:28px;padding:32px;margin-bottom:18px;box-shadow:0 20px 50px rgba(109,40,217,.35);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 60%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.1),transparent 50%);pointer-events:none}
.hero h1{margin:8px 0;font-size:34px;text-shadow:0 4px 16px rgba(0,0,0,.25);letter-spacing:.5px}
.hero h2{margin:6px 0;font-weight:600}
.hero p{opacity:.9;margin:8px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.item{background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:20px;transition:all .3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;cursor:pointer}
.item:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(109,40,217,.18);border-color:var(--primary-light)}
.item h3{margin:10px 0 6px;font-size:16px}
.item .muted{margin:6px 0 12px}

.btn{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(109,40,217,.35);transition:all .2s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(109,40,217,.45)}
.btn.full{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.secondary{background:linear-gradient(135deg,var(--bg-grad-2),#ddd6fe);color:#5b21b6;box-shadow:0 4px 14px rgba(167,139,250,.25)}
[data-theme="dark"] .secondary{background:linear-gradient(135deg,#312e81,#4c1d95);color:#e9d5ff}
.success{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 14px rgba(34,197,94,.3)}
.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(239,68,68,.3)}
.warning{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 14px rgba(245,158,11,.3)}
.info{background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 4px 14px rgba(59,130,246,.3)}

.neonIcon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(109,40,217,.08));position:relative;transition:all .3s ease}
.neonIcon svg{width:30px;height:30px;filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor);transition:all .3s ease}
.neonIcon.purple{color:#a855f7}.neonIcon.pink{color:#ec4899}.neonIcon.blue{color:#3b82f6}.neonIcon.green{color:#22c55e}.neonIcon.orange{color:#f59e0b}.neonIcon.red{color:#ef4444}.neonIcon.cyan{color:#06b6d4}
.neonIcon:hover{transform:translateY(-3px) scale(1.05)}

.miniIcon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;transition:all .25s ease}
.miniIcon svg{width:22px;height:22px;stroke-width:1.8;transition:all .25s ease}
.miniIcon.purple{background:rgba(168,85,247,.12);color:#a855f7}
.miniIcon.pink{background:rgba(236,72,153,.12);color:#ec4899}
.miniIcon.blue{background:rgba(59,130,246,.12);color:#3b82f6}
.miniIcon.green{background:rgba(34,197,94,.12);color:#22c55e}
.miniIcon.orange{background:rgba(245,158,11,.12);color:#f59e0b}
.miniIcon.red{background:rgba(239,68,68,.12);color:#ef4444}
.miniIcon.cyan{background:rgba(6,182,212,.12);color:#06b6d4}
.miniIcon.violet{background:rgba(139,92,246,.12);color:#8b5cf6}
.miniIcon.teal{background:rgba(20,184,166,.12);color:#14b8a6}
.miniIcon.rose{background:rgba(244,63,94,.12);color:#f43f5e}
.miniIcon.indigo{background:rgba(99,102,241,.12);color:#6366f1}
.miniIcon.amber{background:rgba(245,158,11,.12);color:#f59e0b}
.miniIcon.lime{background:rgba(132,204,22,.12);color:#84cc16}
.miniIcon.fuchsia{background:rgba(217,70,239,.12);color:#d946ef}
.miniIcon.sky{background:rgba(14,165,233,.12);color:#0ea5e9}

.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(400px,90vw)}
.toast{background:var(--card-bg);color:var(--text);padding:14px 18px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);border:1px solid var(--card-border);font-size:14px;font-weight:600;animation:toastIn .4s cubic-bezier(.2,.8,.2,1);pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast.success{border-right:4px solid var(--success)}
.toast.error{border-right:4px solid var(--danger)}
.toast.info{border-right:4px solid var(--info)}
.toast.warning{border-right:4px solid var(--warning)}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}
.skel{background:linear-gradient(90deg,var(--card-border) 25%,var(--input-bg) 50%,var(--card-border) 75%);background-size:200% 100%;animation:skel 1.5s infinite;border-radius:8px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

.login{min-height:100vh;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}
.login:before,.login:after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%)}
.login:before{width:500px;height:500px;top:-200px;left:-200px}
.login:after{width:600px;height:600px;bottom:-300px;right:-300px}
.loginCard{background:rgba(255,255,255,.98);width:min(440px,100%);padding:32px;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.4);position:relative;z-index:1;color:#171717}
[data-theme="dark"] .loginCard{background:rgba(30,41,59,.98);color:#f1f5f9}
.loginLogoWrap{display:flex;justify-content:center;margin-bottom:8px}
.loginBrand{text-align:center;font-size:26px;font-weight:800;background:linear-gradient(135deg,#6d28d9,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:6px 0 4px}
.loginTag{text-align:center;font-size:11px;color:#6b7280;letter-spacing:3px;font-weight:600;margin-bottom:12px}

.penguinStage{position:relative;width:140px;height:140px;margin:0 auto 10px;cursor:pointer;user-select:none;transition:transform .3s ease}
.penguinStage:hover{transform:scale(1.05)}
.penguinSvgWrap{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 25px rgba(109,40,217,.35));transition:filter .3s ease}
.penguinStage.mood-happy .penguinSvgWrap{filter:drop-shadow(0 10px 30px rgba(34,197,94,.6))}
.penguinStage.mood-sad .penguinSvgWrap{filter:drop-shadow(0 10px 25px rgba(239,68,68,.5))}
.penguinStage.mood-thinking .penguinSvgWrap{filter:drop-shadow(0 10px 25px rgba(245,158,11,.6))}
.penguinStage.mood-excited .penguinSvgWrap{filter:drop-shadow(0 10px 35px rgba(236,72,153,.7))}
@keyframes penguinIdle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-1deg)}}
@keyframes penguinClap{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.1) rotate(-5deg)}50%{transform:scale(1.15) rotate(5deg)}75%{transform:scale(1.1) rotate(-3deg)}}
@keyframes penguinJump{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px) rotate(-8deg)}60%{transform:translateY(-8px) rotate(8deg)}}
@keyframes penguinShake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(4px) rotate(3deg)}}
@keyframes penguinThinking{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.penguinStage.anim-idle .penguinSvgWrap{animation:penguinIdle 2.5s ease-in-out infinite}
.penguinStage.anim-clap .penguinSvgWrap{animation:penguinClap .5s ease-in-out 3}
.penguinStage.anim-jump .penguinSvgWrap{animation:penguinJump .6s ease-in-out 3}
.penguinStage.anim-shake .penguinSvgWrap{animation:penguinShake .5s ease-in-out 2}
.penguinStage.anim-thinking .penguinSvgWrap{animation:penguinThinking 1.5s ease-in-out infinite}

.penguinBubble{position:absolute;top:-10px;right:-20px;background:#fff;color:#4c1d95;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:700;box-shadow:0 6px 20px rgba(109,40,217,.25);white-space:nowrap;opacity:0;transform:scale(.5) translateY(10px);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;border:2px solid #ddd6fe}
[data-theme="dark"] .penguinBubble{background:#1e293b;color:#e9d5ff;border-color:#4c1d95}
.penguinBubble:after{content:"";position:absolute;bottom:-8px;right:24px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #fff}
[data-theme="dark"] .penguinBubble:after{border-top-color:#1e293b}
.penguinBubble.show{opacity:1;transform:scale(1) translateY(0)}

label{display:block;margin:12px 0 6px;font-weight:700;font-size:13px;color:var(--primary-dark)}
[data-theme="dark"] label{color:#c4b5fd}
input,select,textarea{width:100%;border:2px solid var(--input-border);border-radius:14px;padding:13px;background:var(--input-bg);color:var(--text);outline:none;font-size:14px;transition:all .2s ease}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#7c3aed;background:var(--card-bg);box-shadow:0 0 0 4px rgba(124,58,237,.1)}

.tabs{display:flex;gap:8px;margin:20px 0;background:var(--input-bg);padding:5px;border-radius:16px}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:transparent;font-weight:700;color:var(--text-muted);transition:all .25s ease}
.tab.active{background:var(--card-bg);color:var(--primary);box-shadow:0 2px 10px rgba(109,40,217,.15)}
.tabs2{display:flex;gap:8px;overflow:auto;margin-bottom:18px;padding-bottom:4px}
.tabs2::-webkit-scrollbar{display:none}
.tab2{padding:12px 18px;border:0;border-radius:14px;background:var(--input-bg);white-space:nowrap;font-weight:700;color:var(--text-muted);font-size:13px;transition:all .2s ease}
.tab2.active{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(109,40,217,.35)}

.bottom{position:fixed;bottom:0;left:0;right:0;height:88px;background:var(--card-bg);border-top:1px solid var(--card-border);z-index:200;box-shadow:0 -8px 30px rgba(109,40,217,.08);padding-bottom:env(safe-area-inset-bottom);opacity:.98}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex;padding:6px 4px;overflow-x:auto}
.nav{flex:1;min-width:66px;border:0;background:transparent;padding:8px 2px;color:var(--text-muted);font-size:10px;border-radius:16px;transition:all .2s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nav svg{width:24px;height:24px;filter:grayscale(1) opacity(.6);transition:all .3s}
.nav.active svg{filter:drop-shadow(0 0 6px var(--neon-purple)) drop-shadow(0 0 12px var(--neon-purple));color:var(--neon-purple)}
.nav.active{color:var(--primary);font-weight:700;background:var(--bg-grad-2)}
.nav.active:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--primary),var(--primary-light))}

.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lesson{background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border:1px solid var(--card-border);border-radius:20px;padding:20px;transition:all .25s;position:relative;overflow:hidden}
.lesson:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(109,40,217,.15);border-color:#c4b5fd}
.lesson.locked{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fecaca;opacity:.95}
[data-theme="dark"] .lesson.locked{background:linear-gradient(135deg,#1e1b1b,#2a1a1a);border-color:#7f1d1d}
.lockBadge{position:absolute;top:14px;left:14px;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 12px rgba(239,68,68,.4);animation:lockPulse 2.4s ease-in-out infinite}
.lockBadge svg{width:18px;height:18px;color:#fff}
@keyframes lockPulse{0%,100%{box-shadow:0 4px 12px rgba(239,68,68,.4)}50%{box-shadow:0 4px 20px rgba(239,68,68,.75)}}
.lessonNo{font-size:34px;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;font-weight:800}

.sec{display:none}
.sec.active{display:block}
.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.word{border:1px solid var(--card-border);background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border-radius:18px;padding:16px;text-align:center;cursor:pointer;transition:all .25s ease;position:relative}
.word:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 24px rgba(109,40,217,.15);border-color:var(--primary-light)}
.word.mastered{border-color:#22c55e;background:linear-gradient(135deg,#f0fdf4,#dcfce7)}
[data-theme="dark"] .word.mastered{background:linear-gradient(135deg,#052e16,#14532d)}
.word.mastered:after{content:"⭐";position:absolute;top:6px;right:8px;font-size:14px}
.en{direction:ltr;color:var(--primary);font-weight:700;font-size:15px}
.fa{font-size:12px;color:var(--text-muted);margin-top:6px}
.grammar{border:1px solid var(--card-border);background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));padding:20px;border-radius:20px;margin-bottom:14px;line-height:2;box-shadow:var(--card-shadow)}
.grammar h3{margin:0 0 10px;color:var(--primary);font-size:16px;display:flex;align-items:center;gap:8px}
.grammar h3:before{content:"📘";font-size:18px}
.example{direction:ltr;text-align:left;background:linear-gradient(135deg,var(--bg-grad-2),var(--bg-grad-1));border-radius:12px;padding:14px;font-family:'Courier New',Arial,sans-serif;border-right:4px solid #7c3aed;font-size:14px;color:var(--primary-dark);font-weight:700;margin:10px 0}
[data-theme="dark"] .example{color:#c4b5fd}

.option{display:block;width:100%;text-align:right;background:var(--card-bg);border:2px solid var(--input-border);border-radius:16px;padding:16px;margin:9px 0;font-size:15px;font-weight:600;color:var(--text);transition:all .2s ease}
.option:hover:not(:disabled){border-color:var(--primary-light);background:var(--bg-grad-1);transform:translateX(-4px)}
.option.correct{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#22c55e;color:#166534}
.option.wrong{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#ef4444;color:#991b1b}
.feedback{text-align:center;border-radius:16px;padding:16px;margin-top:12px;font-weight:700;font-size:15px}
.ok{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534}
.bad{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b}
.progress{height:10px;background:var(--bg-grad-2);border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light),#ec4899);background-size:200% 100%;transition:width .4s ease;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
.score{font-size:64px;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;text-align:center;line-height:1;margin:10px 0}
.adminRow{border:1px solid var(--card-border);border-radius:18px;padding:16px;margin:10px 0;background:var(--bg-grad-1)}
.muted{font-size:12px;color:var(--text-muted);line-height:1.9}

.teacher{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.teacherBox{background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:1px solid var(--card-border);border-radius:26px;padding:24px;line-height:2}
.teacherAvatar{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,var(--bg-grad-2),#ddd6fe);margin:auto;box-shadow:0 10px 30px rgba(109,40,217,.2);border:4px solid var(--card-bg)}
.profileStat{background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:1px solid var(--card-border);border-radius:20px;padding:18px;text-align:center}
.profileStat b{display:block;font-size:30px;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:6px}
.levelBar{height:14px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin:12px 0}
.levelBar i{display:block;height:100%;background:linear-gradient(90deg,#fff,#fbbf24,#f59e0b);background-size:200% 100%;transition:width .4s ease;animation:shimmer 2s linear infinite;box-shadow:0 0 12px rgba(251,191,36,.6)}
.badge{display:inline-block;padding:9px 14px;margin:5px;border-radius:22px;background:linear-gradient(135deg,var(--bg-grad-2),#ddd6fe);color:var(--primary-dark);font-size:12px;font-weight:700}
[data-theme="dark"] .badge{color:#e9d5ff}
.call{display:block;text-decoration:none;text-align:center;margin:14px 0;background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#fff!important;box-shadow:0 6px 20px rgba(34,197,94,.35)!important}
.request{background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:1px solid var(--card-border);border-radius:22px;padding:18px;margin-top:18px}
.examRow{border:1px solid var(--card-border);border-radius:18px;padding:16px;margin:10px 0;background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg))}
.examScore{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.resultBox{background:linear-gradient(135deg,var(--bg-grad-1),var(--bg-grad-2));border:2px solid #ddd6fe;border-radius:24px;padding:24px}
.btnRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btnRow .btn{flex:1;min-width:90px;padding:11px 8px;font-size:12px;border-radius:12px}

.soundCard{background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border:1px solid var(--card-border);border-radius:18px;padding:16px;text-align:center;cursor:pointer;transition:all .25s ease}
.soundCard:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(109,40,217,.15);border-color:var(--primary-light)}
.soundCard .speaker{font-size:14px;color:var(--primary);margin-bottom:4px;opacity:.6;transition:opacity .2s}
.soundCard:hover .speaker{opacity:1}
.soundLetter{font-size:34px;font-weight:800;color:var(--primary);direction:ltr;text-shadow:0 0 12px rgba(168,85,247,.5)}
.soundName{font-size:12px;color:var(--text-muted);margin-top:4px;direction:ltr}
.soundEx{font-size:11px;color:var(--primary);margin-top:6px;direction:ltr;font-weight:700}

.payBox{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:2px solid #fdba74;border-radius:22px;padding:22px;margin:14px 0;text-align:center}
[data-theme="dark"] .payBox{background:linear-gradient(135deg,#431407,#7c2d12);border-color:#c2410c}
.payCard{font-size:22px;font-weight:800;direction:ltr;letter-spacing:2px;color:#9a3412;background:#fff;border-radius:14px;padding:14px;margin:12px 0;border:2px dashed #fb923c;user-select:all;font-family:monospace}
[data-theme="dark"] .payCard{background:#1e293b;color:#fdba74}

.landing{min-height:100vh}
.landingHero{background:linear-gradient(135deg,#312e81 0%,#6d28d9 50%,#a855f7 100%);color:#fff;padding:60px 20px 90px;text-align:center;position:relative;overflow:hidden}
.landingHero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 60%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.1),transparent 50%);pointer-events:none}
.landingHero h1{font-size:clamp(26px,4.5vw,44px);margin:16px 0;text-shadow:0 4px 16px rgba(0,0,0,.25);position:relative;z-index:1}
.landingHero p{font-size:clamp(14px,2vw,18px);opacity:.95;max-width:600px;margin:14px auto;position:relative;z-index:1}
.landingHero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;position:relative;z-index:1}
.landingSection{padding:60px 20px;max-width:1100px;margin:auto}
.landingSection h2{text-align:center;font-size:clamp(22px,3vw,32px);margin-bottom:12px}
.landingSection .sub{text-align:center;color:var(--text-muted);margin-bottom:40px}
.featureGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.featureCard{background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:26px;transition:all .3s}
.featureCard:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(109,40,217,.15)}
.faqItem{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer}
.faqItem h4{margin:0;font-size:15px}
.faqItem p{margin:10px 0 0;color:var(--text-muted);font-size:13px;line-height:1.9;display:none}
.faqItem.open p{display:block}
.floatWhats{position:fixed;bottom:100px;left:20px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 10px 30px rgba(37,211,102,.4);z-index:150}

.streakBox{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px rgba(249,115,22,.3);display:flex;align-items:center;gap:14px}
.streakBox .streakIcon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.streakBox .streakIcon svg{width:26px;height:26px;color:#fff;stroke-width:2}
.streakBox .streakInfo{flex:1;text-align:right}
.streakBox .streakInfo b{font-size:26px;display:block;line-height:1.1;font-weight:800}
.streakBox .streakInfo span{font-size:12px;opacity:.9;font-weight:600}

.gamesQuick{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px rgba(16,185,129,.3);display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .25s}
.gamesQuick:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(16,185,129,.4)}
.gamesQuick .gamesIcon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gamesQuick .gamesIcon svg{width:26px;height:26px;color:#fff;stroke-width:2}
.gamesQuick .gamesInfo{flex:1;text-align:right}
.gamesQuick .gamesInfo h3{color:#fff;font-size:15px;font-weight:800;margin:0 0 2px}
.gamesQuick .gamesInfo p{color:rgba(255,255,255,.9);font-size:11px;margin:0}

.dailyTipBox{background:linear-gradient(135deg,#7c3aed 0%,#a855f7 50%,#ec4899 100%);color:#fff;border-radius:24px;padding:26px;position:relative;overflow:hidden;box-shadow:0 16px 45px rgba(168,85,247,.5);border:2px solid rgba(255,255,255,.15)}
.dailyTipBox:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.25),transparent 55%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.15),transparent 50%);pointer-events:none}
.dailyTipBox:after{content:"";position:absolute;top:-40%;right:-10%;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);animation:tipGlow 4s ease-in-out infinite;pointer-events:none}
@keyframes tipGlow{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.3);opacity:.9}}
.dailyTipBox .tipHeader{display:flex;align-items:center;gap:10px;font-size:12px;opacity:.95;font-weight:800;letter-spacing:2px;position:relative;z-index:1;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:99px;width:fit-content;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25)}
.dailyTipBox .tipTitle{font-family:'Lalezar',sans-serif;font-size:30px;font-weight:400;margin:16px 0 10px;line-height:1.2;position:relative;z-index:1;text-shadow:0 3px 12px rgba(0,0,0,.25);letter-spacing:.5px}
.dailyTipBox .tipBody{font-size:15px;font-weight:600;margin:8px 0 12px;line-height:2;position:relative;z-index:1;opacity:.95}
.dailyTipBox .tipExample{direction:ltr;text-align:left;background:rgba(255,255,255,.18);border-radius:14px;padding:14px;font-family:'Courier New',monospace;font-size:15px;margin-top:12px;position:relative;z-index:1;border-right:4px solid rgba(255,255,255,.7);font-weight:700;letter-spacing:.5px;backdrop-filter:blur(6px)}
.dailyTipBox .tipTranslate{font-size:13px;opacity:.9;margin-top:10px;position:relative;z-index:1;font-style:italic}
.dailyTipBox .tipDate{position:absolute;top:14px;left:20px;font-size:11px;opacity:.85;font-weight:700;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}

.gameMenuGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.gameCard{background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border:1.5px solid var(--card-border);border-radius:20px;padding:18px;text-align:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.gameCard:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(168,85,247,.22);border-color:var(--primary-light)}
.gameCard .recordBadge{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:800;box-shadow:0 4px 12px rgba(251,191,36,.4)}
.gameCard .gameIconWrap{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:8px auto 10px}
.gameCard .gameIconWrap svg{width:30px;height:30px;stroke-width:1.8}
.gameCard h3{margin:6px 0 4px;font-size:14px;font-weight:800}
.gameCard p{font-size:11px;color:var(--text-muted);margin:4px 0 0;line-height:1.6}

.gameArea{background:var(--card-bg);border-radius:24px;padding:24px;text-align:center;position:relative;overflow:hidden;margin-top:16px}
.gameWord{font-size:42px;font-weight:800;direction:ltr;background:linear-gradient(135deg,var(--primary),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:20px 0;letter-spacing:6px}
.gameEmojiBig{font-size:120px;line-height:1;margin:20px 0;filter:drop-shadow(0 10px 30px rgba(168,85,247,.4))}
.gameOptions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.gameOptions .option{margin:0;text-align:center;font-size:16px;font-weight:700}
.gameTimer{height:8px;background:var(--bg-grad-2);border-radius:99px;overflow:hidden;margin:16px 0}
.gameTimer i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);transition:width 1s linear}
.gameScoreBig{font-size:56px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}

.levelCard{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px dashed #f59e0b;border-radius:24px;padding:28px;text-align:center}
.levelCard .lvl{font-size:64px;font-weight:800;background:linear-gradient(135deg,#f59e0b,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
[data-theme="dark"] .levelCard{background:linear-gradient(135deg,#78350f,#451a03)}

.qaMsg{border-radius:16px;padding:14px;margin:10px 0;max-width:85%;line-height:1.9;font-size:14px}
.qaMsg.student{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e3a8a;margin-right:auto;margin-left:0;border-bottom-right-radius:4px}
.qaMsg.teacher{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534;margin-left:auto;margin-right:0;border-bottom-left-radius:4px}
[data-theme="dark"] .qaMsg.student{background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#dbeafe}
[data-theme="dark"] .qaMsg.teacher{background:linear-gradient(135deg,#166534,#14532d);color:#dcfce7}
.qaMsg .meta{font-size:10px;opacity:.75;margin-bottom:6px;font-weight:700}
.qaThread{background:var(--bg-grad-1);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin-bottom:12px}
.qaStatus{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
.qaStatus.open{background:#fef3c7;color:#92400e}
.qaStatus.answered{background:#dcfce7;color:#166534}
[data-theme="dark"] .qaStatus.open{background:#78350f;color:#fde68a}
[data-theme="dark"] .qaStatus.answered{background:#14532d;color:#bbf7d0}

.hwCard{background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;padding:16px;margin-bottom:12px;transition:all .25s}
.hwCard:hover{border-color:var(--primary-light);box-shadow:0 6px 20px rgba(109,40,217,.1)}
.hwCard h4{margin:0 0 8px;font-size:15px}
.hwCard .hwMeta{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.hwStatus{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
.hwStatus.pending{background:#fef3c7;color:#92400e}
.hwStatus.submitted{background:#dbeafe;color:#1e40af}
.hwStatus.graded{background:#dcfce7;color:#166534}
[data-theme="dark"] .hwStatus.pending{background:#78350f;color:#fde68a}
[data-theme="dark"] .hwStatus.submitted{background:#1e3a8a;color:#bfdbfe}
[data-theme="dark"] .hwStatus.graded{background:#14532d;color:#bbf7d0}

.hwFormHero{background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);color:#fff;border-radius:22px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.hwFormHero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.2),transparent 60%);pointer-events:none}
.hwFormHero h2{margin:0 0 6px;position:relative;z-index:1;font-size:20px}
.hwFormHero p{margin:0;font-size:13px;opacity:.92;position:relative;z-index:1}
.hwTypeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.hwTypeBtn{background:var(--card-bg);border:2px solid var(--input-border);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .25s;font-weight:700;font-size:12px;color:var(--text)}
.hwTypeBtn svg{display:block;margin:0 auto 6px;width:26px;height:26px;stroke-width:1.8}
.hwTypeBtn.active{border-color:var(--primary);background:linear-gradient(135deg,var(--bg-grad-2),#ede9fe);color:var(--primary);box-shadow:0 4px 14px rgba(109,40,217,.2)}
.hwTypeBtn:hover:not(.active){transform:translateY(-2px);border-color:var(--primary-light)}
.hwPreview{background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:2px dashed var(--card-border);border-radius:18px;padding:18px;margin-top:14px;line-height:1.9;font-size:14px}
.hwSubmitBig{background:linear-gradient(135deg,#22c55e,#059669);color:#fff;border:0;border-radius:18px;padding:18px;font-weight:800;font-size:16px;width:100%;margin-top:14px;box-shadow:0 8px 24px rgba(34,197,94,.4);transition:all .3s;display:flex;align-items:center;justify-content:center;gap:10px}
.hwSubmitBig:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(34,197,94,.5)}
.hwCharCount{font-size:11px;color:var(--text-muted);text-align:left;margin-top:4px;font-weight:600}

.referBox{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px dashed #f59e0b;border-radius:20px;padding:20px;text-align:center}
[data-theme="dark"] .referBox{background:linear-gradient(135deg,#78350f,#451a03)}
.referCode{font-family:monospace;font-size:22px;font-weight:800;letter-spacing:3px;color:#92400e;background:#fff;padding:12px;border-radius:12px;margin:10px 0;direction:ltr;text-align:center}
[data-theme="dark"] .referCode{background:#1e293b;color:#fde68a}
.demoBanner{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:12px 18px;border-radius:14px;margin-bottom:16px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.examDate{display:inline-block;background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#5b21b6;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;margin-right:8px;letter-spacing:.5px}
[data-theme="dark"] .examDate{background:linear-gradient(135deg,#4c1d95,#312e81);color:#c4b5fd}

.pcal{background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin:8px 0}
.pcalHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.pcalNav{background:var(--bg-grad-2);border:0;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:800;color:var(--primary)}
.pcalGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pcalDayName{font-size:10px;color:var(--text-muted);text-align:center;font-weight:700;padding:6px 0}
.pcalDay{aspect-ratio:1;border-radius:10px;background:var(--bg-grad-1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:all .2s}
.pcalDay:hover{background:var(--bg-grad-2);border-color:var(--primary-light)}
.pcalDay.selected{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 12px rgba(109,40,217,.4)}
.pcalDay.empty{background:transparent;cursor:default;pointer-events:none}
.pcalDay.today{border:2px solid var(--accent-pink)}

.leaderRow{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:8px 0;background:linear-gradient(135deg,var(--bg-grad-1),var(--card-bg));border:1px solid var(--card-border);border-radius:16px;transition:all .25s ease}
.leaderRow:hover{transform:translateX(-4px);box-shadow:0 8px 20px rgba(109,40,217,.12);border-color:var(--primary-light)}
.leaderRow.me{background:linear-gradient(135deg,#ede9fe,#ddd6fe);border-color:var(--primary);box-shadow:0 6px 20px rgba(109,40,217,.25)}
[data-theme="dark"] .leaderRow.me{background:linear-gradient(135deg,#4c1d95,#312e81)}
.leaderRank{flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:18px;font-weight:800;background:var(--card-bg);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.leaderRow:nth-child(1) .leaderRank{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.leaderRow:nth-child(2) .leaderRank{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#fff}
.leaderRow:nth-child(3) .leaderRank{background:linear-gradient(135deg,#d97706,#92400e);color:#fff}
.leaderName{flex:1;font-weight:700;font-size:14px;color:var(--text)}
.leaderXP{font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.flashcard{perspective:1200px;width:100%;max-width:400px;height:260px;margin:20px auto;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;box-shadow:0 12px 40px rgba(109,40,217,.25);border:2px solid var(--card-border)}
.flashcard-front{background:linear-gradient(135deg,#312e81 0%,#6d28d9 50%,#a855f7 100%);color:#fff}
.flashcard-back{background:linear-gradient(135deg,#f0fdf4,#dcfce7);color:#166534;transform:rotateY(180deg);border-color:#22c55e}
[data-theme="dark"] .flashcard-back{background:linear-gradient(135deg,#052e16,#14532d);color:#bbf7d0}
.flashcard-word{font-size:32px;font-weight:800;direction:ltr;text-align:center;letter-spacing:2px}
.flashcard-hint{font-size:13px;opacity:.75;font-style:italic}

.dictItem{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin:6px 0;background:var(--bg-grad-1);border:1px solid var(--card-border);border-radius:14px;cursor:pointer;transition:all .2s}

.scrambleAnswer{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:56px;margin:16px 0;padding:12px;background:var(--bg-grad-1);border-radius:16px;border:2px dashed var(--card-border)}

.idiomCard{background:linear-gradient(135deg,var(--card-bg),var(--bg-grad-1));border:1.5px solid var(--card-border);border-radius:18px;padding:18px;margin:10px 0;cursor:pointer;transition:all .25s;line-height:1.9}

.tsBookGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:18px}
.tsBookSelect{color:#fff;border-radius:26px;padding:30px 24px;cursor:pointer;transition:all .35s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;box-shadow:0 16px 45px rgba(109,40,217,.4);text-align:center;border:2px solid rgba(255,255,255,.15)}

.tsBookSelect:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.25),transparent 60%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.15),transparent 50%);pointer-events:none}
.tsBookSelect .tsBookNum{font-size:64px;font-weight:900;line-height:1;text-shadow:0 6px 20px rgba(0,0,0,.4);position:relative;z-index:1;font-family:'Lalezar',sans-serif}

.tsBookSelect .tsBookSub{font-size:13px;opacity:.92;position:relative;z-index:1;line-height:1.8}
.tsBookSelect .tsBookMeta{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}

.tsGrammarCard .tsTrans{font-size:13px;color:var(--text-muted);margin:8px 0;line-height:1.9}
.tsGrammarCard .tsNote{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:12px;padding:10px 14px;font-size:12px;color:#92400e;margin-top:10px;border-right:3px solid #f59e0b}
[data-theme="dark"] .tsGrammarCard .tsNote{background:linear-gradient(135deg,#78350f,#451a03);color:#fde68a}

function getPenguinSVG(mood){
  const eyeOffset = mood === "thinking" ? -2 : 0;
  const mouthPath = {idle:"M 60 62 Q 65 66 70 62",happy:"M 55 62 Q 65 72 75 62",sad:"M 55 68 Q 65 60 75 68",thinking:"M 60 64 Q 65 64 70 64",excited:"M 55 62 Q 65 74 75 62",wave:"M 58 63 Q 65 68 72 63",clap:"M 55 62 Q 65 72 75 62"};
  const currentMouth = mouthPath[mood] || mouthPath.idle;
  const leftWing = (mood === "wave") ? `<path d="M 22 75 Q 8 55 18 40 Q 20 38 22 40 Q 30 55 26 75 Z" fill="#1f2937"/>` : `<path d="M 22 75 Q 12 85 22 100 Q 26 96 28 80 Z" fill="#1f2937"/>`;
  const rightWing = (mood === "clap" || mood === "happy") ? `<path d="M 108 75 Q 122 55 112 40 Q 110 38 108 40 Q 100 55 104 75 Z" fill="#1f2937"/>` : `<path d="M 108 75 Q 118 85 108 100 Q 104 96 102 80 Z" fill="#1f2937"/>`;
  const cheeks = (mood === "happy" || mood === "excited") ? `<ellipse cx="48" cy="60" rx="5" ry="3" fill="#f472b6" opacity="0.55"/><ellipse cx="82" cy="60" rx="5" ry="3" fill="#f472b6" opacity="0.55"/>` : "";
  const sparkles = (mood === "excited") ? `<text x="20" y="30" font-size="14" fill="#fbbf24">✨</text><text x="100" y="25" font-size="12" fill="#ec4899">✨</text><text x="15" y="115" font-size="10" fill="#a855f7">✨</text>` : "";
  const thinking = (mood === "thinking") ? `<text x="100" y="30" font-size="20" fill="#f59e0b" font-weight="bold">?</text>` : "";
  const tears = (mood === "sad") ? `<ellipse cx="52" cy="58" rx="2" ry="4" fill="#60a5fa"/><ellipse cx="78" cy="58" rx="2" ry="4" fill="#60a5fa"/>` : "";
  return `<svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="pengBody" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#374151"/><stop offset="1" stop-color="#111827"/></radialGradient>
      <radialGradient id="pengBelly" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f4f6"/></radialGradient>
      <linearGradient id="pengBeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>

    <ellipse cx="65" cy="122" rx="35" ry="6" fill="rgba(109,40,217,0.25)"/>
    <ellipse cx="50" cy="118" rx="9" ry="5" fill="#f59e0b"/>
    <ellipse cx="80" cy="118" rx="9" ry="5" fill="#f59e0b"/>
    <ellipse cx="50" cy="117" rx="9" ry="4" fill="#fbbf24"/>
    <ellipse cx="80" cy="117" rx="9" ry="4" fill="#fbbf24"/>
    <ellipse cx="65" cy="80" rx="45" ry="42" fill="url(#pengBody)"/>
    <ellipse cx="65" cy="85" rx="30" ry="32" fill="url(#pengBelly)"/>
    ${leftWing}${rightWing}
    <circle cx="65" cy="48" r="32" fill="url(#pengBody)"/>
    <ellipse cx="52" cy="48" rx="11" ry="13" fill="#ffffff"/>
    <ellipse cx="78" cy="48" rx="11" ry="13" fill="#ffffff"/>
    <circle cx="52" cy="${48 + eyeOffset}" r="5" fill="#111827"/>
    <circle cx="78" cy="${48 + eyeOffset}" r="5" fill="#111827"/>
    <circle cx="54" cy="${46 + eyeOffset}" r="1.8" fill="#ffffff"/>
    <circle cx="80" cy="${46 + eyeOffset}" r="1.8" fill="#ffffff"/>
    <path d="M 58 60 L 72 60 L 65 70 Z" fill="url(#pengBeak)"/>
    <path d="M 58 60 L 72 60 L 65 63 Z" fill="#fbbf24" opacity="0.7"/>
    <path d="${currentMouth}" stroke="#111827" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    ${cheeks}${tears}${sparkles}${thinking}
    <ellipse cx="58" cy="30" rx="8" ry="4" fill="#ffffff" opacity="0.15"/>
  </svg>`;
}

const Penguin={
  stage:null,bubble:null,currentMood:"idle",bubbleTimer:null,animTimer:null,
  init(){this.stage=document.getElementById("penguinStage");this.bubble=document.getElementById("penguinBubble");if(!this.stage)return;this.setMood("idle")},
  setMood(mood,showAnim){
    if(!this.stage)return;
    this.currentMood=mood;
    const w=this.stage.querySelector(".penguinSvgWrap");
    if(w)w.innerHTML=getPenguinSVG(mood);
    this.stage.classList.remove("mood-happy","mood-sad","mood-thinking","mood-excited");
    this.stage.classList.remove("anim-idle","anim-clap","anim-jump","anim-shake","anim-thinking");
    if(mood==="happy"||mood==="excited")this.stage.classList.add("mood-happy");
    else if(mood==="sad")this.stage.classList.add("mood-sad");
    else if(mood==="thinking")this.stage.classList.add("mood-thinking");
    if(showAnim!==false){
      if(this.animTimer)clearTimeout(this.animTimer);
      if(mood==="happy"||mood==="clap"){this.stage.classList.add("anim-clap");this.animTimer=setTimeout(()=>{this.stage.classList.remove("anim-clap");this.setMood("idle",false)},1600)}
      else if(mood==="excited"){this.stage.classList.add("anim-jump");this.animTimer=setTimeout(()=>{this.stage.classList.remove("anim-jump");this.setMood("idle",false)},2000)}
      else if(mood==="sad"){this.stage.classList.add("anim-shake");this.animTimer=setTimeout(()=>{this.stage.classList.remove("anim-shake");this.setMood("idle",false)},1200)}
      else if(mood==="thinking"){this.stage.classList.add("anim-thinking")}
      else{this.stage.classList.add("anim-idle")}
    }
  },
  say(text,duration){if(!this.bubble)return;if(this.bubbleTimer)clearTimeout(this.bubbleTimer);this.bubble.textContent=text;this.bubble.classList.add("show");this.bubbleTimer=setTimeout(()=>this.bubble.classList.remove("show"),duration||2500)},
  reactOnInput(v){
    v=String(v||"").trim();
    if(!v){this.setMood("thinking",false);this.say("منتظرم... 🐧");return}
    if(v.length<4){this.setMood("thinking",false);this.say("ادامه بده...");return}
    const d=v.replace(/\D/g,"");
    if(d.length>=10&&d.length<=12){this.setMood("happy");this.say("آفرین! معتبره ✅")}
    else if(d.length>12){this.setMood("sad");this.say("خیلی بلنده ❌")}
    else{this.setMood("thinking",false);this.say("چند رقم دیگه...")}
  },
  reactOnPassword(v){
    v=String(v||"");
    if(!v){this.setMood("thinking",false);return}
    if(v.length<6){this.setMood("sad",false);this.say("حداقل ۶ کاراکتر")}
    else if(v.length<10){this.setMood("happy");this.say("خوبه! 👍")}
    else{this.setMood("excited");this.say("عالیه! 💪")}
  },
  reactOnName(v){v=String(v||"").trim();if(!v)return;if(v.length<2){this.setMood("thinking",false);return}this.setMood("happy");this.say("خوشحالم! 👋")},
  reactSuccess(m){this.setMood("excited");this.say(m||"موفق شدی! 🎉",3000)},
  reactError(m){this.setMood("sad");this.say(m||"مشکلی پیش اومد 😢",3000)},
  wave(){this.setMood("wave");this.say("سلام! خوش اومدی 👋")}
};

  const icons={success:"✅",error:"❌",info:"ℹ️",warning:"⚠️"};
  t.innerHTML=`<span>${icons[type]||"ℹ️"}</span><span>${esc(msg)}</span>`;
  w.appendChild(t);setTimeout(()=>{t.style.animation="toastOut .3s forwards";setTimeout(()=>t.remove(),300)},duration);
}
function confirmDialog(msg){return Promise.resolve(window.confirm(msg))}

/* ==================== Utils ==================== */
function getWordKey(grade,lessonNumber){
  if(grade===7)return lessonNumber-1;
  if(grade===8)return 8+lessonNumber;
  if(grade===9)return 15+lessonNumber;
  if(grade===10)return 21+lessonNumber;
  if(grade===11)return 26+lessonNumber-1;
  if(grade===12)return 29+lessonNumber-1;
  return null;
}
function getWords(grade,lessonNumber){const k=getWordKey(grade,lessonNumber);if(k===null)return[];return (words&&words[k])?words[k]:[]}
function getGrammar(grade,lessonNumber){const k=getWordKey(grade,lessonNumber);if(k===null)return[];return (grammar&&grammar[k])?grammar[k]:[]}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function normalizePhone(x){return String(x||"").replace(/\D/g,"")}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function saveLocal(){localStorage.setItem("AN_EXAMS",JSON.stringify(examRecords))}
function toPersianNum(n){return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d])}

/* ==================== Speech ==================== */
function speak(text,rate){
  if(!window.speechSynthesis){toast("مرورگر پشتیبانی نمی‌کند","error");return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate||.75;
  speechSynthesis.resume();speechSynthesis.speak(u);
}
function speakLetter(letter,word,fullExamples){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u1=new SpeechSynthesisUtterance(letter);u1.lang="en-US";u1.rate=.65;
  u1.onend=function(){const u2=new SpeechSynthesisUtterance(word);u2.lang="en-US";u2.rate=.7;u2.onend=function(){const u3=new SpeechSynthesisUtterance(fullExamples);u3.lang="en-US";u3.rate=.75;speechSynthesis.speak(u3)};speechSynthesis.speak(u2)};
  speechSynthesis.resume();speechSynthesis.speak(u1);
}

/* ==================== Access Function ==================== */
async function accessFunction(payload){
  const r=await fetch(ACCESS_FUNCTION,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify(payload)});
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok||data?.ok===false)throw new Error(data?.error||"خطا در ارتباط با سرور.");
  return data;
}

const JALALI_MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const JALALI_WEEK=["ش","ی","د","س","چ","پ","ج"];
function gregorianToJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;let gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  let jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  let jd=1+((days<186)?(days%31):((days-186)%30));return[jy,jm,jd];
}
function jalaliToGregorian(jy,jm,jd){
  jy+=1595;let days=-355668+(365*jy)+Math.floor((jy+3)/4)-Math.floor((jy+99)/100)+Math.floor((jy+399)/400)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  let gy=400*Math.floor(days/146097);days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365){days++;gy+=Math.floor(days/365);days%=365}}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
  let gd=days+1;const sal_a=[0,31,(gy%4===0&&gy%100!==0)||(gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;
  for(gm=0;gm<13;gm++){const v=sal_a[gm];if(gd<=v)break;gd-=v}return[gy,gm,gd];
}
function getJalaliMonthDays(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;const leap=((((jy+2346)%2820)*682)%2816)<682;return leap?30:29}
function getTodayJalali(){const n=new Date();return gregorianToJalali(n.getFullYear(),n.getMonth()+1,n.getDate())}
function JALI_WEEK_TODAY(){const d=new Date().getDay();const m=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];return m[d]}

      (u.vocabulary||[]).forEach(w=>{arr.push({en:w[0],fa:w[1],grade:"TS"+book.id})});
    });
  });
  const seen=new Set();
  return arr.filter(x=>{const key=String(x.en).toLowerCase();if(seen.has(key))return false;seen.add(key);return true});
}

function searchDictionary(q){window._dictQuery=String(q||"").trim().toLowerCase();applyDictFilter()}
function applyDictFilter(){

    </div>
  `);
}
function startSRS(mode){
  let pool=[];const all=getAllWords();
  if(!all.length){toast("دیتابیس کلمات خالیه","error");return}
  if(mode==="due"){
    const due=getDueCards();
    if(!due.length){toast("کارتی برای مرور نیست! 📭 بعداً سر بزن.","info");return}
    pool=due.map(w=>{const found=all.find(x=>x.en===w);return found?found:{en:w,fa:"—"}});
  } else {
    const avail=all.filter(w=>!S.srs[w.en] || !S.srs[w.en].mastered);
    pool=shuffle(avail).slice(0,20);
    if(!pool.length){toast("همه کلمات مرور شدن! 🎉","success");return}
  }
  S._srsSession={mode,list:shuffle(pool),index:0,flipped:false,correct:0,wrong:0};
  srsRender();
}
function srsRender(){
  const ses=S._srsSession;if(!ses){home();return}
  if(ses.index>=ses.list.length){return srsFinish()}
  const w=ses.list[ses.index];
  const safeEn=String(w.en).replace(/'/g,"\\'").replace(/"/g,'\\"');
  render("فلش‌کارت",`
    <div class="card" style="max-width:500px;margin:auto">
      <button class="btn secondary" onclick="flashcardPage()">← خروج</button>
      <div style="text-align:center;margin-top:12px">
        <span class="badge">${ses.index+1} / ${ses.list.length}</span>
        <span class="badge">✅ ${ses.correct}</span>
        <span class="badge">❌ ${ses.wrong}</span>
      </div>
      <div class="flashcard ${ses.flipped?'flipped':''}" onclick="srsFlip()">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <div class="flashcard-hint">${ses.mode==="due"?"مرور":"کلمه جدید"}</div>
            <div class="flashcard-word">${esc(w.en)}</div>
            <div class="flashcard-hint">👆 برای دیدن معنی کلیک کن</div>
            <button class="btn secondary" style="margin-top:10px" onclick="event.stopPropagation();speak('${safeEn}')">🔊 تلفظ</button>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-hint">فارسی</div>
            <div class="flashcard-word" style="font-size:26px">${esc(w.fa)}</div>
            <div class="flashcard-hint">حالا بلد بودی؟</div>
          </div>
        </div>
      </div>
      ${ses.flipped?`
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn danger full" onclick="srsAnswer(false)">❌ بلد نبودم</button>
          <button class="btn success full" onclick="srsAnswer(true)">✅ بلد بودم</button>
        </div>
      `:`
        <button class="btn full" style="margin-top:14px" onclick="srsFlip()">🔄 نمایش پاسخ</button>
      `}
    </div>
  `);
}
function srsFlip(){if(!S._srsSession)return;S._srsSession.flipped=!S._srsSession.flipped;srsRender()}
async function srsAnswer(correct){
  const ses=S._srsSession;if(!ses)return;
  const w=ses.list[ses.index];
  const card=S.srs[w.en]||{box:1,correct:0,wrong:0,mastered:false};
  let newBox=card.box||1;
  let newCorrect=(card.correct||0)+(correct?1:0);
  let newWrong=(card.wrong||0)+(correct?0:1);
  let mastered=card.mastered||false;
  if(correct){newBox=Math.min(newBox+1,7);if(newBox>=6)mastered=true;ses.correct++}
  else{newBox=1;mastered=false;ses.wrong++}
  await saveSRSCard(w.en,newBox,mastered,newCorrect,newWrong);
  ses.index++;ses.flipped=false;srsRender();
}
async function srsFinish(){
  const ses=S._srsSession;if(!ses)return;
  const total=ses.correct+ses.wrong;
  const percent=total?Math.round(ses.correct/total*100):0;
  await addXP(Math.round(percent/5));
  render("پایان مرور",`
    <div class="card" style="max-width:500px;margin:auto;text-align:center">
      <div style="font-size:80px">🎉</div>
      <h2>مرور کامل شد!</h2>
      <div class="score">${percent}%</div>
      <p class="muted">✅ ${ses.correct} درست · ❌ ${ses.wrong} اشتباه</p>
      <p style="color:var(--primary);font-weight:800">+${Math.round(percent/5)} XP</p>
      <button class="btn full" style="margin-top:14px" onclick="flashcardPage()">بازگشت به فلش‌کارت</button>
      <button class="btn secondary full" style="margin-top:8px" onclick="home()">خانه</button>
    </div>
  `);
  S._srsSession=null;
}

async function studentLogin(){
  const phone=document.getElementById("phone").value.trim();
  const password=document.getElementById("pass").value;
  if(!phone||!password){toast("همه فیلدها لازمه","error");Penguin.reactError("فیلدها خالی!");return}
  Penguin.setMood("thinking");Penguin.say("چک می‌کنم...");
  try{
    const result=await accessFunction({action:"find",phone});
    const student=result.student,email=result.email;
    if(!student)throw new Error("زبان‌آموزی با این شماره نیست.");
    if(student.status==="rejected")throw new Error("ثبت‌نام رد شده.");
    if(!["registered","approved"].includes(student.status))throw new Error("هنوز تأیید نشده.");
    if(!email)throw new Error("ایمیل پیدا نشد.");
    const auth=await db.auth.signInWithPassword({email:String(email).trim(),password});
    if(auth.error)throw new Error("رمز اشتباه است.");
    S.student=student;S.admin=false;
    Penguin.reactSuccess("خوش اومدی! 🎉");
    await loadStudentStats();await loadUnlocks();
    loadStreak();loadGameRecords();
    await loadQAs();await loadHomeworks();
    await loadSRS();await loadStudyLog();
    toast("خوش آمدی "+student.first_name,"success");
    setTimeout(()=>home(),800);
  }catch(e){
    Penguin.reactError(e?.message||"خطا");
    toast(e?.message||"خطا","error");
  }
}
async function adminLogin(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("pass").value;
  if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){toast("ایمیل اشتباه","error");Penguin.reactError("ایمیل!");return}
  if(!password){toast("رمز خالی","error");Penguin.reactError("رمز!");return}

async function register(){
  const first=document.getElementById("rf").value.trim();
  const last=document.getElementById("rl").value.trim();
  const phone=document.getElementById("rp").value.trim();
  const password=document.getElementById("rpass").value;
  const level=document.getElementById("rlevel").value;
  const refCode=document.getElementById("rref").value.trim();
  if(!first||!last||!phone||!password||!level){toast("همه موارد","error");Penguin.reactError("کامل کن!");return}
  if(password.length<6){toast("رمز کوتاه","error");Penguin.reactError("رمز!");return}
  const digits=normalizePhone(phone);
  if(digits.length<10){toast("شماره معتبر نیست","error");Penguin.reactError("شماره!");return}
  Penguin.setMood("thinking");Penguin.say("ثبت...");
  const email=digits+"@alinagheli.com";
  try{
    const r=await db.auth.signUp({email,password,options:{data:{first_name:first,last_name:last,phone,level,referred_by:refCode||null}}});
    if(r.error)throw r.error;
    if(!r.data.user)throw new Error("حساب ساخته نشد");
    await accessFunction({action:"register",first_name:first,last_name:last,phone,level,auth_user_id:r.data.user.id,email,referred_by:refCode||null});
    if(refCode){try{const c=Number(localStorage.getItem("AN_REF_COUNT_"+refCode)||0);localStorage.setItem("AN_REF_COUNT_"+refCode,String(c+1))}catch(e){}}
    await db.auth.signOut();
    Penguin.reactSuccess("موفق! منتظر تأیید مدیر 🎉");
    toast("ثبت‌نام شد! منتظر تأیید.","success",5000);
    setTimeout(()=>login(),2000);
  }catch(e){
    try{await db.auth.signOut()}catch(_){}
    Penguin.reactError("نشد!");
    toast("خطا: "+(e?.message||"؟"),"error",5000);
  }
}

function gameStart(){
  if(S.currentGame.timer)clearInterval(S.currentGame.timer);
  S.currentGame.score=0;S.currentGame.time=60;S.currentGame.started=true;S.currentGame.state=null;
  const el=document.getElementById("gameArea");
  if(!el)return;
  el.innerHTML=`<div id="gameContent"></div>`;
  gameNext();
  S.currentGame.timer=setInterval(()=>{
    S.currentGame.time--;
    const tEl=document.getElementById("gameTime");
    const barEl=document.getElementById("gameTimerBar");
    if(tEl)tEl.textContent=S.currentGame.time;
    if(barEl)barEl.style.width=((S.currentGame.time/60)*100)+"%";
    if(S.currentGame.time<=0)gameEnd();
  },1000);
}
function gameNext(){
  const id=S.currentGame.id;
  const el=document.getElementById("gameContent");
  if(!el)return;
  if(id==="animals")return gameNextAnimals(el);
  if(id==="memory")return gameNextMemory(el);
  if(id==="incomplete")return gameNextIncomplete(el);
  if(id==="numbers")return gameNextNumbers(el);
  if(id==="colors")return gameNextColors(el);
  if(id==="scramble")return gameNextScramble(el);
  if(id==="synonyms")return gameNextSynonyms(el);
  if(id==="antonyms")return gameNextAntonyms(el);
  if(id==="idioms")return gameNextIdioms(el);
  if(id==="tenses")return gameNextTenses(el);
}
function gameAnswerHandler(isCorrect){
  if(!S.currentGame.started)return;
  if(isCorrect){
    S.currentGame.score+=10;
    const s=document.getElementById("gameScore");
    if(s)s.textContent=S.currentGame.score;
    setTimeout(()=>{if(S.currentGame.started)gameNext()},450);
  } else {
    S.currentGame.time=Math.max(0,S.currentGame.time-3);
    setTimeout(()=>{if(S.currentGame.started)gameNext()},800);
  }
}
function gameAnswerGeneric(btn,chosen,correct){
  const btns=document.querySelectorAll(".gameOptions .option");
  btns.forEach(b=>b.disabled=true);
  btn.classList.add(chosen===correct?"correct":"wrong");
  if(chosen!==correct){
    const ci=Array.from(btns).findIndex(b=>b.textContent.trim()===correct);
    if(ci>=0)btns[ci].classList.add("correct");
  }
  gameAnswerHandler(chosen===correct);
}
function gameNextAnimals(el){
  const data=getAnimalGameData();
  const pick=data[Math.floor(Math.random()*data.length)];
  const wrongs=shuffle(data.filter(x=>x.name!==pick.name)).slice(0,3);
  const options=shuffle([pick,...wrongs]);
  el.innerHTML=`<div class="gameEmojiBig">${pick.emoji}</div><p class="muted">اسم انگلیسی این حیوان؟</p><div class="gameOptions">
    ${options.map(o=>`<button class="option" onclick="gameAnswerGeneric(this,'${o.name}','${pick.name}')">${o.name}</button>`).join("")}
  </div>`;
}
function gameNextMemory(el){
  const data=getMemoryGameData();
  const pick=data[Math.floor(Math.random()*data.length)];
  const wrongs=shuffle(data.filter(x=>x[1]!==pick[1])).slice(0,3);
  const options=shuffle([pick,...wrongs]);
  el.innerHTML=`<div class="gameWord">${pick[0]}</div><p class="muted">معنی این کلمه؟</p><div class="gameOptions">

  </div>`;
}

  const data=getIncompleteGameData();
  const pick=data[Math.floor(Math.random()*data.length)];

function gameNextScramble(el){
  const all=getAllWords().filter(w=>/^[a-zA-Z]{3,10}$/.test(String(w.en))&&String(w.en).indexOf(" ")===-1);
  if(all.length<1){el.innerHTML=`<p class="muted">داده کافی نیست</p>`;return}
  const pick=all[Math.floor(Math.random()*all.length)];
  const word=String(pick.en).toUpperCase();
  const letters=shuffle(word.split(""));
  S.currentGame.state={word, letters, picked:[], target:word.split("")};
  el.innerHTML=`
    <p class="muted">حروف رو مرتب کن و کلمه بساز (${pick.fa})</p>
    <div class="scrambleAnswer" id="scrambleAnswer">${renderScrambleSlots()}</div>
    <div class="scrambleLetters" id="scrambleLetters">
      ${letters.map((c,i)=>`<div class="scrambleLetter" id="sLetter${i}" onclick="pickScrambleLetter(${i})">${c}</div>`).join("")}
    </div>
    <button class="btn secondary full" style="margin-top:12px" onclick="clearScramble()">🔄 پاک کردن</button>
  `;
}
function renderScrambleSlots(){
  const st=S.currentGame.state;
  return st.word.split("").map((_,i)=>{
    const c=st.picked[i]||"";
    return `<div class="scrambleSlot" id="slot${i}" onclick="unpickScramble(${i})">${c}</div>`;
  }).join("");
}
function pickScrambleLetter(idx){
  const st=S.currentGame.state;
  if(!st)return;
  if(st.picked.length>=st.word.length)return;
  st.picked.push({letter:st.letters[idx],srcIdx:idx});
  const slotEl=document.getElementById("slot"+(st.picked.length-1));
  if(slotEl)slotEl.textContent=st.letters[idx];
  const btn=document.getElementById("sLetter"+idx);
  if(btn)btn.classList.add("used");
  if(st.picked.length===st.word.length){
    const result=st.picked.map(x=>x.letter).join("");
    setTimeout(()=>{
      if(result===st.word){gameAnswerHandler(true)}
      else{toast("اشتباه! دوباره تلاش کن","error",1500);clearScramble()}
    },200);
  }
}
function unpickScramble(slotIdx){
  const st=S.currentGame.state;
  if(!st)return;
  if(slotIdx>=st.picked.length)return;
  const removed=st.picked.splice(slotIdx,1)[0];
  if(removed){const btn=document.getElementById("sLetter"+removed.srcIdx);if(btn)btn.classList.remove("used")}
  for(let i=0;i<st.word.length;i++){
    const slotEl=document.getElementById("slot"+i);
    if(slotEl)slotEl.textContent=st.picked[i]?st.picked[i].letter:"";
  }
}
function clearScramble(){
  const st=S.currentGame.state;
  if(!st)return;
  st.picked=[];
  st.letters.forEach((_,i)=>{const btn=document.getElementById("sLetter"+i);if(btn)btn.classList.remove("used")});
  for(let i=0;i<st.word.length;i++){const slotEl=document.getElementById("slot"+i);if(slotEl)slotEl.textContent=""}
}

async function gameEnd(){
  if(!S.currentGame||!S.currentGame.started)return;
  S.currentGame.started=false;
  if(S.currentGame.timer){clearInterval(S.currentGame.timer);S.currentGame.timer=null}
  const isNew=saveGameRecord(S.currentGame.id,S.currentGame.score);
  const area=document.getElementById("gameArea");
  if(!area)return;
  let bonus=Math.floor(S.currentGame.score/10)*2;
  if(isNew)bonus+=20;
  if(S.student&&bonus>0)await addXP(bonus);
  area.innerHTML=`
    <div class="gameScoreBig">${S.currentGame.score}</div>
    <h3 style="text-align:center;margin:10px 0">${isNew?"🎉 رکورد جدید!":"بازی تمام"}</h3>
    <p class="muted" style="text-align:center">🏆 بهترین: ${S.gameRecords[S.currentGame.id]||0}</p>
    ${bonus>0?`<p style="text-align:center;color:var(--primary);font-weight:800">+${bonus} XP</p>`:""}
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn full" onclick="startGame('${S.currentGame.id}')">🔁 مجدد</button>
      <button class="btn secondary full" onclick="gamesMenu()">بازی دیگر</button>
    </div>
  `;
}

function lessonTab(n){
  document.querySelectorAll(".sec").forEach((x,i)=>x.classList.toggle("active",i===n));
  document.querySelectorAll(".tab2").forEach((x,i)=>x.classList.toggle("active",i===n));
  if(n===2)startLessonQuiz();
}
function makeLessonQuestions(){
  const g=S.grade;const no=S.lesson+1;
  const wl=getWords(g,no);const gl=getGrammar(g,no);const arr=[];
  wl.forEach(function(w,i){
    const pool=shuffle(wl.filter(function(_,j){return j!==i}).map(x=>x[1])).slice(0,3);
    if(pool.length<3)return;
    const opts=shuffle([w[1]].concat(pool));
    arr.push({q:'معنی «'+w[0]+'»؟',options:opts,answer:opts.indexOf(w[1])});
  });
  gl.forEach(function(gr){
    const wrongs=["She are a student.","They is happy.","He am a teacher.","I is a doctor.","We is here."];
    const opts=shuffle([gr[1],...shuffle(wrongs).slice(0,3)]);
    arr.push({q:'با «'+gr[0]+'» کدام درست؟',options:opts,answer:opts.indexOf(gr[1])});
  });
  let all=[];
  for(let ln=1;ln<=(books[g]?books[g].lessons.length:0);ln++)getWords(g,ln).forEach(w=>all.push(w));
  while(arr.length<12&&all.length>3){
    const w=all[Math.floor(Math.random()*all.length)];
    const pool=shuffle(all.filter(x=>x[1]!==w[1]).map(x=>x[1])).slice(0,3);
    if(pool.length<3)break;
    const opts=shuffle([w[1],...pool]);
    arr.push({q:'معنی «'+w[0]+'»؟',options:opts,answer:opts.indexOf(w[1])});
  }
  return shuffle(arr).slice(0,15);
}
function startLessonQuiz(){
  S.quiz={type:"lesson",title:`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,questions:makeLessonQuestions(),i:0,correct:0,wrong:0};
  quizRender("lessonQuiz");
}

function finalAnswer(i,id){
  const q=S.quiz.questions[S.quiz.i];

  setTimeout(()=>{S.quiz.i++;finalQuizRender(id)},700);

  </div>`;
}

  else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct")}
  setTimeout(async()=>{S.quiz.i++;if(S.quiz.i>=S.quiz.questions.length)await placementFinish();else placementQuizRender("placementQuiz")},700);
}
async function placementFinish(){
  const scores=S.quiz.levelScores;
  const total=S.quiz.correct;
  let level="A1";
  const order=["A1","A2","B1","B2","C1","C2"];
  for(const lv of order){if((scores[lv]||0)>=3)level=lv}
  if(total<=3)level="A1";
  const desc={A1:"مبتدی",A2:"پیش‌متوسط",B1:"متوسط",B2:"متوسط بالا",C1:"پیشرفته",C2:"فوق‌پیشرفته 🏆"};
  const kind=S.quiz.kind;const title=kind==="grammar"?"گرامر":"واژگان";
  if(S.student){try{await db.from("exam_results").insert({user_id:S.student.auth_user_id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,exam_type:"placement-"+kind,exam_title:"تعیین سطح "+title,score:total,total:S.quiz.questions.length,percentage:Math.round(total/S.quiz.questions.length*100)})}catch(e){}}
  const el=document.getElementById("placementQuiz");
  const bars=order.map(lv=>{const c=scores[lv]||0;const pct=(c/4)*100;return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px"><span>${lv}</span><span>${c}/4</span></div><div class="progress" style="margin:0"><i style="width:${pct}%"></i></div></div>`}).join("");
  if(el)el.innerHTML=`
    <div class="card levelCard">
      <div style="font-size:13px;font-weight:800;letter-spacing:2px;opacity:.9">سطح ${title}</div>
      <div class="lvl">${level}</div>
      <p style="font-weight:700;margin:10px 0">${desc[level]}</p>
      <p class="muted">✅ ${total} درست از ${S.quiz.questions.length}</p>
    </div>
    <div class="card"><h3 style="margin-top:0">📊 عملکرد</h3>${bars}</div>
    <button class="btn full" onclick="home()">بازگشت</button>
  `;
}

function startTsQuiz(bookId, unitId){
  const book=getTouchstoneBook(bookId);
  const u=book.units.find(x=>x.id===unitId);
  if(!u){return}
  const qs=[];
  u.vocabulary.forEach(w=>{
    const pool=shuffle(u.vocabulary.filter(x=>x[1]!==w[1]).map(x=>x[1])).slice(0,3);
    if(pool.length<3)return;
    const opts=shuffle([w[1],...pool]);
    qs.push({q:`معنی «${w[0]}» چیست؟`,options:opts,answer:opts.indexOf(w[1])});
  });
  u.grammar.forEach(g=>{
    if(g.examples&&g.examples.length){
      const ex=g.examples[Math.floor(Math.random()*g.examples.length)];
      const wrongs=["She are a student.","They is happy.","He am a teacher.","I is a doctor.","We is here.","You is nice."];
      const opts=shuffle([ex,...shuffle(wrongs).slice(0,3)]);
      qs.push({q:`کدام جمله درست است؟ (${g.title})`,options:opts,answer:opts.indexOf(ex)});
    }
  });
  S.quiz={type:"touchstone",title:`Touchstone ${bookId} - Unit ${u.id}: ${u.title}`,bookId,unitId,questions:shuffle(qs).slice(0,15),i:0,correct:0,wrong:0};
  tsQuizRender("tsQuiz");
}
function tsQuizRender(id){
  const q=S.quiz.questions[S.quiz.i];
  if(!q){tsQuizFinish(id);return}
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML=`<div class="card">
    <b style="color:var(--primary)">سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>
    <div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div>
    <div style="font-size:18px;font-weight:700;line-height:2;margin:18px 0;color:var(--primary-dark)">${esc(q.q)}</div>
    ${q.options.map((x,i)=>`<button class="option" onclick="tsAnswer(${i},'${id}')">${esc(x)}</button>`).join("")}
    <div id="tsfb"></div>
  </div>`;
}
function tsAnswer(i,id){
  const q=S.quiz.questions[S.quiz.i];
  const opts=document.querySelectorAll(".option");
  opts.forEach(x=>x.disabled=true);
  if(i===q.answer){S.quiz.correct++;opts[i].classList.add("correct");const fb=document.getElementById("tsfb");if(fb){fb.className="feedback ok";fb.innerHTML="✅ آفرین!"}}
  else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");const fb=document.getElementById("tsfb");if(fb){fb.className="feedback bad";fb.innerHTML="❌ اشتباه"}}
  setTimeout(()=>{S.quiz.i++;tsQuizRender(id)},700);
}
async function tsQuizFinish(id){
  const total=S.quiz.questions.length;
  const percent=total?Math.round(S.quiz.correct/total*100):0;
  if(S.student){
    try{await db.from("exam_results").insert({user_id:S.student.auth_user_id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,exam_type:"touchstone",exam_title:S.quiz.title,score:S.quiz.correct,total,percentage:percent})}catch(e){}
    await addXP(Math.max(10,percent));
  }
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML=`<div class="card resultBox">
    <div class="score">${percent}%</div>
    <h2 style="text-align:center">تمام شد 🎉</h2>
    <p style="text-align:center;color:var(--text-muted)">${S.quiz.correct} درست از ${total}</p>
    <button class="btn full" onclick="openTsUnit(${S.quiz.bookId},${S.quiz.unitId})">بازگشت به درس</button>
    <button class="btn secondary full" style="margin-top:8px" onclick="openTsBook(${S.quiz.bookId})">لیست دروس</button>
  </div>`;
}

function initPersianCalendar(idx){
  const today=getTodayJalali();
  window["_pcal_"+idx]={jy:today[0],jm:today[1],selected:null};
  renderPersianCalendar(idx);renderPersianTimes(idx);
}
function renderPersianCalendar(idx){
  const st=window["_pcal_"+idx];
  const el=document.getElementById("pcal-"+idx);if(!el)return;
  const days=getJalaliMonthDays(st.jy,st.jm);
  const [gy,gm,gd]=jalaliToGregorian(st.jy,st.jm,1);
  const gDate=new Date(gy,gm-1,gd);
  const firstWeek=(gDate.getDay()+1)%7;
  let grid="";
  for(let i=0;i<firstWeek;i++)grid+=`<div class="pcalDay empty"></div>`;
  for(let d=1;d<=days;d++){
    const isSel=st.selected&&st.selected.jy===st.jy&&st.selected.jm===st.jm&&st.selected.jd===d;
    const tj=getTodayJalali();
    const isToday=tj[0]===st.jy&&tj[1]===st.jm&&tj[2]===d;
    grid+=`<div class="pcalDay ${isSel?'selected':''} ${isToday?'today':''}" onclick="selectPersianDay(${idx},${d})">${d}</div>`;
  }
  el.innerHTML=`<div class="pcal">
    <div class="pcalHeader"><button class="pcalNav" onclick="pcalPrev(${idx})">‹</button><span>${JALALI_MONTHS[st.jm-1]} ${st.jy}</span><button class="pcalNav" onclick="pcalNext(${idx})">›</button></div>
    <div class="pcalGrid">${JALALI_WEEK.map(d=>`<div class="pcalDayName">${d}</div>`).join("")}${grid}</div>
  </div>`;
}
function renderPersianTimes(idx){
  const st=window["_pcal_"+idx];
  const el=document.getElementById("ptime-"+idx);if(!el)return;
  if(!st.selected){el.innerHTML=`<p class="muted" style="text-align:center">یک روز انتخاب کن</p>`;return}
  const times=["۰۹:۰۰","۱۰:۰۰","۱۱:۰۰","۱۴:۰۰","۱۵:۰۰","۱۶:۰۰","۱۷:۰۰","۱۸:۰۰","۱۹:۰۰","۲۰:۰۰"];
  el.innerHTML=`<label>ساعت</label><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-top:8px">
    ${times.map(t=>`<button class="btn secondary" style="padding:10px;font-size:13px" onclick="selectPersianTime(${idx},'${t}')">${t}</button>`).join("")}
  </div>
  <p class="muted" style="margin-top:10px">📅 <b>${st.selected.jd} ${JALALI_MONTHS[st.selected.jm-1]} ${st.selected.jy}</b>${st.time?` — ⏰ <b>${st.time}</b>`:""}</p>`;
}
function selectPersianDay(idx,d){const st=window["_pcal_"+idx];st.selected={jy:st.jy,jm:st.jm,jd:d};st.time=null;renderPersianCalendar(idx);renderPersianTimes(idx)}
function selectPersianTime(idx,t){const st=window["_pcal_"+idx];st.time=t;renderPersianTimes(idx)}
function pcalPrev(idx){const st=window["_pcal_"+idx];st.jm--;if(st.jm<1){st.jm=12;st.jy--}st.selected=null;st.time=null;renderPersianCalendar(idx);renderPersianTimes(idx)}
function pcalNext(idx){const st=window["_pcal_"+idx];st.jm++;if(st.jm>12){st.jm=1;st.jy++}st.selected=null;st.time=null;renderPersianCalendar(idx);renderPersianTimes(idx)}
