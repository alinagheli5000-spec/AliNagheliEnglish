<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheliEnglish</title>

<style>
*{box-sizing:border-box}
:root{
  --purple:#6d28d9;
  --purple2:#8b5cf6;
  --light:#f5f3ff;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --green:#16a34a;
  --red:#dc2626;
}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#f5f3ff,#ede9fe);
  color:var(--text);
}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}
.login-box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:30px;
  padding:28px 22px;
  box-shadow:0 20px 60px #4c1d9540;
  text-align:center;
}
.logo{
  font-size:30px;
  font-weight:900;
  color:#6d28d9;
  letter-spacing:.5px;
  text-shadow:
    1px 1px 0 #ddd,
    2px 2px 0 #c4b5fd,
    4px 4px 10px #6d28d955;
  margin-bottom:8px;
}
.subtitle{color:#777;margin-bottom:25px}
.login-buttons{
  display:flex;
  flex-direction:column;
  gap:13px;
}
.login-btn{
  border:0;
  border-radius:18px;
  padding:17px;
  font-size:16px;
  font-weight:bold;
  color:white;
  transition:.2s;
}
.login-btn:hover{transform:translateY(-2px)}
.admin{background:linear-gradient(135deg,#312e81,#6d28d9)}
.student{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.vip{background:#d1d5db;color:#6b7280;cursor:not-allowed}
.login-form{
  margin-top:18px;
  display:none;
}
.login-form input{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:13px;
  outline:none;
}
.login-form input:focus{border-color:#8b5cf6}
.form-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.form-actions button{
  flex:1;
  border:0;
  padding:13px;
  border-radius:12px;
}
.enter{background:#6d28d9;color:#fff}
.back{background:#eee}
.error{
  color:#dc2626;
  background:#fef2f2;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
  font-size:13px;
}

/* APP */
#app{
  min-height:100vh;
  padding-bottom:82px;
}
.topbar{
  background:linear-gradient(135deg,#5b21b6,#7c3aed);
  color:white;
  padding:18px 18px 25px;
  border-radius:0 0 28px 28px;
}
.topbar-title{
  font-size:23px;
  font-weight:bold;
}
.topbar-user{font-size:13px;opacity:.85;margin-top:5px}
.page{
  padding:18px 15px;
  max-width:900px;
  margin:auto;
}
.section-title{
  font-size:19px;
  font-weight:bold;
  margin:12px 0;
}
.card{
  background:white;
  border-radius:20px;
  padding:18px;
  box-shadow:0 5px 22px #0000000b;
  margin-bottom:14px;
}
.word-card{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px #6d28d940;
}
.word{
  font-size:27px;
  font-weight:bold;
  direction:ltr;
  text-align:left;
}
.word-meaning{margin-top:7px}
.speak{
  border:0;
  background:#ffffff30;
  color:white;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:20px;
  margin-top:12px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.stat{
  background:white;
  border-radius:17px;
  padding:15px 7px;
  text-align:center;
  box-shadow:0 4px 15px #00000008;
}
.stat b{display:block;font-size:21px;color:#6d28d9}
.stat span{font-size:11px;color:#777}
.activity{
  border-right:4px solid #8b5cf6;
  background:#fafafa;
  padding:12px;
  border-radius:12px;
  margin:7px 0;
}

/* COURSES */
.course-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.course{
  background:white;
  border:0;
  border-radius:20px;
  padding:20px 10px;
  min-height:110px;
  box-shadow:0 5px 18px #0000000a;
  font-weight:bold;
}
.course span{
  display:block;
  font-size:29px;
  margin-bottom:7px;
}
.lesson{
  background:white;
  border-radius:18px;
  padding:17px;
  margin-bottom:10px;
  border:1px solid #eee;
}
.lesson button{
  width:100%;
  border:0;
  background:none;
  text-align:right;
  font-size:16px;
  font-weight:bold;
}
.lesson small{display:block;color:#777;margin-top:6px}
.content-title{
  font-size:21px;
  font-weight:bold;
  color:#6d28d9;
  margin-bottom:15px;
}
.example{
  direction:ltr;
  text-align:left;
  background:#f5f3ff;
  border-right:4px solid #7c3aed;
  padding:13px;
  margin:10px 0;
  border-radius:10px;
}
.word-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.word-item{
  background:#fafafa;
  border-radius:13px;
  padding:12px;
  border:1px solid #eee;
  cursor:pointer;
}
.word-item b{
  direction:ltr;
  display:block;
  color:#6d28d9;
}
.word-item small{color:#555}

/* QUIZ */
.quiz-question{
  font-size:18px;
  font-weight:bold;
  direction:ltr;
  text-align:left;
  margin-bottom:15px;
}
.option{
  display:block;
  width:100%;
  text-align:left;
  direction:ltr;
  border:1px solid #ddd;
  background:white;
  border-radius:13px;
  padding:13px;
  margin:8px 0;
}
.option.correct{background:#dcfce7;border-color:#16a34a}
.option.wrong{background:#fee2e2;border-color:#dc2626}
.feedback{
  text-align:center;
  font-size:30px;
  min-height:42px;
}
.score-box{
  text-align:center;
  padding:20px;
  background:#f5f3ff;
  border-radius:18px;
}
.score-box strong{
  display:block;
  font-size:38px;
  color:#6d28d9;
}
.history-table{
  width:100%;
  border-collapse:collapse;
}
.history-table th,.history-table td{
  padding:10px 5px;
  border-bottom:1px solid #eee;
  text-align:center;
  font-size:13px;
}

/* PROFILE */
.profile-head{text-align:center}
.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#6d28d9,#a855f7);
  color:white;
  font-size:35px;
}
.info-row{
  display:flex;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid #eee;
}

/* TEACHER */
.teacher{text-align:center}
.teacher-name{
  font-size:27px;
  font-weight:bold;
  color:#6d28d9;
}
.teacher-bio{
  line-height:2;
  text-align:right;
}
.phone{
  display:inline-block;
  margin-top:10px;
  padding:12px 20px;
  background:#16a34a;
  color:white;
  border-radius:14px;
  text-decoration:none;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  box-shadow:0 -5px 25px #00000015;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:100;
}
.nav-btn{
  border:0;
  background:white;
  color:#777;
  font-size:11px;
}
.nav-btn span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}
.nav-btn.active{
  color:#6d28d9;
  font-weight:bold;
}

/* BACK */
.back-page{
  border:0;
  background:#ede9fe;
  color:#6d28d9;
  border-radius:12px;
  padding:10px 15px;
  margin-bottom:13px;
}

/* DESKTOP */
@media(min-width:700px){
 .course-grid{grid-template-columns:repeat(4,1fr)}
 .word-list{grid-template-columns:repeat(4,1fr)}
 .page{padding-left:25px;padding-right:25px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <div class="logo">AliNagheliEnglish</div>
    <div class="subtitle">سامانه آموزش زبان انگلیسی</div>

    <div id="loginButtons" class="login-buttons">
      <button class="login-btn admin" onclick="showLogin('admin')">👨‍💼 ورود مدیر</button>
      <button class="login-btn student" onclick="showLogin('student')">🎓 ورود زبان‌آموز عادی</button>
      <button class="login-btn vip" disabled>⭐ ورود زبان‌آموز VIP</button>
    </div>

    <div id="loginForm" class="login-form">
      <input id="phoneInput" type="text" inputmode="numeric" placeholder="شماره تلفن">
      <input id="passwordInput" type="password" placeholder="رمز عبور">
      <div class="form-actions">
        <button class="enter" onclick="login()">ورود</button>
        <button class="back" onclick="hideLogin()">بازگشت</button>
      </div>
      <div id="loginError"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-title" id="topTitle">خانه</div>
    <div class="topbar-user" id="topUser"></div>
  </header>

  <main id="page" class="page"></main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="home" onclick="navigate('home')">
      <span>🏠</span>خانه
    </button>
    <button class="nav-btn" data-page="courses" onclick="navigate('courses')">
      <span>📚</span>دوره‌ها
    </button>
    <button class="nav-btn" data-page="level" onclick="navigate('level')">
      <span>🎯</span>تعیین سطح
    </button>
    <button class="nav-btn" data-page="profile" onclick="navigate('profile')">
      <span>👤</span>پروفایل
    </button>
    <button class="nav-btn" data-page="teacher" onclick="navigate('teacher')">
      <span>👨‍🏫</span>استاد
    </button>
  </nav>
</div>

<script>
/* =========================
   SUPABASE
========================= */
const SUPABASE_URL="https://kapzyedzjecnfxevjisq.supabase.co";
const SUPABASE_KEY="sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeM";

let currentUser=null;
let loginType=null;
let currentPage="home";

async function sb(path,options={}){
  const headers={
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    ...(options.headers||{})
  };
  const res=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    ...options,
    headers
  });
  if(!res.ok){
    const text=await res.text();
    throw new Error(text||"Supabase error");
  }
  const text=await res.text();
  return text?JSON.parse(text):[];
}

function showLogin(type){
  loginType=type;
  document.getElementById("loginButtons").style.display="none";
  document.getElementById("loginForm").style.display="block";
  document.getElementById("phoneInput").focus();
  document.getElementById("loginError").innerHTML="";
}

function hideLogin(){
  document.getElementById("loginButtons").style.display="flex";
  document.getElementById("loginForm").style.display="none";
  document.getElementById("loginError").innerHTML="";
}

async function login(){
  const phone=document.getElementById("phoneInput").value.trim();
  const password=document.getElementById("passwordInput").value;

  if(!phone||!password){
    showError("لطفاً شماره تلفن و رمز عبور را وارد کنید.");
    return;
  }

  document.getElementById("loginError").innerHTML=
    '<div class="error">⏳ در حال بررسی اطلاعات...</div>';

  try{
    if(loginType==="student"){
      /*
       * دانش‌آموز با شماره تلفن وارد می‌شود.
       * برای Auth ایمیل داخلی ساخته می‌شود و دانش‌آموز هرگز
       * لازم نیست ایمیل را ببیند.
       */
      const students=await sb(
        "students?select=*&phone=eq."+encodeURIComponent(phone)+"&limit=1"
      );

      if(!students.length){
        showError("این شماره در سامانه پیدا نشد.");
        return;
      }

      const student=students[0];

      if(student.status!=="registered"){
        showError("ثبت‌نام این زبان‌آموز هنوز تأیید نشده است.");
        return;
      }

      const email=student.auth_user_id
        ? phone+"@alinagheli.com"
        : phone+"@alinagheli.com";

      const authRes=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:email,
          password:password
        })
      });

      const authData=await authRes.json();

      if(!authRes.ok){
        showError("شماره تلفن یا رمز عبور اشتباه است.");
        return;
      }

      currentUser={
        ...student,
        access_token:authData.access_token,
        refresh_token:authData.refresh_token
      };

      localStorage.setItem("ali_session",JSON.stringify(currentUser));
      openApp();
    }else{
      /*
       * ورود مدیر:
       * اگر جدول admins در پروژه وجود داشته باشد، از آن استفاده می‌شود.
       * در غیر این صورت اطلاعات مدیر از Auth بررسی می‌شود.
       */
      const email=phone.includes("@")
        ? phone
        : phone+"@alinagheli.com";

      const authRes=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({email,password})
      });

      const authData=await authRes.json();

      if(!authRes.ok){
        showError("اطلاعات ورود مدیر صحیح نیست.");
        return;
      }

      currentUser={
        first_name:"مدیر",
        last_name:"AliNagheli",
        phone:phone,
        role:"admin",
        access_token:authData.access_token
      };

      localStorage.setItem("ali_session",JSON.stringify(currentUser));
      openApp();
    }
  }catch(err){
    console.error(err);
    showError("خطا در اتصال به سامانه. تنظیمات Supabase را بررسی کنید.");
  }
}

function showError(msg){
  document.getElementById("loginError").innerHTML=
    '<div class="error">❌ '+msg+'</div>';
}

/* =========================
   APP NAVIGATION
========================= */

function openApp(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  const name=currentUser.first_name
    ? currentUser.first_name+" "+(currentUser.last_name||"")
    : "مدیر";

  document.getElementById("topUser").textContent="خوش آمدید "+name;

  navigate("home");
}

function navigate(page){
  currentPage=page;

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  const titles={
    home:"خانه",
    courses:"دوره‌های آموزشی",
    level:"تعیین سطح",
    profile:"پروفایل",
    teacher:"معرفی استاد"
  };

  document.getElementById("topTitle").textContent=titles[page]||"AliNagheliEnglish";

  if(page==="home")renderHome();
  if(page==="courses")renderCourses();
  if(page==="level")renderLevel();
  if(page==="profile")renderProfile();
  if(page==="teacher")renderTeacher();

  window.scrollTo(0,0);
}

/* =========================
   HOME
========================= */

const dailyWords=[
 ["Welcome","خوش آمدید"],
 ["School","مدرسه"],
 ["Teacher","معلم"],
 ["Student","دانش‌آموز"],
 ["Book","کتاب"],
 ["Beautiful","زیبا"],
 ["Learn","یاد گرفتن"]
];

function renderHome(){
  const word=dailyWords[new Date().getDate()%dailyWords.length];

  document.getElementById("page").innerHTML=`
    <div class="section-title">✨ لغت روزانه</div>

    <div class="word-card">
      <div class="word">${word[0]}</div>
      <div class="word-meaning">${word[1]}</div>
      <button class="speak" onclick="speakWord('${word[0]}')">🔊</button>
    </div>

    <div class="section-title">📊 رکوردهای من</div>

    <div class="stats">
      <div class="stat">
        <b>${getExamCount()}</b>
        <span>آزمون‌ها</span>
      </div>
      <div class="stat">
        <b>${getBestScore()}%</b>
        <span>بهترین نمره</span>
      </div>
      <div class="stat">
        <b>${currentUser.level||"A1"}</b>
        <span>سطح</span>
      </div>
    </div>

    <div class="section-title">🕘 تاریخچه فعالیت</div>

    <div class="card">
      <div class="activity">📚 ورود به سامانه آموزشی</div>
      <div class="activity">🎯 آماده یادگیری و پیشرفت</div>
      <div class="activity">⭐ می‌توانید آزمون‌ها را چندین بار تکرار کنید</div>
    </div>

    <div class="section-title">🚀 ادامه یادگیری</div>
    <div class="card">
      <b>دوره هفتم</b>
      <p>مقدمه + ۸ درس کامل زبان انگلیسی</p>
      <button class="login-btn student" onclick="openGrade(7)">
        ورود به دوره هفتم
      </button>
    </div>
  `;
}

/* =========================
   COURSES
========================= */

function renderCourses(){
  let html=`
    <div class="section-title">📚 دوره‌های آموزشی</div>
    <p>پایه مورد نظر خود را انتخاب کنید.</p>
    <div class="course-grid">
  `;

  for(let i=7;i<=12;i++){
    html+=`
      <button class="course" onclick="openGrade(${i})">
        <span>${i===12?"🎓":"📖"}</span>
        پایه ${i}
        <small>${i===7?"دوره کامل آماده است":"به‌زودی"}</small>
      </button>
    `;
  }

  html+=`</div>`;
  document.getElementById("page").innerHTML=html;
}

function openGrade(grade){
  if(grade!==7){
    document.getElementById("page").innerHTML=`
      <button class="back-page" onclick="navigate('courses')">← بازگشت</button>
      <div class="card" style="text-align:center">
        <div style="font-size:50px">🚧</div>
        <h2>پایه ${grade}</h2>
        <p>محتوای این پایه به‌زودی اضافه می‌شود.</p>
      </div>
    `;
    return;
  }

  renderGrade7();
}

function renderGrade7(){
  const lessons=[
    ["مقدمه","حروف بزرگ و کوچک + لغات مدرسه"],
    ["درس ۱","سلام، احوال‌پرسی، معرفی خود و Spell"],
    ["درس ۲","Who و Nice to meet you"],
    ["درس ۳","سن، ماه‌ها، روزها و اعداد"],
    ["درس ۴","سن و شغل افراد"],
    ["درس ۵","توصیف افراد، لباس‌ها و رنگ‌ها"],
    ["درس ۶","مکان‌ها و کارهایی که افراد انجام می‌دهند"],
    ["درس ۷","شماره تلفن، آدرس و زمان"],
    ["درس ۸","غذا، میوه، نوشیدنی و I'd like"]
  ];

  let html=`
    <button class="back-page" onclick="navigate('courses')">← بازگشت به دوره‌ها</button>
    <div class="section-title">📘 دوره زبان انگلیسی پایه هفتم</div>
    <div class="card">
      <b>محتوای دوره</b>
      <p>مقدمه و ۸ درس آموزشی شامل گرامر و لغات</p>
    </div>
  `;

  lessons.forEach((l,i)=>{
    html+=`
      <div class="lesson">
        <button onclick="openLesson7(${i})">
          ${i===0?"📌":"📖"} ${l[0]}
          <small>${l[1]}</small>
        </button>
      </div>
    `;
  });

  html+=`
    <div class="card">
      <h3>🏆 آزمون جامع پایه هفتم</h3>
      <p>۵۰ سؤال ترکیبی گرامر و لغات</p>
      <button class="login-btn student" onclick="startGrade7Exam()">
        شروع آزمون جامع
      </button>
    </div>
  `;

  document.getElementById("page").innerHTML=html;
}

function openLesson7(index){
  if(index===0){
    renderIntro();
    return;
  }

  if(index===1||index===2){
    renderLessons12(index);
    return;
  }

  if(index===3){
    renderLesson3();
    return;
  }

function wordItem(w){
  const safe=w[0].replace(/'/g,"&#39;");
  return `
    <div class="word-item" onclick="speakWord('${safe}')">
      <b>${w[0]} 🔊</b>
      <small>${w[1]}</small>
    </div>
  `;
}

function speakWord(word){
  if(!("speechSynthesis" in window)){
    alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
    return;
  }

  speechSynthesis.cancel();

  const utter=new SpeechSynthesisUtterance(word);
  utter.lang="en-US";
  utter.rate=.8;
  utter.pitch=1;

  speechSynthesis.speak(utter);
}

const examQuestions=[
 ["What is your name?","My name is Ali.","I name Ali.","Ali my name.","Name Ali."],
 ["Who is that boy?","He is Ali.","She is Ali.","It Ali.","They Ali."],
 ["How old are you?","I'm thirteen.","I'm teacher.","I'm fine.","I'm Ali."],

 ["He is wearing a black ___.","suit","kitchen","teacher","apple"],
 ["She is ___ in the kitchen.","cooking","cook","cooks","cooked"],
 ["My birthday is ___ May 10th.","on","in","at","to"],
 ["___ is that man?","Who","What old","Where","When"],
 ["How ___ are you?","old","many","much","name"],
 ["My father is ___ engineer.","an","a","the","on"],
 ["She is wearing a ___ dress.","red","kitchen","teacher","father"],
 ["This is my ___.","book","cooking","tall","Monday"]
];

let examState={
  questions:[],
  index:0,
  score:0,
  answered:false
};

function startGrade7Exam(){
  examState={
    questions:shuffle([...examQuestions,...examQuestions,...examQuestions]).slice(0,50),
    index:0,
    score:0,
    answered:false
  };

  renderExamQuestion();
}

function renderExamQuestion(){
  const q=examState.questions[examState.index];
  const options=[q[1],q[2],q[3],q[4]];
  const correct=q[1];

  document.getElementById("page").innerHTML=`
    <button class="back-page" onclick="renderGrade7()">← خروج از آزمون</button>

    <div class="card">
      <div style="text-align:center;color:#777">
        سؤال ${examState.index+1} از ${examState.questions.length}
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="quiz-question">${q[0]}</div>

      <div id="options">
        ${options.map((o,i)=>`
          <button class="option"
            onclick="answerExam(this,'${escapeQuotes(o)}','${escapeQuotes(correct)}')">
            ${String.fromCharCode(65+i)}. ${o}
          </button>
        `).join("")}
      </div>
    </div>
  `;
}

function escapeQuotes(s){
  return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function answerExam(button,answer,correct){
  if(examState.answered)return;

  examState.answered=true;

  const buttons=document.querySelectorAll(".option");

  buttons.forEach(b=>{
    if(b.textContent.trim().slice(3)===correct){
      b.classList.add("correct");
    }
  });

  if(answer===correct){
    examState.score++;
    button.classList.add("correct");
    document.getElementById("feedback").innerHTML="✅ 😄";
  }else{
    button.classList.add("wrong");
    document.getElementById("feedback").innerHTML="❌ 😕";
  }

  setTimeout(()=>{
    examState.index++;

    if(examState.index>=examState.questions.length){
      finishExam();
    }else{
      examState.answered=false;
      renderExamQuestion();
    }
  },1000);
}

function finishExam(){
  const score=Math.round(
    examState.score/examState.questions.length*100
  );

  saveExamScore(score);

  document.getElementById("page").innerHTML=`
    <div class="card score-box">
      <div style="font-size:55px">${score>=70?"🎉":"💪"}</div>
      <h2>آزمون به پایان رسید</h2>
      <strong>${score}%</strong>
      <p>
        ${examState.score} پاسخ صحیح از
        ${examState.questions.length} سؤال
      </p>

      <button class="login-btn student"
        onclick="startGrade7Exam()">
        🔄 شرکت دوباره در آزمون
      </button>

      <button class="login-btn admin"
        onclick="showExamHistory()">
        📊 مشاهده نمرات قبلی
      </button>

      <button class="login-btn"
        style="background:#eee;color:#333"
        onclick="renderGrade7()">
        بازگشت به دوره هفتم
      </button>
    </div>
  `;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function getExamHistory(){
  return JSON.parse(
    localStorage.getItem("ali_exam_history")||"[]"
  );
}

function saveExamScore(score){
  const history=getExamHistory();

  history.push({
    score,
    date:new Date().toLocaleString("fa-IR")
  });

  localStorage.setItem(
    "ali_exam_history",
    JSON.stringify(history)
  );
}

function getExamCount(){
  return getExamHistory().length;
}

function getBestScore(){
  const h=getExamHistory();
  if(!h.length)return 0;
  return Math.max(...h.map(x=>x.score));
}

function showExamHistory(){
  const history=getExamHistory();

/* =========================
   LEVEL TEST
========================= */

const levelQuestions=[
 ["Choose the correct answer: I ___ a teacher.","am","is","are","be"],
 ["She ___ from Iran.","is","am","are","be"],
 ["They ___ students.","are","is","am","be"],
 ["He ___ English every day.","studies","study","studying","studied"],
 ["I ___ coffee every morning.","drink","drinks","drinking","drank"],
 ["There ___ a book on the desk.","is","are","am","be"],
 ["There ___ two chairs.","are","is","am","be"],
 ["I have ___ apple.","an","a","the","some"],
 ["She is ___ than her sister.","taller","tall","tallest","more tall"],
 ["I went to school ___ Monday.","on","in","at","to"],
 ["We have lived here ___ 2020.","since","for","from","at"],
 ["If I ___ time, I will call you.","have","had","will have","having"],
 ["She has ___ her homework.","finished","finish","finishing","finishes"],
 ["I ___ TV when he called.","was watching","watch","watched","am watching"],
 ["This book is ___ than that one.","more interesting","interesting","most interesting","interest"],
 ["He said that he ___ tired.","was","is","were","be"],
 ["By next year, I ___ English for five years.","will have studied","study","studied","am studying"],
 ["If I had known, I ___ you.","would have told","tell","will tell","told"],
 ["The report ___ yesterday.","was written","wrote","is writing","writes"],
 ["Despite ___ tired, she continued working.","being","be","was","been"],
 ["Had I known, I ___ earlier.","would have come","will come","come","came"],
 ["It is essential that he ___ on time.","be","is","was","being"],
 ["No sooner had he arrived ___ it started raining.","than","when","then","that"],
 ["She speaks English ___ than I do.","more fluently","more fluent","fluent","most fluent"],
 ["The project, ___ was difficult, was completed.","which","who","where","what"],
 ["I wish I ___ more time.","had","have","will have","having"],
 ["He denied ___ the money.","taking","take","to take","took"],
 ["The teacher suggested that we ___ earlier.","leave","left","leaving","to leave"],
 ["Not only ___ late, but he also forgot his book.","was he","he was","is he","he is"],
 ["Were I you, I ___ the offer.","would accept","accept","will accept","accepted"]
];

let levelState={
  index:0,
  score:0
};

function renderLevel(){
  levelState={index:0,score:0};
  renderLevelQuestion();
}

function renderLevelQuestion(){
  const q=levelQuestions[levelState.index];

  document.getElementById("page").innerHTML=`
    <div class="card">
      <div class="section-title">🎯 آزمون تعیین سطح</div>
      <p style="color:#777">
        سؤال ${levelState.index+1} از ${levelQuestions.length}
      </p>

      <div class="quiz-question">${q[0]}</div>

      ${q.slice(1).map((o,i)=>`
        <button class="option"
          onclick="answerLevel(this,${i})">
          ${String.fromCharCode(65+i)}. ${o}
        </button>
      `).join("")}
    </div>
  `;
}

function answerLevel(btn,index){
  const q=levelQuestions[levelState.index];

  if(index===0){
    levelState.score++;
    btn.classList.add("correct");
  }else{
    btn.classList.add("wrong");
  }

  document.querySelectorAll(".option").forEach((b,i)=>{
    if(i===0)b.classList.add("correct");
  });

  setTimeout(()=>{
    levelState.index++;

    if(levelState.index>=levelQuestions.length){
      finishLevel();
    }else{
      renderLevelQuestion();
    }
  },600);
}

function finishLevel(){
  const score=Math.round(
    levelState.score/levelQuestions.length*100
  );

  let level;

  if(score<30)level="Beginner / مبتدی";
  else if(score<50)level="Elementary / ابتدایی";
  else if(score<65)level="Pre-Intermediate / متوسط رو به پایین";
  else if(score<80)level="Intermediate / متوسط";
  else if(score<90)level="Upper-Intermediate / متوسط رو به بالا";
  else level="Advanced / پیشرفته";

  document.getElementById("page").innerHTML=`
    <div class="card score-box">
      <div style="font-size:55px">🎯</div>
      <h2>نتیجه تعیین سطح</h2>
      <strong>${score}%</strong>
      <h3>${level}</h3>
      <p>${levelState.score} پاسخ صحیح از ۳۰ سؤال</p>

      <button class="login-btn student"
        onclick="renderLevel()">
        🔄 انجام دوباره تعیین سطح
      </button>
    </div>
  `;
}
