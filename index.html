function esc(v){
return String(v??"").replace(/[&<>"']/g,x=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[x]));
}

function speak(word){
try{
if(!("speechSynthesis" in window)){
alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
return;
}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(String(word));
u.lang="en-US";
u.rate=.78;
u.pitch=1;
u.volume=1;
speechSynthesis.resume();
speechSynthesis.speak(u);
}catch(e){
alert("پخش تلفظ در این مرورگر امکان‌پذیر نیست.");
}
}

async function registerStudent(){

const first=document.getElementById("rFirst").value.trim();
const last=document.getElementById("rLast").value.trim();
const phone=document.getElementById("rPhone").value.trim();
const password=document.getElementById("rPass").value;
const level=document.getElementById("rLevel").value.trim();

if(!first||!last||!phone||!password){
alert("همه موارد را تکمیل کنید.");
return;
}

if(password.length<6){
alert("رمز عبور باید حداقل ۶ کاراکتر باشد.");
return;
}

if(!sb){
alert("اتصال Supabase در این نسخه تنظیم نشده است.");
return;
}

const email=phoneEmail(phone);

const r=await sb.auth.signUp({
email,
password,
options:{
data:{first_name:first,last_name:last,phone,level}
}
});

if(r.error){
alert(r.error.message);
return;
}

if(r.data.user){

const ins=await sb.from("students").insert({
first_name:first,
last_name:last,
phone,
level,
status:"waiting",
auth_user_id:r.data.user.id,
password_created:true,
login_email:email
});

if(ins.error){
alert(ins.error.message);
return;
}
}

await sb.auth.signOut();

alert("ثبت‌نام انجام شد و پس از تأیید مدیر امکان ورود فعال می‌شود.");
showLogin();
}

async function studentLogin(){

const phone=document.getElementById("loginPhone").value.trim();
const password=document.getElementById("loginPassword").value;

if(!phone||!password){
alert("شماره تلفن و رمز عبور را وارد کنید.");
return;
}

if(!sb){
alert("اتصال Supabase تنظیم نشده است.");
return;
}

/*
  مهم:
  ایمیل ورود از login_email جدول خوانده می‌شود.
  بنابراین حساب‌های قدیمی که login_email متفاوت دارند
  هم با همان ایمیل Auth واقعی خودشان امتحان می‌شوند.
*/

const q=await sb
.from("students")
.select("*")
.eq("phone",phone)
.maybeSingle();

if(q.error){
alert("خطا در دریافت اطلاعات زبان‌آموز: "+q.error.message);
return;
}

const row=q.data;

if(!row){
alert("این شماره تلفن در سامانه ثبت نشده است.");
return;
}

if(row.status==="rejected"){
alert("ثبت‌نام شما توسط مدیر رد شده است.");
return;
}

if(row.status!=="registered"&&row.status!=="approved"){
alert("حساب شما هنوز توسط مدیر تأیید نشده است.");
return;
}

const email=(row.login_email||phoneEmail(phone)).trim();

const r=await sb.auth.signInWithPassword({
email,
password
});

if(r.error){
alert("رمز عبور واردشده صحیح نیست یا برای این حساب هنوز رمز معتبر در Supabase ثبت نشده است.");
return;
}

state.student=row;
renderStudentHome();
}

function lessonSection(n){
document.querySelectorAll(".section").forEach((x,i)=>x.classList.toggle("active",i===n));
document.querySelectorAll(".lesson-tab").forEach((x,i)=>x.classList.toggle("active",i===n));
if(n===2)startLessonQuiz();
}

function buildQuestions(lessonIndex){
const key="Lesson "+(lessonIndex+1);
const words=vocabulary[key]||[];
let qs=[];

words.forEach((w,i)=>{
const wrong1=words[(i+1)%words.length][1];
const wrong2=words[(i+2)%words.length][1];

qs.push({
q:`معنی "${w[0]}" چیست؟`,
options:[w[1],wrong1,wrong2],
answer:0
});

qs.push({
q:`کدام گزینه واژه انگلیسی "${w[1]}" است؟`,
options:[w[0],words[(i+1)%words.length][0],words[(i+2)%words.length][0]],
answer:0
});
});

const content=sampleContent[key]||[];

content.forEach(x=>{
qs.push({
q:`کدام گزینه با ساختار "${x[1]}" هماهنگ است؟`,
options:[x[2],"She are student.","They is happy."],
answer:0
});
});

return qs.slice(0,15);
}

function startLessonQuiz(){
state.quiz={
questions:buildQuestions(state.lesson),
index:0,
correct:0,
wrong:0,
type:"lesson",
title:`پایه ${state.grade} - ${schoolBooks[state.grade].lessons[state.lesson]}`
};
renderQuiz("lessonQuiz");
}

function renderQuiz(target){

const q=state.quiz.questions[state.quiz.index];

if(!q){
finishQuiz(target);
return;
}

document.getElementById(target).innerHTML=`
<div class="quiz">
<b>سؤال ${state.quiz.index+1} از ${state.quiz.questions.length}</b>
<div class="progress"><i style="width:${state.quiz.index/state.quiz.questions.length*100}%"></i></div>
<div class="question">${esc(q.q)}</div>

${q.options.map((o,i)=>`
<button class="option" onclick="answer(${i},'${target}')">${esc(o)}</button>`).join("")}

<div id="feedback"></div>
</div>`;
}

function answer(index,target){

const q=state.quiz.questions[state.quiz.index];
const options=document.querySelectorAll(".option");

options.forEach(x=>x.disabled=true);

const correct=index===q.answer;

if(correct){
state.quiz.correct++;
options[index].classList.add("correct");
showFeedback(true);
}else{
state.quiz.wrong++;
options[index].classList.add("wrong");
options[q.answer].classList.add("correct");
showFeedback(false);
}

setTimeout(()=>{
state.quiz.index++;
renderQuiz(target);
},1100);
}

function showFeedback(ok){
const f=document.getElementById("feedback");
if(!f)return;
f.className="feedback "+(ok?"ok":"bad");
f.innerHTML=ok?"✅ 😊 آفرین! پاسخ درست است.":"❌ 😢 پاسخ اشتباه است.";
}

function finishQuiz(target){

const total=state.quiz.questions.length;
const percent=Math.round(state.quiz.correct/total*100);

records.push({

}

function contestQuestions(group){

const grade=group<6?group+7:null;
let source=[];

if(grade){
source=buildQuestions(0).concat(buildQuestions(1),buildQuestions(2));
}else{
source=buildQuestions(0).concat(buildQuestions(1));
}

source=source.slice(0,20);

while(source.length<20){
source.push({
q:`سؤال تمرینی شماره ${source.length+1}: کدام گزینه صحیح است؟`,
options:["English","School","Teacher"],
answer:0
});
}

return source;
}

function startContest(group){

state.quiz={
questions:contestQuestions(group),
index:0,
correct:0,
wrong:0,
type:"contest",
group,
title:contestNames[group]
};

renderContest();
}

function renderContest(){

const q=state.quiz.questions[state.quiz.index];

if(!q){
finishContest();
return;
}

document.body.innerHTML=`
${header("🏆 "+state.quiz.title)}
<main class="container">
<div class="card">
<div class="quiz">
<b>سؤال ${state.quiz.index+1} از 20</b>

<div class="progress"><i style="width:${state.quiz.index/20*100}%"></i></div>
<div class="question">${esc(q.q)}</div>

${q.options.map((o,i)=>`
<button class="option" onclick="contestAnswer(${i})">${esc(o)}</button>`).join("")}

<div id="feedback"></div>
</div>
</div>
</main>`;
}

function contestAnswer(index){

const q=state.quiz.questions[state.quiz.index];
const opts=document.querySelectorAll(".option");

opts.forEach(x=>x.disabled=true);

const ok=index===q.answer;

if(ok){
state.quiz.correct++;
opts[index].classList.add("correct");
showFeedback(true);
}else{
state.quiz.wrong++;
opts[index].classList.add("wrong");
opts[q.answer].classList.add("correct");
showFeedback(false);
}

setTimeout(()=>{
state.quiz.index++;
renderContest();
},1100);
}

function finishContest(){

let raw=state.quiz.correct-(state.quiz.wrong*.25);
raw=Math.max(0,raw);
const percent=Math.round(raw/20*100);

contestRecords.push({
student:(state.student?.first_name||"")+" "+(state.student?.last_name||""),
phone:state.student?.phone||"",
group:state.quiz.group,
title:state.quiz.title,
score:percent,
date:new Date().toISOString()
});

saveLocal();

document.body.innerHTML=`
${header("نتیجه مسابقه")}

<div class="result-score">${percent}%</div>

<button class="btn full" onclick="go('contest')">بازگشت به مسابقات</button>
</div>
</main>`;
}

function rankings(){

const grouped={};

contestRecords.forEach(r=>{
if(!grouped[r.group])grouped[r.group]=[];
grouped[r.group].push(r);
});

let html="";

Object.keys(grouped).forEach(g=>{
const rows=grouped[g].sort((a,b)=>b.score-a.score).slice(0,3);

html+=`
<div class="card">
<h4>${contestNames[g]}</h4>
<div class="rank">
${rows.map((r,i)=>`
<div class="${i===0?"first":""}">
<div>${["🥇","🥈","🥉"][i]}</div>
<b>${esc(r.student||"دانش‌آموز")}</b>
<div>${r.score}%</div>
</div>`).join("")}
</div>
</div>`;
});

return html||`<div class="muted">هنوز رکوردی ثبت نشده است.</div>`;
}
