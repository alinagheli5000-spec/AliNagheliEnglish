<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#f5f3ff 0%,#ede9fe 100%);background-attachment:fixed;color:#171717;padding-bottom:96px;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;transition:all .2s ease}
button:active{transform:scale(.97)}
.header{background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 50%,#a855f7 100%);color:#fff;padding:16px;position:sticky;top:0;z-index:100;box-shadow:0 8px 32px rgba(109,40,217,.25);border-bottom:1px solid rgba(255,255,255,.1)}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.logoSub{font-size:10px;opacity:.85;letter-spacing:2px;margin-top:2px}
.container{max-width:1100px;margin:auto;padding:18px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 4px 24px rgba(109,40,217,.06),0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(221,214,254,.5)}
.hero{background:linear-gradient(135deg,#312e81 0%,#6d28d9 50%,#a855f7 100%);color:#fff;border-radius:28px;padding:32px;margin-bottom:18px;box-shadow:0 20px 50px rgba(109,40,217,.35);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 60%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.1),transparent 50%);pointer-events:none}
.hero3d:before{width:200px;height:200px;left:-60px;top:-80px;border-radius:50%;background:rgba(255,255,255,.08);position:absolute;content:""}
.hero3d:after{width:280px;height:280px;right:-120px;bottom:-160px;border-radius:50%;background:rgba(255,255,255,.06);position:absolute;content:""}
.hero h1{margin:8px 0;font-size:34px;text-shadow:0 4px 16px rgba(0,0,0,.25);letter-spacing:.5px}
.hero h2{margin:6px 0;font-weight:600}
.hero p{opacity:.9;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.item{background:#fff;border:1px solid rgba(221,214,254,.6);border-radius:22px;padding:20px;transition:all .3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;cursor:pointer}
.item:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ede9fe,transparent);opacity:0;transition:opacity .3s;pointer-events:none}
.item:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(109,40,217,.18);border-color:#a78bfa}
.item:hover:before{opacity:.5}
.item>*{position:relative;z-index:1}
.icon{font-size:44px;filter:drop-shadow(0 4px 8px rgba(109,40,217,.2))}
.item h3{margin:10px 0 6px;font-size:16px}
.item .muted{margin:6px 0 12px}
.btn{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:bold;font-size:14px;box-shadow:0 4px 14px rgba(109,40,217,.35);transition:all .2s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(109,40,217,.45)}
.btn.full{width:100%}
.secondary{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#5b21b6;box-shadow:0 4px 14px rgba(167,139,250,.25)}
.success{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 14px rgba(34,197,94,.3)}
.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(239,68,68,.3)}
.warning{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 14px rgba(245,158,11,.3)}
.login{min-height:100vh;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}
.login:before,.login:after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%)}
.login:before{width:500px;height:500px;top:-200px;left:-200px}
.login:after{width:600px;height:600px;bottom:-300px;right:-300px}
.loginCard{background:rgba(255,255,255,.98);width:min(440px,100%);padding:32px;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.4);position:relative;z-index:1;animation:slideUp .5s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
label{display:block;margin:12px 0 6px;font-weight:bold;font-size:13px;color:#4c1d95}
input,select,textarea{width:100%;border:2px solid #ede9fe;border-radius:14px;padding:13px;background:#faf9ff;outline:none;font-size:14px;transition:all .2s ease}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#7c3aed;background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.1)}
.tabs{display:flex;gap:8px;margin:20px 0;background:#f3f4f6;padding:5px;border-radius:16px}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:transparent;font-weight:bold;color:#777;transition:all .25s ease}
.tab.active{background:#fff;color:#6d28d9;box-shadow:0 2px 10px rgba(109,40,217,.15)}
.bottom{position:fixed;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.96);border-top:1px solid rgba(221,214,254,.8);z-index:200;box-shadow:0 -8px 30px rgba(109,40,217,.08);padding-bottom:env(safe-area-inset-bottom)}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex;padding:6px 4px}
.nav{flex:1;border:0;background:transparent;padding:8px 2px;color:#999;font-size:11px;border-radius:16px;transition:all .2s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav b{font-size:22px;margin-bottom:2px;transition:transform .2s ease;filter:grayscale(.4)}
.nav:hover{background:#f5f3ff;color:#6d28d9}
.nav.active{color:#6d28d9;font-weight:bold;background:#ede9fe}
.nav.active b{transform:scale(1.1);filter:grayscale(0)}
.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lesson{background:linear-gradient(135deg,#faf9ff,#f5f3ff);border:1px solid rgba(221,214,254,.8);border-radius:20px;padding:20px;transition:all .25s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.lesson:hover{background:linear-gradient(135deg,#f5f3ff,#ede9fe);transform:translateY(-3px);box-shadow:0 12px 30px rgba(109,40,217,.15);border-color:#c4b5fd}
.lessonNo{font-size:34px;background:linear-gradient(135deg,#6d28d9,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;font-weight:bold}
.tabs2{display:flex;gap:8px;overflow:auto;margin-bottom:18px;padding-bottom:4px}
.tabs2::-webkit-scrollbar{display:none}
.tab2{padding:12px 18px;border:0;border-radius:14px;background:#f3f4f6;white-space:nowrap;font-weight:bold;color:#666;font-size:13px;transition:all .2s ease}
.tab2.active{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(109,40,217,.35)}
.sec{display:none;animation:fadeIn .3s ease}
.sec.active{display:block}
.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.word{border:1px solid rgba(221,214,254,.8);background:linear-gradient(135deg,#fff,#faf9ff);border-radius:18px;padding:16px;text-align:center;cursor:pointer;transition:all .25s ease}
.word:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 24px rgba(109,40,217,.15);border-color:#a78bfa;background:linear-gradient(135deg,#faf5ff,#ede9fe)}
.en{direction:ltr;color:#6d28d9;font-weight:bold;font-size:15px}
.fa{font-size:12px;color:#777;margin-top:6px}
.grammar{border:1px solid rgba(221,214,254,.8);background:linear-gradient(135deg,#faf9ff,#fff);padding:20px;border-radius:20px;margin-bottom:14px;line-height:2;box-shadow:0 2px 12px rgba(109,40,217,.04)}
.grammar h3{margin:0 0 10px;color:#5b21b6;font-size:16px;display:flex;align-items:center;gap:8px}
.grammar h3:before{content:"📘";font-size:18px}
.example{direction:ltr;text-align:left;background:linear-gradient(135deg,#ede9fe,#f5f3ff);border-radius:12px;padding:14px;font-family:'Courier New',Arial,sans-serif;border-right:4px solid #7c3aed;font-size:14px;color:#4c1d95;font-weight:bold;margin:10px 0}
.option{display:block;width:100%;text-align:right;background:#fff;border:2px solid #ede9fe;border-radius:16px;padding:16px;margin:9px 0;font-size:15px;font-weight:600;color:#374151;transition:all .2s ease}
.option:hover:not(:disabled){border-color:#a78bfa;background:#faf5ff;transform:translateX(-4px)}
.option.correct{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#22c55e;color:#166534}
.option.wrong{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#ef4444;color:#991b1b}
.feedback{text-align:center;border-radius:16px;padding:16px;margin-top:12px;font-weight:bold;font-size:15px}
.ok{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534}
.bad{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b}
.progress{height:10px;background:#ede9fe;border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7,#ec4899);background-size:200% 100%;transition:width .4s ease;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
.score{font-size:64px;background:linear-gradient(135deg,#6d28d9,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:bold;text-align:center;line-height:1;margin:10px 0}
.adminRow{border:1px solid rgba(221,214,254,.6);border-radius:18px;padding:16px;margin:10px 0;background:#faf9ff}
.muted{font-size:12px;color:#888;line-height:1.9}
.teacher{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.teacherBox{background:linear-gradient(135deg,#faf5ff,#fff);border:1px solid rgba(233,213,255,.8);border-radius:26px;padding:24px;line-height:2}
.teacherAvatar{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#ede9fe,#ddd6fe);margin:auto;box-shadow:0 10px 30px rgba(109,40,217,.2);border:4px solid #fff}
.profileStat{background:linear-gradient(135deg,#faf9ff,#fff);border:1px solid rgba(233,213,255,.8);border-radius:20px;padding:18px;text-align:center}
.profileStat b{display:block;font-size:30px;background:linear-gradient(135deg,#6d28d9,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:6px}
.levelBar{height:14px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin:12px 0}
.levelBar i{display:block;height:100%;background:linear-gradient(90deg,#fff,#fbbf24,#f59e0b);background-size:200% 100%;transition:width .4s ease;animation:shimmer 2s linear infinite;box-shadow:0 0 12px rgba(251,191,36,.6)}
.badge{display:inline-block;padding:9px 14px;margin:5px;border-radius:22px;background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#5b21b6;font-size:12px;font-weight:bold}
.call{display:block;text-decoration:none;text-align:center;margin:14px 0;background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#fff!important;box-shadow:0 6px 20px rgba(34,197,94,.35)!important}
.request{background:linear-gradient(135deg,#f8f5ff,#faf9ff);border:1px solid rgba(221,214,254,.8);border-radius:22px;padding:18px;margin-top:18px}
.examRow{border:1px solid rgba(221,214,254,.6);border-radius:18px;padding:16px;margin:10px 0;background:linear-gradient(135deg,#faf9ff,#fff)}
.examScore{font-size:28px;font-weight:bold;background:linear-gradient(135deg,#6d28d9,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.resultBox{background:linear-gradient(135deg,#faf9ff,#f5f3ff);border:2px solid #ddd6fe;border-radius:24px;padding:24px}
.btnRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btnRow .btn{flex:1;min-width:90px;padding:11px 8px;font-size:12px;border-radius:12px}
.soundCard{background:linear-gradient(135deg,#fff,#faf9ff);border:1px solid rgba(221,214,254,.8);border-radius:18px;padding:16px;text-align:center;cursor:pointer;transition:all .25s ease}
.soundCard:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(109,40,217,.15);border-color:#a78bfa}
.soundLetter{font-size:32px;font-weight:bold;color:#6d28d9;direction:ltr}
.soundName{font-size:12px;color:#888;margin-top:4px;direction:ltr}
.soundEx{font-size:11px;color:#6d28d9;margin-top:6px;direction:ltr;font-weight:bold}
@media(min-width:900px){body{padding-bottom:24px}.bottom{top:auto;bottom:20px;left:50%;right:auto;transform:translateX(-50%);width:min(700px,calc(100% - 40px));height:74px;border-radius:22px;border:1px solid rgba(221,214,254,.8);box-shadow:0 12px 40px rgba(109,40,217,.2)}}
@media(max-width:600px){.container{padding:12px}.card{padding:18px;border-radius:20px}.hero{padding:24px;border-radius:24px}.hero h1{font-size:26px}.hero h2{font-size:17px}.icon{font-size:38px}.lessonGrid{grid-template-columns:1fr}.wordGrid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.score{font-size:52px}.loginCard{padding:24px}}
</style>
</head>

<script>
var words={};
var grammar={};

/* ==================== پایه هفتم ==================== */
grammar[0]=[
 ["Capital Letters","My name is Amirreza.","اسم من امیررضا است.","اول حرف جمله، اسم و فامیل باید بزرگ نوشته شود."],
 ["Mrs / Miss / Mr","Narges Ebrahimi / Amir Salehi","خانم نرگس ابراهیمی / آقای امیر صالحی","برای احترام: Mr برای آقایان، Miss برای خانم‌های مجرد، Mrs برای خانم‌های متأهل."],
 ["What (چه)","What's your name?","اسم تو چیست؟","برای پرسیدن نام افراد استفاده می‌شود."],
 ["How (چطور)","How are you?","حالت چطور است؟","برای احوالپرسی. همچنین در How do you spell this name? برای پرسیدن هجی کردن."]
];
grammar[1]=[
 ["Who (چه کسی)","Who is that man?","آن مرد کیست؟","برای پرسیدن در مورد اشخاص."],
 ["What / How","What's your sister's name? / How are you?","اسم خواهرت چیست؟ / حالت چطور است؟","What برای پرسیدن اسم، How برای احوالپرسی."],
 ["Contractions (مخفف‌ها)","I am = I'm / You are = You're / it is = it's / he is = he's / she is = she's","من هستم / تو هستی / آن است / او است / او است","برای سریع‌تر صحبت کردن استفاده می‌شود."],
 ["This / That","This is my friend Sina. / That is my classmate Sobhan.","این دوست من سینا است. / آن هم‌کلاسی من سبحان است.","This برای اشاره به نزدیک، That برای اشاره به دور."]
];
grammar[2]=[
 ["Capital Letters","My name is Amirreza.","اسم من امیررضا است.","اول حرف جمله و اسم بزرگ نوشته می‌شود."],
 ["When (چه وقتی)","When is your birthday?","تولدت کی است؟","برای پرسیدن زمان و تاریخ تولد."],
 ["On / In","on 13th Mehr / in Mehr","در سیزدهم مهر / در مهر","on برای روز، in برای ماه."],
 ["How old (چند سال)","How old are you? I am 13 years old.","چند سالته؟ من ۱۳ ساله هستم.","ساختار: فاعل + am/is/are + سن + years old"]
];
grammar[3]=[
 ["Possessive Adjectives","My / Your / His / Her / Its / Our / Their","مال من / مال تو / مال او(مذکر) / مال او(مؤنث) / مال آن / مال ما / مال آنها","صفت‌های ملکی قبل از اسم می‌آیند و مالکیت را نشان می‌دهند."],
 ["Possessive with 's","What's her uncle's name?","اسم عموی او چیست؟","با اضافه کردن 's به اسم، مالکیت نشان داده می‌شود."],
 ["What (شغل)","What's your aunt's job?","شغل خاله‌ات چیست؟","What در اینجا برای پرسیدن شغل استفاده می‌شود."],
 ["Yes/No Questions","Is that your father? Yes, he is. / No, he isn't.","آیا او پدرت است؟ بله / نه","با جابه‌جا کردن is/are سوالی می‌سازیم."]
];
grammar[4]=[
 ["Which one / Who","Who is Mr. Rafiei? / Which one is your mom?","آقای رفیعی کیست؟ / مادرت کدام یکی است؟","برای شناسایی افراد از روی ظاهر و لباس."],
 ["Wearing","She is wearing a red scarf.","او یک شال قرمز پوشیده است.","ساختار: am/is/are + wearing + لباس"],
 ["Yes/No with is/are","Is that your uncle? Yes / No","آیا او عمویت است؟ بله / نه","سوالی کردن با جابه‌جایی am/is/are."]
];
grammar[5]=[
 ["Present Continuous","My Dad is fixing the car.","پدرم در حال تعمیر ماشین است.","ساختار: am/is/are + فعل + ing برای کاری که همین الآن در جریان است."],
 ["Yes/No Question","Is your dad fixing the car? Yes, he is.","آیا پدرت در حال تعمیر ماشین است؟ بله.","برای سوالی کردن، am/is/are به اول جمله می‌آید."],
 ["What + doing","What is your Dad doing?","پدرت در حال انجام چه کاری است؟","برای پرسیدن از کار در حال انجام."],
 ["Where (کجا)","Where is your mom? She is in the kitchen.","مادرت کجاست؟ او در آشپزخانه است.","برای پرسیدن مکان."]
];
grammar[6]=[
 ["Going to (آینده)","I am going to visit my friend today.","من قصد دارم امروز دوستم را ببینم.","ساختار: am/is/are + going to + فعل برای بیان قصد و برنامه آینده."],
 ["Yes/No Question","Are you going to visit your friend today? Yes, I am.","آیا امروز قصد داری دوستت را ببینی؟ بله.","am/is/are به اول جمله می‌آید."],
 ["What time (چه ساعتی)","What time are you going to visit your friend?","چه ساعتی قصد داری دوستت را ببینی؟","برای پرسیدن ساعت."],
 ["What (آدرس/تلفن/ایمیل)","What's your address / phone number / email address?","آدرس / شماره تلفن / ایمیل شما چیست؟","What برای پرسیدن اطلاعات شخصی."],
 ["What time is it?","What time is it?","ساعت چند است؟","برای پرسیدن ساعت."]
];
grammar[7]=[
 ["What's your favorite...?","What's your favorite food / drink?","غذا / نوشیدنی مورد علاقه‌ات چیست؟","What + favorite برای پرسیدن مورد علاقه."],
 ["How about (چطور)","A: I am thirsty. B: How about some orange juice?","من تشنه‌ام. / با یک آب پرتقال چطور؟","برای پیشنهاد دادن استفاده می‌شود."],
 ["Let's (بیا)","Let's drink something.","بیا چیزی بنوشیم.","Let's = Let us برای پیشنهاد انجام کاری با هم."]
];

 ["فرم‌های ترکیبی","به ابتدای کلمات می‌چسبند و بخش اصلی کلمه محسوب می‌شوند و نمی‌شود حذف کرد.","به آن‌ها «پیشوندهای آفتاب‌پرست» می‌گویند چون شکل هجی خود را تغییر می‌دهند.","مثال: non- در nonsense - اگر non را برداریم، sense باقی می‌ماند که معنی دارد."],
 ["Present Perfect (حال کامل یا ماضی نقلی)","S + have/has + past participle (pp)","برای بیان عمل یا حالتی که در گذشته شروع شده و اثر آن تا زمان حال یا آینده ادامه دارد.","گذشته را به حال متصل می‌کند."],
 ["ساختار حال کامل","فاعل + have/has + قسمت سوم فعل + بقیه جمله","I have finished. / He has finished.","افعال باقاعده: ed / افعال بی‌قاعده: شکل سوم"],
 ["کاربرد ۱ حال کامل","عمل یا حالتی که در گذشته شروع شده و تا زمان حال ادامه دارد.","They have lived in this apartment for twelve years. / My brother has played volleyball since he was thirteen.",""],
 ["کاربرد ۲ حال کامل","عمل یا حالتی که در گذشته شروع شده و تمام شده ولی اثر آن تا زمان حال باقی مانده.","She has bought a new computer for three months. (She still has it.) / I have washed my clothes. (The clothes are clean.)",""],
 ["کاربرد ۳ حال کامل","عمل یا حالتی که در گذشته شروع شده و به صورت تجربه و دانش نزد ما باقی است.","Have you ever been to China? / Yes, I have visited China twice. / I have never eaten Sushi in my life.","با ever و never"],
 ["کاربرد ۴ حال کامل","برای کاری که برای اولین بار یا چندمین بار انجام داده‌ایم.","It is the first time (that) she has been on a diet. / This is the fourth time that we have complained.",""],
 ["کاربرد ۵ حال کامل","برای بیان کردن صفات عالی.","This is the most popular song that I have ever heard. / My neighbor is one of the best drivers I have ever seen.",""],
 ["کاربرد ۶ حال کامل","برای بیان عمل یا حالتی که از گذشته تا حالا چندین بار تکرار شده است.","My mother has cooked spaghetti three times this week. / I have been on vacation in London several times.",""],
 ["کاربرد ۷ حال کامل","عمل و یا دستاوردی که در طول زندگی توسط ما یا دیگران صورت گرفته و زمان دقیق آن مشخص نیست.","I have eaten Japanese food many times. (زمان مشخص نیست) / I ate Japanese food three months ago. (زمان مشخص است)","اگر زمان دقیق مشخص باشد، گذشته ساده"],
 ["for و since","for: به مدت / since: از","for (two hours, three weeks, five months, seven years, a long time) / since (nine o'clock, Monday, last week, yesterday, 2007, the first of June)","I have been in this office for eight years. / I have been in this office since 2012."],
 ["already","قبلاً، پیش از این - قبل از قسمت سوم فعل یا بعد از have/has","A: Don't forget to do your assignment Jack. B: I have already done it.","کار زودتر از زمان مورد انتظار انجام شده است."],
 ["just","چند لحظه قبل، تازه - قبل از قسمت سوم فعل یا بعد از have/has","A: You look sleepy. B: Yes, I have just got up.","چند لحظه قبل انجام شده."],
 ["yet","هنوز - در آخر جملات منفی و سوالی","Have they arrived yet? / We haven't finished our homework yet.","منتظر انجام کاری هستیم."],
 ["so far / up to now","تاکنون - در آخر جملات ماضی نقلی","We have had no trouble with our television set so far. / We have completed 17 lessons so far.",""],
 ["ever و never","ever: تا حالا (در جملات مثبت و سوالی) / never: هرگز (در جملات منفی)","Have you ever been to China? / No, I have never been to China. / I have never seen such a film. / He has never driven a car before.",""],
 ["recently و lately","قبل از فعل اصلی و بعد از have/has یا در آخر جمله","She hasn't written to me recently. / I have been very busy lately.",""],
 ["عبارت‌های زمانی حال کامل","1) if clause (قید زمان نداشته باشد) 2) قید تکرار: sometimes, never, always 3) تعداد دفعات: once, twice, three times, several times","He has put his comb in his pocket. / I have seen this film before. / I have visited the zoo several times. / Ali has watched TV every night this week.",""],
 ["حال کامل در جملات وصفی","بعد از صفات عالی، اعداد ترتیبی، the only، the first","This is the first time she has been to Shiraz.","جمله اصلی زمان حال است."],
 ["تغییرات فعل در حال کامل","1) افعال ختم به e: فقط d اضافه می‌شود (close→closed) 2) افعال ختم به y: اگر قبلش مصوت باشد فقط ed (enjoy→enjoyed)، اگر صامت باشد y→i (vary→varied) 3) افعال تک‌سیلابی: حرف بی‌صدا دوبار تکرار (ban→banned)","close → closed / arrive → arrived / enjoy → enjoyed / stay → stayed / vary → varied / hurry → hurried / ban → banned / trap → trapped / prefer → preferred",""],
 ["Phrasal Verbs (افعال چند بخشی)","ترکیب فعل با حرف اضافه یا قید که معنی جدیدی می‌سازد.","go through (تحمل کردن) / look after (مراقب بودن) / turn on (روشن کردن)",""],
 ["افعال دو کلمه‌ای جداشدنی","1) متعدی باشند 2) حرف اضافه یکی از: on, off, in, out, up, down, back, over باشد","put on / turn on / turn off / call up","اگر مفعول اسم باشد، هم قبل و هم بعد از حرف اضافه می‌آید. اگر ضمیر مفعولی باشد، حتماً قبل از حرف اضافه."],
 ["افعال دو کلمه‌ای جدانشدنی","1) لازم باشند 2) یا حرف اضافه غیر از حروف بالا باشد","get up (بیدار شدن) / come back (برگشتن) / look for (جستجو کردن)","فعل و حرف اضافه به هیچ وجه جدا نمی‌شوند."],
 ["افعال دوکلمه‌ای مهم","call up, call off, call on, call back, call in, bring about, bring up, catch up with, check in, check into, check out, cheer up, come across, ask out","—","—"],
 ["افعال دوکلمه‌ای جداشدنی رایج","clean up, cross out, do over, drop off, figure out, fill out, find out, get back from, get in, get into, get off, get out of, get over, give up, go over, grow up, hang up, keep out of, look into, look over, look up, make up, pass away, pick out, pick up, point out, put off, put on, put out, put up with, run into, run out, show up, take after, take off, take out, take up, tear down, tear up, throw out, throw away, try on, turn down, turn off, turn on, turn out, turn up, give back, add up, find out, wake up","—","—"],
 ["صفات + حروف اضافه","هیچ قانون مشخصی وجود ندارد و باید حفظ شوند. مترادف و متضادها با همان حرف اضافه می‌آیند.","afraid of, frightened of, scared of, terrified of / kind of, nice of, sweet of, thoughtful of / proud of / rude of / smart of / sick of, tired of / silly of / stupid of",""],
 ["صفت + of","برای بیان حالات روحی یا فیزیکی مثل ترس، خستگی، عصبانیت","Sam is afraid of dogs. / How kind of you to come early. / I thought it rude of her to interrupt me. / That's very smart of you. / I am so sick of doing laundry.",""],
 ["صفت + to","توصیف رفتار، حالت یا ارتباط بین اشیاء و اشخاص","accustomed to / addicted to / committed to, dedicated to, devoted to / friendly to, good to, kind to, nice to / married to / mean to, rude to, unfriendly to / opposed to / similar to","He quickly became accustomed to city life. / Henry is friendly to everyone. / Cassie is married to Nick.",""],
 ["صفت + about","بیان یک شرایط یا حالت خاص","angry about, furious about, mad about / anxious about, nervous about, stressed about, worried about / excited about / happy about / sad about, depressed about / sorry about, upset about","My neighbor is angry about the loud music. / Joe is anxious about studying abroad. / I am excited about a new book.",""],
 ["صفت + for","بیان اهداف یا دلایل مختلف - همچنین تاکید احساسات","famous for / known for / responsible for / feel/be + adjective + for + someone/something","Texas is famous for rodeos. / Australia is known for its large kangaroo population. / Marianne feels bad for her coworker.",""],
 ["صفت + with","بیان دلیل بروز یک احساس یا ارتباط","angry with, furious with / annoyed with, fed up with / bored with / content with / fine with / OK with / disappointed with, displeased with / pleased with","Nicole is angry with her mother. / I'm annoyed with this traffic. / Taylor was content with moving to Chicago.",""],
 ["صفت + at/by","amazed, astonished, shocked, surprised","The man was amazed at/by the number of people. / I'm shocked at/by his behavior.",""],
 ["صفت + at","good at, terrible at","James is good at playing the guitar. / I'm terrible at",""],
 ["صفت + in","interested in, involved in","Bernard is interested in joining the school band. / Is she involved in politics?",""],
 ["صفت + from","different from, protected from, tired from","Turquoise is different from blue. / We were protected from the storm. / I became tired from studying all night.",""],
 ["صفات با چند حرف اضافه","sorry about/for / disappointed with/in","She's very sorry about the mistake. / She's very sorry for the mistake. / Mark is disappointed with the decision. / Mark is disappointed in the decision.",""],
 ["happy for vs happy about","happy for + people / happy about + thing/event","I'm so happy for them. / I'm so happy about the wedding.",""],
 ["angry with vs angry about","angry with + person / angry about + gerund","Dad is angry with Elizabeth. / Dad is angry about Elizabeth's sneaking out.",""],
 ["Gerund (اسم مصدر)","فعل + ing که نقش اسم را دارد. می‌تواند فاعل، مفعول، مکمل باشد.","Studying is hard. / I enjoy reading. / Reading helps you learn English.",""],
 ["Gerund به عنوان فاعل","Eating too much food makes people fat. / Not doing her homework caused her to fail the test.","—",""],
 ["Gerund بعد از افعال خاص","enjoy, avoid, dislike, postpone, mind, suggest, finish, consider, deny, admit, keep, practice, risk, quit, imagine","He avoids talking to his friend. / She dislikes watching horror movies. / Do you want to postpone returning to Paris?",""],
 ["Gerund به عنوان مکمل فاعل","بعد از فعل to be","My favorite hobby is reading. / Her problem is not coming to class on time.",""],
 ["Gerund بعد از حرف اضافه","after, before, without, from, to, of, with, for, against, at, about, by, in, on, through, out, over, up, down, among, between, towards, into","I will call you after arriving in London. / She is good at learning languages.",""],
 ["ترکیبات با Gerund","It's no good / It's no use / can't stand / can't help / to be busy / couldn't help / don't mind / feel like / how about / spend one's time / there's no / there's no point / what about / worth","It is no good going outside in this rainy day. / How about walking home instead of taking the car? / There's no point in complaining further.",""],
 ["نکات مهم Gerund","1) ing در حال استمراری جزء اسم مصدر نیست 2) بعد از صفت ملکی یا s' می‌آید 3) منفی: not + gerund","I'm playing football. (حال استمراری) / I appreciate her speaking. / I appreciate Helen's speaking. / When I'm on Vacation, I enjoy not having to get up early.",""],
 ["go + gerund","برای ورزش‌های تفریحی","go fishing, go skiing, go skating, go shopping, go swimming, go running, go jogging, go sailing",""],
 ["Gerund به عنوان فاعل مفرد/جمع","یک gerund → فعل مفرد / دو gerund → فعل جمع","Walking makes me happy. / Cycling and jogging are my favorite sports.",""],
 ["No + gerund","برای هشدار و جلوگیری","No parking, No smoking, No swimming, No fishing",""]
];
grammar[28]=[
 ["Reference (رفرنس یا مرجع)","کلمات جهت جلوگیری از تکرار نام انسان‌ها، مکان‌ها، ایده‌ها و چیزهای دیگر استفاده می‌شوند.","برای یافتن بهتر مرجع یا رفرنس کلمات، باید: 1) متن را کامل و دقیق بخوانید 2) دنبال کلمات متداول رفرنس مثل it, they, them, this, those, that باشید 3) به جملات نزدیک و همجوار با این رفرنس‌ها توجه کنید.",""],
 ["متضادها (Antonyms)","پرکاربردترین کلمات متضاد پایه‌های دهم، یازدهم و دوازدهم","absent x present / accept x decline / alive x dead / always x never / ancient x modern / beautiful x ugly / big x little / brave x cowardly / careful x careless / cheap x expensive / dark x light / day x night / early x late / east x west / easy x hard / empty x full / fast x slow / happy x sad / hot x cold / long x short / new x old / open x closed / polite x rude / rich x poor / safe x unsafe / strong x weak / sunny x cloudy",""],
 ["First Conditional (شرطی نوع اول)","If + حال ساده, will/won't + مصدر بدون to","از جملات شرطی نوع اول برای بیان یک شرط (یا موقعیت) ممکن و یک نتیجه محتمل در آینده استفاده می‌شود.",""],
 ["ساختار شرطی نوع اول","If + حال ساده, will/won't + مصدر بدون to","If I work hard, I will pass my exams. / If I find your watch, I will tell you. / If we leave now, we'll catch the 10.30 train. / If I see him, I'll tell him the news. / You'll get wet if you don't take an umbrella.",""],
 ["نکته کاربردی شرطی نوع اول","می‌توان از افعال کمکی مثل may, can, should, must نیز استفاده کرد","If you pull the cat's tail, it may scratch you. / You should eat less rice if you want to lose weight.",""],
 ["سوالی کردن شرطی نوع اول","جواب شرط را سوالی می‌کنیم","Will you eat less rice if you want to lose weight?",""],
 ["Present Participle و Past Participle","present Participle (ing): صفات فاعلی، نشانه اثرگذاری / Past Participle (ed): صفات مفعولی، نشانه اثرپذیری","صفات فاعلی: ویژگی‌های شخص یا موقعیت را نشان می‌دهند. / صفات مفعولی: نشان می‌دهند کسی چه احساسی نسبت به چیزی دارد.",""],
 ["صفت فاعلی","ing + افعال","My friend is boring. (دوست من خسته‌کننده است - یعنی باعث خستگی می‌شود) / This grammar lesson is boring. / This song is interesting. / Sara was confused by the confusing street signs.",""],
 ["صفت مفعولی","ed + افعال","My friend is bored. (دوست من خسته است - یعنی از چیزی خسته شده) / I am bored reading all about these grammar rules. / We are interested in this kind of songs. / They were frightened by the frightening noises.",""],
 ["لیست صفات فاعلی و مفعولی","Alarming/Alarmed, Amusing/Amused, Annoying/Annoyed, Astonishing/Astonished, Boring/Bored, Captivating/Captivated, Comforting/Comforted, Confusing/Confused, Convincing/Convinced, Challenging/Challenged, Charming/Charmed, Depressing/Depressed, Disappointing/Disappointed, Disgusting/Disgusted, Disturbing/Disturbed, Embarrassing/Embarrassed, Encouraging/Encouraged, Entertaining/Entertained, Exhausting/Exhausted, Fascinating/Fascinated, Frightening/Frightened, Inspiring/Inspired, Exciting/Excited, Interesting/Interested, Satisfying/Satisfied, Shocking/Shocked, Terrifying/Terrified, Threatening/Threatened, Surprising/Surprised, Tempting/Tempted, Worrying/Worried","—",""],
 ["To + infinitive (مصدر با to)","در زبان انگلیسی به دو روش ساخته می‌شود: با پسوند ing و با حرف اضافه to","I decided not to go to London. / He asked me not to be late. / I'd like you not to sing so loudly. / I'd rather not eat meat. / I might not come.",""],
 ["کاربرد ۱ - برای بیان دلیل و هدف","He bought some flowers to give to his wife. / He locked the door to keep everyone out. / We set off early in order to avoid the traffic. / They spoke quietly in order not to wake the children.","—",""],
 ["کاربرد ۲ - بعد از افعال خاص","hope, hate, forget, expect, decide, choose, plan, mean, love, like, learn, intend, agree, would love, would like, want, remember, prefer, begin, need, tell, try, refuse, promise, seem, offer, wish, force, permit","They decided to start a business together. / Remember to turn the lights out.",""],
 ["کاربرد ۲ب - با مفعول مستقیم","She reminded me to turn the lights out. / It is easy for you to criticize other people. / He encouraged his friends to vote for him.","—",""],

 ["کاربرد ۳ب - صفات خاص","Able to, Unable to, Due to, Likely to, Keen to, Eager to, Prepared to, Ready to, Unlikely, Unwilling to, Willing to","It's kind of you to help. / Unfortunately I was unable to work for over a week. / I am ready to go to bed.",""],
 ["کاربرد ۳ج - نظر دادن","Possible, Easy, Difficult, Hard, Impossible, Right, Wrong, Nice, Clever, Silly, Foolish","It's easy to play the piano. / He spoke so quickly it was impossible to understand him.",""],

 ["کاربرد ۵ - به عنوان فاعل جمله","To understand statistics, that is our aim.","کاربرد رسمی و نوشتاری.",""],
 ["کاربرد ۶ - هدف استفاده از چیزی","The children need a garden to play in. / I would like a sandwich to eat. / I don't have anything to wear. / Would you like something to drink?","—",""],
 ["کاربرد ۷ - همراه با قیود","too/enough + (صفت/قید/اسم) + مصدر با to","There's too much sugar to put in this bowl. / I had too many books to carry. / This soup is too hot to eat. / She was too tired to work. / There isn't enough snow to ski.",""],

 ["جملات با فعل کمکی","در جملاتی که فعل کمکی دارند، کلمه پرسشی قبل از فعل کمکی می‌آید.","Where can I buy a suitcase? / Who has painted this wall?","در جملات بدون فعل کمکی از do و does استفاده می‌شود: How do you do your hard job?"],
 ["Collocations (همایندها)","کلماتی که معمولاً با هم استفاده می‌شوند. تنها این ترکیب‌ها از نظر یک فرد انگلیسی‌زبان طبیعی هستند.","natural English: the fast train, fast food, a quick shower, a quick meal","unnatural English: train the quick, food quick, shower a fast, meal a fast"],
 ["اهمیت یادگیری Collocations","با آموختن همایندها می‌توانید به شکلی صحیح و طبیعی از زبان انگلیسی استفاده کنید.","مغز ما معنی و کاربرد ترکیب‌ها را راحت‌تر از کلمات تک و مجزا به خاطر می‌سپارد.",""],
 ["چگونه Collocations بیاموزیم؟","1) به ترکیبات مختلف دقت کنید 2) آنها را به عنوان یک واحد زبانی یاد بگیرید 3) همایندهای کلمه جدید را کنار آن بنویسید 4) زیاد مطالعه کنید 5) چندبار بررسی کنید 6) در دسته‌بندی‌های موضوعی بیاموزید","مثال برای remember: remember rightly, remember distinctly, remember vaguely, remember vividly",""],
 ["Do Collocations","do one's housework / do one's homework / do research / do an experiment / do one's best / do somebody a favor / do exercise / do one's hair / do harm / do damage / do the ironing / do the shopping / do the washing / do the dishes","کارهای خونه رو انجام دادن، انجام دادن تکالیف منزل، تحقیق کردن، آزمایش کردن، نهایت تلاش خود را کردن، به کسی کمکی کوچک یا لطفی کردن، ورزش کردن، موها رو مرتب کردن، آسیب رساندن، خسارت رساندن، اتو کشیدن، خرید کردن، شستشو کردن، ظرف‌ها رو شستن",""],
 ["Make Collocations","make progress / make a decision / make money / make a list / make a promise / make friends / make dinner / make breakfast / make a mistake / make a phone call","پیشرفت کردن، تصمیم گرفتن، پول در آوردن، لیست تهیه کردن، قول دادن، با کسی دوست شدن، شام درست کردن، صبحانه درست کردن، اشتباه کردن، تماس گرفتن",""],
 ["Take Collocations","take an exam / take a look / take a break / take a chance / take a risk / take a taxi / take a vacation / take notes / take an interest in / take a photo","امتحان دادن، نگاه انداختن، استراحت کوتاه کردن، کاری را علی‌رغم ریسکش انجام دادن، ریسک کردن، تاکسی گرفتن، مرخصی گرفتن، یادداشت برداشتن، به چیزی علاقه پیدا کردن، عکس گرفتن",""],
 ["Passive Voice (جملات مجهول)","در جملات مجهول، عملی که انجام شده اهمیت دارد و اینکه چه کسی یا چه چیزی باعث انجام کار شده مهم نیست یا کمتر اهمیت دارد.","I keep the butter in the fridge. (معلوم) → The butter is kept in the fridge. (مجهول)","جملات مجهول را passive (یعنی گذرا) و جملات معلوم را active (یعنی فعال) می‌نامند."],
 ["دلایل مجهول کردن جملات","الف) هنگامی که فاعل جمله کلمه مهمی نظیر people, someone, they و غیره باشد. ب) هنگامی که عمل انجام‌شده به مراتب مهم‌تر از این است که چه کسی یا چه چیزی آن را انجام داده است. ج) هنگامی که فاعل جمله به حدی آشکار باشد که بتوان از گفتن آن صرف نظر کرد.","Someone stole my car last night. → My car was stolen last night. / There was a terrible storm last night. Hundreds of houses were destroyed. / The teacher has corrected the exam papers. → The exam papers have been corrected by the teacher.",""],
 ["مراحل مجهول کردن جمله معلوم","1) شناسایی فاعل، فعل و مفعول جمله معلوم 2) حذف فاعل (یا پس از واژه by در انتهای جمله) 3) مفعول جمله معلوم به اول جمله مجهول آورده می‌شود 4) با توجه به فعل اصلی، زمان جمله مشخص می‌شود 5) فعل be در شکل صرف‌شده مناسب به عنوان فعل کمکی اضافه می‌شود 6) بعد از فعل be، شکل سوم از فعل اصلی (با قاعده یا بی‌قاعده) آورده می‌شود","—",""],
 ["مجهول در زمان‌های مختلف","حال ساده: am/is/are + pp / حال استمراری: am/is/are + being + pp / حال کامل: have/has + been + pp / گذشته ساده: was/were + pp / گذشته استمراری: was/were + being + pp / گذشته کامل: had + been + pp","He is cleaning the house at the moment. → The house is being cleaned at the moment. / He has cleaned the house since you left. → The house has been cleaned since you left. / He cleaned the house yesterday. → The house was cleaned yesterday. / He was cleaning the house last week. → The house was being cleaned last week. / He had cleaned the house before they arrived. → The house had been cleaned before they arrived.","زمان‌های حال کامل استمراری و گذشته کامل استمراری شکل مجهول ندارند."],
 ["مجهول در زمان‌های دیگر","شرطی گذشته: would have + been + pp / آینده ساده: will be + pp / آینده استمراری: will be + being + pp / آینده کامل: will have + been + pp","He would have cleaned the house if it had been dirty. → The house would have been cleaned if it had been dirty. / He will clean the house next week. → The house will be cleaned next week. / He will be cleaning the house tomorrow. → The house will be being cleaned tomorrow. / He will have cleaned the house. → The house will have been cleaned.",""],

 ["جملات با دو مفعول","در جمله‌هایی که دو مفعول دارند، هر یک از مفعول‌ها می‌تواند به عنوان فاعل جمله مجهول انتخاب شود.","has given first aid to him. → has been given first aid (by someone). / has been given to him (by someone).",""],
 ["تبدیل ضمایر","ضمیر مفعولی که در جایگاه فاعل قرار داده می‌شود باید به ضمیر فاعلی تبدیل شود.","me → I / you → you / her → she / him → he / it → it / us → we / them → they","He hit me with his car. → I was hit (by his car). / He hit you with his car. → You were hit (by his car). / He hit her with his car. → She was hit (by his car)."],
 ["Tag Questions (سوالات ضمیمه)","سوالات کوتاهی که در پایان یک جمله آمده (مثبت یا منفی) و معمولاً کاربرد آن کسب اطمینان از یک مسئله است.","He is a student, isn't he? / He is not a student, is he? / Mina was playing well, wasn't she? / My brothers aren't at school, are they?",""],
 ["ساختار Tag Questions","1) سوال ضمیمه از نظر مثبت یا منفی بودن، عکس جمله اصلی است 2) ضمیر فاعلی + فعل کمکی منفی... جمله خبری مثبت 3) ضمیر فاعلی + فعل کمکی مثبت... جمله خبری منفی","He is a student, isn't he? / He is not a student, is he? / Reza will go to Isfahan, won't he? / They were watching TV, weren't they?",""],
 ["فعل کمکی در Tag Questions","چنانچه جمله اصلی فعل کمکی داشته باشد از همان فعل کمکی استفاده می‌شود ولی چنانچه جمله فاقد فعل کمکی باشد از do یا مشتقات آن استفاده می‌شود.","I listen to the teacher, don't I? / We don't wash the car, do we? / Ali swims in the river, doesn't he? / She doesn't speak English, does she? / His father opened his store at 8, didn't he? / He didn't clean the store, did he?",""],
 ["نکات Tag Questions - ضمیر","در سوال ضمیمه همیشه بعد از فعل کمکی از ضمیر فاعلی استفاده می‌شود. اگر فاعل بشکل اسم یا عبارت اسمی باشد، در سوال ضمیمه از ضمیر فاعلی مشابه آن استفاده می‌شود.","Mina was playing well, wasn't she? / My brothers aren't at school, are they?",""],
 ["نکات Tag Questions - مخفف","در سوالات ضمیمه چنانچه بخواهیم فعل کمکی را بشکل منفی بکار بریم، آن را می‌بایست بشکیل مخفف بکار برد.","Reza will go to Isfahan, won't he? / They were watching TV, weren't they?",""],
 ["نکات Tag Questions - I am","چنانچه در جمله‌ی مثبت از I am استفاده شده باشد در سوال ضمیمه از aren't I استفاده می‌شود.","I am a good student, aren't I?",""],
 ["نکات Tag Questions - قید منفی","اگر در جمله اصلی قید منفی نظیر no, never, hardly, scarcely, seldom, rarely کار رفته باشد، سوال کوتاه بشکل مثبت خواهد بود.","He never eats breakfast, does he? / The old man could hardly walk, could he? / There is nothing in the kettle, is there?",""],
 ["نکات Tag Questions - فاعل نامشخص","اگر فاعل جمله نا مشخص باشد، یعنی یکی از کلمات زیر باشد: nobody, everybody, everyone, somebody, someone، در سوال کوتاه فعل و ضمیر فاعلی جمع خواهد بود.","Somebody borrowed my book yesterday, didn't they? / Nobody knows the answer, do they? / Everybody knows the answer, don't they?",""],
 ["نکات Tag Questions - جملات امری","در جملات امری مثبت و منفی سوال کوتاه با will you ساخته می‌شود.","Open the door, will you? / Don't turn on the radio, will you?",""],
 ["نکات Tag Questions - Let's","جملاتی که با let's شروع می‌شوند، سوال کوتاه با shall we ساخته می‌شود.","Let's play in the yard, shall we?",""],
 ["نکات Tag Questions - Let us","جملاتی که با let us شروع می‌شوند، سوال کوتاه با will you ساخته می‌شود.","Let us go for a swim, will you?",""],
 ["نکات Tag Questions - few و little","کلمات few و little جمله را منفی می‌کنند. لذا باید از tag مثبت استفاده کرد.","Few people have known how to earn money, have they?",""],
 ["نکات Tag Questions - ضمیر در tag","هیچ‌گاه در tag از اسم استفاده نمی‌کنیم و همواره از ضمیر استفاده می‌کنیم یا از کلماتی نظیر there یا one استفاده می‌کنیم.","No one can answer this question, can he? / There is a cat in that room, isn't there? / This is your car, isn't it? / Those are your friends, aren't they?",""],
 ["نکات Tag Questions - only","اگر در جمله خبری قید only باشد.","You have only one brother, do you? / don't you?",""],
 ["Simple Sentence و Compound Sentence","Simple sentence: Jack opened the door. / Compound sentence: Jack opened his bag, something else distracted his attention.","حروف ربط همپایه‌ساز: for, and, nor, but, or, yet, so (FANBOYS)","Compound sentence: Jack opened his bag, stopped for a second, pulled out a pen, and started writing."],
 ["حروف ربط - And","زمانی استفاده می‌شود که می‌خواهیم توضیحاتی جدید را به عبارت قبلی اضافه کنیم.","I go to the park every Sunday to watch the ducks on the lake and the men playing soccer. / I like tea and coffee.",""],
 ["حروف ربط - But","زمانی استفاده می‌شود که می‌خواهیم تضاد جمله جدید با جمله پایه را نشان دهیم.","He reads magazines, but he doesn't like to read books. / The soccer in the park is entertaining in the winter, but it's better in the heat of summer.",""],
 ["حروف ربط - Or","برای جایگزین کردن یا انتخاب کردن از بین گزینه‌های موجود استفاده می‌شود.","Do you like tea or coffee? / He doesn't have a television or a video. / Shall we go out to the cinema or stay at home?",""],
 ["حروف ربط - So","برای نشان دادن نتیجه یا پیامد کاری یا بیان کردن علت و معلول استفاده می‌شود.","We were bored with the movie, so we left cinema. / There are no more chairs available, so you will have to stand.",""],
 ["حروف ربط - For","برای نشان دادن دلیل یا هدف به کار برده می‌شود.","I go to the park every Sunday, for I love to watch the ducks on the lake. / Comfort her, for he is sad. / Father, forgive them for they know not what they do.",""],
 ["حروف ربط - Nor","زمانی به کار می‌بریم که می‌خواهیم یک ایده منفی را جایگزین عبارت منفی‌ای که از قبل در جمله وجود داشته، کنیم.","I don't go for the fresh air nor really for the ducks. Honestly, I just like the soccer. / It was not my fault, nor was his. It just an accident.",""],
 ["حروف ربط - Yet","برای نشان دادن تضاد بین دو جمله همانند but به کار برده می‌شود.","I always take a book to read, yet I never seem to turn a single page. / He is so young, yet so experienced.",""],
 ["حروف ربط - Because","از این کلمه هنگامی استفاده می‌شود که می‌خواهیم دلیل چیزی یا کاری را توضیح دهیم.","She goes to the tennis club because she likes to play tennis. / She did not come to school, because she was ill.",""],
 ["حروف ربط - Even","به کار برده می‌شود که بر خلاف محدودیت‌ها، موانع، مشکلات یا اتفاقات غیر منتظره، کاری را انجام دهیم.","I am going to the party, even if it rains. / She likes swimming, even in winter.",""]
];
grammar[30]=[
 ["استراتژی حمله به کلمه","استراتژی حمله به کلمه کمک می‌کند تا خواننده رمز گشایی، تلفظ و درک معنی کلمات ناآشنا را به درستی انجام دهد.","این استراتژی به خوانندگان کمک می‌کند تا با قطعه قطعه کردن کلمات ناآشنا به هرکدام از آنها از زاویه ای متفاوت حمله کنند.","رعایت اصول زیر در به کارگیری این استراتژی مفید است."],
 ["۱) استفاده از تصاویر","یکی از مهم‌ترین استراتژی‌های درک لغات است.","سعی کنید چند حرف را در کنار هم بخوانید.این مجموعه حروف ممکن است صدای بلند صدای خارج از کلمه / شکستن کلمه به اجزای تشکیل دهنده: الف) صداها ب) پیشوندها و پسوندها پ) ریشه‌های لغات","اساس است. اما یادگیری تمام آنها کاراسانی نیست.به ویژه که ریشه بیشتر آنها ریشه در زبان لاتین دارد. برخی از این کلمه را بخوانید و سعی کنید معنی و کاربرد آن را درک کنید.سپس بخش های مختلف را باهم ترکیب کنید و کلمه را با صدای بلند بخوانید.به دنبال انواع مختلف یک کلمه در جمله باشید.مثلا ممکن است شما فعل یک کلمه را بدانید اما از همان فعل با استفاده از پسوند یا پیشوند اسم صفت یا قیدی ساخته شده باشد که تا بحال با آن برخورد نکرده باشید.بنابراین شما معانی تمام انواع همان کلمه را میدانید."],
 ["۲) اتصال کلمه جدید با دانش لغوی گذشته","سعی کنید کلمه جدید را با یک کلمه که می دانید متصل کنید.در مورد کلمه ای مشابه که می دانید فکر کنید.کلمه آشنا را به کلمه ناآشنا مقایسه کنید.ببینید آیا کلمه آشنا مشابه یا شکلی از کلمه ناآشنا نیست.برای امتحان این نکته از کلمه شناخته شده در جمله استفاده کنید. اگر شباهتی وجود داردپس معنای کلمه ناآشنا را فهمیده اید.","—",""],
 ["۳) خواندن بیش از یک بار جمله","فکر کنید که چه کلمه ای ممکن است در جمله معنادار باشد.همان کلمه را به کار ببرید و ببینید جمله معنی دارد.","—",""],
 ["۴) گذر از کلمه ناآشنا","از کلمه ناآشنا بگذرید و به دنبال سرنخ ها برویید.اگر همان کلمه در جمله بعدی تکرار شود جمله دوم را با جمله اول مقایسه کنید. چه کلمه ای ممکن است در هردو جمله معنی داشته باشد؟","—",""],
 ["۵) استفاده از دانش پیشین","در مورد آنچه که در مورد موضوع کتاب، پاراگراف یا جمله می دانید فکر کنید.و به دانش قبلی خود در مورد همان موضوع رجوع کنید.","این تکنیک به ویژه در مورد متن هایی که اطلاعات علمی و ... را از مجلات و کتابها و ... ارایه می کنند می تواند مفید واقع شود.",""],
 ["Relative Pronouns (ضمایر موصولی)","who: ضمیر موصولی فاعلی برای انسان / whom: ضمیر موصولی مفعولی برای انسان / which: ضمیر موصولی فاعلی و مفعولی برای غیر انسان / what: ضمیر موصولی فاعلی و مفعولی بدون مرجع صریح / whose: ضمیر موصولی ملکی برای بیان حالت ملکی در انسان و گاهی غیر انسان / that: ضمیر موصولی فاعلی و مفعولی برای انسان و غیر انسان / of which: ضمیر موصولی ملکی برای بیان تعلق و اختصاص در غیر انسان","ضمایر موصولی ضمایری هستند که دارای wh می باشند و در بین دو جمله یا وسط جمله به کار می روند. بعنوان معرف جمله واره های موصولی استفاده می شوند.","ضمایر موصولی در زبان فارسی بصورت «که» معنی می شوند."],
 ["نکات ضمایر موصولی","1) نوع ضمیر موصولی به اسمی که به آن اشاره دارد و نوع جمله واره موصولی بستگی دارد. 2) ضمایر موصولی در زبان فارسی بصورت «که» معنی می شوند. 3) به جمله هایی که با ضمایر موصولی شروع شود جمله واره موصولی می گویند. 4) ضمیر موصولی مانند دیگر ضمایر در زبان انگلیسی اسم یا ضمیر قبل از خود را شرح می دهند.","—",""],
 ["ضمیر موصولی who","از who برای اشاره به انسان و گاهی اوقات برای اشاره به حیوانات خانگی استفاده می کنیم. از این ضمیر موصولی برای تعریف جمله واره موصولی تعریف کننده یا جمله واره موصولی غیر تعریف کننده استفاده می گردد.","I think there'd be a lot of children who'd love to have a climbing wall in school. / She's going out with a bloke who's in the army. / The woman who I saw yesterday was Sheila. / That's the dog who doesn't like me (اشاره به یک حیوان خانگی) / There's this guy at work, who's one of my friends, well he's never been on a train.",""],
 ["کاربرد who بعنوان فاعل و مفعول","ما می توانیم از who بعنوان فاعل یا مفعول یک جمله واره موصولی استفاده کنیم.","در مثال اول bloke که فاعل جمله واره موصولی است، who به آن اشاره دارد. در مثال دوم who به woman که مفعول فعل (saw) در جمله واره موصولی است، اشاره دارد.",""],
 ["حرف اضافه + who","از ضمیر موصولی who می توانیم بعنوان یک متمم حرف اضافه استفاده کنیم.","It was Cath who Ian gave the keys to. It wasn't me.","نکته: در این ساختار حرف اضافه در انتهای جمله واره موصولی واقع می‌شود و بالفاصله قبل از ضمیر موصولی who قرار نمی‌گیرد. درست: Of all my friends, she's the one who I know I can rely on. نادرست: Of all my friends, she's the one on who I know I can rely."],
 ["کاربرد who همراه با گروه های جمعی افراد","ما اغلب who را برای اسامی جمعی مانند انسان استفاده می کنیم.","Nicola phoned the fire brigade, who then alerted the police and social workers.","نکته: از who برای اشیاء استفاده نمی کنیم. درست: There are some very good art books which you can get ideas from. نادرست: There are some very good art books who you can get ideas from."],
 ["ضمیر موصولی whom","از whom در انگلیسی رسمی یا نوشتاری استفاده می کنیم. زمانی که فقط به شخصی که مفعول جمله است اشاره دارد. در واقع استفاده از whom در نوشتار انگلیسی رایج تر است.","The man whom you met yesterday is coming to dinner.","در این جمله whom به the man اشاره دارد که مفعول برای فعل جمله یعنی met میباشد."],
 ["حرف اضافه + whom","رایج‌ترین کاربرد whom، استفاده از آن با حرف اضافه است. ما می‌توانیم whom را بعنوان متمم یک حرف اضافه استفاده کنیم.","Drama in schools is particularly good for pupils for whom English is a second language.","نکته: حرف اضافه باید قبل از whom واقع شود."],
 ["ضمیر موصولی whose","از ضمیر موصولی whose برای اشاره به مالکیت افراد یا حیوانات استفاده می‌کنیم.","He's marrying a girl whose family don't seem to like him. / Kate, whose sister I used to share a house with, has gone to work in Australia.","در ساختار اسم + whose، می‌توان بعنوان متمم حرف اضافه استفاده کرد."],
 ["ضمیر موصولی which","از which در جمله واره های موصولی تعریف کننده یا غیر تعریف کننده استفاده می کنیم. جمله واره های موصولی وقتی که اشاره به کل یک جمله یا جمله واره دارند، همیشه از which استفاده می کنیم.","You need to tick the box which says yes. / He won't have much time to prepare for the meeting, which is this afternoon. / She had to get up and walk all the way to the other side of the room, which isn't easy with a bad back.","نکته: نمی‌توان از what برای جمله واره موصولی تعریف کننده استفاده کرد. درست: Another activity which/that I have chosen is photography. نادرست: Another activity what I have chosen is photography."],
 ["کاربرد which بعنوان فاعل و مفعول","از which می‌توان به عنوان فاعل و مفعول برای جمله واره موصولی استفاده کرد.","The new sports complex, which will be built on the site of the old power station, will provide facilities for cricket, soccer, bowls and badminton. / It was the same picture which I saw at the National Gallery.","در مثال اول which به the new sports complex اشاره دارد که فاعل برای فعل will be built در جمله واره موصولی میباشد. در مثال دوم which به the same picture که مفعول برای فعل saw در جمله واره موصولی است، اشاره دارد."],
 ["حرف اضافه + which","از which می‌توان بعنوان متمم حرف اضافه کرد.","Early in the Autumn Term there is a reception at which you can meet current staff and students. / Close by, in the churchyard, is the famous Rudston stone, from which the village takes its name.","در مثال اول which به a reception اشاره دارد و متمم حرف اضافه at میباشد."],
 ["کاربرد which بعنوان اشاره کننده به کل یک جمله","جمله واره های موضوعی که اشاره به کل جمله دارند همیشه با which معرفی می شوند.","There's going to be a new head teacher in September, which is good. It's time for a change.",""],
 ["ضمیر موصولی that","از that به جای who، whom و which در جمله واره های موضوعی که به افراد، حیوانات و اشیاء اشاره دارند، استفاده می کنیم. ضمیر موصولی that فقط برای معرفی جمله واره های تعریف کننده استفاده می‌شود. That بسیار رسمی تر از who، whom و which است.","We met somebody last night that did the speech therapy course two years after you. / The 8.30 is the train that you need to get. / She blamed herself for everything that had happened.",""],
 ["کاربرد that","ضمیر موصولی that می تواند بعنوان فاعل و مفعول یک جمله واره موصولی استفاده شود.","Don't take money that doesn't belong to you. / It's the same cooker that my mother has.","در مثال اول that به money اشاره به موضوع دارد که فاعل جمله واره موصولی است. در مثال دوم that به the same cooker اشاره به موضوع دارد که مفعول برای فعل has در جمله واره موصولی میباشد."],
 ["حرف اضافه + that","ضمیر موصولی that می تواند به متمم حرف اضافه اشاره کند.","We've got some tennis balls that you can play with.","در این مثال that به some tennis balls اشاره به موضوع دارد که متمم حرف اضافه with است."],
 ["نکته مهم حرف اضافه + that","بر خلاف whom, which, whose، بالفاصله قبل از that از حرف اضافه استفاده نمی‌گردد.","نادرست: We've got some tennis balls with that you can play.",""],
 ["عبارات in that و with that","in that به معنای because / with that به معنای then میباشند.","I was fortunate in that I had good friends. / She turned off the light and with that she flounced out of the room.",""],
 ["کاربرد that بعد از کلمات خاص","بعد از کلمات زیر و صفات عالی و اعداد ترتیبی، that استفاده می‌شود: anybody, anything, all, anyone, anywhere, somebody, something, nothing, nowhere, nobody, only","Anything that he saved was lost. / Everywhere that I go I remember his gentle face. / It was the third accident that I saw yesterday. / He was the tallest man that I had ever seen. / It was the only thing that was worth seeing. / All the books that I have read belong to his library.",""],
 ["حذف ضمیر موصولی","در سبک غیررسمی انگلیسی، معمولاً ضمیر موصولی حذف می‌شود. حذف ضمیر موصولی فقط در جمله واره های موصولی تعریف کننده و زمانی که ضمیر موصولی به مفعول جمله واره اشاره دارد، انجام می‌شود.","German is a language which I've found hard to learn. → German is a language I've found hard to learn. / She's the singer who I heard on the radio. → She's the singer I heard on the radio. / There's a hill which begins three miles after the start of the race. / Sir James, whose birthday is on February 26, plans to lay on a big party.",""],
 ["ضمایر موصولی where, when, why","در انگلیسی غیررسمی برای معرفی جمله واره موصولی به جای on which, at which, for which غالباً از where, when, why استفاده می‌شود.","I know a restaurant where the food is excellent. (... a restaurant at which the food is excellent) / There isn't a day when I don't feel rushed off my feet. (... a day on which I don't feel rushed ...) / Do you know the reason why the shop is closed today? (... the reason for which the shop is closed ...)",""],
 ["حذفیات جمله واره های موصولی","در بیشتر موارد می توان جمله واره های توصیفی (Adjective clause) را کوتاه کرده و از عبارت توصیفی (Adjective phrase) استفاده کرد.","جمله واره های توصیفی ممکن است یکی از روش های زیر به عبارت توصیفی تبدیل شوند:",""],
 ["روش ۱ حذف","چنان چه فعل جمله واره توصیفی به زمان حال استمراری یا گذشته استمراری باشد، می توان ضمیر موصولی و فعل کمکی بعد از آن (am, is, are, was, were) را باهم از جمله حذف کرد.","Do you know the woman who is sitting in the car? → Do you know the woman sitting in the car? / The taxi which was taking us to the airport broke down. → The taxi taking us to the airport broke down.",""],
 ["روش ۲ حذف","چنان چه فعل جمله واره ی توصیفی به زمان حال ساده یا گذشته ساده باشد، می توان ضمیر موصولی را حذف کرد و فعل جمله را به شکل ing دار (وجه وصفی معلوم) بیان کرد.","All over the world there are people who pollute the environment. → All over the world there are people polluting the environment. / Life must be very difficult for people who live near airports. → Life must be very difficult for people living near airports. / People who lived in the past had their own problem. → People living in the past had their own problem.",""],
 ["روش ۳ حذف","چنان چه جمله واره ی توصیفی ساختار مجهول داشته باشد، می توان ضمیر موصولی و فعل کمکی بعد از آن (is, are, was, were) را حذف کرد و قسمت سوم فعل را باقی گذارد.","The boy who was injured in the accident was taken to the hospital. → The boy injured in the accident was taken to the hospital. / The cars that are produced in this factory are very expensive. → The cars produced in this factory are very expensive. / Some of the people who have been invited to the party cannot come. → Some of the people invited to the party cannot come.",""],
 ["Second Conditional (شرطی نوع دو)","If + Past Simple, Would + Simple verb","به موقعیتی بعد یا فرضی و نتایج احتمالی‌اش اشاره دارد. این جملات بر پایه موقعیت واقعی نیستند. موقعیت‌های غیر واقعی، موقعیت‌هایی تلقی می‌شوند که صرفاً در واقعیت اتفاق نیفتاده و در فضای ذهن یا فانتزی وجود دارند.","مثال: اگر درس خوانده بودم، الان امتحانم را قبول شده بودم. در این مثال می‌گوییم «اگر درس خوانده بودم»، یعنی این فقط یک فانتزی است و فقط در ذهن جای دارد و واقعیت این است که درس نخوانده‌ام."],
 ["ساختار شرطی نوع دو","If + گذشته ساده, would (wouldn't) + مصدر بدون to","If I had more money, I would ('d) buy a new car. / If you lived in England, you would soon learn English.","نکته: با اینکه جمله دارای فرم گذشته است ولی مفهوم آن در زمان حال می‌باشد و گوینده زمانی از این نوع جمله شرطی استفاده می‌کند که اول جمله If clause قابل اجرا نباشد."],
 ["مثال‌های شرطی نوع دو","If we went by bus, it would be cheaper. / If I had his number, I would call him. / If I found her address, I would send her an invitation. / If he inherited a billion dollars, he would travel to the moon.","همان طور که از معنای جمله مشخص است، گوینده منظورش زمان حال است اما افعال جمله در زمان گذشته می‌باشند.",""],
 ["نکته اول شرطی نوع دو","در شرطی نوع دوم این است که شما نباید در عبارت شرط was را به کار بگیرید، لذا پس از I, He, She, It از were استفاده می‌شود.","If I were you, I would save my money. / If I were you, I wouldn't be rude to the boss.",""],
 ["نکته دوم شرطی نوع دو","استفاده از دیگر افعال مودال: شما می‌توانید از افعال could و might نیز به جای فعل would استفاده کنید. Should, May و Must نیز کم و بیش کاربرد دارند.","If Jack studied more, he might pass the exam. / If I won a million pounds, I could stop working. / If you wanted, I could help you study. / If you wouldn't mind, I could use some help.",""],
 ["نکته مهم و کنکوری شرطی نوع دو","در صورتی که در جمله ی شرط از فعل were استفاده شود، می توان If را حذف کرده و were را به ابتدای جمله انتقال داد.","Were I rich, I would buy a house by the sea. (= if I were rich)","نکته: فقط می‌توان در عبارت اصلی استفاده کرد و در عبارت شرطی نباید آن را به کار برد. نادرست: If I would have seen you, I would have said hello."],
 ["مثال‌های بیشتر","If he needed any money, I'd lend it to him. (But he doesn't need it) / If I were a rich man, I'd buy an expensive car.","اگر به پول احتیاج داشت به او قرض می‌دادم. / اگر ثروتمند بودم یک ماشین گران‌قیمت می‌خریدم.",""],
 ["Paragraph (پاراگراف)","هر متن یا مقاله از حداقل یک یا چند پاراگراف تشکیل می‌شود. پاراگراف واحد تشکیل دهنده یک متن است. پاراگراف‌ها گروهی از جملات هستند که در کنار هم ایده خاصی را بیان می‌کنند.","ما به هرکدام از این بخش‌ها و بسته‌های نوشته، پاراگراف می‌گوییم. خواندن نوشته‌ای که پاراگراف‌بندی نشده خسته کننده است.","هر پاراگراف در واقع ایده کمی متفاوت از پاراگراف قبلی خود را بیان می‌کند."],
 ["ایده اصلی پاراگراف","ایده اصلی معمولاً در جمله موضوعی (topic sentence) بیان می‌شود و بقیه جملات پاراگراف به شرح، بسط و تقویت جمله موضوعی می‌پردازند.","—",""],
 ["ظاهر یک پاراگراف","اول هر پاراگراف باید کمی از حاشیه اصلی فاصله داشته باشد (در زبان انگلیسی به این فاصله Indentation می گویند).","به این ترتیب خواننده متوجه می‌شود ایده جدیدی مطرح شده یا جنبه کمی متفاوت‌تر موضوع قرار است مورد بحث قرار گیرد.","نکته: هنگام ترجمه یک متن بسیار دقت داشته باشید که مترجم موظف است دقیقاً چیدمان پاراگراف‌بندی نویسنده را حفظ کند و در این زمینه باید کاملاً تابع نویسنده باشد."],
 ["طول یک پاراگراف","یک پاراگراف ممکن است بسیار طولانی و یا بسیار کوتاه باشد. اما اکثر پاراگراف‌ها معمولاً از سه جمله تشکیل می‌شوند و حدود ۱۰۰ تا ۲۰۰ کلمه دارند.","—",""],
 ["سه بخش مهم برای نوشتن پاراگراف عالی","1) جمله موضوع (Topic sentence) 2) جملات پشتیبان (Supporting Sentences) 3) جمله پایانی (Concluding sentence)","ساختاری که کتاب‌های آیلتس برای یک پاراگراف بدنه پیشنهاد می‌کنند به این صورت است.",""],
 ["جمله موضوع (Topic sentence)","به مهم‌ترین ایده پاراگراف که در قالب یک جمله بیان می‌شود جمله موضوع می‌گویند. جمله موضوع در واقع هسته اصلی پاراگراف است.","این جمله ممکن است در اول پاراگراف (به عنوان پیوند بین دو مبحث) مطرح شود و یا ممکن است در وسط پاراگراف مطرح شود و یا ممکن است در آخر پاراگراف بیان شود.",""],
 ["چگونه یک متن را براساس پاراگراف‌ها بنویسیم؟","اجازه دهید این موضوع را با یک مثال برای شما شرح دهم. فرض کنید می خواهید در مورد موضوع فوتبال مطلبی بنویسید. Topic یا موضوع کلی متن شما می شود «فوتبال».","حال فکر کنید می خواهید درباره کدم جنبه های فوتبال صحبت کنید؟ تاریخ فوتبال / مقایسه آن با دیگر ورزش ها / قوانین آن / بزرگترین فوتبالیستهای جهان و ...","هرکدام از این جنبه های مختلف یک عنوان فرعی و یک یا چند پاراگراف را به خود اختصاص می دهند."],
 ["مراحل نوشتن پاراگراف","ابتدا اصل مطلب را در اولین جمله پاراگراف تان بنویسید سپس شروع به شرح دادن آن کنید. جزئیات بیشتر را اضافه نمایید و یا به آن شاخ و برگ دهید.","البته باید دقت کنید تمام این موارد را باید فقط حول و حوش جمله اصلی بیان کنید. پس با توجه به این توضیحات راحت‌ترین راه این است که قبل از شروع مقاله و یا متن خود یک طرح کلی از آن داشته باشید و تصمیم بگیرید درباره کدام جنبه های موضوع قرار است صحبت کنید.","حتی قبل از شروع شرح پاراگراف ها بهتر است چیدمان موضوع را نیز مشخص کنید. یعنی بدانید کدام جنبه و موضوع فرعی اول بیاید، کدام دوم و ... ."],
 ["تعیین چیدمان موضوع","و تصمیم بگیرید به هر کدام چقدر قرار است شاخ و برگ دهید. یعنی کلمات و جملات کلیدی هر پاراگراف یا عنوان فرعی را از قبل مشخص کنید.","۱) فوتبال اولین بار در کجا و چه زمانی بازی شد. ۲) این ورزش چگونه به کشورهای دیگر راه یافت. ۳) به مرور زمان چه تغییراتی در نحوه بازی آن رخ داد. ۴) تفاوت این ورزش با دیگر ورزش ها در چیست.",""],
 ["جملات پشتیبان (Supporting sentences)","علاوه بر جمله موضوعی (topic sentence) یک پاراگراف از جملات دیگری هم تشکیل می شود. این جملات به بسط و شرح جمله موضوعی می پردازند. به این جملات supporting sentence می گویند.","جملات ساپورت به توضیح و تکمیل جمله موضوع یا Topic Sentence می پردازند. به طور مشخص، این جملات نتایج (Results)، واقعیت‌ها (Facts)، مثال ها (Examples)، دلایل (Reasons) یا آمار (Statistics) یا هر چیز دیگری که نشان دهد ایده شما درست است به توضیح و بحث درباره جمله تاپیک می پردازند.","یک پاراگراف همیشه یک topic sentence دارد اما تعداد supporting sentence ها معمولاً بیشتر از دو جمله است. غیر از supporting sentence ها، همه جملات دیگر یک پاراگراف topic sentence هستند."],
 ["جمله نتیجه‌گیری (Concluding Sentence)","یک جمله نتیجه در پاراگراف می تواند برای پایان دادن به پاراگراف راه‌بستگی استفاده شود. این جمله به خواننده نکات مهم را یادآوری می کند. این جمله در واقع پارافرایز (Paraphrase) جمله موضوع یا Topic Sentence است.","جملات نتیجه گیری اختیاری هستند و در بیشتر مواقع پاراگراف ها فاقد جملات نتیجه گیری هستند.",""],
 ["مثال برای موارد فوق","Studying abroad (topic) has two main benefits (controlling idea).","ترجمه فارسی: تحصیل در خارج دو فایده دارد.",""],
 ["جملات پشتیبان برای Studying Abroad","به عنوان مثال به جملات پشتیبان زیر که درباره تاپیک درس خواندن در خارج می پردازند دقت کنید: اولین ایده جمله پشتیبان People get a better job when they return home (دلیل Better qualifications and experience mean better pay and promotion / نتیجه Now has a high standard of living) / دومین ایده جمله پشتیبان Students gain independence (مثال Students have to cope with the challenges of living alone and meeting new people from different cultures / نتیجه Students will become more confident in their life and relationships)","—",""]
];
grammar[31]=[
 ["خلاصه نویسی","در مورد خلاصه نویسی زبان، مطلب خاصی برای گفتن ندارم، فقط حتماً مراحل زیر را پیش از پیش از خلاصه نویسی رعایت کنید.","—",""],
 ["۱) یادداشت برداری","برای یادداشت برداری ابتدا باید بدانید که کل کتاب درباره چه موضوعی صحبت می کند و قرار است به شما چه مطالبی را آموزش دهد، پس بهتر است قبل از خلاصه نویسی ابتدا یک بار کل درس را با دقت بخوانید و لغات، نکات مهم و قواعد مهم (صفت، قید، کلمات ربط، کلمات کمکی، افعال، حرف تعریف the و ضمایر موصولی) را مشخص کنید و بعد از مشخص کردن لغت ها و نکات مهم و کلیدی درس، کمی نئست بزنید و دوباره سراغ متن کتاب بروید. این بار لغت ها را در قسمتی از خلاصه و قواعد را در قسمتی دیگر از خلاصه خود وارد کنید.","—",""],
 ["۲) یادداشت برداری از مطالب","برای یادداشت برداری باید مطالب را درک کنیم و سپس از استنباط خودمان شروع به نوشتن مطالب کلیدی نماییم. یعنی یادداشت برداری فقط با کلمات قابل فهم و به زبان خودمان باشد و لغات کتاب را خلاصه نکنیم و نکات اساسی را بیان کنیم یعنی یادداشت ها اصلاً باز نویسی مطالب نباشد بلکه چکیده و استنتاج مطالب به صورت کلمات کلیدی باشد به طوری که با دیدن کلمه مفهوم فوق به یادمان بیاید.","—",""],
 ["۳) یادداشت نکات پراکنده","می‌توانید یک قسمت از خلاصه‌نویسی زبان انگلیسی را به نکته‌های پراکنده اختصاص دهید. مثلاً نکته‌هایی که در متن درس‌ها به آن برمی‌خورید یا مثلاً نکته‌های ترکیبی و ...","—",""],
 ["۴) زمان خلاصه نویسی","وقتی خلاصه نوشتید، سعی کنید حداقل هفته‌ای ۲ روز و روزی ۴۵ دقیقه خلاصه‌نویسی زبان و بخصوص لغت‌ها را مرور کنید. آن قدر این کار را انجام دهید تا تقریباً تمام کلمه‌ها را با کاربردشان حفظ شوید.","—",""],
 ["۵) معانی مختلف لغت","برای اینکه دایره لغتتان وسیع‌تر شود و لغات بیشتری را بیاموزید بهتر است بعد از نوشته خلاصه برای هر لغت سعی کنید حتماً معانی مختلف آن را بیاورید و حتی یک مثال نیز از هر کدام بزنید. سعی کنید اگر هم معنی یا متضادی نیز برای آن می‌شناسید یا در جایی دیدید حتماً بنویسید.","—",""],
 ["۶) نمودارهای مختلف","از نمودارهای مختلف در نوشته‌های خود استفاده کنید. از نمودارهای خطی، زنجیری و پله‌ای بیشتر برای یادداشت‌هایی استفاده کنید که یا رابطه علت و معلولی دارند یا تقدم و تأخر آنها مهم است.","—",""],
 ["۷) اصل اساسی","اصل اساسی در هر گونه یادداشت برداری حذف توضیحات اضافی و اهمیت سنجی مطالب است. برای این منظور باید اصل و فرع مطالب را از هم تشخیص دهید.","—",""],
 ["۸) تمرین خلاصه نویسی","یکی از راه‌های موفقیت، یادداشت خلاصه برداری کردن از روی هاست برای این کار تمرین خلاصه نویسی کنید.","—",""],
 ["۹) هدفمند بودن","بخاطر داشته باشید که هر گونه یادداشت برداری باید هدفمند باشد. یعنی پاسخگوی نیازی یا جوابگوی سوالی باشد.","—",""],
 ["۱۰) قابل حمل بودن","یادداشت‌هایتان را به گونه ای ترتیب دهید که قابل حمل باشد و به سهولت بتواند مورد استفاده قرار گیرد. بنابراین استفاده از سررسید و سالنامه‌ها را توصیه نمی‌کنیم.","—",""],
 ["۱۱) اوراق جداگانه","بهترین وضعیت برای یادداشت برداری آن است که آنها را روی اوراقی جداگانه و بهم پیوسته بنویسیم تا اگر نیازی به چک و اصلاح آن بود بتوانیم با بازنویسی آن دوباره به مجموعه ای قابل قبول برسیم.","—",""],
 ["۱۲) منبع یادگیری","به طور کلی خلاصه نویسی مهم‌ترین منبع یادگیری می باشد زیرا می‌توانید همیشه خلاصه درس خود را به همراه داشته باشید و در اوقات فراغت یا دوره فراموش کردن لغتی از آن استفاده کنید و در ضمن وقتی می‌توانید مطالب را خلاصه بنویسید یعنی آن را درست فهمیده‌اید زیرا با نوشتن بسیاری از ابهامات رفع می‌شود.","—",""],
 ["۱۳) ساختار درختی","یادگیری زبان انگلیسی دغدغه بسیاری از ماست پس سعی کنید کلمات مهم را بزرگتر یا با خودکار رنگی بنویسید و بین موضوعات اصلی و فرعی را به کمک ساختار درختی نمایش دهید. هرچه زمان بیشتری برای ساختار درختی در نظر گرفته شود بهتر است چون به درک بهتر کمک می‌کند.","—",""],
 ["۱۴) مفهومی شدن","سوالات و تست‌ها به سمت مفهومی شدن حرکت می‌کنند پس همه مطالب خوانده شود.","—",""],
 ["۱۵) مرور","تکرار در فواصل زمانی مشخص باعث ذخیره در حافظه موقت و انتقال آن به حافظه دائمی می‌شود. این مرور در مراحل زیر انجام می‌شود: اولین مرور ده دقیقه بعد از یک مطالعه یک ساعته می‌باشد / دومین مرور روز بعد و به مدت ۳ تا ۴ دقیقه صورت می‌گیرد / سومین مرور یک هفته بعد و در پایان هر ماه مرور کلی باعث می‌شود ۹۵ درصد مطالب در حافظه بلند جایگزین شود.","—",""],
 ["ضرب المثل‌های کتاب‌های زبان انگلیسی","The early bird catches the first worm. (سحر خیز باش تا کامروا شوی) / Better be alone than in bad company (از همنفسی که رنج دل خواهی برد، حقا که هزار بار تنهایی به) / Fall from a frying pan into the fire (از چاله درآمد به چاه افتاد) / Actions speak louder than words (دو صد گفته چون نیم کردار نیست) / A word is enough to the wise (از این به نصیحت نگوید کست، اگر عاقلی یک اشارت بست)","—",""],
 ["ضرب المثل‌های بیشتر","Don't teach your grandmother to suck eggs (مادر مرده را شیون میاموز) / Art is long, life is short (عمر کم، فصل ادب بسیار است) / Clothes do not make the man (نه همین لباس زیباست نشان آدمیت) / God never sends mouths but He sends meat (هر آنکس که دندان دهد نان دهد) / Stretch your leg according to your coverlet (پایت را به اندازه گلیمت دراز کن) / Knowledge is the power (توانا بود هر که دانا بود، ز دانش دل پیر برنا بود) / A golden key opens every door (هر که را زور در ترازوست، زور در بازوست) / There is something in the wind (کاسه‌ای زیر نیم کاسه است) / A fox without tail wants others too without (خرمن سوخته خرمن سوخته خواهد) / God helps those who help themselves (از تو حرکت از خدا برکت) / Friends may meet, but mountains never greet (کوه به کوه نرسد، آدمی به آدمی رسد) / The end makes all equal (خواجه در ابریشم و ما در گلیم، عاقبت ای دل همه یکسر گلیم) / A blind man's wife needs no paint (سر کچل شانه نمی‌خواهد) / An idle brain is the devil's workshop (بی‌کاری به که بی‌کاری) / The best fish swim near the bottom (سعدی به لب دریا در دانه کجا یابی، در کام نهنگان رو گر می‌طلبی کاملی) / Habit is second nature (توبه گرگ مرگ است) / Too many cooks, spoil the broth (آشپز که دوتا شد، آش یا شور می‌شود یا بی‌نمک) / Absence makes the heart grow fonder (زان عزیز است آفتاب که او گاه پیدا و گاه ناپیداست) / There is a time to speak and a time to be silent (دو چیز طیره عقل است، دم فروبستن به وقت گفتن و گفتن به وقت خاموشی) / Never judge a book with its cover (نه همین لباس زیباست نشان آدمیت) / Any port in a storm (در بیابان کفش کهنه نعمت است) / Union is strength (بنی آدم اعضای یک پیکرند، که در آفرینش ز یک گوهرند) / Travel broadens the mind (بسیار سفر باید تا پخته شود خامی) / An ass is but an ass, though laden with gold (خر ار جل اطلس بپوشد خر است) / Charity begins at home (چراغی که به خانه رواست به مسجد حرام است) / Practice makes perfect (کار نیکو کردن از پر کردن است) / Birds of a feather flock together (کبوتر با کبوتر، باز با باز) / Easy come easy go (باد آورده را باد می‌برد) / Two heads are better than one (هر سری عقلی دارد) / Don't count your chickens before they hatch (جوجه را آخر پاییز می‌شمارند) / Out of sight out of mind (از دل برود هر آنکه از دیده برود) / Cut your coat according to your cloth (پارچه اندازه گلیم خود دراز کن) / A burnt child dreads the fire (مار گزیده از ریسمان سیاه و سفید می‌ترسد) / Kill two birds with a stone (با یک تیر دو نشان زدن) / Don't look a gift horse in the mouth (دفان اسب پیش کشی را نمی‌شمارند) / Money doesn't grow on trees (پول علف خرس نیست) / There is no place like home (هیچ جایی خانه خود آدم نمی‌شود) / Absence makes the heart grow fonder (دوری و دوستی) / A friend in need is a friend indeed (دوست آن باشد که گیرد دست دوست، در پریشان حالی و درماندگی) / No gain, no pain (نابرده رنج گنج میسر نمی‌شود)","—",""],
 ["مجهول کردن افعال Modal","زمانی که بخواهیم جمله دارای افعال مدال را مجهول کنیم فقط کافی است: 1) شناسایی فاعل، فعل و مفعول جمله معلوم 2) حذف فاعل و آوردن مفعول به اول جمله 3) اضافه نمودن be به افعال مدال موجود در جمله 4) فعل اصلی جمله را به P.P تبدیل می‌کنیم.","—",""],
 ["نکته های گرامری مهم - الف","فعلهایی که بعدازافعال modal می آیند بدون استثنا ساده بوده و ing, to, ed, s, es نمی‌گیرند.","—",""],
 ["نکته های گرامری مهم - ب","فعلهای modal مانند فعلهای کمکی در جمله عمل کرده و همیشه بین فاعل و فعل اصلی ساده می آیند.","—",""],
 ["نکته های گرامری مهم - ج","برای سوالی و منفی کردن جملاتی که دارای افعال modal هستند دیگر نیازی به فعل اصلی نبوده و با همان فعلهای modal جمله سوالی و منفی می‌شود.","—",""],
 ["نکته های گرامری مهم - د","فعلهای modal قسمت سوم یا همان p.p ندارند.","—",""],
 ["Past Perfect Tense (ماضی بعید)","زمان گذشته کامل یا ماضی بعید (past perfect tense) یکی از زمان‌های ۱۲ گانه اصلی در زبان انگلیسی است. زمان گذشته کامل از نظر ساختاری و همچنین معنی‌ای و کاربردی نیاز به دقت دارد. چرا که معمولاً در کنار زمانهای دیگر به کار می‌رود و در حضور زمانهای دیگر معنا پیدا می‌کند، همچنین در این زمان شکل سوم فعل یا past participle یا وجه وصفی گذشته است.","—",""],
 ["ساختار ماضی بعید","فعل این زمان با استفاده از فعل کمکی had و قسمت سوم فعل past participle ساخته می‌شود. همانند زمان حال کامل (ماضی نقلی) یا آینده کامل، در این زمان نیز قسمت سوم فعل با استفاده از اضافه کردن ed یا d به آخر افعال با قاعده ساخته می‌شود در حالی که قسمت سوم فعل افعال بی قاعده از قواعد خاصی پیروی نمی‌کند.","—",""],
 ["کلمات ربطی ماضی بعید","کلمات ربطی که بیشتر در این زمان استفاده می‌شوند عبارتند از: When / Before / Because / As soon as / After","—",""],
 ["جدول زمان گذشته کامل","جملات مثبت: They had practiced together before they gave the concert. / جملات منفی: They hadn't practiced together before they gave the concert. / جملات سوالی: Had they practiced together before they gave the concert?","—",""],
 ["کاربردهای ماضی بعید - الف","برای بیان عمل یا کاری که در گذشته قبل از عمل دیگری اتفاق افتاده باشد از گذشته کامل (ماضی بعید) استفاده می‌شود که نیازمند دو عمل است: عملی که در گذشته دورتر انجام شده به شکل بعید و عملی که بعدا انجام شده به شکل گذشته ساده بیان می‌شوند.","When my little baby brother got up, I had eaten my breakfast. / My mother had gone shopping before she started cooking dinner.",""],
 ["نکته ۱ ماضی بعید","اگر بخواهیم به مقایسه گذشته ساده و ماضی بعید اشاره کنیم، می‌توان گفت اگر دو عمل در گذشته پشت سر هم یا با فاصله کوتاهی انجام شده باشند هر دو عمل به شکل گذشته ساده بیان می‌شوند و اگر عملی در گذشته قبل از عمل دیگر با فاصله انجام شده باشد از گذشته بعید استفاده می‌شود.","When I arrived at the airport, the plane had landed. / When I arrived at the airport, the plane landed.",""],
 ["نکته ۲ ماضی بعید","اگر چندین عمل در گذشته با فاصله کم یا یکی پس از دیگری اتفاق افتاده باشد از گذشته ساده استفاده می‌کنیم نه ماضی بعید.","I arrived home at 1:30, ate my lunch, took a nap, and did my homework.",""],
 ["کاربرد ب ماضی بعید","برای بیان عمل یا حالتی که در گذشته شروع شده و تا انجام دادن عمل دیگر در گذشته ادامه داشته است.","My teacher had lived in Paris before he studied art there. / By the time his uncle got a very good job, he had taken many risks.",""],
 ["کاربرد ج ماضی بعید","برای بیان عمل یا حالتی که در زمان مشخص در گذشته اتفاق افتاده است علاوه بر گذشته ساده از ماضی بعید نیز می‌توان استفاده کرد. کلمات تعیین کننده هستند که کدام عمل ابتدا انجام شده است.","I sent an email on October 7th before she asked me on October 10th. / I had sent an email on October 7th before she asked me on October 10th.",""],
 ["نکته ۳ ماضی بعید","اما اگر ماضی بعید به انجام دادن عملی در گذشته در زمانی مشخص اشاره نکند، نمی‌توان از آن استفاده کرد. این بدان معنی است که ما مفهوم دیگری جز انجام دادن عملی در گذشته در زمان مشخص را داریم.","نادرست: He never drove a car before he got his driving license. درست: He had never driven a car before he got his driving license.",""],
 ["صرف فعل در زمان ماضی بعید","جملات مثبت خبری: I had gone to the cinema before 8. / جملات منفی: I had not / hadn't gone to the cinema before 8. / جملات سوالی: Had I gone to the cinema before 8?","—",""],
 ["مثال‌های بیشتر ماضی بعید","After she'd gone home, she turned on the TV. / Her father hadn't had a day off for weeks. / The teacher didn't check our homework until everyone had arrived. / They hadn't studied well for the test because they didn't take it seriously. / I'd been a professional chess player before my friend gave me a chess set. / You'd given a lot of money to charity before.","—",""],
 ["Contractions ماضی بعید","منفی: I hadn't, You hadn't, He hadn't, She hadn't, It hadn't, We hadn't, They hadn't / مثبت: I'd, You'd, He'd, She'd, It'd, We'd, They'd","—",""]
];

function getWordKey(grade,lessonNumber){
 if(grade===7) return lessonNumber-1;
 if(grade===8) return 8+lessonNumber;
 if(grade===9) return 15+lessonNumber;
 if(grade===10) return 21+lessonNumber;
 if(grade===11) return 25+lessonNumber;
 if(grade===12) return 28+lessonNumber;
 return null;
}
function getWords(grade,lessonNumber){
 const k=getWordKey(grade,lessonNumber);
 if(k===null)return [];
 return (words&&words[k])?words[k]:[];
}
function getGrammar(grade,lessonNumber){
 const k=getWordKey(grade,lessonNumber);
 if(k===null)return [];
 return (grammar&&grammar[k])?grammar[k]:[];
}

function speak(text){
 if(!window.speechSynthesis){alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";u.rate=.75;
 speechSynthesis.resume();speechSynthesis.speak(u);
}
function speakAll(letter,examples){
 if(!window.speechSynthesis){alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");return}
 speechSynthesis.cancel();
 const u1=new SpeechSynthesisUtterance(letter);
 u1.lang="en-US";u1.rate=.7;
 u1.onend=function(){
  const u2=new SpeechSynthesisUtterance(examples);
  u2.lang="en-US";u2.rate=.7;
  speechSynthesis.speak(u2);
 };
 speechSynthesis.resume();
 speechSynthesis.speak(u1);
}

function calculateLevel(xp){return Math.max(1,Math.floor(Number(xp||0)/100)+1)}
function xpForLevel(level){return (level-1)*100}

async function loadStudentStats(){
 if(!S.student)return;
 S.xp=0;S.level=1;S.progress={};S.achievements=[];S.exams=[];
 try{const r=await db.from("student_xp").select("xp,level").eq("student_id",S.student.id).maybeSingle();if(r.data){S.xp=Number(r.data.xp||0);S.level=Number(r.data.level||calculateLevel(S.xp))}}catch(e){}
 try{const r=await db.from("student_progress").select("lesson_id,progress,completed").eq("student_id",S.student.id);(r.data||[]).forEach(x=>S.progress[x.lesson_id]={progress:Number(x.progress||0),completed:Boolean(x.completed)})}catch(e){}
 try{const r=await db.from("student_achievements").select("achievement_key,title").eq("student_id",S.student.id);S.achievements=r.data||[]}catch(e){}
 try{const r=await db.from("exam_results").select("*").eq("user_id",S.student.auth_user_id).order("created_at",{ascending:false});S.exams=r.data||[]}catch(e){}
}
async function addXP(amount){
 if(!S.student)return;
 const old=S.xp;S.xp+=Number(amount||0);S.level=calculateLevel(S.xp);
 try{await db.from("student_xp").upsert({student_id:S.student.id,xp:S.xp,level:S.level,updated_at:new Date().toISOString()},{onConflict:"student_id"})}catch(e){}
 if(S.level>calculateLevel(old))await unlockAchievement("level_"+S.level,"رسیدن به Level "+S.level);
}
async function unlockAchievement(key,title){
 if(!S.student||S.achievements.some(x=>x.achievement_key===key))return;
 try{const r=await db.from("student_achievements").insert({student_id:S.student.id,achievement_key:key,title});if(!r.error)S.achievements.push({achievement_key:key,title})}catch(e){}
}
async function saveProgress(lessonId,progress,completed){
 if(!S.student)return;
 S.progress[lessonId]={progress,completed};
 try{await db.from("student_progress").upsert({student_id:S.student.id,lesson_id:lessonId,progress,completed,completed_at:completed?new Date().toISOString():null},{onConflict:"student_id,lesson_id"})}catch(e){}
}
