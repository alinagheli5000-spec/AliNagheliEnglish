<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f5f3ff;color:#1f2937}
body{min-height:100vh}
button,input{font-family:inherit}
.hidden{display:none!important}

#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.login-box{
width:100%;max-width:430px;background:#fff;border-radius:28px;padding:30px 24px;
box-shadow:0 15px 50px #4c1d9530
}

.logo{
width:85px;height:85px;border-radius:25px;background:linear-gradient(135deg,#7c3aed,#4f46e5);
color:#fff;display:flex;align-items:center;justify-content:center;
font-size:30px;font-weight:bold;margin:0 auto 18px;
box-shadow:0 10px 25px #6d28d950
}

h1{text-align:center;margin:8px 0;font-size:25px;color:#4c1d95}
.subtitle{text-align:center;color:#6b7280;margin-bottom:25px;font-size:14px}

.tabs{display:flex;background:#f3f0ff;padding:5px;border-radius:15px;margin-bottom:20px}
.tabs button{
flex:1;border:0;background:transparent;padding:12px;border-radius:11px;
cursor:pointer;color:#6b7280;font-weight:bold
}
.tabs button.active{background:#6d28d9;color:#fff}

.field{margin-bottom:15px}
.field label{display:block;font-size:13px;margin-bottom:7px;font-weight:bold}
.field input{
width:100%;border:1px solid #ddd6fe;border-radius:13px;padding:13px;
font-size:15px;outline:none;direction:ltr;text-align:left
}
.field input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px #7c3aed18}

.login-btn{
width:100%;border:0;border-radius:14px;padding:14px;
background:linear-gradient(135deg,#7c3aed,#5b21b6);
color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:5px
}
.login-btn:disabled{opacity:.6}

.message{
margin-top:15px;padding:11px;border-radius:12px;font-size:13px;text-align:center;display:none
}
.message.error{display:block;background:#fee2e2;color:#991b1b}
.message.success{display:block;background:#dcfce7;color:#166534}

#dashboard{min-height:100vh;width:100%;background:#f8f7ff}

.topbar{
height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;
padding:0 20px;box-shadow:0 2px 15px #0000000b;position:sticky;top:0;z-index:10
}

.brand{font-size:20px;font-weight:bold;color:#5b21b6}
.logout{
border:0;background:#ede9fe;color:#5b21b6;padding:9px 15px;
border-radius:10px;cursor:pointer;font-weight:bold
}

.content{max-width:1100px;margin:auto;padding:25px 18px}

.welcome{
background:linear-gradient(135deg,#6d28d9,#4f46e5);color:white;
border-radius:22px;padding:25px;margin-bottom:20px
}
.welcome h2{margin:0 0 8px}

.stats{
display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px
}
.stat{
background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #00000008
}
.stat strong{display:block;font-size:25px;color:#6d28d9;margin-bottom:5px}
.stat span{font-size:12px;color:#6b7280}

.card{
background:#fff;border-radius:20px;padding:20px;
box-shadow:0 5px 20px #00000008;margin-bottom:18px
}
.card h3{margin-top:0;color:#4c1d95}

.student{
border:1px solid #ede9fe;border-radius:15px;padding:15px;margin-bottom:10px;
display:flex;justify-content:space-between;align-items:center;gap:10px
}
.student-name{font-weight:bold}
.badge{padding:6px 10px;border-radius:20px;font-size:11px;background:#ede9fe;color:#5b21b6}
.empty{text-align:center;color:#9ca3af;padding:25px}

.info-row{
display:flex;justify-content:space-between;align-items:center;
padding:14px 0;border-bottom:1px solid #f3f4f6;gap:15px
}
.info-row:last-child{border-bottom:0}
.info-label{font-weight:bold}
.info-value{color:#4b5563}

.loading{
text-align:center;padding:35px;color:#6b7280
}

@media(max-width:600px){
.stats{grid-template-columns:1fr}
.topbar{padding:0 12px}
.content{padding:18px 12px}
}
</style>
</head>

<body>

<div id="app">

<div id="loginPage" class="login-box">

<div class="logo">AN</div>

<h1>AliNagheli English</h1>
<div class="subtitle">سامانه آموزش زبان انگلیسی</div>

<div class="tabs">
<button id="studentTab" class="active" type="button">زبان‌آموز</button>
<button id="adminTab" type="button">مدیر</button>
</div>

<form id="loginForm">

<div class="field">
<label id="usernameLabel">شماره موبایل</label>
<input
id="username"
type="text"
inputmode="tel"
autocomplete="username"
placeholder="09123456789"
required>
</div>

<div class="field">
<label>رمز عبور</label>
<input
id="password"
type="password"
autocomplete="current-password"
placeholder="رمز عبور"
required>
</div>

<button id="loginBtn" class="login-btn" type="submit">ورود</button>

</form>

<div id="message" class="message"></div>

</div>

</div>

<div id="dashboard" class="hidden">

<div class="topbar">
<div class="brand">AliNagheli English</div>
<button id="logoutBtn" class="logout" type="button">خروج</button>
</div>

<div class="content">

<div class="welcome">
<h2 id="welcomeTitle">خوش آمدید 🌟</h2>
<div id="welcomeText">به سامانه AliNagheli English خوش آمدید.</div>
</div>

<div id="adminPanel" class="hidden">

<div class="stats">

<div class="stat">
<strong id="waitingCount">0</strong>
<span>در صف انتظار</span>
</div>

<div class="stat">
<strong id="registeredCount">0</strong>
<span>ثبت‌نام شده</span>
</div>

<div class="stat">
<strong id="graduateCount">0</strong>
<span>فارغ‌التحصیل</span>
</div>

</div>

<div class="card">
<h3>زبان‌آموزان</h3>
<div id="studentsList"></div>
</div>

</div>

<div id="studentPanel" class="hidden">

<div class="card">
<h3>اطلاعات زبان‌آموز</h3>
<div id="studentInfo"></div>
</div>

</div>

</div>
</div>

<script>
"use strict";

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";


/* =========================================================
   STATE
========================================================= */

let loginType = "student";
let currentSession = null;
let currentStudent = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loginPage = document.getElementById("loginPage");
const dashboard = document.getElementById("dashboard");

const loginForm = document.getElementById("loginForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");

const messageBox = document.getElementById("message");

const studentTab = document.getElementById("studentTab");
const adminTab = document.getElementById("adminTab");

const usernameLabel = document.getElementById("usernameLabel");

const adminPanel = document.getElementById("adminPanel");
const studentPanel = document.getElementById("studentPanel");

const welcomeTitle = document.getElementById("welcomeTitle");
const welcomeText = document.getElementById("welcomeText");

const logoutBtn = document.getElementById("logoutBtn");


/* =========================================================
   PHONE NORMALIZATION
========================================================= */

function normalizePhone(value){

let s = String(value || "").trim();

const persian =
"۰۱۲۳۴۵۶۷۸۹";

const arabic =
"٠١٢٣٤٥٦٧٨٩";

for(let i=0;i<10;i++){

s = s.replaceAll(
persian[i],
String(i)
);

s = s.replaceAll(
arabic[i],
String(i)
);

}

s = s.replace(/[^\d+]/g,"");

if(s.startsWith("+98")){
s = "0" + s.slice(3);
}

if(s.startsWith("0098")){
s = "0" + s.slice(4);
}

if(s.startsWith("98") && s.length === 12){
s = "0" + s.slice(2);
}

return s;
}


/* =========================================================
   AUTH EMAIL
========================================================= */

function studentEmail(phone){

const normalized =
normalizePhone(phone);

return normalized +
"@alinagheli.com";
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type="error"){

messageBox.textContent = text;
messageBox.className =
"message " + type;

}

function clearMessage(){

messageBox.textContent = "";
messageBox.className = "message";

}


/* =========================================================
   LOGIN TYPE
========================================================= */

function setLoginType(type){

loginType = type;

studentTab.classList.toggle(
"active",
type === "student"
);

adminTab.classList.toggle(
"active",
type === "admin"
);

usernameLabel.textContent =
type === "student"
? "شماره موبایل"
: "نام کاربری مدیر";

usernameInput.placeholder =
type === "student"
? "09123456789"
: "admin";

usernameInput.value = "";
passwordInput.value = "";

clearMessage();

}

studentTab.addEventListener(
"click",
() => setLoginType("student")
);

adminTab.addEventListener(
"click",
() => setLoginType("admin")
);


/* =========================================================
   SUPABASE AUTH REQUEST
========================================================= */

async function authLogin(email,password){

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
}
);

const raw =
await response.text();

let data = {};

try{
data = raw ? JSON.parse(raw) : {};
}catch{
data = {};
}

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"Invalid login credentials"
);

}

if(!data.access_token){

throw new Error(
"Authentication failed"
);

}

return data;
}


/* =========================================================
   REST REQUEST
========================================================= */

async function supabaseRequest(
path,
options={}
){

const headers = {
"apikey":SUPABASE_KEY,
"Content-Type":"application/json",
"Accept":"application/json",
...(options.headers || {})
};

if(currentSession &&
currentSession.access_token){

headers.Authorization =
"Bearer " +
currentSession.access_token;

}else{

headers.Authorization =
"Bearer " +
SUPABASE_KEY;

}

const response =
await fetch(
SUPABASE_URL + path,
{
...options,
headers
}
);

const raw =
await response.text();

let data = null;

try{
data = raw ? JSON.parse(raw) : null;
}catch{
data = raw;
}

if(!response.ok){

throw new Error(
(data && (
data.message ||
data.error_description ||
data.hint ||
data.details
)) ||
"Server request failed"
);

}

return data;

}


/* =========================================================
   FIND STUDENT
========================================================= */

async function findStudent(phone){

const normalized =
normalizePhone(phone);

if(!normalized){
throw new Error("شماره موبایل نامعتبر است.");
}

const url =
"/rest/v1/students" +
"?select=*" +
"&phone=eq." +
encodeURIComponent(normalized) +
"&limit=1";

let students =
await supabaseRequest(url);

if(students && students.length){
return students[0];
}


/*
  اگر شماره در دیتابیس با فرمت متفاوت ذخیره شده باشد،
  یک جستجوی دوم انجام می‌دهیم.
*/

const all =
await supabaseRequest(
"/rest/v1/students?select=*"
);

const found =
(Array.isArray(all) ? all : [])
.find(
s =>
normalizePhone(s.phone) === normalized
);

return found || null;

}


/* =========================================================
   STUDENT LOGIN
========================================================= */

async function studentLogin(phone,password){

const normalized =
normalizePhone(phone);

if(!/^09\d{9}$/.test(normalized)){

throw new Error(
"شماره موبایل باید به صورت 09123456789 وارد شود."
);

}


/*
  ایمیل داخلی همان ایمیلی است که برای
  حساب زبان‌آموز ساخته شده است.
*/

const email =
studentEmail(normalized);

const auth =
await authLogin(
email,
password
);

currentSession = auth;


/*
  بعد از Auth، دانش‌آموز را پیدا می‌کنیم.
*/

const student =
await findStudent(normalized);

if(!student){

throw new Error(
"حساب زبان‌آموز پیدا نشد."
);

}


/*
  اگر حساب منتظر تأیید باشد، اجازه ورود نمی‌دهیم.
*/

const status =
String(student.status || "")
.toLowerCase();

if(
status === "waiting" ||
status === "pending"
){

throw new Error(
"ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
);

}

currentStudent = student;

saveSession(
"student",
student,
auth
);

openStudentDashboard(
student
);

}


/* =========================================================
   ADMIN LOGIN
========================================================= */

async function adminLogin(username,password){

let value =
String(username || "").trim().toLowerCase();

let email = value;

if(!email.includes("@")){

email =
value +
"@alinagheli.com";

}

const auth =
await authLogin(
email,
password
);

currentSession = auth;

saveSession(
"admin",
auth.user || {},
auth
);

openAdminDashboard();

}


/* =========================================================
   SAVE SESSION
========================================================= */

function saveSession(type,data,auth){

const payload = {
type:type,
data:data,
access_token:auth.access_token,
refresh_token:auth.refresh_token,
expires_at:auth.expires_at || null
};

localStorage.setItem(
"alinagheli_session",
JSON.stringify(payload)
);

}


/* =========================================================
   CLEAR SESSION
========================================================= */

function clearSession(){

currentSession = null;
currentStudent = null;

localStorage.removeItem(
"alinagheli_session"
);

}


/* =========================================================
   LOGIN FORM
========================================================= */

loginForm.addEventListener(
"submit",
async function(event){

event.preventDefault();

clearMessage();

const user =
usernameInput.value.trim();

const pass =
passwordInput.value;

if(!user || !pass){

showMessage(
"اطلاعات ورود را کامل وارد کنید."
);

return;

}

loginBtn.disabled = true;
loginBtn.textContent =
"در حال ورود...";

try{

if(loginType === "student"){

await studentLogin(
user,
pass
);

}else{

await adminLogin(
user,
pass
);

}

}catch(error){

console.error(
"LOGIN ERROR:",
error
);

showMessage(
friendlyError(error)
);

}finally{

loginBtn.disabled = false;
loginBtn.textContent = "ورود";

}

});


/* =========================================================
   FRIENDLY ERRORS
========================================================= */

function friendlyError(error){

const text =
String(error?.message || error || "");

if(
text.toLowerCase().includes(
"invalid login credentials"
)
){

return "شماره موبایل یا رمز عبور اشتباه است.";

}

if(
text.toLowerCase().includes(
"failed to fetch"
)
){

return "ارتباط با سرور برقرار نشد. دوباره تلاش کنید.";

}

if(
text.toLowerCase().includes(
"email not confirmed"
)
){

return "ایمیل حساب هنوز تأیید نشده است.";

}

if(
text.toLowerCase().includes(
"student not found"
)
){

return "اطلاعات زبان‌آموز پیدا نشد.";

}

return text ||
"ورود ناموفق بود.";

}


/* =========================================================
   ADMIN DASHBOARD
========================================================= */

async function openAdminDashboard(){

loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");

adminPanel.classList.remove("hidden");
studentPanel.classList.add("hidden");

welcomeTitle.textContent =
"سلام مدیر عزیز 👋";

welcomeText.textContent =
"مدیریت زبان‌آموزان AliNagheli English";

await loadStudents();

}


/* =========================================================
   STUDENT DASHBOARD
========================================================= */

function openStudentDashboard(student){

loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");

studentPanel.classList.remove("hidden");
adminPanel.classList.add("hidden");

const name =
(
student.first_name ||
"زبان‌آموز"
).trim();

welcomeTitle.textContent =
"سلام " +
name +
" 👋";

welcomeText.textContent =
"به پنل زبان‌آموزی خودت خوش آمدی.";

renderStudent(student);

}


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents(){

const list =
document.getElementById(
"studentsList"
);

list.innerHTML =
'<div class="loading">در حال دریافت اطلاعات...</div>';

try{

const students =
await supabaseRequest(
"/rest/v1/students?select=*&order=id.desc"
);

const safeStudents =
Array.isArray(students)
? students
: [];

const waiting =
safeStudents.filter(
s => {
const status =
String(s.status || "").toLowerCase();

return status === "waiting" ||
status === "pending";
}
).length;

const registered =
safeStudents.filter(
s =>
String(s.status || "").toLowerCase()
===
"registered"
).length;

const graduate =
safeStudents.filter(
s => {

const status =
String(s.status || "").toLowerCase();

return status === "graduate" ||
status === "graduated";

}
).length;

document.getElementById(
"waitingCount"
).textContent = waiting;

document.getElementById(
"registeredCount"
).textContent = registered;

document.getElementById(
"graduateCount"
).textContent = graduate;

if(!safeStudents.length){

list.innerHTML =
'<div class="empty">هنوز زبان‌آموزی ثبت نشده است.</div>';

return;

}

list.innerHTML =
safeStudents.map(
student => {

const name =
(
student.first_name || ""
) +
" " +
(
student.last_name || ""
);

const status =
student.status || "";

return `
<div class="student">

<div>
<div class="student-name">
${escapeHtml(
name.trim() || "بدون نام"
)}
</div>

<div style="
font-size:12px;
color:#6b7280;
margin-top:5px;
direction:ltr;
text-align:right;
">
${escapeHtml(
student.phone || ""
)}
</div>
</div>

<div class="badge">
${escapeHtml(
statusText(status)
)}
</div>

</div>
`;

}
).join("");

}catch(error){

console.error(
"STUDENTS ERROR:",
error
);

list.innerHTML =
'<div class="empty">دریافت اطلاعات با خطا مواجه شد.</div>';

}

}


/* =========================================================
   STUDENT INFO
========================================================= */

function renderStudent(student){

const info =
document.getElementById(
"studentInfo"
);

const fullName =
(
student.first_name || ""
) +
" " +
(
student.last_name || ""
);

const fields = [

[
"نام و نام خانوادگی",
fullName.trim() || "-"
],

[
"شماره موبایل",
student.phone || "-"
],

[
"سطح",
student.level || "-"
],

[
"وضعیت",
statusText(student.status)
],

[
"کتاب",
student.book || "-"
]

];

info.innerHTML =
fields.map(
field => {

return `
<div class="info-row">

<span class="info-label">
${escapeHtml(field[0])}
</span>

<span class="info-value">
${escapeHtml(
String(field[1])
)}
</span>

</div>
`;

}
).join("");

}


/* =========================================================
   STATUS
========================================================= */

function statusText(status){

const value =
String(status || "")
.toLowerCase();

switch(value){

case "waiting":
case "pending":
return "در صف انتظار";

case "registered":
return "ثبت‌نام شده";

case "graduate":
case "graduated":
return "فارغ‌التحصیل";

default:
return status || "نامشخص";

}

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
"click",
function(){

clearSession();

dashboard.classList.add("hidden");
loginPage.classList.remove("hidden");

usernameInput.value = "";
passwordInput.value = "";

setLoginType("student");

});



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   RESTORE SESSION
========================================================= */

async function restoreSession(){

const raw =
localStorage.getItem(
"alinagheli_session"
);

if(!raw){
return;
}

try{

const saved =
JSON.parse(raw);

if(
!saved ||
!saved.type ||
!saved.data
){

throw new Error(
"Invalid saved session"
);

}

if(saved.access_token){

currentSession = {
access_token:saved.access_token,
refresh_token:saved.refresh_token,
expires_at:saved.expires_at
};

}

if(saved.type === "student"){

currentStudent =
saved.data;

openStudentDashboard(
saved.data
);

}else if(saved.type === "admin"){

openAdminDashboard();

}else{

throw new Error(
"Unknown session"
);

}

}catch(error){

console.error(
"SESSION ERROR:",
error
);

clearSession();

}

}


/* =========================================================
   START
========================================================= */

setLoginType("student");

restoreSession();

</script>

</body>
</html>
