<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>AliNagheli English</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    Tahoma,
    Arial,
    sans-serif;
  background:#f7f5ff;
  color:#211b35;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

:root{
  --primary:#6d28d9;
  --primary2:#8b5cf6;
  --light:#f3e8ff;
  --bg:#f7f5ff;
  --card:#ffffff;
  --text:#211b35;
  --muted:#77718b;
  --green:#10b981;
  --red:#ef4444;
  --orange:#f59e0b;
  --border:#ece8f5;
  --shadow:0 8px 30px rgba(70,45,120,.08);
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  min-height:100vh;
}

.app-shell{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  position:relative;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:68px;
  padding:10px 16px;
  background:rgba(247,245,255,.94);
  backdrop-filter:blur(14px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(220,214,235,.6);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:43px;
  height:43px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
  box-shadow:0 7px 18px rgba(109,40,217,.25);
}

.brand-title{
  font-size:15px;
  font-weight:900;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  border:0;
  width:40px;
  height:40px;
  border-radius:13px;
  background:white;
  box-shadow:var(--shadow);
  font-size:18px;
}

/* =========================
   MAIN
========================= */

.main{
  padding:18px 15px 105px;
  min-height:calc(100vh - 68px);
}

.page{
  display:none;
  animation:pageIn .2s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   HERO
========================= */

.hero{
  background:linear-gradient(135deg,#5b21b6,#8b5cf6);
  color:white;
  border-radius:25px;
  padding:23px 20px;
  box-shadow:0 14px 35px rgba(109,40,217,.2);
  position:relative;
  overflow:hidden;
  margin-bottom:18px;
}

.hero:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  left:-45px;
  bottom:-65px;
}

.hero h1{
  margin:0;
  font-size:22px;
}

.hero p{
  margin:8px 0 0;
  font-size:13px;
  opacity:.9;
  line-height:1.8;
}

.xp-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
  font-size:12px;
}

.xp-bar{
  width:100%;
  height:8px;
  border-radius:20px;
  background:rgba(255,255,255,.2);
  margin-top:7px;
  overflow:hidden;
}

.xp-fill{
  height:100%;
  width:42%;
  background:white;
  border-radius:20px;
}

/* =========================
   TITLES
========================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:22px 2px 11px;
}

.section-title h2{
  font-size:16px;
  margin:0;
}

.section-title span{
  font-size:11px;
  color:var(--primary);
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:19px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.stat{
  padding:16px;
}

.stat-icon{
  font-size:23px;
  margin-bottom:9px;
}

.stat-number{
  font-size:21px;
  font-weight:900;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

/* =========================
   FEATURE CARDS
========================= */

.feature{
  padding:17px;
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:10px;
}

.feature-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--light);
  font-size:23px;
  flex-shrink:0;
}

.feature h3{
  margin:0;
  font-size:14px;
}

.feature p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.feature-arrow{
  margin-right:auto;
  color:#aaa;
}

/* =========================
   LESSONS
========================= */

.lesson{
  padding:17px;
  margin-bottom:10px;
}

.lesson-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.lesson-number{
  background:var(--light);
  color:var(--primary);
  padding:6px 10px;
  border-radius:10px;
  font-size:11px;
  font-weight:bold;
}

.lesson h3{
  font-size:14px;
  margin:13px 0 5px;
}

.lesson p{
  color:var(--muted);
  font-size:11px;
  margin:0;
}

.progress{
  height:7px;
  background:#eeeaf5;
  border-radius:10px;
  margin-top:13px;
  overflow:hidden;
}

.progress > div{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  border-radius:10px;
}

/* =========================
   VOCAB
========================= */

.word-card{
  padding:25px 20px;
  text-align:center;
}

.word-en{
  font-size:30px;
  font-weight:900;
  color:var(--primary);
}

.word-pron{
  direction:ltr;
  color:var(--muted);
  margin-top:8px;
  font-size:13px;
}

.word-fa{
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

.word-example{
  margin-top:18px;
  padding:13px;
  background:#faf8ff;
  border-radius:14px;
  direction:ltr;
  font-size:13px;
  line-height:1.7;
}

.sound-btn{
  border:0;
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--primary);
  color:white;
  font-size:22px;
  margin-top:18px;
  box-shadow:0 8px 20px rgba(109,40,217,.25);
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  border-radius:14px;
  padding:13px 17px;
  font-weight:bold;
  font-size:12px;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-light{
  background:var(--light);
  color:var(--primary);
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.btn-success{
  background:#d1fae5;
  color:#047857;
}

.full{
  width:100%;
}

/* =========================
   FORM
========================= */

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
}

.form-control{
  width:100%;
  border:1px solid var(--border);
  background:white;
  border-radius:13px;
  padding:13px;
  outline:none;
  font-size:13px;
  direction:rtl;
}

.form-control:focus{
  border-color:var(--primary2);
  box-shadow:0 0 0 3px rgba(139,92,246,.1);
}

/* =========================
   PROFILE
========================= */

.profile-head{
  text-align:center;
  padding:25px 15px;
}

.avatar{
  width:86px;
  height:86px;
  border-radius:50%;
  margin:auto;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:900;
}

.profile-name{
  font-size:19px;
  font-weight:900;
  margin-top:12px;
}

.profile-level{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at top,#ede9fe,transparent 45%),
    var(--bg);
}

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  padding:27px 21px;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(60,40,100,.12);
}

.login-logo{
  width:72px;
  height:72px;
  margin:0 auto 15px;
  border-radius:23px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:32px;
  font-weight:900;
}

.login-title{
  text-align:center;
  font-size:21px;
  font-weight:900;
}

.login-sub{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:7px 0 23px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  height:82px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid #ebe7f3;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-item{
  border:0;
  background:transparent;
  color:#8d879c;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  font-size:10px;
  font-weight:bold;
  border-radius:14px;
}

.nav-icon{
  font-size:21px;
  line-height:1;
}

.nav-item.active{
  color:var(--primary);
  background:#f4efff;
}

/* =========================
   ADMIN
========================= */

.admin-card{
  padding:15px;
  margin-bottom:10px;
}

.student-name{
  font-size:14px;
  font-weight:900;
}

.student-phone{
  direction:ltr;
  text-align:right;
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:9px;
  font-size:10px;
  font-weight:bold;
}

.badge-waiting{
  background:#fef3c7;
  color:#92400e;
}

.badge-registered{
  background:#d1fae5;
  color:#047857;
}

.badge-graduate{
  background:#e0e7ff;
  color:#3730a3;
}

.admin-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.admin-actions .btn{
  flex:1;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.spinner{
  width:32px;
  height:32px;
  border:3px solid #e9e2f7;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:auto;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:999;
  bottom:95px;
  left:50%;
  transform:translateX(-50%) translateY(15px);
  width:calc(100% - 35px);
  max-width:480px;
  background:#211b35;
  color:white;
  padding:13px 16px;
  border-radius:14px;
  font-size:12px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){
  body{
    background:#eae7f2;
  }

  .app-shell{
    box-shadow:0 0 50px rgba(0,0,0,.08);
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;
let currentStudent = null;

let state = {
  page:"home",
  xp:0,
  streak:0,
  lessons:0
};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function toast(message){
  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}

function escapeHTML(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   AUTH
========================================================= */

async function checkSession(){

  const {
    data:{
      session
    }
  } = await db.auth.getSession();

  if(session){

    currentUser = session.user;

    await loadStudent();

    renderApp();

  }else{

    renderLogin();

  }
}


async function login(){

  const phone =
    $("loginPhone").value.trim();

  const password =
    $("loginPassword").value;

  if(!phone || !password){

    toast("شماره موبایل و رمز عبور را وارد کنید");

    return;
  }

  const email =
    phone.replace(/\D/g,"") +
    "@alinagheli.app";

  const {
    data,
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    console.error(error);

    toast("شماره موبایل یا رمز عبور اشتباه است");

    return;
  }

  currentUser = data.user;

  await loadStudent();

  renderApp();

  toast("خوش آمدید 🌷");
}


async function logout(){

  await db.auth.signOut();

  currentUser = null;
  currentStudent = null;

  renderLogin();

  toast("با موفقیت خارج شدید");
}


/* =========================================================
   STUDENT
========================================================= */

async function loadStudent(){

  if(!currentUser){

    currentStudent = null;

    return;
  }

  const {
    data,
    error
  } = await db
    .from("students")
    .select("*")
    .eq("auth_user_id",currentUser.id)
    .maybeSingle();

  if(error){

    console.error("Student error:",error);

    return;
  }

  currentStudent = data;

}


/* =========================================================
   LOGIN SCREEN
========================================================= */

function renderLogin(){

  $("app").innerHTML = `

    <div class="login-screen">

      <div class="login-box">

        <div class="login-logo">
          AN
        </div>

        <div class="login-title">
          AliNagheli English
        </div>

        <div class="login-sub">
          سامانه آموزش زبان انگلیسی
        </div>

        <div class="form-group">

          <label>
            شماره موبایل
          </label>

          <input
            id="loginPhone"
            class="form-control"
            type="tel"
            inputmode="numeric"
            placeholder="0912xxxxxxx"
          >

        </div>


        <div class="form-group">

          <label>
            رمز عبور
          </label>

          <input
            id="loginPassword"
            class="form-control"
            type="password"
            placeholder="رمز عبور"
          >

        </div>


        <button
          class="btn btn-primary full"
          onclick="login()"
        >
          ورود به حساب
        </button>


        <button
          class="btn btn-light full"
          style="margin-top:10px"
          onclick="showRegister()"
        >
          ثبت‌نام دانش‌آموز جدید
        </button>

      </div>

    </div>

  `;
}


/* =========================================================
   REGISTER
========================================================= */

function showRegister(){

  $("app").innerHTML = `

    <div class="login-screen">

      <div class="login-box">

        <div class="login-logo">
          AN
        </div>

        <div class="login-title">
          ثبت‌نام
        </div>

        <div class="login-sub">
          اطلاعات خود را وارد کنید
        </div>


        <div class="form-group">
          <label>نام</label>
          <input id="regFirst" class="form-control">
        </div>


        <div class="form-group">
          <label>نام خانوادگی</label>
          <input id="regLast" class="form-control">
        </div>


        <div class="form-group">
          <label>شماره موبایل</label>
          <input
            id="regPhone"
            class="form-control"
            type="tel"
            inputmode="numeric"
          >
        </div>


        <div class="form-group">
          <label>سطح زبان</label>

          <select id="regLevel" class="form-control">

            <option value="beginner">
              مبتدی
            </option>

            <option value="elementary">
              مقدماتی
            </option>

            <option value="pre-intermediate">
              پیش متوسط
            </option>

            <option value="intermediate">
              متوسط
            </option>

            <option value="upper-intermediate">
              متوسط رو به بالا
            </option>

            <option value="advanced">
              پیشرفته
            </option>

          </select>

        </div>


        <div class="form-group">
          <label>رمز عبور</label>
          <input
            id="regPassword"
            class="form-control"
            type="password"
          >
        </div>


        <button
          class="btn btn-primary full"
          onclick="registerStudent()"
        >
          ارسال درخواست ثبت‌نام
        </button>


        <button
          class="btn btn-light full"
          style="margin-top:10px"
          onclick="renderLogin()"
        >
          بازگشت به ورود
        </button>

      </div>

    </div>

  `;
}


async function registerStudent(){

  const firstName =
    $("regFirst").value.trim();

  const lastName =
    $("regLast").value.trim();

  const phone =
    $("regPhone").value.trim();

  const level =
    $("regLevel").value;

  const password =
    $("regPassword").value;

  if(!firstName || !lastName || !phone || !password){

    toast("لطفاً همه اطلاعات را تکمیل کنید");

    return;
  }

  if(password.length < 6){

    toast("رمز عبور باید حداقل ۶ کاراکتر باشد");

    return;
  }

  const email =
    phone.replace(/\D/g,"") +
    "@alinagheli.app";


  /*
     ساخت حساب Auth
  */

  const {
    data,
    error
  } = await db.auth.signUp({
    email,
    password
  });


  if(error){

    console.error(error);

    toast(error.message || "خطا در ثبت‌نام");

    return;
  }


  /*
     اگر Supabase تأیید ایمیل را فعال کرده باشد،
     ممکن است session فوراً ساخته نشود.
  */


  const user =
    data.user;


  if(!user){

    toast(
      "درخواست ثبت شد. در صورت فعال بودن تأیید ایمیل، حساب باید تأیید شود."
    );

    return;
  }


  /*
     ذخیره دانش‌آموز
  */

  const {
    error:insertError
  } = await db
    .from("students")
    .insert({

      first_name:firstName,

      last_name:lastName,

      phone:phone,

      level:level,

      status:"waiting",

      auth_user_id:user.id,

      password_created:true

    });


  if(insertError){

    console.error(insertError);

    toast("حساب ساخته شد ولی ثبت اطلاعات دانش‌آموز با خطا مواجه شد");

    return;
  }


  toast(
    "ثبت‌نام شما انجام شد و در صف انتظار قرار گرفت 🌷"
  );


  setTimeout(()=>{

    renderLogin();

  },1800);

}


/* =========================================================
   APP
========================================================= */

function renderApp(){

  $("app").innerHTML = `

/* =========================================================
   NAVIGATION
========================================================= */

function navigate(page){

  state.page = page;

  document
    .querySelectorAll(".page")
    .forEach(el=>{
      el.classList.remove("active");
    });


  const target =
    document.getElementById("page-" + page);


  if(target){

    target.classList.add("active");

  }


  document
    .querySelectorAll(".nav-item")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );

    });


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  if(page === "admin"){

    loadAdminStudents();

  }

}

function speakWord(word){

  if(!("speechSynthesis" in window)){

    toast("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند");

    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(word);

  utterance.lang = "en-US";

  utterance.rate = .85;

  window.speechSynthesis.speak(
    utterance
  );

}

/* =========================================================
   ADMIN DATA
========================================================= */

async function loadAdminStudents(){

  const container =
    $("adminStudents");

  if(!container) return;


  const {
    data,
    error
  } = await db
    .from("students")
    .select("*")
    .order("id",{ascending:false});


  if(error){

    console.error(error);

    container.innerHTML = `

      <div class="card empty">

        دریافت اطلاعات با خطا مواجه شد.

        <br><br>

        <small>
          ${escapeHTML(error.message)}
        </small>

      </div>

    `;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML = `

      <div class="card empty">

        👩‍🎓

        <p>
          هنوز دانش‌آموزی ثبت نشده است.
        </p>

      </div>

    `;

    return;
  }


  container.innerHTML =
    data.map(student=>{

      const name =
        `${student.first_name || ""} ${student.last_name || ""}`;


      return `

        <div class="card admin-card">

          <div class="student-name">

            ${escapeHTML(name)}

          </div>


          <div class="student-phone">

            ${escapeHTML(student.phone || "—")}

          </div>


          <div style="margin-top:9px">

            ${statusBadge(student.status)}

            <span
              class="badge"
              style="
                background:#f3f4f6;
                color:#4b5563;
                margin-right:5px;
              "
            >
              ${escapeHTML(student.level || "—")}
            </span>

          </div>


          ${
            student.status === "waiting"
            ? `

              <div class="admin-actions">

                <button
                  class="btn btn-success"
                  onclick="approveStudent('${student.id}')"
                >
                  ✓ تأیید
                </button>

                <button
                  class="btn btn-danger"
                  onclick="deleteStudent('${student.id}')"
                >
                  ✕ رد / حذف
                </button>

              </div>

            `
            : `

              <div class="admin-actions">

                <button
                  class="btn btn-danger"
                  onclick="deleteStudent('${student.id}')"
                >
                  حذف دانش‌آموز
                </button>

              </div>

            `
          }

        </div>

      `;

    }).join("");

}


/* =========================================================
   APPROVE
========================================================= */

async function approveStudent(id){

  const confirmed =
    confirm(
      "این دانش‌آموز تأیید و ثبت‌نام شود؟"
    );

  if(!confirmed) return;


  const {
    error
  } = await db
    .from("students")
    .update({
      status:"registered"
    })
    .eq("id",id);


  if(error){

    console.error(error);

    toast("خطا در تأیید دانش‌آموز");

    return;
  }


  toast("دانش‌آموز با موفقیت ثبت‌نام شد ✓");

  loadAdminStudents();

}


/* =========================================================
   DELETE
========================================================= */

async function deleteStudent(id){

  const confirmed =
    confirm(
      "این دانش‌آموز حذف شود؟"
    );

  if(!confirmed) return;


  const {
    error
  } = await db
    .from("students")
    .delete()
    .eq("id",id);


  if(error){

    console.error(error);

    toast("خطا در حذف دانش‌آموز");

    return;
  }


  toast("دانش‌آموز حذف شد");

  loadAdminStudents();

}
