function esc(x){
return String(x??"").replace(/[&<>"']/g,function(m){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m];
});

function shuffle(arr){
const a=arr.slice();
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function speak(text){
if(!window.speechSynthesis){
alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
return;
}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang="en-US";
u.rate=.75;
speechSynthesis.resume();
speechSynthesis.speak(u);
}

/* ================= XP / PROGRESS ================= */

function calculateLevel(xp){
return Math.max(1,Math.floor(Number(xp||0)/100)+1);
}

async function loadStudentStats(){
if(!S.student)return;

S.xp=0;
S.level=1;
S.progress={};
S.achievements=[];
S.examHistory=[];

try{
const xp=await db.from("student_xp")
.select("xp,level")
.eq("student_id",S.student.id)
.maybeSingle();

if(xp.data){
S.xp=Number(xp.data.xp||0);
S.level=Number(xp.data.level||calculateLevel(S.xp));
}
}catch(e){}

try{
const p=await db.from("student_progress")
.select("lesson_id,progress,completed")
.eq("student_id",S.student.id);

if(p.data){
p.data.forEach(x=>{
S.progress[x.lesson_id]={
progress:Number(x.progress||0),
completed:Boolean(x.completed)
};
});
}
}catch(e){}

try{
const a=await db.from("student_achievements")
.select("achievement_key,title")
.eq("student_id",S.student.id);

if(a.data)S.achievements=a.data;
}catch(e){}

try{
const r=await db.from("exam_results")
.select("*")
.eq("user_id",S.student.auth_user_id)
.order("created_at",{ascending:false});

if(r.data)S.examHistory=r.data;
}catch(e){}
}

async function addXP(amount){
if(!S.student)return;

const newXP=S.xp+Number(amount||0);
const newLevel=calculateLevel(newXP);

S.xp=newXP;
S.level=newLevel;

try{
await db.from("student_xp").upsert({
student_id:S.student.id,
xp:newXP,
level:newLevel,
updated_at:new Date().toISOString()
},{onConflict:"student_id"});
}catch(e){}
}

async function unlockAchievement(key,title){
if(!S.student)return;

if(S.achievements.some(x=>x.achievement_key===key))return;

try{
const r=await db.from("student_achievements").insert({
student_id:S.student.id,
achievement_key:key,
title
});

if(!r.error){
S.achievements.push({achievement_key:key,title});
}
}catch(e){}
}

async function saveProgress(lessonId,progress,completed){
if(!S.student)return;

S.progress[lessonId]={progress,completed};

try{
await db.from("student_progress").upsert({
student_id:S.student.id,
lesson_id:lessonId,
progress,
completed,
completed_at:completed?new Date().toISOString():null
},{onConflict:"student_id,lesson_id"});
}catch(e){}
}

/* ================= QUIZ ENGINE ================= */

function makeLessonQuestions(){
const no=S.lesson+1;
let arr=[];

(words[no]||[]).forEach((w,i)=>{
const pool=(words[no]||[]).filter((_,j)=>j!==i).map(x=>x[1]);
const opts=shuffle([w[1],...shuffle(pool).slice(0,2)]);
arr.push({
q:`معنی "${w[0]}" چیست؟`,
options:opts,
answer:opts.indexOf(w[1])
});
});

(grammar[no]||[]).forEach(g=>{
const correct=g[1];
const wrongs=[
"She are student.",
"They is happy.",
"He am at school."
];
const opts=shuffle([correct,...wrongs.slice(0,2)]);
arr.push({
q:`کدام جمله با مبحث «${g[0]}» هماهنگ است؟`,
options:opts,
answer:opts.indexOf(correct)
});
});

return shuffle(arr).slice(0,15);
}

function startLessonQuiz(){
S.quiz={
type:"lesson",
title:`پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
questions:makeLessonQuestions(),
i:0,
correct:0,
wrong:0
};
quizRender("lessonQuiz");
}

function quizRender(id){
const q=S.quiz.questions[S.quiz.i];

if(!q){
quizFinish(id);
return;
}

const el=document.getElementById(id);
if(!el)return;

el.innerHTML=`
<div class="card">
<b>سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b>
<div class="progress">
<i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i>
</div>

<div style="font-size:18px;font-weight:bold;line-height:2;margin:15px 0">
${esc(q.q)}
</div>

${q.options.map((x,i)=>`
<button class="option" onclick="answer(${i},'${id}')">${esc(x)}</button>
`).join("")}

<div id="fb"></div>
</div>`;
}

function answer(i,id){
const q=S.quiz.questions[S.quiz.i];
const opts=document.querySelectorAll(".option");

opts.forEach(x=>x.disabled=true);

if(i===q.answer){

<button class="btn danger" onclick='rejectStudent(${JSON.stringify(x.id)})'>رد</button>
`
:`
<span>❌ رد شده</span>
<button class="btn success" onclick='approve(${JSON.stringify(x.id)})'>تأیید مجدد</button>
`
}
</div>
</div>
`).join("")
:`<p class="muted">ثبت‌نامی وجود ندارد.</p>`
}
</div>

<div class="card">
<h3>📅 درخواست‌های رزرو کلاس</h3>

${
requests.length
?requests.map(x=>`
<div class="requestBox">
<b>${esc(x.student_name||"-")}</b>
<div class="muted">
📱 ${esc(x.phone||"-")}
<br>👨‍🏫 استاد: ${esc(x.teacher||"-")}
<br>📅 روز: ${esc(x.requested_day||"-")}
<br>⏰ ساعت: ${esc(x.requested_time||"-")}
<br>📝 ${esc(x.note||"-")}
<br>📌 وضعیت: ${esc(x.status||"pending")}
</div>

${
x.status==="pending"
?`
<div style="margin-top:10px">
<button class="btn success" onclick='bookingStatus(${JSON.stringify(x.id)},"approved")'>✅ تأیید</button>
<button class="btn danger" onclick='bookingStatus(${JSON.stringify(x.id)},"rejected")'>❌ رد</button>
</div>
`
:``
}
</div>
`).join("")
:`<p class="muted">درخواست رزروی وجود ندارد.</p>`
}

</div>

<button class="btn secondary full" onclick="logout()">خروج</button>
</main>
`;
}

async function approve(id){
try{
const r=await db.from("students").update({status:"registered"}).eq("id",id);
if(r.error)throw r.error;
admin();
}catch(e){alert("خطا در تأیید:\n"+e.message)}
}

async function rejectStudent(id){
try{
const r=await db.from("students").update({status:"rejected"}).eq("id",id);
if(r.error)throw r.error;
admin();
}catch(e){alert("خطا در رد کردن:\n"+e.message)}
}

async function bookingStatus(id,status){
try{
const r=await db.from("class_requests").update({status}).eq("id",id);
if(r.error)throw r.error;
admin();
}catch(e){
alert("خطا در تغییر وضعیت درخواست:\n"+e.message);
}
}

/* ================= LOGOUT / START ================= */

async function logout(){
try{await db.auth.signOut()}catch(e){}

S={
student:null,
admin:false,
grade:null,
lesson:null,
quiz:null,
xp:0,
level:1,
progress:{},
achievements:[],
examHistory:[],
placement:null
};

login();
}

async function startup(){
try{
const r=await db.auth.getSession();
const session=r.data?.session;

if(!session){
login();
return;
}

const user=session.user;

if((user.email||"").toLowerCase()==="alinagheli@gmail.com"){
S.admin=true;
admin();
return;
}

const st=await db.from("students")
.select("*")
.eq("auth_user_id",user.id)
.maybeSingle();

if(
st.data &&
(st.data.status==="registered"||st.data.status==="approved")
){
S.student=st.data;
await loadStudentStats();
home();
return;
}

await db.auth.signOut();
login();

}catch(e){
try{await db.auth.signOut()}catch(_){}
login();
}
}

db.auth.onAuthStateChange(function(event){
if(event==="SIGNED_OUT"&&!S.admin&&!S.student){
setTimeout(login,0);
}
});

startup();
</script>
