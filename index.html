<style>

<body>

<div id="app"></div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://kapzyedzjecnfxevjisq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9a_2NYNeDLBDd-MeHmut4g_JoEDkHeQ";

const {
  createClient
} = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
===================================================== */

const state = {

  user:null,

  profile:null,

  isAdmin:false,

  students:[],

  courses:[],

  loginMode:"student",

  adminFilter:"all",

  search:"",

  currentSection:"home",

  levelIndex:0,

  levelScore:0,

  levelAnswered:false,

  dailyIndex:0,

  dailyScore:0,

  dailyAnswered:false,

  dailyQuestions:[],

  dailyFinished:false

};


/* =====================================================
   HELPERS
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


function notice(
  text,
  type="info"
){

  const old =
    document.getElementById(
      "notice"
    );

  if(old){
    old.remove();
  }

  const box =
    document.createElement(
      "div"
    );

  box.id="notice";

  box.className =
    "notice " + type;

  box.textContent=text;

  const wrap =
    document.querySelector(
      ".wrap"
    );

  if(wrap){
    wrap.prepend(box);
  }

  setTimeout(
    function(){

      if(box){
        box.remove();
      }

    },
    5000
  );

}


function studentEmail(phone){

  return String(phone || "")
    .replace(/\D/g,"")
    + "@alinagheli.com";

}


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  const result =
    await db.auth.getSession();

  const session =
    result.data.session;

  if(session){

    state.user =
      session.user;

    await loadIdentity();

  }else{

    renderLogin();

  }

  db.auth.onAuthStateChange(
    async function(
      event,
      session
    ){

      if(session){

        state.user =
          session.user;

        await loadIdentity();

      }else{

        state.user=null;

        state.profile=null;

        state.isAdmin=false;

        renderLogin();

      }

    }
  );

}


/* =====================================================
   IDENTITY
===================================================== */

async function loadIdentity(){

  state.isAdmin=false;

  state.profile=null;

  if(!state.user){

    renderLogin();

    return;

  }

  const adminResult =
    await db
      .from("admins")
      .select("id,user_id")
      .eq(
        "user_id",
        state.user.id
      )
      .maybeSingle();

  if(adminResult.data){

    state.isAdmin=true;

    await loadAdminData();

    renderApp();

    return;

  }

  const studentResult =
    await db
      .from("students")
      .select("*")
      .eq(
        "auth_user_id",
        state.user.id
      )
      .maybeSingle();

  state.profile =
    studentResult.data || null;

  renderApp();

}


/* =====================================================
   COURSES
===================================================== */

async function loadCourses(){

  const result =
    await db
      .from("courses")
      .select("*")
      .order("id");

  if(!result.error){

    state.courses =
      result.data || [];

  }

}


/* =====================================================
   ADMIN DATA
===================================================== */

async function loadAdminData(){

  await loadCourses();

  const result =
    await db
      .from("students")
      .select("*")
      .order(
        "id",
        {
          ascending:false
        }
      );

  if(!result.error){

    state.students =
      result.data || [];

  }else{

    state.students=[];

    console.error(
      result.error
    );

  }

}


/* =====================================================
   HEADER
===================================================== */

function header(){

  return `

  <div class="top">

    <div class="toprow">

      <div>

        <div class="brand">
          AliNagheli English
        </div>

        <div class="sub">

          ${
            state.isAdmin
              ? "پنل مدیریت"
              : "پنل زبان‌آموز"
          }

        </div>

      </div>

      <button
        class="btn secondary small"
        onclick="logout()">

        خروج

      </button>

    </div>

  </div>

  `;

}


/* =====================================================
   LOGIN
===================================================== */

function renderLogin(){

  document.body.innerHTML=`

  <div class="wrap">

    <div class="card login">

      <div class="logo">
        AN
      </div>

      <h1 style="text-align:center">
        AliNagheli English
      </h1>

      <p
        class="muted"
        style="text-align:center">

        سامانه آموزش زبان انگلیسی

      </p>

      <div class="tabs">

        <button
          class="tab ${
            state.loginMode==="student"
              ? "active"
              : ""
          }"
          onclick="setLoginMode('student')">

          زبان‌آموز

        </button>

        <button
          class="tab ${
            state.loginMode==="admin"
              ? "active"
              : ""
          }"
          onclick="setLoginMode('admin')">

          مدیریت

        </button>

      </div>

      <div id="loginForm"></div>

    </div>

  </div>

  `;

  renderLoginForm();

}


function setLoginMode(mode){

  state.loginMode=mode;

  renderLogin();

}


function renderLoginForm(){

  const box =
    document.getElementById(
      "loginForm"
    );

  if(state.loginMode==="admin"){

    box.innerHTML=`

      <label>
        ایمیل مدیر
      </label>

      <input
        id="email"
        type="email"
        placeholder="ایمیل مدیر">

      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور">

      <button
        class="btn full"
        style="margin-top:14px"
        onclick="loginAdmin()">

        ورود به پنل مدیریت

      </button>

    `;

  }else{

    box.innerHTML=`

      <label>
        شماره تلفن
      </label>

      <input
        id="phone"
        inputmode="tel"
        placeholder="0914...">

      <label>
        رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور">

      <button
        class="btn full"
        style="margin-top:14px"
        onclick="loginStudent()">

        ورود زبان‌آموز

      </button>

      <button
        class="btn secondary full"
        style="margin-top:8px"
        onclick="showRegister()">

        ثبت‌نام زبان‌آموز جدید

      </button>

    `;

  }

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function loginAdmin(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!email || !password){

    notice(
      "ایمیل و رمز عبور را وارد کنید.",
      "err"
    );

    return;

  }

  const result =
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });

  if(result.error){

    notice(
      "ایمیل یا رمز عبور مدیر صحیح نیست.",
      "err"
    );

    return;

  }

  state.user =
    result.data.user;

  await loadIdentity();

}


/* =====================================================
   STUDENT LOGIN
===================================================== */

async function loginStudent(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!phone || !password){

    notice(
      "شماره تلفن و رمز عبور را وارد کنید.",
      "err"
    );

    return;

  }

  const result =
    await db.auth.signInWithPassword({

      email:
        studentEmail(phone),

      password:password

    });

  if(result.error){

    notice(
      "شماره تلفن یا رمز عبور نادرست است.",
      "err"
    );

    return;

  }

  state.user =
    result.data.user;

  await loadIdentity();

}


/* =====================================================
   REGISTER
===================================================== */

function showRegister(){

  document
    .getElementById("loginForm")
    .innerHTML=`

      <h3>
        ثبت‌نام زبان‌آموز جدید
      </h3>

      <div class="row">

        <div>

          <label>
            نام
          </label>

          <input id="r_first">

        </div>

        <div>

          <label>
            نام خانوادگی
          </label>

          <input id="r_last">

        </div>

      </div>

      <label>
        شماره تلفن
      </label>

      <input
        id="r_phone"
        inputmode="tel"
        placeholder="0914...">

      <label>
        رمز عبور
      </label>

      <input
        id="r_pass"
        type="password">

      <label>
        پایه / سطح
      </label>

      <input
        id="r_level"
        placeholder="مثلاً پایه نهم">

      <label>
        دوره
      </label>

      <select id="r_course">

        <option value="">
          انتخاب دوره
        </option>

      </select>

      <label>
        هدف
      </label>

      <textarea
        id="r_goal"
        rows="3"
        placeholder="هدف شما از یادگیری زبان">
      </textarea>

      <button
        class="btn full"
        style="margin-top:12px"
        onclick="registerStudent()">

        ثبت‌نام

      </button>

      <button
        class="btn secondary full"
        style="margin-top:8px"
        onclick="renderLogin()">

        بازگشت

      </button>

async function registerStudent(){

  const first =
    document
      .getElementById("r_first")
      .value
      .trim();

  const last =
    document
      .getElementById("r_last")
      .value
      .trim();

  const phone =
    document
      .getElementById("r_phone")
      .value
      .trim();

  const pass =
    document
      .getElementById("r_pass")
      .value;

  if(
    !first ||
    !last ||
    !phone ||
    !pass
  ){

    notice(
      "نام، نام خانوادگی، شماره تلفن و رمز عبور الزامی است.",
      "err"
    );

    return;

  }

  if(pass.length < 6){

    notice(
      "رمز عبور باید حداقل ۶ کاراکتر باشد.",
      "err"
    );

    return;

  }

  const email =
    studentEmail(phone);

  const auth =
    await db.auth.signUp({

      email:email,

      password:pass,

      options:{

        data:{

          first_name:first,

          last_name:last,

          phone:phone

        }

      }

    });

  if(auth.error){

    notice(
      auth.error.message,
      "err"
    );

    return;

  }

  if(!auth.data.user){

    notice(
      "حساب کاربری ساخته نشد.",
      "err"
    );

    return;

  }

  const payload={

    first_name:first,

    last_name:last,

    phone:phone,

    level:
      document
        .getElementById("r_level")
        .value
        .trim(),

    status:"waiting",

    auth_user_id:
      auth.data.user.id,

    password_created:true

  };

  const insert =
    await db
      .from("students")
      .insert(payload);

  if(insert.error){

    notice(
      "حساب ساخته شد اما ذخیره اطلاعات زبان‌آموز خطا داد: "
      +
      insert.error.message,
      "err"
    );

    return;

  }

  notice(
    "ثبت‌نام با موفقیت انجام شد. پس از تأیید مدیر می‌توانید وارد نرم‌افزار شوید.",
    "ok"
  );

  setTimeout(
    function(){

      renderLogin();

    },
    1500
  );

}

function startLevelTest(){

  state.levelIndex=0;

  state.levelScore=0;

  state.levelAnswered=false;

  renderLevelQuestion();

}


/* =====================================================
   LEVEL QUESTION
===================================================== */

function renderLevelQuestion(){

  const i =
    state.levelIndex;

  const q =
    levelQuestions[i];

  if(!q){

    finishLevelTest();

    return;

  }

  const percent =
    Math.round(
      ((i) /
      levelQuestions.length)
      *100
    );

  document
    .getElementById("content")
    .innerHTML=`

      <div class="card">

        <div class="quizHeader">

          <div>

            <h2>
              تعیین سطح 🎯
            </h2>

            <div class="muted">
              سؤال ${i+1}
              از
              ${levelQuestions.length}
            </div>

          </div>

          <div class="quizScore">

            امتیاز:
            ${state.levelScore}

          </div>

        </div>


        <div class="progress">

          <div
            class="progressbar"
            style="width:${percent}%">
          </div>

        </div>


        <div
          class="quizQuestion"
          style="margin-top:20px">

          ${esc(q.q)}

        </div>


        <div id="levelOptions">

          ${
            q.options
              .map(
                function(option,index){

                  return `

                    <button
                      class="option"
                      onclick="answerLevel(${index})">

                      ${String.fromCharCode(65+index)}.
                      ${esc(option)}

                    </button>

                  `;

                }
              )
              .join("")
          }

        </div>

        <div id="levelFeedback"></div>

      </div>

  `;

}


/* =====================================================
   ANSWER LEVEL
===================================================== */

function answerLevel(index){

  if(state.levelAnswered){
    return;
  }

  state.levelAnswered=true;

  const q =
    levelQuestions[
      state.levelIndex
    ];

  const options =
    document.querySelectorAll(
      "#levelOptions .option"
    );

  options.forEach(
    function(btn,i){

      btn.disabled=true;

      if(i===q.answer){

        btn.classList.add(
          "correct"
        );

      }

      if(
        i===index &&
        i!==q.answer
      ){

        btn.classList.add(
          "wrong"
        );

      }

    }
  );

  const correct =
    index===q.answer;

  if(correct){

    state.levelScore++;

  }

  document
    .getElementById(
      "levelFeedback"
    )
    .innerHTML=`

      <div class="feedback ${
        correct
          ? "correct"
          : "wrong"
      }">

        ${
          correct
            ? "✅ پاسخ شما درست است!"
            : "❌ پاسخ شما نادرست است."
        }

        <div
          style="font-weight:normal;margin-top:7px">

          ${esc(q.explanation)}

        </div>

      </div>


      <button
        class="btn full"
        style="margin-top:12px"
        onclick="nextLevelQuestion()">

        ${
          state.levelIndex <
          levelQuestions.length-1
            ? "سؤال بعدی ➜"
            : "مشاهده نتیجه 🎯"
        }

      </button>

  `;

}


/* =====================================================
   NEXT LEVEL QUESTION
===================================================== */

function nextLevelQuestion(){

  state.levelIndex++;

  state.levelAnswered=false;

  renderLevelQuestion();

}

      "پایه زبان شما مناسب است و می‌توانید روی گسترش واژگان و گرامر کار کنید.";

    level="B1";

    message=
      "سطح متوسط دارید و می‌توانید وارد مباحث جدی‌تر شوید.";

    level="B2";

    message=
      "سطح خوبی دارید و در محدوده Upper-Intermediate قرار می‌گیرید.";

  }else{

      "عملکرد بسیار خوبی داشتید و به سطح پیشرفته نزدیک هستید.";

/* =====================================================
   DAILY SEED
===================================================== */

function dailySeed(){

  const date =
    new Date();

  const key =
    date.getFullYear()*10000
    +
    (date.getMonth()+1)*100
    +
    date.getDate();

  return key;

}


function createDailyQuestions(){

  const bank =
    [...dailyQuestionBank];

  let seed =
    dailySeed();

  function random(){

    seed =
      (seed * 9301 + 49297)
      % 233280;

    return seed / 233280;

  }

  for(
    let i=bank.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        random()*(i+1)
      );

    [
      bank[i],
      bank[j]
    ]=[
      bank[j],
      bank[i]
    ];

  }

  return bank.slice(0,15);

}


/* =====================================================
   START DAILY QUIZ
===================================================== */

async function startDailyQuiz(){

  state.dailyQuestions =
    createDailyQuestions();

  state.dailyIndex=0;

  state.dailyScore=0;

  state.dailyAnswered=false;

  state.dailyFinished=false;

  renderDailyQuestion();

}

===================================================== */

function renderDailyQuestion(){

  if(state.dailyFinished){

    .getElementById("content")

/* =====================================================
   ANSWER DAILY
===================================================== */

function answerDaily(index){

  if(state.dailyAnswered){

    return;

  }

  state.dailyAnswered=true;

  const q =
    state.dailyQuestions[
      state.dailyIndex
    ];

  const options =
    document.querySelectorAll(
      "#dailyOptions .option"
    );

  options.forEach(
    function(btn,i){

      btn.disabled=true;

      if(i===q.answer){

        btn.classList.add(
          "correct"
        );

      }

      if(
        i===index &&
        i!==q.answer
      ){

        btn.classList.add(
          "wrong"
        );

      }

    }
  );

  const correct =
    index===q.answer;

  if(correct){

    state.dailyScore++;

  }

  document
    .getElementById(
      "dailyFeedback"
    )
    .innerHTML=`

      <div class="feedback ${
        correct
          ? "correct"
          : "wrong"
      }">

        ${
          correct
            ? "✅ درست!"
            : "❌ نادرست!"
        }

      </div>

      <button
        class="btn full"
        style="margin-top:12px"
        onclick="nextDailyQuestion()">

        ${
          state.dailyIndex<14
            ? "سؤال بعدی ➜"
            : "ثبت نتیجه 🏆"
        }

      </button>

  `;

}

===================================================== */

async function nextDailyQuestion(){

  if(state.dailyIndex<14){

    state.dailyIndex++;

    state.dailyAnswered=false;

    renderDailyQuestion();

  }else{

    state.dailyFinished=true;

    await saveDailyResult();

    renderDailyRanking();

  }

}


/* =====================================================

===================================================== */

async function saveDailyResult(){

  if(!state.user){

    return;

  }

  const result =
    await db
      .from("daily_quiz_results")
      .upsert(
        {

          user_id:
            state.user.id,

          student_id:
            state.profile?.id || null,

          quiz_date:
            new Date()
              .toISOString()
              .slice(0,10),

          score:
            state.dailyScore,

          total:15

        },
        {

          onConflict:
            "user_id,quiz_date"

        }
      );

  if(result.error){

    console.error(
      result.error
    );

  }

}


/* =====================================================
   DAILY RANKING
===================================================== */

async function renderDailyRanking(){

  const today =
    new Date()
      .toISOString()
      .slice(0,10);

  let results=[];

  const result =
    await db
      .from("daily_quiz_results")
      .select(
        "user_id,student_id,score,total,students(first_name,last_name)"
      )
      .eq(
        "quiz_date",
        today
      )
      .order(
        "score",
        {
          ascending:false
        }
      )
      .limit(100);

  if(!result.error){

    results =
      result.data || [];

  }


  /*
    در صورتی که رابطه students در Supabase
    وجود نداشته باشد، دوباره اطلاعات را از
    students می‌گیریم.
  */

  if(
    result.error &&
    state.isAdmin===false
  ){

    const fallback =
      await db
        .from("daily_quiz_results")
        .select(
          "user_id,student_id,score,total"
        )
        .eq(
          "quiz_date",
          today
        )
        .order(
          "score",
          {
            ascending:false
          }
        );

    if(!fallback.error){

      results =
        fallback.data || [];

    }

  }


  const myUser =
    state.user?.id;

  const myIndex =
    results.findIndex(
      r=>r.user_id===myUser
    );


  function studentName(r){

    if(r.students){

      return (
        (r.students.first_name || "")
        +
        " "
        +
        (r.students.last_name || "")
      ).trim();

    }

    if(
      r.user_id===myUser &&
      state.profile
    ){

      return (
        state.profile.first_name
        +
        " "
        +
        state.profile.last_name
      );

    }

    return "زبان‌آموز";

  }


  document
    .getElementById("content")
    .innerHTML=`

      <div class="card">

        <div style="text-align:center">

          <div style="font-size:50px">
            🏆
          </div>

          <h2>
            مسابقه امروز تمام شد!
          </h2>

          <p class="muted">
            امتیاز شما:
          </p>

          <div
            style="
              font-size:40px;
              font-weight:900;
              color:var(--primary)
            ">

            ${state.dailyScore}
            / 15

          </div>

        </div>

      </div>


      <div class="card">

        <h3>
          🥇 برترین‌های امروز
        </h3>

        ${
          results.length

            ?

            results
              .slice(0,3)
              .map(
                function(r,index){

                  const classes=[
                    "rank1",
                    "rank2",
                    "rank3"
                  ];

                  const medals=[
                    "🥇",
                    "🥈",
                    "🥉"
                  ];

                  return `

                    <div class="
                      rankCard
                      ${classes[index]}
                      ${
                        r.user_id===myUser
                          ? "myRank"
                          : ""
                      }
                    ">

                      <div>

                        <b>
                          ${medals[index]}
                          ${index+1}
                          .
                          ${esc(studentName(r))}
                        </b>

                      </div>

                      <strong>
                        ${r.score}/15
                      </strong>

                    </div>

                  `;

                }
              )
              .join("")

            :

            `
              <div class="empty">
                هنوز کسی نتیجه مسابقه را ثبت نکرده است.
              </div>
            `
        }

      </div>


      <div class="card">

        <h3>
          📊 رتبه شما
        </h3>

        ${
          myIndex>=0

            ?

            `
              <div class="rankCard myRank">

                <div>

                  <b>
                    رتبه ${myIndex+1}
                  </b>

                  <div class="infoLine">
                    ${esc(
                      studentName(
                        results[myIndex]
                      )
                    )}
                  </div>

                </div>

                <strong>
                  ${results[myIndex].score}/15
                </strong>

              </div>
            `

            :

            `
              <div class="empty">

                نتیجه شما در جدول ثبت نشده است.

              </div>
            `
        }

      </div>


      <button
        class="btn full"
        onclick="showSection('home')">

        بازگشت به خانه

      </button>

  `;

}

/* =====================================================
   FILTER
===================================================== */

function filterStudents(){

  const q =
    (
      document
        .getElementById("q")
        ?.value
      ||
      state.search
      ||
      ""
    )
    .trim()
    .toLowerCase();

  state.search=q;

  let students =
    [...state.students];

  if(
    state.adminFilter!=="all"
  ){

    students =
      students.filter(
        s=>
          s.status===
          state.adminFilter
      );

  }

  if(q){

    students =
      students.filter(
        function(s){

          const text =
            `
              ${s.first_name}
              ${s.last_name}
              ${s.phone}
              ${s.level}
            `
            .toLowerCase();

          return text.includes(q);

        }
      );

  }

  const list =
    document.getElementById(
      "studentList"
    );

  if(!list)return;

  list.innerHTML =
    students
      .map(studentCard)
      .join("")
    ||
    '<div class="empty">موردی پیدا نشد.</div>';

}

/* =====================================================
   CONFIRM
===================================================== */

async function confirmRegistration(id){

  const student =
    state.students.find(
      s=>s.id===id
    );

  if(!student)return;

  const name =
    `${student.first_name} ${student.last_name}`;

  const confirmed =
    confirm(
      `آیا ثبت‌نام «${name}» را تأیید می‌کنید؟`
    );

  if(!confirmed)return;

  await setStatus(
    id,
    "registered",
    true
  );

  notice(
    "ثبت‌نام زبان‌آموز تأیید شد.",
    "ok"
  );

}


/* =====================================================
   REJECT
===================================================== */

async function rejectStudent(id){

  const student =
    state.students.find(
      s=>s.id===id
    );

  if(!student)return;

  const name =
    `${student.first_name} ${student.last_name}`;

  const confirmed =
    confirm(
      `⚠️ درخواست «${name}» رد شود؟\n\nرکورد این زبان‌آموز از جدول students حذف خواهد شد.`
    );

  if(!confirmed)return;

  const result =
    await db
      .from("students")
      .delete()
      .eq(
        "id",
        id
      );

  if(result.error){

    notice(
      "حذف انجام نشد: "
      +
      result.error.message,
      "err"
    );

    return;

  }

  state.students =
    state.students.filter(
      s=>s.id!==id
    );

  renderAdminStudents();

  notice(
    "درخواست ثبت‌نام حذف شد.",
    "ok"
  );

}


/* =====================================================
   STATUS
===================================================== */

async function setStatus(
  id,
  status,
  silent=false
){

  const result =
    await db
      .from("students")
      .update({
        status:status
      })
      .eq(
        "id",
        id
      );

  if(result.error){

    notice(
      result.error.message,
      "err"
    );

    return false;

  }

  const student =
    state.students.find(
      s=>s.id===id
    );

  if(student){

    student.status =
      status;

  }

  if(
    state.adminFilter!=="all"
  ){

    renderAdminStudents();

  }else{

    renderAdmin();

  }

  if(!silent){

    notice(
      "وضعیت با موفقیت تغییر کرد.",
      "ok"
    );

  }

  return true;

}


/* =====================================================
   REFRESH STUDENTS
===================================================== */

async function refreshStudents(){

  await loadAdminData();

  renderAdminStudents();

  notice(
    "لیست زبان‌آموزان بروزرسانی شد.",
    "ok"
  );

}


/* =====================================================
   ADMIN COURSES
===================================================== */

function renderAdminCourses(){

  document
    .getElementById("content")
    .innerHTML=`

      <div class="card">

        <div class="adminTitle">

          <div>

            <h2>
              دوره‌ها 📚
            </h2>

            <p class="muted">
              دوره‌های موجود در سامانه
            </p>

          </div>

          <button
            class="btn secondary small"
            onclick="
              loadCourses()
              .then(renderAdminCourses)
            ">

            🔄 بروزرسانی

          </button>

        </div>


        ${
          state.courses.length

            ?

            state.courses
              .map(
                function(course){

                  return `

                    <div class="student">

                      <b>
                        ${esc(course.title)}
                      </b>

                      <div class="infoLine">

                        ${esc(
                          course.category || ""
                        )}

                        ${
                          course.active===false
                            ? " · غیرفعال"
                            : " · فعال"
                        }

                      </div>

                    </div>

                  `;

                }
              )
              .join("")

            :

            `
              <div class="empty">
                دوره‌ای پیدا نشد.
              </div>
            `
        }

      </div>

  `;

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await db.auth.signOut();

  state.user=null;

  state.profile=null;

  state.isAdmin=false;

  state.students=[];

  renderLogin();

}


/* =====================================================
   START
===================================================== */

boot();

</script>
