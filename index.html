*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:#f5f3ff;color:#171717;padding-bottom:82px}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.header{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:15px;position:sticky;top:0;z-index:100;box-shadow:0 3px 15px #0002}

.logo{font-size:20px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:15px}
.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 5px 25px #0000000d}
.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;border-radius:24px;padding:25px;margin-bottom:15px;overflow:hidden;position:relative}
.hero:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#fff2;left:-60px;top:-70px}
.hero>*{position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.item{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;transition:.2s}
.item:hover{transform:translateY(-2px);box-shadow:0 8px 25px #6d28d933}
.icon{font-size:40px}
.btn{background:#6d28d9;color:#fff;border:0;border-radius:13px;padding:12px 16px;font-weight:bold}
.btn.full{width:100%}
.secondary{background:#ede9fe;color:#5b21b6}
.success{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#991b1b}
.login{min-height:100vh;background:linear-gradient(135deg,#2e1065,#7c3aed,#a855f7);display:flex;justify-content:center;align-items:center;padding:20px}

label{display:block;margin:10px 0 5px;font-weight:bold;font-size:13px}
input,select{width:100%;padding:13px;border:1px solid #ddd6fe;border-radius:12px;background:#fff;outline:none}
.tabs{display:flex;gap:8px;margin:18px 0}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:#f3f4f6}
.tab.active{background:#ede9fe;color:#6d28d9;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #ddd;z-index:200;box-shadow:0 -3px 15px #0000000d}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex}
.nav{flex:1;border:0;background:#fff;padding:7px 2px;color:#777;font-size:11px}
.nav b{display:block;font-size:21px;margin-bottom:3px}
.nav.active{color:#6d28d9;font-weight:bold}
.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.lesson{background:#faf9ff;border:1px solid #ddd6fe;border-radius:18px;padding:17px;cursor:pointer}
.lesson:hover{background:#f3efff}
.lessonNo{font-size:30px;color:#6d28d9;font-weight:bold}
.tabs2{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
.tab2{padding:11px 15px;border:0;border-radius:12px;background:#eee;white-space:nowrap}
.tab2.active{background:#6d28d9;color:#fff}
.sec{display:none}.sec.active{display:block}
.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.word{border:1px solid #ddd6fe;background:#faf9ff;border-radius:15px;padding:13px;text-align:center;cursor:pointer}
.en{direction:ltr;color:#5b21b6;font-weight:bold}
.fa{font-size:11px;color:#777;margin-top:5px}
.grammar{border:1px solid #e9e5ff;background:#faf9ff;padding:17px;border-radius:17px;margin-bottom:12px;line-height:2}
.example{direction:ltr;text-align:left;background:#fff;border-radius:10px;padding:11px;font-family:Arial,sans-serif}
.option{display:block;width:100%;text-align:right;background:#fff;border:1px solid #ddd6fe;border-radius:13px;padding:13px;margin:7px 0}
.option.correct{background:#dcfce7;border-color:#22c55e}
.option.wrong{background:#fee2e2;border-color:#ef4444}
.feedback{text-align:center;border-radius:15px;padding:13px;margin-top:10px;font-weight:bold}
.ok{background:#dcfce7;color:#166534}
.bad{background:#fee2e2;color:#991b1b}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:#7c3aed;transition:.3s}
.score{font-size:55px;color:#6d28d9;font-weight:bold;text-align:center}
.adminRow{border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:9px 0}
.muted{font-size:12px;color:#777;line-height:1.9}

.teacherPhoto{font-size:55px;text-align:center;margin-bottom:10px}

.profileStat b{display:block;font-size:27px;color:#6d28d9;margin-top:5px}
.levelBar{height:12px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}
.levelBar i{display:block;height:100%;background:#7c3aed}
.badge{display:inline-block;padding:8px 12px;margin:4px;border-radius:20px;background:#ede9fe;color:#5b21b6;font-size:12px}
.notice{padding:13px;border-radius:13px;background:#fff7ed;color:#9a3412;font-size:13px;line-height:1.8;margin-bottom:12px}
.statBox{background:#faf9ff;border:1px solid #e9d5ff;border-radius:17px;padding:14px;text-align:center}
.statBox b{display:block;color:#6d28d9;font-size:24px;margin-top:5px}
.examRow{border:1px solid #e5e7eb;border-radius:15px;padding:13px;margin:9px 0;background:#fff}
.levelResult{border-radius:22px;padding:22px;background:linear-gradient(135deg,#ede9fe,#faf5ff);text-align:center}

.phoneBtn{display:block;text-decoration:none;text-align:center;margin-top:10px}
.reserveBox{margin-top:15px;padding:15px;border-radius:16px;background:#f5f3ff;border:1px solid #ddd6fe}
@media(max-width:600px){.container{padding:10px}.card{padding:16px;border-radius:18px}.hero{padding:20px}}

function xpForLevel(level){return(level-1)*100}
function calculateLevel(xp){return Math.max(1,Math.floor(xp/100)+1)}

async function loadStudentStats(){
 if(!S.student)return;
 S.xp=0;S.level=1;S.progress={};S.achievements=[];S.examHistory=[];
 try{
  const xp=await db.from("student_xp").select("xp,level").eq("student_id",S.student.id).maybeSingle();
  if(xp.data){S.xp=Number(xp.data.xp||0);S.level=Number(xp.data.level||calculateLevel(S.xp))}
 }catch(e){}
 try{
  const p=await db.from("student_progress").select("lesson_id,progress,completed").eq("student_id",S.student.id);
  if(p.data)p.data.forEach(x=>S.progress[x.lesson_id]={progress:Number(x.progress||0),completed:Boolean(x.completed)});
 }catch(e){}
 try{
  const a=await db.from("student_achievements").select("achievement_key,title").eq("student_id",S.student.id);
  if(a.data)S.achievements=a.data;
 }catch(e){}
 try{
  const r=await db.from("exam_results").select("*").eq("user_id",S.student.auth_user_id).order("created_at",{ascending:false});
  if(!r.error&&r.data)S.examHistory=r.data;
 }catch(e){}
}

async function addXP(amount,reason=""){
 if(!S.student)return;
 const old=S.xp,newXP=old+Number(amount||0),newLevel=calculateLevel(newXP);
 S.xp=newXP;S.level=newLevel;
 try{await db.from("student_xp").upsert({student_id:S.student.id,xp:newXP,level:newLevel,updated_at:new Date().toISOString()},{onConflict:"student_id"})}catch(e){}
 if(newLevel>calculateLevel(old))await unlockAchievement("level_"+newLevel,"رسیدن به Level "+newLevel);
}
async function unlockAchievement(key,title){
 if(!S.student||S.achievements.some(x=>x.achievement_key===key))return;
 try{
  const r=await db.from("student_achievements").insert({student_id:S.student.id,achievement_key:key,title});
  if(!r.error)S.achievements.push({achievement_key:key,title});
 }catch(e){}
}
async function saveProgress(lessonId,progress,completed){
 if(!S.student)return;
 S.progress[lessonId]={progress,completed};
 try{await db.from("student_progress").upsert({student_id:S.student.id,lesson_id:lessonId,progress,completed,completed_at:completed?new Date().toISOString():null},{onConflict:"student_id,lesson_id"})}catch(e){}
}

function shuffleQuestion(q){
 let options=q.options.map((label,i)=>({label,correct:i===q.answer}));
 for(let i=options.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}
 return {...q,options:options.map(x=>x.label),answer:options.findIndex(x=>x.correct)};
}
function makeLessonQuestions(){
 const no=S.lesson+1,arr=[];
 (words[no]||[]).forEach((w,i)=>{let a=words[no];arr.push({q:`معنی "${w[0]}" چیست؟`,options:[w[1],a[(i+1)%a.length][1],a[(i+2)%a.length][1],a[(i+3)%a.length][1]],answer:0})});
 (grammar[no]||[]).forEach(g=>arr.push({q:`کدام گزینه با ${g[0]} هماهنگ است؟`,options:[g[1],"She are student.","They is happy.","He am a teacher."],answer:0}));
 return arr.slice(0,15).map(shuffleQuestion);
}

 const name=conversationBooks[book],cw=[["conversation","گفت‌وگو"],["question","سؤال"],["answer","پاسخ"],["practice","تمرین"],["language","زبان"],["class","کلاس"],["student","دانش‌آموز"],["teacher","معلم"],["friend","دوست"],["information","اطلاعات"],["introduce","معرفی کردن"],["experience","تجربه"]];
 const cg=[["Simple Present","برای عادت‌ها و کارهای همیشگی.","I study English every day."],["Present Continuous","برای کاری که اکنون در حال انجام است.","I am studying English now."],["Questions","برای دریافت اطلاعات از ساختار سؤال استفاده می‌کنیم.","Where do you live?"],["Would like","برای بیان خواسته به شکل مؤدبانه.","I would like some coffee."]];
 render(name,`<div class="card"><button class="btn secondary" onclick="conversationBook(${book})">← بازگشت</button><h2>${name} — Unit ${unit+1}</h2><h3>📘 Grammar</h3>${cg.map(g=>`<div class="grammar"><h3>${g[0]}</h3><p>${g[1]}</p><div class="example">${g[2]}</div></div>`).join("")}<h3>🔊 Vocabulary</h3><div class="wordGrid">${cw.map(w=>`<div class="word" onclick='speak(${JSON.stringify(w[0])})'><div class="en">🔊 ${w[0]}</div><div class="fa">${w[1]}</div></div>`).join("")}</div><button class="btn full" style="margin-top:18px" onclick="conversationQuiz('${name.replace(/'/g,"")}',${unit})">📝 آزمون Unit ${unit+1}</button></div>`);
}
function conversationQuiz(name,unit){
 const q=[["What is the meaning of conversation?","گفت‌وگو"],["What is the meaning of question?","سؤال"],["What is the meaning of answer?","پاسخ"],["What is the meaning of practice?","تمرین"],["What is the meaning of language?","زبان"],["What is the meaning of class?","کلاس"],["What is the meaning of student?","دانش‌آموز"],["What is the meaning of teacher?","معلم"],["What is the meaning of friend?","دوست"],["What is the meaning of information?","اطلاعات"]];
 const arr=q.map((x,i)=>shuffleQuestion({q:x[0],options:[x[1],q[(i+1)%q.length][1],q[(i+2)%q.length][1],q[(i+3)%q.length][1]],answer:0}));
 S.quiz={type:"conversation",title:name+" Unit "+(unit+1),questions:arr,i:0,correct:0,wrong:0};render("آزمون مکالمه",`<div id="conversationQuiz"></div>`);quizRender("conversationQuiz");
}

function contest(){
 render("مسابقه",`<div class="card"><h2>🏆 مسابقه</h2><div class="grid">${[7,8,9,10,11,12].map(g=>`<div class="item"><div class="icon">🏆</div><h3>مسابقه پایه ${g}</h3><p class="muted">۲۰ سؤال</p><button class="btn full" onclick="startContest(${g})">شروع</button></div>`).join("")}</div></div>`);
}
function startContest(g){
 let q=[];
 for(let i=1;i<=8;i++)(words[i]||[]).forEach((w,j)=>{if(q.length<20)q.push(shuffleQuestion({q:`معنی "${w[0]}" چیست؟`,options:[w[1],words[i][(j+1)%words[i].length][1],words[i][(j+2)%words[i].length][1],words[i][(j+3)%words[i].length][1]],answer:0}))});
 while(q.length<20)q.push(shuffleQuestion({q:`سؤال ${q.length+1}: کدام گزینه صحیح است؟`,options:["English","School","Teacher","Book"],answer:0}));
 S.quiz={type:"contest",title:"مسابقه پایه "+g,questions:q.slice(0,20),i:0,correct:0,wrong:0};
 render("مسابقه",`<div id="contestQuiz"></div>`);quizRender("contestQuiz");
}

async function placementFinish(){
 const total=S.quiz.questions.length,score=S.quiz.correct;
 let level=score<=7?"A1":score<=12?"A2":score<=17?"B1":score<=22?"B2":score<=26?"C1":"C2";
 let desc={A1:"مقدماتی",A2:"پایه",B1:"متوسط",B2:"متوسط رو به بالا",C1:"پیشرفته",C2:"پیشرفته بسیار بالا"}[level];
 const el=document.getElementById("placementQuiz");if(!el)return;
 el.innerHTML=`<div class="card"><div class="levelResult"><div class="score">${Math.round(score/total*100)}%</div><h2>سطح پیشنهادی شما: ${level}</h2><h3>${desc}</h3><p>تعداد پاسخ صحیح: ${score} از ${total}</p><p class="muted">این نتیجه بر اساس عملکرد شما در ۳۰ سؤال واژگان و گرامر از آسان تا بسیار سخت محاسبه شده است.</p></div><button class="btn full" style="margin-top:12px" onclick="home()">بازگشت به خانه</button></div>`;
 if(S.student){
  try{await db.from("placement_results").insert({student_id:S.student.id,score,total,percentage:Math.round(score/total*100),level})}catch(e){}
  await addXP(20,"placement");
 }
}
const originalQuizFinish=quizFinish;

async function rejectStudent(id){try{const r=await db.from("students").update({status:"rejected"}).eq("id",id);if(r.error)throw r.error;admin()}catch(e){alert("خطا در رد کردن:\n"+e.message)}}
async function reservationStatus(id,status){try{const r=await db.from("teacher_reservations").update({status}).eq("id",id);if(r.error)throw r.error;admin()}catch(e){alert("خطا در تغییر وضعیت رزرو:\n"+e.message)}}

async function logout(){

 S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],examHistory:[]};

}
async function startup(){
 try{
  const r=await db.auth.getSession(),session=r.data?.session;
  if(!session){login();return}
  const user=session.user;
  if((user.email||"").toLowerCase()==="alinagheli@gmail.com"){S.admin=true;admin();return}
  const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle();
  if(st.data&&(st.data.status==="registered"||st.data.status==="approved")){S.student=st.data;await loadStudentStats();home();return}
  await db.auth.signOut();login();
 }catch(e){try{await db.auth.signOut()}catch(_){}login()}
}
