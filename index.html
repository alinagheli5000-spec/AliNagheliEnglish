function initPersianCalendar(teacherIndex){
  const today=getTodayJalali();
  window["_pcal_"+teacherIndex]={jy:today[0],jm:today[1],selected:null};
  renderPersianCalendar(teacherIndex);
  renderPersianTimes(teacherIndex);
}
function renderPersianCalendar(teacherIndex){
  const st=window["_pcal_"+teacherIndex];
  const el=document.getElementById("pcal-"+teacherIndex);
  if(!el) return;
  const daysInMonth=getJalaliMonthDays(st.jy,st.jm);
  const [gy,gm,gd]=jalaliToGregorian(st.jy,st.jm,1);
  const gDate=new Date(gy,gm-1,gd);
  const firstWeekDay=(gDate.getDay()+1)%7;
  let grid="";
  for(let i=0;i<firstWeekDay;i++) grid+=`<div class="pcalDay empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isSelected=st.selected && st.selected.jy===st.jy && st.selected.jm===st.jm && st.selected.jd===d;
    const todayJ=getTodayJalali();
    const isToday=todayJ[0]===st.jy && todayJ[1]===st.jm && todayJ[2]===d;
    grid+=`<div class="pcalDay ${isSelected?'selected':''} ${isToday?'today':''}" onclick="selectPersianDay(${teacherIndex},${d})">${d}</div>`;
  }
  el.innerHTML=`<div class="pcal">
    <div class="pcalHeader">
      <button class="pcalNav" onclick="pcalPrev(${teacherIndex})">‹</button>
      <span>${JALALI_MONTHS[st.jm-1]} ${st.jy}</span>
      <button class="pcalNav" onclick="pcalNext(${teacherIndex})">›</button>
    </div>
    <div class="pcalGrid">
      ${JALALI_WEEK.map(d=>`<div class="pcalDayName">${d}</div>`).join("")}
      ${grid}
    </div>
  </div>`;
}
function renderPersianTimes(teacherIndex){
  const st=window["_pcal_"+teacherIndex];
  const el=document.getElementById("ptime-"+teacherIndex);
  if(!el) return;
  if(!st.selected){el.innerHTML=`<p class="muted" style="text-align:center">ابتدا یک روز را انتخاب کنید</p>`;return}
  const times=["۰۹:۰۰","۱۰:۰۰","۱۱:۰۰","۱۴:۰۰","۱۵:۰۰","۱۶:۰۰","۱۷:۰۰","۱۸:۰۰","۱۹:۰۰","۲۰:۰۰"];
  el.innerHTML=`<label>ساعت مورد نظر</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-top:8px">
      ${times.map(t=>`<button class="btn secondary" style="padding:10px;font-size:13px" onclick="selectPersianTime(${teacherIndex},'${t}')">${t}</button>`).join("")}
    </div>
    <p class="muted" style="margin-top:10px">تاریخ انتخاب‌شده: <b>${st.selected.jd} ${JALALI_MONTHS[st.selected.jm-1]} ${st.selected.jy}</b>${st.time?` — ساعت <b>${st.time}</b>`:""}</p>
  `;
}
function selectPersianDay(teacherIndex,d){
  const st=window["_pcal_"+teacherIndex];
  st.selected={jy:st.jy,jm:st.jm,jd:d};
  st.time=null;
  renderPersianCalendar(teacherIndex);
  renderPersianTimes(teacherIndex);
}
function selectPersianTime(teacherIndex,t){
  const st=window["_pcal_"+teacherIndex];
  st.time=t;
  renderPersianTimes(teacherIndex);
}
function pcalPrev(teacherIndex){
  const st=window["_pcal_"+teacherIndex];
  st.jm--;
  if(st.jm<1){st.jm=12;st.jy--;}
  st.selected=null;st.time=null;
  renderPersianCalendar(teacherIndex);
  renderPersianTimes(teacherIndex);
}
function pcalNext(teacherIndex){
  const st=window["_pcal_"+teacherIndex];
  st.jm++;
  if(st.jm>12){st.jm=1;st.jy++;}
  st.selected=null;st.time=null;
  renderPersianCalendar(teacherIndex);
  renderPersianTimes(teacherIndex);
}

/* ==================== SRS System (Spaced Repetition) ==================== */
async function loadSRS(){
  if(!S.student) return;
  try{
    const r=await db.from("srs_cards").select("*").eq("student_id",S.student.id);
    S.srs={};
    (r.data||[]).forEach(c=>{
      S.srs[c.word]={
        box:c.box||1, nextReview:c.next_review,
        lastReview:c.last_review, mastered:Boolean(c.mastered),
        correct:Number(c.correct_count||0), wrong:Number(c.wrong_count||0)
      };
    });
  }catch(e){ S.srs={}; }
}

async function saveSRSCard(word, box, mastered, correct, wrong){
  if(!S.student) return;
  const intervals=[0, 1, 3, 7, 14, 30, 90];
  const nextIdx=Math.min(box, intervals.length-1);
  const nextReview=new Date(Date.now()+intervals[nextIdx]*86400000).toISOString();
  S.srs[word]={box, nextReview, lastReview:new Date().toISOString(), mastered, correct, wrong};
  try{
    await db.from("srs_cards").upsert({
      student_id:S.student.id,
      word,
      box, next_review:nextReview,
      last_review:new Date().toISOString(),
      mastered,
      correct_count:correct,
      wrong_count:wrong,
      updated_at:new Date().toISOString()
    },{onConflict:"student_id,word"});
  }catch(e){}
}

function getDueCards(){
  const now=Date.now();
  const due=[];
  Object.keys(S.srs).forEach(w=>{
    const c=S.srs[w];
    if(!c.mastered && (!c.nextReview || new Date(c.nextReview).getTime()<=now)){
      due.push(w);
    }
  });
  return due;
}

async function logStudy(activity, count){
  if(!S.student) return;
  const today=new Date().toISOString().slice(0,10);
  const cur=S.studyLog[today]||{xp_gained:0, minutes:0, lessons:0, words:0, exams:0};
  const upd={
    ...cur,
    xp_gained:(cur.xp_gained||0)+(count||0),
    [activity]:(cur[activity]||0)+1
  };
  S.studyLog[today]=upd;
  try{
    await db.from("study_log").upsert({
      student_id:S.student.id,
      study_date:today,
      xp_gained:upd.xp_gained,
      minutes:upd.minutes||0,
      lessons:upd.lessons||0,
      words:upd.words||0,
      exams:upd.exams||0
    },{onConflict:"student_id,study_date"});
  }catch(e){}
}

/* ==================== Dictionary ==================== */
function getAllWords(){
  const arr=[];
  Object.keys(words).forEach(k=>{
    (words[k]||[]).forEach(w=>{
      arr.push({en:w[0], fa:w[1], grade:(k<8?7:k<15?8:k<21?9:k<25?10:k<28?11:12)});
    });
  });
  // اضافه کردن کلمات اضافی از بازی‌ها و SRS
  Object.keys(S.srs||{}).forEach(w=>{
    const found=arr.find(x=>x.en===w);
    if(!found){
      // شاید از بازی بوده
      const mem=getMemoryGameData().find(x=>x[0]===w);
      if(mem) arr.push({en:mem[0],fa:mem[1],grade:0});
    }
  });
  // حذف تکراری‌ها
  const seen=new Set();
  return arr.filter(x=>{
    if(seen.has(x.en)) return false;
    seen.add(x.en);
    return true;
  });
}

function startSRS(mode){
  let pool=[];
  if(mode==="due"){
    const due=getDueCards();
    if(!due.length){toast("کارتی برای مرور نیست! بعداً سر بزن.","info");return}
    const all=getAllWords();
    pool=due.map(w=>{
      const found=all.find(x=>x.en===w);
      return found?found:{en:w,fa:"—"};
    });
  } else {
    // از همه کلمات درس‌ها - فیلتر آن‌هایی که توی SRS نیستن یا کم‌مرور شدن
    const all=getAllWords();
    pool=shuffle(all.filter(w=>!S.srs[w.en] || !S.srs[w.en].mastered)).slice(0,20);
    if(!pool.length){toast("همه کلمات مرور شدن! 🎉","success");return}
  }
  S._srsSession={mode, list:shuffle(pool), index:0, flipped:false, correct:0, wrong:0};
  srsRender();
}
function srsRender(){
  const ses=S._srsSession;
  if(!ses){ home(); return; }
  if(ses.index>=ses.list.length){ return srsFinish(); }
  const w=ses.list[ses.index];
  const stage = ses.flipped?"back":"front";
  render("فلش‌کارت",`
    <div class="card" style="max-width:500px;margin:auto">
      <button class="btn secondary" onclick="flashcardPage()">← خروج</button>
      <div style="text-align:center;margin-top:12px">
        <span class="badge">${ses.index+1} از ${ses.list.length}</span>
        <span class="badge">✅ ${ses.correct}</span>
        <span class="badge">❌ ${ses.wrong}</span>
      </div>
      <div class="flashcard ${ses.flipped?'flipped':''}" onclick="srsFlip()">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <div class="flashcard-hint">${ses.mode==="due"?"مرور":"جدید"}</div>
            <div class="flashcard-word">${esc(w.en)}</div>
            <div class="flashcard-hint">👆 برای دیدن معنی کلیک کن</div>
            <button class="btn secondary" style="margin-top:10px" onclick="event.stopPropagation();speak('${esc(w.en).replace(/'/g,"\\'")}')">🔊 تلفظ</button>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-hint">فارسی</div>
            <div class="flashcard-word" style="font-size:26px">${esc(w.fa)}</div>
            <div class="flashcard-hint">حالا بلد بودی؟</div>
          </div>
        </div>
      </div>
      ${ses.flipped?`
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn danger full" onclick="srsAnswer(false)">❌ بلد نبودم</button>
          <button class="btn success full" onclick="srsAnswer(true)">✅ بلد بودم</button>
        </div>
      `:`
        <button class="btn full" style="margin-top:14px" onclick="srsFlip()">🔄 نمایش پاسخ</button>
      `}
    </div>
  `);
}
function srsFlip(){
  if(!S._srsSession) return;
  S._srsSession.flipped=!S._srsSession.flipped;
  srsRender();
}
async function srsAnswer(correct){
  const ses=S._srsSession;
  if(!ses) return;
  const w=ses.list[ses.index];
  const card=S.srs[w.en]||{box:1,correct:0,wrong:0,mastered:false};
  let newBox=card.box||1;
  let newCorrect=(card.correct||0)+(correct?1:0);
  let newWrong=(card.wrong||0)+(correct?0:1);
  let mastered=card.mastered||false;
  if(correct){
    newBox=Math.min(newBox+1, 7);
    if(newBox>=6) mastered=true;
    ses.correct++;
  } else {
    newBox=1;
    mastered=false;
    ses.wrong++;
  }
  await saveSRSCard(w.en, newBox, mastered, newCorrect, newWrong);
  ses.index++;
  ses.flipped=false;
  srsRender();
}
function srsFinish(){
  const ses=S._srsSession;
  const total=ses.correct+ses.wrong;
  const percent=total?Math.round(ses.correct/total*100):0;
  addXP(Math.round(percent/5));
  logStudy("words", total);
  render("پایان مرور",`

      <button class="btn secondary full" style="margin-top:8px" onclick="home()">خانه</button>
    </div>
  `);
  S._srsSession=null;
}

async function adminLoadUnlocks(studentId){
  const area=document.getElementById("adminUnlockArea");
  if(!area)return;
  if(!studentId){area.innerHTML="";return}
  let unlocked={};
  try{
    const r=await db.from("lesson_unlocks").select("grade,lesson_index").eq("student_id",studentId);
    (r.data||[]).forEach(x=>{unlocked[`${x.grade}-${x.lesson_index}`]=true});
  }catch(e){}
  let html="";
  for(let g=7;g<=12;g++){
    html+=`<h4 style="margin:14px 0 6px;color:var(--primary)">پایه ${g}</h4><div style="display:flex;flex-wrap:wrap;gap:6px">`;
    books[g].lessons.forEach((les,i)=>{
      const isUn=i===0||unlocked[`${g}-${i}`];
      html+=`<button class="btn ${isUn?'success':'secondary'}" style="font-size:11px;padding:8px 10px" onclick="adminToggleUnlock('${studentId}',${g},${i},${!isUn})" title="${esc(les)}">${i+1}. ${isUn?'🔓':'🔒'}</button>`;
    });
    html+=`</div>`;
  }
  area.innerHTML=html;
}
async function adminToggleUnlock(studentId,grade,lessonIndex,unlock){
  if(lessonIndex===0){toast("درس ۱ همیشه باز است.","warning");return}
  try{
    if(unlock){
      await db.from("lesson_unlocks").upsert({
        student_id:studentId,
        grade:Number(grade),
        lesson_index:Number(lessonIndex),
        payment_ref:"admin",
        unlocked_at:new Date().toISOString()
      },{onConflict:"student_id,grade,lesson_index"});
    }else{
      await db.from("lesson_unlocks").delete().eq("student_id",studentId).eq("grade",grade).eq("lesson_index",lessonIndex);
    }
  }catch(e){toast("خطا: "+e.message,"error")}
  adminLoadUnlocks(studentId);
}

async function startup(){
  try{
    // بررسی کد معرف در URL
    const urlParams=new URLSearchParams(location.search);
    const refFromUrl=urlParams.get("ref");
    if(refFromUrl){
      try{
        sessionStorage.setItem("AN_REFERRAL", refFromUrl);
      }catch(e){}
    }
    
    const r=await db.auth.getSession();
    const session=r.data?.session;
    if(!session){
      setTimeout(()=>{hideSplash();landing()},1500);
      return;
    }
    const user=session.user;
    if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){
      S.admin=true;
      setTimeout(()=>{hideSplash();admin()},1500);
      return;
    }
    const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle();
    if(st.data&&["registered","approved"].includes(st.data.status)){
      S.student=st.data;
      await loadStudentStats();
      await loadUnlocks();
      loadStreak();
      loadGameRecords();
      await loadQAs();
      await loadHomeworks();
      await loadSRS();
      await loadStudyLog();
      setTimeout(()=>{hideSplash();home()},1500);
      return;
    }
    await db.auth.signOut();
    setTimeout(()=>{hideSplash();landing()},1500);
  }catch(e){
    try{await db.auth.signOut()}catch(_){}
    setTimeout(()=>{hideSplash();landing()},1500);
  }
}

/* ==================== Service Worker (PWA Offline) ==================== */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    const swCode=`
      const CACHE_NAME="an-english-v2";
      self.addEventListener("install",e=>{self.skipWaiting()});
      self.addEventListener("activate",e=>{
        e.waitUntil(
          caches.keys().then(names=>Promise.all(
            names.filter(n=>n!==CACHE_NAME).map(n=>caches.delete(n))
          )).then(()=>self.clients.claim())
        );
      });
      self.addEventListener("fetch",e=>{
        const url=new URL(e.request.url);
        // فقط درخواست‌های CDN و Google Fonts رو کش کن
        if(url.hostname.includes("fonts.googleapis.com")||
           url.hostname.includes("fonts.gstatic.com")||
           url.hostname.includes("cdn.jsdelivr.net")){
          e.respondWith(
            caches.match(e.request).then(cached=>{
              return cached || fetch(e.request).then(res=>{
                const clone=res.clone();
                caches.open(CACHE_NAME).then(c=>c.put(e.request,clone));
                return res;
              });
            })
          );
        }
      });
    `;
    try{
      const blob=new Blob([swCode],{type:"application/javascript"});
      const url=URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(()=>{});
    }catch(e){}
  });
}

  const sp=document.getElementById("splash");
  if(sp && sp.style.display!=="none"){
    console.log("[AN] Force hiding splash after timeout");
  }
}, 2000);

startup();

/* ==================== خطایابی ==================== */
window.addEventListener("error", (e)=>{
  console.error("[AN Error]", e.error||e.message);
  // فقط خطاهای بحرانی رو نمایش بده
  if(e.message && !e.message.includes("ResizeObserver")){
    // toast("خطا: "+e.message, "error", 5000);
  }
});
window.addEventListener("unhandledrejection", (e)=>{
  console.error("[AN Promise Error]", e.reason);
});
</script>
