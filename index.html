  if(ev&&ev.target) ev.target.classList.add("active");
  const content = document.getElementById("tsContent");
  if(content) content.innerHTML = renderTSTabContent(ls);
  if(tab==="quiz") renderTSQuizState(ls);
}

function renderTSTabContent(ls){
  if(currentTSTab==="grammar"){
    if(!ls.grammar||!ls.grammar.length) return '<p class="muted">گرامری برای این درس ثبت نشده.</p>';
    return ls.grammar.map(g=>`
      <div class="tsGrammar">
        <h4>📘 ${esc(g.h)}</h4>
        <div class="exBox">${esc(g.ex)}</div>
        <p style="margin:8px 0 4px"><b>ترجمه/توضیح:</b> ${esc(g.fa)}</p>
        ${g.note?`<p class="muted" style="margin:6px 0 0"><b>📌 نکته:</b> ${esc(g.note)}</p>`:""}
      </div>
    `).join("");
  }
  if(currentTSTab==="vocab"){
    if(!ls.vocab||!ls.vocab.length) return '<p class="muted">لغتی برای این درس ثبت نشده.</p>';
    return `<p class="muted" style="margin-bottom:12px">🔊 برای شنیدن تلفظ، روی هر کلمه کلیک کن</p>
      <div class="tsWordGrid">
        ${ls.vocab.map(v=>`<div class="tsWord" onclick='speak(${JSON.stringify(v[0])})'><div class="en">🔊 ${esc(v[0])}</div><div class="fa">${esc(v[1])}</div></div>`).join("")}
      </div>`;
  }
  if(currentTSTab==="dialog"){
    if(!ls.dialog||!ls.dialog.length) return '<p class="muted">مکالمه‌ای برای این درس ثبت نشده.</p>';
    return ls.dialog.map(d=>`
      <div class="tsDialog">
        <div class="dlgTitle">💬 ${esc(d.title)}</div>
        ${d.lines.map((l,idx)=>`
          <div class="dlgLine ${idx%2===0?"dlgA":"dlgB"}">
            <span class="spk">${esc(l.who)}:</span>${esc(l.text)}
          </div>
        `).join("")}
        ${d.fa?`<div class="dlgFa">📝 ${esc(d.fa)}</div>`:""}
      </div>
    `).join("");
  }
  if(currentTSTab==="summary"){
    if(!ls.summary||!ls.summary.length) return '<p class="muted">خلاصه‌ای برای این درس ثبت نشده.</p>';
    return `<div class="tsSummary">
      <h4>📝 خلاصه درس ${currentTSLesson+1}: ${esc(ls.title)}</h4>
      <ul>${ls.summary.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
    </div>`;
  }
  if(currentTSTab==="quiz"){
    if(!ls.quiz||!ls.quiz.length) return '<p class="muted">آزمونی برای این درس ثبت نشده.</p>';
    const shuffledQuiz = shuffleQuestionOptions(ls.quiz);
    return `<div class="tsQuizBox" id="tsQuizContainer">
      <h4>🎯 آزمون درس ${currentTSLesson+1}: ${esc(ls.title)}</h4>
      <div id="tsQuizQuestions">
        ${shuffledQuiz.map((q,qi)=>`
          <div class="tsQuizQ" data-q="${qi}">
            <div class="qText">${qi+1}. ${esc(q.q)}</div>
            ${q.options.map((opt,oi)=>`<button class="tsQuizOpt" onclick="answerTSQuiz(${qi},${oi},${q.answer},this)">${esc(opt)}</button>`).join("")}
          </div>
        `).join("")}
      </div>
      <div id="tsQuizResult" style="margin-top:14px;text-align:center;font-weight:800;font-size:16px;color:var(--primary)"></div>
      <button class="btn full" style="margin-top:12px" onclick="resetTSQuiz()">🔄 شروع مجدد آزمون</button>
    </div>`;
  }
  return "";
}

let tsQuizAnswered = {};

function answerTSQuiz(qi, oi, correct, btn){
  if(tsQuizAnswered[qi]) return;
  tsQuizAnswered[qi] = true;
  const parent = btn.parentElement;
  const buttons = parent.querySelectorAll(".tsQuizOpt");
  buttons.forEach(b=>b.disabled=true);
  if(oi===correct){ 
    btn.classList.add("correct"); 
    btn.textContent = "✅ " + btn.textContent;
  } else { 
    btn.classList.add("wrong"); 
    btn.textContent = "❌ " + btn.textContent;
    buttons[correct].classList.add("correct");
    buttons[correct].textContent = "✅ " + buttons[correct].textContent;
  }
  const ls = tsData[currentTSBook][currentTSLesson];
  const total = ls.quiz.length;
  const answered = Object.keys(tsQuizAnswered).length;
  if(answered >= total){
    const rEl = document.getElementById("tsQuizResult");
    if(rEl){
      let totalCorrect = 0;
      ls.quiz.forEach((q,idx)=>{ 
        if(tsQuizAnswered[idx]){ 
          const p = document.querySelector(`.tsQuizQ[data-q="${idx}"]`); 
          if(p && p.querySelector(".tsQuizOpt.correct") && !p.querySelector(".tsQuizOpt.wrong")) totalCorrect++; 
        } 
      });
      const percent = Math.round((totalCorrect/total)*100);
      rEl.textContent = `🎉 نتیجه: ${totalCorrect} از ${total} (${percent}%)`;
      if(S.student && percent>=50){ addXP(Math.max(5, Math.round(percent/5))); }
    }
  }
}

function resetTSQuiz(){
  tsQuizAnswered = {};
  const ls = tsData[currentTSBook][currentTSLesson];
  const content = document.getElementById("tsContent");
  if(content) content.innerHTML = renderTSTabContent(ls);
}

function renderTSQuizState(ls){
  tsQuizAnswered = {};
}

async function loadQAs(){ 
  if(!S.student)return; 
  try{ 
    const r=await db.from("student_questions").select("*").eq("student_id",S.student.id).order("created_at",{ascending:false}); 
    S.qas=r.data||[]; 
  }catch(e){S.qas=[]} 
}
async function loadHomeworks(){ 
  if(!S.student)return; 
  try{ 
    const r=await db.from("student_homeworks").select("*").eq("student_id",S.student.id).order("created_at",{ascending:false}); 
    S.homeworks=r.data||[]; 
  }catch(e){S.homeworks=[]} 
}

  if(!S.student){toast("ابتدا وارد شوید","error");return} 
  const list=S.qas; 
  render("پرسش از استاد",`<div class="card"><button class="btn secondary" onclick="home()">← بازگشت</button><h2>💬 پرسش از استاد</h2><button class="btn full" onclick="askQuestion()">✏️ پرسش جدید</button></div>${list.length?list.map(q=>{ const teacher=getTeacher(q.teacher_id); return `<div class="qaThread" onclick="openThread('${q.id}')" style="cursor:pointer"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>${esc(q.subject||"")}</b><span class="qaStatus ${q.teacher_reply?"answered":"open"}">${q.teacher_reply?"✅":"⏳"}</span></div><div class="muted">👨‍🏫 ${esc(teacher.name)}</div></div>`; }).join(""):`<div class="card"><p class="muted" style="text-align:center">هنوز سؤالی نپرسیدی.</p></div>`}`); 
}
function askQuestion(){ 
  render("پرسش جدید",`<div class="card"><button class="btn secondary" onclick="qaPage()">← بازگشت</button><h2>✏️ پرسش جدید</h2><label>استاد</label><select id="qTeacher">${teachersData.map(t=>`<option value="${t.id}">${t.icon} ${esc(t.name)}</option>`).join("")}</select><label>موضوع</label><input id="qSubject"><label>سؤال</label><textarea id="qBody"></textarea><button class="btn full" onclick="submitQuestion()">📨 ارسال</button></div>`); 
}
async function submitQuestion(){ 
  const teacher_id=document.getElementById("qTeacher").value; 
  const subject=document.getElementById("qSubject").value.trim(); 
  const question=document.getElementById("qBody").value.trim(); 
  if(!subject||!question){toast("پر کن","error");return} 
  try{ 
    const r=await db.from("student_questions").insert({student_id:S.student.id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,student_phone:S.student.phone,teacher_id,subject,question,student_read:true}); 
    if(r.error)throw r.error; 
    toast("ارسال شد ✅","success"); 
    await loadQAs(); 
    qaPage(); 
  }catch(e){toast("خطا: "+e.message,"error")} 
}
async function openThread(id){ 
  const q=S.qas.find(x=>x.id===id); 
  if(!q)return; 
  const teacher=getTeacher(q.teacher_id); 
  render("گفت‌وگو",`<div class="card"><button class="btn secondary" onclick="qaPage()">← بازگشت</button><h2>${esc(q.subject)}</h2><div style="margin:20px 0"><div class="qaMsg student"><div class="meta">👤 شما</div>${esc(q.question)}</div>${q.teacher_reply?`<div class="qaMsg teacher"><div class="meta">👨‍🏫 ${esc(teacher.name)}</div>${esc(q.teacher_reply)}</div>`:`<p class="muted" style="text-align:center">⏳ در انتظار...</p>`}</div></div>`); 
  if(q.teacher_reply&&!q.student_read){ 
    try{await db.from("student_questions").update({student_read:true}).eq("id",id);}catch(e){} 
  } 
}

function showTSLockedMessage(bookId, lessonIndex){
  const pricing = PRICING.talkBooks[bookId] || { single: 299000, full: 799000 };
  const bookInfo = TALK_BOOKS.adults.find(b=>b.id===bookId) || {title: bookId};
  showPaymentModal({
    title: `باز کردن درس ${lessonIndex+1} از ${bookInfo.title}`,
    amount: pricing.single,
    packageType: "single",
    bookId: bookId,
    lessonIndex: lessonIndex
  });
}

function openTSLesson(i){
  if(!isTSLessonUnlocked(currentTSBook, i)){
    showTSLockedMessage(currentTSBook, i);
    return;
  }
  currentTSLesson = i;
  currentTSTab = "grammar";
  renderTSLesson();
}

function renderTSLesson(){
  const ls = tsData[currentTSBook][currentTSLesson];
  if(!ls){toast("درس پیدا نشد","error");return}

function setTSTab(tab,ev){
  currentTSTab = tab;

  document.querySelectorAll(".tsTab").forEach(b=>b.classList.remove("active"));
  if(ev&&ev.target) ev.target.classList.add("active");
  const content = document.getElementById("tsContent");
  if(content) content.innerHTML = renderTSTabContent(ls);
  if(tab==="quiz") renderTSQuizState(ls);
}

function renderTSTabContent(ls){
  if(currentTSTab==="grammar"){
    if(!ls.grammar||!ls.grammar.length) return '<p class="muted">گرامری برای این درس ثبت نشده.</p>';
    return ls.grammar.map(g=>`
      <div class="tsGrammar">
        <h4>📘 ${esc(g.h)}</h4>
        <div class="exBox">${esc(g.ex)}</div>

        ${g.note?`<p class="muted" style="margin:6px 0 0"><b>📌 نکته:</b> ${esc(g.note)}</p>`:""}
      </div>
    `).join("");
  }
  if(currentTSTab==="vocab"){
    if(!ls.vocab||!ls.vocab.length) return '<p class="muted">لغتی برای این درس ثبت نشده.</p>';

        ${ls.vocab.map(v=>`<div class="tsWord" onclick='speak(${JSON.stringify(v[0])})'><div class="en">🔊 ${esc(v[0])}</div><div class="fa">${esc(v[1])}</div></div>`).join("")}
      </div>`;
  }
  if(currentTSTab==="dialog"){
    if(!ls.dialog||!ls.dialog.length) return '<p class="muted">مکالمه‌ای برای این درس ثبت نشده.</p>';
    return ls.dialog.map(d=>`
      <div class="tsDialog">

        ${d.lines.map((l,idx)=>`
          <div class="dlgLine ${idx%2===0?"dlgA":"dlgB"}">
            <span class="spk">${esc(l.who)}:</span>${esc(l.text)}
          </div>
        `).join("")}
        ${d.fa?`<div class="dlgFa">📝 ${esc(d.fa)}</div>`:""}
      </div>
    `).join("");
  }
  if(currentTSTab==="summary"){
    if(!ls.summary||!ls.summary.length) return '<p class="muted">خلاصه‌ای برای این درس ثبت نشده.</p>';
    return `<div class="tsSummary">
      <h4>📝 خلاصه درس ${currentTSLesson+1}: ${esc(ls.title)}</h4>
      <ul>${ls.summary.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
    </div>`;
  }
    if(currentTSTab==="quiz"){
    if(!ls.quiz||!ls.quiz.length) return '<p class="muted">آزمونی برای این درس ثبت نشده.</p>';
    const shuffledQuiz = shuffleQuestionOptions(ls.quiz);
    return `<div class="tsQuizBox" id="tsQuizContainer">
      <h4>🎯 آزمون درس ${currentTSLesson+1}: ${esc(ls.title)}</h4>
      <div id="tsQuizQuestions">
        ${shuffledQuiz.map((q,qi)=>`
          <div class="tsQuizQ" data-q="${qi}">
            <div class="qText">${qi+1}. ${esc(q.q)}</div>
            ${q.options.map((opt,oi)=>`<button class="tsQuizOpt" onclick="answerTSQuiz(${qi},${oi},${q.answer},this)">${esc(opt)}</button>`).join("")}
          </div>
        `).join("")}
      </div>
      <div id="tsQuizResult" style="margin-top:14px;text-align:center;font-weight:800;font-size:16px;color:var(--primary)"></div>
      <button class="btn full" style="margin-top:12px" onclick="resetTSQuiz()">🔄 شروع مجدد آزمون</button>
    </div>`;
  }

let tsQuizAnswered = {};


let tsCurrentQuiz = [];

function answerTSQuiz(qi, oi, correct, btn){
  if(tsQuizAnswered[qi]) return;
  tsQuizAnswered[qi] = true;
  const parent = btn.parentElement;
  const buttons = parent.querySelectorAll(".tsQuizOpt");
  buttons.forEach(b=>b.disabled=true);
  if(oi===correct){ 
    btn.classList.add("correct"); 
    btn.textContent = "✅ " + btn.textContent;
  } else { 
    btn.classList.add("wrong"); 
    btn.textContent = "❌ " + btn.textContent;
    buttons[correct].classList.add("correct");
    buttons[correct].textContent = "✅ " + buttons[correct].textContent;
  }
  const ls = tsData[currentTSBook][currentTSLesson];
  const total = ls.quiz.length;
  const answered = Object.keys(tsQuizAnswered).length;
  if(answered >= total){
    const rEl = document.getElementById("tsQuizResult");
    if(rEl){
      let totalCorrect = 0;
      ls.quiz.forEach((q,idx)=>{ 
        if(tsQuizAnswered[idx]){ 
          const p = document.querySelector(`.tsQuizQ[data-q="${idx}"]`); 
          if(p && p.querySelector(".tsQuizOpt.correct") && !p.querySelector(".tsQuizOpt.wrong")) totalCorrect++; 
        } 
      });
      const percent = Math.round((totalCorrect/total)*100);
      rEl.textContent = `🎉 نتیجه: ${totalCorrect} از ${total} (${percent}%)`;
      if(S.student && percent>=50){ addXP(Math.max(5, Math.round(percent/5))); }
    }
  }
}

function resetTSQuiz(){
  tsQuizAnswered = {};

}

function renderTSQuizState(ls){

}

  if(!S.currentGame||!S.currentGame.started) return; 
  S.currentGame.started=false; 
  if(S.currentGame.timer){clearInterval(S.currentGame.timer);S.currentGame.timer=null;} 
  const isNewRecord=saveGameRecord(S.currentGame.id,S.currentGame.score); 
  const area=document.getElementById("gameArea"); 
  if(!area) return; 
  let bonusXP=Math.floor(S.currentGame.score/10)*2; 
  if(isNewRecord) bonusXP+=20; 
  if(S.student && bonusXP>0) await addXP(bonusXP); 
  area.innerHTML=`<div class="gameScoreBig">${S.currentGame.score}</div><h3 style="text-align:center;margin:10px 0">${isNewRecord?"🎉 رکورد جدید زدی!":"بازی تمام شد"}</h3><p class="muted" style="text-align:center">🏆 بهترین رکورد: ${S.gameRecords[S.currentGame.id]||0}</p>${bonusXP>0?`<p style="text-align:center;color:var(--primary);font-weight:800">+${bonusXP} XP کسب کردی!</p>`:""}<div style="display:flex;gap:10px;margin-top:20px"><button class="btn full" onclick="startGame('${S.currentGame.id}')">🔁 بازی مجدد</button><button class="btn secondary full" onclick="home()">بازگشت به خانه</button></div>`;

function startPlacementTest(kind){ 
  const source = kind==="grammar"? grammarPlacementQ : vocabPlacementQ; 
  const title = kind==="grammar"? "تعیین سطح گرامر" : "تعیین سطح واژگان"; 
  const shuffledQuestions = shuffleQuestionOptions(source);
  S.quiz={ 
    type:"placement-"+kind,
    title,
    kind, 
    questions: shuffledQuestions, 
    i:0, 
    correct:0, 
    wrong:0, 
    levelScores:{A1:0,A2:0,B1:0,B2:0,C1:0,C2:0} 
  }; 
  render(title,`<div id="placementQuiz"></div>`); 
  placementQuizRender("placementQuiz"); 
}
function placementGrammar(){startPlacementTest("grammar")}
function placementVocab(){startPlacementTest("vocab")}
function placementQuizRender(id){ 
  const q=S.quiz.questions[S.quiz.i]; 
  if(!q){placementFinish();return} 
  const el=document.getElementById(id);if(!el)return; 
  el.innerHTML=`<div class="card"><b style="color:var(--primary)">سؤال ${S.quiz.i+1} از ${S.quiz.questions.length}</b><div class="progress"><i style="width:${S.quiz.i/S.quiz.questions.length*100}%"></i></div><div style="font-size:18px;font-weight:700;line-height:2;margin:18px 0;color:var(--primary-dark)">${esc(q.q)}</div>${q.options.map((x,i)=>`<button class="option" onclick="placementAnswerFinal(${i})">${esc(x)}</button>`).join("")}<div id="fb"></div></div>`; 
}
async function placementAnswerFinal(i){ 
  const q=S.quiz.questions[S.quiz.i]; 
  const opts=document.querySelectorAll(".option"); 
  opts.forEach(x=>x.disabled=true); 
  const isCorrect=(i===q.answer); 
  if(isCorrect){S.quiz.correct++;S.quiz.levelScores[q.level]=(S.quiz.levelScores[q.level]||0)+1;opts[i].classList.add("correct");} 
  else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct");} 
  setTimeout(async()=>{ 
    S.quiz.i++; 
    if(S.quiz.i>=S.quiz.questions.length) await placementFinish(); 
    else placementQuizRender("placementQuiz"); 
  },700); 
}
async function placementFinish(){ 
  const scores=S.quiz.levelScores; 
  const total=S.quiz.correct; 
  let level="A1"; 
  const order=["A1","A2","B1","B2","C1","C2"]; 
  for(const lv of order){ if((scores[lv]||0)>=3) level=lv; } 
  if(total<=3) level="A1"; 
  const descriptions={A1:"مبتدی",A2:"پیش‌متوسط",B1:"متوسط",B2:"متوسط بالا",C1:"پیشرفته",C2:"فوق‌پیشرفته 🏆"}; 
  const kind=S.quiz.kind; 
  const title=kind==="grammar"?"گرامر":"واژگان"; 
  if(S.student){ 
    try{await db.from("exam_results").insert({user_id:S.student.auth_user_id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,exam_type:"placement-"+kind,exam_title:"تعیین سطح "+title,score:total,total:S.quiz.questions.length,percentage:Math.round(total/S.quiz.questions.length*100)});}
    catch(e){} 
  } 
  const el=document.getElementById("placementQuiz"); 
  if(el) el.innerHTML=`<div class="card levelCard"><div style="font-size:13px;font-weight:800;opacity:.9">سطح ${title} شما</div><div class="lvl">${level}</div><p style="font-weight:700;margin:10px 0">${descriptions[level]}</p><p class="muted">✅ ${total} پاسخ درست از ${S.quiz.questions.length}</p></div><button class="btn full" onclick="home()">بازگشت</button>`; 
}

function shuffleQuestionOptions(questions){
  return questions.map(q => {
    const originalOptions = q.o || q.options || [];
    const originalAnswerText = originalOptions[q.a !== undefined ? q.a : q.answer];
    const shuffled = shuffle([...originalOptions]);
    const newAnswerIndex = shuffled.indexOf(originalAnswerText);
    return {
      q: q.q,
      options: shuffled,
      answer: newAnswerIndex,
      o: shuffled,
      a: newAnswerIndex,
      level: q.level,
      date: q.date
    };
  });
}

function makeLessonQuestions(){ 
  const gradeNum=S.grade; 
  const no=S.lesson+1; 
  const wl=getWords(gradeNum,no); 
  const arr=[]; 
  wl.forEach(function(w,i){ 
    const pool=shuffle(wl.filter(function(_,j){return j!==i}).map(function(x){return x[1]})).slice(0,3); 
    if(pool.length<3)return; 
    const opts=shuffle([w[1]].concat(pool)); 
    arr.push({q:'معنی «'+w[0]+'» چیست؟',o:opts,a:opts.indexOf(w[1])}); 
  }); 
  const shuffledQuestions = shuffle(arr).slice(0,10);
  return shuffleQuestionOptions(shuffledQuestions);
}

function getAllDictionaryWords(){
  const allWords = [];
  const gradeLessonMap = { 7:[1,2,3,4,5,6,7,8], 8:[1,2,3,4,5,6,7], 9:[1,2,3,4,5,6], 10:[1,2,3,4], 11:[1,2,3], 12:[1,2,3] };
  for(const g of Object.keys(gradeLessonMap)){
    const gradeNum = Number(g);
    for(const ln of gradeLessonMap[g]){
      const key = getWordKey(gradeNum, ln);
      const wl = (key!==null && words[key]) ? words[key] : [];
      wl.forEach(w => { if(w && w[0] && w[1]){ allWords.push({en:String(w[0]), fa:String(w[1]), grade:gradeNum, lesson:ln}); } });
    }
  }
  return allWords;
}

let dictCurrentFilter = "all";

function dictFilter(g){
  dictCurrentFilter = (g==="all")?"all":Number(g);
  document.querySelectorAll(".dictFilter").forEach(b=>{

    if(dictCurrentFilter==="all") b.classList.toggle("active", txt.includes("همه"));
    else b.classList.toggle("active", txt.includes("پایه "+dictCurrentFilter));
  });
  dictRender();

function dictRender(){
  const el = document.getElementById("dictResults"); if(!el) return;
  if(!dictCache) dictCache = getAllDictionaryWords();

  if(dictCurrentFilter !== "all") items = items.filter(w=>w.grade===dictCurrentFilter);

  if(!items.length){ el.innerHTML = `<div class="card dictEmpty"><span class="icon">🔍</span><b>لغتی با این جستجو پیدا نشد</b><p class="muted">سعی کن عبارت دیگری جستجو کنی</p></div>`; return; }

}

              <div class="muted">وضعیت: <b style="color:${x.status==='waiting'?'var(--warning)':x.status==='rejected'?'var(--danger)':'var(--success)'}">${x.status==="waiting"?"⏳ در انتظار":x.status==="rejected"?"❌ رد شده":"✅ تأیید شده"}</b></div>
            </div>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn info" style="padding:8px 14px;font-size:12px" onclick="resetStudentPassword(${x.id},'${esc(x.first_name)} ${esc(x.last_name)}','${esc(x.phone||"")}')">🔑 ریست پسورد</button>
            <button class="btn warning" style="padding:8px 14px;font-size:12px" onclick="openUnlockPanel(${x.id},'${esc(x.first_name)} ${esc(x.last_name)}')">🔓 مدیریت قفل دروس</button>
            <button class="btn danger" style="padding:8px 14px;font-size:12px" onclick="deleteStudent(${x.id},'${esc(x.first_name)} ${esc(x.last_name)}')">🗑️ حذف کامل</button>
          </div>
        </div>
      `).join(""):`<p class="muted">هنوز کسی ثبت‌نام نکرده.</p>`}
    </div>

    <!-- ==================== پنل باز کردن قفل ==================== -->
    <div class="card" id="unlockPanel" style="display:none">
      <h3 style="margin-top:0">🔓 مدیریت قفل دروس</h3>
      <div id="unlockPanelContent"></div>
    </div>

    <!-- ==================== سؤالات ==================== -->
    <div class="card">
      <h3 style="margin-top:0">💬 سؤالات زبان‌آموزان</h3>
      ${questions.length?questions.map(q=>`
        <div class="adminRow">
          <b>${esc(q.student_name||"")}</b>
          <div class="muted">📌 ${esc(q.subject||"")}<br>❓ ${esc(q.question||"")}</div>
          ${q.teacher_reply?`
            <div style="margin-top:10px;background:var(--bg-grad-1);padding:10px;border-radius:12px">
              <b>✅ پاسخ:</b> ${esc(q.teacher_reply)}
            </div>
            <button class="btn secondary" style="margin-top:8px;padding:8px 14px;font-size:12px" onclick="deleteQuestion('${q.id}')">🗑️ حذف سؤال</button>
          `:`
            <label style="margin-top:10px">پاسخ:</label>
            <textarea id="qr${q.id}" placeholder="پاسخ خود را بنویسید..." style="min-height:80px"></textarea>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
              <button class="btn success" onclick="replyQuestion('${q.id}')">📨 ارسال پاسخ</button>
              <button class="btn danger" style="padding:8px 14px;font-size:12px" onclick="deleteQuestion('${q.id}')">🗑️ حذف</button>
            </div>
          `}
        </div>
      `).join(""):`<p class="muted">هنوز سؤالی پرسیده نشده.</p>`}
    </div>

    <!-- ==================== تکالیف ==================== -->
    <div class="card">
      <h3 style="margin-top:0">📝 تکالیف ارسال شده</h3>
      ${homeworks.length?homeworks.map(h=>`
        <div class="adminRow">
          <b>${esc(h.student_name||"")}</b>
          <div class="muted">📌 ${esc(h.title||"")}<br>📄 ${esc(h.description||"")}</div>
          ${h.link?`<div class="muted">🔗 <a href="${esc(h.link)}" target="_blank" style="color:var(--primary)">${esc(h.link)}</a></div>`:""}
          ${h.grade!=null?`
            <div style="margin-top:10px;background:var(--bg-grad-1);padding:10px;border-radius:12px">
              <b>✅ نمره: ${h.grade}/20</b>
            </div>
            <button class="btn secondary" style="margin-top:8px;padding:8px 14px;font-size:12px" onclick="deleteHomework('${h.id}')">🗑️ حذف</button>
          `:`
            <label style="margin-top:10px">نمره (از ۲۰):</label>
            <input id="hg${h.id}" type="number" min="0" max="20" placeholder="مثال: 18" style="max-width:150px">
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
              <button class="btn success" onclick="gradeHomework('${h.id}')">📝 ثبت نمره</button>
              <button class="btn danger" style="padding:8px 14px;font-size:12px" onclick="deleteHomework('${h.id}')">🗑️ حذف</button>
            </div>
          `}
        </div>
      `).join(""):`<p class="muted">هنوز تکلیفی ارسال نشده.</p>`}
    </div>

    <button class="btn secondary full" onclick="logout()">🚪 خروج از پنل مدیریت</button>
  </main>
  <div class="toast-wrap" id="toastWrap"></div>`; 
}

/* ==================== پنل باز کردن قفل دروس ==================== */
function openUnlockPanel(studentId, studentName){
  const panel = document.getElementById("unlockPanel");
  const content = document.getElementById("unlockPanelContent");
  if(!panel || !content) return;
  panel.style.display = "block";
  
  let html = `<p class="muted">مدیریت دسترسی دروس برای <b>${esc(studentName)}</b></p>`;
  
  // دروس مدرسه
  html += `<h4 style="margin-top:20px;color:var(--primary)">🏫 دروس مدرسه</h4>`;
  for(let g=7; g<=12; g++){
    html += `<div style="margin-top:12px"><b style="color:var(--text)">پایه ${g} — ${esc(books[g].title)}</b></div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">`;
    books[g].lessons.forEach((lesson, i)=>{
      html += `<button class="btn ${i===0?'success':'secondary'}" style="padding:6px 12px;font-size:11px" onclick="toggleUnlock(${studentId},'grade',${g},${i})">${i===0?'✅':'🔓'} درس ${i+1}</button>`;
    });
    html += `</div>`;
  }
  
  // آزمون‌های نهایی
  html += `<h4 style="margin-top:24px;color:var(--primary)">📄 آزمون‌های نهایی</h4>`;
  html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">`;
  [10,11,12].forEach(g=>{
    html += `<button class="btn secondary" style="padding:6px 12px;font-size:11px" onclick="toggleUnlock(${studentId},'final-exam',${g},0)">📄 آزمون پایه ${g}</button>`;
  });
  html += `</div>`;
  
  // کتاب‌های مکالمه
  html += `<h4 style="margin-top:24px;color:var(--primary)">🎤 کتاب‌های مکالمه</h4>`;
  ["ts1","ts2","ts3","ts4","vp1","vp2"].forEach(bookId=>{
    const book = TALK_BOOKS.adults.find(b=>b.id===bookId);
    if(!book) return;
    const lessons = tsData[bookId] || [];
    html += `<div style="margin-top:12px"><b style="color:var(--text)">${esc(book.title)} — ${esc(book.sub)}</b></div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">`;
    lessons.forEach((ls, i)=>{
      html += `<button class="btn ${i===0?'success':'secondary'}" style="padding:6px 12px;font-size:11px" onclick="toggleUnlock(${studentId},'talk',${bookId},${i})">${i===0?'✅':'🔓'} درس ${i+1}</button>`;
    });
    html += `</div>`;
  });
  
  content.innerHTML = html;
  panel.scrollIntoView({behavior:"smooth"});
}

/* ==================== Toggle Unlock ==================== */
async function toggleUnlock(studentId, type, gradeOrBook, lessonIndex){
  try{
    if(type === "grade"){
      const existing = await db.from("lesson_unlocks").select("*").eq("student_id",studentId).eq("grade",gradeOrBook).eq("lesson_index",lessonIndex).maybeSingle();
      if(existing.data){
        await db.from("lesson_unlocks").delete().eq("id", existing.data.id);
        toast("🔒 قفل بسته شد","info");
      } else {
        await db.from("lesson_unlocks").insert({student_id:studentId,grade:gradeOrBook,lesson_index:lessonIndex,package:"admin",unlocked_at:new Date().toISOString()});
        toast("🔓 قفل باز شد","success");
      }
    } else if(type === "final-exam"){
      const existing = await db.from("lesson_unlocks").select("*").eq("student_id",studentId).eq("grade",`final-exam-${gradeOrBook}`).eq("lesson_index",0).maybeSingle();
      if(existing.data){
        await db.from("lesson_unlocks").delete().eq("id", existing.data.id);
        toast("🔒 قفل آزمون بسته شد","info");
      } else {
        await db.from("lesson_unlocks").insert({student_id:studentId,grade:`final-exam-${gradeOrBook}`,lesson_index:0,package:"admin",unlocked_at:new Date().toISOString()});
        toast("🔓 قفل آزمون باز شد","success");
      }
    } else if(type === "talk"){
      const gradeKey = gradeOrBook;
      const existing = await db.from("lesson_unlocks").select("*").eq("student_id",studentId).eq("grade",gradeKey).eq("lesson_index",lessonIndex).maybeSingle();
      if(existing.data){
        await db.from("lesson_unlocks").delete().eq("id", existing.data.id);
        toast("🔒 قفل بسته شد","info");
      } else {
        await db.from("lesson_unlocks").insert({student_id:studentId,grade:gradeKey,lesson_index:lessonIndex,package:"admin",unlocked_at:new Date().toISOString()});
        toast("🔓 قفل باز شد","success");
      }
    }
    // رفرش پنل
    const name = document.querySelector("#unlockPanelContent p b")?.textContent || "";
    openUnlockPanel(studentId, name);
  }catch(e){toast("خطا: "+e.message,"error")}
}

/* ==================== ریست پسورد زبان‌آموز ==================== */
async function resetStudentPassword(studentId, studentName, phone){
  const newPass = prompt(`رمز عبور جدید برای ${studentName} (شماره: ${phone}):\n\nتوجه: رمز باید حداقل ۶ کاراکتر باشد.`);
  if(!newPass) return;
  if(newPass.length < 6){ toast("رمز عبور باید حداقل ۶ کاراکتر باشد","error"); return; }
  try{
    const r = await db.functions.invoke('admin-actions', {
      body: { action: 'reset-password', student_id: studentId, new_password: newPass }
    });
    if(r.error) throw r.error;
    toast("✅ رمز عبور با موفقیت تغییر کرد","success");
  }catch(e){
    // اگر تابع edge در دسترس نبود، پیام راهنما نمایش بده
    toast("برای ریست پسورد، لطفاً از طریق Supabase Dashboard اقدام کنید یا با پشتیبانی تماس بگیرید.","warning",6000);
  }
}

/* ==================== حذف کامل زبان‌آموز ==================== */
async function deleteStudent(studentId, studentName){
  if(!confirm(`⚠️ آیا مطمئن هستید که می‌خواهید «${studentName}» را کاملاً حذف کنید؟\n\nاین عمل قابل بازگشت نیست و تمام اطلاعات (XP، پیشرفت، سؤالات، تکالیف، قفل‌ها) حذف خواهد شد.`)) return;
  if(!confirm(`تأیید نهایی: حذف کامل «${studentName}»`)) return;
  try{
    // حذف اطلاعات مرتبط
    await db.from("student_xp").delete().eq("student_id", studentId);
    await db.from("student_progress").delete().eq("student_id", studentId);
    await db.from("student_achievements").delete().eq("student_id", studentId);
    await db.from("student_questions").delete().eq("student_id", studentId);
    await db.from("student_homeworks").delete().eq("student_id", studentId);
    await db.from("lesson_unlocks").delete().eq("student_id", studentId);
    // حذف خود زبان‌آموز
    const r = await db.from("students").delete().eq("id", studentId);
    if(r.error) throw r.error;
    toast("✅ زبان‌آموز با موفقیت حذف شد","success");
    admin();
  }catch(e){
    toast("خطا در حذف: "+e.message,"error");
  }
}

/* ==================== حذف سؤال ==================== */

  if(!confirm("آیا از حذف این سؤال مطمئن هستید؟")) return;
  try{
    await db.from("student_questions").delete().eq("id", id);
    toast("✅ سؤال حذف شد","success");
    admin();
  }catch(e){toast("خطا: "+e.message,"error")}
}

/* ==================== حذف تکلیف ==================== */
async function deleteHomework(id){
  if(!confirm("آیا از حذف این تکلیف مطمئن هستید؟")) return;
  try{
    await db.from("student_homeworks").delete().eq("id", id);
    toast("✅ تکلیف حذف شد","success");
    admin();
  }catch(e){toast("خطا: "+e.message,"error")}
}

/* ==================== پاسخ به سؤال ==================== */
async function replyQuestion(id){ 
  const txt=document.getElementById("qr"+id).value.trim(); 
  if(!txt){toast("پاسخ را وارد کنید","error");return} 
  try{ 
    await db.from("student_questions").update({teacher_reply:txt,replied_at:new Date().toISOString(),student_read:false}).eq("id",id); 
    toast("پاسخ ارسال شد ✅","success"); 
    admin(); 
  }catch(e){toast("خطا: "+e.message,"error")} 
}

/* ==================== ثبت نمره تکلیف ==================== */
async function gradeHomework(id){
  const grade = document.getElementById("hg"+id).value;
  if(grade==="" || grade===null || isNaN(grade)){toast("نمره معتبر وارد کنید","error");return}
  const g = Number(grade);
  if(g<0 || g>20){toast("نمره باید بین ۰ تا ۲۰ باشد","error");return}
  try{
    await db.from("student_homeworks").update({grade:g,graded_at:new Date().toISOString()}).eq("id",id);
    toast("نمره ثبت شد ✅","success");
    admin();
  }catch(e){toast("خطا: "+e.message,"error")}
}

/* ==================== تأیید/رد/ریست زبان‌آموز ==================== */
async function approve(id){try{await db.from("students").update({status:"registered"}).eq("id",id);toast("تأیید شد ✅","success");admin()}catch(e){}}
async function rejectStudent(id){try{await db.from("students").update({status:"rejected"}).eq("id",id);toast("رد شد","success");admin()}catch(e){}}
async function resetStudent(id){try{await db.from("students").update({status:"waiting"}).eq("id",id);toast("وضعیت ریست شد","info");admin()}catch(e){}}

/* ==================== Logout ==================== */
async function logout(){ 
  try{await db.auth.signOut()}catch(e){} 
  S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],exams:[],unlocks:{},streak:0,lastVisit:null,qas:[],homeworks:[],gameRecords:{},currentGame:null}; 
  landing(); 
}

/* ==================== Startup ==================== */
async function startup(){ 
  try{ 
    const r=await db.auth.getSession(); 
    const session=r.data?.session; 
    const sp=document.getElementById("splash"); 
    const hideSplash=()=>{if(sp)sp.style.display="none"}; 
    if(!session){setTimeout(()=>{hideSplash();landing()},1500);return} 
    const user=session.user; 
    if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){S.admin=true;setTimeout(()=>{hideSplash();admin()},1500);return} 
    const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle(); 
    if(st.data && st.data.status !== "rejected"){ 
      S.student=st.data; 
      await loadStudentStats(); 
      await loadUnlocks(); 
      loadStreak();loadGameRecords(); 
      await loadQAs(); 
      await loadHomeworks(); 
      setTimeout(()=>{hideSplash();home()},1500); 
      return; 
    } 
    await db.auth.signOut(); 
    setTimeout(()=>{hideSplash();landing()},1500); 
  }catch(e){ 
    try{await db.auth.signOut()}catch(_){} 
    setTimeout(()=>{ 
      const sp=document.getElementById("splash");
      if(sp)sp.style.display="none";
      landing();
    },1500); 
  } 
}

db.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT"&&!S.admin&&!S.student)landing();
});

/* ==================== Service Worker ==================== */
if("serviceWorker" in navigator){ 
  window.addEventListener("load",()=>{ 
    const swCode=`self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});self.addEventListener("fetch",e=>{});`; 
    try{ 
      const blob=new Blob([swCode],{type:"application/javascript"}); 
      const url=URL.createObjectURL(blob); 
      navigator.serviceWorker.register(url).catch(()=>{}); 
    }catch(e){} 
  }); 
}
/* ==================== شروع ==================== */
startup();
</script>
