html,body{margin:0;padding:0}

button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.header{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:15px;position:sticky;top:0;z-index:100;box-shadow:0 3px 15px #0002}

.logo{font-size:20px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:15px}
.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 5px 25px #0000000d}
.hero{background:linear-gradient(135deg,#312e81,#7c3aed,#a855f7);color:#fff;border-radius:25px;padding:28px;margin-bottom:15px;box-shadow:0 15px 35px #6d28d944}
.hero3d{position:relative;overflow:hidden}
.hero3d:before,.hero3d:after{content:"";position:absolute;border-radius:50%;background:#ffffff18}
.hero3d:before{width:180px;height:180px;left:-50px;top:-70px}
.hero3d:after{width:250px;height:250px;right:-100px;bottom:-150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.item{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;transition:.2s}
.item:hover{transform:translateY(-3px);box-shadow:0 10px 25px #6d28d933}
.icon{font-size:40px}
.btn{background:#6d28d9;color:#fff;border:0;border-radius:13px;padding:12px 16px;font-weight:bold}
.btn.full{width:100%}
.secondary{background:#ede9fe;color:#5b21b6}
.success{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#991b1b}
.warning{background:#fef3c7;color:#92400e}
.login{min-height:100vh;background:linear-gradient(135deg,#2e1065,#7c3aed,#a855f7);display:flex;justify-content:center;align-items:center;padding:20px}
.loginCard{background:#fff;width:min(430px,100%);padding:25px;border-radius:28px;box-shadow:0 20px 60px #0004}
label{display:block;margin:10px 0 5px;font-weight:bold;font-size:13px}
input,select,textarea{width:100%;border:1px solid #ddd6fe;border-radius:12px;padding:12px;background:#fff;outline:none}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#7c3aed}
.tabs{display:flex;gap:8px;margin:18px 0}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:#f3f4f6}
.tab.active{background:#ede9fe;color:#6d28d9;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #ddd;z-index:200;box-shadow:0 -3px 15px #0000000d}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex}
.nav{flex:1;border:0;background:#fff;padding:7px 2px;color:#777;font-size:11px}
.nav b{display:block;font-size:21px;margin-bottom:3px}
.nav.active{color:#6d28d9;font-weight:bold}
.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.lesson{background:#faf9ff;border:1px solid #ddd6fe;border-radius:18px;padding:17px;cursor:pointer}
.lesson:hover{background:#f3efff}
.lessonNo{font-size:30px;color:#6d28d9;font-weight:bold}
.tabs2{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
.tab2{padding:11px 15px;border:0;border-radius:12px;background:#eee;white-space:nowrap}
.tab2.active{background:#6d28d9;color:#fff}
.sec{display:none}.sec.active{display:block}
.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.word{border:1px solid #ddd6fe;background:#faf9ff;border-radius:15px;padding:13px;text-align:center;cursor:pointer}
.en{direction:ltr;color:#5b21b6;font-weight:bold}
.fa{font-size:11px;color:#777;margin-top:5px}
.grammar{border:1px solid #e9e5ff;background:#faf9ff;padding:17px;border-radius:17px;margin-bottom:12px;line-height:2}
.example{direction:ltr;text-align:left;background:#fff;border-radius:10px;padding:11px;font-family:Arial,sans-serif;border:1px solid #eee}
.option{display:block;width:100%;text-align:right;background:#fff;border:1px solid #ddd6fe;border-radius:13px;padding:13px;margin:7px 0}
.option.correct{background:#dcfce7;border-color:#22c55e}
.option.wrong{background:#fee2e2;border-color:#ef4444}
.feedback{text-align:center;border-radius:15px;padding:13px;margin-top:10px;font-weight:bold}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
.progress{height:9px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7);transition:.3s}
.score{font-size:55px;color:#6d28d9;font-weight:bold;text-align:center}
.adminRow{border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:9px 0}
.muted{font-size:12px;color:#777;line-height:1.9}
.teacher{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.teacherBox{background:linear-gradient(135deg,#faf5ff,#fff);border:1px solid #e9d5ff;border-radius:22px;padding:20px;line-height:2}
.teacherAvatar{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;background:#ede9fe;margin:auto}
.profileStat{background:#faf9ff;border:1px solid #e9d5ff;border-radius:18px;padding:15px;text-align:center}
.profileStat b{display:block;font-size:27px;color:#6d28d9;margin-top:5px}
.levelBar{height:12px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}
.levelBar i{display:block;height:100%;background:#7c3aed}
.badge{display:inline-block;padding:8px 12px;margin:4px;border-radius:20px;background:#ede9fe;color:#5b21b6;font-size:12px}
.notice{padding:13px;border-radius:13px;background:#fff7ed;color:#9a3412;font-size:13px;line-height:1.8;margin-bottom:12px}
.call{display:block;text-decoration:none;text-align:center;margin:12px 0}
.request{background:#f8f5ff;border:1px solid #ddd6fe;border-radius:18px;padding:15px;margin-top:15px}
.examRow{border:1px solid #e5e7eb;border-radius:15px;padding:14px;margin:8px 0}

.resultBox{background:#faf9ff;border:1px solid #ddd6fe;border-radius:18px;padding:18px}
@media(max-width:600px){.container{padding:10px}.card{padding:16px;border-radius:18px}.hero{padding:20px}}

/* XP */

function calculateLevel(xp){
 return Math.max(1,Math.floor(Number(xp||0)/100)+1)
}

function xpForLevel(level){
 return (level-1)*100
}

async function loadStudentStats(){
 if(!S.student)return;

 S.xp=0;
 S.level=1;
 S.progress={};
 S.achievements=[];
 S.exams=[];

 try{
  const r=await db.from("student_xp")
   .select("xp,level")
   .eq("student_id",S.student.id)
   .maybeSingle();

  if(r.data){
   S.xp=Number(r.data.xp||0);
   S.level=Number(r.data.level||calculateLevel(S.xp))
  }
 }catch(e){}

 try{
  const r=await db.from("student_progress")
   .select("lesson_id,progress,completed")
   .eq("student_id",S.student.id);

  (r.data||[]).forEach(x=>{
   S.progress[x.lesson_id]={
    progress:Number(x.progress||0),
    completed:Boolean(x.completed)
   }
  });
 }catch(e){}

 try{
  const r=await db.from("student_achievements")
   .select("achievement_key,title")
   .eq("student_id",S.student.id);

  S.achievements=r.data||[];
 }catch(e){}

 try{
  const r=await db.from("exam_results")
   .select("*")
   .eq("user_id",S.student.auth_user_id)
   .order("created_at",{ascending:false});

  S.exams=r.data||[];
 }catch(e){}
}

async function addXP(amount){
 if(!S.student)return;

 const old=S.xp;

 S.xp+=Number(amount||0);
 S.level=calculateLevel(S.xp);

 try{
  await db.from("student_xp").upsert({
   student_id:S.student.id,
   xp:S.xp,
   level:S.level
  },{onConflict:"student_id"});
 }catch(e){}

 if(
  calculateLevel(old)!==S.level
 ){
  alert("🎉 تبریک! شما به Level "+S.level+" رسیدید.");
 }
}

async function unlockAchievement(key,title){
 if(!S.student)return;

 if(
  S.achievements.some(
   a=>a.achievement_key===key
  )
 )return;

 try{
  const r=await db.from("student_achievements").insert({
   student_id:S.student.id,
   achievement_key:key,
   title
  });

  if(!r.error){
   S.achievements.push({
    achievement_key:key,
    title
   });
  }
 }catch(e){}
}

async function saveProgress(lessonId,progress,completed){
 if(!S.student)return;

 S.progress[lessonId]={
  progress,
  completed
 };

 try{
  await db.from("student_progress").upsert({
   student_id:S.student.id,
   lesson_id:lessonId,
   progress,
   completed,
   completed_at:
    completed?new Date().toISOString():null
  },{
   onConflict:"student_id,lesson_id"
  });
 }catch(e){}
}

async function studentLogin(){

 const phone=
  document.getElementById("phone")
   .value.trim();

 const password=
  document.getElementById("pass")
   .value;

 if(!phone||!password){
  alert(
   "شماره تلفن و رمز عبور را وارد کنید."
  );
  return
 }

 try{

  const result=
   await accessFunction({
    action:"find",
    phone
   });

  const student=result.student;
  const email=result.email;

  if(!student)
   throw new Error(
    "زبان‌آموزی با این شماره پیدا نشد."
   );

  if(student.status==="rejected")
   throw new Error(
    "ثبت‌نام شما توسط مدیر رد شده است."
   );

  if(
   !["registered","approved"]
    .includes(student.status)
  )
   throw new Error(
    "ثبت‌نام شما هنوز توسط مدیر تأیید نشده است."
   );

  if(!email)
   throw new Error(
    "ایمیل ورود زبان‌آموز پیدا نشد."
   );

  const auth=
   await db.auth.signInWithPassword({
    email:String(email).trim(),
    password
   });

  if(auth.error)
   throw new Error(
    "رمز عبور صحیح نیست."
   );

  S.student=student;
  S.admin=false;

  await loadStudentStats();

  home();

 }catch(e){

  alert(
   e?.message||
   "ورود ناموفق بود."
  )
 }
}

/* QUIZ ENGINE */

function shuffle(arr){

 const a=[...arr];

 for(
  let i=a.length-1;
  i>0;
  i--
 ){

  const j=
   Math.floor(
    Math.random()*(i+1)
   );

  [a[i],a[j]]=
   [a[j],a[i]];
 }

 return a;
}

function makeLessonQuestions(){

 const no=S.lesson+1;
 const arr=[];

 const ws=
  words[no]||[];

 ws.forEach((w,i)=>{

  const pool=
   shuffle(
    ws
     .filter((_,j)=>j!==i)
     .map(x=>x[1])
   )
   .slice(0,3);

  const opts=
   shuffle([
    w[1],
    ...pool
   ]);

  arr.push({
   q:`معنی "${w[0]}" چیست؟`,
   options:opts,
   answer:opts.indexOf(w[1])
  });
 });

 const lessonGrammar=
  S.grade>=10
  ?(grammar[S.grade]?.[S.lesson]||[])
  :(grammar[no]||[]);

 lessonGrammar.forEach(g=>{

  const opts=
   shuffle([
    g[1],
    "She are a student.",
    "They is happy.",
    "He am a teacher."
   ]);

  arr.push({
   q:
    `کدام گزینه با مبحث «${g[0]}» هماهنگ است؟`,
   options:opts,
   answer:opts.indexOf(g[1])
  });
 });

 return arr.slice(0,15);
}

function startLessonQuiz(){

 S.quiz={
  type:"lesson",
  title:
   `پایه ${S.grade} - ${books[S.grade].lessons[S.lesson]}`,
  questions:

  i:0,
  correct:0,
  wrong:0
 };

 quizRender("lessonQuiz");
}

function quizRender(id){

 const q=
  S.quiz.questions[S.quiz.i];

 if(!q){
  quizFinish(id);
  return
 }

 const el=
  document.getElementById(id);

 if(!el)return;

 el.innerHTML=`

 <div class="card">

 <b>
  سؤال
  ${S.quiz.i+1}
  از
  ${S.quiz.questions.length}
 </b>

 <div class="progress">
  <i
   style="
   width:${
    S.quiz.i/
    S.quiz.questions.length*
    100
   }%">
  </i>
 </div>

 <div
  style="
   font-size:18px;
   font-weight:bold;
   line-height:2;
   margin:15px 0">

  ${esc(q.q)}

 </div>

 ${
  q.options.map((x,i)=>`

  <button
   class="option"
   onclick="answer(${i},'${id}')">

   ${esc(x)}

  </button>

  `).join("")
 }

 <div id="fb"></div>

 </div>`;
}

function answer(i,id){

 const q=
  S.quiz.questions[S.quiz.i];

 const opts=
  document.querySelectorAll(".option");

 opts.forEach(x=>
  x.disabled=true
 );

 if(i===q.answer){

  S.quiz.correct++;

  opts[i].classList.add(
   "correct"
  );

  document.getElementById("fb")
   .className="feedback ok";

  document.getElementById("fb")
   .innerHTML=
   "✅ 😊 آفرین! پاسخ درست است.";

 }else{

  S.quiz.wrong++;

  opts[i].classList.add(
   "wrong"
  );

  opts[q.answer].classList.add(
   "correct"
  );

  document.getElementById("fb")
   .className="feedback bad";

  document.getElementById("fb")
   .innerHTML=
   "❌ پاسخ اشتباه است.";
 }

 setTimeout(()=>{

  S.quiz.i++;

  quizRender(id);

 },700);
}

async function quizFinish(id){

 const total=
  S.quiz.questions.length;

 const percent=
  total
  ?
  Math.round(
   S.quiz.correct/
   total*
   100
  )
  :
  0;

 examRecords.unshift({

  student:
   S.student?.phone||"",

  title:
   S.quiz.title,

  score:
   percent,

  date:
   new Date().toISOString()
 });

 saveLocal();

 if(S.student){

  try{

   await db.from("exam_results")
    .insert({
     user_id:
      S.student.auth_user_id,

     student_name:
      `${S.student.first_name||""} ${S.student.last_name||""}`,

     exam_type:
      "lesson",

     exam_title:
      S.quiz.title,

     score:
      S.quiz.correct,

     total,

     percentage:
      percent
    });

  }catch(e){}
 }

 await addXP(
  Math.max(
   5,
   Math.round(percent/10)
  )
 );

  await unlockAchievement(

 const el=
  document.getElementById(id);

 if(!el)return;

 el.innerHTML=`

  ${percent}%
 </div>

 <h2 style="text-align:center">
  نتیجه آزمون 🎉

async function placementFinish(){

 const score=
  S.quiz.correct;

 let level;

 if(score<=7)
  level="A1";
 else if(score<=13)
  level="A2";
 else if(score<=19)
  level="B1";
 else if(score<=24)
  level="B2";
 else if(score<=28)
  level="C1";
 else
  level="C2";

 const el=
  document.getElementById(
   "placementQuiz"
  );

 if(S.student){

  try{

   await db.from("exam_results")
    .insert({

     user_id:
      S.student.auth_user_id,

     student_name:
      `${S.student.first_name||""} ${S.student.last_name||""}`,

     exam_type:
      "placement",

     exam_title:
      "آزمون تعیین سطح ۳۰ سؤالی",

     score,

     total:30,

     percentage:
      Math.round(score/30*100)
    });

  }catch(e){}
 }

 el.innerHTML=`

 <h2 style="text-align:center">

}

async function placementAnswer(i){

 const q=
  S.quiz.questions[S.quiz.i];

 const opts=
  document.querySelectorAll(".option");

 opts.forEach(x=>
  x.disabled=true
 );

 if(i===q.answer){

  S.quiz.correct++;

  opts[i].classList.add(
   "correct"
  );

 }else{

  S.quiz.wrong++;

  opts[i].classList.add(
   "wrong"
  );

  opts[q.answer].classList.add(
   "correct"
  );
 }

 setTimeout(async()=>{

  S.quiz.i++;

  if(
   S.quiz.i>=
   S.quiz.questions.length
  )
   await placementFinish();
  else
   quizRender("placementQuiz");

 },650);
}

/* PATCH QUIZ ANSWER FOR PLACEMENT */

const originalAnswer=answer;

answer=function(i,id){

 if(
  S.quiz?.type==="placement"
 ){

  placementAnswer(i);

  return;
 }

 originalAnswer(i,id);
};

   return;
  }

  await db.auth.signOut();

  login();

 }catch(e){

  try{
   await db.auth.signOut()
  }catch(_){}

  login();
}

}

db.auth.onAuthStateChange(
 (event)=>{

  if(
   event==="SIGNED_OUT"&&
   !S.admin&&
   !S.student
  ){

   login();

  }

 }
);

startup();
</script>
