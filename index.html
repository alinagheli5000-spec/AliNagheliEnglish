function esc(x){
return String(x??'')
.replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m]));
}

function normalizePhone(x){
let p=String(x||'')
.trim()
.replace(/\s+/g,'');

if(p.startsWith('+98'))
p='0'+p.slice(3);

else if(p.startsWith('98')&&p.length>=10)
p='0'+p.slice(2);

return p.replace(/\D/g,'');
}

return;
}

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang='en-US';
u.rate=.75;

speechSynthesis.resume();
speechSynthesis.speak(u);
}

/* =========================================================
   XP
========================================================= */

function calculateLevel(xp){
return Math.max(
1,
Math.floor(Number(xp||0)/100)+1
);
}

function xpForLevel(level){
return (level-1)*100;
}

async function loadStudentStats(){

if(!S.student)return;

S.xp=0;
S.level=1;
S.progress={};
S.achievements=[];
S.exams=[];

try{

const r=
await db
.from('student_xp')
.select('xp,level')
.eq('student_id',S.student.id)
.maybeSingle();

if(r.data){

S.xp=
Number(r.data.xp||0);

S.level=
Number(
r.data.level||
calculateLevel(S.xp)
);

}

}catch(e){}

try{

const r=
await db
.from('student_progress')
.select(
'lesson_id,progress,completed'
)
.eq(
'student_id',
S.student.id
);

(r.data||[]).forEach(x=>{
S.progress[x.lesson_id]={
progress:Number(x.progress||0),
completed:Boolean(x.completed)
};
});

}catch(e){}

try{

const r=
await db
.from('student_achievements')
.select(
'achievement_key,title'
)
.eq(
'student_id',
S.student.id
);

S.achievements=
r.data||[];

}catch(e){}

try{

const authId=
S.student.auth_user_id;

if(authId){

const r=
await db
.from('exam_results')
.select('*')
.eq('user_id',authId)
.order(
'created_at',
{ascending:false}
);

S.exams=
r.data||[];

}

}catch(e){}
}

async function addXP(amount){

if(!S.student)return;

const n=
Math.max(
0,
Number(amount||0)
);

const oldLevel=
calculateLevel(S.xp);

S.xp+=n;

S.level=
calculateLevel(S.xp);

try{

const r=
await db
.from('student_xp')
.upsert(
{
student_id:S.student.id,
xp:S.xp,
level:S.level,
updated_at:new Date().toISOString()
},
{onConflict:'student_id'}
);

if(r.error)
console.warn(r.error);

}catch(e){}

if(
S.level>oldLevel
){
await unlockAchievement(
'level_'+S.level,
'رسیدن به Level '+S.level
);
}
}

async function unlockAchievement(
key,
title
){

if(
!S.student||
S.achievements.some(
x=>x.achievement_key===key
)
)return;

try{

const r=
await db
.from('student_achievements')
.insert({
student_id:S.student.id,
achievement_key:key,
title:title,
earned_at:new Date().toISOString()
});

if(!r.error){

S.achievements.push({
achievement_key:key,
title:title
});

}

}catch(e){}
}

async function saveProgress(
lessonId,
progress,
completed
){

if(!S.student)return;

S.progress[lessonId]={
progress:Number(progress||0),
completed:Boolean(completed)
};

try{

const r=
await db
.from('student_progress')
.upsert(
{
student_id:S.student.id,
lesson_id:lessonId,
progress:Number(progress||0),
completed:Boolean(completed),
completed_at:
completed?
new Date().toISOString():
null
},
{
onConflict:
'student_id,lesson_id'
}
);

if(r.error)
console.warn(r.error);

}catch(e){}
}

);

.from('students')
.select('*')
.eq(

){

/* =========================================================

========================================================= */

function shuffle(arr){

const a=[...arr];

for(
let i=a.length-1;
i>0;
i--
){

const j=
Math.floor(
Math.random()*(i+1)
);

[
a[i],
a[j]
]=[
a[j],
a[i]
];

}

return a;
}

function makeLessonQuestions(){

const no=
S.lesson+1;

const arr=[];

const ws=
words[no]||[];

ws.forEach(
(w,i)=>{

const pool=
shuffle(
ws
.filter((_,j)=>j!==i)
.map(x=>x[1])
)
.slice(0,3);

const opts=
shuffle(
[w[1],...pool]
);

arr.push({
q:`معنی "${w[0]}" چیست؟`,
options:opts,
answer:opts.indexOf(w[1])
});

});

(grammar[no]||[])
.forEach(g=>{

const correct=
g[2];

const opts=
shuffle([
correct,
'She are a student.',
'They is happy.',
'He am a teacher.'
]);

arr.push({
q:
`کدام گزینه با مبحث «${g[0]}» هماهنگ است؟`,
options:opts,
answer:opts.indexOf(correct)
});

});

return arr.slice(0,15);

}

function answerLesson(index){

if(S.quiz.answered)
return;

const buttons=
document.querySelectorAll(
'#lessonOptions .quizOption'
);

buttons.forEach(
b=>b.classList.add('disabled')
);

?.classList.add('correct');

'quizFeedback'
).innerHTML=
`<div class="badge registered">

?.classList.add('wrong');

?.classList.add('correct');

'quizFeedback'
).innerHTML=
`<div class="badge rejected">

</div>`;

}

function conversationQuiz(name,unit){

const q=[
['What is the meaning of conversation?','گفت‌وگو'],
['What is the meaning of question?','سؤال'],
['What is the meaning of answer?','پاسخ'],
['What is the meaning of practice?','تمرین'],

['What is the meaning of class?','کلاس'],
['What is the meaning of student?','دانش‌آموز'],
['What is the meaning of teacher?','معلم'],
['What is the meaning of friend?','دوست'],
['What is the meaning of information?','اطلاعات']
];

const questions=
q.map(x=>{

const pool=
shuffle(
q
.filter(y=>y!==x)
.map(y=>y[1])
).slice(0,3);

const options=
shuffle([
x[1],
...pool
]);

return{
q:x[0],
options,
answer:options.indexOf(x[1])
};

});

S.quiz={
type:'conversation',
title:`${name} - Unit ${unit+1}`,
questions,
i:0,
correct:0,
wrong:0,
answered:false
};

let finalQuestions=[];
let finalIndex=0;
let finalScore=0;
let finalAnswered=false;

function buildFinalExam(){

let arr=[];

for(let i=0;i<100;i++){

const base=
finalBaseQuestions[
i%finalBaseQuestions.length
];

const options=
shuffle(base[1]);

const answer=
options.indexOf(base[1][base[2]]);

arr.push({
q:base[0],
options,
answer
});

}

return arr;

}

function startFinalExam(){

finalQuestions=
buildFinalExam();

finalIndex=0;
finalScore=0;
finalAnswered=false;

renderFinalExam();

}

render(

);

const box=

);

if(!box)return;

if(

finalQuestions.length
){

finishFinalExam();
return;

}

const item=
finalQuestions[finalIndex];

const percent=
Math.round(
(finalIndex/
finalQuestions.length)*100
);

box.innerHTML=`

<div class="quizCard">

<div style="
display:flex;
justify-content:space-between;
align-items:center">

🏆 آزمون جامع

</i>

</div>

<h3>
${esc(item.q)}
</h3>

<div id="finalOptions">

${item.options.map(
(o,i)=>`

class="quizOption"

${esc(o)}

</button>

`).join('')}

</div>

}

function answerFinalQuestion(index){

if(finalAnswered)
return;

finalAnswered=true;

const item=
finalQuestions[finalIndex];

const buttons=
document.querySelectorAll(
'#finalOptions .quizOption'
);

buttons.forEach(
b=>b.classList.add('disabled')
);

if(index===item.answer){

finalScore++;

buttons[index]
?.classList.add('correct');

document.getElementById(
'finalFeedback'
).innerHTML=
'<div class="badge registered">✓ آفرین! پاسخ درست است 🎉</div>';

}else{

buttons[index]
?.classList.add('wrong');

buttons[item.answer]
?.classList.add('correct');

document.getElementById(
'finalFeedback'
).innerHTML=
'<div class="badge rejected">✕ پاسخ اشتباه بود</div>';

}

document
.getElementById('finalNext')
?.classList.remove('hidden');

}

function nextFinalQuestion(){

finalIndex++;
finalAnswered=false;

renderFinalExam();

}

async function finishFinalExam(){

const total=
finalQuestions.length;

const score=
Math.round(
(finalScore/total)*100
);

await saveExamToCloud(
'final',
'آزمون جامع ۱۰۰ سوالی',
finalScore,
total,
score,
'7-final'
);

await addXP(
Math.max(10,score)
);

if(score>=80){

await unlockAchievement(
'final_80',
'رکورد بالای ۸۰٪'
);

}

if(score===100){

await unlockAchievement(
'perfect_final',
'رکورد کامل ۱۰۰٪'
);

}

const box=
document.getElementById(
'finalExamBox'
);

if(!box)return;

box.innerHTML=`

<div class="score">
${score}%
</div>

<h2 style="text-align:center">
🏆 آزمون جامع تمام شد!

${finalScore}
پاسخ صحیح از

سؤال

let allStudents=[];

async function loadAdminStudents(){

const box=
document.getElementById(
'adminStudents'
);

if(!box)return;

try{

const r=
await db
.from('students')
.select('*')
.order(
'created_at',
{ascending:false}
);

if(r.error)
throw r.error;

allStudents=
r.data||[];

renderAdminStudents(allStudents);

}catch(e){

box.innerHTML=
`<p class="muted">
خطا در دریافت زبان‌آموزان.
</p>`;

}

}

function filterAdminStudents(){

const q=
document.getElementById(
'adminSearch'
)?.value
.trim()
.toLowerCase()||'';

renderAdminStudents(
allStudents.filter(
s=>
`${s.first_name||''} ${s.last_name||''} ${s.phone||''}`
.toLowerCase()
.includes(q)
)
);

}

function statusBadge(status){

if(status==='registered'||
status==='approved')
return '<span class="badge registered">تأیید شده</span>';

if(status==='rejected')
return '<span class="badge rejected">رد شده</span>';

return '<span class="badge waiting">در انتظار</span>';

}

function renderAdminStudents(students){

const box=
document.getElementById(
'adminStudents'
);

if(!box)return;

if(!students.length){

box.innerHTML=
'<p class="muted">زبان‌آموزی وجود ندارد.</p>';

return;

}

box.innerHTML=
students.map(
x=>`

<div class="adminRow">

<div style="
display:flex;
justify-content:space-between;
gap:10px">

<b>
${esc(x.first_name)}
${esc(x.last_name)}
</b>

${statusBadge(x.status)}

</div>

<p class="muted">

📱 ${esc(x.phone||'-')}
<br>

🎓 پایه / سطح:
${esc(x.level||'-')}
<br>

${x.auth_user_id?'متصل':'بدون اتصال'}

</p>

<div style="
display:flex;

${
x.status==='waiting'||
x.status==='rejected'?
`

}

/* =========================================================
   STARTUP
========================================================= */

async function startup(){

try{

const r=
await db.auth.getSession();

const session=
r.data?.session;

if(!session){

login();
return;

}

const currentUser=
session.user;

if(
(currentUser.email||'')
.toLowerCase()
===
'alinagheli@gmail.com'
){

S.admin=true;

await admin();

return;

}

const access=
await accessFunction({
action:'find',
phone:
currentUser.user_metadata?.phone||
''
}).catch(
()=>null
);

let student=null;

if(access?.student){

student=
access.student;

}else{

const st=
await db
.from('students')
.select('*')
.eq(
'auth_user_id',
currentUser.id
)
.maybeSingle();

student=
st.data||null;

}

if(
student&&
['registered','approved']
.includes(student.status)
){

S.student=student;

await loadStudentStats();

home();

return;

}

await db.auth.signOut();

login();

}catch(e){

try{
await db.auth.signOut();
}catch(_){}

login();

}

}

db.auth.onAuthStateChange(
(event)=>{

if(event==='SIGNED_OUT'){

if(
!S.admin&&
!S.student
){

setTimeout(
()=>login(),
50
);

}

}

}
);

startup();

</script>
