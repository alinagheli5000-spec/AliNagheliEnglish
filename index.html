<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>

<style>
:root{
  --primary:#6d28d9;
  --primary2:#9333ea;
  --light:#f5f3ff;
  --card:#fff;
  --text:#17121f;
  --muted:#6b7280;
  --green:#16a34a;
  --red:#dc2626;
  --gold:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Tahoma,Arial,sans-serif;
  background:var(--light);
  color:var(--text);
  padding-bottom:82px
}
button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{max-width:1100px;margin:auto;padding:15px}
.header{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;padding:23px 15px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #6d28d944
}
.header h1{margin:0;font-size:28px}
.header p{margin:7px 0 0}
.card{
  background:var(--card);
  border-radius:22px;
  padding:19px;
  margin:14px 0;
  box-shadow:0 7px 25px #0000000d
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:13px
}
.course{
  border:1px solid #e9d5ff;
  border-radius:22px;
  padding:18px 12px;
  min-height:135px;
  background:linear-gradient(145deg,#fff,#f3e8ff);
  color:#4c1d95;
  font-weight:bold;
  font-size:16px;
  box-shadow:0 5px 16px #0000000b;
  transition:.18s
}
.course:active{transform:scale(.97)}
.course .icon{display:block;font-size:40px;margin-bottom:9px}
.btn{
  border:0;
  border-radius:14px;
  padding:12px 18px;
  margin:4px;
  background:var(--primary);
  color:#fff;
  font-weight:bold
}
.btn.secondary{background:#ede9fe;color:#5b21b6}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:13px;
  margin:6px 0;
  outline:none
}
input:focus{border-color:var(--primary)}
.lessonCard{
  background:#fff;
  border:1px solid #e9d5ff;
  border-radius:22px;
  padding:18px;
  margin:12px 0
}
.lessonCard h3{color:#5b21b6;margin-top:0}
.word{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#fafafa;
  border-radius:15px;
  padding:11px;
  margin:7px 0
}
.wordText{direction:ltr;text-align:left;flex:1}
.wordText strong{font-size:17px}
.wordText small{display:block;direction:rtl;text-align:right;color:#555;margin-top:4px}
.speak{
  width:48px;height:48px;
  border:0;border-radius:14px;
  background:#ede9fe;color:var(--primary);
  font-size:21px
}
.grammar{
  background:#faf5ff;
  border-right:4px solid var(--primary);
  border-radius:14px;
  padding:15px;
  line-height:2;
  margin-top:14px
}
.example{
  direction:ltr;
  text-align:left;
  background:#fff;
  padding:10px 13px;
  border-radius:11px;
  margin:7px 0;
  box-shadow:0 2px 8px #00000008
}
.quizBox{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-top:15px
}
.option{
  width:100%;
  border:2px solid #e5e7eb;
  background:#fff;
  border-radius:13px;
  padding:13px;
  margin:6px 0;
  text-align:right
}
.option.correct{
  border-color:var(--green);
  background:#dcfce7;
  color:#166534
}
.option.wrong{
  border-color:var(--red);
  background:#fee2e2;
  color:#991b1b
}
.progress{
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin:12px 0
}
.progress>div{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary2))
}
.result{
  text-align:center;
  padding:20px;
  background:#f3e8ff;
  border-radius:18px;
  font-size:21px;
  line-height:2
}
.teacherGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:14px
}
.teacher{
  padding:20px;
  border-radius:22px;
  background:linear-gradient(145deg,#fff,#faf5ff);
  border:1px solid #e9d5ff
}
.phone{
  display:inline-block;
  direction:ltr;
  color:var(--primary);
  font-weight:bold;
  text-decoration:none;
  padding:8px 0
}
.nav{
  position:fixed;
  z-index:1000;
  bottom:0;left:0;right:0;
  display:flex;
  background:#fff;
  box-shadow:0 -5px 22px #0002;
  padding:7px
}
.nav button{
  flex:1;
  border:0;
  background:#fff;
  border-radius:12px;
  padding:8px 3px;
  font-size:11px
}
.nav button.active{
  background:#ede9fe;
  color:var(--primary);
  font-weight:bold
}
.rank{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px;
  border-radius:14px;
  background:#faf5ff;
  margin:7px 0
}
.badge{
  display:inline-block;
  padding:6px 10px;
  background:#ede9fe;
  color:#5b21b6;
  border-radius:20px;
  margin:3px;
  font-size:12px
}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}
th{background:#faf5ff}
.tableWrap{overflow:auto}
#competitionOverlay{
  position:fixed;
  inset:0;
  z-index:3000;
  background:var(--light);
  overflow:auto
}
#toast{
  position:fixed;
  z-index:5000;
  bottom:92px;
  left:50%;
  transform:translateX(-50%);
  background:#17121f;
  color:#fff;
  padding:12px 18px;
  border-radius:14px;
  display:none;
  max-width:90%;
  text-align:center
}
.adminStat{
  background:#faf5ff;
  border-radius:18px;
  padding:18px;
  text-align:center
}
.adminStat b{
  display:block;
  font-size:28px;
  color:var(--primary)
}
@media(max-width:600px){
  .header h1{font-size:23px}
  .container{padding:10px}
  .card{padding:15px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header class="header">
<div class="container">
<h1>🎓 AliNagheli English</h1>
<p>آموزش زبان انگلیسی از مدرسه تا مکالمه</p>
</div>
</header>

<main class="container">

<!-- LOGIN -->
<section id="loginPage">
<div class="card">
<h2>🔐 ورود زبان‌آموز</h2>

<input id="studentPhone"
       inputmode="tel"
       autocomplete="username"
       placeholder="شماره تلفن">

<input id="studentPassword"
       type="password"
       autocomplete="current-password"
       placeholder="رمز عبور">

<button class="btn" onclick="studentLogin()">ورود زبان‌آموز</button>
<button class="btn secondary" onclick="showPage('adminLoginPage')">👑 ورود مدیر</button>

<p id="studentLoginMsg"></p>
</div>
</section>

<!-- ADMIN LOGIN -->
<section id="adminLoginPage" class="hidden">
<div class="card">
<h2>👑 ورود مدیر</h2>

<input id="adminUsername"
       autocomplete="username"
       placeholder="نام کاربری مدیر">

<input id="adminPassword"
       type="password"
       autocomplete="current-password"
       placeholder="رمز عبور مدیر">

<button class="btn" onclick="adminLogin()">ورود به پنل مدیر</button>
<button class="btn secondary" onclick="showPage('loginPage')">بازگشت</button>

<p id="adminLoginMsg"></p>

<div class="grammar" style="margin-top:15px">
برای ورود آزمایشی مدیر:<br>
نام کاربری: <b>admin</b><br>
رمز عبور: <b>1234</b>
</div>
</div>
</section>

<!-- STUDENT APP -->
<section id="studentApp" class="hidden">

<div id="homePage">

<div class="card">
<h2>سلام <span id="studentDisplayName">زبان‌آموز</span> 👋</h2>
<p>به AliNagheli English خوش آمدی 🌷</p>
<button class="btn danger" onclick="studentLogout()">🚪 خروج</button>
</div>

<div class="card">
<h2>📚 دوره‌ها</h2>

<div class="grid">

<button class="course" onclick="showSchool()">
<span class="icon">🏫</span>
مدرسه
</button>

<button class="course" onclick="showConversation()">
<span class="icon">🗣️</span>
مکالمه
</button>

<button class="course" onclick="showTeachers()">
<span class="icon">👨‍🏫</span>
مدرسان
</button>

</div>
</div>

<div class="card">
<h2>🏆 مسابقه</h2>

<div class="grid">

<button class="course" onclick="openCompetitionMenu()">
<span class="icon">🏆</span>
شروع مسابقه
</button>

<button class="course" onclick="showRecords()">
<span class="icon">📊</span>
رکوردهای من
</button>

</div>
</div>

</div>

<div id="studentContent"></div>

</section>

<!-- ADMIN -->
<section id="adminApp" class="hidden">

<div class="card">
<h2>👑 پنل مدیریت</h2>
<button class="btn danger" onclick="adminLogout()">🚪 خروج مدیر</button>
</div>

<div id="adminContent"></div>

</section>

</main>

<!-- BOTTOM NAV -->
<nav class="nav" id="bottomNav">

<button id="navHome" onclick="goHome()">🏠<br>خانه</button>
<button id="navSchool" onclick="showSchool()">🏫<br>مدرسه</button>
<button id="navConversation" onclick="showConversation()">🗣️<br>مکالمه</button>
<button id="navTeachers" onclick="showTeachers()">👨‍🏫<br>استاد</button>
<button id="navCompetition" onclick="openCompetitionMenu()">🏆<br>مسابقه</button>

</nav>

<!-- COMPETITION -->
<div id="competitionOverlay" class="hidden">
<div class="container">

<div class="card">

<div id="competitionHeader"></div>

<div id="competitionBody"></div>

<button class="btn secondary" onclick="closeCompetition()">
بازگشت
</button>

</div>

</div>
</div>

<div id="toast"></div>

function esc(x){
return String(x)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function shuffle(a){
return [...a].sort(()=>Math.random()-.5);
}

function showPage(id){
[

"studentApp",

function toast(msg){
const t=document.getElementById("toast");
t.textContent=msg;
t.style.display="block";
clearTimeout(window.__toast);
window.__toast=setTimeout(()=>t.style.display="none",2500);
}

/* =========================================================
   AUDIO
========================================================= */

function speak(text){

if(!("speechSynthesis" in window)){
toast("مرورگر شما از پخش صوتی پشتیبانی نمی‌کند.");
return;
}

window.speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(String(text));
u.lang="en-US";
u.rate=.65;
u.pitch=1;
u.volume=1;

const voices=window.speechSynthesis.getVoices();

const voice=
voices.find(v=>/^en-US$/i.test(v.lang))||
voices.find(v=>/^en/i.test(v.lang));

if(voice)u.voice=voice;

window.speechSynthesis.speak(u);

}

/* =========================================================
   QUIZ GENERATION
========================================================= */

function makeLessonQuestions(grade,index){

const lesson=SCHOOL[grade][index];
const questions=[];

lesson.words.forEach((w,i)=>{

const wrong=shuffle(
lesson.words
.filter(x=>x!==w)
.map(x=>x[1])
).slice(0,3);

questions.push({
q:`معنی "${w[0]}" کدام است؟`,
a:w[1],
o:shuffle([w[1],...wrong])
});

questions.push({
q:`"${w[1]}" به انگلیسی چیست؟`,
a:w[0],
o:shuffle([
w[0],
...shuffle(
lesson.words
.filter(x=>x!==w)
.map(x=>x[0])
).slice(0,3)
])
});

});

lesson.examples.forEach(ex=>{

questions.push({
q:"کدام جمله مربوط به گرامر این درس است؟",
a:ex,
o:shuffle([
ex,
...shuffle(
lesson.examples.filter(x=>x!==ex)
).slice(0,3)
])
});

});

return shuffle(questions).slice(0,15);

}

/* =========================================================
   LESSON QUIZ
========================================================= */

function startLessonQuiz(grade,index){

const questions=makeLessonQuestions(grade,index);

quiz={
type:`${grade} - ${SCHOOL[grade][index].title}`,
questions,
index:0,
correct:0,
wrong:0,
negative:false,
lesson:true
};

openQuiz();

}

function openQuiz(){

document.getElementById("competitionOverlay").classList.remove("hidden");
renderQuiz();

}

function renderQuiz(){

const q=quiz.questions[quiz.index];

const total=quiz.questions.length;
const number=quiz.index+1;

document.getElementById("competitionHeader").innerHTML=`

<h2>📝 ${esc(quiz.type)}</h2>

<span class="badge">سؤال ${number} از ${total}</span>
<span class="badge">✅ ${quiz.correct}</span>
<span class="badge">❌ ${quiz.wrong}</span>

<div class="progress">
<div style="width:${(number-1)/total*100}%"></div>
</div>
`;

document.getElementById("competitionBody").innerHTML=`

<div class="quizBox">

<h3>${esc(q.q)}</h3>

${q.o.map((o,i)=>`

<button class="option"
onclick="answerQuiz(this,${JSON.stringify(o)},${JSON.stringify(q.a)})">

${esc(o)}

</button>

`).join("")}

</div>
`;

}

function answerQuiz(btn,answer,correct){

if(btn.disabled)return;

const buttons=
document.querySelectorAll(".quizBox .option");

buttons.forEach(b=>b.disabled=true);

if(answer===correct){

btn.classList.add("correct");
quiz.correct++;

}else{

btn.classList.add("wrong");
quiz.wrong++;

buttons.forEach(b=>{
if(b.textContent.trim()===String(correct)){
b.classList.add("correct");
}
});

}

setTimeout(()=>{

quiz.index++;

if(quiz.index>=quiz.questions.length){

finishQuiz();

}else{

renderQuiz();

}

},700);

}

function finishQuiz(){

const percentage=
Math.round(
quiz.correct/quiz.questions.length*100
);

saveRecord({
type:quiz.type,
score:percentage,
correct:quiz.correct,
wrong:quiz.wrong,
date:new Date().toLocaleDateString("fa-IR")
});

document.getElementById("competitionHeader").innerHTML=
`<h2>🎉 آزمون تمام شد</h2>`;

document.getElementById("competitionBody").innerHTML=`

<div class="result">

تعداد صحیح: ${quiz.correct}<br>

تعداد غلط: ${quiz.wrong}<br><br>

نمره نهایی:<br>

<strong>${percentage}٪</strong>

</div>
`;

}

function startCompetition(type){

let bank=COMP_QUESTIONS[type];

if(!bank||bank.length<15){
toast("سؤالات این مسابقه موجود نیست.");
return;
}

let questions=shuffle(bank);

if(type==="مکالمه"){
questions=questions.slice(0,20);
}else{
questions=questions.slice(0,Math.min(20,questions.length));
}

quiz={
type:"مسابقه "+type,
questions:questions.map(q=>({
q:q[0],
a:q[1],
o:shuffle(q.slice(1))
})),
index:0,
correct:0,
wrong:0,
negative:true,
lesson:false
};

openQuiz();

}

/* =========================================================
   RECORDS
========================================================= */

function getRecords(){

try{
const r=JSON.parse(localStorage.getItem("ali_records")||"[]");
return Array.isArray(r)?r:[];
}catch{
return [];
}

}

function saveRecord(record){

const records=getRecords();

records.unshift({
...record,
name:student?.name||"زبان‌آموز",
phone:student?.phone||"",
timestamp:Date.now()
});

localStorage.setItem(
"ali_records",
JSON.stringify(records.slice(0,200))
);

}

function showRecords(){

document.getElementById("homePage").classList.add("hidden");
nav("navCompetition");

const records=getRecords();

let html=`

<div class="card">

<h2>📊 رکوردهای من</h2>

<button class="btn secondary" onclick="goHome()">بازگشت</button>

`;

if(!records.length){

html+=`<p>هنوز رکوردی ثبت نشده است.</p>`;

}else{

records.slice(0,30).forEach((r,i)=>{

html+=`

<div class="rank">

<span>
${i+1}. ${esc(r.type)}
<br>
<small>${esc(r.date||"")}</small>
</span>

<strong>${Number(r.score)||0}٪</strong>

</div>
`;

});

}

html+=`</div>`;

document.getElementById("studentContent").innerHTML=html;

}

function adminStudents(){

const records=getRecords();
const map={};

records.forEach(r=>{

if(!r.phone)return;

if(!map[r.phone]){
map[r.phone]={
phone:r.phone,
count:0,
best:0
};
}

map[r.phone].count++;
map[r.phone].best=
Math.max(map[r.phone].best,Number(r.score||0));

});

let html=`

<div class="card">

<h2>👨‍🎓 زبان‌آموزان</h2>

<button class="btn secondary" onclick="adminDashboard()">بازگشت</button>

<div class="tableWrap">

<table>

<tr>
<th>شماره تلفن</th>
<th>تعداد آزمون</th>
<th>بهترین نمره</th>
</tr>
`;

Object.values(map).forEach(s=>{

html+=`

<tr>
<td dir="ltr">${esc(s.phone)}</td>
<td>${s.count}</td>
<td>${s.best}٪</td>
</tr>
`;

});

if(!Object.keys(map).length){

html+=`
<tr>
<td colspan="3">هنوز اطلاعاتی ثبت نشده است.</td>
</tr>
`;

}

html+=`

</table>

</div>
</div>
`;

document.getElementById("adminContent").innerHTML=html;

}
