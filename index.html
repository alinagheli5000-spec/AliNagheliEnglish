<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>AliNagheli English</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#f5f3ff 0%,#ede9fe 100%);background-attachment:fixed;color:#171717;padding-bottom:96px;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;transition:all .2s ease}
button:active{transform:scale(.97)}
.header{background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 50%,#a855f7 100%);color:#fff;padding:16px;position:sticky;top:0;z-index:100;box-shadow:0 8px 32px rgba(109,40,217,.25);border-bottom:1px solid rgba(255,255,255,.1)}
.headerIn{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.logoSub{font-size:10px;opacity:.85;letter-spacing:2px;margin-top:2px}
.container{max-width:1100px;margin:auto;padding:18px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 4px 24px rgba(109,40,217,.06),0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(221,214,254,.5)}
.hero{background:linear-gradient(135deg,#312e81 0%,#6d28d9 50%,#a855f7 100%);color:#fff;border-radius:28px;padding:32px;margin-bottom:18px;box-shadow:0 20px 50px rgba(109,40,217,.35);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 60%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.1),transparent 50%);pointer-events:none}
.hero3d:before{width:200px;height:200px;left:-60px;top:-80px;border-radius:50%;background:rgba(255,255,255,.08);position:absolute;content:""}
.hero3d:after{width:280px;height:280px;right:-120px;bottom:-160px;border-radius:50%;background:rgba(255,255,255,.06);position:absolute;content:""}
.hero h1{margin:8px 0;font-size:34px;text-shadow:0 4px 16px rgba(0,0,0,.25);letter-spacing:.5px}
.hero h2{margin:6px 0;font-weight:600}
.hero p{opacity:.9;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.item{background:#fff;border:1px solid rgba(221,214,254,.6);border-radius:22px;padding:20px;transition:all .3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;cursor:pointer}
.item:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ede9fe,transparent);opacity:0;transition:opacity .3s;pointer-events:none}
.item:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(109,40,217,.18);border-color:#a78bfa}
.item:hover:before{opacity:.5}
.item>*{position:relative;z-index:1}
.icon{font-size:44px;filter:drop-shadow(0 4px 8px rgba(109,40,217,.2))}
.item h3{margin:10px 0 6px;font-size:16px}
.item .muted{margin:6px 0 12px}
.btn{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:bold;font-size:14px;box-shadow:0 4px 14px rgba(109,40,217,.35);transition:all .2s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(109,40,217,.45)}
.btn.full{width:100%}
.secondary{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#5b21b6;box-shadow:0 4px 14px rgba(167,139,250,.25)}
.success{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 14px rgba(34,197,94,.3)}
.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(239,68,68,.3)}
.warning{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 14px rgba(245,158,11,.3)}
.login{min-height:100vh;background:linear-gradient(135deg,#2e1065 0%,#6d28d9 50%,#a855f7 100%);display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}
.login:before,.login:after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%)}
.login:before{width:500px;height:500px;top:-200px;left:-200px}
.login:after{width:600px;height:600px;bottom:-300px;right:-300px}
.loginCard{background:rgba(255,255,255,.98);width:min(440px,100%);padding:32px;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.4);position:relative;z-index:1;animation:slideUp .5s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
label{display:block;margin:12px 0 6px;font-weight:bold;font-size:13px;color:#4c1d95}
input,select,textarea{width:100%;border:2px solid #ede9fe;border-radius:14px;padding:13px;background:#faf9ff;outline:none;font-size:14px;transition:all .2s ease}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#7c3aed;background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.1)}
.tabs{display:flex;gap:8px;margin:20px 0;background:#f3f4f6;padding:5px;border-radius:16px}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:transparent;font-weight:bold;color:#777;transition:all .25s ease}
.tab.active{background:#fff;color:#6d28d9;box-shadow:0 2px 10px rgba(109,40,217,.15)}
.bottom{position:fixed;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.96);border-top:1px solid rgba(221,214,254,.8);z-index:200;box-shadow:0 -8px 30px rgba(109,40,217,.08);padding-bottom:env(safe-area-inset-bottom)}
.bottomIn{max-width:700px;height:100%;margin:auto;display:flex;padding:6px 4px}
.nav{flex:1;border:0;background:transparent;padding:8px 2px;color:#999;font-size:11px;border-radius:16px;transition:all .2s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav b{font-size:22px;margin-bottom:2px;transition:transform .2s ease;filter:grayscale(.4)}
.nav:hover{background:#f5f3ff;color:#6d28d9}
.nav.active{color:#6d28d9;font-weight:bold;background:#ede9fe}
.nav.active b{transform:scale(1.1);filter:grayscale(0)}
.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lesson{background:linear-gradient(135deg,#faf9ff,#f5f3ff);border:1px solid rgba(221,214,254,.8);border-radius:20px;padding:20px;transition:all .25s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.lesson:hover{background:linear-gradient(135deg,#f5f3ff,#ede9fe);transform:translateY(-3px);box-shadow:0 12px 30px rgba(109,40,217,.15);border-color:#c4b5fd}
.lessonNo{font-size:34px;background:linear-gradient(135deg,#6d28d9,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;font-weight:bold}
.tabs2{display:flex;gap:8px;overflow:auto;margin-bottom:18px;padding-bottom:4px}
.tabs2::-webkit-scrollbar{display:none}
.tab2{padding:12px 18px;border:0;border-radius:14px;background:#f3f4f6;white-space:nowrap;font-weight:bold;color:#666;font-size:13px;transition:all .2s ease}
.tab2.active{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(109,40,217,.35)}
.sec{display:none;animation:fadeIn .3s ease}
.sec.active{display:block}
.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.word{border:1px solid rgba(221,214,254,.8);background:linear-gradient(135deg,#fff,#faf9ff);border-radius:18px;padding:16px;text-align:center;cursor:pointer;transition:all .25s ease}
.word:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 24px rgba(109,40,217,.15);border-color:#a78bfa;background:linear-gradient(135deg,#faf5ff,#ede9fe)}
.en{direction:ltr;color:#6d28d9;font-weight:bold;font-size:15px}
.fa{font-size:12px;color:#777;margin-top:6px}
.grammar{border:1px solid rgba(221,214,254,.8);background:linear-gradient(135deg,#faf9ff,#fff);padding:20px;border-radius:20px;margin-bottom:14px;line-height:2;box-shadow:0 2px 12px rgba(109,40,217,.04)}
.grammar h3{margin:0 0 10px;color:#5b21b6;font-size:16px;display:flex;align-items:center;gap:8px}
.grammar h3:before{content:"📘";font-size:18px}
.example{direction:ltr;text-align:left;background:linear-gradient(135deg,#ede9fe,#f5f3ff);border-radius:12px;padding:14px;font-family:'Courier New',Arial,sans-serif;border-right:4px solid #7c3aed;font-size:14px;color:#4c1d95;font-weight:bold;margin:10px 0}
.option{display:block;width:100%;text-align:right;background:#fff;border:2px solid #ede9fe;border-radius:16px;padding:16px;margin:9px 0;font-size:15px;font-weight:600;color:#374151;transition:all .2s ease}
.option:hover:not(:disabled){border-color:#a78bfa;background:#faf5ff;transform:translateX(-4px)}
.option.correct{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#22c55e;color:#166534}
.option.wrong{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#ef4444;color:#991b1b}
.feedback{text-align:center;border-radius:16px;padding:16px;margin-top:12px;font-weight:bold;font-size:15px}
.ok{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534}
.bad{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b}
.progress{height:10px;background:#ede9fe;border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#6d28d9,#a855f7,#ec4899);background-size:200% 100%;transition:width .4s ease;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
.score{font-size:64px;background:linear-gradient(135deg,#6d28d9,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:bold;text-align:center;line-height:1;margin:10px 0}
.adminRow{border:1px solid rgba(221,214,254,.6);border-radius:18px;padding:16px;margin:10px 0;background:#faf9ff}
.muted{font-size:12px;color:#888;line-height:1.9}
.teacher{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.teacherBox{background:linear-gradient(135deg,#faf5ff,#fff);border:1px solid rgba(233,213,255,.8);border-radius:26px;padding:24px;line-height:2}
.teacherAvatar{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#ede9fe,#ddd6fe);margin:auto;box-shadow:0 10px 30px rgba(109,40,217,.2);border:4px solid #fff}
.profileStat{background:linear-gradient(135deg,#faf9ff,#fff);border:1px solid rgba(233,213,255,.8);border-radius:20px;padding:18px;text-align:center}
.profileStat b{display:block;font-size:30px;background:linear-gradient(135deg,#6d28d9,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:6px}
.levelBar{height:14px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin:12px 0}
.levelBar i{display:block;height:100%;background:linear-gradient(90deg,#fff,#fbbf24,#f59e0b);background-size:200% 100%;transition:width .4s ease;animation:shimmer 2s linear infinite;box-shadow:0 0 12px rgba(251,191,36,.6)}
.badge{display:inline-block;padding:9px 14px;margin:5px;border-radius:22px;background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#5b21b6;font-size:12px;font-weight:bold}
.call{display:block;text-decoration:none;text-align:center;margin:14px 0;background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#fff!important;box-shadow:0 6px 20px rgba(34,197,94,.35)!important}
.request{background:linear-gradient(135deg,#f8f5ff,#faf9ff);border:1px solid rgba(221,214,254,.8);border-radius:22px;padding:18px;margin-top:18px}
.examRow{border:1px solid rgba(221,214,254,.6);border-radius:18px;padding:16px;margin:10px 0;background:linear-gradient(135deg,#faf9ff,#fff)}
.examScore{font-size:28px;font-weight:bold;background:linear-gradient(135deg,#6d28d9,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.resultBox{background:linear-gradient(135deg,#faf9ff,#f5f3ff);border:2px solid #ddd6fe;border-radius:24px;padding:24px}
.btnRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btnRow .btn{flex:1;min-width:90px;padding:11px 8px;font-size:12px;border-radius:12px}
.soundCard{background:linear-gradient(135deg,#fff,#faf9ff);border:1px solid rgba(221,214,254,.8);border-radius:18px;padding:16px;text-align:center;cursor:pointer;transition:all .25s ease}
.soundCard:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(109,40,217,.15);border-color:#a78bfa}
.soundLetter{font-size:32px;font-weight:bold;color:#6d28d9;direction:ltr}
.soundName{font-size:12px;color:#888;margin-top:4px;direction:ltr}
.soundEx{font-size:11px;color:#6d28d9;margin-top:6px;direction:ltr;font-weight:bold}
@media(min-width:900px){body{padding-bottom:24px}.bottom{top:auto;bottom:20px;left:50%;right:auto;transform:translateX(-50%);width:min(700px,calc(100% - 40px));height:74px;border-radius:22px;border:1px solid rgba(221,214,254,.8);box-shadow:0 12px 40px rgba(109,40,217,.2)}}
@media(max-width:600px){.container{padding:12px}.card{padding:18px;border-radius:20px}.hero{padding:24px;border-radius:24px}.hero h1{font-size:26px}.hero h2{font-size:17px}.icon{font-size:38px}.lessonGrid{grid-template-columns:1fr}.wordGrid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.score{font-size:52px}.loginCard{padding:24px}}
</style>
</head>

<script>
var words={};
var grammar={};

/* ==================== پایه هفتم ==================== */
grammar[0]=[
 ["Capital Letters","My name is Amirreza.","اسم من امیررضا است.","اول حرف جمله، اسم و فامیل باید بزرگ نوشته شود."],
 ["Mrs / Miss / Mr","Narges Ebrahimi / Amir Salehi","خانم نرگس ابراهیمی / آقای امیر صالحی","برای احترام: Mr برای آقایان، Miss برای خانم‌های مجرد، Mrs برای خانم‌های متأهل."],
 ["What (چه)","What's your name?","اسم تو چیست؟","برای پرسیدن نام افراد استفاده می‌شود."],
 ["How (چطور)","How are you?","حالت چطور است؟","برای احوالپرسی. همچنین در How do you spell this name? برای پرسیدن هجی کردن."]
];
grammar[1]=[
 ["Who (چه کسی)","Who is that man?","آن مرد کیست؟","برای پرسیدن در مورد اشخاص."],
 ["What / How","What's your sister's name? / How are you?","اسم خواهرت چیست؟ / حالت چطور است؟","What برای پرسیدن اسم، How برای احوالپرسی."],
 ["Contractions (مخفف‌ها)","I am = I'm / You are = You're / it is = it's / he is = he's / she is = she's","من هستم / تو هستی / آن است / او است / او است","برای سریع‌تر صحبت کردن استفاده می‌شود."],
 ["This / That","This is my friend Sina. / That is my classmate Sobhan.","این دوست من سینا است. / آن هم‌کلاسی من سبحان است.","This برای اشاره به نزدیک، That برای اشاره به دور."]
];
grammar[2]=[
 ["Capital Letters","My name is Amirreza.","اسم من امیررضا است.","اول حرف جمله و اسم بزرگ نوشته می‌شود."],
 ["When (چه وقتی)","When is your birthday?","تولدت کی است؟","برای پرسیدن زمان و تاریخ تولد."],
 ["On / In","on 13th Mehr / in Mehr","در سیزدهم مهر / در مهر","on برای روز، in برای ماه."],
 ["How old (چند سال)","How old are you? I am 13 years old.","چند سالته؟ من ۱۳ ساله هستم.","ساختار: فاعل + am/is/are + سن + years old"]
];
grammar[3]=[
 ["Possessive Adjectives","My / Your / His / Her / Its / Our / Their","مال من / مال تو / مال او(مذکر) / مال او(مؤنث) / مال آن / مال ما / مال آنها","صفت‌های ملکی قبل از اسم می‌آیند و مالکیت را نشان می‌دهند."],
 ["Possessive with 's","What's her uncle's name?","اسم عموی او چیست؟","با اضافه کردن 's به اسم، مالکیت نشان داده می‌شود."],
 ["What (شغل)","What's your aunt's job?","شغل خاله‌ات چیست؟","What در اینجا برای پرسیدن شغل استفاده می‌شود."],
 ["Yes/No Questions","Is that your father? Yes, he is. / No, he isn't.","آیا او پدرت است؟ بله / نه","با جابه‌جا کردن is/are سوالی می‌سازیم."]
];
grammar[4]=[
 ["Which one / Who","Who is Mr. Rafiei? / Which one is your mom?","آقای رفیعی کیست؟ / مادرت کدام یکی است؟","برای شناسایی افراد از روی ظاهر و لباس."],
 ["Wearing","She is wearing a red scarf.","او یک شال قرمز پوشیده است.","ساختار: am/is/are + wearing + لباس"],
 ["Yes/No with is/are","Is that your uncle? Yes / No","آیا او عمویت است؟ بله / نه","سوالی کردن با جابه‌جایی am/is/are."]
];
grammar[5]=[
 ["Present Continuous","My Dad is fixing the car.","پدرم در حال تعمیر ماشین است.","ساختار: am/is/are + فعل + ing برای کاری که همین الآن در جریان است."],
 ["Yes/No Question","Is your dad fixing the car? Yes, he is.","آیا پدرت در حال تعمیر ماشین است؟ بله.","برای سوالی کردن، am/is/are به اول جمله می‌آید."],
 ["What + doing","What is your Dad doing?","پدرت در حال انجام چه کاری است؟","برای پرسیدن از کار در حال انجام."],
 ["Where (کجا)","Where is your mom? She is in the kitchen.","مادرت کجاست؟ او در آشپزخانه است.","برای پرسیدن مکان."]
];
grammar[6]=[
 ["Going to (آینده)","I am going to visit my friend today.","من قصد دارم امروز دوستم را ببینم.","ساختار: am/is/are + going to + فعل برای بیان قصد و برنامه آینده."],
 ["Yes/No Question","Are you going to visit your friend today? Yes, I am.","آیا امروز قصد داری دوستت را ببینی؟ بله.","am/is/are به اول جمله می‌آید."],
 ["What time (چه ساعتی)","What time are you going to visit your friend?","چه ساعتی قصد داری دوستت را ببینی؟","برای پرسیدن ساعت."],
 ["What (آدرس/تلفن/ایمیل)","What's your address / phone number / email address?","آدرس / شماره تلفن / ایمیل شما چیست؟","What برای پرسیدن اطلاعات شخصی."],
 ["What time is it?","What time is it?","ساعت چند است؟","برای پرسیدن ساعت."]
];
grammar[7]=[
 ["What's your favorite...?","What's your favorite food / drink?","غذا / نوشیدنی مورد علاقه‌ات چیست؟","What + favorite برای پرسیدن مورد علاقه."],
 ["How about (چطور)","A: I am thirsty. B: How about some orange juice?","من تشنه‌ام. / با یک آب پرتقال چطور؟","برای پیشنهاد دادن استفاده می‌شود."],
 ["Let's (بیا)","Let's drink something.","بیا چیزی بنوشیم.","Let's = Let us برای پیشنهاد انجام کاری با هم."]
];

function getWordKey(grade,lessonNumber){
 if(grade===7) return lessonNumber-1;
 if(grade===8) return 8+lessonNumber;
 if(grade===9) return 15+lessonNumber;
 if(grade===10) return 21+lessonNumber;
 if(grade===11) return 25+lessonNumber;
 if(grade===12) return 28+lessonNumber;
 return null;
}
function getWords(grade,lessonNumber){
 const k=getWordKey(grade,lessonNumber);
 if(k===null)return [];
 return (words&&words[k])?words[k]:[];
}
function getGrammar(grade,lessonNumber){
 const k=getWordKey(grade,lessonNumber);
 if(k===null)return [];
 return (grammar&&grammar[k])?grammar[k]:[];
}

function calculateLevel(xp){return Math.max(1,Math.floor(Number(xp||0)/100)+1)}
function xpForLevel(level){return (level-1)*100}

async function loadStudentStats(){
 if(!S.student)return;
 S.xp=0;S.level=1;S.progress={};S.achievements=[];S.exams=[];
 try{const r=await db.from("student_xp").select("xp,level").eq("student_id",S.student.id).maybeSingle();if(r.data){S.xp=Number(r.data.xp||0);S.level=Number(r.data.level||calculateLevel(S.xp))}}catch(e){}
 try{const r=await db.from("student_progress").select("lesson_id,progress,completed").eq("student_id",S.student.id);(r.data||[]).forEach(x=>S.progress[x.lesson_id]={progress:Number(x.progress||0),completed:Boolean(x.completed)})}catch(e){}
 try{const r=await db.from("student_achievements").select("achievement_key,title").eq("student_id",S.student.id);S.achievements=r.data||[]}catch(e){}
 try{const r=await db.from("exam_results").select("*").eq("user_id",S.student.auth_user_id).order("created_at",{ascending:false});S.exams=r.data||[]}catch(e){}
}
async function addXP(amount){
 if(!S.student)return;
 const old=S.xp;S.xp+=Number(amount||0);S.level=calculateLevel(S.xp);
 try{await db.from("student_xp").upsert({student_id:S.student.id,xp:S.xp,level:S.level,updated_at:new Date().toISOString()},{onConflict:"student_id"})}catch(e){}
 if(S.level>calculateLevel(old))await unlockAchievement("level_"+S.level,"رسیدن به Level "+S.level);
}
async function unlockAchievement(key,title){
 if(!S.student||S.achievements.some(x=>x.achievement_key===key))return;
 try{const r=await db.from("student_achievements").insert({student_id:S.student.id,achievement_key:key,title});if(!r.error)S.achievements.push({achievement_key:key,title})}catch(e){}
}
async function saveProgress(lessonId,progress,completed){

}

function lessonTab(n){document.querySelectorAll(".sec").forEach((x,i)=>x.classList.toggle("active",i===n));document.querySelectorAll(".tab2").forEach((x,i)=>x.classList.toggle("active",i===n));if(n===2)startLessonQuiz();}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeLessonQuestions(){
 const gradeNum=S.grade;
 const no=S.lesson+1;
 const wl=getWords(gradeNum,no);
 const gl=getGrammar(gradeNum,no);
 const arr=[];
 wl.forEach(function(w,i){
  const pool=shuffle(wl.filter(function(_,j){return j!==i}).map(function(x){return x[1]})).slice(0,3);
  const opts=shuffle([w[1]].concat(pool));
  arr.push({q:'معنی «'+w[0]+'» چیست؟',options:opts,answer:opts.indexOf(w[1])});
 });
 gl.forEach(function(g){
  const wrongs=["She are a student.","They is happy.","He am a teacher.","I is a doctor.","We is here."];
  const opts=shuffle([g[1],...shuffle(wrongs).slice(0,3)]);
  arr.push({q:'کدام جمله با مبحث «'+g[0]+'» درست است؟',options:opts,answer:opts.indexOf(g[1])});
 });
 let allWords=[];
 for(let ln=1;ln<=(books[gradeNum]?books[gradeNum].lessons.length:0);ln++){
  getWords(gradeNum,ln).forEach(function(w){allWords.push(w)});
 }
 while(arr.length<12&&allWords.length>3){
  const w=allWords[Math.floor(Math.random()*allWords.length)];
  const pool=shuffle(allWords.filter(x=>x[1]!==w[1]).map(x=>x[1])).slice(0,3);
  if(pool.length<3)break;
  const opts=shuffle([w[1],...pool]);
  arr.push({q:'معنی «'+w[0]+'» چیست؟',options:opts,answer:opts.indexOf(w[1])});
 }
 return shuffle(arr).slice(0,15);
}

}

 quizRender("conversationQuiz");
}
function contest(){render("مسابقه",`<div class="card"><h2 style="margin-top:0">🏆 مسابقه</h2><p class="muted">پایه خود را انتخاب کن و رقابت رو شروع کن!</p><div class="grid">${[7,8,9,10,11,12].map(g=>`<div class="item"><div class="icon">🏆</div><h3>مسابقه پایه ${g}</h3><p class="muted">۲۰ سؤال</p><button class="btn full" onclick="startContest(${g})">شروع</button></div>`).join("")}</div></div>`)}
function startContest(g){
 const allWords=[];
 for(let ln=1;ln<=(books[g]?books[g].lessons.length:0);ln++){
  const list=getWords(g,ln);
  list.forEach(function(w){allWords.push(w)});
 }
 let q=[];
 allWords.forEach((w,j)=>{if(q.length>=20)return;const pool=shuffle(allWords.filter((_,k)=>k!==j).map(x=>x[1])).slice(0,3);const options=shuffle([w[1],...pool]);q.push({q:`معنی "${w[0]}" چیست؟`,options,answer:options.indexOf(w[1])})});
 while(q.length<20){const base=[{q:"Which sentence is correct?",a:"She is a student."},{q:"Which sentence is correct?",a:"They are happy."},{q:"Which sentence is correct?",a:"I am a teacher."},{q:"Which sentence is correct?",a:"He is my friend."}][q.length%4];const options=shuffle([base.a,"She are a student.","They is happy.","I is a teacher."]);q.push({q:base.q,options,answer:options.indexOf(base.a)})}
 S.quiz={type:"contest",title:"مسابقه پایه "+g,questions:q.slice(0,20),i:0,correct:0,wrong:0};
 render("مسابقه",`<div id="contestQuiz"></div>`);
 quizRender("contestQuiz");
}
const placementQuestions=[{q:"Choose the correct sentence.",o:["I am a student.","I is a student.","I are a student.","I be a student."],a:0},{q:"What is the meaning of 'book'?",o:["کتاب","مدرسه","معلم","دوست"],a:0},{q:"She ___ my friend.",o:["is","are","am","be"],a:0},{q:"They ___ students.",o:["are","is","am","be"],a:0},{q:"I ___ English every day.",o:["study","studies","studying","studied"],a:0},{q:"He ___ football every Friday.",o:["plays","play","playing","played"],a:0},{q:"___ old are you?",o:["How","What","Where","Who"],a:0},{q:"Where ___ you live?",o:["do","does","are","is"],a:0},{q:"She ___ two brothers.",o:["has","have","having","had"],a:0},{q:"There ___ a book on the table.",o:["is","are","am","be"],a:0},{q:"The book is ___ the table.",o:["on","at","to","from"],a:0},{q:"I can ___ English.",o:["speak","speaks","speaking","spoke"],a:0},{q:"Look! She ___.",o:["is running","runs","run","ran"],a:0},{q:"I ___ to school yesterday.",o:["went","go","goes","going"],a:0},{q:"We ___ dinner when he arrived.",o:["were having","have","had","are having"],a:0},{q:"She has ___ her homework.",o:["finished","finish","finishing","finishes"],a:0},{q:"This is the ___ book I have ever read.",o:["best","better","good","well"],a:0},{q:"If it rains, we ___ at home.",o:["will stay","stayed","stay yesterday","would stayed"],a:0},{q:"The letters ___ every morning.",o:["are delivered","delivers","delivered by","is deliver"],a:0},{q:"I have lived here ___ 2018.",o:["since","for","at","from"],a:0},{q:"If I had more time, I ___ another language.",o:["would learn","will learn","learned","would learned"],a:0},{q:"The man ___ lives next door is a doctor.",o:["who","where","when","what"],a:0},{q:"She said that she ___ tired.",o:["was","is","were","be"],a:0},{q:"By next year, I ___ this course.",o:["will have completed","complete","completed","am completing"],a:0},{q:"If they had studied harder, they ___ the exam.",o:["would have passed","will pass","would pass","passed"],a:0},{q:"The problem ___ yesterday.",o:["was discussed","discussed by","is discuss","has discuss"],a:0},{q:"He should ___ more carefully.",o:["listen","listens","listening","listened"],a:0},{q:"Never ___ such a beautiful place.",o:["have I seen","I have seen","did I saw","I saw"],a:0},{q:"If we had protected the forest, the air ___ cleaner now.",o:["would be","will be","would have been","is"],a:0},{q:"The technology, ___ was developed recently, saves energy.",o:["which","where","who","what"],a:0}];
function placementTest(){S.quiz={type:"placement",title:"آزمون تعیین سطح ۳۰ سؤالی",questions:placementQuestions.map(x=>{const options=shuffle(x.o);return {q:x.q,options,answer:options.indexOf(x.o[x.a])}}),i:0,correct:0,wrong:0};render("تعیین سطح",`<div id="placementQuiz"></div>`);quizRender("placementQuiz")}
async function placementFinish(){
 const score=S.quiz.correct;let level;
 if(score<=7)level="A1";else if(score<=13)level="A2";else if(score<=19)level="B1";else if(score<=24)level="B2";else if(score<=28)level="C1";else level="C2";
 const el=document.getElementById("placementQuiz");
 if(S.student){try{await db.from("exam_results").insert({user_id:S.student.auth_user_id,student_name:`${S.student.first_name||""} ${S.student.last_name||""}`,exam_type:"placement",exam_title:"آزمون تعیین سطح ۳۰ سؤالی",score,total:30,percentage:Math.round(score/30*100)})}catch(e){}}
 el.innerHTML=`<div class="card resultBox"><div class="score">${score}/30</div><h2 style="text-align:center">سطح پیشنهادی شما: ${level} 🎯</h2><p style="text-align:center;color:#666">این نتیجه بر اساس عملکرد شما در آزمون تعیین سطح به دست آمده است.</p><button class="btn full" onclick="home()">بازگشت به خانه</button></div>`;
}
async function placementAnswer(i){const q=S.quiz.questions[S.quiz.i];const opts=document.querySelectorAll(".option");opts.forEach(x=>x.disabled=true);if(i===q.answer){S.quiz.correct++;opts[i].classList.add("correct")}else{S.quiz.wrong++;opts[i].classList.add("wrong");opts[q.answer].classList.add("correct")}setTimeout(async()=>{S.quiz.i++;if(S.quiz.i>=S.quiz.questions.length)await placementFinish();else quizRender("placementQuiz")},650);}
async function profile(){
 await loadStudentStats();
 const completed=Object.values(S.progress).filter(x=>x.completed).length;
 const totalLessons=Object.keys(books).reduce((s,g)=>s+books[g].lessons.length,0);
 const overall=Math.round(completed/Math.max(totalLessons,1)*100);
 const exams=S.exams||[];
 render("پروفایل من",`<div class="card"><div style="text-align:center"><div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#ede9fe,#ddd6fe);display:flex;align-items:center;justify-content:center;font-size:44px;margin:auto;box-shadow:0 10px 30px rgba(109,40,217,.2);border:4px solid #fff">👤</div><h2 style="margin:14px 0 6px">${esc(S.student?.first_name||"")} ${esc(S.student?.last_name||"")}</h2><p class="muted">📱 ${esc(S.student?.phone||"")}<br>🎓 پایه ${esc(S.student?.level||"-")}</p></div></div><div class="grid"><div class="profileStat">⭐ XP<b>${S.xp}</b></div><div class="profileStat">🏅 Level<b>${S.level}</b></div><div class="profileStat">📚 تکمیل‌شده<b>${completed}</b></div><div class="profileStat">📊 پیشرفت<b>${overall}%</b></div></div><div class="card"><h3 style="margin-top:0">📈 پیشرفت درسی</h3><div class="levelBar"><i style="width:${overall}%"></i></div><h2 style="text-align:center;color:#6d28d9;margin:10px 0">${overall}%</h2><p class="muted">پیشرفت شما بر اساس درس‌هایی که مطالعه و تکمیل کرده‌اید محاسبه می‌شود.</p></div><div class="card"><h3 style="margin-top:0">📝 سوابق آزمون‌ها</h3>${exams.length?exams.map(e=>`<div class="examRow"><b>${esc(e.exam_title||e.exam_type||"آزمون")}</b><div class="muted">${e.created_at?new Date(e.created_at).toLocaleDateString("fa-IR"):""}</div><div class="examScore">${e.percentage??(e.total?Math.round(e.score/e.total*100):0)}٪</div><div class="muted">${e.score??"-"} از ${e.total??"-"} پاسخ درست</div></div>`).join(""):`<p class="muted">هنوز آزمونی ثبت نشده است.</p>`}</div><div class="card"><h3 style="margin-top:0">🏆 دستاوردها</h3>${S.achievements.length?S.achievements.map(a=>`<span class="badge">🏆 ${esc(a.title)}</span>`).join(""):`<p class="muted">هنوز دستاوردی کسب نکرده‌ای.</p>`}</div>`);
}
async function admin(){
 try{
  const r=await db.from("students").select("*").order("id",{ascending:false});
  if(r.error)throw r.error;
  const req=await db.from("teacher_requests").select("*").order("created_at",{ascending:false});
  renderAdmin(r.data||[],req.data||[]);
 }catch(e){document.body.innerHTML=`<div class="container"><div class="card"><h2>خطا در پنل مدیر</h2><p>${esc(e.message)}</p><button class="btn" onclick="admin()">تلاش مجدد</button></div></div>`}
}
function renderAdmin(students,requests){
 document.body.innerHTML=`${header("پنل مدیریت")}<main class="container"><div class="hero"><h2 style="margin-top:0">👨‍💼 پنل مدیریت</h2><p>مدیریت زبان‌آموزان و درخواست‌های کلاس</p></div><div class="grid"><div class="item"><div class="icon">👥</div><h3>کل</h3><b style="font-size:26px;color:#6d28d9">${students.length}</b></div><div class="item"><div class="icon">⏳</div><h3>در انتظار</h3><b style="font-size:26px;color:#f59e0b">${students.filter(x=>x.status==="waiting").length}</b></div><div class="item"><div class="icon">✅</div><h3>تأیید شده</h3><b style="font-size:26px;color:#22c55e">${students.filter(x=>["registered","approved"].includes(x.status)).length}</b></div><div class="item"><div class="icon">📅</div><h3>درخواست کلاس</h3><b style="font-size:26px;color:#6d28d9">${requests.filter(x=>x.status==="pending").length}</b></div></div><div class="card"><h3 style="margin-top:0">📅 درخواست‌های رزرو کلاس</h3>${requests.length?requests.map(x=>`<div class="adminRow"><b>${esc(x.student_name||"")}</b><div class="muted">📱 ${esc(x.student_phone||"")}<br>👨‍🏫 استاد: ${esc(x.teacher_name||"")}<br>📅 ${esc(x.requested_date||"")} ⏰ ${esc(x.requested_time||"")}<br>📘 ${esc(x.class_type||"")}<br>📝 ${esc(x.note||"")}</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${x.status==="pending"?`<button class="btn success" onclick="respondRequest('${x.id}','approved')">✅ تأیید</button><button class="btn danger" onclick="respondRequest('${x.id}','rejected')">❌ رد</button>`:`<b>${x.status==="approved"?"✅ تأیید شده":"❌ رد شده"}</b>`}</div></div>`).join(""):`<p class="muted">درخواستی وجود ندارد.</p>`}</div><div class="card"><h3 style="margin-top:0">👥 ثبت‌نام‌ها</h3>${students.length?students.map(x=>`<div class="adminRow"><b>${esc(x.first_name)} ${esc(x.last_name)}</b><div class="muted">📱 ${esc(x.phone||"")}<br>🎓 پایه: ${esc(x.level||"-")}<br>✉️ ${esc(x.login_email||"-")}</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${x.status==="waiting"?`<button class="btn success" onclick="approve('${x.id}')">✅ تأیید</button><button class="btn danger" onclick="rejectStudent('${x.id}')">❌ رد</button>`:x.status==="registered"||x.status==="approved"?`<span style="color:#22c55e;font-weight:bold">✅ تأیید شده</span><button class="btn danger" onclick="rejectStudent('${x.id}')">رد / حذف</button>`:`<span style="color:#ef4444;font-weight:bold">❌ رد شده</span><button class="btn success" onclick="approve('${x.id}')">تأیید مجدد</button>`}</div></div>`).join(""):`<p class="muted">ثبت‌نامی وجود ندارد.</p>`}</div><button class="btn secondary full" onclick="logout()">خروج</button></main>`;
}
async function respondRequest(id,status){try{const r=await db.from("teacher_requests").update({status}).eq("id",id);if(r.error)throw r.error;admin()}catch(e){alert("خطا:\n"+e.message)}}
async function approve(id){try{const r=await db.from("students").update({status:"registered"}).eq("id",id);if(r.error)throw r.error;admin()}catch(e){alert("خطا در تأیید:\n"+e.message)}}
async function rejectStudent(id){try{const r=await db.from("students").update({status:"rejected"}).eq("id",id);if(r.error)throw r.error;admin()}catch(e){alert("خطا:\n"+e.message)}}
async function logout(){try{await db.auth.signOut()}catch(e){}S={student:null,admin:false,grade:null,lesson:null,quiz:null,xp:0,level:1,progress:{},achievements:[],exams:[]};login()}
async function startup(){
 try{
  const r=await db.auth.getSession();
  const session=r.data?.session;
  if(!session){login();return}
  const user=session.user;
  if((user.email||"").toLowerCase()==="alinagheli@gmail.com"){S.admin=true;admin();return}
  const st=await db.from("students").select("*").eq("auth_user_id",user.id).maybeSingle();
  if(st.data&&["registered","approved"].includes(st.data.status)){S.student=st.data;await loadStudentStats();home();return}
  await db.auth.signOut();login();
 }catch(e){try{await db.auth.signOut()}catch(_){}login()}
}
db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT"&&!S.admin&&!S.student)login()});
startup();
</script>
